[project]
name = "bible-expert"
version = "1.0.0"
description = "Comprehensive Bible research MCP server with 12 tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

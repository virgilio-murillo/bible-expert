ean Himself as the Messiah , whose greatness in the Messianic kingdom is a matter of course) if He had merely said with regard to Himself: ὁ δὲ μικρότερος μείζων αὐτοῦ ἐστιν . [442] Therefore not: less than the others who participate in the kingdom , as it has been commonly understood of late (Winer, Buttmann, Bleek, Weizsäcker, Keim), according to which view the superlative sense is developed, as in [Matthew 18:1] ; [Luke 22:24] . So Bengel also: &ldquo;minimus in regno coelorum est minimus civium regni.&rdquo; Keim sarcastically observes that, according to the view I have given above, John &ldquo;would still occupy a subordinate place even in heaven,&rdquo; and I confess that I am at a loss to comprehend how one can understand ver. 11 in such a way as to exclude (so also Schenkel) the Baptist from the kingdom of heaven, in which, however, the patriarchs and prophets find a place. Where is the Baptist&rsquo;s place to be? Outside the kingdom is τὸ σκότος τὸ ἐξώτερον , [Matthew 8:12] . And outside the church, if this be understood (though erroneously) as what is meant by the kingdom, is the κόσμος of unbelievers. This also in answer to Weizsäcker, p. 411 f.; Weissenbach, p. 31 f.; Weiss."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:11] . Οὐκ ἐγήγερται , there has not arisen ) or there hath not been raised up as yet. The verb ἐγείρεσθαι , denotes an office conferred. ἐν γεννητοῖς γυναικῶν , among them that are born of women ) An expression of universal extent. Thus, ἐν γυναίξιν , among women , of the blessedness of Mary, [Luke 1:28] . μείζων , a greater , sc. prophet ) See [Luke 7:28] ; [Luke 1:15] , even if he be compared with Enoch, Moses, and Elias. τοῦ βαπτισοῦ , the Baptist ) He was already then distinguished by this surname, on account of the novelty and magnitude of the matter, not merely afterwards to distinguish him from John the apostle. ὁ δὲ μικρότερος , but the least ) The comparative with the article has the force of a superlative. As far as John excels every one, even the greatest of the ancient prophets, so far is John himself excelled by every one, even the least, in the kingdom of heaven, whether he be a preacher of Christ, or merely a citizen thereof. John himself was not yet in the kingdom of heaven, but he preceded it [as a herald]. [519] Jesus is not the least IN the kingdom of heaven, but is the King Himself; and He Himself is implied by the kingdom of heaven, which John announced. See [Matthew 11:10] ; [Matthew 11:3] , and ch. [Matthew 3:11] . And the less and the greater are here spoken of as they are, not in the opinion of men, but in reality, in the knowledge of the revealed Christ. See [1 Peter 1:12] . The idea of external appearance, in [Matthew 11:6] , does not come in here. Jesus was despised and unknown amongst men, but He was not the least, as far as the kingdom of heaven was concerned; all the citizens of the kingdom of heaven already acknowledged Him as their King. Cf. the phrase in ch. v. 19. He is never called less than John, nor least in the kingdom of heaven. The least in the kingdom of heaven, is the least of the citizens of the kingdom. In that THIRD point [520] in which John is greater than others, the least in the kingdom of heaven is less than the other citizens of the kingdom of heaven. John did not yet know all, which at present even catechumens know from the Apostles&rsquo; Creed. A noble climax prophet, John, apostle or Christian. It is greater, in this kind of comparison of the Old and New Testament, to know things present than things future, however brief be the interval which separates them from the present; [521] but in another point of view, the knowledge of futurity is an especial distinction conferred by GOD. [519] Even at that time the Apostles themselves already were superior to John in their baptizing and teaching, [John 4:2] ; [Matthew 10:7] , etc. Harm. , p. 299), at the end. [520] Beng. seems to me to use Tertium here in the logical sense of the intermediate term, affording a point of comparison between the other two: as here John stands midway between the Old Test. covenant and its prophets, on the one hand, and the N. Test. kingdom, and its preachers and members, on the other. ED. [521] In the original, &ldquo;scire præsentia quam futura, quamvis proxime futura;&rdquo; lit. &ldquo; to know present than future [things], although most closely future &rdquo; i.e. &ldquo; to know the things that are, than those that are to be hereafter , however close that hereafter may be to the present.&rdquo; (I. B.)"}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "He that is but little ( ο μικροτερος ). The Authorized Version here has it better, \"he that is least.\" The article with the comparative is a growing idiom in the vernacular Koine for the superlative as in the modern Greek it is the only idiom for the superlative (Robertson, Grammar of the Greek N.T., p. 668). The papyri and inscriptions show the same construction. The paradox of Jesus has puzzled many. He surely means that John is greater ( μειζων ) than all others in character, but that the least in the kingdom of heaven surpasses him in privilege. John is the end of one age, \"until John\" ([Matthew 11:14]), and the beginning of the new era. All those that come after John stand upon his shoulders. John is the mountain peak between the old and the new."}], "12": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:12] . The statement just commented on had to be made in the interests of truth and the Kingdom of God, but having made it Jesus reverts with pleasure to a tone of eulogy. This verse has created much diversity of opinion, which it would take long to recount. I find in it two thoughts: one expressed, the other implied. (1) There has been a powerful movement since John&rsquo;s time towards the Kingdom of God. (2) The movement derived its initial impetus from John. The latter thought is latent in ἀπὸ δὲ τῶν ἡμ . Ιωάν . The movement dates from John; he has the credit of starting it. This thought is essential to the connection. It is the ultimate justification of the περισσότερον ([Matthew 11:9] ). The apostle Paul adduced as one argument for his apostleship, called in question by Judaists, success , which in his view was not an accident but God-given, and due to fitness for the work ([2 Corinthians 2:14] ; [2 Corinthians 3:1-18] ). So Christ here in effect proves John&rsquo;s fitness for the position of forerunner by the success of his ministry. He had actually made the kingdom come. That was the true basis of his title to the honourable appellation, &ldquo;preparer of the way&rdquo;; without that it had been an empty title, though based on any number of prophecies. That success proved fitness, adequate endowment with moral force, and power to impress and move men. This being seen to be Christ&rsquo;s meaning, there is no room for doubt as to the animus of the words βιάζεται , βιασταὶ . They contain a favourable, benignant estimate of the movement going on not an unfavourable, as, among others, Weiss thinks, taking the words to point to a premature attempt to bring in the kingdom by a false way as a political creation (Weiss-Meyer). Of course there were many defects, obvious, glaring, in the movement, as there always are. Jesus knew them well, but He was not in the mood just then to remark on them, but rather, taking a broad, generous view, to point to the movement as a whole as convincing proof of John&rsquo;s moral force and high prophetic endowment. The two words βιαζ ., βιασ . signalise the vigour of the movement. The kingdom was being seized, captured by a storming party. The verb might be middle voice, and is so taken by Beng., &ldquo;sese vi quasi obtrudit,&rdquo; true to fact, but the passive is demanded by the noun following. The kingdom is forcefully taken ( βιαίως κρατεῖται , Hesychius) by the βιασταὶ . There is probably a tacit reference to the kind of people who were storming the kingdom, from the point of view, not so much of Jesus, as of those who deemed themselves the rightful citizens of the kingdom. &ldquo;Publicans and sinners&rdquo; ([Matthew 9:9-12] ), the ignorant ([Matthew 11:25] ). What a rabble! thought Scribes and Pharisees. Cause of profound satisfaction to Jesus ([Matthew 11:25] )."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "12. ] The sense of this verse has been much disputed. (1) βιάζεται has been taken in a middle sense; &lsquo;forcibly introduces itself,&rsquo; &lsquo;breaks in with violence ,&rsquo; as in the similar passage [Luke 16:16] , πᾶς εἰς αὐτὴν βιάζεται . Certainly such a sense agrees better with εὐαγγελίζεται , which we find in Luke, than the passive explanation of βιάζεται : but it seems inconsistent with the latter half of the verse to say that it breaks in by force , and then that others break by force into it . (2) βιάζεται is taken passively; so πόλεις … τὰς βεβιασμένας , Xen. Hell. 11:2. 15 (Meyer; which is however, like many of his citations, incorrect): &lsquo; suffereth violence ,&rsquo; E. V. And thus the construction of the verse is consistent: &lsquo;and the violent take it by force.&rsquo; Believing this latter interpretation to be right, we now come to the question, in what sense are these words spoken? Is βιάζεται in a good or a bad sense? Does it mean, &lsquo; is taken by force ,&rsquo; and the following, &lsquo; and men violently press in for their share of it, as for plunder; &rsquo; or does it mean, &lsquo; is violently resisted, and violent men (viz. its opponents, the Scribes and Pharisees) tear it to pieces? &rsquo; This latter meaning bears no sense as connected with the discourse before us. The subject is not the resistance made to the kingdom of heaven, but the difference between a prophesied and a present kingdom of heaven. The fifteenth verse closes this subject, and the complaints of the arbitrary prejudices of &lsquo;this generation&rsquo; begin with [Matthew 11:16] . We conclude then that these words imply From the days of John the Baptist until now (i.e. inclusively, from the beginning of his preaching), the kingdom of heaven is pressed into, and violent persons eager, ardent multitudes seize on it. Of the truth of this, notwithstanding our Lord&rsquo;s subsequent reproaches for unbelief, we have abundant proof from the multitudes who followed, and outwent Him, and thronged the doors where He was, and would ( Joh 6:15 ) take Him by force (the very word ἁρπάζω being used) to make Him a king. But our Lord does not mention this so much to commend the βιασταί , as to shew the undoubted fact that ὁ ἐρχόμενος was come: that the kingdom of heaven, which before had been the subject of distant prophecy, a closed fortress, a treasure hid, was now undoubtedly upon earth ( Luk 17:21 and note), laid open to the entrance of men, spread out that all might take. Thus this verse connects with [Matthew 11:28] , δεῦτε πρός με πάντες , and with [Luke 16:16] , πᾶς εἰς αὐτὴν βιάζεται . Compare also with this throwing open of the kingdom of heaven for all to press into, the stern prohibition in [Exodus 19:12-13] , and the comment on it in [Hebrews 12:18-24] ."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 11:12] . After the remark in passing that ὁ δὲ μικρότερος , etc., Jesus now continues His testimony regarding John, and, in order to prove what He had just said of him in [Matthew 11:10-11] , He calls attention to the powerful movement in favour of the Messiah&rsquo;s kingdom which had taken place since the commencement of the Baptist&rsquo;s ministry . ἀπὸ τῶν ἡμερ . Ἰωάνν .] This is not the language of one belonging to a later period, but only such as Jesus could have used at this juncture; for the days when John laboured and flourished were gone by! This in answer to Gfrörer, heil. Sage , II. p. 92, and Hilgenfeld. βιάζεται ] Hesychius: βιαίως κρατεῖται it is taken possession of by force, is conquered (not magna vi praedicatur , according to the idea imported into the words by Loesner and Fritzsche); Xen. H. G . v. 2. 15 : πόλεις … τὰς βεβιασμένας ; Thuc. iv. 10. 5 : βιάζοιτο , it would be forced; Dem. 84. 24; Zosimus, v. 29; 2Ma 14:41 ; Elwert, Quaestion. ad philol. sacr. N. T ., 1860, p. 19, who, however, would take the present indicative as meaning vult expugnari , which is not required by the context. In this way is described that eager, irresistible striving and struggling after the approaching Messianic kingdom (Chrysostom: πάντες οἱ μετὰ σπουδῆς προσιόντες ) which has prevailed since the Baptist began to preach; it is as though it were being taken by storm . Comp. the neuter usage in [Luke 16:16] : πᾶς εἰς αὐτὴν βιάζεται ; and further, Xen. Cyr . iii. 3. 69: βιάσαιντο εἴσω ; likewise Thuc. i. 63, vii. 69; Ael. V. H . xiii. 32; Herodian, vii. 10. 13; Polyb. i. 74. 5, ii. 67. 2, iv. 71. 5. If others have adopted the idea of a hostile violence with which the Messianic kingdom is persecuted (Lightfoot, Schneckenburger, Beitr . p. 49), or violently (Hilgenfeld) crushed and arrested (by the Pharisees and scribes), their view is partly an anachronism, and partly forbidden by the connection with [Matthew 11:13] and with what goes before. Finally, to take the verb in a middle sense , and as describing the breaking in of the kingdom which makes its way in spite of all resistance (Melanchthon, Bengel, Baur, Zyro in the Stud. u. Krit . 1860, p. 401), is certainly not contrary to usage (Dem. 779. 2; Lucian, Herm . 70), but inconsistent with the context in which βιασταί follows. καὶ βιασταὶ ἁρπάζουσιν αὐτήν ] and those who use violent efforts drag it to themselves . The anarthrous βιασταί is not intended to be emphatic; such is now the character of the times, that those of whom the βιάζεται holds true achieve a speedy success , in that, while they press forward to join the ranks of my followers, they clutch at the approaching kingdom as though they were seizing spoils, and make it their own. So eager and energetic (no longer calm and expectant) is the interest in regard to the kingdom. The βιασταί are, accordingly, believers struggling hard for its possession. Jesus Himself (this in answer to Zyro) cannot be included among those who are here in view. Those who interpret βιάζεται in a hostile sense, render ἁρπάζουσιν : they snatch it away from men (according to Schneckenburger, they bar the way to it), in allusion to the conduct of the scribes and Pharisees. For βιαστής , comp. Pind. Ol . ix. 114; Pyth . i. 18. 82, iv. 420, vi. 28; Nem . ix. 122; Duncan, Lex ., ed. Rost, p. 209. In Pindar also it is always used in a good sense. For ἁρπάζ ., comp. Xen. Anab . iv. 6. 11, vi. 5. 18; Herodian, ii. 6. 10, ii. 3. 23."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:12] . Δὲ , but ) Used antithetically in this sense viz., although John is less than the least in the kingdom of heaven, yet even from the beginning of the days of John the Baptist, the kingdom of heaven exercises force. The kingdom of heaven came not in John, but immediately after John. βιάζεται , pushes itself forward as it were by violence ) Consider attentively ch. [Matthew 13:32-33] , and [Luke 14:23] . The LXX. frequently use βιάζομαι , to signify, to employ force . John calls in a mournful, Jesus in a joyful strain. [522] And there is a metonymy of kingdom for King, i.e. the Messiah. See Gnomon on ch. [Matthew 4:17] . βιασταὶ , they who employ force ) See [Luke 13:24] . There is no complaint here of hostile force, for the complaint begins at [Matthew 11:16] . βιάζεται and ΒΙΑΣΤΑῚ are correlative. [523] ἉΡΠΆΖΟΥΣΙΝ , seize ) in order that by seizing it with swift force, all obstacles having been broken through, they may obtain the blessing which is offered them. [524] See [Luke 7:29] . [522] In the original, &ldquo;Johannes lamentatur; Jesus canit,&rdquo; lit. &ldquo;John laments; Jesus sings.&rdquo; (I. B.) [523] It is in this way that the work goes on briskly, and advances as successfully as one could wish. V. g. [524] Just as happens in the case of wares exposed for sale in public. V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Suffereth violence ( βιαζετα ). This verb occurs only here and in [Luke 16:16] in the N.T. It seems to be middle in Luke and Deissmann (Bible Studies, p. 258) quotes an inscription \"where βιαζομα is without doubt reflexive and absolute\" as in [Luke 16:16]. But there are numerous papyri examples where it is passive (Moulton and Milligan, Vocabulary, etc.) so that \"there seems little that promises decisive help for the difficult Logion of [Matthew 11:12]; [Luke 16:16].\" So then in [Matthew 11:12] the form can be either middle or passive and either makes sense, though a different sense. The passive idea is that the kingdom is forced, is stormed, is taken by men of violence like \"men of violence take it by force\" ( βιαστα αρπαζουσιν αυτην ) or seize it like a conquered city. The middle voice may mean \"experiences violence\" or \"forces its way\" like a rushing mighty wind (so Zahn holds). These difficult words of Jesus mean that the preaching of John \"had led to a violent and impetuous thronging to gather round Jesus and his disciples\" (Hort, Judaistic Christianity, p. 26)."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Suffereth violence [ βιαζεται] . Lit., is forced, overpowered, taken by storm. Christ thus graphically portrays the intense excitement which followed John's ministry; the eager waiting, striving, and struggling of the multitude for the promised king. The violent take it by force [ βιασται αρπαζουσιν αυτην] . This was proved by the multitudes who followed Christ and thronged the doors where he was, and would have taken him by force (the same word) and made him a king ([John 6:15]). The word take by force means literally to snatch away, carry off. It is often used in the classics of plundering. Meyer renders, Those who use violent efforts, drag it to themselves. So Tynd., They that make violence pull it into them. Christ speaks of believers. They seize upon the kingdom and make it their own. The Rev., men of violence, is too strong, since it describes a class of habitually and characteristically violent men; whereas the violence in this case is the result of a special and exceptional impulse. The passage recalls the old Greek proverb quoted by Plato against the Sophists, who had corrupted the Athenian youth by promising the easy attainment of wisdom : Good things are hard. Dante has seized the idea : Regnum coelorum (the kingdom of heaven) suffereth violence From fervent love, and from that living hope That overcometh the divine volition; Not in the guise that man o'ercometh man, But conquers it because it will be conquered, And conquered, conquers by benignity. \" Parad., 20, 94 - 99."}], "13": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:13] . he thought here is hinted rather than fully expressed. It has been suggested that the sense would become clearer if [Matthew 11:12-13] were made to change places (Maldonatus). This inversion might be justified by reference to [Luke 16:16] , where the two thoughts are given in the inverse order. Wendt (L. J., i. 75) on this and other grounds arranges the [Matthew 11:13-14] ; [Matthew 11:12] . But even as they stand the words can be made to yield a fitting sense, harmonising with the general aim, the eulogy of John. The surface idea is that the whole O. T., prophets of course, and even the law in its predictive aspects (by symbolic rites and foreshadowing institutions) pointed forward to a Kingdom of God. The kingdom coming the burden of O. T. revelation. But what then? To what end make this observation? To explain the impatience of the stormers: their determination to have at last by all means, and in some form, what had so long been foretold? (Weiss). No; but to define by contrast John&rsquo;s position. Observe ἕως l. goes not with the subject, but with the verb Prophets (and even law) till John prophesied . The suggestion is that he is not a mere continuator of the prophetic line, one more repeating the message: the kingdom will come . His function is peculiar and exceptional. What is it? [Matthew 11:14] explains. He is the Elijah of Malachi, herald of the Great Day, usherer in of the kingdom, the man who says not merely &ldquo;the kingdom will come,&rdquo; but &ldquo;the kingdom is here&rdquo;; says it, and makes good the saying, bringing about a great movement of repentance. εἰ θέλετε δέξασθαι : the identification of John with Elijah to be taken cum grano , not as a prosaic statement of fact. Here, as always, Christ idealises, seizes the essential truth. John was all the Elijah that would ever come, worthy to represent him in spirit, and performing the function assigned to Elijah redivivus in prophecy. Some of the Fathers distinguished two advents of Elijah, one in spirit in the Baptist, another literally at the second coming of Christ. Servile exegesis of the letter. δέξασθαι has no expressed object: the object is the statement following. Lutteroth supplies &ldquo;him&rdquo; = the Baptist. In the θέλετε Weiss finds a tacit allusion to the impenitence of the people: Ye are not willing because ye know that Elijah&rsquo;s coming means a summons to repentance."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:13] . Γὰρ , for ) Now is fulfilled that which had been predicted up to the time of John. προφῆται νόμος Ἰωάννου , prophets law John ) Cf. [Malachi 1:1] , [Malachi 1:3] :22, 23; and see Gnomon on [Matthew 3:12] . There were prophets also before Moses; and the law being put in the second place, makes a regular gradation; for Moses was the greatest of the prophets of the Old Testament. The law also is mentioned in this passage on account of its prophetic office. Where the Old Testament concludes at the end of Malachi, there the New Testament commences at the beginning of Mark. This phrase, therefore, even until John , holds good of Scripture. Its application extends also beyond Malachi, even to the father of John. Sec [Luke 1:67] . Even until , without change. Here was the boundary of prophecy and of the Old Testament dispensation; thenceforward is the fulfilling. προεφήτευσαν , prophesied ) This was the whole of their office, to bear witness to future things. John was something more. See [Matthew 11:9] ."}], "14": [{"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:14] . Εἰ θέλετε , if ye will ) It is your interest that is at stake. The expression, βιασταὶ (used in the last verse), is explained: it is the willing only who are compelled. All is prepared: it only remains that you should be willing. Ἡλίας , Elias ) The absence of the article shows that the word is used antonomatically . [525] John makes ΒΙΑΣΤΑῚ of both fathers and children . Cf. δε , but , in v. 16. [526] The prophecy of the Old Testament concludes with this Elijah at the end of Malachi. John is called Elias on account of the office of forerunner, which he had in common with the Tishbite. ὁ μέλλων ἔρχεσθαι , who is about to come ) The language is, as it were, that of one looking forward from the Old Testament into the New. [527] [525] See Append. Antonomasia here applies the name Elias to John, not literally, but analogously; as Elias was in the O. Test., so John in preparing for the coming N. Test. kingdom. ED. [526] i.e. John I have likened to Elijah; but to whom shall I liken this generation? ED. [527] Moreover John is not called absolutely ὁ μέλλων ἔρχεσθαι , but Ἥλιας ὁ μέλλων ἔρχεσθαι . V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "This is Elijah ( αυτος εστιν Ελειας ). Jesus here endorses John as the promise of Malachi. The people understood [Malachi 4:1] to mean the return of Elijah in person. This John denied as to himself ([John 1:21]). But Jesus affirms that John is the Elijah of promise who has come already ([Matthew 17:12]). He emphasizes the point: \"He that hath ears to hear, let him hear.\""}, {"src": "vws", "name": "Vincent's Word Studies", "text": "If ye will [ ειθελετε] . More correctly, Rev., If ye are willing or disposed. For there would naturally be an unwillingness to receive the statement about John's high place, in view of John's imprisonment."}], "15": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:15] . proverbial form of speech often used by Jesus after important utterances, here for the first time in Matt. The truth demanding attentive and intelligent ears (ears worth having; taking in the words and their import ) is that John is Elijah. It implies much that the kingdom is here and the king, and that the kingdom is moral not political."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "15. ] These words are generally used by our Lord when there is a further and deeper meaning in His words than is expressed: as here &lsquo;if John the Baptist is Elias, and Elias is the forerunner of the coming of the Lord, then know surely that the Lord is come.&rsquo;"}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 11:15] . A request to give due attention to this important statement in [Matthew 11:14] . Comp. [Matthew 13:9] ; [Mark 4:9] ; [Luke 8:8] ; [Ezekiel 3:27] ; Hom. Il . xv. 129."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:15] . Ὦτα ἀκούειν , ears to hear ) Thus the LXX. in [Deuteronomy 29:4] ; cf. [Romans 11:8] . &ldquo; He that hath ears to hear, let him hear ,&rdquo; was a form of commanding attention peculiar to our Lord, and indicates, that the other things which might be said more expressly, are contained in those which have just been uttered."}], "16": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:16] . τίνι ὁμοιώσω : the parable is introduced by a question, as if the thought had just struck Him. τὴν γενεὰν ταύτην . The occasion on which the words following were spoken would make it clear who were referred to. Our guide must be the words themselves. The subjects of remark are not the βιασταὶ of [Matthew 11:12] , nor the ὄχλοι to whom Jesus had been speaking. Neither are they the whole generation of Jews then living, including Jesus and John (Elsner); or even the bulk of the Jewish people, contemporaries of Jesus. It was not Christ&rsquo;s habit to make severe animadversions on the &ldquo;people of the land,&rdquo; who formed the large majority of the population. He always spoke of them with sympathy and pity ([Matthew 9:37] , [Matthew 10:6] ). γενεά might mean the whole body of men then living, but it might also mean a particular class of men marked out by certain definite characteristics. It is so used in [Matthew 12:39] ; [Matthew 12:41-42] ; [Matthew 12:45] ; [Matthew 16:4] . The class or &ldquo;race&rdquo; there spoken of is in one case the Scribes and Pharisees, and in the other the Pharisees and Sadducees. From internal evidence the reference here also is mainly to the Pharisees. It is a class who spoke of Jesus as reported in [Matthew 11:19] . Who can they have been but the men who asked: Why does He eat with publicans and sinners ([Matthew 9:11] )? These vile calumnies are what have come out of that feast, in the same sanctimonious circle. Luke evidently understood the Pharisees and lawyers ( νομικοὶ ) to be the class referred to, guided probably by his own impression as to the import of the passage ( vide [Luke 7:30] ). παιδίοις … ἀγοραῖς : Jesus likens the Pharisaic γενεά to children in the market-place playing at marriages and funerals, as He had doubtless often seen them in Nazareth. The play, as is apt to happen, has ended in a quarrel. προσφ . τοῖς ἑτέροις … λέγουσιν . There are two parties, the musicians and the rest who are expected to dance or mourn according to the tune, and they are at cross purposes, the moods not agreeing: ἑτέροις , the best attested reading, may point to this discrepancy in temper = a set differently inclined. ηὐλήσαμεν : the flute in this case used for merriment, not, as in [Matthew 9:23] , to express grief. ἐθρηνήσαμεν : we have expressed grief by singing funeral dirges, like the mourning women hired for the purpose ( vide ad [Matthew 9:23] ). ἐκόψασθε : and ye have not beat your breasts in responsive sorrow. This is the parable to which Jesus adds a commentary. Without the aid of the latter the general import is plain. The γενεά animadverted on are like children, not in a good but in a bad sense: not child-like but childish. They play at religion; with all their seeming earnestness in reality triflers. They are also fickle, fastidious, given to peevish fault-finding, easily offended. These are recognisable features of the Pharisees. They were great zealots and precisians, yet not in earnest, rather haters of earnestness, as seen in different ways in John and Jesus. They were hard to please: equally dissatisfied with John and with Jesus; satisfied with nothing but their own artificial formalism. They were the only men in Israel of whom these things could be said with emphasis, and it may be taken for granted that Christ&rsquo;s animadversions were elicited by pronounced instances of the type."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "16. δέ ] Implying &lsquo;the men of this generation have ears, and hear not; will not receive this saying; are arbitrary, childish, and prejudiced, not knowing their own mind.&rsquo; τίνι ὁμοιώσω ; ] See similar questions in [Mark 4:30] ; [Luke 13:18] ; [Luke 13:20] ; and note on ch. [Matthew 7:24] . ὁμοία ἐστὶν παιδίοις : as children in their games imitate the business and realities of life, so these in the great realities now before them shew all the waywardness of children. The similitude is to two bodies of children, the one inviting the other to play, first at the imitation of a wedding, secondly at that of a funeral; to neither of which will the others respond. Stier remarks that the great condescension of the preaching of the Gospel is shewn forth in this parable, where the man sent from God, and the eternal Word Himself, are represented as children among children, speaking the language of their sports. Compare [Hebrews 2:14] . It must not be supposed that the two bodies of children are two divisions of the Jews, as some (e.g. Olsh.) have done: the children who call are the Jews , those called to , the two Preachers; both belonging, according to the flesh, to ἡ γενεὰ αὕτη , but neither of them corresponding to the kind of mourning (in John&rsquo;s case) with which the Jews would have them mourn, or the kind of joy (in the Lord&rsquo;s case) with which the Jews would have them rejoice. The converse application, which is commonly made, is against the ὁμοία ἐστὶν παιδίοις , by which the first παιδία must be the children of this generation; and nothing can be more perplexed than to render ὁμοία ἐστίν &lsquo; may be illustrated by ,&rsquo; and invert the persons in the parable. Besides which, this interpretation would lay the waywardness to the charge of the Preachers , not to that of the Jews."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 11:16] ff. After this high testimony respecting the Baptist , we have now a painful charge against the men of his time , whom, in fact, neither John nor Himself is able to satisfy. In expressive, appropriate, and certainly original terms (in answer to Hilgenfeld), He compares the existing generation to children reproaching their playfellows for not being inclined to chime in either with their merry or their lugubrious strains. Usually the Jews are supposed to be represented by those refractory playmates, so that Jesus and John have necessarily to be understood as corresponding to the children who play the cheerful music, and who mourn (Fritzsche, Oppenrieder, Köster in the Stud. u. Krit . 1862, p. 346 f.). But (1) the words expressly intimate that the children with their music and lamentation represented the γενεά , to which John and Jesus stand opposed , so that the latter must therefore correspond to the ἑτέροις who are reproached by the παιδία . (2) If the arrangement of the passage is not to be arbitrarily disturbed, the thrice repeated λέγουσιν must be held to prove that, since those who speak in [Matthew 11:18-19] are Jews , it is to these also that the children correspond who are introduced as speaking in [Matthew 11:16] . (3) If we were to suppose that Jesus and John were represented by those children, then, according to [Matthew 11:18-19] , it would be necessary to reverse the order of the words in [Matthew 11:17] , so as to run thus: ἐθρηνήσαμεν ὑμῖν … ηὐλήσαμεν , etc. Consequently the ordinary explanation of the illustration is wrong. The correct interpretation is this: the παιδία are the Jews; the ἕτεροι are John and Jesus; first came John, who was far too rigid an ascetic to suit the tastes of the free-living Jews ([John 5:35] ); then came Jesus, and He, again, did not come up to their ascetic and hierarchical standard, and was too lax, in their opinion. The former did not dance to their music; the latter did not respond to their lamentation (similarly de Wette with a slight deviation, Ewald, Bleek, Keim). παιδίοις , κ . τ . λ .] The allusion is to children who in their play (according to Ewald, it was playing at a riddle ) imitate the way in which grown-up people give expression to their joy and their sorrow; Rosenmüller, Morgenl. in loco . The flute was played at weddings and dancings. ἐκόψασθε ] beating upon the breast was the ordinary indication of grief; [Ezekiel 20:43] ; [Nahum 2:8] ; [Matthew 24:30] ; [Luke 18:13] ; Hom. Il . xviii. 31; Plat. Phaed . p. 60 A, al .; Herod. vi. 58; Diod. Sic. i. 44; Köster, Erläut . p. 92 f. τοῖς ἑπέροις ] the other children present, who are not among the number of their playmates."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:16] . Τὴν γενεὰν ταύτην , this generation ) the evil men of this best [528] time. ΠΑΙΔΑΡΊΟΙς , [529] children ) Jesus compared not only the Jews, but also Himself and John, in different ways, to children, with a condescension, in His own case, most wonderful. ἀγοραῖς , market-places ) A large city has often many market-places. The preaching of John and Jesus was public. [528] &ldquo;Hujus optimi temporis&rdquo; so called because it was that of our Lord&rsquo;s Ministry (I. B.) [529] The margin of both Editions, as also the Germ. Vers., seem to prefer παιδίοις . E. B. So BCDZ. The παιδαρίοις of Rec. Text is not supported by the primary authorities. ED."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Children [ παιδιοις] . Diminutive, little children. The Rev. Donald Fraser gives the picture simply and vividly : \"He pictured a group of little children playing at make - believe marriages and funerals. First they acted a marriage procession; some of them piping as on instruments of music, while the rest were expected to leap and dance. In a perverse mood, however, these last did not respond, but stood still and looked discontented. So the little pipers changed their game and proposed a funeral. They began to imitate the loud wailing of eastern mourners. But again they were thwarted, for their companions refused to chime in with the mournful cry and to beat their breasts.... So the disappointed children complained : 'We piped unto you and ye did not dance; we wailed, and ye did not mourn. Nothing pleases you. If you don't want to dance, why don't you mourn ?... It is plain that you are in bad humor, and determined not to be pleased'\" (\" Metaphors in the Gospels \"). The issue is between the Jews (this generation) and the children of wisdom, [Matthew 5:9]. Market - places [ αγοραις] . From ajgeirw, to assemble. Wyc., renders cheepynge; compare cheapside, the place for buying and selling; for the word cheap had originally no reference to small price, but meant simply barter or price. The primary conception in the Greek word has nothing to do with buying and selling. Agora is an assembly; then the place of assembly. The idea of a place of trade comes in afterward, and naturally, since trade plants itself where people habitually gather. Hence the Roman Forum was devoted, not only to popular and judicial assemblies, but to commercial purposes, especially of bankers. The idea of trade gradually becomes the dominant one in the word. In Eastern cities the markets are held in bazaars and streets, rather than in squares. In these public places the children would be found playing. Compare [Zechariah 8:5]."}], "17": [{"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:17] . Ηὐλήσαμεν , we have piped ) i.e., played on the pipe . See [Matthew 11:19] . ἐθρηνήσαμεν , we have mourned ) See [Matthew 11:18] . An instance of Chiasmus . [530] [530] See Explanation of Technical Terms in Appendix. (I. B.)"}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Children sitting in the market places ( παιδιοις καθημενοις εν ταις αγοραις ). This parable of the children playing in the market place is given also in [Luke 7:31]. Had Jesus as a child in Nazareth not played games with the children? He had certainly watched them often since. The interest of Christ in children was keen. He has really created the modern child's world out of the indifference of the past. They would not play wedding or funeral in a peevish fret. These metaphors in the Gospels are vivid to those with eyes to see. The αγορα was originally the assembly, then the forum or public square where the people gathered for trade or for talk as in Athens ([Acts 17:17]) and in many modern towns. So the Roman Forum. The oriental bazaars today are held in streets rather than public squares. Even today with all the automobiles children play in the streets. In English the word \"cheap\" (Cheapside) meant only barter and price, not cheap in our sense. The word for mourn ( εκοψασθε ) means to beat the heart, direct middle, after the fashion of eastern funeral lamentations."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Mourn [ εκοψασθε] . Lit., beat or strike (the beast), as in oriental funeral lamentations."}], "18": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:18] . he commentary on the parable showing that it was the reception given to John and Himself that suggested it. μήτε ἐσθ . μήτε πιν .: eating and drinking, the two parts of diet; not eating nor drinking = remarkably abstemious, ascetic, that his religious habit; μήτε not οὐτε , to express not merely the fact, but the opinion about John. Vide notes on chap. [Matthew 5:34] . δαιμόνιον ἔχει : is possessed, mad, with the madness of a gloomy austerity. The Pharisee could wear gloomy airs in fasting ([Matthew 6:16] ), but that was acting . The Baptist was in earnest with his morose, severely abstinent life. Play for them, grim reality for him; and they disliked it and shrank from it as something weird. None but Pharisees would dare to say such a thing about a man like John. They are always so sure, and so ready to judge. Ordinary people would respect the ascetic of the wilderness, though they did not imitate him."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "18. μήτε ἐσθ . μήτε πίν . ] Luk 7:33 fills up this expression by inserting ἄρτον and οἶνον . See ch. [Matthew 3:4] . The neglect of John&rsquo;s preaching, and rejection of his message, is implied in several places of the Gospels (see ch. [Matthew 21:23-27] : [John 5:35] , πρὸς ὥραν ): but hence only do we learn that they brought against him the same charge which they afterwards tried against our Lord. See [John 7:20] ; [John 10:20] ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:18] . Ἦλθε , came ) A striking instance of Anaphora ; [531] cf. [Matthew 11:19] . ΜΉΤΕ ἘΣΘΊΩΝ , neither eating ) John did not eat with others, nor even in the presence of others. His mode of life agreed with the character of his teaching, and so did that of Christ [with the character of HIS teaching.] Therefore the one is, as it were, implied by the other. μήτε πίνων , nor drinking ) See [Luke 1:15] . λέγουσι , they say ) The world disparages virtue, representing it as the extreme; it advocates the cause of vice, representing it as the mean. δαιμόνἱον , a devil ) in common parlance, a familiar spirit . ἔχει , He has ) A reproach common to the Jews, by which they denoted one who was mad, or silly, or proud. They who abstain from the society of men, easily incur this suspicion. [531] See Append. The same word repeated in the beginnings of sentences or sections, in order to mark them. ED."}], "19": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:19] . ὁ υἱὸς τ . ἀ .: obviously Jesus here refers to Himself in third person where we might have expected the first. Again the now familiar title, defining itself as we go along by varied use, pointing Jesus out as an exceptional person, while avoiding all conventional terms to define the exceptional element. ἐσθίων καὶ πίνων : the &ldquo;Son of Man&rdquo; is one who eats and drinks, i.e. , non-ascetic and social, one of the marks interpretative of the title = human, fraternal . καὶ λέγουσι , and they say: what? One is curious to know. Surely this genial, friendly type of manhood will please! ἰδοὺ , lo! scandalised sanctimoniousness points its finger at Him and utters gross, outrageous calumnies. φάγος , οἰνοπότης , φίλος , an eater with emphasis = a glutton (a word of late Greek, Lob., Phryn., 434), a wine-bibber ; and, worse than either, for φίλος is used in a sinister sense and implies that Jesus was the comrade of the worst characters, and like them in conduct. A malicious nick-name at first, it is now a name of honour: the sinner&rsquo;s lover. The Son of Man takes these calumnies as a thing of course and goes on His gracious way. It is not necessary to reflect these characteristics of Jesus and John back into the parable, and to identify them with the piping and wailing children. Yet the parable is so constructed as to exhibit them very clearly in their distinctive peculiarities by representing the children not merely employed in play and quarrelling over their games, which would have sufficed as a picture of the religious Jews, but as playing at marriages and funerals, the former symbolising the joy of the Jesus-circle, the latter the sadness of the Baptist-circle ( vide my Parabolic Teaching of Christ , p. 420). καὶ ἐδικαιώθη , etc. This sentence wears a gnomic or proverbial aspect (&ldquo;verba proverbium redolere videntur,&rdquo; Kuinoel, similarly, Rosenmüller), and the aorist of ἐδικ . may be taken as an instance of the gnomic aorist, expressive of what is usual; a law in the moral sphere, as elsewhere the aorist is employed to express the usual course in the natural sphere, e.g. , in [James 1:11] . Weiss-Meyer strongly denies that there are any instances of such use of the aorist in the N. T. (On this aorist vide Goodwin, Syntax , p. 53, and Bäumlein, § 523, where it is called the aorist of experience, &ldquo;der Erfahrungswahrheit&rdquo;.) ἀπὸ , in, in view of ( vide Buttmann&rsquo;s Gram. , p. 232, on ἀπὸ in N. T.). ἔργων : the reading of [68] [69] , and likely to be the true one just because τέκνων is the reading in Luke. It is an appeal to results, to fruit ([Matthew 7:20] ), to the future. Historical in form, the statement is in reality a prophecy. Resch, indeed ( Agrapha , p. 142), takes ἐδικ . as the (erroneous) translation of the Hebrew prophetic future used in the Aramaic original = now we are condemned, but wait a while. The καὶ at the beginning of the clause is not = &ldquo;but&rdquo;. It states a fact as much a matter of course as is the condemnation of the unwise. Wisdom, condemned by the foolish, is always, of course, justified in the long run by her works or by her children. [68] Codex Sinaiticus (sæc. iv.), now at St. Petersburg, published in facsimile type by its discoverer, Tischendorf, in 1862. [69] Codex Vaticanus (sæc. iv.), published in photographic facsimile in 1889 under the care of the Abbate Cozza-Luzi."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "19. ἐσθίων καὶ πίνων ] Alluding to our Lord&rsquo;s practice of frequenting entertainments and feasts, e.g. the marriage at Cana, the feast in Levi&rsquo;s house, &c. See also ch. [Matthew 9:14] . καί = and yet; see [John 16:32] . ἡ σοφία , the divine wisdom which hath ordered these things. ἐδικ . was justified the same tense as ἦλθεν both times refers to the event , q. d., &lsquo;they were events in which wisdom was justified, &c.&rsquo; The force of the aorist is not to be lost by giving a present meaning to either of the verbs. The meaning seems to be, that the waywardness above described was not universal, but that the τέκνα σοφίας (in allusion probably to the Book of Proverbs, which constantly uses similar expressions: see ch. [Proverbs 2:1] ; [Proverbs 3:21]; [Proverbs 3:21] ; [Proverbs 4:1] , &c.) were led to receive and justify (= clear of imputation) the Wisdom of God, who did these things. Cf. [Luke 7:29] , where in this same narrative it is said, οἱ τελῶναι ἐδικαίωσαν τὸν θεόν , βαπτισθέντες τὸ βάπτισμα Ἰωάννου . The τέκνα σοφίας are opposed to the wayward παιδία above, the child like to the child ish; and thus this verse serves as an introduction to the saying in [Matthew 11:25] . Chrysostom understands the verse differently: τουτέστιν , εἰ καὶ ὑμεῖς οὐκ ἐπείσθητε , ἀλλ ʼ ἐμοὶ λοιπὸν ἐγκαλεῖν οὐκ ἔχετε . Thus ὑμεῖς = τὰ τέκνα τῆς σοφ ., as being the people of the Lord; and ἡ σοφία is our Lord Himself. This seems far-fetched, and not so consistent with the context as the other interpretation. ἀπό (reff.), not exactly equivalent to ὑπό , but implying &lsquo; at the hands of &rsquo; the person whence the justification comes."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:19] . Ἄνθρωπος φάγος , κ . τ . λ ., a gluttonous man , etc.) They distinguish Him, as one out of many, by a distinction opposed to that mentioned in the preceding verse. τῶν τέκνων , children ) we have shown, in the Apparatus, [532] that τῶν ἔργων works was anciently a widely received reading. Ambrose, on [Luke 7:35] , says: &ldquo;Therefore wisdom is justified of all her children. [533] It is well said &lsquo; of all ,&rsquo; because justice is observed towards all [ i.e. in God&rsquo;s dealings with all], so that the faithful may be accepted, the unfaithful rejected. Very many of the Greeks adopt the reading, &lsquo; Wisdom is justified of all her works ,&rsquo; because it is the work of justice to observe the due measure towards the merit of every single individual.&rdquo; He, however, appears to mean the codices of St Matthew, not those of St Luke, for he is in the habit of recurring to them from time to time, although he is commenting on St Luke. [534] ΑὐΤῆς [535] ) Valla [536] thinks that this refers to γενεᾶς ; but see [Luke 7:35] , where there are more remarks on the present passage. Cf. [Luke 11:31] . [No doubt Christ is the Wisdom meant. The children of Wisdom are those who suffer themselves to be gathered by her into her company. It is for this reason that Wisdom is blamed on the ground of too simple and ready indulgence towards such persons, and she is therefore thus compelled at last to justify herself. [Luke 15:1-2] , etc. V. g.] [532] In the Apparatus, p. 117, he says [533] The first sentence is not quoted by Bengel, but, on referring to the original. I considered the meaning so much plainer with it than without it, that I took the liberty of inserting it. The passage in Ambrose stands thus: [534] Luke, [Luke 7:35] , adds πάντων . B corrected later, reads, as the MSS. alluded to by Ambrose, τῶν ἔργων : so MSS. in Jerome, both Syriac and Memph. Versions. But D ac Vulg., Orig., Hil. and Rec. Text, read τέκνων . ED. [535] Gen. fem. sing, of αὐτὸς . E. V. renders it her , sc. Wisdom&rsquo;s . Valla would render it of it , sc. of this generation . (I. B.) [536] LAURENTIUS VALLA, one of the most distinguished Latin scholars of the fifteenth century. Born in Rome about 1406; became Professor of Eloquence, first at Pavia, and afterwards at Milan; went to Rome in 1443, and became canon of St John the Lateran. Died 1457. He published, besides many other works, annotations on the N. T. (I. B.) &ldquo; Justificata est ergo Sapientia ab omnibus filiis suis . Bene ab omnibus, quia circa omnes justitia servatur; ut susceptio fiat fidelium rejectio perfidorum. Undeplerique Græci sic habent: Justificata est Sapientia ab omnibus operibus suis ; quod opus justitiæ sit, circa unius cujuscunque meritum servare mensuram.&rdquo; (I. B.) &ldquo;19) τέκνων ) operibus notat Hieronymus in Evangeliis quibusdam legi, in Comm. ad h. l. sic vero etiam Æth. Copt. Pers. Syr . Videtur Græcus librarius antiquissimus pro τῶν τέκνων in maxima literarum similitudine, legisse τῶν ἔργων . Quæ strictura docere nos possit, ex Græco Matthæi Evangelio deductum esse Evangelium Nazarenorum [an apocryphal gospel so called], quippe quod hoc loco sine dubio respexit Hieronymus. Eundem varietatem, ex Hieronymo, ut apparet, notavit Hafenrefferus in edit. suâ N. T.&rdquo; (I. B.)"}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Wisdom is justified by her works ( εδικαιωθη απο των εργων αυτης ). A timeless aorist passive (Robertson, Grammar, p. 836f.). The word \"justified\" means \"set right\" Luke ([Luke 7:35]) has \"by all her children\" as some MSS. have here to make Matthew like Luke. These words are difficult, but understandable. God's wisdom has planned the different conduct of both John and Jesus. He does not wish all to be just alike in everything. \"This generation\" (verse [Matthew 11:16]) is childish, not childlike, and full of whimsical inconsistencies in their faultfinding. They exaggerate in each case. John did not have a demon and Jesus was not a glutton or a winebibber. \"And, worse than either, for φιλος is used in a sinister sense and implies that Jesus was the comrade of the worst characters, and like them in conduct. A malicious nickname at first, it is now a name of honour: the sinner's lover\" (Bruce). Cf. [Luke 15:2]. The plan of God is justified by results."}], "20": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:20] . τότε , then , cannot be pressed. Luke gives the following words in instructions to the Seventy. The real historical occasion is unknown. It may be a reminiscence from the preaching tour in the synagogues of Galilee ([Matthew 4:23] ). The reflections were made after Jesus had visited many towns and wrought many wonderful works ( δυνάμεις ). οὐ μετενόησαν : this the general fact; no deep, permanent change of mind and heart. Christ appearing among them a nine days&rsquo; wonder, then forgotten by the majority preoccupied with material interests."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "20. τότε ἤρξατο ] This expression betokens a change of subject, but not of locality or time. The whole chapter stands in such close connexion, one part arising out of another (e.g. this out of Mat 11:16-19 ), and all pervaded by the same great undertone, which sounds forth in [Matthew 11:28-30] , that it is quite impossible that this should be a collection of our Lord&rsquo;s sayings uttered at different times. I would rather regard the τότε ἤρξατο as a token of the report of an ear-witness, and as pointing to a pause or change of manner on the part of our Lord. See note on [Luke 10:13] . ὅτι οὐ μετ . ] Connect this with the first subject of our Lord&rsquo;s preaching, ch. [Matthew 4:17] . The reference is to some unrecorded miracles, of which we know ([Luke 4:23] ; Joh 21:25 ) that there were many."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 11:20] ff. Then He began , and so on ( ἤρξατο ). Luke introduces this upbraiding of the cities at a later stage that is, on the occasion when the instructions were addressed to the Seventy ([Matthew 10:13-15] ), for which he is assigned the preference by Schleiermacher, Schneckenburger, Holtzmann; while de Wette and Keim are justified in going against Luke, who generally uses considerable freedom as to the connection in which he introduces the sayings which in this chapter are all connected with the same subject. The Gospels make no further mention of the miracles in Chorazin and Bethsaida (not far from Capernaum; Robinson, neuere Forsch . p. 457 ff.), [John 20:30] . ἐν Τύρῳ κ . Σιδ ., κ . τ . λ .] Even these wicked heathen cities would have been brought to amendment long ago with deep sorrow for their sins. The penitent sorrow is represented by ἐν σάκκ . κ . σποδῷ , a form of mourning in popular use among the Jews (comp. on [Matthew 6:16] ). ἐν σάκκῳ ] i.e . in the dark, sack-shaped mourning attire, made of coarse cloth, and drawn over the naked body; Gesenius, Thes . III. p. 1336. [Matthew 11:22] . πλήν ] however , in the sense of ceterum , that is, to add nothing more, I tell you . Frequently used in this way by classical writers, and comp. note on [Ephesians 5:33] . [Matthew 11:23] . And thou, Capernaum, who hast been exalted to heaven, i.e . raised to the highest distinction through my dwelling and labouring within thee, wilt be brought down to Hades , namely, on the day of judgment, to undergo punishment in Gehenna; see [Matthew 11:24] . Grotius, Kuinoel, Fritzsche interpret the exaltation of Capernaum as referring to its prosperity , derived from trade, the fisheries, and so on. But this is not in keeping with the connection as indicated by ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ in [Matthew 11:20] . Still more humiliating than the comparison with Tyre and Sidon, is that with Sodom; because the responsibility was greatest in the case of Capernaum. ἔμειναν ἄν ] This ἄν , here and in [Matthew 11:21] , is simply according to rule, because the antecedent clauses contain a sumtio ficta (Ellendt, Lex. Soph . I. p. 488). [Matthew 11:24] . Comp. on [Matthew 10:15] . ὑμῖν … σοί ] Euth. Zigabenus: τὸ μὲν ὑμῖν πρὸς τοὺς πολίτας τῆς πόλεως ἐκείνης εἴρηται · τὸ δὲ σοὶ πρὸς τὴν πόλιν . The ὑμῖν , that is, does not refer to the audience (see [Matthew 11:22] ). Observe further in [Matthew 11:21-24] , first, how the passage assumes the form of a weighty climax; and then, secondly, the solemn parallelism of the antecedent clauses in [Matthew 11:21] ; [Matthew 11:23] , and of the threatened punishments in [Matthew 11:22] ; [Matthew 11:24] ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:20] . Τότε ἤρξατο , then He began ) He had not previously upbraided them. This upbraiding is the prelude to the Last Judgment. Every hearer of the New Testament is either much more blessed (v. 11) or much more miserable than them of old time. δυνάμεις , mighty works ) See [Matthew 11:5] . [Repentance and the knowledge of Jesus Christ are always conjoined. V. g.]"}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Most of his mighty works ( α πλειστα δυναμεις αυτου ). Literally, \"His very many mighty works\" if elative as usual in the papyri (Moulton, Prolegomena, p. 79; Robertson, Grammar, p. 670). But the usual superlative makes sense here as the Canterbury translation has it. This word δυναμις for miracle presents the notion of power like our dynamite. The word τερας is wonder, portent, miraculum (miracle) as in [Acts 2:19]. It occurs only in the plural and always with σημεια . The word σημειον means sign ([Matthew 12:38]) and is very common in John's Gospel as well as the word εργον (work) as in [John 5:36]. Other words used are παραδοξον , our word paradox, strange ([Luke 5:26]), ενδοξον , glorious ([Luke 13:17]), θαυμασιον , wonderful ([Matthew 21:15])."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Mighty works [ δυναμεις] . The supernatural works of Christ and his apostles are denoted by six different words in the New Testament, exhibiting these works under different aspects and from different points of view. These will be considered in detail as they occur. Generally, a miracle may be regarded : 1. As a portent or prodigy [ τερας] ; as [Acts 7:36], of the wonders shown by Moses in Egypt. 2. As a sign [ σημειον] , pointing to something beyond itself, a mark of the power or grace of the doer or of his connection with the supernatural world. So [Matthew 12:38]. 3. As an exhibition of God 's glory [ ενδοξον] , [Luke 13:17]; glorious things. 4. As a strange thing [ παραδοξον] , [Luke 5:26]. 5. As a wonderful thing (qaumasion), [Matthew 21:15]. 6. As a power [ δυναμις] ; so here : a mighty work."}], "21": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:21] . Χοραζίν , Βηθσαϊδάν : the former not again mentioned in Gospels, the latter seldom ( vide [Mark 6:45] ; [Mark 8:22] ; [Luke 9:10] ), yet scenes of important evangelic incidents, probably connected with the synagogue ministry in Galilee ([Matthew 4:23] ). The Gospels are brief records of a ministry crowded with events. These two towns may be named along with Capernaum because all three were in view where Christ stood when He uttered the reproachful words, say on the top of the hill above Capernaum: Bethsaida on the eastern shore or Jordan, just above where it falls into the lake; Chorazin on the western side on the road to Tyre from Capernaum (Furrer, Wanderungen , p. 370). They may also have been prosperous business centres selected to represent the commercial side of Jewish national life. Hence the reference to Tyre and Sidon , often the subject of prophetic animadversion, yet not so blameworthy in their impenitence as the cities which had seen Christ&rsquo;s works. ἐν σάκκῳ καὶ σποδῷ : in black sackcloth, and with ashes on the head, or sitting in ashes like Job ([Matthew 2:8] )."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "21. Χοραζείν ] According to Jerome (cited by Winer, Realwörterbuch) a town of Galilee, two (according to Eusebius twelve , but most likely an error in the transcription) miles from Capernaum . It is no where mentioned except here and in the similar place of Luke. The etymology is uncertain. Some would read χώρα ζίν . Βηθσαϊδάν ] Called πόλις [John 1:45] , κώμη [Mark 8:23] , in Galilee [John 12:21] ; on the western bank of the lake of Gennesaret, near the middle, not far from Capernaum; the birth-place of Simon Peter, Andrew, and Philip. Both this and Chorazin appear to be put as examples of the lesser towns in which our Lord had wrought His miracles (the κωμοπόλεις of Mar 1:38 ), as distinguished from Capernaum, the chief town ( Mat 11:23 ) of the neighbourhood. Τύρῳ κ . Σιδῶνι ] These wealthy cities, so often the subject of prophecy, had been chastised by God&rsquo;s judgment under Nebuchadnezzar and Alexander, but still existed ([Acts 12:20] ; [Acts 21:3] ; [Acts 21:7] ; Act 27:3 ). ἐν σάκ . κ . σποδῷ μετ . is probably an allusion to [Jonah 3:6] , or to general Eastern custom."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:21] . Οὐαὶ , woe ) This interjection is not imprecatory, but enunciatory. See ch. [Matthew 24:17] . Its opposite is blessed . This should be observed everywhere."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Chorazin ( Χοραζειν ). Mentioned only here and in [Luke 10:13]. Proof of \"the meagreness of our knowledge of Judaism in the time of Christ\" (Plummer) and of the many things not told in our Gospels ([John 21:25]). We know something of Bethsaida and more about Capernaum as places of privilege. But ( πλην , howbeit) neither of these cities repented, changed their conduct. Note condition of the second class, determined as unfulfilled in verses [Matthew 11:21] and [Matthew 11:23]."}], "22": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:22] . πλὴν : contracted from πλέον = moreover, for the rest, to put the matter shortly; not adversative here, though sometimes so used."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:22] . Ἀνεκτότερον , more tolerable ) Because they were less impenitent, and would have repented, and have already been punished. κρίσεως , judgment ) The Judge will be the very same in whom they were then offended."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "But [ πλην] . Better Rev., howbeit, or as Wyc., nevertheless. Chorazin and Bethsaida did not repent; therefore a woe lies against them; nevertheless they shall be more excusable than you who have been seen the mighty woks which were not done among them."}], "23": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:23] . he diversity in the reading μὴ or ἡ ἕως , etc., does not affect the sense. In the one case the words addressed to Capernaum contain a statement of fact by Jesus; in the other a reference to a feeling prevailing in Capernaum in regard to the facts. The fact implied in cither case is distinction on some ground, probably because Capernaum more than all other places was favoured by Christ&rsquo;s presence and activity. But there may, as some think (Grotius, Rosen., De Wette, etc.), be a reference to trade prosperity. &ldquo;Florebat C. piscatu, mercatu, et quae alia esse solent commoda ad mare sitarum urbium&rdquo; (Grot.). The reference to Tyre and Sidon, trade centres, makes this not an idle suggestion. And it is not unimportant to keep this aspect in mind, as Capernaum with the other two cities then become representatives of the trading spirit, and show us by sample how that spirit received the Gospel of the kingdom. Capernaum illustrated the common characteristic most signally. Most prosperous, most privileged spiritually, and most unsympathetic, the population being taken as a whole. Worldliness as unreceptive as counterfeit piety represented by Pharisaism, though not so offensive in temper and language. No calumny, but simply invincible indifference. ἕως οὐρανοῦ , ἕως ᾃδου : proverbial expressions for the greatest exaltation and deepest degradation. The reference in the latter phrase is not to the future world, but to the judgment day of Israel in which Capernaum would be involved. The prophetic eye of Jesus sees Capernaum in ruins as it afterwards saw the beautiful temple demolished (chap. [Matthew 24:2] )."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "23. ] The sense has been variously interpreted. Some suppose it to allude to the distinguished honour conferred on Capernaum by our Lord&rsquo;s residence there. So Euthymius: ἡ Καπερναοὺμ ἔνδοξος γέγονε διὰ τὸ κατοικεῖν ἐν αὐτῇ τὸν χριστὸν καὶ τὰ πολλὰ τῶν θαυμάτων ἐν αὐτῇ τελέσαι . Others (as Grotius) to the rich fisheries carried on at Capernaum, by means of which the town was proud and prosperous. Jerome says, &lsquo;Ideo ad inferna descendes, quia contra prædicationem meam superbissime restitisti.&rsquo; He also mentions the first interpretation. Others, as Stier (Reden Jesu, i. 491), refer the expression to the lofty situation of Capernaum, which however is very uncertain. The first interpretation appears to me the most probable, seeing that our Lord chose that place to be the principal scene of His ministry and residence, ἡ ἰδία πόλις ch. [Matthew 9:1] . The very sites of these three places are now matter of dispute among travellers. See Robinson, vol. iii. pp. 283 300. Dr. Thomson, &ldquo;The Land and the Book,&rdquo; p. 359, was sure he found Chorazin in the ruins bearing the name Khorazy, lying in a side valley of the Wady Nashif, which runs down to the lake on the East of Tell Hûm (Capernaum). And this, in spite of Dr. Robinson&rsquo;s rejection of the identification. ἐν Σοδόμοις ] The comparison between sinful Israel and Sodom is common in the O.T. See [Deuteronomy 32:32] ; [Isaiah 1:10] ; [Lamentations 4:6] ; [Ezekiel 16:46-57] . ἔμεινεν ἄν ] This declaration of the Lord of all events, opens to us an important truth, that the destruction of Sodom was brought about, not by a necessity in the divine purposes still less by a connexion of natural causes but by the iniquity of its inhabitants, who, had they turned and repented, might have averted their doom. The same is strikingly set before us in the history of Jonah&rsquo;s preaching at Nineveh."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:23] . Καπερναοὺμ , Capernaum ) This city had been more highly blessed than Chorazin and Bethsaida, but from its sin became more miserable. It is therefore compared with Sodom, not with Tyre and Sidon. ἓως τοῦ οὐρανοῦ , even unto heaven ) For the Lord from heaven had come to dwell there, and in bringing Himself, had brought heaven thither. [537] ὑψωθεῖσα , exalted ) In the sight of God, of Christ, and of the angels. ᾅδου , hell ) Which is lowest in the nature of things. ἔμειναν ἄν , they would have remained ) Instead of having been destroyed. Great is the effect of the conditional form. [538] The same verb occurs in [John 21:22] . [537] For specimens of this exaltation, see [John 2:12] ; [John 4:47] ; Mat 4:13 to [Matthew 13:53] ; [John 6:24] ; [Matthew 17:24] . Harm. , p. 301. [538] For they, in that case, either would not have perpetrated the enormities which they did, or else would have repented of having committed them: in which case they would not have been destroyed, either then or subsequently. V. g."}], "24": [{"src": "hac", "name": "Alford's Greek Testament", "text": "24, and 22. ] These verses are connected with those respectively preceding them thus: &lsquo;If these mighty works had been done in Tyre and Sidon in Sodom they would have, &c.; but, since no such opportunity was afforded them , and ye , Bethsaida, Chorazin, and Capernaum, have had and rejected such, it shall be more tolerable, &c.&rsquo; And as to the saying of our Lord, &lsquo;If more warnings had been given they would have repented,&rsquo; it is not for the infidel to say, &lsquo;Why then were not more given?&rsquo; because every act of God for the rescue of a sinner from his doom is purely and entirely of free and undeserved grace, and the proportion of such means of escape dealt out to men is ruled by the counsel of His will who is holy, just, and true, and willeth not the death of the sinner; but whose ways are past our finding out. We know enough when we know that all are inexcusable, having (see [Romans 1:1-32] ; [Romans 2:1-29] .) the witness of God in their consciences; and our only feeling should be overflowing thankfulness, when we find ourselves in possession of the light of the glorious Gospel, of which so many are deprived. That the reference here is to the last great day of judgment is evident, by the whole being spoken of in the future. Had our Lord been speaking of the outward judgment on the rebellious cities, the future might have been used of them , but could not of Sodom, which was already destroyed. This ἀνεκτότερον ἔσται is one of those mysterious hints at the future dealings of God, into which we can penetrate no further than the actual words of our Lord reveal, nor say to what difference exactly they point in the relative states of those who are compared. See also [Luke 12:47-48] ."}], "25": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:25] . ἀποκριθείς , answering, not necessarily to anything said, but to some environment provocative of such thoughts. ἐξομολογοῦμαί σοι (= הוֹדָה לְ , [Psalms 75:2] , etc.). In [Matthew 3:6] this compound means to make full confession (of sin). Here it = to make frank acknowledgment of a situation in a spirit partly of resignation, partly of thanksgiving. ἔκρυψας . The fact stated is referred to the causality of God, the religious point of view; but it happens according to laws which can be ascertained. ταῦτα : the exact reference unknown, but the statement holds with reference to Christ&rsquo;s whole teaching and healing ministry, and the revelation of the kingdom they contained. σοφῶν καὶ συνετῶν : the reference here doubtless is to the Rabbis and scribes, the accepted custodians of the wisdom of Israel. Cf. σοφὸς καὶ ἐπιστήμων in [Deuteronomy 4:6] applied to Israel. The rendering &ldquo;wise and prudent &rdquo; in A. V [70] is misleading; &ldquo;wise and understanding &rdquo; in R. V [71] is better. νηπίοις (fr. νη and ἔπος , non-speaking) means those who were as ignorant of scribe-lore as babes ( cf. [John 7:49] and [Hebrews 5:13] ). Their ignorance was their salvation, as thereby they escaped the mental preoccupation with preconceived ideas on moral and religious subjects, which made the scribes inaccessible to Christ&rsquo;s influence ( vide my Parabolic Teaching , pp. 333, 334). Jesus gives thanks with all His heart for the receptivity of the babes, not in the same sense or to the same extent for the non-receptive attitude of the wise (with De Wette and Bleek against Meyer and Weiss). No distinction indeed is expressed, but it goes without saying, and the next clause implies it. [70] Authorised Version. [71] Revised Version."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 11:25] . Ἀποκρ . means, like עָנָה , to take up speech, and that in connection with some given occasion, to which what is said is understood to refer by way of rejoinder. Comp. [Matthew 22:1] , [Matthew 28:5] ; [John 2:18] ; [John 5:17] , al. However, the occasion in this instance is not stated. According to [Luke 10:21] (Strauss, Ebrard, Bleek, Holtzmann), it was the return of the Seventy, of whom, however, there is no mention in Matthew. Ewald, Weissenborn, and older expositors find it in the return of the apostles. See [Mark 6:12] ; [Mark 6:30] ; [Luke 9:6] ; [Luke 9:10] . This is the most probable view. Luke has transferred the historical connection of the prayer to the account of the Seventy, which is peculiar to that evangelist; while in [Matthew 12:1] , Matthew assumes that the Twelve have already returned. The want of precision in Matthew&rsquo;s account, which in [Matthew 10:5] expressly records the sending out of the Twelve, but says nothing of their return, is, of course, a defect in his narrative; but for this reason we should hesitate all the more to regard it as an evidence that we have here only an interpolation (Hilgenfeld) of this &ldquo;pearl of the sayings of Jesus&rdquo; (Keim), which is one of the purest and most genuine, one of Johannean splendour ([John 8:19] ; [John 10:15] ; [John 14:9] ; [John 16:15] ). For ἐξομολογ . with dative, meaning to praise, comp. on [Romans 14:11] ; Sir 51:1 . ταῦτα ] what? the imperfect narrative does not say what things, for it introduces this thanksgiving from the collection of our Lord&rsquo;s sayings, without hinting why it does so. But from the contents of the prayer, as well as from its supposed occasion, viz. the return of the Twelve with their cheering report, it may be inferred that Jesus is alluding to matters connected with the Messianic kingdom which He had communicated to the disciples ([Matthew 13:11] ), matters in the proclaiming of which they had been labouring, and at the same time been exercising the miraculous powers conferred upon them. The σοφοί and συνετοί are the wise and intelligent generally ([1 Corinthians 1:19] ; [1 Corinthians 3:10] ), but used with special reference to the scribes and Pharisees, who, according to their own opinion and that of the people ([John 9:40] ), were pre-eminently so. The novices ( פְּתָאִים ), the disciples, who are unversed in the scholastic wisdom of the Jews. Comp. on this subject, [1 Corinthians 1:26] ff. Yet on this occasion we must not suppose the reference to be to the simple and unsophisticated masses (Keim), which is not in keeping with [Matthew 11:27] , nor with the idea of ἀποκάλυψις (comp. [Matthew 16:17] ) generally, as found in this connection; the contrast applies to two classes of teachers, the one wise and prudent, independently of divine revelation, the others mere novices in point of learning, but yet recipients of that revelation. Observe, further, how the subject of thanksgiving does not lie merely in ἀπεκάλυψ . αὐτὰ νηπίοις , but in the two, the ἀπέκρυψας etc., and the ἀπεκάλυψας , etc., being inseparably combined. Both together are the two sides of the one method of proceeding on the part of His all-ruling Father, of the necessity of which Christ was well aware ([John 9:39] )."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:25] . Ἀποκριθεὶς , answering ) Sc. to those things which He was considering concerning His Father&rsquo;s design, His own thoughts, and the character of His disciples. [539] ἐξομολογοῦμαι , I praise ) Nothing can be predicated with praise of God, [540] which is not so in fact: תּודה , praise , [541] is predication. [542] Jesus returned thanks to His Father afterwards in the same words, when the seventy disciples had well performed the work which He had appointed them. Πάτερ , Κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς , Father, Lord of heaven and earth ) He is frequently called the Father of Jesus Christ, sometimes also His God; never His Lord, but the Lord of heaven and earth . Let us learn, from the example of Jesus Christ, to apply to God those titles which are suitable to the subject of our prayers. The Jews also forbid to cumulate divine titles in prayers. The address in this passage is indeed most magnificent. ὅτι ἀπέκρυψας καὶ ἀπεκάλυψας , κ . τ . λ ., because Thou hast hid and revealed , etc.) A double ground of praise. For ἀπέκρυψας , Thou hast kept concealed , cf. [Matthew 11:27] ; for ἀπεκάλυψας , Thou hast revealed , cf. again [Matthew 11:27] , at the end. ταῦτα , these things ) Concerning the Father and the Son, concerning the kingdom of heaven. σοφῶν , the wise ) i.e. those who arrogate to themselves the character of wisdom. [543] συνετῶν , prudent ) i.e. those who arrogate to themselves the character of prudence. [544] Cf. [1 Corinthians 1:19] . ἀπεκάλυψας , Thou hast revealed ) See ch. [Matthew 16:17] . νηπίοις , to infants ) Such as the twelve apostles and seventy disciples were: See [Luke 10:21] ; they were very young , for they bore witness for a long time afterwards. They were infants, as being ready to believe and simple-minded; see [Matthew 18:3] . [539] He uttered the words which follow with an exulting spirit. V. g. [540] The word used by Bengel is &ldquo; Confiteor ,&rdquo; which occurs in the Vulgate, both here and in 1Ch 16:35 with the same sense. That such is his meaning, is clear from his employing in his German Version the phrase, Ich preise Dick , which, when applied to God, signifies &ldquo; I PRAISE or MAGNIFY Thee .&rdquo; Bengel employs the word &ldquo; Confiteor &rdquo; in preference to any other, because, like the Greek ἐξομολογοῦμαι , it signifies both generically, with an accusative, to confess, acknowledge, proclaim , etc., and specifically, with a dative, to laud, praise , or magnify [GOD]. See Riddle and Schleusner in voce. E. V. renders ἐξομολογοῦμαι , I thank . (I. B.) [541] The word used by Bengel is &ldquo; Confessio ,&rdquo; which he employs with direct reference to his previous &ldquo; Confiteor ,&rdquo; on which see preceding footnote. [542] And conversely, therefore, Predication is Praise . They are the two sides of an eternal and immutable equation. Much to the same effect, Bengel says elsewhere (ch. Mat 6:9 ), &ldquo;Deus est sanctus, i.e. , Deus sanctificatur ergo, quando ita, ut est, agnoscitur et colitur et celebratur.&rdquo; Consequently, in confessing, acknowledging , and proclaiming , or in any other mode PREDICATING the truth cuncerning GOD (and not otherwise), we PRAISE Him. (I. B.) [543] Beng. attributes to the σοφοὶ the &ldquo;habitus noëticus;&rdquo; to the συνετοὶ , the &ldquo;habitus dianoëticus;&rdquo; the same difference as between νοῦς and διάνοια , mind and discriminative intelligence or discernment . Ed. [544] Beng. attributes to the σοφοὶ the &ldquo;habitus noëticus;&rdquo; to the συνετοὶ , the &ldquo;habitus dianoëticus;&rdquo; the same difference as between νοῦς and διάνοια , mind and discriminative intelligence or discernment . Ed. On the meaning of תּי ̇ דָה , Gesenius says: (1.) Confession, [Joshua 7:19] ; [Ezra 10:11] . (2.) Thanksgiving, [Psalms 26:7] ; [Psalms 42:5] . זָבַח תּו ̇ דָה to offer praise to God (for a sacrifice), [Psalms 50:14] ; [Psalms 50:23] ; [Psalms 107:22] ; [Psalms 116:17] (where the phrase is not to be taken as though proper sacrifices were spoken of). זֶבַח תּו ̇ דָה , [Leviticus 22:29] ; זֶבַח תּיֹדַת הַשְׁלָמִים [Leviticus 7:13] ; [Leviticus 7:15] , comp. 12, and ellipt. תּו ̇ דָה , a sacrifice of thanksgiving, [Psalms 56:13] . (3.) A choir of givers of thanks, praising God. [Nehemiah 12:31] ; [Nehemiah 12:38] ; [Nehemiah 12:40] . (I. B.)"}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "At that season Jesus answered and said ( εν εκεινω τω καιρω αποκριθεις ειπεν ). Spoke to his Father in audible voice. The time and place we do not know. But here we catch a glimpse of Jesus in one of his moods of worship. \"It is usual to call this golden utterance a prayer, but it is at once prayer, praise, and self-communing in a devout spirit\" (Bruce). Critics are disturbed because this passage from the Logia of Jesus or Q of Synoptic criticism ([Matthew 11:25-30]; [Luke 10:21-24]) is so manifestly Johannine in spirit and very language, \"the Father\" ( ο πατηρ ), \"the son\" ( ο υιος ), whereas the Fourth Gospel was not written till the close of the first century and the Logia was written before the Synoptic Gospels. The only satisfying explanation lies in the fact that Jesus did have this strain of teaching that is preserved in John's Gospel. Here he is in precisely the same mood of elevated communion with the Father that we have reflected in John 14 to 17. Even Harnack is disposed to accept this Logion as a genuine saying of Jesus. The word \"thank\" ( ομολογουμα ) is better rendered \"praise\" (Moffatt). Jesus praises the Father \"not that the σοφο were ignorant, but that the νηπιο knew\" (McNeile)."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Answered. In reply to something which is not stated. I thank [ εξομολογουμαι] . Compare [Matthew 3:6], of confessing sins. Lit., I confess. I recognize the justice and wisdom of thy doings. But with the dative, as here (soi, to thee), it means to praise, with an undercurrent of acknowledgment; to confess only in later Greek, and with an accusative of the object. Rev. gives praise in the margin here, and at [Romans 14:11]. Tynd., I praise. Prudent [ συνετων] . Rev., understanding; Wyc., wary. From the verb sunihmi, to bring together, and denoting that peculiarity of mind which brings the simple features of an object into a whole. Hence comprehension, insight. Compare on [Mark 12:33], understanding [ συνεσεως] . Wise [ σοφων ] and understanding are often joined, as here. The general distinction is between productive and reflective wisdom, but the distinction is not always recognized by the writer."}], "26": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:26] . ναί reaffirms with solemn emphasis what might appear doubtful, viz. , that Jesus was content with the state of matters ( vide Klotz, Devar. , i. 140). Cf. [Matthew 11:9] . πατήρ : nominative for vocative. ὄτι , because, introducing the reason for this contentment. οὕτως , as the actual facts stand, emphatic (&ldquo;sic maxime non aliter,&rdquo; Fritzsche). εὐδοκία , a pleasure, an occasion of pleasure; hence a purpose, a state of matters embodying the Divine Will, a Hellenistic word, as is also the verb εὐδοκέω ( cf. [1 Corinthians 1:21] , where the whole thought is similar). Christ resigns Himself to God&rsquo;s will. But His tranquillity is due likewise to insight into the law by which new Divine movements find support among the νήπιοι rather than among the σοφοί ."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew

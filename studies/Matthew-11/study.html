ing culture and imagination, use them to understand and share the feelings of their fellows; as against those who use them to rise to what they call a higher plane. Crudely, the poet differs from the mob by his sensibility; the professor differs from the mob by his insensibility. He has not sufficient finesse and sensitiveness to sympathize with the mob. His only notion is coarsely to contradict it, to cut across it, in accordance with some egotistical plan of his own; to tell himself that, whatever the ignorant say, they are probably wrong. He forgets that ignorance often has the exquisite intuitions of innocence.", "lang": "english", "orig": "", "d": ""}, {"v": 25, "f": "Glossa Ordinaria", "w": "", "t": "(non occ.) Because the Lord knew that many would doubt respecting the foregoing matter, namely, that the Jews would not receive Christ whom the Gentile world has so willingly received, He here makes answer to their thoughts; And Jesus answered and said, I confess unto thee, Father, Lord of heaven and earth.\n\n(ord.) That is, Who makest of heaven, or leavest in earthliness, whom Thou wilt. Or literally,", "lang": "english", "orig": "", "d": "c. 1150"}, {"v": 25, "f": "Gregory Thaumaturgus", "w": "VIII.—On St. Matthew.2385", "t": "And in the Gospel according to Matthew, the Lord said to him who betrayed Him:\n“Betrayest thou the Son of Man with a kiss?” which Peter the Martyr and Archbishop of\nAlexandria expounding, says, this and other things like, “All the signs which He showed,\nand the miracles that He did, testify of Him that He is God incarnate; both things therefore\nare together proved, that He was God by nature, and was made man by nature.”", "lang": "greek", "orig": "", "d": "205-280"}, {"v": 25, "f": "Gregory the Dialogist", "w": "", "t": "(Mor. xxvii. 13.) He says not' to the foolish,' but to babes, showing that He condemns pride, not understanding.\n\n(Mor. xxv. 14.) In which words we have a lesson of humility, that we should not rashly presume to discuss the counsels of heaven concerning the calling of some, and the rejection of others showing that that cannot be unrighteous which is willed by Him that is righteous.", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 25, "f": "Hilary of Poitiers", "w": "", "t": "The hidden things of heavenly words and their power are hid from the wise, and revealed to the babes; babes, that is, in malice, not in understanding; hid from the wise because of their presumption of their own wisdom, not because of their wisdom.\n\nThe justice of this the Lord confirms by the sentence of the Father's will, that they who disdain to be made babes in God, should become fools in their own wisdom; and therefore He adds, Even so, Father; for so it seemed good before thee.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 25, "f": "Jerome", "w": "", "t": "(Verse 25) At that time, Jesus answered and said: I confess to you, Father, Lord of heaven and earth. Confession, not always repentance, but also signifies thanksgiving, as we often read in the psalms. Let those who calumniate the Savior for calling his Father the Lord of heaven and earth, not as one who is born, but as one who is created, hear. For if he is also a creature, and a creature can call its creator father, it would be foolish not to call both himself and the Lord of heaven and earth, or Father, in the same way.\n\n\n\n74 Because you have hidden these things from the wise and prudent and have revealed them to little ones. He gives thanks and rejoices in the Father, because the sacraments of his coming have been revealed to the apostles, which the scribes and Pharisees, who consider themselves wise, have ignored, and in their own sight, prudent. Wisdom has been justified by her children.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 25, "f": "Jerome", "w": "", "t": "Let those hear who falsely argue, that the Saviour was not born but created, how He calls His Father Lord of heaven and earth. For if He be a creature, and the creature can call its Maker Father, it was surely foolish here to address Him as Lord of heaven and earth, and not of Him (Christ) likewise. He gives thanks that His coming has opened to the Apostles sacraments, which the Scribes and Pharisees knew not, who seemed to themselves wise, and understanding in their own eyes; That thou hast hid these things from the wise and understanding, and hast revealed them unto babes.\n\nIn these words moreover He speaks to the Father with the desire of one petitioning, that His mercy begun in the Apostles might be completed in them.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 25, "f": "John Chrysostom", "w": "", "t": "Seest thou, how many ways He leads them on to the faith? First, by His praises of John. For by pointing to him as a great and marvellous one, He proved likewise all his sayings credible, whereby he used to draw them on to the knowledge of Him. Secondly, by saying, \"The kingdom of Heaven suffereth violence, and the violent take it by force;\" for this is the language of one who is pressing and urging them. Thirdly, by signifying that the number of the prophets was finished; for this too manifested Himself to be the person that was announced beforehand by them. Fourthly, by pointing out that whatsoever things should be done by him, were all accomplished; at which time also He made mention of the parable of the children. Fifthly, by His upbraiding them that had not believed, and by His alarming and threatening them greatly. Sixthly, by His giving thanks for them that believed. For the expression, \"I make acknowledgment to Thee,\" here is, \"I thank Thee.\" \"I thank Thee,\" He saith, \"because Thou hast hid these things from the wise and prudent.\"\n\nWhat then? doth He rejoice in destruction, and in the others not having received this knowledge? By no means; but this is a most excellent way of His to save men, His not forcing them that utterly reject, and are not willing to receive His sayings; that, since they were not bettered by His call, but fell back, and despised it, His casting them out might cause them to fall into a longing for these things. And so likewise the attentive would g", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 25, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "At that time Jesus answered and said, I make acknowledgment unto You,  O Father, Lord of Heaven and earth; because You have hid these things from the wise and prudent, and hast revealed them unto babes. Even so, Father, for so it seemed good in Your sight.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 25, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Thus, what it was necessary for you to learn of Him, this He Himself has said; that the Virgin was untouched by man until the birth; but that which both was seen to be a consequence of the former statement, and was acknowledged, this in its turn he leaves for you to perceive; namely, that not even after this, she having so become a mother, and having been counted worthy of a new sort of travail, and a child-bearing so strange, could that righteous man ever have endured to know her. For if he had known her, and had kept her in the place of a wife, how is it that our Lord John 19:27 commits her, as unprotected, and having no one, to His disciple, and commands him to take her to his own home?", "lang": "", "orig": "", "d": "c. 388"}, {"v": 25, "f": "Origen of Alexandria", "w": "", "t": "Jesus praises and glorifies the Father, who had foreseen the entire trajectory of the Word first to the Jews and then to the Gentiles. Our Lord here gives thanks to his Father, the Lord of heaven and earth, for his mission in becoming incarnate in the form of a servant. He speaks about the Father’s good pleasure now to hide this mystery about himself from Israel, which might be expected to be wise, and to reveal it to the Gentiles, who were until now without understanding. It is thereby demonstrated that God did not forget to fulfill his purpose, nor did Christ’s coming fail in its appointed end. These things indeed have happened, God knowing them beforehand and having commanded beforehand the repentance of grace. The justice of God’s good pleasure is here passed over in silence, but elsewhere it is clearly displayed. God’s good will is not irrational. People do not fail to attain knowledge and wisdom about it for any reason other than their own deficiencies.", "lang": "english", "orig": "", "d": "c. 230"}, {"v": 25, "f": "Tertullian", "w": "", "t": "His \"Father\" He Himself adores. When acknowledged by Peter as the \"Christ (the Son) of God,\" He does not deny the relation.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 25, "f": "Tertullian", "w": "", "t": "He exults in spirit when He says to the Father, \"I thank Thee, O Father, because Thou hast hid these things from the wise and prudent.\" He, moreover, affirms also that to no man is the Father known, but to His Son; and promises that, as the Son of the Father, He will confess those who confess Him, and deny those who deny Him, before His Father.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 25, "f": "Theodore Stratelates", "w": "", "t": "Jesus called the Jews wise, either because they were entrusted with the oracles of God or because they were evil-doers and wise at doing evil, but he called the apostles children. He called the scribes and Pharisees wise, though they did not really possess wisdom but only what appeared to be wisdom because of their cleverness with words. He called the fishermen, who were unskilled in evil, children. In this way, the grace of God was clearly manifested as Jesus made himself known to simple men.… And even if it was Christ himself who, for the most part, did these things, nevertheless, by giving thanks for them as things done by the Father, he shows that they share a common will and gives thanks for God’s love for us in the things by which we have received benefit.", "lang": "english", "orig": "", "d": ""}, {"v": 25, "f": "Theophylact of Ohrid", "w": "", "t": "This is what He is saying: I thank Thee, Father, that the Jews who seem to be wise and knowledgeable of the Scriptures did not believe, while the unlearned and the babes believed and recognized the mysteries. God hid the mysteries from those who seemed wise, not out of malice, or so as to cause ignorance, but because of their unworthiness, stemming from the very fact that they thought that they were wise. For he who thinks himself to be wise and is bold in his own knowledge does not call upon God. So then God, not having been called upon, gives him neither help nor revelation. Furthermore, God, out of His very love for man, does not reveal the mysteries to the multitude lest they be punished the more for first knowing the mysteries and then scorning them.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 25, "f": "Thomas Aquinas", "w": "", "t": "At that time Jesus declared: I thank you, Father... Above the Lord upbraided the unbelief of the crowd; now he gives thanks for the faith of the disciples and other believers. First, he gives thanks to the Father as author; secondly, he shows that he has the same power (v. 27). He says, therefore, At that time, namely, when it happened, Jesus answered. But whom did he answer? To him are applied the words of Job (15:2): \"Does a wise person answer as though talking to the wind?\" No. Therefore, he is responding to a tacit objection. For someone could say: Those to whom you preached do not believe, but others would have believed, had you preached to them. Therefore he answers and with the answer rebukes those who sought the causes of election, namely, why they were elevated to heaven and the others cast down to hell; as Origen, who held that election is due to merits. But here he rejects this by showing that it must be attributed to the divine will. He says, therefore, I thank [confess to] you, Father... It should be noted that confession is threefold, namely, of faith; hence it says in Romans (10:10): \"Man believes with his heart and so is justified, and he confesses with his lips and so is saved.\" Then, confession of sins: \"Confess your sins to one another\" (Jas 5:16). Finally, there is the confession of thanksgiving, about which Psalm 106 (v. 1): \"Confess to the Lord, because he is good...\" This is the one meant here.\n\nTwo heresies are excluded, namely of Sabellius, who did no", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 25, "f": "npnf210", "w": "CHAPTER VIII.", "t": "102. If then the Son is glory, and the Father is glory (for the Father of glory cannot be\nanything else than glory), there is no separation of glories, but glory is one. Thus glory is\n1853 S. Matt. xi. 25.\n1854 S. Matt. xxii. 42–46.\n1855 2 Cor. i. 3.\n\n\nreferred to its own proper nature, but lordship to the service of the body that was assumed.\nFor if the flesh is subject to the soul of a just man as it is written: “I chastise my body and\nbring it into subjection;”1856 how much more is it subject to the Godhead, of Which it is\nsaid: “For all things serve Thee”?1857", "lang": "greek", "orig": "", "d": ""}, {"v": 25, "f": "npnf210", "w": "CHAPTER XV.", "t": "calls Him Lord in the\n587 S. Matt. vi. 24.\n588 S. Matt. xi. 25.\n589 S. John xiii. 13.\n590 Deut. vi. 4.\n591 Gen. xix. 24.\n592 2 Tim. i. 18.\n593 Ps. cx. [cix.] 1.\n594 S. Matt. xxii. 43, 45.\n\n\nSpirit. Or if they falsely infer from this that the Spirit called Him Lo", "lang": "greek", "orig": "", "d": ""}, {"v": 26, "f": "1 Clement", "w": "Chapter I.—Reasons for addressing the Greeks.", "t": "As I begin this hortatory address to you, ye men of Greece, I pray God that I may know\nwhat I ought to say to you, and that you, shaking off your habitual743 love of disputing, and\nbeing delivered from the error of your fathers, may now choose what is profitable; not\nfancying that you commit any offence against your forefathers, though the things which\nyou formerly considered by no means salutary should now seem useful to you. For accurate\ninvestigation of matters, putting truth to the question with a more searching scrutiny, often\nreveals that things which have passed for excellent are of quite another sort. Since, then, we\npropose to discourse of the true religion (than which, I think, there is nothing which is\ncounted more valuable by those who desire to pass through life without danger, on account\nof the judgment which is to be after the termination of this life, and which is announced\nnot only by our forefathers according to God, to wit the prophets and lawgivers, but also\nby those among yourselves who have been esteemed wise, not poets alone, but also philosophers,\nwho professed among you that they had attained the true and divine knowledge),\nI think it well first of all to examine the teachers of religion, both our own and yours, who\nthey were, and how great, and in what times they lived; in order that those who have formerly\nreceived from their fathers the false religion, may now, when they perceive this, be extricated\nfrom that inveterate error; and that we may clear", "lang": "greek", "orig": "", "d": "70-165"}, {"v": 26, "f": "Jerome", "w": "", "t": "(Verse 26.) Yes, Father, because it was pleasing to You in this way. Speaking with affection to the Father, that the work begun in the apostles may be completed.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 26, "f": "Theophylact of Ohrid", "w": "", "t": "Here He shows the Father's love for man, in that the Father revealed the mysteries to the babes, without having been called upon by anyone to do so, but because it so pleased Him to do from the beginning. For [the Greek word for \"good will\"] eudokia means both \"will\" and \"pleasure.\"", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 26, "f": "Thomas Aquinas", "w": "", "t": "But why does he give thanks for hiding these things? I say that he did not do this as though rejoicing in their blindness but in the judgment of God, who arranged things so wisely. And why? Here the cause is not investigated, for in such matters God's will is taken as the cause. Yes, Father, for such was your gracious will. An artisan can easily assign the reason why he put certain stones in the foundation and others above it; but why he put this one here and another there, the only cause is his will. Similarly, that God saves certain ones is a tribute to his mercy; that he damns others is due to his justice. But why he dealt mercifully with one rather than another pertains solely to his will. Hence Romans (9:18): \"So then he has mercy upon whomever he wills, and he hardens the heart of whomever he wills.\" Hence he acts by reason of his pleasure: \"Make pleasing the homage of my lips\" (Ps 119:108).", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 27, "f": "1 Clement", "w": "Chapter VI.—The angels and the Creator of the world could not have been\nignorant of the Supreme God.", "t": "3. If, then, they shrink from affirming that the angels are more irrational than the dumb\nanimals, they will find that it behoved these, although they had not seen Him who is God\nover all, to know His power and sovereignty. For it will appear truly ridiculous, if they\n365 Matt. xi. 27.\n366 Massuet refers this to the Roman emperor.\n\n\nmaintain that they themselves indeed, who dwell upon the earth, know Him who is God\nover all whom they have never seen, but will not allow Him who, according to their opinion,\nformed them and the whole world, although He dwells in the heights and above the heavens,\nto know those things with which they themselves, though they dwell below, are acquainted.\n[This is the case], unless perchance they maintain that Bythus lives in Tartarus below the\nearth, and that on this account they have attained to a knowledge of Him before those angels\nwho have their abode on high. Thus do they rush into such an abyss of madness as to pronounce\nthe Creator of the world void of understanding. They are truly deserving of pity,\nsince with such utter folly they affirm that He (the Creator of the world) neither knew His\nMother, nor her seed, nor the Pleroma of the Æons, nor the Propator, nor what the things\nwere which He made; but that these are images of those things which are within the Pleroma,\nthe Saviour having secretly laboured that they should be so formed [by the unconscious\nDemiurge], in honour of those things which are above.", "lang": "greek", "orig": "", "d": "70-165"}, {"v": 27, "f": "1 Clement", "w": "Chapter VI.—The angels and the Creator of the world could not have been\nignorant of the Supreme God.", "t": "For it will appear truly ridiculous, if they\n365 Matt. xi. 27.\n366 Massuet refers this to the Roman emperor.\n\n\nmaintain that they themselves indeed, who dwell upon the earth, know Him who is God\nover all whom they have never seen, but will not allow Him who, ac", "lang": "greek", "orig": "", "d": "70-165"}, {"v": 27, "f": "1 Clement", "w": "Chapter LXIII.—How God appeared to Moses.", "t": "And all the Jews even now teach that the nameless God spake to Moses; whence the\nSpirit of prophecy, accusing them by Isaiah the prophet mentioned above, said “The ox\nknoweth his owner, and the ass his master’s crib; but Israel doth not know Me, and My\npeople do not understand.”134 And Jesus the Christ, because the Jews knew not what the\nFather was, and what the Son, in like manner accused them; and Himself said, “No one\nknoweth the Father, but the Son; nor the Son, but the Father, and they to whom the Son\nrevealeth Him.”135 Now the Word of God is His Son, as we have before said. And He is\ncalled Angel and Apostle; for He declares whatever we ought to know, and is sent forth to\ndeclare whatever is revealed; as our Lord Himself says, “He that heareth Me, heareth Him\nthat sent Me.”136 From the writings of Moses also this will be manifest; for thus it is written\nin them, “And the Angel of God spake to Moses, in a flame of fire out of the bush, and said,\nI am that I am, the God of Abraham, the God of Isaac, the God of Jacob, the God of thy\nfathers; go down into Egypt, and bring forth My people.”137 And if you wish to learn what\nfollows, you can do so from the same writings; for it is impossible to relate the whole here.\nBut so much is written for the sake of proving that Jesus the Christ is the Son of God and\nHis Apostle, being of old the Word, and appearing sometimes in the form of fire, and\nsometimes in the likeness of angels; but now, by the will of God, having become man for\n", "lang": "greek", "orig": "", "d": "70-165"}, {"v": 27, "f": "1 Clement", "w": "Chapter C.—In what sense Christ is [called] Jacob, and Israel, and Son of Man.", "t": "“Then what follows —‘But Thou, the praise of Israel, inhabitest the holy place’—declared\nthat He is to do something worthy of praise and wonderment, being about to rise again\nfrom the dead on the third day after the crucifixion; and this He has obtained from the\nFather. For I have showed already that Christ is called both Jacob and Israel; and I have\nproved that it is not in the blessing of Joseph and Judah alone that what relates to Him was\nproclaimed mysteriously, but also in the Gospel it is written that He said: ‘All things are\ndelivered unto me by My Father;’ and, ‘No man knoweth the Father but the Son; nor the\nSon but the Father, and they to whom the Son will reveal Him.’564 Accordingly He revealed\nto us all that we have perceived by His grace out of the Scriptures, so that we know Him to\nbe the first-begotten of God, and to be before all creatures; likewise to be the Son of the\npatriarchs, since He assumed flesh by the Virgin of their family, and submitted to become\na man without comeliness, dishonoured, and subject to suffering. Hence, also, among His\nwords He said, when He was discoursing about His future sufferings: ‘The Son of man must\nsuffer many things, and be rejected by the Pharisees and Scribes, and be crucified, and on\nthe third day rise again.’565 He said then that He was the Son of man, either because of His\nbirth by the Virgin, who was, as I said, of the family of David,566 and Jacob, and Isaac, and\nAbraham; or because Adam567 was the father both of Himsel", "lang": "greek", "orig": "", "d": "70-165"}, {"v": 27, "f": "1 Clement", "w": "Chapter VI.—Explanation of the words of Christ, “No man knoweth the Father,\nbut the Son,” etc.; which words the heretics misinterpret. Proof that, by the\nFather revealing the Son, and by the Son being revealed, the Father was never\nunknown.", "t": "3. For no one can know the Father, unless through the Word of God, that is, unless by\nthe Son revealing [Him]; neither can he have knowledge of the Son, unless through the good\npleasure of the Father. But the Son performs the good pleasure of the Father; for the Father\nsends, and the Son is sent, and comes. And His Word knows that His Father is, as far as regards\nus, invisible and infinite; and since He cannot be declared [by any one else], He does\nHimself declare Him to us; and, on the other hand, it is the Father alone who knows His\nown Word. And both these truths has our Lord declared. Wherefore the Son reveals the\nknowledge of the Father through His own manifestation. For the manifestation of the Son\nis the knowledge of the Father; for all things are manifested through the Word. In order,\ntherefore, that we might know that the Son who came is He who imparts to those believing\non Him a knowledge of the Father, He said to His disciples:1212 “No man knoweth the Son\nbut the Father, nor the Father but the Son, and those to whomsoever the Son shall reveal\nHim;” thus setting Himself forth and the Father as He [really] is, that we may not receive\nany other Father, except Him who is revealed by the Son.", "lang": "greek", "orig": "", "d": "70-165"}, {"v": 27, "f": "Athanasius - Select Works", "w": "Chapter 16.—Harmony of the Old and New Testaments.", "t": "of Wisdom.\"\n70 Wisd. viii. 3.\n71 1 Cor. i. 24.\n72 Matt. xi. 27.\n73 Wisd. ix. 9.\n74 Heb. i. 3.\n75 Ps. lxxxix. 8.\n76 John xiv. 6.\n77 Wisd. ix. 17-19.\n78 Rom. v. 5.\n79 Wisd. i. 5.\n\n\nFor where there is guile there is no love. Paul says that we are \"conformed to the", "lang": "greek", "orig": "", "d": "296-373"}, {"v": 27, "f": "Augustine - City of God", "w": "Tractate XIX.", "t": "3. “For the Father loveth the Son, and showeth Him all things that Himself doeth.” To\nthat which He said above, “except what He seeth the Father doing,” seems to belong this\nalso, “He showeth Him all things that Himself doeth.” But if the Father doth show what He\ndoeth, and the Son cannot do except the Father hath shown, and if the Father cannot show\n\n\nunless He hath done, it will follow that it is not through the Son that the Father doeth all\nthings; moreover, if we hold it fixed and unshaken, that the Father doeth all by the Son, then\nHe shows the Son before He doeth. For if the Father doth show to the Son after He has done,\nthat the Son may do the things shown, which being shown were already done, then doubtless\nsomething there is that the Father doeth without the Son. But the Father doeth not anything\nwithout the Son, because the Son of God is God’s Word, and all things were made by Him.\nIt remains, then, that possibly what the Father is about to do, He shows as about to be done,\nthat it may be done by the Son. For if the Son doeth those things which the Father showeth\nas already done, surely it is not by the Son that the Father hath done the things which He\nthus showeth. For they could not be shown to the Son unless they were first done, and the\nSon would not be able to do them unless they were first shown; therefore were they made\nwithout the Son. But yet it is a true thing, “All things were made by Him;” therefore they\nwere shown before they were made. But this we said", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 27, "f": "Augustine of Hippo", "w": "", "t": "(cont. Maximin. ii. 12.) For if He has aught less in His power than the Father has, then all that the Father has, are not His; for by begetting Him the Father gave power to the Son, as by begetting Him He gave all things which He has in His substance to Him whom He begot of His substance.\n\n(De Trin. i. 8.) And because their substance is inseparable, it is enough sometimes to name the Father, sometimes the Son, nor is it possible to separate from either His Spirit, who is especially called the Spirit of truth.\n\n(De Trin. vii. 3.) The Father is revealed by the Son, that is, by His Word. For if the temporal and transitory word which we utter both shows itself, and what we wish to convey, how much more the Word of God by which all things were made, which so shows the Father as He is Father, because itself is the same and in the same manner as the Father.\n\n(Quæst. Ev. i. 1.) When He said, None knoweth the Son but the Father, He did not add, And he to whom the Father will reveal the Son. But when He said, None knoweth the Father but the Son, He added, And he to whom the Son will reveal him. But this must not be so understood as though the Son could be known by none but by the Father only; while the Father may be known not only by the Son, but also by those to whom the Son shall reveal Him. But it is rather expressed thus, that we may understand that both the Father and the Son Himself are revealed by the Son, inasmuch as He is the light of our mind; and what is afterwards added, An", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 27, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Homily XV.", "t": "“No man hath seen God at any time; the Only-begotten Son, which is in the bosom of the\nFather, He hath declared Him.”", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 27, "f": "Clement of Alexandria", "w": "", "t": "But \"no one is good,\" except His Father. It is this same Father of His, then who being one is manifested by many powers. And this was the import of the utterance, \"No man knew the Father,\" who was Himself everything before the coming of the Son. So that it is veritably clear that the God of all is only one good, just Creator, and the Son in the Father, to whom be glory for ever and ever, Amen.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 27, "f": "Cyril of Alexandria", "w": "", "t": "The one who sees the Son, who has the image of the Father in himself, sees the Father himself.… These things are to be understood in a manner befitting to God. He said, “Everything has been handed down to me” so that he might not seem to be a member of a different species or inferior to the Father. Jesus added this in order to show that his nature is ineffable and inconceivable, like the Father’s. For only the divine nature of the Trinity comprehends itself. Only the Father knows his own Son, the fruit of his own substance. Only the divine Son recognizes the One by whom he has been begotten. Only the Holy Spirit knows the deep things of God, the thought of the Father and the Son.", "lang": "english", "orig": "", "d": "c. 430"}, {"v": 27, "f": "Gregory Thaumaturgus", "w": "From the Second Book.", "t": "8. The individual names uttered by me can neither be separated from one another, nor\nparted.729 I spoke of the Father, and before I made mention of the Son I already signified\nHim in the Father. I added the Son; and the Father, even although I had not previously\nnamed Him, had already been absolutely comprehended in the Son. I added the Holy Spirit;\nbut, at the same time, I conveyed under the name whence and by whom He proceeded. But\nthey are ignorant that neither the Father, in that He is Father, can be separated from the\nSon, for that name is the evident ground of coherence and conjunction; nor can the Son be\nseparated from the Father, for this word Father indicates association between them. And\nthere is, moreover, evident a Spirit who can neither be disjoined from Him who sends, nor\nfrom Him who brings Him. How, then, should I who use such names think that these are\nabsolutely divided and separated the one from the other?\nAfter a few words he adds:—", "lang": "greek", "orig": "", "d": "205-280"}, {"v": 27, "f": "Gregory Thaumaturgus", "w": "I.1252", "t": "The substance1253 of the Son is not a substance devised extraneously,1254 nor is it one\nintroduced out of nothing;1255 but it was born of the substance of the Father, as the reflection\nof light or as the steam of water. For the reflection is not the sun itself, and the steam is not\nthe water itself, nor yet again is it anything alien; neither is He Himself the Father, nor is He\nalien, but He is1256 an emanation1257 from the substance of the Father, this substance of\nthe Father suffering the while no partition. For as the sun remains the same and suffers no\ndiminution from the rays that are poured out by it, so neither did the substance of the\nFather undergo any change in having the Son as an image of itself.", "lang": "greek", "orig": "", "d": "205-280"}, {"v": 27, "f": "Hilary of Poitiers", "w": "", "t": "Or that we may not think that there is any thing less in Him than in God, therefore He says this.\n\nAnd also in the mutual knowledge between the Father and the Son, He teaches us that there is nothing in the Son beyond what was in the Father, for it follows, And none knoweth the Son but the Father, nor does any man know the Father but the Son.\n\nFor this mutual knowledge proclaims that they are of one substance, since He that should know the Son, should know the Father also in the Son, since all things were delivered to Him by the Father.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 27, "f": "Hilary of Poitiers", "w": "", "t": "So that it might not be supposed that anything in him is less than what is in God, Jesus said that everything was entrusted to him by his Father, that he alone was known to his Father and that his Father was known to him alone or to one to whom he himself had wished to reveal his Father. By this revelation Jesus showed that the same essence of both Father and Son existed in their knowledge of each other. One who could know the Son would also know the Father in his Son, because everything was handed down to him from the Father. Moreover, nothing else was handed down than what was known to the Father in the Son alone, but the things that belonged to the Father were known to be revealed in the Son alone. Thus in this mystery of mutual knowledge it is understood that nothing else existed in the Son than what was known to be in the Father.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 27, "f": "Irenaeus", "w": "CHAPTER XXVIII.—THE FOURFOLD DIVISION OF THE MOSAIC LAW.", "t": "l know whether he be a god or a man.”—Homer.\n1287 Matt. xi. 27.\n\nmystery: “As I wrote afore in few words, according as ye are able to understand my knowledge\nin the mystery of Christ.”1288 “According as ye are able,” he said, since he knew that some\nhad received", "lang": "greek", "orig": "", "d": "130-200"}, {"v": 27, "f": "Jerome", "w": "", "t": "For if we conceive of this thing according to our weakness, when he who receives begins to have, he who gives begins to be without. Or when He says, All things are committed to him, He may mean, not the heaven and earth and the elements, and the rest of the things which He created and made, but those who through the Son have access to the Father.\n\nLet the heretic Eunomius therefore blush hereat who claims to himself such a knowledge of the Father and the Son, as they have one of anothera. But if he argues from what follows, and props up his madness by that, And he to whom the Son will reveal him, it is one thing to know what you know by equality with God, another to know it by His vouchsafing to reveal it.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 27, "f": "Jerome", "w": "", "t": "The Father entrusts. The Son receives. What is entrusted? All things have been entrusted to the Son, but this does not mean cosmically heaven and earth and the elements and the rest of nature which God himself made and established. Rather, it refers personally to the people who have access to the Father through the Son and who were formerly rebellious but afterward began to know God.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 27, "f": "Jerome", "w": "", "t": "(Verse 27.) Everything has been handed over to me by my Father. And understand mystically the One who hands over the Father and the One who receives the Son. Otherwise, if we want to feel according to our weakness, when the one receiving starts to have, the one giving will start to not have. However, everything that has been handed over to Him does not mean the heavens and the earth, and the elements, and the rest that He Himself made and created: but those who, through the Son, have access to the Father, and who previously were rebellious, began to feel God afterwards.\n\n\n\nAnd no one knows the Son except the Father, nor does anyone know the Father except the Son, and the one to whom the Son wills to reveal. Let Eunomius be ashamed of claiming to have such knowledge of the Father and the Son as they have of each other. But if he persists in this and consoles himself in his madness because it follows, and the one to whom the Son wills to reveal. It is one thing to know by the equality of nature what you know, and another by the dignity of the revealer.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 27, "f": "John Chrysostom", "w": "", "t": "For since He had said, \"I thank Thee, because Thou hast hid them, and hast revealed them unto babes;\" to hinder thy supposing that as being Himself deprived of this power, and unable to effect it, so He offers thanks, He saith, \"All things are delivered unto me of my Father.\" And to them that are rejoicing, because the devils obey them, \"Nay, why marvel,\" saith He. \"that devils yield to you? All things are mine; All things are delivered unto me.\"\n\nBut when thou hearest, \"they are delivered,\" do not surmise anything human. For He uses this expression, to prevent thine imagining two unoriginate Gods. Since, that He was at the same time both begotten, and Lord of all, He declares in many ways, and in other places also.\n\nThen He saith what is even greater than this, lifting up thy mind; \"And no man knoweth the Son, but the Father; neither knoweth any man the Father, but the Son.\" Which seems indeed to the ignorant unconnected with what went before, but hath full accordance therewith. As thus: having said, \"All things are delivered unto me of my Father,\" He adds, \"And what marvel,\" so He speaks, \"if I be Lord of all? I who have also another greater privilege, the knowing the Father, and being of the same substance.\" Yea, for this too He covertly signifies by His being the only one who so knew Him. For this is His meaning, when He saith, \"No man knoweth the Father but the Son.\"\n\nAnd see at what time He saith this. When they by His works had received the certain proof of His might, ", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 27, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But when He says, Neither knows any man the Father, save the Son, He means not this, that all men were ignorant of Him, but that with the knowledge wherewith He knows  Him, no man is acquainted with Him; which may be said of the Son too.  For it was not of some God unknown, and revealed to no man, that He was so speaking, as Marcion says; but it is the perfection of knowledge that He is here intimating, since neither do we know the Son as He should be known; and this very thing, to add no more, Paul was declaring, when he said, We know in part, and we prophesy in part. 1 Corinthians 13:9", "lang": "", "orig": "", "d": "c. 388"}, {"v": 27, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Do you see how the Father reveals the Son, how the Son the Father? For neither knows any man the Father, says He, save the Son, and he to whomsoever the Son will reveal Him.  It cannot therefore be that one should learn the Son of any other than of the Father; neither that one should learn the Father of any other than of the Son. So that even hereby, their sameness of honor and of substance is manifest.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 27, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "3. Then because He had said, Of my Father, in order that He might show that it is Himself that gives, and not He who begot Him only, He added, For wheresoever two or three are gathered together in my name, there am I in the midst of them.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 27, "f": "Tertullian", "w": "", "t": "Since the Lord Jesus Christ sent the apostles to preach, (our rule is) that no others ought to be received as preachers than those whom Christ appointed; for \"no man knoweth the Father save the Son, and he to whomsoever the Son will reveal Him.\" Nor does the Son seem to have revealed Him to any other than the apostles, whom He sent forth to preach-that, of course, which He revealed to them.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 27, "f": "Tertullian", "w": "", "t": "With regard, however, to the Father, the very gospel which is common to us will testify that He was never visible, according to the word of Christ: \"No man knoweth the Father, save the Son.\" For even in the Old Testament He had declared, \"No man shall see me, and live.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 27, "f": "Tertullian", "w": "", "t": "With us, however, the Son alone knows the Father, and has Himself unfolded \"the Father's bosom.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 27, "f": "Tertullian", "w": "", "t": "Wherefore? Because \"I came forth from the Father, and am come into the world\" and, \"I am the way: no man cometh unto the Father, but by me; \" and, \"No man can come to me, except the Father draw him; \" and, \"All things are delivered unto me by the Father; \" and, \"As the Father quickeneth (the dead), so also doth the Son; \" and again, \"If ye had known me, ye would have known the Father also.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 27, "f": "Tertullian", "w": "", "t": "He exults in spirit when He says to the Father, \"I thank Thee, O Father, because Thou hast hid these things from the wise and prudent.\" He, moreover, affirms also that to no man is the Father known, but to His Son; and promises that, as the Son of the Father, He will confess those who confess Him, and deny those who deny Him, before His Father.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 27, "f": "Tertullian (cont)", "w": "Chapter LXXI.", "t": "Jesus taught us who it was that sent Him, in the words, “None knoweth the Father but\nthe Son;”3398 and in these, “No man hath seen God at any time; the only-begotten Son, who\nis in the bosom of the Father, He hath declared Him.”3399 He, treating of Deity, stated to\nHis true disciples the doctrine regarding God; and we, discovering traces of such teaching\nin the Scripture narratives, take occasion from such to aid our theological conceptions,3400\nhearing it declared in one passage, that “God is light, and in Him there is no darkness at\nall;”3401 and in another, “God is a Spirit, and they that worship Him must worship Him in\nspirit and in truth.”3402 But the purposes for which the Father sent Him are innumerable;\nand these any one may ascertain who chooses, partly from the prophets who prophesied of\nHim, and partly from the narratives of the evangelists. And not a few things also will he\nlearn from the apostles, and especially from Paul. Moreover, those who are pious He\nleadeth to the light, and those who sin He will punish,—a circumstance which Celsus not\nobserving, has represented Him “as one who will lead the pious to the light, and who will\nhave mercy on others, whether they sin or repent.”3403", "lang": "latin", "orig": "", "d": "185-254"}, {"v": 27, "f": "Theophylact of Ohrid", "w": "", "t": "In His preceding words, He said to the Father, \"Father, Thou hast revealed.\" Lest you think that He Himself does nothing and that everything is of the Father, He says, \"All things have been given to Me and both the Father and I have the same authority.\" And when you hear \"given\" do not think that means given as to a servant or a subordinate, but rather as bestowed upon a son. It is because He was begotten of the Father that those things were given to Him. For if He were not begotten and yet were of the same essence as the Father, those things need not have been given to Him because He would have already possessed them. See what He says: all things have been given, not by a master, but by My Father. As, for example, when a handsome child is born of a handsome father, the child says, \"I have been given, that is, I have inherited, my father's beauty.\" He says something great, \"There is nothing marvelous in My being the Master of all things since I possess something even greater, that is, to know the Father, and knowing Him, to reveal Him to others.\" Consider, then: He said, above, that the Father has revealed the mysteries to babes, and here, that the Son reveals the Father. You see, then, the single power of the Father and the Son, since both the Father and the Son reveal.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 27, "f": "Thomas Aquinas", "w": "", "t": "All things have been delivered to me by my Father. He had given thanks to the Father, because he revealed his secrets to little ones. But someone might suppose that he himself could not reveal; hence he excludes this: first, he touches on the greatness of his own power; secondly, he invites people to himself, as though saying, \"I am powerful\" (v. 28).\n\nFirst, he does two things: first, he states that he is equal to the Father; secondly, he applies it spiritually to what he said (v. 27b).\n\nHe says, therefore: Someone could ask whether he can do all things. He answers that all things have been delivered to me by my Father. But note the equality, although the origin is from the Father, which is against Sabellius. But what is meant by all things? This can be explained in three ways:\n\nAll things, i.e., above every creature, as below (28:18): \"All authority in heaven and on earth has been given to me.\"\nOr all things, i.e., the elect and predestined, who have been given in a special way: \"Yours they were and you have given them to me\" (Jn 17:6).\nLikewise, all things, namely, intrinsic, i.e., every perfection of the godhead: \"As the Father has life in himself, so he has given to the Son to have life in himself\" (Jn 5:26). And we should not understand this in a bodily sense, because if he gave, he also kept it for himself. This explanation is Augustine's and Hilary's.\n\nBut someone could ask: How did he give? Therefore, he tells how, when he says, from my Father. Hence he received this", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 27, "f": "npnf204", "w": "Introduction to In Illud ‘Omnia,’ Etc.", "t": "ly to the\nArian argument founded upon Luke x. 22 (Matt. xi. 27). If ‘all things’ had been delivered\nto the Son by the Father, it would follow that once He was without them. Now ‘all things’\ninclude His Divine Sonship. Therefore there was a time when the Son was", "lang": "greek", "orig": "", "d": ""}, {"v": 27, "f": "npnf204", "w": "Chapter VI.—Authorities in Support of the Council. Theognostus; Dionysius of Alexandria;\nDionysius of Rome; Origen.", "t": "“The essence of the Son is not one procured from without, nor accruing out of nothing923,\nbut it sprang from the Father’s essence, as the radiance of light, as the vapour924 of\nwater; for neither the radiance, nor the vapour, is the water itself or the sun itself, nor is it\nalien; but it is an effluence of the Father’s essence, which, however, suffers no partition. For\nas the sun remains the same, and is not impaired by the rays poured forth by it, so neither\ndoes the Father’s essence suffer change, though it has the Son as an Image of Itself925.”", "lang": "greek", "orig": "", "d": ""}, {"v": 27, "f": "npnf205", "w": "§32. His dictum that ‘the manner of the likeness must follow the manner of the generation’ is\nunintelligible.", "t": "le on every occasion, where he can insult our\n166 Matt. xi. 27.\n\n\ndevout and God-adoring conceptions of the Son", "lang": "greek", "orig": "", "d": ""}, {"v": 27, "f": "npnf209", "w": "Chapter I.—That the Deity is incomprehensible, and that we ought not to pry into and meddle\nwith the things which have not been delivered to us by the holy Prophets, and Apostles,\nand Evangelists.", "t": "nable1413 to\n1406 St. John i. 18 (R.V.).\n1407 St. Matt. xi. 27.\n1408 1 Cor. ii. 11.\n1409 Wisd. xiii. 5.\n1410 Greg. Naz., Orat. 34.\n1411 Dionys., De div. nom., c. 1.\n1412 Greg. Naz., Orat. 34.\n1413 Reading ὃπερ δε οὐκ ἐδυνάμεθα for ὃπερ δὲ οὖν ἐδυνάμεθα. Cod. Reg", "lang": "greek", "orig": "", "d": ""}, {"v": 28, "f": "Augustine - Confessions", "w": "Sermon XX.", "t": "Again on the words of the Gospel, Matt. xi. 28, “Come unto me, all ye that labour and are\nheavy laden, and I will give you rest,” etc.", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 28, "f": "Augustine - Confessions", "w": "Sermon XIX.", "t": "very God, the Supreme\n2306 Matt. xi. 25–27.\n2307 Matt. xi. 28.\n2308 Spatia.\n2309 Matt. xi. 29.\n\n\nGod. For this is good, to see Him who seeth. For they who worship false gods, see them\neasily; but they see them “who have eyes and see not.” But to us is promised", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 28, "f": "Augustine of Hippo", "w": "", "t": "Whence do we all thus labour, but that we are mortal men, bearing vessels of clay which cause us much difficulty. But if the vessels of flesh are straitened, the regions of love will be enlarged. To what end then does He say, Come unto me, all ye that labour, but that ye should not labour?", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 28, "f": "CS Lewis", "w": "", "t": "As to the other one, about the burden of our sins being intolerable, it might be clearer if we said 'unbearable', because that still has two meanings: you say 'I cannot bear it,' when you mean it gives you great pain, but you also say 'That bridge will not bear that truck' — not meaning 'That bridge will feel pain,' but 'If that truck goes on to it, it will break and not be a bridge any longer, but a mass of rubble.' I wonder if that is what the Prayer Book means; that, whether we feel miserable or not, and however we feel, there is on each of us a load which, if nothing is done about it, will in fact break us, will send us from this world to whatever happens afterwards, not as souls but as broken souls.", "lang": "english", "orig": "", "d": "1942"}, {"v": 28, "f": "CS Lewis", "w": "", "t": "It would be a bold and silly creature that came before its Creator with the boast \"I'm no beggar. I love you disinterestedly\". Those who come nearest to a Gift-love for God will next moment, even at the very same moment, be beating their breasts with the publican and laying their indigence before the only real Giver. And God will have it so. He addresses our Need-love: \"Come unto me all ye that travail and are heavy-laden,\" or, in the Old Testament, \"Open your mouth wide and I will fill it.\"", "lang": "english", "orig": "", "d": "1942"}, {"v": 28, "f": "Chrysostom - Homilies on Matthew", "w": "Letter II.", "t": "n. iii. 12.\n312 Heb. iv. 13.\n313 Heb. iv. 12.\n314 Matt. xi. 28.\n\n\nsubjected to the wrath of the populace and to the irrational impulses of the multitude, and\nto the fear of higher rulers, and to anxieties on behalf of those who are ruled, and the ruler\nof yester", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 28, "f": "Cyril of Alexandria", "w": "", "t": "Stand apart from the inclination to love sin and to love the flesh. Turn to deeds worthy of praise. Draw near to me, so that you may become sharers of the divine nature and partakers of the Holy Spirit. Jesus called everyone, not only the people of Israel. As the Maker and Lord of all, he spoke to the weary Jews who did not have the strength to bear the yoke of the law. He spoke to idolaters heavy laden and oppressed by the devil and weighed down by the multitude of their sins. To Jews he said, “Obtain the profit of my coming to you. Bow down to the truth. Acknowledge your Advocate and Lord. I set you free from bondage under the law, bondage in which you endured a great deal of toil and hardship, unable to accomplish it easily and accumulating for yourselves a very great burden of sins.”", "lang": "english", "orig": "", "d": "c. 430"}, {"v": 28, "f": "Eusebius - Church History", "w": "Chap. XII.", "t": "e observandum præcipitur.\n1794 Ps. xlvi. 11.\n1795 Matt. xi. 28, 29.\n1796 Ex. xx. 1–17; Deut. v. 6–21.\n\n\nobserved. But we are not commanded to observe the day of the Sabbath literally, in resting\nfrom bodily labour, as it is observed by the Jews; and even", "lang": "greek", "orig": "", "d": "260-340"}, {"v": 28, "f": "Gregory the Dialogist", "w": "", "t": "(Mor. xxx. 15.) For a cruel yoke and hard weight of servitude it is to be subject to the things of time, to be ambitious of the things of earth, to cling to falling things, to seek to stand in things that stand not, to desire things that pass away, but to be unwilling to pass away with them. For while all things fly away against our wish, those things which had first harassed the mind in desire of gaining them, now oppress it with fear of losing them.", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 28, "f": "Hilary of Poitiers", "w": "", "t": "He calls to Him those that were labouring under the hardships of the Law, and those who are burdened with the sins of this world.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 28, "f": "Irenaeus", "w": "CHAPTER V.—HE PROVES BY SEVERAL EXAMPLES THAT THE GREEKS DREW FROM THE SACRED\nWRITERS.", "t": "riting.\n1356 Matt. xix. 24.\n1357 Matt. v. 3.\n1358 Matt. xi. 28–30.\n1359 John viii. 32–36.\n1360 Isa. liii. 3. [That is after he became the Man of Sorrows; not originally.]\n\n\nlaws, have an eye to the greatest virtue. Such is fidelity,”1361 which we need at all tim", "lang": "greek", "orig": "", "d": "130-200"}, {"v": 28, "f": "Irenaeus", "w": "CHAPTER X.—THAT THE SAME GOD, BY THE SAME WORD, RESTRAINS FROM SIN BY THREATENING,\nAND SAVES HUMANITY BY EXHORTING.", "t": "By encouragement He assuages sins, reducing lust, and at the same time inspiring hope\nfor salvation. For He says by Ezekiel, “If ye return with your whole heart, and say, Father, I\nwill hear you, as a holy people.”427 And again He says, “Come all to Me, who labour, and\nare heavy laden, and I will give you rest;”428 and that which is added the Lord speaks in His\nown person. And very clearly He calls to goodness by Solomon, when He says, “Blessed is\nthe man who hath found wisdom, and the mortal who hath found understanding.”429 “For\nthe good is found by him who seeks it, and is wont to be seen by him who has found it.”430\nBy Jeremiah, too, He sets forth prudence, when he says, “Blessed are we, Israel; for what is\npleasing to God is known by us;431—and it is known by the Word, by whom we are blessed\nand wise. For wisdom and knowledge are mentioned by the same prophet, when he says,\n“Hear, O Israel, the commandments of life, and give ear to know understanding.”432 By\nMoses, too, by reason of the love He has to man, He promises a gift to those who hasten to\nsalvation. For He says, “And I will bring you into the good land, which the Lord sware to\nyour fathers.”433 And further, “And I will bring you into the holy mountain, and make you\nglad,”434 He says by Isaiah. And still another form of instruction is benediction. “And blessed\nis he,” He saith by David, “who has not sinned; and he shall be as the tree planted near the\nchannels of the waters, which will yield its fruit in its seas", "lang": "greek", "orig": "", "d": "130-200"}, {"v": 28, "f": "Jerome", "w": "", "t": "(Verse 28, 29.) Come to me, all you who labor and are burdened, and I will refresh you. Take my yoke upon you and learn from me, for I am meek and humble of heart, and you will find rest for your souls. The weight of sin is heavy, and the prophet Zacharias testifies, saying, iniquity sits upon a talent of lead (Zacch. 5). And the Psalmist laments: My iniquities have overwhelmed me (Psalm 38:4). Certainly, it invites those who were oppressed under the heavy yoke of the Law to the grace of the Gospel.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 28, "f": "Jerome", "w": "", "t": "That the burden of sin is heavy the Prophet Zachariah bears witness, saying, that wickedness sitteth upon a talent of lead. (Zech. 5:7.) And the Psalmist fills it up, Thy iniquities are grown heavy upon me. (Ps. 38:4)", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 28, "f": "John Chrysostom", "w": "", "t": "Next, having brought them by His words to an earnest desire, and having signified His unspeakable power, He after that invites them, saying. \"Come unto me, all ye that labor and are heavy laden, and I will give you rest.\" Not this or that person, but all that are in anxiety, in sorrows, in sins. Come, not that I may call you to account, but that I may do away your sins; come, not that I want your honor, but that I want your salvation. \"For I,\" saith He, \"will give you rest.\" He said not, \"I will save you,\" only; but what was much more, \"I will place you in all security.\"", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 28, "f": "John Chrysostom", "w": "", "t": "\"Take my yoke upon you, and learn of me, for I am meek and lowly in heart; and ye shall find rest unto your souls. For my yoke is easy, and my burden is light.\" Thus, \"be not afraid,\" saith He, \"hearing of a yoke, for it is easy: fear not, because I said, 'a burden,' for it is light.\"\n\nAnd how said He before, \"The gate is narrow and the way strait?\" Whilst thou art careless, whilst thou art supine; whereas, if thou duly perform His words, the burden will be light; wherefore also He hath now called it so.\n\nBut how are they duly performed? If thou art become lowly, and meek, and gentle. For this virtue is the mother of all strictness of life. Wherefore also, when beginning those divine laws, with this He began. And here again He doeth the very same, and exceeding great is the reward He appoints. \"For not to another only dost thou become serviceable; but thyself also above all thou refreshest,\" saith He. \"For ye shall find rest unto your souls.\"\n\nEven before the things to come, He gives thee here thy recompense, and bestows the prize already, making the saying acceptable, both hereby, and by setting Himself forward as an example. For, \"Of what art thou afraid?\" saith He, \"lest thou shouldest be a loser by thy low estate? Look to me, and to all that is mine; learn of me, and then shalt thou know distinctly how great thy blessing.\" Seest thou how in all ways He is leading them to humility? By His own doings: \"Learn of me, for I am meek.\" By what themselves are to gain; for, \"Ye sh", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 28, "f": "John Chrysostom", "w": "", "t": "But whatever I may say, my speech will present no such proof as the actual trial. Wherefore I would there were present here with us some one of those who have attained unto that summit of self-restraint, and then you would know assuredly the delight thereof; and that none of those that are enamored of voluntary poverty would accept wealth, though ten thousand were to offer it.\n\nBut would these, say you, ever consent to become poor, and to cast away the anxieties which they have? And what of that? This is but a proof of their madness and grievous disease, not of anything very pleasurable in the thing. And this even themselves would testify to us, who are daily lamenting over these their anxieties, and accounting their life to be not worth living. But not so those others; rather they laugh, leap for joy, and the wearers of the diadem do not so glory, as they do in their poverty.\n\nAgain, to turn the cheek is, to him that gives heed, a less grievous thing than to smite another; for from this the contest hath beginning, in that termination: and whereas by the former thou hast kindled the other's pile too, by the latter thou hast quenched even thine own flames. But that not to be burnt is a pleasanter thing than to be burnt, surely plain to every man. And if this hold in regard of bodies, much more in a soul.\n\nAnd whether is lighter, to contend, or to be crowned? to fight, or to have the prize? and to endure waves, or to run into harbor? Therefore also, to die is better than to liv", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 28, "f": "Rabanus Maurus", "w": "", "t": "(non occ.) I will not only take from you your burden, but will satisfy you with inward refreshment.", "lang": "english", "orig": "", "d": "c. 840"}, {"v": 28, "f": "Remigius of Rheims", "w": "", "t": "Come, He says, not with the feet, but with the life, not in the body, but in faith. For that is a spiritual approach by which any man approaches God; and therefore it follows, Take my yoke upon you.", "lang": "english", "orig": "", "d": "c. 900"}, {"v": 28, "f": "Symeon the New Theologian", "w": "", "t": "We are naturally obliged to state our opinion clearly to such people, and to reply: O, you! Why do you reason to your own perdition rather than your salvation? And why do you pick out for yourselves the obscure passages of inspired Scripture and then tear them out of context and twist them in order to accomplish your own destruction? Do you not hear the Savior crying out every day: “As I live … I have no pleasure in the death of the wicked, but that the wicked turn from his way and live” [Ezekiel 33:11]? Do you not hear Him Who says: “Repent, for the Kingdom of Heaven is at hand” [Matthew 3:2]; and again: “Just so, I tell you, there is joy in heaven over one sinner who repents” (Luke 15:7, adapted)? Did He ever say to some: “Do not repent for I will not accept you,” while to others who were predestined: “But you, repent! because I knew you beforehand”? Of course not! Instead, throughout the world and in every church He shouts: “Come to Me, all who labor and are heavy laden, and I will give you rest” (Matthew 11:28). Come, He says, all you who are burdened with many sins, to the One Who takes away the sin of the world; come all who thirst to the fountain which flows and never dies. - \"Second Ethical Discourse\"", "lang": "english", "orig": "", "d": "c. 1020"}, {"v": 28, "f": "Tertullian (cont)", "w": "Chapter LXXIII.", "t": "The Jew proceeds, after this, to state as a consequence what does not follow from the\npremises; for it does not follow from “His having wished, by the punishments which He\nunderwent, to teach us also to despise death,” that after His resurrection He should openly\nsummon all men to the light, and instruct them in the object of His coming. For He had\nformerly summoned all men to the light in the words, “Come unto Me, all ye that labour\nand are heavy laden, and I will give you rest.”3406 And the object of His coming had been\nexplained at great length in His discourses on the beatitudes, and in the announcements\nwhich followed them, and in the parables, and in His conversations with the scribes and\nPharisees. And the instruction afforded us by the Gospel of John, shows that the eloquence\nof Jesus consisted not in words, but in deeds; while it is manifest from the Gospel narratives\nthat His speech was “with power,” on which account also they marvelled at Him.", "lang": "latin", "orig": "", "d": "185-254"}, {"v": 28, "f": "Theophylact of Ohrid", "w": "", "t": "He calls all mankind, not only the Jews, but also the Gentiles. By those \"that labour\" understand the Jews, who follow the strict observances of the law and labor in the occupation of fulfilling the commandments of the law. Those who are \"heavy laden\" are the Gentiles, who are oppressed by the burden of sins. To all these does Christ give rest. For to believe, to confess, and to be baptized, what labor is it? Is it not, rather, rest? For here in this life you are unburdened of the things which you did before your baptism, and there in the next life rest awaits you.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 28, "f": "Thomas Aquinas", "w": "", "t": "Come to me, all you... Come to my blessings. First, the invitation; secondly, the need for the invitation; thirdly, its utility. He says, therefore: Come to me. This is also the word of Wisdom: \"Come to me, you who desire me, and eat your fill of my produce\" (Sir 24:19). Hence, draw near to me, you untaught, because I want to communicate myself. But what is the need? Because without me men labor too much: all you who labor. In a special way this can be applied to the Jews, because they labored under the yoke of the Law and commandments, as it says in Acts (15:10): \"This is a burden which neither we nor our fathers have been able to bear.\" Likewise, in general, to all who labor on account of human frailty: \"I am poor and acquainted with labors from my youth\" (Ps 88:15). And are heavy laden, namely, with sins: \"My iniquities weigh like a burden too heavy for me\" (Ps 38:4).\n\nAnd what shall we get, if we come to you? I will give you rest [refresh you]. \"If anyone thirsts, let him come to me and drink\" (Jn 7:37). Then he explains the invitation: first, he explains; secondly, he assigns the reason (v. 30). Having presented the invitation and its purpose, he now wants to explain what that invitation is, when he says, take my yoke upon you. But what is this? You say that you want to refresh us and lift our labor from us, and in the same breath you tell us to carry a yoke? We believed that it would not involve a yoke. Yes, without the yoke of sin: \"For the yoke of his burden, and the ", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 28, "f": "npnf207", "w": "FIRST CATECHETICAL LECTURE\nof\nOur Holy Father Cyril,", "t": ". i. 16.\n460 Ezek. xviii. 31.\n461 Luke xv. 7.\n462 Matt. xi. 28.\n463 Compare xv. 25.\n464 Is. i. 16.\n465 Ps. xxxii. 1. See Procat. 15.\n466 Procat. 1, note 6.\n\n\nyour hands unquenched; that He, who erewhile on this all-holy Golgotha opened Paradise\nto the r", "lang": "greek", "orig": "", "d": ""}, {"v": 28, "f": "npnf210", "w": "CHAPTER I.", "t": "2130 S. Luke xv. 5.\n2131 Eccles. vii. 17.\n2132 S. Matt. xi. 28.\n2133 In order to distinguish themselves from Catholics the Novatians assumed the name καθαροί “pure.”\n2134 Job xiv. 4 [LXX loosely].\n2135 Ps. li. [l.] 2.\n\n\nof the Incarnation, whose descendant is th", "lang": "greek", "orig": "", "d": ""}, {"v": 29, "f": "Augustine - Confessions", "w": "Sermon XIX.", "t": ". xi. 25–27.\n2307 Matt. xi. 28.\n2308 Spatia.\n2309 Matt. xi. 29.\n\n\nGod. For this is good, to see Him who seeth. For they who worship false gods, see them\neasily; but they see them “who have eyes and see not.” But to us is promised the Vision of\nthe Living and the", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 29, "f": "Augustine of Hippo", "w": "", "t": "Not to create a world, or to do miracles in that world; but that I am meek and lowly in heart. Wouldest thou be great? Begin with the least. Wouldest thou build up a mighty fabric of greatness? First think of the foundation of humility; for the mightier building any seeks to raise, the deeper let him dig for his foundation. Whither is the summit of our building to rise? To the sight of God.", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 29, "f": "Augustine of Hippo", "w": "", "t": "You are to \"take my yoke upon you, and learn from me.\" You are not learning from me how to refashion the fabric of the world, nor to create all things visible and invisible, nor to work miracles and raise the dead. Rather, you are simply learning of me: \"that I am meek and lowly in heart.\" If you wish to reach high, then begin at the lowest level. If you are trying to construct some mighty edifice in height, you will begin with the lowest foundation. This is humility. However great the mass of the building you may wish to design or erect, the taller the building is to be, the deeper you will dig the foundation. The building in the course of its erection rises up high, but he who digs its foundation must first go down very low. So then, you see even a building is low before it is high and the tower is raised only after humiliation.", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 29, "f": "CS Lewis", "w": "", "t": "Yet (and this is the strange, significant thing) even His enemies, when they read the Gospels, do not usually get the impression of silliness and conceit. Still less do unprejudiced readers. Christ says that He is 'humble and meek' and we believe Him; not noticing that, if He were merely a man, humility and meekness are the very last characteristics we could attribute to some of His sayings.", "lang": "english", "orig": "", "d": "1942"}, {"v": 29, "f": "Chrysostom - Homilies on Galatians-Philemon", "w": "Homily VI.", "t": "John xv. 20.); and, “Learn of me, for I am\nmeek” (Matt. xi. 29.); and again, “Be ye merciful, as your Father which is in heaven is merciful.”\n(Luke vi. 36.) This too the blessed Paul did; in exhorting them to humility, he brought\nforward Christ. And he does so n", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 29, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Homily LXX.", "t": "Learn of Me,\nfor I am meek and lowly in heart.” ( Matt. xi. 29.) And this He taught, not by words alone,\nbut by actions also. For they called Him a Samaritan, and one that had a devil, and a deceiver,\nand cast stones at Him; and at one time the Pharisees sent se", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 29, "f": "Eusebius - Church History", "w": "Chapter IX.—He Compares the Doctrine of the Platonists Concerning the Λόγος\nWith the Much More Excellent Doctrine of Christianity.", "t": ". ver. 29.\n516 Ps. xxv. 9.\n517 Ibid. ver. 18.\n518 Matt. xi. 29.\n519 Rom. i. 21, 22.\n520 Ibid. i. 23.\n521 In the Benedictine edition we have reference to Augustin’s in Ps. xlvi. 6, where he says: “We find the\nlentile is an Egyptian food, for it abounds in Egypt,", "lang": "greek", "orig": "", "d": "260-340"}, {"v": 29, "f": "Hilary of Poitiers", "w": "", "t": "He holds forth the inducements of a pleasant yoke, and a light burden, that to them that believe He may afford the knowledge of that good which He alone knoweth in the Father.\n\nAnd what is more pleasant than that yoke, what lighter than that burden? To be made better, to abstain from wickedness, to choose the good, and refuse the evil, to love all men, to hate none, to gain eternal things, not to be taken with things present, to be unwilling to do that to another which yourself would be pained to suffer.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 29, "f": "Jerome", "w": "", "t": "[Daniel 4:10] \"'I saw, and behold there was a tree in the midst of the earth, and its height was very great...'\" It was not only of Nebuchadnezzar, King of the Chaldeans, but also of all impious men that the prophet says: \"I beheld the impious man highly exalted and lifted up like the cedars of Lebanon\" (Psalm 37:35). Such men are lifted up, not by the greatness of their virtues, but by their own pride; and for that reason they are cut down and fall into ruin. Therefore it is good to follow the teaching of our Lord in the Gospel: \"Learn of Me, for I am meek and lowly in heart\" (Matthew 11:29). But as for the fact that, according to Theodotion, he mentions his kutos or height - or else his kureia, as he himself later renders it, that is to say, his dominion (a word we have translated as \"his appearance\") - those same detractors of the historicity of this passage slanderously assert that Nebuchadnezzar's dominion never possessed the entire world. He did not rule over the Greeks or barbarians, or over all of the nations in the north and west, but only over the provinces of the East; that is to say, over Asia, not over Europe or Libya. Consequently all these slanders require to be understood as attributable to the devil, for actually we ourselves should accept all this as spoken by way of hyperbole, having in view the arrogance of the impious king, who in Isaiah (chap. 14) makes as great a boast as this, claiming that he possesses the very heaven itself, and the whole earth besid", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 29, "f": "John Chrysostom", "w": "", "t": "Such a spirit as this let us too acquire, and whatever we may suffer we shall bear it easily, and before the Kingdom, we shall reap here the gain accruing from lowliness of mind. Thus \"learn,\" saith He, \"of me, for I am meek and lowly in heart, and ye shall find rest unto your souls.\" Therefore in order that we may enjoy rest both here and hereafter, let us with great diligence implant in our souls the mother of all things that are good, I mean humility. For thus we shall be enabled both to pass over the sea of this life without waves, and to end our voyage in that calm harbor; by the grace and love towards man of our Lord Jesus Christ, to whom be glory and might for ever and ever. Amen.", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 29, "f": "John Chrysostom", "w": "", "t": "Seest thou that everywhere practice is required, and the proof by works? \"For by their fruits,\" saith He, \"ye shall know them.\" And what commends our own life? Is it indeed a display of miracles, or the perfection of an excellent conversation? Very evidently it is the second.\n\nBy practice I mean, not thy fasting, nor yet thy strewing sackcloth and ashes under thee, but if thou despise wealth, as it ought to be despised; if thou be kindly affectioned, if thou give thy bread to the hungry, if thou control anger, if thou cast out vainglory, if thou put away envy. So He Himself used to teach: for, \"Learn of me,\" saith He, \"for I am meek and lowly in heart.\" He did not say, \"for I fasted,\" although surely He might have spoken of the forty days, yet He saith not this; but, \"I am meek and lowly in heart.\"", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 29, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Take my yoke upon you, and learn of me, for I am meek and lowly in heart; and you shall find rest unto your souls. For my yoke is easy, and my burden is light. Matthew 11:29-30 Thus, be not afraid, says He, hearing of a yoke, for it is easy: fear not, because I said, a burden, for it is light.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 29, "f": "Rabanus Maurus", "w": "", "t": "The yoke of Christ is Christ's Gospel, which joins and yokes together Jews and Gentiles in the unity of the faith. This we are commanded to take upon us, that is, to have in honour; lest perchance setting it beneath us, that is wrongly despising it, we should trample upon it with the miry feet of unholiness; wherefore He adds, Learn of me.\n\nWe must learn then from our Saviour to be meek in temper, and lowly in mind; let us hurt none, let us despise none, and the virtues which we have shown in deed let us retain in our heart.", "lang": "english", "orig": "", "d": "c. 840"}, {"v": 29, "f": "Tertullian (cont)", "w": "Chapter VII.", "t": "Moreover, let them show where there is to be found even the appearance of language\ndictated by arrogance3229 and proceeding from Jesus. For how could an arrogant man thus\nexpress himself, “Learn of Me, for I am meek and lowly of heart, and you shall find rest for\nyour souls?”3230 or how can He be styled arrogant, who after supper laid aside His garments\nin the presence of His disciples, and, after girding Himself with a towel, and pouring water\ninto a basin, proceeded to wash the feet of each disciple, and rebuked him who was unwilling\nto allow them to be washed, with the words, “Except I wash thee, thou hast no part with\nMe?”3231 Or how could He be called such who said, “I was amongst you, not as he that\nsitteth at meat, but as he that serveth?”3232 And let any one show what were the falsehoods\nwhich He uttered, and let him point out what are great and what are small falsehoods, that\nhe may prove Jesus to have been guilty of the former. And there is yet another way in which\nwe may confute him. For as one falsehood is not less or more false than another, so one\ntruth is not less or more true than another. And what charges of impiety he has to bring\nagainst Jesus, let the Jew of Celsus especially bring forward. Was it impious to abstain from\ncorporeal circumcision, and from a literal Sabbath, and literal festivals, and literal new\nmoons, and from clean and unclean meats, and to turn the mind to the good and true and\nspiritual law of God, while at the same time he who was an am", "lang": "latin", "orig": "", "d": "185-254"}, {"v": 29, "f": "Theophylact of Ohrid", "w": "", "t": "The yoke of Christ is humility and meekness. For he who humbles himself before all men has rest and remains untroubled; but he who is vainglorious and arrogant is ever encompassed by troubles as he does not wish to be less than anyone but is always thinking how to be esteemed more highly and how to defeat his enemies. Therefore the yoke of Christ, which is humility, is light, for it is easier for our lowly nature to be humbled than to be exalted. But all the commandments of Christ are also called a yoke, and they are light because of the reward to come, even though for a time they appear heavy.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 29, "f": "Thomas Aquinas", "w": "", "t": "Take, therefore, my yoke, namely, the gospel lessons. And he says, yoke, because just as a yoke fastens and joins the necks of oxen, so the doctrine of the gospel fastens the people to its yoke. And what is that? Learn from me, for I am meek and humble of heart. The whole Law consists in two things: meekness and humility. By meekness a man is rightly ordered to his neighbor; hence Psalm 132 (v. 1): \"Remember, O Lord, David and all his meekness.\" By humility he is rightly ordered to himself and to God: \"Upon whom will my spirit rest except on the calm and meek\" (Is 66:2)? Hence humility makes a man capable of God. He had also said, \"and I will refresh you.\" What is this refreshment? You will find rest for your souls. For the body is not refreshed, as long as it is afflicted, and when it is not afflicted any more, it is said to be refreshed. And just as hunger is to the body, so desire is to the mind; hence the achievement of desires is refreshing: \"Who satisfies your desire with good\" (Ps 103:5). And this rest is a rest of the soul: \"I have labored little and found for myself much rest\" (Sir 51:27). The meek are not at rest this way in the world; hence they will find eternal rest, namely, the fulfillment of desires.", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 29, "f": "npnf204", "w": "Letter II.—For 330. Easter-day xxiv Pharmuthi; xiii Kal. Mai; Æra Dioclet. 46; Coss. Gallicianus,\nValerius Symmachus; Præfect, Magninianus; Indict. iii.", "t": "iv. 25.\n3954 Matt. x. 40.\n3955 1 Cor. xi. 1.\n3956 Matt. xi. 29.\n3957 John xiii. 12.\n3958 1 Pet. ii. 21–23\n\n\nthus disposed, and fashion themselves according to the Gospel, will be partakers of Christ,\nand imitators of apostolic conversation, on account of which t", "lang": "greek", "orig": "", "d": ""}, {"v": 29, "f": "npnf206", "w": "Letter LXXIX. To Salvina.", "t": "But why do I write to one who is a stranger to me? For three reasons. First, because (as\na priest is bound to do) I love all Christians as my children and find my glory in promoting\n2389 Matt. xi. 29.\n2390 Lev. xix. 15.\n2391 Isa. xli. 8; Jas. ii. 23.\n\n\ntheir welfare. Secondly because the father of Nebridius was bound to me by the closest\nties.2392 Lastly—and this is a stronger reason than the others—because I have failed to say\nno to my son Avitus.2393 With an importunacy surpassing that of the widow towards the\nunjust judge2394 he wrote to me so frequently and put before me so many instances in which\nI had previously dealt with a similar theme, that he overcame my modest reluctance and\nmade the resolve to do not what would best become me but what would most nearly meet\nhis wishes.", "lang": "greek", "orig": "", "d": ""}, {"v": 29, "f": "npnf206", "w": "Letter LXXIX. To Salvina.", "t": "s my children and find my glory in promoting\n2389 Matt. xi. 29.\n2390 Lev. xix. 15.\n2391 Isa. xli. 8; Jas. ii. 23.\n\n\ntheir welfare. Secondly because the father of Nebridius was bound to me by the closest\nties.2392 Lastly—and this is a stronger reason than the oth", "lang": "greek", "orig": "", "d": ""}, {"v": 30, "f": "Apollinaris of Laodicea", "w": "", "t": "If the yoke is easy and the burden light, why did he call “the way” “narrow”? It is narrow to the careless, for to the zealous the Lord’s tasks are light. For even if they involve bodily suffering for a little while, yet the one who is now nourished with good hopes is the devout one who easily bears these pains.", "lang": "english", "orig": "", "d": ""}, {"v": 30, "f": "Augustine - Confessions", "w": "Sermon XLVI.", "t": "8 Ps. xvi. 4, Sept. (xvii. English version).\n3159 Matt. xi. 30.\n3160 2 Tim. iii. 2.\n\n\nand is driven away from himself to love those things which are beyond himself; to such a\ndegree that when the aforesaid Apostle had said,” Men shall be lovers of their own selv", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 30, "f": "Augustine of Hippo", "w": "", "t": "So then they who with unfearing neck have submitted to the yoke of the Lord endure such hardships and dangers, that they seem to be called not from labour to rest, but from

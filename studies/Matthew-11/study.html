<script>
const D = {"book": "Matthew", "chapter": 11, "version": "MorphGNT", "verses": [{"v": 1, "text": "Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν."}, {"v": 2, "text": "Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ"}, {"v": 3, "text": "εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;"}, {"v": 4, "text": "καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·"}, {"v": 5, "text": "τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·"}, {"v": 6, "text": "καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί."}, {"v": 7, "text": "Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;"}, {"v": 8, "text": "ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν."}, {"v": 9, "text": "ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου."}, {"v": 10, "text": "⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου."}, {"v": 11, "text": "ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν."}, {"v": 12, "text": "ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν."}, {"v": 13, "text": "πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·"}, {"v": 14, "text": "καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι."}, {"v": 15, "text": "ὁ ἔχων ⸀ὦτα ἀκουέτω."}, {"v": 16, "text": "Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃"}, {"v": 17, "text": "⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·"}, {"v": 18, "text": "ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·"}, {"v": 19, "text": "ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς."}, {"v": 20, "text": "Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·"}, {"v": 21, "text": "Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν."}, {"v": 22, "text": "πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν."}, {"v": 23, "text": "καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον."}, {"v": 24, "text": "πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί."}, {"v": 25, "text": "Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·"}, {"v": 26, "text": "ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου."}, {"v": 27, "text": "Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι."}, {"v": 28, "text": "Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς."}, {"v": 29, "text": "ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·"}, {"v": 30, "text": "ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν."}], "parallel": {}, "patristic": [{"v": 1, "f": "Chrysostom - Homilies on John", "w": "Homily XXXVI.", "t": "“And it came to pass, when Jesus had made an end of commanding His twelve disciples, He\ndeparted thence to teach and to preach in their cities.”", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 1, "f": "Gospel of Peter", "w": "Section XIII.", "t": "30 991And when Jesus finished charging his twelve disciples, he removed thence to\n31 teach and preach in their cities. 992And while they were going in the way they entered\ninto a certain village; and a woman named Martha entertained him in her house. 32\n993And she had a sister named Mary, and she came and sat at the feet of our Lord, 33 and\nheard his sayings. 994But Martha was disquieted by much serving; and she came and said\nunto him, My Lord, givest thou no heed that my sister left me alone to 34 serve? speak to\nher that she help me. 995Jesus answered and said unto her, Martha, 35 Martha, thou art\nsolicitous and impatient996 on account of many things: 997but what is sought is one thing.\nBut Mary hath chosen for herself a good portion, and that which shall not be taken from\nher.", "lang": "greek", "orig": "", "d": "100-300"}, {"v": 1, "f": "Jerome", "w": "", "t": "Chapter 11, Verses 1-2. And it came to pass, when Jesus had finished instructing His twelve disciples, that He departed from there to teach and preach in their cities. It is not as if He was unaware and asking; for He had already shown the others who were unaware, saying: Behold, the Lamb of God, behold Him who takes away the sins of the world (John 1:29), and He had heard the voice of the Father, thundering: This is my beloved Son, in whom I am well pleased (Matthew 3:17). But the Savior asks where Lazarus has been laid, so that those who were indicating the place of the tomb would at least be prepared to see the dead man rising again, and the disciples would be sent to Christ to witness the signs and miracles, so that through this opportunity they would believe in Him and learn from their Master. But the disciples of John, through their pride against the Lord, and their envy and malicious opposition, also revealed their thoughts in a superior manner, as the Evangelist reports: Then the disciples of John approached him, saying: Why do we and the Pharisees fast often, but your disciples do not fast (Ibid., IX, 14)? And in another place: Master, to whom you gave testimony at the Jordan, look, his disciples are baptizing and everyone is coming to him (John III, 26), as if to say: We are being abandoned, there is a scarcity here, while a crowd gathers around him.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 1, "f": "John Chrysostom", "w": "", "t": "That is, after He had sent them, He proceeded to withdraw Himself, to give them room and opportunity to do what He had enjoined. For while He was present and healing, no one would be willing to approach them.", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 1, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And it came to pass, when Jesus had made an end of commanding His twelve disciples, He departed thence to teach and to preach in their cities.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 1, "f": "Rabanus Maurus", "w": "", "t": "The Lord having sent out His disciples to preach with the foregoing instructions, Himself now fulfils in action what He had taught in words, offering His preaching first to the Jews; And it came to pass when Jesus had ended all these sayings, he passed thence.", "lang": "english", "orig": "", "d": "c. 840"}, {"v": 1, "f": "Remigius of Rheims", "w": "", "t": "He well passes from the special teaching which He had delivered to His disciples, to the general which He preached in the cities; passing therein as it were from heaven to earth, that He might give light to all. By this deed of the Lord, all holy preachers are admonished that they should study to benefit all.", "lang": "english", "orig": "", "d": "c. 900"}, {"v": 1, "f": "Theophylact of Ohrid", "w": "", "t": "When He had sent the disciples, He Himself was quiet, not working miracles but only teaching in the synagogues. For if He Himself were present healing the sick, no one would have approached the disciples. Therefore He departed so that they would have opportunity to heal.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 1, "f": "Thomas Aquinas", "w": "", "t": "After these words the Lord went on from there to teach and preach; and this for three reasons.\n\nOne reason was to show by example what he had taught: \"Jesus began to do and to teach\" (Acts 1:1).\nSecondly, to show that even the wicked should be preached to: \"I am a debtor to the wise and unwise\" (Rom 1:14).\nThirdly, to give others the opportunity to preach: \"If a revelation is made to another sitting by, let the first be silent\" (1 Cor 14:30).", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 2, "f": "Ambrose of Milan", "w": "", "t": "(in Luc. 7. 19.) And perhaps the two disciples sent are the two people; those of the Jews, and those of the Gentiles who believed.", "lang": "english", "orig": "", "d": "c. 385"}, {"v": 2, "f": "Athanasius - Select Works", "w": "Book V.", "t": "edience\n320 Matt. xix. 29.\n321 Matt. v. 3-11.\n322 Matt. xi. 2-6.\n323 [This is a good description of ideal Manichæan religious life. Whether Faustus lived up to the claims\nhere set forth is another question.—A.H.N.]\n\n\nto the precepts, why do you condemn me, sinc", "lang": "greek", "orig": "", "d": "296-373"}, {"v": 2, "f": "Augustine - Confessions", "w": "Sermon XVI.", "t": "On the words of the Gospel, Matt. xi. 2, “Now when John heard in the prison the works of the\nChrist, he sent by his disciples, and said unto him, art thou He that cometh, or look we\nfor another?” etc.", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 2, "f": "Augustine - Confessions", "w": "Chapter XVII.—Of the Calling of the Apostles as They Were Fishing.", "t": "34. Matthew’s narrative is continued thus: “Now when Jesus had heard that John was\ncast into prison, He departed into Galilee.”818 Mark states the same fact, as also does Luke,819\nonly Luke says nothing in the present section as to John being cast into prison. The evangelist\nJohn, again, tells us that, before Jesus went into Galilee, Peter and Andrew were with Him\none day, and that on that occasion the former had this name, Peter, given him, while before\nthat period he was called Simon. Likewise John tells us, that on the day following, when Jesus\nwas now desirous of going forth unto Galilee, He found Philip, and said to him that he\nshould follow Him. Thus, too, the evangelist comes to give the narrative about Nathanael.820\nFurther, he informs us that on the third day, when He was yet in Galilee, Jesus wrought the\nmiracle of the turning of the water into wine at Cana.821 All these incidents are left unrecorded\nby the other evangelists, who continue their narratives at once with the statement of\nthe return of Jesus into Galilee. Hence we are to understand that there was an interval here\nof several days, during which those incidents took place in the history of the disciples which\nare inserted at this point by John.822 Neither is there anything contradictory here to that\nother passage where Matthew tells us how the Lord said to Peter, “Thou art Peter, and upon\nthis rock will I build my Church.”823 But we are not to understand that that was the time\nwhen he first received this n", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 2, "f": "Chrysostom - Homilies on John", "w": "Homily XXXVI.", "t": "vii. 19.—R.]\n1509 [R.V., “He that cometh.”]\n1510 Matt. xi. 2, 3.\n1511 Luke vii. 18.\n1512 John i. 27.\n1513 John i. 33.\n1514", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 2, "f": "Chrysostom - Homilies on John", "w": "Homily XXXVI.", "t": "“Now when John had heard in the prison the works of Jesus,1507he sent two of1508his\ndisciples, and asked Him, saying, Art thou He that should come,1509or do we look for another?”", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 2, "f": "Glossa Ordinaria", "w": "", "t": "(non occ.) The Evangelist had shown above how by Christ's miracles and teaching, both His disciples and the multitudes had been instructed; he now shows how this instruction had reached even to John's disciples, so that they seemed to have some jealousy towards Christ; John, when he had heard in his bonds the works of Christ, sent two of his disciples to say unto him, Art thou he that should come, or look we for another?\n\n(non occ.) But it ought to be observed, that Jerome and Gregory did not say that John was to proclaim Christ's coming to the world beneath, to the end that the unbelievers there might be converted to the faith, but that the righteous who abode in expectation of Christ, should be comforted by His near approach.", "lang": "english", "orig": "", "d": "c. 1150"}, {"v": 2, "f": "Gregory the Dialogist", "w": "", "t": "We must inquire, dearly beloved brethren, why John—a prophet and more than a prophet, who pointed out the Lord coming to the baptism at the Jordan, saying: \"Behold the Lamb of God, behold him who takes away the sin of the world\"; who, considering both his own humility and the power of Christ's divinity, says: \"He who is of the earth speaks of the earth, but he who comes from heaven is above all\"—why, when placed in prison and sending his disciples, he asks: \"Are you he who is to come, or do we look for another?\" As if he did not know the one he had pointed out, and did not know whether he was the one whom he had proclaimed by prophesying, baptizing, and pointing him out. But this question is quickly resolved if the time and order of events is considered. For standing at the waters of the Jordan, he declared that this was the Redeemer of the world; but sent to prison, he asks whether he himself is coming—not because he doubts that he is the Redeemer of the world, but he asks in order to know whether he who had come into the world by himself would also descend by himself to the prison of hell. For he whom John had announced to the world as his forerunner, he was now preceding to hell by dying. Therefore he says: \"Are you he who is to come, or do we look for another?\" As if he were openly saying: Just as you deigned to be born for mankind, indicate whether you also deign to die for mankind, so that I who have been the forerunner of your birth may also become the forerunner of yo", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 2, "f": "Gregory the Dialogist", "w": "", "t": "(Hom. in Ev. vi. 1.) We must enquire how John, who is a prophet and more than a prophet, who made known the Lord when He came to be baptized, saying, Behold the Lamb of God, that taketh away the sins of the world!—why, when he was afterwards cast into prison, he should send his disciples to ask, Art thou he that should come, or look we for another? Did he not know Him whom he had pointed out to others; or was he uncertain whether this was He, whom by foretelling, by baptizing, and by making known, he had proclaimed to be He?\n\n(Aug, ubi sup) But this question may be answered in a better way if we attend to the order of time. At the waters of Jordan he had affirmed that this was the Redeemer of the world after he was thrown into prison, he enquires if this was He that should come—not that he doubted that this was the Redeemer of the world, but he asks that he may know whether He who in His own person had come into the world, would in His own person descend also to the world below.", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 2, "f": "Hilary of Poitiers", "w": "", "t": "A fuller spiritual meaning is to be found in these actions, which were being accomplished in and through John. Here we behold the efficient power of John’s embodied action and also the grace manifest in John. As announced in prophecy: the law rose up and took shape in John. For the law announced Christ, predicted the forgiveness of sins and promised the kingdom of heaven. John thoroughly accomplished all this work that belonged to the law. Therefore when the law (i.e., John) was inactive, oppressed as it was by the sins of the common people and held in chains by the vicious habits of the nation, so that Christ could not be perceived, the law (represented by John) was confined by chains and the prison. But the law (i.e., John) sent others to behold the good news. In this way unbelief would be confronted with the accomplished truth of what had been prophesied. By this means the part of the law that had been chained by the misdeeds of sinners would now be freed through the understanding of the good news freely expressed.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 2, "f": "Hilary of Poitiers", "w": "", "t": "John then is providing not for his own, but his disciples' ignorance; that they might know that it was no other whom he had proclaimed, he sent them to see His works, that the works might establish what John had spoken; and that they should not look for any other Christ, than Him to whom His works had borne testimony.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 2, "f": "Hilary of Poitiers", "w": "", "t": "In these things which were done concerning John, there is a deep store of mystic meaning. The very condition and circumstances of a prophet are themselves a prophecy. John signifies the Law; for the Law proclaimed Christ, preaching remission of sins, and giving promise of the kingdom of heaven. Also when the Law was on the point of expiring, (having been, through the sins of the people, which hindered them from understanding what it spake of Christ, as it were shut up in bonds and in prison,) it sends men to the contemplation of the Gospel, that unbelief might see the truth of its words established by deeds.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 2, "f": "John Chrysostom", "w": "", "t": "But what follows is completely among the controverted points. Of what nature then is this? Their saying, \"Art Thou He that should come, or do we look for another?\" That is, he that knew Him before His miracles, he that had learned it of the Spirit, he who had heard it of the Father, he who had proclaimed Him before all men; doth he now send to learn of Him, whether it be Himself or no? And if yet thou didst not know that it is surely He, how thinkest thou thyself credible, affirming as thou dost concerning things, whereof thou art ignorant? For he that is to bear witness to others, must be first worthy of credit himself. Didst thou not say, \"I am not meet to loose the latchet of His shoe?\" Didst thou not say, \"I knew Him not, but He that sent me to baptize with water, the same said unto me, Upon whom thou shalt see the Spirit descending and resting upon Him, the same is He which baptizeth with the Holy Ghost?\" Didst thou not see the Spirit in form of a dove? didst thou not hear the voice? Didst thou not utterly forbid Him, saying, \"I have need to be baptized of Thee?\" Didst thou not say even to thy disciples, \"He must increase, I must decrease?\" Didst thou not teach all the people, that \"He should baptize them with the Holy Ghost and with fire?\" and that He \"is the Lamb of God that taketh away the sin of the world?\" Didst thou not before His signs and miracles proclaim all these things? How then now, when He hath been made manifest to all, and the fame of Him hath gone out ev", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 2, "f": "John Chrysostom", "w": "", "t": "For what intent then did he send to ask? John's disciples were starting aside from Jesus, and this surely any one may see, and they had always a jealous feeling towards Him. And it is plain, from what they said to their master: \"He that was with thee,\" it is said, \"beyond Jordan, to whom thou barest witness, behold, the same baptizeth, and all men come unto Him.\" And again, \"There arose a question between John's disciples and the Jews about purifying.\" And again they came unto Him, and said, \"Why do we and the Pharisees fast oft, but Thy disciples fast not?\" For as yet they knew not who Christ was, but imagining Jesus to be a mere man, but John greater than after the manner of man, were vexed at seeing the former held in estimation, but the latter, as he had said, now ceasing. And this hindered them from coming unto Him, their jealousy quite blocking up the access. Now so long as John was with them, he was exhorting them continually and instructing them, and not even so did he persuade them; but when he was now on the point of dying, he uses the more diligence: fearing as he did lest he might leave a foundation for bad doctrine, and they continue broken off from Christ. For as he was diligent even at first to bring to Christ all that pertained to himself; so on his failing to persuade them, now towards his end he does but exert the more zeal.\n\nNow if he had said, \"Go ye away unto Him, He is better than I,\" he would not have persuaded them, minded as they were not easily to be", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 2, "f": "John Chrysostom", "w": "", "t": "But this seems hardly reasonable. For John was not in ignorance of His death, but was the first to preach it, saying, Behold the Lamb of God, that taketh away the sins of the world. For thus calling Him the Lamb, he plainly shows forth the Cross; and no otherwise than by the Cross did He take away the sins of the world. Also how is he a greater prophet than these, if he knew not those things which all the prophets knew, for Isaiah says, He was led as a sheep to the slaughter. (Is. 53:7.)\n\nBut is this a more reasonable explanation than the other? for why then did he not say, Art Thou Ho that is coming to the world beneath? and not simply, Art thou he that is to come? And the reason of his seeking to know, namely, that he might preach Him there, is even ridiculous. For the present life is the time of grace, and after death the judgment and punishment; therefore there was no need of a forerunner thither. Again, if the unbelievers who should believe after death should be saved, then none would perish; all would then repent and worship; for every knee shall bow, both of things in heaven, and things on earth, and things under the earth. (Phil. 2:10)\n\nYet whilst John was with them he held them rightly convinced concerning Christ. But when he was going to die, he was more concerned on their behalf. For he feared that he might leave his disciples a prey to some pernicious doctrine, and that they should remain separate from Christ, to whom it had been his care to bring all his follower", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 2, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And yet John says that they were called  in another manner. Whence it is evident that this was a second call; and from many things one may perceive this. For there it is said, that they came to Him when John was not yet cast into prison; but here, after he was in confinement. And there Andrew calls Peter, but here Jesus calls both. And John says, Jesus seeing Simon coming, says, You are Simon, the Son of Jona, you shall be called Cephas, which is by interpretation, a stone. John 1:42 But Matthew says that he was already called by that name; for his words are, Seeing Simon that was called Peter. And from the place whence they were called, and from many other things, one may perceive this; and from their ready obedience, and abandonment of all. For now they were well instructed beforehand. Thus, in the other case, Andrew is seen coming into His house, and hearing many things; but here, having heard one bare word, they followed immediately. Since neither was it unnatural for them to follow Him at the beginning, and then leave Him again and return anew to their own craft, when they saw both John thrown into prison, and Himself departing. Accordingly you see that He finds them actually fishing. But He neither forbad them at the first when minded to withdraw, nor having withdrawn themselves, did He let them go altogether; but He gave way when they started aside from Him, and comes again to win them back; which kind of thing is the great point in fishing.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 2, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Now when John had heard in the prison the works of Jesus, he sent two of his disciples, and asked Him, saying, Are you He that should come, or do we look for another? Matthew 11:2-3", "lang": "", "orig": "", "d": "c. 388"}, {"v": 2, "f": "Theodore of Mopsuestia", "w": "", "t": "About this text, some will argue, “When John sent his disciples, he was neither ignorant himself nor did he mean for them to learn, which seems clear to anyone who has entered to a certain extent into the meaning of the holy Scriptures.” But this is foolish, because when John was about to die and join the departed, he sent them to ask whether he was the one who was to come and free those who had been vanquished by death. In this way the good news was delivered to his disciples as well. John had already said, “Behold, the Lamb of God, who takes away the sin of the world.” He already knew very well that the Messiah would offer his suffering up to God for the sake of all humanity. Certainly, if John indeed knew that Jesus was the Christ, he was not ignorant of the Christ. On the contrary, he knew exactly what benefits were to come to humanity through him. John might seem to be telling different people different things in different contexts. Isn’t it true that John had so much knowledge about Christ that he said a great deal about him to various people? Isn’t it true that in accordance with the greater part of what John had said in his own testimony, he recognized Jesus as the deliverer of good news? It is hardly conceivable that John was ignorant about the Christ but now was guessing and wanted to find out for sure from him. That would be inconsistent. And who would, in the attempt to discover something so great, send along his disciples as if they were competent in themselves t", "lang": "english", "orig": "", "d": ""}, {"v": 2, "f": "Theophylact of Ohrid", "w": "", "t": "John did not ask as if he himself did not know Christ. How could this be when he had borne witness to Him, saying, \"Behold the Lamb of God\"? But because his disciples were jealous of Christ, John sent them to acquire more evidence, so that by seeing the miracles they might believe that Christ is greater than John. This is why he himself pretends to ask, \"Art Thou He that cometh?\" that is, He Whose coming in the flesh is awaited in the Scriptures. Some believe that by saying, \"He that cometh,\" he was asking about the descent into hades, as if, not knowing the answer, John were questioning, \"Art Thou He that goeth even into hades, or should we look for another?\" But this is foolishness, for how could John, who was greater than the prophets, not know of the crucifixion of Christ and the descent into hades, when he had called Christ the Lamb Who would be sacrificed for us? John knew, therefore, that the Lord would also go down into hades in the soul so that even there, as St. Gregory the Theologian says, He might save those who would have believed if He had become incarnate in their day. John did not ask this because he did not know the answer, but rather because he wanted to provide his disciples with the evidence of Christ's miracles. Look, then, how Christ answers this question:", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 2, "f": "Thomas Aquinas", "w": "", "t": "Now when John heard in prison about the works of Christ. The teaching of Christ has been mentioned and confirmed; the preachers have been instructed. Now the rebellious are calmed: first, he sets John's disciples at rest; secondly, the scribes (c. 14).\n\nIn regard to the first he does three things: first, he quiets the doubters; secondly, he rebukes the crowds (v. 16); thirdly, he gives thanks for the apostles' faith (v. 25).\n\nIn regard to the first a question is asked; secondly, the answer (v. 4).\n\nHe says, therefore: When he heard in prison about the works of Christ. This was the occasion for sending them. The same is presented in Luke (5:18) but in a different order. He says, therefore, that he was in prison as above (c. 4). Then Jesus began to work miracles. And this was fitting, that the sun not appear, while clouds were present: \"The law and the prophets until John\" (Mt 11:13). The works, i.e., the miracles, of Christ, he sent two of his disciples to say to him. Some try to condemn John for this, because he wondered whether he was the Christ, and it is obvious that one in doubt about the faith is an unbeliever.\n\nAmbrose on Luke says that this was not a question proceeding from unbelief but from piety; for he is not speaking about his coming into the world but of his coming to the Passion. Hence he wonders if he had come to suffer, as Peter said. \"This will never happen to you\" (Mt 16:22). On the other hand, Chrysostom says that John already knew from the beginning, when ", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 2, "f": "npnf208", "w": "Letter CLXXXVIII.2611", "t": "videatur.” To these\nmay be added Aug. (Quæst. in Matt. xi. 2): “Solet autem etiam quæri schismatici quid ab hæreticis distent, et\nhoc inveniri quod schismaticos non fides diversa faciat sed communionis disrupta societas. Sed utrum inter zizania\nnumerandi sint", "lang": "greek", "orig": "", "d": ""}, {"v": 3, "f": "Ambrose of Milan", "w": "", "t": "(in Luc. 7. 19.) Some understand it thus; That it was a great thing that John should be so far a prophet, as to acknowledge Christ, and to preach remission of sin; but that like a pious prophet, he could not think that He whom he had believed to be He that should come, was to suffer death; he doubted therefore though not in faith, yet in love. So Peter also doubted, saying, This be far from thee, Lord; this shall not be unto thee. (Mat. 16:22.)", "lang": "english", "orig": "", "d": "c. 385"}, {"v": 3, "f": "Augustine - Confessions", "w": "Sermon XVI.", "t": "leg. and Prop. ii. 5 (20).\n2246 Commendavit.\n2247 Matt. xi. 3.\n\n\nall received.” Thou saidst, “I am not worthy to unloose the latchet of His shoes.” And dost\nthou now say, “Art Thou He that should come, or do we look for another?” Is not this the\nsame Christ? An", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 3, "f": "Chrysostom - Homilies on John", "w": "Homily XXXVI.", "t": "“Now when John had heard in the prison the works of Jesus,1507he sent two of1508his\ndisciples, and asked Him, saying, Art thou He that should come,1509or do we look for another?”", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 3, "f": "Hilary of Poitiers", "w": "", "t": "It is indeed certain, that he who as forerunner proclaimed Christ's coming, as prophet knew Him when He stood before him, and worshipped Him as Confessor when He came to him, could not fall into error from such abundant knowledge. Nor can it be believed that the grace of the Holy Spirit failed him when thrown into prison, seeing He should hereafter minister the light of His power to the Apostles when they were in prison.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 3, "f": "Jerome", "w": "", "t": "John asks this not because he is ignorant but to guide others who are ignorant and to say to them, “Behold, the Lamb of God, who takes away the sin of the world!” And he had heard the voice of the Father saying, “This is my beloved Son, with whom I am well pleased.” Rather, it is the same sort of question as when the Savior asked where Lazarus was buried. The people only meant to show him the tomb, but he wanted them to be brought to faith and see the dead man return to life. Similarly, when John was about to be killed by Herod, he sent his disciples to Christ, intending that when they met him, the disciples would observe his appearance and powers and believe in him, and they would tell this to their teacher when he questioned them.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 3, "f": "Jerome", "w": "", "t": "Why does John send his disciples to the Lord to ask him: Are you the one who is coming, or should we expect another? (Matthew 11:3 and Luke 7:20) When he had previously said about the same person: Behold the Lamb of God, behold him who takes away the sins of the world. (John 1:29) We have spoken more fully on this question in the Commentaries of Matthew. Therefore, it is clear that you do not have these books yourself, since you ask such questions. However, we must briefly summarize so as not to seem completely silent. John sent his disciples while he was in prison, seeking to learn from them, and about to be beheaded, to teach them to follow the one whom he acknowledged as the master of all through his questioning. For he could not be unaware of him whom he had shown to those who were unaware, and of whom he had said, \"He who has a bride is the bridegroom\" (John 3:29); and \"I am not worthy to bear his sandals\" (Matthew 3:11); and \"He must increase, but I must decrease\" (John 1:27). And he heard the Father thundering out: This is My beloved Son, in Whom I am well pleased (Ibid. 3:30). But what he says: Art Thou He that shall come, or look we for another? (Matth. 3: 17). This utterance too may have this meaning: I know that Thou art He Who hast come to take away the sins of the world; but because I am to descend into hell, I ask this also of Thee, whether Thou too wilt descend thither, or is it impious to believe this of the Son of God, and wilt Thou send another thither? This", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 3, "f": "Jerome", "w": "", "t": "(Verse 3.) Are you the one who is to come, or should we expect another? He does not say, 'You are the one who has come,' but rather, 'You are the one who is to come.' And the meaning is this: Send to me, because I am about to descend into the underworld, whether I should announce you to the dead, who I have announced to the living? Does it not befit the Son of God to taste death, and to send another to these sacraments?", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 3, "f": "Jerome", "w": "", "t": "Hence he frames his question thus, Art thou he that is to come? Not, Art Thou he that hast come? And the sense is, Direct me, since I am about to go down into the lower parts of the earth, whether I shall announce Thee to the spirits beneath also; or whether Thou as the Son of God may not taste death, but will send another to this sacrament?\n\nTherefore he does not ask as being himself ignorant. But as the Saviour asks where Lazarus is buried (John 11:34.), in order that they who shewed. Him the sepulchre might be so far prepared for faith, and believe that the dead was verily raised again—so John, about to be put to death by Herod, sends his disciples to Christ, that by this opportunity of seeing His signs and wonders they might believe on Him, and so might learn through their master's enquiry. But John's disciples had somewhat of bitterness and jealousy towards the Lord, as their former enquiry showed, Why do we and the Pharisees fast oft, but thy disciples fast not?", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 3, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Now when John had heard in the prison the works of Jesus, he sent two of his disciples, and asked Him, saying, Are you He that should come, or do we look for another? Matthew 11:2-3", "lang": "", "orig": "", "d": "c. 388"}, {"v": 3, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But what follows is completely among the controverted points. Of what nature then is this? Their saying, Are You He that should come, or do we look for another? That is, he that knew Him before His miracles, he that had learned it of the Spirit, he that heard it of the Father, he who had proclaimed Him before all men; does he now send to learn of Him, whether it be Himself or no? And if yet thou did not know that it is surely He, how thinkest you yourself credible, affirming as thou dost concerning things, whereof you are ignorant? For he that is to bear witness to others, must be first worthy of credit himself. Did you not say, I am not meet to loose the latchet of His shoe? John 1:27 Did you not say, I knew Him not, but He that sent me to baptize with water, the same said to me, Upon whom you shall see the Spirit descending and resting upon Him, the same is He which baptizes with the Holy Ghost? John 1:33 Did you not see the Spirit in form of a dove? Did you not hear the voice? Did you not utterly forbid Him, saying, I have need to be baptized by You? Matthew 3:14 Did you not say even to your disciples, He must increase, I must decrease? John 3:30 Did you not teach all the people, that He should baptize them with the Holy Ghost and with fire? Matthew 3:11 and that He is the Lamb of God that takes away the sin of the world? Did you not before His signs and miracles proclaim all these things?", "lang": "", "orig": "", "d": "c. 388"}, {"v": 3, "f": "Thomas Aquinas", "w": "", "t": "He says, therefore, Are you he who is to come, or look we for another? It is true that our fathers awaited you, as it says in Exodus (c. 4).", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 4, "f": "Augustine - Confessions", "w": "Chapter XXXI.—Of the Account Given by Matthew and Luke of the Occasion When\nJohn the Baptist Was in Prison, and Despatched His Disciples on a Mission to\nthe Lord.", "t": "78. Matthew proceeds with his narrative in the following terms: “And it came to pass,\nwhen Jesus had made an end of commanding His twelve disciples, He departed thence to\nteach and to preach in their cities. Now, when John had heard in the prison the works of\nChrist, he sent two of his disciples, and said unto Him, Art thou He that should come, or\ndo we look for another?” and so on, until we come to the words, “And Wisdom is justified\nof her children.” 991 This whole section relating to John the Baptist, touching the message\nwhich he sent to Jesus, and the tenor of the reply which those whom he despatched received,\nand the terms in which the Lord spoke of John after the departure of these persons, is introduced\nalso by Luke.992 The order, however, is not the same. But it is not made clear which\nof them gives the order of his own recollections, and which keeps by the historical succession\nof the things themselves.993", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 4, "f": "Augustine - Confessions", "w": "Chapter XII.—Of the Concord Preserved Among All the Four Evangelists on the\nSubject of the Parting of His Raiment.", "t": "39. Matthew goes on thus: “And after they crucified Him, they parted His garments,\ncasting lots: and sitting down, they watched Him.”1381 Mark reports the same incident, as\nfollows: “And crucifying Him, they parted His garments, casting lots upon them, what every\nman should take.”1382 In like manner Luke says: “And they parted His raiment, and cast\nlots. And the people stood beholding.”1383 The occurrence is thus recorded briefly by the\nfirst three. But John gives us a more detailed narrative of the method in which the act was\ngone about. His version runs thus: “Then the soldiers, when they had crucified Jesus, took\nHis garments, and made four parts, to every soldier a part; and also His coat: now the coat\nwas without seam, woven from the top throughout. They said therefore among themselves,\nLet us not rend it, but cast lots for it, whose it shall be: that the Scripture might be fulfilled,\nwhich saith, They parted my garments, and for my vesture they did cast lots.”1384", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 4, "f": "Gregory the Dialogist", "w": "", "t": "Hence also, when the Lord was asked, after enumerating the miracles of his power, he immediately responded about the humility of his death, saying: \"The blind see, the lame walk, lepers are cleansed, the deaf hear, the dead rise, the poor have the gospel preached to them, and blessed is he who is not scandalized in me.\" Seeing so many signs and such great powers, no one could be scandalized, but only marvel.", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 4, "f": "Jerome", "w": "", "t": "(Ver. 4, 5.) And Jesus answered and said to them, 'Go and tell John what you hear and see: The blind receive sight, the lame walk, the lepers are cleansed, the deaf hear, the dead are raised up.' John had asked through his disciples: 'Are You the Coming One, or do we look for another?' Jesus shows the signs, not responding to what had been asked, but to the stumbling block of the messengers: 'Go and tell John the things which you hear and see: The blind see and the lame walk; the lepers are cleansed and the deaf hear; the dead are raised up.' And what is no less important about these things,\n\nThe poor are evangelized. Either the poor in spirit, or certainly the poor in wealth (or works), so that there is no distinction in preaching between the noble and the lowly, the rich and the needy. These things confirm the strictness of the teacher, the truth of the instructor, that all are equal before him who can be saved. And what he says:", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 4, "f": "Jerome", "w": "", "t": "This last is no less than the first. And understand it as if it had been said, Even the poor; that so between noble and mean, rich and poor, there may be no difference in preaching. This approves the strictness of the master, this the truth of the teacher, that in His sight every one who can be saved is equal.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 4, "f": "John Chrysostom", "w": "", "t": "But Christ knowing the purpose of John, did not say, I am He; for this would again have offended the hearers, although this was what it naturally followed for Him to say, but He leaves them to learn it from His acts. For it saith, \"when these were come to Him, then He cured many.\" And yet what congruity was there, that being asked, \"Art thou He,\" He should say nothing to that, but should presently cure them that were sick; unless it had been His mind to establish this which I have mentioned? Because they of course would account the testimony of His deeds surer, and more above suspicion than that of His words.", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 4, "f": "John Chrysostom", "w": "", "t": "Knowing therefore, as being God, the mind with which John had sent them, He straightway cured blind, lame, and many others; not to teach him (for how should He him that was convinced), but these that were doubting: and having healed them, He saith, \"Go and show John again those things which ye do hear and see; the blind receive their sight, and the lame walk, and the lepers are cleansed, and the deaf hear, and the dead are raised up, and the poor have the gospel preached unto them.\" And he added, \"And blessed is he, whosoever shall not be offended in me;\" implying that He knows even their unuttered thoughts. For if He had said, \"I am He,\" both this would have offended them, as I have already said; and they would have thought, even if they had not spoken, much as the Jews said to Him, \"Thou bearest record of Thyself.\" Wherefore He saith not this Himself, but leaves them to learn all from the miracles, freeing what He taught from suspicion, and making it plainer. Wherefore also He covertly added His reproof of them. That is, because they were \"offended in Him,\" He by setting forth their case and leaving it to their own conscience alone, and by calling no witness of this His accusation, but only themselves that knew it all, did thus also draw them the more unto Himself, in saying, \"Blessed is he, whosoever shall not be offended in me.\" For indeed His secret meaning was of them when He said this.", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 4, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And in the opposite cases too He does so; as in that of Nathanael, saying, Behold an Israelite indeed, in whom is no guile. John 1:47 And again, Go and show John again those things which you do hear and see. Matthew 11:4 For neither in this did He reply to the words, but to the intention of him that sent them. And with the people again in like manner, He addresses His discourse unto their conscience, saying, What went ye out into the wilderness to see? Matthew 11:7 That is because they were probably feeling about John, as though he had been a sort of easy and wavering person; to correct this their suspicion, He says, What went ye out into the wilderness to see? A reed shaken with the wind? or, a man clothed with soft raiment? by both these figures declaring, that he was neither of himself a waverer, nor would be softened by any luxury. Thus then in the present case also He makes His answer to their meaning.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 4, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Go and show John again those things which you do hear and see; the blind receive their sight, and the lame walk, and the lepers are cleansed, and the deaf hear, and the dead are raised up, and the poor have the gospel preached unto them. Matthew 4:5 And he added, And blessed is he, whosoever shall not be offended in me; implying that He knows even their unuttered thoughts. For if He had said, I am He, both this would have offended them, as I have already said; and they would have thought, even if they had not spoken, much as the Jews said to Him, You bear record of Yourself.  Wherefore He says not this Himself, but leaves them to learn all from the miracles, freeing what He taught from suspicion, and making it plainer. Wherefore also He covertly added His reproof of them. That is, because they were offended in Him, He by setting forth their case and leaving it to their own conscience alone, and by calling no witness of this His accusation, but only themselves that knew it all, did thus also draw them the more unto Himself, in saying, Blessed is he, whosoever shall not be offended in me. For indeed His secret meaning was of them when He said this.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 4, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But when, not understanding His sayings, they had delivered the judgment, He unfolds His concealed meaning after this, and says, Publicans and harlots go into the kingdom of Heaven before you. For John came unto you in the way of righteousness, and you believed him not; but the publicans believed him; and you, when you had seen it, repented not afterwards, that you might believe him. Matthew 21:31-32", "lang": "", "orig": "", "d": "c. 388"}, {"v": 4, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And as they departed, Jesus began to say unto the multitudes concerning John, What went ye out into the wilderness to see? A reed shaken with the wind? But what went ye out for to see? A man clothed in soft raiment; behold, they that wear soft clothing are in kings' houses. But what went ye out for to see? A prophet?  yea, I say unto you, and more than a prophet.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 4, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And what sort of connection may this have with what was said before? Much, assuredly, and in full accordance therewith. Yea, by this topic also He proceeds to urge and press them into the faith of Himself; and at the same time likewise, He is speaking in agreement with what had been before said by John. For if all things are fulfilled even down to John, I am He that should come.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 4, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "This John likewise says, but he in the beginning of his Gospel, this at the end. Whence it is probable this was done twice, and at different seasons.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 4, "f": "Theophylact of Ohrid", "w": "", "t": "He did not say, \"Declare unto John that I am He that cometh.\" But knowing that John had sent his disciples to see the miracles, He said, \"Tell John what you see, and certainly he will use that opportunity to bear witness more fully to you concerning Me.\" By the words \"the poor have the good tidings\" understand either those preaching the Gospel, that is, the apostles, who were poor fishermen and despised as common lowly people, or those listening to the Gospel and hearing of the eternal good things.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 4, "f": "Thomas Aquinas", "w": "", "t": "And Jesus answered them. Here Christ's answer is given. John and many disciples, as John says (c. 4). Therefore, there was a dispute among them, because they saw Christ's works and preferred him to John. But seeing John's abstinence, they prefer him to Christ. Hence, first he proposes the question; secondly, he commends John (v. 10).\n\nIn regard to the first he answers in terms of his coming and Passion. The time will come, when God will suffer and many will be scandalized, because \"to the Jews a scandal\" (1 Cor 1:23). Hence he answers when this will be. According to Chrysostom he wants to show that he whom the prophets had foretold has come. Hence three things were promised by the prophets: sometimes the coming of God, by some the coming of a new teacher, by some the coming of sanctification and redemption. How shall we say then that he will come? And he answers in the same way Isaiah (35:4) answers: \"Behold God will come and save us.\" Hence you will see those miracles. Go and tell John what you hear in the teachings and see in the miracles. Again, a teacher was promised: \"Be glad, O sons of Zion..., because he has given you a teacher of justice\" (Jl 2:22).", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 5, "f": "Thomas Aquinas", "w": "", "t": "The blind see..., and this literally. Then if you ask when he will come: \"The spirit of the Lord is upon me; he has sent me to preach to the meek\" (Is 61:1), and this is signified when he says the poor have the Gospel preached to them, i.e., poverty will be blessed. Hence above (5:3); \"Blessed are the poor in spirit...\" and Luke (4:18): \"The spirit of the Lord is upon me, because he has anointed me to preach the gospel to the poor.\" Again, someone holy will come to sanctify sinners; hence Isaiah (8:13): \"The Lord of hosts, him you shall regard as holy.\"", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 6, "f": "Gregory the Dialogist", "w": "", "t": "But the mind of unbelievers suffered grave scandal in him when they saw him dying even after so many miracles. Hence Paul also says: \"But we preach Christ crucified, to the Jews indeed a scandal, but to the Gentiles foolishness.\" For it seemed foolish to men that the author of life should die for mankind; and from this, man took scandal against him, from which he ought rather to have become more indebted. For God is to be honored by men all the more worthily, the more he undertook even unworthy things for mankind. What therefore does it mean to say: \"Blessed is he who is not scandalized in me,\" except to signify openly the abjection and humility of his death? As if he were plainly saying: I indeed do wondrous things, but I do not disdain to suffer humble things. Therefore, since I follow you in dying, men must take great care not to despise in me the death, while they venerate the signs.", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 6, "f": "Gregory the Dialogist", "w": "", "t": "(Hom. in Ev. vi. 1.) Otherwise; The mind of unbelievers was greatly offended concerning Christ, because after many miracles done, they saw Him at length put to death; whence Paul speaks, We preach Christ crucified, to the Jews a stumbling-block. (1 Cor. 1:23.) What then does that mean, Blessed is he who shall not be offended in me, but a direct allusion to the humiliation of His death; as much as to say, I do indeed wonderful works, but do not disdain to suffer humble things. Because then I follow you in death, men must be careful not to despise in Me My death, while they reverence My wonderful works.", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 6, "f": "Hilary of Poitiers", "w": "", "t": "And when the Lord had shown forth all of himself in miraculous works, in giving sight to the blind, the power of walking to the lame, cleansing to the lepers, hearing to the deaf, voices to the mute, life to the dead and preaching to the poor, he said, “Blessed is the one who takes no offense at me.” Now, had anything really been done through Christ that would cause John to take offense? Not in the least. For John himself also spent his time in his own teaching and work. However, one ought to look to a higher meaning that is both powerful and fitting. What does it mean that the poor have good news preached to them? Poor people are those who have abandoned their lives, who have taken up his cross and followed, who have been made humble in spirit. For such the kingdom of heaven is prepared. Because all experiences of this kind come together in the Lord and because his cross was to be a source of offense to many, he declared that people are blessed if their faith is not threatened by a cross or death or burial.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 6, "f": "Hilary of Poitiers", "w": "", "t": "This saying, that they were blessed from whom there should be no offence in Him, showed them what it was that John had provided against in sending them. For John, through fear of this very thing, had sent his disciples that they might hear Christ.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 6, "f": "Jerome", "w": "", "t": "(Ver. 6.) And blessed is he who is not scandalized in me. He strikes down the messengers, as will be shown in the following.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 6, "f": "John Chrysostom", "w": "", "t": "And blessed is he who shall not be offended in me, is directed against the messengers; they were offended in Him. But He not publishing their doubts, and leaving it to their conscience alone, thus privately introduced a refutation of them.", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 6, "f": "Theophylact of Ohrid", "w": "", "t": "And to show John's disciples that the thoughts they were thinking did not escape His notice, He said, \"Blessed is he whosoever shall not be offended in Me,\" for they had many doubts about Him.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 6, "f": "Thomas Aquinas", "w": "", "t": "Hence to some was promised sanctification, and after they were sanctified, others would be scandalized; therefore, he says, Blessed is he who is not scandalized in me. Hence it says, \"So Jesus also suffered outside the gate, in order to sanctify the people through his own blood\" (Heb 13:12). Therefore, he shows the signs of his coming. But if we speak in the moral sense, the entire process of man's sanctification is signified. For the sinner first suffers blindness, when the reason is darkened: \"Like the untimely birth that never sees the sun\" (Ps 58:8); \"Bring forth the people who are blind but have eyes\" (Is 43:8). He is said to be lame, when the mind is drawn to various things, as it says in 1 Kings (18:21): \"How long will you go limping with two different opinions?\" Likewise, he becomes ulcerous in treachery and leprous, because then he cannot be recalled and infects others. After that he becomes deaf, because chastening is not heard. Then he dies: \"Awake, O sleeper, and arise from the dead\" (Eph 5:14). All these the Lord heals. The last are the poor in spirit, so that no health remains in them: \"My loins are filled with burning, and there is not health in my flesh\" (Ps 38:7). These, too, the Lord heals and they rise to a certain mental soundness, in which is true peace: \"Great peace have those who love your law; nothing can make them stumble\" (Ps 119:165).", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 7, "f": "Ambrose of Milan", "w": "", "t": "And perhaps the two disciples sent are the two people; those of the Jews, and those of the Gentiles who believed.", "lang": "english", "orig": "", "d": "c. 385"}, {"v": 7, "f": "Augustine - Confessions", "w": "Sermon XVI.", "t": "Officium.\n2237 John i. 27.\n2238 John i. 16.\n2239 Matt. xi. 7.\n2240 Eph. iv. 14.\n2241 Matt. xi. 8.\n\n\nProphet.”2242 Why “more than a Prophet”? The Prophets foretold that the Lord would\ncome, whom they desired to see, and saw not; but to him was vouchsafed what t", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 7, "f": "Augustine - Confessions", "w": "Sermon XVI.", "t": "2. This then did John say concerning Christ. And what said Christ of John? We have\njust now heard. “He began to say to the multitudes concerning John, What went ye out into\nthe wilderness to see? A reed shaken with the wind?”2239 Surely not; for John was not “blown\nabout by every wind of doctrine.”2240 “But what went ye out for to see? A man clothed in\nsoft raiment?”2241 No, for John was clothed in rough apparel; he had his raiment of camel’s\nhair, not of down. “But what went ye out for to see? A Prophet? yea, and more than a\n2236 Officium.\n2237 John i. 27.\n2238 John i. 16.\n2239 Matt. xi. 7.\n2240 Eph. iv. 14.\n2241 Matt. xi. 8.\n\n\nProphet.”2242 Why “more than a Prophet”? The Prophets foretold that the Lord would\ncome, whom they desired to see, and saw not; but to him was vouchsafed what they sought.\nJohn saw the Lord; he saw Him, pointed his finger toward Him, and said, “Behold the Lamb\nof God, who taketh away the sins of the world;”2243 behold, here He is. Now had He come\nand was not acknowledged; and so a mistake was made also as to John himself. Behold then\nhere is He whom the Patriarchs desired to see, whom the Prophets foretold, whom the Law\nprefigured. “Behold the Lamb of God, who taketh away the sins of the world.” And he gave\na goodly testimony to the Lord, and the Lord to him. “Among them that are born of women,”\nsaith the Lord, “there hath not risen a greater than John the Baptist: notwithstanding, he\nthat is less in the kingdom of heaven is greater than he;”2244 less", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 7, "f": "Chrysostom - Homilies on John", "w": "Homily XXXVIII.", "t": "t.” Comp. the explanation in the\nHomily.—R.]\n1608 Matt. xi. 7–11.\n1609 Matt. xi. 12.\n1610 Matt. vi. 13.\n1611 Matt. vi. 14–19.\n1612 Matt. xi. 20–24.\n\n\nto these. As when Paul saith, “I thank God, that ye were servants of sin, but ye obeyed from\nthe heart the form", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 7, "f": "Chrysostom - Homilies on John", "w": "Homily XXXVII.", "t": "“And as they departed, Jesus began to say unto the multitudes concerning John, What went\nye out into the wilderness to see? A reed shaken with the wind? But what went ye out for\nto see? A man clothed in soft raiment; behold, they that wear soft clothing are in kings’\nhouses. But what went ye out for to see? A prophet?1560yea, I say unto you, and more than\na prophet.”", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 7, "f": "Ephrem the Syrian", "w": "Commentary on Exodus", "t": "10. In the wilderness this John had cried and had said —Repent you sinners of your evils — and offer the fruits of repentance;— for lo! He comes that winnows the wheat from the tares.", "lang": "", "orig": "", "d": "c. 360"}, {"v": 7, "f": "Gregory the Dialogist", "w": "", "t": "But after John's disciples were dismissed, let us hear what He says to the crowds about the same John: \"What did you go out into the desert to see? A reed shaken by the wind?\" This He clearly brought forth not by affirming, but by denying. For a reed, as soon as a breeze touches it, bends to the other side. And what is signified by the reed but a carnal mind? Which, as soon as it is touched by favor or detraction, immediately inclines to either side. For if a breeze of favor blows from human lips, it rejoices, is lifted up, and bends itself entirely, as it were, toward grace. But if from the same place whence the breeze of praise was coming, a wind of detraction bursts forth, it immediately inclines him, as it were, to the other side, toward the violence of fury. But John was not a reed shaken by the wind, because neither did flattery make him gentle, nor did anyone's detraction make him harsh with anger. Neither did prosperity know how to lift him up, nor adversity to cast him down. Therefore John was not a reed shaken by the wind, whom no change of circumstances bent from the uprightness of his position. Let us learn therefore, dearest brothers, not to be a reed shaken by the wind; let us make firm our mind placed amid the breezes of tongues, let the posture of our mind stand unbending. Let no detraction provoke us to anger, and let no favor incline us to the relaxation of useless grace. Let not prosperity lift us up, nor adversity disturb us, so that we who are fixed in th", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 7, "f": "Gregory the Dialogist", "w": "", "t": "(Hom. in Ev. vi. 2.) This He proposes, not to assert, but to deny. For if but a breath of air touch a reed, it bends it one way or other; a type of the carnal mind, which leans to either side, according as the breath of praise or detraction reaches it. A reed shaken by the wind John was not, for no variety of circumstance bent him from his uprightness. The Lord's meaning then is,", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 7, "f": "Hilary of Poitiers", "w": "", "t": "Therefore that this might not lead them to think of John as though he were offended concerning Christ, it continues, When they had gone away, Jesus began to speak to the multitudes concerning John.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 7, "f": "Jerome", "w": "", "t": "(Verse 7.) But as they were departing, Jesus began to speak to the crowds about John: What did you go out into the wilderness to see? A reed shaken by the wind? But what did you go out to see? A man dressed in soft clothing? Look, those who wear soft clothing are in the palaces of kings. If a harsh judgment had been pronounced against John, as many believe, then why is he now being praised so highly? But because the surrounding crowd did not know the mystery of the question, and thought that John doubted about Christ, whom he had pointed out with his finger, so that they would understand that John was not asking for himself, but for his disciples: Why, he said, do you go out into the desert? Is it perhaps to see a man resembling a reed that is carried by every wind, and to have doubts about the one he had previously proclaimed? Or is it possible that he is compelled by the stings of envy against me, and his preaching seeks empty glory, so that he may seek profits from it? Why does he desire riches, so that he may abound in feasts? He feeds on locusts and wild honey. Does he dress in soft clothing? The covering of his body is made of camel hair. Such food and clothing are received in the prison's lodging, and the preaching of truth has such a dwelling. But those who are flatterers and pursue gains, seeking wealth, and abound in pleasures, and dress in soft clothing, they are in the houses of kings. From which it is shown that a strict and austere life and preaching should avoi", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 7, "f": "Jerome", "w": "", "t": "Was it for this ye went out into the desert to see a man like unto a reed, and carried about by every wind, so that in lightness of mind he doubts concerning Him whom once he preached? Or it may be he is roused against Me by the sting of envy, and he seeks empty honour by his preaching, that he may thereof make gain. Why should he covet wealth? that he may have dainty fare? But his food is locusts and wild honey. That he may wear soft raiment? But his clothing is camel's hair. This is that He adds, But what went ye out for to see? A man clothed in soft raiment?", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 7, "f": "Jerome", "w": "", "t": "Mystically; The desert is that which is deserted of the Holy Spirit, where there is no habitation of God; in the reed is signified a man who in outward show lives a pious life, but lacks all real fruit within himself, fair outside, within hollow, moved with every breath of wind, that is, with every impulse of unclean spirits, having no firmness to remain still, devoid of the marrow of the soul.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 7, "f": "John Chrysostom", "w": "", "t": "For the matter indeed of John's disciples had been ordered well, and they were gone away assured by the miracles which had just been performed; but there was need after that of remedy as regarded the people. For although they could not suspect anything of the kind of their own master, the common people might from the inquiry of John's disciples form many strange suspicions, not knowing the mind with which he sent his disciples. And it was natural for them to reason with themselves, and say, \"He that bore such abundant witness, hath he now changed his persuasion, and doth he doubt whether this or another be He that should come? Can it be, that in dissension with Jesus he saith this? that the prison hath made him more timid? that his former words were spoken vainly, and at random?\" It being then natural for them to suspect many such things, see how He corrects their weakness, and removes these their suspicions. For \"as they departed, He began to say to the multitudes.\" Why, \"as they departed?\" That He might not seem to be flattering the man.\n\nAnd in correcting the people, He doth not publish their suspicion, but adds only the solution of the thoughts that were mentally disturbing them: signifying that He knew the secrets of all men. For He saith not, as unto the Jews, \"Wherefore think ye evil?\" Because if they had it in their minds, not of wickedness did they so reason, but of ignorance on the points that had been spoken of. Wherefore neither doth He discourse unto them in the ", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 7, "f": "John Chrysostom", "w": "", "t": "Now His meaning is like this: He was not of himself a waverer; and this ye yourselves showed by your earnestness. Much less could any one say this, that he was indeed firm, but having made himself a slave to luxury, he afterwards became languid. For among men, some are such as they are of themselves, others become so; for instance, one man is passionate by nature, and another from having fallen into a long illness gets this infirmity. Again, some men are flexible and fickle by nature, while others become so by being slaves to luxury, and by living effeminately. \"But John,\" saith He, \"neither was such a character by nature, for neither was it a reed that ye went out to see; nor by giving himself to luxury did he lose the advantage he possessed.\" For that he did not make himself a slave to luxury, his garb shows, and the wilderness, and the prison. Since, had he been minded to wear soft raiment, he would not have lived in the wilderness, nor in the prison, but in the king's courts: it being in his power, merely by keeping silence, to have enjoyed honor without limit. For since Herod so reverenced him, even when he had rebuked him, and was in chains, much more would he have courted him, had he held his peace. You see, he had indeed given proof of his firmness and fortitude; and how could he justly incur suspicions of that kind?\n\nThen lest they should say, \"But what if at that time indeed he were such an one, but now is changed?\" He added also what follows; his garments, his pris", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 7, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And as they departed, Jesus began to say unto the multitudes concerning John, What went ye out into the wilderness to see? A reed shaken with the wind? But what went ye out for to see? A man clothed in soft raiment; behold, they that wear soft clothing are in kings' houses. But what went ye out for to see? A prophet?  yea, I say unto you, and more than a prophet.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 7, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Wherefore He says, What went ye out into the wilderness to see? as though He had said, Wherefore did ye leave your cities, and your houses, and come together all of you into the wilderness? To see a pitiful and flexible kind of person? Nay, this were out of all reason, this is not what is indicated by that earnestness, and the concourse of all men unto the wilderness. So much people and so many cities would not have poured themselves out with so great zeal towards the wilderness and the river Jordan at that time, had ye not expected to see some great and marvellous one, one firmer than any rock. Yea, it was not a reed surely, that ye went out to see shaken by the wind: for the flexible and such as are lightly brought round, and now say one thing, now another, and stand firm in nothing, are most like that.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 7, "f": "Pseudo-Chrysostom", "w": "", "t": "(in loc.) They had not gone out at this time into the desert to see John, for he was not now in the desert, but in prison; but He speaks of the past time while John was yet in the desert, and the people flocked to him.", "lang": "english", "orig": "", "d": ""}, {"v": 7, "f": "Theophylact of Ohrid", "w": "", "t": "Perhaps the multitudes heard John's question and were scandalized that even John himself might be unsure of Christ and had so quickly changed his opinion, although he had previously borne witness to Him. Christ allays this suspicion, then, by saying, John is not a reed, that is, one who changes easily. For if he were, why would you have gone out to him in the wilderness? You indeed would not have gone out to see a reed, a changeable man, but you went out to see a great and steadfast man. To be sure, he is still now what you thought him to be then.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 7, "f": "Thomas Aquinas", "w": "", "t": "As they went away. Here he satisfies the crowd's doubts. Although the crowds had heard John's witness to Christ, they now seemed to hesitate. For they could have three things in their heart, because a person changes his mind for three reasons: either on account of fickleness of mind, or for the sake of some profit, or on account of the human spirit's passing from ignorance of the truth to knowing it: \"For God knows that the thoughts of men are vain\" (Ps 94:11). Therefore, he first excludes fickleness from them; secondly, the desire for profit (v. 8); thirdly, he shows that he has prophetic truth (v. 9).\n\nHe says, therefore, As they went away. The Lord teaches us with remarkable tact, as he never wished to praise John in the presence of his disciples or anyone in his own presence: \"Let another praise you and not your own mouth; a stranger and not your own lips\" (Pr 27:2). Because if the one praised is good, he is embarrassed; if he is evil, he is flattered. Jesus began to preach to the crowds: \"What did you go out into the desert to see? Did you go to see a reed?\" No, but you went out to see a resolute man. For a reed is easily moved; hence a mind that changes quickly is regarded as a wind: \"So that we may no longer be children, tossed to and fro with every wind\" (Eph 4:14).", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 8, "f": "Augustine - Confessions", "w": "Sermon XVI.", "t": "n i. 16.\n2239 Matt. xi. 7.\n2240 Eph. iv. 14.\n2241 Matt. xi. 8.\n\n\nProphet.”2242 Why “more than a Prophet”? The Prophets foretold that the Lord would\ncome, whom they desired to see, and saw not; but to him was vouchsafed what they sought.\nJohn saw the Lord; he sa", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 8, "f": "Augustine of Hippo", "w": "", "t": "(Doctr. Christ. iii. 12.) In all such things we blame not the use of the things, but the lust of those that use them. For whoever uses the good things in his reach more sparingly than are the habits of those with whom he lives, is either temperate or superstitious. Whoever again uses them in a measure exceeding the practice of the good among whom he lives, either has some meaning therein, or else is dissolute.", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 8, "f": "Gregory the Dialogist", "w": "", "t": "But still more is added about the description of him: \"But what did you go out into the desert to see? A man clothed in soft garments? Behold, those who are clothed in soft garments are in the houses of kings.\" For John is described as having been clothed in woven camel's hair. And what does it mean to say, \"Behold, those who are clothed in soft garments are in the houses of kings,\" except to demonstrate by a clear statement that those who flee from enduring hardships for God do not serve the heavenly King but an earthly one, but rather, devoted only to external things, they seek the softness and pleasure of the present life? Therefore let no one think that there is no sin in the extravagance and pursuit of clothing, because if this were not a fault, the Lord would in no way have praised John for the roughness of his garment. If this were not a fault, the apostle Peter would never have restrained women through his epistle from the desire for costly garments, saying: \"Not in costly apparel.\" Consider, therefore, what a fault it is for men also to desire that from which the pastor of the Church took care to prohibit even women.\n\nAlthough what is said about John not being clothed in soft garments can also be understood in another way through its symbolic meaning. For he was not clothed in soft garments because he did not nurture the life of sinners with flatteries, but rebuked them with the force of harsh denunciation, saying: \"Brood of vipers, who has shown you how to flee from", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 8, "f": "Gregory the Dialogist", "w": "", "t": "(Hom. in Ev. vi. 3.) Let no one suppose that there is nothing sinful in luxury and rich dress; if pursuit of such things had been blameless, the Lord would not have thus commended John for the coarseness of his raiment, nor would Peter have checked the desire of fine clothes in women as he does, Not in costly raiment. (1 Pet. 3:3)\n\n(ubi. sup.) Also John was not clothed in soft raiment, that is, he did not encourage sinners in their sinful life by speaking smooth things, but rebuked them with sharpness and rigour, saying, Generation of vipers, &c. (Mat. 3:7)", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 8, "f": "Jerome", "w": "", "t": "If the Lord had intended a higher meaning unfavorable to John, as many imagine that he did, in saying “Blessed is the one who takes no offense at me,” why does he now speak about John with highest praise? Because the crowd that was present did not know the inner purpose of John’s question. They thought John doubted Christ, although he himself had prophesied about him. Now the crowd learns that John asked not on his own behalf but on that of his disciples. “Why did you go out into the wilderness?” To see a man like a reed who is blown about by every wind, a man so irresolute that he cannot make up his mind about what he himself previously predicted? Or else, perhaps he is pricked by the goad of his envy for me, and his preaching runs after an empty fame, and he covets the money he may get by it? But why should this man desire wealth for abundance of feasting? He feeds on locusts and wild honey. Or wealth to wear soft clothes? His clothes are made of camel’s hair. But people who are flatterers, and run after money, and covet wealth, and overflow with luxury and wear soft clothes—such people live in the palaces of kings. Thus it is shown that the austere way of life and the strict preaching must avoid the halls of kings and turn away from the palaces of the luxurious.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 8, "f": "Jerome", "w": "", "t": "(Verse 8.) But what did you go out to see, a prophet? Yes, I tell you, and more than a prophet. In him, John is greater than the other prophets, because while they had predicted someone who was to come, he pointed to the one who has already come, saying: Behold the Lamb of God, behold him who takes away the sins of the world. And because to the privilege of being a prophet, John added the reward of baptizing his Lord, it follows that he increased in merits, fulfilling the testimony of Malachi, in which even an angel is prophesied (Mal. II). However, here the term 'angel' cannot be understood as referring to John by nature, but rather by the dignity of his office, that is, as a messenger who announced the coming of the Lord.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 8, "f": "Jerome", "w": "", "t": "This teaches that an austere life and strict preaching ought to shun kings' courts and the palaces of the rich and luxurious.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 8, "f": "Jerome", "w": "", "t": "Mystically; By the garment wherewith his body is clothed is his mind shown, that it is lost in luxury and self-indulgence. The kings are the fallen angels; they are they who are powerful in this life, and the lords of this world. Thus, They that are clothed in soft raiment are in kings' houses; that is, those whose bodies are enervated and destroyed by luxury, it is clear are possessed by dæmons.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 8, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But what went ye out for to see? A man clothed in soft raiment? Behold, they that wear soft clothing are in kings' houses. Matthew 11:8", "lang": "", "orig": "", "d": "c. 388"}, {"v": 8, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And as they departed, Jesus began to say unto the multitudes concerning John, What went y

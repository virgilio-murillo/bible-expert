 rest to labour. But the Holy Spirit was there who, as the outward man decayed, renewed the inward man day by day, and giving a foretaste of spiritual rest in the rich pleasures of God in the hope of blessedness to come, smoothed all that seemed rough, lightened all that was heavy. Men suffer amputations and burnings, that at the price of sharper pain they may be delivered from torments less but more lasting, as boils or swellings. What storms and dangers will not merchants undergo that they may acquire perishing riches? Even those who love not riches endure the same hardships; but those that love them endure the same, but to them they are not hardships. For love makes right easy, and almost nought all things however dreadful and monstrous. How much more easily then does love do that for true happiness, which avarice does for misery as far as it can?", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 30, "f": "CS Lewis", "w": "", "t": "Both harder and easier than what we are all trying to do. You have noticed, I expect, that Christ Himself sometimes describes the Christian way as very hard, sometimes as very easy. He says, 'Take up your Cross'—in other words, it is like going to be beaten to death in a concentration camp. Next minute he says, 'My yoke is easy and my burden light.' He means both. And one can just see why both are true.\n\nTeachers will tell you that the laziest boy in the class is the one who works hardest in the end. They mean this. If you give two boys, say, a proposition in geometry to do, the one who is prepared to take trouble will try to understand it. The lazy boy will try to learn it by heart because, for the moment, that needs less effort. But six months later, when they are preparing for an exam, that lazy boy is doing hours and hours of miserable drudgery over things the other boy understands, and positively enjoys, in a few minutes. Laziness means more work in the long run. Or look at it this way. In a battle, or in mountain climbing, there is often one thing which it takes a lot of pluck to do; but it is also, in the long run, the safest thing to do. If you funk it, you will find yourself, hours later, in far worse danger. The cowardly thing is also the most dangerous thing.\n\nIt is like that here. The terrible thing, the almost impossible thing, is to hand over your whole self—all your wishes and precautions—to Christ. But it is far easier than what we are all trying to do instead", "lang": "english", "orig": "", "d": "1942"}, {"v": 30, "f": "Desert Fathers", "w": "", "t": "Joseph asked Poemen, ‘How should we fast?’ Poemen said, ‘I suggest that everyone should eat a little less than he wants, every day.’ Joseph said to him, ‘When you were a young man, didn’t you fast for two days on end?’ He said to him, ‘That’s right, I used to fast three days on end, even for a week. But the great hermits have tested all these things, and they found that it is good to eat something every day, but on some days a little less. They have shown us that this is the king’s highway, for it is easy and light.’", "lang": "english", "orig": "", "d": ""}, {"v": 30, "f": "Epiphanius Scholasticus", "w": "", "t": "Therefore let everyone who wants life and desires to see good days put down the yoke of iniquity and malice. The prophet says, “Let us burst their bonds and thrust their yoke from us.” For unless one throws behind the yoke of iniquity, that is, the spark of all vices, one cannot take up the agreeable and light yoke of Christ. But if the yoke of Christ is so agreeable and light, how is it that divine religion seems so harsh and bitter to some people? It is bitter to some because the heart that has been tainted by earthly desires cannot love heavenly things. It has not yet come to Christ, so that it can take up his yoke and learn that he is gentle and humble of heart. Hence we observe, my dearest friends, from the teaching of our Lord, that unless a person is gentle and humble of heart, he or she cannot bear the yoke of Christ.", "lang": "english", "orig": "", "d": "c. 375"}, {"v": 30, "f": "Eusebius - Church History", "w": "Chap. II.", "t": "to come. For such a custom, if it is clearly\n1719 Matt. xi. 30.\n\n\nnot contrary to the faith nor to sound morality, is to be held as a thing indifferent, and ought\nto be observed for the sake of fellowship with those among whom we live.", "lang": "greek", "orig": "", "d": "260-340"}, {"v": 30, "f": "Gregory the Dialogist", "w": "", "t": "(Mor. iv. 33.) What burden is it to put upon the neck of our mind that He bids us shun all desire that disturbs, and turn from the toilsome paths of this world?", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 30, "f": "Jerome", "w": "", "t": "(Verse 30.) For my yoke is easy, and my burden is light. How is the Gospel lighter than the Law, when in the Law murder is condemned, but in the Gospel anger is condemned? In what way is the grace of the Gospel easier, when in the Law adultery is punished, but in the Gospel lust is punished? In the Law there are many precepts, which the Apostle teaches cannot be fully fulfilled (Acts 15). In the Law, works are required, and whoever does them shall live. In the Gospel, the will is sought, and even if it does not have the desired effect, it does not lose the reward. The Gospel commands what we are able to do: that we do not desire, namely, this is within our power. When the law does not punish the will, it punishes the effect, so that you do not commit adultery. Imagine a virgin prostitute in persecution. This virgin is accepted according to the Gospel, since she does not sin by her own will, but she is rejected in the Law as if corrupted.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 30, "f": "Jerome", "w": "", "t": "And how is the Gospel lighter than the Law, seeing in the Law murder and adultery, but under the Gospel anger and concupiscence also, are punished? Because by the Law many things are commanded which the Apostle fully teaches us cannot be fulfilled; by the Law works are required, by the Gospel the will is sought for, which even if it goes not into act, yet does not lose its reward. The Gospel commands what we can do, as that we lust not; this is in our own power; the Law punishes not the will but the act, as adultery. Suppose a virgin to have been violated in time of persecution; as here was not the will she is held as a virgin under the Gospel; under the Law she is cast out as defiled.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 30, "f": "Rabanus Maurus", "w": "", "t": "But how is Christ's yoke pleasant, seeing it was said above, Narrow is the way which leadeth unto life? (Mat. 7:14.) That which is entered upon by a narrow entrance is in process of time made broad by the unspeakable sweetness of love.", "lang": "english", "orig": "", "d": "c. 840"}, {"v": 30, "f": "Tertullian", "w": "", "t": "And so they upbraid the discipline of monogamy with being a heresy; nor is there any other cause whence they find themselves compelled to deny the Paraclete more than the fact that they esteem Him to be the institutor of a novel discipline, and a discipline which they find most harsh: so that this is already the first ground on which we must join issue in a general handling (of the subject), whether there is room for maintaining that the Paraclete has taught any such thing as can either be charged with novelty, in opposition to catholic tradition, or with burdensomeness, in opposition to the \"light burden\" of the Lord.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 30, "f": "Theodore of Mopsuestia", "w": "", "t": "How is it then that he himself demands a high degree of strictness? He answers, “You have not yet had experience of things that are mine, and for this reason you think this way. But if you would take up my yoke and would believe in those things I give, you would find the greatest difference between the things that are from me and those that are from Moses. From me there is great, patient endurance and kindness. Seeing such a weight of sins—murders and self-love and things more unnamable than these—I am longsuffering and bear with those who do these things, not despising them but waiting for them to repent. If ever they should repent and change their ways, I immediately forgive them, not remembering their former acts. But the law of Moses is not like this. When you sin, it immediately punishes the sinner. It knows no repentance. It promises no remission. When I make demands about the covenant, I am not so much preoccupied with investigating the things that happened. For me, it is enough that a soul choose what is good with a genuine resolution. But the law goes overboard, both adding more punishments to the smaller ones and cursing the transgressors. Therefore my yoke is good on account of forgiveness, and my burden is light because it is not a collection of customs and various observances but decisions of the soul.”", "lang": "english", "orig": "", "d": ""}, {"v": 30, "f": "Thomas Aquinas", "w": "", "t": "But do not wonder if I invite you to a yoke, because my yoke is not a burden. Why? For my yoke is easy and delightful: \"How sweet are your words to my taste!\" (Ps 119:103). And my burden is light. And these can be referred to two things: by the yoke the oxen are held, but the burden is carried; hence the yoke is referred to the negative precepts, the burden to the affirmative.\n\nBut this seems to be false, because the burden of the New Law seems very heavy, as was said above (5:21): \"You have heard that it was said of old: You shall not kill. But I say to you that everyone who is angry with his brother will be liable to the judgment.\" So it seems that it is a heavier burden: \"Narrow is the way, which leads to life.\" Likewise the Apostle in 2 Corinthians (11:23): \"In many labors.\" Hence the yoke seems most burdensome. Therefore, three things must be considered: the effect of the teaching, the act and the circumstances. And in all three it is light.\n\nThe doctrine of Christ is light in its effect, because it changes the heart, in as much as it makes us love not temporal but spiritual things. For the person who loves temporal things finds it more a burden to lose a little than a person who loves spiritual things to lose much. The Old Law did not forbid those temporal things; therefore it was painful to lose them. But now, even though it is burdensome in the beginning, after a while it is light: \"I will lead you in the paths of uprightness. When you walk, your steps will not be ham", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 40, "f": "1 Clement", "w": "Chapter XXXI.—The preservation of our bodies is confirmed by the resurrection\nand ascension of Christ: the souls of the saints during the intermediate period\nare in a state of expectation of that time when they shall receive their perfect and\nconsummated glory.", "t": "2. If, then, the Lord observed the law of the dead, that He might become the first-begotten\nfrom the dead, and tarried until the third day “in the lower parts of the earth;”2067 then afterwards\nrising in the flesh, so that He even showed the print of the nails to His disciples,2068\n2062 See the note, book iii. xx. 4.\n2063 Matt. xi. 40.\n2064 Eph. iv. 9.\n2065 Ps. lxxxvi. 23.\n2066 John xx. 17.\n2067 Eph. iv. 9.\n2068 John xx. 20, 27.\n\n\nHe thus ascended to the Father;—[if all these things occurred, I say], how must these men\nnot be put to confusion, who allege that “the lower parts” refer to this world of ours, but\nthat their inner man, leaving the body here, ascends into the super-celestial place? For as\nthe Lord “went away in the midst of the shadow of death,”2069 where the souls of the dead\nwere, yet afterwards arose in the body, and after the resurrection was taken up [into heaven],\nit is manifest that the souls of His disciples also, upon whose account the Lord underwent\nthese things, shall go away into the invisible place allotted to them by God, and there remain\nuntil the resurrection, awaiting that event; then receiving their bodies, and rising in their\nentirety, that is bodily, just as the Lord arose, they shall come thus into the presence of God.\n“For no disciple is above the Master, but every one that is perfect shall be as his Master.”2070\nAs our Master, therefore, did not at once depart, taking flight [to heaven], but awaited the\ntime of His resurrection prescribed by ", "lang": "greek", "orig": "", "d": "70-165"}, {"v": 40, "f": "1 Clement", "w": "Chapter XXXI.—The preservation of our bodies is confirmed by the resurrection\nand ascension of Christ: the souls of the saints during the intermediate period\nare in a state of expectation of that time when they shall receive their perfect and\nconsummated glory.", "t": "les,2068\n2062 See the note, book iii. xx. 4.\n2063 Matt. xi. 40.\n2064 Eph. iv. 9.\n2065 Ps. lxxxvi. 23.\n2066 John xx. 17.\n2067 Eph. iv. 9.\n2068 John xx. 20, 27.\n\n\nHe thus ascended to the Father;—[if all these things occurred, I say], how must these men\nnot be put", "lang": "greek", "orig": "", "d": "70-165"}], "xrefs": [{"v": 5, "ref": "Isaiah 29:18", "rel": "cross-reference", "text": {"es": "Y en aquel tiempo los sordos oirán las palabras del libro, y los ojos de los ciegos verán en medio de la oscuridad y de las tinieblas.", "gr": ""}}, {"v": 5, "ref": "Isaiah 35:4", "rel": "cross-reference", "text": {"es": "Decid á los de corazón apocado: Confortaos, no temáis: he aquí que vuestro Dios viene con venganza, con pago: el mismo Dios vendrá, y os salvará.", "gr": ""}}, {"v": 5, "ref": "Isaiah 35:6", "rel": "cross-reference", "text": {"es": "Entonces el cojo saltará como un ciervo, y cantará la lengua del mudo; porque aguas serán cavadas en el desierto, y torrentes en la soledad.", "gr": ""}}, {"v": 5, "ref": "Isaiah 42:6", "rel": "cross-reference", "text": {"es": "Yo Jehová te he llamado en justicia, y te tendré por la mano; te guardaré y te pondré por alianza del pueblo, por luz de las gentes;", "gr": ""}}, {"v": 5, "ref": "Isaiah 42:7", "rel": "cross-reference", "text": {"es": "Para que abras ojos de ciegos, para que saques de la cárcel á los presos, y de casas de prisión á los que están de asiento en tinieblas.", "gr": ""}}, {"v": 5, "ref": "Isaiah 61:1", "rel": "cross-reference", "text": {"es": "EL espíritu del Señor Jehová es sobre mí, porque me ungió Jehová; hame enviado á predicar buenas nuevas á los abatidos, á vendar á los quebrantados de corazón, á publicar libertad á los cautivos, y á los presos abertura de la cárcel;", "gr": ""}}, {"v": 5, "ref": "Isaiah 61:3", "rel": "cross-reference", "text": {"es": "A ordenar á Sión á los enlutados, para darles gloria en lugar de ceniza, óleo de gozo en lugar del luto, manto de alegría en lugar del espíritu angustiado; y serán llamados árboles de justicia, plantío de Jehová, para gloria suya.", "gr": ""}}, {"v": 5, "ref": "John 14:11", "rel": "cross-reference", "text": {"es": "Creedme que yo soy en el Padre, y el Padre en mí: de otra manera, creedme por las mismas obras.", "gr": "πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε."}}, {"v": 6, "ref": "1 Corinthians 2:14", "rel": "cross-reference", "text": {"es": "Mas el hombre animal no percibe las cosas que son del Espíritu de Dios, porque le son locura: y no las puede entender, porque se han de examinar espiritualmente.", "gr": "Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·"}}, {"v": 6, "ref": "Isaiah 8:14", "rel": "cross-reference", "text": {"es": "Entonces él será por santuario; mas á las dos casas de Israel por piedra para tropezar, y por tropezadero para caer, y por lazo y por red al morador de Jerusalem.", "gr": ""}}, {"v": 6, "ref": "Isaiah 8:15", "rel": "cross-reference", "text": {"es": "Y muchos tropezarán entre ellos, y caerán, y serán quebrantados: enredaránse, y serán presos.", "gr": ""}}, {"v": 10, "ref": "Isaiah 40:3", "rel": "cross-reference", "text": {"es": "Voz que clama en el desierto: Barred camino á Jehová: enderezad calzada en la soledad á nuestro Dios.", "gr": ""}}, {"v": 10, "ref": "John 1:23", "rel": "cross-reference", "text": {"es": "Dijo: Yo soy la voz del que clama en el desierto: Enderezad el camino del Señor, como dijo Isaías profeta.", "gr": "ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης."}}, {"v": 10, "ref": "Luke 7:26", "rel": "cross-reference", "text": {"es": "Mas ¿qué salisteis á ver? ¿un profeta? También os digo, y aun más que profeta.", "gr": "ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου."}}, {"v": 10, "ref": "Luke 7:27", "rel": "cross-reference", "text": {"es": "Este es de quien está escrito: He aquí, envío mi mensajero delante de tu faz, El cual aparejará tu camino delante de ti.", "gr": "οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου."}}, {"v": 10, "ref": "Malachi 3:1", "rel": "cross-reference", "text": {"es": "HE aquí, yo envío mi mensajero, el cual preparará el camino delante de mí: y luego vendrá á su templo el Señor á quien vosotros buscáis, y el ángel del pacto, á quien deseáis vosotros. He aquí viene, ha dicho Jehová de los ejércitos.", "gr": ""}}, {"v": 10, "ref": "Malachi 4:5", "rel": "cross-reference", "text": {"es": "He aquí, yo os envío á Elías el profeta, antes que venga el día de Jehová grande y terrible.", "gr": ""}}, {"v": 10, "ref": "Mark 1:2", "rel": "cross-reference", "text": {"es": "Como está escrito en Isaías el profeta: He aquí yo envío á mi mensajero delante de tu faz, Que apareje tu camino delante de ti.", "gr": "⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·"}}, {"v": 10, "ref": "Matthew 3:3", "rel": "cross-reference", "text": {"es": "Porque éste es aquel del cual fué dicho por el profeta Isaías, que dijo: Voz de uno que clama en el desierto: Aparejad el camino del Señor, Enderezad sus veredas.", "gr": "οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ."}}, {"v": 11, "ref": "Luke 7:28", "rel": "cross-reference", "text": {"es": "Porque os digo que entre los nacidos de mujeres, no hay mayor profeta que Juan el Bautista: mas el más pequeño en el reino de los cielos es mayor que él.", "gr": "⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν."}}, {"v": 12, "ref": "Ephesians 6:11", "rel": "cross-reference", "text": {"es": "Vestíos de toda la armadura de Dios, para que podáis estar firmes contra las asechanzas del diablo.", "gr": "ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·"}}, {"v": 12, "ref": "Ephesians 6:13", "rel": "cross-reference", "text": {"es": "Por tanto, tomad toda la armadura de Dios, para que podáis resistir en el día malo, y estar firmes, habiendo acabado todo.", "gr": "διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι."}}, {"v": 12, "ref": "John 6:27", "rel": "cross-reference", "text": {"es": "Trabajad no por la comida que perece, mas por la comida que á vida eterna permanece, la cual el Hijo del hombre os dará: porque á éste señaló el Padre, que es Dios.", "gr": "ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός."}}, {"v": 12, "ref": "Luke 13:24", "rel": "cross-reference", "text": {"es": "Porfiad á entrar por la puerta angosta; porque os digo que muchos procurarán entrar, y no podrán.", "gr": "Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,"}}, {"v": 12, "ref": "Luke 16:16", "rel": "cross-reference", "text": {"es": "La ley y los profetas hasta Juan: desde entonces el reino de Dios es anunciado, y quienquiera se esfuerza á entrar en él.", "gr": "Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται."}}, {"v": 12, "ref": "Luke 7:29", "rel": "cross-reference", "text": {"es": "Y todo el pueblo oyéndole, y los publicanos, justificaron á Dios, bautizándose con el bautismo de Juan.", "gr": "(καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·"}}, {"v": 12, "ref": "Luke 7:30", "rel": "cross-reference", "text": {"es": "Mas los Fariseos y los sabios de la ley, desecharon el consejo de Dios contra sí mismos, no siendo bautizados de él.", "gr": "οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)"}}, {"v": 12, "ref": "Matthew 21:23", "rel": "cross-reference", "text": {"es": "Y como vino al templo, llegáronse á él cuando estaba enseñando, los príncipes de los sacerdotes y los ancianos del pueblo, diciendo. ¿Con qué autoridad haces esto? ¿y quién te dió esta autoridad?", "gr": "Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;"}}, {"v": 14, "ref": "Malachi 4:5", "rel": "cross-reference", "text": {"es": "He aquí, yo os envío á Elías el profeta, antes que venga el día de Jehová grande y terrible.", "gr": ""}}, {"v": 14, "ref": "Mark 9:11", "rel": "cross-reference", "text": {"es": "Y le preguntaron, diciendo: ¿Qué es lo que los escribas dicen, que es necesario que Elías venga antes?", "gr": "καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;"}}, {"v": 14, "ref": "Mark 9:13", "rel": "cross-reference", "text": {"es": "Empero os digo que Elías ya vino, y le hicieron todo lo que quisieron, como está escrito de él.", "gr": "ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθ  el más pequeño en el reino de los cielos, mayor es que él.", "12": "Desde los días de Juan el Bautista hasta ahora, el reino de los cielos sufre violencia, y los violentos lo arrebatan.", "13": "Porque todos los profetas y la ley profetizaron hasta Juan.", "14": "Y si queréis recibirlo, él es aquel Elías que había de venir.", "15": "El que tiene oídos para oír, oiga.", "16": "Mas ¿a qué compararé esta generación? Es semejante a los muchachos que se sientan en las plazas, y dan voces a sus compañeros,", "17": "diciendo: Os tocamos flauta, y no bailasteis; os endechamos, y no lamentasteis.", "18": "Porque vino Juan, que ni comía ni bebía, y dicen: Demonio tiene.", "19": "Vino el Hijo del Hombre, que come y bebe, y dicen: He aquí un hombre comilón, y bebedor de vino, amigo de publicanos y de pecadores. Pero la sabiduría es justificada por sus hijos.", "20": "Entonces comenzó a reconvenir a las ciudades en las cuales había hecho muchos de sus milagros, porque no se habían arrepentido, diciendo:", "21": "¡Ay de ti, Corazín! ¡Ay de ti, Betsaida! Porque si en Tiro y en Sidón se hubieran hecho los milagros que han sido hechos en vosotras, tiempo ha que se hubieran arrepentido en cilicio y en ceniza.", "22": "Por tanto os digo que en el día del juicio, será más tolerable el castigo para Tiro y para Sidón, que para vosotras.", "23": "Y tú, Capernaum, que eres levantada hasta el cielo, hasta el Hades serás abatida; porque si en Sodoma se hubieran hecho los milagros que han sido hechos en ti, habría permanecido hasta el día de hoy.", "24": "Por tanto os digo que en el día del juicio, será más tolerable el castigo para la tierra de Sodoma, que para ti.", "25": "En aquel tiempo, respondiendo Jesús, dijo: Te alabo, Padre, Señor del cielo y de la tierra, porque escondiste estas cosas de los sabios y de los entendidos, y las revelaste a los niños.", "26": "Sí, Padre, porque así te agradó.", "27": "Todas las cosas me fueron entregadas por mi Padre; y nadie conoce al Hijo, sino el Padre, ni al Padre conoce alguno, sino el Hijo, y aquel a quien el Hijo lo quiera revelar.", "28": "Venid a mí todos los que estáis trabajados y cargados, y yo os haré descansar.", "29": "Llevad mi yugo sobre vosotros, y aprended de mí, que soy manso y humilde de corazón; y hallaréis descanso para vuestras almas;", "30": "porque mi yugo es fácil, y ligera mi carga."}, "translations": {"RVR60": {"1": "Cuando Jesús terminó de dar instrucciones a sus doce discípulos, se fue de allí a enseñar y a predicar en las ciudades de ellos.", "2": "Y al oír Juan, en la cárcel, los hechos de Cristo, le envió dos de sus discípulos,", "3": "para preguntarle: ¿Eres tú aquel que había de venir, o esperaremos a otro?", "4": "Respondiendo Jesús, les dijo: Id, y haced saber a Juan las cosas que oís y veis.", "5": "Los ciegos ven, los cojos andan, los leprosos son limpiados, los sordos oyen, los muertos son resucitados, y a los pobres es anunciado el evangelio;", "6": "y bienaventurado es el que no halle tropiezo en mí.", "7": "Mientras ellos se iban, comenzó Jesús a decir de Juan a la gente: ¿Qué salisteis a ver al desierto? ¿Una caña sacudida por el viento?", "8": "¿O qué salisteis a ver? ¿A un hombre cubierto de vestiduras delicadas? He aquí, los que llevan vestiduras delicadas, en las casas de los reyes están.", "9": "Pero ¿qué salisteis a ver? ¿A un profeta? Sí, os digo, y más que profeta.", "10": "Porque éste es de quien está escrito: He aquí, yo envío mi mensajero delante de tu faz, El cual preparará tu camino delante de ti.", "11": "De cierto os digo: Entre los que nacen de mujer no se ha levantado otro mayor que Juan el Bautista; pero el más pequeño en el reino de los cielos, mayor es que él.", "12": "Desde los días de Juan el Bautista hasta ahora, el reino de los cielos sufre violencia, y los violentos lo arrebatan.", "13": "Porque todos los profetas y la ley profetizaron hasta Juan.", "14": "Y si queréis recibirlo, él es aquel Elías que había de venir.", "15": "El que tiene oídos para oír, oiga.", "16": "Mas ¿a qué compararé esta generación? Es semejante a los muchachos que se sientan en las plazas, y dan voces a sus compañeros,", "17": "diciendo: Os tocamos flauta, y no bailasteis; os endechamos, y no lamentasteis.", "18": "Porque vino Juan, que ni comía ni bebía, y dicen: Demonio tiene.", "19": "Vino el Hijo del Hombre, que come y bebe, y dicen: He aquí un hombre comilón, y bebedor de vino, amigo de publicanos y de pecadores. Pero la sabiduría es justificada por sus hijos.", "20": "Entonces comenzó a reconvenir a las ciudades en las cuales había hecho muchos de sus milagros, porque no se habían arrepentido, diciendo:", "21": "¡Ay de ti, Corazín! ¡Ay de ti, Betsaida! Porque si en Tiro y en Sidón se hubieran hecho los milagros que han sido hechos en vosotras, tiempo ha que se hubieran arrepentido en cilicio y en ceniza.", "22": "Por tanto os digo que en el día del juicio, será más tolerable el castigo para Tiro y para Sidón, que para vosotras.", "23": "Y tú, Capernaum, que eres levantada hasta el cielo, hasta el Hades serás abatida; porque si en Sodoma se hubieran hecho los milagros que han sido hechos en ti, habría permanecido hasta el día de hoy.", "24": "Por tanto os digo que en el día del juicio, será más tolerable el castigo para la tierra de Sodoma, que para ti.", "25": "En aquel tiempo, respondiendo Jesús, dijo: Te alabo, Padre, Señor del cielo y de la tierra, porque escondiste estas cosas de los sabios y de los entendidos, y las revelaste a los niños.", "26": "Sí, Padre, porque así te agradó.", "27": "Todas las cosas me fueron entregadas por mi Padre; y nadie conoce al Hijo, sino el Padre, ni al Padre conoce alguno, sino el Hijo, y aquel a quien el Hijo lo quiera revelar.", "28": "Venid a mí todos los que estáis trabajados y cargados, y yo os haré descansar.", "29": "Llevad mi yugo sobre vosotros, y aprended de mí, que soy manso y humilde de corazón; y hallaréis descanso para vuestras almas;", "30": "porque mi yugo es fácil, y ligera mi carga."}, "RVR1909": {"1": "Y FUÉ, que acabando Jesús de dar mandamientos á sus doce discípulos, se fué de allí á enseñar y á predicar en las ciudades de ellos.", "2": "Y oyendo Juan en la prisión los hechos de Cristo, le envió dos de sus discípulos,", "3": "Diciendo: ¿Eres tú aquél que había de venir, ó esperaremos á otro?", "4": "Y respondiendo Jesús, les dijo: Id, y haced saber á Juan las cosas que oís y veis:", "5": "Los ciegos ven, y los cojos andan; los leprosos son limpiados, y los sordos oyen; los muertos son resucitados, y á los pobres es anunciado el evangelio.", "6": "Y bienaventurado es el que no fuere escandalizado en mí.", "7": "E idos ellos, comenzó Jesús á decir de Juan á las gentes: ¿Qué salisteis á ver al desierto? ¿una caña que es meneada del viento?", "8": "Mas ¿qué salisteis á ver? ¿un hombre cubierto de delicados vestidos? He aquí, los que traen vestidos delicados, en las casas de los reyes están.", "9": "Mas ¿qué salisteis á ver? ¿un profeta? También os digo, y más que profeta.", "10": "Porque éste es de quien está escrito: He aquí, yo envío mi mensajero delante de tu faz, Que aparejará tu camino delante de ti.", "11": "De cierto os digo, que no se levantó entre los que nacen de mujeres otro mayor que Juan el Bautista; mas el que es muy más pequeño en el reino de los cielos, mayor es que él.", "12": "Desde los días de Juan el Bautista hasta ahora, al reino de los cielos se hace fuerza, y los valientes lo arrebatan.", "13": "Porque todos los profetas y la ley hasta Juan profetizaron.", "14": "Y si queréis recibir, él es aquel Elías que había de venir.", "15": "El que tiene oídos para oir, oiga.", "16": "Mas ¿á quién compararé esta generación? Es semejante á los muchachos que se sientan en las plazas, y dan voces á sus compañeros,", "17": "Y dicen: Os tañimos flauta, y no bailasteis; os endechamos, y no lamentasteis.", "18": "Porque vino Juan, que ni comía ni bebía, y dicen: Demonio tiene.", "19": "Vino el Hijo del hombre, que come y bebe, y dicen: He aquí un hombre comilón, y bebedor de vino, amigo de publicanos y de pecadores. Mas la sabiduría es justificada por sus hijos.", "20": "Entonces comenzó á reconvenir á las ciudades en las cuales habían sido hechas muy muchas de sus maravillas, porque no se habían arrepentido, diciendo:", "21": "¡Ay de ti, Corazín! ¡Ay de ti, Bethsaida! porque si en Tiro y en Sidón fueran hechas las maravillas que han sido hechas en vosotras, en otro tiempo se hubieran arrepentido en saco y en ceniza.", "22": "Por tanto os digo, que á Tiro y á Sidón será más tolerable el castigo en el día del juicio, que á vosotras.", "23": "Y tú, Capernaum, que eres levantada hasta el cielo, hasta los infiernos serás abajada; porque si en los de Sodoma fueran hechas las maravillas que han sido hechas en ti, hubieran quedado hasta el día de hoy.", "24": "Por tanto os digo, que á la tierra de los de Sodoma será más tolerable el castigo en el día del juicio, que á ti.", "25": "En aquel tiempo, respondiendo Jesús, dijo: Te alabo, Padre, Señor del cielo y de la tierra, que hayas escondido estas cosas de los sabios y de los entendidos, y las hayas revelado á los niños.", "26": "Así, Padre, pues que así agradó en tus ojos.", "27": "Todas las cosas me son entregadas de mi Padre: y nadie conoció al Hijo, sino el Padre; ni al Padre conoció alguno, sino el Hijo, y aquel á quien el Hijo lo quisiere revelar.", "28": "Venid á mí todos los que estáis trabajados y cargados, que yo os haré descansar.", "29": "Llevad mi yugo sobre vosotros, y aprended de mí, que soy manso y humilde de corazón; y hallaréis descanso para vuestras almas.", "30": "Porque mi yugo es fácil, y ligera mi carga."}, "KJV": {"1": "And it came to pass, when Jesus had made an end of commanding his twelve disciples, he departed thence to teach and to preach in their cities.", "2": "Now when John had heard in the prison the works of Christ, he sent two of his disciples,", "3": "And said unto him, Art thou he that should come, or do we look for another?", "4": "Jesus answered and said unto them, Go and shew John again those things which ye do hear and see:", "5": "The blind receive their sight, and the lame walk, the lepers are cleansed, and the deaf hear, the dead are raised up, and the poor have the gospel preached to them.", "6": "And blessed is he, whosoever shall not be offended in me.", "7": "And as they departed, Jesus began to say unto the multitudes concerning John, What went ye out into the wilderness to see? A reed shaken with the wind?", "8": "But what went ye out for to see? A man clothed in soft raiment? behold, they that wear soft clothing are in kings’ houses.", "9": "But what went ye out for to see? A prophet? yea, I say unto you, and more than a prophet.", "10": "For this is he, of whom it is written, Behold, I send my messenger before thy face, which shall prepare thy way before thee.", "11": "Verily I say unto you, Among them that are born of women there hath not risen a greater than John the Baptist: notwithstanding he that is least in the kingdom of heaven is greater than he.", "12": "And from the days of John the Baptist until now the kingdom of heaven suffereth violence, and the violent take it by force.", "13": "For all the prophets and the law prophesied until John.", "14": "And if ye will receive it, this is Elias, which was for to come.", "15": "He that hath ears to hear, let him hear.", "16": "But whereunto shall I liken this generation? It is like unto children sitting in the markets, and calling unto their fellows,", "17": "And saying, We have piped unto you, and ye have not danced; we have mourned unto you, and ye have not lamented.", "18": "For John came neither eating nor drinking, and they say, He hath a devil.", "19": "The Son of man came eating and drinking, and they say, Behold a man gluttonous, and a winebibber, a friend of publicans and sinners. But wisdom is justified of her children.", "20": "Then began he to upbraid the cities wherein most of his mighty works were done, because they repented not:", "21": "Woe unto thee, Chorazin! woe unto thee, Bethsaida! for if the mighty works, which were done in you, had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.", "22": "But I say unto you, It shall be more tolerable for Tyre and Sidon at the day of judgment, than for you.", "23": "And thou, Capernaum, which art exalted unto heaven, shalt be brought down to hell: for if the mighty works, which have been done in thee, had been done in Sodom, it would have remained until this day.", "24": "But I say unto you, That it shall be more tolerable for the land of Sodom in the day of judgment, than for thee.", "25": "At that time Jesus answered and said, I thank thee, O Father, Lord of heaven and earth, because thou hast hid these things from the wise and prudent, and hast revealed them unto babes.", "26": "Even so, Father: for so it seemed good in thy sight.", "27": "All things are delivered unto me of my Father: and no man knoweth the Son, but the Father; neither knoweth any man the Father, save the Son, and he to whomsoever the Son will reveal him.", "28": "Come unto me, all ye that labour and are heavy laden, and I will give you rest.", "29": "Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls.", "30": "For my yoke is easy, and my burden is light. "}, "ASV": {"1": "And it came to pass when Jesus had finished commanding his twelve disciples, he departed thence to teach and preach in their cities. ", "2": "Now when John heard in the prison the works of the Christ, he sent by his disciples", "3": "and said unto him, Art thou he that cometh, or look we for another? ", "4": "And Jesus answered and said unto them, Go and tell John the things which ye hear and see: ", "5": "the blind receive their sight, and the lame walk, the lepers are cleansed, and the deaf hear, and the dead are raised up, and the poor have good tidings preached to them. ", "6": "And blessed is he, whosoever shall find no occasion of stumbling in me. ", "7": "And as these went their way, Jesus began to say unto the multitudes concerning John, What went ye out into the wilderness to behold? a reed shaken with the wind? ", "8": "But what went ye out to see? a man clothed in soft raiment? Behold, they that wear soft raiment are in kings’ houses. ", "9": "But wherefore went ye out? to see a prophet? Yea, I say unto you, and much more than a prophet. ", "10": "This is he, of whom it is written,  Behold, I send my messenger before thy face, Who shall prepare thy way before thee.  ", "11": "Verily I say unto you, Among them that are born of women there hath not arisen a greater than John the Baptist: yet he that is but little in the kingdom of heaven is greater than he. ", "12": "And from the days of John the Baptist until now the kingdom of heaven suffereth violence, and men of violence take it by force. ", "13": "For all the prophets and the law prophesied until John. ", "14": "And if ye are willing to receive it, this is Elijah, that is to come. ", "15": "He that hath ears to hear, let him hear. ", "16": "But whereunto shall I liken this generation? It is like unto children sitting in the marketplaces, who call unto their fellows ", "17": "and say, We piped unto you, and ye did not dance; we wailed, and ye did not mourn. ", "18": "For John came neither eating nor drinking, and they say, He hath a demon. ", "19": "The Son of man came eating and drinking, and they say, Behold, a gluttonous man and a winebibber, a friend of publicans and sinners! And wisdom is justified by her works. ", "20": "Then began he to upbraid the cities wherein most of his mighty works were done, because they repented not. ", "21": "Woe unto thee, Chorazin! woe unto thee, Bethsaida! for if the mighty works had been done in Tyre and Sidon which were done in you, they would have repented long ago in sackcloth and ashes. ", "22": "But I say unto you, it shall be more tolerable for Tyre and Sidon in the day of judgment, than for you. ", "23": "And thou, Capernaum, shalt thou be exalted unto heaven? thou shalt go down unto Hades: for if the mighty works had been done in Sodom which were done in thee, it would have remained until this day. ", "24": "But I say unto you that it shall be more tolerable for the land of Sodom in the day of judgment, than for thee. ", "25": "At that season Jesus answered and said, I thank thee, O Father, Lord of heaven and earth, that thou didst hide these things from the wise and understanding, and didst reveal them unto babes: ", "26": "yea, Father, for so it was well-pleasing in thy sight. ", "27": "All things have been delivered unto me of my Father: and no one knoweth the Son, save the Father; neither doth any know the Father, save the Son, and he to whomsoever the Son willeth to reveal him. ", "28": "Come unto me, all ye that labor and are heavy laden, and I will give you rest. ", "29": "Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls. ", "30": "For my yoke is easy, and my burden is light.  "}, "BSB": {"1": " After Jesus had finished instructing His twelve disciples, He went on from there to teach and preach in their cities.", "2": "Meanwhile John heard in prison about the works of Christ, and he sent his disciples", "3": "to ask Him, “Are You the One who was to come, or should we look for someone else?” ", "4": "Jesus replied, “Go back and report to John what you hear and see: ", "5": "The blind receive sight, the lame walk, the lepers are cleansed, the deaf hear, the dead are raised, and the good news is preached to the poor. ", "6": "Blessed is the one who does not fall away on account of Me.” ", "7": "  As John’s disciples were leaving, Jesus began to speak to the crowds about John: “What did you go out into the wilderness to see? A reed swaying in the wind? ", "8": "Otherwise, what did you go out to see? A man dressed in fine clothes? Look, those who wear fine clothing are found in kings’ palaces. ", "9": "What then did you go out to see? A prophet? Yes, I tell you, and more than a prophet. ", "10": "This is the one about whom it is written:  ‘Behold, I will send My messenger ahead of You, who will prepare Your way before You.’  ", "11": "Truly I tell you, among those born of women there has risen no one greater than John the Baptist. Yet even the least in the kingdom of heaven is greater than he. ", "12": "From the days of John the Baptist until now, the kingdom of heaven has been subject to violence, and the violent lay claim to it. ", "13": "For all the Prophets and the Law prophesied until John. ", "14": "And if you are willing to accept it, he is the Elijah who was to come. ", "15": "He who has ears, let him hear. ", "16": "To what can I compare this generation? They are like children sitting in the marketplaces and calling out to others:  ", "17": "‘We played the flute for you, and you did not dance; we sang a dirge, and you did not mourn.’  ", "18": "For John came neither eating nor drinking, and they say, ‘He has a demon!’ ", "19": "The Son of Man came eating and drinking, and they say, ‘Look at this glutton and drunkard, a friend of tax collectors and sinners!’ But wisdom is vindicated by her actions.” ", "20": "  Then Jesus began to denounce the cities in which most of His miracles had been performed, because they did not repent. ", "21": "“Woe to you, Chorazin! Woe to you, Bethsaida! For if the miracles that were performed in you had been performed in Tyre and Sidon, they would have repented long ago in sackcloth and ashes. ", "22": "But I tell you, it will be more bearable for Tyre and Sidon on the day of judgment than for you. ", "23": "And you, Capernaum, will you be lifted up to heaven? No, you will be brought down to Hades! For if the miracles that were performed in you had been performed in Sodom, it would have remained to this day. ", "24": "But I tell you that it will be more bearable for Sodom on the day of judgment than for you.” ", "25": "  At that time Jesus declared, “I praise You, Father, Lord of heaven and earth, because You have hidden these things from the wise and learned, and revealed them to little children. ", "26": "Yes, Father, for this was well-pleasing in Your sight. ", "27": "All things have been entrusted to Me by My Father. No one knows the Son except the Father, and no one knows the Father except the Son and those to whom the Son chooses to reveal Him. ", "28": "Come to Me, all you who are weary and burdened, and I will give you rest. ", "29": "Take My yoke upon you and learn from Me; for I am gentle and humble in heart, and you will find rest for your souls. ", "30": "For My yoke is easy and My burden is light.”  "}, "Darby": {"1": "And it came to pass when Jesus had finished commanding his twelve disciples, he departed thence to teach and preach in their cities. ", "2": "But John, having heard in the prison the works of the Christ, sent by his disciples, ", "3": "and said to him, Art thou the coming [one]? or are we to wait for another? ", "4": "And Jesus answering said to them, Go, report to John what ye hear and see. ", "5": "Blind [men] see and lame walk; lepers are cleansed, and deaf hear; and dead are raised, and poor have glad tidings preached to them: ", "6": "and blessed is whosoever shall not be offended in me. ", "7": "But as they went [away], Jesus began to say to the crowds concerning John, What went ye out into the wilderness to see? a reed moved about by the wind? ", "8": "But what went ye out to see? a man clothed in delicate raiment? behold, those who wear delicate things are in the houses of kings. ", "9": "But what went ye out to see? a prophet? Yea, I say to you, and more than a prophet: ", "10": "this is he of whom it is written, Behold, I send my messenger before thy face, who shall prepare thy way before thee. ", "11": "Verily I say to you, that there is not arisen among [the] born of women a greater than John the baptist. But he who is a little one in the kingdom of the heavens is greater than he. ", "12": "But from the days of John the baptist until now, the kingdom of the heavens is taken by violence, and [the] violent seize on it. ", "13": "For all the prophets and the law have prophesied unto John. ", "14": "And if ye will receive it, this is Elias, who is to come. ", "15": "He that has ears to hear, let him hear. ", "16": "But to whom shall I liken this generation? It is like children sitting in the markets, which, calling to their companions, ", "17": "say, We have piped to you, and ye have not danced: we have mourned to you, and ye have not wailed. ", "18": "For John has come neither eating nor drinking, and they say, He has a demon. ", "19": "The Son of man has come eating and drinking, and they say, Behold, a man [that is] eating and wine-drinking, a friend of tax-gatherers, and of sinners: — and wisdom has been justified by her children. ", "20": "Then began he to reproach the cities in which most of his works of power had taken place, because they had not repented. ", "21": "Woe to thee, Chorazin! woe to thee Bethsaida! for if the works of power which have taken place in you, had taken place in Tyre and Sidon, they had long ago repented in sackcloth and ashes. ", "22": "But I say to you, that it shall be more tolerable for Tyre and Sidon in judgment-day than for you. ", "23": "And thou, Capernaum, who hast been raised up to heaven, shalt be brought down even to hades. For if the works of power which have taken place in thee, had taken place in Sodom, it had remained until this day. ", "24": "But I say to you, that it shall be more tolerable for [the] land of Sodom in judgment-day than for thee. ", "25": "At that time, Jesus answering said, I praise thee, Father, Lord of the heaven and of the earth, that thou hast hid these things from the wise and prudent, and hast revealed them to babes. ", "26": "Yea, Father, for thus has it been well-pleasing in thy sight. ", "27": "All things have been delivered to me by my Father, and no one knows the Son but the Father, nor does any one know the Father, but the Son, and he to whom the Son may be pleased to reveal [him]. ", "28": "Come to me, all ye who labour and are burdened, and I will give you rest. ", "29": "Take my yoke upon you, and learn from me; for I am meek and lowly in heart; and ye shall find rest to your souls; ", "30": "for my yoke is easy, and my burden is light.   "}, "LITV": {"1": "And it happened when Jesus finished commanding His twelve disciples, He left there to teach and to proclaim in their cities. ", "2": "But hearing in the prison of the works of Christ, sending two of his disciples, ", "3": "John said to Him, Are You the One coming, or are we to look for another? ", "4": "And answering, Jesus said to them, Going, relate to John what you hear and see: ", "5": "The blind receive sight, and the lame walk; lepers are cleansed, and the deaf hear; the dead are raised, and the poor are given the gospel. Isa. 61:1 ", "6": "And blessed is the one , whoever shall not be offended in Me.   ", "7": "But as these were going, Jesus began to say to the crowds about John, What did you go out into the wilderness to see? A reed being shaken with the wind? ", "8": "But what did you go out to see? A man clothed in soft clothing ? Behold, those wearing soft things are in the houses of kings. ", "9": "But what did you go out to see? A prophet? Yes, I say to you, and one more excellent than a prophet. ", "10": "For this is the one about whom it has been written: \"Behold, I send My messenger before Your face, who shall prepare Your way before You.\" Mal. 3:1 ", "11": "Truly I say to you, Not has arisen among those born of a woman any greater than John the Baptist. But the least in the kingdom of Heaven is greater than he is. ", "12": "But from the days of John the Baptist until now, the kingdom of Heaven suffers violence, and the violent seize it. ", "13": "For all the Prophets and the Law prophesied until John. ", "14": "And if you are willing to receive, he is Elijah, the one about to come. ", "15": "The one having ears to hear, let him hear.   ", "16": "But to what shall I compare this generation? It is like little children sitting in the markets, and calling to their mates, ", "17": "and saying, We piped to you, and you did not dance; we mourned to you, and you did not wail. ", "18": "For John came neither eating nor drinking, and they say, He has a demon. ", "19": "The Son of man came eating and drinking, and they say, Behold, a gluttonous man and a wine drinker, and a friend of tax collectors, and of sinners. And wisdom was justified by her children. ", "20": "Then He began to reproach the cities in which most of His powerful acts had occurred, for they did not repent. ", "21": "Woe to you, Chorazin! Woe to you, Bethsaida! For if the powerful acts which have taken place in you had happened in Tyre and Sidon, they would have repented long ago in sackcloth and ashes. ", "22": "But I say to you, It shall be more bearable for Tyre and Sidon in Judgment Day than for you. ", "23": "And you, Capernaum, who \"have been exalted to the heaven, you will be thrown down to Hades.\" For if the powerful acts happening in you had taken place in Sodom, it would remain until today. Isa. 14:13, 15 ", "24": "But I say to you, It will be more bearable for the land of Sodom in Judgment day than for you.   ", "25": "Answering at that time, Jesus said, I praise You, Father, Lord of Heaven and of Earth, because You hid these things from the sophisticated and cunning and revealed them to babes. ", "26": "Yes, Father, for so it was pleasing before You. ", "27": "All things were yielded up to Me by My Father; and no one knows the Son except the Father; nor does anyone know the Father, except the Son, and the one to whom the Son wills to reveal Him . ", "28": "Come to Me, all those laboring and being burdened, and I will give you rest. ", "29": "Take My yoke upon you and learn from Me, because I am meek and lowly in heart, \"and you will find rest to your souls.\" Jer. 6:16 ", "30": "For My yoke is easy, and My burden is light.  "}, "YLT": {"1": "And it came to pass, when Jesus ended directing his twelve disciples, he departed thence to teach and to preach in their cities.", "2": "And John having heard in the prison the works of the Christ, having sent two of his disciples,", "3": "said to him, `Art thou He who is coming, or for another do we look?'", "4": "And Jesus answering said to them, `Having gone, declare to John the things that ye hear and see,", "5": "blind receive sight, and lame walk, lepers are cleansed, and deaf hear, dead are raised, and poor have good news proclaimed,", "6": "and happy is he who may not be stumbled in me.'", "7": "And as they are going, Jesus began to say to the multitudes concerning John, `What went ye out to the wilderness to view? --a reed shaken by the wind?", "8": "`But what went ye out to see? --a man clothed in soft garments? lo, those wearing the soft things are in the kings' houses.", "9": "`But what went ye out to see? --a prophet? yes, I say to you, and more than a prophet,", "10": "for this is he of whom it hath been written, Lo, I do send My messenger before thy face, who shall prepare thy way before thee.", "11": "Verily I say to you, there hath not risen, among those born of women, a greater than John the Baptist, but he who is least in the reign of the heavens is greater than he.", "12": "`And, from the days of John the Baptist till now, the reign of the heavens doth suffer violence, and violent men do take it by force,", "13": "for all the prophets and the law till John did prophesy,", "14": "and if ye are willing to receive <FI>it<Fi> , he is Elijah who was about to come;", "15": "he who is having ears to hear--let him hear.", "16": "`And to what shall I liken this generation? it is like little children in market-places, sitting and calling to their comrades,", "17": "and saying, We piped unto you, and ye did not dance, we lamented to you, and ye did not smite the breast.", "18": "`For John came neither eating nor drinking, and they say, He hath a demon;", "19": "the Son of Man came eating and drinking, and they say, Lo, a man, a glutton, and a wine-drinker, a friend of tax-gatherers and sinners, and wisdom was justified of her children.'", "20": "Then began he to reproach the cities in which were done most of his mighty works, because they did not reform.", "21": "`Woe to thee, Chorazin! woe to thee, Bethsaida! because, if in Tyre and Sidon had been done the mighty works that were done in you, long ago in sackcloth and ashes they had reformed;", "22": "but I say to you, to Tyre and Sidon it shall be more tolerable in a day of judgment than for you.", "23": "`And thou, Capernaum, which unto the heaven wast exalted, unto hades shalt be brought down, because if in Sodom had been done the mighty works that were done in thee, it had remained unto this day;", "24": "but I say to you, to the land of Sodom it shall be more tolerable in a day of judgment than to thee.'", "25": "At that time Jesus answering said, `I do confess to Thee, Father, Lord of the heavens and of the earth, that thou didst hide these things from wise and understanding ones, and didst reveal them to babes.", "26": "Yes, Father, because so it was good pleasure before Thee.", "27": "`All things were delivered to me by my Father, and none doth know the Son, except the Father, nor doth any know the Father, except the Son, and he to whom the Son may wish to reveal <FI>Him<Fi> .", "28": "`Come unto me, all ye labouring and burdened ones, and I will give you rest,", "29": "take up my yoke upon you, and learn from me, because I am meek and humble in heart, and ye shall find rest to your souls,", "30": "for my yoke <FI>is<Fi> easy, and my burden is light.'"}, "Vulgate": {"1": "et factum est cum consummasset Iesus praecipiens duodecim discipulis suis transiit inde ut doceret et praedicaret in civitatibus eorum", "2": "Iohannes autem cum audisset in vinculis opera Christi mittens duos de discipulis suis", "3": "ait illi tu es qui venturus es an alium expectamus", "4": "et respondens Iesus ait illis euntes renuntiate Iohanni quae auditis et videtis", "5": "caeci vident claudi ambulant leprosi mundantur surdi audiunt mortui resurgunt pauperes evangelizantur", "6": "et beatus est qui non fuerit scandalizatus in me", "7": "illis autem abeuntibus coepit Iesus dicere ad turbas de Iohanne quid existis in desertum videre harundinem vento agitatam", "8": "sed quid existis videre hominem mollibus vestitum ecce qui mollibus vestiuntur in domibus regum sunt", "9": "sed quid existis videre prophetam etiam dico vobis et plus quam prophetam", "10": "hic enim est de quo scriptum est ecce ego mitto angelum meum ante faciem tuam qui praeparabit viam tuam ante te", "11": "amen dico vobis non surrexit inter natos mulierum maior Iohanne Baptista qui autem minor est in regno caelorum maior est illo", "12": "a diebus autem Iohannis Baptistae usque nunc regnum caelorum vim patitur et violenti rapiunt illud", "13": "omnes enim prophetae et lex usque ad Iohannem prophetaverunt", "14": "et si vultis recipere ipse est Helias qui venturus est", "15": "qui habet aures audiendi audiat", "16": "cui autem similem aestimabo generationem istam similis est pueris sedentibus in foro qui clamantes coaequalibus", "17": "dicunt cecinimus vobis et non saltastis lamentavimus et non planxistis", "18": "venit enim Iohannes neque manducans neque bibens et dicunt daemonium habet", "19": "venit Filius hominis manducans et bibens et dicunt ecce homo vorax et potator vini publicanorum et peccatorum amicus et iustificata est sapientia a filiis suis", "20": "tunc coepit exprobrare civitatibus in quibus factae sunt plurimae virtutes eius quia non egissent paenitentiam", "21": "vae tibi Corazain vae tibi Bethsaida quia si in Tyro et Sidone factae essent virtutes quae f 007)", "desc": "El papiro más cercano al Codex Vaticanus (B). Demuestra que el texto alejandrino NO es una revisión tardía sino que existía ya en el s.II. Escriba muy cuidadoso.", "reliability": "Extremadamente confiable. Considerado el mejor testigo temprano del texto alejandrino. Su concordancia con B (s.IV) prueba la estabilidad de esta tradición textual.", "validators": "Victor Martin y Rodolphe Kasser (1961), Carlo Martini (análisis 1966), Kurt Aland"}, "ℵ": {"name": "Codex Sinaiticus (Aleph/01)", "date": "c. 330-360", "year": 345, "origin": "Cesarea o Egipto", "olat": 31.2, "olng": 34.3, "disc_place": "Monasterio de Santa Catalina, Sinaí", "dlat": 28.5, "dlng": 33.9, "disc_date": "1844-1859", "content": "NT completo + gran parte del AT (LXX) + Epístola de Bernabé + Pastor de Hermas", "type": "Alejandrino", "location": "British Library, Londres", "desc": "Descubierto por Constantin von Tischendorf en el Monasterio de Santa Catalina (Sinaí). Es el único manuscrito uncial con el NT completo. Incluye libros que luego no entraron al canon (Bernabé, Hermas). Tiene múltiples correctores de diferentes siglos.", "reliability": "Altamente confiable. Uno de los dos pilares del texto alejandrino (junto con B). Su NT completo lo hace indispensable. Las correcciones posteriores muestran la historia de la transmisión textual.", "validators": "Tischendorf (editio princeps 1862), Kirsopp Lake (facsímil 1911), Milne & Skeat (Scribes and Correctors, 1938), D.C. Parker (Codex Sinaiticus Project, 2009)"}, "B": {"name": "Codex Vaticanus (03)", "date": "c. 325-350", "year": 340, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Biblioteca Vaticana (registrado desde 1475)", "dlat": 41.9, "dlng": 12.5, "disc_date": "antes de 1475", "content": "AT (LXX) + NT hasta Hebreos 9:14 (faltan Pastorales, Filemón, Apocalipsis)", "type": "Alejandrino", "location": "Biblioteca Apostólica Vaticana, Roma", "desc": "Considerado por muchos el manuscrito más importante del NT. Texto alejandrino puro y consistente. En la Biblioteca Vaticana desde al menos 1475 pero no fue accesible a eruditos hasta el s.XIX. Tischendorf solo pudo verlo brevemente.", "reliability": "El más confiable según la mayoría de críticos textuales. Su concordancia con P75 (s.II) demuestra que preserva un texto muy antiguo. Base principal del texto NA28/UBS5.", "validators": "Carlo Vercellone (1868), Tischendorf (colación 1867), Kurt Aland, Bruce Metzger, Bart Ehrman"}, "A": {"name": "Codex Alexandrinus (02)", "date": "c. 400-440", "year": 420, "origin": "Egipto o Constantinopla", "olat": 31.2, "olng": 29.9, "disc_place": "Donado al rey Carlos I de Inglaterra", "dlat": 51.5, "dlng": -0.1, "disc_date": "1627", "content": "AT + NT casi completos (faltan partes de Mt, Jn, 2 Cor). Incluye 1-2 Clemente", "type": "Bizantino (Evangelios), Alejandrino (resto)", "location": "British Library, Londres", "desc": "Donado por el Patriarca de Constantinopla Cirilo Lukaris al rey Carlos I en 1627. Texto bizantino en los Evangelios pero alejandrino en Hechos, Epístolas y Apocalipsis. Mejor testigo del Apocalipsis.", "reliability": "Confiable pero con distinción: en Evangelios refleja texto bizantino (secundario), en el resto es alejandrino (primario). Crucial para el Apocalipsis donde B no existe.", "validators": "Patrick Young (primer editor parcial, 1633), Frederic Kenyon (facsímil 1909), Kurt Aland"}, "C": {"name": "Codex Ephraemi Rescriptus (04)", "date": "c. 450", "year": 450, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Biblioteca Nacional de Francia", "dlat": 48.8, "dlng": 2.3, "disc_date": "s. XVII", "content": "Fragmentos de AT y NT (palimpsesto)", "type": "Mixto", "location": "Bibliothèque nationale de France, París", "desc": "Palimpsesto: el texto bíblico fue borrado en el s.XII y reescrito con sermones de Efrén el Sirio. Tischendorf logró descifrar el texto inferior con reactivos químicos (1840-1845). Solo sobrevive ~60% del NT.", "reliability": "Moderadamente confiable. Texto mixto. Valioso donde otros testigos faltan. El proceso de desciframiento introduce incertidumbre en algunas lecturas.", "validators": "Tischendorf (editio princeps 1843-1845), Robert Lyon (1959)"}, "D": {"name": "Codex Bezae (05)", "date": "c. 400", "year": 400, "origin": "Sur de Francia o Norte de África", "olat": 43.6, "olng": 3.9, "disc_place": "Donado por Teodoro de Beza a Cambridge", "dlat": 52.2, "dlng": 0.1, "disc_date": "1581", "content": "Evangelios + Hechos (bilingüe griego-latín)", "type": "Occidental", "location": "Cambridge University Library", "desc": "Manuscrito bilingüe (griego-latín) con el texto occidental más importante. En Hechos es ~10% más largo que el alejandrino, con adiciones narrativas únicas. Muchas lecturas singulares que no aparecen en ningún otro manuscrito.", "reliability": "Controversial. Preserva tradiciones muy antiguas (s.II) pero también contiene armonizaciones y expansiones. Valioso como testigo independiente del texto occidental. No se usa como base pero sus lecturas se consideran caso por caso.", "validators": "Teodoro de Beza (donación 1581), F.H.A. Scrivener (1864), J. Rendel Harris (1891), D.C. Parker (Codex Bezae, 1992)"}, "W": {"name": "Codex Washingtonianus (032)", "date": "c. 400-450", "year": 425, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Comprado por Charles Freer en Egipto", "dlat": 38.9, "dlng": -77.0, "disc_date": "1906", "content": "Evangelios", "type": "Mixto (varía por sección)", "location": "Smithsonian Institution, Washington D.C.", "desc": "Texto que cambia de carácter según la sección (alejandrino en Lc 1:1-8:12, occidental en Mc 1:1-5:30, bizantino en Mt). Contiene el \"Logion de Freer\" después de Mc 16:14, una adición única.", "reliability": "Confiable pero complejo. Cada sección debe evaluarse según su tipo textual. El cambio de tipo sugiere que fue copiado de múltiples ejemplares.", "validators": "Henry Sanders (editio princeps 1912), Larry Hurtado (Text-Critical Methodology, 1981)"}, "TR": {"name": "Textus Receptus", "date": "1516-1633", "year": 1516, "origin": "Basilea, Suiza", "olat": 47.6, "olng": 7.6, "disc_place": "Publicado por Erasmo de Rotterdam", "dlat": 47.6, "dlng": 7.6, "disc_date": "1516", "content": "NT completo (texto impreso, no manuscrito)", "type": "Bizantino tardío", "location": "Múltiples ediciones", "desc": "No es un manuscrito sino un texto impreso. Erasmo lo compiló en 1516 basándose en unos pocos minúsculos tardíos (s.XII-XIII) disponibles en Basilea. El nombre \"Textus Receptus\" viene de la edición Elzevir de 1633. Base de la KJV y la RVR antigua.", "reliability": "Superado por la crítica textual moderna. Se basa en manuscritos tardíos y en algunos lugares Erasmo retrotradujo del latín al griego. Sin embargo, en la gran mayoría del texto coincide con manuscritos más antiguos.", "validators": "Erasmo de Rotterdam (1516), Robert Estienne/Stephanus (1550), Elzevir (1633). Criticado por Westcott-Hort (1881), defendido parcialmente por Maurice Robinson (Byzantine Priority)"}}, "tc_analysis": "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\">\n<title>Crítica Textual — Matthew 11<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\nbody { font-family: 'Segoe UI', system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 1.5rem; line-height: 1.7; color: #212121; }\nh1 { color: #1a237e; border-bottom: 3px solid #1a237e; padding-bottom: 0.5rem; }\nh2 { color: #c62828; margin-top: 2rem; }\n.tc-word { position: relative; }\n.tc-word:hover { background: #bbdefb !important; }\n#wordTip { display: none; position: fixed; background: #333; color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.82rem; z-index: 100; max-width: 320px; pointer-events: none; }\n.collapsed { display: none; }\n<\/style><\/head><body>\n<h1>⚖️ Análisis de Crítica Textual — Matthew 11<\/h1>\n\n<h2 style=\"color:#1a237e\">📋 Tabla de Co ASM\" data-strongs=\"G3588\">τὸν<\/td><td style=\"padding:6px 10px;border:1px solid #ddd;background:#ffe0b2;cursor:pointer;font-family:'Noto Serif',serif\" class=\"tc-word\" data-tip=\"\" data-lemma=\"υἱόν\" data-morph=\"\" data-strongs=\"\">υἱόν<\/td><td style=\"padding:6px 10px;border:1px solid #ddd;background:#ffe0b2;cursor:pointer;font-family:'Noto Serif',serif\" class=\"tc-word\" data-tip=\"alguien\" data-lemma=\"τις\" data-morph=\"X-NSM\" data-strongs=\"G5100\">τις<\/td><td style=\"padding:6px 10px;border:1px solid #ddd;background:#ffe0b2;cursor:pointer;font-family:'Noto Serif',serif\" class=\"tc-word\" data-tip=\"está conociendo plenamente\" data-lemma=\"ἐπιγινώσκω\" data-morph=\"V-PAI-3S\" data-strongs=\"G1921\">ἐπιγινώσκει<\/td><td style=\"padding:6px 10px;border:1px solid #ddd;background:#ffe0b2;cursor:pointer;font-family:'Noto Serif',serif\" class=\"tc-word\" data-tip=\"si\" data-lemma=\"εἰ\" data-morph=\"CONJ\" data-strongs=\"G1487\">εἰ<\/td><td style=\"padding:6px 10px;border:1px solid #ddd;background:#ffe0b2;cursor:pointer;font-family:'Noto Serif',serif\" class=\"tc-word\" data-tip=\"no\" data-lemma=\"μή\" data-morph=\"PRT-N\" data-strongs=\"G3361\">μὴ<\/td><td style=\"padding:6px 10px;border:1px solid #ddd;background:#ffe0b2;cursor:pointer;font-family:'Noto Serif',serif\" class=\"tc-word\" data-tip=\"el\" data-lemma=\"ὁ\" data-morph=\"T-NSM\" data-strongs=\"G3588\">ὁ<\/td><td style=\"padding:6px 10px;border:1px solid #ddd;background:#ffe0b2;cursor:pointer;font-family:'Noto Serif',serif\" class=\"tc-word\" data-tip=\"\" data-lemma=\"πατήρ\" data-morph=\"\" data-strongs=\"\">πατήρ<\/td><td style=\"padding:6px 10px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;font-family:'Noto Serif',serif\" class=\"tc-word\" data-tip=\"y\" data-lemma=\"καί\" data-morph=\"CONJ\" data-strongs=\"G2532\">καὶ<\/td><td style=\"padding:6px 10px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;font-family:'Noto Serif',serif\" class=\"tc-word\" data-tip=\"a quien\" data-lemma=\"ὅς, ἥ\" data-morph=\"R-DSM\" data-strongs=\"G3739\">ᾧ<\/td><\/tr>\n<\/table><\/div>\n\n\n<div style=\"font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px;\">\n\n<h2 style=\"color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px;\">1. VEREDICTO POR VARIANTE<\/h2>\n\n<div style=\"margin-bottom: 30px;\">\n<h3 style=\"color: #34495e;\">v.2 - Envío de discípulos<\/h3>\n<div style=\"background: linear-gradient(90deg, #27ae60 0%, #27ae60 85%, #f39c12 85%, #f39c12 100%); height: 20px; border-radius: 10px; margin: 10px 0;\"><\/div>\n<p><strong>Lectura original:<\/strong> διά τῶν μαθητῶν (#1.1)<\/p>\n<p><strong>Razón:<\/strong> Atestación superior con manuscritos alejandrinos tempranos (א B). La variante #1.2 \"δύο τῶν μαθητῶν\" parece una armonización con Lucas 7:19 donde se especifica \"dos discípulos\". La tendencia escribal era clarificar detalles narrativos.<\/p>\n<\/div>\n\n<div style=\"margin-bottom: 30px;\">\n<h3 style=\"color: #34495e;\">v.9 - Orden de \"ver profeta\"<\/h3>\n<div style=\"background: linear-gradient(90deg, #27ae60 0%, #27ae60 70%, #f39c12 70%, #f39c12 100%); height: 20px; border-radius: 10px; margin: 10px 0;\"><\/div>\n<p><strong>Lectura original:<\/strong> ἰδεῖν; προφήτην (#2.1)<\/p>\n<p><strong>Razón:<\/strong> Amplio apoyo manuscrito incluyendo tipos textuales diversos. El orden alternativo #2.2 tiene apoyo alejandrino fuerte pero más limitado. La estructura retórica progresiva (¿qué salieron a ver? → profeta → más que profeta) favorece #2.1.<\/p>\n<\/div>\n\n<div style=\"margin-bottom: 30px;\">\n<h3 style=\"color: #34495e;\">v.15 - \"Oídos para oír\"<\/h3>\n<div style=\"background: linear-gradient(90deg, #27ae60 0%, #27ae60 90%, #f39c12 90%, #f39c12 100%); height: 20px; border-radius: 10px; margin: 10px 0;\"><\/div>\n<p><strong>Lectura original:<\/strong> ὦτα ἀκούειν (#3.2)<\/p>\n<p><strong>Razón:<\/strong> Fórmula estereotipada de Jesús atestiguada múltiples veces en los evangelios. La lectura breve #3.1 parece resultado de homoioteleuton o simplificación escribal. El paralelismo con Mt 13:9,43 apoya la forma completa.<\/p>\n<\/div>\n\n<div style=\"margin-bottom: 30px;\">\n<h3 style=\"color: #34495e;\">v.17 - \"Lamentamos\"<\/h3>\n<div style=\"background: linear-gradient(90deg, #27ae60 0%, #27ae60 75%, #f39c12 75%, #f39c12 100%); height: 20px; border-radius: 10px; margin: 10px 0;\"><\/div>\n<p><strong>Lectura original:<\/strong> ἐθρηνήσαμεν (#4.1)<\/p>\n<p><strong>Razón:<\/strong> Apoyo alejandrino sólido (א B D). La adición de ὑμῖν (#4.2) representa clarificación escribal típica para explicitar el objeto indirecto, aunque el contexto ya lo implica claramente.<\/p>\n<\/div>\n\n<div style=\"margin-bottom: 30px;\">\n<h3 style=\"color: #34495e;\">v.19 - \"Justificada por sus...\"<\/h3>\n<div style=\"background: linear-gradient(90deg, #f39c12 0%, #f39c12 40%, #e74c3c 40%, #e74c3c 100%); height: 20px; border-radius: 10px; margin: 10px 0;\"><\/div>\n<p><strong>Lectura original:<\/strong> Incierta entre ἀπὸ τῶν ἔργων (#5.1) y ἀπὸ τῶν τέκνων (#5.3)<\/p>\n<p><strong>Razón:<\/strong> Caso complejo. \"Obras\" tiene apoyo alejandrino temprano pero limitado. \"Hijos\" tiene apoyo masivo posterior y coincide con Lucas 7:35. Posible armonización lucana vs. lectura original mateana. La metáfora de \"hijos de la sabiduría\" es más semítica y difícil.<\/p>\n<\/div>\n\n<div style=\"margin-bottom: 30px;\">\n<h3 style=\"color: #34495e;\">v.23 - Capernaúm exaltada/derribada<\/h3>\n<div style=\"background: linear-gradient(90deg, #27ae60 0%, #27ae60 80%, #f39c12 80%, #f39c12 100%); height: 20px; border-radius: 10px; margin: 10px 0;\"><\/div>\n<p><strong>Lectura original:<\/strong> μὴ ἕως οὐρανοῦ ὑψωθήσῃ... καταβήσῃ (#6.1 + #6.3)<\/p>\n<p><strong>Razón:<\/strong> La pregunta retórica con μή es más difícil que la afirmación con ἥ. καταβήσῃ (descenderás) es lectio difficilior frente a καταβιβασθήσῃ (serás derribada), y coincide con la cita de Isaías 14:15.<\/p>\n<\/div>\n\n<div style=\"margin-bottom: 30px;\">\n<h3 style=\"color: #34495e;\">v.27 - Orden del conocimiento mutuo<\/h3>\n<div style=\"background: linear-gradient(90deg, #27ae60 0%, #27ae60 95%, #f39c12 95%, #f39c12 100%); height: 20px; border-radius: 10px; margin: 10px 0;\"><\/div>\n<p><strong>Lectura original:<\/strong> τὸν υἱὸν εἰ μὴ ὁ πατήρ οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱός (#8.1)<\/p>\n<p><strong>Razón:<\/strong> Apoyo manuscrito abrumador incluyendo papiros tempranos. El orden alternativo #8.2 aparece en fuentes patrísticas tempranas pero carece de apoyo manuscrito directo significativo.<\/p>\n<\/div>\n\n<h2 style=\"color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px;\">2. IMPACTO TEOLÓGICO<\/h2>\n\n<div style=\"margin-bottom: 25px;\">\n<h3 style=\"color: #34495e;\">v.2 - Envío de discípulos<\/h3>\n<p style=\"background: #ecf0f1; padding: 15px; border-left: 4px solid #95a5a6;\"><strong>Impacto:<\/strong> Mínimo. Solo afecta detalles narrativos sobre el número específico de discípulos enviados por Juan el Bautista.<\/p>\n<\/div>\n\n<div style=\"margin-bottom: 25px;\">\n<h3 style=\"color: #34495e;\">v.9 - Orden de \"ver profeta\"<\/h3>\n<p style=\"background: #ecf0f1; padding: 15px; border-left: 4px solid #95a5a6;\"><strong>Impacto:<\/strong> Estilístico. Ambas lecturas preservan el mismo contenido teológico sobre la identidad profética de Juan el Bautista.<\/p>\n<\/div>\n\n<div style=\"margin-bottom: 25px;\">\n<h3 style=\"color: #34495e;\">v.15 - \"Oídos para oír\"<\/h3>\n<p style=\"background: #ecf0f1; padding: 15px; border-left: 4px solid #95a5a6;\"><strong>Impacto:<\/strong> Moderado. La fórmula completa enfatiza la responsabilidad del oyente en la recepción del mensaje. La forma breve debilita este énfasis parenético.<\/p>\n<\/div>\n\n<div style=\"margin-bottom: 25px;\">\n<h3 style=\"color: #34495e;\">v.17 - \"Lamentamos\"<\/h3>\n<p style=\"background: #ecf0f1; padding: 15px; border-left: 4px solid #95a5a6;\"><strong>Impacto:<\/strong> Mínimo. La adición de \"a vosotros\" no cambia el sentido de la parábola sobre la generación que rechaza tanto a Juan como a Jesús.<\/p>\n<\/div>\n\n<div style=\"margin-bottom: 25px;\">\n<h3 style=\"color: #34495e;\">v.19 - \"Justificada por sus...\"<\/h3>\n<p style=\"background: #fff3cd; padding: 15px; border-left: 4px solid #ffc107;\"><strong>Impacto:<\/strong> <span style=\"color: #856404; font-weight: bold;\">SIGNIFICATIVO<\/span>. \"Obras\" enfatiza la validación de la sabiduría divina por sus resultados prácticos. \"Hijos\" presenta la sabiduría como madre que es vindicada por sus descendientes espirituales. Diferentes metáforas con matices teológicos distintos.<\/p>\n<\/div>\n\n<div style=\"margin-bottom: 25px;\">\n<h3 style=\"color: #34495e;\">v.23 - Capernaúm exaltada/derribada<\/h3>\n<p style=\"background: #fff3cd; padding: 15px; border-left: 4px solid #ffc107;\"><strong>Impacto:<\/strong> <span style=\"color: #856404; font-weight: bold;\">MODERADO<\/span>. La pregunta retórica (μή) implica respuesta negativa más fuerte que la afirmación directa. καταβήσῃ (activo) vs καταβιβασθήσῃ (pasivo) cambia la agencia del juicio divino.<\/p>\n<\/div>\n\n<div style=\"margin-bottom: 25px;\">\n<h3 style=\"color: #34495e;\">v.27 - Orden del conocimiento mutuo<\/h3>\n<p style=\"background: #f8d7da; padding: 15px; border-left: 4px solid #dc3545;\"><strong>Impacto:<\/strong> <span style=\"color: #721c24; font-weight: bold;\">CRÍTICO<\/span>. El orden afecta la cristología. La lectura mayoritaria (#8.1) presenta el conocimiento del Hijo por el Padre como primario, seguido del conocimiento del Padre por el Hijo. La variante (#8.2) invierte esto, potencialmente implicando diferentes relaciones de precedencia en la Trinidad.<\/p>\n<\/div>\n\n<h2 style=\"color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px;\">3. CRITERIOS APLICADOS<\/h2>\n\n<div style=\"margin-bottom: 25px;\">\n<h3 style=\"color: #34495e;\">v.2 - Envío de discípulos<\/h3>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n<span style=\"background: #3498db; color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px;\">Atestación temprana<\/span>\n<span style=\"background: #e74c3c; color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px;\">Anti-armonización<\/span>\n<span style=\"background: #9b59b6; color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px;\">Lectio brevior<\/span>\n<\/div>\n<\/div>\n\n<div style=\"margin-bottom: 25px;\">\n<h3 style=\"color: #34495e;\">v.9 - Orden de \"ver profeta\"<\/h3>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n<span style=\"background: #27ae60; color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px;\">Distribución geográfica<\/span>\n<span style=\"background: #f39c12; color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px;\">Estructura retórica<\/span>\n<span style=\"background: #34495e; color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px;\">Apoyo mayoritario<\/span>\n<\/div>\n<\/div>\n\n<div style=\"margin-bottom: 25px;\">\n<h3 style=\"color: #34495e;\">v.15 - \"Oídos para oír\"<\/h3>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n<span style=\"background: #e67e22; color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px;\">Paralelismo sinóptico<\/span>\n<span style=\"background: #8e44ad; color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px;\">Fórmula estereotipada<\/span>\n<span style=\"background: #c0392b; color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px;\">Error escribal probable<\/span>\n<\/div>\n<\/div>\n\n<div style=\"margin-bottom: 25px;\">\n<h3 style=\"color: #34495e;\">v.17 - \"Lamentamos\"<\/h3>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n<span style=\"background: #3498db; color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px;\">Atestación alejandrína<\/span>\n<span style=\"background: #9b59b6; color: whi

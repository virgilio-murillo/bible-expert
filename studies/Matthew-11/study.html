 although the results were opposite; as indeed with respect to his inquiry also. And He implies that there was nothing that ought to have been done for their salvation, and was omitted; which thing the prophet saith of the vineyard; \"What ought I to have done to this vineyard, and have not done it? For whereunto,\" saith He, \"shall I liken this generation? It is like unto children sitting in the market, and saying, We have piped unto you, and ye have not danced, we have mourned unto you, and ye have not lamented. For John came neither eating nor drinking, and they say, He hath a devil. The Son of Man came eating and drinking, and they say, Behold a man gluttonous, and a winebibber, a friend of publicans and sinners.\"\n\nNow what He saith is like this: We have come each of us an opposite way, I and John; and we have done just as if it were some hunters with a wild beast that was hard to catch, and which might by two ways fall into the toils; as if each of the two were to cut it off his several way, and drive it, taking his stand opposite to the other; so that it", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 17, "f": "Thomas Aquinas", "w": "", "t": "And calling to their playmates. The sense is this: suppose that some boys are in one place and others in another, so that some should sing and some dance; one group does one thing, the other is to react. If they sing and the others do not respond according to their role, the former are hurt and say: We sang to you and you did not dance. Against nothing so moves the spirit as song; hence Boethius in his Music tells of a person who was arguing with another in Pythagoras' presence, and the others conversed in song. Then Pythagoras ordered them to sing a different song, and the first man settled down. Therefore it should be noted that some songs are joyful, as it says in Sirach (40:20): \"wine and music gladden the heart\"; hence it says, we sang, i.e., a joyful song, and you did not dance. Likewise it happens that just as some are moved to joy, so others to tears; hence Jeremiah (9:17): \"Send for the mourning women and let them raise a wailing over us.\" Therefore they say, we wailed, i.e., sang sad songs, and you did not mourn.\n\nMystically by the boys is signified the people of the Old Law, among whom some inspired spiritual joy, as David: \"Rejoice, you just, in the Lord\" (Ps 33:1); some grief, as Joel (2:13): \"Turn to the Lord with your whole heart, with fasting, with tears and wailing.\" Hence they can say, we sang, i.e., incited to spiritual joy, and you have not acknowledged it; we wailed, i.e., invited you to repentance, and you have not accepted.", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 18, "f": "Augustine of Hippo", "w": "", "t": "(Cont. Faust. xvi. 31.) I would that the Manichæans would tell me what Christ ate and drank, who here speaks of Himself as eating and drinking in comparison of John, who did neither. Not indeed that John drank nothing at all, but that he drank neither wine nor strong drink—but water only. Not that he dispensed altogether with food, but that he ate only locusts and wild honey. Whence then is it said of him that he came neither eating nor drinking, except that he used not that food which the Jews used? Unless therefore the Lord had used this food, He would not have been said to have been, in comparison of John, eating and drinking. It would be strange that he who ate locusts and honey, should be said to come neither eating nor drinking, and that he who ate only bread and herbs, should be said to come eating and drinking.", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 18, "f": "Hilary of Poitiers", "w": "", "t": "Mystically; Neither did the preaching of John bend the Jews, to whom the law seemed burdensome in prescribing meats and drinks, difficult and grievous, having in it sin which He calls having a dæmon—for from the difficulty of keeping it they must sin under the Law.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 18, "f": "Hilary of Poitiers", "w": "", "t": "“Wisdom has been vindicated by her children.” Those who resist the kingdom of heaven tear apart heaven itself in attempting to justify themselves. The action of Wisdom is just, because she has transferred her gift from the obstinate and faithless to the faithful and obedient covenant people. However, it is useful in this place to consider carefully the virtue of the remark “Wisdom has been proved right by her actions,” which Jesus certainly said about himself. For Jesus is Wisdom itself not because of his acts of power but by his very nature. Everything has capability, but capability is demonstrated in actions. Thus an act of goodness is not the same as goodness itself, just as an effect is distinguishable from its cause.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 18, "f": "Jerome", "w": "", "t": "If fasting then pleases you, why were you not satisfied with John? If fulness, why not with the Son of man? Yet one of these ye said had a dæmon, the other ye called a gluttonous man, and drunkard.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 18, "f": "Theodore Stratelates", "w": "", "t": "Christ himself was judged by those who believed in him to be the living, foundational wisdom, who managed everything justly. Although he was treated spitefully by the unbelieving Jews, he did not stop speaking kindly to the Jews and calling them to be his children.", "lang": "english", "orig": "", "d": ""}, {"v": 18, "f": "Theodore of Mopsuestia", "w": "", "t": "Those who were looking for the truth, he says, accepted the leadership of John and of Christ. It changed their lives. They managed this wisdom for the benefit of those who were searching. He calls the things that have happened wisely, wisdom. The Jews did not believe in Christ, either through the fasting and ascetic life of John or through the submissive mode of life and providential citizenship of Christ the Lord himself. Still, he who fulfilled everything wisely by neglecting none of those things that contributed to their profit and salvation was judged harshly by them. And no longer hereafter could they accuse him, because Jesus fulfilled all his promises and did not leave behind for them a shadow either of unkindness or of ingratitude.", "lang": "english", "orig": "", "d": ""}, {"v": 18, "f": "Theophylact of Ohrid", "w": "", "t": "He compares John's way of life to mourning, for John showed great severity both in words and deeds, and His own life on earth He compares to piping, that is, to the sound of the flute. For the Lord was most gracious and pleasing, condescending to all that He might win all, bringing the good tidings of the kingdom, and He was not severe in appearance as was John. \"But Wisdom is justified by her children.\" This is what He is saying: so, then, since neither John's life nor My own pleases you, but you scorn all the means of salvation, I Who am Wisdom am justified [that is, shown to be righteous, and vindicated]. Therefore you will have no excuse but will be utterly condemned. For I, on My part, have done everything, yet you, by your refusal to believe, prove that I Who omitted nothing am justified.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 18, "f": "Thomas Aquinas", "w": "", "t": "John came neither eating nor drinking... Here he applies the comparison: first, he applies it; secondly, he assigns reasons (v. 19b). Men are drawn to a good life in two ways: some at the sight of holiness, others by the way of companionship. The Lord and John divided the two ways between themselves: John, or rather the Lord through John, shows the way of austerity; he himself shows a way less severe. Yet they were converted by neither. Hence he says, John came neither eating nor drinking. And this was literally true, because he was extremely abstemious; and they say, He has a demon. Like the hypocrites they turn good into evil.", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 18, "f": "npnf206", "w": "The Life of S. Hilarion.", "t": "2. The birth place of Hilarion was the village Thabatha, situate about five miles to the\nsouth of Gaza, a city of Palestine. His parents were idolaters, and therefore, as the saying is,\nthe rose blossomed on the thorn. By them he was committed to the charge of a Grammarian\n4017 See life of Paulus above.\n4018 Matt. xi. 18.\n\n\nat Alexandria, where, so far as his age allowed, he gave proofs of remarkable ability and\ncharacter: and in a short time endeared himself to all and became an accomplished speaker.\nMore important than all this, he was a believer in the Lord Jesus, and took no delight in the\nmadness of the circus, the blood of the arena, the excesses of the theatre: his whole pleasure\nwas in the assemblies of the Church.", "lang": "greek", "orig": "", "d": ""}, {"v": 18, "f": "npnf206", "w": "The Life of S. Hilarion.", "t": "a Grammarian\n4017 See life of Paulus above.\n4018 Matt. xi. 18.\n\n\nat Alexandria, where, so far as his age allowed, he gave proofs of remarkable ability and\ncharacter: and in a short time endeared himself to all and became an accomplished speaker.\nMore important", "lang": "greek", "orig": "", "d": ""}, {"v": 19, "f": "1 Clement", "w": "Chapter XXXI.—We should not hastily impute as crimes to the men of old time\nthose actions which the Scripture has not condemned, but should rather seek in\nthem types of things to come: an example of this in the incest committed by Lot.", "t": "o imitate St. Paul’s allegory, Gal. iv. 24.]\n1587 Matt. xi. 19.\n1588 Ps. iii. 6.\n1589 Jer. xxxi. 26.\n1590 Comp. Clem. Rom., chap. xi. Josephus (Antiq., i. 11, 4) testifies that he had himself seen this pillar.\n1591 The Latin is “per naturalia,” which words, acco", "lang": "greek", "orig": "", "d": "70-165"}, {"v": 19, "f": "Augustine of Hippo", "w": "", "t": "Const. Faust., xvi, 31: I would that the Manichaens would tell me what Christ ate and drank, who here speaks of Himself as eating and drinking in comparison of John, who did neither. Not indeed that John drank nothing at all, but that he drank neither wine nor strong drink—but water only. Not that he dispensed altogether with food, but that he ate only locusts and wild honey. Whence thenis it said of him that he came neither eating nor drinking, except that he used not that food which the Jews used? Unless therefore the Lord had used this food, He would not have been said to have been, in comparison of John, \"eating and drinking.\" It would be strange that he who ate locusts and honey, should be said to come \"neither eating nor drinking,\" and that he who ate only bread and herbs, should be said to come eating and drinking. Again, John had nothing to show besides his life, and his righteousness; whereas Christ had also the witness of His miracles. Leaving therefore to John the representation of fasting, He Himself walked in a contrary way, entering to the table of the publicans, and eating and drinking with them.", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 19, "f": "Augustine of Hippo", "w": "", "t": "(Quæst. Ev. ii. 11.) Or, Wisdom is justified of her children, because the holy Apostles understood that the kingdom of God was not in meat and drink, but in patient enduring; such persons neither does abundance lift up, nor want cast down, but as Paul spoke, I know how to abound, and to suffer want. (Phil. 4:12)", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 19, "f": "Eusebius - Church History", "w": "Chap. XII.", "t": ". 3.\n1580 1 Cor. viii. 8.\n1581 Rom. xiv. 20.\n1582 Matt. xi. 19.\n1583 Ecclus. iii. 1.\n\n\napproach as nearly as may be to the fast of forty days, as we have known some do; and we\nhave even been assured by brethren most worthy of credit, that one person did attain t", "lang": "greek", "orig": "", "d": "260-340"}, {"v": 19, "f": "GK Chesterton", "w": "", "t": "If this is so, let them be very certain of this, that they are the kind of people who in the time of the maypole would have thought the maypole vulgar; who in the time of the Canterbury pilgrimage would have thought the Canterbury pilgrimage vulgar; who in the time of the Olympian games would have thought the Olympian games vulgar. Nor can there be any reasonable doubt that they were vulgar. Let no man deceive himself; if by vulgarity we mean coarseness of speech, rowdiness of behaviour, gossip, horseplay, and some heavy drinking, vulgarity there always was wherever there was joy, wherever there was faith in the gods. Wherever you have belief you will have hilarity, wherever you have hilarity you will have some dangers. And as creed and mythology produce this gross and vigorous life, so in its turn this gross and vigorous life will always produce creed and mythology.", "lang": "english", "orig": "", "d": ""}, {"v": 19, "f": "Hilary of Poitiers", "w": "", "t": "He is wisdom itself not by His acts, but by His nature. Many indeed evade that saying of the Apostle's, Christ is the wisdom and power of God, (1 Cor. 1:24) by saying, that truly in creating Him of a Virgin the Wisdom and Power of God were shown mightily. (e.g. Paul of Samosata, &c.) Therefore that this might not be so explained, He calls Himself the Wisdom of God, showing that it was verily He, and not the deeds relating to Him, of whom this was meant. For the power itself, and the effect of that power, are not the same thing; the efficient is known from the act.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 19, "f": "Hilary of Poitiers", "w": "", "t": "Nor again did the preaching of the Gospel with freedom of life in Christ please them—by which the hardships and burdens of the Law were remitted, and publicans and sinners only believed in it. Thus, then, so many and so great warnings of all kinds having been offered them in vain, they are neither justified by the Law, and they are cast off from grace; Wisdom, therefore, is justified of her children, by those, that is, who seize the kingdom of heaven by the justification of faith, confessing the work of wisdom to be just, that it has transferred its gift from the rebellious to the faithful.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 19, "f": "Jerome", "w": "", "t": "Wisdom is justified of her children, i. e. The dispensation or doctrine of God, or Christ Himself who is the power and wisdom of God, is proved by the Apostles, who are His children, to have done righteously.\n\nSome copies read, Wisdom is justified of her works, for wisdom does not seek the witness of words, but of works.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 19, "f": "Tertullian", "w": "", "t": "is it that He Himself withal should set upon His own official chair men who were mindful rather to enjoin-(but) not likewise to practise-sanctity of the flesh, which (sanctity) He had in all ways recommended to their teaching and practising?-first by His own example, then by all other arguments; while He tells (them) that \"the kingdom of heavens\" is \"children's; \" while He associates with these (children) others who, after marriage, remained (or became)virgins; \" while He calls (them) to (copy) the simplicity of the dove, a bird not merely innocuous, but modest too, and whereof one male knows one female; while He denies the Samaritan woman's (partner to be) a husband, that He may show that manifold husbandry is adultery; while, in the revelation of His own glory, He prefers, from among so many saints and prophets, to have with him Moses and Elias -the one a monogamist, the other a voluntary celibate (for Elias was nothing else than John, who came \"in the power and spirit of Elias\" ); while that \"man gluttonous and toping,\" the \"frequenter of luncheons and suppers, in the company of publicans and sinners,\" sups once for all at a single marriage, though, of course, many were marrying (around Him); for He willed to attend (marriages) only so often as (He willed) them to be.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 19, "f": "Tertullian", "w": "", "t": "Nor would the name of publicans have been so execrable in the eyes of the Lord, unless as being a \"strange\" name,-a (name) of such as put up the pathways of the very sky, and earth, and sea, for sale. Moreover, when (the writer) adjoins \"sinners\" to \"publicans,\" it does not follow that he shows them to have been Jews, albeit some may possibly have been so; but by placing on a par the one genus of heathens-some sinners by office, that is, publicans; some by nature, that is, not publicans-he has drawn a distinction between them.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 19, "f": "Tertullian", "w": "", "t": "Meantime they huff in our teeth the fact that Isaiah withal has authoritatively declared, \"Not such a fast hath the Lord elected,\" that is, not abstinence from food, but the works of righteousness, which he there appends: and that the Lord Himself in the Gospel has given a compendious answer to every kind of scrupulousness in regard to food; \"that not by such things as are introduced into the mouth is a man defiled, but by such as are produced out of the mouth; \" while Himself withal was wont to eat and drink till He made Himself noted thus; \"Behold, a gormandizer and a drinker: \" (finally), that so, too, does the apostle teach that \"food commendeth us not to God; since we neither abound if we eat, nor lack if we eat not.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 19, "f": "Tertullian (cont)", "w": "Chapter IX.—Certain General Principles of Parabolic Interpretation. These Applied\nto the Parables Now Under Consideration, Especially to that of the Prodigal Son.", "t": "Now we must proceed, in the case of the prodigal son, to consider first that which is\nmore useful; for no adjustment of examples, albeit in the most nicely-poised balance, shall\nbe admitted if it shall prove to be most hurtful to salvation. But the whole system of salvation,\n799 Oehler refers to Deut. xxiii. 19; but the ref. is not satisfactory.\n800 Extraneum. Comp. such phrases as “strange children,” Ps. cxliv. 7, 11 (cxliii. 7, 11, in LXX.), and Hos. v.\n7; “strange gods,” etc.\n801 See Luke xv. 1, 2; Matt. ix. 10, 11; xi. 19; Mark ii. 15, 16; Luke v. 29, 30.\n802 See Acts x. 28; xi. 3.\n\n\nas it is comprised in the maintenance of discipline, we see is being subverted by that interpretation\nwhich is affected by the opposite side. For if it is a Christian who, after wandering\nfar from his Father, squanders, by living heathenishly, the “substance” received from God\nhis Father,—(the substance), of course, of baptism—(the substance), of course, of the Holy\nSpirit, and (in consequence) of eternal hope; if, stripped of his mental “goods,” he has even\nhanded his service over to the prince of the world803—who else but the devil?—and by him\nbeing appointed over the business of “feeding swine”—of tending unclean spirits, to wit—has\nrecovered his senses so as to return to his Father,—the result will be, that, not adulterers\nand fornicators, but idolaters, and blasphemers, and renegades, and every class of apostates,\nwill by this parable make satisfaction to the Father; and in this way (it ", "lang": "latin", "orig": "", "d": "185-254"}, {"v": 19, "f": "Thomas Aquinas", "w": "", "t": "The Son of man came eating and drinking, i.e., using food differently; but to no avail, because they do not believe. They say, Behold a glutton and a drunkard, a friend of tax collectors, against what is said in Proverbs (23:20): \"Be not among winebibbers, or among gluttonous eaters of meat.\" Here it should be noted that one who pays attention to what men say will never do any good: \"He who observes the wind will not sow, and he who regards the clouds will not reap\" (Ec 11:4). But here a question arises: Why did the Lord choose a more lenient life and through John demonstrate a harsher one? The reason is that the Lord supported his actions with miracles, which John did not perform; therefore if he possessed no excellence, his testimony would not have been accepted, as we observe in the saints that one excels in one thing and another in another: thus Augustine was excellent in doctrine but Martin in miracles. Another reason is that John was a man of purity and so abstained from carnal desires; but Christ was God, and if he had taught severity, he would not have been shown to be man. Therefore he assumed a life more human. The final reason was that John was the end of the Old Testament, wherein heavy burdens were imposed; but Christ was the beginning of the New Testament, which proceeds by way of meekness.\n\nAnd wisdom is justified by her deeds. This can be taken in two ways: in one way by turning it back to whatever was said about John and Christ; and then the sense is that whe", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 20, "f": "Augustine - Trinity", "w": "Psalm XXVIII.655", "t": "5. “For they have not had understanding in the works of the Lord” (ver. 5). And whence\nis it clear that this hath befallen them? From this forsooth, “for they have not had understanding\nin the works of the Lord.” This very thing, in truth, hath been, even now, their recompense,\nthat in Him whom they tempted with malicious intent as a Man, they should\n655 Lat. XXVII.\n656 Matt. xi. 20–24.\n657 [The Greek and Vulgate omit the epithet of the Hebrew, “My Rock,” which is the link with the Psalm\nforegoing (ver. 5), and the key to other parallels. St. Jerome renders it, fortis meus.—C.]\n658 John iii. 2.\n659 Al. affectationum, “aims.”\n\n\nnot recognise God, with what design the Father sent Him in the Flesh. “And the works of\nHis hands.” Nor be moved by those visible works, which are laid out before their very eyes.\n“Thou shalt destroy them, and not build them up.” Let them do Me no hurt, nay, nor again\nin their endeavour to raise engines against My Church, let them aught avail.", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 20, "f": "Augustine - Trinity", "w": "Psalm XXVIII.655", "t": "intent as a Man, they should\n655 Lat. XXVII.\n656 Matt. xi. 20–24.\n657 [The Greek and Vulgate omit the epithet of the Hebrew, “My Rock,” which is the link with the Psalm\nforegoing (ver. 5), and the key to other parallels. St. Jerome renders it, fortis meus.—C.]", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 20, "f": "Augustine of Hippo", "w": "", "t": "(De Cons. Ev. ii. 32.) Luke also gives this as spoken in continuation of some other of the Lord's discourses; from which it appears that he has rather followed the actual order of events; Matthew to have followed his recollection. Or the words of Matthew, Then began he to upbraid the towns, must be taken, as some think, as expressing some particular time by the word then, but not referring generally to that time in which the many other things here told were done and said. Whoever, therefore, thinks thus must suppose that this was spoken twice. And when we find in the same Evangelist some things spoken by the Lord at two different times—like that in Luke concerning the not taking a scrip for their journey,—what wonder is it if any thing else, which was twice spoken, is found once severally in two several Gospels in the actual connection in which it was spoken, which connection is different, because they are two different occasions on which it is related to have been spoken?", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 20, "f": "Chrysostom - Homilies on John", "w": "Homily XXXVIII.", "t": "12.\n1610 Matt. vi. 13.\n1611 Matt. vi. 14–19.\n1612 Matt. xi. 20–24.\n\n\nto these. As when Paul saith, “I thank God, that ye were servants of sin, but ye obeyed from\nthe heart the form of doctrine which was delivered unto you.”1613 You see, neither doth\nPaul therefo", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 20, "f": "Glossa Ordinaria", "w": "", "t": "(ap. Anselm.) Thus far He had brought His accusation against the Jews in common; now against certain towns by name, in which he had specially preached, and yet they would not be converted; whence it is said, Then began he to upbraid the cities in which most of his mighty works were done, because they had not repented.", "lang": "english", "orig": "", "d": "c. 1150"}, {"v": 20, "f": "Jerome", "w": "", "t": "(Verse 20.) Then he began to reproach the cities in which most of his miracles had been performed, because they did not repent. The reproach of the cities of Chorazin, Bethsaida, and Capernaum is explained by the heading of this chapter. He reproached them because after performing many miracles and signs, they did not repent.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 20, "f": "Jerome", "w": "", "t": "His upbraiding of the towns of Corozaim, Bethsaida, and Capharnaum, is set forth in this chapter, because He therefore upbraided them, because after He had such mighty works and wonders in them they had not done penitence. Whence He adds, Wo for thee, Corozaim! wo for thee, Bethsaida!", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 20, "f": "John Chrysostom", "w": "", "t": "Then He proceeds to upbraid the cities now that wisdom hath been justified; now that He hath shown all to be fully performed. That is, having failed to persuade them, He now doth but lament over them; which is more than terrifying. For He had exhibited both His teaching by His words, and His wonder-working power by His signs. But forasmuch as they abode in their own unbelief, He now does but upbraid.\n\nFor \"then,\" it is said, \"began Jesus to upbraid the cities, wherein most of His mighty works were done, because they repented not; saying, Woe unto thee, Chorazin! woe unto thee, Bethsaida!\"", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 20, "f": "Theophylact of Ohrid", "w": "", "t": "After showing that He had done everything that He ought to have done, and they remained unrepentant, then He upbraids them.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 20, "f": "Thomas Aquinas", "w": "", "t": "Having satisfied John's disciples, he now rebukes non-believers: first, the Lord's deed is described; secondly, his words (v. 21).\n\nHe says, therefore, Then he began to upbraid the cities. The upbraiding is concerned with the benefits and with gifts. For the Lord had conferred a great benefit, because he had enlightened them by his presence; but they were ungrateful and, consequently, deserved rebuke: \"O my people, what have I done to you? In what way have I wearied you?\" (Mic 6:3). And he did not rebuke them for having sinned but for not having done penance; hence Job (24:23): \"He gave him opportunity to do penance, and he abused it unto pride\" applied to them, as did Romans (2:4): \"Do you know that God's kindness is meant to lead you to repentance?\"\n\nBut there is a textual question, because Luke (10:13) put this in another context. For he places it at the time of sending the disciples, but Matthew here. Augustine's answer is that it seems Luke is following the order of history, but Matthew the order of recollection. But then the objection is raised that here it says, then. So it seems that Matthew is also following the order of history. Augustine answers that then suggests an indeterminate time. Or, another way, it can be said that he said these words on two occasions, so that it could be then according to both Matthew and Luke.", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 20, "f": "npnf208", "w": "Chapter XVI.", "t": "derful works” in Matt. vii. 22; “mighty works” in Matt. xi. 20, Mark vi. 14, and\nLuke x. 13; and “miracles” in Acts ii. 22, xix. 11, and Gal. iii. 5.\n1061 Matt. xii. 28.\n1062 Gen. ii. 7, lxx. is ἐνεφύσησεν εἰς τὸ πρόσωπον αὐτοῦ. “εἰς τὸ πρόσωπον” is thence impor", "lang": "greek", "orig": "", "d": ""}, {"v": 21, "f": "Augustine of Hippo", "w": "", "t": "(De Don. Pers. 9.) It is not then true that His Gospel was not preached in those times and places, in which He foreknew that all would be such, as were many in His actual presence, who would not even believe on Him when He raised men from the dead. For the Lord Himself bears witness that they of Tyre and Sidon would have done penitence in great humility, had the wonders of the Divine power been done in them. Moreover, if the dead are judged according to those deeds which they would have done had they lived, then because these would have believed had the Gospel been preached to them with so great miracles, surely they should not be punished at all, and yet in the day of judgment they shall be punished; for it follows, But I say unto you, It shall be more tolerable for Tyre and Sidon in the day of judgment, than for you. Those then shall be punished with more, these with less severity.\n\n(De Don. Pers. 10.) A certain Catholic disputant of some note expounded this place of the Gospel in the following way; That the Lord foreknew that they of Tyre and Sidon would fall from the faith after they had believed the miracles done among them; and that therefore in mercy He did not His miracles there; because they would have incurred the heavier penalty had they lapsed from the faith after having held it, than if they had never held it at all. Or otherwise, The Lord surely foreknew His mercies with which He deigns to deliver us. And this is the predestination of the saints, namely, the for", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 21, "f": "Gregory the Dialogist", "w": "", "t": "(Mor. xxxv. 6.) In sackcloth is the roughness which denotes the pricking of the conscience for sin, ashes denote the dust of the dead; and both are wont to be employed in penitence, that the pricking of the sackcloth may remind us of our sins, and the dust of the ash may cause us to reflect what we have become by judgment.", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 21, "f": "Jerome", "w": "", "t": "(Verse 21, 22.) Woe to you, Chorazin; woe to you, Bethsaida: for if the mighty works had been done in Tyre and Sidon, which have been done in you, they would have repented long ago in sackcloth and ashes. But I say to you, it will be more tolerable for Tyre and Sidon in the day of judgment than for you. Chorazin and Bethsaida, cities of Galilee, are mourned by the Savior because despite the many signs and miracles, they did not repent, and are surpassed by Tyre and Sidon, idolatrous cities given to vice. They are preferred, however, because Tyre and Sidon have only violated natural law, whereas these, after transgressing natural law, have also disregarded the signs that were performed among them. We are inquiring where it is written that the Lord performed signs in Chorazin and Bethsaida. Above, we read: 'And he went through all the cities and villages, teaching in their synagogues, and proclaiming the gospel of the kingdom and healing every disease and every affliction' (Matthew 9:35). Therefore, among the other cities and villages, it is to be presumed that the Lord also performed signs in Chorazin and Bethsaida.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 21, "f": "Jerome", "w": "", "t": "Our Savior laments Chorazin and Bethsaida, cities of Galilee, because after such great miracles and acts of goodness they did not repent. Even Tyre and Sidon, cities that surrendered to idolatry and other vices, are preferred to them. Tyre and Sidon are preferred for the reason that although they trampled down the law, still Chorazin and Bethsaida, after they transgressed natural and written law, cared little for the miracles that were performed among them. If we ask where it is written that our Lord performed miracles in Chorazin and Bethsaida, we read above: “And he went around to all the towns and villages, curing every infirmity” and the rest. Thus among the other towns and villages it must be judged that the Lord performed miracles in Chorazin and Bethsaida as well.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 21, "f": "Jerome", "w": "", "t": "In this word Wo, these towns of Galilee are mourned for by the Saviour, that after so many signs and mighty works, they had not done penitence.\n\nAnd to these are preferred Tyre and Sidon, cities given up to idolatry and vices; For if the mighty works which have been done in you had been done in Tyre and Sidon, they would have long ago done penitence in sackcloth and ashes.\n\nWe ask where it is written that the Lord did wonders in Corozaim and Bethsaida? We read above, And he went about the towns and villages, healing all sicknesses, &c. (ch., 9:35.) among the rest, therefore, we may suppose that He wrought signs in Corozaim and Bethsaida.\n\nThis is because Tyre and Sidon had trodden under foot the law of nature only, but these towns after they had transgressed the natural and the written Law, also made light of those wonders which had been wrought among them.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 21, "f": "Jerome", "w": "", "t": "The careful reader will hesitate here; If Tyre and Sidon could have done penitence at the preaching of the Saviour, and His miracles, they are not in fault that they believed not; the sin is his who would not preach to bring them to penitence. To this there is a ready answer, that we know not God's judgments, and are ignorant of the sacraments of His peculiar dispensations. It was determined by the Lord not to pass the borders of Judæa, that He might not give the Pharisees and Priests a just occasion of persecuting Him, as also He gave commandment to the Apostles, Go not into the way of the Gentiles. Corozaim and Bethsaida are condemned because they would not believe, though Christ Himself was among them—Tyre and Sidon are justified, because they believed His Apostles. You should not enquire into times when you see the salvation of those that believe.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 21, "f": "John Chrysostom", "w": "", "t": "Then, to show thee that they are not such by nature, He states also the name of the city out of which proceeded five apostles. For both Philip, and those two pairs of the chief apostles, were from thence.", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 21, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For if, says He, the mighty works which were done in you had been done in Tyre and Sidon, they would have repented in sackcloth and ashes. But I say unto you, It shall be more tolerable for Tyre and Sidon, at the day of judgment, than for you. And thou, Capernaum, which art exalted unto heaven, shall be brought down to hell, for if the mighty works which have been done in you had been done in Sodom, it would have remained until this day. But I say unto you, It shall be more tolerable for the land of Sodom in the day of judgment, than for you.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 21, "f": "Rabanus Maurus", "w": "", "t": "Corozaim, which is interpreted 'my mystery,' and Bethsaida, 'the house of fruits' or, 'the house of hunters,' are towns of Galilee situated on the shore of the sea of Galilee. The Lord therefore mourns for towns which once had the mystery of God, and which ought to have brought forth the fruit of virtues, and into which spiritual hunters had been sent.\n\nTyre and Sidon axe cities of Phœnicia. Tyre is interpreted 'narrowness,' and Sidon 'hunting;' and denote the Gentiles whom the Devil as a hunter drives into the straits of sin; but Jesus the Saviour sets them free by the Gospel.\n\nWe at this day see the words of the Saviour fulfilled; Corozaim and Bethsaida would not believe when the Lord came to them in person; but Tyre and Sidon have afterwards believed on the preaching of the Apostles.", "lang": "english", "orig": "", "d": "c. 840"}, {"v": 21, "f": "Remigius of Rheims", "w": "", "t": "We may also answer in another way. There were many in Corozaim and Bethsaida who would believe, and many in Tyre and Sidon who would not believe, and therefore were not worthy of the Gospel. The Lord therefore preached to the dwellers in Corozaim and Bethsaida, that they who were to believe, might be able; and preached not in Tyre and Sidon, lest perhaps they who were not to believe, being made worse by contempt of the Gospel, should be punished more heavily.", "lang": "english", "orig": "", "d": "c. 900"}, {"v": 21, "f": "Tertullian", "w": "", "t": "The Lord Himself presumed repentance on the part of the Sidonians and Tyrians if they had seen the evidences of His \"miracles.\"", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 21, "f": "Tertullian (cont)", "w": "Chapter X.—Repentance More Competent to Heathens Than to Christians.", "t": "See Luke i. 76.\n815 See Luke iii. 8, 12, 14.\n816 Matt. xi. 21; Luke x. 13.\n817 Comp. Luke vi. 35.\n\n\nof His patience! But what the Psychics mean is this—that God, the Judge of righteousness,\nprefers the repentance to the death of that sinner who has preferred de", "lang": "latin", "orig": "", "d": "185-254"}, {"v": 21, "f": "Theophylact of Ohrid", "w": "", "t": "So that you might understand that those who did not believe were evil not by nature, but by choice, He calls to mind Bethsaida, the city of Andrew, Peter, Philip and the sons of Zebedee. Evil does not come from nature, but from our own choice; for if it came from nature, these apostles too would have been evil. He says that the Jews are worse than the inhabitants of Tyre and Sidon, for the Gentile inhabitants of Tyre transgressed only the natural law while the Jews transgressed the Mosaic law as well. For the former did not see miracles, but the latter have both seen and slandered. Sackcloth is a symbol of repentance, and ashes and dust are what mourners put on their heads.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 21, "f": "Thomas Aquinas", "w": "", "t": "Woe to you, Chorazin... These are cities or villages of Galilee, where the Lord had performed many signs, and yet they were not converted. So he says, Woe to you... But what is the Lord doing? For it is written in Romans (12:14): \"Do not curse...\" The answer is that cursing is formal or material: no one should curse formally, but he may curse materially. Hence it should be noted that certain things are joined as far as sense perception goes, but they can be separated in the intellect; thus in an apple are odor and taste, which cannot be separated by sense perception, although they can by the intellect. Similarly, to will that one not be punished and to will the order of justice cannot co-exist except in the intellect. Hence if I curse a person, because I delight in his harm, it is evil. But if not for his evil but for the order of justice, then it is good. Hence the Lord's word is not the word of one taking pleasure, but the word of one desiring justice.\n\nWoe to you, Chorazin... Chorazin is interpreted \"a service to him,\" Bethsaida, \"the house of fruit.\" To whom more is entrusted, more is demanded. And why did he manifest more there? Because he fulfilled his ministry there; therefore, \"God's anger has been revealed from heaven on all ungodliness and the injustice of those men who held back the truth of God\" (Rom 1:18). Bethsaida is the house of fruit. Therefore, if the Lord produced much fruit there, and they did no penance, what will happen to them? (Is 5:4): \"When I looked ", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 22, "f": "John Chrysostom", "w": "", "t": "\"For if,\" saith He, \"the mighty works which were done in you had been done in Tyre and Sidon, they would have repented in sackcloth and ashes. But I say unto you, It shall be more tolerable for Tyre and Sidon, at the day of judgment, than for you. And thou, Capernaum, which art exalted unto heaven, shalt be brought down to hell, for if the mighty works which have been done in thee had been done in Sodom, it would have remained until this day. But I say unto you, It shall be more tolerable for the land of Sodom in the day of judgment, than for thee.\"\n\nAnd He adds not Sodom with the others for nought, but to aggravate the charge against them. Yea, for it is a very great proof of wickedness, when not only of them that now are, but even of all those that ever were wicked, none are found so bad as they.\n\nThus elsewhere also He makes a comparison, condemning them by the Ninevites, and by the Queen of the south; there, however, it was by them that did right, here, even by them that sinned; a thing far more grievous. With this law of condemnation, Ezekiel too was acquainted: wherefore also he said to Jerusalem, \"Thou hast justified thy sisters in all thy sins.\" Thus everywhere is He wont to linger in the Old Testament, as in a favored place. And not even at this doth He stay His speech, but makes their fears yet more intense, by saying, that they should suffer things more grievous than Sodomites and Tyrians, so as by every means to gather them in, both by bewailing, and by alarming t", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 22, "f": "Socrates", "w": "Chapter 5.—The Passages in Which the Saviour Declares that There Shall Be a Divine\nJudgment in the End of the World.", "t": "that only twelve men shall judge along with\n1323 Matt. xi. 22.\n1324 Matt. xi. 24.\n1325 Matt. xii. 41, 42.\n1326 Augustin quotes the whole passage, Matt. xiii. 37–43.\n1327 Matt. xix. 28.\n1328 Matt. xii. 27.\n\n\nHim, though He says that they shall sit upon twelve th", "lang": "greek", "orig": "", "d": "380-450"}, {"v": 22, "f": "Thomas Aquinas", "w": "", "t": "But I tell you: it shall be more tolerable on the day of judgment for Tyre and Sidon than for you. Here he compares guilt with guilt, because if they are found heavier in guilt, it will be worse for them; for they did not do what they heard. Therefore it is more serious, as John says (15:22): \"If I had not come and spoken to them, they would not have sin.\" Note that those words exclude three errors.\n\nFor some said that all sins are equal, and likewise punishments. He excludes this when he says that it will be worse for them than for Tyre and Sidon.\nAgain, some said that only those foreknown will be saved, because, if he preached to them, they would be converted. He excludes this when he says that it will go ill with Tyre and Sidon, but worse for those others to whom the kingdom of heaven was announced. Hence Augustine says: \"The Lord does not reward what they would have done, but what they have done.\"\nThen he removes the third error, namely, that the Lord sent prophets and preachers to the Jews and not to the rest, because he knew that the others would not receive them. But he excludes this, because if they had been preached to, they would have done penance.\n\nBut the question remains: if the Jews did not believe, it seems that the Lord did not act properly by not sending to those who would have believed.\n\nGregory says that it is not for man to know God's secrets; yet, as it seems, he preached first to the Jews in fulfillment of the promises made to the patriarchs. Furthermore", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 23, "f": "1 Clement", "w": "Chapter XXXVI.—The prophets were sent from one and the same Father from\nwhom the Son was sent.", "t": "infer the rest] to suit the\nLatin versions.\n1719 Matt. xi. 23, 24.\n1720 John iv. 14.\n\n\ntime] He might preserve the archetype,1721 the formation of Adam. And it was He who\nrained fire and brimstone from heaven, in the days of Lot, upon Sodom and Gomorrah, “an\nex", "lang": "greek", "orig": "", "d": "70-165"}, {"v": 23, "f": "Chrysostom - Homilies on John", "w": "Homily XLVIII.", "t": "s,\n1892 Matt. xiii. 54.\n1893 Matt. xiii. 58.\n1894 Matt. xi. 23.\n1895 Amos. vii. 14, 15.\n1896 Matt. xiii. 54. [R.V., margin, “Greek, powers.”]\n1897 Matt. xiii. 55.\n\n\nand Joses,1898and Simon, and Judas? and His sisters, are they not all with us? Whence hath\nthis m", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 23, "f": "Chrysostom - Homilies on John", "w": "Homily XLVIII.", "t": "“And when He was come into His own country, He taught them in their synagogue.”1892\nAnd what doth he now call His country? As it seems to me, Nazareth. “For He did not\nmany mighty works there,”1893it is said, but in Capernaum He did miracles: wherefore He\nsaid also, “And thou, Capernaum, which art exalted unto Heaven, shalt be brought down\nto hell; for if the mighty works, which have been done in thee, had been done in Sodom, it\nwould have remained until this day.”1894", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 23, "f": "Jerome", "w": "", "t": "(Verse 23) And you, Capernaum, will you be exalted to heaven? You will go down to the realm of the dead. In another version, we find: And you, Capernaum, which was exalted to heaven, will descend to the depths. And there are two different understandings. Perhaps you will descend to the depths because you have proudly resisted my preaching. Or perhaps because you, exalted to heaven in my presence and witnessing my signs and miracles, having such privilege, will be punished with greater sufferings for refusing to believe in them as well.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 23, "f": "Jerome", "w": "", "t": "In other copies we find, And thou, Capharnaum, that art exalted to heaven, shalt be brought down to hell; and it may be understood in two different ways. Either, thou shalt go down to hell because thou hast proudly resisted my preaching; or, thou that hast been exalted to heaven by entertaining me, and having my mighty wonders done in thee, shalt be visited with the heavier punishment, because thou wouldest not believe even these.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 23, "f": "Jerome", "w": "", "t": "(Vers. 23, 24.) Because if in Sodom (or, as some say, in Sidon) the miracles had been done that have been done in you, they would have repented long ago in sackcloth and ashes. But I say to you that it will be more tolerable for the land of Sodom on the day of judgment than for you. Let the prudent reader ask and say whether Tyre and Sidon and Sodom could have repented at the preaching of the Savior and the signs of miracles, and it is not their fault that they did not believe, but the sin of silence is in him who did not want to preach repentance to those who would have acted on it. To which the easy and clear answer is: to be ignorant of the judgments of God, and to not know the sacraments of his dispensations. The purpose was for the Lord to not exceed the boundaries of Judea, so as not to give the Pharisees and priests a just occasion for persecution. Therefore, before the passion, he commanded the apostles: Do not go into the way of the Gentiles, and do not enter into the cities of the Samaritans (Matthew 10:5). Therefore, Chorazin and Bethsaida are condemned because they refused to believe in the present Lord. Tyre and Sidon are justified because they believed in his apostles. Do not question the times when you witness the salvation of the believers. However, in Capernaum, which means the most beautiful town, unbelieving Jerusalem is condemned, to whom it is said through Ezekiel: Sodom was justified because of you (Ezek. XVI, 52).", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 23, "f": "Jerome", "w": "", "t": "In Capharnaum, which is interpreted 'the most fair town,' Jerusalem is condemned, to which it is said by Ezekiel, Sodom is justified by thee. (Ezek. 16:52)", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 23, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For if, says He, the mighty works which were done in you had been done in Tyre and Sidon, they would have repented in sackcloth and ashes. But I say unto you, It shall be more tolerable for Tyre and Sidon, at the day of judgment, than for you. And thou, Capernaum, which art exalted unto heaven, shall be brought down to hell, for if the mighty works which have been done in you had been done in Sodom, it would have remained until this day. But I say unto you, It shall be more tolerable for the land of Sodom in the day of judgment, than for you.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 23, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And what does he now call His country? As it seems to me, Nazareth. For He did not many mighty works there, Matthew 13:58 it is said, but in Capernaum He did miracles: wherefore He said also, And thou, Capernaum, which art exalted unto Heaven, shall be brought down to hell; for if the mighty works, which have been done in you, had been done in Sodom, it would have remained until this day. Matthew 11:23", "lang": "", "orig": "", "d": "c. 388"}, {"v": 23, "f": "Remigius of Rheims", "w": "", "t": "Capharnaum was the metropolis of Galilee, and a noted town of that province, and therefore the Lord mentions it particularly, saying, And thou, Capharnaum, shalt thou indeed be exalted to heaven. Thou shalt go down even to hell.\n\nAnd they have made the sins not of Sodom only and Gomorrah, but of Tyre and Sidon light in comparison, and therefore it follows, For if the mighty works which have been done in thee had been done in Sodom, it would perhaps have remained unto this day.\n\nThe Lord, who knows all things, here uses a word expressing uncertainty—perhaps, to show that freedom of choice is left to men. But I say unto you, it shall be easier for the land of Sodom in the day of judgment than for you. And be it known, that in speaking of the city or country, the Lord does not chide with the buildings and walls, but with the men that inhabit there, by the figure metonymy, putting the thing containing for the thing contained. The words, It shall be easier in the day of judgment, clearly prove that there are divers punishments in hell, as there are divers mansions in the kingdom of heaven.", "lang": "english", "orig": "", "d": "c. 900"}, {"v": 23, "f": "Tertullian", "w": "", "t": "Sodom also, and Gomorrah, would have escaped if they had fasted. This remedy even Ahab acknowledges.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 23, "f": "Tertullian (cont)", "w": "Chapter VII.—Further Examples from the Old Testament in Favour of Fasting.", "t": "iii. Comp. de Pa., c. x.\n1053 See Ezek. xvi. 49; Matt. xi. 23, 24; Luke x. 12–14.\n\n\nthe Lord unto Elijah, Thou hast seen how Ahab hath shrunk in awe from my face: for that\nhe hath shrunk in awe I will not bring the hurt upon (him) in his own days; but in the da", "lang": "latin", "orig": "", "d": "185-254"}, {"v": 23, "f": "Theodore Stratelates", "w": "", "t": "Many were the miracles Jesus performed in the city of Capernaum. For this reason it was all the more necessary that those who dwelled there should believe. This city was for a time “lifted up unto heaven” on account of the miracles. But on account of the sin and unbelief of its inhabitants, an even more dreadful fall occurred, and they were “brought down to Hades.” Christ was the steward. When the time was right, the Word became incarnate and performed miracles. He chastised Gentiles and Jews proportionately. Tyre and Sidon transgressed only natural law, but the Jews, who disobeyed Christ, transgressed the law of Moses and the prophets. Jesus said this even more sternly when he wished to point out that their wickedness was greater by comparison. For, if not these things, then other things might have happened in Tyre and Sidon, and even in Sodom and Gomorrah, if they had come to repentance. But, as I said, he presents this comparison in order more forcefully to demonstrate their wickedness.", "lang": "english", "orig": "", "d": ""}, {"v": 23, "f": "Theophylact of Ohrid", "w": "", "t": "Capernaum was exalted as the city of Jesus, for it was made as glorious as if it were His birthplace, yet it derived no benefit from this because it did not believe. On the contrary, it is rather because of this that it has been condemned to hades, that, while having such a citizen, it derived no benefit from Him. From the fact that the name \"Capernaum\" means \"place of comfort and consolation,\" see that even though one has once been deemed worthy to become a place of the Comforter, that is, of the Holy Spirit, but then becomes haughty in mind, though he had been lifted up to heaven, he falls on account of his haughtiness. Tremble, then, O man!", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 23, "f": "Thomas Aquinas", "w": "", "t": "And you, Capernaum, will you be exalted to heaven? In this section he upbraids a more famous city: first, he rebukes pride, because the greater are more boastful; secondly, he upbraids their impenitence (v. 23b). In regard to the first: first, he rebukes their pride; secondly, he threatens a punishment. He says, therefore, And you, Capernaum... This sentence can be taken in two ways: one is interrogative, namely, will you be exalted to heaven? The other: You are the city which has been exalted to heaven, because it was exalted by the Lord, by the Lord's presence and by many miracles: \"The things we have heard done in Capernaum, do also here in your city\" (Lk 4:23). You have also been exalted by yourself; hence will you be exalted by pride or my teaching? But no matter how you have been exalted, you shall be brought down to Hades: \"Dragged off in the day of God's wrath; this is the wicked man's portion from God\" (Jb 20:28). Hence the proper punishment of the proud is to be hurled down. Isaiah (14:14) against one who said, \"I will ascend above the heights of the clouds,\" answers \"You will be brought down to hell.\" Then he rebukes their impenitence: first, he compares their guilt; secondly, their punishment. He says, therefore, For if in Sodom... Why does he say this? To denote freedom of judgment, because before a man is life and death. No one warned them; for although Lot was present among them, he worked no miracles. But the others saw the Lord teaching and working miracles. ", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 24, "f": "Athanasius - Select Works", "w": "Chapter 5", "t": "ff. And what they themselves think that they\n1156 Matt. xi. 24.\n1157 The Council of 310 Donatist bishops, held at Bagai in Numidia, A.D. April 24, 394. Cp. Contra. Crescon.\niii. 52, 56.\n\n\nconferred on those persons", "lang": "greek", "orig": "", "d": "296-373"}, {"v": 24, "f": "Hilary of Poitiers", "w": "", "t": "The curse of disobedience is distinguished from the blessing of obedience. It was necessary for the Jews to be admonished. The ill will of their faithlessness is highlighted by the extraordinary grace of his works there. The Jews were censured by the example of the faithful, to whom salvation came entirely from faith. But these cities displayed no change whatever at Jesus’ actions. \n\nAt Bethsaida and Capernaum the mute praised the Lord with their voices, the blind saw, the deaf heard, the lame ran about, and the dead came alive, yet astonishment at such great miracles did not produce any disposition for faith. Hearing about the deeds alone ought to have called them to awe and to faith. Yet this unresponsiveness is found not only in the small sins of Tyre and Sidon but also with the great sins of Sodom and Gomorrah. The desire for belief would perhaps have come closer to them if these remarkable acts of virtue had really touched them.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 24, "f": "Jerome", "w": "", "t": "The wise reader may inquire and say, “If Tyre, Sidon and Sodom could repent at the admonishment of our Savior and at his wonderful miracles, they are not to blame because they did not at first believe. But the fault of silence rests in the one who did not want to preach even to those who were likely to repent.” \n\nTo this charge the response is easy and clear: We do not fathom the decisions of God. We do not know the secrets of his singular acts of dispensation.… Chorazin and Bethsaida were condemned because they did not want to believe in our Lord even when he was with them in person. Meanwhile Tyre and Sidon were pardoned because they believed the apostles. So do not try to fathom the precise time or place when you may expect the salvation of the believers. It was unexpectedly in Capernaum, a very beautiful town, that unbelieving Jerusalem was condemned. To this city there was an ironic reply in Ezekiel: “Sodom has been vindicated on account of you.”", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 24, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And whosoever shall not receive you, nor hear your words, when you depart out of that  house or city, shake off the dust of your feet. Verily I say unto you, it shall be more tolerable for the land of Sodom and Gomorrha in the day of judgment, than for that city. Matthew 10:14-15", "lang": "", "orig": "", "d": "c. 388"}, {"v": 24, "f": "Rabanus Maurus", "w": "", "t": "Coro aim, which is interpreted ‘my mystery,’ and Bethsaida, ‘the house of fruits,’ or, ‘the house of hunters,’ are towns of Galilee situated on the shore of the sea of Galilee. The Lord herefore mourns for towns which once had the mystery of God, and which ought to have brought forth the fruit of virtues, and into which spiritual hunters had been sent.\nWe at this day see the words of the Saviour fulfilled; Coro aim and Bethsaida would not believe when the Lord came to them in person; but Tyre and Sidon have afterwards believed on the preaching of the Apostles.", "lang": "english", "orig": "", "d": "c. 840"}, {"v": 24, "f": "Socrates", "w": "Chapter 5.—The Passages in Which the Saviour Declares that There Shall Be a Divine\nJudgment in the End of the World.", "t": "en shall judge along with\n1323 Matt. xi. 22.\n1324 Matt. xi. 24.\n1325 Matt. xii. 41, 42.\n1326 Augustin quotes the whole passage, Matt. xiii. 37–43.\n1327 Matt. xix. 28.\n1328 Matt. xii. 27.\n\n\nHim, though He says that they shall sit upon twelve thrones; for by the n", "lang": "greek", "orig": "", "d": "380-450"}, {"v": 24, "f": "Socrates", "w": "Chapter 5.—The Passages in Which the Saviour Declares that There Shall Be a Divine\nJudgment in the End of the World.", "t": "The Saviour Himself, while reproving the cities in which He had done great works, but\nwhich had not believed, and while setting them in unfavorable comparison with foreign\ncities, says, “But I say unto you, It shall be more tolerable for Tyre and Sidon at the day of\njudgment than for you.”1323 And a little after He says, “Verily, I say unto you, It shall be\nmore tolerable for the land of Sodom in the day of judgment than for thee.”1324 Here He\nmost plainly predicts that a day of judgment is to come. And in another place He says, “The\nmen of Nineveh shall rise in judgment with this generation, and shall condemn it: because\nthey repented at the preaching of Jonas; and, behold, a greater than Jonas is here. The queen\nof the south shall rise up in the judgment with this generation, and shall condemn it: for\nshe came from the utter most parts of the earth to hear the words of Solomon; and behold,\na greater than Solomon is here.”1325 Two things we learn from this passage, that a judgment\nis to take place, and that it is to take place at the resurrection of the dead. For when He\nspoke of the Ninevites and the queen of the south, He certainly spoke of dead persons, and\nyet He said that they should rise up in the day of judgment. He did not say, “They shall\ncondemn,” as if they themselves were to be the judges, but because, in comparison with\nthem, the others shall be justly condemned.", "lang": "greek", "orig": "", "d": "380-450"}, {"v": 24, "f": "Tertullian (cont)", "w": "Chapter XL.", "t": "Such is our doctrine of punishment; and the inculcation of this doctrine turns many\nfrom their sins. But let us see, on the other hand, what is the response given on this subject\nby the priest of Jupiter or Apollo of whom Celsus speaks. It is this: “The mills of the gods\ngrind slowly.”4925 Another describes punishment as reaching “to children’s children, and\nto those who came after them.”4926 How much better are those words of Scripture: “The\nfathers shall not be put to death for the children, nor the children for the fathers. Every\nman shall be put to death for his own sin.”4927 And again, “Every man that eateth the sour\ngrape, his teeth shall be set on edge.”4928 And, “The son shall not bear the iniquity of the\nfather, neither shall the father bear the iniquity of the son: the righteousness of the righteous\nshall be upon him, and the wickedness of the wicked shall be upon him.”4929 If any shall\nsay that the response, “To children’s children, and to those who come after them,” corresponds\nwith that passage, “Who visits the iniquity of the fathers upon the children unto the\nthird and fourth generation of them that hate Me,”4930 let him learn from Ezekiel that this\nlanguage is not to be taken literally; for he reproves those who say, “Our fathers have eaten\nsour grapes, and the children’s teeth are set on edge,”4931 and then he adds, “As I live, saith\nthe Lord, every one shall die for his own sin.” As to the proper meaning of the figurative\nlanguage about sins being visited un", "lang": "latin", "orig": "", "d": "185-254"}, {"v": 24, "f": "Thomas Aquinas", "w": "", "t": "But I tell you... On the day of judgment your punishment will be more severe than of that land which was destroyed. Or it can be understood of the inhabitants: \"The servant who knows his master's will and does not do it, will be beaten with many stripes\" (Lk 12:47).", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 25, "f": "1 Clement", "w": "Chapter II.—Proofs from the plain testimony of Moses, and of the other prophets,\nwhose words are the words of Christ, that there is but one God, the founder of\nthe world, whom Our Lord preached, and whom He called His Father.", "t": "2. Again, our Lord Jesus Christ confesses this same Being as His Father, where He says:\n“I confess to thee, O Father, Lord of heaven and earth.”1164 What Father will those men\nhave us to understand [by these words], those who are most perverse sophists of Pandora?\nWhether shall it be Bythus, whom they have fabled of themselves; or their Mother; or the\nOnly-begotten? Or shall it be he whom the Marcionites or the others have invented as god\n(whom I indeed have amply demonstrated to be no god at all); or shall it be (what is really\nthe case) the Maker of heaven and earth, whom also the prophets proclaimed,—whom\nChrist, too, confesses as His Father,— whom also the law announces, saying: “Hear, O Israel;\nThe Lord thy God is one God?”1165", "lang": "greek", "orig": "", "d": "70-165"}, {"v": 25, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "7. I will confess unto You, he says, O Lord, in the directing of my heart; in that I shall have learned the judgments of Your righteousness Psalm 118:7. This is not the confession of sins, but of praise; as He also says in whom there was no sin, I will confess unto You, O Father, Lord of heaven and earth; Matthew 11:25 and as it is written in the Book of Ecclesiasticus, Thus shall you say in confession, of all the works of God, that they are very good. Sirach 39:15-16 I will confess unto You, he says, in the directing of my heart. Indeed, if my ways are made straight, I will confess unto You, since You have done it, and this is Your praise, and not mine....", "lang": "", "orig": "", "d": "c. 392-418"}, {"v": 25, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "19. I will confess to the Lord according to His justice Psalm 7:17. This is not the sinner's confession: for he says this, who said above most truly, If there be iniquity in my hands: but it is a confession of God's justice, in which we speak thus, Verily, O Lord, You are just, in that You both so protect the just, that You enlighten them by Yourself; and so order sinners, that they be punished not by Your malice, but by their own. This confession so praises the Lord, that the blasphemies of the ungodly can avail nothing, who, willing to excuse their evil deeds, are unwilling to attribute to their own fault that they sin, that is, are unwilling to attribute their fault to their fault. Accordingly they find either fortune or fate to accuse, or the devil, to whom He who made us has willed that it should be in our power to refuse consent: or they bring in another nature, which is not of God: wretched waverers, and erring, rather than confessing to God, that He should pardon them. For it is not fit that any be pardoned, except he says, I have sinned. He, then, that sees the deserts of souls so ordered by God, that while each has his own given him, the fair beauty of the universe is in no part violated, in all things praises God: and this is not the confession of sinners, but of the righteous. For it is not the sinner's confession when the Lord says, I confess to You, O Lord of heaven and earth, because You have hid these things from the wise, and revealed them to babes.", "lang": "", "orig": "", "d": "c. 392-418"}, {"v": 25, "f": "Augustine", "w": "Enarratio in Psalmum 95", "t": "4. Let us prevent His face by confession Psalm 94:2. Confession has a double meaning in Scripture. There is a confession of him who praises, there is that of him who groans. The confession of praise pertains to the honour of Him who is praised: the confession of groaning to the repentance of him who confesses. For men confess when they praise God: they confess when they accuse themselves; and the tongue has no more worthy use. Truly, I believe these to be the very vows, of which he speaks in another Psalm: I will pay You my vows, which I distinguished with my lips. Nothing is more elevated than that distinguishing, nothing is so necessary both to understand and to do. How then do you distinguish the vows which you pay unto God? By praising Him, by accusing yourself; because it is His mercy, to forgive us our sins. For if He chose to deal with us after our deserts, He would find cause only to condemn. O come, he said therefore, that we may at last go back from our sins, and that He may not cast up with us our accounts for the past; but that as it were a new account may be commenced, all the bonds of our debts having been burnt....The more therefore you despaired of yourself on account of your iniquities, do thou confess your sins; for so much greater is the praise of Him who forgives, as is the fullness of the penitent's confession more abundant.", "lang": "", "orig": "", "d": "c. 400"}, {"v": 25, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "When you see all these things, and rejoicest, and art lifted up to the Maker, and gazest on His invisible things understood by the things which are made, Romans 1:20 His confession is in earth and heaven: that is, thou confesses to Him from things on earth, thou confesses to Him from things in heaven. And since He made all things, and nought is better than He, whatsoever He made is less than He, and whatsoever in these things pleases you, is less than He. Let not then what He has made so please you, as to withdraw you from Him who made: if you love what He made, love much more Him who made. If the things which He has made are beautiful, how much more beautiful is He who made them. And He shall exalt the horn of His people. Behold what Haggai and Zachariah prophesied. Now the horn of His people is humble in afflictions, in tribulations, in temptations, in beating of the breast; when will He exalt the horn of His people? When the Lord has come, and our Sun is risen, not the sun which is seen with the eye, and rises upon the good and the evil, Matthew 5:45 but That whereof is said, To you that hear God, the Sun of Righteousness shall rise, and healing in His wings; Malachi 4:2 and of whom the proud and wicked shall hereafter say, The light of righteousness has not shined unto us, and the sun of righteousness rose not upon us. Wisdom 5:6 This shall be our summer. Now during the winter weather the fruits appear not on the stock; you observe, so to say, dead trees during the winter", "lang": "", "orig": "", "d": "c. 392-418"}, {"v": 25, "f": "Augustine - Confessions", "w": "Sermon XVII.", "t": "On the words of the Gospel, Matt. xi. 25, “I thank thee, O Father, Lord of Heaven and Earth,\nthat thou didst hide these things from the wise and understanding,” etc.", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 25, "f": "Augustine - Confessions", "w": "Sermon XVIII.", "t": "Again on the words of the Gospel, Matt. xi. 25, “I thank thee, O Father, Lord of Heaven and\nEarth,” etc.", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 25, "f": "Augustine - Confessions", "w": "Sermon XIX.", "t": "3. What is the top in the erection of that building which we are constructing? Whither\nwill the highest point of this building reach? I say at once, even to the Vision of God. Ye see\nhow high, how great a thing it is to see God. Whoso longeth after it, understands both what\nI say and what he hears. The Vision of God is promised to us, of the very God, the Supreme\n2306 Matt. xi. 25–27.\n2307 Matt. xi. 28.\n2308 Spatia.\n2309 Matt. xi. 29.\n\n\nGod. For this is good, to see Him who seeth. For they who worship false gods, see them\neasily; but they see them “who have eyes and see not.” But to us is promised the Vision of\nthe Living and the Seeing God, that we may desire eagerly to see that God of whom Scripture\nsaith, “He that planted the ear, shall he not hear? He that formed the eye, doth he not consider?”\n2310 Doth He then not hear, who hath made for thee that whereby thou hearest? and\ndoth not He see, who hath created that whereby thou seest? Well therefore in the foregoing\nwords of this very Psalm doth He say, “Understand therefore ye unwise among the people,\nand ye fools at length be wise.”2311 For many men commit evil deeds whilst they think they\nare not seen by God. And it is difficult indeed for them to believe that He cannot see them;\nbut they think that He will not. Few are found of such great impiety, that that should be\nfulfilled in them which is written, “The fool hath said in his heart, There is no God.”2312\nThis is but the madness of a few. For as great piety belongs bu", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 25, "f": "Augustine - Confessions", "w": "Sermon XVII.", "t": "1. When the Holy Gospel was being read, we heard that the Lord Jesus exulted in Spirit,\nand said, “I confess to Thee, O Father, Lord of heaven and earth, for that Thou hast hid\nthese things from the wise and prudent, and hast revealed them unto babes.”2252 Thus much\nto begin2253 with, we find before we pass on further, if we consider the words of the Lord\nwith due attention, with diligence, and above all with piety, that we ought not invariably to\nunderstand when we read of “confession” in the Scriptures, the confession2254 of a sinner.\nNow especial need there was of saying this, and of reminding you, Beloved, of this, because\nas soon as this word was uttered by the reader’s voice, there followed upon it the sound of\nthe beating of your breasts, when ye had heard, I mean, what the Lord said, “I confess to\nThee, O Father.” At the uttering of these words, “I confess,” ye beat your breasts. Now what\nmeans this beating of the breast, but to show that which lies hid within the breast, and to\nchastise by the visible beating the secret sin? And why did ye this, but because ye heard, “I\nconfess to Thee, O Father.” Ye heard the words “I confess,” but ye did not consider, who it\nis that confesses. But consider now. If Christ, from whom all sin is far removed, said, “I\nconfess:” confession does not belong to the sinner only, but sometimes to him also that\npraiseth God. We confess then, whether in praising God, or accusing ourselves. In either\ncase it is a godly confession, either when t", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 25, "f": "Augustine - Confessions", "w": "Sermon XVIII.", "t": "1. We have heard the Son of God saying, “I confess to Thee, O Father, Lord of heaven\nand earth.” What doth he confess to Him? Wherein doth he praise Him? “Because Thou\nhast hid these things from the wise and prudent, and hast revealed them unto babes.”2288\nWho are the “wise and prudent”? Who the “babes”? What hath He hid from the wise and\nprudent, and revealed unto babes? By the “wise and prudent,” He signifieth those of whom\nSt. Paul speaks; “Where is the wise? where is the scribe? where is the disputer of this world?\nHath not God made foolish the wisdom of this world?”2289 Yet perhaps thou still askest\nwho they are. They are they peradventure who in their much disputation concerning God,\nhave spoken falsely of Him; who, puffed up by their own doctrines, could in no wise find\nout and know God, and who for the God whose substance is incomprehensible and invisible,\nhave thought the air and sky to be God, or the sun to be God, or anything which holds high\nplace2290 among the creatures to be God. For observing the grandeur and beauty and powers\nof the creatures, they rested in them, and found not the Creator.", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 25, "f": "Augustine - Trinity", "w": "Psalm CXXXVIII.5700", "t": "2. “And before the Angels will I sing unto Thee.” Not before men will I sing, but before\nthe Angels. My song is my joy; but my joy in things below is before men, my joy in things\nabove before the Angels. For the wicked knoweth not the joy of the just: “There is no joy,\n5700 Lat. CXXXVII.\n5701 Confiteor Tibi. Matt. xi. 25.\n5702 [He adds: “A whole burnt offering is a sacrifice where the whole is burnt, for the Greek word ὅλον,\n(holocaustum, Lat.) meaneth ‘whole.’”—C.]\n5703 Acts xvii. 27, 28.\n\n\nsaith my God, to the wicked.”5704 The wicked rejoiceth in his tavern, the martyr in his chain.\nIn what did that holy Crispina rejoice, whose festival is kept to-day? She rejoiced when she\nwas being seized, when she was being carried before the judge, when she was being put into\nprison, when she was being brought forth bound, when she was being lifted up on the scaffold,\n5705 when she was being heard, when she was being condemned: in all these things she\nrejoiced; and the wretches thought her wretched, when she was rejoicing before the Angels.", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 25, "f": "Augustine - Trinity", "w": "Psalm CXXXVIII.5700", "t": "s no joy,\n5700 Lat. CXXXVII.\n5701 Confiteor Tibi. Matt. xi. 25.\n5702 [He adds: “A whole burnt offering is a sacrifice where the whole is burnt, for the Greek word ὅλον,\n(holocaustum, Lat.) meaneth ‘whole.’”—C.]\n5703 Acts xvii. 27, 28.\n\n\nsaith my God, to the wick", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 25, "f": "Augustine of Hippo", "w": "", "t": "Jesus says, “My Father, Lord of heaven and earth,” Father of him through whom all things were made. Surely all creation is embraced by these two nouns heaven and earth. Therefore the first book of God’s Scripture says, “In the beginning God made heaven and earth.” And “my help is from the Lord, who made heaven and earth.” By the name of heaven is understood whatever is in heaven, and by the name of earth is understood whatever is on earth. Thus, by mentioning these two parts of creation no aspect of creation is overlooked, since the created object is either here or there. Moreover, when the Son speaks to his Father his confession, Jesus admonishes us that confession is owed to God not for our sins alone. For very often when it is heard in the Scriptures, “You shall confess to the Lord,” many who hear this beat their breasts in remorse. They do not recall that the term confession means anything else except their accustomed use when they show repentance, confessing their sins and awaiting their just deserts from God, not because they deserve to suffer but because God deems it worthy to act mercifully. But if there were not confession in the act of praise, Jesus would not say, “I confess to you, Father,” since he had no sin to confess. It is said in another book of the Scripture: “You shall confess to the Lord” and say in your confession that “all the works of the Lord are very good.” This is certainly a confession of praise and not of fault.", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 25, "f": "Augustine of Hippo", "w": "", "t": "(Serm. 67. 1.) If Christ, from whom all sin is far, said, I confess, confession is not proper for the sinner only, but sometimes also for him that gives thanks. We may confess either by praising God, or by accusing ourselves. When He said, I confess unto thee, it is, I praise Thee, not I accuse Myself.\n\n(Serm. 67. 5.) That the wise and understanding are to be taken as the proud, Himself opens to us when He says, and hast revealed them unto babes; for who are babes but the humble?", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 25, "f": "Chrysostom - Homilies on John", "w": "Homily XXXVIII.", "t": "“At that time Jesus answered and said, I make acknowledgment unto Thee,1606O Father, Lord\nof Heaven and earth; because Thou hast hid these things from the wise and prudent, and\nhast revealed them unto babes. Even so, Father, for so it seemed good in Thy sight.”1607", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 25, "f": "Cyril of Alexandria", "w": "", "t": "He employs the phrase “I confess you” in accordance with human custom. Instead of saying “I acknowledge you,” he brings in the phrase “I glorify you.” For it is customary in the divinely inspired Scripture for the word confession to be taken in some such a sense. It is written, “Let the people give thanks,” Lord, “to your great name, because it is formidable and holy.” And again, “I will give thanks to you, Lord, with all my heart.”7But those who are perverted in mind say, “Look here, if he renders thanks to the Father, how then is he not less than the Father?” To this objection one who knows how to guard the doctrines of truth might say, “My good man, what prevents the consubstantial Son from accepting and praising his own Father, who through him saves what is under heaven? If you believe because of this confession that he is in a lesser position than the Father, look also at what comes next. Jesus acknowledges and calls his Father Lord of heaven and earth. For he confesses him as ‘Lord of heaven and earth’ and at the same time he calls upon him as ‘Father.’ But the Son of God who is ruler of all is in every way with him the Lord and Master of all, not as one worse or differing in substance, but as God from God. He is crowned with equal renown, having substantially with him equality in everything whatsoever.”", "lang": "english", "orig": "", "d": "c. 430"}, {"v": 25, "f": "Epiphanius Scholasticus", "w": "", "t": "And he revealed these things to children. To which children? Not those who are children in age but to those who are children in respect to sin and wickedness. To them Jesus revealed how to seek the blessings of paradise and the things to come in the kingdom of heaven, because thus it was well pleasing before God that “they should come from the east and the west and that they should lie down with Abraham, Isaac and Jacob in the kingdom of heaven; but that the sons of this worldly kingdom should be cast into the outer darkness, where there will be weeping and gnashing of teeth.”", "lang": "english", "orig": "", "d": "c. 375"}, {"v": 25, "f": "Eusebius - Church History", "w": "Chapter IX.—He Compares the Doctrine of the Platonists Concerning the Λόγος\nWith the Much More Excellent Doctrine of Christianity.", "t": "o take away\n511 Rom. v. 6.\n512 Rom. viii. 32.\n513 Matt. xi. 25.\n514 Ibid. ver. 28.\n515 Ibid. ver. 29.\n516 Ps. xxv. 9.\n517 Ibid. ver. 18.\n518 Matt. xi. 29.\n519 Rom. i. 21, 22.\n520 Ibid. i. 23.\n521 In the Benedictine edition we have reference to Augustin’s in Ps.", "lang": "greek", "orig": "", "d": "260-340"}, {"v": 25, "f": "GK Chesterton", "w": "", "t": "By poets, as I have said, I do not mean people who write poetry, or indeed people who write anything. I mean such people as, hav

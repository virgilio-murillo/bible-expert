e out into the wilderness to see? A reed shaken with the wind? But what went ye out for to see? A man clothed in soft raiment; behold, they that wear soft clothing are in kings' houses. But what went ye out for to see? A prophet?  yea, I say unto you, and more than a prophet.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 8, "f": "Tertullian", "w": "", "t": "That Lord walked in humility and obscurity, with no definite home: for \"the Son of man,\" said He, \"hath not where to lay His head; \" unadorned in dress, for else He had not said, \"Behold, they who are clad in soft raiment are in kings' houses: \" in short, inglorious in countenance and aspect, just as Isaiah withal had fore-announced. If, also, He exercised no right of power even over His own followers, to whom He discharged menial ministry; if, in short, though conscious of His own kingdom, He shrank back from being made a king, He in the fullest manner gave His own an example for turning coldly from all the pride and garb, as well of dignity as of power.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 8, "f": "Theophylact of Ohrid", "w": "", "t": "Denying them any basis for saying that John later became soft by giving himself over to luxury, He says, This cannot be; that his clothing is made of hair shows that he is an enemy of luxury. For if he were wearing soft clothing and living in kings' houses, if he so desired luxury he would not be in prison. So then, learn that it does not befit a true Christian to wear luxurious clothing.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 8, "f": "Thomas Aquinas", "w": "", "t": "Likewise, he is not inconstant as seeking profit. Why then did you go out? For all riches pertain to some bodily use, such as food or clothing. And it is evident that neither of these had any influence. Therefore, there is no reason to believe that he says this for any advantage: Why then did you go out? To see a man clothed in soft raiment? But why does he make no mention of food? Because there was no question on that point. But he was clothed in camel's hair. Hence those who wear soft raiment are not in the desert but in kings' houses. Chrysostom explains it another way: Some are lightheaded by nature, others from pleasure, as Hosea (4:11) says: \"Fornication and wine and intoxication take away understanding.\" He removes the first by what he said above; the second, when he says, wear soft garments; therefore, he is not inconstant from the pleasures of life.\n\nBut here a question can be raised about being clothed in pleasures: Is it a sin? If not, it should not have been charged against that rich man, who dressed in purple and fine linen every day (Lk 16:19). Augustine says that such things are not to be considered, but the intention of the user; for one should be dressed after the custom of those among whom he lives. Therefore, the custom needs further clarification. Hence some dress more sparingly, some more ornately; and both ways require a distinction. If more sparingly, then it is either for a good intention, and this is good, or is for vainglory, and this is evil. If mor", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 9, "f": "1 Clement", "w": "Chapter X.—Proofs of the foregoing, drawn from the Gospels of Mark and Luke.", "t": "ion.\n748 Luke i. 8, etc.\n749 Luke i. 15, etc.\n750 Matt. xi. 9, 11.\n751 Ps. lviii. 3.\n752 Luke i. 26, etc.\n\n\nfather David: and He shall reign over the house of Jacob for ever; and of His kingdom there\nshall be no end.”753 For who else is there who can reign unin", "lang": "greek", "orig": "", "d": "70-165"}, {"v": 9, "f": "Augustine - Confessions", "w": "Sermon XVI.", "t": "world.” Thou saidst, “Of His fulness have we\n2242 Matt. xi. 9.\n2243 John i. 29.\n2244 Matt. xi. 11.\n2245 He gives these two interpretations of this passage; again Cont. adv. leg. and Prop. ii. 5 (20).\n2246 Commendavit.\n2247 Matt. xi. 3.\n\n\nall received.” Thou sai", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 9, "f": "Chrysostom - Homilies on John", "w": "Homily XXXVII.", "t": "“And as they departed, Jesus began to say unto the multitudes concerning John, What went\nye out into the wilderness to see? A reed shaken with the wind? But what went ye out for\nto see? A man clothed in soft raiment; behold, they that wear soft clothing are in kings’\nhouses. But what went ye out for to see? A prophet?1560yea, I say unto you, and more than\na prophet.”", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 9, "f": "Gregory the Dialogist", "w": "", "t": "But what went you out into the desert to see? A prophet? Yes, I say to you, and more than a prophet. For the office of a prophet is to foretell things to come, not also to show them. John therefore is more than a prophet, because the one whom he had prophesied by going before, he also pointed out by showing. But since he is denied to be a reed shaken by the wind, since he is said not to be clothed in soft garments, since the name of prophet is declared to be inadequate for him, let us now hear what may worthily be said of him.", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 9, "f": "Gregory the Dialogist", "w": "", "t": "(Hom. in Ev. vi. 5.) The office of a prophet is to foretel things to come, not to show them present. John therefore is more than a prophet, because Him whom he had foretold by going before Him, the same he showed as present by pointing Him out.", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 9, "f": "Jerome", "w": "", "t": "In this he is also greater than the other prophets, that to his prophetic privilege is added the reward of the Baptist that he should baptize his Lord.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 9, "f": "John Chrysostom", "w": "", "t": "When therefore as well by the place, as by his garments, and by their concourse unto Him, He had delineated his character, He proceeds to bring in the prophet. For having said, \"Why went ye out? To see a prophet? Yea I say unto you, and more than a prophet;\" He goes on, \"For this is he of whom it is written, Behold, I send my messenger before Thy face, which shall prepare Thy way before Thee.\" Having before set down the testimony of the Jews, He then applies that of the prophets; or rather, He puts in the first place the sentence of the Jews, which must have been a very strong demonstration, the witness being borne by his enemies; secondly, the man's life; thirdly, His own judgment; fourthly, the prophet; by all means stopping their mouths.\n\nThen having said, that he is greater than a prophet, He signifies also in what he is greater. And in what is he greater? In being near Him that was come. For, \"I send,\" saith He, \"my messenger before Thy face;\" that is, nigh Thee. For as with kings, they who ride near the chariot, these are more illustrious than the rest, just so John also appears in his course near the advent itself. See how He signified John's excellency by this also; and not even here doth He stop, but adds afterwards His own suffrage as well.", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 9, "f": "John Chrysostom", "w": "", "t": "Having described his habits of life from his dwelling-place, his dress, and the concourse of men to hear him, He now brings in that he is also a prophet, But what went ye out for to see? A prophet? yea, I say unto you, and more than a prophet.", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 9, "f": "Tertullian", "w": "", "t": "Turning now to the law, which is properly ours-that is, to the Gospel-by what kind of examples are we met, until we come to definite dogmas? Behold, there immediately present themselves to us, on the threshold as it were, the two priestesses of Christian sanctity, Monogamy and Continence: one modest, in Zechariah the priest; one absolute, in John the forerunner: one appeasing God; one preaching Christ: one proclaiming a perfect priest; one exhibiting \"more than a prophet,\" -him, namely, who has not only preached or personally pointed out, but even baptized Christ.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 9, "f": "Theophylact of Ohrid", "w": "", "t": "John was more than a prophet because the other prophets only foretold Christ, while he was an eyewitness, indeed a great thing. And the others prophesied after their birth, while he, still in his mother's womb, recognized Christ and leapt.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 9, "f": "Thomas Aquinas", "w": "", "t": "But they might say: He is inconstant and speaks from a human spirit; therefore, he removes this: But what did you go out to see? A prophet? Hence he bears witness that he did not speak from a spirit that was human but prophetic. So he shows that he is a prophet and more than a prophet. For he was a prophet, as it says in Luke (1:76): \"And you, child, shall be called a prophet of the Most High.\" Likewise, he raised him above the prophets, saying, I tell you, and more than a prophet. He said this for three reasons:\n\nFirst, because the office of a prophet is to foretell the future; but he manifested not only the future but also things present, saying: \"Behold the Lamb of God, behold him who takes away the sin of the world\" (Jn 1:29).\nSecondly, he is not only called a prophet but the Baptizer, as above (c. 3); and the precursor, as in Luke (1:76): \"You will go before the face of the Lord to prepare his ways.\"\nThirdly, as to his manner: for he acted more miraculously than a prophet, because he prophesied from his mother's womb; the others did not, as it says in Luke (1:44): \"For behold, when the voice of your greeting sounded on my ears, the infant in my womb leapt for joy.\"", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 10, "f": "Glossa Ordinaria", "w": "", "t": "(interlin.) That is, shall open the hearts of Thy hearers by preaching repentance and baptizing.", "lang": "english", "orig": "", "d": "c. 1150"}, {"v": 10, "f": "Gregory the Dialogist", "w": "", "t": "There follows: This is he of whom it is written: Behold, I send my angel before your face, who will prepare your way before you. For what is called angelus in Greek is called nuntius (messenger) in Latin. Rightly therefore he who is sent to announce the heavenly judge is called an angel, that he may preserve in his name the dignity which he fulfills in his work. It is indeed a lofty name, but his life is not inferior to his name.\n\nBeloved brothers, let us not say it to our judgment, since all who are designated by the name of priest are called angels, as the prophet attests when he says: \"The lips of the priest guard knowledge, and they seek the law from his mouth, because he is the angel of the Lord of hosts.\" But you too, if you wish, can merit the loftiness of this name. For each one of you, insofar as he is able, insofar as he has received the grace of heavenly inspiration, if he calls back his neighbor from wickedness, if he takes care to exhort him to do good, if he proclaims the eternal kingdom or punishment to one who errs, when he bestows the words of holy proclamation, he surely becomes an angel. And let no one say: \"I am not sufficient to admonish, I am not fit to exhort.\" Offer what you can, lest what you received and kept badly be demanded of you in torments. For he who studied to hide his talent rather than to spend it had received no more than one talent. And we know that in the tabernacle of God not only bowls but also, by the Lord's command, cups were made. B", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 10, "f": "Gregory the Dialogist", "w": "", "t": "(ubi sup.) For the Greek word Angel, is in Latin Nuntius, 'a messenger.' He therefore who came to bear a heavenly message is rightly called an Angel, that he may preserve in his title the dignity which he performs in his office.", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 10, "f": "Jerome", "w": "", "t": "John is greater than the other prophets for this reason: the other prophets predicted to John that someone was to come, but John pointed out with his finger that he had indeed come, saying, “Behold, the Lamb of God, who takes away the sins of the world.” And he reached not only the rank of a prophet but even to that of Baptist, by baptizing his Lord. This heightened his significance. He thereby fulfilled the prophecy of Malachi in which an angel is foretold. John belonged to the order of the angels not by nature but by the importance of his task. It means he was the messenger who would announce the coming of the Lord.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 10, "f": "Jerome", "w": "", "t": "To add to this great worthiness of John, He brings a passage from Malachias, in which he is spoken of as an Angel. (Mal. 3:1)) We must suppose that John is here called an Angel, not as partaking the Angelic nature, but from the dignity of his office as a forerunner of the Lord.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 10, "f": "John Chrysostom", "w": "", "t": "Then he shows in what respect He is greater, saying, This is he of whom it is written, Behold, I send my angel before thy face.\n\nHe shows wherein it is that John is greater than the Prophets, namely, in that he is nigh unto Christ, as he says, I send before thy face, that is, near Thee, as those that walk next to the king's chariot are more illustrious than others, so likewise is John because of his nearness to Christ.", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 10, "f": "Pseudo-Chrysostom", "w": "", "t": "Also the other Prophets were sent to announce Christ's coming, but John to prepare His way, as it follows, who shall make ready thy way before thee;", "lang": "english", "orig": "", "d": ""}, {"v": 10, "f": "Tertullian", "w": "", "t": "For Joshua was to introduce the people into the land of promise, not Moses. Now He called him an \"angel,\" on account of the magnitude of the mighty deeds which he was to achieve (which mighty deeds Joshua the son of Nun did, and you yourselves read), and on account of his office of prophet announcing (to wit) the divine will; just as withal the Spirit, speaking in the person of the Father, calls the forerunner of Christ, John, a future \"angel,\" through the prophet: \"Behold, I send mine angel before Thy\"-that is, Christ's-\"face, who shall prepare Thy way before Thee.\" Nor is it a novel practice to the Holy Spirit to call those \"angels\" whom God has appointed as ministers of His power.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 10, "f": "Theophylact of Ohrid", "w": "", "t": "John was called an angel, both because of his angelic and almost immaterial way of life, and because he announced and proclaimed Christ. He prepared Christ's way by witnessing concerning Him and by baptizing unto repentance, for after repentance comes the forgiveness of sins, which Christ gives. Christ said these things after John's disciples had left so that He would not appear to be flattering him. The prophecy mentioned is of the prophet Malachi (Malachi 3:1).", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 10, "f": "Thomas Aquinas", "w": "", "t": "This is he of whom it is written. Here he proves John's excellence: first, by a text; secondly, from his special privileges (v. 11). He says, therefore: I have said that he is more than a prophet, concerning whom Malachi (3:1) speaks: Behold, I sent my messenger [angel], who shall prepare your way before you... In this text John's outstanding qualities are mentioned: first, because he calls him an angel. For an angel is higher than a prophet, because as a priest is midway between a prophet and the people, so a prophet between angels and priests. But the angel is between God and prophets; hence Zechariah (1:9) says: \"The angel who spoke in me.\" Angel is the name of an office, not of a nature; hence John is called an angel from his office. For there is a difference between an angel and a prophet, because the angels see openly; hence it says below (18:10): \"I say to you, that their angels always behold the face of my Father in heaven.\" Angels always see God's face, but the prophets do not. Hence, as angels always see the face of the Father, so John saw Christ in a special way; and because it was a special way, he says my. He also says, before my face. When a king goes somewhere, many people precede him; but the more familiar ones go before his face. So John is considered more honorable, because he was sent before his face; for the nearer one is, the more honorable he is. Finally, he prepared the way, because he baptized; hence, he says, who shall prepare your way before you.", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 11, "f": "Athanasius - Select Works", "w": "Chapter 9.", "t": "6.\n1483 John xiii. 4, 5.\n1484 Matt. iii. 13.\n1485 Matt. xi. 11.\n1486 John i. 27.\n\n\nmight be further bestowed on those who had received the baptism of John. For if Christ’s\nhumility were not to be commended to our notice, neither would there be any need of the\nba", "lang": "greek", "orig": "", "d": "296-373"}, {"v": 11, "f": "Augustine - City of God", "w": "Tractate IV.", "t": "You have very often heard, holy brethren, and you know well, that John the Baptist, in\nproportion as he was greater than those born of women, and was more humble in his acknowledgment\nof the Lord, obtained the grace of being the friend of the Bridegroom; zealous\nfor the Bridegroom, not for himself; not seeking his own honor, but that of his Judge, whom\nas a herald he preceded. Therefore, to the prophets who went before, it was granted to predict\nconcerning Christ; but to this man, to point Him out with the finger. For as Christ was unknown\nby those who did not believe the prophets before He came, He remained unknown\nto them even when present. For He had come humbly and concealed from the first; the\nmore concealed in proportion as He was more humble: but the people, despising in their\npride the humility of God, crucified their Saviour, and made Him their condemner.", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 11, "f": "Augustine - Confessions", "w": "Sermon XVI.", "t": "s have we\n2242 Matt. xi. 9.\n2243 John i. 29.\n2244 Matt. xi. 11.\n2245 He gives these two interpretations of this passage; again Cont. adv. leg. and Prop. ii. 5 (20).\n2246 Commendavit.\n2247 Matt. xi. 3.\n\n\nall received.” Thou saidst, “I am not worthy to unloose the", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 11, "f": "Augustine of Hippo", "w": "", "t": "(Cont. Adv. Leg. et Proph. ii. 5.) The heretic argues from this verse to prove, that since John did not belong to the kingdom of heaven, therefore much less did the other Prophets of that people, than whom John is greater. But these words of the Lord may be understood in two ways. Either the kingdom of heaven is something which we have not yet received, that, namely, of, which He speaks, Come, ye blessed of my Father, receive the kingdom, (Mat. 25:34) because they in it are Angels, therefore the least among them is greater than a righteous man who has a corruptible body. Or if we must understand the kingdom of heaven of the Church, whose children are all the righteous men from the beginning of the world until now, then the Lord speaks this of Himself, who was after John in the time of His birth, but greater in respect of His divine nature and supreme power. According then to the first interpretation it will be pointed, He who is least in the kingdom of heaven, is greater than he; according to the second, He who is less than he, is in the kingdom of heaven greater than he.", "lang": "english", "orig": "", "d": "c. 410"}, {"v": 11, "f": "Gospel of Peter", "w": "Section XIV.", "t": "r of wine, and an associate of publicans 14,\n1012 Matt. xi. 11.\n1013 Luke vii. 29.\n1014 Syriac. In Arabic the word ordinarily means believed.\n1015 Luke vii. 30.\n1016 See below, § 20, 28, note.\n1017 Matt.", "lang": "greek", "orig": "", "d": "100-300"}, {"v": 11, "f": "Gospel of Peter", "w": "Section XIV.", "t": "1 1012Verily I say unto you, There hath not arisen among those whom women have\nborne a greater than John the Baptist; but he that is little now in the kingdom of heaven is\ngreater than he.", "lang": "greek", "orig": "", "d": "100-300"}, {"v": 11, "f": "Jerome", "w": "", "t": "“Yet he who is least in the kingdom of heaven is greater than he.” Now, many would like to interpret this with reference to the Savior, as meaning that the one lesser in age is the greater in worth. However, let us interpret it simply to mean that every saint who is already with God is greater than anyone who remains expectant, as yet in the battle. For it is one thing to possess the crown of victory, another to be still fighting in the ranks. Some conclude that the very newest angel who serves God in heaven is greater than any one, even the best, who dwells on the earth still in expectation.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 11, "f": "Jerome", "w": "", "t": "(Verse 11) Truly I tell you, among those born of women there has not risen anyone greater than John the Baptist; yet whoever is least in the kingdom of heaven is greater than he. From the days of John the Baptist until now, the kingdom of heaven has been subjected to violence, and violent people have been raiding it. For it does not immediately follow that if others are not greater than him, he is greater than others; but that he has equality with the other saints.\n\nBut whoever is lesser in the kingdom of heaven is greater than him. Many want to understand this about the Savior, that whoever is lesser in time is greater in dignity. But let us understand simply: that every saint, who is already with God, is greater than him who still stands in battle. For it is one thing to possess the crown of victory, another to still fight in the battle. Some want to receive the last angel in heaven ministering to the Lord as better than any first man who dwells on earth.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 11, "f": "Jerome", "w": "", "t": "He is then set before all those that are born in wedlock, and not before Him who was born of the Virgin and the Holy Spirit; yet these words, there has not arisen a greater than John the Baptist, do not imply that John is to be set above the Prophets and Patriarchs and all others, but only makes him equal to the rest; for it does not follow that because others are not greater than him, that therefore he is greater than others.\n\nWe understand it simply, that every saint who is already with the Lord is greater than he who yet stands in the battle; for it is one thing to have gained the crown of victory, another to be yet fighting in the field.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 11, "f": "John Chrysostom", "w": "", "t": "\"Verily I say unto you, among them that are born of women, there hath not arisen a greater than John the Baptist.\"\n\nNow what He said is like this: \"woman hath not borne a greater than this man.\" And His very sentence is indeed sufficient; but if thou art minded to learn from facts also, consider his table, his manner of life, the height of his soul. For he so lived as though he were in heaven: and having got above the necessities of nature, he travelled as it were a new way, spending all his time in hymns and prayers, and holding intercourse with none among men, but with God alone continually. For he did not so much as see any of his fellow-servants, neither was he seen by any one of them; he fed not on milk, he enjoyed not the comfort of bed, or roof, or market, or any other of the things of men; and yet he was at once mild and earnest. Hear, for example, how considerately he reasons with his own disciples, courageously with the people of the Jews, how openly with the king. For this cause He said also, \"There hath not risen among them that are born of women a greater than John the Baptist.\"\n\nBut lest the exceeding greatness of His praises should produce a sort of extravagant feeling, the Jews honoring John above Christ; mark how He corrects this also. For as the things which edified His own disciples did harm to the multitudes, they supposing Him an easy kind of person; so again the remedies employed for the multitudes might have proved more mischievous, they deriving from C", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 11, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For inasmuch as many supposed that John was greater than He, because John had been brought up all his time in the wilderness, and was son of a chief priest, and was clothed with such raiment, and was calling all men unto his baptism, and had been born of a barren mother; while Jesus, first of all, was of a damsel of ordinary rank (for the virgin birth was not yet manifest to all); and besides, He had been brought up in a house, and held converse with all men, and wore this common raiment; they suspected Him to be less than John, knowing as yet nothing of those secret things — and it fell out moreover that He was baptized of John, which thing added support to this surmise, even if none of those mentioned before had existed; for it would come into their mind that this man was one of the many (for were He not one of the many, He would not have come with the many to the baptism), but that John was greater than He and far more admirable:— in order therefore that this opinion might not prevail with the multitude, the very heavens are opened, when He is baptized, and the Spirit comes down, and a voice with the Spirit, proclaiming the dignity of the Only Begotten.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 11, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "What then? it may be said, is it by comparison that He is greater than John? Far from it. For neither when John says, He is mightier than I, Matthew 3:11 does he say it as comparing them; nor Paul, when remembering Moses he writes, For this man was counted worthy of more glory than Moses, Hebrews 3:3 does he so write by way of comparison; and He Himself too, in saying, Behold, a greater than  Solomon is here, Matthew 12:42 speaks not as making a comparison.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 11, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Now what He said is like this: woman has not borne a greater than this man. And His very sentence is indeed sufficient; but if you are minded to learn from facts also, consider his table, his manner of life, the height of his soul.  For he so lived as though he were in heaven: and having got above the necessities of nature, he travelled as it were a new way, spending all his time in hymns and prayers, and holding intercourse with none among men, but with God alone continually. For he did not so much as see any of his fellow-servants, neither was he seen by any one of them; he fed not on milk, he enjoyed not the comfort of bed, or roof, or market, or any other of the things of men; and yet he was at once mild and earnest. Hear, for example, how considerately he reasons with his own disciples, courageously with the people of the Jews, how openly with the king. For this cause He said also, There has not risen among them that are born of women a greater than John the Baptist.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 11, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Wherefore this also, in an unsuspected way, He corrects by saying, He that is less, in the kingdom of Heaven is greater than he. Less in age, and according to the opinion of the multitude, since they even called Him a gluttonous man and a winebibber; Matthew 11:19 and, Is not this the carpenter's son? Matthew 13:55 and on every occasion they used to make light of Him.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 11, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And moreover His saying, There has not risen among them that are born of women a greater than John, suited one contrasting John with Himself, and thus tacitly excepting Himself. For though He too were born of a woman, yet not as John, for He was not a mere man, neither was He born in like manner as a man, but by a strange and wondrous kind of birth.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 11, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Oh honor! Oh virtue! Unto what a height does she lead up him that follows after her! How many women have blessed that holy Virgin, and her womb, and prayed that they might become such mothers, and give up all! What then is there to hinder? For behold, He has marked out a spacious road for us; and it is granted not to women only, but to men also, to be of this rank, or rather of one yet far higher. For this makes one His mother much more, than those pangs did. So that if that were a subject for blessing, much more this, inasmuch as it is also more real. Do not therefore merely desire, but also in the way that leads you to your desire walk thou with much diligence.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 11, "f": "Origen of Alexandria", "w": "", "t": "The kingdom of heaven is Jesus the Christ himself, who exhorts all people to repentance and draws them to himself by love.", "lang": "english", "orig": "", "d": "c. 230"}, {"v": 11, "f": "Pseudo-Chrysostom", "w": "", "t": "But seeing that righteousness has so great deepness that none can be perfect therein but God only, I suppose that all the saints tried by the keenness of the divine judgment, rank in a fixed order, some lower, some before other. Whence we understand that He that hath none greater than Himself, is greater than all.", "lang": "english", "orig": "", "d": ""}, {"v": 11, "f": "Pseudo-Clementine Literature", "w": "Chapter LX.—Disciples of John Refuted.", "t": "“And, behold, one of the disciples of John asserted that John was the Christ, and not\nJesus, inasmuch as Jesus Himself declared that John was greater than all men and all\nprophets.589 ‘If, then,’ said he, ‘he be greater than all, he must be held to be greater than\nMoses, and than Jesus himself. But if he be the greatest of all, then must he be the Christ.’\nTo this Simon the Canaanite, answering, asserted that John was indeed greater than all the\nprophets, and all who are born of women, yet that he is not greater than the Son of man.\nAccordingly Jesus is also the Christ, whereas John is only a prophet: and there is as much\ndifference between him and Jesus, as between the forerunner and Him whose forerunner\nhe is; or as between Him who gives the law, and him who keeps the law. Having made these\nand similar statements, the Canaanite also was silent. After him Barnabas,590 who also is\ncalled Matthias, who was substituted as an apostle in the place of Judas, began to exhort the\npeople that they should not regard Jesus with hatred, nor speak evil of Him. For it were far\nmore proper, even for one who might be in ignorance or in doubt concerning Jesus, to love\nthan to hate Him. For God has affixed a reward to love, a penalty to hatred. ‘For the very\nfact,’ said he, ‘that He assumed a Jewish body, and was born among the Jews, how has not\nthis incited us all to love Him?’ When he had spoken this, and more to the same effect, he\nstopped.”", "lang": "greek", "orig": "", "d": "200-300"}, {"v": 11, "f": "Rabanus Maurus", "w": "", "t": "As much as to say; What need to recount one by one the praises of John the Baptist; I say verily unto you, Among them that are born of women, &c. He says women, not virgins. If the same word mulier, which denotes a married person, is any where in the Gospels applied to Mary, it should be known that the translator has there used 'mulier' for 'femina;' as in that, Woman, behold thy son! (John 19:26)", "lang": "english", "orig": "", "d": "c. 840"}, {"v": 11, "f": "Tertullian", "w": "", "t": "From which fact is gathered an additional suggestion, that, since the opposers of the Lord refused to be baptized, they who followed the Lord were baptized, and were not like-minded with their own rivals: especially when, if there were any one to whom they clave, the Lord had exalted John above him (by the testimony) saying,\" Among them who are born of women there is none greater than John the Baptist.\"", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 11, "f": "Theodore of Mopsuestia", "w": "", "t": "If John is being judged against other people according to being born from a woman, he will be found to be the greatest of them all. He alone was filled with the Holy Spirit inside his mother’s womb, so that he “leaped,” and his mother prophesied because she partook in this as well. But if John is judged in relation to those who are to partake of the Spirit in the kingdom of heaven, Jesus says, he will be found to be least. Thus Jesus says that John by no means partakes of such great grace as those who will be reborn into immortality after Jesus’ resurrection from the dead and that John will experience physical death. At that time, however, the Spirit’s abundance toward people will be so great that no one who has partaken of even the least part of it can afterward fall into death.", "lang": "english", "orig": "", "d": ""}, {"v": 11, "f": "Theophylact of Ohrid", "w": "", "t": "He declares this with certainty, that there is no one greater than John. But by saying \"born of women\" He excludes Himself, for Christ was born of a virgin, not of a woman, that is, one who is married. \"Notwithstanding, He that is younger is greater than he in the kingdom of heaven.\" Since He has extolled the praises of John, lest they think that John is greater than He says here more clearly, I am the younger in age and the lesser in your opinion, yet I am greater than he in the kingdom of heaven, that is, in regards to spiritual and heavenly good things. For here I appear less than he, both because his birth preceded Mine and because he appears great to you, but there in the kingdom of heaven I am greater.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 11, "f": "Thomas Aquinas", "w": "", "t": "Amen, I say to you. Above the Lord commended John on the authority of a prophet [Malachi]; now he intends to commend him in his own words and explains the prophet's text. He does three things: first, he commends him as to the difference of every order and state; secondly, as to the difference between the Law and the Gospel (v. 12); thirdly, as to the difference between the present age and the future (v. 14).\n\nFirst, he shows that he is outstanding among those on earth; secondly, he shows him lesser among the angels (v. 11b).\n\nHe says, therefore: it has been stated that John is an angel, and to put it briefly, I say to you, among those born of women there has arisen no one greater than John the Baptist. He was speaking in a proper sense, when he said, has arisen, because all are born children of wrath (Eph 2:3). Therefore, whoever can attain to the state of grace arises. Hence among those born of women. And he speaks precisely, in order that Christ be excluded from this generality, because \"woman\" suggests defilement, but \"female\", sex. Hence if son of woman is found anywhere, as in John (19:26): \"Woman, behold your son,\" in that case it denotes sex, not defilement. But how can he say, among those born of women there has arisen no one greater? Is he for this reason greater than all? Jerome says that it does not follow: If a greater has not arisen, therefore he is greater. But Chrysostom says that he is greater than all. Therefore, according to the first explanation, I say that", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 12, "f": "Augustine - Confessions", "w": "Chapter XV.", "t": "would reply with execration\n133 Luke xiv. 26.\n134 Matt xi. 12. Qui vim faciunt diripiunt illud; Vulgate, violenti rapiunt illud.\n135 Gal. iii. 28 and Col. iii. 11.\n136 Uxores ducent; Vulgate, nubentur.\n137 Matt. xxii. 30.\n138 1 Cor. xv. 53, 54.\n\n\nthat he is str", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 12, "f": "Chrysostom - Homilies on John", "w": "Homily XXXVIII.", "t": "tion in the\nHomily.—R.]\n1608 Matt. xi. 7–11.\n1609 Matt. xi. 12.\n1610 Matt. vi. 13.\n1611 Matt. vi. 14–19.\n1612 Matt. xi. 20–24.\n\n\nto these. As when Paul saith, “I thank God, that ye were servants of sin, but ye obeyed from\nthe heart the form of doctrine which was", "lang": "greek", "orig": "", "d": "347-407"}, {"v": 12, "f": "Desert Fathers", "w": "", "t": "A hermit was living in a cave in the Thebaid with one well-tested disciple. It was usual for him to teach the disciple during the evening and show him how the soul should progress, and after the address he used to pray and send him away to sleep. Some devout laymen who knew of the hermit’s ascetic life happened to visit him. He gave them counsel and they went away. Then he sat down after the evening prayers as usual to instruct the brother. But while he was talking, sleep overcame him. The brother waited for the hermit to wake and end with the usual prayer. But he went on sleeping and the brother went on sitting for a long time and in the end the disciple felt he must go and sleep though he was uneasy about it. So he pulled himself together, and resisted the temptation, and went back to sit by the hermit. A second time he was forced away by the longing for sleep, but he sat down again. This happened seven times, and still he went on resisting it. In the middle of the night the hermit woke up, and found him sitting nearby and said, ‘Haven’t you gone away yet?’ He said, ‘No, you did not send me away, abba.’ The hermit said, ‘Why did you not wake me up?’ He answered, ‘I did not dare to nudge you for fear of upsetting you.’ They both got up and began to say the morning prayers. After that the hermit sent his disciple away. When the hermit was sitting alone, he was shown a vision of a glorious place, with a throne in it, and on the throne seven crowns. He asked the angel who showe", "lang": "english", "orig": "", "d": ""}, {"v": 12, "f": "Eusebius - Church History", "w": "Chapter VIII.—The Conversation with Alypius Being Ended, He Retires to the\nGarden, Whither His Friend Follows Him.", "t": "with the\n662 Isa. xxvi. 20, and Matt. vi. 6.\n663 Matt. xi. 12.\n\n\nwill, and to will was to do, and yet was it not done; and more readily did the body obey the\nslightest wish of the soul in the moving its limbs at the order of the mind, than the soul\nobeyed itsel", "lang": "greek", "orig": "", "d": "260-340"}, {"v": 12, "f": "Glossa Ordinaria", "w": "", "t": "(non occ.) That what He had last said should not lead any to suppose that John was an alien from the kingdom of heaven, He corrects this by adding, From the days of John the Baptist until now, the kingdom of heaven suffereth violence, and the violent take it by force.", "lang": "english", "orig": "", "d": "c. 1150"}, {"v": 12, "f": "Gregory the Dialogist", "w": "", "t": "But because John admonishes us to great works, saying: \"Bring forth therefore fruits worthy of repentance.\" And again: \"He who has two tunics, let him give to him who has none; and he who has food, let him do likewise\"; now it is clearly given to understand what Truth means when it says: \"From the days of John the Baptist until now the kingdom of heaven suffers violence, and the violent seize it.\" These words of the heavenly pronouncement must be thoroughly examined by us. For it must be asked how the kingdom of heaven can suffer violence. For who inflicts violence upon heaven? And again it must be asked, if the kingdom of heaven can suffer violence, why it endured that same violence from the days of John the Baptist, and not also before. But since the law says: \"If anyone does this or that, let him die the death,\" it is clear to all who read that it struck all sinners with the punishment of its severity, but did not lead them back to life through repentance. But when John the Baptist, preceding the grace of the Redeemer, preaches repentance, so that the sinner who is dead from guilt may live through conversion, surely from the days of John the Baptist the kingdom of heaven suffers violence. But what is the kingdom of heaven, if not the place of the just? For the rewards of the heavenly homeland are owed only to the just, so that the humble, the chaste, the meek, and the merciful may arrive at the joys above. But when someone swollen with pride, or defiled by a sin of the fle", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 12, "f": "Gregory the Dialogist", "w": "", "t": "(Hom. in Ev. xx. 14.) By the kingdom of heaven is meant the heavenly throne, whither when sinners defiled with any evil deed return in penitence, and amend themselves, they enter as sinners into the place of another, and take by violence the kingdom of heaven.", "lang": "english", "orig": "", "d": "c. 590"}, {"v": 12, "f": "Hilary of Poitiers", "w": "", "t": "As the nature of things demands, the more powerful exert violence, and the weaker are those on whom violence is exerted. We need to consider what is being attacked and what is suffering violence.\n\nThe Lord had remarked upon the unbelief of the disciples of John. [Matt. 11:3] He had understood also the opinion of the crowd concerning John's pronouncement. [Matt. 16:14] For he realized the immense danger produced by the scandal of the cross to one’s faith. [Matt. 16:22-23] He commanded the apostles to go preferably to the lost sheep of Israel; [Matt. 10:6] it was necessary that they be established in the Kingdom and be preserved in the family, the line of Abraham, of Isaac, and of Jacob. Yet all this preaching [to Israel] brought about effect to publicans and sinners. [Matt. 9:11-13] It is from these that believers now come; from these now come apostles; from these now the Kingdom of heaven comes.\n\nJohn, however, was not believed by the people; the works of Christ did not win authority; the cross was going to become a scandal. Now prophecy is ceased; now the Law is fulfilled; now all preaching is concluded; now the spirit of Elijah is sent ahead in the voice of John. [Matt. 11:14] Christ is preached to some and acknowledged by others; he is born in some and loved by others. His own people spew him out, while strangers receive him; his closest [friends] attack him, while his enemies embrace him. Those who are adopted seek his heritage, while his family rejects him. The children ", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 12, "f": "Hilary of Poitiers", "w": "", "t": "Otherwise; The Lord bade His Apostles go to the lost sheep of Israel, but all their preaching conveyed profit to the publicans and sinners. Therefore the kingdom suffers violence, and the violent take it by force, for the glory of Israel, due to the Fathers, foretold by the Prophets, offered by Christ, is entered and held by force by the might of the Gentiles.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 12, "f": "Jerome", "w": "", "t": "(V.12) But from the days of John the Baptist until now the kingdom of heaven suffers violence, and the violent take it by force. For all the prophets and the law prophesied until John. And if you are willing to receive it, he is Elijah who is to come. He who has ears to hear, let him hear!", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 12, "f": "Jerome", "w": "", "t": "Because John the Baptist was the first who preached repentance to the people, saying, Repent ye, for the kingdom of heaven is at hand: rightly therefore from that day forth it may be said, that the kingdom of heaven suffereth violence, and the violent take it by force. For great indeed is the violence, when we who are born of earth, seek an abode in heaven, and obtain by excellence what we have not by nature.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 12, "f": "John Chrysostom", "w": "", "t": "\"And from the days of John the Baptist,\" saith He, \"until now, the kingdom of heaven suffereth violence, and the violent take it by force.\"\n\nAnd what sort of connexion may this have with what was said before? Much, assuredly, and in full accordance therewith. Yea, by this topic also He proceeds to urge and press them into the faith of Himself; and at the same time likewise, He is speaking in agreement with what had been before said by John. \"For if all things are fulfilled even down to John, I am He that should come.\"\n\n\"For all the prophets,\" saith He, \"and the law prophesied until John.\"\n\nFor the prophets would not have ceased, unless I were come. Expect therefore nothing further, neither wait for any one else. For that I am He is manifest both from the prophets ceasing, and from those that every day \"take by force\" the faith that is in me. For so manifest is it and certain, that many even take it by force. Why, who hath so taken it? tell me. All who approach it with earnestness of mind.", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 12, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "4. And from the days of John the Baptist, says He, until now, the kingdom of heaven suffers violence, and the violent take it by force.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 12, "f": "Tertullian", "w": "", "t": "Is it wonder if it knows how to extort the rains of heaven -(prayer) which was once able to procure its fires? Prayer is alone that which vanquishes God.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 12, "f": "Theophylact of Ohrid", "w": "", "t": "It would seem that this does not follow the train of thought, but it does. Consider this: Christ, by saying of Himself that He is greater than John, strongly urges them to believe in Him, showing that many are by force acquiring the kingdom of heaven, that is, faith in Him. And there is need of great force, for in order to leave father and mother and to despise one's own life, how much force is needed?", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 12, "f": "Thomas Aquinas", "w": "", "t": "From the days of John the Baptist until now... Here he is commended on the basis of the distinction between the Old Testament and the New Testament, so that John's excellence is marked by the fact that he is the beginning of the New Testament and the end of the Old Testament. Thus he said: \"He that is least in the kingdom of heaven is greater than he,\" which refers to the fact that he is the beginning of the New Testament; but from the days of John the Baptist, i.e., of his preaching, the kingdom of heaven suffers violence.\n\nThis is explained in three ways.\n\nFirst, it is known that in cases of ravishment there is violence and a struggle. Hence it is required that a sinner, if he is able to reach the kingdom of heaven, must climb to spiritual things and struggle a great deal.\nIt is explained in another way. It is known that rapine, properly speaking, means that something is taken by force contrary to the will of the owner. The preaching of salvation was made to the Jews and then to everyone through Christ: \"I have not been sent except to the lost sheep of the house of Israel\" (Mt 15:24). And although he was sent to them, they did not receive him; yet those to whom he was not sent seized it. Hence he says above: \"Many shall come from the east and from the west, and shall recline with Abraham, Isaac and Jacob in the kingdom of heaven; but the children of the kingdom will be cast into the outer darkness\" (Mt 8:12). And below (21:43): \"The kingdom of heaven will be taken from you ", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 13, "f": "Jerome", "w": "", "t": "This should not exclude the prophets who came after John the Baptist, for we read in the Acts of the Apostles that Agabus and Philip’s four young unmarried daughters uttered prophecies. But insofar as the law and prophets of the Scriptures looked toward the future, they prophesied about our Lord. So when it is written, “All the prophets and the law up to the time of John have prophesied,” the time of Christ is made known as those previous voices had said it would come. Then John showed he had come.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 13, "f": "Jerome", "w": "", "t": "(Verse 13) For all the prophets and the Law prophesied until John. Not that they exclude the prophets after John. For we read in the Acts of the Apostles (Acts 11:21) that Agabus and the four virgin daughters of Philip prophesied. But what the Law and the prophets, whose writings we read, prophesied, they prophesied about the Lord. Therefore, when it is said, 'All the prophets and the Law prophesied until John,' it indicates the time of Christ, so that John, who they said would come, would show that he has come.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 13, "f": "Jerome", "w": "", "t": "Not that He cuts off all Prophets after John; for we read in the Acts of the Apostles that Agabus prophesied, and also four virgins daughters of Philip; but He means that the Law and the Prophets whom we have written, whatever they have prophesied, they have prophesied of the Lord. That He says, Prophesied until John, shows that this was now the time of Christ's coming; and that whom they had foretold should come, Him John showed to be already come.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 13, "f": "Origen of Alexandria", "w": "", "t": "“The days of John” and of Jesus are understood not in reference to time but in reference to the state of the soul of the hearer of the divine Scripture. And the word now marks out clearly the days of Jesus, which the psalm points to in this way: “In his days righteousness shall arise, and there will be an abundance of peace till the time when he is taken away.” One who has been previously taught comes to the beginning of Jesus’ discourses and still makes progress in introductory things by way of that road that appears to be rugged and steep. One thereby “takes by force” the kingdom of heaven, which “suffers violence.” The expression “suffers violence” is not to be taken in an active sense but a passive, as if to say “it has been taken.” But if the perfect Word, when he receives someone who was awaiting freedom under the law and prophetic schoolmasters and housekeepers, bestows on such a one his father’s inheritance freely, then fittingly it is said that “all the prophets and the law prophesied until John.”", "lang": "english", "orig": "", "d": "c. 230"}, {"v": 13, "f": "Tertullian", "w": "", "t": "In short, if this is not so, let the Jews exhibit, subsequently to Christ, any volumes of prophets, visible miracles wrought by any angels, (such as those) which in bygone days the patriarchs saw until the advent of Christ, who is now come; since which event \"sealed is vision and prophecy,\" that is, confirmed. And justly does the evangelist write, \"The law and the prophets (were) until John\" the Baptist.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 13, "f": "Tertullian", "w": "", "t": "And thus, the former gifts of grace being withdrawn, \"the law and the prophets were until John,\" and the fishpool of Bethsaida until the advent of Christ: thereafter it ceased curatively to remove from Israel infirmities of health; since, as the result of their perseverance in their frenzy, the name of the Lord was through them blasphemed, as it is written: \"On your account the name of God is blasphemed among the Gentiles: \" for it is from them that the infamy (attached to that name) began, and (was propagated during) the interval from Tiberius to Vespasian.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 13, "f": "Tertullian", "w": "", "t": "Yet I must necessarily prescribe you a law, not to stretch out your hand after the old things, not to look backwards: for \"the old things are passed away,\" according to Isaiah; and \"a renewing hath been renewed,\" according to Jeremiah; and \"forgetful of former things, we are reaching forward,\" according to the apostle; and \"the law and the prophets (were) until John,\" according to the Lord.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 13, "f": "Tertullian", "w": "", "t": "At all events, in the Gospel they think that those days were definitely appointed for fasts in which \"the Bridegroom was taken away; \" and that these are now the only legitimate days for Christian fasts, the legal and prophetical antiquities having been abolished: for wherever it suits their wishes, they recognise what is the meaning of\" the Law and the prophets until John.\" Accordingly, (they think) that, with regard to the future, fasting was to be indifferently observed, by the New Discipline, of choice, not of command, according to the times and needs of each individual: that this, withal, had been the observance of the apostles, imposing (as they did) no other yoke of definite fasts to be observed by all generally, nor similarly of Stations either, which (they think) have withal days of their own (the fourth and sixth days of the week), but yet take a wide range according to individual judgment, neither subject to the law of a given precept, nor (to be protracted) beyond the last hour of the day, since even prayers the ninth hour generally concludes, after Peter's example, which is recorded in the Acts.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 13, "f": "Theodoret - Church History", "w": "Chapter 17.—How the Holy Spirit is Called Love, and Whether He Alone is So\nCalled. That the Holy Spirit is in the Scriptures Properly Called by the Name of\nLove.", "t": "as to be\n1002 John xv. 25\n1003 Ps. xxxv. 19\n1004 Matt. xi. 13\n1005 Matt. xxii. 40\n1006 Luke xxiv. 44\n1007 1 Cor. i. 24\n\n\nof God, is either the Son or the Holy Spirit. But when, in what follows, the apostle had\nmentioned the love of God, not that by which we lov", "lang": "greek", "orig": "", "d": "393-457"}, {"v": 13, "f": "Theophylact of Ohrid", "w": "", "t": "This, too, follows the same train of thought. For He is saying, I am He that cometh, for all the prophets have been fulfilled. They would not have been fulfilled if I had not come. Therefore, await nothing further.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 13, "f": "Thomas Aquinas", "w": "", "t": "Hence Christ says: For all the prophets and the Law prophesied until John, because all the prophets were for the sake of Christ and began to be fulfilled from the time of John's preaching. Hence Luke (24:44): \"Everything written about me must be fulfilled.\" And this until John. Does this mean that there were no prophets after John? Do we not read below (23:34): \"Behold, I sent you prophets, wise men and scribes\"? The answer is that a prophet is sent for two purposes: to strengthen faith and to correct morals: \"Where there is no prophecy the people cast off restraint\" (Pr 29:18). To strengthen faith, as it says in 1 Peter (1:10): \"The prophets who prophesied of the grace that was to be yours searched and inquired about this salvation; they inquired what person or time was indicated by the Spirit of Christ within them.\" Hence prophecy served those two things: faith has now been established, because Christ's promises have been accomplished. But for the correction of morals, prophecy has never ceased nor will ever cease. Therefore John is outstanding, because he is between the Old and the New Law; hence he was sent before his face, as though at the same time as Christ.", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 14, "f": "Apollinaris of Laodicea", "w": "", "t": "He called John Elijah because of Elijah’s power and spirit. And since this statement of Jesus was obscure, he left the understanding of it for those capable of perceiving its meaning. But the angel Gabriel also said this about John: “And he shall go before him in the spirit and power of Elijah,” showing that he was the same as Elijah, even if, as a visible human being, he was other than Elijah.", "lang": "english", "orig": "", "d": ""}, {"v": 14, "f": "Jerome", "w": "", "t": "So John the Baptist is called Elijah, not in accordance with foolish philosophers and certain heretics who introduce the topic of metempsychosis (transmigration of souls)  but because, according to other evidence of the gospel, he came in the spirit and goodness of Elijah and had either the same grace or power of the Holy Spirit. The austerity of their life and firm resolve were equally strong in Elijah and in John. Both lived in the desert. The former girded himself with a belt of skins, and the latter had a similar belt. The former was forced to flee because he accused Ahab and Jezebel of the sin of impiety in their lives. John was beheaded because he accused Herod and Herodias of unlawful marriage. There are those who think therefore that John is called Elijah because, just as Elijah would lead the way in the second coming of our Savior (according to Malachi) and would announce that the Judge was coming, so John acted at the first coming and because each was a messenger either of the first or second coming of our Lord.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 14, "f": "Jerome", "w": "", "t": "John then is said to be Elias, not according to the foolish philosophers, and certain heretics who bring forward their metempsychosis, or passing of the soul from one body to another; but because (as it is in another passage of the Gospel) he came in the spirit and power of Elias, and had the same grace and measure of the Holy Spirit. But in austerity of life, and fortitude of spirit, Elias and John were alike; they both dwelt in the desert, both were girded with a girdle of skins; because he reproved Ahab and Jezebel for their wickedness, Elias was compelled to fly; because he condemned the unlawful union of Herod and Herodias, John is beheaded.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 14, "f": "Jerome", "w": "", "t": "(Verse 14, 15.) And if you want to receive it, he is Elijah who is to come. He who has ears to hear, let him hear. This which was said, if you want to receive it, he is Elijah, signifies a mystical understanding and requires intelligence, as the following words of the Lord demonstrate, saying: He who has ears to hear, let him hear. For if the meaning were clear and the sentiment evident, why would it be necessary for us to be prepared for its understanding? Therefore, John is called Elijah, not according to foolish philosophers and certain heretics, who introduce reincarnation, but because, as another testimony of the Gospel states, he came in the spirit and power of Elijah, he had the same grace or measure of the Holy Spirit. But the austerity of life and the firmness of mind of Elijah and John are equal. For Elijah lived in the desert, and so did John: Elijah wore a leather belt, and so did John. Elijah, because he accused King Ahab and Jezebel of impiety, was forced to flee (3 Kings 19); John, because he accused Herod and Herodias of unlawful marriage, was beheaded. There are those who think that John is called Elijah because just as Elijah is said to precede the second coming of the Savior according to Malachi, and announce the coming Judge, so did John in the first coming; and both are messengers of either the first coming of the Lord, or the second.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 14, "f": "Jerome", "w": "", "t": "That He says, This is Elias, is figurative, and needs to be explained, as what follows, shews; He that hath ears to hear, let him hear.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 14, "f": "John Chrysostom", "w": "", "t": "Then He states also another infallible sign, saying, \"If ye will receive it, he is Elias, which was for to come.\" For \"I will send you,\" it is said, \"Elias the Tishbite, who shall turn the heart of the father to the children.\" This man then is Elias, if ye attend exactly, saith He. For \"I will send,\" saith He, \"my messenger before Thy face.\"\n\nAnd well hath He said, \"If ye will receive it,\" to show the absence of force. For I do not constrain, saith He. And this He said, as requiring a candid mind, and showing that John is Elias, and Elias John. For both of them received one ministry, and both of them became forerunners. Wherefore neither did He simply say, \"This is Elias,\" but, \"If ye are willing to receive it, this is he,\" that is, if with a candid mind ye give heed to what is going on. And He did not stop even at this, but to the words, \"This is Elias, which was for to come,\" He added, to show that understanding is needed, \"He that hath ears to hear, let him hear.\"\n\nNow He used so many dark sayings, to stir them up to inquiry. And if not even so were they awakened, much more, had all been plain and clear. For this surely no man could say, that they dared not ask Him, and that He was difficult of approach. For they that were asking him questions, and tempting Him about common matters, and whose mouths were stopped a thousand times, yet they did not withdraw from Him; how should they but have inquired of Him, and besought Him touching the indispensable things, had they indeed", "lang": "english", "orig": "", "d": "c. 390"}, {"v": 14, "f": "Remigius of Rheims", "w": "", "t": "As much as to say, Whoso has ears of the heart to hear, that is, to understand, let him understand; for He did not say that John was Elias in person, but in the Spirit.", "lang": "english", "orig": "", "d": "c. 900"}, {"v": 14, "f": "Tertullian", "w": "", "t": "I apprehend that heretics of this school seize with especial avidity the example of Elias, whom they assume to have been so reproduced in John (the Baptist) as to make our Lord's statement sponsor for their theory of transmigration, when He said, \"Elias is come already, and they knew him not; \" and again, in another passage, \"And if ye will receive it, this is Elias, which was for to come.\" Well, then, was it really in a Pythagorean sense that the Jews approached John with the inquiry, \"Art thou Elias? \" and not rather in the sense of the divine prediction, \"Behold, I will send you Elijah\" the Tisbite? The fact, however, is, that their metempsychosis, or transmigration theory, signifies the recall of the soul which had died long before, and its return to some other body.", "lang": "english", "orig": "", "d": "c. 200"}, {"v": 14, "f": "Theodore of Mopsuestia", "w": "", "t": "Jesus is in effect saying: Just as Elijah will come toward the end of this present age preaching about my imminent appearance from heaven, in the same way this one has spread the good news of my coming, bringing an end to the old things. My coming is something new, a type of the state of things that is about to occur.", "lang": "english", "orig": "", "d": ""}, {"v": 14, "f": "Theophylact of Ohrid", "w": "", "t": "If you are willing, He says, to accept it, that is, if you judge the matter with a good disposition of mind, and not spitefully, he is the one whom the prophet Malachi called Elijah who was to come (Malachi 4:5. \"And, behold, I will send to you Elijah the Tishbite before the great and glorious day of the Lord comes\"). For both the Forerunner and Elijah have the same ministry. The one was the Forerunner of the first coming, while Elijah will be the forerunner of the second coming. Then, showing that it is an enigma that John is Elijah, and requires wisdom to understand it, He says:", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 14, "f": "Thomas Aquinas", "w": "", "t": "And if you are willing to accept it, he is Elijah who is to come. Here he shows John's greatness as far as the distinction between present and future is concerned. For Elijah was the Lord's precursor; hence Malachi (4:5): \"Behold, I will send you Elijah, the prophet...,\" and John is Elijah. But what is the Lord saying? For when John was asked if he was Elijah, he said that he was not. But this refutes a heresy which posited transmigration of souls, namely, that the soul went from one body and entered another body; therefore Elijah's soul had entered John, so they said. But this opinion is false, because he denied that he was Elijah. But Christ said that John was Elijah on account of three similarities: first, because, as one angel is said to be similar to another angel, because they are equal in office, so Elijah and John were equal in office, because both were precursors: \"He will go before the face of the Lord to prepare his ways\" (Lk 1:76). Also as to manner of life, because he led an austere life (1 Kg 19:6). Again, as to persecution, because as he was persecuted by Jezebel, so John by Herod. Hence if you are willing to accept it in the sense in which it should be taken, he is Elijah.", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 15, "f": "Augustine - Trinity", "w": "Psalm XLIX.1606", "t": "I. [From a sermon preached before a bishop.]\n1607 Matt. xi. 15.\n1608 On Ps. viii.\n\n\npertain to Adam, are “earthborn:” whosoever pertain to Christ, are “sons of men.” Nevertheless,\nlet all hear, I withhold my discourse from no one. If one is “earthborn,” let him", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 15, "f": "Hippolytus", "w": "IV.", "t": "You know indeed quite well, that words of that form are used as conveying by implication\na rebuke to those who study the prophecies about Christ, and talk righteousness with the\nmouth, while they do not admit His coming, nor listen to His voice when He calls to them,\nand says, “He that hath ears to hear let him hear;” who have made themselves like the serpent\nand have made their ears like those of a deaf viper, and so forth. God then does, in truth,\ntake care of the righteous, and judges their cause when injured on the earth; and He punishes\nthose who dare to injure them.", "lang": "greek", "orig": "", "d": "170-258"}, {"v": 15, "f": "Irenaeus", "w": "CHAP. I.—ON FAITH.", "t": "tion.2102 To those, therefore, who desire to\n2097 Matt. xi. 15.\n2098 Odyss., vi. 185.\n2099 Teacher and scholar.\n2100 Rom. i. 11, 12.\n2101 Rom. i. 17.\n2102 [“The common faith” (ἡ κοινὴ πίστις) is no “secret,”", "lang": "greek", "orig": "", "d": "130-200"}, {"v": 15, "f": "Irenaeus", "w": "CHAP. I.—ON FAITH.", "t": "We, then, are those who are believers in what is not believed, and who are Gnostics as\nto what is unknown; that is, Gnostics as to what is unknown and disbelieved by all, but believed\nand known by a few; and Gnostics, not describing actions by speech, but Gnostics in\nthe exercise of contemplation. Happy is he who speaks in the ears of the hearing. Now faith\nis the ear of the soul. And such the Lord intimates faith to be, when He says, “He that hath\nears to hear, let him hear;”2097 so that by believing he may comprehend what He says, as\nHe says it. Homer, too, the oldest of the poets, using the word “hear” instead of “perceive”—\nthe specific for the generic term—writes:—\n\n“Him most they heard.”2098\n\nFor, in fine, the agreement and harmony of the faith of both2099 contribute to one\nend—salvation. We have in the apostle an unerring witness: “For I desire to see you, that I\nmay impart unto you some spiritual gift, in order that ye may be strengthened; that is, that\nI may be comforted in you, by the mutual faith of you and me.”2100 And further on again\nhe adds, “The righteousness of God is revealed from faith to faith.”2101 The apostle, then,\nmanifestly announces a twofold faith, or rather one which admits of growth and perfection;\nfor the common faith lies beneath as a foundation.2102 To those, therefore, who desire to\n2097 Matt. xi. 15.\n2098 Odyss., vi. 185.\n2099 Teacher and scholar.\n2100 Rom. i. 11, 12.\n2101 Rom. i. 17.\n2102 [“The common faith” (ἡ κοινὴ πίστις) is no “secret,” ", "lang": "greek", "orig": "", "d": "130-200"}, {"v": 15, "f": "Thomas Aquinas", "w": "", "t": "And so that they might understand that he was speaking in a mystical way, he adds, he who has ears to hear, let him hear, i.e., he that has ears spiritually, let him hear and understand.", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 16, "f": "Glossa Ordinaria", "w": "", "t": "(ap. Anselm.) By this generation He means the Jews together with Himself and John. As though He had said; John is thus great; but ye would believe neither him nor Me, and therefore to whom shall I liken you?", "lang": "english", "orig": "", "d": "c. 1150"}, {"v": 16, "f": "Hilary of Poitiers", "w": "", "t": "The whole of this speech is a reproach of unbelief, and arises out of the foregoing complaint; that the stiff-necked people had not learned by two different modes of teaching.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 16, "f": "Hilary of Poitiers", "w": "", "t": "By the children are meant the Prophets, who preached as children in singleness of meaning, and in the midst of the synagogue, that is in the market-place, reprove them, that when they played to those to whom they had devoted the service of their body, they had not obeyed their words, as the movement of the dancers are regulated by the measures of the music. For the Prophets invited them to make confession by song to God, as it is contained in the song of Moses, of Isaiah, or of David.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 16, "f": "Irenaeus", "w": "CHAPTER V.—ALL WHO WALK ACCORDING TO TRUTH ARE CHILDREN OF GOD.", "t": "usly to the Father alone; not such horses “as\n210 Matt. xi. 16, 17. [In the Peshitoi-Syraic version, where are probably found the very words our Saviour\nthus quotes from children in Nazareth, this saying is seen to be metrical and alliterative.]\n211 Ps. cxiii. 1", "lang": "greek", "orig": "", "d": "130-200"}, {"v": 16, "f": "Jerome", "w": "", "t": "The comparison of children sitting in the marketplace, shouting and saying to their peers, “We sang for you and you did not dance, we lamented and you did not mourn” is made with that generation of Jews in mind. Recall the Scripture that says, “To what will I compare this generation? It is like the children sitting in the marketplace,” and the rest. We are not offered a complete understanding or a shared interpretation of allegory. But whatever we say about children should be related to their comparison with “this generation.” Those children who are sitting in the marketplace are the ones of whom the prophet Isaiah speaks: “Behold, I and my children, whom God has given me.” And also the psalm: “The testimony of God is faithful, giving wisdom to children.” And elsewhere: “Out of the mouth of babies and sucklings you have achieved glory.” So those children sat in the marketplace or in the agora, which is described in Greek more plainly as where there are many items for sale. Because the Jews did not want to listen, the children not only spoke but shouted to them, at the top of their voices: “We sang to you, and you did not dance.” We challenged you to do good deeds at the sound of our song and to dance to our flute, just as David danced before the ark of the Lord, and you did not want to. “We lamented” and we challenged you to seek repentance, and you did not want to do even this, rejecting both proclamations, which were an exhortation as much to goodness as to repentance after", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 16, "f": "Jerome", "w": "", "t": "(Verse 16 onwards) But to whom shall I compare this generation? It is like children sitting in the marketplace and calling to their playmates, 'We played the flute for you, and you did not dance; we sang a dirge, and you did not mourn.' For John came neither eating nor drinking, and they say, 'He has a demon.' The Son of Man came eating and drinking, and they say, 'Look, a glutton and a drunkard, a friend of tax collectors and sinners.' And wisdom is justified by her children. To the boys sitting in the marketplace and shouting and saying to their companions: We sang to you, and you did not dance; we mourned, and you did not weep. The generation of the Jews is compared, the Scripture saying: To what shall I compare this generation? It is like the boys sitting in the marketplace, and so on. Therefore, not to us is attributed free intelligence, and the passive interpretation of allegories: but whatever we are going to say about the boys, it must be referred to the likeness of the generation. You are the children who sit in the forum, of whom Isaiah speaks: Behold, I and the children whom God has given me (Isa. VIII, 18). And in the 18th psalm (Verse 8): The testimony of the Lord is faithful, providing wisdom to the little ones. And elsewhere: Out of the mouths of infants and nursing babies you have prepared praise (Ps. VIII, 3). Therefore, these children sat in the forum, or ἐν ἀγορᾷ as it is more significantly expressed in Greek, where many things are for sale. And because the", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 16, "f": "Jerome", "w": "", "t": "The children are they of whom Isaiah speaks, Behold I, and the children whom the Lord has given me. (Is. 8:18) These children then sit in the market-place, where are many things for sale, and say,", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 16, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "5. But whereunto shall I liken this generation? says He, It is like children sitting in the market place, and saying, We have piped unto you, and you have not danced; we have mourned unto you, and you have not lamented.  This again seems to be unconnected with what came before, but it is the most natural consequence thereof. Yea, He still keeps to the same point, the showing that John is acting in harmony with Himself, although the results were opposite; as indeed with respect to his inquiry also. And He implies that there was nothing that ought to have been done for their salvation, and was omitted; which thing the prophet says of the vineyard; What ought I to have done to this vineyard, and have not done it? For whereunto, says He, shall I liken this generation? It is like children sitting in the market, and saying, We have piped unto you, and you have not danced, we have mourned unto you, and you have not lamented. For John came neither eating nor drinking, and they say, He has a devil.  The Son of Man came eating and drinking, and they say, Behold a man gluttonous, and a winebibber, a friend of publicans and sinners.", "lang": "", "orig": "", "d": "c. 388"}, {"v": 16, "f": "Remigius of Rheims", "w": "", "t": "As much as to say, Whoso has ears of the heart to hear, that is, to understand, let him understand; for He did not say that John was Elias in person, but in the Spirit.\n\nAnd straightway He answers Himself, saying, It is like unto children sitting in the market-place, crying unto their fellows, and saying, We have played music to you, and ye have not danced; we have mourned, and ye have not lamented.\n\nWhat is that He says, To their fellows? Were the unbelieving Jews then fellows of the Prophets? He speaks thus only because they were sprung of one stock.", "lang": "english", "orig": "", "d": "c. 900"}, {"v": 16, "f": "Theophylact of Ohrid", "w": "", "t": "It is the malcontent nature of the Jews that He is speaking of here. For as they were cantankerous, neither John's asceticism nor Christ's simplicity pleased them. They were like foolish little children who are never satisfied - whether one cries for them or plays the pipe for them, they are not pleased.", "lang": "english", "orig": "", "d": "c. 1090"}, {"v": 16, "f": "Thomas Aquinas", "w": "", "t": "But to what shall I compare this generation? Here he breaks forth into rebuking the crowd: first, he places a question; secondly, a likeness; thirdly, he explains.\n\nHe proceeds, therefore, in this manner: John is compared to Elijah by reason of his office, but to what shall I compare this generation? Why does he say this here? Because as a person who has done all he could for someone and he is ungrateful does not know to what he should be compared, so the Lord had done all kinds of favors for this generation; hence Isaiah (5:4): \"What more ought I have done for my vineyard, and have not done it?\" To what, therefore, can I compare such malice?\n\nIt should be noted that in Scripture a generation sometimes is taken for a group of good people, sometimes of wicked, sometimes of both. For a group of good people, Psalm (112:2): \"the generation of the just will be blessed\"; for a group of wicked people, Matthew (12:39): \"An evil and adulterous generation...\"; for both, Ecclesiastes (1:4): \"A generation goes and a generation comes, but the earth remains forever.\"\n\nIt is like children sitting in the market place... Here he presents a comparison which can be explained according to the literal sense or the mystical. First, he makes a comparison with boys; secondly, he adapts it (v. 18).\n\nIt should be noted that it is natural for man to seek pleasures and always to seek them; and unless he is withdrawn by anxieties, he immediately rushes into evil pleasures. But children do not have anxiet", "lang": "english", "orig": "", "d": "c. 1270"}, {"v": 17, "f": "Augustine - Trinity", "w": "Psalm CXXIX.5546", "t": ".\n5547 Luke xix. 2–9.\n5548 Mark xii. 42, 44.\n5549 Matt. xi. 17.\n5550 Gen. iv. 8.\n5551 Gen. v. 24.\n5552 Gen. vi.–viii.\n5553 Gen. xiii.–xx.\n5554 Ps. xl. 5. [Heb. iv. 2.—C.]\n\n\nreason, lest the Church wonder now, or lest any o", "lang": "latin", "orig": "", "d": "354-430"}, {"v": 17, "f": "Cyril of Alexandria", "w": "", "t": "When some children are dancing and others are singing a dirge, their purpose does not agree. Both sides find fault with their friends for not being in harmony with them. So the Jews underwent such an experience when they accepted neither the gloominess of John the Baptist nor the freedom of Christ. They did not receive help one way or another. It was fitting for John as a lowly servant to deaden the passions of the body through very hardy training, and for Christ by the power of his Godhead freely to mortify the sensations of the body and the innate practice of the flesh, and to do so without reliance on strenuous ascetic labors. Nevertheless John, “while he was preaching the baptism of repentance,” offered himself as a model for those who were obliged to lament, whereas the Lord “who was preaching the kingdom of heaven” similarly displayed radiant freedom in himself. In this way Jesus outlined for the faithful indescribable joy and an untroubled life. The sweetness of the kingdom of heaven is like a flute. The pain of Gehenna is like a dirge.", "lang": "english", "orig": "", "d": "c. 430"}, {"v": 17, "f": "Hilary of Poitiers", "w": "", "t": "By the children are meant the Prophets, who preached as children in singleness of meaning, and in the midst of the synagogue, that is in the market-place, reprove them, that when they played to those to whom they had devoted the service of their body, they had not obeyed their words, as the movement of the dancers are regulated by the measures of the music. For the Prophets invited them to make confession by song to God, as it is contained in the song of Moses, of Isaiah, or of David.", "lang": "english", "orig": "", "d": "c. 360"}, {"v": 17, "f": "Jerome", "w": "", "t": "They say therefore, We have flayed music to you, and ye have not danced; i. e. We have called on you to work good works to our songs, and ye would not. We have lamented and called you to repentance, and this ye would not, rejecting both preaching, as well of exhortation to virtue, as of repentance for sin.", "lang": "english", "orig": "", "d": "c. 400"}, {"v": 17, "f": "John Chrysostom", "w": "", "t": "\"But whereunto shall I liken this generation?\" saith He, \"It is like unto children sitting in the market place, and saying, We have piped unto you, and ye have not danced; we have mourned unto you, and ye have not lamented.\" This again seems to be unconnected with what came before, but it is the most natural consequence thereof. Yea, He still keeps to the same point, the showing that John is acting in harmony with Himself,

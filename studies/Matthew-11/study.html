ng:8px;border:1px solid #ddd\">Biblioteca Apostólica Vaticana, Roma<\/td><\/tr>\n<tr style=\"\"><td style=\"padding:8px;border:1px solid #ddd;font-weight:bold;font-size:1.1rem\"><a href=\"https://www.google.com/search?q=ℵ+Codex+Sinaiticus+(Aleph/01)\" target=\"_blank\" style=\"color:#1565c0;text-decoration:none\">ℵ<\/a><\/td><td style=\"padding:8px;border:1px solid #ddd\">Codex Sinaiticus (Aleph/01)<\/td><td style=\"padding:8px;border:1px solid #ddd\">c. 330-360<\/td><td style=\"padding:8px;border:1px solid #ddd\">Cesarea o Egipto<\/td><td style=\"padding:8px;border:1px solid #ddd\">Alejandrino<\/td><td style=\"padding:8px;border:1px solid #ddd\">British Library, Londres<\/td><\/tr>\n<tr style=\"background:#e8f5e9;\"><td style=\"padding:8px;border:1px solid #ddd;font-weight:bold;font-size:1.1rem\"><a href=\"https://www.google.com/search?q=D+Codex+Bezae+(05)\" target=\"_blank\" style=\"color:#1565c0;text-decoration:none\">D<\/a><\/td><td style=\"padding:8px;border:1px solid #ddd\">Codex Bezae (05)<\/td><td style=\"padding:8px;border:1px solid #ddd\">c. 400<\/td><td style=\"padding:8px;border:1px solid #ddd\">Sur de Francia o Norte de África<\/td><td style=\"padding:8px;border:1px solid #ddd\">Occidental<\/td><td style=\"padding:8px;border:1px solid #ddd\">Cambridge University Library<\/td><\/tr>\n<tr style=\"background:#e8f5e9;\"><td style=\"padding:8px;border:1px solid #ddd;font-weight:bold;font-size:1.1rem\"><a href=\"https://www.google.com/search?q=A+Codex+Alexandrinus+(02)\" target=\"_blank\" style=\"color:#1565c0;text-decoration:none\">A<\/a><\/td><td style=\"padding:8px;border:1px solid #ddd\">Codex Alexandrinus (02)<\/td><td style=\"padding:8px;border:1px solid #ddd\">c. 400-440<\/td><td style=\"padding:8px;border:1px solid #ddd\">Egipto o Constantinopla<\/td><td style=\"padding:8px;border:1px solid #ddd\">Bizantino (Evangelios), Alejandrino (resto)<\/td><td style=\"padding:8px;border:1px solid #ddd\">British Library, Londres<\/td><\/tr>\n<tr style=\"background:#e8f5e9;\"><td style=\"padding:8px;border:1px solid #ddd;font-weight:bold;font-size:1.1rem\"><a href=\"https://www.google.com/search?q=W+Codex+Washingtonianus+(032)\" target=\"_blank\" style=\"color:#1565c0;text-decoration:none\">W<\/a><\/td><td style=\"padding:8px;border:1px solid #ddd\">Codex Washingtonianus (032)<\/td><td style=\"padding:8px;border:1px solid #ddd\">c. 400-450<\/td><td style=\"padding:8px;border:1px solid #ddd\">Egipto<\/td><td style=\"padding:8px;border:1px solid #ddd\">Mixto (varía por sección)<\/td><td style=\"padding:8px;border:1px solid #ddd\">Smithsonian Institution, Washington D.C.<\/td><\/tr>\n<tr style=\"background:#e8f5e9;\"><td style=\"padding:8px;border:1px solid #ddd;font-weight:bold;font-size:1.1rem\"><a href=\"https://www.google.com/search?q=C+Codex+Ephraemi+Rescriptus+(04)\" target=\"_blank\" style=\"color:#1565c0;text-decoration:none\">C<\/a><\/td><td style=\"padding:8px;border:1px solid #ddd\">Codex Ephraemi Rescriptus (04)<\/td><td style=\"padding:8px;border:1px solid #ddd\">c. 450<\/td><td style=\"padding:8px;border:1px solid #ddd\">Egipto<\/td><td style=\"padding:8px;border:1px solid #ddd\">Mixto<\/td><td style=\"padding:8px;border:1px solid #ddd\">Bibliothèque nationale de France, París<\/td><\/tr>\n<tr style=\"\"><td style=\"padding:8px;border:1px solid #ddd;font-weight:bold;font-size:1.1rem\"><a href=\"https://www.google.com/search?q=TR+Textus+Receptus\" target=\"_blank\" style=\"color:#1565c0;text-decoration:none\">TR<\/a><\/td><td style=\"padding:8px;border:1px solid #ddd\">Textus Receptus<\/td><td style=\"padding:8px;border:1px solid #ddd\">1516-1633<\/td><td style=\"padding:8px;border:1px solid #ddd\">Basilea, Suiza<\/td><td style=\"padding:8px;border:1px solid #ddd\">Bizantino tardío<\/td><td style=\"padding:8px;border:1px solid #ddd\">Múltiples ediciones<\/td><\/tr>\n<\/table><\/div>\n<div id=\"mss-details\">\n<div style=\"margin-bottom:0.5rem;border-left:2px solid #2e7d32;border-radius:8px;background:#fafafa\"><div style=\"padding:0.6rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center\" onclick=\"document.getElementById('msd0').classList.toggle('collapsed')\"><span><a href=\"https://www.google.com/search?q=P75+Papiro+75+(Bodmer+XIV-XV)\" target=\"_blank\" style=\"font-size:1.1rem;font-weight:bold;color:#1565c0;text-decoration:none\" onclick=\"event.stopPropagation()\">P75<\/a> — <strong>Papiro 75 (Bodmer XIV-XV)<\/strong> (c. 175-225)<\/span><span style=\"font-size:0.65rem;color:#888\">▼<\/span><\/div><div id=\"msd0\" class=\"collapsed\" style=\"padding:0 1rem 0.8rem\"><span style=\"font-size:0.85rem;color:#555\">El papiro más cercano al Codex Vaticanus (B). Demuestra que el texto alejandrino NO es una revisión tardía sino que existía ya en el s.II. Escriba muy cuidadoso.<\/span><br><span style=\"font-size:0.8rem\">📍 Origen: Egipto · Descubierto: Panópolis (Akhmim), Egipto (1952)<\/span><br><span style=\"font-size:0.8rem\">📦 Ubicación actual: Biblioteca Vaticana (donado 2007)<\/span><br><span style=\"font-size:0.8rem;color:#2e7d32;font-weight:600\">Tipo: Alejandrino<\/span> · <span style=\"font-size:0.8rem\">Contenido: Lucas 3-24 y Juan 1-15<\/span><br><span style=\"font-size:0.8rem\">⭐ Extremadamente confiable. Considerado el mejor testigo temprano del texto alejandrino. Su concordancia con B (s.IV) prueba la estabilidad de esta tradición textual.<\/span><\/div><\/div>\n<div style=\"margin-bottom:0.5rem;border-left:2px solid #2e7d32;border-radius:8px;background:#fafafa\"><div style=\"padding:0.6rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center\" onclick=\"document.getElementById('msd1').classList.toggle('collapsed')\"><span><a href=\"https://www.google.com/search?q=P46+Papiro+46+(Chester+Beatty+II)\" target=\"_blank\" style=\"font-size:1.1rem;font-weight:bold;color:#1565c0;text-decoration:none\" onclick=\"event.stopPropagation()\">P46<\/a> — <strong>Papiro 46 (Chester Beatty II)<\/strong> (c. 200)<\/span><span style=\"font-size:0.65rem;color:#888\">▼<\/span><\/div><div id=\"msd1\" class=\"collapsed\" style=\"padding:0 1rem 0.8rem\"><span style=\"font-size:0.85rem;color:#555\">El testimonio más antiguo de las cartas de Pablo. Incluye Hebreos entre Romanos y 1 Corintios, sugiriendo que se consideraba paulina. Faltan las Pastorales.<\/span><br><span style=\"font-size:0.8rem\">📍 Origen: Egipto · Descubierto: Fayum, Egipto (1930)<\/span><br><span style=\"font-size:0.8rem\">📦 Ubicación actual: Chester Beatty Library + Univ. Michigan<\/span><br><span style=\"font-size:0.8rem;color:#2e7d32;font-weight:600\">Tipo: Alejandrino<\/span> · <span style=\"font-size:0.8rem\">Contenido: Epístolas paulinas (Rom, Heb, 1-2 Cor, Ef, Gal, Fil, Col, 1 Tes)<\/span><br><span style=\"font-size:0.8rem\">⭐ Altamente confiable. Texto alejandrino temprano. Su antigüedad (c.200) lo hace crucial para reconstruir el texto original paulino.<\/span><\/div><\/div>\n<div style=\"margin-bottom:0.5rem;border-left:2px solid #555;border-radius:8px;background:#fafafa\"><div style=\"padding:0.6rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center\" onclick=\"document.getElementById('msd2').classList.toggle('collapsed')\"><span><a href=\"https://www.google.com/search?q=P66+Papiro+66+(Bodmer+II)\" target=\"_blank\" style=\"font-size:1.1rem;font-weight:bold;color:#1565c0;text-decoration:none\" onclick=\"event.stopPropagation()\">P66<\/a> — <strong>Papiro 66 (Bodmer II)<\/strong> (c. 200)<\/span><span style=\"font-size:0.65rem;color:#888\">▼<\/span><\/div><div id=\"msd2\" class=\"collapsed\" style=\"padding:0 1rem 0.8rem\"><span style=\"font-size:0.85rem;color:#555\">Uno de los testimonios más antiguos del Evangelio de Juan. Contiene correcciones del mismo escriba, mostrando el proceso de copia. Texto mixto entre alejandrino y occidental.<\/span><br><span style=\"font-size:0.8rem\">📍 Origen: Egipto · Descubierto: Panópolis (Akhmim), Egipto (1952)<\/span><br><span style=\"font-size:0.8rem\">📦 Ubicación actual: Fundación Bodmer, Cologny (Ginebra)<\/span><br><span style=\"font-size:0.8rem;color:#555;font-weight:600\">Tipo: Mixto (Alejandrino/Occidental)<\/span> · <span style=\"font-size:0.8rem\">Contenido: Evangelio de Juan (casi completo, 1:1-6:11, 6:35-14:26)<\/span><br><span style=\"font-size:0.8rem\">⭐ Muy confiable por antigüedad. Las autocorrecciones del escriba muestran cuidado textual. Confirma la existencia temprana del texto joánico.<\/span><\/div><\/div>\n<div style=\"margin-bottom:0.5rem;border-left:2px solid #555;border-radius:8px;background:#fafafa\"><div style=\"padding:0.6rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center\" onclick=\"document.getElementById('msd3').classList.toggle('collapsed')\"><span><a href=\"https://www.google.com/search?q=P45+Papiro+45+(Chester+Beatty+I)\" target=\"_blank\" style=\"font-size:1.1rem;font-weight:bold;color:#1565c0;text-decoration:none\" onclick=\"event.stopPropagation()\">P45<\/a> — <strong>Papiro 45 (Chester Beatty I)<\/strong> (c. 250)<\/span><span style=\"font-size:0.65rem;color:#888\">▼<\/span><\/div><div id=\"msd3\" class=\"collapsed\" style=\"padding:0 1rem 0.8rem\"><span style=\"font-size:0.85rem;color:#555\">Uno de los papiros más antiguos del NT. El escriba tiende a abreviar y parafrasear el texto. Contiene porciones de Mt, Mc, Lc, Jn y Hch.<\/span><br><span style=\"font-size:0.8rem\">📍 Origen: Egipto · Descubierto: Fayum, Egipto (1930)<\/span><br><span style=\"font-size:0.8rem\">📦 Ubicación actual: Chester Beatty Library, Dublín<\/span><br><span style=\"font-size:0.8rem;color:#555;font-weight:600\">Tipo: Mixto/Libre<\/span> · <span style=\"font-size:0.8rem\">Contenido: Fragmentos de los 4 Evangelios y Hechos<\/span><br><span style=\"font-size:0.8rem\">⭐ Texto libre/parafrastico. Valioso por antigüedad pero el escriba toma libertades. Importante para establecer que los 4 evangelios circulaban juntos en el s.III.<\/span><\/div><\/div>\n<div style=\"margin-bottom:0.5rem;border-left:4px solid #2e7d32;border-radius:8px;background:#fafafa\"><div style=\"padding:0.6rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center\" onclick=\"document.getElementById('msd4').classList.toggle('collapsed')\"><span><a href=\"https://www.google.com/search?q=B+Codex+Vaticanus+(03)\" target=\"_blank\" style=\"font-size:1.1rem;font-weight:bold;color:#1565c0;text-decoration:none\" onclick=\"event.stopPropagation()\">B<\/a> — <strong>Codex Vaticanus (03)<\/strong> (c. 325-350)<\/span><span style=\"font-size:0.65rem;color:#888\">▼<\/span><\/div><div id=\"msd4\" class=\"collapsed\" style=\"padding:0 1rem 0.8rem\"><span style=\"font-size:0.85rem;color:#555\">Considerado por muchos el manuscrito más importante del NT. Texto alejandrino puro y consistente. En la Biblioteca Vaticana desde al menos 1475 pero no fue accesible a eruditos hasta el s.XIX. Tischendorf solo pudo verlo brevemente.<\/span><br><span style=\"font-size:0.8rem\">📍 Origen: Egipto · Descubierto: Biblioteca Vaticana (registrado desde 1475) (antes de 1475)<\/span><br><span style=\"font-size:0.8rem\">📦 Ubicación actual: Biblioteca Apostólica Vaticana, Roma<\/span><br><span style=\"font-size:0.8rem;color:#2e7d32;font-weight:600\">Tipo: Alejandrino<\/span> · <span style=\"font-size:0.8rem\">Contenido: AT (LXX) + NT hasta Hebreos 9:14 (faltan Pastorales, Filemón, Apocalipsis)<\/span><br><span style=\"font-size:0.8rem\">⭐ El más confiable según la mayoría de críticos textuales. Su concordancia con P75 (s.II) demuestra que preserva un texto muy antiguo. Base principal del texto NA28/UBS5.<\/span><\/div><\/div>\n<div style=\"margin-bottom:0.5rem;border-left:2px solid #2e7d32;border-radius:8px;background:#fafafa\"><div style=\"padding:0.6rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center\" onclick=\"document.getElementById('msd5').classList.toggle('collapsed')\"><span><a href=\"https://www.google.com/search?q=ℵ+Codex+Sinaiticus+(Aleph/01)\" target=\"_blank\" style=\"font-size:1.1rem;font-weight:bold;color:#1565c0;text-decoration:none\" onclick=\"event.stopPropagation()\">ℵ<\/a> — <strong>Codex Sinaiticus (Aleph/01)<\/strong> (c. 330-360)<\/span><span style=\"font-size:0.65rem;color:#888\">▼<\/span><\/div><div id=\"msd5\" class=\"collapsed\" style=\"padding:0 1rem 0.8rem\"><span style=\"font-size:0.85rem;color:#555\">Descubierto por Constantin von Tischendorf en el Monasterio de Santa Catalina (Sinaí). Es el único manuscrito uncial con el NT completo. Incluye libros que luego no entraron al canon (Bernabé, Hermas). Tiene múltiples correctores de diferentes siglos.<\/span><br><span style=\"font-size:0.8rem\">📍 Origen: Cesarea o Egipto · Descubierto: Monasterio de Santa Catalina, Sinaí (1844-1859)<\/span><br><span style=\"font-size:0.8rem\">📦 Ubicación actual: British Library, Londres<\/span><br><span style=\"font-size:0.8rem;color:#2e7d32;font-weight:600\">Tipo: Alejandrino<\/span> · <span style=\"font-size:0.8rem\">Contenido: NT completo + gran parte del AT (LXX) + Epístola de Bernabé + Pastor de Hermas<\/span><br><span style=\"font-size:0.8rem\">⭐ Altamente confiable. Uno de los dos pilares del texto alejandrino (junto con B). Su NT completo lo hace indispensable. Las correcciones posteriores muestran la historia de la transmisión textual.<\/span><\/div><\/div>\n<div style=\"margin-bottom:0.5rem;border-left:4px solid #4a148c;border-radius:8px;background:#fafafa\"><div style=\"padding:0.6rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center\" onclick=\"document.getElementById('msd6').classList.toggle('collapsed')\"><span><a href=\"https://www.google.com/search?q=D+Codex+Bezae+(05)\" target=\"_blank\" style=\"font-size:1.1rem;font-weight:bold;color:#1565c0;text-decoration:none\" onclick=\"event.stopPropagation()\">D<\/a> — <strong>Codex Bezae (05)<\/strong> (c. 400)<\/span><span style=\"font-size:0.65rem;color:#888\">▼<\/span><\/div><div id=\"msd6\" class=\"collapsed\" style=\"padding:0 1rem 0.8rem\"><span style=\"font-size:0.85rem;color:#555\">Manuscrito bilingüe (griego-latín) con el texto occidental más importante. En Hechos es ~10% más largo que el alejandrino, con adiciones narrativas únicas. Muchas lecturas singulares que no aparecen en ningún otro manuscrito.<\/span><br><span style=\"font-size:0.8rem\">📍 Origen: Sur de Francia o Norte de África · Descubierto: Donado por Teodoro de Beza a Cambridge (1581)<\/span><br><span style=\"font-size:0.8rem\">📦 Ubicación actual: Cambridge University Library<\/span><br><span style=\"font-size:0.8rem;color:#4a148c;font-weight:600\">Tipo: Occidental<\/span> · <span style=\"font-size:0.8rem\">Contenido: Evangelios + Hechos (bilingüe griego-latín)<\/span><br><span style=\"font-size:0.8rem\">⭐ Controversial. Preserva tradiciones muy antiguas (s.II) pero también contiene armonizaciones y expansiones. Valioso como testigo independiente del texto occidental. No se usa como base pero sus lecturas se consideran caso por caso.<\/span><\/div><\/div>\n<div style=\"margin-bottom:0.5rem;border-left:4px solid #555;border-radius:8px;background:#fafafa\"><div style=\"padding:0.6rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center\" onclick=\"document.getElementById('msd7').classList.toggle('collapsed')\"><span><a href=\"https://www.google.com/search?q=A+Codex+Alexandrinus+(02)\" target=\"_blank\" style=\"font-size:1.1rem;font-weight:bold;color:#1565c0;text-decoration:none\" onclick=\"event.stopPropagation()\">A<\/a> — <strong>Codex Alexandrinus (02)<\/strong> (c. 400-440)<\/span><span style=\"font-size:0.65rem;color:#888\">▼<\/span><\/div><div id=\"msd7\" class=\"collapsed\" style=\"padding:0 1rem 0.8rem\"><span style=\"font-size:0.85rem;color:#555\">Donado por el Patriarca de Constantinopla Cirilo Lukaris al rey Carlos I en 1627. Texto bizantino en los Evangelios pero alejandrino en Hechos, Epístolas y Apocalipsis. Mejor testigo del Apocalipsis.<\/span><br><span style=\"font-size:0.8rem\">📍 Origen: Egipto o Constantinopla · Descubierto: Donado al rey Carlos I de Inglaterra (1627)<\/span><br><span style=\"font-size:0.8rem\">📦 Ubicación actual: British Library, Londres<\/span><br><span style=\"font-size:0.8rem;color:#555;font-weight:600\">Tipo: Bizantino (Evangelios), Alejandrino (resto)<\/span> · <span style=\"font-size:0.8rem\">Contenido: AT + NT casi completos (faltan partes de Mt, Jn, 2 Cor). Incluye 1-2 Clemente<\/span><br><span style=\"font-size:0.8rem\">⭐ Confiable pero con distinción: en Evangelios refleja texto bizantino (secundario), en el resto es alejandrino (primario). Crucial para el Apocalipsis donde B no existe.<\/span><\/div><\/div>\n<div style=\"margin-bottom:0.5rem;border-left:4px solid #555;border-radius:8px;background:#fafafa\"><div style=\"padding:0.6rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center\" onclick=\"document.getElementById('msd8').classList.toggle('collapsed')\"><span><a href=\"https://www.google.com/search?q=W+Codex+Washingtonianus+(032)\" target=\"_blank\" style=\"font-size:1.1rem;font-weight:bold;color:#1565c0;text-decoration:none\" onclick=\"event.stopPropagation()\">W<\/a> — <strong>Codex Washingtonianus (032)<\/strong> (c. 400-450)<\/span><span style=\"font-size:0.65rem;color:#888\">▼<\/span><\/div><div id=\"msd8\" class=\"collapsed\" style=\"padding:0 1rem 0.8rem\"><span style=\"font-size:0.85rem;color:#555\">Texto que cambia de carácter según la sección (alejandrino en Lc 1:1-8:12, occidental en Mc 1:1-5:30, bizantino en Mt). Contiene el \"Logion de Freer\" después de Mc 16:14, una adición única.<\/span><br><span style=\"font-size:0.8rem\">📍 Origen: Egipto · Descubierto: Comprado por Charles Freer en Egipto (1906)<\/span><br><span style=\"font-size:0.8rem\">📦 Ubicación actual: Smithsonian Institution, Washington D.C.<\/span><br><span style=\"font-size:0.8rem;color:#555;font-weight:600\">Tipo: Mixto (varía por sección)<\/span> · <span style=\"font-size:0.8rem\">Contenido: Evangelios<\/span><br><span style=\"font-size:0.8rem\">⭐ Confiable pero complejo. Cada sección debe evaluarse según su tipo textual. El cambio de tipo sugiere que fue copiado de múltiples ejemplares.<\/span><\/div><\/div>\n<div style=\"margin-bottom:0.5rem;border-left:4px solid #555;border-radius:8px;background:#fafafa\"><div style=\"padding:0.6rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center\" onclick=\"document.getElementById('msd9').classList.toggle('collapsed')\"><span><a href=\"https://www.google.com/search?q=C+Codex+Ephraemi+Rescriptus+(04)\" target=\"_blank\" style=\"font-size:1.1rem;font-weight:bold;color:#1565c0;text-decoration:none\" onclick=\"event.stopPropagation()\">C<\/a> — <strong>Codex Ephraemi Rescriptus (04)<\/strong> (c. 450)<\/span><span style=\"font-size:0.65rem;color:#888\">▼<\/span><\/div><div id=\"msd9\" class=\"collapsed\" style=\"padding:0 1rem 0.8rem\"><span style=\"font-size:0.85rem;color:#555\">Palimpsesto: el texto bíblico fue borrado en el s.XII y reescrito con sermones de Efrén el Sirio. Tischendorf logró descifrar el texto inferior con reactivos químicos (1840-1845). Solo sobrevive ~60% del NT.<\/span><br><span style=\"font-size:0.8rem\">📍 Origen: Egipto · Descubierto: Biblioteca Nacional de Francia (s. XVII)<\/span><br><span style=\"font-size:0.8rem\">📦 Ubicación actual: Bibliothèque nationale de France, París<\/span><br><span style=\"font-size:0.8rem;color:#555;font-weight:600\">Tipo: Mixto<\/span> · <span style=\"font-size:0.8rem\">Contenido: Fragmentos de AT y NT (palimpsesto)<\/span><br><span style=\"font-size:0.8rem\">⭐ Moderadamente confiable. Texto mixto. Valioso donde otros testigos faltan. El proceso de desciframiento introduce incertidumbre en algunas lecturas.<\/span><\/div><\/div>\n<div style=\"margin-bottom:0.5rem;border-left:2px solid #555;border-radius:8px;background:#fafafa\"><div style=\"padding:0.6rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center\" onclick=\"document.getElementById('msd10').classList.toggle('collapsed')\"><span><a href=\"https://www.google.com/search?q=TR+Textus+Receptus\" target=\"_blank\" style=\"font-size:1.1rem;font-weight:bold;color:#1565c0;text-decoration:none\" onclick=\"event.stopPropagation()\">TR<\/a> — <strong>Textus Receptus<\/strong> (1516-1633)<\/span><span style=\"font-size:0.65rem;color:#888\">▼<\/span><\/div><div id=\"msd10\" class=\"collapsed\" style=\"padding:0 1rem 0.8rem\"><span style=\"font-size:0.85rem;color:#555\">No es un manuscrito sino un texto impreso. Erasmo lo compiló en 1516 basándose en unos pocos minúsculos tardíos (s.XII-XIII) disponibles en Basilea. El nombre \"Textus Receptus\" viene de la edición Elzevir de 1633. Base de la KJV y la RVR antigua.<\/span><br><span style=\"font-size:0.8rem\">📍 Origen: Basilea, Suiza · Descubierto: Publicado por Erasmo de Rotterdam (1516)<\/span><br><span style=\"font-size:0.8rem\">📦 Ubicación actual: Múltiples ediciones<\/span><br><span style=\"font-size:0.8rem;color:#555;font-weight:600\">Tipo: Bizantino tardío<\/span> · <span style=\"font-size:0.8rem\">Contenido: NT completo (texto impreso, no manuscrito)<\/span><br><span style=\"font-size:0.8rem\">⭐ Superado por la crítica textual moderna. Se basa en manuscritos tardíos y en algunos lugares Erasmo retrotradujo del latín al griego. Sin embargo, en la gran mayoría del texto coincide con manuscritos más antiguos.<\/span><\/div><\/div>\n<\/div>\n\n<h3 style=\"color:#1a237e;margin-top:1.5rem\">🗺️ Ubicaciones Actuales de los Manuscritos<\/h3>\n<svg viewBox=\"-20 0 420 280\" style=\"width:100%;max-width:700px;background:#e8f4fd;border-radius:8px;margin:1rem 0\" xmlns=\"http://www.w3.org/2000/svg\">\n<path d=\"M0,80 Q50,70 100,75 Q150,60 200,65 Q250,55 300,60 Q350,65 400,70 L400,280 L0,280 Z\" fill=\"#d4e6c3\" stroke=\"#999\" stroke-width=\"0.5\"/>\n<path d=\"M0,0 L400,0 L400,80 Q350,65 300,60 Q250,55 200,65 Q150,60 100,75 Q50,70 0,80 Z\" fill m\": \"N-VSF-L\", \"g\": \"Capernaum\", \"s\": \"G2584\", \"d\": \"Capernaum (i.e.\\n Caphanachum), a place in Palestine\", \"es\": \"Capernaum\"}, \"μὴ\": {\"w\": \"μὴ\", \"l\": \"μή\", \"m\": \"PRT-N\", \"g\": \"not\", \"s\": \"G3361\", \"d\": \"(adverb) not, (conjunction) lest; also (as an\\n interrogative implying a negative answer (whereas\", \"es\": \"no\"}, \"ἕως\": {\"w\": \"ἕως\", \"l\": \"ἕως\", \"m\": \"PREP\", \"g\": \"until\", \"s\": \"G2193\", \"d\": \"a conjunction, preposition and adverb of\\n continuance, until (of time and place)\", \"es\": \"Hasta\"}, \"οὐρανοῦ\": {\"w\": \"οὐρανοῦ\", \"l\": \"οὐρανός\", \"m\": \"N-GSM\", \"g\": \"heaven\", \"s\": \"G3772\", \"d\": \"the\\n sky; by extension, heaven (as the abode of God); by implication,\\n happiness, power, eternity; specially, the Gospel\\n (Christianity)\", \"es\": \"cielo\"}, \"ὑψωθήσῃ\": {\"w\": \"ὑψωθήσῃ\", \"l\": \"ὑψόω\", \"m\": \"V-FPI-2S\", \"g\": \"to lift up\", \"s\": \"G5312\", \"d\": \"to elevate (literally or figuratively)\", \"es\": \"serás elevada?\"}, \"ᾅδου\": {\"w\": \"ᾅδου\", \"l\": \"ᾍδης\", \"m\": \"N-GSM\", \"g\": \"Hades\", \"s\": \"G86\", \"d\": \"properly, unseen, i.e. \\\"Hades\\\"\\n or the place (state) of departed souls\", \"es\": \"Sepulcro\"}, \"καταβήσῃ\": {\"w\": \"καταβήσῃ\", \"l\": \"καταβαίνω\", \"m\": \"V-FDI-2S\", \"g\": \"to come/go down\", \"s\": \"G2597\", \"d\": \"to descend (literally or\\n figuratively)\", \"es\": \"bajarás\"}, \"ὅτι\": {\"w\": \"ὅτι\", \"l\": \"ὅτι\", \"m\": \"CONJ\", \"g\": \"that/since\", \"s\": \"G3754\", \"d\": \"demonstrative, that (sometimes\\n redundant); causative, because\", \"es\": \"porque\"}, \"εἰ\": {\"w\": \"εἰ\", \"l\": \"εἰ\", \"m\": \"CONJ\", \"g\": \"if\", \"s\": \"G1487\", \"d\": \"if, whether, that,\\n etc.\", \"es\": \"si\"}, \"Σοδόμοις\": {\"w\": \"Σοδόμοις\", \"l\": \"Σόδομα\", \"m\": \"N-DPN-L\", \"g\": \"Sodom\", \"s\": \"G4670\", \"d\": \"Sodoma (i.e. Sedom), a place in\\n Palestine\", \"es\": \"Sodoma\"}, \"ἐγενήθησαν\": {\"w\": \"ἐγενήθησαν\", \"l\": \"γίνομαι\", \"m\": \"V-2AOI-3P\", \"g\": \"to be\", \"s\": \"G1096\", \"d\": \"to cause to be\\n (\\\"gen\\\"-erate), i.e. (reflexively) to become (come into being), used\\n with great latitude (literal, figurative, intensive, etc.)\", \"es\": \"habiendo llegado a ser\"}, \"αἱ\": {\"w\": \"αἱ\", \"l\": \"ὁ\", \"m\": \"T-NPF\", \"g\": \"the/this/who\", \"s\": \"G3588\", \"d\": \"the (sometimes to be\\n supplied, at others omitted, in English idiom)\", \"es\": \"las (que)\"}, \"δυνάμεις\": {\"w\": \"δυνάμεις\", \"l\": \"δύναμις\", \"m\": \"N-NPF\", \"g\": \"power\", \"s\": \"G1411\", \"d\": \"force (literally or figuratively); specially, miraculous\\n power (usually by implication, a miracle itself)\", \"es\": \"obras poderosas\"}, \"γενόμεναι\": {\"w\": \"γενόμεναι\", \"l\": \"γίνομαι\", \"m\": \"V-2ADP-NPF\", \"g\": \"to be\", \"s\": \"G1096\", \"d\": \"to cause to be\\n (\\\"gen\\\"-erate), i.e. (reflexively) to become (come into being), used\\n with great latitude (literal, figurative, intensive, etc.)\", \"es\": \"llegaron a ser\"}, \"σοί\": {\"w\": \"σοί\", \"l\": \"σύ\", \"m\": \"P-2DS\", \"g\": \"you\", \"s\": \"G4771\", \"d\": \"thou\", \"es\": \"ti\"}, \"ἔμεινεν\": {\"w\": \"ἔμεινεν\", \"l\": \"μένω\", \"m\": \"V-AAI-3S\", \"g\": \"to stay\", \"s\": \"G3306\", \"d\": \"to stay (in a given place, state, relation or\\n expectancy)\", \"es\": \"habiendo permanecido\"}, \"ἂν\": {\"w\": \"ἂν\", \"l\": \"ἄν\", \"m\": \"PRT\", \"g\": \"if\", \"s\": \"G302\", \"d\": \"\", \"es\": \"probable\"}, \"μέχρι\": {\"w\": \"μέχρι\", \"l\": \"μέχρι\", \"m\": \"PREP\", \"g\": \"until\", \"s\": \"G3360\", \"d\": \"as far as, i.e. up to a certain point (as a preposition, of\\n extent (denoting the terminus, whereas\", \"es\": \"hasta\"}, \"τῆς\": {\"w\": \"τῆς\", \"l\": \"ὁ\", \"m\": \"T-GSF\", \"g\": \"the/this/who\", \"s\": \"G3588\", \"d\": \"the (sometimes to be\\n supplied, at others omitted, in English idiom)\", \"es\": \"el\"}, \"σήμερον\": {\"w\": \"σήμερον\", \"l\": \"σήμερον\", \"m\": \"ADV\", \"g\": \"today\", \"s\": \"G4594\", \"d\": \"on the (i.e. this) day (or night current or\\n just passed); generally, now (i.e. at present, hitherto)\", \"es\": \"hoy\"}, \"Πάντα\": {\"w\": \"Πάντα\", \"l\": \"πᾶς\", \"m\": \"A-NPN\", \"g\": \"all\", \"s\": \"G3956\", \"d\": \"all,\\n any, every, the whole\", \"es\": \"Todas (cosas)\"}, \"μοι\": {\"w\": \"μοι\", \"l\": \"ἐγώ\", \"m\": \"P-1DS\", \"g\": \"I/we\", \"s\": \"G1473\", \"d\": \"\", \"es\": \"a mí\"}, \"παρεδόθη\": {\"w\": \"παρεδόθη\", \"l\": \"παραδίδωμι\", \"m\": \"V-API-3S\", \"g\": \"to deliver\", \"s\": \"G3860\", \"d\": \"to surrender, i.e yield up, intrust,\\n transmit\", \"es\": \"fue entregado\"}, \"ὑπὸ\": {\"w\": \"ὑπὸ\", \"l\": \"ὑπό\", \"m\": \"PREP\", \"g\": \"by/under\", \"s\": \"G5259\", \"d\": \"under, i.e. (with the genitive case) of place\\n (beneath), or with verbs (the agency or means, through); (with the\\n accusative case) of place (whither (underneath) or where (below) or\\n time (when (at))\", \"es\": \"por\"}, \"Πατρός\": {\"w\": \"Πατρός\", \"l\": \"πατήρ\", \"m\": \"N-GSM\", \"g\": \"father\", \"s\": \"G3962\", \"d\": \"a \\\"father\\\" (literally or figuratively, near\\n or more remote)\", \"es\": \"Padre\"}, \"μου\": {\"w\": \"μου\", \"l\": \"ἐγώ\", \"m\": \"P-1GS\", \"g\": \"I/we\", \"s\": \"G1473\", \"d\": \"\", \"es\": \"de mí\"}, \"οὐδεὶς\": {\"w\": \"οὐδεὶς\", \"l\": \"οὐδείς\", \"m\": \"A-NSM\", \"g\": \"no one\", \"s\": \"G3762\", \"d\": \"not even one (man, woman or thing), i.e. none,\\n nobody, nothing\", \"es\": \"nadie\"}, \"ἐπιγινώσκει\": {\"w\": \"ἐπιγινώσκει\", \"l\": \"ἐπιγινώσκω\", \"m\": \"V-PAI-3S\", \"g\": \"to come to know\", \"s\": \"G1921\", \"d\": \"to know upon some mark, i.e. recognize; by\\n implication, to become fully acquainted with, to acknowledge\", \"es\": \"está conociendo plenamente\"}, \"τὸν\": {\"w\": \"τὸν\", \"l\": \"ὁ\", \"m\": \"T-ASM\", \"g\": \"the/this/who\", \"s\": \"G3588\", \"d\": \"the (sometimes to be\\n supplied, at others omitted, in English idiom)\", \"es\": \"a el\"}, \"Υἱὸν\": {\"w\": \"Υἱὸν\", \"l\": \"υἱός\", \"m\": \"N-ASM\", \"g\": \"son\", \"s\": \"G5207\", \"d\": \"a \\\"son\\\" (sometimes of animals), used very\\n widely of immediate, remote or figuratively, kinship\", \"es\": \"Hijo\"}, \"Πατήρ\": {\"w\": \"Πατήρ\", \"l\": \"πατήρ\", \"m\": \"N-NSM\", \"g\": \"father\", \"s\": \"G3962\", \"d\": \"a \\\"father\\\" (literally or figuratively, near\\n or more remote)\", \"es\": \"Padre\"}, \"οὐδὲ\": {\"w\": \"οὐδὲ\", \"l\": \"οὐδέ\", \"m\": \"CONJ-N\", \"g\": \"and not\", \"s\": \"G3761\", \"d\": \"not however, i.e. neither, nor, not even\", \"es\": \"ni\"}, \"Πατέρα\": {\"w\": \"Πατέρα\", \"l\": \"πατήρ\", \"m\": \"N-ASM\", \"g\": \"father\", \"s\": \"G3962\", \"d\": \"a \\\"father\\\" (literally or figuratively, near\\n or more remote)\", \"es\": \"Padre\"}, \"τις\": {\"w\": \"τις\", \"l\": \"τις\", \"m\": \"X-NSM\", \"g\": \"one\", \"s\": \"G5100\", \"d\": \"an interrogative pronoun, who, which or\\n what (in direct or indirect questions)\", \"es\": \"alguien\"}, \"ᾧ\": {\"w\": \"ᾧ\", \"l\": \"ὅς, ἥ\", \"m\": \"R-DSM\", \"g\": \"which\", \"s\": \"G3739\", \"d\": \"\", \"es\": \"a quien\"}, \"ἐὰν\": {\"w\": \"ἐὰν\", \"l\": \"ἐάν\", \"m\": \"PRT\", \"g\": \"if\", \"s\": \"G1437\", \"d\": \"a conditional particle; in case that, provided,\\n etc.; often used in connection with other particles to denote\\n indefiniteness or uncertainty\", \"es\": \"si alguna vez\"}, \"βούληται\": {\"w\": \"βούληται\", \"l\": \"βούλομαι\", \"m\": \"V-PNS-3S\", \"g\": \"to plan\", \"s\": \"G1014\", \"d\": \"to \\\"will,\\\" i.e. (reflexively) be\\n willing\", \"es\": \"esté queriendo\"}, \"ἀποκαλύψαι\": {\"w\": \"ἀποκαλύψαι\", \"l\": \"ἀποκαλύπτω\", \"m\": \"V-AAN\", \"g\": \"to reveal\", \"s\": \"G601\", \"d\": \"to take off the cover, i.e. disclose\", \"es\": \"quitar cubierta\"}};\nconst tip = document.getElementById('wordTip');\ndocument.querySelectorAll('.tc-word').forEach(el => {\n  el.addEventListener('mouseenter', e => {\n    const t = el.dataset.tip || '';\n    const l = el.dataset.lemma || '';\n    const m = el.dataset.morph || '';\n    if (!l) return;\n    tip.innerHTML = '<strong>' + l + '<\/strong>' + (m ? ' <span style=\"opacity:0.7\">[' + m + ']<\/span>' : '') + (t ? '<br>' + t : '');\n    tip.style.display = 'block';\n    tip.style.left = Math.min(e.clientX + 10, window.innerWidth - 340) + 'px';\n    tip.style.top = (e.clientY - 35) + 'px';\n  });\n  el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });\n  el.addEventListener('click', () => {\n    const s = el.dataset.strongs;\n    if (s) window.open('https://www.blueletterbible.org/lexicon/' + s + '/kjv/tr/0-1/', '_blank');\n  });\n});\n<\/script>\n<\/body><\/html>", "greek_commentaries": {"1": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:1] . ὅτε ἐτέλεσεν διατάσσων . The participle here with a verb signifying to cease as often with verbs signifying to begin, continue, persevere, etc., vide Goodwin, § 879. ἐκεῖθεν , from that place, the place where the mission was given to the Twelve. Where that was we do not know; probably in some place of retirement (dans la retraite, Lutteroth). πόλεσιν αὐτῶν : the pronoun does not refer to the disciples ( μαθηταῖς ) as Fritzsche thinks, but to the people of Galilee. While He sent out the Twelve to preach, He continued preaching Himself, only avoiding the places they visited, &ldquo;giving room to them and time to do their work, for, with Him present and healing, no one would have cared to go near them,&rdquo; Chrysos., Hom. 36."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "Mat 10:1 to [Matthew 11:1] .] MISSION OF THE TWELVE APOSTLES. [Mark 6:7-13] ; [Luke 9:1-6] , for the sending out of the Apostles: [Mark 3:13-19] ; [Luke 6:13-16] , for their names . On the characteristic differences between this discourse and that delivered to the Seventy ([Luke 10:1] ff.) see notes there. Notice, that this is not the choosing , but merely the mission of the twelve. The choosing had taken place some time before, but is not any where distinctly detailed by the Evangelists."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 11:1] . Ἐκεῖθεν ] from where the sending out of the apostles took place. It is impossible to define the locality further; at all events Capernaum is not intended, but some open space ([Matthew 9:36] ) on the road, along which Jesus was at that time prosecuting His journey through Galilee ([Matthew 9:35] ). Whilst the Twelve were out on their missionary tour, Jesus continued His labours by Himself; and it was during this interval also that He was visited by the messengers from the Baptist. Where these latter happened to find Him, it is impossible to say. For the return of the Twelve, see note on [Matthew 11:25] . αὐτῶν ] in the towns of those to whom He came ( the Galileans ). Comp. [Matthew 4:23] , [Matthew 9:35] , [Matthew 12:9] . Fritzsche refers αὐτῶν to the apostles: in which the apostles had already published the knowledge of the kingdom . Incorrectly, for the μετέβη , κ . τ . λ ., follows at once and immediately upon the conclusion of the instructions to the Twelve. On the following section, see Wieseler in the Göttingen Vierteljahrschr . 1845, p. 197 ff.; Gams, Joh. d. T. im Gefängn . 1853; Gademann, in d. Luth. Zeitschr . 1852, 4; Grote, ibid . 1857, 3, p. 518 ff. Comp. also Erlang. Zeitschr . 1857, p. 167 ff.; Keim, II. p. 355 ff."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:1] . Ἐτέλεσεν , concluded ) Our Lord did nothing abruptly. See Gnomon on ch. [Matthew 26:1] ; and [Luke 7:1] . κηρύσσειν , to preach ) sc. everywhere. Cf. [John 3:2] , etc. [507] αὐτῶν , of them ) the Israelites [the people, namely, who were deserving of His &lsquo;compassion,&rsquo; ch. [Matthew 9:36] . V. g.] [507] The verb διδάσκειν implies private instruction, as κηρύσσειν implies public instruction. V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "He departed thence to teach and preach ( μετεβη εκειθεν του διδασκειν κα κηρυσσειν ). In five instances ([Matthew 7:28]; [Matthew 11:1]; [Matthew 13:53]; [Matthew 19:1]; [Matthew 26:1]) after great discourses by Jesus \"the transition to what follows is made with the formula, 'And it came to pass when Jesus had ended'\" (McNeile). This is a wrong chapter division, for [Matthew 11:1] belongs with the preceding section. \"Commanding\" ( διατασσων , complementary participle with ετελεσεν ), means giving orders in detail ( δια- ) for each of them. Note both \"teach and preach\" as in [Matthew 4:23]. Where did Jesus go? Did he follow behind the twelve as he did with the seventy \"whither he himself was about to come\" ([Luke 10:1])? Bruce holds with Chrysostom that Jesus avoided the places where they were, giving them room and time to do their work. But, if Jesus himself went to the chief cities of Galilee on this tour, he would be compelled to touch many of the same points. Jesus would naturally follow behind at some distance. At the end of the tour the apostles come together in Capernaum and tell Jesus all that they had done and that they had taught ([Mark 6:30]). Matthew follows the general outline of Mark, but the events are not grouped in chronological order here."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Commanding [ διατασσων] . The preposition dia has a distributive force : giving to each his appropriate charge. Their cities [ αυτων] . The towns of those to whom he came - the Galilaeans. Compare [Matthew 4:23]."}], "2": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:2] . δεσμωτηρίῳ (from δεσμόω , δεσμός , a bond), in prison in the fortress of Machærus by the Dead Sea (Joseph., Antiq., 18, 5, 2), a fact already alluded to in [Matthew 4:12] . By this time he has been a prisoner a good while, long enough to develop a prison mood . ἀκούσας : not so close a prisoner but that friends and followers can get access to him ( cf. [Matthew 25:36] ; [Matthew 25:43] ). τὰ ἔργα τοῦ χριστοῦ : this the subject in which the Baptist is chiefly interested. What is Jesus doing? But the evangelist does not say the works of Jesus , but of the Christ, i.e. , of the man who was believed to be the Christ, the works which were supposed to point Him out as the Christ. In what spirit reported, whether simply as news, with sympathy, or with jealousy, not indicated. πέμψας : the news set John on musing, and led to a message of inquiry διὰ τ . μαθητῶν αὐτοῦ , by his disciples, possibly the same men who brought the news. There would be constant coming and going between Galilee and Machærus. The construction is Hebraistic = sent by the hand of."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "2. ἀκούσας ] From his own disciples , [Luke 7:18] . The place of his imprisonment was Machærus. ὁ μὲν ὑποψίᾳ τοῦ Ἡρώδου δέσμιος εἰς τὸν Μαχαιροῦντα πεμφθείς , … ( μεθόριον δέ ἐστι τῆς τε Ἀρέτα καὶ Ἡρώδου ἀρχῆς ).… ταύτῃ κτίννυται . Jos. Antt. xviii. 5. 2."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 11:2] ff. Comp. [Luke 7:18] ff., where the account is introduced somewhat earlier, and where nothing is said about the prison (but see [Luke 3:20] ). ἀκούσας , κ . τ . λ .] Occasion of the message. See the note after [Matthew 11:5] . ἐν τῷ δεσμωτ .] in the fortress of Machaerus. Joseph. Antt . xviii. 5. 2. See on [Matthew 14:3] . How John could hear anything of Jesus&rsquo; works in prison was possible in various ways; most naturally it was through his disciples , with whom he was permitted to have intercourse. [Luke 7:18] . τὰ ἔργα ] are the deeds , the first element in the ποιεῖν τε καὶ διδάσκειν ([Acts 1:1] ). These were for the most part miracles , though there is no reason to suppose that they were exclusively so. See on [John 5:36] . πέμψας ] absolutely, Xen. Anab . vii. 1. 2; Hell . iii. 2. 9; Thuc. i. 91. 2; Bornem. Schol. in Luc . p. lxv. The following διὰ τῶν μαθητ . αὐτοῦ belongs to εἶπεν αὐτῷ , not to πέμψας (de Wette), because this latter connection would involve the supposition of a Hebraism, שָׁלַח בְּיַד , 1Sa 16:20 , [1 Kings 2:25] , [Exodus 4:13] , which is in itself unnecessary."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:2] . Τοῦ Χριστοῦ , of Christ ) Those works which it was the part of the Messiah to perform. [508] μαθητῶν αὐτοῦ , of His disciples ) whom He wished to confirm and resign to Christ. [509] [508] Jesus had done similar works before John was imprisoned; but now. He did such works in much greater numbers. V. g. [509] He does not seem to have entertained any doubt himself as to Christ. V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "John heard in the prison ( ο δε Ιωανης ακουσας εν τω δεσμωτηριω ). Probably ([Luke 7:18]) the raising of the son of the widow of Nain. The word for prison here is the place where one was kept bound ([Acts 5:21]; [Acts 5:23]; [Acts 16:26]). See [Matthew 4:12]. It was in Machaerus east of the Dead Sea which at this time belonged to the rule of Herod Antipas (Jos. Ant. XVIII. v.2). John's disciples had access to him. So he sent word by ( δια , not δυο as in [Luke 7:19]) them to Jesus."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Two of his disciples [ δυο] . But the correct reading is dia, by. He sent by his disciples. So Rev."}], "3": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:3] . εἶπεν αὐτῷ , said to Jesus, by them, of course. Σὺ εἶ : the question a grave one and emphatically expressed: Thou , art Thou ὁ ἐρχόμενος ? Art Thou He whom I spoke of as the One coming after me when I was baptising in the Jordan ([Matthew 3:11] )? It is a question whether Jesus be indeed the Christ . Lutteroth, basing on the hypothesis that for popular Jewish opinion the Christ and the coming One (a prophet like Moses) were different persons, interprets the question thus: &ldquo;Art Thou, Jesus, whom I know to be the Christ, also the coming Prophet, or must we expect another to fill that rôle?&rdquo; ἢ ἕτερον , not ἄλλον , which would have been more appropriate on Lutteroth&rsquo;s view = a numerically distinct person. ἕτ . suggests a different kind of person. προσδοκῶμεν : may be present indicative (for future) as Beza and Fritzsche take it, or present subjunctive deliberative = ought we to look? (Meyer-Weiss, Holtz., H.C.), the latter preferable. What was the animus or psychological genesis of the question? Doubt in John&rsquo;s own mind, or doubt, bred of envy or jealousy, in the minds of his disciples, or not doubt on Baptist&rsquo;s part, but rather incipient faith? Alternative (2), universal with the fathers (except Tertullian, vide de prœscrip. , 8, de baptis. , 10); (1) common among modern commentators; (3) favoured by Keim, Weizsäcker, and Holtz., H.C.: &ldquo;beginnende Disposition zum Glauben an Jesu Messianität&rdquo;. The view of the fathers is based on a sense of decorum and implicit reliance on the exact historical value of the statements in fourth Gospel; No. (3), the budding faith hypothesis, is based on too sceptical a view as to the historic value of even the Synoptical accounts of John&rsquo;s early relations with Jesus; No. (1) has everything in its favour. The effect of confinement on John&rsquo;s prophetic temper, the general tenor of this chapter which obviously aims at exhibiting the moral isolation of Jesus, above all the wide difference between the two men, all make for it. Jesus, it had now become evident, was a very different sort of Messiah from what the Baptist had predicted and desiderated ( vide remarks on chap. [Matthew 3:11-15] ). Where were the axe and fan and the holy wind and fire of judgment? Too much patience, tolerance, gentleness, sympathy, geniality, mild wisdom in this Christ for his taste."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 11:3] . Σύ ] Placed first for sake of emphasis. Comp. ἕτερον . ὁ ἐρχόμενος ] He who is coming ([Hebrews 10:37] ), i.e . the Messiah , who, because His advent, as being certain and near, was the object of universal expectation, is called, κατʼ ἐξοχήν , the coming one ( הַבָּא ), perhaps in accordance with [Psalms 40:8] . Olshausen, Hilgenfeld, Keim, suggest [Psalms 118:26] ; Hengstenberg suggests [Malachi 3:1] ; Hitzig, [Daniel 9:26] . ἕτερον ] so that thou too wouldst, in that case, be only a forerunner. προσδοκῶμεν ] may be conjunctive (as commonly preferred) or indicative (Vulg. Erasmus, Beza, Calvin, Fritzsche). The idea of deliberation is, for psychological reasons, more appropriate. The we in the question is the expression of the popular expectation."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:3] . Ὁ ἐρχόμενος , he that should come ) cf. [Psalms 40:7] ; [Hebrews 10:37] . ἤ , κ . τ . λ ., or , etc.) There was not at that time any other, for John excludes himself by this disjunctive particle. ἕτερον , another ) They recognise as a certain fact that there is some one who should come. προσδοκῶμεν , must we await ) sc. with longer delay. [510] [510] The time of waiting in expectation was now by this time coming to an end; for the Seventieth week of Daniel was close at hand. V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "He that cometh ( ο ερχομενος ). This phrase refers to the Messiah ([Mark 11:9]; [Luke 13:35]; [Luke 19:38]; [Hebrews 10:37]; [Psalms 118:26]; [Daniel 7:13]). Some rabbis applied the phrase to some forerunner of the kingdom (McNeile). Was there to be \"another\" ( ετερον ) after Jesus? John had been in prison \"long enough to develop a prison mood\" (Bruce). It was once clear enough to him, but his environment was depressing and Jesus had done nothing to get him out of Machaerus (see chapter IX in my John the Loyal). John longed for reassurance."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Thou. Emphatic. Art thou \"the Coming One?\" - a current phrase for the Messiah."}], "4": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:4] . ἀπαγγείλατε Ι .: go back and report to John for his satisfaction. ἃ ἀκ . καὶ βλέπετε , what you are hearing and seeing, not so much at the moment, though Luke gives it that turn ([Matthew 7:21] ), but habitually. They were not to tell their master anything new, but just what they had told him before. The one new element is that the facts are stated in terms fitted to recall prophetic oracles ([Isaiah 35:5] ; [Isaiah 61:1] ), while, in part, a historic recital of recent miracles ([Matthew 8:9] ). Probably the precise words of Jesus are not exactly reproduced, but the sense is obvious. Tell John your story over again and remind him of those prophetic texts. Let him study the two together and draw his own conclusion. It was a virtual invitation to John to revise his Messianic idea, in hope he would discover that after all love was the chief Messianic charism."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "4. ] ἐν ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν , καὶ τυφλοῖς πολλοῖς ἐχαρίσατο βλέπειν . [Luke 7:21] . From καὶ ἀποκριθεὶς … ἐν ἐμοί , is nearly verbatim in the two Gospels."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:4] . Ἃ ἀκούετε καὶ βλέπετε , those things which ye do hear and see ) The testimonies of facts of seven kinds, enumerated in [Matthew 11:5-6] . The miracles which our Lord performed had been foretold; they were beneficent, many, and various. [511] [511] Sight in other cases is wont to precede hearing ; but the word of Christ [ heard by them] answered more closely, as it were, to the desires of faith than the works of Christ [ seen by them], [John 14:11] . Even in this place, Jesus speaks humbly, as in ch. [Matthew 12:17] ; [Matthew 12:41-42] . He does not say, Those things which I speak and do . V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "The things which ye do hear and see ( α ακουετε κα βλεπετε ). This symbolical message was for John to interpret, not for them."}], "5": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:5] . ἀναβλέπουσιν : used also in classics to express recovery of sight. κωφοὶ , here taken to mean deaf , though in [Matthew 9:32-33] , it means dumb , showing that the prophecy, [Isaiah 35:5] , is in the speaker&rsquo;s thoughts. πτωχοὶ : vague word, might mean literal poor (De W.) or spiritual poor, or the whole people in its national misery (Weiss, Matt. Evan.), best defined by such a text as [Matthew 9:36] , and such facts as that reported in [Matthew 9:10-13] . εὐαγγελίζονται : might be middle = the poor preach, and so taken by Euthy. Zig. (also as an alternative by Theophy.), for &ldquo;what can be poorer than fishing ( ἁλιευτικῆς )?&rdquo; The poor in that case = the Twelve sent out to preach the kingdom. That, too, was character istic of the movement, though not the characteristic intended, which is that the poor, the socially insignificant and neglected, are evangelised (passive, as in [Hebrews 4:2] )."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "5. ] The words νεκροὶ ἐγ . have raised some difficulty; but surely without reason. In Luke, the raising of the widow&rsquo;s son at Nain immediately precedes this message; and in this Gospel we have had the ruler&rsquo;s daughter raised. These miracles might be referred to by our Lord under the words νεκ . ἐγ .; for it is to be observed that He bade them tell John not only what things they saw, but what things they had heard , as in Luke. It must not be forgotten that the words here used by our Lord have an inner and spiritual sense, as betokening the blessings and miracles of divine grace on the souls of men, of which His outward and visible miracles were symbolical. The words are mostly cited from [Isaiah 35:5] , where the same spiritual meaning is conveyed by them. They are quoted here, as the words of Isa 53:1-12 are by the Evangelist in ch. [Matthew 8:17] , as applicable to their partial external fulfilment, which however, like themselves, pointed onward to their greater spiritual completion. εὐαγγελίζονται is passive, see reff. and 2Ki 18:31 in the LXX. In ref. Luke it is also passive, but with the thing preached as its subject. Stier remarks the coupling of these miracles together, and observes that with νεκ . ἐγ . is united πτωχοὶ εὐαγγελίζονται , as being a thing hitherto unheard of and strange, and an especial fulfilment of [Isaiah 61:1] ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:5] . [512] Εὐαγγελίζονται , are evangelized ) The word is passive; cf. [Luke 16:16] . For the works of our Lord Himself, which the disciples of John then saw and heard, are meant; cf. [Luke 4:18] , concerning the prediction of this work. [513] Nor did all poor men as yet preach the Gospel, but only the apostles. See [Matthew 10:7] . [512] Τυφλοὶ ἀναβλέπουσι ) At that very moment (period of time) such miracles were being performed ( Luk 7:21 ), which were the very miracles reserved for the Christ. In ancient times, sinners used to be punished with blindness, leprosy, and death. νεκροὶ ἐγείρονται ) A miracle which had been very recently performed in the case of the young man of Nain, [Luke 7:14] . V. g. [513] Which was peculiarly a work of the Christ, who was anointed for that very purpose, [Isaiah 61:1] . V. g. Comp. [Luke 4:1] . ED."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "And the dead are raised up ( κα νεκρο εγειροντα ). Like that of the son of the widow of Nain. Did he raise the dead also on this occasion? \"Tell John your story over again and remind him of these prophetic texts, [Isaiah 35:5]; [Isaiah 61:1]\" (Bruce). The items were convincing enough and clearer than mere eschatological symbolism. \"The poor\" in particular have the gospel, a climax."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "The lame walk. Tynd., The halt go."}], "6": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:6] . μακάριος ( vide [Matthew 5:3] ), possessed of rare felicity. The word implies that those who, on some ground or other, did not stumble over Jesus were very few. Even John not among them! On σκανδαλίζω vide ad. [Matthew 5:29] . ἐν ἐμοί , in anything relating to my public ministry, as appearing inconsistent with my Messianic vocation."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "6. ] See note on [Matthew 11:2] ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:6] . Μακάριος , blessed ) A rare felicity. That very circumstance, that many should be offended in Him, was foretold as a sign of the Messiah. [514] He loaded others with benefits; He Himself was weak, poor, despised. ὃς ἐὰν , whosoever ) especially of the disciples of John, who saw the difference between his mode of living and that of our Lord. See [Matthew 11:18-19] . [514] [Isaiah 52:14] . That very fact was an argument likely to be easily appreciated, especially by the disciples of John. See [Matthew 11:18] , with which comp. [Matthew 11:19] . V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Whosoever shall find none occasion of stumbling in me ( ος αν μη σκανδαλισθη εν εμο ). Indefinite relative clause with first aorist passive subjunctive. This beatitude is a rebuke to John for his doubt even though in prison. Doubt is not a proof of superior intellect, scholarship, or piety. John was in the fog and that is the time not to make serious decisions. \"In some way even the Baptist had found some occasion of stumbling in Jesus\" (Plummer)."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Be offended [ σκανδαλισθη] . See on ch. [Matthew 5:29]. Rev., shall find none occasion of stumbling. Compare Wyc., shall not be slandered."}], "7": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:7] . τούτων δὲ πορευομένων : while John&rsquo;s messengers were in the act of going, Jesus began at once, without any delay, to make a statement which He deemed necessary to prevent injurious inferences from the message of the Baptist, or the construction He had put on it as implying doubt regarding Himself. τοῖς ὄχλοις : the interrogation had taken place in presence of many. Jesus was always in a crowd, except when He took special steps to escape. The spectators had watched with interest what Jesus would say about the famous man. Therefore, more must be said; a careful opinion expressed. τί ἐξήλθετε … θεάσασθαι : it might be taken for granted that most of them had been there. The catechetical method of stating His opinion of John lively and impressive to such an audience. They had gone to see as well as hear and be baptised, curiosity plays a great part in popular religious movements. κάλαμον . Plenty of reeds to be seen. &ldquo;What a vast space of time lies between the days of the Baptist and us! How have the times changed! Yet the stream flows in the old bed. Still gently blows the wind among the sighing reeds.&rdquo; Furrer, Wanderungen , 185. Many commentators (Grot., Wet., Fritzsche, De W.) insist on taking καλ . literally = did ye go, etc., to see a reed, or the reeds on the Jordan banks shaken by the wind? This is flat and prosaic. Manifestly the individualised reed is a figure of an inconstant, weak man; just enough in John&rsquo;s present attitude to suggest such a thought, though not to justify it."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "7. ] The following verses set forth to the people the real character and position of John; identifying him who cried in the wilderness with him who now spoke from his prison, and assuring them that there was the same dignity of office and mission throughout. They are not spoken till after the departure of the disciples of John, probably because they were not meant for them or John to hear, but for the people, who on account of the question which they had heard might go away with a mistaken depreciation of John. ὁ πολὺς ὄχλος ἐκ τῆς ἐρωτήσεως τῶν Ἰωάννου μαθητῶν πολλὰ ἂν ἄτοπα ὑπενόησεν οὐκ εἰδὼς τὴν γνώμην μεθ ʼ ἧς ἔπεμψε τοὺς μαθητάς . καὶ εἰκὸς ἦν διαλογίζεσθαι πρὸς ἑαυτοὺς καὶ λέγειν Ὁ τοσαῦτα μαρτυρήσας μετεπείσθη νῦν , καὶ ἀμφιβάλλει εἴτε οὗτος εἴτε ἕτερος εἴη ὁ ἐρχόμενος ; ἆρα μὴ στασιάζων πρὸς τὸν Ἰησοῦν ταῦτα λέγει ; ἆρα μὴ δειλότερος ὑπὸ τοῦ δεσμωτηρίου γενόμενος ; ἆρα μὴ μάτην καὶ εἰκῆ τὰ πρότερα εἴρηκεν ; ἐπεὶ οὖν πολλὰ τοιαῦτα εἰκὸς ἦν αὐτοὺς ὑποπτεύειν , ὅρα πῶς αὐτῶν διορθοῦται τὴν ἀσθένειαν , καὶ ταύτας ἀναιρεῖ τὰς ὑποψίας . Chrysostom, Hom. xxxvii. 1, p. 414. And our Lord, as usual, takes occasion, from reminding them of the impression made on them by John&rsquo;s preaching of repentance, to set forth to them deep truths regarding His own Kingdom and Office."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 11:7] . The answer to John&rsquo;s question has been given; the disciples are withdrawing; but just as they are going away ( πορευομένων ) Jesus turns to the multitude that was present, and with some emotion proceeds to set forth to them, in the plainest way possible, the sacred character and the whole position of the Baptist, and by this means seeks to anticipate or correct any false opinion that might be formed regarding him. The mark of interrogation should be placed after θεάσασθαι (in answer to Paulus and Fritzsche, who put it even after ἔρημον ); according to the correct reading (see the critical remarks), the animated style of the passage does not change till [Matthew 11:9] , so that ἀλλὰ τί ἐξήλθετε forms a question by itself. ἐξήλθετε ] at the time that John appeared in the wilderness. Observe that here stands θεάσασθαι , to behold , and immediately after the simple ἰδεῖν , to see . The more earnest expression is in keeping with the first question. κάλ . σαλ .] figuratively , in allusion to the reed growing on the bank of Jordan, and meaning: a fickle and irresolute man . Others (Beza, Grotius, Wetstein, Gratz, Fritzsche, de Wette) understand it literally : &ldquo;non credibile est, vos coivisse, ut arundines vento agitatas videretis.&rdquo; This is not in keeping with the qualifying expression, ὑπὸ ἀνέμου σαλευόμενον . And how meaningless the question would be alongside the parallels in [Matthew 11:8-9] ! Comp. [1 Kings 14:15] ; [Ezekiel 29:6] ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:7] . Πορευομένων , as they departed ) Otherwise they might have become puffed up. The world praises to the face, reviles behind the back. Divine truth does the opposite. ἤρξατο , began ) The multitude would not have begun, had He not done so first. περὶ Ἰωάννου , concerning John ) The state of John is described in [Matthew 11:7-9] , with reference to men, to himself, to God. θεάσασθαι , to see as a spectacle ) idly. See [John 5:35] . κάλαμον , a reed ) The ford of Jordan abounded with them. They would have wished John to be such in conduct as they liked to be themselves, and as they are described in this verse and the following. They sought a man of easy disposition, and one ready to second their desires, whom they would not themselves style a reed; but Jesus calls a reed, a reed . For often does truth attribute to man a speech, not such as he frames himself, but such as expresses the reality. See [Jeremiah 18:12] . The people themselves did not sufficiently know why they had gone forth. On the other hand, the character of John is described (cf. Mat 11:18 ), and at the same time the stumbling-block is taken away, which might have arisen from the imprisonment of our Lord&rsquo;s precursor. ἀνέμου , by the wind ) of favour (by his having been supposed to be the Messiah) or persecution. σαλευόμενον , agitated ) The word is here in the middle voice, and signifies permitting himself to be agitated . This opinion is not refuted like those which follow, because it refutes itself."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "As these went their way ( τουτων πορευομενων ). Present participle genitive absolute. The eulogy of Jesus was spoken as the two disciples of John were going away. Is it a matter of regret that they did not hear this wondrous praise of John that they might cheer him with it? \"It may almost be called the funeral oration of the Baptist, for not long afterwards Herodias compassed his death\" (Plummer). A reed shaken by the wind ( καλαμον υπο ανεμου σαλευομενον ). Latin calamus. Used of the reeds that grew in plenty in the Jordan Valley where John preached, of a staff made of a reed ([Matthew 27:29]), as a measuring rod ([Revelation 11:1]), of a writer's pen ([3 John 1:13]). The reeds by the Jordan bent with the wind, but not so John."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "As they departed [ τουτων δε πορευομενων] . Rev., more literal and better, as these went their way; or while they, John's disciples, were departing : thus giving the simultaneousness of Jesus ' words with the act of departure. To see [ θεασασθαι] . Rev., to behold. qeasqai, like qewrein, expresses the calm, continuous contemplation of an object which remains before the spectator. Compare [John 1:14]. Another verb is used in Christ 's repetition of the question, vv. 8, 9; iJudein in the ordinary sense of seeing. The more earnest expression suits the first question."}], "8": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:8] . ἀλλὰ assumes the negative answer to the previous question and elegantly connects with it the following = &ldquo;No; well, then, did you, etc.?&rdquo; ἐν μαλακοῖς , neuter, ἱματίοις not necessary: in precious garments of any material, silk, woollen, linen; the fine garments suggestive of refinement, luxury, effeminacy. ἰδοὺ οἱ τ . μ . φοροῦντες : ἰδοὺ points to a well-known truth, serving the same purpose as δή here; those accustomed to wear, φορ ., frequentative, as distinct from φέροντες , which would mean bearing without reference to habit. οἴκοις τ . βασ ., in palaces which courtiers frequent. Jesus knows their flexible, superfine ways well; how different from those of the rudely clad and rudely mannered, uncompromising Baptist!"}, {"src": "hac", "name": "Alford's Greek Testament", "text": "8. ἀλλά ] If it was not that, …; so in Demosth. Coron. p. 233, τί γὰρ καὶ βουλόμενοι μετεπέμπεσθ ʼ ἂν αὐτούς ; ἐπὶ τὴν εἰρήνην ; ἀλλ ʼ ὑπῆρχεν ἅπασιν . ἀλλ ʼ ἐπὶ τὸν πόλεμον : see Klotz, Devar. p. 5. τί ἐξήλθατε ] The repetition of this question, and the order of the suggestive answers, are remarkable. The first sets before them the scene of their desert pilgrimage the banks of Jordan with its reeds (as Dr. Burton quotes from Lucian Hermotim., κάλαμος ἐπ ʼ ὄχθῃ παραποταμίῳ πεφυκὼς καὶ πρὸς πᾶν τὸ πνέον σαλευόμενος ); but no such trifles were the object of the journey: this suggestion is rejected without an answer. The second reminds them that it was a man but not one in soft clothing, for such are not found in deserts. The third brings before them the real object of their pilgrimage in his holy office, and even amplifies that office itself. So that the great Forerunner is made to rise gradually and sublimely into his personality, and thus his preaching of repentance is revived in their minds. ἐν μαλακοῖς ] Contrast this with the garb of John as described ch. [Matthew 3:4] . Such an one, in soft raiment, might be the forerunner of a proud earthly prince, but not the preacher of repentance before a humble and suffering Saviour; might be found as the courtly flatterer in the palaces of kings, but not as the stern rebuker of tyrants, languishing in their fortress dungeons."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:8] . Ἀλλὰ , but ) The conjunction is employed to show that the preceding hypothesis has been dismissed. ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον , clothed in soft raiment ) They would have wished the forerunner, and the Messiah Himself, to have been such. τὰ , the ) The article refers to the preceding μαλακοῖς . [515] φοροῦντες , who wear ) John, if he had wished it, might have been a courtier. οἴκοις , houses ) Not in the desert or the prison. τῶν βασιλείων , [516] of palaces ) See [Esther 4:2] . The LXX. have τὰ βασιλεία in [Esther 1:9] ; [Esther 2:13] . ΟἾΚΟΙ ΤῶΝ ΒΑΣΙΛΕΊΩΝ = the halls of the palace . [515] Thus identifying μαλακὰ with μαλακοῖς ἱματίοις , and showing that the μαλακα &ldquo; soft things,&rdquo; now spoken of are, as in E. V., &ldquo;soft clothing.&rdquo; (I. B.) [516] E. M. has &ldquo; τοῖς οἴκοις τῶν βασιλέων &rdquo; which E. V. renders &ldquo;Kings&rsquo; Palaces.&rdquo; (I. B.) The reading τῶν βασιλείων is regarded as equal to the other in the margin of the larger Ed.: but the margin of [Exodus 2:0] , as well as the Germ. Vers., prefer βασιλέων . E. B. All the primary authorities read βασιλέων . But Griesb. and Scholz, with some inferior Uncial MSS., read βασιλείων or βασιλειῶν . ED."}], "9": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:9] . ἀλλὰ τί ἐξ .: one more question, shorter, abrupt, needing to be supplemented by another (Weiss-Meyer) why then, seriously, went ye out? προφήτην ἰδεῖν ; to see a Prophet ? ναί , yea l right at last; a prophet, indeed, with all that one expects in a prophet vigorous moral conviction, integrity, strength of will, fearless zeal for truth and righteousness; utterly free from the feebleness and time-serving of those who bend like reeds to every breath of wind, or bow obsequiously before greatness. καὶ περισσότερον π ., a prophet and more, something above the typical prophet ( vide on [Matthew 5:47] ). The clause introduced by ναί , as λέγω ὑμῖν shows, expresses Christ&rsquo;s own opinion, not the people&rsquo;s (Weiss)."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "9. προφήτην ] We read, ch. [Matthew 21:26] , that &lsquo;all accounted John as a prophet.&rsquo; περισσότερον is neuter (as always in N.T.), not masculine; as πλεῖον , ch. [Matthew 12:41-42] . E. V. rightly, more than a prophet. John was more than a prophet, because he did not write of, but saw and pointed out , the object of his prophecy; and because of his proximity to the Kingdom of God. He was moreover more than a prophet, because he himself was the subject as well as the vehicle of prophecy. But with deep humility, he applies to himself only that one, of two such prophetic passages, which describes him as φωνὴ βοῶντος , and omits the one which gives him the title of ὁ ἄγγελός μου , here cited by our Lord."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:9] . Προφήτην , a prophet ) For a long time they had had no prophets. [517] ΝΑῚ , yea ) A prophet, I say unto you, and something greater than a prophet. περισσότερον more ) Neuter, as in τὶ , what : sc. when ye went out ye saw something more, etc., although ye did not know it. προφήτου , than a prophet ) For a prophet announces only distant events. [517] He cannot be accounted as such, unless he were one far removed from (reed-like) fickleness and (courtier-like) effeminacy. V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "And much more than a prophet ( κα περισσοτερον προφητου ). Ablative of comparison after περισσοτερον itself comparative though meaning exceeding (surrounded by, overflowing). John had all the great qualities of the true prophet: \"Vigorous moral conviction, integrity, strength of will, fearless zeal for truth and righteousness\" (Bruce). And then he was the Forerunner of the Messiah ([Malachi 3:1])."}], "10": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:10] . οὑτος … γέγραπται . The περισσότερον verified and explained by a prophetic citation. The oracle is taken from [Malachi 3:0] , altered so as to make the Messianic reference apparent μου changed into σου . By applying the oracle to John, Jesus identifies him with the messenger whom God was to send to prepare Messiah&rsquo;s way. This is his distinction, περισσότερον , as compared with other prophets. But, after all, this is an external distinction, an accident, so to speak. Some prophet must be the forerunner, if Messiah is to come at all, the last in the series who foretell His coming, and John happens to be that one a matter of good fortune rather than of merit. Something more is needed to justify the περισσότερον , and make it a proper subject for eulogy. That is forthcoming in the sequel."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "10. σου ] Our Lord here changes the person of the original prophecy, which is μου . And that He does so, making that which is said by Jehovah of Himself, to be addressed to the Messiah, is, if such were needed (compare also [Luke 1:16-17] ; Luk 1:76 ), no mean indication of His own eternal and co-equal Godhead. It is worthy of remark that all three Evangelists quote this prophecy similarly changed , although St. Mark has it in an entirely different place. The student should compare the passage in the LXX with the three citations, h. l., [Mark 1:2] , and [Luke 7:27] . Also, that the high dignity and honour which our Lord here predicates of the Baptist, has a further reference: He was thus great above all others, because he was the forerunner of Christ . How great then above all others and him, must HE be."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 11:10] is not an interpolation by the evangelist (Weizsäcker); on the contrary, it forms the connecting link between [Matthew 11:9] ; [Matthew 11:11] . The passage is [Malachi 3:1] , and is a free rendering of the Hebrew and not from the LXX. In Malachi, Jehovah speaks of His messenger going before Himself; here , He addresses the Messiah; before Him will He send the messenger (not an angel ). A free application without any substantial change in the contents of the passage, also without any special design in view; comp. remark on [Matthew 3:3] ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 11:10] . Οὗτος γάρ ἐστι , κ . τ . λ ., for this is he , etc.) This makes John much greater than that what is spoken of [518] in [Matthew 11:7-8] , could. ἸΔΟῪ ἘΓῺ ἈΠΟΣΤΈΛΛΩ ΤῸΝ ἌΓΓΕΛΌΝ ΜΟΥ ΠΡῸ ΠΡΟΣΏΠΟΥ ΣΟΥ , Ὃς ΚΑΤΑΣΚΕΥΆΣΕΙ ΤῊΝ ὉΔΌΝ ΣΟΥ ἜΜΠΡΟΣΘΈΝ ΣΟΥ , behold I send my messenger before Thy face, which shall prepare Thy way before Thee ) In the S. V. of [Malachi 3:1] , we read, ἰδοὺ ἐξαποστελῶ τὸν ἄγγελόν Μου , καὶ ἐπιβλέψεται ὀδὸν πρὸ προσώπου Μου , καὶ ἐξαίφνης ἥξει , κ . τ . λ ., behold I will send forth My messenger, and he shall survey the road before My face, and suddenly shall arrive , etc. Ἐγὼ , I ) The Father addressing the Son. τὸν ἄγγελόν Μου , My messenger ) John was sent by God as a messenger, after whom came the Messenger of the Covenant Himself. πρὸ προσώπου Σου , before Thy face ) Immediately before Thee. The LXX. have ἐξαίφνης ( immediately ) in the passage just quoted. John was not a prophet of distant events. See [Luke 1:76] . The advent of the Father and of the Son are the same, and so is the language which applies to them. It is one of the strongest arguments for the divinity of Christ, that those things which are said of Christ in the New Testament are quoted from the Old Testament, where they are predicated as exclusively belonging to God. See Gnomon on [John 12:41] ; [Acts 2:33] ; [Romans 9:33] ; [Romans 14:11] ; [1 Corinthians 1:31] ; [1 Corinthians 10:9] ; [Ephesians 4:8] ; [Hebrews 1:6] ; [Hebrews 1:8] ; [Hebrews 1:10-11] ; [Revelation 1:8] ; [Revelation 1:17] . [518] viz. His being &ldquo;a reed shaken by the wind,&rdquo; or &ldquo;a man clothed in soft raiment.&rdquo; See Gnomon in loc. (I. B.)"}], "11": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 11:11] . ἀμὴν λέγω ὑμῖν . First Christ expresses His personal conviction in solemn terms. What follows refers to John&rsquo;s intrinsic worth, not to his historic position as the forerunner. The latter rests on the prophetic citation. Christ&rsquo;s aim now is to say that the Baptist&rsquo;s character is equal to his position : that he is fit to be the forerunner. For Christ, being the forerunner is no matter of luck. God will see that the right man occupies the position; nay, none but the right man can successfully perform the part. οὐκ ἐγήγερται , there hath not arisen; passive with middle sense, but the arising non sine numine , &ldquo;surrexit divinitus, quomodo existunt veri Prophetae,&rdquo; Elsner; cf. [Matthew 24:11] , [Luke 7:16] , vide also [Judges 2:18] ; [Judges 3:9] . ἐν γεννητοῖς γυναικῶν = among mankind, a solemn way of expressing the idea. The meaning, however, is not that John is the greatest man that ever lived. The comparison moves within the sphere of Hebrew prophecy, and practically means: John the greatest of all the prophets. A bold judgment not easily accepted by the populace, who always think the dead greater than the living. Christ expresses Himself strongly because He means to say something that might appear disparaging. But He is in earnest in His high estimate, only it is not to be understood as asserting John&rsquo;s superiority in all respects, e.g. , in authorship. The point of view is capacity to render effective service to the Kingdom of God . ὁ δὲ μικρότερος . Chrysostom took this as referring to Jesus, and, connecting ἐν τ . β . τ . οὐρ . with μείζων , brought out the sense: He who is the less in age and fame is greater than John in the Kingdom of Heaven. The opinion might be disregarded as an exegetical curiosity, had it not been adopted by so many, not only among the ancients (Hilar., Ambr., Theophy., Euthy.), but also among moderns (Eras., Luth., Fritzsche). In the abstract it is a possible interpretation, and it expresses a true idea, but not one Jesus was likely to utter then. No doubt John&rsquo;s inquiry had raised the question of Christ&rsquo;s standing, and might seem to call for comparison between questioner and questioned. But Christ&rsquo;s main concern was not to get the people to think highly of Himself, but to have high thoughts of the kingdom. What He says, therefore, is that any one in the kingdom, though of comparatively little account, is greater than John. Even the least is; for though μικρότερος , even with the article, does not necessarily mean μικρότατος (so Bengel), it amounts to that. The affirmative holds even in case of the highest degree of inferiority. The implication is that John was not in the kingdom as a historical movement (a simple matter of fact), and the point of comparison is the dominant spirit. The moral sternness of John was his greatness and also his weakness. It made him doubt Jesus, kept him aloof from the kingdom, and placed him below any one who in the least degree understood Christ&rsquo;s gracious spirit, e.g. , one of the Twelve called in [Matthew 10:42] &ldquo;these little ones&rdquo;."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "11. ἐγήγερται ] Not merely a word of course, but especially used of prophets and judges, see reff., and once of our Saviour Himself, [Acts 5:30] . γεννητοῖς is most likely masculine. See reff. ὁ δὲ μικρότερος ] This has been variously rendered and understood. Chrysostom&rsquo;s interpretation is as follows: &ldquo; ὁ δὲ μικρότερος , ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστι .&rdquo; μικρότερος , κατὰ τὴν ἡλικίαν καὶ κατὰ τὴν τῶν πολλῶν δόξαν , καὶ γὰρ ἔλεγον αὐτὸν φάγον καὶ οἰνοπότην · καὶ &ldquo; οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός ;&rdquo; καὶ πανταχοῦ αὐτὸν ἐξηυτέλιζον . Hom. xxxvii. 2, p. 416. And a little afterwards: περὶ ἑαυτοῦ λέγων εἰκότως κρύπτει τὸ πρόσωπον διὰ τὴν ἔτι κρατοῦσαν ὑπόνοιαν καὶ τὸ μὴ δόξαι περὶ ἑαυτοῦ μέγα τι λέγειν · καὶ γὰρ πολλαχοῦ φαίνεται τοῦτο ποιῶν . τί δέ ἐστιν &ldquo; ἐν τῇ βασιλείᾳ τῶν οὐρανῶν ;&rdquo; ἐν τοῖς πνευματικοῖς καὶ τοῖς κατὰ τὸν οὐρανὸν ἅπασι . καὶ τὸ εἰπεῖν δὲ &ldquo; οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου &rdquo; ἀντιδιαστέλλοντος ἦν ἑαυτῷ τὸν Ἰωάννην , καὶ οὕτως ἑαυτὸν ὑπεξαιροῦντος . εἰ γὰρ καὶ γεννητὸς γυναικὸς ἦν αὐτός , ἀλλ ʼ οὐχ οὕτως ὡς Ἰωάννης · οὐ γὰρ ψιλὸς ἄνθρωπος ἦν , οὐδὲ ὁμοίως ἀνθρώπῳ ἐτέχθη , ἀλλὰ ξένον τινὰ τρόπον καὶ παράδοξον , ib. 2, 3, p. 417. So also Euthymius and Theophylact: but such an interpretation is surely adverse to the spirit of the whole discourse. We may certainly say that our Lord in such a passage as this would not designate Himself as ὁ μικρότερος compared with John, in any sense: nor again is it our Lord&rsquo;s practice to speak of Himself as one ἐν τῇ βασιλείᾳ τῶν οὐρανῶν , or of His own attributes as belonging to or dependent on that new order of things which this expression implies, and which was in Him rather than He in it. Besides, the bare use of the comparative ὁ μικρότερος , with its reference left to be inferred, is, unless I am mistaken, unprecedented. If this had been the meaning, we should surely have had αὐτοῦ after μικρότερος . Again, the analogy of such passages as [Matthew 5:19] ; [Matthew 18:1] , would lead us to connect the preceding adjective μικρότερος with ἐν τῇ β . τ . οὐ ., and not the following. The other, the usual interpretation, I am convinced, is the right one: but he that is least in the kingdom of heaven, is greater than he. The comparative with the article is not put for the superlative, although in English we are obliged to render it so, but signifies &lsquo; he that is less than all the rest &rsquo; (Winer, § 35. 4); and here is generic, of all the inferior ones. There is very likely an allusion to [Zechariah 12:8] ; &ldquo;He that is feeble among them at that day shall be as David.&rdquo; Thus the parallelism is complete: John , not inferior to any born of women but these, even the least of them , are born of another birth ([John 1:12-13] ; Joh 3:5 ). John , the nearest to the King and the Kingdom standing on the threshold but never having himself entered; these , ἐν τῇ βασιλείᾳ , subjects and citizens and indwellers of the realm, ὧν τὸ πολίτευμα ἐν οὐρανοῖς . He, the friend of the Bridegroom; they, however weak and unworthy members, His Body, and His Spouse . Meyer, giving in substance the above interpretation, believes that αὐτοῦ , i.e. Ἰωάν . τοῦ β ., is to be supplied after μικρότερος . This would be unobjectionable in sense , but is it, in usage? See reff., and remember that ἐν τ . βασ .… is equivalent in meaning to τῶν ἐν τ . βασιλείᾳ . Maldonatus (cited by Meyer) quotes the logical axiom, &lsquo;minimum maximi est majus maximo minimi.&rsquo;"}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 11:11] . Ἐν γενν . γυν .] among those born of woman . Intended to denote the category of men according to that nature which is peculiar to the whole race in virtue of its origin (mortality, weakness, sinfulness, and so on). Sir 10:18 . Comp. יְלוּד־אִשָּׁה , [Job 14:1] ; [Job 15:14] ; [Job 25:4] ; see also on [Galatians 4:4] . For ἐγήγερται (by God), comp. [Luke 7:16] ; [John 7:52] ; [Acts 13:22] f. μωίζων ] a greater, one more distinguished generally, and that just because he is this promised herald of God who was to precede the Messiah. The words do not warrant our interpreting them to mean: a greater prophet, as has been done by Rosenmüller, Kuinoel, and the older critics. ὁ δὲ μικρότερος , κ . τ . λ .] he, however, who is less in the kingdom of heaven is greater than he. It is to be observed, (1) that neither here nor elsewhere does the comparative stand for the superlative; (2) that, according to the context, the reference of the comparative (see μείζων Ἰωάννου , and afterwards μείζων αὐτοῦ ) need not be looked for elsewhere but in Ἰωάννου τοῦ βαπτιστοῦ ; [442] (3) that, since ὁ μικρότερος cannot refer to Jesus, it is ([Matthew 18:1] ; [Matthew 18:4] ) necessarily limited and defined by ἐν τῇ βασιλείᾳ τῶν οὐρανῶν , with which it has been connected by Isidore, Cyril, Theodoret, Heracleon (see Cramer, Cat . p. 85). Hence it is to be explained thus: But he who stands lower in the kingdom of the Messiah, stands (according to the divine standard) higher than he . Not as if John would be excluded (as against this, see [Matthew 10:41] ) from the kingdom of Messiah that was about to be established, but the standpoint of those who share in the kingdom is compared with the high position which, as still belonging to the ancient theocracy, the Baptist occupies in the αἰὼν οὗτος . There he is the greatest of all; yet he who is lower in the approaching kingdom of the Messiah, and can by no means compare himself with the eminent personage in question, is, nevertheless, greater than he. Thus the βασίλεια τῶν οὐρανῶν , raised above the Old Testament order of things, simply appears as the state of perfection towards which the theocracy, ending with John, its foremost representative, is only the first step . Others (Chrysostom, Hilary, Theophylact, Euth. Zigabenus, Erasmus, Luther, Melanchthon, Osiander, Jansen, Corn. a Lapide, Calovius, Fritzsche, Fleck, de regno div . p. 83) interpret: he who, as compared with him, retires into the shade (Jesus, μικρότερος κατὰ τὴν ἡλικίαν καὶ κατὰ τὴν πολλῶν δόξαν , Chrysostom) will, as Messiah, outshine him in the kingdom of heaven . These expositors have rightly understood the comparative μικρότερος as comparing some one with the Baptist; but how extremely improbable that Jesus, conscious as He was of a Messiahship that had been divinely confirmed at His baptism, and with the multitudes flocking around Him, would have spoken of Himself as μικρότερος than John the prisoner! And is it not utterly foreign to the context to suppose that He would here have compared Himself with the Baptist? Finally, were the ἐν τῇ βασιλείᾳ τῶν οὐρανῶν , again (referred to what follows), only an awkward toning down of the sharp character of the statement, it would have been far more sensible (since Jesus would m

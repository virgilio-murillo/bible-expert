ve already believed in\nJesus; but because they have not yet received His flesh and blood, Jesus has not yet trusted\nHimself to them. What must they do that Jesus may trust Himself to them? They must be\nborn again of water and of the Spirit; the Church that is in travail with them must bring\nthem forth. They have been conceived; they must be brought forth to the light: they have\nbreasts to be nourished at; let them not fear lest, being born, they may be smothered; let\nthem not depart from the mother’s breasts.", "lang": "latin", "orig": ""}, {"v": 24, "f": "Bede", "w": "", "t": "An admonition to us not to be confident of ourselves, but ever anxious and mistrustful; knowing that what escapes our own knowledge, cannot escape the eternal Judge.", "lang": "english", "orig": ""}, {"v": 24, "f": "Cyril of Alexandria", "w": "", "t": "Not firmly established is the judgment of new believers, nor is the mind firmly built upon fresh miracles. And how should they whose course of instruction was yet so to say green, be already rooted in piety? Therefore Christ doth not yet commit Himself to the novices, showing that a great thing and most worthy of love is affinity with God, and that it doth not just lie before those who desire to have it, but is achieved by zeal for good, and diligence and time.\n\nLet the stewards of the Mysteries of the Saviour hence learn, not suddenly to admit a man within the sacred veils, nor to permit to approach the Divine Tables, neophites untimely baptized and not in right time believing on Christ the Lord of all. For that He may be an Ensample to us in this also, and may teach us whom fittingly to initiate, He receives indeed the believers, but is seen not yet to have confidence in them, in that He does not commit Himself to them: that hence it may be manifest, that it befits novices to spend no small time under instruction; for scarce even so will they become faithful men.", "lang": "english", "orig": ""}, {"v": 24, "f": "Cyril of Alexandria", "w": "", "t": "Christ does not yet commit himself to such novices, showing that affinity with God is a great thing and most worthy of love. It does not just lie there before those who want to have it but is achieved by an intense desire for good, along with diligence and time. Let the stewards of the mysteries of the Savior learn then not to suddenly admit just anyone within the sacred veils or to permit them to approach the divine tables who are neophytes who might be untimely baptized and importunely believing on Christ the Lord of all. As an example to us in this also in teaching us whom rightly to initiate, he indeed receives the believers but is seen not yet to have confidence in them in that he does not commit himself to them, making clear that it is only right that novices spend no small time under instruction, for rarely even then will they become faithful.", "lang": "english", "orig": ""}, {"v": 24, "f": "Gospel of Peter", "w": "Section XV.", "t": "you, that for Sodom there\n1087 John ii. 23b.\n1088 John ii. 24.\n1089 The meaning is not apparent.\n1090 John ii. 25.\n1091 Luke x. 1.\n1092 Luke x. 2.\n1093 Luke x. 3.\n1094 Luke x. 4.\n1095 Luk", "lang": "greek", "orig": ""}, {"v": 24, "f": "Gospel of Peter", "w": "Section XV.", "t": "12 1087And many believed in him when they saw the signs which he was doing. 13,\n14 1088But Jesus did not trust1089 himself to them, 1090for he knew every man, and he\nneeded not any man to testify to him concerning every man; for he knew what was in man.", "lang": "greek", "orig": ""}, {"v": 24, "f": "Origen of Alexandria", "w": "", "t": "(tom. x. c. 28) Or, it was those who believed in His Name, not on Him, to whom Jesus would not commit Himself. They believe on Him, who follow the narrow way which leadeth unto life; they believe in His Name, who only believe the miracles.", "lang": "english", "orig": ""}, {"v": 24, "f": "Theophylact of Ohrid", "w": "", "t": "\"He Himself,\" it says, \"Jesus did not entrust Himself to them\" and did not transmit the full teaching, as to those who did not truly believe, penetrating into their hearts (Ps. 93:11; Jer. 17:10) and knowing what was in them concerning Him. For it was not hidden from Him what the thought was in each person who apparently believed.", "lang": "english", "orig": ""}, {"v": 24, "f": "Thomas Aquinas", "w": "", "t": "The attitude of Jesus to those who believed in him is shown when he says, But Jesus did not trust himself to them, i.e., those who had believed in him. What is this, men entrust themselves to God, and Jesus himself does not entrust himself to them? Could they kill him against his will? Some will say that he did not trust himself to them because he knew that their belief was not genuine. But if this were true, the Evangelist would surely not have said that many believed in his name, and yet he did not trust himself to them. According to Chrysostom, the reason is that they did believe in him, but imperfectly, because they were not yet able to attain to the profound mysteries of Christ, and so Jesus did not trust himself to them, i.e., he did not yet reveal his secret mysteries to them; for there were many things he would not reveal even to the apostles: \"I still have many things to say to you, but you cannot bear them now\" (below 16:12), and \"I could not speak to you as spiritual persons, but as sensual\" (1 Cor 3:1). And so it is significant that in order to show that they believed imperfectly, the Evangelist does not say that they believed \"in him,\" because they did not yet believe in his divinity, but he says, in his name, i.e., they believed what was said about him, nominally, i.e., that he was just, or something of that sort.\n\nOr, according to Augustine, these people represent the catechumens in the Church, who, although they believe in the name of Christ, Jesus does not tr", "lang": "english", "orig": ""}, {"v": 25, "f": "Arnobius of Sicca", "w": "", "t": "Was He one of us, I say, who by one act of intervention at once healed a hundred or more afflicted with various infirmities and diseases; at whose word only the raging and maddened seas were still, the whirlwinds and tempests were lulled; who walked over the deepest pools with unwet foot; who trod the ridges of the deep, the very waves being astonished, and nature coming under bondage; who with five loaves satisfied five thousand of His followers: and who, lest it might appear to the unbelieving and hard of heart to be an illusion, filled twelve capacious baskets with the fragments that remained? Was He one of us, who ordered the breath that had departed to return to the body, persons buried to come forth from the tomb, and after three days to be loosed from the swathings of the undertaker? Was He one of us, who saw clearly in the hearts of the silent what each was pondering, what each had in his secret thoughts?", "lang": "english", "orig": ""}, {"v": 25, "f": "Augustine - Confessions", "w": "Sermon L.", "t": ". 57.\n3247 Phil. ii. 21.\n3248 Matt. vii. 21.\n3249 John ii. 25.\n3250 Luke ix. 58.\n3251 Luke ix. 59.\n\n\nquite ready, “I will follow Thee whithersoever Thou goest;” and yet Thou sayest to another\nwho hath no such wish, “Follow thou Me.” “The first,” saith He, “I de", "lang": "latin", "orig": ""}, {"v": 25, "f": "Augustine of Hippo", "w": "", "t": "\"Because He knew all men, and needed not that any should bear witness of man: for Himself knew what was in man.\" The artificer knew what was in His own work better than the work knew what was in itself. The Creator of man knew what was in man, which the created man himself knew not. Do we not prove this of Peter, that he knew not what was in himself, when he said, \"With Thee, even to death\"? Hear that the Lord knew what was in man: \"Thou with me even to death? Verily, verily, I say unto thee, Before the cock crow, thou shalt deny me thrice.\" The man, then, knew not what was in himself; but the Creator of the man knew what was in the man.", "lang": "english", "orig": ""}, {"v": 25, "f": "Augustine of Hippo", "w": "", "t": "(Tr. xi. c. 2) The Maker knew better what was in His own work, than the work knew what was in itself. Peter knew not what was in himself when he said, I will go with Thee unto death; (Luke 22:33. ver. 61) but our Lord's answer showed that He knew what was in man; Before the cock crow, thou shalt thrice deny Me.", "lang": "english", "orig": ""}, {"v": 25, "f": "Cyril of Alexandria", "w": "", "t": "truly God doth the Psalmist ascribe it, saying, He fashioneth their hearts alike, He considereth all |166 their works. But if while God Alone understandeth what is in us, Christ understandeth them: how shall He not be God by Nature, Who knoweth the secrets, and knoweth the deep and secret things, as it is written? For what man knoweth the things of a man, save the spirit of man which is in him? Though no man knoweth, God will not be ignorant, for neither is He reckoned in the number of all, of whom \"No man\" may rightly be predicated, but as being external to all, and all things under His Feet, He will know. And Paul too will testify, saying, For the word of God is quick and powerful and sharper than any two edged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and is a discerner of the thoughts and intents of the heart: neither is there any creature that is not manifest in His sight, but all things are naked and opened unto the Eyes of Him. For as having planted the ear, He hears all things, and as having formed the eye, He observeth. And indeed He is introduced saying in Job, Who is this that hideth counsel from Me, holding words in his heart, and thinketh to conceal them from Me? In order then that we might acknowledge that the Son is by Nature God, needs does the Evangelist say that He needed not that any should testify of man, for He knew what was in man.", "lang": "english", "orig": ""}, {"v": 25, "f": "Gospel of Peter", "w": "Section XV.", "t": "hn ii. 24.\n1089 The meaning is not apparent.\n1090 John ii. 25.\n1091 Luke x. 1.\n1092 Luke x. 2.\n1093 Luke x. 3.\n1094 Luke x. 4.\n1095 Luk", "lang": "greek", "orig": ""}, {"v": 25, "f": "Irenaeus", "w": "", "t": "For inasmuch as the Word of God was man from the root of Jesse, and son of Abraham, in this respect did the Spirit of God rest upon Him, and anoint Him to preach the Gospel to the lowly. But inasmuch as He was God, He did not judge according to glory, nor reprove after the manner of speech. For \"He needed not that any should testify to Him of man, for He Himself knew what was in man.\" For He called all men that mourn; and granting forgiveness to those who had been led into captivity by their sins, He loosed them from their chains.", "lang": "english", "orig": ""}, {"v": 25, "f": "Theodore of Mopsuestia", "w": "", "t": "If they believed, why did he not entrust himself to them? Clearly the words “many believed in him” are not said about a firm and true faith, such as the faith of those who, after believing once that his words were true, considered him as a doctor of truth, without doubting the things said by him. That kind of faith is typical of the true believers. But here, John refers to people who were astonished by the events that happened and praised him as a great and admirable man. In fact, not all of them approved his words by showing their respect for him to others. Such respect, too, is typical of true believers. So, he added, “But Jesus on his part would not entrust himself to them.” In these words there is a particular doctrine of the true faith. Indeed, the virtue of the knowledge of Christ is revealed through which he was not cheated by the outward appearance of those coming to him. Rather by recognizing precisely each of them for who they were, he knew already who were the true disciples and who were in doubt and coming to him under false pretenses.", "lang": "english", "orig": ""}, {"v": 25, "f": "Thomas Aquinas", "w": "", "t": "The universal knowledge of Christ is then described: for he knew not only those who were on close terms with him, but strangers too. And therefore he says, for he knew all men; and this by the power of his divinity: \"The eyes of the Lord are far brighter than the sun\" (Sir 23:28). Now a man, although he may know other people, cannot have a sure knowledge of them, because he sees only what appears; consequently, he must rely on the testimony of others. But Christ knows with the greatest certainty, because he beholds the heart; and so he did not need anyone to give him testimony about men. In fact, he is the one who gives testimony: \"Look, my witness is in heaven\" (Jb 16:20).\n\nHis knowledge was perfect, because it extended not only to what was exterior, but even to the interior; thus he says, He was well aware of what was in man's heart, i.e., the secrets of the heart: \"Hell and destruction are open to the Lord: how much more the hearts of the children of men\" (Prv 15:11).", "lang": "english", "orig": ""}, {"v": 25, "f": "npnf204", "w": "Chapter XXVII.—Texts Explained; Tenthly, Matthew xi. 27; John iii. 35, U+0026c. These texts intended\nto preclude the Sabellian notion of the Son; they fall in with the Catholic doctrine\nconcerning the Son; they are explained by ‘so’ in John v. 26. (Anticipation of the next\nchapter.) Again they are used with reference to our Lord’s human nature; for our sake,\nthat we might receive and not lose, as receiving in Him. And consistently with other parts\nof Scripture, which shew that He had the power, U+0026c., before He received it. He was God\nand man, and His actions are often at once divine and human.", "t": "l opinion. vid. §45, n. 2.\n3074 John xi. 14.\n3075 John ii. 25; xiv. 11.\n3076 Or. ii. 8, n. 3.\n\n\nHe raise the dead; and He shewed to all that He who quickens the dead and recalls the soul,\nmuch more discerns the secret of all. And He knew where Lazarus lay, and", "lang": "greek", "orig": ""}], "xrefs": [{"v": 4, "ref": "John 12:23", "rel": "cross-reference", "text": {"es": "Entonces Jesús les respondió, diciendo: La hora viene en que el Hijo del hombre ha de ser glorificado.", "gr": "ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου."}}, {"v": 4, "ref": "John 13:1", "rel": "cross-reference", "text": {"es": "ANTES de la fiesta de la Pascua, sabiendo Jesús que su hora había venido para que pasase de este mundo al Padre, como había amado á los suyos que estaban en el mundo, amólos hasta el fin.", "gr": "Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς."}}, {"v": 4, "ref": "John 7:30", "rel": "cross-reference", "text": {"es": "Entonces procuraban prenderle; mas ninguno puso en él mano, porque aun no había venido su hora.", "gr": "ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ."}}, {"v": 4, "ref": "John 7:6", "rel": "cross-reference", "text": {"es": "Díceles entonces Jesús: Mi tiempo aun no ha venido; mas vuestro tiempo siempre está presto.", "gr": "λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος."}}, {"v": 4, "ref": "John 8:20", "rel": "cross-reference", "text": {"es": "Estas palabras habló Jesús en el lugar de las limosnas, enseñando en el templo: y nadie le prendió; porque aun no había venido su hora.", "gr": "ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ."}}, {"v": 5, "ref": "Acts 9:6", "rel": "cross-reference", "text": {"es": "El, temblando y temeroso, dijo: ¿Señor, qué quieres que haga? Y el Señor le dice: Levántate y entra en la ciudad, y se te dirá lo que te conviene hacer.", "gr": "ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν."}}, {"v": 5, "ref": "Genesis 6:22", "rel": "cross-reference", "text": {"es": "E hízolo así Noé; hizo conforme á todo lo que Dios le mandó.", "gr": ""}}, {"v": 5, "ref": "Hebrews 11:8", "rel": "cross-reference", "text": {"es": "Por la fe Abraham, siendo llamado, obedeció para salir al lugar que había de recibir por heredad; y salió sin saber dónde iba.", "gr": "⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται."}}, {"v": 5, "ref": "Hebrews 5:9", "rel": "cross-reference", "text": {"es": "Y consumado, vino á ser causa de eterna salud á todos los que le obedecen;", "gr": "καὶ τελειωθεὶς ἐγένετο ⸂πᾶσιν τοῖς ὑπακούουσιν αὐτῷ⸃ αἴτιος σωτηρίας αἰωνίου,"}}, {"v": 5, "ref": "John 15:14", "rel": "cross-reference", "text": {"es": "Vosotros sois mis amigos, si hiciereis las cosas que yo os mando.", "gr": "ὑμεῖς φίλοι μού ἐστε ἐὰν ποιῆτε ⸀ἃ ἐγὼ ἐντέλλομαι ὑμῖν."}}, {"v": 5, "ref": "Luke 5:5", "rel": "cross-reference", "text": {"es": "Y respondiendo Simón, le dijo: Maestro, habiendo trabajado toda la noche, nada hemos tomado; mas en tu palabra echaré la red.", "gr": "καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃."}}, {"v": 5, "ref": "Luke 5:6", "rel": "cross-reference", "text": {"es": "Y habiéndolo hecho, encerraron gran multitud de pescado, que su red se rompía.", "gr": "καὶ τοῦτο ποιήσαντες συνέκλεισαν πλῆθος ἰχθύων πολύ, ⸀διερρήσσετο δὲ ⸂τὰ δίκτυα⸃ αὐτῶν."}}, {"v": 5, "ref": "Luke 6:46", "rel": "cross-reference", "text": {"es": "¿Por qué me llamáis, Señor, Señor, y no hacéis lo que digo?", "gr": "Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;"}}, {"v": 10, "ref": "Revelation 7:16", "rel": "cross-reference", "text": {"es": "No tendrán más hambre, ni sed, y el sol no caerá más sobre ellos, ni otro ningún calor.", "gr": "οὐ πεινάσουσιν ἔτι ⸀οὐδὲ διψήσουσιν ἔτι, οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος οὐδὲ πᾶν καῦμα,"}}, {"v": 10, "ref": "Revelation 7:17", "rel": "cross-reference", "text": {"es": "Porque el Cordero que está en medio del trono los pastoreará, y los guiará á fuentes vivas de aguas: y Dios limpiará toda lágrima de los ojos de ellos.", "gr": "ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν."}}, {"v": 11, "ref": "John 1:14", "rel": "cross-reference", "text": {"es": "Y aquel Verbo fué hecho carne, y habitó entre nosotros (y vimos su gloria, gloria como del unigénito del Padre), lleno de gracia y de verdad.", "gr": "Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·"}}, {"v": 11, "ref": "John 20:30", "rel": "cross-reference", "text": {"es": "Y también hizo Jesús muchas otras señales en presencia de sus discípulos, que no están escritas en este libro.", "gr": "Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·"}}, {"v": 11, "ref": "John 20:31", "rel": "cross-reference", "text": {"es": "Estas empero son escritas, para que creáis que Jesús es el Cristo, el Hijo de Dios; y para que creyendo, tengáis vida en su nombre.", "gr": "ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ."}}, {"v": 11, "ref": "John 3:2", "rel": "cross-reference", "text": {"es": "Este vino á Jesús de noche, y díjole: Rabbí, sabemos que has venido de Dios por maestro; porque nadie puede hacer estas señales que tú haces, si no fuere Dios con él.", "gr": "οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ."}}, {"v": 16, "ref": "Isaiah 56:11", "rel": "cross-reference", "text": {"es": "Y esos perros ansiosos no conocen hartura; y los mismos pastores no supieron entender: todos ellos miran á sus caminos, cada uno á su provecho, cada uno por su cabo.", "gr": ""}}, {"v": 16, "ref": "Isaiah 56:5", "rel": "cross-reference", "text": {"es": "Yo les daré lugar en mi casa y dentro de mis muros, y nombre mejor que el de hijos é hijas; nombre perpetuo les daré que nunca perecerá.", "gr": ""}}, {"v": 16, "ref": "Jeremiah 7:11", "rel": "cross-reference", "text": {"es": "¿Es cueva de ladrones delante de vuestros ojos esta casa, sobre la cual es invocado mi nombre? He aquí que también yo veo, dice Jehová.", "gr": ""}}, {"v": 16, "ref": "Luke 2:49", "rel": "cross-reference", "text": {"es": "Entonces él les dice: ¿Qué hay? ¿por qué me buscabais? ¿No sabíais que en los negocios de mi Padre me conviene estar?", "gr": "καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;"}}, {"v": 16, "ref": "Mark 11:17", "rel": "cross-reference", "text": {"es": "Y les enseñaba diciendo: ¿No está escrito que mi casa, casa de oración será llamada por todas las gentes? Mas vosotros la habéis hecho cueva de ladrones.", "gr": "καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν."}}, {"v": 16, "ref": "Matthew 21:13", "rel": "cross-reference", "text": {"es": "Y les dice: Escrito está: Mi casa, casa de oración será llamada; mas vosotros cueva de ladrones la habéis hecho.", "gr": "καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν."}}, {"v": 17, "ref": "Psalms 119:139", "rel": "cross-reference", "text": {"es": "Mi celo me ha consumido; Porque mis enemigos se olvidaron de tus palabras.", "gr": ""}}, {"v": 17, "ref": "Psalms 69:9", "rel": "cross-reference", "text": {"es": "Porque me consumió el celo de tu casa; Y los denuestos de los que te vituperaban, cayeron sobre mí.", "gr": ""}}, {"v": 19, "ref": "Mark 14:58", "rel": "cross-reference", "text": {"es": "Nosotros le hemos oído decir: Yo derribaré este templo que es hecho de mano, y en tres días edificaré otro echo sin mano.", "gr": "ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·"}}, {"v": 19, "ref": "Mark 15:29", "rel": "cross-reference", "text": {"es": "Y los que pasaban le denostaban, meneando sus cabezas, y diciendo: ¡Ah! tú que derribas el templo de Dios, y en tres días lo edificas,", "gr": "Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,"}}, {"v": 19, "ref": "Matthew 26:60", "rel": "cross-reference", "text": {"es": "Y no lo hallaron, aunque muchos testigos falsos se llegaban; mas á la postre vinieron dos testigos falsos,", "gr": "καὶ οὐχ εὗρον ⸂πολλῶν προσελθόντων ψευδομαρτύρων. ὕστερον δὲ προσελθόντες δύο⸃"}}, {"v": 19, "ref": "Matthew 26:61", "rel": "cross-reference", "text": {"es": "Que dijeron: Este dijo: Puedo derribar el templo de Dios, y en tres días reedificarlo.", "gr": "εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι."}}, {"v": 19, "ref": "Matthew 27:40", "rel": "cross-reference", "text": {"es": "Y diciendo: Tú, el que derribas el templo, y en tres días lo reedificas, sálvate á ti mismo: si eres Hijo de Dios, desciende de la cruz.", "gr": "καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ."}}, {"v": 21, "ref": "1 Corinthians 6:19", "rel": "cross-reference", "text": {"es": "¿O ignoráis que vuestro cuerpo es templo del Espíritu Santo, el cual está en vosotros, el cual tenéis de Dios, y que no sois vuestros?", "gr": "ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,"}}, {"v": 24, "ref": "1 Chronicles 28:9", "rel": "cross-reference", "text": {"es": "Y tú, Salomón, hijo mío, conoce al Dios de tu padre, y sírvele con corazón perfecto, y con ánimo voluntario; porque Jehová escudriña los corazones de todos, y entiende toda imaginación de los pensamientos. Si tú le buscares, lo hallarás; mas si lo dejares, él te desechará para siempre.", "gr": ""}}, {"v": 24, "ref": "Acts 1:24", "rel": "cross-reference", "text": {"es": "Y orando, dijeron: Tú, Señor, que conoces los corazones de todos, muestra cuál escoges de estos dos,", "gr": "καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,"}}, {"v": 24, "ref": "Hebrews 4:13", "rel": "cross-reference", "text": {"es": "Y no hay cosa criada que no sea manifiesta en su presencia; antes todas las cosas están desnudas y abiertas á los ojos de aquel á quien tenemos que dar cuenta.", "gr": "καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος."}}, {"v": 24, "ref": "John 6:64", "rel": "cross-reference", "text": {"es": "Mas hay algunos de vosotros que no creen. Porque Jesús desde el principio sabía quiénes eran los que no creían, y quién le había de entregar.", "gr": "ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν."}}, {"v": 24, "ref": "Matthew 9:4", "rel": "cross-reference", "text": {"es": "Y viendo Jesús sus pensamientos, dijo: ¿Por qué pensáis mal en vuestros corazones?", "gr": "καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;"}}, {"v": 25, "ref": "John 13:11", "rel": "cross-reference", "text": {"es": "Porque sabía quién le había de entregar; por eso dijo: No estáis limpios todos.", "gr": "ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε."}}, {"v": 25, "ref": "Matthew 9:4", "rel": "cross-reference", "text": {"es": "Y viendo Jesús sus pensamientos, dijo: ¿Por qué pensáis mal en vuestros corazones?", "gr": "καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;"}}], "apparatus": [], "morphology": {"1": [{"w": "Καὶ", el vino, la madre de Jesús le dijo: Vino no tienen.", "4": "Y dícele Jesús: ¿Qué tengo yo contigo, mujer? aun no ha venido mi hora.", "5": "Su madre dice á los que servían: Haced todo lo que os dijere.", "6": "Y estaban allí seis tinajuelas de piedra para agua, conforme á la purificación de los Judíos, que cabían en cada una dos ó tres cántaros.", "7": "Díceles Jesús: Henchid estas tinajuelas de agua. E hinchiéronlas hasta arriba.", "8": "Y díceles: Sacad ahora, y presentad al maestresala. Y presentáron le.", "9": "Y como el maestresala gustó el agua hecha vino, que no sabía de dónde era (mas lo sabían los sirvientes que habían sacado el agua), el maestresala llama al esposo,", "10": "Y dícele: Todo hombre pone primero el buen vino, y cuando están satisfechos, entonces lo que es peor; mas tú has guardado el buen vino hasta ahora.", "11": "Este principio de señales hizo Jesús en Caná de Galilea, y manifestó su gloria; y sus discípulos creyeron en él.", "12": "Después de esto descendió á Capernaun, él, y su madre, y hermanos, y discípulos; y estuvieron allí no muchos días.", "13": "Y estaba cerca la Pascua de los Judíos; y subió Jesús á Jerusalem.", "14": "Y halló en el templo á los que vendían bueyes, y ovejas, y palomas, y á los cambiadores sentados.", "15": "Y hecho un azote de cuerdas, echólos á todos del templo, y las ovejas, y los bueyes; y derramó los dineros de los cambiadores, y trastornó las mesas;", "16": "Y á los que vendían las palomas, dijo: Quitad de aquí esto, y no hagáis la casa de mi Padre casa de mercado.", "17": "Entonces se acordaron sus discípulos que está escrito: El celo de tu casa me comió.", "18": "Y los Judíos respondieron, y dijéronle: ¿Qué señal nos muestras de que haces esto?", "19": "Respondió Jesús, y díjoles: Destruid este templo, y en tres días lo levantaré.", "20": "Dijeron luego los Judíos: En cuarenta y seis años fue este templo edificado, ¿y tú en tres días lo levantarás?", "21": "Mas él hablaba del templo de su cuerpo.", "22": "P ote de cuerdas, echólos á todos del templo, y las ovejas, y los bueyes; y derramó los dineros de los cambiadores, y trastornó las mesas;", "16": "Y á los que vendían las palomas, dijo: Quitad de aquí esto, y no hagáis la casa de mi Padre casa de mercado.", "17": "Entonces se acordaron sus discípulos que está escrito: El celo de tu casa me comió.", "18": "Y los Judíos respondieron, y dijéronle: ¿Qué señal nos muestras de que haces esto?", "19": "Respondió Jesús, y díjoles: Destruid este templo, y en tres días lo levantaré.", "20": "Dijeron luego los Judíos: En cuarenta y seis años fue este templo edificado, ¿y tú en tres días lo levantarás?", "21": "Mas él hablaba del templo de su cuerpo.", "22": "Por tanto, cuando resucitó de los muertos, sus discípulos se acordaron que había dicho esto; y creyeron á la Escritura, y á la palabra que Jesús había dicho.", "23": "Y estando en Jerusalem en la Pascua, en el día de la fiesta, muchos creyeron en su nombre, viendo las señales que hacía.", "24": "Mas el mismo Jesús no se confiaba á sí mismo de ellos, porque él conocía á todos,", "25": "Y no tenía necesidad que alguien le diese testimonio del hombre; porque él sabía lo que había en el hombre."}, "RVR1909": {"1": "Y AL tercer día hiciéronse unas bodas en Caná de Galilea; y estaba allí la madre de Jesús.", "2": "Y fué también llamado Jesús y sus discípulos á las bodas.", "3": "Y faltando el vino, la madre de Jesús le dijo: Vino no tienen.", "4": "Y dícele Jesús: ¿Qué tengo yo contigo, mujer? aun no ha venido mi hora.", "5": "Su madre dice á los que servían: Haced todo lo que os dijere.", "6": "Y estaban allí seis tinajuelas de piedra para agua, conforme á la purificación de los Judíos, que cabían en cada una dos ó tres cántaros.", "7": "Díceles Jesús: Henchid estas tinajuelas de agua. E hinchiéronlas hasta arriba.", "8": "Y díceles: Sacad ahora, y presentad al maestresala. Y presentáron le.", "9": "Y como el maestresala gustó el agua hecha vino, que no sabía de dónde era (mas l ere:", "2": "And both Jesus was called, and his disciples, to the marriage.", "3": "And when they wanted wine, the mother of Jesus saith unto him, They have no wine.", "4": "Jesus saith unto her, Woman, what have I to do with thee? mine hour is not yet come.", "5": "His mother saith unto the servants, Whatsoever he saith unto you, do it. ", "6": "And there were set there six waterpots of stone, after the manner of the purifying of the Jews, containing two or three firkins apiece.", "7": "Jesus saith unto them, Fill the waterpots with water. And they filled them up to the brim.", "8": "And he saith unto them, Draw out now, and bear unto the governor of the feast. And they bare it. ", "9": "When the ruler of the feast had tasted the water that was made wine, and knew not whence it was: (but the servants which drew the water knew;) the governor of the feast called the bridegroom,", "10": "And saith unto him, Every man at the beginning doth set forth good wine; and when men have well drunk, then that which is worse: but thou hast kept the good wine until now.", "11": "This beginning of miracles did Jesus in Cana of Galilee, and manifested forth his glory; and his disciples believed on him.", "12": "After this he went down to Capernaum, he, and his mother, and his brethren, and his disciples: and they continued there not many days.", "13": "And the Jews’ passover was at hand, and Jesus went up to Jerusalem,", "14": "And found in the temple those that sold oxen and sheep and doves, and the changers of money sitting:", "15": "And when he had made a scourge of small cords, he drove them all out of the temple, and the sheep, and the oxen; and poured out the changers’ money, and overthrew the tables;", "16": "And said unto them that sold doves, Take these things hence; make not my Father’s house an house of merchandise.", "17": "And his disciples remembered that it was written, The zeal of thine house hath eaten me up.", "18": "Then answered the Jews and said unto him, What sign shewest thou unto us, seeing that thou doest these things?", "19": "Jesus answered and said unto them, Destroy this temple, and in three days I will raise it up.", "20": "Then said the Jews, Forty and six years was this temple in building, and wilt thou rear it up in three days?", "21": "But he spake of the temple of his body.", "22": "When therefore he was risen from the dead, his disciples remembered that he had said this unto them; and they believed the scripture, and the word which Jesus had said.", "23": "Now when he was in Jerusalem at the passover, in the feast day, many believed in his name, when they saw the miracles which he did.", "24": "But Jesus did not commit himself unto them, because he knew all men, ", "25": "And needed not that any should testify of man: for he knew what was in man. "}, "ASV": {"1": "And the third day there was a marriage in Cana of Galilee; and the mother of Jesus was there: ", "2": "and Jesus also was bidden, and his disciples, to the marriage. ", "3": "And when the wine failed, the mother of Jesus saith unto him, They have no wine. ", "4": "And Jesus saith unto her, Woman, what have I to do with thee? mine hour is not yet come. ", "5": "His mother saith unto the servants, Whatsoever he saith unto you, do it. ", "6": "Now there were six waterpots of stone set there after the Jews’ manner of purifying, containing two or three firkins apiece. ", "7": "Jesus saith unto them, Fill the waterpots with water. And they filled them up to the brim. ", "8": "And he saith unto them, Draw out now, and bear unto the ruler of the feast. And they bare it. ", "9": "And when the ruler of the feast tasted the water now become wine, and knew not whence it was (but the servants that had drawn the water knew), the ruler of the feast calleth the bridegroom, ", "10": "and saith unto him, Every man setteth on first the good wine; and when men have drunk freely, then that which is worse: thou hast kept the good wine until now. ", "11": "This beginning of his signs did Jesus in Cana of Galilee, and manifested his glory; and his disciples believed on him. ", "12": "After this he went down to Capernaum, he, and his mother, andhisbrethren, and his disciples; and there they abode not many days. ", "13": "And the passover of the Jews was at hand, and Jesus went up to Jerusalem. ", "14": "And he found in the temple those that sold oxen and sheep and doves, and the changers of money sitting: ", "15": "and he made a scourge of cords, and cast all out of the temple, both the sheep and the oxen; and he poured out the changers’ money, and overthrew their tables; ", "16": "and to them that sold the doves he said, Take these things hence; make not my Father’s house a house of merchandise. ", "17": "His disciples remembered that it was written, Zeal for thy house shall eat me up. ", "18": "The Jews therefore answered and said unto him, What sign showest thou unto us, seeing that thou doest these things? ", "19": "Jesus answered and said unto them, Destroy this temple, and in three days I will raise it up. ", "20": "The Jews therefore said, Forty and six years was this temple in building, and wilt thou raise it up in three days? ", "21": "But he spake of the temple of his body. ", "22": "When therefore he was raised from the dead, his disciples remembered that he spake this; and they believed the scripture, and the word which Jesus had said. ", "23": "Now when he was in Jerusalem at the passover, during the feast, many believed on his name, beholding his signs which he did. ", "24": "But Jesus did not trust himself unto them, for that he knew all men, ", "25": "and because he needed not that any one should bear witness concerning man; for he himself knew what was in man.  "}, "BSB": {"1": "On the third day a wedding took place at Cana in Galilee. Jesus’ mother was there, ", "2": "and Jesus and His disciples had also been invited to the wedding. ", "3": "When the wine ran out, Jesus’ mother said to Him, “They have no more wine.” ", "4": "“Woman, why does this concern us?” Jesus replied. “My hour has not yet come.” ", "5": "His mother said to the servants, “Do whatever He tells you.” ", "6": "Now six stone water jars had been set there for the Jewish rites of purification. Each could hold from twenty to thirty gallons.", "7": "Jesus told the servants, “Fill the jars with water.”  So they filled them to the brim. ", "8": "“Now draw some out,” He said, “and take it to the master of the banquet.”  They did so, ", "9": "and the master of the banquet tasted the water that had been turned into wine. He did not know where it was from, but the servants who had drawn the water knew. Then he called the bridegroom aside ", "10": "and said, “Everyone serves the fine wine first, and then the cheap wine after the guests are drunk. But you have saved the fine wine until now!” ", "11": "Jesus performed this, the first of His signs, at Cana in Galilee. He thus revealed His glory, and His disciples believed in Him. ", "12": "  After this, He went down to Capernaum with His mother and brothers and His disciples, and they stayed there a few days. ", "13": "When the Jewish Passover was near, Jesus went up to Jerusalem. ", "14": "In the temple courts He found men selling cattle, sheep, and doves, and money changers seated at their tables. ", "15": "So He made a whip out of cords and drove all from the temple courts, both sheep and cattle. He poured out the coins of the money changers and overturned their tables. ", "16": "To those selling doves He said, “Get these out of here! How dare you turn My Father’s house into a marketplace!” ", "17": "His disciples remembered that it is written: “Zeal for Your house will consume Me.” ", "18": "On account of this, the Jews demanded, “What sign can You show us to prove Your authority to do these things?” ", "19": "Jesus answered, “Destroy this temple, and in three days I will raise it up again.” ", "20": "“This temple took forty-six years to build,” the Jews replied, “and You are going to raise it up in three days?” ", "21": "But Jesus was speaking about the temple of His body. ", "22": "After He was raised from the dead, His disciples remembered that He had said this. Then they believed the Scripture and the word that Jesus had spoken. ", "23": "While He was in Jerusalem at the Passover Feast, many people saw the signs He was doing and believed in His name. ", "24": "But Jesus did not entrust Himself to them, for He knew them all. ", "25": "He did not need any testimony about man, for He knew what was in a man. "}, "Darby": {"1": "And on the third day a marriage took place in Cana of Galilee, and the mother of Jesus was there. ", "2": "And Jesus also, and his disciples, were invited to the marriage. ", "3": "And wine being deficient, the mother of Jesus says to him, They have no wine. ", "4": "Jesus says to her, What have I to do with thee, woman? mine hour has not yet come. ", "5": "His mother says to the servants, Whatever he may say to you, do. ", "6": "Now there were standing there six stone water-vessels, according to the purification of the Jews, holding two or three measures each. ", "7": "Jesus says to them, Fill the water-vessels with water. And they filled them up to the brim. ", "8": "And he says to them, Draw out now, and carry [it] to the feast-master. And they carried [it]. ", "9": "But when the feast-master had tasted the water which had been made wine (and knew not whence it was, but the servants knew who drew the water), the feast-master calls the bridegroom, ", "10": "and says to him, Every man sets on first the good wine, and when [men] have well drunk, then the inferior; thou hast kept the good wine till now. ", "11": "This beginning of signs did Jesus in Cana of Galilee, and manifested his glory; and his disciples believed on him. ", "12": "After this he descended to Capernaum, he and his mother and his brethren and his disciples; and there they abode not many days. ", "13": "And the passover of the Jews was near, and Jesus went up to Jerusalem. ", "14": "And he found in the temple the sellers of oxen and sheep and doves, and the money-changers sitting; ", "15": "and, having made a scourge of cords, he cast [them] all out of the temple, both the sheep and the oxen; and he poured out the change of the money-changers, and overturned the tables, ", "16": "and said to the sellers of doves, Take these things hence; make not my Father's house a house of merchandise. ", "17": "[And] his disciples remembered that it is written, The zeal of thy house devours me. ", "18": "The Jews therefore answered and said to him, What sign shewest thou to us, that thou doest these things? ", "19": "Jesus answered and said to them, Destroy this temple, and in three days I will raise it up. ", "20": "The Jews therefore said, Forty and six years was this temple building, and thou wilt raise it up in three days? ", "21": "But he spoke of the temple of his body. ", "22": "When therefore he was raised from among [the] dead, his disciples remembered that he had said this, and believed the scripture and the word which Jesus had spoken. ", "23": "And when he was in Jerusalem, at the passover, at the feast, many believed on his name, beholding his signs which he wrought. ", "24": "But Jesus himself did not trust himself to them, because he knew all [men], ", "25": "and that he had not need that any should testify of man, for himself knew what was in man.   "}, "LITV": {"1": "And on the third day a marriage took place in Cana of Galilee, and the mother of Jesus was there. ", "2": "And Jesus and His disciples also were invited to the marriage. ", "3": "And being short of wine, the mother of Jesus said to Him, They have no wine. ", "4": "Jesus said to her, What is that to Me and to you, woman? My hour has not yet come. ", "5": "His mother said to the servants, Whatever He says to you, do. ", "6": "And there were six stone waterpots standing, according to the purification of the Jews, each containing two or three measures. ", "7": "Jesus said to them, Fill the waterpots with water. And they filled them to the top. ", "8": "And He said to them, Now draw out and carry to the master of the feast. And they carried it. ", "9": "But when the master of the feast tasted the water that had become wine, and did not know from where it was (but the servants drawing the water knew), the master of the feast called the bridegroom, ", "10": "and he said to him, Every man first sets on the good wine, and when they have drunk freely, then the worse. You have kept the good wine until now. ", "11": "This beginning of the miracles Jesus did in Cana of Galilee. And it revealed His glory, and His disciples believed in Him.   ", "12": "After this He went down to Capernaum, He and His mother and His brothers and His disciples. And He remained there not many days. ", "13": "And the Passover of the Jews was near. And Jesus went up to Jerusalem. ", "14": "And He found those selling oxen and sheep and doves in the temple, and the money changers sitting. ", "15": "And making a whip out of ropes, He threw all out of the temple, both the sheep, and the oxen, and the money changers, pouring out the money and overturning the tables. ", "16": "And to the ones selling the doves, He said, Take these things from here! Do not make My Father's house a house of merchandise. ", "17": "And His disciples remembered that it was written, \"The zeal of Your house has consumed Me.\" Psa. 69:9 ", "18": "Then the Jews answered and said to Him, What sign do you show to us, since you do these things? ", "19": "Jesus said to them, Destroy this sanctuary, and in three days I will raise it up. ", "20": "Then the Jews said, This sanctuary was forty six years being built, and do you raise it up in three days? ", "21": "But He spoke about the sanctuary of His body. ", "22": "Then when He was raised from the dead, His disciples recalled that He said this to them. And they believed the Scripture, and the word which Jesus spoke.   ", "23": "And as He was in Jerusalem, at the Passover, at the Feast, many believed into His name, seeing the miracles which He did. ", "24": "But Jesus Himself did not commit Himself to them, because He knew all, ", "25": "and because He had no need that anyone should witness concerning man, for He knew what was in man.  "}, "YLT": {"1": "And the third day a marriage happened in Cana of Galilee, and the mother of Jesus was there,", "2": "and also Jesus was called, and his disciples, to the marriage;", "3": "and wine having failed, the mother of Jesus saith unto him, `Wine they have not;'", "4": "Jesus saith to her, `What--to me and to thee, woman? not yet is mine hour come.'", "5": "His mother saith to the ministrants, `Whatever he may say to you--do.'", "6": "And there were there six water-jugs of stone, placed according to the purifying of the Jews, holding each two or three measures.", "7": "Jesus saith to them, `Fill the water-jugs with water;' and they filled them--unto the brim;", "8": "and he saith to them, `Draw out, now, and bear to the director of the apartment;' and they bare.", "9": "And as the director of the apartment tasted the water become wine, and knew not whence it is, (but the ministrants knew, who have drawn the water,) the director of the feast doth call the bridegroom,", "10": "and saith to him, `Every man, at first, the good wine doth set forth; and when they may have drunk freely, then the inferior; thou didst keep the good wine till now.'", "11": "This beginning of the signs did Jesus in Cana of Galilee, and manifested his glory, and his disciples believed in him;", "12": "after this he went down to Capernaum, he, and his mother, and his brethren, and his disciples; and there they remained not many days.", "13": "And the passover of the Jews was nigh, and Jesus went up to Jerusalem,", "14": "and he found in the temple those selling oxen, and sheep, and doves, and the money-changers sitting,", "15": "and having made a whip of small cords, he put all forth out of the temple, also the sheep, and the oxen; and of the money-changers he poured out the coins, and the tables he overthrew,", "16": "and to those selling the doves he said, `Take these things hence; make not the house of my Father a house of merchandise.'", "17": "And his disciples remembered that it is written, `The zeal of Thy house did eat me up;'", "18": "the Jews then answered and said to him, `What sign dost thou shew to us--that thou dost these things?'", "19": "Jesus answered and said to them, `Destroy this sanctuary, and in three days I will raise it up.'", "20": "The Jews, therefore, said, `Forty and six years was this sanctuary building, and wilt thou in three days raise it up?'", "21": "but he spake concerning the sanctuary of his body;", "22": "when, then, he was raised out of the dead, his disciples remembered that he said this to them, and they believed the Writing, and the word that Jesus said.", "23": "And as he was in Jerusalem, in the passover, in the feast, many believed in his name, beholding his signs that he was doing;", "24": "and Jesus himself was not trusting himself to them, because of his knowing all <FI>men<Fi> ,", "25": "and because he had no need that any should testify concerning man, for he himself was knowing what was in man."}, "Vulgate": {"1": "et die tertio nuptiae factae sunt in Cana Galilaeae et erat mater Iesu ibi", "2": "vocatus est autem ibi et Iesus et discipuli eius ad nuptias", "3": "et deficiente vino dicit mater Iesu ad eum vinum non habent", "4": "et dicit ei Iesus quid mihi et tibi est mulier nondum venit hora mea", "5": "dicit mater eius ministris quodcumque dixerit vobis facite", "6": "erant autem ibi lapideae hydriae sex positae secundum purificationem Iudaeorum capientes singulae metretas binas vel ternas", "7": "dicit eis Iesus implete hydrias aqua et impleverunt eas usque ad summum", "8": "et dicit eis Iesus haurite nunc et ferte architriclino et tulerunt", "9": "ut autem gustavit architriclinus aquam vinum factam et non sciebat unde esset ministri autem sciebant qui haurierant aquam vocat sponsum architriclinus", "10": "et dicit ei omnis homo primum bonum vinum ponit et cum inebriati fuerint tunc id quod deterius est tu servasti bonum vinum usque adhuc", "11": "hoc fecit initium signorum Iesus in Cana Galilaeae et manifestavit gloriam suam et crediderunt in eum discipuli eius", "12": "post hoc descendit Capharnaum ipse et mater eius et fratres eius et discipuli eius et ibi manserunt non multis diebus", "13": "et prope erat pascha Iudaeorum et ascendit Hierosolyma Iesus", "14": "et invenit in templo vendentes boves et oves et columbas et nummularios sedentes", "15": "et cum fecisset quasi flagellum de funiculis omnes eiecit de templo oves quoque et boves et nummulariorum effudit aes et mensas subvertit", "16": "et his qui columbas vendebant dixit auferte ista hinc nolite facere domum Patris mei domum negotiationis", "17": "recordati vero sunt discipuli eius quia scriptum est zelus domus tuae comedit me", "18": "responderunt ergo Iudaei et dixerunt ei quod signum ostendis nobis quia haec facis", "19": "respondit Iesus et dixit eis solvite templum hoc et in tribus diebus excitabo illud", "20": "dixerunt ergo Iudaei quadraginta et sex annis aedificatum est templum hoc et tu tribus diebus excitabis illud", "21": "ille autem dicebat de templo corporis sui", "22": "cum ergo resurrexisset a mortuis recordati sunt discipuli eius quia hoc dicebat et crediderunt scripturae et sermoni quem dixit Iesus", "23": "cum autem esset Hierosolymis in pascha in die festo multi crediderunt in nomine eius videntes signa eius quae faciebat", "24": "ipse autem Iesus non credebat semet ipsum eis eo quod ipse nosset omnes", "25": "et quia opus ei non erat ut quis testimonium perhiberet de homine ipse enim sciebat quid esset in homine"}}, "compounds": {"καταβαίνω": {"parts": [{"greek": "κατά", "meaning_es": "hacia abajo", "strongs_number": "G2596", "strongs_derivation": "a primary particle;", "strongs_definition": "(prepositionally) down (in place or time), in\n varied relations (according to the case (genitive, dative or\n accusative) with which it is joined)"}, {"greek": "βαίνω", "meaning_es": "ir"}], "meaning": "descender, bajar", "root_note": ""}, "πρόβατον": {"parts": [{"greek": "πρό", "meaning_es": "adelante", "strongs_number": "G4253", "strongs_derivation": "a primary preposition;", "strongs_definition": "\"fore\", i.e. in front of, prior (figuratively,\n superior) to"}, {"greek": "βαίνω", "meaning_es": "ir"}], "meaning": "oveja", "root_note": ""}, "ἀδελφός": {"parts": [{"greek": "ἀ-", "meaning_es": "mismo (copulativo)", "strongs_number": "G1", "strongs_derivation": "of Hebrew origin;", "strongs_definition": "the first letter of the alphabet; figuratively, only\n (from its use as a numeral) the first:"}, {"greek": "δελφύς", "meaning_es": "vientre"}], "meaning": "hermano", "root_note": "ἀ- aquí es copulativo (= 'mismo'), NO privativo. δελφύς = vientre/útero. ἀ-δελφ-ός = 'del mismo vientre' = hermano."}, "ἀναβαίνω": {"parts": [{"greek": "ἀνά", "meaning_es": "arriba", "strongs_number": "G303", "strongs_derivation": "a primary preposition and adverb;", "strongs_definition": "properly, up; but (by extension)\n used (distributively) severally, or (locally) at (etc.)"}, {"greek": "βαίνω", "meaning_es": "ir"}], "meaning": "subir", "root_note": ""}, "ἐκβάλλω": {"parts": [{"greek": "ἐκ", "meaning_es": "fuera", "strongs_number": "G1537", "strongs_derivation": "a primary preposition denoting origin (the point whence action or\n motion proceeds), from, out (of place, time, or cause;", "strongs_definition": "literal or\n figurative; direct or remote)"}, {"greek": "βάλλω", "meaning_es": "lanzar", "strongs_number": "G906", "strongs_derivation": "a primary verb;", "strongs_definition": "to throw (in various applications, more or less\n violent or intense)"}], "meaning": "echar fuera, expulsar", "root_note": ""}, "ἐκχέω": {"parts": [{"greek": "ἐκ", "meaning_es": "fuera", "strongs_number": "G1537", "strongs_derivation": "a primary preposition denoting origin (the point whence action or\n motion proceeds), from, out (of place, time, or cause;", "strongs_definition": "literal or\n figurative; direct or remote)"}, {"greek": "χέω", "meaning_es": "derramar"}], "meaning": "derramar", "root_note": ""}, "Γαλιλαία": {"parts": [{"greek": "Γαλιλαια", "meaning_es": "Galilea", "type": "raíz"}, {"greek": "-α", "meaning_es": "genitivo femenino singular", "type": "desinencia"}], "meaning": "", "root_note": ""}, "Κανᾶ": {"parts": [{"greek": "Κανᾶ", "meaning_es": "Caná", "type": "raíz"}], "meaning": "", "root_note": ""}, "Καπερναούμ": {"parts": [{"greek": "Καπερναούμ", "meaning_es": "Capernaúm", "type": "raíz"}], "meaning": "", "root_note": ""}, "αὐτός": {"parts": [{"greek": "αὐτ", "meaning_es": "él/mismo", "type": "raíz"}, {"greek": "ός", "meaning_es": "nominativo singular masculino", "type": "desinencia"}], "meaning": "", "root_note": ""}, "βοῦς": {"parts": [{"greek": "βου", "meaning_es": "buey", "type": "raíz"}, {"greek": "ς", "meaning_es": "terminación acusativo singular masculino", "type": "desinencia"}], "meaning": "", "root_note": ""}, "γάμος": {"parts": [{"greek": "γαμ", "meaning_es": "matrimonio", "type": "raíz"}, {"greek": "ος", "meaning_es": "terminación acusativo plural masculino", "type": "desinencia"}], "meaning": "", "root_note": ""}, "γάρ": {"parts": [{"greek": "γαρ", "meaning_es": "porque", "type": "raíz"}], "meaning": "", "root_note": ""}, "γίνομαι": {"parts": [{"greek": "γιν", "meaning_es": "llegar a ser", "type": "raíz"}, {"greek": "ομαι", "meaning_es": "terminación indicativo medio aoristo 3ª singular", "type": "desinencia"}], "meaning": "", "root_note": ""}, "γεμίζω": {"parts": [{"greek": "γεμ", "meaning_es": "estar lleno", "type": "raíz"}, {"greek": "ίζω", "meaning_es": "sufijo formador de verbos causativos", "type": "sufijo"}, {"greek": "ω", "meaning_es": "terminación infinitivo pasivo presente", "type": "desinencia"}], "meaning": "", "root_note": ""}, "γεύω": {"parts": [{"greek": "γευ", "meaning_es": "probar", "type": "raíz"}, {"greek": "ω", "meaning_es": "aoristo subjuntivo activo 3ª persona plural", "type": "desinencia"}], "meaning": "", "root_note": ""}, "γινώσκω": {"parts": [{"greek": "γνω", "meaning_es": "conocer", "type": "raíz"}, {"greek": "σκ", "meaning_es": "sufijo incoativo", "type": "sufijo"}, {"greek": "ω", "meaning_es": "imperfecto indicativo activo 3ª persona singular", "type": "desinencia"}], "meaning": "", "root_note": ""}, "γράφω": {"parts": [{"greek": "γραφ", "meaning_es": "escribir", "type": "raíz"}, {"greek": "ω", "meaning_es": "perfecto indicativo pasivo 3ª persona singular", "type": "desinencia"}], "meaning": "", "root_note": ""}, "γραφή": {"parts": [{"greek": "γραφ", "meaning_es": "escribir", "type": "raíz"}, {"greek": "ή", "meaning_es": "sufijo nominal", "type": "sufijo"}, {"greek": "ή", "meaning_es": "dativo plural femenino", "type": "desinencia"}], "meaning": "", "root_note": ""}, "γυνή": {"parts": [{"greek": "γυν", "meaning_es": "mujer", "type": "raíz"}, {"greek": "ή", "meaning_es": "acusativo singular femenino", "type": "desinencia"}], "meaning": "", "root_note": ""}}, "manuscripts": {"P45": {"name": "Papiro 45 (Chester Beatty I)", "date": "c. 250", "year": 250, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Fayum, Egipto", "dlat": 29.3, "dlng": 30.8, "disc_date": "1930", "content": "Fragmentos de los 4 Evangelios y Hechos", "type": "Mixto/Libre", "location": "Chester Beatty Library, Dublín", "desc": "Uno de los papiros más antiguos del NT. El escriba tiende a abreviar y parafrasear el texto. Contiene porciones de Mt, Mc, Lc, Jn y Hch.", "reliability": "Texto libre/parafrastico. Valioso por antigüedad pero el escriba toma libertades. Importante para establecer que los 4 evangelios circulaban juntos en el s.III.", "validators": "Frederic Kenyon (editio princeps 1933-1937), Kurt Aland (clasificación)"}, "P46": {"name": "Papiro 46 (Chester Beatty II)", "date": "c. 200", "year": 200, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Fayum, Egipto", "dlat": 29.3, "dlng": 30.8, "disc_date": "1930", "content": "Epístolas paulinas (Rom, Heb, 1-2 Cor, Ef, Gal, Fil, Col, 1 Tes)", "type": "Alejandrino", "location": "Chester Beatty Library + Univ. Michigan", "desc": "El testimonio más antiguo de las cartas de Pablo. Incluye Hebreos entre Romanos y 1 Corintios, sugiriendo que se consideraba paulina. Faltan las Pastorales.", "reliability": "Altamente confiable. Texto alejandrino temprano. Su antigüedad (c.200) lo hace crucial para reconstruir el texto original paulino.", "validators": "Frederic Kenyon (1936), Günther Zuntz (The Text of the Epistles, 1953)"}, "P66": {"name": "Papiro 66 (Bodmer II)", "date": "c. 200", "year": 200, "origin": "Egipto", "olat": 26.1, "olng": 32.7, "disc_place": "Panópolis (Akhmim), Egipto", "dlat": 26.6, "dlng": 31.7, "disc_date": "1952", "content": "Evangelio de Juan (casi completo, 1:1-6:11, 6:35-14:26)", "type": "Mixto (Alejandrino/Occidental)", "location": "Fundación Bodmer, Cologny (Ginebra)", "desc": "Uno de los testimonios más antiguos del Evangelio de Juan. Contiene correcciones del mismo escriba, mostrando el proceso de copia. Texto mixto entre alejandrino y occidental.", "reliability": "Muy confiable por antigüedad. Las autocorrecciones del escriba muestran cuidado textual. Confirma la existencia temprana del texto joánico.", "validators": "Victor Martin (editio princeps 1956), Gordon Fee (análisis textual 1968)"}, "P75": {"name": "Papiro 75 (Bodmer XIV-XV)", "date": "c. 175-225", "year": 190, "origin": "Egipto", "olat": 26.1, "olng": 32.7, "disc_place": "Panópolis (Akhmim), Egipto", "dlat": 26.6, "dlng": 31.7, "disc_date": "1952", "content": "Lucas 3-24 y Juan 1-15", "type": "Alejandrino", "location": "Biblioteca Vaticana (donado 2007)", "desc": "El papiro más cercano al Codex Vaticanus (B). Demuestra que el texto alejandrino NO es una revisión tardía sino que existía ya en el s.II. Escriba muy cuidadoso.", "reliability": "Extremadamente confiable. Considerado el mejor testigo temprano del texto alejandrino. Su concordancia con B (s.IV) prueba la estabilidad de esta tradición textual.", "validators": "Victor Martin y Rodolphe Kasser (1961), Carlo Martini (análisis 1966), Kurt Aland"}, "ℵ": {"name": "Codex Sinaiticus (Aleph/01)", "date": "c. 330-360", "year": 345, "origin": "Cesarea o Egipto", "olat": 31.2, "olng": 34.3, "disc_place": "Monasterio de Santa Catalina, Sinaí", "dlat": 28.5, "dlng": 33.9, "disc_date": "1844-1859", "content": "NT completo + gran parte del AT (LXX) + Epístola de Bernabé + Pastor de Hermas", "type": "Alejandrino", "location": "British Library, Londres", "desc": "Descubierto por Constantin von Tischendorf en el Monasterio de Santa Catalina (Sinaí). Es el único manuscrito uncial con el NT completo. Incluye libros que luego no entraron al canon (Bernabé, Hermas). Tiene múltiples correctores de diferentes siglos.", "reliability": "Altamente confiable. Uno de los dos pilares del texto alejandrino (junto con B). Su NT completo lo hace indispensable. Las correcciones posteriores muestran la historia de la transmisión textual.", "validators": "Tischendorf (editio princeps 1862), Kirsopp Lake (facsímil 1911), Milne & Skeat (Scribes and Correctors, 1938), D.C. Parker (Codex Sinaiticus Project, 2009)"}, "B": {"name": "Codex Vaticanus (03)", "date": "c. 325-350", "year": 340, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Biblioteca Vaticana (registrado desde 1475)", "dlat": 41.9, "dlng": 12.5, "disc_date": "antes de 1475", "content": "AT (LXX) + NT hasta Hebreos 9:14 (faltan Pastorales, Filemón, Apocalipsis)", "type": "Alejandrino", "location": "Biblioteca Apostólica Vaticana, Roma", "desc": "Considerado por muchos el manuscrito más importante del NT. Texto alejandrino puro y consistente. En la Biblioteca Vaticana desde al menos 1475 pero no fue accesible a eruditos hasta el s.XIX. Tischendorf solo pudo verlo brevemente.", "reliability": "El más confiable según la mayoría de críticos textuales. Su concordancia con P75 (s.II) demuestra que preserva un texto muy antiguo. Base principal del texto NA28/UBS5.", "validators": "Carlo Vercellone (1868), Tischendorf (colación 1867), Kurt Aland, Bruce Metzger, Bart Ehrman"}, "A": {"name": "Codex Alexandrinus (02)", "date": "c. 400-440", "year": 420, "origin": "Egipto o Constantinopla", "olat": 31.2, "olng": 29.9, "disc_place": "Donado al rey Carlos I de Inglaterra", "dlat": 51.5, "dlng": -0.1, "disc_date": "1627", "content": "AT + NT casi completos (faltan partes de Mt, Jn, 2 Cor). Incluye 1-2 Clemente", "type": "Bizantino (Evangelios), Alejandrino (resto)", "location": "British Library, Londres", "desc": "Donado por el Patriarca de Constantinopla Cirilo Lukaris al rey Carlos I en 1627. Texto bizantino en los Evangelios pero alejandrino en Hechos, Epístolas y Apocalipsis. Mejor testigo del Apocalipsis.", "reliability": "Confiable pero con distinción: en Evangelios refleja texto bizantino (secundario), en el resto es alejandrino (primario). Crucial para el Apocalipsis donde B no existe.", "validators": "Patrick Young (primer editor parcial, 1633), Frederic Kenyon (facsímil 1909), Kurt Aland"}, "C": {"name": "Codex Ephraemi Rescriptus (04)", "date": "c. 450", "year": 450, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Biblioteca Nacional de Francia", "dlat": 48.8, "dlng": 2.3, "disc_date": "s. XVII", "content": "Fragmentos de AT y NT (palimpsesto)", "type": "Mixto", "location": "Bibliothèque nationale de France, París", "desc": "Palimpsesto: el texto bíblico fue borrado en el s.XII y reescrito con sermones de Efrén el Sirio. Tischendorf logró descifrar el texto inferior con reactivos químicos (1840-1845). Solo sobrevive ~60% del NT.", "reliability": "Moderadamente confiable. Texto mixto. Valioso donde otros testigos faltan. El proceso de desciframiento introduce incertidumbre en algunas lecturas.", "validators": "Tischendorf (editio princeps 1843-1845), Robert Lyon (1959)"}, "D": {"name": "Codex Bezae (05)", "date": "c. 400", "year": 400, "origin": "Sur de Francia o Norte de África", "olat": 43.6, "olng": 3.9, "disc_place": "Donado por Teodoro de Beza a Cambridge", "dlat": 52.2, "dlng": 0.1, "disc_date": "1581", "content": "Evangelios + Hechos (bilingüe griego-latín)", "type": "Occidental", "location": "Cambridge University Library", "desc": "Manuscrito bilingüe (griego-latín) con el texto occidental más importante. En Hechos es ~10% más largo que el alejandrino, con adiciones narrativas únicas. Muchas lecturas singulares que no aparecen en ningún otro manuscrito.", "reliability": "Controversial. Preserva tradiciones muy antiguas (s.II) pero también contiene armonizaciones y expansiones. Valioso como testigo independiente del texto occidental. No se usa como base pero sus lecturas se consideran caso por caso.", "validators": "Teodoro de Beza (donación 1581), F.H.A. Scrivener (1864), J. Rendel Harris (1891), D.C. Parker (Codex Bezae, 1992)"}, "W": {"name": "Codex Washingtonianus (032)", "date": "c. 400-450", "year": 425, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Comprado por Charles Freer en Egipto", "dlat": 38.9, "dlng": -77.0, "disc_date": "1906", "content": "Evangelios", "type": "Mixto (varía por sección)", "location": "Smithsonian Institution, Washington D.C.", "desc": "Texto que cambia de carácter según la sección (alejandrino en Lc 1:1-8:12, occidental en Mc 1:1-5:30, bizantino en Mt). Contiene el \"Logion de Freer\" después de Mc 16:14, una adición única.", "reliability": "Confiable pero complejo. Cada sección debe evaluarse según su tipo textual. El cambio de tipo sugiere que fue copiado de múltiples ejemplares.", "validators": "Henry Sanders (editio princeps 1912), Larry Hurtado (Text-Critical Methodology, 1981)"}, "TR": {"name": "Textus Receptus", "date": "1516-1633", "year": 1516, "origin": "Basilea, Suiza", "olat": 47.6, "olng": 7.6, "disc_place": "Publicado por Erasmo de Rotterdam", "dlat": 47.6, "dlng": 7.6, "disc_date": "1516", "content": "NT completo (texto impreso, no manuscrito)", "type": "Bizantino tardío", "location": "Múltiples ediciones", "desc": "No es un manuscrito sino un texto impreso. Erasmo lo compiló en 1516 basándose en unos pocos minúsculos tardíos (s.XII-XIII) disponibles en Basilea. El nombre \"Textus Receptus\" viene de la edición Elzevir de 1633. Base de la KJV y la RVR antigua.", "reliability": "Superado por la crítica textual moderna. Se basa en manuscritos tardíos y en algunos lugares Erasmo retrotradujo del latín al griego. Sin embargo, en la gran mayoría del texto coincide con manuscritos más antiguos.", "validators": "Erasmo de Rotterdam (1516), Robert Estienne/Stephanus (1550), Elzevir (1633). Criticado por Westcott-Hort (1881), defendido parcialmente por Maurice Robinson (Byzantine Priority)"}}, "greek_commentaries": {"1": [{"src": "hac", "name": "Alford's Greek Testament", "text": "1. ] τῇ τρίτῃ reckoned from the day of Nathanael&rsquo;s calling. There would thus be but one day between that event and the marriage. Κανᾷ τ . Γ . ] See ch. [John 4:46] ; not far from Capernaum. Josephus (Life, § 16) calls it κώμη τῆς Γαλιλαίας . There is a Kanah in [Joshua 19:28] , in the tribe of Asher, which must be distinct from this. Jerome however in his Onomasticon believes it to have been the same. It was the residence, and probably birth-place, of Nathanael. If his calling took place in its neighbourhood, our Lord may have gone on and spent the intervening day at Nazareth. Dr. Robinson, Bib. Res. iii. 204 ff., satisfactorily establishes that Kâna-el-Jelîl, about 3 hours N. ½ E. from Nazareth, is the site of this miracle. The name is identical, and so stands in the Arabic version of the N.T. He shews this to have been recognized in early tradition, and its honour to have been only recently usurped by Kefr Kenna, a village 1½ hour N.E. from Nazareth, on one of the roads to Tiberias. [See a very interesting description of Kâna-el-Jelîl in &ldquo;The Land and the Book,&rdquo; pp. 426, 427.] ἡ μήτηρ τ . Ἰ . ] John never names her, as being already well known (Lücke): or perhaps more probably from his own intimate connexion with her, in pursuance of the injunction ch. [John 19:26-27] . He never names either himself, or his own brother, James."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[John 2:1] . Τῇ ἡμέρᾳ τῇ τρίτῃ ) On the third day after the promise given, ch. [John 1:51] . Now is exhibited a specimen [of its fulfilment]. [ Between that day, on which Nathanael teas gained over, and the celebration of the marriage-feast, one day intervened; on which some disciples, as it is reasonable to suppose, joined those previously made . V. g. Nor was this portion of time too limited for accomplishing the journey from Bethabara (Bethany?) to Galilee ( and especially to Cana ). Harm., p. 159.] γάμος , the marriage-feast ) Christ does not abolish human society but sanctifies it. Thirst can be assuaged even by water; but at a marriage-feast the Lord gives wine: [on an occasion] independent of marriage there would have been no case of need. The great graciousness of the Lord [is herein exhibited]: He takes part in a marriage-feast at the earliest period [of His ministry], whilst He is alluring [in a winning manner] disciples, being afterwards about to proceed by more severe ways leading to the cross, [both methods alike at the last] eventuating in glory. ἡ μήτηρ τοῦ Ἰησοῦ , the mother of Jesus ) John never calls her by the name Mary ; but takes the name for granted as known from the other evangelists: comp. note on ch. [John 6:67] , [John 7:42] , [John 21:2] . ἐκεῖ , there ) as a relative or intimate friend."}], "2": [{"src": "hac", "name": "Alford's Greek Testament", "text": "2. ] ἐκλήθη , not for a pluperfect: was invited: the historical past. κ . οἱ μαθ . αὐτ . ] It does not appear who these were , unless we assume that they were those called in ch. 1., which seems most probable. John himself was most likely present. He does not relate so circumstantially any thing which he had not witnessed. In this case, there must have been some other reason for the invitation, besides mere previous acquaintance. This would be the probable reason for Jesus Himself being invited; but the disciples , being from various places in the district, can hardly all have been (De Wette) friends of the family . The fact of Jesus having attached disciples to Himself must have been known, and they were doubtless invited from consideration to Him . Our Lord at once opens His ministry with the character which He gives of himself [Matthew 11:18-19] , as distinguished from the asceticism of John. He also, as Trench admirably remarks (Miracles, edn. 2, p. 98, note), gives us his own testimony against the tendency which our indolence ever favours, of giving up those things and occasions to the world and the devil, which we have not Christian boldness to mingle in and purify. Even Cyprian, for instance, proscribes such festivals, &ldquo;nuptiarum festa improba et convivia lasciva vitentur, quorum periculosa contagio est.&rdquo; De Habitu Virginum, ch. 21. p. 460. And such is the general verdict of modern religionism, which would keep the leaven distinct from the lump, for fear it should become unleavened . The especial honour conferred upon marriage by the Lord should also be noticed. &ldquo;He here adorned and beautified it with his presence, and first miracle that He wrought.&rdquo;"}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[John 2:2] . Οἱ μαθηταί , the disciples ) There were by this time more disciples than those who had invited Jesus and His disciples seem to have thought: on that account the wine was the more speedily all spent; but Jesus most liberally compensates them, by giving as many vessels of wine as were about the number of companions whom He had brought with Him. αὐτοῦ , His ) Hence maybe inferred the piety of those who invited Him."}], "3": [{"src": "hac", "name": "Alford's Greek Testament", "text": "3. ] There is no necessity to suppose that the feast had lasted several days, as De Wette and Lücke do. It has been suggested that the unexpected presence of the disciples may have occasioned a failure in the previously sufficient supply: a gloss in the old latin cod. Rhedigerianus has, &ldquo; et factum est per multam turbam vocatorum vinum consummari .&rdquo; The mother of Jesus evidently is in a position of authority (see Joh 2:5 ) in the house, which was probably that of a near relative. The conjectures and traditions on the subject are many, but wholly unsatisfactory. A graver question arises as to the intent with which this οἶνον οὐκ ἔχ . was said. She cannot have had from experience any reason to suppose that her Son would work a miracle, for this ( Joh 2:11 ) was His first . Chrysostom suggests (so also Theophyl., Euthym [38] , and Neander, L. J. p. 271) that, knowing Him to be Who He was, she had been by the recent divine acknowledgment of Him and His calling disciples to Himself, led to expect the manifestation of his Messianic power about this time; and here seemed an occasion for it. Some of the other explanations are: &ldquo;that she had always found Him a wise counsellor, and mentioned the want to Him merely that He might suggest some way of remedying it.&rdquo; Cocceius, cited by Trench. &ldquo;Velim discedas, ut ceteri item discedant, antequam penuria patefiat.&rdquo; Bengel. &ldquo;Ut pia aliqua exhortatione convivis tædium eximeret, ac simul levaret pudorem sponsi.&rdquo; Calvin, cited by Lücke. &ldquo;Jesus had wrought miracles, but in secret, before this.&rdquo; Tholuck. [38] Euthymius Zigabenus, 1116 On the whole, the most probable explanation is that of Lücke, which somewhat modifies the first here mentioned, that our Lord Himself had recently given some reason to expect that He would shew forth His glory by wonderful works. So, very nearly, Stier, R. J. i. 38, edn. 2."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[John 2:3] . Ὑστερήσαντος , failing [coming short]) How many days the marriage-feast lasted, on what day of it the Lord came and the wine failed, is not known. οὐκ ἔχουσι ) The newly-wedded couple have not . She means this: I would wish you to withdraw, in order that the rest also may withdraw, before that the scarcity be made evident to all. [45] Adopting this [Bongel&rsquo;s] sense as the meaning of Mary, the reply of Jesus not only does not appear harsh, but is most full of love. [45] This seems mere conjecture. Lücke more probably supposes that the Lord Himself had recently given some reason to expect that He would manifest His Messiahship in wonderful works. Indeed she herself might have inferred this from prophecy: [Isaiah 35:5-6] ; [Genesis 49:10-11] . E. and T."}], "4": [{"src": "hac", "name": "Alford's Greek Testament", "text": "4. ] The answer of our Lord is beyond question one of reproof , and disclaimer of participation in the grounds on which the request was made . See instances, besides reff., in [Joshua 22:24] ; [Mark 1:24] . And so all the early expositors understood it. Irenæus (iii. 16. 6, p. 206) says, &ldquo;Dominus repellens ejus intempestivam festinationem, dixit,&rdquo; &c.; and Chrysostom, ἐβούλετο .… ἑαυτὴν λαμπροτέραν ποιῆσαι διὰ τοῦ παιδός , and therefore He σφοδρότερον ἀπεκρίνατο . Hom. xxi. in Joh., vol. viii. p. 122. The Romanist expositors mostly endeavour to divest the answer of any aspect of rebuke, and maintain that it was so uttered for our sakes alone, to teach us that He did not perform His miracles from regard to human affinity, but solely from love and His object of manifesting His glory. So Maldonatus. And this is true: but first among those to be taught this, was she herself, who had tempted Him to work a miracle from that regard . It has perhaps not been enough noticed, that in this answer the Lord declares His period of subjection to her as His earthly parent to be at an end. Henceforth His thoughts are not her thoughts. At twelve years of age, see [Luke 2:49] , He answers &lsquo;thy father and I,&rsquo; by &lsquo;My Father:&rsquo; now, He is to be no longer before the world as Mary&rsquo;s son , but as sanctified by the Father and sent into the world: compare [Matthew 12:48-50] , and [Luke 11:27-28] , and see Stier&rsquo;s admirable remarks, R. J. i. 39, edn. 2, also Olshausen&rsquo;s, ii. 81. γύναι ] There is no reproach in this term: but rather respect. The Lord henceforth uses it towards her, not calling her &lsquo;mother,&rsquo; even on the Cross (see ch. Joh 19:26 ), doubtless for the reason alleged above. οὔπω ἥκ . ἡ ὥρα μου ] This expression is generally used in John of the time of the Death of Christ: see reff. But it is only so used because His death is in those passages the subject naturally underlying the narrative. It is, any fixed or appointed time; and therefore here, the appointed time of His self-manifestation by miracles. This time was not yet come, but was close at hand. Some have supposed that the wine was not yet wholly exhausted, and that our Lord would wait till the miracle should be undoubted (so Trench, p. 192): but Stier well remarks that the known depth of all His early sayings forbids us from attaching only this meaning to it; and he sees in it a reference to the great marriage-feast and the new fruit of the vine in the Kingdom of God (i. 41, edn. 2). If this be so, it can be only in the background; the words must have had a present meaning, and I believe it to be, &lsquo; My time, the time at which, from the Father&rsquo;s appointment and my own concurring will, I am to begin miraculous working, is not yet arrived: forestall it not .&rsquo; Very similarly He speaks, ch. [John 7:6] , to His brethren, and yet afterwards goes up to the feast. The notion that ἡ ὥρα μου refers to the hour of our Lord&rsquo;s human infirmity on the Cross when (ch. Joh 19:27 ) He &ldquo;acknowledged her as His mother,&rdquo; Wordsw., seems wholly unfounded. Where do we find any such special acknowledgment there? And why should we go out of our way for a fanciful sense of words which bear an excellent meaning as referring to circumstances then present?"}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[John 2:4] . Τὶ ἐμοὶ καὶ σοί ; what is there [common] to Me and thee? ) Thy thoughts are one thing, saith He, mine another. Similarly the disciples are disciplined, ch. [John 6:6] , &ldquo;Jesus saith to Philip, Whence shall we buy bread, that these may eat? and this He said to prove him;&rdquo; ch. [John 13:7] , [Jesus to Peter, when about to wash his feet] &ldquo;What I do thou knowest not now, but thou shalt know hereafter.&rdquo; γύναι ) He does not say, Mary , nor mother ; but woman ; which appellation held a middle place, and was especially becoming for the Lord to use: ch. [John 19:26] , &ldquo;Woman, behold thy son;&rdquo; perhaps, also, it was peculiar [in its use] to Him. The Lord had regard to the Father above all things; not even did He know His mother, according to the flesh. [2 Corinthians 5:16] , &ldquo;Though we have known Christ after the flesh, yet now henceforth know we Him no more.&rdquo; Comp. note on [John 20:13] . Especially was the appellation of mother unsuitable to this formula, What is there to Me and thee? However, the Greek γύναι , having no synonym in our language, has a more respectful sound than Woman [ch. Joh 19:26 shows it betrays no want of tender respect], mulier , [Germ.] Weib , as contradistinguished from [female, lady] femina , [Germ.] Frau : and woman is used for mother , [Isaiah 45:10] , &ldquo;Woe unto him, that saith to the woman, What hast thou brought forth?&rdquo; οὔτω ἥκει ) is not yet come . The same word [occurs], ch. [John 4:47] , [John 8:42] . ὥρα , hour ) of doing what you hint to Me, i.e. of withdrawing. Certainly his hour of assisting them was come."}], "5": [{"src": "hac", "name": "Alford's Greek Testament", "text": "5. ] There certainly seems beneath this narrative to lie some incident which is not told us . For not only is Mary not repelled by the answer just given, but she is convinced that the miracle will be wrought , and she is not without an anticipation of the method of working it: for how should He require the aid of the servants, except the miracle were to take place according to the form here related? I believe we shall find, when all things are opened to us, that there had been a previous hint given her, where or how I would not presume to say, by our Lord, of His intention and the manner of performing it, and that her fault was, the too rash hastening on of what had been His fixed purpose ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[John 2:5] . Λέγει , she saith ) Mary had not yet seen a miracle performed by Jesus: [John 2:11] [proves this]; but from His own reply she wisely inferred, that one was about to be performed. ὅ , τι ἂν λέγῃ ὑμῖν , ποιήσατε , whatsoever He shall have said unto you, do it ) She feels that He is about to do something; therefore she delegates the whole management, resting on herself, as well as the servants themselves, to Him. Comp. [Genesis 41:55] , ὁ ἐὰν εἴτῃ ὑμῖν , ποιήσατε , whatever He shall have said to you, do ye [Pharaoh&rsquo;s direction that the Egyptians should go to Joseph]."}], "6": [{"src": "hac", "name": "Alford's Greek Testament", "text": "6. ] These vessels were for the washings usual at feasts: see [Mark 7:4] . There could be no collusion or imposture here, as they were water-vessels , and could have no remnants of wine in them (see also Joh 2:10 ). And the large quantity which they held could not have been brought in unobserved. The μετρητής is probably = the Jewish נַּח (which, Jos. Antt. viii. 2. 9, held 72 ξέσται = the Attic μετρητής = 8 gallons 7·4 pints), and stands for it in the LXX, ref. 2 Chron. According to this, the quantity of wine thus created would = 6 × (2 or 3) × (8 gallons 7·

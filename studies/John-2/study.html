 and not without reason. \"If,\" He says, \"there is no wine, then those who do not have it should have come and asked for it themselves, not You, the Mother.\" For when one's own relatives ask for a miracle to be performed, the spectators are scandalized, but when those in need themselves ask, then the matter is free from suspicion.\n\"My hour has not yet come,\" He said not because He is subject to dependence on time or observes certain hours (for how would this befit the Creator of times and ages?), but because He accomplishes all things at the fitting time. Since He was unseen and unknown to many, because not all were disciples, and even those present at the wedding did not know Him, for otherwise they themselves would have made the request about the wine — since all this was so, He said: \"My hour has not yet come,\" that is, the fitting time has not yet arrived.\nBut still the madness of Arius rises up, attempting to prove that the Lord is subject to hours and times. So learn, accursed one! If He were dependent on hours, then how did He ultimately perform the miracle? For if, as you say, He is dependent on hours and times, and His hour had not yet come, it would follow that He would not be able to perform the miracle. Yet He did perform the miracle; therefore, He is independent of hours.\nNotice, if you will, how He does not entirely nor in all things oppose His Mother, but rebuked Her a little and again fulfills Her request, rendering honor to Her and giving us", "lang": "english", "orig": ""}, {"v": 4, "f": "Thomas Aquinas", "w": "", "t": "Then when he says, Jesus said to her, the answer of Christ is given. This answer has been the occasion for three heresies.\n\nThe Manicheans claim that Christ had only an imaginary body, not a real one. Valentinus maintained that Christ assumed a celestial body and that, as far as his body was concerned, Christ was not related to the Virgin at all. The source of this error was that he understood, Woman, what does that have to do with me and you? as if it meant: \"I have received nothing from you.\" But this is contrary to the authority of Sacred Scripture. For the Apostle says: \"God sent his Son, made from a woman\" (Gal 4:4). Now Christ could not be said to have been made from her, unless he had taken something from her. Further, Augustine argues against them: \"How do you know that our Lord said, What does that have to do with me and you? You reply that it is because John says so. But he also says that the Virgin was the mother of Christ. So, if you believe the Evangelist when he states that Jesus said this to his mother, you should also believe him when he says, and the mother of Jesus was there.\"\n\nThen there was Ebion who said that Christ was conceived from a man's seed, and Elvidius, who said that the Virgin did not remain a virgin after childbirth. They were deceived by the fact that he said, Woman, which seems to imply the loss of virginity. But this is false, for in Sacred Scripture the word \"woman\" sometimes refers merely to the female sex, as it does in \"made from a woman", "lang": "english", "orig": ""}, {"v": 4, "f": "npnf212", "w": "Epistle XV.\nTo George, Presbyter.", "t": "m, and keepeth not His commandments, is a liar (1 John ii. 4). James also,\nthe brother of the Lord, writes saying, Faith without works is dead (Jam. ii. 20). If, then,\nbelievers now are not saved without good works, while the unbelieving and reprobate without", "lang": "greek", "orig": ""}, {"v": 5, "f": "Bede", "w": "", "t": "(in loc.) As if she said, Though He appear to refuse, He will do it nevertheless. She knew His pity and mercifulness. And there were set there six waterpots of stone, after the manner of the purifying of the Jews, containing two or three firkins apiece. Hydriæ1 are vessels to hold water: hydor being the Greek for water.", "lang": "english", "orig": ""}, {"v": 5, "f": "Bede", "w": "", "t": "He would not dishonor his mother, since he orders us to honor our father and mother.", "lang": "english", "orig": ""}, {"v": 5, "f": "Cyril of Alexandria", "w": "", "t": "The woman having great influence to the performing of the miracle, prevailed, persuading the Lord, on account of what was fitting, as her Son. She begins the work by preparing the servants of the assembly to obey the things that should be enjoined.", "lang": "english", "orig": ""}, {"v": 5, "f": "Gospel of Peter", "w": "Section V.", "t": "dad quoted in Harris,\nFragments, etc., p. 46.\n409 John ii. 5.\n410 John ii. 6.\n411 John ii. 7.\n\n\n29 with water. And they filled them to the top. 412He said unto them, Draw 30 out now,\nand present to the ruler of the feast. And they did so. 413And when the ruler", "lang": "greek", "orig": ""}, {"v": 5, "f": "Hilary of Poitiers", "w": "", "t": "On the wedding day in Galilee water was made wine. Have we words to tell or senses to ascertain what methods produced the change by which the tastelessness of water disappeared, and was replaced by the full flavour of wine? It was not a mixing; it was a creation, and a creation which was not a beginning, but a transformation. A weaker liquid was not obtained by admixture of a stronger element; an existing thing perished and a new thing came into being. The bridegroom was anxious, the household in confusion, the harmony of the marriage feast imperilled. Jesus is asked for help. He does not rise or busy Himself; He does the work without an effort. Water is poured into the vessels, wine drawn out in the cups. The evidence of the senses of the pourer contradicts that of the drawer. They who poured expect water to be drawn; they who draw think that wine must have been poured in. The intervening time cannot account for any gain or loss of character in the liquid. The mode of action baffles sight and sense, but the power of God is manifest in the result achieved.", "lang": "english", "orig": ""}, {"v": 5, "f": "John Chrysostom", "w": "", "t": "Besides, even while saying to the Canaanitish woman, \"It is not meet to take the children's bread, and to give it unto dogs\" (Matt. xv. 26), He still gave the bread, as considering her perseverance; and though after his first reply, He said, \"I am not sent save unto the lost sheep of the house of Israel,\" yet even after saying this, He healed the woman's daughter. Hence we learn, that although we be unworthy, we often by perseverance make ourselves worthy to receive. And for this reason His mother remained by, and openly brought to Him the servants, that the request might be made by a greater number; and therefore she added, \"Whatsoever He saith unto you, do it.\"\n\nFor she knew that His refusal proceeded not from want of power, but from humility, and that He might not seem without cause to hurry to the miracle; and therefore she brought the servants.", "lang": "english", "orig": ""}, {"v": 5, "f": "Theophylact of Ohrid", "w": "", "t": "The Mother says to the servants \"whatever He says to you, do it\" so that the request might be strengthened through their own approach and petition, so that it would be clear that the refusal was not from powerlessness, but with the aim of dispelling the opinion that He resorts to miracles out of self-glorification and vain ostentation.", "lang": "english", "orig": ""}, {"v": 5, "f": "Thomas Aquinas", "w": "", "t": "Now although his mother was refused, she did not lose hope in her Son's mercy. So she instructs the servants, Do whatever he tells you, in which, indeed, consists the perfection of all justice. For perfect justice consists in obeying Christ in all things: \"We will do all that the Lord commanded us\" (Ex 29:35). Do whatever he tells you, is fittingly said of God alone, for man can err now and then. Hence in matters that are against God, we are not held to obey men: \"We ought to obey God rather than men\" (Acts 5:29). We ought to obey God, who does not err and cannot be deceived, in all things.", "lang": "english", "orig": ""}, {"v": 6, "f": "Alcuin of York", "w": "", "t": "Vessels to hold water were there, after the manner of the purifying of Jews. Among other traditions of the Pharisees, they observed frequent washings.", "lang": "english", "orig": ""}, {"v": 6, "f": "Augustine of Hippo", "w": "", "t": "But observe what Himself saith, \"The things which were written in the law, and in the prophets, and in the Psalms concerning me.\" And we know that the law extends from the time of which we have record, that is, from the beginning of the world: \"In the beginning God made the heaven and the earth.\" Thence down to the time in which we are now living are six ages, this being the sixth, as you have often heard and know. The first age is reckoned from Adam to Noah; the second, from Noah to Abraham; and, as Matthew the evangelist duly follows and distinguishes, the third, from Abraham to David; the fourth, from David to the carrying away into Babylon; the fifth, from the carrying away into Babylon to John the Baptist; the sixth, from John the Baptist to the end of the world. Moreover, God made man after His own image on the sixth day, because in this sixth age is manifested the renewing of our mind through the gospel, after the image of Him who created us; and the water is turned into wine, that we may taste of Christ, now manifested in the law and the prophets. Hence \"there were there six water-pots,\" which He bade be filled with water. Now the six water-pots signify the six ages, which were not without prophecy. And those six periods, divided and separated as it were by joints, would be as empty vessels unless they were filled by Christ. Why did I say, the periods which would run fruitlessly on, unless the Lord Jesus were preached in them? Prophecies are fulfilled, the water-pots ", "lang": "english", "orig": ""}, {"v": 6, "f": "Augustine of Hippo", "w": "", "t": "But what means this: \"They contained two or three metretae apiece\"? This phrase certainly conveys to us a mysterious meaning. For by \"metretae\" he means certain measures, as if he should say jars, flasks, or something of that sort. Metreta is the name of a measure, and takes its name from the word \"measure.\" For metron is the Greek word for measure, whence the word \"metretae\" is derived. \"They contained,\" then, \"two or three metretae apiece.\" What are we to say, brethren? If He had simply said \"three apiece,\" our mind would at once have run to the mystery of the Trinity. And, perhaps, we ought not at once to reject this application of the meaning, because He said, \"two or three apiece;\" for when the Father and Son are named, the Holy Spirit must necessarily be understood. For the Holy Spirit is not that of the Father only, nor of the Son only, but the Spirit of the Father and of the Son. For it is written, \"If any man love the world, the Spirit of the Father is not in him.\" And again, \"Whoso hath not the Spirit of Christ is none of His.\" The same, then, is the Spirit of the Father and of the Son. Therefore, the Father and the Son being named, the Holy Spirit also is understood, because He is the Spirit of the Father and of the Son. And when there is mention of the Father and Son, \"two metretae,\" as it were, are mentioned; but since the Holy Spirit is understood in them, \"three metretae.\" That is the reason why it is not said, \"Some containing two metretae apiece, others three", "lang": "english", "orig": ""}, {"v": 6, "f": "Augustine of Hippo", "w": "", "t": "But there is also another meaning that must not be passed over, and which I will declare: let every man choose which he likes best. We keep not back what is suggested to us. For it is the Lord's table, and the minister ought not to defraud the guests, especially when they hunger as you now do, so that your longing is manifest. Prophecy, which is dispensed from the ancient times, has for its object the salvation of all nations. True, Moses was sent to the people of Israel alone, and to that people alone was the law given by him; and the prophets, too, were of that people, and the very distribution of times was marked out according to the same people; whence also the water-pots are said to be \"according to the purification of the Jews:\" nevertheless, that the prophecy was proclaimed to all other nations also is manifest, forasmuch as Christ was concealed in him in whom all nations are blessed, as it was promised to Abraham by the Lord, saying, \"In thy seed shall all nations be blessed.\" But this was not as yet understood, for as yet the water was not turned into wine. The prophecy therefore was dispensed to all nations.\n\nBut how do we show that all nations belong to the \"two or three metretae apiece\"? It was a matter of reckoning, in some measure, that he should say the same water-pots contained \"two apiece,\" which he had said contained \"three apiece;\" evidently in order to intimate to us a mystery therein. How are there \"two metretae apiece\"? Circumcision and uncircumcision. S", "lang": "english", "orig": ""}, {"v": 6, "f": "Augustine of Hippo", "w": "", "t": "(Tr. ix. 5. et sq.) Now if He ordered the water to be poured out, and then introduced the wine from the hidden recesses of creation, He would seem to have rejected the Old Testament. But converting, as He did, the water into wine, He showed us that the Old Testament was from Himself, for it was by His order that the waterpots were filled. But those Scriptures have no meaning, if Christ be not understood there. Now we know from what time the law dates, viz. from the foundation of the world. From that time to this are six ages; the first, reekoning from Adam to Noah; the second, from Noah to Abraham; the third, from Abraham to David; the fourth, from David to the carrying away into Babylon; the fifth, from that time to John the Baptist; the sixth, from John the Baptist to the end of the world. The six waterpots then denote these six ages of prophecy. The prophecies are fulfilled; the waterpots are full. But what is the meaning of their holding two or three firkins apiece? Had He said three only, our minds would have run immediately to the mystery of the Trinity. Nor perhaps can we reject it, even though it is said, two or three: for the Father and the Son being named, the Holy Ghost may be understood by consequence; inasmuch as it is the love between the Father and the Son, which is the Holy Ghost. (c. 17.). Nor should we pass over another interpretation, which makes the two firkins alluded to the two races of men, the Jews and the Greeks; and the three to the three sons of Noa", "lang": "english", "orig": ""}, {"v": 6, "f": "Ephrem the Syrian", "w": "", "t": "Why did our Lord change nature at the beginning of his signs, if it was not to show that the divinity that changed nature in the interior of the jars was the same that changed nature in the womb of the virgin? And at the conclusion of the signs, he opened the tomb to show that the insatiable nature of death would not keep hold of him; he confirmed and ratified these two uncertainties of his birth and of his death. As to their nature, these waters were turned into the [fruit of] the vine; their stone vessels were not changed within their own nature. They were a symbol of his body, which was wonderfully conceived in a woman, and in a marvelous way by [the intervention of] no man within the virgin. He thus made wine out of water to teach about the manner of his conception and birth. He called upon the six jars as witness to the one virgin who gave birth to him; for the jars conceived in a unique way that was not customary for them, and they brought forth wine, and then they did not continue to produce [it]. Thus did the virgin conceive and give birth to Immanuel, and then she ceased and did not continue [to give birth]. The offspring of the jars was from smallness to grandeur, and from vileness to excellence, for from water came good wine. In this case [the birth from the virgin], however, it was from grandeur to weakness and from glory to contempt. Yet in the case of these jars, they were for the purification of the Jews, and our Lord poured his instruction into them, to teach ", "lang": "english", "orig": ""}, {"v": 6, "f": "Gospel of Peter", "w": "Section V.", "t": "rris,\nFragments, etc., p. 46.\n409 John ii. 5.\n410 John ii. 6.\n411 John ii. 7.\n\n\n29 with water. And they filled them to the top. 412He said unto them, Draw 30 out now,\nand present to the ruler of the feast. And they did so. 413And when the ruler of the company", "lang": "greek", "orig": ""}, {"v": 6, "f": "John Chrysostom", "w": "", "t": "It is not without a reason that the Evangelist says, \"After the manner of the purifying of the Jews,\" but in order that none of the unbelievers might suspect that lees having been left in the vessels, and water having been poured upon and mixed with them, a very weak wine had been made. Therefore he says, \"after the manner of the purifying of the Jews,\" to show that those vessels were never receptacles for wine. For because Palestine is a country with but little water, and brooks and fountains were not everywhere to be found, they always used to fill waterpots with water, so that they might not have to hasten to the rivers if at any time they were filed, but might have the means of purification at hand.", "lang": "english", "orig": ""}, {"v": 6, "f": "Tertullian (cont)", "w": "Chapter III.—The Question of Novelty Further Considered in Connection with the\nWords of the Lord and His Apostles.", "t": "Therefore, if all these (considerations) obliterate the licence of marrying, whether we\nlook into the condition on which the licence is granted, or the preference of continence\nwhich is imposed, why, after the apostles, could not the same Spirit, supervening for the\npurpose of conducting disciplehood594 into “all truth” through the gradations of the times\n(according to what the preacher says, “A time to everything”595), impose by this time a final\n591 1 John ii. 6.\n592 1 John iii. 3.\n593 There is no such passage in any Epistle of St. John. There is one similar in 1 Pet. i. 15.\n594 Disciplinam.\n595 Eccles. iii. 1.\n \n\nbridle upon the flesh, no longer obliquely calling us away from marriage, but openly; since\nnow more (than ever) “the time is become wound up,”596—about 160 years having elapsed\nsince then? Would you not spontaneously ponder (thus) in your own mind: “This discipline\nis old, shown beforehand, even at that early date, in the Lord’s flesh and will, (and) successively\nthereafter in both the counsels and the examples of His apostles? Of old we were\ndestined to this sanctity. Nothing of novelty is the Paraclete introducing. What He premonished,\nHe is (now) definitively appointing; what He deferred, He is (now) exacting.” And\npresently, by revolving these thoughts, you will easily persuade yourself that it was much\nmore competent to the Paraclete to preach unity of marriage, who could withal have preached\nits annulling; and that it is more credible that He should have te", "lang": "latin", "orig": ""}, {"v": 6, "f": "Tertullian (cont)", "w": "Chapter III.—The Question of Novelty Further Considered in Connection with the\nWords of the Lord and His Apostles.", "t": "verything”595), impose by this time a final\n591 1 John ii. 6.\n592 1 John iii. 3.\n593 There is no such passage in any Epistle of St. John. There is one similar in 1 Pet. i. 15.\n594 Disciplinam.\n595 Eccles. iii. 1.\n \n\nbridle upon the flesh, no longer obliquely c", "lang": "latin", "orig": ""}, {"v": 6, "f": "Theophylact of Ohrid", "w": "", "t": "The stone water jars were used for the purification of the Jews. For the Jews washed themselves almost every day and only then partook of food. Whether they touched a leper, a dead body, or had contact with a woman, they washed themselves as being already unclean. And since Palestine was waterless and it was not possible to find many springs, they always filled the water jars with water, so as not to run to the rivers in case of defilement. He said \"according to the manner of the purifying of the Jews\" not without purpose, but so that none of the unbelievers would think that some sediment of wine remained in the vessels, and then, when water was poured in and mixed, a very weak wine was produced — he shows that they were never receptacles for wine.", "lang": "english", "orig": ""}, {"v": 6, "f": "Thomas Aquinas", "w": "", "t": "Now Christ's completion of the miracle is set forth. First, the vessels in which the miracle was performed are described. Secondly, the matter of the miracle is stated (v 7). Thirdly, we have how the miracle was made known and approved (v 8).\n\nThe miracle was performed in six vessels; Now there were six stone water jars near by. Here we should note, that as mentioned in Mark (7:2), the Jews observed many bodily washings and the cleansing of their cups and dishes. So, because they were in Palestine where there was a shortage of water, they had vessels in which they kept the purest water to be used for washing themselves and their utensils. Hence he says, there were six stone water jars near by, i.e., vessels for holding water, for purifications according to Jewish customs, i.e., to use for purification, each holding two or three metretes of liquid, that is, two or three measures; for the Greek \"metrete\" is the same as the Latin \"mensura.\"\n\nThese jars were standing there, as Chrysostom says, in order to eliminate any suspicion about the miracle: both on account of their cleanliness, lest anyone suspect that the water had acquired the taste of wine from the dregs of wine previously stored in them, for these jars were standing there for purifications according to Jewish customs, and so had to be very pure; and also on account of the capacity of the jars, so that it would be abundantly clear that the water in such jars could be changed into wine only by divine power.\n\nIn the mysti", "lang": "english", "orig": ""}, {"v": 7, "f": "Augustine of Hippo", "w": "", "t": "(Tr. ix. c. 7) A firkin is a certain measure; as urn, amphora, and the like. Metron is the Greek for measure: whence metretae. Two or three, is not to be taken to mean some holding two, others three, but the same vessels holding two or three.\nJesus saith unto them, Fill the waterpots with water. And they filled them up to the brim.", "lang": "english", "orig": ""}, {"v": 7, "f": "Cyril of Alexandria", "w": "", "t": "The ministers accomplish what is commanded, and by unspeakable might was the water changed into wine. For what is hard to Him Who can do all things? He that calleth into being things which are not, how will He weary, trans-ordering into what He will things already made? They marvel at the thing, as strange; for such are Christ's works to look upon. But the governor of the feast charges the bridegroom with expending what was better on the latter end of the feast, not unfitly, as appears to me, according to the narration of the story.", "lang": "english", "orig": ""}, {"v": 7, "f": "Ephrem the Syrian", "w": "", "t": "Let Cana thank you for gladdening her banquet!\nThe bridegroom’s crown exalted you for exalting it,\nAnd the bride’s crown belonged to your victory.\nIn her mirror allegories are expounded and traced,\nFor you portrayed your church in the bride,\nAnd in her guests, yours are traced,\nAnd in her magnificence she portrays your advent.\nLet the feast thank him, for in multiplying his wine\nSix miracles were beheld there:\nThe six wine jugs set aside for water\nInto which they invited the King to pour his wine.", "lang": "english", "orig": ""}, {"v": 7, "f": "Gospel of Peter", "w": "Section V.", "t": "etc., p. 46.\n409 John ii. 5.\n410 John ii. 6.\n411 John ii. 7.\n\n\n29 with water. And they filled them to the top. 412He said unto them, Draw 30 out now,\nand present to the ruler of the feast. And they did so. 413And when the ruler of the company\ntasted that wate", "lang": "greek", "orig": ""}, {"v": 7, "f": "Gregory Thaumaturgus", "w": "Oration on the Palms.3109", "t": "v. 5.\n3136 John xi. 44.\n3137 Matt. xiv. 26.\n3138 John ii. 7.\n3139 John vi. 11.\n3140 Luke viii. 29, etc.\n3141 Dan. iii. 56 (LXX.).\n3142 Matt. xxi. 15.\n3143 Luke i. 17.\n3144 John v. 39.\n3145 Zech. ix. 9.\n\n\ntogether with your children. Let the religious service", "lang": "greek", "orig": ""}, {"v": 7, "f": "John Chrysostom", "w": "", "t": "\"And why was it, that He did not the miracle before they filled them, which would have been more marvelous by far? for it is one thing to change given matter to a different quality, and another to create matter out of nothing.\" The latter would indeed have been more wonderful, but would not have seemed so credible to the many. And therefore He often purposely lessens the greatness of His miracles, that it may be the more readily received.", "lang": "english", "orig": ""}, {"v": 7, "f": "John Chrysostom", "w": "", "t": "\"But why,\" says one, \"did not He Himself produce the water which He afterwards showed to be wine, instead of bidding the servants bring it?\" For the very same reason; and also, that He might have those who drew it out to witness that what had been effected was no delusion since if any had been inclined to be shameless, those who ministered might have said to them, \"We drew the water, we filled the vessels.\" And besides what we have mentioned, He thus overthrows those doctrines which spring up against the Church. For since there are some who say that the Creator of the world is another, and that the things which are seen are not His works, but those of a certain other opposing god, to curb these men's madness He doth most of His miracles on matter found at hand. Because, had the creator of these been opposed to Him, He would not have used what was another's to set forth His own power. But now to show that it is He who transmutes water in the vine plants, and who converts the rain by its passage through the root into wine, He effected that in a moment at the wedding which in the plant is long in doing.", "lang": "english", "orig": ""}, {"v": 7, "f": "John Chrysostom", "w": "", "t": "(Hom. xxii. 2) But why did He not work the miracle before they had filled the waterpots, which would have been much more wonderful; inasmuch as it is one thing to change the quality of some existing substance, another to make it that substance out of nothing? The latter miracle would be the more wonderful, but the former would be the more easy of belief. And this principle often acts as a check, to moderate the greatness of our Lord's miracles: He wishes to make them more credible, therefore He makes them less marvellous; a refutation this of the perverse doctrine of some, that He was a different Being from the Maker of the world. For we see He performs most of His miracles upon subject-matter already existing, whereas were He contrary to the Creator of the world, He would not use a material thus alien, to demonstrate His own power. He did not draw out the water Himself which He made wine, but ordered the servants to do so. This was for the sake of having witnesses of the miracle; And He saith unto them, Draw out now, and bear unto the governor of the feast.", "lang": "english", "orig": ""}, {"v": 7, "f": "Maximus of Turin", "w": "", "t": "Addressing the expectant servants, he said, “Fill the jars with water.” The servants promptly obeyed, and suddenly in a marvelous way the water began to acquire potency, take on color, emit fragrance and gain flavor—all at once it changed its nature completely! Now this transformation of the water from its own substance into another testified to the powerful presence of the Creator. Only he who had made it out of nothing could change water into something whose use was quite different. Dearly beloved, have no doubt that he who changed water into wine is the same as he who from the beginning has thickened it into snow and hardened it into ice. It is he who changed it into blood for the Egyptians and bade it flow from the dry rock for the thirsty Hebrews—the rock that, newly transformed into a spring, was like a mother’s breast refreshing with its gentle flow a countless multitude of people.", "lang": "english", "orig": ""}, {"v": 7, "f": "Methodius of Olympus", "w": "", "t": "They heard of the wine that, without previous culture, was ministered;", "lang": "english", "orig": ""}, {"v": 7, "f": "Theophylact of Ohrid", "w": "", "t": "But could He not have produced wine from nothing, without filling the vessels with water? Of course He could; but the greatness of miracles often diminishes their acceptability.\nThere could also have been the purpose of having the servants who carried the water into the vessels serve as witnesses of the miracle. Furthermore, so that we might learn that it is He who transforms the wine and the moisture of the grape, which is nothing but water.", "lang": "english", "orig": ""}, {"v": 7, "f": "Thomas Aquinas", "w": "", "t": "Then when he says that Jesus instructed them, Fill those jars with water, he gives the material of the miracle. Here we might ask why this miracle was performed with already existing material, and not from nothing. There are three reasons for this. The first reason is literal, and is given by Chrysostom: to make something from nothing is much greater and more marvelous than to make something from material already existing; but it is not so evident and believable to many. And so, wishing to make what he did more believable, Christ made wine from water, thus condescending to man's capacity.\n\nAnother reason was to refute wrong dogmas. For there are some (as the Marcionists and Manicheans) who said that the founder of the world was someone other than God, and that all visible things were established by such a one, that is, the devil. And so the Lord performed many miracles using created and visible substances in order to show that these substances are good and were created by God.\n\nThe third reason is mystical. Christ made the wine from water, and not from nothing, in order to show that he was not laying down an entirely new doctrine and rejecting the old, but was fulfilling the old: \"I have not come to destroy the law, but to fulfill it\" (Mt 5:17). In other words, what was prefigured and promised in the old law, was disclosed and revealed by Christ: \"Then he opened their minds so they could understand the Scriptures\" (Lk 24:45).\n\nFinally, he had the servants fill the jars with w", "lang": "english", "orig": ""}, {"v": 7, "f": "npnf204", "w": "Chapter II.—Conduct of the Arians towards the Nicene Council. Ignorant as well as irreligious\nto attempt to reverse an Ecumenical Council: proceedings at Nicæa: Eusebians then signed\nwhat they now complain of: on the unanimity of true teachers and the process of tradition:\nchanges of the Arians.", "t": "ncentius’s celebrated Commonitorium passim.\n772 1 John ii. 7.\n773 1 Tim. iii. 8.\n\n\nbe anathema774.” Since then the Apostle thus speaks, let these men", "lang": "greek", "orig": ""}, {"v": 8, "f": "Theodore of Mopsuestia", "w": "", "t": "According to the will of the one who gave the command, the water was changed into wine, slaking the thirst of those who drank but also providing wine more abundantly for the couple’s future.", "lang": "english", "orig": ""}, {"v": 8, "f": "Theophylact of Ohrid", "w": "", "t": "He commands the servants to bring the drink for tasting to the master of the feast not without purpose, but so that no one would think that it was a gathering of drunkards, that their taste had been corrupted, and that in a state of drunkenness they mistook water for wine. So that such a suspicion would have no place, He entrusts the tasting to the sober one — the master of the feast. For those who were entrusted with serving at such occasions strictly abstained, so that under their direction everything would proceed in an orderly and decorous manner.\nBut let us pray that this may be accomplished in us as well, that now there may take place, as it were, a marriage, that is, a union of God with our soul, while we are still in Cana of Galilee, that is, in the land of this low and perverted world, in every respect distorted and distorting. But this marriage does not take place without the presence of Christ and His Mother and the disciples. For how shall he be united with God who does not believe in Christ, born of Mary and speaking through the apostles?\nLet us see, then, what miracle the Lord performs at such a wedding and at such a union of God with the soul. He transforms water into wine, filling our six stone water jars. By \"water\" you may understand our wateriness, laxity, and feebleness in life and opinions; by five of the \"water jars,\" the five senses, through which we err in deeds; by the sixth water jar, the intellect, by which we waver in opinions. Thus our Lord Jesus ", "lang": "english", "orig": ""}, {"v": 8, "f": "Thomas Aquinas", "w": "", "t": "Then, the miracle is made known. For as soon as the jars were filled, the water was turned into wine. So the Lord reveals the miracle at once, saying: Now pour out a drink and take it to the head waiter. First, we have the command of Christ selecting who is to test the wine; secondly, the judgment of the head waiter who tasted it.\n\nThen Jesus said to them, i.e., to the servants, Now pour out a drink, that is, of wine, from the jars, and take it to the head waiter (architriclinus). Here we should note that a triclinium is a place where there are three rows of tables, and it is called a triclinium from its three rows of dining couches: for cline in Greek means couch. For the ancients were accustomed to eat reclining on couches, as Maximus Valerius recounts. This is the reason why the Scriptures speak of lying next to and lying down. Thus the architriclinus was the first and chief among those dining. Or, according to Chrysostom, the architriclinus was the one in charge of the whole banquet. And because he had been busy and had not tasted anything, the Lord wanted him, and not the guests, to be the judge of what had been done, so some could not detract from the miracle by saying the guests were drunk and, their senses dulled, could not tell wine from water. For Augustine, the architriclinus was the chief guest, as was mentioned; and Christ wanted to have the opinion of this person in high position so it would be more acceptable.\n\nIn the mystical sense, those who pour out the wate", "lang": "english", "orig": ""}, {"v": 9, "f": "Alcuin of York", "w": "", "t": "The Triclinium is a circle of three couches, cline signifying couch: the ancients used to recline upon couches. And the Architriclinus is the one at the head of the Triclinium, i. e. the chief of the guests. Some say that among the Jews, He was a priest, and attended the marriage in order to instruct in the duties of the married state.", "lang": "english", "orig": ""}, {"v": 9, "f": "Alcuin of York", "w": "", "t": "The servants are the doctors of the New Testament, who interpret the holy Scripture to others spiritually; the ruler of the feast is some lawyer, as Nicodemus, Gamaliel, or Saul. When to the former then is committed the word of the Gospel, hid under the letter of the law, it is the water made wine, being set before the ruler of the feast. And the three rows of guests at table in the house of the marriage are properly mentioned; the Church consisting of three orders of believers, the married, the continent, and the doctors.", "lang": "english", "orig": ""}, {"v": 9, "f": "Athanasius - Select Works", "w": "Chapter 13.", "t": "r. Ep. lxxiii. 15; 2 Cor. vi. 14.\n1414 Ib.\n1415 1 John ii. 9.\n1416 Phil. i. 15, 16.\n1417 Cypr l.c.\n1418 Cypr Ep. xi. 1.\n1419 Cypr. Ep. lxxiii. 15.\n1420 Cypr. Ep. lxxiii. 15.\n\n\nwill then say, \"Depart from me, ye that work iniquity,\"1421 and \"Depart into everlas", "lang": "greek", "orig": ""}, {"v": 9, "f": "Augustine - City of God", "w": "Tractate XCI.", "t": "15–21, and xv. 32–38.\n1485 Matt. xiv. 25–29.\n1486 John ii. 9.\n1487 John ix. 7.\n1488 Ex. vii.-xii.\n\n\nthe sea,1489 when he obtained manna for them from heaven in their hunger,1490 a", "lang": "latin", "orig": ""}, {"v": 9, "f": "Augustine - Confessions", "w": "Sermon XXXII.", "t": "alone,” and thou hast listened to him, he\n2734 1 John ii. 9.\n2735 Matt. xviii. 15.\n\n\nhath “gained” thee. What can “hath gained thee,” mean; but that thou hadst been lost, if he\nhad not gained thee. For if thou wouldest not have been lost, how hath he gained t", "lang": "latin", "orig": ""}, {"v": 9, "f": "Augustine of Hippo", "w": "", "t": "(Tr. ix. c. 5) But see the mysteries which lie hid in that miracle of our Lord. It was necessary that all things should be fulfilled in Christ which were written of Him: those Scriptures were the water. He made the water wine when He opened unto them the meaning of these things, and expounded the Scriptures; for thus that came to have a taste which before had none, and that inebriated, which did not inebriate before.", "lang": "english", "orig": ""}, {"v": 9, "f": "CS Lewis", "w": "", "t": "There is an activity of God displayed throughout creation, a wholesale activity let us say which men refuse to recognize. The miracles done by God incarnate, living as a man in Palestine, perform the very same things as this wholesale activity, but at a different speed and on a smaller scale. One of their chief purposes is that men, having seen a thing done by personal power on the small scale, may recognize, when they see the same thing done on the large scale, that the power behind it is also personal – is indeed the very same person who lived among us two thousand years ago. The miracles in fact are a retelling in small letters of the very same story which is written across the whole world in letters too large for some of us to see...\n\nGod creates the vine and teaches it to draw up water by its roots and, with the aid of the sun, to turn water into a juice which will ferment and take on certain qualities. Thus every year, from Noah’s time till ours, God turns water into wine. That, men fail to see. Either like the Pagans they refer the process to some finite spirit, Bacchus or Dionysus: or else, like the moderns, they attribute real and ultimate causality to the chemical and other material phenomena which are all that our senses can discover in it. But when Christ at Cana makes water into wine, the mask is off. The miracle has only half its effect if it only convinces us that Christ is God: it will have its full effect if whenever we see a vineyard or drink a glass of wine", "lang": "english", "orig": ""}, {"v": 9, "f": "CS Lewis", "w": "", "t": "Where, then, do we draw the line between explaining and \"explaining away\"? I do not think there is much difficulty. All that concerns the unincarnate activities of God—His operation on that plane of being where sense cannot enter—must be taken along with imagery which we know to be, in the literal sense, untrue. But there can be no defense for applying the same treatment to the miracles of the Incarnate God. They are recorded as events on this earth which affected human senses. They are the sort of thing we can describe literally. If Christ turned water into wine, and we had been present, we could have seen, smelled, and tasted. The story that He did so is not of the same order as His \"sitting at the right hand of the Father.\" It is either fact, or legend, or lie. You must take it or leave it.", "lang": "english", "orig": ""}, {"v": 9, "f": "CS Lewis", "w": "", "t": "Dr Pittenger contrasts my view with that which makes miracles a sign of God's action and presence in creation. Yet in chapter 15 I say that the miracle at Cana manifests \"the God of Israel who has through all these centuries given us wine\" and that in the miraculous feedings God \"does close and small... what He has always been doing in the seas, the lakes and the little brooks\". Surely this is just what Dr Pittenger wanted me to say, and what Athanasius says (De Incarnatione xiv. 8, edited by F. L. Cross, 1939)?", "lang": "english", "orig": ""}, {"v": 9, "f": "CS Lewis", "w": "", "t": "Of the natural conversion of water into wine, what I said was: \"God creates the vine and teaches it to draw up water by its roots and, with the aid of the sun, to turn that water into a juice which will ferment and take on certain qualities.\" For completeness I should, no doubt, have added \"with the aid of the soil\", and perhaps other things; but this would not, from my point of view, have materially altered what I was saying. My answer to Mr May's question — where the other raw materials came from — would be the same, whether the list of raw materials be reduced to the mere vegetable and sunlight I mentioned, or extended to bring in all that the skilled botanist might add. I think they came from the same source at Cana whence they come in Nature... What I was doing was to combat that particular argument for its falsity which rests on the idea that, if it occurred, such an event would be arbitrary and meaningless.", "lang": "english", "orig": ""}, {"v": 9, "f": "Chrysostom - Homilies on Galatians-Philemon", "w": "Homily VII.", "t": "“He that hateth his brother, knoweth not God.” (1 John ii. 9.) Such are the various\nways of ungodliness. Therefore he says, “All godliness and good order.”1167 For not only is\nthe forn", "lang": "greek", "orig": ""}, {"v": 9, "f": "Ephrem the Syrian", "w": "", "t": "He who did not want to change stones changed water at Cana.", "lang": "english", "orig": ""}, {"v": 9, "f": "Hilary of Poitiers", "w": "", "t": "On the wedding day in Galilee, water was made wine. Do we have appropriate words or senses to ascertain what methods produced the change by which the tastelessness of water disappeared and was replaced by the full flavor of wine? It was not a mixing; it was a creation, and a creation that was not a beginning but a transformation. A weaker liquid was not obtained by admixture of a stronger element; an existing entity perished, and a new entity came into being. The bridegroom was anxious, the household in confusion, the harmony of the marriage feast imperiled. Jesus is asked for help. He does not get up or busy himself. He does the work without any effort. Water is poured into the vessels, wine drawn out in the cups. The evidence of the senses of the pourer contradicts that of the one who draws it out. Those who poured expect water to be drawn; those who draw out think that wine must have been poured in. The intervening time cannot account for any gain or loss of character in the liquid. The mode of action baffles sight and sense, but the power of God is manifest in the result achieved.", "lang": "english", "orig": ""}, {"v": 9, "f": "Hilary of Poitiers", "w": "", "t": "(iii. de Trin. c. 5) Water is poured into the waterpots; wine is drawn out into the chalices; the senses of the drawer out agree not with the knowledge of the pourer in. The pourer in thinks that water is drawn out; the drawer out thinks that wine was poured in. When the ruler of the feast had tasted the water that was made wine, and knew not whence it was, (but the servants who drew the water knew,) the governor of the feast called the bridegroom. It was not a mixture, but a creation: the simple nature of water vanished, and the flavour of wine was produced; not that a weak dilution was obtained, by means of some strong infusion, but that which was, was annihilated; and that which was not, came to be.", "lang": "english", "orig": ""}, {"v": 9, "f": "Hippolytus", "w": "Epistle LXII.2663", "t": "Argument.—Cyprian Teaches, in Opposition to Those Who Used Water in the Lord’s\nSupper, that Not Water Alone, But Wine Mixed with Water, Was to Be Offered;\nThat by Water Was Designated in Scripture, Baptism, But Certainly Not the\nEucharist. By Types Drawn from the Old Testament, the Use of Wine in the\nSacrament of the Lord’s Body is Illustrated; And It is Declared that by the Symbol\nof Water is Understood the Christian Congregation.", "lang": "greek", "orig": ""}, {"v": 9, "f": "John Chrysostom", "w": "", "t": "Thus when he was about to heal the nobleman's son, the Evangelist has shown that it had already become more clearly known; for it was chiefly because the nobleman had become acquainted with the miracle that he called upon Him, as John incidentally shows when he says, \"Jesus came into Cana of Galilee, where He made the water wine.\" (c. iv. 46.) And not wine simply, but the best wine.\n\nFor such are the miraculous works of Christ, they are far more perfect and better than the operations of nature. This is seen also in other instances; when He restored any infirm member of the body, He made it better than the sound.\n\nThat it was wine then, and the best of wine, that had been made, not the servants only, but the bridegroom and the ruler of the feast would testify; and that it was made by Christ, those who drew the water; so that although the miracle were not then revealed, yet it could not in the end be passed in silence, so many and constraining testimonies had He provided for the future. That He had made the water wine, He had the servants for witnesses; that the wine was good that had been made, the ruler of the feast and the bridegroom.", "lang": "english", "orig": ""}, {"v": 9, "f": "John Chrysostom", "w": "", "t": "Here again some mock, saying, \"this was an assembly of drunken men, the sense of the judges was spoilt, and not able to taste what was made, or to decide on what was done, so that they did not know whether what was made was water or wine: for that they were drunk,\" it is alleged, \"the ruler himself has shown by what he said.\" Now this is most ridiculous, yet even this suspicion the Evangelist has removed. For he does not say that the guests gave their opinion on the matter, but \"the ruler of the feast,\" who was sober, and had not as yet tasted anything. For of course you are aware, that those who are entrusted with the management of such banquets are the most sober, as having this one business, to dispose all things in order and regularity; and therefore the Lord called such a man's sober senses to testify to what was done. For He did not say, \"Pour forth to them that sit at meat,\" but, \"Bear unto the governor of the feast.\"", "lang": "english", "orig": ""}, {"v": 9, "f": "John Chrysostom", "w": "", "t": "\"And when the ruler of the feast had tasted the water that was made wine, and knew not whence it was, (but the servants knew,) the governor of the feast called the bridegroom.\" \"And why did he not call the servants? for so the miracle would have been revealed.\" Because Jesus had not Himself revealed what had been done, but desired that the power of His miracles should be known gently, little by little. And suppose that it had then been mentioned, the servants who related it would never have been believed, but would have been thought mad to bear such testimony to one who at that time seemed to the many a mere man; and although they knew the certainty of the thing by experience, (for they were not likely to disbelieve their own hands,) yet they were not sufficient to convince others. And so He did not reveal it to all, but to him who was best able to understand what was done, reserving the clearer knowledge of it for a future time; since after the manifestation of other miracles this also would be credible.", "lang": "english", "orig": ""}, {"v": 9, "f": "Theodoret - Church History", "w": "Chapter 1.—What is to Be Said Thereupon.", "t": "ven\n358 See above, Book ii. chap. vii. n. 13.\n359 John ii. 9\n\n\nthen was it altered into all fashions, and was obedient to Thy grace, that nourisheth all things\naccording to the desire of them that longed for Thee.”360 For the power of the will of God\nreaches t", "lang": "greek", "orig": ""}, {"v": 9, "f": "Theophylact of Ohrid", "w": "", "t": "The master of the feast asks not the servants, but the bridegroom. Why? Of course, by divine arrangement. If he had asked the servants, they would certainly have revealed the miracle; but no one would have believed them, for it was the beginning of signs, and no one yet had a great opinion of Christ, so that no one would have believed even if the servants had told of the miracle. However, when after this He performed other miracles as well, the present one too was bound to become credible, and the servants, telling everyone about it, could little by little gain trust. For this reason the Lord arranged it so that not the servants were asked, but the bridegroom.", "lang": "english", "orig": ""}, {"v": 9, "f": "Thomas Aquinas", "w": "", "t": "Then the judgment of the one examining the wine is given. First, he inquires into the truth of the fact; secondly, he gives his opinion.\n\nHe says, Now when the head waiter tasted the water made wine, and not knowing where it came from, because he did not know that the water had miraculously been made wine by Christ, although the servants knew, the reason being, since they had drawn the water, he called the groom over, in order to learn the truth and give his opinion of the wine.", "lang": "english", "orig": ""}, {"v": 9, "f": "npnf210", "w": "CHAPTER I.", "t": "profession with receiving the veil, etc.\n2477 S. John ii. 9.\n2478 S. Luke ix. 13.\n2479 Cant. v. 1.\n2480 S. John i. 1.\n2481 S. John i. 1.\n\n\nyou have His power, undivided and inseparable from the Father. “And the Word was\nGod.”2482 Here you have His unbegotten", "lang": "greek", "orig": ""}, {"v": 10, "f": "1 Clement", "w": "Chapter XI—Proofs in continuation, extracted from St. John’s Gospel. The\nGospels are four in number, neither more nor less. Mystic reasons for this.", "t": "5. That wine,793 which was produced by God in a vineyard, and which was first consumed,\nwas good. None794 of those who drank of it found fault with it; and the Lord partook\nof it also. But that wine was better which the Word made from water, on the moment, and\nsimply for the use of those who had been called to the marriage. For although the Lord had\nthe power to supply wine to those feasting, independently of any created substance, and to\nfill with food those who were hungry, He did not adopt this course; but, taking the loaves\nwhich the earth had produced, and giving thanks,795 and on the other occasion making\nwater wine, He satisfied those who were reclining [at table], and gave drink to those who\nhad been invited to the marriage; showing that the God who made the earth, and commanded\nit to bring forth fruit, who established the waters, and brought forth the fountains, was He\nwho in these last times bestowed upon mankind, by His Son, the blessing of food and the\nfavour of drink: the Incomprehensible [acting thus] by means of the comprehensible, and\nthe Invisible by the visible; since there is none beyond Him, but He exists in the bosom of\nthe Father.", "lang": "greek", "orig": ""}, {"v": 10, "f": "Alcuin of York", "w": "", "t": "Christ has kept the good wine until now, i. e. He has deferred the Gospel till this, the sixth age.", "lang": "english", "orig": ""}, {"v": 10, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "20. And wine makes glad the heart of man Psalm 103:15. Let no man prepare himself for intoxication; nay, let every man prepare him for intoxication. How excellent is Your cup which makes inebriate! We choose not to say, Let no man be drunk. Be inebriated; yet beware, from what source. If the excellent cup of the Lord does saturate you, your ebriety shall be seen in your works, it shall be seen in the holy love of righteousness, it shall, lastly, be seen in the estrangement of your mind, but from things earthly to heavenly. To make him a cheerful countenance with oil....What is the making the countenance cheerful with oil? The grace of God; a sort of shining for manifestation; as the Apostle says, The Spirit is given to every man for manifestation. 1 Corinthians 12:7 A certain grace which men can clearly see in men, to conciliate holy love, is termed oil, for its divine splendour; and since it appeared most excellent in Christ, the whole world loves Him; who though while here He was scorned, is now worshipped by every nation: For the kingdom is the Lord's, and He shall be Governor among the people. For such is His grace, that many, who do not believe in Him, praise Him, and declare that they are unwilling to believe in Him, because no man can fulfil what He does command. They who with reproaches once raged against Him, are hindered by His very praises.", "lang": "", "orig": ""}, {"v": 10, "f": "Augustine of Hippo", "w": "", "t": "For the bridegroom in that marriage, to whom it was said, \"Thou hast kept the good wine until now,\" represented the person of the Lord. For the good wine-namely, the gospel-Christ has kept until now.", "lang": "english", "orig": ""}, {"v": 10, "f": "Ephrem the Syrian", "w": "Commentary on Exodus", "t": "23. Out of water He made the wine, He gave it for drink to the youths in the feast. For you who are keeping the fast, better is the unction than drink. In His wine the betrothed are wedded, by His oil the wedded are sanctified. By His wine is union; by His oil sanctification.", "lang": "", "orig": ""}, {"v": 10, "f": "GK Chesterton", "w": "", "t": "Again and again, before our time, men have grown content with a diluted doctrine. And again and again there has followed on that dilution, coming as out of the darkness in a crimson cataract, the strength of the red original wine. And we only say once more to-day as has been said many times by our fathers: ‘Long years and centuries ago our fathers or the founders of our people drank, as they dreamed, of the blood of God. Long years and centuries have passed since the strength of that giant vintage has been anything but a legend of the age of giants. Centuries ago already is the dark time of the second fermentation, when the wine of Catholicism turned into the vinegar of Calvinism. Long since that bitter drink has been itself diluted; rinsed out and washed away by the waters of oblivion and the wave of the world. Never did we think to taste again even that bitter tang of sincerity and the spirit, still less the richer and the sweeter strength of the purple vineyards in our dreams of the age of gold. Day by day and year by year we have lowered our hopes and lessened our convictions; we have grown more and more used to seeing those vats and vineyards overwhelmed in the water-floods and the last savour and suggestion of that special element fading like a stain of purple upon a sea of grey. We have grown used to dilution, to dissolution, to a watering down that went on for ever. But Thou hast kept the good wine until now.’", "lang": "english", "orig": ""}, {"v": 10, "f": "GK Chesterton", "w": "", "t": "Dionysus and his church was grounded on a serious joie-de-vivre like that of Walt Whitman. Dionysus made wine, not a medicine, but a sacrament. Jesus Christ also made wine, not a medicine, but a sacrament. But Omar makes it, not a sacrament, but a medicine. He feasts because life is not joyful; he revels because he is not glad.", "lang": "english", "orig": ""}, {"v": 10, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But do not so; for this is of a satanical mind; do not find fault with the wine, but with the drunkenness; and when you have found this self-same man sober, sketch out all his unseemliness, and say unto him, Wine was given, that we might be cheerful, not that we might behave ourselves unseemly; that we might laugh, not that we might be a laughingstock; that we might be healthful, not that we might be diseased; that we might correct the weakness of our body, not cast down the might of our soul.", "lang": "", "orig": ""}, {"v": 10, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For instance, I hear many say, when these excesses happen, Would there were no wine. O folly! O madness! When other men sin, do you find fault with God's gifts? And what great madness is this? What? Did the wine, O man, produce this evil? Not the wine, but the intemperance of such as take an evil delight in it. Say then, Would there were no drunkenness, no luxury; but if you say, Would there were no wine, you will say, going on by degrees, Would there were no steel, because of the murderers; no night, because of the thieves; no light, because of the informers; no women, because of adulteries; and, in a word, you will destroy all.", "lang": "", "orig": ""}, {"v": 10, "f": "Theophylact of Ohrid", "w": "", "t": "The Lord did not simply make wine out of water, but excellent wine. For the miracles of Christ are such that they far surpass what is accomplished by nature. That the water was turned into wine is attested by the servants who drew the water; that it was excellent, by the master of the feast. All of this was proclaimed in the course of time, and those who heard of it were bound to be convinced very firmly.\nBy \"wine\" you can understand the evangelical teaching, and by \"water\" everything that preceded the Gospel, which was very watery and did not have the perfection of evangelical teaching. I will give an example: the Lord gave man various laws — one in Paradise (Gen. 2:16–17), another at the time of Noah (Gen. 9), a third at the time of Abraham concerning circumcision (Gen. 17), a fourth through Moses (Ex. 19; Ex. 20), and a fifth through the prophets. All these laws, in comparison with the exactness and power of the Gospel, are watery, if one understands them simply and literally. But if one delves into their spirit and comprehends what is hidden in them, he will find the water turned into wine. For he who discerns spiritually what is spoken simply and understood by many literally will undoubtedly find in this water a fine wine, drunk afterward and kept back by the Bridegroom Christ, since the Gospel indeed appeared in the last times.", "lang": "english", "orig": ""}, {"v": 10, "f": "Thomas Aquinas", "w": "", "t": "Hence he adds: People usually serve the choice wines first, and when the guests have had their fill, then they bring out inferior wine.\n\nHere we should consider, according to Chrysostom, that everything is most perfect in the miracles of Christ. Thus, he restored most complete health to Peter's mother-in-law, so that she arose at once and waited on them, as we read in Mark (1:30) and Matthew (7:14). Again, he restored the paralytic to health so perfectly that he also arose immediately, took up his mat, and went home, as we read below (5:9). And this is also evident in this miracle, because Christ did not make mediocre wine from the water, but the very best possible. And so the head waiter says, People usually serve the choice wines first, and when the guests have had their fill, then they bring out inferior wine, because they drink less, and because good wine consumed in quantity along with a quantity of food causes greater discomfort. It is as though he were saying: Where did this very good wine come from which, contrary to custom, you saved until now?\n\nThis is appropriate to a mystery. For in the mystical sense, he serves good wine first who, with an intent to deceive others, does not first mention the error he intends, but other things that entice his hearers, so that he can disclose his evil plans after they have been intoxicated and enticed to consent. We read of such wine: \"It goes down pleasantly, but finally it will bite like a serpent\" (Prv 23:31). Again, he serves g", "lang": "english", "orig": ""}, {"v": 10, "f": "npnf214", "w": "Canon XXXII.", "t": "“And wherefore did he not drink water after he was risen again, but wine? To pluck up\nby the roots another wicked heresy. For since there are certain who use water in the Mysteries\nto shew that both when he delivered the mysteries he had given wine and that when\nhe had risen and was setting before them a mere meal without mysteries, he used wine, ‘of\nthe fruit,’ saith he, ‘of the vine.’ But a vine produces wine, not water.”369 And from this\nthey think the doctor overthrows the admixture of water in the holy sacrifice. Now, lest on\nthe point from this time forward they be held in ignorance, we open out the orthodox\nopinion of the Father. For since there was an ancient and wicked heresy of the Hydroparastatæ\n(i.e., of those who offered water), who instead of wine used water in their sacrifice,\nthis divine, confuting the detestable teaching of such a heresy, and showing that it is directly\nopposed to Apostolic tradition, asserted that which has just been quoted. For to his own\nchurch, where the pastoral administration had been given him, he ordered that water mixed\nwith wine should be used at the unbloody sacrifice, so as to shew forth the mingling of the\nblood and water which for the life of the whole world and for the redemption of its sins,\nwas poured forth from the precious side of Christ our Redeemer; and moreover in every\nchurch where spiritual light has shined this divinely given order is observed.", "lang": "greek", "orig": ""}, {"v": 11, "f": "Alcuin of York", "w": "", "t": "He was the King of glory, and changed the elements because He was their Lord.", "lang": "english", "orig": ""}, {"v": 11, "f": "Athanasius - Select Works", "w": "Chapter 11", "t": "1180 John xx. 23.\n1181 Song of Sol. vi. 9.\n1182 1 John ii. 11.\n1183 Gal. iii. 27.\n\n\nneither is there the baptism of Christ.\" But since we confess that the baptism of Christ exists\nin schism, we propose this question to them for solution: Was Simon Magus endued", "lang": "greek", "orig": ""}, {"v": 11, "f": "Augustine - Confessions", "w": "Sermon LXXIII.", "t": "was a stranger, I was in\n3671 Matt. iv. 11.\n3672 John ii. 11.\n3673 John i. 50, 51.\n3674 Acts ix. 4.\n\n\nprison.” 3675 And to some He said, “Ye have ministered unto Me,” and to some He said,\n“Ye have not ministered unto Me.” Lo, we have proved Christ poor; that C", "lang": "latin", "orig": ""}, {"v": 11, "f": "Augustine - Confessions", "w": "Chapter XVII.—Of the Calling of the Apostles as They Were Fishing.", "t": "38. For [it is noticeable that] again in Cana of Galilee, after He had turned the water\ninto wine, this same John tells us how His disciples believed on Him. The narrative of that\nmiracle proceeds thus: “And the third day there was a marriage in Cana of Galilee; and the\nmother of Jesus was there. And both Jesus was called and His disciples to the marriage.”831\nNow, surely, if it was on this occasion that they believed on Him, as the evangelist tells us\na little further on, they were not yet His disciples at the time when they were called to the\nmarriage. This, however, is a mode of speech of the same kind with what is intended when\nwe say that the Apostle Paul was born in Tarsus of Cilicia;832 for certainly he was not an\napostle at that period. In like manner are we told here that the disciples of Christ were invited\nto the marriage, by which we are to understand, not that they were already disciples, but\nonly that they were to be His disciples. For, at the time when this narrative was prepared\n828 Luke v. 10.\n829 Matt. iv. 10; Mark i. 17.\n830 Matt. iv. 13–23; Mark i. 16–20; Luke v. 1–11; John i. 35–44.\n831 John ii. 1, 2.\n832 Acts xxii. 3.\n\n\nand committed to writing, they were the disciples of Christ in fact; and that is the reason\nwhy the evangelist, as the historian of past times, has thus spoken of them.", "lang": "latin", "orig": ""}, {"v": 11, "f": "Augustine of Hippo", "w": "", "t": "(Tr. ix) This miracle of our Lord's, turning the water into wine, is no miracle to those who know that God worked it. For the Same that day made wine in the waterpots, Who every year makes wine in the vine: only the latter is no longer wonderful, because it happens uniformly. And therefore it is that God keeps some extraordinary acts in store for certain occasions, to rouse men out of their lethargy, and make them worship Him. Thus it follows, He manifested forth His glory.", "lang": "english", "orig": ""}, {"v": 11, "f": "Augustine of Hippo", "w": "", "t": "(de Cons. Evang. l. ii c. xvii. [38.]) If now for the first time they believed on Him, they were not His disciples when they came to the marriage. This however is a form of speech, such as saying that the Apostle Paul was born in Tarsus of Cilicia; not meaning by this that he was an Apostle then. In the same way when we hear of Christ's disciples being invited to the marriage, we should understand not disciples already, but who were to be disciples.", "lang": "english", "orig": ""}, {"v": 11, "f": "Bede", "w": "", "t": "By this sign he made manifest that he was the King of glory, and so the church’s bridegroom. He came to the marriage as a common human being, but as Lord of heaven and earth he could convert the elements as he wished. How beautifully appropriate it is that when he began the signs that he would show to mortals while he was still mortal he turned water into wine. [But] when he had become immortal through his resurrection, he began the signs that he would show only to those who were pursuing the goal of immortal life.… Therefore, let us love with our whole mind, dearly beloved, the marriage of Christ and the church, which was prefigured then in one city and is now celebrated over the whole earth.", "lang": "english", "orig": ""}, {"v": 11, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Homily XXIII.", "t": "And what is that? “This beginning of miracles did Jesus in Cana of Galilee.” I told you\nthe other day, that there are some who say that this is not the beginning. “For what,” says\none, “if ‘Cana of Galilee’ be added? This shows that this was ‘the beginning’ He made ‘in\nCana.’”594 But on these points I would not venture to assert anything exactly. I before have\nshown that He began His miracles after His Baptism, and wrought no miracle before it; but\nwhether of the miracles done after His Baptism, this or some other was the first, it seems to\nme unnecessary to assert positively.", "lang": "greek", "orig": ""}, {"v": 11, "f": "Cyril of Alexandria", "w": "", "t": "Many most excellent things were accomplished at once through the one first miracle. For honourable marriage was sanctified, the curse on women put away (for no more in sorrow shall they bring forth children, now Christ has blessed the very beginning of our birth), and the glory of our Saviour shone forth as the sun's rays, and more than this, the disciples are confirmed in faith by the miracle.\n\nThe historical account then will stop here, but I think we ought to consider the other view of what has been said, and to say what is therein signified. The Word of God came down then from Heaven, as He Himself saith, in order that having as a Bridegroom, made human nature His own, He might persuade it to bring forth the spiritual offspring of Wisdom. And hence reasonably is the human nature called the bride, the Saviour the Bridegroom; since holy Scripture carries up language from human things to a meaning that is above us. The marriage is consummated on the third day, that is, in the last times of the present world: for the number three gives us beginning, middle, end. For thus is the whole of time measured. And in harmony with this do we see that which is said by one of the prophets, He hath smitten, and He will bind us up. After two days will He revive us, in the third day He will raise us up, and we shall live in His Sight. Then shall we know if we follow on to know the Lord; His going forth is prepared as the morning. For He smote us for the transgression of Adam, saying, Dust t", "lang": "english", "orig": ""}, {"v": 11, "f": "Cyril of Jerusalem", "w": "", "t": "[Jesus] once changed water into wine by a word of command at Cana of Galilee. Should we not believe him when he changes wine into blood? It was when he had been invited to an ordinary bodily marriage that he performed the wonderful miracle at Cana. Should we not be much more ready to acknowledge that to “the sons of the bridal chamber” he has granted the enjoyment of his body and blood?", "lang": "english", "orig": ""}, {"v": 11, "f": "John Chrysostom", "w": "", "t": "(Hom. xx) Should any say that there is not sufficient proof of this being the beginning of miracles, because it is added, in Cana of Galilee, as if some had been preferred elsewhere: we answer, as we did before, that John says below, That He might be made manifest to Israel, therefore have I come baptizing. (c. 1) (Hom. xxi. 2). Now if He had performed miracles in the earlier part of His life, the Jews would not have wanted another person to point Him out. If our Lord in a short time became so distinguished for the number of His miracles, that His Name was known to every one, would He not have been much more so, had He worked miracles from His earliest years? for the things themselves would have been the more extraordinary, being performed by a Child, and in so long a time must have become notorious. It was fit and proper however that He should not begin to work miracles at so early an age: for men would have thought the Incarnation a phantasy, and in the extremity of envy would have delivered Him to be crucified before the appointed time.", "lang": "english", "orig": ""}, {"v": 11, "f": "John Chrysostom", "w": "", "t": "\"This beginning of miracles did Jesus in Cana of Galilee.\" I told you the other day, that there are some who say that this is not the beginning. \"For what,\" says one, \"if 'Cana of Galilee' be added? This shows that this was 'the beginning' He made 'in Cana.'\" But on these points I would not venture to assert anything exactly. I before have shown that He began His miracles after His Baptism, and wrought no miracle before it; but whether of the miracles done after His Baptism, this or some other was the first, it seems to me unnecessary to assert positively.\n\n\"And manifested forth His glory.\"\n\n\"How?\" asks one, \"and in what way? For only the servants, the ruler of the feast, and the bridegroom, not the greater number of those present, gave heed to what was done.\" How then did he \"manifest forth His glory\"? He manifested it at least for His own part, and if all present hear not of the miracle at the time, they would hear of it afterwards, for unto the present time it is celebrated, and has not been unnoticed. That all did not know it on the same day is clear from what follows, for after having said that He \"manifested forth His glory,\" the Evangelist adds,\n\n\"And His disciples believed on Him.\"\n\nHis disciples, who even before this regarded Him with wonder. Seest thou that it was especially necessary to work the miracles at times when men were present of honest minds, and who would carefully give heed to what was done? for these would more readily believe, and attend more exactly t", "lang": "english", "orig": ""}, {"v": 11, "f": "Maximus of Turin", "w": "", "t": "It was not what they saw happening that the disciples believed but what could not be seen by bodily eyes. They did not believe that Jesus Christ was the son of the Virgin—that was something they knew. Rather, they believed that he was the only Son of the Most High, as this miracle proved. And so let us too believe wholeheartedly that he whom we confess to be the Son of man is also the Son of God. Let us believe not only that he shared our nature but also that he was consubstantial with the Father; for as a man he was present at the wedding, and as God he changed the water into wine. If such is our faith, the Lord will give us also to drink of the sobering wine of his grace.", "lang": "english", "orig": ""}, {"v": 11, "f": "Romanos the Melodist", "w": "", "t": "When Christ, as a sign of His power, clearly changed the water into wine\nAll the crowd rejoiced, for they considered the taste marvelous.\nNow we all partake at the banquet in the church\nFor Christ’s blood is changed into wine\nAnd we drink it with holy joy,\nPraising the great bridegroom,\nFor he is the true bridegroom, the Son of Mary,\nThe Word before all time who took the form of a servant,\nHe who has in wisdom created all things.", "lang": "english", "orig": ""}, {"v": 11, "f": "Theophylact of Ohrid", "w": "", "t": "That the Lord began to work miracles after His baptism, we have spoken of this before. But it seems that the first miracle He performed was precisely the transformation of water into wine. For it is said: \"This 'beginning' of miracles did He.\" But someone will say: \"If this miracle is the beginning of miracles, it is not the beginning of all miracles, but only of those performed in Cana of Galilee; since He performed various miracles in Cana, this one was the beginning of those.\" Although we have much to confirm that the present miracle is the beginning of all miracles as well, because the words \"and manifested His glory; and His disciples believed in Him\" show that before this He had not performed any other miracle by which He would have manifested His glory; nevertheless, let us not argue whether this was the first miracle or another.\nHow then did He manifest His glory? For few were present at this event, and it was not performed before the people? But if not then, afterwards all were to hear of this miracle, as it is proclaimed even to this day, and did not remain unknown. The words \"His disciples believed in Him\" understand thus: that they acquired a greater and stronger faith in Him. They believed before, of course, but they did not believe so firmly.", "lang": "english", "orig": ""}, {"v": 11, "f": "Thomas Aquinas", "w": "", "t": "Then when he says, This beginning of signs Jesus worked in Cana of Galilee, he gives the disciples' acknowledgment of the miracle. We can see from this the falsity of the History of the Infancy of the Savior, which recounts many miracles worked by Christ as a boy. For if these accounts were true, the Evangelist would not have said, This beginning of signs Jesus worked. We have already given the reason why Christ worked no miracles during his childhood, that is, lest men regard them as illusions.\n\nIt was for the reason given above, then, that Jesus performed this miracle of turning water into wine at Cana of Galilee; and this was the first of the signs he did. And Jesus revealed his glory, i.e., the power by which he is glorious: \"The Lord of hosts, he is the King of glory\" (Ps 23:10).\n\nAnd his disciples believed in him. But how did they believe? For they already were his disciples and had believed before this. I answer that sometimes a thing is described not according to what it is at the time, but according to what it will be. For example, we say that the apostle Paul was born at Tarsus, in Cilicia; not that an actual apostle was born there, but a future one was. Similarly, it says here that his disciples believed in him, i.e., those who would be his disciples. Or, one might answer that previously they had believed in him as a good man, preaching what was right and just; but now they believed in him as God.", "lang": "english", "orig": ""}, {"v": 12, "f": "Alcuin of York", "w": "", "t": "Our Lord's brethren are the relations of Mary and Joseph, not the sons of Mary and Joseph. For not only the blessed Virgin, but Joseph also, the witness of her chastity, abstained from all conjugal intercourse.\n\nOr Capernaum, we may interpret \"a most beautiful village,\" and so it signifies the world, to which the Word of the Father came down.", "lang": "english", "orig": ""}, {"v": 12, "f": "Augustine - Confessions", "w": "Chapter X.—Of the Evangelist John, and the Distinction Between Him and the\nOther Three.", "t": "in which holy men are in the habit of using\n1632 John ii. 12–22.\n1633 John iv. 48.\n1634 John v. 18.\n\n\nthe phrase, but that He meant that He is His equal. For, a little before this, He had said to\nthose who were impeaching Him with violating the Sabbath-day, “M", "lang": "latin", "orig": ""}, {"v": 12, "f": "Augustine of Hippo", "w": "", "t": "\"He went down,\" as the evangelist says, \"to Capernaum, He, and His mother, and His brethren, and His disciples; and they continued there not many days.\" Behold He has a mother, and brethren, and disciples: whence He has a mother, thence brethren. For our Scripture is wont to call them brethren, not only that are sprung from the same man and woman, or from the same mother, or from the same father, though by different mothers; or, in truth, that are of the same degree as cousins by the father's or mother's side: not these alone is our Scripture wont to call brethren. The Scripture must be understood as it speaks. It has its own language; one who does not know this language is perplexed and says, Whence had the Lord brethren? For surely Mary did not give birth a second time? Far from it! With her begins the dignity of virgins. She could be a mother, but a woman known of man she could not be. She is spoken of as mulier [which usually signifies a wife], but only in reference to her sex, not as implying loss of virgin purity: and this follows from the language of Scripture itself. For Eve, too, immediately she was formed from the side of her husband, and as yet not known of her husband, is, as you know, called mulier: \"And he made her a woman [mulier].\" Then, whence the brethren? The kinsmen of Mary, of whatever degree, are the brethren of the Lord. How do we prove this? From Scripture itself. Lot is called \"Abraham's brother;\" he was his brother's son. Read, and thou wilt find tha", "lang": "english", "orig": ""}, {"v": 12, "f": "Augustine of Hippo", "w": "", "t": "But rather were those disciples brethren; for even those kinsmen would not be brethren were they not disciples: and to no advantage brethren, if they did not recognize their brother as their master. For in a certain place, when He was informed that His mother and His brethren were standing without, at the time He was speaking to His disciples, He said: \"Who is my mother? or who are my brethren? And stretching out His hand over His disciples, He said, These are my brethren;\" and, \"Whosoever shall do the will of my Father, the same is my mother, and brother, and sister.\" Therefore also Mary, because she did the will of the Father. What the Lord magnified in her was, that she did the will of the Father, not that flesh gave birth to flesh. Give good heed, beloved. Moreover, when the Lord was regarded with admiration by the multitude, while doing signs and wonders, and showing forth what lay concealed under the flesh, certain admiring souls said: \"Happy is the womb that bare Thee: and He said, Yea, rather, happy are they that hear the word of God, and keep it.\" That is to say, even my mother, whom ye have called happy, is happy in that she keeps the word of God: not because in her the Word was made flesh and dwelt in us; but because she keeps that same word of God by which she was made, and which in her was made flesh. Let not men rejoice in temporal offspring, but let them exult if in spirit they are joined to God.", "lang": "english", "orig": ""}, {"v": 12, "f": "Augustine of Hippo", "w": "", "t": "(Tr. x. in Joan. 1, 2) The Lord our God is He, high, that He might create us; low, that He might create us anew; walking among men, suffering what was human, hiding what was divine. So He hath a mother, hath brethren, hath disciples: whence He hath a mother, thence hath He brethren. Scripture frequently gives the name of brethren, not to those only who are born of the same womb, or the same father, but to those of the same generation, cousins by the father's or mother's side. Those who are unacquainted with this way of speaking, ask, Whence hath our Lord brothers? did Mary bring forth again? That could not be: with her commenced the dignity of the virgin state. Abraham was uncle of Lot, and Jacob was nephew to Laban the Syrian. Yet Abraham and Lot are called brethren; and likewise Jacob and Laban.\n\n(de Cons. Ev. c. ii. c. xvii. [39.]) And His disciples; it is uncertain wh

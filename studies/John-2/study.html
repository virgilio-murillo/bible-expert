ether Peter and Andrew and the sons of Zebedee, were of their number or not at this time. For Matthew first relates that our Lord came and dwelt at Capernaum, and afterwards that He called those disciples from their boats, as they were fishing. Is Matthew perhaps supplying what he had omitted? For without any mention that it was at a subsequent time, he says, Jesus walking by the sea of Galilee saw two brethren. (Matt. 4:18) Or is it better to suppose that these were other disciples? For the writings of the Evangelists and Apostles, call not the twelve only, but all who believing in God were prepared for the ", "lang": "english", "orig": ""}, {"v": 12, "f": "Bede", "w": "", "t": "It tends to disturb some people that in the opening portion of this Gospel reading it is said that when our Lord went down to Capernaum, not only his mother and his disciples followed him, but also his brothers. There have been heretics who supposed that Joseph, the husband of the blessed Virgin Mary, begot of another wife those whom the Scriptures call the Lord’s brothers. Others, with greater lack of faith, have supposed that he begot these of Mary herself after our Lord’s birth. But we, dearly beloved brothers, without any hesitation or questioning must be aware and confess that not only the blessed Mother of God, but also Joseph, the most blessed witness and guardian of her chastity, always remained wholly aloof from the conjugal act; and further, that those who after the customary manner of the Scriptures are called our Savior’s brothers or sisters were not their children but their relatives. Abraham spoke to Lot in the following way, “I beseech you, let there be no wrangling between you and me, and your shepherds and mine; for we are brothers.” Laban [said] to Jacob, “Because you are my brother, why should you have to serve me for nothing?” It is a fact that Lot was the son of Haran, Abraham’s brother, and Jacob the son of Rebekah, Laban’s sister; but on account of their kinship they were called brothers. Because of this most common practice in the holy Scriptures, we should, as I have said, understand that the relatives of Mary and Joseph are called our Lord’s brothers", "lang": "english", "orig": ""}, {"v": 12, "f": "Bede", "w": "", "t": "He did not stay many days there, on account of the Passover, which was approaching: And the Jews' passover was at hand.\n\nBut He continued there only a few days, because he lived with men in this world only a short time.", "lang": "english", "orig": ""}, {"v": 12, "f": "Eusebius of Caesarea", "w": "", "t": "(Euseb. Eccl. Hist. l. iii. c. 24) When copies of the three Gospels had come to the Evangelist John, he is reported, while he confirmed their fidelity and correctness, to have at the same time noticed some omissions, especially at the opening of our Lord's ministry. Certain it is that the first three Gospels seem only to contain the events of the year in which John the Baptist was imprisoned, and put to death. And therefore John, it is said, was asked to write down those acts of our Saviour's before the apprehension of the Baptist, which the former Evangelists had passed over. Any one then, by attending, will find that the Gospels do not disagree, but that John is relating the events of a different date, from that which the others refer to.", "lang": "english", "orig": ""}, {"v": 12, "f": "Gospel of Peter", "w": "1. Jesus Comes to Capernaum. Statements of the Four Evangelists Regarding This.", "t": "n left them and came and dwelt in Capernaum.\n4988 John ii. 12–25.\n4989 The text is doubtful here, but the above seems to be the meaning.\n4990 Nazara is with Origen a neuter plural.\n\n\nMatthew and Mark also state a certain reason why He departed thither, namely,", "lang": "greek", "orig": ""}, {"v": 12, "f": "John Chrysostom", "w": "", "t": "\"After this He went down to Capernaum, He, and His mother, and His brethren, and His disciples; and they continued there not many days.\"\n\nWherefore comes He with \"His mother to Capernaum\"? for He hath done no miracle there, and the inhabitants of that city were not of those who were rightminded towards Him, but of the utterly corrupt. And this Christ declared when He said, \"And thou, Capernaum, which are exalted to heaven, shall be thrust down to hell.\" Wherefore then goes He? I think it was, because He intended a little after to go up to Jerusalem, that He then went to Capernaum, to avoid leading about everywhere with Him, His mother and His brethren. And so, having departed and tarried a little while to honor His mother, He again commences His miracles after restoring to her home her who had borne Him. Therefore the Evangelist says, After \"not many days,\"\n\n\"He went up to Jerusalem.\"\n\nHe received baptism then a few days before the passover. But on going up to Jerusalem, what did He, a deed full of high authority; for He cast out of the Temple those dealers and money changers, and those who sold doves, and oxen, and sheep, and who passed their time there for this purpose.", "lang": "english", "orig": ""}, {"v": 12, "f": "Origen of Alexandria", "w": "", "t": "The other three authors of the Gospels say that after the Lord’s struggle with the devil, he withdrew into Galilee. Matthew and Luke, however, say that he was in Nazareth first after these events and that he left there and went to settle in Capernaum. Matthew and Mark also mention a reason for his withdrawal from there: he had heard that John had been delivered up. …We must let the reader know, then, that the truth of these accounts lies in the spiritual meanings, because if the discrepancy is not solved, many will dismiss the Gospels as not credible, or not written by a divine spirit or not successfully recorded. The composition of these Gospels, in fact, is said to have involved both. Let those who accept the four Gospels and who think the apparent discrepancy is not to be solved through the anagogical sense tell us when the Lord came to Capernaum in relation to the difficulty we mentioned earlier concerning the forty days of temptation that can have no place at all in John. For if it occurred six days after the time when he was baptized, since his ministry at the marriage in Cana of Galilee took place on the sixth day, it is clear that he has not been tempted, nor was he in Nazareth, nor had John yet been delivered up.…\nThe four Evangelists … made full use of many things done and said in accordance with the prodigious and unexpected power of Jesus. In some places they have interwoven in Scripture something made clear to them in a purely intellectual manner, with language a", "lang": "english", "orig": ""}, {"v": 12, "f": "Origen of Alexandria", "w": "", "t": "We must ask, however, why his brothers are not invited to the wedding (nor were they present, for they are not mentioned), but they go down to Capernaum with him and his mother and the disciples.", "lang": "english", "orig": ""}, {"v": 12, "f": "Theophylact of Ohrid", "w": "", "t": "The Lord comes to Capernaum for no other purpose than to leave His Mother there, so as not to lead Her with Him everywhere. Since they had gone to Cana for the wedding, and the wedding had passed, He returns His Mother to Capernaum, to Her home. That the Lord comes to Capernaum for this very reason is revealed by the fact that He stayed there only a few days and did not perform miracles there, because the inhabitants of that city had no faith in Him, which is why the Lord in another place pronounces woe upon it (Matt. 11:23).", "lang": "english", "orig": ""}, {"v": 12, "f": "Thomas Aquinas", "w": "", "t": "Above, the Evangelist presented the sign Christ worked in order to confirm his disciples; and this sign pertained to his power to change nature. Now he deals with the sign of his resurrection; a sign pertaining to the same power, but proposed by Christ to convert the people.\n\nThe Evangelist does two things as to this miracle. First, he mentions its occasion. Secondly, the prediction of the miracle (v 18). As to the first he does two things. First, he describes the place. Secondly, he tells of the incident which was the occasion for proposing this miracle (v 14). Now the place where this happened was Jerusalem. And so the Evangelist recounts step by step how the Lord had come to Jerusalem. First, then, he shows how he went down to Capernaum. Secondly, how he then went up to Jerusalem. As to the first he does three things. First, he mentions the place to which he went down. Secondly, he describes his company. Thirdly, he mentions the length of his stay.\n\nThe place to which Christ went down was Capernaum; and so he says, After this, i.e., the miracle of the wine, he went down to Capernaum. Now as far as the historical truth is concerned, this seems to conflict with Matthew's account that the Lord went down to Capernaum after John had been thrown into prison (Mt 4:12), while the entire series of events the Evangelist refers to here took place before John's imprisonment.\n\nI answer that in order to settle this question we should bear in mind what is learned from the Ecclesiastical ", "lang": "english", "orig": ""}, {"v": 13, "f": "Alcuin of York", "w": "", "t": "And He went up to Jerusalem. The Gospels mention two journeys of our Lord to Jerusalem, one in the first year of His preaching, before John was sent to prison, which is the journey now spoken of; the other in the year of His Passion. Our Lord has set us here an example of careful obedience to the Divine commands. For if the Son of God fulfilled the injunctions of His own law, by keeping the festivals, like the rest, with what holy zeal should we servants prepare for and celebrate them?", "lang": "english", "orig": ""}, {"v": 13, "f": "Augustine of Hippo", "w": "", "t": "This account of the multitude of sellers who were cast out of the temple is given by all the Evangelists, but John introduces it in a remarkably different order. After recording the testimony borne by John the Baptist to Jesus and mentioning that he went into Galilee at the time when he turned the water into wine, and after he has also noticed the sojourn of a few days in Capernaum, John proceeds to tell us that he went up to Jerusalem at the season of the Jews’ Passover, and when he had made a scourge of small cords, drove out of the temple those who were selling in it. This makes it evident that this act was performed by the Lord not on a single occasion but twice over; but that only the first instance is put on record by John, and the last by the other three.", "lang": "english", "orig": ""}, {"v": 13, "f": "Augustine of Hippo", "w": "", "t": "What follows upon this? \"And the Jews' passover was at hand; and He went up to Jerusalem.\" The narrator relates another matter, as it came to his recollection. \"And He found in the temple those that sold oxen, and sheep, and doves, and the changers of money sitting: and when He had made, as it were, a scourge of small cords, He drove them all out of the temple; the oxen likewise, and the sheep; and poured out the changers' money, and overthrew the tables; and said unto them that sold doves, Take these things hence; and make not my Father's house a house of merchandise.\" What have we heard, brethren? See, that temple was still a figure, and yet the Lord cast out of it all that sought their own, all who had come to market. And what did they sell there? Things which people needed in the sacrifices of that time. For you know, beloved, that sacrifices were given to that people, in consideration of the carnal mind and stony heart yet in them, to keep them from falling away to idols: and they offered there for sacrifices oxen, sheep, and doves: you know this, for you have read it. It was not a great sin, then, if they sold in the temple that which was bought for the purpose of offering in the temple: and yet He cast them out thence. If, while they were selling what was lawful and not against justice (for it is not unlawful to sell what it is honorable to buy), He nevertheless drove those men out, and suffered not the house of prayer to be made a house of merchandise; how, if He foun", "lang": "english", "orig": ""}, {"v": 13, "f": "Clement of Alexandria", "w": "", "t": "But those who act contrary to these things-the avaricious, the liars, the hypocrites, those who make merchandise of the truth-the Lord cast out of His Father's court, not willing that the holy house of God should be the house of unrighteous traffic either in words or in material things.", "lang": "english", "orig": ""}, {"v": 13, "f": "Theophylact of Ohrid", "w": "", "t": "The words \"the Passover was near\" show by the evangelist that Jesus was baptized not long before the Passover.", "lang": "english", "orig": ""}, {"v": 13, "f": "Thomas Aquinas", "w": "", "t": "Then when he says, The Jewish Passover was near at hand, he mentions the place to which he went up. And concerning this he does two things. First, the occasion is given. Secondly, the going up.\n\nNow the occasion for his going up was the Jewish Passover. For in Exodus (13:17) it is commanded that every male be presented to the Lord three times a year; and one of these times was the Jewish Passover. So, since the Lord came to teach everyone by his example of humility and perfection, he wished to observe the law as long as it was in force. For he did not come to destroy the law, but to fulfill it (Mt 5:17). And so, because the Passover of the Jews was at hand, he went up to Jerusalem. So we, after his example, should carefully observe the divine precepts. For if the Son of God fulfilled the decrees of a law he himself had given, and celebrated the great feasts, with what zeal for good works ought we both to prepare for them and observe them?\n\nIt should be noted that in John's Gospel mention is made of the Passover in three passages: here, and in (6:4), when he worked the miracle of the loaves, where it is said: \"Now the Jewish Passover was near at hand,\" and again in (13:1), where it says: \"Before the feast day of the Passover.\" So, according to this Gospel, we understand that after the miracle of the wine Christ preached for two years plus the interval between his baptism and this Passover. For what he did here occurred near the Passover, as it says here, and then a year later,", "lang": "english", "orig": ""}, {"v": 14, "f": "Augustine of Hippo", "w": "", "t": "(Tr. x. c. 4) Such sacrifices were prescribed to the people, in condescension to their carnal minds; to prevent them from turning aside to idols. They sacrificed sheep, and oxen, and doves.", "lang": "english", "orig": ""}, {"v": 14, "f": "Augustine of Hippo", "w": "", "t": "(Tr. x. c. 7) By the oxen may be understood the Apostles and Prophets, who have dispensed to us the holy Scriptures. Those who by these very Scriptures deceive the people, from whom they seek honour, sell the oxen; and they sell the sheep too, i. e. the people themselves; and to whom do they sell them, but to the devil? For that which is cut off from the one Church, (1 Pet. 5:8) who taketh away, except the roaring lion, who goeth about every where, and seeketh whom he may devour?", "lang": "english", "orig": ""}, {"v": 14, "f": "Augustine of Hippo", "w": "", "t": "Well, who sell oxen? They who have dispensed to us the Holy Scriptures are understood to mean the oxen. The apostles were oxen, the prophets were oxen. Whence the apostle says: \"Thou shalt not muzzle the mouth of the ox that treadeth out the corn. Doth God take care for oxen? Or saith He it for our sakes? Yea, for our sakes He saith it: that he who ploweth should plow in hope; and he that thresheth, in hope of partaking.\" Those oxen, then, have left to us the narration of the Scriptures. For it was not of their own that they dispensed, because they sought the glory of the Lord. Now, what have ye heard in that psalm? \"And let them say continually, The Lord be magnified, they that wish the peace of His servant.\" God's servant, God's people, God's Church. Let them who wish the peace of that Church magnify the Lord, not the servant: \"and let them say continually, The Lord be magnified.\" Who, let say? \"Them who wish the peace of His servant.\" The voice of that people, of that servant, is clearly that voice which you have heard in lamentations in the psalm, and were moved at hearing, because you are of that people. What was sung by one, re-echoed from the hearts of all. Happy they who recognized themselves in those voices as in a mirror. Who, then, are they that wish the peace of His servant, the peace of His people, the peace of the one whom He calls His \"only one,\" and whom He wishes to be delivered from the lion: \"Deliver mine only one from the power of the dog\"? They who say al", "lang": "english", "orig": ""}, {"v": 14, "f": "Augustine of Hippo", "w": "", "t": "(de Cons. Ev. l. ii. c. 67) It is evident that this was done on two several occasions; the first mentioned by John, the last by the other three.", "lang": "english", "orig": ""}, {"v": 14, "f": "Augustine of Hippo", "w": "", "t": "These men, however, deceive the people by the very Scriptures, that they may receive honors and praises at their hand, and that men may not turn to the truth. But in that they deceive, by the very Scriptures, the people of whom they seek honors, they do in fact sell oxen: they sell sheep too; that is, the common people themselves. And to whom do they sell them, but to the devil? For if the Church be Christ's sole and only one, who is it that carries off whatever is cut away from it, but that lion that roars and goes about, \"seeking whom he may devour\"? Woe to them that are cut off from the Church! As for her, she will remain entire. \"For the Lord knoweth them that are His.\" These, however, so far as they can, sell oxen and sheep, they sell doves too: let them guard against the scourge of their own sins. But when they suffer some such things for these their iniquities, let them acknowledge that the Lord has made a scourge of small cords, and is admonishing them to change themselves and be no longer traffickers: for if they will not change, they shall at the end hear it said, \"Bind ye these men's hands and feet, and cast them forth into outer darkness.\"", "lang": "english", "orig": ""}, {"v": 14, "f": "Bede", "w": "", "t": "Our Lord on coming to Jerusalem, immediately entered the temple to pray; giving us an example that, wheresoever we go, our first visit should be to the house of God to pray. And He found in the temple those that sold oxen, and sheep, and doves, and the changers of money sitting. (Mat. 21)\n\nThose however, who came from a distance, being unable to bring with them the animals required for sacrifice, brought the money instead. For their convenience the Scribes and Pharisees ordered animals to be sold in the temple, in order that, when the people had bought and offered them afterwards, they might sell them again, and thus make great profits. And changers of money sitting; changers of money sat at the table to supply change to buyers and sellers.", "lang": "english", "orig": ""}, {"v": 14, "f": "Cyril of Alexandria", "w": "", "t": "The Jews are again hereby too convicted of despising the laws given them, and making of no account the Mosaic writings, looking only to their own love of gain. For whereas the law commanded that they who were about to enter into the Divine temple should purify themselves in many ways; those who had the power of forbidding it hindered not the bankers or money-changers, and others besides, whose employment was gain, usury and increase, in their lusts (for the whole aim of merchants is comprised in these things): they hindered them not from defiling the holy court, from entering into it as it were with unwashen feet, yea rather they themselves altogether used to enjoin it, that God might say truly of them, Many pastors have destroyed My vineyard, they have: trodden My portion under foot, they have made My pleasant portion a desolate wilderness, they have made it desolate. For of a truth the Lord's vineyard was destroyed, being taught to trample on the Divine worship itself, and through the sordid love of gain of those set over it left bare to all ignorance.", "lang": "english", "orig": ""}, {"v": 14, "f": "Gospel of Peter", "w": "Section XXXII.", "t": "nd many rich men were 13, 14\n2183 Matt. xxi. 12a; John ii. 14a.\n2184 Matt. xxi. 12b.\n2185 John ii. 14b.\n2186 Matt. xxi. 12c.\n2187 Matt. xxi. 13.\n2188 John ii. 16.\n2189 Mark xi. 16.\n2190 John ii. 17.\n2191 John ii. 18.\n2192 John ii. 19.\n2193 John ii. 20.\n2194 Joh", "lang": "greek", "orig": ""}, {"v": 14, "f": "Heracleon", "w": "", "t": "[Heracleon says] that those found in the temple selling oxen and sheep and doves, and the money-changers sitting, represent those who give nothing away free but suppose the entrance of foreigners into the temple to be a matter of merchandise and profit. They furnish the sacrifices for the service of God for the sake of their own profit and greed.… The whip, in turn, was made from cords by Jesus, who did not receive it from another.… The whip is an image of the power and activity of the Holy Spirit who blows away the wicked.… The whip, the cord, the linen, and all such things are an image of the power and activity of the Holy Spirit.… The whip was tied to a piece of wood. The wood is a type of the cross … that the gamblers, the merchants and all evil have been nailed upon and destroyed by this wood.", "lang": "english", "orig": ""}, {"v": 14, "f": "Origen of Alexandria", "w": "", "t": "He found in the temple, which is also said to be the house of the Savior's Father, that is, in the church or in the proclamation of the sound message of the church, some who were making his Father's house a house of merchandise.", "lang": "english", "orig": ""}, {"v": 14, "f": "Origen of Alexandria", "w": "", "t": "(tom. x. in Joan. c. 16) Jerusalem, as our Saviour Himself saith, is the city of the great King, into which none of those who remain on earth ascend, or enter. Only the soul which has a certain natural loftiness, and clear insight into things invisible, is the inhabitant of that city. Jesus alone goes up thither. But His disciples seem to have been present afterwards. The zeal of Thine house hath eaten me up. But it is as though in every one of the disciples who went up, it was Jesus who went up.", "lang": "english", "orig": ""}, {"v": 14, "f": "Theodore of Mopsuestia", "w": "", "t": "Having a symbolic purpose in mind, Jesus obscured his intent with allusions instead of stating plainly what he was doing. He thought that his hearers could not understand yet what he said. The disciples themselves did not understand either, as the Evangelist observes. They believed that by driving away the sellers of cattle and sheep, he abolished the market, but in truth what he meant was that the sacrifices of animals would be abolished.", "lang": "english", "orig": ""}, {"v": 14, "f": "Theophylact of Ohrid", "w": "", "t": "Having come to Jerusalem, He performs a deed revealing complete authority, namely: He drives out of the temple those who sold sheep and oxen. Although Matthew (Matt. 21:12–13) narrates this, know that He did this not just once. What Matthew recounts He performs close to His Passion, while the present account — in John — He performs at the beginning of the signs.", "lang": "english", "orig": ""}, {"v": 14, "f": "Thomas Aquinas", "w": "", "t": "Then when he says, In the temple precincts he came upon merchants selling oxen, sheep and doves, the Evangelist sets down what moved Christ to propose the sign of the resurrection. He does three things with this. First, he exposes the faulty behavior of the Jews. Secondly, he discloses Christ's remedy (v 15). Thirdly, he gives the announcement of the prophecy (v 22).\n\nWith respect to the first, we should note that the devil plots against the things of God and strives to destroy them. Now among the means by which he destroys holy things, the chief is avarice; hence it is said: \"The shepherds have no understanding. All have turned aside to their own way; everyone after his own gain, from the first one to the last\" (Is 56:11). And the devil has done this from the earliest times. For the priests of the Old Testament, who had been established to care for divine matters, gave free rein to avarice. God commanded, in the law, that animals should be sacrificed to the Lord on certain feasts. And in order to fulfill this command, those who lived nearby brought the animals with them. But those who came a long distance were unable to bring animals from their own homes. And so because offerings of this kind resulted in profit for the priests, and so animals to offer would not be lacking to those who came from a distance, the priests themselves saw to it that animals were sold in the temple. And so they had them shown for sale in the temple, i.e., in the atrium of the temple. And this is wh", "lang": "english", "orig": ""}, {"v": 15, "f": "Athanasius - Select Works", "w": "Chapter 21.—Popular Renown and Inquisitiveness are Condemned in the Sacred\nScriptures.", "t": "beginning,\n103 Gal. i. 10.\n104 Col. ii. 8.\n105 1 John ii. 15.\n106 Rom. xii. 2.\n107 Eccles. i. 2, 3.\n\n\nhe goes on to show in detail that the vain108 are those who are deceived by things of this\nsort; and he calls this which deceives them vanity,—not that God di", "lang": "greek", "orig": ""}, {"v": 15, "f": "Augustine - Confessions", "w": "Sermon XLVI.", "t": "e, let him deny\nhimself,” etc. And on the words 1 John ii. 15, “if any man love the world, the love of the\nFather is not in him.”", "lang": "latin", "orig": ""}, {"v": 15, "f": "Augustine of Hippo", "w": "", "t": "Yet we say, brethren (for He did not spare those men: He who was to be scourged by them first scourged them), that He gave us a certain sign, in that He made a scourge of small cords, and with it lashed the unruly, who were making merchandise of God's temple. For indeed every man twists for himself a rope by his sins: \"Woe to them who draw sins as a long rope?\" Who makes a long rope? He who adds sin to sin. How are sins added to sins? When the sins which have been committed are covered over by other sins. One has committed a theft: that he may not be found out to have committed it, he seeks the astrologer. It were enough to have committed theft: why wilt thou add sin to sin? Behold two sins committed. When thou art forbidden to go to the astrologer, thou revilest the bishop: behold three sins. When thou hearest it said of thee, Cast him forth from the Church; thou sayest, I will betake me to the party of Donatus: behold thou addest a fourth sin. The rope is growing; be thou afraid of the rope. It is good for thee to be corrected here, when thou art scourged with it; that it may not be said of thee at the last, \"Bind ye his hands and feet, and cast him forth into outer darkness.\" For, \"With the cords of his own sins is every one bound.\" The former of these is the saying of the Lord, the latter that of another Scripture; but yet both are the sayings of the Lord. With their own sins are men bound and cast into outer darkness.", "lang": "english", "orig": ""}, {"v": 15, "f": "Augustine of Hippo", "w": "", "t": "(Tr. x. c. 5) He who was to be scourged by them, was first of all the scourger; And when He had made a scourge of small cords, He drove them all out of the temple.", "lang": "english", "orig": ""}, {"v": 15, "f": "Augustine of Hippo", "w": "", "t": "(Tr. x. c. 5) Our Lord intended a meaning to be seen in His making a scourge of small cords, and then scourging those who were carrying on the merchandize in the temple. Every one by his sins twists for himself a cord, in that he goes on adding sin to sin. So then when men suffer for their iniquities, let them be sure that it is the Lord making a scourge of small cords, and admonishing them to change their lives: which if they fail to do, they will hear at the last, Bind. him hand and foot. (Mat. 23)", "lang": "english", "orig": ""}, {"v": 15, "f": "Bede", "w": "", "t": "But our Lord disapproving of any worldly business in His house, especially one of so questionable a kind, drove out all engaged in it.\n\nThe Evangelist sets before us both natures of Christ: the human in that His mother accompanied Him to Capernaum; the divine, in that He said, Make not My Father's house an house of merchandize.\n\n(in loc.) They then are the sellers of doves, who, after receiving the free grace of the Holy Spirit, do not dispense it freely, as they are commanded, but at a price: who confer the laying on of hands, by which the Holy Spirit is received, if not for money, at least for the sake of getting favour with the people, who bestow Holy Orders not according to merit, but favour.\n\n(in loc.) Or, the sheep are works of purity and piety, and they sell the sheep, who do works of piety to gain the praise of men. They exchange money in the temple, who, in the Church, openly devote themselves to secular business. And besides those who seek for money, or praise, or honour from Holy Orders, those too make the Lord's house a house of merchandize, who do not employ the rank, or spiritual grace, which they have received in the Church at the Lord's hands, with singleness of mind, but with an eye to human recompense.\n\n(in loco.) With a scourge then made of small cords, He cast them out of the temple; for from the part and lot of the saints are cast out all, who, thrown externally among the Saints, do good works hypocritically, or bad openly. The sheep and the oxen too He c", "lang": "english", "orig": ""}, {"v": 15, "f": "Cyril of Alexandria", "w": "", "t": "Reasonably is the Saviour indignant at the folly of the Jews. For it befitted to make the Divine Temple not an house of merchandise, but an house of prayer: for so it is written. But He shows His emotion not by mere words, but with stripes and a scourge thrusts He them forth of the sacred precincts, justly devising for them the punishment befitting slaves; for they would not receive the Son Who through faith maketh free. See I pray well represented as in a picture that which was said through Paul, If any man dishonour the Temple of God, him shall God dishonour.", "lang": "english", "orig": ""}, {"v": 15, "f": "GK Chesterton", "w": "", "t": "And with that thought came a larger one, and the colossal figure of her Master had also crossed the theatre of my thoughts. The same modern difficulty which darkened the subject-matter of Anatole France also darkened that of Ernest Renan. Renan also divided his hero's pity from his hero's pugnacity. Renan even represented the righteous anger at Jerusalem as a mere nervous breakdown after the idyllic expectations of Galilee. As if there were any inconsistency between having a love for humanity and having a hatred for inhumanity! Altruists, with thin, weak voices, denounce Christ as an egoist. Egoists (with even thinner and weaker voices) denounce Him as an altruist. In our present atmosphere such cavils are comprehensible enough. The love of a hero is more terrible than the hatred of a tyrant. The hatred of a hero is more generous than the love of a philanthropist. There is a huge and heroic sanity of which moderns can only collect the fragments. There is a giant of whom we see only the lopped arms and legs walking about. They have torn the soul of Christ into silly strips, labelled egoism and altruism, and they are equally puzzled by His insane magnificence and His insane meekness. They have parted His garments among them, and for His vesture they have cast lots; though the coat was without seam woven from the top throughout.", "lang": "english", "orig": ""}, {"v": 15, "f": "GK Chesterton", "w": "", "t": "Instead of looking at books and pictures about the New Testament I looked at the New Testament. There I found an account, not in the least of a person with his hair parted in the middle or his hands clasped in appeal, but of an extraordinary being with lips of thunder and acts of lurid decision, flinging down tables, casting out devils, passing with the wild secrecy of the wind from mountain isolation to a sort of dreadful demagogy; a being who often acted like an angry god--and always like a god. Christ had even a literary style of his own, not to be found, I think, elsewhere; it consists of an almost furious use of the a fortiori. His \"how much more\" is piled one upon another like castle upon castle in the clouds. The diction used about Christ has been, and perhaps wisely, sweet and submissive. But the diction used by Christ is quite curiously gigantesque; it is full of camels leaping through needles and mountains hurled into the sea. Morally it is equally terrific; he called himself a sword of slaughter, and told men to buy swords if they sold their coats for them. That he used other even wilder words on the side of non-resistance greatly increases the mystery; but it also, if anything, rather increases the violence. We cannot even explain it by calling such a being insane; for insanity is usually along one consistent channel. The maniac is generally a monomaniac. Here we must remember the difficult definition of Christianity already given; Christianity is a superhuman par", "lang": "english", "orig": ""}, {"v": 15, "f": "GK Chesterton", "w": "", "t": "The tremendous figure which fills the Gospels towers in this respect, as in every other, above all the thinkers who ever thought themselves tall. His pathos was natural, almost casual. The Stoics, ancient and modern, were proud of concealing their tears. He never concealed His tears; He showed them plainly on His open face at any daily sight, such as the far sight of His native city. Yet He concealed something. Solemn supermen and imperial diplomatists are proud of restraining their anger. He never restrained His anger. He flung furniture down the front steps of the Temple, and asked men how they expected to escape the damnation of Hell. Yet He restrained something. I say it with reverence; there was in that shattering personality a thread that must be called shyness. There was something that He hid from all men when He went up a mountain to pray. There was something that He covered constantly by abrupt silence or impetuous isolation. There was some one thing that was too great for God to show us when He walked upon our earth; and I have sometimes fancied that it was His mirth.", "lang": "english", "orig": ""}, {"v": 15, "f": "Gregory the Dialogist", "w": "", "t": "Why do you not recall before the eyes of your mind that our Redeemer, entering the temple, overturned the seats of those selling doves and poured out the money of the money-changers? For who are those in the temple of God today who sell doves, if not those who in the Church receive payment for the imposition of hands? Through which imposition, namely, the Holy Spirit is given from heaven. Therefore the dove is sold, because the imposition of hands, through which the Holy Spirit is received, is offered for a price. But our Redeemer overturned the seats of those selling doves, because he destroys the priesthood of such merchants.\n\nWhence also entering into the temple, he made as it were a whip from cords by himself, and casting out the wicked merchants from the house of God, he overturned the seats of those selling doves, because he strikes the faults of subjects through pastors, but he strikes the vices of pastors through himself. Behold, now what is done secretly can be denied to people. That Judge will certainly come, from whom no one can hide himself by keeping silent, whom no one can deceive by denying.", "lang": "english", "orig": ""}, {"v": 15, "f": "John Chrysostom", "w": "", "t": "\"And wherefore,\" says one, \"did Christ do this same, and use such severity against these men, a thing which He is nowhere else seen to do, even when insulted and reviled, and called by them 'Samaritan' and 'demoniac'? for He was not even satisfied with words only, but took a scourge, and so cast them out.\" Yes, but it was when others were receiving benefit, that the Jews accused and raged against Him; when it was probable that they would have been made savage by His rebukes, they showed no such disposition towards Him, for they neither accused nor reviled Him.", "lang": "english", "orig": ""}, {"v": 15, "f": "John Chrysostom", "w": "", "t": "Since he was about to heal on the Sabbath day, and to do many such things which were thought by them transgressions of the Law, in order that He might not seem to do this as though He had come to be some rival God and opponent of His Father, He takes occasion hence to correct any such suspicion of theirs. For One who had exhibited so much zeal for the House was not likely to oppose Him who was Lord of the House, and who was worshiped in it. No doubt even the former years during which He lived according to the Law, were sufficient to show His reverence for the Legislator, and that He came not to give contrary laws; yet since it was likely that those years were forgotten through lapse of time, as not having been known to all because He was brought up in a poor and mean dwelling, He afterwards does this in the presence of all, (for many were present because the feast was nigh at hand,) and at great risk. For he did not merely \"cast them out,\" but also \"overturned the tables,\" and \"poured out the money,\" giving them by this to understand, that He who threw Himself into danger for the good order of the House could never despise his Master. Had He acted as He did from hypocrisy, He should only have advised them; but to place Himself in danger was very daring. For it was no light thing to offer Himself to the anger of so many market-folk, to excite against Himself a most brutal mob of petty dealers by His reproaches and His blows, this was not the action of a pretender, but of one c", "lang": "english", "orig": ""}, {"v": 15, "f": "John Chrysostom", "w": "", "t": "They do not in this contradict each other, but show that he did this a second time, and that both these expressions were not used on the same occasion, but that He acted thus once at the beginning of His ministry, and again when He had come to the very time of His Passion. Therefore, (on the latter occasion,) employing more strong expressions, He spoke of it as (being made) \"a den of thieves,\" but here at the commencement of His miracles He does not so, but uses a more gentle rebuke; from which it is probable that this took place a second time.", "lang": "english", "orig": ""}, {"v": 15, "f": "Origen of Alexandria", "w": "", "t": "(tom. x. in Joan. c. 16) Should it appear something out of the order of things, that the Son of God should make a scourge of small cords, to drive them out of the temple? We have one answer in which some take refuge, viz. the divine power of Jesus, Who, when He pleased, could extinguish the wrath of His enemies however innumerable, and quiet the tumult of their minds: The Lord bringeth the counsel of the heathen to nought. (Ps. 32, 33:10) This act indeed exhibits no less power, than His more positive miracles; nay rather, more than the miracle by which water was converted into wine: in that there the subject-matter was inanimate, here, the minds of so many thousands of men are overcome.\n\n(tom. x. in Joan. c. 17) John says here that He drove out the sellers from the temple; Matthew, the sellers and buyers. The number of buyers was much greater than of the sellers: and therefore to drive them out was beyond the power of the carpenter's Son, as He was supposed to be, had He not by His divine power put all things under Him, as it is said.", "lang": "english", "orig": ""}, {"v": 15, "f": "Socrates", "w": "Chapter 7.—That the Words Love and Regard (Amor and Dilectio) are in Scripture\nUsed Indifferently of Good and Evil Affection.", "t": "see the commentaries in loc.\n664 Ps. xi. 5.\n665 1 John ii. 15.\n\n\nsense), let him read the words, “For men shall be lovers (amantes)", "lang": "greek", "orig": ""}, {"v": 15, "f": "Theophylact of Ohrid", "w": "", "t": "Nor did He cast out only those who bought and sold, but their goods also: The sheep, and the oxen, and poured out the changers' money, and overthrew the tables, i. e. of the money changers, which were coffers of pence.", "lang": "english", "orig": ""}, {"v": 15, "f": "Theophylact of Ohrid", "w": "", "t": "Why does He drive such people out of the temple altogether? Not without reason: He will heal on the Sabbath and, as it were, violate the law concerning it; therefore, so that they would not then consider Him an opponent of God, He forestalls such a thought by the present occasion. For he who showed such zeal for the temple would not reject God, the Lord of the temple. And He drove them out not simply, but striking with a whip made of cords, and overturned the tables, and scattered the coin or money of the money-changers, and undertook a very dangerous deed. And he who subjects himself to danger for the house of God would permit a departure from the law of God not as an opponent of God, but undoubtedly as the Son, having equal authority with God the Father, who gave the law concerning the Sabbath.", "lang": "english", "orig": ""}, {"v": 15, "f": "Thomas Aquinas", "w": "", "t": "The Lord's remedy is at once set forth. Here the Lord's remedy consisted in action and in words, in order to instruct those who have charge of the Church that they must correct their subjects in deed and in word. And he does two things with respect to this. First, he gives the remedy Christ applied by his action. Secondly, the remedy he applied by word (v 16).\n\nAs to the first he does three things. First, he drives the men out. Secondly, the oxen and sheep. Thirdly, he sweeps away the money.\n\nHe drives the men out with a whip; and this is what he says, when he had made a kind of whip from cords. This is something that could be done only by divine power. For as Origen says, the divine power of Jesus was as able, when he willed, to quench the swelling anger of men as to still the storms of minds: \"The Lord brings to nought the thoughts of men\" (Ps 32:10). He makes the whip from cords because, as Augustine says, it is from our own sins that he forms the matter with which he punishes us: for a series of sins, in which sins are added to sins, is called a cord: \"He is bound fast by the cords of his own sins\" (Prv 5:22); \"Woe to you who haul wickedness with cords\" (Is 5:18). Then, just as he drove the merchants from the temple, so he swept away the gold of the moneychangers and knocked over their tables.\n\nAnd mark well that if he expelled from the temple things that seemed somehow licit, in the sense that they were ordained to the worship of God, how much more if he comes upon unlaw", "lang": "english", "orig": ""}, {"v": 16, "f": "Augustine of Hippo", "w": "", "t": "Our Lord’s driving out of the temple people who were seeking their own ends, who came to the temple to buy and sell, is symbolic. For if that temple was a symbol it obviously follows that the body of Christ, the true temple of which the other was an image, has within it some who are buyers and sellers, or in other words, people who are seeking their own interests and not those of Jesus Christ.But the temple was not destroyed by the people who wanted to turn the house of God into a den of thieves, and neither will those who live evil lives in the Catholic church and do all they can to convert God’s house into a robber’s den succeed in destroying the temple. The time will come when they will be driven out by a whip made of their own sins.\nThis temple of God, this body of Christ, this assembly of believers, has but one voice and sings the psalms as though it were but one person. If we wish, it is our voice; if we wish, we may listen to the singer with our ears and ourselves sing in our hearts. But if we choose not to do so it will mean that we are like buyers and sellers, preoccupied with our own interests.", "lang": "english", "orig": ""}, {"v": 16, "f": "Augustine of Hippo", "w": "", "t": "(Tr. x. in Joan. c. 4) So that temple was still a figure only, and our Lord cast out of it all who came to it as a market. And what did they sell? Things that were necessary for the sacrifice of that time. What if He had found men drunken? If the house of God ought not to be a house of merchandize, ought it to be a house of drunkenness?", "lang": "english", "orig": ""}, {"v": 16, "f": "Augustine of Hippo", "w": "", "t": "(Tr. x. c. 6) Or, those who sell in the Church, are those who seek their own, not the things of Jesus Christ. They who will not be bought, think they may sell earthly things. Thus Simon wished to buy the Spirit, that he might sell Him: for he was one of those who sell doves. (The Holy Spirit appeared in the form of a dove.) The dove however is not sold, but is given of free grace; for it is called grace.", "lang": "english", "orig": ""}, {"v": 16, "f": "Augustine of Hippo", "w": "", "t": "However, to seek the mystery of the deed in the figure, who are they that sell oxen? Who are they that sell sheep and doves? They are they who seek their own in the Church, not the things which are Christ's. They account all a matter of sale, while they will not be redeemed: they have no wish to be bought, and yet they wish to sell. Yes; good indeed is it for them that they may be redeemed by the blood of Christ, that they may come to the peace of Christ. Now, what does it profit to acquire in this world any temporal and transitory thing whatsoever, be it money, or pleasure of the palate, or honor that consists in the praise of men? Are they not all wind and smoke? Do they not all pass by and flee away? Are they not all as a river rushing headlong into the sea? And woe to him who shall fall into it, for he shall be swept into the sea. Therefore ought we to curb all our affections from such desires. My brethren, they that seek such things are they that sell. For that Simon too, wished to buy the Holy Ghost, just because he meant to sell the Holy Ghost; and he thought the apostles to be just such traders as they whom the Lord cast out of the temple with a scourge. For such an one he was himself, and desired to buy what he might sell: he was of those who sell doves. Now it was in a dove that the Holy Ghost appeared. Who, then, are they, brethren, that sell doves, but they who say, \"We give the Holy Ghost\"? But why do they say this, and at what price do they sell? At the price of", "lang": "english", "orig": ""}, {"v": 16, "f": "Cyril of Alexandria", "w": "", "t": "Take these things hence; make not My Father's House an house of merchandise.\n\nHe commands as Lord, He leads by the hand to what is fitting, as teacher; and along with the punishment He sets before them the declaration of their offences, through shame thereof not suffering him that is censured to be angry. But it must be noted that He again calls God His own Father specially, as being Himself and that Alone by Nature of Him, and truly Begotten. For if it be not so, but the Word be really Son with us, as one of us, to wit by adoption, and the mere Will of the Father: why does He alone seize to Himself the boast common to and set before all, saying, Make not My Father's House, and not rather, our Father's House. For this I suppose would have been more meet to say, if He had known that Himself too was one of those who are not sons by Nature. But since the Word knows that He is not in the number of those who are sons by grace, but of the Essence of God the Father, He puts Himself apart from the rest, calling God His Father. For it befits those who are called to sonship and have the honour from without, when they pray to cry, Our Father Which art in Heaven: but the Only Begotten being Alone One of One, with reason calls God His Own Father.\n\nBut if we must, applying ourselves to this passage, harmonize it more spiritually with that above, the lection must be considered differently.", "lang": "english", "orig": ""}, {"v": 16, "f": "Cyril of Alexandria", "w": "", "t": "And found in the temple those that sold oxen and sheep,\n\nSee again the whole scheme of the Dispensation to usward drawn out by two things. For with the Cananites, I mean those of Galilee, Christ both feasts and tarries, and them that bade Him, and hereby honoured Him, He made partakers of His Table; He both aids them by miracles and fills up that which was lacking to their joy (and what good thing does He not freely give?): teaching as in a type that He will both receive the inhabitants of Galilee, that is the Gentiles, called as it were to them through the faith that is in them, and will bring them into the Heavenly Bridal-chamber, that is unto the church of the first-born, and will make them sit down with the saints (for the holy disciples sat down with the feasters): and will make them partake of the Divine and spiritual feast, as Himself saith, Many shall come from the east and west and shall sit down with Abraham, Isaac, and Jacob, in the kingdom of Heaven, nought lacking unto their joy. For everlasting joy shall be upon their heads. But the disobedient Jews He shall cast forth of the holy places, and set them without the holy inclosure of the saints; yea, even when they bring sacrifices He will not receive them: but rather will subject them to chastisement and the scourge, holden with the cords of their own sins. For hear Him saying, Take these things hence; that thou mayest understand again those things which long ago by the mouth of the Prophet Isaiah He saith, I am f", "lang": "english", "orig": ""}, {"v": 16, "f": "Eusebius - Church History", "w": "Chapter XXX.—Of the Perverse Images of Dreams, Which He Wishes to Have Taken\nAway.", "t": "42. Is not Thy hand able, O Almighty God, to heal all the diseases of my soul,882 and\nby Thy more abundant grace to quench even the lascivious motions of my sleep? Thou wilt\nincrease in me, O Lord, Thy gifts more and more, that my soul may follow me to Thee,\ndisengaged from the bird-lime of concupiscence; that it may not be in rebellion against itself,\nand even in dreams not simply not, through sensual images, commit those deformities of\n880 1 John ii. 16. Dilating on Ps. viii. he makes these three roots of sin to correspond to the threefold nature\nof our Lord’s temptation in the wilderness. See also p. 80, note 5, above.\n881 In Augustin’s view, then, dreams appear to result from our thoughts and feelings when awake. In this he\nhas the support of Aristotle (Ethics, i. 13), as also that of Solomon, who says (Eccles. v. 3), “A dream cometh\nthrough the multitude of business.” An apt illustration of this is found in the life of the great Danish sculptor,\nThorwaldsen. It is said that he could not satisfy himself with his models for The Christ, in the Frauenkirche at\nCopenhagen,—as Da Vinci before him was never able to paint the face of the Christ in His noble fresco of the\nLast Supper,—and that it was only in consequence of a dream (that dream doubtless the result of his stedfast\nsearch for an ideal) that this great work was accomplished. But see Ep. clix.\n882 Ps. ciii. 3.\n\n\ncorruption, even to the pollution of the flesh, but that it may not even consent unto them.\nFor it is no gr", "lang": "greek", "orig": ""}, {"v": 16, "f": "Eusebius - Church History", "w": "Chapter XXX.—Of the Perverse Images of Dreams, Which He Wishes to Have Taken\nAway.", "t": "sensual images, commit those deformities of\n880 1 John ii. 16. Dilating on Ps. viii. he makes these three roots of sin to correspond to the threefold nature\nof our Lord’s temptation in the wilderness. See also p. 80, note 5, above.\n881 In Augustin’s view, then,", "lang": "greek", "orig": ""}, {"v": 16, "f": "Gospel of Peter", "w": "Section XXXII.", "t": "4b.\n2186 Matt. xxi. 12c.\n2187 Matt. xxi. 13.\n2188 John ii. 16.\n2189 Mark xi. 16.\n2190 John ii. 17.\n2191 John ii. 18.\n2192 John ii. 19.\n2193 John ii. 20.\n2194 John ii. 21.\n2195 Or, if.\n2196 John ii. 22.\n2197 Mark xii. 41.\n\n\nthrowing in much. 2198And there came a", "lang": "greek", "orig": ""}, {"v": 16, "f": "Irenaeus", "w": "", "t": "He says that this handiwork is “the temple of God,” thus declaring, “Do you not know that you are God’s temple and that God’s Spirit dwells in you? If anyone destroys God’s temple, God will destroy that person. For God’s temple is holy, and you are that temple.” Here he manifestly declares the body to be the temple in which the Spirit dwells. As also the Lord speaks in reference to himself, “Destroy this temple, and in three days I will raise it up.” He was speaking, however, it is said, of the temple of his body. And not only does he [the apostle] acknowledge our bodies to be a temple, but even to be the temple of Christ.", "lang": "english", "orig": ""}, {"v": 16, "f": "John Chrysostom", "w": "", "t": "This cry rent the veil, and opened the tombs, and made the house desolate. And He did this, not as offering insult to the temple (for how should He, who saith, \"Make not my Father's house a house of merchandise,\") but declaring them to be unworthy even of His abiding there; like as also when He delivered it over to the Babylonians. But not for this only were these things done, but what took place was a prophecy of the coming desolation, and of the change into the greater and higher state; and a sign of His might.", "lang": "english", "orig": ""}, {"v": 16, "f": "John Chrysostom", "w": "", "t": "Another Evangelist writes, that as He cast them out, He said, Make not my Father's house \"a den of thieves,\" but this one, \"(Make not My Father's house) an house of merchandise.\"", "lang": "english", "orig": ""}, {"v": 16, "f": "John Chrysostom", "w": "", "t": "And therefore not by His actions only, but by His words, He shows his agreement with the Father; for He saith not \"the Holy House,\" but \"My Father's House.\" See, He even calls Him, \"Father,\" and they are not wroth; they thought He spoke in a general way: but when He went on and spoke more plainly, so as to set before them the idea of His Equality, then they become angry.", "lang": "english", "orig": ""}, {"v": 16, "f": "Origen of Alexandria", "w": "", "t": "Now Christ is especially jealous for the house of God in each of us, not wishing it to be a house of merchandise or that the house of prayer become a den of thieves, since he is the son of a jealous God.… [These words] set forth the fact that God wishes nothing alien to his will to be mingled with the soul of anyone, but especially with the soul of those who wish to receive [the teachings of the] most divine faith.", "lang": "english", "orig": ""}, {"v": 16, "f": "Origen of Alexandria", "w": "", "t": "(tom. x. in Joan. c. 16) It is possible even for the dweller in Jerusalem to incur guilt, and even the most richly endowed may stray. And unless these repent speedily, they lose the capacity wherewith they were endued. He finds them in the temple, i. e. in sacred places, or in the office of enunciating the Church's truths, some who make His Father's house an house of merchandize; i. e. who expose to sale the oxen whom they ought to reserve for the plough, lest by turning back they should become unfit for the kingdom of God: also who prefer the unrighteous mammon to the sheep, from which they have the material of ornament; also who for miserable gain abandon the watchful care of them who are called metaphorically doves, without all gall or bitterness. Our Saviour finding these in the holy house, maketh a scourge of small cords, and driveth them out, together with the sheep and oxen exposed for sale, scatters the heaps of money, as unbeseeming in the house of God, and overthrows the tables set up in the minds of the covetous, forbidding them to sell doves in the house of God any longer. I think too that He meant the above, as a mystical intimation that whatsoever was to be performed with regard to that sacred oblation by the priests, was not to be performed after the manner of material oblations, and that the law was not to be observed as the carnal Jews wished. For our Lord, by driving away the sheep and oxen, and ordering away the doves, which were the most common offerings a", "lang": "english", "orig": ""}, {"v": 16, "f": "Tertullian", "w": "", "t": "By asserting all this, He determined the distinction which is between the two Persons: that is, the Son then on earth, whom Peter had confessed to be the Son of God; and the Father in heaven, who had revealed to Peter the discovery which he had made, that Christ was the Son of God. When He entered the temple, He called it \"His Father's house,\" speaking as the Son.", "lang": "english", "orig": ""}, {"v": 16, "f": "Theophylact of Ohrid", "w": "", "t": "Therefore here He said with restraint: \"Do not make My Father's house a house of trade.\" For the miracles were only just beginning, and He did not yet have that boldness which the miracles would give. But there, that is in Matthew, He says: \"Do not make it a den of robbers.\" He openly called them robbers, as people profiting by unjust means. For whoever prices a thing of little worth dearly and seizes the opportunity to extract gain from the poor and widows (as those who buy up necessities and then resell them typically do), what else does he do but rob, extracting gain from the misfortune of his neighbors? Therefore He did not say \"the house of God,\" but \"the house of My Father,\" showing that He, as the Son, has authority over all that belongs to the Father.\nThe money changers are those who sell small coins or nummi. Like those merchants of old, many of the chief priests also sin when they sell \"oxen\" in the church, not giving honor to those who excel in the teaching word, but giving it to those who wish to do evil; when they sell \"sheep\" — the simple and common people; \"doves\" — spiritual gifts; and when they elevate to the highest rank those who give more. Such persons the Lord \"drives out\" of the sanctuary, finding them by His judgment unworthy of the chief priesthood. Likewise, if someone sells large and small coin, that is, opinion and word, and being a teacher but not foreseeing the benefit, does not proclaim the evangelical word, the Lord \"overturns\" his \"table\" as we", "lang": "english", "orig": ""}, {"v": 16, "f": "Thomas Aquinas", "w": "", "t": "Then when he says, To those selling doves he said, he records the treatment which the Lord applied by word. Here it should be noted that those who engage in simony should, of course, first be expelled from the Church. But because as long as they are alive, they can change themselves by free will and by the help of God return to the state of grace, they should not be given up as hopeless. If, however, they are not converted, then they are not merely to be expelled, but handed over to those to whom it is said: \"Bind him hand and foot, and cast him into outer darkness\" (Mt 22:13). And so the Lord, attending to this, first warns them, and then gives the reason for his warning, saying, stop making my Father's house into a marketplace.\n\nHe warns those selling the doves by reproaching them, for they signify those who sell the gifts of the Holy Spirit, i.e., those who engage in simony.\n\nHe gives his reason for this when he says, stop making my Father's house into a marketplace. \"Take away your evil from my sight\" (Is 1:16). Note that Matthew (21:13) says: \"Do not make my house a den of thieves,\" while here he says, a marketplace. Now the Lord does this because, as a good physician, he begins first with the gentler things; later on, he would propose harsher things. Now the action recorded here was the first of the two; hence in the beginning he does not call them thieves but merchants. But because they did not stop such business out of obstinacy, the Lord, when driving them out the se", "lang": "english", "orig": ""}, {"v": 16, "f": "npnf213", "w": "Epistle CVI.", "t": "For, when our Lord and Redeemer went into the temple, He overthrew the seats of them\nthat sold doves. What else is it to sell doves but to receive a price for the laying on of hands,\nand to put to sale the Holy Spirit whom Almighty God gives to men? And that the priesthood\nof such as do so falls before the eyes of God is plainly signified by the overthrowing of the\nseats. And yet the perverseness of this iniquity still puts forth its strength. For it drives\nthose to sell whom it deceives into buying. And, while attention is not paid to what is enjoined\nby the divine voice, Freely ye have received, freely give (Matth. x. 8), it is brought to\npass that it increases, and becomes doubled in one and the same contagion of sin, to wit of\nthe buyer and of the seller. And, it being well known that this heresy crept into the Church\nwith a pestiferous root before all others, and was condemned in its very origin by apostolic\ndetestation, why is it not guarded against? Why is it not considered that blessing is turned\ninto a curse to him who is promoted to the end that he may become a heretic?", "lang": "greek", "orig": ""}, {"v": 17, "f": "Alcuin of York", "w": "", "t": "Zeal, taken in a good sense, is a certain fervour of the Spirit, by which the mind, all human fears forgotten, is stirred up to the defence of the truth.\n\nTo take the passage mystically, God enters His Church spiritually every day, and marks each one's behaviour there. Let us be careful then, when we are in God's Church, that we indulge not in stories, or jokes, or hatreds, or lusts, lest on a sudden He come and scourge us, and drive us out of His Church.", "lang": "english", "orig": ""}, {"v": 17, "f": "Augustine of Hippo", "w": "", "t": "\"Then the disciples remembered that it was written, The zeal of Thine house hath eaten me up:\" because by this zeal of God's house, the Lord cast these men out of the temple. Brethren, let every Christian among the members of Christ be eaten up with zeal of God's house. Who is eaten up with zeal of God's house? He who exerts himself to have all that he may happen to see wrong there corrected, desires it to be mended, does not rest idle: who if he cannot mend it, endures it, laments it. The grain is not shaken out on the threshing-floor that it may enter the barn when the chaff shall have been separated. If thou art a grain, be not shaken out from the floor before the putting into the granary; lest thou be picked up by the birds before thou be gathered into the granary. For the birds of heaven, the powers of the air, are waiting to snatch up something off the threshing-floor, and they can snatch up only what has been shaken out of it. Therefore, let the zeal of God's house eat thee up: let the zeal of God's house eat up every Christian, zeal of that house of God of which he is a member. For thy own house is not more important than that wherein thou hast everlasting rest. Thou goest into thine own house for temporal rest, thou enterest God's house for everlasting rest. If, then, thou busiest thyself to see that nothing wrong be done in thine own house, is it fit that thou suffer, so far as thou canst help, if thou shouldst chance to see aught wrong in the house of God, where sa", "lang": "english", "orig": ""}, {"v": 17, "f": "Augustine of Hippo", "w": "", "t": "(Tr. x. c. 9) He then is eaten up with zeal for God's house, who desires to correct all that he sees wrong there; and, if he cannot correct, endures and mourns. In thine house thou busiest thyself to prevent matters going wrong; in the house of God, where salvation is offered, oughtest thou to be indifferent? Hast thou a friend? admonish him gently; a wife? coerce her severely; a maid-servant? even compel her with stripes. Do what thou art able, according to thy station.", "lang": "english", "orig": ""}, {"v": 17, "f": "Bede", "w": "", "t": "(in loc.) His disciples seeing this most fervent zeal in Him, remembered that it was from zeal for His Father's house that our Saviour drove the ungodly from the temple.", "lang": "english", "orig": ""}, {"v": 17, "f": "Cyril of Alexandria", "w": "", "t": "The disciples in a short time get perfection of knowledge, and comparing what is written with the events, already show great progress for the better.", "lang": "english", "orig": ""}, {"v": 17, "f": "Gospel of Peter", "w": "Section XXXII.", "t": "xxi. 13.\n2188 John ii. 16.\n2189 Mark xi. 16.\n2190 John ii. 17.\n2191 John ii. 18.\n2192 John ii. 19.\n2193 John ii. 20.\n2194 John ii. 21.\n2195 Or, if.\n2196 John ii. 22.\n2197 Mark xii. 41.\n\n\nthrowing in much. 2198And there came a poor widow, and cast in two mites.", "lang": "greek", "orig": ""}, {"v": 17, "f": "John Chrysostom", "w": "", "t": "\"They,\" His disciples, it says, \"Remembered that it is written, The zeal of thine house hath eaten me up.\"\n\nBut the Jews did not remember the Prophecy, and said, \"What sign showest Thou unto us?\" both grieving that their shameful traffic was cut off, and expecting by these means to stop Him, and also desiring to challenge Him to a miracle, and to find fault with what He was doing.", "lang": "english", "orig": ""}, {"v": 17, "f": "Theophylact of Ohrid", "w": "", "t": "The disciples remembered that it is written: \"Zeal for Your house consumes me\" (Ps. 69:9). They had been growing in goodness for only a short time, yet they were already recalling passages from the Scriptures, and finding testimonies in them, they were being more and more confirmed in their knowledge of Christ.", "lang": "english", "orig": ""}, {"v": 17, "f": "Thomas Aquinas", "w": "", "t": "Then when he says, His disciples then remembered, he sets down a prophecy which was written in Psalm 69 (v 9): \"Zeal for your house consumes me.\" Here we should remark that zeal, properly speaking, signifies an intensity of love, whereby the one who loves intensely does not tolerate anything which is repugnant to his love. So it is that men who love their wives intensely and cannot endure their being in the company of other men, as this conflicts with their own love, are called \"zelotypes.\" Thus, properly speaking, one is said to have zeal for God who cannot patiently endure anything contrary to the honor of God, whom he loves above all else: \"I have been very zealous for the Lord God of hosts\" (1 Kgs 19:10). Now we should love the house of the Lord, according to the Psalm (25:8): \"O Lord, I have loved the beauty of your house.\" Indeed, we should love it so much that our zeal consumes us, so that if we notice anything amiss being done, we should try to eliminate it, no matter how dear to us are those who are doing it; nor should we fear any evils that we might have to endure as a result. So the Gloss says: \"Good zeal is a fervor of spirit, by which, scorning the fear of death, one is on fire for the defense of the truth. He is consumed by it who takes steps to correct any perversity he sees; and if he cannot, he tolerates it with sadness.\"", "lang": "english", "orig": ""}, {"v": 18, "f": "Augustine - City of God", "w": "Tractate LXXVI.", "t": "and provideth a home.—Tr.\n1346 Acts i. 11.\n1347 1 John ii. 18.\n\n\nto contain: that our vision of Them may not be external, but inward; and Their abiding in\nus may not be transitory, but eternal. The Son doth not manifest Himself in such a way as\nthis to the worl", "lang": "latin", "orig": ""}, {"v": 18, "f": "Augustine - Trinity", "w": "Psalm CXIV.5037", "t": "5042 Gen. xxv. 33, 23.\n5043 2 Cor. vi. 14.\n5044 1 John ii. 18.\n5045 1 Cor. x. 1–6.\n5046 Micah vii. 15–19\n\n\nstanding by them the future.For though it was so long after the departure of that people\nfrom Egypt, and so long before these seasons of the Church, that", "lang": "latin", "orig": ""}, {"v": 18, "f": "Augustine of Hippo", "w": "", "t": "\"The Jews said unto Him, What sign showest thou unto us, seeing that thou doest these things?\" And the Lord answered, \"Destroy this temple, and in three days I will raise it up. Then said the Jews, Forty and six years was this temple in building, and dost thou say, In three days I will rear it up?\" Flesh they were, fleshly things they minded; but He was speaking spiritually. But who could understand of what temple He spoke? But yet we have not far to seek; He has discovered it to us through the evangelist, he has told us of what temple He said it. \"But He spake,\" saith the evangelist, \"of the temple of His body.\" And it is manifest that, being slain, the Lord did rise again after three days. This is known to us all now: and if from the Jews it is concealed, it is because they stand without; yet to us it is open, because we know in whom we believe.", "lang": "english", "orig": ""}, {"v": 18, "f": "Bede", "w": "", "t": "For inasmuch as they sought a sign from our Lord of His right to eject the customary merchandize from the temple, He replied, that that temple signified the temple of His Body, in which was no spot of sin; as if He said, As by My power I purify your inanimate temple from your merchandize and wickedness; so the temple of My Body, of which that is the figure, destroyed by your hands, on the third day I will raise again.", "lang": "english", "orig": ""}, {"v": 18, "f": "Chrysostom - Homilies on John", "w": "Homily LXVII.", "t": "And it is evident both from the times, and from their reply. For there He came at the\nvery passover, but here much before. And there the Jews say, “What sign showest thou\nus?”2528but here they hold their peace, although reproved, because He was now marvelled\nat amongst all men.", "lang": "greek", "orig": ""}, {"v": 18, "f": "Cyril of Alexandria", "w": "", "t": "The multitude of the Jews are startled at the unwonted authority, and they who are over the temple are extremely vexed, deprived of their not easily counted gains. And they cannot convict Him of not having spoken most rightly in commanding them not to exhibit the Divine Temple as a house of merchandise. But they devise delays to the flight of the merchants, excusing themselves that they ought not to submit to Him off-hand, nor without investigation to receive as Son of God Him Who was witnessed to by no sign.", "lang": "english", "orig": ""}, {"v": 18, "f": "Gospel of Peter", "w": "Section XXXII.", "t": "ii. 16.\n2189 Mark xi. 16.\n2190 John ii. 17.\n2191 John ii. 18.\n2192 John ii. 19.\n2193 John ii. 20.\n2194 John ii. 21.\n2195 Or, if.\n2196 John ii. 22.\n2197 Mark xii. 41.\n\n\nthrowing in much. 2198And there came a poor widow, and cast in two mites. 2199And Jesus\ncall", "lang": "greek", "orig": ""}, {"v": 18, "f": "Gospel of Peter", "w": "20. The Temple Which Christ Says He Will Raise Up is the Church. How the Dry\nBones Will Be Made to Live Again.", "t": "“The Jews then answered and said unto Him, What sign showest Thou unto us, seeing\nthat Thou doest these things?5085 Jesus answered and said unto them, Destroy this temple,\nand in three days I will raise it up.” Those of the body, and those who incline to material\nthings, seem to me to be meant by the Jews, who, after Jesus has driven out those who make\nGod’s house a house of merchandise, are angry at Him for treating these matters in such a\nway, and demand a sign, a sign which will show that the Word, whom they do not receive,\nhas a right to do such things. The Saviour joins on to His statement about the temple a\nstatement which is really one with the former, about His own body, and to the question,\nWhat sign doest Thou, seeing that Thou doest such things? answers, “Destroy this temple,\nand in three days I will raise it up.” He could have exhibited a thousand other signs, but to\nthe question, “Seeing that Thou doest such things,” He could not answer anything else; He\nfittingly gave the answer about the sign connected with the temple, and not about signs\nunconnected with the temple. Now, both of these two things, the temple and the body of\nJesus, appear to me, in one interpretation at least, to be types of the Church, and to signify\nthat it is built of living stones,5086 a spiritual house for a holy priesthood, built5087 on the\nfoundation of the Apostles and prophets, Christ Jesus being the head corner-stone; and it\nis, therefore, called a temple. Now, from the text,5088 “Ye a", "lang": "greek", "orig": ""}, {"v": 18, "f": "Irenaeus", "w": "CAPUT VI.—SECUNDUM GENUS HÆRETICORUM AGGREDITUR, ILLORUM SCILICET QUI EX IMPIA\nDE DEO OMNIUM CONDITORE SENTENTIA, CONTINENTIAM EXERCENT.", "t": "1642 1 John. ii. 4.\n1643 [Elucidation VI.]\n1644 1 John ii. 18, 19.\n\n\nbonamque vitæ institutionem. Dominus autem “Non venit ad solvendam legem, sed ad\nimplendam:”1645 ad implendam autem, non ut cui aliquid deesset, sed quod legis prophetiæ\nper ejus adventum comp", "lang": "greek", "orig": ""}, {"v": 18, "f": "John Chrysostom", "w": "", "t": "And what say they? \"What sign showest Thou unto us, seeing that Thou doest these things?\" Alas for their utter madness! Was there need of a sign before they could cease their evil doings, and free the house of God from such dishonor? and was it not the greatest sign of His Excellence that He had gotten such zeal for that House? In fact, the well-disposed were distinguished by this very thing.\n\nAt one time then He said, that the Temple was made by them \"a den of thieves,\" showing that what they sold was gotten by theft, and rapine, and covetousness, and that they were rich through other men's calamities; at another, \"a house of merchandise,\" pointing to their shameless traffickings. \"But wherefore did He this?\" Since he was about to heal on the Sabbath day, and to do many such things which were thought by them transgressions of the Law in order that He might not seem to do this as though He had come to be some rival God and opponent of His Father, He takes occasion hence to correct any such suspicion of theirs.", "lang": "english", "orig": ""}, {"v": 18, "f": "John Chrysostom", "w": "", "t": "Wherefore He will not give them a sign; and before, when they came and asked Him, He made them the same answer, \"A wicked and adulterous generation seeketh after a sign; and there shall no sign be given unto it, but the sign of the prophet Jonas.\" Only then the answer was clear, now it is more ambiguous. This He doth on account of their extreme insensibility; for He who prevented them without their asking, and gave them signs, would never when they asked have turned away from them, had He not seen that their minds were wicked and false, and their intention treacherous. Think how full of wickedness the question itself was at the outset. When they ought to have applauded Him for His earnestness and zeal, when they ought to have been astonished that He cared so greatly for the House, they reproach Him, saying, that it was lawful to traffic, and unlawful for any to stop their traffic, except he should show them a sign. What saith Christ?\n\n\"Destroy this Temple, and in three days I will raise it up.\"\n\nMany such sayings He utters which were not intelligible to His immediate hearers, but which were to be so to those that should come after. And wherefore doth He this? In order that when the accomplishment of His prediction should have come to pass, He might be seen to have foreknown from the beginning what was to follow; which indeed was the case with this prophecy.", "lang": "english", "orig": ""}, {"v": 18, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And it is evident both from the times, and from their reply. For there He came at the very passover, but here much before. And there the Jews say, What sign do you show us? John 2:18 but here they hold their peace, although reproved, because He was now marvelled at among all men.", "lang": "", "orig": ""}, {"v": 18, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But the boastful and arrogant Jews, wishing to interrupt His teaching, came unto Him, and asked, By what authority doest thou these things? Matthew 21:23 For since they could not object against the miracles, they bring forward against Him the correction of the traffickers in the temple. And this in John also they appear to ask, although not in these words, but with the same intent. For there too they say, What sign do you show unto us? Seeing that you do these things.  But there He answers them, saying, Destroy this temple, and I in three days will raise it up, whereas here He drives them into a difficulty. Whence it is manifest, that then indeed was the beginning and prelude of the miracles, but here the end.", "lang": "", "orig": ""}, {"v": 18, "f": "Socrates", "w": "Chapter 19.—What the Apostle Paul Wrote to the Thessalonians About the Manifestation\nof Antichrist Which Shall Precede the Day of the Lord.", "t": "ers, we shall\n1406 Suetonius’ Nero, c. 57.\n1407 1 John ii. 18, 19.\n\n\nthen", "lang": "greek", "orig": ""}, {"v": 18, "f": "Theophylact of Ohrid", "w": "", "t": "When the Jews saw that the Lord was doing this with great authority and saying \"do not make My Father's house a marketplace,\" they said: \"Convince us by some miracle that You are the Son of God and that You were sent by Him. For how is it evident that the Lord of this house is Your Father?\"", "lang": "english", "orig": ""}, {"v": 18, "f": "Theophylact of Ohrid", "w": "", "t": "The Jews seeing Jesus thus acting with power, and having heard Him say, Make not My Father's house an house of merchandize, ask of Him a sign; Then answered the Jews and said unto Him, What sign shewest Thou unto us, seeing that Thou doest these things?", "lang": "english", "orig": ""}, {"v": 18, "f": "Thomas Aquinas", "w": "", "t": "Having set forth the occasion for showing the sign, the Evangelist then states the sign which would be given. First, he gives the sign. Secondly, he mentions the fruit of the signs Christ performed (v 23). As to the first he does three things. First, the request for the sign is given. Secondly, the sign itself (v 19). Thirdly, the way the sign was understood (v 20).\n\nThe Jews ask for a sign; and this is what he says: What sign can you show us authorizing you to do these things?\n\nHere we should note that when Jesus drove the merchants out of the temple, two things could be considered in Christ: his rectitude and zeal, which pertain to virtue; and his power or authority. It was not appropriate to require a sign from Christ concerning the virtue and zeal with which he did the above action, since everyone may lawfully act according to virtue. But he could be required to give a sign concerning his authority for driving them out of the temple, since it is not lawful for anyone to do this unless he has the authority.\n\nAnd so the Jews, not questioning his zeal and virtue, ask for a sign of his authority; and so they say, What sign can you show us authorizing you to do these things? i.e., Why do you drive us out with such power and authority, for this does not seem to be your office? They say the same thing in Matthew (21:23): \"By what authority are you doing these things?\"\n\nThe reason they ask for a sign is that it was the usual thing for Jews to require a sign, seeing that they were", "lang": "english", "orig": ""}, {"v": 19, "f": "1 Clement", "w": "Chapter II.—Christ’s true passion.", "t": "Now, He suffered all these things for us; and He suffered them really, and not in appearance\nonly, even as also He truly rose again. But not, as some of the unbelievers, who are\nashamed of the formation of man, and the cross, and death itself, affirm, that in appearance\nonly, and not in truth, He took a body of the Virgin, and suffered only in appearance, forgetting,\nas they do, Him who said, “The Word was made flesh;”504 and again, “Destroy this\ntemple, and in three days I will raise it up;”505 and once more, “If I be lifted up from the\nearth, I will draw all men unto Me.”506 The Word therefore did dwell in flesh, for “Wisdom\nbuilt herself an house.”507 The Word raised up again His own temple on the third day, when\nit had been destroyed by the Jews fi

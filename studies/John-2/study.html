<script>
const D = {"book": "John", "chapter": 2, "version": "MorphGNT", "verses": [{"v": 1, "text": "Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·"}, {"v": 2, "text": "ἐκλήθη δὲ καὶ ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὸν γάμον."}, {"v": 3, "text": "καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν."}, {"v": 4, "text": "⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου."}, {"v": 5, "text": "λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις· ⸂Ὅ τι⸃ ἂν λέγῃ ὑμῖν ποιήσατε."}, {"v": 6, "text": "ἦσαν δὲ ἐκεῖ ⸂λίθιναι ὑδρίαι⸃ ἓξ ⸂κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων κείμεναι⸃, χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς."}, {"v": 7, "text": "λέγει αὐτοῖς ὁ Ἰησοῦς· Γεμίσατε τὰς ὑδρίας ὕδατος· καὶ ἐγέμισαν αὐτὰς ἕως ἄνω."}, {"v": 8, "text": "καὶ λέγει αὐτοῖς· Ἀντλήσατε νῦν καὶ φέρετε τῷ ἀρχιτρικλίνῳ· ⸂οἱ δὲ⸃ ἤνεγκαν."}, {"v": 9, "text": "ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος"}, {"v": 10, "text": "καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι."}, {"v": 11, "text": "ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ."}, {"v": 12, "text": "Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας."}, {"v": 13, "text": "Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς."}, {"v": 14, "text": "καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,"}, {"v": 15, "text": "καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,"}, {"v": 16, "text": "καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου."}, {"v": 17, "text": "⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με."}, {"v": 18, "text": "ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;"}, {"v": 19, "text": "ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν."}, {"v": 20, "text": "εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;"}, {"v": 21, "text": "ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ."}, {"v": 22, "text": "ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς."}, {"v": 23, "text": "Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·"}, {"v": 24, "text": "αὐτὸς ⸀δὲ Ἰησοῦς οὐκ ἐπίστευεν ⸀αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας"}, {"v": 25, "text": "καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ."}], "parallel": {}, "patristic": [{"v": 1, "f": "Athanasius - Select Works", "w": "Book XXIX.", "t": "7.\n1014 Matt. ii. 11; Mark iii. 32; Luke ii. 33; John ii. 1.\n1015 In the Retractations, ii. sec 7, Augustin refers in correction of this remark to his Reply to the Second\nAnswer of Julian, iv. sec. 36, where he makes uncomeliness the effect of sin.\n1016 1 Cor", "lang": "greek", "orig": ""}, {"v": 1, "f": "Augustine - City of God", "w": "Tractate LXXXVII.", "t": "tion\n1454 2 Cor. v. 19.\n1455 John iii. 17.\n1456 1 John ii. 1, 2.\n1457 Rom. ix. 21, 23.\n\n\nof grace. And if by grace,” he adds, “then is it no more of works: otherwise grace is no more\ngrace.”1458", "lang": "latin", "orig": ""}, {"v": 1, "f": "Augustine - Confessions", "w": "Chapter XVII.—Of the Calling of the Apostles as They Were Fishing.", "t": "Mark i. 14; Luke iv. 14.\n820 John i. 39, etc.\n821 John ii. 1–11.\n822 [The interval between the temptation and the return to Galilee, referred to by the Synoptists, was at least\nnine months; possibly more than a year. Augustin implies, in § 42, that this journe", "lang": "latin", "orig": ""}, {"v": 1, "f": "Augustine - Confessions", "w": "Chapter XVII.—Of the Calling of the Apostles as They Were Fishing.", "t": "38. For [it is noticeable that] again in Cana of Galilee, after He had turned the water\ninto wine, this same John tells us how His disciples believed on Him. The narrative of that\nmiracle proceeds thus: “And the third day there was a marriage in Cana of Galilee; and the\nmother of Jesus was there. And both Jesus was called and His disciples to the marriage.”831\nNow, surely, if it was on this occasion that they believed on Him, as the evangelist tells us\na little further on, they were not yet His disciples at the time when they were called to the\nmarriage. This, however, is a mode of speech of the same kind with what is intended when\nwe say that the Apostle Paul was born in Tarsus of Cilicia;832 for certainly he was not an\napostle at that period. In like manner are we told here that the disciples of Christ were invited\nto the marriage, by which we are to understand, not that they were already disciples, but\nonly that they were to be His disciples. For, at the time when this narrative was prepared\n828 Luke v. 10.\n829 Matt. iv. 10; Mark i. 17.\n830 Matt. iv. 13–23; Mark i. 16–20; Luke v. 1–11; John i. 35–44.\n831 John ii. 1, 2.\n832 Acts xxii. 3.\n\n\nand committed to writing, they were the disciples of Christ in fact; and that is the reason\nwhy the evangelist, as the historian of past times, has thus spoken of them.", "lang": "latin", "orig": ""}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "The miracle indeed of our Lord Jesus Christ, whereby He made the water into wine, is not marvellous to those who know that it was God's doing. For He who made wine on that day at the marriage feast, in those six water-pots, which He commanded to be filled with water, the self-same does this every year in vines. For even as that which the servants put into the water-pots was turned into wine by the doing of the Lord, so in like manner also is what the clouds pour forth changed into wine by the doing of the same Lord. But we do not wonder at the latter, because it happens every year: it has lost its marvellousness by its constant recurrence. And yet it suggests a greater consideration than that which was done in the water-pots. For who is there that considers the works of God, whereby this whole world is governed and regulated, who is not amazed and overwhelmed with miracles? If he considers the vigorous power of a single grain of any seed whatever, it is a mighty thing, it inspires him with awe. But since men, intent on a different matter, have lost the consideration of the works of God, by which they should daily praise Him as the Creator, God has, as it were, reserved to Himself the doing of certain extraordinary actions, that, by striking them with wonder, He might rouse men as from sleep to worship Him. A dead man has risen again; men marvel: so many are born daily, and none marvels. If we reflect more considerately, it is a matter of greater wonder for one to be who was n", "lang": "english", "orig": ""}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "The Lord, on being invited, came to the marriage. What wonder if He came to that house to a marriage, having come into this world to a marriage? For, indeed, if He came not to a marriage, He has not here a bride. But what says the apostle? \"I have espoused you to one husband, to present you a chaste virgin to Christ.\" Why does he fear lest the virginity of Christ's bride should be corrupted by the subtilty of the devil? \"I fear,\" saith he, \"lest as the serpent beguiled Eve by his subtilty, so also your minds should be corrupted from the simplicity and chastity which is in Christ.\" Thus has He here a bride whom He has redeemed by His blood, and to whom He has given the Holy Spirit as a pledge. He has freed her from the bondage of the devil: He died for her sins, and is risen again for her justification. Who will make such offerings to his bride? Men may offer to a bride every sort of earthly ornament,-gold, silver, precious stones, houses, slaves, estates, farms,-but will any give his own blood? For if one should give his own blood to his bride, he would not live to take her for his wife. But the Lord, dying without fear, gave His own blood for her, whom rising again He was to have, whom He had already united to Himself in the Virgin's womb. For the Word was the Bridegroom, and human flesh the bride; and both one, the Son of God, the same also being Son of man. The womb of the Virgin Mary, in which He became head of the Church, was His bridal chamber: thence He came forth, as ", "lang": "english", "orig": ""}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "(In Verb. Dom. Serm. xli) Let the proud man blush to see the humility of God. Lo, among other things, the Son of the Virgin comes to a marriage; He who, when He was with the Father, instituted marriage.\n\n(Tr. viii. c. 4) What marvel, if He went to that house to a marriage, Who came into this world to a marriage. For here He has His spouse whom He redeemed with His own blood, to whom He gave the pledge of the Spirit, and whom He united to Himself in the womb of the Virgin. For the Word is the Bridegroom, and human flesh the bride, and both together arc one Son of God and Son of man. That womb of the Virgin Mary is His chamber, from which he went forth as a bridegroom. (Ps. 19:5)", "lang": "english", "orig": ""}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "When we see, therefore, such deeds wrought by Jesus God, why should we wonder at water being turned into wine by the man Jesus? For He was not made man in such manner that He lost His being God. Man was added to Him, God not lost to Him. This miracle was wrought by the same who made all those things. Let us not therefore wonder that God did it, but love Him because He did it in our midst, and for the purpose of our restoration. For He gives us certain intimations by the very circumstances of the case. I suppose that it was not without cause He came to the marriage. The miracle apart, there lies something mysterious and sacramental in the very fact. Let us knock, that He may open to us, and fill us with the invisible wine: for we were water, and He made us wine, made us wise; for He gave us the wisdom of His faith, whilst before we were foolish. And it appertains, it may be, to this wisdom, together with the honor of God, and with the praise of His majesty, and with the charity of His most powerful mercy, to understand what was done in this miracle.", "lang": "english", "orig": ""}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "In the ancient times there was prophecy, and no times were left without the dispensation of prophecy. But the prophecy, since Christ was not understood therein, was water. For in water wine is in some manner latent. The apostle tells us what we are to understand by this water: \"Even unto this day,\" saith he, \"whilst Moses is read, that same veil is upon their heart; that it is not unveiled because it is done away in Christ. And when thou shalt have passed over,\" saith he, \"to the Lord, the veil shall be taken away.\" By the veil he means the covering over of prophecy, so that it was not understood. When thou hast passed over to the Lord, the veil is taken away; so likewise is tastelessness taken away when thou hast passed over to the Lord; and what was water now becomes wine to thee. Read all the prophetic books; and if Christ be not understood therein, what canst thou find so insipid and silly? Understand Christ in them, and what thou readest not only has a taste, but even inebriates thee; transporting the mind from the body, so that forgetting the things that are past, thou reachest forth to the things that are before.\n\nWherefore, prophecy from ancient times, even from the time when the series of human births began to run onwards, was not silent concerning Christ; but the import of the prophecy was concealed therein, for as yet it was water.\n\nWhen these words of the Gospel are understood, and they are certainly clear, all the mysteries which are latent in this miracle of the", "lang": "english", "orig": ""}, {"v": 1, "f": "Bede", "w": "", "t": "(in v. 1) At the time of our Lord's appearing in the flesh, the sweet vinous taste of the law had been weakened by the carnal interpretations of the Pharisees.", "lang": "english", "orig": ""}, {"v": 1, "f": "Bede", "w": "", "t": "(Hom. 2d Sund. after Epiph.) His condescension in coming to the marriage, and the miracle He wrought there, are, even considering them in the letter only, a strong confirmation of the faith. Therein too are condemned the errors of Tatian, Marcion, and others who detract from the honour of marriage. For if the undefiled bed, and the marriage celebrated with due chastity, partook at all of sin, our Lord would never have come to one. Whereas now, conjugal chastity being good, the continence of widows better, the perfection of the virgin state best, to sanction all these degrees, but distinguish the merit of each, He deigned to be born of the pure womb of the Virgin; was blessed after birth by the prophetic voice of the widow Anna; and now invited in manhood to attend the celebration of a marriage, honours that also by the presence of His goodness.\n\n(in loc.) Nor is it without some mysterious allusion, that the marriage is related as taking-place on the third day. The first age of the world, before the giving of the Law, was enlightened by the example of the Patriarchs; the second, under the Law, by the writings of the Prophets; the third, under grace, by the preaching of the Evangelists, as if by the light of the third day; for our Lord had now appeared in the flesh. The name of the place too where the marriage was held, Cana of Galilee, which means, desire of migrating, has a typical signification, viz. that those are most worthy of Christ, who burn with devotional desires, and", "lang": "english", "orig": ""}, {"v": 1, "f": "CS Lewis", "w": "", "t": "Christianity does not exclude any of the ordinary human activities. St. Paul tells people to get on with their jobs. He even assumes that Christians may go to dinner parties, and, what is more, dinner parties given by pagans. Our Lord attends a wedding and provides miraculous wine. Under the aegis of His Church, and in the most Christian ages, learning and the arts flourish.", "lang": "english", "orig": ""}, {"v": 1, "f": "Caesarius of Arles", "w": "", "t": "The third day is the mystery of the Trinity, while the miracles of the nuptials are the mysteries of heavenly joys. It was both a nuptial day and a feast for this reason, because the church after the redemption was joined to the spouse who was coming—to that spouse, I say, whom all the ages from the beginning of the world had promised. It is he who came down to earth to invite his beloved to marriage with his highness, giving her for a present the token of his blood and intending to give later the dowry of his kingdom.", "lang": "english", "orig": ""}, {"v": 1, "f": "Cyril of Alexandria", "w": "", "t": "The wedding was not held in Jerusalem but outside of Judea, as it were, in the country of the Gentiles—“Galilee of the Gentiles,” as the prophet said. It is, I suppose, altogether obvious that the synagogue of the Jews rejected the Bridegroom from heaven and that the church of the Gentiles [gladly] received him.", "lang": "english", "orig": ""}, {"v": 1, "f": "Eusebius of Caesarea", "w": "", "t": "Consider whether this first miracle of our Savior that took place in Cana of Galilee, where he changed water into wine, is not foretold in the beginning of this prophecy where it says, “Drink this first. Act quickly, land of Zebulun and Naphtali, Galilee of the Gentiles.” And this miracle was a sign of the mystic wine—that wine of the faith of the new covenant that is transformed from bodily joy to a joy of mind and spirit.", "lang": "english", "orig": ""}, {"v": 1, "f": "GK Chesterton", "w": "", "t": "The primary laws of man are to be found in the permanent life of man; in those things that have been common to it in every time and land, though in the highest civilisation they have reached an enrichment like that of the divine romance of Cana in Galilee. We know that many critics of such a story say that its elements are not permanent; but indeed it is the critics who are not permanent. A hundred mad dogs of heresy have worried man from the beginning; but it was always the dog that died. We know there is a school of prigs who disapprove of the wine; and there may now be a school of prigs who disapprove of the wedding. For in such a case as the story of Cana, it may be remarked that the pedants are prejudiced against the earthly elements as much as, or more than, the heavenly elements. It is not the supernatural that disgusts them, so much as the natural. And those of us who have seen all the normal rules and relations of humanity uprooted by random speculators, as if they were abnormal abuses and almost accidents, will understand why men have sought for something divine if they wished to preserve anything human. They will know why common sense, cast out from some academy of fads and fashions conducted on the lines of a luxurious madhouse, has age after age sought refuge in the high sanity of a sacrament.", "lang": "english", "orig": ""}, {"v": 1, "f": "Gospel of Peter", "w": "Section V.", "t": "John i. 50.\n400 John i. 51.\n401 Luke iv. 14a.\n402 John ii. 1.\n403 Arabic Qatna; at § 5, 32, Qatina, following the Syriac form.\n404 Lit. the (cf. note to § 1, 40).\n405 John ii. 2.\n406 John ii. 3.\n407 John ii. 4.\n408 The reading of Cur. and Sin. is not known; bu", "lang": "greek", "orig": ""}, {"v": 1, "f": "Gregory Thaumaturgus", "w": "Canon XI.", "t": "2320 Philipp. iii. 14.\n2321 Rom. xii. 16.\n2322 1 John ii. 1.\n\n\nof this and other matters, saying, Those who taking their stand in the fervour and vehemence\nof the persecution, seeing the holy martyrs, and with what divine zeal they contended to\nreceive the ce", "lang": "greek", "orig": ""}, {"v": 1, "f": "Hippolytus", "w": "Chapter III.—Further Exposition of the Heresy of the Naasseni; Profess to Follow\nHomer; Acknowledge a Triad of Principles; Their Technical Names of the Triad;\nSupport These on the Authority of Greek Poets; Allegorize Our Saviour’s Miracles;\nThe Mystery of the Samothracians; Why the Lord Chose Twelve Disciples;\nThe Name Corybas, Used by Thracians and Phrygians, Explained; Naasseni\nProfess to Find Their System in Scripture; Their Interpretation of Jacob’s Vision;\nTheir Idea of the “Perfect Man;” The “Perfect Man” Called “Papa” By the\nPhrygians; The Naasseni and Phrygians on the Resurrection; The Ecstasis of St.\nPaul; The Mysteries of Religion as Alluded to by Christ; Interpretation of the\nParable of the Sower; Allegory of the Promised Land; Comparison of the System\nof the Phrygians with the Statements of Scripture; Exposition of the Meaning of\nthe Higher and Lower Eleusinian Mysteries; The Incarnation Discoverable Here\nAccording to the Naasseni.", "t": "387 Gen. xliv. 2–5.\n388 Taken from Anacreon.\n389 John ii. 1–11.\n390 Matt. xiii. 33, 34; Luke xvii. 21.\n\n\ndown, in the mysteries that are celebrated among them, that (same) Adam as the primal\nman. And habitually there stand in the temple of the Samothracians t", "lang": "greek", "orig": ""}, {"v": 1, "f": "John Chrysostom", "w": "", "t": "I said before that He was best known in Galilee; therefore they invite Him to the marriage, and He comes; for He looked not to His own honor, but to our benefit. He who disdained not to \"take upon Him the form of a servant\" (Phil. ii. 7), would much less disdain to be present at the marriage of servants; He who sat down \"with publicans and sinners\" (Matt. ix. 13), would much less refuse to sit down with those present at the marriage. Assuredly they who invited Him had not formed a proper judgment of Him, nor did they invite Him as some great one, but merely as an ordinary acquaintance; and this the Evangelist has hinted at, when he says, \"The mother of Jesus was there, and His brethren.\" Just as they invited her and His brethren, they invited Jesus.", "lang": "english", "orig": ""}, {"v": 1, "f": "Tertullian", "w": "", "t": "He was truly both seen and heard upon the mount; true and real was the draught of that wine at the marriage of (Cana in) Galilee; true and real also was the touch of the then believing Thomas.", "lang": "english", "orig": ""}, {"v": 1, "f": "Tertullian", "w": "", "t": "How mighty is the grace of water, in the sight of God and His Christ, for the confirmation of baptism! Never is Christ without water: if, that is, He is Himself baptized in water; inaugurates in water the first rudimentary displays of His power, when invited to the nuptials; invites the thirsty, when He makes a discourse, to His own sempiternal water; approves, when teaching concerning love, among works of charity, the cup of water offered to a poor (child); recruits His strength at a well; walks over the water; willingly crosses the sea; ministers water to His disciples.", "lang": "english", "orig": ""}, {"v": 1, "f": "Tertullian", "w": "", "t": "But further, if Christ reproves the scribes and Pharisees, sitting in the official chair of Moses, but not doing what they taught, what kind of (supposition). is it that He Himself withal should set upon His own official chair men who were mindful rather to enjoin-(but) not likewise to practise-sanctity of the flesh, which (sanctity) He had in all ways recommended to their teaching and practising?-first by His own example, then by all other arguments; while He tells (them) that \"the kingdom of heavens\" is \"children's; \" while He associates with these (children) others who, after marriage, remained (or became)virgins; \" while He calls (them) to (copy) the simplicity of the dove, a bird not merely innocuous, but modest too, and whereof one male knows one female; while He denies the Samaritan woman's (partner to be) a husband, that He may show that manifold husbandry is adultery; while, in the revelation of His own glory, He prefers, from among so many saints and prophets, to have with him Moses and Elias -the one a monogamist, the other a voluntary celibate (for Elias was nothing else than John, who came \"in the power and spirit of Elias\" ); while that \"man gluttonous and toping,\" the \"frequenter of luncheons and suppers, in the company of publicans and sinners,\" sups once for all at a single marriage, though, of course, many were marrying (around Him); for He willed to attend (marriages) only so often as (He willed) them to be.", "lang": "english", "orig": ""}, {"v": 1, "f": "Theodore Stratelates", "w": "", "t": "According to the theoria [of this passage], the Word of God descended from heaven in order that the bridegroom, having made the punishment of the human nature his own, might persuade [his bride] to become pregnant with the spiritual seed of wisdom. He convened the wedding on the third day, that is, in the last times of the age. For he struck the transgression that was in Adam and again bandaged us on the third day, that is, in the last times when, becoming human for us he took on the whole fleshly nature that he resurrected in himself from the dead. Therefore, because of this [John] mentions the third as the day when he consecrated the wedding.", "lang": "english", "orig": ""}, {"v": 1, "f": "Theodore of Mopsuestia", "w": "", "t": "It is evident that this third day should be calculated as the third day after the baptism. He said that the first day was that in which Andrew and his companion followed him and then passed the night with him. The second day relates the events concerning Philip and Nathanael. The third day points to the events of this wedding party. Clearly all these events took place in Galilee. Immediately after his baptism he left and lived there.", "lang": "english", "orig": ""}, {"v": 1, "f": "Thomas Aquinas", "w": "", "t": "Above, the Evangelist showed the dignity of the incarnate Word and gave various evidence for it. Now he begins to relate the effects and actions by which the divinity of the incarnate Word was made known to the world. First, he tells the things Christ did, while living in the world, that show his divinity. Secondly, he tells how Christ showed his divinity while dying; and this from chapter twelve on.\n\nAs to the first he does two things. First, he shows the divinity of Christ in relation to the power he had over nature. Secondly, in relation to the effects of grace; and this from chapter three on. Christ's power over nature is pointed out to us by the fact that he changed a nature. And this change was accomplished by Christ as a sign: first, to his disciples, to strengthen them; secondly, to the people, to lead them to believe (2:12). This transformation of a nature, in order to strengthen the disciples, was accomplished at a marriage, when he turned water into wine. First, the marriage is described. Secondly, those present. Thirdly, the miracle performed by Christ.\n\nIn describing the marriage, the time is first mentioned. Hence he says, On the third day there was a wedding, i.e., after the calling of the disciples mentioned earlier. For, after being made known by the testimony of John, Christ also wanted to make himself known. Secondly, the place is mentioned; hence he says, at Cana in Galilee. Galilee is a province, and Cana a small village located in that province.\n\nAs far ", "lang": "english", "orig": ""}, {"v": 1, "f": "npnf209", "w": "Chapter XXIV.—Concerning Virginity.", "t": "d. vi. 16.\n2687 Ex. xix. 15; Num. vi. 2.\n2688 St. John ii. 1.\n2689 Heb. xiii. 4.\n\n\namong the virtues, equally as among the vices, there are higher and lower grades. We know\nthat all mortals after the first parents of the race are the offspring of marriage. For", "lang": "greek", "orig": ""}, {"v": 2, "f": "Augustine - Confessions", "w": "Sermon LXXIII.", "t": "On the words of the Gospel, John ii. 2, “and Jesus also was bidden, and his disciples, to the\nmarriage.”", "lang": "latin", "orig": ""}, {"v": 2, "f": "Augustine of Hippo", "w": "", "t": "The Lord, in that He came to the marriage to which He was invited, wished, apart from the mystical signification, to assure us that marriage was His own institution. For there were to be those of whom the apostle spoke, \"forbidding to marry,\" and asserting that marriage was an evil, and of the devil's institution: notwithstanding the same Lord declares in the Gospel, on being asked whether it be lawful for a man to put away his wife for any cause, that it is not lawful save for the cause of fornication. In His answer, if you remember, He said, \"What God hath joined together let not man put asunder.\" And they that are well instructed in the catholic faith know that God instituted marriage; and as the union of man and wife is from God, so divorce is from the devil. But in the case of fornication it is lawful for a man to put away his wife, because she first chose to be no longer wife in not preserving conjugal fidelity to her husband. Nor are those women who vow virginity to God, although they hold a higher place of honor and sanctity in the Church, without marriage. For they too, together with the whole Church, attain to a marriage, a marriage in which Christ is the Bridegroom. And for this cause, therefore, did the Lord, on being invited, come to the marriage, to confirm conjugal chastity, and to show forth the sacrament of marriage. For the bridegroom in that marriage, to whom it was said, \"Thou hast kept the good wine until now,\" represented the person of the Lord. For the ", "lang": "english", "orig": ""}, {"v": 2, "f": "Cyril of Alexandria", "w": "", "t": "As one who was renewing and refashioning the very nature of humanity for the better, Christ not only imparts his blessing to those already called into being but also prepares grace in advance for those soon to be born and sanctifies their entrance into existence. And yet, there is still another reason why Jesus was at this wedding. God had said to the woman. “in pain you shall bring forth children.” How else could we escape a condemned marriage unless this curse was annulled? This curse too the Savior removes because of his love for humankind. For he who is the delight and joy of all honored marriage with his presence so that he might expel the ancient sadness of childbearing.", "lang": "english", "orig": ""}, {"v": 2, "f": "Gospel of Peter", "w": "Section V.", "t": "iac form.\n404 Lit. the (cf. note to § 1, 40).\n405 John ii. 2.\n406 John ii. 3.\n407 John ii. 4.\n408 The reading of Cur. and Sin. is not known; but cf. Moesinger, p. 53, and Isho’dad quoted in Harris,\nFragments, etc., p. 46.\n409 John ii. 5.\n410 John ii. 6.\n411 Jo", "lang": "greek", "orig": ""}, {"v": 2, "f": "Maximus of Turin", "w": "", "t": "The Son of God went to the wedding so that marriage, which had been instituted by his own authority, might be sanctified by his blessed presence. He went to a wedding of the old order when he was about to take a new bride for himself through the conversion of the Gentiles, a bride who would forever remain a virgin. He went to a wedding even though he himself was not born of human wedlock. He went to the wedding not, certainly, to enjoy a banquet but rather to make himself known by miracles. He went to the wedding not to drink wine but to give it.", "lang": "english", "orig": ""}, {"v": 2, "f": "Origen of Alexandria", "w": "", "t": "The third day was now come from Jesus’ baptism, and there was a marriage taking place in Cana of Galilee. Jesus’ mother was there when, on the failure of the wine, he made wine out of water.… Jesus being Maker of man and woman does not refuse to be called to a marriage; it was he who after forming Eve brought her to Adam. Therefore in the Gospel he says about this union, “What God has joined together let no man put asunder.” Let the heretics therefore be put to shame who reject marriage, since Jesus was called to a marriage and his mother was there.", "lang": "english", "orig": ""}, {"v": 2, "f": "Theophylact of Ohrid", "w": "", "t": "They invite the Lord to the wedding not because they had seen His miracles, not as a great man, but simply as an acquaintance. Indicating this, the evangelist says: \"the Mother of Jesus was there\" and His brothers. Just as she and the brothers were invited, so too was the Lord. The Lord does not reject the invitation and comes, because He looked not to His own dignity, but to what is useful and beneficial for us. He who did not consider it beneath Himself to be among servants could even less consider it beneath Himself to go to a wedding.", "lang": "english", "orig": ""}, {"v": 2, "f": "Thomas Aquinas", "w": "", "t": "And this is what comes next: Jesus was invited. Christ decided to attend this wedding, first of all, to give us an example of humility. For he did not look to his own dignity, but \"just as he condescended to accept the form of a servant, so he did not hesitate to come to the marriage of servants,\" as Chrysostom says. And as Augustine says: \"Let man blush to be proud, for God became humble.\" For among his other acts of humility, the Son of the Virgin came to a marriage, which he had already instituted in paradise when he was with his Father. Of this example it is said: \"Learn from me, for I am gentle and humble of heart\" (Mt 11:29).\n\nHe came, secondly, to reject the error of those who condemn marriage, for as Bede says: \"If there were sin in a holy marriage bed and in a marriage carried out with due purity, the Lord would not have come to the marriage.\" But because he did come, he implies that the baseness of those who denounce marriage deserves to be condemned. \"If she marries, it is not a sin\" (1 Cor 7:36).\n\nThe disciples are mentioned when he says, and his disciples.\n\nIn its mystical meaning, the mother of Jesus, the Blessed Virgin, is present in spiritual marriages as the one who arranges the marriage, because it is through her intercession that one is joined to Christ through grace: \"In me is every hope of life and of strength\" (Sir 24:25). Christ is present as the true groom of the soul, as is said below (3:29): \"It is the groom who has the bride.\" The disciples are the ", "lang": "english", "orig": ""}, {"v": 3, "f": "1 Clement", "w": "Chapter XI—Proofs in continuation, extracted from St. John’s Gospel. The\nGospels are four in number, neither more nor less. Mystic reasons for this.", "t": "5. That wine,793 which was produced by God in a vineyard, and which was first consumed,\nwas good. None794 of those who drank of it found fault with it; and the Lord partook\nof it also. But that wine was better which the Word made from water, on the moment, and\nsimply for the use of those who had been called to the marriage. For although the Lord had\nthe power to supply wine to those feasting, independently of any created substance, and to\nfill with food those who were hungry, He did not adopt this course; but, taking the loaves\nwhich the earth had produced, and giving thanks,795 and on the other occasion making\nwater wine, He satisfied those who were reclining [at table], and gave drink to those who\nhad been invited to the marriage; showing that the God who made the earth, and commanded\nit to bring forth fruit, who established the waters, and brought forth the fountains, was He\nwho in these last times bestowed upon mankind, by His Son, the blessing of food and the\nfavour of drink: the Incomprehensible [acting thus] by means of the comprehensible, and\nthe Invisible by the visible; since there is none beyond Him, but He exists in the bosom of\nthe Father.", "lang": "greek", "orig": ""}, {"v": 3, "f": "Alcuin of York", "w": "", "t": "She represents here the Synagogue, which challenges Christ to perform a miracle. It was customary with the Jews to ask for miracles.", "lang": "english", "orig": ""}, {"v": 3, "f": "Bede", "w": "", "t": "The wine was made to fail, to give our Lord the opportunity of making better; that so the glory of God in man might be brought out of its hiding place: And when they wanted wine, the mother of Jesus saith unto Him, They have no wine.", "lang": "english", "orig": ""}, {"v": 3, "f": "Cyril of Alexandria", "w": "", "t": "Seasonably comes He at length, to the beginning of miracles, even if He seems to have been called to it without set purpose. For a marriage feast being held (it is clear that it was altogether holily), the mother of the Saviour is present, and Himself also being bidden comes together with His own disciples, to work miracles rather than to feast with them, and yet more to sanctify the very beginning of the birth of man: I mean so far as appertains to the flesh. For it was fitting that He, Who was renewing the very nature of man, and refashioning it all for the better, should not only impart His blessing to those already called into being, but also prepare before grace for those soon to be born, and make holy their entrance into being.\n\nReceive also yet a third reason. It had been said to the woman by God, In sorrow thou shalt bring forth children. How then was it not needful that we should thrust off this curse too, or how else could we escape a condemned marriage? This too the Saviour, being loving to man, removes. For He, the Delight and Joy of all, honoured marriage with His Presence, that He might expel the old shame of child-bearing. For if any man be in Christ, he is a new creature; and old things are passed away, as Paul saith, they are become new. He cometh therefore with. His disciples to the marriage. For it was needful that the lovers of miracles should be present with the Wonderworker, to collect what was wrought as a kind of food to their faith. But when wine fail", "lang": "english", "orig": ""}, {"v": 3, "f": "Gospel of Peter", "w": "Section V.", "t": "t. the (cf. note to § 1, 40).\n405 John ii. 2.\n406 John ii. 3.\n407 John ii. 4.\n408 The reading of Cur. and Sin. is not known; but cf. Moesinger, p. 53, and Isho’dad quoted in Harris,\nFragments, etc., p. 46.\n409 John ii. 5.\n410 John ii. 6.\n411 John ii. 7.\n\n\n29 w", "lang": "greek", "orig": ""}, {"v": 3, "f": "Irenaeus", "w": "", "t": "That wine, which was produced by God in a vineyard, and which was first consumed, was good. None of those who drank of it found fault with it; and the Lord partook of it also. But that wine was better which the Word made from water, on the moment, and simply for the use of those who had been called to the marriage. For although the Lord had the power to supply wine to those feasting, independently of any created substance, and to fill with food those who were hungry, He did not adopt this course; but, taking the loaves which the earth had produced, and giving thanks, and on the other occasion making water wine, He satisfied those who were reclining at table, and gave drink to those who had been invited to the marriage; showing that the God who made the earth, and commanded it to bring forth fruit, who established the waters, and brought forth the fountains, was He who in these last times bestowed upon mankind, by His Son, the blessing of food and the favour of drink: the Incomprehensible acting thus by means of the comprehensible, and the Invisible by the visible; since there is none beyond Him, but He exists in the bosom of the Father.", "lang": "english", "orig": ""}, {"v": 3, "f": "John Chrysostom", "w": "", "t": "Here it is worth while to enquire whence it came into His mother's mind to imagine anything great of her Son; for He had as yet done no miracle, since the Evangelist saith, \"This beginning of miracles did Jesus in Cana of Galilee.\"\n\nNow if any say that this is not a sufficient proof that it was the \"beginning of His miracles,\" because there is added simply \"in Cana of Galilee,\" as allowing it to have been the first done there, but not altogether and absolutely the first, for He probably might have done others elsewhere, we will make answer to him of that which we have said before. And of what kind? The words of John (the Baptist); \"And I knew Him not; but that He should be made manifest to Israel, therefore am I come, baptizing with water.\" Now if He had wrought miracles in early age, the Israelites would not have needed another to declare Him. For He who came among men, and by His miracles was so made known, not to those only in Judaea, but also to those in Syria and beyond, and who did this in three years only, or rather who did not need even these three years to manifest Himself (Matt. iv. 24), for immediately and from the first His fame went abroad everywhere; He, I say, who in a short time so shone forth by the multitude of His miracles, that His name was well known to all, was much less likely, if while a child He had from an early age wrought miracles, to escape notice so long. For what was done would have seemed stranger as done by a boy, and there would have been tim", "lang": "english", "orig": ""}, {"v": 3, "f": "John Chrysostom", "w": "", "t": "\"How then,\" asks some one, \"came it into the mind of His mother to imagine anything great of Him?\" He was now beginning to reveal Himself, and was plainly discovered by the witness of John, and by what He had said to His disciples. And before all this, the Conception itself and all its attending circumstances had inspired her with a very great opinion of the Child; \"for,\" said Luke, \"she heard all the sayings concerning the Child, and kept them in her heart.\" \"Why then,\" says one, \"did not she speak this before?\" Because, as I said, it was now at last that He was beginning to manifest Himself. Before this time He lived as one of the many, and therefore His mother had not confidence to say any such thing to Him; but when she heard that John had come on His account, and that he had borne such witness to Him as he did, and that He had disciples, after that she took confidence, and called Him, and said, when they wanted wine, \"They have no wine.\" For she desired both to do them a favor, and through her Son to render herself more conspicuous; perhaps too she had some human feelings, like His brethren, when they said, \"Show thyself to the world\" (c. xvii. 4), desiring to gain credit from His miracles.", "lang": "english", "orig": ""}, {"v": 3, "f": "Lactantius", "w": "CONCERNING JAMES THE BROTHER OF THE LORD, AND STEPHEN THE FIRST MARTYR.", "t": "907 John ix. 1, etc.\n908 Matt. xiv. 17, etc.\n909 John ii. 3, etc.\n910 Matt. xvii. 24, etc.\n911 Acts i. 3.\n912 Matt. xxviii. 19.\n913 Acts i. 9.\n\n\nLord is the death of His holy ones;”914 and Solomon says, “The memory of the just is with\nencomiums:”915 of whom a", "lang": "latin", "orig": ""}, {"v": 3, "f": "Romanos the Melodist", "w": "", "t": "When Christ was present at the marriage feast, and the crowd of guests were faring sumptuously,\nThe supply of wine failed them, and their joy was turned into distress;\nThe bridegroom was upset; the cupbearers muttered unceasingly;\nThere was this one sad display of penury,\nAnd there was no small clamor in the room.\nRecognizing it, the all-holy Mary\nCame at once and said to her son: “They have no wine,\nBut I beg you, my son, show that you can do all things,\nThou who has in wisdom created all things.”\n\nWe beg of you, holy Virgin, from what sort of miracles did you know\nHow your son would be able to offer wine when He had not harvested the grapes\nAnd had never before worked wonders, as John, inspired of God wrote?\nTeach us, how, when you had never gazed upon\nAnd never made trial of His miracles,\n\nHow did you summon Him to this miracle?\nFor the question now posed to us in this matter is not simple,\nAs to how you said to your son: “Give them wine,”\nHe who has in wisdom created all things.\n\nLet us learn the word which the mother of the God of all said to us:\n“Listen,” she said, “my friends, instruct yourselves and know the mystery;\nI have seen my son working miracles even before this miracle. …\n\n“For I know that I did not know a husband,\nAnd I bore a son—beyond natural law and reason,\nAnd I know that I remained a virgin as I had been.\nDo you, O man, ask for a miracle greater than this birth?\nGabriel came to me saying how this one would be born,\nHe who has in wisdom created all thing", "lang": "english", "orig": ""}, {"v": 3, "f": "Theodore of Mopsuestia", "w": "", "t": "Perhaps his mother, as mothers do, incited him to perform a miracle, wishing that the greatness of her son would be revealed—and thinking that the lack of wine offered the right occasion for the miracle.", "lang": "english", "orig": ""}, {"v": 3, "f": "Theophylact of Ohrid", "w": "", "t": "The Mother urges Him to perform a miracle, because from the events of the conception and birth She had received a lofty understanding of His power. For She kept all these things in Her heart (Luke 2:19, 51) and from this concluded that Her Son possesses power above that of man. But the Mother of God did not have reason to ask Jesus to perform a miracle on the grounds that He had performed other miracles. For, being a child, He did not perform a single miracle; otherwise He would have been known to all. At the same time, the Mother also remembered the testimonies of John, in which he bore witness concerning Him, and She already saw that disciples were following Him, and from all of this She inferred the power of Her Son.", "lang": "english", "orig": ""}, {"v": 3, "f": "Thomas Aquinas", "w": "", "t": "At this physical marriage some role in the miracle belongs to the mother of Christ, some to Christ, and some to the disciples. When he says, When the wine ran out, he indicates the part of each. The role of Christ's mother was to superintend the miracle; the role of Christ to perform it; and the disciples were to bear witness to it. As to the first, Christ's mother assumed the role of a mediatrix. Hence she does two things. First, she intercedes with her Son. In the second place, she instructs the servants. As to the first, two things are mentioned. First, his mother's intercession; secondly, the answer of her Son.\n\nIn Mary's intercession, note first her kindness and mercy. For it is a quality of mercy to regard another's distress as one's own, because to be merciful is to have a heart distressed at the distress of another: \"Who is weak, and I am not weak?\" (2 Cor 11:29). And so because the Blessed Virgin was full of mercy, she desired to relieve the distress of others. So he says, When the wine ran out, the mother of Jesus said to him.\n\nNote, secondly, her reverence for Christ: for because of the reverence we have for God it is sufficient for us merely to express our needs: \"Lord, all my desires are known by you\" (Ps 37:10). But it is not our business to wonder about the way in which God will help us, for as it is said: \"We do not know what we should pray for as we ought\" (Rom 8:26). And so his mother merely told him of their need, saying, They have no more wine.\n\nThirdly, n", "lang": "english", "orig": ""}, {"v": 4, "f": "Ammonius of Alexandria", "w": "", "t": "He chides his mother for having importunely reminded God, who has no need to be reminded of anything. It is as if he had said, “Do not regard me only as a man but also as God. Not yet has the time of my manifestation come. Not as yet is it known who I am.”", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "It is because of an indubitable mystery that He appears not to acknowledge His mother, from whom as the Bridegroom He came forth, when He says to her, \"Woman, what have I to do with thee? Mine hour is not yet come.\" What is this? Did He come to the marriage for the purpose of teaching men to treat their mothers with contempt? Surely he to whose marriage He had come was taking a wife with the view of having children, and surely he wished to be honored by those children he would beget: had Jesus then come to the marriage in order to dishonor His mother, when marriages are celebrated and wives married with the view of having children, whom God commands to honor their parents? Beyond all doubt, brethren, there is some mystery lurking here.", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "It is really a matter of such importance that some,-of whom the apostle, as we have mentioned before, has forewarned us to be on our guard, saying, \"I fear, lest, as the serpent beguiled Eve by his subtilty, so also your minds should be corrupted from the simplicity and chastity which is in Christ,\"-taking away from the credibility of the gospel, and asserting that Jesus was not born of the Virgin Mary, used to endeavor to draw from this place an argument in support of their error, so far as to say, How could she be His mother, to whom He said, \"Woman, what have I to do with thee?\" Wherefore we must answer them, and show them why the Lord said this, lest in their insanity they appear to themselves to have discovered something contrary to wholesome belief, whereby the chastity of the virgin bride may be corrupted, that is, whereby the faith of the Church may be injured. For in very deed, brethren, their faith is corrupted who prefer a lie to the truth. For these men, who appear to honor Christ in such wise as to deny that He had flesh, do nothing short of proclaiming Him a liar. Now they who build up a lie in men, what do they but drive the truth out of them? They let in the devil, they drive Christ out; they let in an adulterer, shut out the bridegroom, being evidently paranymphs, or rather, the panderers of the serpent. For it is for this object they speak, that the serpent may possess, and Christ be shut out.", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "How doth the serpent possess? When a lie possesses. When falsehood possesses, then the serpent possesses; when truth possesses, then Christ possesses. For Himself has said, \"I am the truth;\" but of that other He said, \"He stood not in the truth, because the truth is not him.\" And Christ is the truth in such wise that thou shouldst receive the whole to be true in Him. The true Word, God equal with the Father, true soul, true flesh, true man, true God, true nativity, true passion, true death, true resurrection. If thou say that any of these is false, rottenness enters, the worms of falsehood are bred of the poison of the serpent, and nothing sound will remain.", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "Why, then, said the Son to the mother, \"Woman, what have I to do with thee? mine hour is not yet come?\" Our Lord Jesus Christ was both God and man. According as He was God, He had not a mother; according as He was man, He had. She was the mother, then, of His flesh, of His humanity, of the weakness which for our sakes He took upon Him. But the miracle which He was about to do, He was about to do according to His divine nature, not according to His weakness; according to that wherein He was God not according to that wherein He was born weak. But the weakness of God is stronger than men. His mother then demanded a miracle of Him; but He, about to perform divine works, so far did not recognize a human womb; saying in effect, \"That in me which works a miracle was not born of thee, thou gavest not birth to my divine nature; but because my weakness was born of thee, I will recognize thee at the time when that same weakness shall hang upon the cross.\" This, indeed, is the meaning of \"Mine hour is not yet come.\" For then it was that He recognized, who, in truth, always did know. He knew His mother in predestination, even before He was born of her; even before, as God, He created her of whom, as man, He was to be created, He knew her as His mother: but at a certain hour in a mystery He did not recognize her; and at a certain hour which had not yet come, again in a mystery, He does recognize her. For then did He recognize her, when that to which she gave birth was a-dying. That by whic", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "For while He was God and the Lord of heaven and earth, He came by a mother who was a woman. In that He was Lord of the world, Lord of heaven and earth, He was, of course, the Lord of Mary also; but in that wherein it is said, \"Made of a woman, made under the law,\" He was Mary's son. The same both the Lord of Mary and the son of Mary; the same both the Creator of Mary and created from Mary. Marvel not that He was both son and Lord. For just as He is called the son of Mary, so likewise is He called the son of David; and son of David because son of Mary. Hear the apostle openly declaring, \"Who was made of the seed of David according to the flesh.\" Hear Him also declared the Lord of David; let David himself declare this: \"The Lord said to my Lord, Sit Thou on my right hand.\" And this passage Jesus Himself brought forward to the Jews, and refuted them from it. How then was He both David's son and David's Lord? David's son according to the flesh, David's Lord according to His divinity; so also Mary's son after the flesh, and Mary's Lord after His majesty.", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "Now as she was not the mother of His divine nature, whilst it was by His divinity the miracle she asked for would be wrought, therefore He answered her, \"Woman, what have I to do with thee?\" But think not that I deny thee to be my mother: \"Mine hour is not yet come;\" for in that hour I will acknowledge thee, when the weakness of which thou art the mother comes to hang on the cross. Let us prove the truth of this. When the Lord suffered, the same evangelist tells us, who knew the mother of the Lord, and who has given us to know about her in this marriage feast,-the same, I say, tells us, \"There was there near the cross the mother of Jesus; and Jesus saith to His mother, Woman, behold thy son! and to the disciple, Behold thy mother!\" He commends His mother to the care of the disciple; commends His mother, as about to die before her, and to rise again before her death. The man commends her a human being to man's care. This humanity had Mary given birth to. That hour had now come, the hour of which He had then said, \"Mine hour is not yet come.\"", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "Now then, if it seem good, brethren, those men being repulsed, and ever wandering in their own blindness, unless in humility they be healed, let us inquire why our Lord answered His mother in such a manner. He was in an extraordinary manner begotten of the Father without a mother, born of a mother without a father; without a mother He was God, without a father He was man; without a mother before all time, without a father in the end of times. What He said was said in answer to His mother, for \"the mother of Jesus was there,\" and \"His mother said unto Him.\" All this the Gospel says. It is there we learn that \"the mother of Jesus was there,\" just where we learn that He said unto her, \"Woman, what have I to do with thee? mine hour is not yet come.\" Let us believe the whole; and what we do not yet understand, let us search out. And first take care, lest perhaps, as the Manicaeans found occasion for their falsehood, because the Lord said, \"Woman, what have I to do with thee?\" the astrologers in like manner may find occasion for their deception, in that He said, \"Mine hour is not yet come.\"", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "If it was in the sense of the astrologers He said this, we have committed a sacrilege in burning their books. But if we have acted rightly, as was done in the times of the apostles, it was not according to their notion that the Lord said, \"Mine hour is not yet come.\" For, say those vain-talkers and deceived seducers, thou seest that Christ was under fate, as He says, \"Mine hour is not yet come.\" To whom then must we make answer first-to the heretics or to the astrologers? For both come of the serpent, and desire to corrupt the Church's virginity of heart, which she holds in undefiled faith.", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "Now then, brethren, we have answered the heretics. Let us now answer the astrologers. And how do they attempt to prove that Jesus was under fate? Because, say they, Himself said, \"Mine hour is not yet come.\" Therefore we believe Him; and if He had said, \"I have no hour,\" He would have excluded the astrologers: but behold, say they, He said, \"Mine hour is not yet come.\" If then He had said, \"I have no hour,\" the astrologers would have been shut out, and would have no ground for their slander; but now that He said, \"Mine hour is not yet come,\" how can we contradict His own words? 'Tis wonderful that the astrologers, by believing Christ's words, endeavor to convince Christians that Christ lived under an hour of fate. Well, let them believe Christ when He saith, \"I have power to lay down my life and to take it up again: no man taketh it from me, but I lay it down of myself, and I take it again.\" Is this power then under fate? Let them show us a man who has it in his power when to die, how long to live: this they can never do. Let them, therefore, believe God when He says, \"I have power to lay down my life, and to take it up again;\" and let them inquire why it was said, \"Mine hour is not yet come;\" and let them not because of these words, be imposing fate on the Maker of heaven, the Creator and Ruler of the stars. For even if fate were from the stars, the Maker of the stars could not be subject to their destiny. Moreover, not only Christ had not what thou callest fate, but not eve", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "Why then did He say, \"Mine hour is not yet come?\" Rather because, having it in His power when to die, He did not yet see it fit to use that power. Just as we, brethren, say, for example, \"Now is the appointed hour for us to go out to celebrate the sacraments.\" If we go out before it is necessary, do we not act perversely and absurdly? And because we act only at the proper time, do we therefore in this action regard fate when we so express ourselves? What means then, \"Mine hour is not yet come?\" When I know that it is the fitting time for me to suffer, when my suffering will be profitable, then I will willingly suffer. That hour is not yet: that thou mayest preserve both, this, \"Mine hour is not yet come;\" and that, \"I have power to lay down my life, and power to take it again.\" He had come, then, having it in His power when to die. And surely it would not have been right were He to die before He had chosen disciples. Had he been a man who had not his hour in his own power, he might have died before he had chosen disciples; and if haply he had died when his disciples were now chosen and instructed, it would be something conferred on him, not his own doing. But, on the contrary, He who had come having in His power when to go, when to return, how far to advance, and for whom the regions of the grave were open, not only when dying but when rising again; He, I say, in order to show us His Church's hope of immortality, showed in the head what it behoved the members to expect.", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "The hour then had not yet come, the fit time was not yet. Disciples had to be called, the kingdom of heaven to be proclaimed, the Lord's divinity to be shown forth in miracles, and His humanity in His very sympathy with mortal men. For He who hungered because He was man, fed so many thousands with five loaves because He was God; He who slept because He was man, commanded the winds and the waves because He was God. All these things had first to be set forth, that the evangelists might have whereof to write, that there might be what should be preached to the Church. But when He had done as much as He judged to be sufficient, then His hour came, not of necessity, but of will,-not of condition, but of power.", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "Although the Evangelist himself mentions Jesus' mother by her very name, Jesus nevertheless addresses her with the words \"Woman, what have I to do with you?\" But here he is not pushing her away from himself since he had received flesh from her. Rather, his purpose is to convey the conception of his divinity, which is especially appropriate at this time when he is about to change the water into wine. This is the divinity that had made that \"woman\" [Mary] rather than being made in her.", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "There is … nothing that would compel us to deny the mother of the Lord occasioned by the words spoken by him, “Woman, what have I to do with you? My hour is not yet come.” Rather, he admonishes us to understand that, in respect of his being God, there was no mother for him. [When he spoke to her] it was as he was preparing to demonstrate of his personal majesty in the turning of water into wine. But as regards his being crucified, he was crucified in respect of his being man. And that was the hour that had not come as yet.", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "(Tr. viii. c. 5) Some who derogate from the Gospel, and say that Jesus was not born of the Virgin Mary, try to draw an argument for their error from this place; for, how, say they, could she be His mother to whom He said, What have I to do with thee? Now who is it who gives this account, and on whose authority do we believe it? The Evangelist John. But he himself says, The mother of Jesus was there. Why should He say it, unless both were true. But did He therefore come to the marriage to teach men to despise their mother?\n\n(de Symbolo Serm. ii. c. 14. [5]) To mark a distinction between His Godhead and manhood, that according to His manhood He was inferior and subject, but according to His Godhead supreme, He saith, Woman, what have I to do with thee?\n\n(Tr. viii. c. 9. et seq. sparsim) Or it was because our Lord as God had not a mother, though as man He had, and the miracle He was about to work was the act of His Divinity, not of human infirmity. When therefore His mother demanded a miracle, He, as though not acknowledging a human birth, when about to perform a divine work, said, Woman, what have I to do with thee? As if He said, Thou didst not beget that in Me, which works the miracle, My Divinity. (She is called woman, with reference to the female sex, not to any injury of her virginity.) But because thou broughtest forth My infirmity, I will acknowledge thee then, when that very infirmity shall hang on the cross. And therefore He adds, Mine hour is not yet come: as if to sa", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "I ask you, O faithful Christians, Was the mother of Jesus there? Answer ye, She was. Whence know you? Answer, The Gospel says it. What answer made Jesus to His mother? Answer ye, \"Woman, what have I to do with thee? mine hour is not yet come.\" And whence know you this? Answer, The Gospel says it. Let no man corrupt this your faith, if you desire to preserve a chaste virginity for the Bridegroom. But if it be asked of you, why He made this answer to His mother, let him declare who understands; but he who does not as yet understand, let him most firmly believe that Jesus made this answer, and made it moreover to His mother. By this piety he will learn to understand also why Jesus answered thus, if by praying he knock at the door of truth, and do not approach it with wrangling. Only this much, while he fancies himself to know, or is ashamed because he does not know, why Jesus answered thus, let him beware lest he be constrained to believe either that the evangelist lied when he said, \"The mother of Jesus was there,\" or that Jesus Himself suffered for our sins by a counterfeit death and for our justification showed counterfeit scars; and that He spoke falsely in saying, \"If ye continue in my word, ye are my disciples indeed; and ye shall know the truth, and the truth shall make you free.\" For if He had a false mother, false flesh, false death, false wounds in His death, false scars in His resurrection, then it will not be the truth, but rather falsehood, that shall make free thos", "lang": "english", "orig": ""}, {"v": 4, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Homily XXII.", "t": "It is no slight question which is proposed to us also to-day. For first, when the mother\nof Jesus says, “They have no wine,” Christ replies, “Woman, what have I to do with thee?\nMine, hour is not yet come.” And then, having thus spoken, He did as His mother had said;\nan action which needs enquiry no less than the words. Let us then, after calling upon Him\nwho wrought the miracle, proceed to the explanation.", "lang": "greek", "orig": ""}, {"v": 4, "f": "Cyril of Alexandria", "w": "", "t": "Most excellently did the Saviour fashion for us this discourse also. For it behoved Him not to come hastily to action, nor to appear a Worker of miracles as though of His Own accord, but, being called, hardly to come thereto, and to grant the grace to the necessity rather than to the lookers on. But the issue of things longed for seems somehow to be even more grateful, when granted not off-hand to those who ask for it, but through a little delay put forth to most lovely hope. Besides, Christ hereby shows that the deepest honour is due to parents, admitting out of reverence to His Mother what He willed not as yet to do.", "lang": "english", "orig": ""}, {"v": 4, "f": "GK Chesterton", "w": "", "t": "But there is another quality running through all his teachings which seems to me neglected in most modern talk about them as teachings; and that is the persistent suggestion that he has not really come to teach. If there is one incident in the record which affects me personally as grandly and gloriously human, it is the incident of giving wine for the wedding-feast. That is really human in the sense in which a whole crowd of prigs, having the appearance of human beings, can hardly be described as human. It rises superior to all superior persons. It is as human as Herrick and as democratic as Dickens. But even in that story there is something else that has that note of things not fully explained; and in a way here very relevant. I mean the first hesitation, not on any ground touching the nature of the miracle, but on that of the propriety of working any miracles at all, at least at that stage; ‘My time is not yet come.’ What did that mean? At least it certainly meant a general plan or purpose in the mind, with which certain things did or did not fit in. And if we leave out that solitary strategic plan, we not only leave out the point of the story, but the story.", "lang": "english", "orig": ""}, {"v": 4, "f": "Gospel of Peter", "w": "Section V.", "t": "to § 1, 40).\n405 John ii. 2.\n406 John ii. 3.\n407 John ii. 4.\n408 The reading of Cur. and Sin. is not known; but cf. Moesinger, p. 53, and Isho’dad quoted in Harris,\nFragments, etc., p. 46.\n409 John ii. 5.\n410 John ii. 6.\n411 John ii. 7.\n\n\n29 with water. And t", "lang": "greek", "orig": ""}, {"v": 4, "f": "Hippolytus of Rome", "w": "", "t": "When, therefore, he says, the entire Sonship shall have come, and shall be above the conterminous spirit, then the creature will become the object of mercy. For (the creature) groans until now, and is tormented, and waits for the manifestation of the sons of God, in order that all who are men of the Sonship may ascend from thence. When this takes place, God, he says, will bring upon the whole world enormous ignorance, that all things may continue according to nature, and that nothing may inordinately desire anything of the things that are contrary to nature. But (far from it); for all the souls of this quarter of creation, as many as possess the nature of remaining immortal in this (region) only, continue (in it), aware of nothing superior or better (than their present state). And there will not prevail any rumour or knowledge in regions below, concerning beings whose dwelling is placed above, lest subjacent souls should be wrung with torture from longing after impossibilities. (It would be) just as if a fish were to crave to feed on the mountains along with sheep. (For) a wish of this description would, he says, be their destruction. All things, therefore, that abide in (this) quarter are incorruptible, but corruptible if they are disposed to wander and cross over from the things that are according to nature. In this way the Archon of the Hebdomad will know nothing of superjacent entities. For enormous ignorance will lay hold on this one likewise, in order that sorrow, and g", "lang": "english", "orig": ""}, {"v": 4, "f": "Irenaeus", "w": "CAPUT VI.—SECUNDUM GENUS HÆRETICORUM AGGREDITUR, ILLORUM SCILICET QUI EX IMPIA\nDE DEO OMNIUM CONDITORE SENTENTIA, CONTINENTIAM EXERCENT.", "t": "m,\n1640 Col. ii. 11.\n1641 Col. iii. 4, 10.\n1642 1 John. ii. 4.\n1643 [Elucidation VI.]\n1644 1 John ii. 18, 19.\n\n\nbonamque vitæ institutionem. Dominus autem “Non venit ad solvendam legem, sed ad\nimplendam:”1645 ad implendam autem, non ut cui aliquid deesset, sed", "lang": "greek", "orig": ""}, {"v": 4, "f": "Irenaeus", "w": "", "t": "With Him is nothing incomplete or out of due season, just as with the Father there is nothing incongruous. For all these things were foreknown by the Father; but the Son works them out at the proper time in perfect order and sequence. This was the reason why, when Mary was urging [Him] on to [perform] the wonderful miracle of the wine, and was desirous before the time to partake of the cup of emblematic significance, the Lord, checking her untimely haste, said, \"Woman, what have I to do with thee? mine hour is not yet come\"—waiting for that hour which was foreknown by the Father.", "lang": "english", "orig": ""}, {"v": 4, "f": "Irenaeus", "w": "", "t": "With [Jesus], nothing is incomplete or done at the wrong time, just as with the Father there is nothing haphazard. The Lord checked Mary’s untimely haste when she was urging him to perform the wonderful miracle of the wine and wanting him to partake of the cup, which would have so much emblematic significance later on. This is why he said, “Woman, what have I to do with you? My hour is not yet come”—waiting for the hour that was foreknown by the Father.", "lang": "english", "orig": ""}, {"v": 4, "f": "John Chrysostom", "w": "", "t": "The words are not used in this place only, but in others also; for the same Evangelist says, \"They could not lay hands on Him, because His hour was not yet come\" (c. viii. 20); and again, \"No man laid hands on Him, because His hour was not yet come\" (c. vii. 30); and again, \"The hour is come, glorify Thy Son.\" (c. xvii. 1.) What then do the words mean? I have brought together more instances, that I may give one explanation of all. And what is that explanation? Christ did not say, \"Mine hour is not yet come,\" as being subject to the necessity of seasons, or the observance of an \"hour\"; how can He be so, who is Maker of seasons, and Creator of the times and the ages? To what else then did He allude? He desires to show this; that He works all things at their convenient season, not doing all at once; because a kind of confusion and disorder would have ensued, if, instead of working all at their proper seasons, He had mixed all together, His Birth, His Resurrection, and His coming to Judgment.", "lang": "english", "orig": ""}, {"v": 4, "f": "John Chrysostom", "w": "", "t": "And His meaning is, that as yet He was not manifest to the many, nor had He even His whole company of disciples; Andrew followed Him, and next to him Philip, but no one else. And moreover, none of these, not even His mother nor His brethren, knew Him as they ought; for after His many miracles, the Evangelist says of His brethren, \"For neither did His brethren believe in Him.\" (c. vii. 5.) And those at the wedding did not know Him either, for in their need they would certainly have come to and entreated Him. Therefore He saith, \"Mine hour is not yet come\"; that is, \"I am not yet known to the company, nor are they even aware that the wine has failed; let them first be sensible of this. I ought not to have been told it from thee; thou art My mother, and renderest the miracle suspicious. They who wanted the wine should have come and besought Me, not that I need this, but that they might with an entire assent accept the miracle. For one who knows that he is in need, is very grateful when he obtains assistance; but one who has not a sense of his need, will never have a plain and clear sense of the benefit.\"", "lang": "english", "orig": ""}, {"v": 4, "f": "John Chrysostom", "w": "", "t": "Why then after He had said, \"Mine hour is not yet come,\" and given her a denial, did He what His mother desired? Chiefly it was, that they who opposed Him, and thought that He was subject to the \"hour,\" might have sufficient proof that He was subject to no hour; for had He been so, how could He, before the proper \"hour\" was come, have done what He did? And in the next place, He did it to honor His mother, that He might not seem entirely to contradict and shame her that bare Him in the presence of so many; and also, that He might not be thought to want power, for she brought the servants to Him.", "lang": "english", "orig": ""}, {"v": 4, "f": "John Chrysostom", "w": "", "t": "Therefore He answered somewhat vehemently, saying, \"Woman, what have I to do with thee? Mine hour is not yet come.\"", "lang": "english", "orig": ""}, {"v": 4, "f": "John Chrysostom", "w": "", "t": "To prove that He greatly respected His mother, hear Luke relate how He was \"subject to\" His parents (Luke ii. 51), and our own Evangelist declare how He had forethought for her at the very season of the Crucifixion. For where parents cause no impediment or hindrance in things belonging to God, it is our bounden duty to give way to them, and there is great danger in not doing so; but when they require anything unseasonably, and cause hindrance in any spiritual matter, it is unsafe to obey. And therefore He answered thus in this place, and again elsewhere, \"Who is My mother, and who are My brethren?\" (Matt. xii. 48), because they did not yet think rightly of Him; and she, because she had borne Him, claimed, according to the custom of other mothers, to direct Him in all things, when she ought to have reverenced and worshiped Him. This then was the reason why He answered as He did on that occasion. For consider what a thing it was, that when all the people high and low were standing round Him, when the multitude was intent on hearing Him, and His doctrine had begun to be set forth, she should come into the midst and take Him away from the work of exhortation, and converse with Him apart, and not even endure to come within, but draw Him outside merely to herself. This is why He said, \"Who is My mother and My brethren?\" Not to insult her who had borne Him, (away with the thought!) but to procure her the greatest benefit, and not to let her think meanly of Him. For if He cared for o", "lang": "english", "orig": ""}, {"v": 4, "f": "Maximus of Turin", "w": "", "t": "The most blessed Mary said to him, “They have no wine.” Jesus answered as though he were displeased. “Woman,” he said, “is that my concern or yours?” It can hardly be doubted that these were words of displeasure. However, this I think was only because his mother mentioned to him so casually the lack of earthly wine, when he had come to offer the peoples of the whole world the new chalice of eternal salvation. By his reply, “My hour has not yet come,” he was foretelling the most glorious hour of his passion and the wine of our redemption, which would obtain life for all. Mary was asking for a temporal favor, but Christ was preparing joys that would be eternal. Nevertheless, the Lord in his goodness did not refuse this small grace while greater graces awaited.", "lang": "english", "orig": ""}, {"v": 4, "f": "Romanos the Melodist", "w": "", "t": "But Christ seeing His mother saying, “Grant me this request,”\nAt once said to her: “What do you wish, woman, my hour has not come.”\nCertain men made use of this saying as a pretext for impiety;\nThey said that Christ, submitted to necessity,\nThey said that He was a slave to periods of time. …\n\n“Now answer, my child,” said the all-holy mother of Christ,\n“Thou who dost control with measurement the periods of time, how, my son and Lord, dost Thou await a time?\nThou who hast regulated the division of the seasons, how dost thou await a season?\nThou who art the creator of the visible and the invisible,\nThou who, as master, dost day and night regulate\nThe ceaseless revolutions, as Thou dost will them—\nThou who hast defined the years in beautifully ordered cycles—\nHow, then, dost Thou await a time for the miracle which I ask of Thee\nWho hast in wisdom created all things?”\n\n“I knew before you told me, revered Virgin, that the wine was just beginning to give out for them,”\nThe Ineffable and Merciful straightway answered His holy mother.\n“I know all the concerns of your heart which you set in motion in this matter;\nFor within yourself you reasoned as follows:\n‘Necessity now summons my son to a miracle,\nAnd He puts it off under the pretext of “the time.” ’\nHoly mother, learn now the meaning of the delay,\nFor when you know it, I shall grant you this favor,\nI, who in wisdom have created all things.", "lang": "english", "orig": ""}, {"v": 4, "f": "Romanos the Melodist", "w": "", "t": "“At the time when I brought forward Heavens and the Earth and all things from a state of nonexistence,\nI would have been quite able at that time to arrange in order at once all that I had produced;\nBut I introduced a certain well-regulated order.\nCreation was accomplished in six days—\nNot that I did not have the power,\nBut in order that the chorus of angels, seeing what I did, each deed in turn,\nWould deify me, singing a hymn: ‘Glory to Thee, Powerful One,\nWho hast in wisdom created all things.’ …\n“Mark what I say, holy one; for at this time I was willing first\nTo announce to the Israelites and to teach them the hope of faith,\nIn order that in the presence of miracles they might learn thoroughly who has sent me,\nAnd that they might know with certainty the glory of my Father,\nAnd his will, for He desires that in every way\nI be glorified along with Him by all.\nFor what He who engendered me has done, these things I also do,\nSince I am consubstantial with Him and His Spirit,\nI, who have in wisdom created all things.\n“For if they had understood all these things at the time when they saw the awesome miracles,\nThey would understand that I am God before time, even though I have become man.\nBut now, contrary to order, before the teaching, you have asked for miracles;\nAnd it is for this reason that I delayed a short time in answer to you:\nIf I was waiting for the time to perform miracles,\nIt was for this reason alone.\nBut, since it is necessary that parents be honored by their children", "lang": "english", "orig": ""}, {"v": 4, "f": "Theophylact of Ohrid", "w": "", "t": "But He rebukes Her,

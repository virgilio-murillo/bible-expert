ghting against Christ. The Word, when His flesh was\nlifted up, after the manner of the brazen serpent in the wilderness, drew all men to Himself\nfor their eternal salvation.508", "lang": "greek", "orig": ""}, {"v": 19, "f": "1 Clement", "w": "Chapter VI.—God will bestow salvation upon the whole nature of man, consisting\nof body and soul in close union, since the Word took it upon Him, and adorned\nwith the gifts of the Holy Spirit, of whom our bodies are, and are termed, the\ntemples.", "t": "2. Whence also he says, that this handiwork is “the temple of God,” thus declaring:\n“Know ye not that ye are the temple of God, and that the Spirit of God dwelleth in you? If\nany man, therefore, will defile the temple of God, him will God destroy: for the temple of\nGod is holy, which [temple] ye are.”1831 Here he manifestly declares the body to be the\ntemple in which the Spirit dwells. As also the Lord speaks in reference to Himself, “Destroy\nthis temple, and in three days I will raise it up. He spake this, however,” it is said, “of the\ntemple of His body.”1832 And not only does he (the apostle) acknowledge our bodies to be\na temple, but even the temple of Christ, saying thus to the Corinthians, “Know ye not that\nyour bodies are members of Christ? Shall I then take the members of Christ, and make them\nthe members of an harlot?”1833 He speaks these things, not in reference to some other\nspiritual man; for a being of such a nature could have nothing to do with an harlot: but he\ndeclares “our body,” that is, the flesh which continues in sanctity and purity, to be “the\nmembers of Christ;” but that when it becomes one with an harlot, it becomes the members\nof an harlot. And for this reason he said, “If any man defile the temple of God, him will God\ndestroy.” How then is it not the utmost blasphemy to allege, that the temple of God, in which\nthe Spirit of the Father dwells, and the members of Christ, do not partake of salvation, but\nare reduced to perdition? Also, that our bodies a", "lang": "greek", "orig": ""}, {"v": 19, "f": "Ambrose of Milan", "w": "", "t": "It was not the Father who divested himself of the flesh; for not the Father, but, as we read, the Word was made flesh. You see, then, that the Arians, in dividing the Father from the Son, run into danger of saying that the Father endured passion. We, however, can easily show that the words treat of the Son's action, for the Son himself indeed raised his own body again, as he himself said: \"Destroy this temple, and in three days I will raise it up.\" And he himself quickens us together with his body: \"For as the Father raises the dead and quickens them, so also the Son quickens whom he will.\" … He, therefore, who has achieved the work of our resurrection, is plainly pointed out to be truly God.", "lang": "english", "orig": ""}, {"v": 19, "f": "Augustine - City of God", "w": "Tractate LXI.", "t": "3. “Then the disciples looked one on another, doubting of whom He spake.” For while\nthey were imbued with a reverential love to their Master, they were none the less affected\nby human infirmity in their feelings towards each other. Each one’s own conscience was\n1202 1 John ii. 19.\n\n\nknown to himself; but as he was ignorant of his neighbor’s, each one’s self-assurance was\nsuch that each was uncertain of all the others, and all the others were uncertain of that one.", "lang": "latin", "orig": ""}, {"v": 19, "f": "Augustine - City of God", "w": "Tractate LXI.", "t": "each other. Each one’s own conscience was\n1202 1 John ii. 19.\n\n\nknown to himself; but as he was ignorant of his neighbor’s, each one’s self-assurance was\nsuch that each was uncertain of all the others, and all the others were uncertain of that one.", "lang": "latin", "orig": ""}, {"v": 19, "f": "Augustine - Confessions", "w": "Sermon XVII.", "t": "by provided protection for\n2256 Phil. ii. 9.\n2257 John ii. 19.\n2258 John xi. 17.\n2259 Ps. xiv. 1.\n2260 John xi. 43.\n2261 Matt. xvi. 19 and xviii. 18.\n2262 Vid. Serm. 48 (98, Bened.) 6.\n2263 John xi. 44.\n2264 Circumveniat.\n\n\nhimself against his enemies, not thos", "lang": "latin", "orig": ""}, {"v": 19, "f": "Augustine of Hippo", "w": "", "t": "Of Adam then is Christ's flesh: of Adam the temple which the Jews destroyed, and the Lord raised up in three days. For He raised His own flesh: see, that He was thus God equal with the Father. My brethren, the apostle says, \"Who raised Him from the dead.\" Of whom says he this? Of the Father. \"He became,\" saith he, \"obedient unto death, even the death of the cross; wherefore also God raised Him from the dead, and gave Him a name which is above every name.\" He who was raised and exalted is the Lord. Who raised Him? The Father, to whom He said in the psalms, \"Raise me up and I will requite them.\" Hence, the Father raised Him up. Did He not raise Himself? And doeth the Father anything without the Word? What doeth the Father without His only One? For, hear that He also was God. \"Destroy this temple, and in three days I will raise it up.\" Did He say, Destroy the temple, which in three days the Father will raise up? But as when the Father raiseth, the Son also raiseth; so when the Son raiseth, the Father also raiseth: because the Son has said, \"I and the Father are one.\"", "lang": "english", "orig": ""}, {"v": 19, "f": "Chrysostom - Homilies on John", "w": "Homily LXV.", "t": "12.\n2468 Matt. xviii. 3.\n2469 Matt. xix. 29.\n2470 John ii. 19.\n\n\nthe sign of Jonas;”2471and again, “Yet a little while am I with you, and ye shall seek me, and\nshall not find me.”2472", "lang": "greek", "orig": ""}, {"v": 19, "f": "Cyprian", "w": "", "t": "That Christ should be the house and temple of God, and that the old temple should cease, and the new one should begin. In the second book of Kings: \"And the word of the Lord came to Nathan, saying, Go and tell my servant David, Thus saith the Lord, Thou shall not build me an house to dwell in; but it shall be, when thy days shall be fulfilled, and thou shall sleep with thy fathers, I will raise up thy seed after thee, which shall come from thy bowels, and I will make ready his kingdom. He shall build me an house in my name, and I will raise up his throne for ever; and I will be to him for a father, and he shall be to me for a son: and his house shall obtain confidence, and his kingdom for evermore in my sight.\" Also in the Gospel the Lord says: \"There shall not be left in the temple one stone upon another that shall not be thrown down.\" And \"After three days another shall be raised up without hands.\"", "lang": "english", "orig": ""}, {"v": 19, "f": "Cyril of Alexandria", "w": "", "t": "To them who of good purpose ask for good things, God very readily granteth them: but to them who come to Him, tempting Him, not only does He deny their ambition in respect of what they ask, but also charges them with wickedness. Thus the Pharisees demanding a sign in other parts of the Gospels the Saviour convicted saying, An evil and adulterous generation seeketh after a sign, and there shall no sign be given to it, but the sign of the prophet Jonas: for as Jonas was three days and three nights in the whale's belly, so shall the Son of man be three days and three nights in the heart of the earth. What therefore He said to those, this to these too with slight change: for these (as did those) ask, tempting Him. Nor to those who were in such a state of mind would even this sign have been given, but that it was altogether needful for the salvation of us all.\n\nBut we must know that they made this the excuse of their accusation against Him, saying falsely before Pontius Pilate, what they had not heard. For, say they, This Man saith, I am able to destroy the Temple of God. Wherefore of them too did Christ speak in the prophets, False witnesses did rise up: they laid to My charge things that I knew not: and again, For false witnesses are risen up against Me, and such as breathe out cruelty. But He does not urge them to bloodshed saying, Destroy this Temple, but since He knew that they would straightway do it, He indicates expressively what is about to happen.", "lang": "english", "orig": ""}, {"v": 19, "f": "Gospel of Peter", "w": "Section XXXII.", "t": "xi. 16.\n2190 John ii. 17.\n2191 John ii. 18.\n2192 John ii. 19.\n2193 John ii. 20.\n2194 John ii. 21.\n2195 Or, if.\n2196 John ii. 22.\n2197 Mark xii. 41.\n\n\nthrowing in much. 2198And there came a poor widow, and cast in two mites. 2199And Jesus\ncalled his disciples,", "lang": "greek", "orig": ""}, {"v": 19, "f": "Hilary of Poitiers", "w": "", "t": "By the power to take his soul again and to raise the temple up, he declares himself God and the resurrection his own work: yet he refers all to the authority of his Father’s command. This is not contrary to the meaning of the apostle, when he proclaims Christ, the “power of God and the wisdom of God,” thus referring all the magnificence of his work to the glory of the Father. For whatever Christ does, the power and the wisdom of God does.… Christ was raised from the dead by the working of God, for he himself worked the works of God the Father with a nature indistinguishable from God’s. And our faith in the resurrection rests on the God who raised Christ from the dead.", "lang": "english", "orig": ""}, {"v": 19, "f": "Hippolytus", "w": "Chapter XXI.5179 Argument.—That the Same Divine Majesty is Again Confirmed\nin Christ by Other Scriptures.", "t": "And indeed I could set forth the treatment of this subject by all heavenly Scriptures,\nand set in motion, so to speak, a perfect forest of texts concerning that manifestation of the\ndivinity of Christ, except that I have not so much undertaken to speak against this special\nform of heresy, as to expound the rule of truth concerning the person of Christ. Although,\nhowever, I must hasten to other matters, I do not think that I must pass over this point, that\nin the Gospel the Lord declared, by way of signifying His majesty, saying, “Destroy this\ntemple, and in three days I will build it up again.”5180 Or when, in another passage, and on\nanother subject, He declares, “I have power to lay down my life, and again to take it up; for\nthis commandment I have received of my Father.”5181 Now who is it who says that He can\nlay down His life, or can Himself recover His life again, because He has received it of His\nFather? Or who says that He can again resuscitate and rebuild the destroyed temple of His\nbody, except because He is the Word who is from the Father, who is with the Father, “by\nwhom all things were made, and without whom nothing was made;”5182 the imitator5183\nof His Father’s works and powers, “the image of the invisible God;”5184 “who came down\nfrom heaven;”5185 who testified what things he had seen and heard; who “came not to do\nHis own will, but rather to do the will of the Father,”5186 by whom He had been sent for\nthis very purpose, that being made the “Messenger of Great C", "lang": "greek", "orig": ""}, {"v": 19, "f": "Hippolytus of Rome", "w": "", "t": "Now, as our Lord Jesus Christ, who is also God, was prophesied of under the figure of a lion, on account of His royalty and glory, in the same way have the Scriptures also aforetime spoken of Antichrist as a lion, on account of his tyranny and violence. For the deceiver seeks to liken himself in all things to the Son of God. Christ is a lion, so Antichrist is also a lion; Christ is a king, so Antichrist is also a king. The Saviour was manifested as a lamb; so he too, in like manner, will appear as a lamb, though within he is a wolf. The Saviour came into the World in the circumcision, and he will come in the same manner. The Lord sent apostles among all the nations, and he in like manner will send false apostles. The Saviour gathered together the sheep that were scattered abroad, and he in like manner will bring together a people that is scattered abroad. The Lord gave a seal to those who believed on Him, and he will give one like manner. The Saviour appeared in the form of man, and he too will come in the form of a man. The Saviour raised up and showed His holy flesh like a temple, and he will raise a temple of stone in Jerusalem. And his seductive arts we shall exhibit in what follows. But for the present let us turn to the question in hand.", "lang": "english", "orig": ""}, {"v": 19, "f": "Ignatius of Antioch", "w": "", "t": "And again, \"Destroy this temple, and in three days I will raise it up.\" And: \"When He was lifted up from the earth, He drew all things unto Himself.\"", "lang": "english", "orig": ""}, {"v": 19, "f": "Irenaeus", "w": "4. FROM MS. MARKED 2431 IN THE LIBRARY OF THE MOST CHRISTIAN KING.—IBID. P. 1336 A. FROM\nTHE VERY HOLY AND BLESSED CLEMENT, PRESBYTER OF ALEXANDRIA, THE STROMATIST’S BOOK\nON PROVIDENCE.", "t": "m-\n2983 1 Kings viii. 27.\n2984 1 Pet. ii. 5.\n2985 John ii. 19–21.\n\n\nscribed2986 which has no place, which is wholly in all, and in each entire, and the same in\nitself.", "lang": "greek", "orig": ""}, {"v": 19, "f": "Irenaeus", "w": "", "t": "Whence also he says, that this handiwork is \"the temple of God,\" thus declaring: \"Know ye not that ye are the temple of God, and that the Spirit of God dwelleth in you? If any man, therefore, will defile the temple of God, him will God destroy: for the temple of God is holy, which [temple] ye are.\" Here he manifestly declares the body to be the temple in which the Spirit dwells. As also the Lord speaks in reference to Himself, \"Destroy this temple, and in three days I will raise it up. He spake this, however,\" it is said, \"of the temple of His body.\" And not only does he (the apostle) acknowledge our bodies to be a temple, but even the temple of Christ, saying thus to the Corinthians, \"Know ye not that your bodies are members of Christ? Shall I then take the members of Christ, and make them the members of an harlot?\" He speaks these things, not in reference to some other spiritual man; for a being of such a nature could have nothing to do with an harlot: but he declares \"our body,\" that is, the flesh which continues in sanctity and purity, to be \"the members of Christ;\" but that when it becomes one with an harlot, it becomes the members of an harlot. And for this reason he said, \"If any man defile the temple of God, him will God destroy.\" How then is it not the utmost blasphemy to allege, that the temple of God, in which the Spirit of the Father dwells, and the members of Christ, do not partake of salvation, but are reduced to perdition? Also, that our bodies are raised not f", "lang": "english", "orig": ""}, {"v": 19, "f": "John Chrysostom", "w": "", "t": "But why doth He both there, and here, and everywhere, give this for a sign, at one time saying, \"When ye have lifted up the Son of Man, then ye shall know that I Am\"; at another, \"There shall no sign be given you but the sign of the prophet Jonas\"; and again in this place, \"In three days I will raise it up\"? Because what especially showed that He was not a mere man, was His being able to set up a trophy of victory over death, and so quickly to abolish His long enduring tyranny, and conclude that difficult war. Wherefore He saith, \"Then ye shall know.\" \"Then.\" When? When after My Resurrection I shall draw (all) the world to Me, then ye shall know that I did these things as God, and Very Son of God, avenging the insult offered to My Father.", "lang": "english", "orig": ""}, {"v": 19, "f": "Lactantius", "w": "CHAP. XVIII.—OF THE LORD’S PASSION, AND THAT IT WAS FORETOLD.", "t": ", which was at this time governed by Silanus.\n731 John ii. 19, 20. The forty-six years spoken of were not occupied with the rebuilding of the temple, which\nwas completed in nine years, but with the additional works which Herod the Great and his successors were", "lang": "latin", "orig": ""}, {"v": 19, "f": "Lucius Caecilius Firmianus Lactantius", "w": "", "t": "Thus Judas, induced by a bribe, delivered up to the Jews the Son of God. But they took and brought Him before Pontius Pilate, who at that time was administering the province of Syria as governor, and demanded that He should be crucified, though they laid nothing else to His charge except that He said that He was the Son of God, the King of the Jews; also His own saying, \"Destroy this temple, which was forty-six years in building, and in three days I will raise it up again without hands,\"—signifying that His passion would shortly take place, and that He, having been put to death by the Jews, would rise again on the third day. For He Himself was the true temple of God.", "lang": "english", "orig": ""}, {"v": 19, "f": "Lucius Caecilius Firmianus Lactantius", "w": "", "t": "[Christ] meant that his passion would be brief and that when he was put to death … he would raise himself up on the third day. For he himself was the true temple of God.… For when there was no justice on the earth, [God] sent a teacher, a living law, as it were, to establish his name and a new temple, to sow the seeds of true and loving worship throughout the whole earth by his words and example.", "lang": "english", "orig": ""}, {"v": 19, "f": "Origen of Alexandria", "w": "", "t": "It is likely, moreover, that what has been recorded in the Gospels according to Matthew and Mark in the name of the false witness who accuses our Lord Jesus Christ at the end of the Gospel contains a reference to the saying, \"Destroy this temple and I will raise it up in three days.\" For he … was speaking about the temple of his body, but they, supposing that the things said here were said about the temple built from stones, accused him.", "lang": "english", "orig": ""}, {"v": 19, "f": "Origen of Alexandria", "w": "", "t": "Both, however (I mean the temple and Jesus' body), according to one interpretation, appear to me to be a type of the church, in that the church, being called a \"temple,\" is built of living stones, becoming a spiritual house \"for a holy priesthood,\" built \"on the foundation of the apostles and prophets, Christ Jesus being the chief cornerstone.\" And through the saying, \"Now you are the body of Christ and members in part,\" [we know] that even if the harmony of the stones of the temple appear to be destroyed, [or,] as it is written in Psalm 21, all the bones of Christ appear to be scattered in persecutions and afflictions by the plots of those who wage war against the unity of the temple by persecutions—we know that the temple will be raised up and the body will arise on the third day after the day of evil that threatens it and the day of consummation that follows. For the third day will dawn in the new heaven and the new earth, when these bones, the whole house of Israel, shall be raised up on the great day of the Lord, once death has been conquered. Consequently, the resurrection of Christ too, which followed from his passion on the cross, contains the mystery of the resurrection of the whole body of Christ.", "lang": "english", "orig": ""}, {"v": 19, "f": "Pseudo-Clement", "w": "", "t": "And with reference to the body, which by circumscription He consecrated as a hallowed place for Himself upon earth, He said, \"Destroy this temple, and in three days I will raise it up again. The Jews therefore said, In forty-six years was this temple built, and will you raise it up in three days? But He spoke of the temple of His body.\" [John 2:19-21]", "lang": "english", "orig": ""}, {"v": 19, "f": "Socrates", "w": "Chapter 28.—To What Extent History is an Aid.", "t": "44. And even when in the course of an historical narrative former institutions of men\nare described, the history itself is not to be reckoned among human institutions; because\n1815 John. ii. 19.\n1816 Luke iii. 23.\n1817 See above, chap. xvi.\n1818 Augustin himself corrected this mistake. Retractations, ii. 4.\n\n\nthings that are past and gone and cannot be undone are to be reckoned as belonging to the\ncourse of time, of which God is the author and governor. For it is one thing to tell what has\nbeen done, another to show what ought to be done. History narrates what has been done,\nfaithfully and with advantage; but the books of the haruspices, and all writings of the same\nkind, aim at teaching what ought to be done or observed, using the boldness of an adviser,\nnot the fidelity of a narrator.", "lang": "greek", "orig": ""}, {"v": 19, "f": "Socrates", "w": "Chapter 28.—To What Extent History is an Aid.", "t": "e reckoned among human institutions; because\n1815 John. ii. 19.\n1816 Luke iii. 23.\n1817 See above, chap. xvi.\n1818 Augustin himself corrected this mistake. Retractations, ii. 4.\n\n\nthings that are past and gone and cannot be undone are to be reckoned as belonging", "lang": "greek", "orig": ""}, {"v": 19, "f": "Tertullian", "w": "", "t": "As to the word resurrectio, whenever I hear of its impending over a human being, I am forced to inquire what part of him has been destined to fall, since nothing can be expected to rise again, unless it has first been prostrated. It is only the man who is ignorant of the fact that the flesh falls by death, that can fail to discover that it stands erect by means of life. Nature pronounces God's sentence: \"Dust thou art, and unto dust shall thou return.\" Even the man who has not heard the sentence, sees the fact. No death but is the ruin of our limbs. This destiny of the body the Lord also described, when, clothed as He was in its very substance, He said, \"Destroy this temple, and in three days I will raise it up again.\" For He showed to what belongs (the incidents of) being destroyed, thrown down, and kept down-even to that to which it also appertains to be lifted and raised up again; although He was at the same time bearing about with Him \"a soul that was trembling even unto death,\" but which did not fall through death, because even the Scripture informs us that \"He spoke of His body.\" So that it is the flesh which falls by death; and accordingly it derives its name, cadaver, from cadendo. The soul, however, has no trace of a fall in its designation, as indeed there is no mortality in its condition. Nay it is the soul which communicates its ruin to the body when it is breathed out of it, just as it is also destined to raise it up again from the earth when it shall re-enter it", "lang": "english", "orig": ""}, {"v": 19, "f": "Tertullian", "w": "", "t": "\"The Lord for the body:\" yes; for \"the Word was made flesh.\" \"Moreover, God both raised up the Lord, and will raise up us through His own power;\" on account, to wit, of the union of our body with Him. And accordingly, \"Know ye not your bodies (to be) members of Christ?\" because Christ, too, is God's temple. \"Overturn this temple, and I will in three days' space resuscitate it.\" \"Taking away the members of Christ, shall I make (them) members of an harlot? Know ye not, that whoever is agglutinated to an harlot is made one body? (for the two shall be (made) into one flesh): but whoever is agglutinated to the Lord is one spirit? Flee fornication.\" If revocable by pardon, in what sense am I to flee it, to turn adulterer anew? I shall gain nothing if I do flee it: I shall be \"one body,\" to which by communion I shall be agglutinated. \"Every sin which a human being may have committed is extraneous to the body; but whoever fornicateth, sinneth against his own body.\" And, for fear you should fly to that statement for a licence to fornication, on the ground that you will be sinning against a thing which is yours, not the Lord's, he takes you away from yourself, and awards you, according to his previous disposition, to Christ: \"And ye are not your own;\" immediately opposing (thereto), \"for bought ye are with a price\"—the blood, to wit, of the Lord: \"glorify and extol the Lord in your body.\"", "lang": "english", "orig": ""}, {"v": 19, "f": "Theophylact of Ohrid", "w": "", "t": "He answers them in a parable, saying \"Destroy this temple,\" without a doubt speaking of His own body, because in it dwelt the fullness of the Godhead of the Only-Begotten. By the word \"destroy\" He does not encourage them to murder (far be such a thought!), but, knowing their intention to do this, He hints at what will happen without delay.\nLet the Arians also hear how the Lord and destroyer of death says \"I will raise it up.\" He did not say \"the Father will raise it up,\" but \"I\" will raise it up, employing His own power and not needing another's from without.", "lang": "english", "orig": ""}, {"v": 19, "f": "Theophylact of Ohrid", "w": "", "t": "He does not however provoke them to commit murder, by saying, Destroy; but only shows that their intentions were not hidden from Him. Let the Arians observe how our Lord, as the destroyer of death, says, I will raise it up; that is to say, by My own power.", "lang": "english", "orig": ""}, {"v": 19, "f": "Thomas Aquinas", "w": "", "t": "Hence he says, Jesus replied, and he gives the sign for which they asked. He gives them the sign of his future resurrection because this shows most strikingly the power of his divinity. For it is not within the power of mere man to raise himself from the dead. Christ alone, who was free among the dead, did this by the power of his divinity. He shows them a similar sign in Matthew (12:39): \"An evil and adulterous generation asks for a sign. And a sign will not be given it, except the sign of Jonah the prophet.\" And although he gave a hidden and symbolic sign on both occasions, the first was stated more clearly, and the second more obscurely.\n\nWe should note that before the incarnation, God gave a sign of the incarnation to come: \"The Lord himself will give you a sign. A virgin will conceive, and give birth to a son\" (Is 7:14). And in like manner, before the resurrection he gave a sign of the resurrection to come. And he did this because it is especially by these two events that the power of the divinity in Christ is evidenced. For nothing more marvelous could be done than that God become man and that Christ's humanity should become a partaker of divine immortality after his resurrection: \"Christ, rising from the dead, will not die again... his life is life with God\" (Rom 6:9), i.e., in a likeness to God.\n\nWe should note the words Christ used in giving this sign. For Christ calls his body a temple, because a temple is something in which God dwells, according to \"The Lord is in ", "lang": "english", "orig": ""}, {"v": 19, "f": "Victorinus of Pettau", "w": "", "t": "\"And the temple of God was opened which is in heaven.\" The temple opened is a manifestation of our Lord. For the temple of God is the Son, as He Himself says: \"Destroy this temple, and in three days I will raise it up.\" And when the Jews said, \"Forty and six years was this temple in building,\" the evangelist says, \"He spake of the temple of His body.\"\n\n\"And there was seen in His temple the ark of the Lord's testament.\" The preaching of the Gospel and the forgiveness of sins, and all the gifts whatever that came with Him, he says, appeared therein.", "lang": "english", "orig": ""}, {"v": 19, "f": "npnf203", "w": "Counter-statements of Theodoret.", "t": "Against III.—The sense of the terms used is misty and obscure. Who needs to be told\nthat there is no difference between conjunction and concurrence? The concurrence is a\nconcurrence of the separated parts; and the conjunction is a conjunction of the distinguished\n179 Coloss. i. 19, and ii. 9\n180 cf. n. p. 72.\n181 John ii. 19\n\n\nparts. The very clever author of the phrases has laid down things that agree as though they\ndisagreed. It is wrong, he says, to conjoin the hypostases by conjunction; they ought to be\nconjoined by concurrence, and that a natural concurrence. Possibly he states this not\nknowing what he says; if he knows, he blasphemes. Nature has a compulsory force and is\ninvoluntary; as for instance, if I say we are naturally hungry, we do not feel hunger of freewill\nbut of necessity; and assuredly paupers would have left off begging if the power of\nceasing to be hungry had lain in their own will; we are naturally thirsty; we naturally sleep;\nwe naturally breathe; and all these actions, I repeat, belong to the category of the involuntary,\nand he who is no longer capable of them necessarily ceases to exist. If then the concurrence\nin union of the form of God and the form of a servant was natural, then God the Word was\nunited to the form of the servant under the compulsion of necessity, and not because He\nput in force His loving kindness, and the Lawgiver of the Universe will be found to be a\nfollower of the laws of necessity. Not thus have we been taught by the blessed P", "lang": "greek", "orig": ""}, {"v": 19, "f": "npnf203", "w": "Counter-statements of Theodoret.", "t": "79 Coloss. i. 19, and ii. 9\n180 cf. n. p. 72.\n181 John ii. 19\n\n\nparts. The very clever author of the phrases has laid down things that agree as though they\ndisagreed. It is wrong, he says, to conjoin the hypostases by conjunction; they ought to be\nconjoined by", "lang": "greek", "orig": ""}, {"v": 19, "f": "npnf205", "w": "§13. He expounds the passage of the Gospel, “The Father judgeth no man,” and further speaks\nof the assumption of man with body and soul wrought by the Lord, of the transgression\nof Adam, and of death and the resurrection of the dead.", "t": "s on this passage will be found in Book V.\n445 S. John ii. 19\n446 Cf. 2 Cor. vi. 16.\n\n\ncombination a “temple,” of which the “destruction” signifies the dissolution of the soul from\nthe body. And if they allege the passage in the Gospel, “The Word was made flesh", "lang": "greek", "orig": ""}, {"v": 20, "f": "Alcuin of York", "w": "", "t": "Note, that they allude here not to the first temple under Solomon, which was finished in seven years, but to the one rebuilt under Zorobabel. (Ezra 4:5) This was forty-six years building, in consequence of the hindrance raised by the enemies of the work.", "lang": "english", "orig": ""}, {"v": 20, "f": "Augustine of Hippo", "w": "", "t": "But perhaps this is demanded of us, whether the fact that the temple was forty and six years in building may not have in it some mystery. There are, indeed, many things that may be said of this matter; but what may briefly be said, and easily understood, that we say meanwhile. Brethren, we have said yesterday, if I mistake not, that Adam was one man, and is yet the whole human race. For thus we said, if you remember. He was broken, as it were, in pieces; and, being scattered, is now being gathered together, and, as it were, conjoined into one by a spiritual fellowship and concord. And \"the poor that groan,\" as one man, is that same Adam, but in Christ he is being renewed: because an Adam is come without sin, to destroy the sin of Adam in His own flesh, and that Adam might renew to himself the image of God. Of Adam then is Christ's flesh: of Adam the temple which the Jews destroyed, and the Lord raised up in three days.", "lang": "english", "orig": ""}, {"v": 20, "f": "Augustine of Hippo", "w": "", "t": "Now, what does the number Forty-six mean? Meanwhile, how Adam extends over the whole globe, you have already heard explained yesterday, by the four Greek letters of four Greek words. For if thou write the four words, one under the other, that is, the names of the four quarters of the world, of east, west, north, and south, which is the whole globe,-whence the Lord says that He will gather His elect from the four winds when He shall come to judgment;-if, I say, you take these four Greek words, anatole, which is east; dysis, which is west; arctos, which is north; mesembria, which is south; Anatole, Dysis, Arctos, Mesembria,-the first letters of the words make Adam. How, then, do we find there, too, the number forty-six? Because Christ's flesh was of Adam. The Greeks compute numbers by letters. What we make the letter A, they in their tongue put Alpha, and Alpha is called one. And where in numbers they write Beta, which is their b, it is called in numbers two. Where they write Gamma, it is called in their numbers three. Where they write Delta, it is called in their numbers four; and so by means of all the letters they have numbers. The letter we call M, and they call My, signifies forty; for they say My, tessarakonta. Now look at the number which these letters make, and you will find in it that the temple was built in forty-six years. For the word Adam has Alpha, which is one: it has Delta, which is four; there are five for thee: it has Alpha, again, which is one; there are six ", "lang": "english", "orig": ""}, {"v": 20, "f": "Augustine of Hippo", "w": "", "t": "(Tr. x. in Joan c. 11.) The Father also raised Him up again; to Whom He says, Raise Thou me up, and I shall reward them. (Ps. 41:10) But what did the Father do without the Word? As then the Father raised Him up, so did the Son also: even as He saith below, I and My Father are one. John 10:30.\n\n(iv. de Trin. c. 9. [v.]) Or it may be that this number fits in with the perfection of the Lord's Body. For six times forty-six are two hundred and seventy-six days, which make up nine months and six days, the time that our Lord's Body was forming in the womb; as we know by authoritative traditions handed down from our fathers, and preserved by the Church. He was, according to general belief, conceived on the eighth of the Kalends of April, (March 24) the day on which He suffered, and born on the eighth of the Kalends of January. (Dec. 25) The intervening time contains two hundred and seventy-six days, i. e. six multiplied by forty-six.\n\n(b. lxxxiii. Quæst. 2. 5. f.) The process of human conception is said to be this. The first six days produce a substance like milk, which in the following nine is converted into blood; in twelve more is consolidated, in eighteen more is formed into a perfect set of limbs, the growth and enlargement of which fills up the rest of the time till the birth. For six, and nine, and twelve, and eighteen, added together are forty-five, and with the addition of one (which stands for the summing up, all these numbers being collected into one) forty-six. This multi", "lang": "english", "orig": ""}, {"v": 20, "f": "Cyril of Alexandria", "w": "", "t": "They mock at the sign, not understanding the depth of the Mystery, but seize on the disease of their own ignorance, as a reasonable excuse for not obeying Him, and considering the difficulty of the thing, they gave heed rather as to one speaking at random, than to one who was promising ought possible to be fulfilled, that that may be shown to be true that was written of them, Let their eyes be darkened, that they see not, and ever bow Thou down their backs: in order that in a manner ever stooping downwards and inclining to the things alone of the earth, they may receive no sight of the lofty doctrines of piety towards Christ, not as though God Who is loving to man grudged them those things, but rather with even justice was punishing them that committed intolerable transgressions.\n\nFor see how foolishly they insult Him, not sparing their own souls. For our Lord Jesus Christ calls God His Father, saying, Make not My Father's House an House of merchandise. Therefore when they ought now to deem of Him as Son and God, as shining forth from God the Father, they believe Him to be yet bare man and one of us. Therefore they object the time that has been spent in the building of the Temple, saying, Forty and six years was this Temple in building, and wilt Thou rear it up in three days? O drunken with all folly, rightly, I deem, one might say to you, if a wise soul had been implanted in you, if ye believe that your Temple is the House of God, how ought ye not to have held Him to be God ", "lang": "english", "orig": ""}, {"v": 20, "f": "Gospel of Peter", "w": "Section XXXII.", "t": "ii. 17.\n2191 John ii. 18.\n2192 John ii. 19.\n2193 John ii. 20.\n2194 John ii. 21.\n2195 Or, if.\n2196 John ii. 22.\n2197 Mark xii. 41.\n\n\nthrowing in much. 2198And there came a poor widow, and cast in two mites. 2199And Jesus\ncalled his disciples, and said unto them", "lang": "greek", "orig": ""}, {"v": 20, "f": "Gospel of Peter", "w": "22. The Temple of Solomon Did Not Take Forty-Six Years to Build. With Regard\nto that of Ezra We Cannot Tell How Long It Took. Significance of the Number\nForty-Six.", "t": "The Jews therefore said, “Forty and six years was this temple in building,5106 and wilt\nthou raise it up in three days?” How the Jews said that the temple had been forty-six years\nbuilding, we cannot tell, if we adhere to the history. For it is written in the third Book of\nKings,5107 that they prepared the stones and the wood three years, and in the fourth year,\nin the second month,5108 when Solomon was king over Israel, the king commanded, and\nthey brought great precious stones for the foundation of the house, and unhewn stones.\nAnd the sons of Solomon and the sons of Hiram hewed the stones and laid them in the\nfourth year, and they founded the house of the Lord in the month Nisan and the second\nmonth: in the tenth year in the month Baal, which was the eighth month, the house was\nfinished according to the whole count and the whole plan of it. Thus comparing the time\nof its completion with the period of building, the building of it occupies less than eleven\nyears. How, then, do the Jews come to say that the temple was forty-six years in building?\nOne might, indeed, do violence to the words and make out the period of forty-six years at\nall costs, by counting from the time when David, after planning about the building of the\ntemple, said to Nathan the prophet,5109 “Behold I dwell in a house of cedar, and the ark of\nGod dwelleth in the midst of the tent,” for though it is true that he was prevented, as being\na man of blood,5110 from carrying out the building, he seems to have bu", "lang": "greek", "orig": ""}, {"v": 20, "f": "John Chrysostom", "w": "", "t": "But at the time when this was spoken, the Jews were perplexed as to what it might mean, and cast about to discover, saying,\n\n\"Forty and six years was this Temple in building, and wilt thou rear it up in three days?\"\n\n\"Forty and six years,\" they said, referring to the latter building, for the former was finished in twenty years' time.", "lang": "english", "orig": ""}, {"v": 20, "f": "Theophylact of Ohrid", "w": "", "t": "The Jews, thinking that He was speaking of the lifeless temple, laugh at Him. \"How,\" they say, \"do You say that You will raise it up in three days, when it took forty-six years to build?\" One must know that when the temple was first built under Solomon, everything was completed without difficulty in twenty years. But afterwards, when the Jews after the captivity received permission to build the temple, they began to rebuild it in the reign of Cyrus; then, having met with hindrance from envious persons, they continued the construction until the reign of Artaxerxes; and under him, enjoying complete security, they were barely able to finish this work.\nWhen it is said that the Jews during the construction held a spear in one hand and a building tool in the other, they were in such great fear from the neighboring Idumeans, and not from the Persians, for from them, that is from the Persians, as I said, they enjoyed complete safety. Concerning this construction, which took place after the captivity, they say that it lasted forty-six years, since the Jews were being hindered, and therefore they extended it from the reign of Cyrus to Artaxerxes.", "lang": "english", "orig": ""}, {"v": 20, "f": "Theophylact of Ohrid", "w": "", "t": "The Jews, supposing that He spoke of the material temple, scoffed: Then said the Jews, Forty and six years was this temple in building, and will Thou rear it up in three days?", "lang": "english", "orig": ""}, {"v": 20, "f": "Thomas Aquinas", "w": "", "t": "Then when he says, The Jews then retorted, we have the interpretation of the sign he gave. First, the false interpretation of the Jews. Secondly, its true understanding by the apostles (v 21).\n\nThe interpretation of the Jews was false, because they believed that Christ was saying this of the material temple in which he then was; consequently, they answer according to this interpretation and say: This temple took forty-six years to build, i.e., this material temple in which we are standing, and you are going to raise it up again in three days!\n\nThere is a literal objection against this. For the temple in Jerusalem was built by Solomon, and it is recorded in 2 Chronicles (6:1) that it was completed by Solomon in seven years. How then can it be said that this temple took forty-six years to build? I answer that according to some this is not to be understood of the very first temple, which was completed by Solomon in seven years: for that temple built by Solomon was destroyed by Nebuchadnezzar. But it is to be understood of the temple rebuilt under Zerubbabel, after they returned from captivity, as recorded in the book of Ezra (5:2). However, this rebuilding was so hindered and delayed by the frequent attacks of their enemies on all sides, that the temple was not finished until forty-six years had passed.\n\nOr it could be said, according to Origen, that they were speaking of Solomon's temple: and it did take forty-six years to build if the time be reckoned from the day when David f", "lang": "english", "orig": ""}, {"v": 21, "f": "1 Clement", "w": "Chapter VI.—God will bestow salvation upon the whole nature of man, consisting\nof body and soul in close union, since the Word took it upon Him, and adorned\nwith the gifts of the Holy Spirit, of whom our bodies are, and are termed, the\ntemples.", "t": "2. Whence also he says, that this handiwork is “the temple of God,” thus declaring:\n“Know ye not that ye are the temple of God, and that the Spirit of God dwelleth in you? If\nany man, therefore, will defile the temple of God, him will God destroy: for the temple of\nGod is holy, which [temple] ye are.”1831 Here he manifestly declares the body to be the\ntemple in which the Spirit dwells. As also the Lord speaks in reference to Himself, “Destroy\nthis temple, and in three days I will raise it up. He spake this, however,” it is said, “of the\ntemple of His body.”1832 And not only does he (the apostle) acknowledge our bodies to be\na temple, but even the temple of Christ, saying thus to the Corinthians, “Know ye not that\nyour bodies are members of Christ? Shall I then take the members of Christ, and make them\nthe members of an harlot?”1833 He speaks these things, not in reference to some other\nspiritual man; for a being of such a nature could have nothing to do with an harlot: but he\ndeclares “our body,” that is, the flesh which continues in sanctity and purity, to be “the\nmembers of Christ;” but that when it becomes one with an harlot, it becomes the members\nof an harlot. And for this reason he said, “If any man defile the temple of God, him will God\ndestroy.” How then is it not the utmost blasphemy to allege, that the temple of God, in which\nthe Spirit of the Father dwells, and the members of Christ, do not partake of salvation, but\nare reduced to perdition? Also, that our bodies a", "lang": "greek", "orig": ""}, {"v": 21, "f": "Bede", "w": "", "t": "With perfect justice he banished the wicked from the temple, since the temple represented the temple of his body, in which there was no stain of any kind of sin.", "lang": "english", "orig": ""}, {"v": 21, "f": "Cyril of Alexandria", "w": "", "t": "Acceptable to the wise man is the word of wisdom, and the knowledge of discipline abideth more easily with men of understanding, and as in wax not too hard, the impression of seals is well made, so in the more tender hearts of men the Divine Word is readily infixed: wherefore the hard of heart is also called wicked. The disciples then, being of a good disposition, become wise, and ruminate the words of divine Scripture, nourishing themselves to more accurate knowledge, and thence coming firmly to belief. Since the Body of Christ is called a temple also, how is not the Only-Begotten Word Which indwelleth therein, God by Nature, since he that is not God cannot be said to dwell in aTemple? Or let one come forward and say, what saint's body was ever called a temple; but I do not suppose any one can show this. I say then, what we shall find to be true, if we accurately search the Divine Scripture, that to none of the Saints was such honour attached. And indeed the blessed Baptist, albeit he attained unto the height of all virtue, and suffered none to exceed him in piety, was through the madness of Herod beheaded, and yet is no such thing attributed to him. On the contrary, the Evangelist devised a grosser word for his remains, saying this too, as appears to me by an oeconomy, in order that the dignity may be reserved to Christ Alone. For he writes thus; And the blood-shedder to wit, Herod, sent and beheaded John in the prison, and his disciples came and took up his carcase. If the", "lang": "english", "orig": ""}, {"v": 21, "f": "Gospel of Peter", "w": "Section XXXII.", "t": "ii. 18.\n2192 John ii. 19.\n2193 John ii. 20.\n2194 John ii. 21.\n2195 Or, if.\n2196 John ii. 22.\n2197 Mark xii. 41.\n\n\nthrowing in much. 2198And there came a poor widow, and cast in two mites. 2199And Jesus\ncalled his disciples, and said unto them, Verily I say unt", "lang": "greek", "orig": ""}, {"v": 21, "f": "John Chrysostom", "w": "", "t": "Wherefore then did He not resolve the difficulty and say, \"I speak not of that Temple, but of My flesh\"? Why does the Evangelist, writing the Gospel at a later period, interpret the saying, and Jesus keep silence at the time? Why did He so keep silence? Because they would not have received His word; for if not even the disciples were able to understand the saying, much less were the multitudes. \"When,\" saith the Evangelist, \"He was risen from the dead, then they remembered, and believed the Scripture and His word.\" There were two things that hindered them for the time, one the fact of the Resurrection, the other, the greater question whether He was God that dwelt within; of both which things He spake darkly when He said, \"Destroy this Temple, and I will rear it up in three days.\" And this St. Paul declares to be no small proof of His Godhead, when he writes, \"Declared to be the Son of God with power, according to the Spirit of holiness, by the Resurrection from the dead.\"", "lang": "english", "orig": ""}, {"v": 21, "f": "Lucius Caecilius Firmianus Lactantius", "w": "", "t": "[Christ] meant that his passion would be brief and that when he was put to death … he would raise himself up on the third day. For he himself was the true temple of God.… For when there was no justice on the earth, [God] sent a teacher, a living law, as it were, to establish his name and a new temple, to sow the seeds of true and loving worship throughout the whole earth by his words and example.", "lang": "english", "orig": ""}, {"v": 21, "f": "Tertullian", "w": "", "t": "For He showed to what belongs (the incidents of) being destroyed, thrown down, and kept down-even to that to which it also appertains to be lifted and raised up again; although He was at the same time bearing about with Him \"a soul that was trembling even unto death,\" but which did not fall through death, because even the Scripture informs us that \"He spoke of His body.\" So that it is the flesh which falls by death; and accordingly it derives its name, cadaver, from cadendo.", "lang": "english", "orig": ""}, {"v": 21, "f": "Theophylact of Ohrid", "w": "", "t": "Apollinaris attempts to find here a defense for his heresy. Wishing to confirm that the Lord's flesh was without a soul, he says: \"The flesh is called a temple, and a temple is soulless; therefore, it too is soulless.\" Thunder-struck and dizzy fool! You would perhaps make the Lord's flesh into wood and stones as well, since the temple is made of them?! When you hear the Lord's words: \"My soul is now troubled\" (John 12:27) and \"I have power to lay down My soul\" (John 10:18), how do you understand them? If you say that this is spoken not of a rational and intellectual soul, then where will you place the words \"Father! into Your hands I commit My spirit\" (Luke 23:46)? Will you understand even this as referring to an irrational soul? And this: \"You will not leave my soul in Hades\" (Ps. 16:10), how does it seem to you? But perish you along with those who share your opinions.", "lang": "english", "orig": ""}, {"v": 21, "f": "Theophylact of Ohrid", "w": "", "t": "From this Apollinarius draws an heretical inference: and attempts to show that Christ's flesh was inanimate, because the temple was inanimate. In this way you will prove the flesh of Christ to be wood and stone, because the temple is composed of these materials. Now if you refuse to allow what is said, Now is My soul troubled; (John 12:27) and, I have power to lay it (My life) down, (ib. 10:18) to be said of the rational soul, still how will you interpret, Into Thy hands, O Lord, I commend My spirit? (Luke 23:46) you cannot understand this of an irrational soul: or again, the passage, Thou shall not leave My soul in hell. (Ps. 16:11)", "lang": "english", "orig": ""}, {"v": 21, "f": "Thomas Aquinas", "w": "", "t": "Then, the true interpretation of this sign as understood by the apostles is given. First, the way they understood it is given. Secondly, the time when they understood it (v 22).\n\nHe says therefore: The Jews said this out of ignorance. But Christ did not understand it in their way; in fact, he meant the temple of his body, and this is what he says: He was speaking, however, of the temple of his body. We have already explained why the body of Christ could be called a temple.\n\nApollinaris misunderstood this and said that the body of Christ was inanimate matter because the temple was inanimate. He was mistaken in this, for when it is said that the body of Christ is a temple, one is speaking metaphorically. And in this way of speaking a likeness does not exist in all respects, but only in some respect, namely, as to indwelling, which is referred to the nature, as was explained. Further, this is evident from the authority of Sacred Scripture, when Christ himself said: \"I have the power to lay down my life,\" as we read below (10:18).", "lang": "english", "orig": ""}, {"v": 22, "f": "Alcuin of York", "w": "", "t": "For before the resurrection they did not understand the Scriptures, because they had not yet received the Holy Ghost, Who was not yet given, because Jesus was not yet glorified. (John 7:39) But on the day of the resurrection our Lord appeared and opened their meaning to His disciples; that they might understand what was said of Him in the Law and the Prophets. And then they believed the prediction of the Prophets that Christ would rise the third day, and the word which Jesus had spoken to them: Destroy this temple, &c.", "lang": "english", "orig": ""}, {"v": 22, "f": "Gospel of Peter", "w": "Section XXXII.", "t": "John ii. 20.\n2194 John ii. 21.\n2195 Or, if.\n2196 John ii. 22.\n2197 Mark xii. 41.\n\n\nthrowing in much. 2198And there came a poor widow, and cast in two mites. 2199And Jesus\ncalled his disciples, and said unto them, Verily I say unto you, This poor 15 widow cast", "lang": "greek", "orig": ""}, {"v": 22, "f": "Gospel of Peter", "w": "23. The Temple Spoken of by Christ is the Church. Application to the Church of\nthe Statements Regarding the Building of Solomon’s Temple, and the Numbers\nStated in that Narrative.", "t": "“But He spake of the temple of His body.5116 When, therefore, He was raised from the\ndead, His disciples remembered that He said this, and they believed the Scripture and the\nword which Jesus had said.” This refers to the statement that the body of the Son is His\ntemple. It may be asked whether this is to be taken in its plain sense, or whether we should\ntry to connect each statement that is recorded about the temple, with the view we take about\nthe body of Jesus, whether the body which He received from the Virgin, or that body of\nChrist which the Church is said to be, as we are said by the Apostle5117 to be all members\nof His body. One may, on the one hand, suppose it to be hopeless to get everything that is\nsaid about the temple properly connected with the body, in whatever sense the body be\ntaken, and one may have recourse to a simpler explanation, and say that the body (in either\nof these senses) is called the temple, because as the temple had the glory of God dwelling in\nit, so He who was the image and glory of God, the first-born of every creature, could rightly\nbe called, in respect of His body or the Church, the temple containing the image. We, for\nour part, see it to be a hard task to expound every particular of what is said about the temple\nin the third Book of Kings, and far beyond our powers of language, and we defer it in the\nmeantime, as a thing beyond the scale of the present work. We also have a strong conviction\nthat in such matters, which transcend human nat", "lang": "greek", "orig": ""}, {"v": 22, "f": "Gospel of Peter", "w": "27. Of the Belief the Disciples Afterwards Attained in the Words of Jesus.", "t": "“When He was raised from the dead,5136 His disciples remembered that He spake this,\nand they believed the Scripture and the word which Jesus had said.” This tells us that after\nJesus’ resurrection from the dead His disciples saw that what He had said about the temple\nhad a higher application to His passion and His resurrection; they remembered that the\nwords, “In three days I will raise it up,” pointed to the resurrection; “And they believed the\nScripture and the word which Jesus had said.” We are not told that they believed the\nScripture or the word which Jesus said, before. For faith in its full sense is the act of him\nwho accepts with his whole soul what is professed at baptism. As for the higher sense, as\nwe have already spoken of the resurrection from the dead of the whole body of the Lord,\nwe have now to note that the disciples were put in mind by the fulfilment of the Scripture\nwhich when they were in life they had not fully understood; its meaning was now brought\nunder their eyes and made quite clear to them, and they knew of what heavenly things it\nwas the pattern and shadow. Then they believed the Scripture who formerly did not believe\nit, and believed the word of Jesus which, as the speaker means to convey, they had not believed\nbefore the resurrection. For how can any one be said in the full sense to believe the Scripture\nwhen he does not see in it the mind of the Holy Spirit, which God would have us to believe\nrather than the literal meaning? From this point of v", "lang": "greek", "orig": ""}, {"v": 22, "f": "Irenaeus", "w": "EUSEBIUS: ECCLESIASTICAL HISTORY, BOOK. VII. II. 1.", "t": "To James the Just, and John and Peter, the Lord after His resurrection imparted knowledge\n(τὴν γνῶσιν.) These imparted it to the rest of the apostles, and the rest of the apostles\nto the Seventy, of whom Barnabas was one.", "lang": "greek", "orig": ""}, {"v": 22, "f": "John Chrysostom", "w": "", "t": "\"When He was risen from the dead, His disciples remembered that He had said this; and they believed the Scripture, and the word which Jesus had said.\"", "lang": "english", "orig": ""}, {"v": 22, "f": "John Chrysostom", "w": "", "t": "The question still remains, \"How was it that the disciples did not know that He must rise from the dead?\" It was, because they had not been vouchsafed the gift of the Spirit; and therefore, though they constantly heard His discourses concerning the Resurrection, they understood them not, but reasoned with themselves what this might be. For very strange and paradoxical was the assertion that one could raise himself, and would raise himself in such wise. And so Peter was rebuked, when, knowing nothing about the Resurrection, he said, \"Be it far from Thee.\" And Christ did not reveal it clearly to them before the event, that they might not be offended at the very outset, being led to distrust His words on account of the great improbability of the thing, and because they did not yet clearly know Him, who He was. For no one could help believing what was proclaimed aloud by facts, while some would probably disbelieve what was told to them in words. Therefore He at first allowed the meaning of His words to be concealed; but when by their experience He had verified His sayings, He after that gave them understanding of His words, and such gifts of the Spirit that they received them all at once. \"He,\" saith Jesus, \"shall bring all things to your remembrance.\" For they who in a single night cast off all respect for Him, and fled from and denied that they even knew Him, would scarcely have remembered what He had done and said during the whole time, unless they had enjoyed much grace of th", "lang": "english", "orig": ""}, {"v": 22, "f": "John Chrysostom", "w": "", "t": "\"But,\" says one, \"if they were to hear from the Spirit, why needed they to accompany Christ when they would not retain His words?\" Because the Spirit taught them not, but called to their mind what Christ had said before; and it contributes not a little to the glory of Christ, that they were referred to the remembrance of the words He had spoken to them. At the first then it was of the gift of God that the grace of the Spirit lighted upon them so largely and abundantly; but after that, it was of their own virtue that they retained the Gift. For they displayed a shining life, and much wisdom, and great labors, and despised this present life, and thought nothing of earthly things, but were above them all; and like a sort of light-winged eagle, soaring high by their works, reached to heaven itself, and by these possessed the unspeakable grace of the Spirit.", "lang": "english", "orig": ""}, {"v": 22, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And of the things too that He did say, they do not understand many, which He did not make plain before the crucifixion. At least when He was risen from the dead, then and not before they knew some of His sayings.", "lang": "", "orig": ""}, {"v": 22, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "What then may we say? That He should die indeed they knew, albeit they knew not clearly the mystery of the Incarnation.  Neither did they know clearly about the resurrection, neither what He was to achieve; and this was hid from them.", "lang": "", "orig": ""}, {"v": 22, "f": "Tertullian", "w": "Chapter XXXIX.—Additional Evidence Afforded to Us in the Acts of the Apostles.", "t": "The Acts of the Apostles, too, attest7535 the resurrection. Now the apostles had nothing\nelse to do, at least among the Jews, than to explain7536 the Old Testament and confirm7537\nthe New, and above all, to preach God in Christ. Consequently they introduced nothing\nnew concerning the resurrection, besides announcing it to the glory of Christ: in every\nother respect it had been already received in simple and intelligent faith, without any question\nas to what sort of resurrection it was to be, and without encountering any other opponents\nthan the Sadducees. So much easier was it to deny the resurrection altogether, than to understand\nit in an alien sense. You find Paul confessing his faith before the chief priests, under\nthe shelter of the chief captain,7538 among the Sadducees and the Pharisees: “Men and\nbrethren,” he says, “I am a Pharisee, the son of a Pharisee; of the hope and resurrection of\nthe dead I am now called in question by you,”7539—referring, of course, to the nation’s hope;\nin order to avoid, in his present condition, as an apparent transgressor of the law, being\nthought to approach to the Sadducees in opinion on the most important article of the\nfaith—even the resurrection. That belief, therefore, in the resurrection which he would not\nappear to impair, he really confirmed in the opinion of the Pharisees, since he rejected the\nviews of the Sadducees, who denied it. In like manner, before Agrippa also, he says that he\nwas advancing “none other things than those w", "lang": "latin", "orig": ""}, {"v": 22, "f": "Tertullian (cont)", "w": "Chapter XXXI.", "t": "And besides this, one may well wonder how it happened that the disciples—if, as the\ncalumniators of Jesus say, they did not see Him after His resurrection from the dead, and\nwere not persuaded of His divinity—were not afraid to endure the same sufferings with\ntheir Master, and to expose themselves to danger, and to leave their native country to teach,\naccording to the desire of Jesus, the doctrine delivered to them by Him. For I think that no\none who candidly examines the facts would say that these men devoted themselves to a life\nof danger for the sake of the doctrine of Jesus, without profound belief which He had wrought\nin their minds of its truth, not only teaching them to conform to His precepts, but others\nalso, and to conform, moreover, when manifest destruction to life impended over him who\nventured to introduce these new opinions into all places and before all audiences, and who\ncould retain as his friend no human being who adhered to the former opinions and usages.\nFor did not the disciples of Jesus see, when they ventured to prove not only to the Jews from\ntheir prophetic Scriptures that this is He who was spoken of by the prophets, but also to the\nother heathen nations, that He who was crucified yesterday or the day before underwent\nthis death voluntarily on behalf of the human race,—that this was analogous to the case of\nthose who have died for their country in order to remove pestilence, or barrenness, or\ntempests? For it is probable that there is in the nature ", "lang": "latin", "orig": ""}, {"v": 22, "f": "Theodore of Mopsuestia", "w": "", "t": "Even though it is said that the Father raises Christ, the meaning of this expression is not dubious. The unity that is between them both in all operations causes both Father and Son to be attributed with equal rights.", "lang": "english", "orig": ""}, {"v": 22, "f": "Theophylact of Ohrid", "w": "", "t": "And it is not surprising that the Jews did not understand the words of Jesus, nor did the disciples. For them there were two greatest difficulties: one — that the matter of the resurrection is very hard to comprehend, all the more so since it was entirely unknown to them; the other — that He who lives in the body is God. However, after the resurrection the disciples understood and believed the Scripture. Which Scripture? Both every Scripture that foretells the resurrection, and, as the clearest, this one: \"You will not leave my soul in Hades\" (Ps. 16:10), and this one: \"The Lord desires to cleanse him of his wound and to show him light\" (Isa. 53:11). For these passages of Scripture very clearly foretell the resurrection.", "lang": "english", "orig": ""}, {"v": 22, "f": "Thomas Aquinas", "w": "", "t": "The time when the apostles acquired this true understanding is then shown by the Evangelist when he says, When, therefore, he had risen from the dead, his disciples recalled that he had said this. Prior to the resurrection it was difficult to understand this. First, because this statement asserted that the true divinity was in the body of Christ; otherwise it could not be called a temple. And to understand this at that time was above human ability. Secondly, because in this statement mention is made of the passion and resurrection, when he says, I will raise it up again; and this is something none of the disciples had heard mentioned before. Consequently, when Christ spoke of his resurrection and passion to the apostles, Peter was scandalized when he heard it, saying, \"God forbid, Lord\" (Mt 16:22). But after the resurrection, when they now clearly understood that Christ was God, through what he had shown in regard to his passion and resurrection, and when they had learned of the mystery of his resurrection, his disciples recalled that he had said this of his body, and they then believed the Scriptures, i.e., the prophets: \"He will revive us after two days; on the third day he will raise us up\" (Hos 6:3), and \"Jonah was in the belly of the fish three days and three nights\" (Jon 2:1). So it is that on the very day of the resurrection he opened their understanding so that they might understand the Scriptures and the statement Jesus had made, namely, Destroy this temple, and in t", "lang": "english", "orig": ""}, {"v": 22, "f": "npnf209", "w": "Chapter XXVI.—Concerning the Antichrist2705.", "t": "First, therefore, it is necessary that the Gospel should be preached among all nations2716:\nAnd then shall that wicked one be revealed, even him whose coming is after the working of\n2705 See the note in Migne.\n2706 1 St. John ii. 22.\n2707 Iren., bk. v. ch. 25; Greg. Naz., Orat. 47.\n2708 St. Matt. xxiv. 14.\n2709 St. John v. 43.\n2710 2 Thess. ii. 10, 11, 12.\n2711 Chrys., Hom. 4 in Epist. 2 Thess.\n2712 Dan. xi. 37.\n2713 2 Thess. ii. 3, 4.\n2714 Cyril of Jerusalem, Cat. 15.\n2715 Iren., Cyril Hieros., Catech. 15; Greg. Naz. loc. cit.\n2716 St. Matt. xxv. 14.\n\n\nSatan with all power and signs and lying wonders2717, with all deceivableness of unrighteousness\nin them that perish, whom the Lord shall consume with the word of His mouth and shall\ndestroy with the brightness of His coming2718. The devil himself2719, therefore does not become\nman in the way that the Lord was made man. God forbid! but he becomes man as the offspring\nof fornication and receiveth all the energy of Satan. For God, foreknowing the\nstrangeness of the choice that he would make, allows the devil to take up his abode in him2720.", "lang": "greek", "orig": ""}, {"v": 22, "f": "npnf209", "w": "Chapter XXVI.—Concerning the Antichrist2705.", "t": "working of\n2705 See the note in Migne.\n2706 1 St. John ii. 22.\n2707 Iren., bk. v. ch. 25; Greg. Naz., Orat. 47.\n2708 St. Matt. xxiv. 14.\n2709 St. John v. 43.\n2710 2 Thess. ii. 10, 11, 12.\n2711 Chrys., Hom. 4 in Epist. 2 Thess.\n2712 Dan. xi. 37.\n2713 2 Thess. ii", "lang": "greek", "orig": ""}, {"v": 23, "f": "1 Clement", "w": "Chapter XXII.—The thirty Æons are not typified by the fact that Christ was\nbaptized in His thirtieth year: He did not suffer in the twelfth month after His\nbaptism, but was more than fifty years old when He died.", "t": "ed all that multitude with\n477 Rom. viii. 36.\n478 John ii. 23.\n479 John iv. 50.\n480 John v. 1, etc. It is well known that, to fix what is meant by the ???t?, referred to i", "lang": "greek", "orig": ""}, {"v": 23, "f": "Augustine of Hippo", "w": "", "t": "Behold, you have heard that when our Lord Jesus Christ \"was in Jerusalem at the Passover, on the feast day, many believed in His name, seeing the signs which He did.\" \"Many believed in His name;\" and what follows? \"But Jesus did not trust Himself to them.\" Now what does this mean, \"They believed,\" or trusted, \"in His name\"; and yet \"Jesus did not trust Himself to them\"? Was it, perhaps, that they had not believed on Him, but were feigning to have believed, and that therefore Jesus did not trust Himself to them? But the evangelist would not have said, \"Many believed in His name,\" if he were not giving a true testimony to them. A great thing, then, it is, and a wonderful thing: men believe on Christ, and Christ trusts not Himself to men.", "lang": "english", "orig": ""}, {"v": 23, "f": "Augustine of Hippo", "w": "", "t": "Why, then, is it that they believed in His name, and yet Jesus did not trust Himself to them? Let us see what follows. \"And there was a man of the Pharisees, Nicodemus by name, a ruler of the Jews: the same came to Him by night, and said unto Him, Rabbi, we know that Thou art a teacher come from God; for no man can do these signs which Thou doest, except God be with him.\" This Nicodemus, then, was of those who had believed in His name, as they saw the signs and prodigies which He did. \"Jesus answered and said unto him, Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God.\" Therefore to them who have been born again does Jesus trust Himself. Behold, those men had believed on Him, and yet Jesus trusted not Himself to them. Such are all catechumens: already they believe in the name of Christ, but Jesus does not trust Himself to them. Give good heed, my beloved, and understand. If we say to a catechumen, Dost thou believe on Christ, he answers, I believe, and signs himself; already he bears the cross of Christ on his forehead, and is not ashamed of the cross of his Lord. Behold, he has believed in His name. Let us ask him, Dost thou eat the flesh of the Son of man, and drink the blood of the Son of man? He knows not what we say, because Jesus has not trusted Himself to him.", "lang": "english", "orig": ""}, {"v": 23, "f": "Augustine of Hippo", "w": "", "t": "(Tr. xi. c. 2. 3) What meaneth this, Many believed in His Name—but Jesus did not commit Himself unto them? Was it that they did not believe in Him, but only pretended that they did? In that case the Evangelist would not have said, Many believed in His Name. Wonderful this, and strange, that men should trust Christ, and Christ trusts not Himself to men; especially considering that He was the Son of God, and suffered voluntarily, or else need not have suffered at all. Yet such are all catechumens. If we say to a catechumen, Believest thou in Christ? he answers, I do believe, and crosses himself. If we ask him, Dost thou eat the flesh of the Son of man? he knows not what we sayk, for Jesus has not committed Himself to him.", "lang": "english", "orig": ""}, {"v": 23, "f": "Bede", "w": "", "t": "(in loc.) The Evangelist has related above what our Lord did on his way to Jerusalem; now He relates how others were affected towards Him at Jerusalem; Now when He was in Jerusalem at the Passover, in the feast day, many believed in His Name, when they saw the miracles which He did.", "lang": "english", "orig": ""}, {"v": 23, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Homily XXIV.", "t": "“Now when He was in Jerusalem at the Passover, in the feast, many believed on Him.”", "lang": "greek", "orig": ""}, {"v": 23, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Homily XXIV.", "t": "“When He was in Jerusalem, at the Passover, in the feast, many believed on Him,612\nwhen they saw the miracles which He did.”", "lang": "greek", "orig": ""}, {"v": 23, "f": "Cyril of Alexandria", "w": "", "t": "Christ ceaseth not from saving and helping. For some He leads to Himself by wise words, the rest startling by God-befitting Power too, He taketh in His net to the faith, by the things which they see Him work persuaded to confess, that the Artificer of these so great wonders is of a truth God.", "lang": "english", "orig": ""}, {"v": 23, "f": "Gospel of Peter", "w": "Section XV.", "t": "ou. 1105I say unto you, that for Sodom there\n1087 John ii. 23b.\n1088 John ii. 24.\n1089 The meaning is not apparent.\n1090 John ii. 25.\n1091 Luke x. 1.\n1092 Luke x. 2.\n1093 Luke x. 3.\n1094 Luke x. 4.\n1095 Luk", "lang": "greek", "orig": ""}, {"v": 23, "f": "Gospel of Peter", "w": "30. How Jesus Knew the Powers, Better or Worse, Which Reside in Man.", "t": "It may also be asked what signs those many saw Him do who believed on Him, for it is\nnot recorded that He did any signs at Jerusalem, though some may have been done which\nare not recorded. One may, however, consider if what He did may be called signs, when\nHe made a scourge of small cords, and cast them all out of the temple, and the sheep, and\nthe oxen, and poured out the changers’ money, and overthrew the tables. As for those who\nsuppose that it was only about men that He had no need of witnesses, it has to be said that\nthe Evangelist attributes to Him two things, that He knew all beings, and that He had no\nneed that any one should testify of man. If He knew all beings, then He knew not only men\nbut the beings above men, all beings who are without such bodies as ours; and He knew\nwhat was in man, since He was greater than those who reproved and judged by prophesying,\nand who brought to the light the secret things of the hearts of those whom the Spirit suggested\nto them to be thus dealt with. The words, “He knew what was in man,” could also be taken\nas referring to the powers, better or worse, which work in men. For if any one gives place\nto the devil, Satan enters into him; thus did Judas give place, and thus did the devil put it in\nhis heart to betray Jesus, and “after the sop,” therefore, “the devil entered into him.”5148\nBut if any one gives place to God, he becomes blessed; for blessed is the man whose help is\nfrom God, and the ascent is in his heart from God.5149 Thou ", "lang": "greek", "orig": ""}, {"v": 23, "f": "Irenaeus", "w": "", "t": "But it is greatly to be wondered at, how it has come to pass that, while affirming that they have found out the mysteries of God, they have not examined the Gospels to ascertain how often after His baptism the Lord went up, at the time of the passover, to Jerusalem, in accordance with what was the practice of the Jews from every land, and every year, that they should assemble at this period in Jerusalem, and there celebrate the feast of the passover. First of all, after He had made the water wine at Cana of Galilee, He went up to the festival day of the passover, on which occasion it is written, \"For many believed in Him, when they saw the signs which He did,\" as John the disciple of the Lord records. Then, again, withdrawing Himself [from Judaea], He is found in Samaria; on which occasion, too, He conversed with the Samaritan woman, and while at a distance, cured the son of the centurion by a word, saying, \"Go thy way, thy son liveth.\" Afterwards He went up, the second time, to observe the festival day of the passover in Jerusalem; on which occasion He cured the paralytic man, who had lain beside the pool thirty-eight years, bidding him rise, take up his couch, and depart. Again, withdrawing from thence to the other side of the sea of Tiberias, He there seeing a great crowd had followed Him, fed all that multitude with five loaves of bread, and twelve baskets of fragments remained over and above. Then, when He had raised Lazarus from the dead, and plots were formed against H", "lang": "english", "orig": ""}, {"v": 23, "f": "John Chrysostom", "w": "", "t": "Of the men of that time some clung to their error, others laid hold on the truth, while of these last, some having retained it for a little while again fell off from it. Alluding to these, Christ compared them to seeds not deeply sown, but having their roots upon the surface of the earth; and He said that they should quickly perish. And these the Evangelist has here pointed out to us, saying, \"When He was in Jerusalem, at the Passover, in the feast, many believed on Him, when they saw the miracles which He did.\" \"But Jesus did not commit Himself unto them.\"\n\nFor they were the more perfect among His disciples, who came to Him not only because of His miracles, but through His teaching also. The grosser sort the miracles attracted, but the better reasoners His prophecies and doctrines; and so they who were taken by His teaching were more steadfast than those attracted by His miracles. And Christ also called them \"blessed,\" saying, \"Blessed are they that have not seen, and yet have believed.\" But that these here mentioned were not real disciples, the following passage shows, for it saith, \"Jesus did not commit Himself unto them.\" Wherefore? \"Because He knew all things,\" \"And needed not that any should testify of man, for He knew what was in man.\"\n\nThe meaning is of this kind. \"He who dwells in men's hearts, and enters into their thoughts, took no heed of outward words; and knowing well that their warmth was but for a season, He placed not confidence in them as in perfect disciple", "lang": "english", "orig": ""}, {"v": 23, "f": "Origen of Alexandria", "w": "", "t": "(t. x. c. 27) But (in the mystical interpretation) we shall attain to the full measure of faith, at the great resurrection of the whole body of Jesus, i. e. His Church; inasmuch as the faith which is from sight, is very different from that which seeth as through a glass darkly.\n\n(tom. x. c. 30) But how was it that many believed on Him from seeing His miracles? for he seems to have performed no supernatural works at Jerusalem, except we suppose Scripture to have passed them over. May not however the act of His making a scourge of small cords, and driving all out of the temple, be reckoned a miracle?", "lang": "english", "orig": ""}, {"v": 23, "f": "Theophylact of Ohrid", "w": "", "t": "When Jesus was at the feast, some apparently believed in His name; but their faith was unsteady. For, attending to Christ for a time not as God, but as a God-bearing man, they again fell away even from this most insignificant faith. And that they were such is evident from what follows below.", "lang": "english", "orig": ""}, {"v": 23, "f": "Thomas Aquinas", "w": "", "t": "Then he sets forth the fruit which resulted from the signs, namely, the conversion of certain believers. Concerning this he does three things. First, he mentions those who believed on account of the miracles. Secondly, he shows the attitude of Christ to them (v 24). Thirdly, he gives the reason for this (v 25).\n\nThe fruit which developed from the signs of Jesus was abundant, because many believed and were converted to him; and this is what he says, While he was in Jerusalem during the Passover feast, many people, seeing the signs he was working, believed in his name, i.e., in him.\n\nNote that they believed in two ways: some on account of the miracles they saw, and some on account of the revelation and prophecy of hidden things. Now those who believe on account of doctrine are more commendable, because they are more spiritual than those who believe on account of signs, which are grosser and on the level of sense. Those who were converted are shown to be more on the level of sense by the fact that they did not believe on account of the doctrine, as the disciples did, but seeing the signs he was working: \"Prophecies are for those who believe\" (1 Cor 14:22).\n\nOne might ask which signs worked by Jesus they saw, for we do not read of any sign worked by him in Jerusalem at that time. According to Origen, there are two answers to this. First, Jesus did work many miracles there at that time, which are not recorded here; for the Evangelist purposely omitted many of Christ's miracles, si", "lang": "english", "orig": ""}, {"v": 23, "f": "npnf210", "w": "CHAPTER X.", "t": "se no valid baptism.\n1895 S. John xii. 45.\n1896 1 John ii. 23.\n1897 S. John vii. 28.\n1898 S. John viii. 25.\n1899 S. John xii. 46.\n\n\nanother place again: “For this is the will of My Father that sent Me, that every one that seeth\nthe Son, and believeth on Him, ma", "lang": "greek", "orig": ""}, {"v": 24, "f": "Augustine - City of God", "w": "Tractate XII.", "t": "3. It was in answer to Nicodemus, who was of them that had believed on Jesus, that it\nwas said, And Jesus did not trust Himself to them. To certain men, indeed, He did not trust\nHimself, though they had already believed on Him. Thus it is written, “Many believed in\nHis name, seeing the signs which He did. But Jesus did not trust Himself to them. For He\nneeded not that any should testify of man; for Himself knew what was in man.” Behold,\nthey already believed on Jesus, and yet Jesus did not trust Himself to them. Why? because\nthey were not yet born again of water and of the Spirit. From this have we ex horted and do\nexhort our brethren the catechumens. For if you ask them, they ha

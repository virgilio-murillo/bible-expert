σίν σε καὶ ⸀ἀποθλίβουσιν."}}, {"v": 21, "ref": "Luke 8:47", "rel": "cross-reference", "text": {"es": "Entonces, como la mujer vió que no se había ocultado, vino temblando, y postrándose delante de él declaróle delante de todo el pueblo la causa por qué le había tocado, y cómo luego había sido sana.", "gr": "ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα."}}, {"v": 21, "ref": "Mark 5:26", "rel": "cross-reference", "text": {"es": "Y había sufrido mucho de muchos médicos, y había gastado todo lo que tenía, y nada había aprovechado, antes le iba peor,", "gr": "καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,"}}, {"v": 21, "ref": "Mark 5:33", "rel": "cross-reference", "text": {"es": "Entonces la mujer, temiendo y temblando, sabiendo lo que en sí había sido hecho, vino y se postró delante de él, y le dijo toda la verdad.", "gr": "ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν."}}, {"v": 27, "ref": "Luke 18:38", "rel": "cross-reference", "text": {"es": "Entonces dió voces, diciendo: Jesús, Hijo de David, ten misericordia de mí.", "gr": "καὶ ἐβόησεν λέγων· Ἰησοῦ υἱὲ Δαυίδ, ἐλέησόν με."}}, {"v": 27, "ref": "Luke 18:39", "rel": "cross-reference", "text": {"es": "Y los que iban delante, le reñían que callase; mas él clamaba mucho más: Hijo de David, ten misericordia de mí.", "gr": "καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με."}}, {"v": 27, "ref": "Mark 10:46", "rel": "cross-reference", "text": {"es": "Entonces vienen á Jericó: y saliendo él de Jericó y sus discípulos y una gran compañía, Bartimeo el ciego, hijo de Timeo, estaba sentado junto al camino mendigando.", "gr": "Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃."}}, {"v": 27, "ref": "Mark 10:48", "rel": "cross-reference", "text": {"es": "Y muchos le reñían, que callase: mas él daba mayores voces: Hijo de David, ten misericordia de mí.", "gr": "καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με."}}, {"v": 27, "ref": "Matthew 11:5", "rel": "cross-reference", "text": {"es": "Los ciegos ven, y los cojos andan; los leprosos son limpiados, y los sordos oyen; los muertos son resucitados, y á los pobres es anunciado el evangelio.", "gr": "τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·"}}, {"v": 27, "ref": "Matthew 15:22", "rel": "cross-reference", "text": {"es": "Y he aquí una mujer Cananea, que había salido de aquellos términos, clamaba, diciéndole: Señor, Hijo de David, ten misericordia de mí; mi hija es malamente atormentada del demonio.", "gr": "καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται."}}, {"v": 27, "ref": "Matthew 17:15", "rel": "cross-reference", "text": {"es": "Y diciendo: Señor, ten misericordia de mi hijo, que es lunático, y padece malamente; porque muchas veces cae en el fuego, y muchas en el agua.", "gr": "καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ."}}, {"v": 27, "ref": "Matthew 20:30", "rel": "cross-reference", "text": {"es": "Y he aquí dos ciegos sentados junto al camino, como oyeron que Jesús pasaba, clamaron, diciendo: Señor, Hijo de David, ten misericordia de nosotros.", "gr": "καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ."}}, {"v": 28, "ref": "Mark 9:23", "rel": "cross-reference", "text": {"es": "Y Jesús le dijo: Si puedes creer, al que cree todo es posible.", "gr": "ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι."}}, {"v": 28, "ref": "Mark 9:24", "rel": "cross-reference", "text": {"es": "Y luego el padre del muchacho dijo clamando: Creo, ayuda mi incredulidad.", "gr": "⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ."}}, {"v": 29, "ref": "Mark 10:52", "rel": "cross-reference", "text": {"es": "Y Jesús le dijo: Ve, tu fe te ha salvado. Y luego cobró la vista, y seguía á Jesús en el camino.", "gr": "⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ."}}, {"v": 29, "ref": "Matthew 15:28", "rel": "cross-reference", "text": {"es": "Entonces respondiendo Jesús, dijo: Oh mujer, grande es tu fe; sea hecho contigo como quieres. Y fué sana su hija desde aquella hora.", "gr": "τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης."}}, {"v": 29, "ref": "Matthew 8:13", "rel": "cross-reference", "text": {"es": "Entonces Jesús dijo al centurión: Ve, y como creiste te sea hecho. Y su mozo fué sano en el mismo momento.", "gr": "καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ."}}, {"v": 29, "ref": "Matthew 9:22", "rel": "cross-reference", "text": {"es": "Mas Jesús volviéndose, y mirándola, dijo: Confía, hija, tu fe te ha salvado. Y la mujer fué salva desde aquella hora.", "gr": "ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης."}}, {"v": 34, "ref": "Luke 11:15", "rel": "cross-reference", "text": {"es": "Mas algunos de ellos decían: En Beelzebub, príncipe de los demonios, echa fuera los demonios.", "gr": "τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·"}}, {"v": 34, "ref": "Mark 3:22", "rel": "cross-reference", "text": {"es": "Y los escribas que habían venido de Jerusalem, decían que tenía á Beelzebub, y que por el príncipe de los demonios echaba fuera los demonios.", "gr": "καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια."}}, {"v": 35, "ref": "Acts 10:38", "rel": "cross-reference", "text": {"es": "Cuanto á Jesús de Nazaret; cómo le ungió Dios de Espíritu Santo y de potencia; el cual anduvo haciendo bienes, y sanando á todos los oprimidos del diablo; porque Dios era con él.", "gr": "Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·"}}, {"v": 35, "ref": "Mark 6:56", "rel": "cross-reference", "text": {"es": "Y donde quiera que entraba, en aldeas, ó ciudades, ó heredades, ponían en las calles á los que estaban enfermos, y le rogaban que tocasen siquiera el borde de su vestido; y todos los que le tocaban quedaban sanos.", "gr": "καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο."}}, {"v": 35, "ref": "Matthew 4:23", "rel": "cross-reference", "text": {"es": "Y rodeó Jesús toda Galilea, enseñando en las sinagogas de ellos, y predicando el evangelio del reino, y sanando toda enfermedad y toda dolencia en el pueblo.", "gr": "Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ."}}, {"v": 35, "ref": "Matthew 4:24", "rel": "cross-reference", "text": {"es": "Y corría su fama por toda la Siria; y le trajeron todos los que tenían mal: los tomados de diversas enfermedades y tormentos, y los endemoniados, y lunáticos, y paralíticos, y los sanó.", "gr": "καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς."}}, {"v": 36, "ref": "Ezekiel 34:3", "rel": "cross-reference", "text": {"es": "Coméis la leche, y os vestís de la lana: la gruesa degolláis, no apacentáis las ovejas.", "gr": ""}}, {"v": 36, "ref": "Ezekiel 34:6", "rel": "cross-reference", "text": {"es": "Y anduvieron perdidas mis ovejas por todos los montes, y en todo collado alto: y en toda la haz de la tierra fueron derramadas mis ovejas, y no hubo quien buscase, ni quien requiriese.", "gr": ""}}, {"v": 36, "ref": "Jeremiah 50:6", "rel": "cross-reference", "text": {"es": "Ovejas perdidas fueron mi pueblo: sus pastores las hicieron errar, por los montes las descarriaron: anduvieron de monte en collado, olvidáronse de sus majadas.", "gr": ""}}, {"v": 36, "ref": "Mark 6:34", "rel": "cross-reference", "text": {"es": "Y saliendo Jesús vió grande multitud, y tuvo compasión de ellos, porque eran como ovejas que no tenían pastor; y les comenzó á enseñar muchas cosas.", "gr": "καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά."}}, {"v": 36, "ref": "Matthew 14:14", "rel": "cross-reference", "text": {"es": "Y saliendo Jesús, vió un gran gentío, y tuvo compasión de ellos, y sanó á los que de ellos había enfermos.", "gr": "καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν."}}, {"v": 36, "ref": "Numbers 27:17", "rel": "cross-reference", "text": {"es": "Que salga delante de ellos, y que entre delante de ellos, que los saque y los introduzca; porque la congregación de Jehová no sea como ovejas sin pastor.", "gr": ""}}, {"v": 37, "ref": "1 Corinthians 3:9", "rel": "cross-reference", "text": {"es": "Porque nosotros, coadjutores somos de Dios; y vosotros labranza de Dios sois, edificio de Dios sois.", "gr": "θεοῦ γάρ ἐσμεν συνεργοί· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε."}}, {"v": 37, "ref": "1 Thessalonians 5:12", "rel": "cross-reference", "text": {"es": "Y os rogamos, hermanos, que reconozcáis á los que trabajan entre vosotros, y os presiden en el Señor, y os amonestan:", "gr": "Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,"}}, {"v": 37, "ref": "1 Thessalonians 5:13", "rel": "cross-reference", "text": {"es": "Y que los tengáis en mucha estima por amor de su obra. Tened paz los unos con los otros.", "gr": "καὶ ἡγεῖσθαι αὐτοὺς ⸀ὑπερεκπερισσοῦ ἐν ἀγάπῃ διὰ τὸ ἔργον αὐτῶν. εἰρηνεύετε ἐν ⸀ἑαυτοῖς."}}, {"v": 37, "ref": "1 Timothy 5:17", "rel": "cross-reference", "text": {"es": "Los ancianos que gobiernan bien, sean tenidos por dignos de doblada honra; mayormente los que trabajan en predicar y enseñar.", "gr": "Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·"}}, {"v": 37, "ref": "2 Corinthians 6:1", "rel": "cross-reference", "text": {"es": "Y ASI nosotros, como ayudadores juntamente con él, os exhortamos también á que no recibáis en vano la gracia de Dios,", "gr": "Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·"}}, {"v": 37, "ref": "Acts 16:9", "rel": "cross-reference", "text": {"es": "Y fué mostrada á Pablo de noche una visión: Un varón Macedonio se puso delante, rogándole, y diciendo: Pasa á Macedonia, y ayúdanos.", "gr": "καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν."}}, {"v": 37, "ref": "Acts 18:10", "rel": "cross-reference", "text": {"es": "Porque yo estoy contigo, y ninguno te podrá hacer mal; porque yo tengo mucho pueblo en esta ciudad.", "gr": "διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ."}}, {"v": 37, "ref": "Colossians 4:11", "rel": "cross-reference", "text": {"es": "Y Jesús, el que se llama Justo; los cuales son de la circuncisión: éstos solos son los que me ayudan en el reino d ne", "V-RPP-NSN": "Verb, peRfect, Passive, Participle, Nominative, Singular, Neuter", "V-RPP-NSN-ATT": "Verb, peRfect, Passive, Participle, Nominative, Singular, Neuter, ATTic form", "V-RPP-VPM": "Verb, peRfect, Passive, Participle, Vocative, Plural, Masculine", "V-RPP-VSF": "Verb, peRfect, Passive, Participle, Vocative, Singular, Feminine", "V-RPP-VSM": "Verb, peRfect, Passive, Participle, Vocative, Singular, Masculine", "V-XXM-2P": "Verb, no tense stated (adverbial imperative), no voice stated, iMperative, second, Plural", "V-XXM-2S": "Verb, no tense stated (adverbial imperative), no voice stated, iMperative, second, Singular", "X-APF": "indefinite pronoun, Accusative, Plural, Feminine", "X-APM": "indefinite pronoun, Accusative, Plural, Masculine", "X-APN": "indefinite pronoun, Accusative, Plural, Neuter", "X-ASF": "indefinite pronoun, Accusative, Singular, Feminine", "X-ASM": "indefinite pronoun, Accusative, Singular, Masculine", "X-ASN": "indefinite pronoun, Accusative, Singular, Neuter", "X-DPM": "indefinite pronoun, Dative, Plural, Masculine", "X-DSF": "indefinite pronoun, Dative, Singular, Feminine", "X-DSM": "indefinite pronoun, Dative, Singular, Masculine", "X-DSN": "indefinite pronoun, Dative, Singular, Neuter", "X-GPF": "indefinite pronoun, Genitive, Plural, Feminine", "X-GPM": "indefinite pronoun, Genitive, Plural, Masculine", "X-GPN": "indefinite pronoun, Genitive, Plural, Neuter", "X-GSF": "indefinite pronoun, Genitive, Singular, Feminine", "X-GSM": "indefinite pronoun, Genitive, Singular, Masculine", "X-GSN": "indefinite pronoun, Genitive, Singular, Neuter", "X-NPF": "indefinite pronoun, Nominative, Plural, Feminine", "X-NPM": "indefinite pronoun, Nominative, Plural, Masculine", "X-NPN": "indefinite pronoun, Nominative, Plural, Neuter", "X-NSF": "indefinite pronoun, Nominative, Singular, Feminine", "X-NSM": "indefinite pronoun, Nominative, Singular, Masculine", "X-NSN": "indefinite pronoun, Nominative, Singular, Neuter"}, "spanish": {"1": "Entonces, entrando Jesús en la barca, pasó al otro lado y vino a su ciudad.", "2": "Y sucedió que le trajeron un paralítico, tendido sobre una cama; y al ver Jesús la fe de ellos, dijo al paralítico: Ten ánimo, hijo; tus pecados te son perdonados.", "3": "Entonces algunos de los escribas decían dentro de sí: Este blasfema.", "4": "Y conociendo Jesús los pensamientos de ellos, dijo: ¿Por qué pensáis mal en vuestros corazones?", "5": "Porque, ¿qué es más fácil, decir: Los pecados te son perdonados, o decir: Levántate y anda?", "6": "Pues para que sepáis que el Hijo del Hombre tiene potestad en la tierra para perdonar pecados (dice entonces al paralítico): Levántate, toma tu cama, y vete a tu casa.", "7": "Entonces él se levantó y se fue a su casa.", "8": "Y la gente, al verlo, se maravilló y glorificó a Dios, que había dado tal potestad a los hombres. Llamamiento de Mateo (Mr. 2.13-17; Lc. 5.27-32)", "9": "Pasando Jesús de allí, vio a un hombre llamado Mateo, que estaba sentado al banco de los tributos públicos, y le dijo: Sígueme. Y se levantó y le siguió.", "10": "Y aconteció que estando él sentado a la mesa en la casa, he aquí que muchos publicanos y pecadores, que habían venido, se sentaron juntamente a la mesa con Jesús y sus discípulos.", "11": "Cuando vieron esto los fariseos, dijeron a los discípulos: ¿Por qué come vuestro Maestro con los publicanos y pecadores?", "12": "Al oír esto Jesús, les dijo: Los sanos no tienen necesidad de médico, sino los enfermos.", "13": "Id, pues, y aprended lo que significa: Misericordia quiero, y no sacrificio. Porque no he venido a llamar a justos, sino a pecadores, al arrepentimiento. La pregunta sobre el ayuno (Mr. 2.18-22; Lc. 5.33-39)", "14": "Entonces vinieron a él los discípulos de Juan, diciendo: ¿Por qué nosotros y los fariseos ayunamos muchas veces, y tus discípulos no ayunan?", "15": "Jesús les dijo: ¿Acaso pueden los que están de bodas tener luto entre tanto que el esposo está con ellos? Pero vendrán días cuando el esposo les será quitado, y entonces ayunarán.", "16": "Nadie pone remiendo de paño nuevo en vestido viejo; porque tal remiendo tira del vestido, y se hace peor la rotura.", "17": "Ni echan vino nuevo en odres viejos; de otra manera los odres se rompen, y el vino se derrama, y los odres se pierden; pero echan el vino nuevo en odres nuevos, y lo uno y lo otro se conservan juntamente. La hija de Jairo, y la mujer que tocó el manto de Jesús (Mr. 5.21-43; Lc. 8.40-56)", "18": "Mientras él les decía estas cosas, vino un hombre principal y se postró ante él, diciendo: Mi hija acaba de morir; mas ven y pon tu mano sobre ella, y vivirá.", "19": "Y se levantó Jesús, y le siguió con sus discípulos.", "20": "Y he aquí una mujer enferma de flujo de sangre desde hacía doce años, se le acercó por detrás y tocó el borde de su manto;", "21": "porque decía dentro de sí: Si tocare solamente su manto, seré salva.", "22": "Pero Jesús, volviéndose y mirándola, dijo: Ten ánimo, hija; tu fe te ha salvado. Y la mujer fue salva desde aquella hora.", "23": "Al entrar Jesús en la casa del principal, viendo a los que tocaban flautas, y la gente que hacía alboroto,", "24": "les dijo: Apartaos, porque la niña no está muerta, sino duerme. Y se burlaban de él.", "25": "Pero cuando la gente había sido echada fuera, entró, y tomó de la mano a la niña, y ella se levantó.", "26": "Y se difundió la fama de esto por toda aquella tierra. Dos ciegos reciben la vista", "27": "Pasando Jesús de allí, le siguieron dos ciegos, dando voces y diciendo: ¡Ten misericordia de nosotros, Hijo de David!", "28": "Y llegado a la casa, vinieron a él los ciegos; y Jesús les dijo: ¿Creéis que puedo hacer esto? Ellos dijeron: Sí, Señor.", "29": "Entonces les tocó los ojos, diciendo: Conforme a vuestra fe os sea hecho.", "30": "Y los ojos de ellos fueron abiertos. Y Jesús les encargó rigurosamente, diciendo: Mirad que nadie lo sepa.", "31": "Pero salidos ellos, divulgaron la fama de él por toda aquella tierra. Un mudo habla", "32": "Mientras salían ellos, he aquí, le trajeron un mudo, endemoniado.", "33": "Y echado fuera el demonio, el mudo habló; y la gente se maravillaba, y decía: Nunca se ha visto cosa semejante en Israel.", "34": "Pero los fariseos decían: Por el príncipe de los demonios echa fuera los demonios. La mies es mucha", "35": "Recorría Jesús todas las ciudades y aldeas, enseñando en las sinagogas de ellos, y predicando el evangelio del reino, y sanando toda enfermedad y toda dolencia en el pueblo.", "36": "Y al ver las multitudes, tuvo compasión de ellas; porque estaban desamparadas y dispersas como ovejas que no tienen pastor.", "37": "Entonces dijo a sus discípulos: A la verdad la mies es mucha, mas los obreros pocos.", "38": "Rogad, pues, al Señor de la mies, que envíe obreros a su mies. Elección de los doce apóstoles (Mr. 3.13-19; Lc. 6.12-16)"}, "translations": {"RVR60": {"1": "Entonces, entrando Jesús en la barca, pasó al otro lado y vino a su ciudad.", "2": "Y sucedió que le trajeron un paralítico, tendido sobre una cama; y al ver Jesús la fe de ellos, dijo al paralítico: Ten ánimo, hijo; tus pecados te son perdonados.", "3": "Entonces algunos de los escribas decían dentro de sí: Este blasfema.", "4": "Y conociendo Jesús los pensamientos de ellos, dijo: ¿Por qué pensáis mal en vuestros corazones?", "5": "Porque, ¿qué es más fácil, decir: Los pecados te son perdonados, o decir: Levántate y anda?", "6": "Pues para que sepáis que el Hijo del Hombre tiene potestad en la tierra para perdonar pecados (dice entonces al paralítico): Levántate, toma tu cama, y vete a tu casa.", "7": "Entonces él se levantó y se fue a su casa.", "8": "Y la gente, al verlo, se maravilló y glorificó a Dios, que había dado tal potestad a los hombres. Llamamiento de Mateo (Mr. 2.13-17; Lc. 5.27-32)", "9": "Pasando Jesús de allí, vio a un hombre llamado Mateo, que estaba sentado al banco de los tributos públicos, y le dijo: Sígueme. Y se levantó y le siguió.", "10": "Y aconteció que estando él sentado a la mesa en la casa, he aquí que muchos publicanos y pecadores, que habían venido, se sentaron juntamente a la mesa con Jesús y sus discípulos.", "11": "Cuando vieron esto los fariseos, dijeron a los discípulos: ¿Por qué come vuestro Maestro con los publicanos y pecadores?", "12": "Al oír esto Jesús, les dijo: Los sanos no tienen necesidad de médico, sino los enfermos.", "13": "Id, pues, y aprended lo que significa: Misericordia quiero, y no sacrificio. Porque no he venido a llamar a justos, sino a pecadores, al arrepentimiento. La pregunta sobre el ayuno (Mr. 2.18-22; Lc. 5.33-39)", "14": "Entonces vinieron a él los discípulos de Juan, diciendo: ¿Por qué nosotros y los fariseos ayunamos muchas veces, y tus discípulos no ayunan?", "15": "Jesús les dijo: ¿Acaso pueden los que están de bodas tener luto entre tanto que el esposo está con ellos? Pero vendrán días cuando el esposo les será quitado, y entonces ayunarán.", "16": "Nadie pone remiendo de paño nuevo en vestido viejo; porque tal remiendo tira del vestido, y se hace peor la rotura.", "17": "Ni echan vino nuevo en odres viejos; de otra manera los odres se rompen, y el vino se derrama, y los odres se pierden; pero echan el vino nuevo en odres nuevos, y lo uno y lo otro se conservan juntamente. La hija de Jairo, y la mujer que tocó el manto de Jesús (Mr. 5.21-43; Lc. 8.40-56)", "18": "Mientras él les decía estas cosas, vino un hombre principal y se postró ante él, diciendo: Mi hija acaba de morir; mas ven y pon tu mano sobre ella, y vivirá.", "19": "Y se levantó Jesús, y le siguió con sus discípulos.", "20": "Y he aquí una mujer enferma de flujo de sangre desde hacía doce años, se le acercó por detrás y tocó el borde de su manto;", "21": "porque decía dentro de sí: Si tocare solamente su manto, seré salva.", "22": "Pero Jesús, volviéndose y mirándola, dijo: Ten ánimo, hija; tu fe te ha salvado. Y la mujer fue salva desde aquella hora.", "23": "Al entrar Jesús en la casa del principal, viendo a los que tocaban flautas, y la gente que hacía alboroto,", "24": "les dijo: Apartaos, porque la niña no está muerta, sino duerme. Y se burlaban de él.", "25": "Pero cuando la gente había sido echada fuera, entró, y tomó de la mano a la niña, y ella se levantó.", "26": "Y se difundió la fama de esto por toda aquella tierra. Dos ciegos reciben la vista", "27": "Pasando Jesús de allí, le siguieron dos ciegos, dando voces y diciendo: ¡Ten misericordia de nosotros, Hijo de David!", "28": "Y llegado a la casa, vinieron a él los ciegos; y Jesús les dijo: ¿Creéis que puedo hacer esto? Ellos dijeron: Sí, Señor.", "29": "Entonces les tocó los ojos, diciendo: Conforme a vuestra fe os sea hecho.", "30": "Y los ojos de ellos fueron abiertos. Y Jesús les encargó rigurosamente, diciendo: Mirad que nadie lo sepa.", "31": "Pero salidos ellos, divulgaron la fama de él por toda aquella tierra. Un mudo habla", "32": "Mientras salían ellos, he aquí, le trajeron un mudo, endemoniado.", "33": "Y echado fuera el demonio, el mudo habló; y la gente se maravillaba, y decía: Nunca se ha visto cosa semejante en Israel.", "34": "Pero los fariseos decían: Por el príncipe de los demonios echa fuera los demonios. La mies es mucha", "35": "Recorría Jesús todas las ciudades y aldeas, enseñando en las sinagogas de ellos, y predicando el evangelio del reino, y sanando toda enfermedad y toda dolencia en el pueblo.", "36": "Y al ver las multitudes, tuvo compasión de ellas; porque estaban desamparadas y dispersas como ovejas que no tienen pastor.", "37": "Entonces dijo a sus discípulos: A la verdad la mies es mucha, mas los obreros pocos.", "38": "Rogad, pues, al Señor de la mies, que envíe obreros a su mies. Elección de los doce apóstoles (Mr. 3.13-19; Lc. 6.12-16)"}, "RVR1909": {"1": "ENTONCES entrando en el barco, pasó á la otra parte, y vino á su ciudad.", "2": "Y he aquí le trajeron un paralítico, echado en una cama: y viendo Jesús la fe de ellos, dijo al paralítico: Confía, hijo; tus pecados te son perdonados.", "3": "Y he aquí, algunos de los escribas decían dentro de sí: Este blasfema.", "4": "Y viendo Jesús sus pensamientos, dijo: ¿Por qué pensáis mal en vuestros corazones?", "5": "Porque, ¿qué es más fácil, decir: Los pecados te son perdonados; ó decir: Levántate, y anda?", "6": "Pues para que sepáis que el Hijo del hombre tiene potestad en la tierra de perdonar pecados, (dice entonces al paralítico): Levántate, toma tu cama, y vete á tu casa.", "7": "Entonces él se levantó y se fué á su casa.", "8": "Y las gentes, viéndolo, se maravillaron, y glorificaron á Dios, que había dado tal potestad á los hombres.", "9": "Y pasando Jesús de allí, vió á un hombre que estaba sentado al banco de los públicos tributos, el cual se llamaba Mateo; y dícele: Sígueme. Y se levantó, y le siguió.", "10": "Y aconteció que estando él sentado á la mesa en casa, he aquí que muchos publicanos y pecadores, que habían venido, se sentaron juntamente á la mesa con Jesús y sus discípulos.", "11": "Y viendo esto los Fariseos, dijeron á sus discípulos: ¿Por qué come vuestro Maestro con los publicanos y pecadores?", "12": "Y oyéndolo Jesús, le dijo: Los que están sanos no tienen necesidad de médico, sino los enfermos.", "13": "Andad pues, y aprended qué cosa es: Misericordia quiero, y no sacrificio: porque no he venido á llamar justos, sino pecadores á arrepentimiento.", "14": "Entonces los discípulos de Juan vienen á él, diciendo: ¿Por qué nosotros y los Fariseos ayunamos muchas veces, y tus discípulos no ayunan?", "15": "Y Jesús les dijo: ¿Pueden los que son de bodas tener luto entre tanto que el esposo está con ellos? mas vendrán días cuando el esposo será quitado de ellos, y entonces ayunarán.", "16": "Y nadie echa remiendo de paño recio en vestido viejo; porque el tal remiendo tira del vestido, y se hace peor la rotura.", "17": "Ni echan vino nuevo en cueros viejos: de otra manera los cueros se rompen, y el vino se derrama, y se pierden los cueros; mas echan el vino nuevo en cueros nuevos, y lo uno y lo otro se conserva juntamente.", "18": "Hablando él estas cosas á ellos, he aquí vino un principal, y le adoraba, diciendo: Mi hija es muerta poco ha: mas ven y pon tu mano sobre ella, y vivirá.", "19": "Y se levantó Jesús, y le siguió, y sus discípulos.", "20": "Y he aquí una mujer enferma de flujo de sangre doce años había, llegándose por detrás, tocó la franja de su vestido:", "21": "Porque decía entre sí: Si tocare solamente su vestido, seré salva.", "22": "Mas Jesús volviéndose, y mirándola, dijo: Confía, hija, tu fe te ha salvado. Y la mujer fué salva desde aquella hora.", "23": "Y llegado Jesús á casa del principal, viendo los tañedores de flautas, y la gente que hacía bullicio,", "24": "Díceles: Apartaos, que la muchacha no es muerta, mas duerme. Y se burlaban de él.", "25": "Y como la gente fué echada fuera, entró, y tomóla de la mano, y se levantó la muchacha.", "26": "Y salió esta fama por toda aquella tierra.", "27": "Y pasando Jesús de allí, le siguieron dos ciegos, dando voces y diciendo: Ten misericordia de nosotros, Hijo de David.", "28": "Y llegado á la casa, vinieron á él los ciegos; y Jesús les dice: ¿Creéis que puedo hacer esto? Ellos dicen: Sí, Señor.", "29": "Entonces tocó los ojos de ellos, diciendo: Conforme á vuestra fe os sea hecho.", "30": "Y los ojos de ellos fueron abiertos. Y Jesús les encargó rigurosamente, diciendo: Mirad que nadie lo sepa.", "31": "Mas ellos salidos, divulgaron su fama por toda aquella tierra.", "32": "Y saliendo ellos, he aquí, le trajeron un hombre mudo, endemoniado.", "33": "Y echado fuera el demonio, el mudo habló; y las gentes se maravillaron, diciendo: Nunca ha sido vista cosa semejante en Israel.", "34": "Mas los Fariseos decían: Por el príncipe de los demonios echa fuera los demonios.", "35": "Y rodeaba Jesús por todas las ciudades y aldeas, enseñando en las sinagogas de ellos, y predicando el evangelio del reino, y sanando toda enfermedad y todo achaque en el pueblo.", "36": "Y viendo las gentes, tuvo compasión de ellas; porque estaban derramadas y esparcidas como ovejas que no tienen pastor.", "37": "Entonces dice á sus discípulos: A la verdad la mies es mucha, mas los obreros pocos.", "38": "Rogad, pues, al Señor de la mies, que envíe obreros á su mies."}, "KJV": {"1": "And he entered into a ship, and passed over, and came into his own city.", "2": "And, behold, they brought to him a man sick of the palsy, lying on a bed: and Jesus seeing their faith said unto the sick of the palsy; Son, be of good cheer; thy sins be forgiven thee.", "3": "And, behold, certain of the scribes said within themselves, This man blasphemeth.", "4": "And Jesus knowing their thoughts said, Wherefore think ye evil in your hearts?", "5": "For whether is easier, to say, Thy sins be forgiven thee; or to say, Arise, and walk?", "6": "But that ye may know that the Son of man hath power on earth to forgive sins, (then saith he to the sick of the palsy,) Arise, take up thy bed, and go unto thine house.", "7": "And he arose, and departed to his house.", "8": "But when the multitudes saw it, they marvelled, and glorified God, which had given such power unto men.", "9": "And as Jesus passed forth from thence, he saw a man, named Matthew, sitting at the receipt of custom: and he saith unto him, Follow me. And he arose, and followed him.", "10": "And it came to pass, as Jesus sat at meat in the house, behold, many publicans and sinners came and sat down with him and his disciples.", "11": "And when the Pharisees saw it, they said unto his disciples, Why eateth your Master with publicans and sinners?", "12": "But when Jesus heard that, he said unto them, They that be whole need not a physician, but they that are sick.", "13": "But go ye and learn what that meaneth, I will have mercy, and not sacrifice: for I am not come to call the righteous, but sinners to repentance.", "14": "Then came to him the disciples of John, saying, Why do we and the Pharisees fast oft, but thy disciples fast not?", "15": "And Jesus said unto them, Can the children of the bridechamber mourn, as long as the bridegroom is with them? but the days will come, when the bridegroom shall be taken from them, and then shall they fast.", "16": "No man putteth a piece of new cloth unto an old garment, for that which is put in to fill it up taketh from the garment, and the rent is made worse.", "17": "Neither do men put new wine into old bottles: else the bottles break, and the wine runneth out, and the bottles perish: but they put new wine into new bottles, and both are preserved.", "18": "While he spake these things unto them, behold, there came a certain ruler, and worshipped him, saying, My daughter is even now dead: but come and lay thy hand upon her, and she shall live.", "19": "And Jesus arose, and followed him, and so did his disciples.", "20": "And, behold, a woman, which was diseased with an issue of blood twelve years, came behind him, and touched the hem of his garment:", "21": "For she said within herself, If I may but touch his garment, I shall be whole.", "22": "But Jesus turned him about, and when he saw her, he said, Daughter, be of good comfort; thy faith hath made thee whole. And the woman was made whole from that hour.", "23": "And when Jesus came into the ruler’s house, and saw the minstrels and the people making a noise,", "24": "He said unto them, Give place: for the maid is not dead, but sleepeth. And they laughed him to scorn.", "25": "But when the people were put forth, he went in, and took her by the hand, and the maid arose.", "26": "And the fame hereof went abroad into all that land.", "27": "And when Jesus departed thence, two blind men followed him, crying, and saying, Thou Son of David, have mercy on us.", "28": "And when he was come into the house, the blind men came to him: and Jesus saith unto them, Believe ye that I am able to do this? They said unto him, Yea, Lord.", "29": "Then touched he their eyes, saying, According to your faith be it unto you.", "30": "And their eyes were opened; and Jesus straitly charged them, saying, See that no man know it.", "31": "But they, when they were departed, spread abroad his fame in all that country.", "32": "As they went out, behold, they brought to him a dumb man possessed with a devil.", "33": "And when the devil was cast out, the dumb spake: and the multitudes marvelled, saying, It was never so seen in Israel.", "34": "But the Pharisees said, He casteth out devils through the prince of the devils.", "35": "And Jesus went about all the cities and villages, teaching in their synagogues, and preaching the gospel of the kingdom, and healing every sickness and every disease among the people.", "36": "But when he saw the multitudes, he was moved with compassion on them, because they fainted, and were scattered abroad, as sheep having no shepherd.", "37": "Then saith he unto his disciples, The harvest truly is plenteous, but the labourers are few;", "38": "Pray ye therefore the Lord of the harvest, that he will send forth labourers into his harvest. "}, "ASV": {"1": "And he entered into a boat, and crossed over, and came into his own city. ", "2": "And behold, they brought to him a man sick of the palsy, lying on a bed: and Jesus seeing their faith said unto the sick of the palsy, Son, be of good cheer; thy sins are forgiven. ", "3": "And behold, certain of the scribes said within themselves, This man blasphemeth. ", "4": "And Jesus knowing their thoughts said, Wherefore think ye evil in your hearts? ", "5": "For which is easier, to say, Thy sins are forgiven; or to say, Arise, and walk? ", "6": "But that ye may know that the Son of man hath authority on earth to forgive sins (then saith he to the sick of the palsy), Arise, and take up thy bed, and go unto thy house. ", "7": "And he arose, and departed to his house. ", "8": "But when the multitudes saw it, they were afraid, and glorified God, who had given such authority unto men. ", "9": "And as Jesus passed by from thence, he saw a man, called Matthew, sitting at the place of toll: and he saith unto him, Follow me. And he arose, and followed him. ", "10": "And it came to pass, as he sat at meat in the house, behold, many publicans and sinners came and sat down with Jesus and his disciples. ", "11": "And when the Pharisees saw it, they said unto his disciples, Why eateth your Teacher with the publicans and sinners? ", "12": "But when he heard it, he said, They that are whole have no need of a physician, but they that are sick. ", "13": "But go ye and learn what this meaneth, I desire mercy, and not sacrifice: for I came not to call the righteous, but sinners. ", "14": "Then come to him the disciples of John, saying, Why do we and the Pharisees fast oft, but thy disciples fast not? ", "15": "And Jesus said unto them, Can the sons of the bridechamber mourn, as long as the bridegroom is with them? but the days will come, when the bridegroom shall be taken away from them, and then will they fast. ", "16": "And no man putteth a piece of undressed cloth upon an old garment; for that which should fill it up taketh from the garment, and a worse rent is made. ", "17": "Neither do men put new wine into old wine-skins: else the skins burst, and the wine is spilled, and the skins perish: but they put new wine into fresh wine-skins, and both are preserved. ", "18": "While he spake these things unto them, behold, there came a ruler, and worshipped him, saying, My daughter is even now dead: but come and lay thy hand upon her, and she shall live. ", "19": "And Jesus arose, and followed him, and so did his disciples. ", "20": "And behold, a woman, who had an issue of blood twelve years, came behind him, and touched the border of his garment: ", "21": "for she said within herself, If I do but touch his garment, I shall be made whole. ", "22": "But Jesus turning and seeing her said, Daughter, be of good cheer; thy faith hath made thee whole. And the woman was made whole from that hour. ", "23": "And when Jesus came into the ruler’s house, and saw the flute-players, and the crowd making a tumult, ", "24": "he said, Give place: for the damsel is not dead, but sleepeth. And they laughed him to scorn. ", "25": "But when the crowd was put forth, he entered in, and took her by the hand; and the damsel arose. ", "26": "And the fame hereof went forth into all that land. ", "27": "And as Jesus passed by from thence, two blind men followed him, crying out, and saying, Have mercy on us, thou son of David. ", "28": "And when he was come into the house, the blind men came to him: and Jesus saith unto them, Believe ye that I am able to do this? They say unto him, Yea, Lord. ", "29": "Then touched he their eyes, saying, According to your faith be it done unto you. ", "30": "And their eyes were opened. And Jesus strictly charged them, saying, See that no man know it. ", "31": "But they went forth, and spread abroad his fame in all that land. ", "32": "And as they went forth, behold, there was brought to him a dumb man possessed with a demon. ", "33": "And when the demon was cast out, the dumb man spake: and the multitudes marvelled, saying, It was never so seen in Israel. ", "34": "But the Pharisees said, By the prince of the demons casteth he out demons. ", "35": "And Jesus went about all the cities and the villages, teaching in their synagogues, and preaching the gospel of the kingdom, and healing all manner of disease and all manner of sickness. ", "36": "But when he saw the multitudes, he was moved with compassion for them, because they were distressed and scattered, as sheep not having a shepherd. ", "37": "Then saith he unto his disciples, The harvest indeed is plenteous, but the laborers are few. ", "38": "Pray ye therefore the Lord of the harvest, that he send forth laborers into his harvest.  "}, "BSB": {"1": " Jesus got into a boat, crossed over, and came to His own town. ", "2": "Just then some men brought to Him a paralytic lying on a mat. When Jesus saw their faith, He said to the paralytic, “Take courage, son; your sins are forgiven.” ", "3": "On seeing this, some of the scribes said to themselves, “This man is blaspheming!” ", "4": "But Jesus knew what they were thinking and said, “Why do you harbor evil in your hearts? ", "5": "Which is easier: to say, ‘Your sins are forgiven,’ or to say, ‘Get up and walk?’ ", "6": "But so that you may know that the Son of Man has authority on earth to forgive sins...” Then He said to the paralytic, “Get up, pick up your mat, and go home.” ", "7": "And the man got up and went home. ", "8": "When the crowds saw this, they were filled with awe and glorified God, who had given such authority to men. ", "9": "  As Jesus went on from there, He saw a man named Matthew sitting at the tax booth. “Follow Me,” He told him, and Matthew got up and followed Him. ", "10": "Later, as Jesus was dining at Matthew’s house, many tax collectors and sinners came and ate with Him and His disciples. ", "11": "When the Pharisees saw this, they asked His disciples, “Why does your Teacher eat with tax collectors and sinners?” ", "12": "On hearing this, Jesus said, “It is not the healthy who need a doctor, but the sick. ", "13": "But go and learn what this means: ‘I desire mercy, not sacrifice.’ For I have not come to call the righteous, but sinners.” ", "14": "  At that time John’s disciples came to Jesus and asked, “Why is it that we and the Pharisees fast so often, but Your disciples do not fast?” ", "15": "Jesus replied, “How can the guests of the bridegroom mourn while He is with them? But the time will come when the bridegroom will be taken from them; then they will fast. ", "16": "  No one sews a patch of unshrunk cloth on an old garment. For the patch will pull away from the garment, and a worse tear will result. ", "17": "Neither do men pour new wine into old wineskins. If they do, the skins will burst, the wine will spill, and the wineskins will be ruined. Instead, they pour new wine into new wineskins, and both are preserved.” ", "18": "  While Jesus was saying these things, a synagogue leader came and knelt before Him. “My daughter has just died,” he said. “But come and place Your hand on her, and she will live.” ", "19": "So Jesus got up and went with him, along with His disciples. ", "20": "Suddenly a woman who had suffered from bleeding for twelve years came up behind Him and touched the fringe of His cloak. ", "21": "She said to herself, “If only I touch His cloak, I will be healed.” ", "22": "Jesus turned and saw her. “Take courage, daughter,” He said, “your faith has healed you.” And the woman was cured from that very hour. ", "23": "When Jesus entered the house of the synagogue leader, He saw the flute players and the noisy crowd. ", "24": "“Go away,” He told them. “The girl is not dead, but asleep.” And they laughed at Him. ", "25": "After the crowd had been put outside, Jesus went in and took the girl by the hand, and she got up. ", "26": "And the news about this spread throughout that region. ", "27": "  As Jesus went on from there, two blind men followed Him, crying out, “Have mercy on us, Son of David!” ", "28": "After Jesus had entered the house, the blind men came to Him. “Do you believe that I am able to do this?” He asked.  “Yes, Lord,” they answered. ", "29": "Then He touched their eyes and said, “According to your faith will it be done to you.” ", "30": "And their eyes were opened. Jesus warned them sternly, “See that no one finds out about this!” ", "31": "But they went out and spread the news about Him throughout the land. ", "32": "As they were leaving, a demon-possessed man who was mute was brought to Jesus. ", "33": "And when the demon had been driven out, the man began to speak. The crowds were amazed and said, “Nothing like this has ever been seen in Israel!” ", "34": "But the Pharisees said, “It is by the prince of demons that He drives out demons.” ", "35": "  Jesus went through all the towns and villages, teaching in their synagogues, preaching the gospel of the kingdom, and healing every disease and sickness. ", "36": "When He saw the crowds, He was moved with compassion for them, because they were harassed and helpless, like sheep without a shepherd. ", "37": "Then He said to His disciples, “The harvest is plentiful, but the workers are few. ", "38": "Ask the Lord of the harvest, therefore, to send out workers into His harvest.”  "}, "Darby": {"1": "And going on board the ship, he passed over and came to his own city. ", "2": "And behold, they brought to him a paralytic, laid upon a bed; and Jesus, seeing their faith, said to the paralytic, Be of good courage, child; thy sins are forgiven. ", "3": "And behold, certain of the scribes said to themselves, This [man] blasphemes. ", "4": "And Jesus, seeing their thoughts, said, Why do ye think evil things in your hearts? ", "5": "For which is easier: to say, Thy sins are forgiven; or to say, Rise up and walk? ", "6": "But that ye may know that the Son of man has power on earth to forgive sins, (then he says to the paralytic,) Rise up, take up thy bed and go to thy house. ", "7": "And he rose up and went to his house. ", "8": "But the crowds seeing [it], were in fear, and glorifiedGod who gave such power to men. ", "9": "And Jesus, passing on thence, saw a man sitting at the tax-office, called Matthew, and says to him, Follow me. And he rose up and followed him. ", "10": "And it came to pass, as he lay at table in the house, that behold, many tax-gatherers and sinners came and lay at table with Jesus and his disciples. ", "11": "And the Pharisees seeing [it], said to his disciples, Why does your teacher eat with tax-gatherers and sinners? ", "12": "But [Jesus] hearing it, said, They that are strong have not need of a physician, but those that are ill. ", "13": "But go and learn what [that] is — I will have mercy and not sacrifice; for I have not come to call righteous [men] but sinners. ", "14": "Then come to him the disciples of John, saying, Why do we and the Pharisees often fast, but thy disciples fast not? ", "15": "And Jesus said to them, Can the sons of the bridechamber mourn so long as the bridegroom is with them? But days will come when the bridegroom will have been taken away from them, and then they will fast. ", "16": "But no one puts a patch of new cloth on an old garment, for its filling up takes from the garment and a worse rent takes place. ", "17": "Nor do men put new wine into old skins, otherwise the skins burst and the wine is poured out, and the skins will be destroyed; but they put new wine into new skins, and both are preserved together. ", "18": "As he spoke these things to them, behold, a ruler coming in did homage to him, saying, My daughter has by this died; but come and lay thy hand upon her and she shall live. ", "19": "And Jesus rose up and followed him, and [so did] his disciples. ", "20": "And behold, a woman, who had had a bloody flux [for] twelve years, came behind and touched the hem of his garment; ", "21": "for she said within herself, If I should only touch his garment I shall be healed. ", "22": "But Jesus turning and seeing her, said, Be of good courage, daughter; thy faith has healed thee. And the woman was healed from that hour. ", "23": "And when Jesus was come to the house of the ruler, and saw the flute-players and the crowd making a tumult, ", "24": "he said, Withdraw, for the damsel is not dead, but sleeps. And they derided him. ", "25": "But when the crowd had been put out, he went in and took her hand; and the damsel rose up. ", "26": "And the fame of it went out into all that land. ", "27": "And as Jesus passed on thence, two blind [men] followed him, crying and saying, Have mercy on us, Son of David. ", "28": "And when he was come to the house, the blind [men] came to him. And Jesus says to them, Do ye believe that I am able to do this? They say to him, Yea, Lord. ", "29": "Then he touched their eyes, saying, According to your faith, be it unto you. ", "30": "And their eyes were opened; and Jesus charged them sharply, saying, See, let no man know it. ", "31": "But they, when they were gone out, spread his name abroad in all that land. ", "32": "But as these were going out, behold, they brought to him a dumb man possessed by a demon. ", "33": "And the demon having been cast out, the dumb spake. And the crowds were astonished, saying, It has never been seen thus in Israel. ", "34": "But the Pharisees said, He casts out the demons through the prince of the demons. ", "35": "And Jesus went round all the cities and the villages, teaching in their synagogues, and preaching the glad tidings of the kingdom, and healing every disease and every bodily weakness. ", "36": "But when he saw the crowds he was moved with compassion for them, because they were harassed, and cast away as sheep not having a shepherd. ", "37": "Then saith he to his disciples, The harvest [is] great and the workmen [are] few; ", "38": "supplicate therefore the Lord of the harvest, that he send forth workmen unto his harvest.   "}, "LITV": {"1": "And entering into the boat, He passed over and came to His own city. ", "2": "And, behold! They were bringing a paralytic lying on a cot to Him. And seeing their faith, Jesus said to the paralytic, Be comforted, child. Your sins have been forgiven you. ", "3": "And, behold, some of the scribes said within themselves, This one blasphemes. ", "4": "And seeing their thoughts, Jesus said, Why do you think evil in your hearts? ", "5": "For what is easier, to say, Your sins have been forgiven you; or to say, Rise up and walk? ", "6": "But that you may know that the Son of man has authority on earth to forgive sins, then He said to the paralytic, Rising up, lift up your cot and go to your house. ", "7": "And rising up, he went away to his house. ", "8": "And seeing, the crowds marveled, and they glorified God who gave such authority to men.   ", "9": "And passing from there, Jesus saw a man named Matthew sitting at the tax office. And He said to him, Follow Me. And rising up, he followed Him. ", "10": "And it happened as He reclined in the house, behold, many tax collectors and sinners having come, these were reclining with Jesus and His disciples. ", "11": "And seeing, the Pharisees said to His disciples, Why does your teacher eat with tax collectors and sinners? ", "12": "But Jesus hearing, He said to them, The ones who are strong have no need of a physician, but the ones who are sick. ", "13": "But going, learn what this is , \"I desire mercy and not sacrifice.\" For I did not come to call righteous ones , but sinners to repentance. Hos. 6:6   ", "14": "Then the disciples of John came to Him, saying, Why do we and the Pharisees fast much, and Your disciples do not fast? ", "15": "And Jesus said to them, Can the sons of the bridechamber mourn as long as the bridegroom is with them? But the days will come when the bridegroom will have been taken from them, and then they will fast. ", "16": "But no one puts a piece of new cloth onto an old garment. For its filling up takes away from the garment, and a worse tear takes its place. ", "17": "Nor do they put new wine into old skins; otherwise, the skins are burst, and the wine pours out, and the skins will be ruined. But they put new wine into fresh skins, and both are preserved together.   ", "18": "As He spoke these things to them, behold, coming up a ruler bowed before Him, saying, My daughter has just now died; but coming lay Your hand on her, and she will live. ", "19": "And rising up, Jesus and His disciples followed him. ", "20": "And behold, a woman who had a flow of blood for twelve years came near behind Him, and touched the fringe of His robe. ", "21": "For she said within herself, If only I shall touch His robe, I will be cured. ", "22": "But turning and seeing her, Jesus said, Be comforted, daughter; your faith has healed you. And the woman was healed from that hour. ", "23": "And coming into the house of the ruler, and seeing the flute-players and the crowd causing a tumult, ", "24": "Jesus said to them, Go back, for the little girl has not died, but she sleeps. And they laughed at Him. ", "25": "But when the crowd had been put out, entering He took hold of her hand, and the little girl rose up. ", "26": "And this report went out into all that land.   ", "27": "And Jesus passing on from there, two blind ones followed Him, crying and saying, Have pity on us, Son of David. ", "28": "And coming into the house, the blind ones came near to Him. And Jesus said to them, Do you believe that I am able to do this? And they said to Him, Yes, Lord. ", "29": "Then He touched their eyes, saying, According to your faith let it be to you. ", "30": "And their eyes were opened. And Jesus strictly ordered them, saying, See, let no one know. ", "31": "But going out, they made Him known in all that land. ", "32": "And as they were going out, behold, they brought to Him a dumb man who had been possessed by a demon. ", "33": "And the demon being cast out, the dumb one spoke. And the crowds marveled, saying, Never was it seen this way in Israel. ", "34": "But the Pharisees said, He casts out the demons by the ruler of the demons.   ", "35": "And Jesus went about all the cities and the villages teaching in their synagogues, and proclaiming the gospel of the kingdom, and healing every sickness and every weakness of body among the people. ", "36": "And seeing the crowds, He was moved with pity for them, because they were tired and scattered, like sheep having no shepherd. ", "37": "Then He said to His disciples, The harvest truly is great, but the workers few. ", "38": "Pray then that the Lord of the harvest may send out workers into His harvest.  "}, "YLT": {"1": "And having gone to the boat, he passed over, and came to his own city,", "2": "and lo, they were bringing to him a paralytic, laid upon a couch, and Jesus having seen their faith, said to the paralytic, `Be of good courage, child, thy sins have been forgiven thee.'", "3": "And lo, certain of the scribes said within themselves, `This one doth speak evil.'", "4": "And Jesus, having known their thoughts, said, `Why think ye evil in your hearts?", "5": "for which is easier? to say, The sins have been forgiven to thee; or to say, Rise, and walk?", "6": "`But, that ye may know that the Son of Man hath power upon the earth to forgive sins--(then saith he to the paralytic) --having risen, take up thy couch, and go to thy house.'", "7": "And he, having risen, went to his house,", "8": "and the multitudes having seen, wondered, and glorified God, who did give such power to men.", "9": "And Jesus passing by thence, saw a man sitting at the tax-office, named Matthew, and saith to him, `Be following me,' and he, having risen, did follow him.", "10": "And it came to pass, he reclining (at meat) in the house, that lo, many tax-gatherers and sinners having come, were lying (at meat) with Jesus and his disciples,", "11": "and the Pharisees having seen, said to his disciples, `Wherefore with the tax-gatherers and sinners doth your teacher eat?'", "12": "And Jesus having heard, said to them, `They who are whole have no need of a physician, but they who are ill;", "13": "but having gone, learn ye what is, Kindness I will, and not sacrifice, for I did not come to call righteous men, but sinners, to reformation.'", "14": "Then come to him do the disciples of John, saying, `Wherefore do we and the Pharisees fast much, and thy disciples fast not?'", "15": "And Jesus said to them, `Can the sons of the bride-chamber mourn, so long as the bridegroom is with them? but days shall come when the bridegroom may be taken from them, and then they shall fast.", "16": "`And no one doth put a patch of undressed cloth on an old garment, for its filling up doth take from the garment, and a worse rent is made.", "17": "`Nor do they put new wine into old skins, and if not--the skins burst, and the wine doth run out, and the skins are destroyed, but they put new wine into new skins, and both are preserved together.'", "18": "While he is speaking these things to them, lo, a ruler having come, was bowing to him, saying that `My daughter just now died, but, having come, lay thy hand upon her, and she shall live.'", "19": "And Jesus having risen, did follow him, also his disciples,", "20": "and lo, a woman having an issue of blood twelve years, having come to him behind, did touch the fringe of his garments,", "21": "for she said within herself, `If only I may touch his garment, I shall be saved.'", "22": "And Jesus having turned about, and having seen her, said, `Be of good courage, daughter, thy faith hath saved thee,' and the woman was saved from that hour.", "23": "And Jesus having come to the house of the ruler, and having seen the minstrels and the multitude making tumult,", "24": "he saith to them, `Withdraw, for the damsel did not die, but doth sleep,' and they were deriding him;", "25": "but, when the multitude was put forth, having gone in, he took hold of her hand, and the damsel arose,", "26": "and the fame of this went forth to all the land.", "27": "And Jesus passing on thence, two blind men followed him, calling and saying, `Deal kindly with us, Son of David.'", "28": "And he having come to the house, the blind men came to him, and Jesus saith to them, `Believe ye that I am able to do this?' They say to him, `Yes, sir.'", "29": "Then touched he their eyes, saying, `According to your faith let it be to you,'", "30": "and their eyes were opened, and Jesus strictly charged them, saying, `See, let no one know;'", "31": "but they, having gone forth, did spread his fame in all that land.", "32": "And as they are coming forth, lo, they brought to him a man dumb, a demoniac,", "33": "and the demon having been cast out, the dumb spake, and the multitude did wonder, saying that `It was never so seen in Israel:'", "34": "but the Pharisees said, `By the ruler of the demons he doth cast out the demons.'", "35": "And Jesus was going up and down all the cities and the villages, teaching in their synagogues, and proclaiming the good news of the reign, and healing every sickness and every malady among the people.", "36": "And having seen the multitudes, he was moved with compassion for them, that they were faint and cast aside, as sheep not having a shepherd,", "37": "then saith he to his disciples, `The harvest indeed <FI>is<Fi> abundant, but the workmen few;", "38": "beseech ye therefore the Lord of the harvest, that he may put forth workmen to His harvest.'"}, "Vulgate": {"1": "et ascendens in naviculam transfretavit et venit in civitatem suam", "2": "et ecce offerebant ei paralyticum iacentem in lecto et videns Iesus fidem illorum dixit paralytico confide fili remittuntur tibi peccata tua", "3": "et ecce quidam de scribis dixerunt intra se hic blasphemat", "4": "et cum vidisset Iesus cogitationes eorum dixit ut quid cogitatis mala in cordibus vestris", "5": "quid est facilius dicere dimittuntur tibi peccata aut dicere surge et ambula", "6": "ut sciatis autem quoniam Filius hominis habet potestatem in terra dimittendi peccata tunc ait paralytico surge tolle lectum tuum et vade in domum tuam", "7": "et surrexit et abiit in domum suam", "8": "videntes autem turbae timuerunt et glorificaverunt Deum qui dedit potestatem talem hominibus", "9": "et cum transiret inde Iesus vidit hominem sedentem in teloneo Mattheum nomine et ait illi sequere me et surgens secutus est eum", "10": "et factum est discumbente eo in domo ecce multi publicani et peccatores venientes discumbebant cum Iesu et discipulis eius", "11": "et videntes Pharisaei dicebant discipulis eius quare cum publicanis et peccatoribus manducat magister vester", "12": "at Iesus audiens ait non est opus valentibus medico sed male habentibus", "13": "euntes autem discite quid est misericordiam volo et non sacrificium non enim veni vocare iustos sed peccatores", "14": "tunc accesserunt ad eum discipuli Iohannis dicentes quare nos et Pharisaei ieiunamus frequenter discipuli autem tui non ieiunant", "15": "et ait illis Iesus numquid possunt filii sponsi lugere quamdiu cum illis est sponsus venient autem dies cum auferetur ab eis sponsus et tunc ieiunabunt", "16": "nemo autem inmittit commissuram panni rudis in vestimentum vetus tollit enim plenitudinem eius a vestimento et peior scissura fit", "17": "neque mittunt vinum novum in utres veteres alioquin rumpuntur utres et vinum effunditur et utres pereunt sed vinum novum in utres novos mittunt et ambo conservantur", "18": "haec illo loquente ad eos ecce princeps unus accessit et adorabat eum dicens filia mea modo defuncta est sed veni inpone manum super eam et vivet", "19": "et surgens Iesus sequebatur eum et discipuli eius", "20": "et ecce mulier quae sanguinis fluxum patiebatur duodecim annis accessit retro et tetigit fimbriam vestimenti eius", "21": "dicebat enim intra se si tetigero tantum vestimentum eius salva ero", "22": "at Iesus conversus et videns eam dixit confide filia fides tua te salvam fecit et salva facta est mulier ex illa hora", "23": "et cum venisset Iesus in domum principis et vidisset tibicines et turbam tumultuantem", "24": "dicebat recedite non est enim mortua puella sed dormit et deridebant eum", "25": "et cum eiecta esset turba intravit et tenuit manum eius et surrexit puella", "26": "et exiit fama haec in universam terram illam", "27": "et transeunte inde Iesu secuti sunt eum duo caeci clamantes et dicentes miserere nostri Fili David", "28": "cum autem venisset domum accesserunt ad eum caeci et dicit eis Iesus creditis quia possum hoc facere vobis dicunt ei utique Domine", "29": "tunc tetigit oculos eorum dicens secundum fidem vestram fiat vobis", "30": "et aperti sunt oculi illorum et comminatus est illis Iesus dicens videte ne quis sciat", "31": "illi autem exeuntes diffamaverunt eum in tota terra illa", "32": "egressis autem illis ecce obtulerunt ei hominem mutum daemonium habentem", "33": "et eiecto daemone locutus est mutus et miratae sunt turbae  margin-bottom: 30px;\">\n<table style=\"border-collapse:collapse;font-family:'Courier New',monospace;font-size:14px;white-space:nowrap;width:100%;\">\n<tr style=\"background:#1a237e;color:white\">\n  <th style=\"padding:8px 12px;border:1px solid #444;position:sticky;left:0;background:#1a237e;z-index:1\">Manuscritos<\/th>\n  <th style=\"padding:8px 12px;border:1px solid #444\">Verbo<\/th>\n  <th style=\"padding:8px 12px;border:1px solid #444\">Adverbio<\/th>\n<\/tr>\n<tr>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;font-weight:bold;position:sticky;left:0;background:#f5f5f5\">ℵ* B<\/td>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;background:#c8e6c9\">νηστεύομεν<\/td>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;background:#eee\"><\/td>\n<\/tr>\n<tr>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;font-weight:bold;position:sticky;left:0;background:#f5f5f5\">ℵ² C D L W Byz<\/td>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;background:#ffe0b2\">νηστεύομεν<\/td>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;background:#ffe0b2\">πολλά<\/td>\n<\/tr>\n<tr>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;font-weight:bold;position:sticky;left:0;background:#f5f5f5\">ℵ¹ it vg<\/td>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;background:#ffcdd2\">νηστεύομεν<\/td>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;background:#ffcdd2\">πυκνά<\/td>\n<\/tr>\n<\/table>\n<\/div>\n\n<h3 style=\"color: #424242; margin-bottom: 15px;\">Mateo 9:34 - Inclusión/Omisión del versículo<\/h3>\n<div style=\"overflow-x:auto; margin-bottom: 30px;\">\n<table style=\"border-collapse:collapse;font-family:'Courier New',monospace;font-size:14px;white-space:nowrap;width:100%;\">\n<tr style=\"background:#1a237e;color:white\">\n  <th style=\"padding:8px 12px;border:1px solid #444;position:sticky;left:0;background:#1a237e;z-index:1\">Manuscritos<\/th>\n  <th style=\"padding:8px 12px;border:1px solid #444\">Versículo 34<\/th>\n<\/tr>\n<tr>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;font-weight:bold;position:sticky;left:0;background:#f5f5f5\">ℵ B C L W Θ Byz<\/td>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;background:#c8e6c9\">ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια<\/td>\n<\/tr>\n<tr>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;font-weight:bold;position:sticky;left:0;background:#f5f5f5\">D it syrs<\/td>\n  <td style=\"padding:8px 12px;border:1px solid #ddd;background:#ffe0b2\">omite versículo completo<\/td>\n<\/tr>\n<\/table>\n<\/div>\n\n<div style=\"margin: 20px 0; padding: 15px; background: #e3f2fd; border-left: 4px solid #1976d2; border-radius: 4px;\">\n<p style=\"margin: 0; font-size: 14px;\"><strong>Leyenda:<\/strong> \n<span style=\"background: #c8e6c9; padding: 2px 6px; border-radius: 3px; margin: 0 5px;\">Verde = Lectura preferida (NA28)<\/span>\n<span style=\"background: #ffe0b2; padding: 2px 6px; border-radius: 3px; margin: 0 5px;\">Naranja = Lectura alternativa<\/span>\n<span style=\"background: #ffcdd2; padding: 2px 6px; border-radius: 3px; margin: 0 5px;\">Rosa = Lectura minoritaria<\/span>\n<span style=\"background: #eee; padding: 2px 6px; border-radius: 3px; margin: 0 5px;\">Gris = Omisión<\/span>\n<\/p>\n<\/div>\n\n<h2 style=\"color: #1565c0; margin-top: 40px; margin-bottom: 20px; font-size: 1.5em;\">2. VEREDICTO CRÍTICO<\/h2>\n\n<div style=\"background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px;\">\n<h3 style=\"color: #2e7d32; margin-top: 0;\">Mateo 9:4 - καὶ ἰδών (ORIGINAL)<\/h3>\n<div style=\"background: #4caf50; height: 20px; width: 85%; border-radius: 10px; margin: 10px 0; position: relative;\">\n<span style=\"position: absolute; right: 10px; top: 2px; color: white; font-size: 12px; font-weight: bold;\">85% Confianza<\/span>\n<\/div>\n<p><strong>Razón:<\/strong> Apoyo manuscrito superior (ℵ C D L W), lectio difficilior (ἰδών es más común que εἰδώς), coherencia con el estilo mateano.<\/p>\n<\/div>\n\n<div style=\"background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px;\">\n<h3 style=\"color: #2e7d32; margin-top: 0;\">Mateo 9:8 - ἐφοβήθησαν (ORIGINAL)<\/h3>\n<div style=\"background: #4caf50; height: 20px; width: 90%; border-radius: 10px; margin: 10px 0; position: relative;\">\n<span style=\"position: absolute; right: 10px; top: 2px; color: white; font-size: 12px; font-weight: bold;\">90% Confianza<\/span>\n<\/div>\n<p><strong>Razón:<\/strong> Testimonio alejandrino fuerte (ℵ B), lectio difficilior (temor es más específico que admiración), coherencia teológica.<\/p>\n<\/div>\n\n<div style=\"background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px;\">\n<h3 style=\"color: #2e7d32; margin-top: 0;\">Mateo 9:14 - νηστεύομεν (sin adverbio) (ORIGINAL)<\/h3>\n<div style=\"background: #4caf50; height: 20px; width: 75%; border-radius: 10px; margin: 10px 0; position: relative;\">\n<span style=\"position: absolute; right: 10px; top: 2px; color: white; font-size: 12px; font-weight: bold;\">75% Confianza<\/span>\n<\/div>\n<p><strong>Razón:<\/strong> Testimonio de ℵ* B, tendencia escribal a añadir intensificadores, brevitas preferenda.<\/p>\n<\/div>\n\n<div style=\"background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px;\">\n<h3 style=\"color: #2e7d32; margin-top: 0;\">Mateo 9:34 - Incluir versículo (ORIGINAL)<\/h3>\n<div style=\"background: #4caf50; height: 20px; width: 95%; border-radius: 10px; margin: 10px 0; position: relative;\">\n<span style=\"position: absolute; right: 10px; top: 2px; color: white; font-size: 12px; font-weight: bold;\">95% Confianza<\/span>\n<\/div>\n<p><strong>Razón:<\/strong> Apoyo manuscrito abrumador, omisión en D probablemente por homoioteleuton, coherencia narrativa.<\/p>\n<\/div>\n\n<h2 style=\"color: #1565c0; margin-top: 40px; margin-bottom: 20px; font-size: 1.5em;\">3. MANUSCRITOS PRINCIPALES<\/h2>\n\n<div style=\"overflow-x: auto;\">\n<table style=\"width: 100%; border-collapse: collapse; margin-bottom: 30px;\">\n<tr style=\"background: #1a237e; color: white;\">\n<th style=\"padding: 12px; border: 1px solid #ddd; text-align: left;\">Sigla<\/th>\n<th style=\"padding: 12px; border: 1px solid #ddd; text-align: left;\">Fecha<\/th>\n<th style=\"padding: 12px; border: 1px solid #ddd; text-align: left;\">Origen<\/th>\n<th style=\"padding: 12px; border: 1px solid #ddd; text-align: left;\">Enlace<\/th>\n<\/tr>\n<tr>\n<td style=\"padding: 12px; border: 1px solid #ddd; font-weight: bold;\">ℵ (Sinaiticus)<\/td>\n<td style=\"padding: 12px; border: 1px solid #ddd;\">s. IV<\/td>\n<td style=\"padding: 12px; border: 1px solid #ddd;\">Egipto/Sinaí<\/td>\n<td style=\"padding: 12px; border: 1px solid #ddd;\"><a href=\"http://codexsinaiticus.org\" style=\"color: #1976d2;\">codexsinaiticus.org<\/a><\/td>\n<\/tr>\n<tr style=\"background: #f9f9f9;\">\n<td style=\"padding: 12px; border: 1px solid #ddd; font-weight: bold;\">B (Vaticanus)<\/td>\n<td style=\"padding: 12px; border: 1px solid #ddd;\">s. IV<\/td>\n<td style=\"padding: 12px; border: 1px solid #ddd;\">Egipto<\/td>\n<td style=\"padding: 12px; border: 1px solid #ddd;\"><a href=\"https://digi.vatlib.it/view/MSS_Vat.gr.1209\" style=\"color: #1976d2;\">Biblioteca Vaticana<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"padding: 12px; border: 1px solid #ddd; font-weight: bold;\">C (Ephraemi)<\/td>\n<td style=\"padding: 12px; border: 1px solid #ddd;\">s. V<\/td>\n<td style=\"padding: 12px; border: 1px solid #ddd;\">Egipto<\/td>\n<td style=\"padding: 12px; border: 1px solid #ddd;\"><a href=\"https://gallica.bnf.fr/ark:/12148/btv1b8470433b\" style=\"color: #1976d2;\">Gallica BnF<\/a><\/td>\n<\/tr>\n<tr style=\"background: #f9f9f9;\">\n<td style=\"padding: 12", "manuscripts": {"P45": {"name": "Papiro 45 (Chester Beatty I)", "date": "c. 250", "year": 250, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Fayum, Egipto", "dlat": 29.3, "dlng": 30.8, "disc_date": "1930", "content": "Fragmentos de los 4 Evangelios y Hechos", "type": "Mixto/Libre", "location": "Chester Beatty Library, Dublín", "desc": "Uno de los papiros más antiguos del NT. El escriba tiende a abreviar y parafrasear el texto. Contiene porciones de Mt, Mc, Lc, Jn y Hch.", "reliability": "Texto libre/parafrastico. Valioso por antigüedad pero el escriba toma libertades. Importante para establecer que los 4 evangelios circulaban juntos en el s.III.", "validators": "Frederic Kenyon (editio princeps 1933-1937), Kurt Aland (clasificación)"}, "P46": {"name": "Papiro 46 (Chester Beatty II)", "date": "c. 200", "year": 200, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Fayum, Egipto", "dlat": 29.3, "dlng": 30.8, "disc_date": "1930", "content": "Epístolas paulinas (Rom, Heb, 1-2 Cor, Ef, Gal, Fil, Col, 1 Tes)", "type": "Alejandrino", "location": "Chester Beatty Library + Univ. Michigan", "desc": "El testimonio más antiguo de las cartas de Pablo. Incluye Hebreos entre Romanos y 1 Corintios, sugiriendo que se consideraba paulina. Faltan las Pastorales.", "reliability": "Altamente confiable. Texto alejandrino temprano. Su antigüedad (c.200) lo hace crucial para reconstruir el texto original paulino.", "validators": "Frederic Kenyon (1936), Günther Zuntz (The Text of the Epistles, 1953)"}, "P66": {"name": "Papiro 66 (Bodmer II)", "date": "c. 200", "year": 200, "origin": "Egipto", "olat": 26.1, "olng": 32.7, "disc_place": "Panópolis (Akhmim), Egipto", "dlat": 26.6, "dlng": 31.7, "disc_date": "1952", "content": "Evangelio de Juan (casi completo, 1:1-6:11, 6:35-14:26)", "type": "Mixto (Alejandrino/Occidental)", "location": "Fundación Bodmer, Cologny (Ginebra)", "desc": "Uno de los testimonios más antiguos del Evangelio de Juan. Contiene correcciones del mismo escriba, mostrando el proceso de copia. Texto mixto entre alejandrino y occidental.", "reliability": "Muy confiable por antigüedad. Las autocorrecciones del escriba muestran cuidado textual. Confirma la existencia temprana del texto joánico.", "validators": "Victor Martin (editio princeps 1956), Gordon Fee (análisis textual 1968)"}, "P75": {"name": "Papiro 75 (Bodmer XIV-XV)", "date": "c. 175-225", "year": 190, "origin": "Egipto", "olat": 26.1, "olng": 32.7, "disc_place": "Panópolis (Akhmim), Egipto", "dlat": 26.6, "dlng": 31.7, "disc_date": "1952", "content": "Lucas 3-24 y Juan 1-15", "type": "Alejandrino", "location": "Biblioteca Vaticana (donado 2007)", "desc": "El papiro más cercano al Codex Vaticanus (B). Demuestra que el texto alejandrino NO es una revisión tardía sino que existía ya en el s.II. Escriba muy cuidadoso.", "reliability": "Extremadamente confiable. Considerado el mejor testigo temprano del texto alejandrino. Su concordancia con B (s.IV) prueba la estabilidad de esta tradición textual.", "validators": "Victor Martin y Rodolphe Kasser (1961), Carlo Martini (análisis 1966), Kurt Aland"}, "ℵ": {"name": "Codex Sinaiticus (Aleph/01)", "date": "c. 330-360", "year": 345, "origin": "Cesarea o Egipto", "olat": 31.2, "olng": 34.3, "disc_place": "Monasterio de Santa Catalina, Sinaí", "dlat": 28.5, "dlng": 33.9, "disc_date": "1844-1859", "content": "NT completo + gran parte del AT (LXX) + Epístola de Bernabé + Pastor de Hermas", "type": "Alejandrino", "location": "British Library, Londres", "desc": "Descubierto por Constantin von Tischendorf en el Monasterio de Santa Catalina (Sinaí). Es el único manuscrito uncial con el NT completo. Incluye libros que luego no entraron al canon (Bernabé, Hermas). Tiene múltiples correctores de diferentes siglos.", "reliability": "Altamente confiable. Uno de los dos pilares del texto alejandrino (junto con B). Su NT completo lo hace indispensable. Las correcciones posteriores muestran la historia de la transmisión textual.", "validators": "Tischendorf (editio princeps 1862), Kirsopp Lake (facsímil 1911), Milne & Skeat (Scribes and Correctors, 1938), D.C. Parker (Codex Sinaiticus Project, 2009)"}, "B": {"name": "Codex Vaticanus (03)", "date": "c. 325-350", "year": 340, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Biblioteca Vaticana (registrado desde 1475)", "dlat": 41.9, "dlng": 12.5, "disc_date": "antes de 1475", "content": "AT (LXX) + NT hasta Hebreos 9:14 (faltan Pastorales, Filemón, Apocalipsis)", "type": "Alejandrino", "location": "Biblioteca Apostólica Vaticana, Roma", "desc": "Considerado por muchos el manuscrito más importante del NT. Texto alejandrino puro y consistente. En la Biblioteca Vaticana desde al menos 1475 pero no fue accesible a eruditos hasta el s.XIX. Tischendorf solo pudo verlo brevemente.", "reliability": "El más confiable según la mayoría de críticos textuales. Su concordancia con P75 (s.II) demuestra que preserva un texto muy antiguo. Base principal del texto NA28/UBS5.", "validators": "Carlo Vercellone (1868), Tischendorf (colación 1867), Kurt Aland, Bruce Metzger, Bart Ehrman"}, "A": {"name": "Codex Alexandrinus (02)", "date": "c. 400-440", "year": 420, "origin": "Egipto o Constantinopla", "olat": 31.2, "olng": 29.9, "disc_place": "Donado al rey Carlos I de Inglaterra", "dlat": 51.5, "dlng": -0.1, "disc_date": "1627", "content": "AT + NT casi completos (faltan partes de Mt, Jn, 2 Cor). Incluye 1-2 Clemente", "type": "Bizantino (Evangelios), Alejandrino (resto)", "location": "British Library, Londres", "desc": "Donado por el Patriarca de Constantinopla Cirilo Lukaris al rey Carlos I en 1627. Texto bizantino en los Evangelios pero alejandrino en Hechos, Epístolas y Apocalipsis. Mejor testigo del Apocalipsis.", "reliability": "Confiable pero con distinción: en Evangelios refleja texto bizantino (secundario), en el resto es alejandrino (primario). Crucial para el Apocalipsis donde B no existe.", "validators": "Patrick Young (primer editor parcial, 1633), Frederic Kenyon (facsímil 1909), Kurt Aland"}, "C": {"name": "Codex Ephraemi Rescriptus (04)", "date": "c. 450", "year": 450, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Biblioteca Nacional de Francia", "dlat": 48.8, "dlng": 2.3, "disc_date": "s. XVII", "content": "Fragmentos de AT y NT (palimpsesto)", "type": "Mixto", "location": "Bibliothèque nationale de France, París", "desc": "Palimpsesto: el texto bíblico fue borrado en el s.XII y reescrito con sermones de Efrén el Sirio. Tischendorf logró descifrar el texto inferior con reactivos químicos (1840-1845). Solo sobrevive ~60% del NT.", "reliability": "Moderadamente confiable. Texto mixto. Valioso donde otros testigos faltan. El proceso de desciframiento introduce incertidumbre en algunas lecturas.", "validators": "Tischendorf (editio princeps 1843-1845), Robert Lyon (1959)"}, "D": {"name": "Codex Bezae (05)", "date": "c. 400", "year": 400, "origin": "Sur de Francia o Norte de África", "olat": 43.6, "olng": 3.9, "disc_place": "Donado por Teodoro de Beza a Cambridge", "dlat": 52.2, "dlng": 0.1, "disc_date": "1581", "content": "Evangelios + Hechos (bilingüe griego-latín)", "type": "Occidental", "location": "Cambridge University Library", "desc": "Manuscrito bilingüe (griego-latín) con el texto occidental más importante. En Hechos es ~10% más largo que el alejandrino, con adiciones narrativas únicas. Muchas lecturas singulares que no aparecen en ningún otro manuscrito.", "reliability": "Controversial. Preserva tradiciones muy antiguas (s.II) pero también contiene armonizaciones y expansiones. Valioso como testigo independiente del texto occidental. No se usa como base pero sus lecturas se consideran caso por caso.", "validators": "Teodoro de Beza (donación 1581), F.H.A. Scrivener (1864), J. Rendel Harris (1891), D.C. Parker (Codex Bezae, 1992)"}, "W": {"name": "Codex Washingtonianus (032)", "date": "c. 400-450", "year": 425, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Comprado por Charles Freer en Egipto", "dlat": 38.9, "dlng": -77.0, "disc_date": "1906", "content": "Evangelios", "type": "Mixto (varía por sección)", "location": "Smithsonian Institution, Washington D.C.", "desc": "Texto que cambia de carácter según la sección (alejandrino en Lc 1:1-8:12, occidental en Mc 1:1-5:30, bizantino en Mt). Contiene el \"Logion de Freer\" después de Mc 16:14, una adición única.", "reliability": "Confiable pero complejo. Cada sección debe evaluarse según su tipo textual. El cambio de tipo sugiere que fue copiado de múltiples ejemplares.", "validators": "Henry Sanders (editio princeps 1912), Larry Hurtado (Text-Critical Methodology, 1981)"}, "TR": {"name": "Textus Receptus", "date": "1516-1633", "year": 1516, "origin": "Basilea, Suiza", "olat": 47.6, "olng": 7.6, "disc_place": "Publicado por Erasmo de Rotterdam", "dlat": 47.6, "dlng": 7.6, "disc_date": "1516", "content": "NT completo (texto impreso, no manuscrito)", "type": "Bizantino tardío", "location": "Múltiples ediciones", "desc": "No es un manuscrito sino un texto impreso. Erasmo lo compiló en 1516 basándose en unos pocos minúsculos tardíos (s.XII-XIII) disponibles en Basilea. El nombre \"Textus Receptus\" viene de la edición Elzevir de 1633. Base de la KJV y la RVR antigua.", "reliability": "Superado por la crítica textual moderna. Se basa en manuscritos tardíos y en algunos lugares Erasmo retrotradujo del latín al griego. Sin embargo, en la gran mayoría del texto coincide con manuscritos más antiguos.", "validators": "Erasmo de Rotterdam (1516), Robert Estienne/Stephanus (1550), Elzevir (1633). Criticado por Westcott-Hort (1881), defendido parcialmente por Maurice Robinson (Byzantine Priority)"}}, "greek_commentaries": {"1": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:1] . ἐμβὰς : Jesus complied with the request of the men of Gerasa, who had intimated so plainly that they did not want any more of His company. Whatever His purpose in crossing over to the eastern shore may have been, it was frustrated by an event which in some respects was an unexpected disaster. Was it rest only or a new sphere of work He was seeking there? vide notes on Mark. εἰς τ . ἰδίαν π .: entering the boat which had been moored to the shore, Jesus returned with His disciples to His own city, to distinguish it from Gerasa, the city that shut its gates against Him; so named here only. When precisely the following incident happened cannot be ascertained. Luke&rsquo;s indication of time is the vaguest possible; &ldquo;on one of the days&rdquo;. Matthew and Mark give it in different sequence, but their narratives have this in common, that they make the incident occur on arrival in Capernaum after an excursion; in either case the first mentioned, though not the same in both. Vide notes on Mark."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "18 9:1. ] JESUS CROSSES THE LAKE. INCIDENTS BEFORE EMBARKING. HE STILLS THE STORM. HEALING OF TWO DÆMONIACS IN THE LAND OF THE GADARENES. [Mark 4:35-41] ; [Mark 5:1-20] . [Luke 9:57-60] ; [Luke 8:22-39] , on which passages compare the notes."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 9:1] ff. [Mark 2:1] ff., [Luke 5:17] ff., introduce the account somewhat earlier. Matthew reports, briefly and simply, only the essential points, following, it may be, an older form of the tradition. Τὴν ἰδίαν πόλιν ] Kapernaum ; ἣ μὲν γὰρ ἤνεγκεν αὐτὸν ἡ Βηθλέεμ · ἣ δὲ ἔθρεψεν ἡ Ναζαρέτ · ἣ δὲ εἶχεν οἰκοῦντα Καπερναούμ , Chrysostom. See [Matthew 4:13] ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:1] . Διεπέρασε , He crossed over ) Being asked to do so by the Gergesenes. The Lord does not force His blessings on the unwilling. [390] ἰδίαν , His own ) sc. Capernaum, exalted by this inhabitant. [390] And by that very fact He excited in men the more ardent desires after Him, inasmuch as He did not make too long delays in the one place. Harm. , 1. c."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "His own city ( την ιδιαν πολιν ). Capernaum ([Mark 2:1]; [Matthew 4:13])."}], "2": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:2] . καὶ ἰδοὺ : usual formula for introducing an important incident. προσέφερον , t

he imperfect, implying a process, the details of which, extremely interesting, the evangelist does not give. By comparison with Mark and Luke the narrative is meagre, and defective even for the purpose of bringing out the features to which the evangelist attaches importance, e.g. , the value set by Jesus on the faith evinced. His eye is fixed on the one outstanding novel feature, the word of Jesus in [Matthew 9:6] . In view of it he is careful, while omitting much, to mention that the invalid in this instance was brought to Jesus, ἐπὶ κλίνης βεβλημένον , lying on a couch. To the same cause also it is due that a second case of paralysis cured finds a place in this collection, though the two cases have different features: in the one physical torments, in the other mental depression. πίστιν αὐτῶν , the faith of the men who had brought the sick man to Him. The common assumption that the sick man is included in the αὐτῶν is based on dogmatic grounds. θάρσει τέκνον : with swift sure diagnosis Jesus sees in the man not faith but deep depression, associated probably with sad memories of misconduct, and uttering first a kindly hope-inspiring word, such as a physician might address to a patient: cheer up, child! He deals first with the disease of the soul. ἀφίενται : Jesus declares the forgiveness of his sins, not with the authority of an exceptional person, but with sympathy and insight, as the interpreter of God&rsquo;s will and the law of the universe. That law is that past error need not be a doom; that we may take pardon for granted; forgive ourselves, and start anew. The law holds, Jesus believed, both in the physical and in the moral sphere. In combining pardon with healing of bodily disease in this case, He was virtually announcing a general law. &ldquo;Who forgiveth all thine iniquities , who healeth all thy diseases ,&rdquo; [Psalms 103:3] ."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "2. τὴν πίστιν αὐτ . ] Namely, in letting him down through the roof, because the whole house and space round the door was full, [Mark 2:4] . αὐτῶν must be supposed to include the sick man, who was at least a consenting party to the bold step which they took. These words are common to the three Evangelists, as also ἀφέωνταί σου (or σοι ) αἱ ἁμ . Neander (Leben Jesu, pp. 431, 432) has some excellent remarks on this man&rsquo;s disease. Either it was the natural consequence of sinful indulgence, or by its means the feeling of sinfulness and guilt was more strongly aroused in him, and he recognized the misery of his disease as the punishment of his sins. At all events spiritual and bodily pain seem to have been connected and interchanged within him, and the former to have received accession of strength from the presence of the latter. Schleiermacher (on St. Luke, p. 80) supposes the haste of these bearers to have originated in the prospect of our Lord&rsquo;s speedy departure thence; but, as Neander observes, we do not know enough of the paralytic&rsquo;s own state to be able to say whether there may not have been some cause for it in the man himself. ἀφέωνται ] Winer remarks (§ 14. 3), &lsquo;The old grammarians themselves were divided about this word some, as Eustathius, (Il. π . 590,) treat it as identical with ἀφῶνται , as in Homer ἀφέῃ for ἀφῇ : others, more correctly, take it for the preterite (= ἀφεῖνται ), e.g. Herodian, the Etymologicon, and Suidas, with this difference however, that Suidas believes it to be a Doric, the author of the Etym. an Attic form; the former is certainly right, and this perfect-passive form is cognate with the perf.-act. ἀφέωκα .&rsquo;"}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:2] . Προσέφερον Αὐτῷ , they brought to Him ) Many such offerings were made to the Saviour, and they were pleasing to Him. τὴν πίστιν αὐτῶν , their faith) i.e. of him who was borne, and of them who bare him. θάρσει , τέκνον , Son, be of good cheer [391] ) &ldquo;Neither thy sins nor thy disease shall stand in thy way.&rdquo; Thus, at [Matthew 9:22] , θάρσει , θύγατερ , daughter, be of good comfort. &ldquo;Be of good comfort ;&rdquo; neither thy sins shall prevail against thee, nor thy disease. Thus also, &ldquo; Be of good comfort, daughter ,&rdquo; in [Matthew 9:22] . ἀφέωνταί σοι , are forgiven thee ) Without doubt, great was the sense of great sins in that man. [392] σοὶ has here both emphasis and accent, but in Mat 9:5 the same words are repeated after the manner of a quotation, and ΣΟΙ or ΣΟΥ is enclitic. [393] [391] The word used by Bengel is &ldquo; confide &rdquo;, which is repeated each time in the remarks which follow. (I. B.) [392] This was the principal benefit, by occasion of which chiefly the thoughts of the men present there were thrown open and made manifest, [Matthew 9:3] ; [Matthew 9:8] . Harm . p. 276. [393] Never had that voice been heard put forth in this way, from the time that the earth had borne men on it. V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "They brought ( προσεφερον ). Imperfect, \"were bringing,\" graphic picture made very vivid by the details in [Mark 2:1-4] and [Luke 5:17]. \" Lying on a bed \" (stretched on a couch), perfect passive participle, a little bed or couch ( κλινιδιον ) in [Luke 5:19], \"a pallet\" ( κραβατος ) in [Mark 2:4]; [Mark 2:9]; [Mark 2:11]. Thy sins are forgiven ( αφιεντα ). Present passive indicative (aoristic present). Luke ([Luke 5:21]) has αφεωντα , Doric and Ionic perfect passive indicative for the Attic αφειντα , one of the dialectical forms appearing in the Koine."}], "3": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:3] . τινὲς τ . γραμματέων : some scribes present on this occasion. Ominous fact duly introduced by ἰδοὺ ; its significance still more distinctly recognised by Luke, who gives it prominent mention at the beginning of his narrative ([Matthew 9:17] ). Sure sign of the extent, depth, and quality of Christ&rsquo;s influence. βλασφημεῖ : of course; the prophet always is a scandalous, irreverent blasphemer from the conventional point of view. The scribes regarded forgiveness purely under the aspect of prerogative, and in self-defence Jesus must meet them on their own ground. His answer covers the whole case. There is more than prerogative in the matter; there is the right, duty, privilege, and power of every man to promote faith in pardon by hearty proclamation of the law of the moral world. This is dealt with first."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:3] . εἶπον ἐν ἑαυτοῖς , οὗτος βλασφημεῖ , said within themselves, this man blasphemeth ) Blasphemy is committed when (1.) things unworthy of God are attributed to Him; (2.) things worthy of God are denied to Him; (3.) when the incommunicable attributes of God are attributed to others."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "This man blasphemeth ( ουτος βλασφημε ). See the sneer in \"this fellow.\" \"The prophet always is a scandalous, irreverent blasphemer from the conventional point of view\" (Bruce)."}], "4": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:4] . ἐνθυμήσεις : Jesus intuitively read their thoughts as He read the mental state of the sick man. ἵνα τί : elliptical for ἵνα τί γένηται understood = in order that what may happen, do you, etc. ( vide Bäumlein, Schul. Gram. , § 696, and Goodwin&rsquo;s Syn. , § 331)."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "4. ἰδών ] By the spiritual power indwelling in Him. See [John 2:24-25] . No other interpretation of such passages is admissible. St. Mark&rsquo;s expression, ἐπιγνοὺς τῷ πνεύματι αὐτοῦ , is more precise and conclusive. So we have ἐνεβριμήσατο τῷ πνεύματι , [John 11:33] , synonymous with ἐμβριμώμενος ἐν ἑαυτῷ , ibid. [Matthew 9:33] . ἴνα τί supply γένηται : see Klotz on Devarius, pp. 631 2: so Plut. Apol. p. 26 C, ἵνα τί ταῦτα λέγεις ; From τί γὰρ … οἶκόν σου is common (nearly verbatim) to the three Evangelists."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 9:4] . The power to discern the thoughts and intentions of others (comp. on [Matthew 9:3] ) was a characteristic mark of the expected Messiah (Wetstein), was present in Jesus in virtue of His nature as the God-man, and analogous to His miraculous power. ἱνατί ] why? that is to say, ἵνα τί γένηται ; Hermann, ad Vig . p. 849; Klotz, ad Devar . p. 631 f. πονηρά ] inasmuch, that is, as you regard me as a blasphemer, and that with a malicious intention; whereas the sick man, and those who carried him, were full of faith. In contrast to them is the emphatic ὑμεῖς ( you people! ), which, being ignored by important authorities, is deleted by Tischendorf 8."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:4] . Εἰδὼς , knowing ) Besides many Greek codices, which Mill first began to notice on this passage, the Gothic version and the margin of Courcelles reads thus. ἰδὼν [394] appears to have been introduced by some persons from [Matthew 9:2] . St Mark and St Luke have ἐπιγνοὺς in the parallel passages. Thus too we find ΕἸΔῺς in ch. [Matthew 12:25] . ὙΜΕῖς , you ) The pronoun is expressed for the sake of emphasis. [395] [394] Lachmann reads εἰδῶς with B, Goth. Vers, and probably a . D bc and Rec. Text read ἰδὼν . Vulg. &ldquo; Cum vidisset .&rdquo; ED. [395] Often one, whilst he is arraigning others for their sins, is sinning himself. And indeed the most heinous sins can be committed even in the heart alone. V. g."}], "5": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:5] . εὐκοπώτερον (from εὖ and κόπος , whence εὔκοπος ; in N.T. (Gospels) only the comparative neuter is found, as here). The question as to ability, δύναμις , is first disposed of; which is easier εἰπεῖν : they are both alike easy to say ; the vital matter is saying with effect. Saying here stands for doing. And to do the one thing was to do the other. To heal was to forgive. It is implied that it is easier to forgive than to make a palsied man strong. Christ means that the one is ordinary, the other extraordinary; the one is within the power of any man, the other belongs only to the exceptional man; there is no assumption in declaring pardon, there is pretension in saying &ldquo;arise and walk&rdquo;."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "5. τί γάρ ἐστιν εὐκ . ] &ldquo;In our Lord&rsquo;s argument it must be carefully noted, that He does not ask, which is easiest , to forgive sins , or to raise a sick man for it could not be affirmed that that of forgiving was easier than this of healing but, which is easiest, to claim this power or that, to say Thy sins be forgiven thee, or to say , Arise and walk? That (i.e. the former) is easiest, and I will now prove my right to say it, by saying with effect and with an outward consequence setting its seal to my truth, the harder word, Arise and walk. By doing that which is capable of being put to the proof, I will vindicate my right and power to do that which in its very nature is incapable of being proved. By these visible tides of God&rsquo;s grace I will give you to know in what direction the great under-currents of His love are setting, and that both are obedient to My word. From this, which I will now do openly and before you all, you may conclude that it is &lsquo;no robbery&rsquo; ([Philippians 2:6] , but see note there) upon my part to claim also the power of forgiving men their sins.&rdquo; Trench on the Miracles, p. 206."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 9:5] . Γάρ ] gives a reason for the thought expressed in the preceding question, the thought, namely, that they were not justified in thinking evil of Him. τί ἐστιν εὐκοπώτερον ] The meaning is unquestionably this; the latter is quite as easy to say as the former, and conversely; the one requires no less power than the other; the same divine ἐξουσία enables both to be done; but in order that you may know that I was entitled to say the one, I will now add the other also: Arise, and so on. The result of the latter was accordingly the actual justification of the former. For τί in the sense of πότερον , comp. Stallbaum, ad Plat. Phil . p. 168. ἔγειρε (see the critical remarks) is not a mere interjection, like ἄγε , ἔπειγε (Fritzsche, ad Marc . p. 55 f.), seeing that it is followed by καί , and that the circumstance of the arising has an essential connection with the incident (see [Matthew 9:2] , ἐπὶ κλίν . βεβλημένον ; comp. [Matthew 20:6-7] ); but the transitive is used intransitively (Kühner, II. 1, p. 81 ff.), as is frequently the case, especially in verbs denoting haste (Bernhardy, p. 340). Eur. Iph. A . 624: ἔγειρʼ ἀδελφῆς ἐφʼ ὑμέναιον εὐτυχῶς ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:5] . Τί γὰρ , for which? ) In itself either is the sign of Divine authority and power; and the connection between sin and disease is in itself most close: the power which removes both is one. According to human judgment, it is easier to say, &ldquo; Thy sins are remitted ;&rdquo; and he who can say &ldquo; Arise ,&rdquo; which appears greater, can also say this, which appears less."}], "6": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:6] . ἵνα δὲ εἰδῆτε : transition to the other aspect, that of ἐξουσία , the point raised by the scribes when they looked a charge of blasphemy. ὁ υἱὸς τοῦ ἀν ., ἐπὶ τῆς γῆς : these two phrases point at supposed disabilities for forgiving. &ldquo;Forgiveness takes place in heaven, and is the exclusive prerogative of God,&rdquo; was the thesis of the scribes. &ldquo;It may be exercised even on earth, and by the Son of Man,&rdquo; is the counter thesis of Christ. Therefore &ldquo;Son of Man&rdquo; must be a title not of dignity but of humiliation. Here = one whom ye think lightly of; even He can forgive. τότε λέγει . Jesus stops short in His speech to the scribes and turns to the sick man, saying: ἔγειρε , etc., also in [Matthew 9:6] , intransitive. The reading ἔγειραι in T.R., [Matthew 9:6] , is a correction of style, the use of the active intransitively being condemned by grammarians. Hence this various reading always occurs. ( vide Suidas, s.v., and Buttmann, Gramm. , p. 56.) τὴν κλίνην , a light piece of furniture, easily portable. ὕπαγε : all three actions, arising, lifting, walking , conclusive evidence of restored power."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "6. ὁ υἱ . τ . ἀνθ . ] The Messiah: an expression regarded by the Jews as equivalent to ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ , ch. [Matthew 26:63] . See also [John 5:27] . &ldquo;The Alexandrian Fathers, in their conflict with the Nestorians, made use of this passage in proof of the entire transference which there was of all the properties of Christ&rsquo;s divine nature to His human; so that whatever one had, was so far common, that it might also be predicated of the other. It is quite true that had not the two natures been indissolubly knit together in a single Person, no such language could have been used; yet I should rather suppose that &lsquo;Son of Man&rsquo; being the standing title whereby the Lord was well pleased to designate Himself, bringing out by it that He was at once one with humanity, and the crown of humanity, He does not so use it that the title is every where to be pressed, but at times simply as equivalent to Messiah.&rdquo; Trench, p. 208. ἐπὶ τῆς γῆς ] Distinguished from ἐν τῷ οὐρανῷ , as in ch. [Matthew 16:19] ; [Matthew 18:18] . Bengel finely remarks, &ldquo;Cœlestem ortum hic sermo sapit.&rdquo; The Son of Man, as God manifest in man&rsquo;s flesh, has on man&rsquo;s earth that power, which in its fountain and essence belongs to God in heaven. And this not by delegation, but &ldquo;because He (being God) is the Son of Man.&rdquo; [John 5:27] . τότε λέγει ] See a similar interchange of the persons in construction, [Genesis 3:22-23] . τότε λέγει τῷ π . is not parenthetic, nor is ἵνα δὲ εἰδῆτε κ . τ . λ . an elliptic sentence; but the speech and narrative are intermixed. A simple construction would require either ἵνα δὲ εἰδῆτε . … ὧδε λέγω τῷ παρ …, or ἵνα δὲ εἰδῶσιν … τότε λέγει … We have, in the text, the first member of the former construction joined with the second of the latter."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:6] . Εἰδῆτε , ye may know ) This word also breathes authority . [396] ἐπὶ τῆς γῆς , on earth ) This is exclusively the place where sins are committed and remitted. Earth was the scene of Christ&rsquo;s works from the beginning. [397] See [Proverbs 8:31] ; cf. the two clauses in [Psalms 16:3] ; see [398] [Jeremiah 9:24] ; [John 17:4] ; [Luke 2:14] . I have, says He, all authority in heaven, much more on earth; see ch. [Matthew 16:19] , [Matthew 28:18] . [399] This speech savours of a heavenly origin. ἐξουσίαν , authority ) The argument from power to authority holds good in this passage. λέγει , He saith ) A similar change of person between the protasis and apodosis occurs in [Numbers 5:20-21] , and [Jeremiah 5:14] . [396] Bengel just below translates ἐξουσίαν (rendered in E. V. power ) by &ldquo; authority ,&rdquo; and refers to it by anticipation. (I. B.) [397] Nay more, it is the wrestling arena between sin and grace. V. g. [398] E. B. inserts here &ldquo;[Genesis 6:5] ,&rdquo; which has been adopted by the later editions. (I. B.) [399] We also in our turn may now say: Seeing that He had that power, when sojourning on the earth, why should He not also have the same, now that He has been raised from the dead and taken up into heaven? [Acts 5:31] . V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "That ye may know ( ινα ειδητε ). Jesus accepts the challenge in the thoughts of the scribes and performs the miracle of healing the paralytic, who so far only had his sins forgiven, to prove his Messianic power on earth to forgive sins even as God does. The word εξουσια may mean either power or authority. He had both as a matter of fact. Note same word in [Matthew 9:8]. Then saith he to the sick of the palsy ( τοτε λεγε τω παραλυτικω ). These words of course, were not spoken by Jesus. Curiously enough Matthew interjects them right in the midst of the sayings of Jesus in reply to the scorn of the scribes. Still more remarkable is the fact that Mark ([Mark 2:10]) has precisely the same words in the same place save that Matthew has added τοτε , of which he is fond, to what Mark already had. Mark, as we know, largely reports Peter's words and sees with Peter's eyes. Luke has the same idea in the same place without the vivid historical present λεγε (ειπεν τω παραλελυμενωι) with the participle in place of the adjective. This is one of the many proofs that both Matthew and Luke made use of Mark's Gospel each in his own way. Take up thy bed ( αρον σου την κλινην ). Pack up at once (aorist active imperative) the rolled-up pallet."}], "7": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:7] . aid, done; a convincing argumentum ad hominem . Who would dispute the right to forgive to one who could do that, or persist in the charge of blasphemy against Him? At least those who do will get little sympathy from the mass of spectators."}], "8": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:8] . ἰδόντες οἱ ὄχλοι . The people are free from the petty jealousies and pedantic theories of the professional class; broad facts settle the matter for them. They probably had no scruples about the forgiving, but if they, had the miracle would put an end to them: the manifest authority and power a witness of the non-apparent ( ποιεῖται τὴν φανερὰν [ ἐξουσίαν ] τεκμήριον τῆς ἀφανοῦς . Euthy.). ἐφοβήθησαν , they feared; may point to a change of mind on the part of some who at first were influenced by the disapproving mood of the scribes. The solemn frown of those who pass for saints and wise men is a formidable thing, making many cowards. But now a new fear takes the place of the old, perhaps not without a touch of superstition."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "8. τοῖς ἀνθρώποις ] Not plur. for sing. &lsquo; to a man ,&rsquo; nor &lsquo; for the benefit of men; &rsquo; but to mankind. They regarded this wonder-working as something by God granted to men to mankind; and without supposing that they had before them the full meaning of their words, those words were true in the very highest sense. See [John 17:8] . In Mark they say, ὅτι οὕτως οὐδέποτε εἴδαμεν : in Luke, ὅτι εἴδομεν παράδοξα σήμερον ."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 9:8] . Ἐφοβήθησαν ] not equivalent to ἐθαύμασαν (not even in [Mark 4:41] ; [Luke 8:35] ), but they were afraid . This was naturally the first impression produced by the extraordinary circumstance; and then they praised God, and so on. τοῖς ἀνθρώποις ] Not the plural of category ([Matthew 2:20] ), so that only Jesus is meant (Kuinoel), but men generally, the human race. In one individual member of the human family they saw this power actually displayed, and regarded it as a new gift of God to humanity , for which they gave God praise."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:8] . Ἐξουσίαν τοιαύτην , such authority ) sc. to heal and save (see Mat 9:6 ), and that close at hand in the man Jesus Christ. τοῖς ἀνθρώποις , to men ) so long afflicted with sin. [400] An expansive expression (lata oratio), as in [Matthew 9:6] . [401] They rejoiced that there was one of the human race endued with this authority. [400] A Dativus Commodi . V. g. i.e. for the good of men. ED. [401] Beng seems to me, not to take ἀνθρώποις as Engl. V., &ldquo;God who had given such power to men ,&rdquo; but, as the Dative of advantage, &ldquo;Who had bestowed such power (in the person of the man Christ Jesus) for the benefit of men, so long afflicted as they had been with sin. Thus the meaning of Bengel&rsquo;s &ldquo;lata oratio, uti v. 6&rdquo; is, that the words &ldquo;on earth,&rdquo; in [Matthew 9:6] , imply the same wide range of the Saviour&rsquo;s power for the good of men as ἀνθρώποις here. ED."}], "9": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:9] . παράγων ἐκεῖθεν : passing along from the scene of the last incident, Jesus arrives at the custom-house of Capernaum ( τελώνιον ). εἶδεν … Ματθαῖον λεγ .: there He saw a man named Matthew . (On the identity of Matthew with Levi in Mark and Luke, vide Mark.) Capernaum being near the boundary and on the caravan road between Egypt and Damascus, Matthew would be a busy man, but, doubtless, Christ and he have met before. Ἀκολούθει μοι : Jesus acted on His own plans, but the recent encounter with the scribes would not be without influence on this new departure the call of a publican . It was a kind of defiance to the party who cherished hard thoughts not only about pardon but about those who needed pardon. An impolitic step the worldly-wise would say; sure to create prejudice. But those who are too anxious to conciliate the prejudices of the present do nothing for the future . ἀναστὰς ἠκολούθησεν : prompt compliance, probably with some astonishment at the invitation."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "9. ] λεγόμενον , not preceded by any other appellation, must not be pressed to any closer signification than that his name was Matthew. See ch. [Matthew 2:23] ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:9] . Ματθαῖον , Matthew ) A Hebrew by nation, and yet a publican. In St Mark and St Luke, he is called Levi. [402] It is possible that Matthew did not like the name which he had borne as a publican. καθἡμενον , sitting ) actually employed in the business of his calling. And yet Matthew followed. A great miracle and example of the power of Jesus. A noble instance of obedience [403] [ productive of eternal joy . V. g.] [402] J. D. Michaelis, Einleitung T. ii. p. m. 932, etc., conjectures that Levi was the chief of the publicans, and Matthew his subordinate assistant. But it is not likely that either Matthew, consistently with his modesty, would have omitted to record the obedience of Levi to the Lord&rsquo;s call Levi being, by the hypothesis, Matthew&rsquo;s principal and also host at the large entertainment given on the occasion or that Mark and Luke should have omitted the call of Matthew, who was more distinguished than Levi on account of his apostleship. It is no objection, that Matthew is not mentioned by the men of Nazareth. [Matthew 13:55] . among the four sons, i.e. sister&rsquo;s sons of Mary: for not even Levi (who in Mar 2:14 is explicitly made the son of Alpheus) is reckoned among those four. What suppose we say that Levi, or Matthew, was the son of Alpheus though not by Mary, but by a different wife, and so connected with the Saviour by no tie of blood. At all events, the very etymological root of the names seems to establish the identity of the persons. For לוי (Levi) is from לוה adhered, attached to, and מַתָּיַ or מַתַּתָּי (Matthew) is from the Arab word מהת , he formed a tie of connection or propinquity. Moreover: in the same way as Saul, from that period of time in which, after being solemnly set apart to the work of preaching, he gained over Sergius Paulus as the first-fruits of his mission, and so became superior to Barnabas, was distinguished by the name of Paul, even by Luke himself ([Acts 13:2] ; Act 13:9 ): so also Levi ( Luk 5:27 ), from the moment in which by solemn election he was enrolled among the Apostles, obtained the name of Matthew even in Luke (c. Luk 6:15 ). These considerations will enable the reader to decide the question. E. B. [403] This may be supposed to have been the series of the events: Matthew a short while before went to Jesus as a publican, and even then, at that early time, beyond all that he could have conceived, was called to the apostolic office, [Matthew 5:1] , [Luke 6:15] (comp. Num 11:26 ): whereby is evinced the extraordinary clemency of the Saviour towards this publican, thus selected out from the rest of his fellows. He was present, as an apostle freshly-appointed, at the Sermon on the Mount: where there is no doubt but that the words, Do not even the publicans the same ? recorded by Matthew himself. ch. [Matthew 5:46] . made the deepest impression on his mind. He did not, however, on that very day commence following the Lord daily, but had still some occupation in levying taxes, therein without doubt being observant of that righteousness which is commanded in [Luke 3:13] . There was, on the part of the Jews, a great abhorrence of publicans, even though they were themselves Jews; and it is to this abhorrence that the Saviour adapted His language. [Matthew 18:17] . However, the publicans were not altogether excluded from the temple, whether they had the same degree of access to it open to them as the Pharisees had, or an access more remote: [Luke 18:13] . John admitted the publicans to baptism, on condition that, in the discharge of their office, they would allow themselves to be stirred up to the duty of justice: nay more, not even did the Saviour command them altogether to leave their employment, but to &ldquo;make to themselves friends of the Mammon of unrighteousness.&rdquo; [Luke 15:1] ; [Luke 16:1] ; [Luke 16:9] . Neither Christ nor His fore-runner were bound by the Jewish traditions, which excluded publicans from church-communion. And besides, it is probable that the Jews, from malice against Christ, subsequently established more severe enactments as to publicans. Accordingly Matthew, being called to the apostleship, and not as yet at that time ordered to leave the receipt of customs, may have discharged this duty up to the time that he was called to follow Jesus. But if Matthew did the same as Zaccheus, before his conversion, he was in duty bound to make amends to those whom he had defrauded on the same principle as Zaccheus, or even to compare and make up ail accounts whatever with the other publicans. Jesus , therefore, when he saw him sitting at the receipt of custom, saith. Follow Me . And he arose and followed Him. Independently of the general crowd of hearers and disciples, coming to Him and going away from time to time, Jesus admitted certain followers to daily intimacy ([Luke 9:59] ; [Luke 18:22] ; Act 1:21 ), and twelve apostles, i.e. extraordinary messengers of the kingdom of heaven. Peter and Andrew, James also, with John, were made followers before that they were made apostles : Matthew was called to the apostolic dignity sooner than he was admitted to the intimacy of daily following the Lord, although not even this could have been put off for long, and in matter of fact was not delayed for more than a few days . At all events, he was not present in the journey to the country of the Gergesenes, who perhaps knew him well as a publican; but he may have been a spectator of the other acts of the Lord at Capernaum previous and subsequent to that journey. Even though he were ever so much behind the other apostles in following Christ: yet he followed soon enough for attaining the object proposed, as an apostle, [Acts 1:21] . Harm . 281, etc."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "At the place of toll ( επ το τελωνιον ). The tax-office or custom-house of Capernaum placed here to collect taxes from the boats going across the lake outside of Herod's territory or from people going from Damascus to the coast, a regular caravan route. \"Called Matthew\" ( Μαθθαιον λεγομενον ) and in [Matthew 10:3] Matthew the publican is named as one of the Twelve Apostles. Mark ([Mark 2:14]) and Luke ([Luke 5:27]) call this man Levi. He had two names as was common, Matthew Levi. The publicans ( τελωνα ) get their name in English from the Latin publicanus (a man who did public duty), not a very accurate designation. They were detested because they practised graft. Even Gabinius the proconsul of Syria was accused by Cicero of relieving Syrians and Jews of legitimate taxes for graft. He ordered some of the tax-officers removed. Already Jesus had spoken of the publican ([Matthew 5:46]) in a way that shows the public disfavour in which they were held."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Receipt of custom [ τελωνιον] . Rev., place of toll. Wyc., tollbooth, toll - booth, or toll - cabin, which is an excellent word, though obsolete. Sitting at, is, literally sitting on : the elevated platform or bench which was the principal feature of the toll - office, as in modern custom - bazaars, being put for the whole establishment. This customs - office was a Capernaum, the landing - place for the many ships which traversed the lake or coasted from town to town; and this not only for those who had business in Capernaum, but for those who would there strike the great road of eastern commerce from Damascus to the harbors of the West. Cicero, in his oration on the Consular Provinces, accuses Gabinius, the pro - consul of Syria, of relieving the Syrians and Jews of some of their legitimate taxes, and of ordering the small building to be taken down, which the publicans had erected at the approaches to bridges, or at the termination of roads, or in the harbors, for the convenience of their slaves and collectors."}], "10": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:10] . καὶ ἐγένετο , etc. The narrative of this incident in all three Synoptists is condensed, and the situation not clear. What house is meant ( ἐν τῇ οἰκ .), and why so many ( πολλοὶ )? &ldquo;There were many,&rdquo; Mark remarks, emphatically ([Matthew 2:15] ), and the ἰδοὺ here implies that something important took place. Luke infers (for we need not suppose independent information) that it is a feast ( δοχὴν ), and, doubtless, he is right. But given by whom? Levi, according to Luke. It may have been so, but not necessarily as the prime mover; possibly, nay, probably, as the agent of his new Master. Our thoughts have been too much biassed by the assumption that the call of Matthew in this section is the main thing, and the feast an accompanying incident, a farewell feast of Matthew&rsquo;s in which Jesus passively partook. The truth, probably, is that the call was a preliminary to the feast, the first step in the working out of a plan. Jesus aims at a mission among the reprobated classes, and His first step is the call of Matthew to discipleship, and His second the gathering together, through him, of a large number of these classes to a social entertainment; the place of meeting being, possibly, not a private house, whether Christ&rsquo;s or Matthew&rsquo;s, but a public hall. If Matthew&rsquo;s house or Simon&rsquo;s (in which Jesus probably had His home, vide Mark) was large enough to have a quadrangular court, the gathering might be there, where, according to Faber, Archäologie der Hebräer , p. 408, meetings of various sorts were held. In any case it was a great affair scores, possibly hundreds, present, too large for a room in a house, a conventicle meeting, so to speak; a meeting with such people in the Synagogue not being possible. For further remarks vide on Mark. τελῶναι καὶ ἁμαρτωλοὶ : publicans naturally, if Matthew was the host, but why ἁμαρ .? He was a respectable man; are the ἁμαρ . simply the τελῶναι as viewed from the outside, so named in anticipation of the Pharisaic description of the party? If Jesus was the inviter, they might be a distinct class, and worse, very real sinners, for His aim was a mission among the social Pariahs."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "10. ] We are told in [Luke 5:29] , that Levi made him a great feast in his house; and, similarly, Mark has ἐν τῇ οἰκ . αὐτοῦ . The narrative in our text is so closely identical with that in Mark, that it is impossible to suppose, with Greswell, that a different feast is intended. The arguments by which he supports his view are by no means weighty. From the words τῇ οἰκίᾳ , he infers that the house was not that of Matthew, but that in which our Lord usually dwelt, which he supposes to be intended in several other places. But surely the article might be used without any such significance, or designating any particular house, as would be very likely if Matthew himself is here the narrator. (A similar mistake has been made in supposing τὸ πλοῖον , as in [Matthew 9:1] , and elsewhere, to mean some one particular ship; whereas it is generic: see note there.) Again, Greswell presses to verbal accuracy the terms used in the accounts (e.g. συνανέκειντο and ἐλθόντες συνανέκειντο ), and attempts to shew them to be inconsistent with one another. But surely the time is past for such dealing with the historic text of the Gospels; and, besides, he has overlooked a great inconsistency in his own explanation, viz., that of making in the second instance, according to him, Scribes and Pharisees present at the feast given by a Publican, and exclaiming against that which they themselves were doing. It was not at , but after the feast that the discourse in Mat 9:11-17 took place. And his whole inference, that δοχὴ μεγάλη must be the great meal in the day, and consequently in the evening, hangs on too slender a thread to need refutation. The real difficulty, insuperable to a Harmonist, is the connexion here of the raising of Jaeirus&rsquo;s daughter with this feast: on which see below, [Matthew 9:18] . καὶ ἐγέν … καὶ ἰδ . ] a Hebraism, see reff.; it occurs, but with the omission of ἰδού , in Mark&rsquo;s account. The not very usual word, συνανέκειντο , is also common to the two. St. Mark, with his usual precision, adds ἦσαν γὰρ πολλοὶ καὶ ἠκολούθησαν αὐτῷ : a clause answering to ἐλθόντες in our text. See last note."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 9:10] . Ἐγένετο … καί ] see note on [Luke 5:12] . ἀνακειμένου ] In classical Greek, to recline at table is represented by κατακεῖσθαι , as frequently also in the N. T. ([Mark 2:15] ; [Mark 14:3] ), though in Polybius, Athenaeus, and later writers ἀνακεῖσθαι , too, is by no means rare. Phrynichus, ed. Lobeck, p. 217. On the custom itself (with the left arm resting on a cushion), comp. note on [John 13:23] . ἐν τῇ οἰκίᾳ ] With the exception of Fritzsche, Bleek, Holtzmann, Keim, Hilgenfeld (yet comp. already the still merely doubtful remark of Bengel), critics have gratuitously assumed the house to have been that of Matthew , which accords, no doubt, with [Luke 5:29] (not [Mark 2:15] ), but neither with the simple ἐν τῇ οἰκίᾳ (see [Matthew 9:23] ; [Matthew 13:1] ; [Matthew 13:36] ; [Matthew 17:25] ) nor with the connection. Seeing, then, that the publican who rose from his seat at the custom-house and followed Jesus cannot, of course, have gone to his own residence, nothing else can have been meant but the house of Jesus (in which He lived). There lies the variation as compared with Luke, and like many another, it cannot be disposed of. But de Wette&rsquo;s objection, reproduced by Lichtenstein, Lange, and Hilgenfeld, that it is scarcely probable that Jesus would give feasts, has no force whatever, since Matthew does not say a single word about a feast ; but surely one may suppose that, when the disciples were present in his residence at Capernaum, Jesus may have eaten, i.e . have reclined at table with them. The publicans and sinners who came thither were at the same time hospitably received. καὶ ἁμαρτωλοί ] and in general men of an immoral stamp , with whom were also classed the publicans as being servants of the Roman government, and often guilty of fraudulent conduct ([Luke 3:13] ); comp. [Luke 19:7] . Observe that Jesus Himself by no means denies the πονηρὸν εἶναι in regard to those associated with Him at table, [Matthew 9:12] f. They were truly diseased ones, who were now, however, yielding themselves up to the hands of the physician."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:10] . Ἐν τῇ οἰκίᾳ , in the house ) Cf. [Matthew 9:28] ; or, if you take it of Matthew&rsquo;s house, [Mark 2:15] ; [Luke 5:29] . Matthew appears in this feast to have bid adieu to his former companions, [404] nor does he call the house any longer his own. τελῶναι καὶ ἁμαρτωλοὶ , publicans and sinners ) who had sinned grievously against the sixth and seventh [seventh and eighth] commandments. συνανέκειτο , sat down together with ) Kind and condescending was the intercourse of Jesus. [405] [404] He seems also hereby to have afforded them an opportunity of going to the Lord, such as would hardly have been given to so great a number of such characters at any other time. Shortly after, Matthew came to know the glory of Jesus by His acts, and especially by the raising of Jairus&rsquo; daughter, ch. [Matthew 9:19] ; and he was sent forth, at no long interval afterwards, with the rest of His apostles: on which occasion he has called himself Matthew the publican , ch. [Matthew 10:3] ; and, from the deepest sense of gratitude (as is natural), has recalled to remembrance with what marvellous speed grace transferred him from his state as a publican (ch. Mat 18:17 ) to an Apostolic embassy which was distinguished by miracles. Harm . p. 282. [405] For whose sake the banquet was given, to which, without any command on His part, publicans and sinners came. Therefore the objection of the Pharisees, even looking at it in a mere external point of view, was void of all justice. V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Publicans and sinners ( τελωνα κα αμαρτωλο ). Often coupled together in common scorn and in contrast with the righteous ( δικαιο in [Matthew 9:13]). It was a strange medley at Levi's feast (Jesus and the four fisher disciples, Nathanael and Philip; Matthew Levi and his former companions, publicans and sinners; Pharisees with their scribes or students as on-lookers; disciples of John the Baptist who were fasting at the very time that Jesus was feasting and with such a group). The Pharisees criticize sharply \"your teacher\" for such a social breach of \"reclining\" together with publicans at Levi's feast."}], "11": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:11] . ἰδόντες οἱ φαρ . Here was a good chance for the critics, really a scandalous affair! τοῖς μαθηταῖς . They spoke to the disciples, possibly, as Euthy. Zig. suggests, to alienate them from the Master, possibly lacking courage to attack Him face to face."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "11. ἰδόντες ] having observed this, see [Matthew 9:4] . These Pharisees appear to have been the Pharisees of the place: Luke adds αὐτῶν : οἱ Φ . καὶ οἱ γραμ . αὐτῶν . The very circumstances related shew that this remonstrance cannot have taken place at the feast. The Pharisees say the words to the disciples: our Lord hears it. This denotes an occasion when our Lord and the disciples were present, but not surely intermixed with the ὄχλος τελωνῶν πολύς ."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 9:11] . Ἰσόντες ] How they saw it is conceivable in a variety of ways (in answer to Strauss, B. Bauer), without our requiring to adopt the precise supposition of Ebrard and de Wette, that they saw it from the guests that were coming out of the house. May not the Pharisees have come thither themselves either accidentally or on purpose? Comp. πορευθέντες , [Matthew 9:13] ; ἐγερθείς , [Matthew 9:19] ; and see note on [Matthew 9:18] ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:11] . Τοὶς μαθηταῖς , to the disciples ) The Pharisees acted in an oblique manner, with cunning, or at least with cowardice; to the disciples they said, Why does your Master do so? to the Master, Why do your disciples do so? see ch. [Matthew 12:2] , [Matthew 15:2] ; [Mark 2:16] ; [Mark 2:18] . διατί , κ . τ . λ ., why, etc .) The sanctity of Jesus was held in the highest esteem by all, even His adversaries. See [Luke 19:7] ."}], "12": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:12] . ὁ δὲ α . εἶπεν : to whom? Were the fault-finders present to hear? οὐ χρείαν , etc.: something similar can be cited from classic authors, vide instances in Grotius, Elsner, and Wetstein. The originality lies in the application = the physician goes where he is needed, therefore, I am here among the people you contemptuously designate publicans and sinners. The first instalment, this, of Christ&rsquo;s noble apology for associating with the reprobates a great word."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "12. ἰσχύοντες .… κακῶς ἔχ . ] Both words, in the application of the saying, must be understood subjectively (&lsquo;ironica concessio,&rsquo; Calvin, Meyer): as referring to their respective opinions of themselves; as also δικαιους and ἁμαρτωλούς , [Matthew 9:13] : not as though the Pharisees were objectively either ἰσχύοντες or δίκαιοι , however much objective truth κακῶς ἔχοντες and ἁμαρτωλοί may have had as applied to the publicans and sinners."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 9:12] . The whole and the sick of the proverb are figurative expressions for the δίκαιοι and the ἁμαρτωλοί , [Matthew 9:13] . In the application the Pharisees are included among the former, not on account of their comparatively greater (de Wette), but because of their fancied , righteousness, as is evident from the sentiments of Jesus regarding this class of men expressed elsewhere, and likewise from [Matthew 9:13] . The thought, then, is this: &ldquo;the righteous (among whom you reckon yourselves) do not need the deliverer, but the sinners.&rdquo; This contains an &ldquo; ironica concessio &rdquo; to the Pharisees, &ldquo;in qua ideo offendi eos docet peccatorum intuitu, quia justitiam sibi arrogant,&rdquo; Calvin. The objection, that in point of fact Jesus is come to call the self-righteous as well, is only apparent, seeing that He could not direct His call to these, as such ([John 9:39] ff.), so long as they did not relinquish their pretensions, and were themselves without receptivity for healing."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:12] . [406] ΧΡΕΊΑΝ , need ) χρεῖαι , needs , are to be seen everywhere. [407] ΚΑΚῶς , ill ) Such is indeed the case with sinners. [408] [406] Jesus, as a faithful master, brings help to his disciples. V. g. [407] Dost thou feel infirmity ( οἱ κακῶς ἔχοντες ), as opposed to strength ( οἱ ἰσχύοντες )? In that case betake thyself to the Physician, and seek His help. V. g. [408] In the original, &ldquo;Sic sane habent peccatores.&rdquo; There is a play here on the word habent, sc. χρείαν ἔχουσιν κακῶς ἔχοντες . (I. B.)"}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "But they that are sick ( αλλα ο κακως εχοντες ). Probably a current proverb about the physician. As a physician of body and soul Jesus was bound to come in close touch with the social outcasts."}], "13": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:13] . πορευθέντες μάθετε : a common expression among the Rabbis, but they never sent men to learn the particular lesson that God prefers mercy to sacrifice. καὶ οὐ , does not imply that sacrifice is of no account. ἔλεος ( ἔλεον in T. R., a correction by the scribes), accusative neuter. Masculine nouns of 2nd declension are often neuter 3rd in N. T. and Sept [57] ἦλθον : Jesus speaks as one having a mission. ἁμαρτωλούς : and it is to the sinful, in pursuance of the principle embodied in the prophetic oracle a mission of mercy. The words ἰσχύοντες , [Matthew 9:12] , and δικαίους , [Matthew 9:13] , naturally suggest the Pharisees as the class meant. Weiss, always nervously afraid of allegorising in connection with parabolic utterances, protests, contending that it is indifferent to the sense of the parable whether there be any &ldquo;whole&rdquo; or righteous. But the point is blunted if there be no allusion. καλέσαι here has the sense of calling to a feast. [57] Septuagint."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "13. ] πορευθέντες μάθετε answers to an expression frequent in the Talmud, צא ולמד . ἔλεος θέλ . ] The whole of this discourse, with the exception of the citation, is almost verbatim in Mark, and (with ὑγιαίνοντες = ἰσχύοντες , ἐλήλυθα = ἦλθον , and the addition of εἰς μετάνοιαν ) Luke also."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 9:13] . After having justified His holding intercourse with publicans and sinners, Jesus with the δέ proceeds to tell the Pharisees what they would have to do in order to their receiving His invitation to be healed: &ldquo; but go and learn what is meant by that saying of the Scripture ([Hosea 6:6] , LXX.), I will have mercy and not sacrifice .&rdquo; You must understand that first of all, if you are to be of the number of those who are to be invited to enter the Messiah&rsquo;s kingdom: &ldquo; for I am not come to call righteous, but sinners &rdquo; ([1 Timothy 1:15] ). Through that quotation from the Scripture (mentioned only by Matthew here and [Matthew 12:7] ), it is intended to make the Pharisees understand how much they too were sinners. According to others , Jesus wishes to justify His conduct , inasmuch as the exhibition of love and mercy constitutes the Messiah&rsquo;s highest duty (Ewald, Bleek). This, however, is less probable, owing to the πορευθέντες with which He dismisses them from His presence, the analogy of [Matthew 12:7] , and the very apt allusion in οὐ θυσίαν to the Pharisees with their legal pride. πορευθ . μάθετε ] corresponds to the Rabbinical form צא ולמד , which is used in sending one away, with a view to fuller reflection upon some matter or other, or with a view to being first of all instructed regarding it; see Schoettgen. γάρ ] assigns the reason for the πορευθέντες μάθετε , through which μανθάνειν they are first to be rendered capable of receiving the invitation to participate in the blessings of the kingdom. This invitation is uniformly expressed by the absolute καλεῖν . The masculine ἔλεος is the classical form; the neuter, which rarely occurs in Greek authors (Isocr. 18, p. 378; Diod. iii. 18), is the prevailing form in the LXX., Apocrypha, and the New Testament, although the manuscripts show considerable fluctuation. In the present instance, the neuter, though possessing the authority of B C* D א (like [Matthew 12:7] ), was naturally adopted from the LXX. καὶ οὐ θυς .] The negative is absolute, in accordance with the idea aut … aut. God does not desire sacrifice instead of mercy, but mercy instead of sacrifice. The latter is an accessory (Calvin), in which everything depends on the right disposition, which is what God desires."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:13] . Πορέυθεντες , having gone ) sc. into the synagogue, where you may refer to Hosea [sc. [Matthew 6:6] .] Our Lord often said to those who were not His own, [409] πορεύου ,&rdquo; &ldquo; depart ,&rdquo; see [John 8:11] . His style of quoting the Scriptures is full of suitableness and majesty, and different from that of the apostles; for He does it in such a manner as not Himself to rest upon, but to convince His hearers by their authority; and He employs it more towards His adversaries than towards the disciples who believed on Him. μάθετε , learn ye ) ye who think that ye are already consummate teachers. ἔλεον θέλω , I will have mercy ) A few read with the LXX. in [Hosea 6:6] , with whom the other words in this passage agree, ἔλεον θέλω . [410] The LXX. more commonly use ΤῸ ἜΛΕΟς in the neuter, as in [Hosea 6:4] . Sometimes, however, Ὁ ἜΛΕΟς , like the ancient Greeks. [Isaiah 60:10] ; [Isaiah 63:7] ; [Daniel 1:9] ; [Daniel 9:20] ; Psa 101:1 ; 1Ma 2:57 ; 1Ma 3:44 ; and especially in the minor prophets, [Jonah 2:9] ; [Micah 6:8] (which passage is also parallel with the evangelist), Ibid. [Matthew 7:20] ; [Zechariah 7:9] ; [Hosea 12:6] . Thus Ὁ ἜΛΕΟς occurs in the present passage, in [Matthew 12:7] ; [Matthew 23:23] ; [Titus 3:5] ; [Hebrews 4:16] ; but ΤΌ ἜΛΕΟς occurs frequently in St Luke, St Paul, St James, St Peter, St John, and St Jude; and in [Micah 7:18] , the LXX., have ΘΕΛΗΤῊς ἘΛΈΟΥς ἘΣΤῚΝ , He is a willer of mercy . We have here an axiom of interpretation, nay, the sum total of that part of theology which treats of cases of conscience. On mercy , cf. ch. [Matthew 23:23] . The word θυσίαν , sacrifice (victimam), is put synecdochically. [411] It is an act of mercy to eat with sinners for their spiritual profit. [412] ἦλθον , I have come ) sc. from heaven. καλέσαι , to call ) Such is the mission, such the authority of Christ. ἁμαρτωλοὺς , sinners ) The word is purposely and emphatically repeated by our Lord. Cf. [Matthew 9:11] . [409] In the original &ldquo;Alieniores,&rdquo; an expression which is used several times by Bengel in the course of this gospel, and which it is easier to understand than to translate. (I. B.) [410] So BC corrected later, D. This is the Hellenistic form, as τὸ πλοῦτος , τὸ ζῆλος found in LXX. and oldest MSS. of N. T. for ὁ πλοῦτος , ὁ ζῆλος . Rec. Text has ἔλεον , the classic form. ED. [411] A part for the whole of positive performances. ED. [412] So far ought you to be from despising repentance; for repentance is in fact the curing of the soul. V. g. Καὶ οὐ θυσίαν ) This is one portion of the rigorous observance of those things, which are contained in the Law. V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "But go ye and learn ( πορευθεντες δε μαθετε ). With biting sarcasm Jesus bids these preachers to learn the meaning of [Hosea 6:6]. It is repeated in [Matthew 12:7]. Ingressive aorist imperative ( μαθετε )."}], "14": [{"src": "hac", "name": "Alford's Greek Testament", "text": "14. ] According to the detailed narrative of St. Mark ( Mar 2:18 ) it was the disciples of John and of the Pharisees who asked this question. St. Luke continues the discourse as that of the former Pharisees and Scribes. This is one of those instances where the three accounts imply and confirm one another, and the hints incidentally dropped by one Evangelist form the prominent assertions of the other. The fasting often of the disciples of John must not be understood as done in mourning for their master&rsquo;s imprisonment, but as belonging to the asceticism which John, as a preacher of repentance, inculcated. On the fasts of the Pharisees, see Light-foot in loc."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 9:14] . Concerning private fasting . See note on [Matthew 6:16] . On the fasting of the Baptist , comp. [Matthew 9:18] . On the fasting of the Pharisees ([Luke 18:12] ), to whose authority on the rigid observance of the law the disciples of John adhere, see Lightfoot on this passage. Serar. de Trihaeresio , p. 36. πολλά ] frequenter , Vulg., Stallbaum, ad Plat. Phaed . p. 61 C, ad Parmen . p. 126 B; Kühner, II. 1, p. 270. A not inappropriate addition by Matthew (Weiss, Holtzmann). οὐ νηστεύουσι ) comparatively, to be understood from the standpoint of the questioners, who hold the freedom of the disciples of Jesus, as contrasted with the frequent fasting of themselves and the Pharisees, to be equivalent to no fasting at all."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:14] . Τότε , then ) At the time of the Feast. [413] προσέρχονται Αὐτῷ , come to Him ) of set purpose. οἱ μαθηταὶ Ἰωάννου , the disciples of John ) They were half-way between the Pharisees and the disciples of Jesus, and appear on this occasion to have been instigated by the Pharisees. [414] Cf. [Luke 5:33] . Σοῦ μαθηταὶ , Thy disciples ) They proceed modestly, and do not enquire concerning John or Jesus Himself. [413] It was also the day of the public fasts, as it appears, which were celebrated not by the enactment of divine Law, but according to the private will of certain individuals. Harm. , p. 283. [414] For Matthew in this passage mentions the disciples of John; Mark (ch. Mar 2:18 ) mentions the same persons in company with the Pharisees; Luke mentions the Scribes and Pharisees. Harm . 1. c."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "The disciples of John ( ο μαθητα Ιωανου ). One is surprised to find disciples of the Baptist in the role of critics of Christ along with the Pharisees. But John was languishing in prison and they perhaps were blaming Jesus for doing nothing about it. At any rate John would not have gone to Levi's feast on one of the Jewish fast-days. \"The strict asceticism of the Baptist ([Matthew 11:18]) and of the Pharisaic rabbis ([Luke 18:12]) was imitated by their disciples\" (McNeile)."}], "15": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:15] . καὶ εἶπεν : The question drew from Jesus three pregnant parabolic sayings: bright, genial, felicitous impromptus; the first a happy apology for His disciples, the other two the statement of a general principle. οἱ υἱοὶ τοῦ νυμφῶνος . The mere suggestion of this name for the disciples explains all. Paranymphs, friends of the bridechamber, companions of the bridegroom, who act for him and in his interest, and bring the bride to him. How can they be sad ( μὴ δύνανται πενθεῖν )? The point to note is that the figure was apposite . The life of Jesus and His disciples was like a wedding feast they the principal actors. The disciples took their tone from the Master, so that the ultimate fact was the quality of the personal piety of Jesus. Therein lay the reason of the difference commented on. It was not irreligion, as in the case of the careless; it was a different type of religion, with a Father-God, a kingdom of grace open to all, hope for the worst, and spiritual spontaneity. ἐλεύσονται ἡμέραι . While the Bridegroom is with them life will be a wedding feast; when He is taken from them it will make a great difference; then ( τότε ) they will grieve, and therefore fast: a hidden allusion to the tragic end foreseen by Jesus of this happy free life, the penalty of breaking with custom."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "15. ] πενθεῖν = νηστεύειν Mark and Luke. The difference of these two words is curiously enough one of Greswell&rsquo;s arguments for the non-identity of the narratives. Even if there were any force in such an argument, we might fairly set against it that ἀπαρθῇ is common to all three Evangelists, and occurs no where else in the N.T. ὁ νυμφίος ] This appellation of Himself had from our Lord peculiar appropriateness as addressed to the disciples of John. Their master had himself said ( Joh 3:29 ) ὁ ἔχων τὴν νύμφην , νυμφίος ἐστίν · ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ , χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου . αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται . Our Lord in calling Himself the Bridegroom, announces the fulfilment in Him of a whole cycle of O.T. prophecies and figures: very probably with immediate reference to [Hosea 2:1-23] , that prophet having been cited just before: but also to many other passages, in which the Bride is the Church of God, the Bridegroom the God of Israel. See especially Isa 54:5-10 Heb. and E. V. As Stier (Reden Jesu, i. 320, edn. 2) observes, the article here must not be considered as merely introduced on account of the parable, as usual elsewhere, but the parable itself to have sprung out of the emphatic name, ὁ νυμφίος . The υἱοὶ τοῦ νυμφῶνος are more than the mere guests at the wedding: they are the bridegroom&rsquo;s friends who go and fetch the bride. ἐλεύσονται δὲ ἡμ . ] How sublime and peaceful is this early announcement by our Lord of the bitter passage before Him! Compare the words of our Christian poet: &lsquo;measuring with calm presage the infinite descent.&rsquo; ( Wizenmann mag dabei wohl fragen:, Welcher Mensch hat je fo ruhig, so lieblich von einer solchen Hõhe in eine solche Jiefe geschaut? &rsquo; Stier, Reden Jesu, i. 322.) ὅταν ἀπ . ] when the Bridegroom shall have been taken from them: when His departure shall have taken place. καὶ τότε ν . ] These words are not a declaration of a duty, or of an ordinance, as binding on the Church in the days of her Lord&rsquo;s absence: the whole spirit of what follows is against such a Supposition: but they declare, in accordance with the parallel word πενθεῖν , that in those days they shall have real occasion for fasting; sorrow enough; see [John 16:20] : a fast of God&rsquo;s own appointing in the solemn purpose of His will respecting them, not one of their own arbitrary laying on. This view is strikingly brought out in Luke, where the question is, Can ye ποιῆσαι νηστεύειν the children, &c., i.e. by your rites and ordinances? but, &c. and τότε νηστεύσουσιν : there is no constraint in this latter case: they shall (or better, they will) fast. And this furnishes us with an analogous rule for the fasting of the Christian life: that it should be the genuine offspring of inward and spiritual sorrow, of the sense of the absence of the Bridegroom in the soul, not the forced and stated fasts of the old covenant, now passed away. It is an instructive circumstance that in the Reformed Churches, while those stated fasts which were retained at their first emergence from Popery are in practice universally disregarded even by their best and holiest sons, nothing can be more affecting and genuine than the universal and solemn observance of any real occasion of fasting placed before them by God&rsquo;s Providence. It is also remarkable how uniformly a strict attention to artificial and prescribed fasts accompanies a hankering after the hybrid ceremonial system of Rome. Meyer remarks well that τότε refers to a definite point of time, not to the whole subsequent period."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 9:15] . Οἱ υἱοὶ ([Matthew 8:12] ) τοῦ νυμφῶνος ] ( of the bride chamber , [Joel 2:16] ; Tob 6:16 ; Heliod. vii. 8) are the παρανύμφιοι , the friends of the bridegroom, who amid singing and playing of instruments conducted the bride, accompanied by her companions, to the house of her parents-in-law and to the bride-chamber, and remained to take part in the wedding feast, which usually lasted seven days. Pollux, Onom . [Matthew 3:3] ; Hirt, de paranymph. ap. Hebr . 1748; on the Greek παρανυμφίοι , consult Hermann, Privatalterth . § 31, 18. Meaning of the figure: So long as my disciples have me with them, they are incapable of mourning (fasting being the expression of mourning): when once I am taken from them and that time will inevitably come then they will fast to express their sorrow . Christ, the bridegroom of His people until His coming, and then the marriage; see on [John 3:29] . It is to be observed that this is the first occasion in Matthew on which Jesus alludes to His death , which from the very first He knew to be the divinely-appointed and prophetically-announced climax of His work on earth ([John 1:29] ; [John 2:19] ; [John 3:14] ), and did not come to know it only by degrees, through the opposition which he experienced; while Hase, Wittichen, Weizsäcker, Keim, postpone the certainty of His having to suffer death the latter, till that day at Caesarea (chap. 16); Holsten even puts it off till immediately before the passion; see, on the other hand, Gess, op. cit. , p. 253 ff. The τότε , which has the tragic emphasis of a sorrowful future (Bremi, ad Lys. p. 248, Goth.), expresses only the particular time specified , and not all time following as well , and while probably not condemning fasting in the church, yet indicating it to be a matter in which one is to be regulated, not by legal prescriptions ([Matthew 9:16] f.), but by personal inclination and the spontaneous impulses of the mind. Comp. [Matthew 6:16] ff."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:15] . Καὶ , and ) Our Lord replies calmly and cheerfully: He draws joyful parables from the garments and the wine (which were being employed in the Feast) to condemn the sadness of those who questioned Him. οἱ υἱοὶ τοῦ νυμφῶνος , the children of the bridechamber ) The companions of the bridegroom. [415] Parables and riddles are suited to feasts and nuptials, and are employed to illustrate this nuptial period. [416] πενθεῖν , to mourn ) Mourning and fasting are joined together. ἐλεύσονται , shall come ) He means His departure, which should take place at a future period. καὶ τότε , and then ) Neither before nor after. [417] νηστεύσουσιν , they shall fast ) necessarily and willingly. [418] [415] The Bridegroom Himself, if you except the forty days in the wilderness. is nowhere recorded as having fasted. V. g. [416] Bengel means to say, the period when our Lord was with His disciples. (I. B.) [417] Bengel means, neither whilst the Bridegroom was with the Church on earth, nor when the Church should be with the Bridegroom in heaven. (I. B.) [418] This is the very characteristic aspect of Christianity: At one time is the nuptial and festive season; at another time, the season for fasting and sorrow. V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "The sons of the bride-chamber ( ο υιο του νυμφωνος ). It is a late Hebrew idiom for the wedding guests, \"the friends of the bridegroom and all the sons of the bride-chamber\" (Tos. Berak. ii. 10). Cf. [John 2:29]."}], "16": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:16] , οὐδεὶς … παλαιῷ . No one putteth a patch of an unfulled, raw piece of cloth ( ῥάκος from ῥήγνυμι ) on an old garment. τὸ πλήρωμα αὐτοῦ , the filling, the patch which fills; of it, i.e. , the old garment, not of the unfulled cloth (Euthy., Grotius, De W., etc.). αἴρει ἀπὸ , taketh from = tears itself away by contraction when wetted, taking a part of the old garment along with it. καὶ … γίνεται , and so a worse rent takes place. This looks in the direction of an apology for John and his disciples (so Weiss) = they and we are in sympathy in the main, but let them not assimilate their practice to ours; better remain as they are; imitation would only spoil a good type of piety. What is to be done with the unfulled cloth is not indicated, but it goes without saying. Let it remain by itself, be fulled, and then turned into a good new garment."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "16. ] Our Lord in these two parables contrasts the old and the new, the legal and evangelic dispensations, with regard to the point on which He was questioned. The idea of the wedding seems to run through them: the preparation of the robe, the pouring of the new wine, are connected by this as their leading idea to one another and to the preceding verses. The old system of prescribed fasts for fasting&rsquo;s sake must not be patched with the new and sound piece; the complete and beautiful whole of Gospel light and liberty must not be engrafted as a mere addition on the worn out system of ceremonies. For the πλήρωμα αὐτοῦ , the completeness of it, the new patch, by its weight and its strength pulls away the neighbouring weak and loose threads by which it holds to the old garment, and a worse rent is made. Stier notices the prophetic import of this parable: in how sad a degree the χεῖρον σχίσμα γίνεται has been fulfilled in the history of the Church, by the attempts to patch the new, the Evangelic state, upon the old worn out ceremonial system. &lsquo;Would,&rsquo; he adds, &lsquo;that we could say in the interpretation, as in the parable, No man doeth this! &rsquo; The robe must be all new , all consistent: old things, old types, old ceremonies, old burdens, sacrifices, priests, sabbaths, and holy days, all are passed away: behold all things are become new. χεῖρον σχ . γίν . ] a worse rent takes place: not, as E. V., &lsquo; the rent is made worse &rsquo; ( χ . γίν . τὸ σχ ., or χ . τὸ σχ . γίν .,) a worse rent, because the old, original rent was included within the circumference of the ἐπίβλημα , whereas this is outside it."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:16] . Οὐδεὶς , no one ) Our Lord chose, as His disciples, men who were unlearned, fresh and simple, and imbued with no peculiar discipline. See ch. [Matthew 15:2] ; cf. Gnomon on [Luke 7:20] . The old raiment was the doctrine of the Pharisees; the new, that of Christ. αἴρει , taketh away ) both itself and more. αὐτοῦ , his ) The word is here in the masculine gender. [419] χεῖρον σχίσμα γίνεται , the rent becomes worse ) Therefore, there was before some rent. A ragged garment, altogether ragged, is intended. [419] Rosenmüller more naturally refers αὐτοῦ to ῥάκους , &ldquo;pannus impexus a vestimento vetustate contrito aliquid aufert&rdquo; Beng. seems to take αὐτοῦ with πλήρωμα , as &ldquo;the portion put in by him to fill up the rent.&rdquo; ED."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Undressed cloth ( ρακους αγναφου ). An unfulled, raw piece of woollen cloth that will shrink when wet and tear a bigger hole than ever. A worse rent ( χειρον σχισμα ). Our word \"schism.\" The \"patch\" ( πληρωμα , filling up) thus does more harm than good."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "New [ αγναφου] . From aj, not, and gnaptw, to card or comb wool; hence to dress or full cloth. Therefore Rev. renders more correctly undressed cloth, which would shrink when wet, and tear loose from the old piece. Wyc. renders rude. Jesus thus pictures the combination of the old forms of piety peculiar to John and his disciples with the new religious life emanating from himself, as the patching of an old garment with a piece of unfulled cloth, which would stretch and tear loose from the old fabric and make a worse rent than before."}], "17": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:17] . The new parable of the wine and wine-skins is introduced, not merely because the Speaker is full of matter, but because it enables Him aptly to show both sides of the question, the twofold application of the principle. οὐδὲ βάλλουσιν : nobody puts new wine into old skins; νέος applied to wine, καινός to skins ( ἀσκοὺς καινούς ). νέος is new in time, καινός in quality. That which is new in time does not necessarily deteriorate with age; it may even improve. That which is new in quality always deteriorates with age, like skins or cloth, vide Trench&rsquo;s Synonyms , lx. εἰ δὲ μήγε ( vide ad [Matthew 6:1] ): two disastrous consequences ensue: skins burst, wine spilt. The reason not stated, assumed to be known. New wine ferments, old skins have lost their toughness and stretchableness. &ldquo;They have become hard leather and give no more&rdquo; (Koetsveld, De Gelijkenissen , p. 99). That is the one side keep the old to the old. ἀλλὰ βάλλουσι … συντηροῦνται : this is the other the new to the new; new wine in fresh skins, and both are preserved as suiting one another. With reference to the two parables, Schanz remarks that, in the first, the point of comparison is the distinction between part and whole, in the second form and contents are opposed to each other. So after him, Holtzmann in H.C. Weiss takes both parables as explaining the practice of John&rsquo;s disciples, Holtzmann as giving reasons why Christ&rsquo;s disciples differed from all others. The truth as above indicated lies between."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "17. ] This parable is not a repetition of the previous one, but a stronger and more exact setting forth of the truth in hand. As is frequently our Lord&rsquo;s practice in His parables, He advances from the immediate subject to something more spiritual and higher, and takes occasion from answering a cavil, to preach the sublimest truths. The garment was something outward; this wine is poured in , is something inward , the spirit of the system. The former parable respected the outward freedom and simple truthfulness of the New Covenant; this regards its inner spirit, its pervading principle. And admirably does the parable describe the vanity of the attempt to keep the new wine in the ἀσκὸς παλαιός , the old ceremonial man, unrenewed in the spirit of his mind: ῥήγνυνται οἱ ἀσκοί : the new wine is something too living and strong for so weak a moral frame; it shatters the fair outside of ceremonial seeming; and ὁ οἶνος ἐκχεῖται , the spirit is lost, the man is neither a blameless Jew nor a faithful Christian; both are spoiled. And then the result: not merely the damaging, but the utter destruction of the vessel, οἱ ἀσκοὶ ἀπολοῦνται . According to some expositors, the new patch and new wine denote the fasting; the old garment and old bottles , the disciples . ὃ δὲ λέγει , τοιοῦτόν ἐστιν · οὔπω γεγόνασιν ἰσχυροὶ οἱ μαθηταί , ἀλλ ʼ ἔτι πολλῆς δἐονται συγκαταβάσεως · οὔπω διὰ τοῦ πνεύμτος ἀνεκαινίσθησαν . οὕτω δὲ διακειμένοις οὐ χρὴ βάρος ἐπιτιθέναι ἐπιταγμάτων . Chrysostom, Hom. in Matt. xxx. 4, p. 353. This view is stated and defended at some length by Neander, Leben Jesu, p. 346, note; but I own seems to me, as to De Wette, far-fetched. For how can fasting be called ἐπίβλημα ῥάκους ἀγνάφσυ , or how compared to new wine? And Neander himself, when he comes to explain the important addition in Luke (on which see [Luke 5:39] , and note), is obliged to change the meaning, and understand the new wine of the spirit of the Gospel. It was and is the custom in the East to carry their wine on a journey in leather bottles , generally of goats&rsquo; skin, sometimes of asses&rsquo; or camels&rsquo; skin. (Winer, Realwörterbuch, &lsquo;Schlauch.&rsquo;)"}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:17] . Ἀσκοὺς , leather bottles ) which were used instead of casks. The old bottles are the Pharisees; the new, the disciples; the wine, the Gospel. ἀπολοῦνται , will perish ) So that they can neither hold that, nor any other wine henceforward. ἀμφότεροι , both ) masculine, as τίς . in ch. [Matthew 23:17] ."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Old wineskins ( ασκους παλαιους ). Not glass \"bottles\" but wineskins used as bottles as is true in Palestine yet, goatskins with the rough part inside. \"Our word bottle originally carried the true meaning, being a bottle of leather. In Spanish bota means a leather bottle, a boot, and a butt. In Spain wine is still brought to market in pig-skins \" (Vincent). The new wine will ferment and crack the dried-up old skins. The wine is spilled ( εκχειτα ), poured out."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Bottles [ ασκους] . Rev., rightly, wine - skins, though our word bottle originally carried the true meaning, being a bottle of leather. In Spanish, bota means leather bottle, a boot, and a butt. In Spain wine is still brought to market in pig - skins. In the East, goat - skins are commonly used, with the rough side inward. When old, they break under the fermentation of the wine."}], "18": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:18] . ἰδοὺ … λέγων : exactly the same formula as in [Matthew 8:2] . ἄρχων , an important person, a ruler of synagogue, according to Mark. εἷς : peculiar here, but taken from Mark where it is intelligible, the suppliant being there described as one of the rulers of the synagogue. The word puzzled the scribes, and gave rise to many variants ( vide crit. note). ἄρτι ἐτελεύτησεν : this statement of Matthew, compared with those of Mark and Luke, which make the father say his daughter was dying, has created work for the harmonists. The patristic view (Chrys., Theophy., Euthy.), that the statement was an inference from the condition in which he left her, or a natural exaggeration, has been adopted by many. Probably it is an inaccuracy of the evangelist&rsquo;s due to abbreviation. The girl was dead when Jesus arrived; that was all he cared about. The ruler thought Jesus could do anything short of raising from the dead, save even in articulo mortis . But our evangelist gives him credit for more faith; that Jesus can bring back from the dead, at least when death has just taken place. ζήσεται , not remain living, but revive, come to life again (Fritzsche)."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "18. ἄρχων ] A ruler of the synagogue , named Jaeirus. In all except the connecting words, ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς , and εἰσ ελθ ., which seems to imply that our Lord was still in Levi&rsquo;s house, the account in the text is summary, and deficient in particularity. I have therefore reserved full annotation for the account in Luke, which see throughout. ἄρτι ἐτελεύτησεν ] She was not dead , but dying: at the last extremity. St. Matthew, omitting the message from the ruler&rsquo;s house ([Mark 5:35] ; Luk 8:49 ), gives the matter summarily in these words."}, {"src": "hmc", "name": "Meyer's Critical Commentary", "text": "[Matthew 9:18] . Ἄρχων ] a president ; Matthew does not further define the office. According to [Mark 5:22] , [Luke 8:41] , it was the synagogue-president , named Jairus . The correct reading is εἰσελθών (comp. the critical remarks), and not εἷς ἐλθών (Gersdorf, Rinck, de Wette, Tischendorf, Ewald), yet not as though the εις following were at variance with Matthew&rsquo;s usual style ([Matthew 22:35] , [Matthew 23:15] , [Matthew 26:40] ; [Matthew 26:69] , [Matthew 27:14] ; see, on the other hand, [Matthew 5:41] , [Matthew 6:27] , [Matthew 12:11] , [Matthew 18:5] , [Matthew 21:24] ); but since this, like the former incident, also occurred at that meal in the residence of Jesus (according to Matthew, not according to Mark and Luke), and as this fact was misapprehended, as most critics misapprehend it still, consequently it was not seen to what εἰσελθών might refer, so that it was changed into εἷς ἐλθών . According to Matthew, the order of the incidents connected with the meal is as follows: (1) Jesus sends away the Pharisees, [Matthew 9:11-13] . (2) After them, the disciples of John approach Him with their questions about fasting, and He instructs them, [Matthew 9:14-17] . (3) While he is still speaking to the latter, a president enters , [Matthew 9:18] , and prefers his request. Thereupon Jesus rises, i.e. from the table ([Matthew 9:10] ), and goes away with the ἄρχων , [Matthew 9:19] ; and it is not till [Matthew 9:28] that we read of His having returned again to His house. ἄρτι ἐτελεύτησεν ] has just now died . The want of harmony here with [Mark 5:23] , [Luke 7:49] , is to be recognised, but not (Olearius, Kuinoel) to be erroneously explained as meaning jam moritur, morti est proxima. Others (Luther, Wolf, Grotius, Rosenmüller, Lange) interpret, with Chrysostom, Theophylact, Euth. Zigabenus: στοχαζόμενος εἶπεν , ὑπέλαβε γὰρ , ὅτι μέχρι τότε πάντως ἂν ἀπέθανεν . A harmonizing expedient. Laying on of the hand , the symbol and medium in the communication of a divine benefit, [Matthew 19:13] ; [Luke 4:40] ; [Luke 13:13] . See on [Acts 6:6] ; [Acts 8:17] f., [Matthew 13:3] , [Matthew 19:5] ; [Genesis 48:14] ; [Numbers 27:18] . The account of [Mark 5:22-42] , which is followed by [Luke 8:41] ff., is so unique and fresh in regard to the detail which characterizes it, that it is not to be regarded as a later amplification (Strauss, Baur, Hilgenfeld, Keim, Bleek); that of Matthew follows a condensed form of the tradition, which, moreover, is responsible for straightway introducing the ἐτελεύτησεν as if forming part of what the president addressed to Jesus."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Matthew 9:18] . Προσεκύνει , worshipped ) Although in outward appearance Jairus was greater than Jesus. ἐτελεύτησεν , is dead ) Thus he said from conjecture, or after he had received intelligence of his daughter&rsquo;s death, whom he, in the great strength of faith, had left at the point of death. See [Mark 5:23] . ἐλθῶν , [420] coming ) cf. [John 4:47] . [420] Lachm. with BCD abcd Vulg. Hil. reads εἷς , and with BLU abc Vulg. (&lsquo;accessit&rsquo;) προσελθών . Tischend. has εἰσελθών ; Beng and Griesb. εἷς ἐλθών . Both these last two readings are equally tenable, as the letters are not separated in different words in MSS.: CDX Δ support either reading. Matth. often uses εἷς as אֶהָד = τις ; ch. [Matthew 8:19] , [Matthew 19:6] . ED."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Is even now dead ( αρτ ετελευτησεν ). Aorist tense with αρτ and so better, \"just now died,\" \"just dead\" (Moffatt). Mark ([Mark 5:23]) has it \"at the point of death,\" Luke ([Luke 8:42]) \"lay a dying.\" It is not always easy even for physicians to tell when actual death has come. Jesus in [Matthew 9:24] pointedly said, \"The damsel is not dead, but sleepeth,\" meaning that she did not die to stay dead."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Is even now dead [ αρτι ετελευτησεν] . The literal force of the aorist tense is more graphic. Just now died."}], "19": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:19] . ἐγερθεὶς apparently refers back to [Matthew 9:10] , implying close sequence feasting, fasting, dying; such is life indeed."}], "20": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Matthew 9:20] , καὶ ἰδού : a new applicant for help appears on the scene, on the way to Jairus&rsquo; house. γυνὴ … ἔτη , a woman who had suffered for twelve years from some kind of bloody flux. ὄπισθεν : realistic feature; from womanly shame or the morbid shrinking of chronic ill-health, or out of regard to the law concerning uncleanness ([Leviticus 15:0] ). κρασπέδου , Hebrew צִיצִת ([Numbers 15:38] ), fringes at the four corners of the outer garment, to remind of the commandments. In dress Jesus was not nonconformist. His mantle, ἱμάτιον , had its κράσπεδα like other p

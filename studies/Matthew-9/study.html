e we read, “But the Pharisees said, He casteth out\ndevils through the prince of the devils.”959 Matthew is the only one who introduces this\naccount of the two blind men and the dumb demoniac. For those two blind men, whose\nstory is given also by the others,960 are not the two before us here. Nevertheless there is such\nsimilarity in the occurrences, that if Matthew himself had not recorded the latter incident\nas well as the former, it might have been thought that the one which he relates at present\nhas also been given by these other two evangelists. There is this fact, therefore, which we\nought to bear carefully in mind,—namely, that there are some occurrences which resemble\neach other. For we have a proof of this in the circumstance that the very same evangelist\nmentions both incidents here. And thus, if at any time we find any such occurrences narrated\nindividually by the several evangelists, and discover some contradiction in the accounts,\nwhich seems not to admit of being solved [on the principle of harmonizing], it may occur\nto us that the explanation simply is, that this [apparently contradictory] circumstance did\nnot take place [on that particular occasion], but that what did happen then was only something\nresembling it, or something which was gone about in a", "lang": "latin", "orig": ""}, {"v": 28, "f": "Chrysostom - Homilies on John", "w": "Homily XXXII.", "t": "“And when Jesus departed thence, two blind men followed Him, crying, and saying, Thou Son\nof David, have mercy on us.1334And when He was come into the house, the blind men\ncame to Him: and Jesus saith unto them, Believe ye that I am able to do this? They say\nunto Him, Yea, Lord. Then touched He their eyes, saying, According to your faith be\nit1335unto you. And their eyes were opened.”", "lang": "greek", "orig": ""}, {"v": 28, "f": "Jerome", "w": "", "t": "As the Lord Jesus was passing on from the ruler’s house and proceeding to his own (as we read above): “And getting into a boat he crossed over and came to his own city,” suddenly “two blind men cried out and said, ‘Have pity on us, Son of David!’ ” They are not healed along the route, as they might expect, but only after he reached his house. They approach him and go inside. First, their faith is discussed that they may receive the light of true faith. Another sign is added to the first sign we mentioned about the ruler’s daughter and the woman with a hemorrhage, so that what death and disability demonstrated in the one case, blindness demonstrated in the other. Both men were blind at the time the Lord was passing through this world on the way to his house. Unless they had exclaimed “Have pity on us, Son of David!” and in answer to Jesus’ question “Do you believe that I can do this to you?” affirmed “Yes, Lord,” they would not have received the pristine light.", "lang": "english", "orig": ""}, {"v": 28, "f": "Jerome", "w": "", "t": "Yet were they not healed by the way-side and in passing as they had thought to be; but when He was entered into the house, they come unto Him; and first their faith is made proof of, that so they may receive the light of the true faith. And when he was come into the house, the blind men came unto him; and Jesus said unto them, Believe ye that I am able to do this?", "lang": "english", "orig": ""}, {"v": 28, "f": "Jerome", "w": "", "t": "(Verse 28, 29.) Have mercy on us, Son of David. And when he came into the house, the blind men came to him, and Jesus said to them: Do you believe that I can do this for you? They said to him: Yes, Lord. Then he touched their eyes, saying: Let it be done to you according to your faith. And their eyes were opened. Let Marcion and Manichaeus, and other heretics, who tear apart the Old Testament, hear this and learn that the Savior is called the Son of David. For if he was not born in the flesh, how is he called the son of David?", "lang": "english", "orig": ""}, {"v": 28, "f": "John Chrysostom", "w": "", "t": "And having brought them into the house, He puts to them a further question. For in many cases He made a point of healing on entreaty, lest any should suppose Him to be rushing upon these miracles through vainglory: and not on this account alone, but to indicate also that they deserve healing, and that no one should say, \"If it was of mere mercy that He saved, all men ought to be saved.\" For even His love to man hath a kind of proportion; depending on the faith of them that are healed. But not for these causes only doth He require faith of them, but forasmuch as they called Him \"Son of David,\" He to lead them up to what is higher, and to teach them to entertain the imaginations they ought of Himself, saith, \"Believe ye that I am able to do this?\" He did not say, \"Believe ye that I am able to entreat my Father, that I am able to pray\" but, \"that I am able to do this?\"\n\nWhat then is their word? \"Yea, Lord.\" They call Him no more Son of David, but soar higher, and acknowledge His dominion.", "lang": "english", "orig": ""}, {"v": 28, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And when Jesus departed thence, two blind men followed Him, crying, and saying, Thou Son of David, have mercy on us.  And when He had come into the house, the blind men came to Him: and Jesus says unto them, Believe ye that I am able to do this? They say unto Him, Yea, Lord. Then touched He their eyes, saying, According to your faith be it  unto you. And their eyes were opened.", "lang": "", "orig": ""}, {"v": 28, "f": "Remigius of Rheims", "w": "", "t": "He who was able to give sight to the blind, was not ignorant whether they believed; but He asked them, in order that the faith which they bare in their hearts, being confessed by their mouth might be made deserving of a higher reward, according to that of the Apostle, By the mouth confession is made unto salvation. (Rom. 10:10.)", "lang": "english", "orig": ""}, {"v": 28, "f": "Theophylact of Ohrid", "w": "", "t": "\"And when He was come into the house, the blind men came to Him: and Jesus saith unto them, Believe ye that I am able to do this? They said unto Him, Yea, Lord.\" He led the blind men along even as far as the house, to show their steadfast faith, and thus to condemn the Jews. He asks them if they believe, showing that faith can accomplish all things.", "lang": "english", "orig": ""}, {"v": 28, "f": "Thomas Aquinas", "w": "", "t": "Then he tests the petitioners. First, in deed, by delaying to hear them. For faith is shown to be firm, when a request is not obtained at once: \"If it seem slow, wait for it; it will surely come and will not delay\" (Hab 2:3). Hence he led them, until he came to the house. When he entered the house... By that house is signified the Church, because it is God's house or heaven: \"The heavens are the Lord's heavens\" (Ps 115:16). Then he tests them by word: \"Do you believe I am able to do this?\" He does not ask this as though he did not know, but to increase their merit: \"Man believes with his heart, and he confesses with his lips, and so is saved\" (Rom 10:10). Likewise, he questions them, that their faith be shown and that they know they were justly given sight. He also questions them in order to move them to greater things, for it was a great thing to confess that he was the son of David. But it was not enough; consequently, he asks more of them: Do you believe I can do this?, namely, by my own power, i.e., something only God can do? They said to him: \"Yes, Lord.\" So now they call him Lord, which is proper to God alone.", "lang": "english", "orig": ""}, {"v": 29, "f": "John Chrysostom", "w": "", "t": "And then at last He for His part lays His hand upon them, saying, \"According to your faith be it unto you.\" And this He doth to confirm their faith, and to show that they are participators in the good work, and to witness that their words were not words of flattery. For neither did He say, \"Let your eyes be opened,\" but, \"According to your faith be it unto you;\" which He saith to many of them that came unto Him; before the healing of their bodies, hastening to proclaim the faith in their soul; so as both to make them more approved, and to render others more serious.\n\nThus with respect to the sick of the palsy also; for there too before giving nerve to the body, He raises up the fallen soul, saying, \"Son, be of good cheer, thy sins be forgiven thee.\" And the young damsel too, when He had raised her up, He detained, and by the food taught her her Benefactor; and in the case of the centurion also He did in like manner, leaving the whole to his faith; and as to His disciples again, when delivering them from the storm on the sea, He delivered them first from their want of faith. Just so likewise in this case: He knew indeed, even before their cry, the secrets of their mind; but that He might lead on others also to the same earnestness, He makes them known to the rest as well, by the result of their cure proclaiming their hidden faith.", "lang": "english", "orig": ""}, {"v": 29, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And then at last He for His part lays His hand upon them, saying, According to your faith be it unto you. And this He does to confirm their faith, and to show that they are participators in the good work, and to witness that their words were not words of flattery. For neither did He say, Let your eyes be opened, but, According to your faith be it unto you; which He says to many of them that came unto Him; before the healing of their bodies, hastening to proclaim the faith in their soul; so as both to make them more approved, and to render others more serious.", "lang": "", "orig": ""}, {"v": 29, "f": "Theophylact of Ohrid", "w": "", "t": "\"Then touched He their eyes, saying, According to your faith be it unto you. And their eyes were opened.\" He healed within the house and in private, to show us how to avoid vainglory. In everything He did He taught humility.", "lang": "english", "orig": ""}, {"v": 29, "f": "Thomas Aquinas", "w": "", "t": "Then the granting of the request: first, the cure is mentioned; secondly, the effect of the cure (v. 30).\n\nThe cure occurred when he touched their eyes, saying..., hence he touched and spoke. Either would have been enough; yet he did both to signify that blindness is taken away by the word of God: \"The Word was made flesh and dwelt among us, and we have seen his glory\" (Jn 1:14). So he says, According to your faith be it done to you, because those who without faith are blind become illumined by the merit of faith.", "lang": "english", "orig": ""}, {"v": 30, "f": "Gregory the Dialogist", "w": "", "t": "(Mor. xix. 23.) We must enquire how this is that the Almighty, whose will and power are coextensive, should have here willed that His excellent works should be hid in silence, and is yet preached against His will, as it were, by these men who have received their sight. It is only that He herein has left an example to His servants who follow Him, that they should desire their own good deeds to be hid, and that notwithstanding they should be made known against their will, that others may profit by their example. They should then be hid by design, and published of compulsion; their concealment is by our own watchfulness, their betrayal is for others' profit.", "lang": "english", "orig": ""}, {"v": 30, "f": "Hilary of Poitiers", "w": "", "t": "Or He enjoins silence on the blind men, because to preach was the Apostles' office.", "lang": "english", "orig": ""}, {"v": 30, "f": "Jerome", "w": "", "t": "(Verse 30, 31.) And Jesus warned them, saying, \"See that no one knows.\" But when they went out, they spread the news about him throughout that whole land. And the Lord, fleeing the glory of boastfulness because of his humility, had commanded this. And they, because of the remembrance of his grace, cannot remain silent about the kindness. Note, therefore, that something contrary to what was commanded must have happened. These blind men are healed in the tenth place.", "lang": "english", "orig": ""}, {"v": 30, "f": "Jerome", "w": "", "t": "The Lord from humility shunning the fame of His glorious works, gave them this charge, and they from gratitude cannot be silent respecting so great benefit.", "lang": "english", "orig": ""}, {"v": 30, "f": "John Chrysostom", "w": "", "t": "Then after their cure He commands them to tell no man; neither doth He merely command them, but with much strictness.\n\n\"For Jesus,\" it is said, \"straitly charged them, saying, See that no man know it. But they, when they were departed, spread abroad His fame in all that country.\"\n\nThey however did not endure this, but became preachers, and evangelists; and when bidden to hide what had been done, they endured it not.\n\nAnd if in another place we find Him saying, \"Go thy way, and declare the glory of God,\" that is not contrary to this, but even highly in agreement herewith. For He instructs us to say nothing ourselves, concerning ourselves, but even to forbid them that would eulogise us: but if the glory be referred to God, then not only not to forbid, but to command men to do this.", "lang": "english", "orig": ""}, {"v": 30, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For Jesus, it is said, strictly charged them, saying, See that no man know it. But they, when they were departed, spread abroad His fame in all that country. Matthew 9:30-31", "lang": "", "orig": ""}, {"v": 30, "f": "Theophylact of Ohrid", "w": "", "t": "\"And Jesus sternly charged them, saying, See that no man know it. But they, when they were departed, spread abroad His fame in all that country.\" Do you see Christ's humility? They spread abroad His fame in thanksgiving, not out of disobedience. But if in another place Christ says, \"Go and tell of the glory of God\" (Lk. 8:39), there is nothing contradictory in this. For He wants them to say nothing about Himself, but to speak of the glory of God.", "lang": "english", "orig": ""}, {"v": 30, "f": "Thomas Aquinas", "w": "", "t": "Then the effect: and their eyes were opened. First, therefore, he gives light, and so is fulfilled what is said in John (1:4): \"And the life was the light of men,\" and Isaiah (35:4): \"He will come and save us.\"\n\nFinally the charge: And Jesus sternly charged them. Why this? For elsewhere (Lk 8:39): \"Return to your home, and declare how much God has done for you.\" Chrysostom: We can consider two things in regard to what is good in us: what is of God and what is of ourselves. What is of ourselves we should conceal; what is of God we should publicize, as Paul in Philippians (2:21): \"Not looking after our own interests but those of Jesus Christ\"; and in Matthew (5:16): \"That they may see your good works and glorify your Father in heaven.\" Hence he says, See that no one knows this, teaching us to avoid vainglory.", "lang": "english", "orig": ""}, {"v": 31, "f": "Thomas Aquinas", "w": "", "t": "But they, not unmindful of the gift received, went about and published it, as it says in Isaiah (63:7): \"I will recount the Lord's mercies.\" But did they sin by acting contrary to the Lord's command? I say that they did not, because they acted in good faith and in order to show how much holiness the Lord displayed.", "lang": "english", "orig": ""}, {"v": 32, "f": "Augustine of Hippo", "w": "", "t": "(De Cons. Ev. ii. 29.) This account of the two blind men and the dumb dæmon is read in Matthew only. The two blind men of whom the others speak are not the same as these, though something similar was done with them. So that even if Matthew had not also recorded their cure, we might have seen that this present narrative was of a different transaction. And this we ought diligently to remember, that many actions of our Lord are very much like one another, but are proved not to be the same action, by being both related at different times by the same Evangelist. So that when we find cases in which one is recorded by one Evangelist, and another by another, and some difference which we cannot reconcile between their accounts, we should suppose that they are like, but not the same, events.", "lang": "english", "orig": ""}, {"v": 32, "f": "Hilary of Poitiers", "w": "", "t": "By the dumb and deaf, and dæmoniae, is signified the Gentile world, needing health in every part; for sunk in evil of every kind, they are afflicted with disease of every part of the body.", "lang": "english", "orig": ""}, {"v": 32, "f": "Hilary of Poitiers", "w": "", "t": "The natural order of things is here preserved; the dæmon is first cast out, and there the functions of the members proceed. And the multitude marvelled, saying, It was never so seen in Israel.", "lang": "english", "orig": ""}, {"v": 32, "f": "Jerome", "w": "", "t": "What is called in Greek kophos is more commonly known as deaf rather than dumb, but the Scriptures indiscriminately use kophos to mean dumb or deaf. Spiritually, just as the blind men receive light, so too the dumb man’s tongue is loosened that he may speak and give glory to him whom he once rejected.", "lang": "english", "orig": ""}, {"v": 32, "f": "Jerome", "w": "", "t": "(Verse 32) And when they had departed, behold, they brought to Him a man who was mute and demon-possessed. And when the demon was cast out, the mute spoke. And the multitudes marveled, saying, “It was never seen like this in Israel!” But the Pharisees said, “He casts out demons by the ruler of the demons.”", "lang": "english", "orig": ""}, {"v": 32, "f": "Jerome", "w": "", "t": "The Greek word here (κωφὸς) is more frequent in common speech in the sense of 'deaf,' but it is the manner of Scripture to use it indifferently as either.", "lang": "english", "orig": ""}, {"v": 32, "f": "John Chrysostom", "w": "", "t": "\"And as they went out,\" it is said, \"behold, they brought unto Him a dumb man possessed with a devil.\"\n\nFor the affliction was not natural, but the device of the evil Spirit; wherefore also he needs others to bring him. For he could neither make entreaty himself, being speechless, nor supplicate others, when the evil spirit had bound his tongue, and together with his tongue had fettered his soul.\n\nFor this cause neither doth He require faith of him, but straightway heals the disease.", "lang": "english", "orig": ""}, {"v": 32, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "2. And as they went out, it is said, behold, they brought unto Him a dumb man possessed with a devil.", "lang": "", "orig": ""}, {"v": 32, "f": "Rabanus Maurus", "w": "", "t": "Figuratively; As in the two blind men were denoted both nations, Jews and Gentiles, so in the man dumb and afflicted with the daemon is denoted the whole human race.", "lang": "english", "orig": ""}, {"v": 32, "f": "Remigius of Rheims", "w": "", "t": "Observe the beautiful order of His miracles; how after He had given sight to the blind, He restored speech to the dumb, and healed the possessed of the dæmon; by which He shows Himself the Lord of power, and the author of the heavenly medicine. For it was said by Isaiah, Then shall the eyes of the blind be opened, the ears of the deaf shall be unstopped, and the tongue of the dumb loosed. (Is. 35:6.) Whence it is said, When they were gone forth, they brought unto him a man dumb, and possessed with a dæmon.\n\nFor the Gentiles were dumb; not being able to open their mouth in the confession of the true faith, and the praises of the Creator, or because in paying worship to dumb idols they were made like unto them. They were afflicted with a dæmon, because by dying in unbelief they were made subject to the power of the Devil.\n\nThey who brought the dumb to be healed by the Lord, signify the Apostles and preachers, who brought the Gentile people to be saved before the face of divine mercy.", "lang": "english", "orig": ""}, {"v": 32, "f": "Theophylact of Ohrid", "w": "", "t": "\"As they went out, behold, they brought to Him a mute man possessed with a demon. And when the demon was cast out, the mute spake.\" The disease was not a natural one, but from the demon. This is why others brought him forward. He himself was not able to call upon Jesus, as the demon had bound his tongue. Therefore Jesus does not require faith of him, but immediately heals him by casting out the demon which had prevented his speech. And the multitudes marvelled, saying, It was never so seen in Israel. The multitude marvelled, placing Christ even above the prophets and the patriarchs. For He healed with authority, unlike those who first had to pray.", "lang": "english", "orig": ""}, {"v": 32, "f": "Thomas Aquinas", "w": "", "t": "As they were going away, a dumb demoniac was brought up to him. After restoring sight to the blind, he now restores speech to a dumb man. Those two incidents are fittingly joined, because speech is the sign of inward sight: \"He will come and save you. Then the eyes of the blind shall be opened, and the ears of the deaf unstopped\" (Is 35:4-5). Here he does three things: first, the infirm man is described; secondly, the cure (v. 33); thirdly, the effect of the cure (v. 33b).\n\nHe says, therefore, As they were going away... Faith is not asked of him as of the others, because he was possessed by a devil; therefore, he was not in control of his mental faculties. That is why he was not tested about his faith. And he signifies the gentiles, who are mute in regard to praise: \"Pour out your anger on the nations which do not know you\" (Ps 79:6). Furthermore, they have a devil, because they sacrificed to devils: \"All the gods of the nations are devils\" (Ps 96:5). First, therefore, as a good physician he cured the cause and then the disease, because he cast out the devil first.", "lang": "english", "orig": ""}, {"v": 33, "f": "Hilary of Poitiers", "w": "", "t": "In the deaf and dumb and demoniac appear the need of the Gentiles for a complete healing. Beleaguered on all sides by misfortune, they were associated with all types of the body’s infirmities. And in this regard a proper order of things is observed. For the devil is first cast out; then the other bodily benefits follow suit. With the folly of all superstitions put to flight by the knowledge of God, sight and hearing and words of healing are introduced. The declaration of the onlookers followed their admiration over what took place: “Never has the like been seen in Israel.” Indeed, he whom the law could not help was made well by the power of the Word, and the deaf and dumb man spoke the praises of God. Deliverance has been given to the Gentiles. All the towns and all the villages are enlightened by the power and presence of Christ, and the people are freed from every impairment of the timeless malady.", "lang": "english", "orig": ""}, {"v": 33, "f": "Hilary of Poitiers", "w": "", "t": "But by the knowledge of God the frenzy of superstition being chased away, the sight, the hearing, and the word of salvation is brought in to them.", "lang": "english", "orig": ""}, {"v": 33, "f": "Hilary of Poitiers", "w": "", "t": "The wonder of the multitude is followed up by the confession, It was never so seen in Israel; because he, for whom there was no help under the Law, is saved by the power of the Word.", "lang": "english", "orig": ""}, {"v": 33, "f": "Jerome", "w": "", "t": "(Verse 33, 34.) And the crowds marveled, saying: Never has it appeared like this in Israel. But the Pharisees said: By the prince of demons he casts out demons. The crowd confesses the works of God, and says: Never has it appeared like this in Israel. In the crowd, there is a confession of the nations. But because the Pharisees could not deny the power of God, they slandered his works and said: By the prince of demons he casts out demons, thus demonstrating the unbelief of the Jews through their slander even today.", "lang": "english", "orig": ""}, {"v": 33, "f": "Jerome", "w": "", "t": "As the blind receive light, so the tongue of the dumb is loosed, that he may confess Him whom before he denied. The wonder of the multitude is the confession of the nations. The scoff of the Pharisees is the unbelief of the Jews, which is to this day.", "lang": "english", "orig": ""}, {"v": 33, "f": "John Chrysostom", "w": "", "t": "\"For when the devil was cast out,\" it saith, \"the dumb spake: and the multitudes marvelled, saying, It was never so seen in Israel.\"\n\nNow this especially vexed the Pharisees, that they preferred Him to all, not only that then were, but that had ever been. And they preferred Him, not for His healing, but for His doing it easily and quickly, and to diseases innumerable and incurable.\n\nAnd thus the multitude; but the Pharisees quite contrariwise; not only disparaging the works, but saying things contradictory to themselves, and not ashamed. Such a thing is wickedness.", "lang": "english", "orig": ""}, {"v": 33, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For when the devil was cast out, it says, the dumb spoke: and the multitudes marvelled, saying, It was never so seen in Israel. Matthew 9:33", "lang": "", "orig": ""}, {"v": 33, "f": "Thomas Aquinas", "w": "", "t": "Then when the demon had been cast out, the dumb man spoke. So the gentile, when freed from serving idols, spoke, namely, God's praise: \"That every tongue confess that the Lord Jesus Christ is in the glory of the Father\" (Phil 2:11).\n\nThe effect follows: And the crowds marveled at what they saw. And because they marveled, they said: Never was anything like this seen in Israel. Now it is true that Moses and others worked miracles; but no one had worked so many or by a mere touch or as quickly as he: \"Who is like you, O Lord, among the gods?\" (Ex 15:11); \"The works I do in my Father's name, they bear witness to me\" (Jn 10:25). He also cures by faith, which the Law could not do, as it says in Romans (8:2): \"For the Law of the Spirit of life in Christ Jesus has set me free from the law of sin and death,\" which was impossible for the Law.", "lang": "english", "orig": ""}, {"v": 34, "f": "John Chrysostom", "w": "", "t": "\"He casteth out devils through the prince of the devils.\"\n\nWhat can be more foolish than this? For in the first place, as He also saith further on, it is impossible that a devil should cast out a devil for that being is wont to repair what belongs to himself, not to pull it down. But He did not cast out devils only, but also cleansed lepers, and raised the dead, and curbed the sea, and remitted sins, and preached the kingdom, and brought men unto the Father; things which a demon would never either choose, or at any time be able to effect. For the devils bring men to idols, and withdraw them from God, and persuade them to disbelieve the life to come. The devil doth not bestow kindness when he is insulted; forasmuch as even when not insulted, he harms those that court and honor him.\n\nBut He doeth the contrary. For after these their insults and revilings, He went about all the cities and villages, teaching in their synagogues, and preaching the gospel of the kingdom, and healing every sickness and every disease.", "lang": "english", "orig": ""}, {"v": 34, "f": "Remigius of Rheims", "w": "", "t": "Thus the Scribes and Pharisees denied such of the Lord's miracles as they could deny; and such as they could not they explained by an evil interpretation, according to that, In the multitude of thy excellency thy enemies shall lie unto thee. (Ps. 66:3.)", "lang": "english", "orig": ""}, {"v": 34, "f": "Theophylact of Ohrid", "w": "", "t": "\"But the Pharisees said, He casteth out demons through the prince of demons.\" These words are the height of stupidity. For no demon casts out other demons. But let us suppose that He cast out demons as one who served the prince of demons, that is, as a magician. How then did He heal diseases, forgive sins, and preach the kingdom? For the demon does just the opposite: he brings on diseases and separates man from God.", "lang": "english", "orig": ""}, {"v": 34, "f": "Thomas Aquinas", "w": "", "t": "But the Pharisees said... The Pharisees, i.e., the separated, because they interpreted in a perverse way: \"They turned good into evil\" (Sir 11:31). Hence they said: He casts out devils by the prince of devils. Here Augustine tells us to note that Christ performed the same miracle twice. This is evident, because the evangelists say different things. Hence, when they seem to be contrary, we can refer to one or to another by saying that it was another miracle.", "lang": "english", "orig": ""}, {"v": 35, "f": "Glossa Ordinaria", "w": "", "t": "(non occ.) He taught in their synagogues the Gospel of the Kingdom, as it follows, Preaching the Gospel of the Kingdom.", "lang": "english", "orig": ""}, {"v": 35, "f": "Glossa Ordinaria", "w": "", "t": "(ap. Anselm.) By disease we may understand complaints of long standing, by sickness any lesser infirmity.", "lang": "english", "orig": ""}, {"v": 35, "f": "Jerome", "w": "", "t": "(Verse 35.) And Jesus went about all the cities and towns, teaching in their synagogues and preaching the Gospel of the kingdom, and healing all illness and every infirmity. You see that He preached the Gospel equally to both villages and cities, that is, to both large and small, so that He would not consider the power of the nobles, but the salvation of the believers. He went through the cities, having this work that the Father had commanded: and this hunger, to save the unbelievers with His teaching. But He was teaching the Gospel of the kingdom in the synagogues and villages, and after preaching and teaching, He cured every illness and every infirmity, so that those whom his words did not persuade, his deeds would persuade. He is properly called the Lord, who cares for every illness and every infirmity, for nothing is impossible for Him.", "lang": "english", "orig": ""}, {"v": 35, "f": "Jerome", "w": "", "t": "Observe how equally in villages, cities, and towns, that is to great as well as small, He preaches the Gospel, not respecting the might of the noble, but the salvation of those that believe. It follows, Teaching in their synagogues; this was His meat, going about to do the will of His Father, and saving by His teaching such as yet believed not.\n\nHe first preached and taught, and then proceeded to heal sicknesses, that the works might convince those who would not believe the words. Hence it follows, Healing every sickness and every disease, for to Him alone nothing is impossible.", "lang": "english", "orig": ""}, {"v": 35, "f": "John Chrysostom", "w": "", "t": "\"He went about,\" it is said, \"all the cities and villages, teaching in their synagogues, and preaching the gospel of the kingdom, and healing every sickness and every disease.\"\n\nAnd so far from punishing them for their insensibility, He did not even simply rebuke them; at once both evincing His meekness, and so refuting the calumny; and at the same time minded also by the signs which followed to exhibit His proof more completely: and then to adduce also the refutation by words. He went about therefore both in cities, and in countries, and in their synagogues; instructing us to requite our calumniators, not with fresh calumnies, but with greater benefits. Since, if not for man's sake, but God's, thou doest good to thy fellow-servants; whatsoever they may do, leave not thou off doing them good, that thy reward may be greater; since he surely, who upon their calumny leaves off his doing good, signifies that for their praise' sake, not for God's sake, he applies himself to that kind of virtue.\n\nFor this cause Christ, to teach us that of mere goodness He had entered on this, so far from waiting for the sick to come to Him, of Himself hastened unto them, bearing them two of the greatest blessings; one, the gospel of the kingdom; another, the perfect cure of all their diseases. And not a city did He overlook, not a village did He hasten by, but visited every place.", "lang": "english", "orig": ""}, {"v": 35, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "3. He went about, it is said, all the cities and villages, teaching in their synagogues, and preaching the gospel of the kingdom, and healing every sickness and every disease.", "lang": "", "orig": ""}, {"v": 35, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For this cause Christ, to teach us that of mere goodness He had entered on this, so far from waiting for the sick to come to Him, of Himself hastened unto them, bearing them two of the greatest blessings; one, the gospel of the kingdom; another, the perfect cure of all their diseases. And not a city did He overlook, not a village did He hasten by, but visited every place.", "lang": "", "orig": ""}, {"v": 35, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For then, it is said, began Jesus to upbraid the cities, wherein most of His mighty works were done, because they repented not; saying, Woe unto you, Chorazin! Woe unto you, Bethsaida! Matthew 11:20-21", "lang": "", "orig": ""}, {"v": 35, "f": "Remigius of Rheims", "w": "", "t": "Understand, 'of God;' for though temporal blessings are also proclaimed, yet they are not called The Gospel. Hence the Law was not called a Gospel, because to such as kept it, it held out not heavenly, but earthly, goods.\n\nIt should be known that those whom He healed outwardly in their bodies, He also healed inwardly in their souls. Others cannot do this of their own power, but can by God's grace.", "lang": "english", "orig": ""}, {"v": 35, "f": "Theophylact of Ohrid", "w": "", "t": "\"And Jesus went about all the cities and villages, teaching in their synagogues, and preaching the Gospel of the kingdom, and healing every disease and every infirmity among the people.\" As Lover of mankind He did not wait for them to come to Him, but He Himself went all around. Therefore they could not say as an excuse that \"no one taught us.\" He draws them to Himself by word and deed, teaching and working wonders.", "lang": "english", "orig": ""}, {"v": 35, "f": "Thomas Aquinas", "w": "", "t": "It has been shown that he helped those who came to him; here he tells how he went to others. He does two things: first, how he bestowed effects on some; secondly, affects (v. 36).\n\nIn regard to the first he shows where he confers help; secondly, what he taught; thirdly, what he did.\n\nHe says, therefore, And Jesus went about all the cities and villages. In this an example is given to preachers not to be content with preaching only in one place: \"I have appointed you that you should go and bear fruit\" (Jn 15:16). All the cities and villages. It is fitting that this be connected with the preceding events. Since they had said that he cast out devils by the prince of devils, he shows that he does not have a devil: \"I am for peace; but when I speak, they are for war\" (Ps 120:7).\n\nThen he tells what he announced. For he did two things, because he was preaching and teaching in their synagogues. He taught matters pertaining to faith and preached about morals. He did this in the presence of many, because in the synagogues: \"I have told of your justice in the great congregation\" (Ps 40:9). In this he differs from heretics, who teach in secret. But Christ's teaching was otherwise: \"I have said nothing in secret\" (Jn 18:20). He also touches on what he taught, namely, the gospel of the kingdom: \"For this I was born, and for this have I come into the world, to bear witness to the truth\" (Jn 18:37). Hence he taught heavenly things: \"I, the Lord, teach you what is profitable\" (Is 48:17). Then", "lang": "english", "orig": ""}, {"v": 36, "f": "Glossa Ordinaria", "w": "", "t": "(ap. Anselm.) Or, troubled by dæmons, and sick, that is, benumbed and unable to rise; and though they had shepherds, yet they were as though they had them not.", "lang": "english", "orig": ""}, {"v": 36, "f": "Hilary of Poitiers", "w": "", "t": "Figuratively; When salvation was given to the Gentiles, then all cities and towns were enlightened by the power and entrance of Christ, and escaped every former sickness and infirmity. The Lord pities the people troubled with the violence of the unclean Spirit, and sick under the burden of the Law, and having no shepherd at hand to bestow on them the guardianship of the Holy Spirit. But of that gift there was a most abundant fruit, whose plenty far exceeded the multitude of those that drank thereof; how many soever take of it, yet an inexhaustible supply remains; and because it is profitable that there should be many to minister it, He bids us ask the Lord of the harvest, that God would provide a supply of reapers for the ministration of that gift of the Holy Spirit which was made ready; for by prayer this gift is poured out upon us from God.", "lang": "english", "orig": ""}, {"v": 36, "f": "Hilary of Poitiers", "w": "", "t": "No instigator had stirred up the crowds. They were not harassed and helpless because of some mishap or disturbance. So why is Jesus so moved with compassion for these people? Clearly the Lord has pity on these people held in the sway of an unclean spirit and burdened by the law, because no shepherd was about to restore to them the guardianship of the Holy Spirit. The fruit of this gift was indeed potentially abundant but not yet harvested by anyone. The bounty of the Spirit overwhelms the multitude of those who take hold of it. For no matter how much it is gathered by everyone, it abounds in fruitfulness. And because it is good to have many people through whom he is served, he orders his disciples to pray to the Lord of the harvest to send forth as many laborers as possible into the harvest. He prays that God may bestow an abundance of reapers to take hold of what the gift of the Holy Spirit was preparing. Through prayer and exhortation, God pours out this gift upon us.", "lang": "english", "orig": ""}, {"v": 36, "f": "Irenaeus", "w": "CHAP. III.", "t": "Seeing them, therefore, so beaten and so badly used, I was grieved for them, because\nthey were so tormented, and had no rest at all. And I said to the Shepherd who talked with\nme, “Sir, who is this shepherd, who is so pitiless and severe, and so completely devoid of\ncompassion for these sheep?” “This,” he replied, “is the angel of punishment;296 and he belongs\nto the just angels, and is appointed to punish. He accordingly takes those who wander\naway from God, and who have walked in the desires and deceits of this world, and chastises\n292 καταφθοράν, translated in Pal. And Vat. by defectio, apostasy, as departure from goodness and truth.\nThe Æthiopic has “ruin.”\n293 Of … deceit, omitted in Lips. Our translation is made from the Vat.\n294 Pseudo-Athanasius has, “of such men the life is death.”\n295 Pseudo-Athanasius has, “Corruption, therefore, has a hope of resurrection up to a certain point.” [Death\nhere must mean final apostasy (Heb. vi. 4–6, x. 26–31, xii. 15–17). But a certain death-in-life, which is not final,\nis instanced in Rev. iii. 1; note also 1 John iii. 14, 15, v. 16, 17.]\n296 [The idea is, the minister of discipline, as St. Ambrose is represented with a scourge in his hand. The Greek\n(ἐκ τῶν ἀγγέλων τῶν δικαίων) favours the idea that faithful pastors are here symbolized,—just stewards and\nrighteous men.]\n\n\nthem as they deserve with terrible and diverse punishments.” “I would know, sir,” I said,\n“Of what nature are these diverse tortures and punishments?” “Hear,” he ", "lang": "greek", "orig": ""}, {"v": 36, "f": "Jerome", "w": "", "t": "(Verse 36.) But seeing the crowds, he had compassion on them, because they were harassed and helpless, like sheep without a shepherd. Then he said to his disciples. The persecution of the flock and sheep and the disturbance of the crowds is the fault of the shepherds and the vice of the leaders. Hence it follows.", "lang": "english", "orig": ""}, {"v": 36, "f": "John Chrysostom", "w": "", "t": "And contemplate Him here too beginning from love to man, not with any requital. \"For He had compassion, because they were troubled and scattered abroad as sheep having no shepherd.\" This is His charge against the rulers of the Jews, that being shepherds they acted the part of wolves. For so far from amending the multitude, they even marred their progress. For instance, when they were marvelling and saying, \"It was never so seen in Israel:\" these were affirming the contrary, \"He casteth out devils through the prince of the devils.\"", "lang": "english", "orig": ""}, {"v": 36, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "When He saw, it is said, the multitudes, He was moved with compassion on them, because they were troubled, and scattered abroad, as sheep having no shepherd. Then says He unto His disciples, The harvest truly is plenteous, but the laborers are few, pray ye therefore the Lord of the harvest, that He will send forth laborers into His harvest.", "lang": "", "orig": ""}, {"v": 36, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And He bids them have not only gentleness as sheep, but also the harmlessness of the dove. For thus shall I best show forth my might, when sheep get the better of wolves, and being in the midst of wolves, and receiving a thousand bites, so far from being consumed, do even work a change on them a thing far greater and more marvellous than killing them, to alter their spirit, and to reform their mind; and this, being only twelve, while the whole world is filled with the wolves.", "lang": "", "orig": ""}, {"v": 36, "f": "Remigius of Rheims", "w": "", "t": "Herein Christ shows in Himself the disposition of the good shepherd and not that of the hireling. Why He pitied them is added, Because they were troubled, and sick as sheep that have no shepherd—troubled either by dæmons, or by divers sicknesses and infirmities.", "lang": "english", "orig": ""}, {"v": 36, "f": "Theophylact of Ohrid", "w": "", "t": "\"But when He saw the multitudes, He was moved with compassion on them because they grew faint and were scattered abroad, as sheep having no shepherd.\" They did not have a shepherd. For their rulers not only failed to correct them, but even harmed them. The mark of the true shepherd is to have compassion for his flock.", "lang": "english", "orig": ""}, {"v": 36, "f": "Thomas Aquinas", "w": "", "t": "When he saw the crowds, he had compassion for them. Here he shows how Jesus showed affection toward some. This is contrary to those who held that no affection was sufficient, but that effects were required; but here he says, When he saw the crowds, he had compassion on them. First, he mentions how he had compassion; secondly, he presents an example.\n\nThen he mentions Christ's mercy; secondly, the cause.\n\nHe says, therefore, When he saw the crowds, namely, by a pious consideration, he had compassion on them, because it belongs to him to have compassion: \"His compassion is over all his works\" (Ps 145:9). This is what David desired to experience: \"Turn to me and be gracious to me\" (Ps 25:16).\n\nAnd toward whom did he show compassion? To those who were harassed by devils and lying down, i.e., helpless in their infirmities. Or harassed by errors, lying down in their sins, like sheep without a shepherd. Hence Proverbs (11:14): \"Where there is no guidance, the people falls\"; \"My sheep were scattered, because there was no shepherd\" (Ezekiel 34:5); and in the same (v. 2): \"Woe to the shepherds of Israel who fed themselves\"; and Zechariah (11:17): \"Woe to my worthless shepherd, who deserts the flock!\"", "lang": "english", "orig": ""}, {"v": 37, "f": "Augustine - Confessions", "w": "Sermon LI.", "t": "1. By the lesson of the Gospel which has just been read, we are reminded to search what\nthat harvest is of which the Lord says, “The harvest truly is great, but the labourers are few.\nPray ye the Lord of the harvest, that He would send forth labourers into His harvest.”3262\nThen to His twelve disciples, whom He also named Apostles, He added other seventy-two,\nand sent them all, as appears from His words, to the harvest then ready. What then was that\nharvest? For that harvest was not among these Gentiles, among whom there had been\nnothing sown. It remains therefore that we understand that this harvest was among the\npeople of the Jews. It was to that harvest that the Lord of the harvest came, to that harvest\nHe sent reapers; but to the Gentiles He sent not reapers, but sowers. Understand we then\nthat it was harvest among the people of the Jews, sowing time among the peoples of the\nGentiles. For out of that harvest were the Apostles chosen, where now that the harvest was,\nthe corn was already ripe; for there had the Prophets sown. Delightful it is to take a view of\nGod’s husbandry, and to feel delight in His gifts, and the labourers in His field. For in this\nhusbandry did he labour, who said, “I laboured more than they all.” 3263 But the strength\nto labour was given him by the Lord of the harvest. Therefore he added, “Yet it is not I, but\nthe grace of God which is with me.” For that he was employed in this husbandry he clearly\nenough shows, where he says, “I have planted, Apollo", "lang": "latin", "orig": ""}, {"v": 37, "f": "Glossa Ordinaria", "w": "", "t": "(ap. Anselm.) The harvest are those men who can be reaped by the preachers, and separated from the number of the damned, as grain is beaten out from the chaff that it may be laid up in granaries.", "lang": "english", "orig": ""}, {"v": 37, "f": "Gregory the Dialogist", "w": "", "t": "When the preachers were sent, let us hear what he says: \"The harvest indeed is great, but the laborers are few. Pray therefore the Lord of the harvest, that he send laborers into his harvest.\" For the great harvest the laborers are few, which we cannot speak of without heavy grief, because even if there are those who hear good things, there are none to speak them. Behold, the world is full of priests, yet in God's harvest a worker is found very rarely, because we have indeed taken up the priestly office, but we do not fulfill the work of the office.", "lang": "english", "orig": ""}, {"v": 37, "f": "Irenaeus", "w": "CHAPTER I.—PREFACE—THE AUTHOR’S OBJECT—THE UTILITY OF WRITTEN COMPOSITIONS.951", "t": "In the same way, therefore, those who take part in the divine words, ought to guard\nagainst betaking themselves to this, as they would to the building of cities, to examine them\nout of curiosity; that they do not come to the task for the sake of receiving worldly things,\nhaving ascertained that they who are consecrated to Christ are given to communicate the\nnecessaries of life. But let such be dismissed as hypocrites. But if any one wishes not to seem,\nbut to be righteous, to him it belongs to know the things which are best. If, then, “the harvest\nis plenteous, but the labourers few,” it is incumbent on us “to pray” that there may be as\ngreat abundance of labourers as possible.963", "lang": "greek", "orig": ""}, {"v": 37, "f": "Jerome", "w": "", "t": "(Verse 37, 38.) Indeed, the harvest is plentiful, but the laborers are few. Therefore, pray to the Lord of the harvest to send out laborers into his harvest. The abundant harvest signifies the multitude of people, while the few laborers represent a shortage of workers. And it is commanded to pray to the Lord of the harvest to send out laborers into his harvest. These are the laborers whom the Psalmist speaks of, saying: Those who sow in tears will reap with joy. Going forth, they went and wept, carrying their seeds. But when they come, they will come with joy, carrying their sheaves (Psalm 126:7-8). And to speak more plainly, the abundant harvest is the entire crowd of believers. However, the workers are few, like the apostles and those who imitate them and are sent to the harvest.", "lang": "english", "orig": ""}, {"v": 37, "f": "Jerome", "w": "", "t": "An abundant harvest signified the multitude of people. The few laborers signified the dearth of teachers. He commands them to ask the Lord of the harvest to send out laborers into his harvest. These are the laborers of whom the psalmist speaks: “May those who sow in tears reap with shouts of joy! He that goes forth weeping, bearing the seed for sowing, shall come home with shouts of joy, bringing his sheaves with him.” And that I may speak in broader terms: an abundant harvest represents all the believing multitude. The few laborers imply the apostles and their imitators who are sent to the harvest.", "lang": "english", "orig": ""}, {"v": 37, "f": "Jerome", "w": "", "t": "The great harvest denotes the multitude of the people; the few labourers, the want of instructors.", "lang": "english", "orig": ""}, {"v": 37, "f": "John Chrysostom", "w": "", "t": "And not even at this doth He stop, but He exhibits also another instance of His forethought. That is,\n\n\"When He saw,\" it is said, \"the multitudes, He was moved with compassion on them, because they were troubled, and scattered abroad, as sheep having no shepherd. Then saith He unto His disciples, The harvest truly is plenteous, but the laborers are few, pray ye therefore the Lord of the harvest, that He will send forth laborers into His harvest.\"\n\nSee again His freedom from vainglory. That He may not draw all men unto Himself, He sends out His disciples.\n\nAnd not with this view only, but that He might also teach them, after practising in Palestine, as in a sort of training-school, to strip themselves for their conflicts with the world. For this purpose then He makes the exercises even more serious than the actual conflicts, so far as pertained to their own virtue; that they might more easily engage in the struggles that were to ensue; as it were a sort of tender nestlings whom He was at length leading out to fly. And for the present He makes them physicians of bodies, dispensing to them afterwards the cure of the soul, which is the principal thing.\n\nAnd mark how He points out the facility and necessity of the thing. For what saith He? \"The harvest truly is plenteous, but the laborers are few.\" That is, \"not to the sowing,\" saith He, \"but to the reaping do I send you.\" Which in John He expressed by, \"Other men labored, and ye are entered into their labors.\"\n\nAnd these things h", "lang": "english", "orig": ""}, {"v": 37, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And mark how He points out the facility and necessity of the thing. For what says He? The harvest truly is plenteous, but the laborers are few. That is, not to the sowing, says He, but to the reaping do I send you. Which in John He expressed by, Other men labored, and you are entered into their labors. John 4:38", "lang": "", "orig": ""}, {"v": 37, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But of what laborers does He speak here? Of the twelve disciples. What then? Whereas He had said, But the laborers are few, did He add to their number? By no means, but He sent them out alone. Wherefore then did He say, Pray ye the Lord of the harvest, that He would send forth laborers into His harvest; and made no addition to their number? Because though they were but twelve, He made them many from that time  forward, not by adding to their number, but by giving them power.", "lang": "", "orig": ""}, {"v": 37, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "When He saw, it is said, the multitudes, He was moved with compassion on them, because they were troubled, and scattered abroad, as sheep having no shepherd. Then says He unto His disciples, The harvest truly is plenteous, but the laborers are few, pray ye therefore the Lord of the harvest, that He will send forth laborers into His harvest.", "lang": "", "orig": ""}, {"v": 37, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And yet surely elsewhere He says, the harvest is already come; as when He says of the Samaritans, Lift up your eyes, and look on the fields; for they are white already to harvest. John 4:35 And again, The harvest truly is plenteous, but the laborers are few.  How then says He there, that the harvest is already come, while here He said, it is yet to be? According to another signification.", "lang": "", "orig": ""}, {"v": 37, "f": "Pseudo-Clementine Literature", "w": "Chapter XIII.—What Priests Should Be and Should Not Be.", "t": "Let us, therefore, contemplate and imitate the faithful who have conducted themselves\nwell in the Lord, as is becoming and suitable to our calling and profession. Thus let us do\nservice before God in justice and righteousness, and without blemish, “occupying ourselves\n421 Matt. ix. 37, 38.\n422 Lit. “without shame,” 2 Tim. ii. 15.\n423 Matt. v. 14.\n424 John vi. 27.\n425 John x. 12, 13.\n426 Rom. xvi. 18.\n427 Phil. iii. 9.\n428 2 Cor. xi. 13.\n429 See Matt. xxiv. 45–51.\n430 [Comp. the term χριστέμπορος “Christ-monger,” “Christ-trafficker,” in Teaching, chap. xii. 5, vol. vii. p.\n381.—R.]\n431 1 Tim. iii. 3; Tit. i. 7.\n\n\nwith things good and comely before God and also before men.”432 For this is comely, that\nGod be glorified in us in all things.", "lang": "greek", "orig": ""}, {"v": 37, "f": "Pseudo-Clementine Literature", "w": "Chapter XIII.—What Priests Should Be and Should Not Be.", "t": "ss, and without blemish, “occupying ourselves\n421 Matt. ix. 37, 38.\n422 Lit. “without shame,” 2 Tim. ii. 15.\n423 Matt. v. 14.\n424 John vi. 27.\n425 John x. 12, 13.\n426 Rom. xvi. 18.\n427 Phil. iii. 9.\n428 2 Cor. xi. 13.\n429 See Matt. xxiv. 45–51.\n430 [Comp. the te", "lang": "greek", "orig": ""}, {"v": 37, "f": "Remigius of Rheims", "w": "", "t": "But when the Son of God looked down from heaven upon the earth, to hear the groans of the captives, straight a great harvest began to ripen; for the multitude of the human race would never have come near to the faith, had not the Author of human salvation looked down from heaven; and it follows, Then said he unto his disciples, The harvest truly is great, but the labourers are few.\n\nFor the number of the Apostles was small in comparison of so great crops to be reaped. The Lord exhorts His preachers, that is, the Apostles and their followers, that they should daily desire an increase of their number; Pray ye therefore the Lord of the harvest, that he would send forth labourers into his harvest.\n\nOr, He then increased their number when He chose the seventy and two, and then when many preachers were made what time the Holy Spirit descended upon the believers.", "lang": "english", "orig": ""}, {"v": 37, "f": "Theophylact of Ohrid", "w": "", "t": "\"Then saith He unto His disciples, The harvest truly is plenteous, but the labourers are few; pray ye therefore the Lord of the harvest, that He will send forth labourers into His harvest.\" The multitude in need of healing He calls the \"harvest,\" and those who ought to teach them, \"labourers.\" The \"Lord of the harvest\" is Christ Himself Who is Lord of prophets and apostles. This is made clear when He ordains the twelve without petitioning God.", "lang": "english", "orig": ""}, {"v": 37, "f": "Thomas Aquinas", "w": "", "t": "Then he said to his disciples. Here he induces others to compassion: first, he assigns the cause; secondly, he persuades to the effect (v. 38).\n\nHe presents two causes: first, the multitude of those striving toward good; secondly, the scarcity of teachers (v. 37b).\n\nMany had assembled; therefore, he says, The harvest is plentiful. It is not a harvest when the grain begins to blossom, or when the grains appear, but when it is ready to be gathered; so men are disposed to believe as a result of preaching. Something like this is said in John (4:35): \"Lift up your eyes, and see how the fields are already ripe for harvest.\" But the laborers are few, namely, goodness; hence the Apostle says: \"We are God's helpers\" (1 Cor 3:9). So confer what is in your power.", "lang": "english", "orig": ""}, {"v": 38, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "There has been finished therefore the first harvest, and thence, with that very wheat which then was purged, has been sown the round world; so that there arises an other harvest, which at the end is to be reaped. In the second harvest have been sown tares, now here there is labour. Just as in that first harvest the Prophets laboured until the Lord came: so in that second harvest the Apostles laboured, and all preachers of the truth labour, even until at the end the Lord send unto the harvest His Angels. Aforetime, I say, a desert there was, but the ends of the desert shall grow fat. Behold where the Prophets had given no sound, the Lord of the Prophets has been received, The ends of the desert shall grow fat, and with exultation the hills shall be encircled.", "lang": "", "orig": ""}, {"v": 38, "f": "Augustine - Confessions", "w": "Sermon LI.", "t": "1. By the lesson of the Gospel which has just been read, we are reminded to search what\nthat harvest is of which the Lord says, “The harvest truly is great, but the labourers are few.\nPray ye the Lord of the harvest, that He would send forth labourers into His harvest.”3262\nThen to His twelve disciples, whom He also named Apostles, He added other seventy-two,\nand sent them all, as appears from His words, to the harvest then ready. What then was that\nharvest? For that harvest was not among these Gentiles, among whom there had been\nnothing sown. It remains therefore that we understand that this harvest was among the\npeople of the Jews. It was to that harvest that the Lord of the harvest came, to that harvest\nHe sent reapers; but to the Gentiles He sent not reapers, but sowers. Understand we then\nthat it was harvest among the people of the Jews, sowing time among the peoples of the\nGentiles. For out of that harvest were the Apostles chosen, where now that the harvest was,\nthe corn was already ripe; for there had the Prophets sown. Delightful it is to take a view of\nGod’s husbandry, and to feel delight in His gifts, and the labourers in His field. For in this\nhusbandry did he labour, who said, “I laboured more than they all.” 3263 But the strength\nto labour was given him by the Lord of the harvest. Therefore he added, “Yet it is not I, but\nthe grace of God which is with me.” For that he was employed in this husbandry he clearly\nenough shows, where he says, “I have planted, Apollo", "lang": "latin", "orig": ""}, {"v": 38, "f": "Chrysostom - Homilies on Acts", "w": "Homily IV.", "t": "rvest truly is great,\nbut the laborers are few.” (Matt. ix. 38.) But as the first-fruits of this harvest, He himself\ntook our nature, and bore it up on high. Himself first put in the sickle. Therefore92 also\nHe calls the Word the Seed. “When,” it says, “the day", "lang": "greek", "orig": ""}, {"v": 38, "f": "Gregory the Dialogist", "w": "", "t": "But consider, dearest brothers, consider what is said: \"Pray the Lord of the harvest, that he send laborers into his harvest.\" Petition on our behalf, that we may be able to work worthily for you, lest our tongue grow sluggish from exhortation, lest after we have taken up the place of preaching, our silence condemn us before the just judge. For often the tongue of preachers is restrained because of their own wickedness; but often indeed it happens through the fault of those subject to them that the word of preaching is withdrawn from those who are in charge. Indeed the tongue of preachers is restrained because of their own wickedness, as the Psalmist says: \"But to the sinner God said: Why do you declare my justices?\" And again, because of the fault of those subject to them, the voice of preachers is forbidden, as the Lord says to Ezekiel: \"I will make your tongue cleave to your palate, and you shall be mute, and not as a man who rebukes, because it is a provoking house.\" As if he were to say openly: Therefore the word of preaching is taken from you, because while the people provoke me in their actions, they are not worthy to receive the exhortation of truth. From whose fault, therefore, the word is withdrawn from the preacher is not easily known. But it is known most certainly that the silence of the Pastor sometimes harms himself, but always harms those subject to him.", "lang": "english", "orig": ""}, {"v": 38, "f": "John Chrysostom", "w": "", "t": "Then to signify how great the gift is, He saith, \"Pray ye the Lord of the harvest;\" and indirectly declares it to be His own prerogative. For after having said, \"Pray ye the Lord of the harvest;\" when they had not made any entreaty nor prayer, He Himself at once ordains them, reminding them also of the sayings of John, of the threshing floor, and of the Person winnowing, and of the chaff, and of the wheat. Whence it is evident that Himself is the husbandman, Himself the Lord of the harvest, Himself the master and owner of the prophets. For if He sent them to reap, clearly it was not to reap what belongs to another, but what Himself had sown by the prophets.\n\nBut not in this way only was He indirectly encouraging them, in calling their ministry a harvest; but also by making them able for the ministry.", "lang": "english", "orig": ""}, {"v": 38, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And mark how He points out the facility and necessity of the thing. For what says He? The harvest truly is plenteous, but the laborers are few. That is, not to the sowing, says He, but to the reaping do I send you. Which in John He expressed by, Other men labored, and you are entered into their labors. John 4:38", "lang": "", "orig": ""}, {"v": 38, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And yet surely elsewhere He says, the harvest is already come; as when He says of the Samaritans, Lift up your eyes, and look on the fields; for they are white already to harvest. John 4:35 And again, The harvest truly is plenteous, but the laborers are few.  How then says He there, that the harvest is already come, while here He said, it is yet to be? According to another signification.", "lang": "", "orig": ""}, {"v": 38, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And at times He calls this self-same thing both harvest and sowing, naming it with relation, now to one thing, now to another. Thus when He is speaking of the conviction and obedience of His converts,  He calls the thing a harvest, as though He had accomplished all; but when He is seeking after the fruit of their hearing, He calls it seed, and the end, harvest.", "lang": "", "orig": ""}, {"v": 38, "f": "Tertullian", "w": "Chapter XXI.—Christ’s Connection with the Creator Shown from Several Incidents\nin the Old Testament, Compared with St. Luke’s Narrative of the Mission of the\nDisciples. The Feeding of the Multitude. The Confession of St. Peter. Being\nAshamed of Christ. This Shame is Only Possible of the True Christ. Marcionite\nPretensions Absurd.", "t": "He sends forth His disciples to preach the kingdom of God.4257 Does He here say of\nwhat God? He forbids their taking anything for their journey, by way of either food or\nraiment. Who would have given such a commandment as this, but He who feeds the ravens\nand clothes4258 the flowers of the field? Who anciently enjoined for the treading ox an unmuzzled\nmouth,4259 that he might be at liberty to gather his fodder from his labour, on the\nprinciple that the worker is worthy of his hire?4260 Marcion may expunge such precepts,\nbut no matter, provided the sense of them survives. But when He charges them to shake\noff the dust of their feet against such as should refuse to receive them, He also bids that this\nbe done as a witness. Now no one bears witness except in a case which is decided by judicial\nprocess; and whoever orders inhuman conduct to be submitted to the trial by testimony,4261\ndoes really threaten as a judge. Again, that it was no new god which recommended4262 by\nChrist, was clearly attested by the opinion of all men, because some maintained to Herod\nthat Jesus was the Christ; others, that He was John; some, that He was Elias; and others, that\nHe was one of the old prophets.4263 Now, whosoever of all these He might have been, He\ncertainly was not raised up for the purpose of announcing another god after His resurrection.\nHe feeds the multitude in the desert place;4264 this, you must know4265 was after the manner\nof the Old Testament.4266 Or else,4267 if there was not the s", "lang": "latin", "orig": ""}, {"v": 38, "f": "Thomas Aquinas", "w": "", "t": "And what? Pray the Lord of the harvest to send laborers into his harvest. When we have a deficiency, we should have recourse to God, since the office of preaching is obtained only by prayers. For the one who sends laborers is the Lord. Hence he says in John (4:38): \"I have sent you.\" And he asks that he be asked, so that merit be accumulated by us, as we pray for the salvation of others. Likewise, he ordained it this way in order that the holiness of others may benefit still others, as it says in 1 Peter (4:10): \"As each has received his gift, employ it for one another, as good stewards of God's varied grace.\" Hence he wishes that whatever grace and holiness they have received, they confer on others; and he, being asked, hears. For he asks that he be asked to send them: \"How will they preach, unless they are sent?\" (Rom 10:15). For the authority is acquired, as well as the grace; hence 2 Corinthians (5:14): \"For the charity of Christ presses us.\" Again, Pray the Lord of the harvest to send laborers, not mercenaries, who cause harm by bad example, into his harvest, i.e., God's harvest. Mercenaries are not sent into God's harvest, but into their own; because they do not seek God's glory, but their own profit.", "lang": "english", "orig": ""}], "xrefs": [{"v": 2, "ref": "Jeremiah 31:33", "rel": "cross-reference", "text": {"es": "Mas éste es el pacto que haré con la casa de Israel después de aquellos días, dice Jehová: Daré mi ley en sus entrañas, y escribiréla en sus corazones; y seré yo á ellos por Dios, y ellos me serán por pueblo.", "gr": ""}}, {"v": 2, "ref": "Jeremiah 31:34", "rel": "cross-reference", "text": {"es": "Y no enseñará más ninguno á su prójimo, ni ninguno á su hermano, diciendo: Conoce á Jehová: porque todos me conocerán, desde el más pequeño de ellos hasta el más grande, dice Jehová: porque perdonaré la maldad de ellos, y no me acordaré más de su pecado.", "gr": ""}}, {"v": 2, "ref": "Luke 5:18", "rel": "cross-reference", "text": {"es": "Y he aquí unos hombres, que traían sobre un lecho un hombre que estaba paralítico; y buscaban meterle, y ponerle delante de él.", "gr": "καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ."}}, {"v": 2, "ref": "Luke 5:26", "rel": "cross-reference", "text": {"es": "Y tomó espanto á todos, y glorificaban á Dios; y fueron llenos del temor, diciendo: Hemos visto maravillas hoy.", "gr": "καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον."}}, {"v": 2, "ref": "Mark 2:1", "rel": "cross-reference", "text": {"es": "Y ENTRO otra vez en Capernaum después de algunos días, y se oyó que estaba en casa.", "gr": "Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·"}}, {"v": 2, "ref": "Mark 2:12", "rel": "cross-reference", "text": {"es": "Entonces él se levantó luego, y tomando su lecho, se salió delante de todos, de manera que todos se asombraron, y glorificaron á Dios, diciendo: Nunca tal hemos visto.", "gr": "καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν."}}, {"v": 4, "ref": "Luke 6:8", "rel": "cross-reference", "text": {"es": "Mas él sabía los pensamientos de ellos; y dijo al hombre que tenía la mano seca: Levántate, y ponte en medio. Y él levantándose, se puso en pie.", "gr": "αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη."}}, {"v": 4, "ref": "Matthew 12:25", "rel": "cross-reference", "text": {"es": "Y Jesús, como sabía los pensamientos de ellos, les dijo: Todo reino dividido contra sí mismo, es desolado; y toda ciudad ó casa dividida contra sí misma, no permanecerá.", "gr": "εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται."}}, {"v": 5, "ref": "Acts 14:11", "rel": "cross-reference", "text": {"es": "Entonces las gentes, visto lo que Pablo había hecho, alzaron la voz, diciendo en lengua licaónica: Dioses semejantes á hombres han descendido á nosotros.", "gr": "οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς"}}, {"v": 5, "ref": "Acts 14:8", "rel": "cross-reference", "text": {"es": "Y un hombre de Listra, impotente de los pies, estaba sentado, cojo desde el vientre de su madre, que jamás había andado.", "gr": "Καί τις ἀνὴρ ⸂ἀδύνατος ἐν Λύστροις⸃ τοῖς ποσὶν ἐκάθητο, χωλὸς ἐκ κοιλίας μητρὸς ⸀αὐτοῦ, ὃς οὐδέποτε ⸀περιεπάτησεν."}}, {"v": 5, "ref": "Acts 3:11", "rel": "cross-reference", "text": {"es": "Y teniendo á Pedro y á Juan el cojo que había sido sanado, todo el pueblo concurrió á ellos al pórtico que se llama de Salomón, atónitos.", "gr": "Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι."}}, {"v": 5, "ref": "Acts 3:16", "rel": "cross-reference", "text": {"es": "Y en la fe de su nombre, á éste que vosotros veis y conocéis, ha confirmado su nombre: y la fe que por él es, ha dado á este esta completa sanidad en presencia de todos vosotros.", "gr": "καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν."}}, {"v": 5, "ref": "Acts 3:6", "rel": "cross-reference", "text": {"es": "Y Pedro dijo: Ni tengo plata ni oro; mas lo que tengo te doy: en el nombre de Jesucristo de Nazaret, levántate y anda.", "gr": "εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει."}}, {"v": 5, "ref": "Acts 4:10", "rel": "cross-reference", "text": {"es": "Sea notorio á todos vosotros, y á todo el pueblo de Israel, que en el nombre de Jesucristo de Nazaret, al que vosotros crucificasteis y Dios le resucitó de los muertos, por él este hombre está en vuestra presencia sano.", "gr": "γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής."}}, {"v": 5, "ref": "Acts 4:9", "rel": "cross-reference", "text": {"es": "Pues que somos hoy demandados acerca del beneficio hecho á un hombre enfermo, de qué manera éste haya sido sanado,", "gr": "εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,"}}, {"v": 5, "ref": "Acts 9:34", "rel": "cross-reference", "text": {"es": "Y le dijo Pedro: Eneas, Jesucristo te sana; levántate, y hazte tu cama. Y luego se levantó.", "gr": "καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη."}}, {"v": 9, "ref": "Luke 5:27", "rel": "cross-reference", "text": {"es": "Y después de estas cosas salió, y vió á un publicano llamado Leví, sentado al banco de los públicos tributos, y le dijo: Sígueme.", "gr": "Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι."}}, {"v": 9, "ref": "Luke 5:38", "rel": "cross-reference", "text": {"es": "Mas el vino nuevo en cueros nuevos se ha de echar; y lo uno y lo otro se conserva.", "gr": "ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινοὺς ⸀βλητέον."}}, {"v": 9, "ref": "Mark 2:14", "rel": "cross-reference", "text": {"es": "Y pasando, vió á Leví, hijo de Alfeo, sentado al banco de los públicos tributos, y le dice: Sígueme. Y levantándose le siguió.", "gr": "καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ."}}, {"v": 9, "ref": "Mark 2:22", "rel": "cross-reference", "text": {"es": "Ni nadie echa vino nuevo en odres viejos; de otra manera, el vino nuevo rompe los odres, y se derrama el vino, y los odres se pierden; mas el vino nuevo en odres nuevos se ha de echar.", "gr": "καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς."}}, {"v": 11, "ref": "Matthew 11:19", "rel": "cross-reference", "text": {"es": "Vino el Hijo del hombre, que come y bebe, y dicen: He aquí un hombre comilón, y bebedor de vino, amigo de publicanos y de pecadores. Mas la sabiduría es justificada por sus hijos.", "gr": "ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς."}}, {"v": 12, "ref": "Jeremiah 33:6", "rel": "cross-reference", "text": {"es": "He aquí que yo le hago subir sanidad y medicina; y los curaré, y les revelaré abundancia de paz y de verdad.", "gr": ""}}, {"v": 12, "ref": "Luke 5:31", "rel": "cross-reference", "text": {"es": "Y respondiendo Jesús, les dijo: Los que están sanos no necesitan médico, sino los que están enfermos.", "gr": "καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·"}}, {"v": 12, "ref": "Luke 9:11", "rel": "cross-reference", "text": {"es": "Y como lo entendieron las gentes, le siguieron; y él las recibió, y les hablaba del reino de Dios, y sanaba á los que tenían necesidad de cura.", "gr": "οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο."}}, {"v": 12, "ref": "Mark 2:17", "rel": "cross-reference", "text": {"es": "Y oyéndolo Jesús, les dice: Los sanos no tienen necesidad de médico, mas los que tienen mal. No he venido á llamar á los justos, sino á los pecadores.", "gr": "καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς."}}, {"v": 12, "ref": "Revelation 3:17", "rel": "cross-reference", "text": {"es": "Porque tú dices: Yo soy rico, y estoy enriquecido, y no tengo necesidad de ninguna cosa; y no conoces que tú eres un cuitado y miserable y pobre y ciego y desnudo;", "gr": "ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,"}}, {"v": 12, "ref": "Revelation 3:18", "rel": "cross-reference", "text": {"es": "Yo te amonesto que de mí compres oro afinado en fuego, para que seas hecho rico, y seas vestido de vestiduras blancas, para que no se descubra la vergüenza de tu desnudez; y unge tus ojos con colirio, para que veas.", "gr": "συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς."}}, {"v": 13, "ref": "1 Corinthians 6:11", "rel": "cross-reference", "text": {"es": "Y esto erais algunos: mas ya sois lavados, mas ya sois santificados, mas ya sois justificados en el nombre del Señor Jesús, y por el Espíritu de nuestro Dios.", "gr": "καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν."}}, {"v": 13, "ref": "1 Corinthians 6:9", "rel": "cross-reference", "text": {"es": "¿No sabéis que los injustos no poseerán el reino de Dios? No erréis, que ni los fornicarios, ni los idólatras, ni los adúlteros, ni los afeminados, ni los que se echan con varones,", "gr": "Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται"}}, {"v": 13, "ref": "1 Timothy 1:13", "rel": "cross-reference", "text": {"es": "Habiendo sido antes blasfemo y perseguidor é injuriador: mas fuí recibido á misericordia, porque lo hice con ignorancia en incredulidad.", "gr": "⸀τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν· ἀλλὰ ἠλεήθην, ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ,"}}, {"v": 13, "ref": "1 Timothy 1:16", "rel": "cross-reference", "text": {"es": "Mas por esto fuí recibido á misericordia, para que Jesucristo mostrase en mí el primero toda su clemencia, para ejemplo de los que habían de creer en él para vida eterna.", "gr": "ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον."}}, {"v": 13, "ref": "2 Peter 3:9", "rel": "cross-reference", "text": {"es": "El Señor no tarda su promesa, como algunos la tienen por tardanza; sino que es paciente para con nosotros, no queriendo que ninguno perezca, sino que todos procedan al arrepentimiento.", "gr": "οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι."}}, {"v": 13, "ref": "2 Timothy 2:25", "rel": "cross-reference", "text": {"es": "Que con mansedumbre corrija á los que se oponen: si quizá Dios les dé que se arrepientan para conocer la verdad,", "gr": "ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους, μήποτε ⸀δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας,"}}, {"v": 13, "ref": "2 Timothy 2:26", "rel": "cross-reference", "text": {"es": "Y se zafen del lazo del diablo, en que están cuativos á voluntad de él.", "gr": "καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα."}}, {"v": 13, "ref": "Acts 11:18", "rel": "cross-reference", "text": {"es": "Entonces, oídas estas cosas, callaron, y glorificaron á Dios, diciendo: De manera que también á los Gentiles ha dado Dios arrepentimiento para vida.", "gr": "ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃."}}, {"v": 20, "ref": "Luke 8:43", "rel": "cross-reference", "text": {"es": "Y una mujer, que tenía flujo de sangre hacía ya doce años, la cual había gastado en médicos toda su hacienda, y por ninguno había podido ser curada,", "gr": "καὶ γυνὴ οὖσα ἐν ῥύσει αἵματος ἀπὸ ἐτῶν δώδεκα, ἥτις ⸂ἰατροῖς προσαναλώσασα ὅλον τὸν βίον⸃ οὐκ ἴσχυσεν ⸀ἀπ’ οὐδενὸς θεραπευθῆναι,"}}, {"v": 20, "ref": "Luke 8:56", "rel": "cross-reference", "text": {"es": "Y sus padres estaban atónitos; á los cuales él mandó, que á nadie dijesen lo que había sido hecho.", "gr": "καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός."}}, {"v": 20, "ref": "Mark 6:56", "rel": "cross-reference", "text": {"es": "Y donde quiera que entraba, en aldeas, ó ciudades, ó heredades, ponían en las calles á los que estaban enfermos, y le rogaban que tocasen siquiera el borde de su vestido; y todos los que le tocaban quedaban sanos.", "gr": "καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο."}}, {"v": 20, "ref": "Matthew 14:36", "rel": "cross-reference", "text": {"es": "Y le rogaban que solamente tocasen el borde de su manto; y todos los que tocaron, quedaron sanos.", "gr": "καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν."}}, {"v": 21, "ref": "Luke 8:45", "rel": "cross-reference", "text": {"es": "Entonces Jesús dijo: ¿Quién es el que me ha tocado? Y negando todos, dijo Pedro y los que estaban con él: Maestro, la compañía te aprieta y oprime, y dices: ¿Quién es el que me ha tocado?", "gr": "καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχου

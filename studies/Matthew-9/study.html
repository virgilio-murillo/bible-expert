<script>
const D = {"book": "Matthew", "chapter": 9, "version": "MorphGNT", "verses": [{"v": 1, "text": "Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν."}, {"v": 2, "text": "Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃."}, {"v": 3, "text": "καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ."}, {"v": 4, "text": "καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;"}, {"v": 5, "text": "τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;"}, {"v": 6, "text": "ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου."}, {"v": 7, "text": "καὶ ἐγερθεὶς ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ."}, {"v": 8, "text": "ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις."}, {"v": 9, "text": "Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ."}, {"v": 10, "text": "Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ."}, {"v": 11, "text": "καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;"}, {"v": 12, "text": "ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες."}, {"v": 13, "text": "πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς."}, {"v": 14, "text": "Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;"}, {"v": 15, "text": "καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν."}, {"v": 16, "text": "οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται."}, {"v": 17, "text": "οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται."}, {"v": 18, "text": "Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται."}, {"v": 19, "text": "καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ."}, {"v": 20, "text": "Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·"}, {"v": 21, "text": "ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι."}, {"v": 22, "text": "ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης."}, {"v": 23, "text": "καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον"}, {"v": 24, "text": "⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ."}, {"v": 25, "text": "ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον."}, {"v": 26, "text": "καὶ ἐξῆλθεν ἡ φήμη αὕτη εἰς ὅλην τὴν γῆν ἐκείνην."}, {"v": 27, "text": "Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ."}, {"v": 28, "text": "ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε."}, {"v": 29, "text": "τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν."}, {"v": 30, "text": "καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·"}, {"v": 31, "text": "οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ."}, {"v": 32, "text": "Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·"}, {"v": 33, "text": "καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ."}, {"v": 34, "text": "οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια."}, {"v": 35, "text": "Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν."}, {"v": 36, "text": "Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα."}, {"v": 37, "text": "τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·"}, {"v": 38, "text": "δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ."}], "parallel": {}, "patristic": [{"v": 1, "f": "Augustine - Confessions", "w": "Chapter XXV.—Of the Man Sick of the Palsy to Whom the Lord Said, “Thy Sins are\nForgiven Thee,” And “Take Up Thy Bed;” And in Especial, of the Question\nWhether Matthew and Mark are Consistent with Each Other in Their Notice of\nthe Place Where This Incident Took Place, in So Far as Matthew Says It Happened\n“In His Own City,” While Mark Says It Was in Capharnaum.", "t": "he bed wherein the sick of the palsy lay. And\n909 Matt. ix. 1–8.\n910 Loquebatur verbum. [“Was speaking the word” is probably the meaning.—R.]\n\n\nwhen Jesus saw their faith;” and so forth.911 Luke, on the other hand, does not mention the\nplace in which the incide", "lang": "latin", "orig": ""}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "(De Cons. Ev. ii. 25.) That Matthew here speaks of his own city, and Mark calls it Capharnaum, would be more difficult to be reconciled if Matthew had expressed it Nazareth. But as it is, all Galilee might be called Christ's city, because Nazareth was in Galilee; just as all the Roman empire, divided into many states, was still called the Roman city. Who can doubt then that the Lord in coming to Galilee is rightly said to come into his own city, whatever was the town in which He abode, especially since Capharnaum was exalted into the metropolis of Galilee?\n\n(ubi sup.) And if we adopt this supposition, we must say that Matthew has omitted all that was done from the time that Jesus entered into His own city till He came to Capharnaum, and has proceeded on at once to the healing of the paralytic; as in many other places they pass over things that intervened, and carry on the thread of the narrative, without noticing any interval of time, to something else; so here, And, lo, they bring unto him a paralytic laying on a bed.", "lang": "english", "orig": ""}, {"v": 1, "f": "Chromatius of Aquileia", "w": "", "t": "On seeing him, the Gerasenes entreated the Lord to depart from their district. Such people are also to be found among us. Out of faithlessness they compel the Lord and Savior of the world to depart from the district of their hearts. According to Scripture, “The Holy Spirit will not enter a perverse soul or dwell in a body enslaved to sin.”", "lang": "english", "orig": ""}, {"v": 1, "f": "Gospel of Peter", "w": "Section XII.", "t": "ts, I should live. 905And\n888 Luke viii. 37a.\n889 Matt. ix. 1.\n890 Luke viii. 38.\n891 Luke viii. 39a.\n892 Mark v. 20.\n893 Lit. the ten cities.\n894 Mark v. 21a; Luke viii. 40b.\n895 Luke viii. 41a.\n896 Mark v. 23a.\n897 Matt. ix. 18b.\n898 Matt. ix. 19.\n899 Mark v.", "lang": "greek", "orig": ""}, {"v": 1, "f": "Hilary of Poitiers", "w": "", "t": "Mystically; When driven out of Judæa, He returns into His own city; the city of God is the people of the faithful; into this He entered by a boat, that is, the Church.", "lang": "english", "orig": ""}, {"v": 1, "f": "Jerome", "w": "", "t": "(Chapter 9, Verses 1-2) And Jesus got into a boat and crossed over, and came to his own city. And behold, they brought to him a paralytic lying on a bed. And Jesus seeing their faith, said to the paralytic: Take heart, my son, your sins are forgiven. By his city, we understand none other than Nazareth, from where he is also called the Nazarene. And they brought him, as we said before, a paralytic lying on a bed, because he himself was not able to enter. But Jesus, seeing not the faith of the one who was being offered, but of those who were offering, said to the paralyzed man: Have confidence, my son, your sins are forgiven you. Oh, wonderful humility! He calls despised and weak, dissolved in the joints of all his limbs, his son, whom the priests did not consider worthy of touching. Or certainly he calls him son because his sins are forgiven him. According to the allegory, sometimes the soul, lying in its body, with all the powers of its limbs dissolved, is offered to the Lord to be healed by the perfect teacher, and if it is healed by his mercy, it receives such great strength that it immediately carries its bed.", "lang": "english", "orig": ""}, {"v": 1, "f": "Jerome", "w": "", "t": "We should understand his town as none other than Nazareth, for he was called a Nazarean.", "lang": "english", "orig": ""}, {"v": 1, "f": "Jerome", "w": "", "t": "Or; This city may be no other than Nazareth, whence He was called a Nazarene.", "lang": "english", "orig": ""}, {"v": 1, "f": "John Chrysostom", "w": "", "t": "By His own city here he means Capernaum. For that which gave Him birth was Bethlehem; that which brought Him up, Nazareth; that which had Him continually inhabiting it, Capernaum.", "lang": "english", "orig": ""}, {"v": 1, "f": "Peter Chrysologus", "w": "", "t": "(Serm. 50.) The Creator of all things, the Lord of the world, when He had for our sakes straitened Himself in the bonds of our flesh, began to have His own country as a man, began to be a citizen of Judæa, and to have parents, though Himself the parent of all, that affection might attach those whom fear had separated.\n\n(ubi sup.) Christ has no need of the vessel, but the vessel of Christ; for without heavenly pilotage the bark of the Church cannot pass over the sea of the world to the heavenly harbour.", "lang": "english", "orig": ""}, {"v": 1, "f": "Theophylact of Ohrid", "w": "", "t": "\"And He entered into a boat, and passed over, and came into His own city. And, behold, they brought to Him a paralytic, lying on a bed.\" \"His own city\" means Capernaum, for it was there that He was living. He was born in Bethlehem, raised in Nazareth, and lived for an extended length of time in Capernaum. This paralytic is not the same as the one mentioned in John (Jn. 5:2-9), for that one was beside the Sheep's Pool in Jerusalem, while this one was in Capernaum. And that one had no one to help him, while this one was carried by four men, as Mark says (Mk. 2:3-12), who lowered him through the roof, a fact which Matthew omits.\n\n\"And Jesus seeing their faith.\" Either the faith of the men who brought the paralytic, for Jesus often worked a miracle on account of the faith of those who brought the one sick; or, of the paralytic himself. \"Said to the paralytic, Take courage, child; thy sins be forgiven thee.\" Jesus calls him \"child,\" either as one of God's creatures, or because he believed. To show that the man's paralysis is a result of his sins, Jesus first forgives him his sins.", "lang": "english", "orig": ""}, {"v": 1, "f": "Thomas Aquinas", "w": "", "t": "The miracles recounted above were against temporal dangers; here he mentions ones against spiritual dangers. He does two things: first, he shows how he helps those who come to him; secondly, how he searches out those he heals (v. 35).\n\nIn regard to the first: first, he presents the remedy against sin; secondly, against death (v. 18).\n\nIn regard to the first: first, he presents the remedy against sin by forgiving; secondly, by drawing sinners to himself (v. 10).\n\nAnd first he draws the background to the favor; secondly, he mentions the favor itself (v. 4b).\n\nFirst, the place is mentioned; secondly, the devotion of those presenting (v. 2).\n\nHe says, therefore, And getting into a boat, he crossed over. This is connected with the preceding, because they begged him to leave; consequently, he entered a boat. Hence he gives to understand that if some say, \"Depart from us, we do not desire the way of your commandments\" (Jb 21:14), he departs at once. So, he gets into a boat. This boat signifies the Cross or the Church. He came to his own city, i.e., into the city of the pagans who had been given to him: \"Ask of me and I will make the nations your heritage\" (Ps 2:8). But why do Mark and Luke say that this was done in Capernaum, but Matthew says Nazareth, which was his city. The answer is that one city was Christ's by reason of birth, and this was Bethlehem; another by reason of upbringing, and this was Nazareth; another by reason of habitation and of working miracles, and this was Cap", "lang": "english", "orig": ""}, {"v": 2, "f": "1 Clement", "w": "Chapter XVII.—There is but one Lord and one God, the Father and Creator of\nall things, who has loved us in Christ, given us commandments, and remitted\nour sins; whose Son and Word Christ proved Himself to be, when He forgave\nour sins.", "t": "ii. 5.\n1943 Matt. vi. 12.\n1944 Gen. iii. 8.\n1945 Matt. ix. 2; Luke v. 20.\n1946 Matt. ix. 2; Luke v. 20.\n1947 Luke i. 78.\n1948 Matt. ix. 8.\n\n\nthe prophets, who is also the Father of our Lord; and therefore He taught men, by the evidence\nof their senses through", "lang": "greek", "orig": ""}, {"v": 2, "f": "CS Lewis", "w": "", "t": "I could never see how one escaped the dilemma aut deus aut malus homo by confining oneself to the Synoptics. Moderns do not seem startled, as contemporaries were, by the claim Jesus there makes to forgive sins; not sins against Himself, just sins. Yet surely, if they actually met it, they would feel differently. If Dr Pittenger told me that two of his colleagues had lost him a professorship by telling lies about his character and I replied, \"I freely forgive them both\", would he not think this an impertinence (both in the old and in the modern sense) bordering on insanity?", "lang": "english", "orig": ""}, {"v": 2, "f": "Chrysostom - Homilies on John", "w": "Homily XXIX.", "t": "This paralytic, however, was different from that one who is set forth in John.1212 For\nhe lay at the pool, but this at Capernaum; and that man had his infirmity thirty and eight\nyears, but concerning this, no such thing is mentioned; and the other was in a state destitute\nof protectors, but this had some to take care of him, who also took him up, and carried him.\nAnd to this He saith, “Son, thy sins be forgiven thee,”1213but to that He saith, “Wilt thou\nbe made whole?”1214 And the other He healed on a sabbath day, but this not on a sabbath,\nfor else the Jews would have laid this also to His charge; and in the case of this man they\nwere silent, but in that of the other they were instant in persecuting him.", "lang": "greek", "orig": ""}, {"v": 2, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Homily XXXVII.", "t": "Now some suppose that this is the man in Matthew who was “lying on a bed” ( Matt.\nix. 2 ); but it is not so, as is clear in many ways. First, from his wanting persons to stand\nforward for him. That man had many to care for and to carry him, this man not a single\none; wherefore he said, “I have no man.” Secondly, from the manner of answering; the\nother uttered no word, but this man relates his whole case. Thirdly, from the season and\nthe time; this man was healed at a feast, and on the Sabbath, that other on a different day.\nThe places too were different; one was cured in a house, the other by the pool. The manner\nalso of the cure was altered; there Christ said, “Thy sins be forgiven thee,” but here He\nbraced982 the body first, and then cared for the soul. In that case there was remission of\nsins, (for He saith, “Thy sins be forgiven thee,”) but in this, warning and threats to strengthen\nthe man for the future; “Sin no more, lest a worse thing come unto thee.” ( Ver. 14.) The\ncharges also of the Jews are different; here they object to Jesus, His working on the Sabbath,\nthere they charge Him with blasphemy.", "lang": "greek", "orig": ""}, {"v": 2, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Homily XXXVIII.", "t": "But why is it that in the case of these paralytics Christ bringeth forward their sins? For\nHe saith also to him in Matthew who lay on a bed, “Son, be of good cheer, thy sins are forgiven\nthee” ( Matt. ix. 2 ): and to this man, “Behold, thou art made whole; sin no more.”1005\nI know that some slander this paralytic, asserting that he was an accuser of Christ, and that\ntherefore this speech was addressed to him; what then shall we say of the other in Matthew,\nwho heard nearly the same words? For Christ saith to him also, “Thy sins be forgiven thee.”\nWhence it is clear, that neither was this man thus addressed on the account which they allege.\nAnd this we may see more clearly from what follows;1006 for, saith the Evangelist, “Afterward\nJesus findeth him in the Temple,” which is an indication of his great piety; for he departed\nnot into the market places and walks, nor gave himself up to luxury and ease, but remained\nin the Temple, although about to sustain so violent an attack and to be harassed by all\nthere.1007 Yet none of these things persuaded him to depart from the Temple. Moreover\nChrist having found him, even after he had conversed with the Jews, implied nothing of the\nkind. For had He desired to charge him with this, He would have said to him, “Art thou\n1001 al. “at this.”\n1002 ἐ φόδιον γίγνεται. So Euseb. H. E. viii. 10, ἐ φ. τῆς εἰς τὴν ζωὴν εἰσόδου\n1003 lit. “there.”\n1004 al. “from loose living,” ῥ αθυμίας\n1005 See p. 129.\n1006 al. “from another reason.”\n1007 al. “chas", "lang": "greek", "orig": ""}, {"v": 2, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Homily XXXVII.", "t": "is the man in Matthew who was “lying on a bed” ( Matt.\nix. 2 ); but it is not so, as is clear in many ways. First, from his wanting persons to stand\nforward for him. That man had many to care for and to carry him, this man not a single\none; wherefore he said,", "lang": "greek", "orig": ""}, {"v": 2, "f": "Hilary of Poitiers", "w": "", "t": "Now in the narrative of the paralytic a number of people are brought forward for healing. Jesus’ words of healing are worthy of reflection. The paralytic is not told, “Be healed.” He is not told, “Rise and walk.” But he is told, “Take heart, my son; your sins are forgiven you.” The paralytic is a descendent of the original man, Adam. In one person, Christ, all the sins of Adam are forgiven. In this case the person to be healed is brought forward by ministering angels. In this case, too, he is called a son, because he is God’s first work. The sins of his soul are forgiven him, and pardon of the first transgression is granted. We do not believe the paralytic committed any sin [that resulted in his illness], especially since the Lord said elsewhere that blindness from birth had not been contracted from someone’s sin or that of his parents.", "lang": "english", "orig": ""}, {"v": 2, "f": "Hilary of Poitiers", "w": "", "t": "In this paralytic the whole Gentile world is offered for healing, he is therefore brought by the ministration of Angels; he is called Son, because he is God's work; the sins of his soul which the Law could not remit are remitted him; for faith only justifies. Lastly, he shows the power of the resurrection, by taking up his bed, teaching that all sickness shall then be no more found in the body.", "lang": "english", "orig": ""}, {"v": 2, "f": "Jerome", "w": "", "t": "They brought to him, as we said before, a second paralytic lying on a pallet because he was unable to enter. “And Jesus, seeing” not the “faith” of him who was brought forward but of those who were bringing him forward, said to the paralytic, “Take heart, my son, your sins are forgiven you.” O wonderful humility! He addresses as “son” this abject and infirm paralytic with disjointed members whom the priests did not stoop to touch. A son, indeed, because his sins are forgiven him. In line with the biblical metaphor, a soul lying in its body with all the strength of its members gone is brought for healing to the perfect Doctor, the Lord. If the soul is healed through his mercy, it will receive strength enough to immediately take up its pallet.", "lang": "english", "orig": ""}, {"v": 2, "f": "Jerome", "w": "", "t": "On a bed, because he could not walk.\n\nnot the sick man's, but theirs that bare him.\n\nO wonderful humility! This man feeble and despised, crippled in every limb, He addresses as son. The Jewish Priests did not deign to touch him. Even therefore His son, because his sins were forgiven him. Hence we may learn that diseases are often the punishment of sin; and therefore perhaps his sins are forgiven him, that when the cause of his disease has been first removed, health may be restored.\n\nFiguratively; the soul sick in the body, its powers palsied, is brought by the perfect doctor to the Lord to be healed. For every one when sick, ought to engage some to pray for his recovery, through whom the halting footsteps of our acts may be reformed by the healing power of the heavenly word. These are mental monitors, who raise the soul of the hearer to higher things, although sick and weak in the outward body.", "lang": "english", "orig": ""}, {"v": 2, "f": "John Chrysostom", "w": "", "t": "This paralytic, however, was different from that one who is set forth in John. For he lay at the pool, but this at Capernaum; and that man had his infirmity thirty and eight years, but concerning this, no such thing is mentioned; and the other was in a state destitute of protectors, but this had some to take care of him, who also took him up, and carried him. And to this He saith, \"Son, thy sins be forgiven thee,\" but to that He saith, \"Wilt thou be made whole?\" And the other He healed on a sabbath day, but this not on a sabbath, for else the Jews would have laid this also to His charge; and in the case of this man they were silent, but in that of the other they were instant in persecuting him.\n\nAnd this I have said, not without purpose, lest any one should think there is a discrepancy from suspecting it to be one and the same paralytic.\n\nBut do thou, I pray thee, mark the humility and meekness of our Lord. For He had also before this put away the multitudes from Him, and moreover when sent away by them at Gadara, He withstood not, but retired, not however to any great distance.\n\nAnd again He entered into the ship and passed over, when He might have gone over afoot. For it was His will not to be always doing miracles, that He might not injure the doctrine of His humanity.\n\nNow Matthew indeed saith, that \"they brought him,\" but the others, that they also broke up the roof, and let him down. And they put the sick man before Christ, saying nothing, but committing the whole to Hi", "lang": "english", "orig": ""}, {"v": 2, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "This paralytic, however, was different from that one who is set forth in John. John 5:1 For he lay at the pool, but this at Capernaum; and that man had his infirmity thirty and eight years, but concerning this, no such thing is mentioned; and the other was in a state destitute of protectors, but this had some to take care of him, who also took him up, and carried him. And to this He says, Son, your sins be forgiven you, but to that He says, Will you be made whole? John 5:6 And the other He healed on a sabbath day, but this not on a sabbath, for else the Jews would have laid this also to His charge; and in the case of this man they were silent, but in that of the other they were instant in persecuting him.", "lang": "", "orig": ""}, {"v": 2, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Seeing then the cymbals and the multitude, He put them all out, and in the presence of the parents works the miracle; not introducing another soul, but recalling the same that had gone out, and awakening her as it were out of a sleep.", "lang": "", "orig": ""}, {"v": 2, "f": "Lactantius", "w": "CONCERNING JAMES THE BROTHER OF THE LORD, AND STEPHEN THE FIRST MARTYR.", "t": "Precious in the sight of the\n904 Num. xvii. 8\n905 Matt. ix. 2, etc.\n906 Mark iii. 1, etc.\n907 John ix. 1, etc.\n908 Matt. xiv. 17, etc.\n909 John ii. 3, etc.\n910 Matt. xvii. 24, etc.\n911 Acts i. 3.\n912 Matt. xxviii. 19.\n913 Acts i. 9.\n\n\nLord is the death of His h", "lang": "latin", "orig": ""}, {"v": 2, "f": "Peter Chrysologus", "w": "", "t": "Note in this regard, my brothers, that God does not inquire into the wants of those who are deliriously ill. He does not wait to see the faith of the ignorant or probe the senseless wishes of the sick. Yet he does not refuse to help the faith of another, so that by grace alone he confers whatever is proper of the divine will. In fact, my brothers, when does a doctor ever inquire into or examine the wishes of those who are ailing, for a patient is prone to be of a contrary mind in his wishes and demands?", "lang": "english", "orig": ""}, {"v": 2, "f": "Peter Chrysologus", "w": "", "t": "(ubi sup.) Of how great power with God must a man's own faith be, when that of others here availed to heal a man both within and without. The paralytic hears his pardon pronounced, in silence uttering no thanks, for he was more anxious for the cure of his body than his soul. Christ therefore with good reason accepts the faith of those that bare him, rather than his own hardness of heart.\n\n(ubi sup.) The Lord requires not in this world the will of those who are without understanding, but looks to the faith of others; as the physician does not consult the wishes of the patient, when his malady requires other things.", "lang": "english", "orig": ""}, {"v": 2, "f": "Symeon the New Theologian", "w": "", "t": "Does He distinguish and separate anyone out, calling one to Himself as foreknown while sending the other away as not predestined? Never! Therefore, “you should not make excuses for your sins” [Psalm 140:4, LXX], nor should you want to make the Apostle’s words an occasion for your own destruction, but should run, all of you, to the Master Who calls you. For even if someone is a publican, or a fornicator, an adulterer, a murderer, or whatever else, the Master does not turn him away, but takes away the burden of his sins immediately and makes him free. And how does He take away the other’s burden? Just as He once took away that of the paralytic when He said to the latter: “My son, your sins are forgiven” (Matthew 9:2), and the man was immediately relieved of his burden and, in addition, received the cure of his body. - \"Second Ethical Discourse\"", "lang": "english", "orig": ""}, {"v": 2, "f": "Theodoret - Church History", "w": "Chapter 10.—Concerning the Word of the Mind, in Which We See the Word of\nGod, as in a Glass and an Enigma.", "t": "18. Some thoughts, then, are speeches of the heart, wherein the Lord also shows that\nthere is a mouth, when He says, “Not that which entereth into the mouth defileth a man;\nbut that which proceedeth out of the mouth, that defileth a man.” In one sentence He has\n970 Wisd. ii. 1\n971 Matt. ix. 2–4\n972 Luke v. 21, 22\n973 Luke xii. 17\n\n\ncomprised two diverse mouths of the man, one of the body, one of the heart. For assuredly,\nthat from which they thought the man to be defiled, enters into the mouth of the body; but\nthat from which the Lord said the man was defiled, proceedeth out of the mouth of the\nheart. So certainly He Himself explained what He had said. For a little after, He says also to\nHis disciples concerning the same thing: “Are ye also yet without understanding? Do ye not\nunderstand, that whatsoever entereth in at the mouth goeth into the belly, and is cast out\ninto the draught?” Here He most certainly pointed to the mouth of the body. But in that\nwhich follows He plainly speaks of the mouth of the heart, where He says, “But those things\nwhich proceed out of the mouth come forth from the heart; and they defile the man. For\nout of the heart proceed evil thoughts,”974 etc. What is clearer than this explanation? And\nyet, when we call thoughts speeches of the heart, it does not follow that they are not also\nacts of sight, arising from the sight of knowledge, when they are true. For when these things\nare done outwardly by means of the body, then speech and sight are different", "lang": "greek", "orig": ""}, {"v": 2, "f": "Theodoret - Church History", "w": "Chapter 10.—Concerning the Word of the Mind, in Which We See the Word of\nGod, as in a Glass and an Enigma.", "t": "man.” In one sentence He has\n970 Wisd. ii. 1\n971 Matt. ix. 2–4\n972 Luke v. 21, 22\n973 Luke xii. 17\n\n\ncomprised two diverse mouths of the man, one of the body, one of the heart. For assuredly,\nthat from which they thought the man to be defiled, enters into the", "lang": "greek", "orig": ""}, {"v": 2, "f": "Thomas Aquinas", "w": "", "t": "They brought a paralytic. Here is suggested the devotion of those who brought him; hence in Mark (2:4) it says that because they could not get near him, they let him down through the opened roof. This paralytic signifies the sinner lying in sin; hence, as the paralytic cannot move himself, so neither the sinner. Those who carry him are the ones who by their urgings carry him to God.\n\nWhen Jesus saw their faith, he mentions the favor. Here we can see three things: first, what moved Jesus; secondly, what is required; thirdly, the complaint against the favor. Sometimes Jesus cures someone because of his faith, sometimes because of his prayers and those of others. Hence Mark (11:24): \"Whatever you ask for in prayer, believe that you will receive, and it will be done to you.\" Take heart [have faith]. So what is required? Faith: \"Those who trust in the Lord are like Mount Zion, which cannot be moved, but abides forever\"; \"Purifying their hearts by faith\" (Acts 15:9). Your sins are forgiven. Here the favor is mentioned. But what had been his request? Bodily health, and the Lord gives health to his soul. The reason is that sin was the cause of the sickness, as in Psalm 16 (v. 4): \"On account of their sins their infirmities were multiplied.\" Hence God acted as a good physician, who cures the cause.", "lang": "english", "orig": ""}, {"v": 2, "f": "npnf213", "w": "On the Sinful Woman.", "t": "“Was it not enough for thee,\n633 John ix. 6.\n634 Matt. ix. 2.\n635 Luke vii. 36.\n636 Stibium.\n\n\nharlot, that thou hast corrupted all our town? What means this fashion that thou showest\ntoday to thy lovers—that thou hast put off thy wantonness and hast clothed t", "lang": "greek", "orig": ""}, {"v": 3, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Homily LXIV.", "t": "qual with God, they say, “This man blasphemeth” ( Matt.\nix. 3 ); and when He saith, “Thy sins be forgiven thee” ( c. x. 20 ), they moreover call Him\na demoniac. So when He saith that the man who heareth His words is stronger than death,\nor, “I am in the Father", "lang": "greek", "orig": ""}, {"v": 3, "f": "Jerome", "w": "", "t": "We read in the prophet the words of God: “It is I who cleanse you from all your iniquities.” Consequently the scribes, because they were judgmental in construing the words of God, accused him of blasphemy. But the Lord, reading their thoughts, shows himself to be God who knows the hidden things of the heart. He breaks his silence: “With the same majesty and power by which I perceive your thoughts, I am able to forgive their sins; see for yourselves what the paralytic has received.”", "lang": "english", "orig": ""}, {"v": 3, "f": "Jerome", "w": "", "t": "(Verses 3, 4.) And behold, some of the scribes said to themselves: He blasphemes. And when Jesus saw their thoughts, he said: Why do you think evil in your hearts? We read in the Prophet, saying God: I am the one who blots out your iniquities (Isaiah 43:25). Therefore, the scribes, because they thought he was a man and did not understand the words of God, accuse him of blasphemy. But the Lord, seeing their thoughts, shows himself to be God, who can know the hidden things of the heart, and speaks in a silent manner: With the same majesty and power with which I behold your thoughts, I can also forgive sins to men. Understand what the paralytic suffers from among you.", "lang": "english", "orig": ""}, {"v": 3, "f": "Jerome", "w": "", "t": "We read in prophecy, I am he that blolleth out thy transgressions; (Is. 43:25.) so the Scribes regarding Him as a man, and not understanding the words of God, charged Him with blasphemy. But He seeing their thoughts thus showed Himself to be God, Who alone knoweth the heart; and thus, as it were, said, By the same power and prerogative by which I see your thoughts, I can forgive men their sins. Learn from your own experience what the paralytic has obtained. When Jesus perceived their thoughts, he said, Why think ye evil in your hearts?", "lang": "english", "orig": ""}, {"v": 3, "f": "John Chrysostom", "w": "", "t": "Upon their murmuring, then, and saying, \"This man blasphemeth; who can forgive sins but God only?\" let us see what He saith. Did He indeed take away the suspicion? And yet if He were not equal, He should have said, \"Why fix upon me a notion which is not convenient? I am far from this power.\" But now hath He said none of these things, but quite the contrary He hath both affirmed and ratified, as well by His own voice, as by the performance of the miracle. Thus, it appearing that His saying certain things of himself gave disgust to his hearers, He affirms what He had to say concerning Himself by the others; and what is truly marvellous, not by His friends only, but also by His enemies; for this is the excellency of His wisdom. By His friends on the one hand, when He said, \"I will, be thou clean,\" and when He said, \"I have not found so great faith, no, not in Israel;\" but by His enemies, now. For because they had said, \"No man can forgive sins but God only,\" He subjoined, \"But that ye may know that the Son of Man hath power to forgive sins upon the earth (then saith He to the sick of the palsy), Arise, and take up thy bed, and go unto thine house.\"\n\nIn this case indeed He discloses also another sign, and that no small one, of His own Godhead, and of His equality in honor with the Father. For whereas they said, \"To unbind sins pertains to God only,\" He not only unbinds sins, but also before this He makes another kind of display in a thing which pertained to God only; the publishi", "lang": "english", "orig": ""}, {"v": 3, "f": "Theophylact of Ohrid", "w": "", "t": "\"And, behold, certain of the scribes said within themselves, This man blasphemeth. And Jesus knowing their thoughts said, Wherefore think ye evil in your hearts? For which is easier to say, Thy sins be forgiven thee; or to say, Arise, and walk?\" By knowing their thoughts, Jesus shows that He is God. He rebukes them by saying, \"You think that I am blaspheming by promising to forgive sins, which is a great thing, and that I resort to this because it is something which can not be verified. But by healing the body, I shall guarantee that the soul has been healed as well. By doing the lesser deed, though it appears to be more difficult, I shall also confirm the remission of sins, which is indeed something great even though it appears easier to you since it is not visible to the eye.\"", "lang": "english", "orig": ""}, {"v": 3, "f": "Thomas Aquinas", "w": "", "t": "Then he mentions the complaint against the favor. He says, therefore, Some of the scribes said within themselves, \"This man is blaspheming.\" Why? Because they saw the man and did not see God. But only God can forgive sins; therefore, they called him a blasphemer: Job (34:18): \"Who says to a king, 'Worthless one', and to nobles, 'Wicked man'.\" But Jesus, knowing their thoughts said, \"Why do you think evil in your hearts?\" Here he refutes them in three ways: by his knowledge, by a word and by a deed. By knowledge, because, as it belongs to God alone to forgive sins, so also to know the secrets of the heart: \"God sees minds and hearts\" (Ps 7:9).", "lang": "english", "orig": ""}, {"v": 4, "f": "Jerome", "w": "", "t": "[Daniel 2:28] \"But there is a God in heaven who reveals mysteries.\" Therefore it is only in vain that thou inquirest (other MSS have: \"that he inquire\") of men as to something which is known only to God in heaven. Also, by indirectly drawing Nebuchadnezzar away from the worship of many gods, Daniel directs him to the knowledge of the one (true) God.\n\n\"Who hath shown thee, King Nebuchadnezzar, what is going to take place (the Vulg. reads: \"the things which are going to take place\") in the last times.\" Avoiding the blemish of adulation but cleaving to the truth, he courteously suggests that it is to the king, for it was to him that God had revealed secrets concerning what was to occur in the last times. Now either these \"last days\" are to be reckoned from the time when the dream was revealed to Daniel until the end of the world, or else at least this inference is to be drawn, that the over-all interpretation of the dream applies to that final end when the image and statue beheld is to be ground to powder.\n\n\"Thy dream and the visions of thy head upon thy bed were as follows.\" He does not say, \"The visions of thine eyes,\" lest we should think it was something physical, but rather: \"of thy head.\" \"For the eyes of a wise man are in his head\" (Ecclesiastes 2:14), that is to say in the princely organ of the heart, just as we read in the Gospel: \"Blessed are the pure in heart, for they are ones who shall see God\" (Matthew 5:8). Again: \"What are ye meditating in your hearts?\" (Matthew ", "lang": "english", "orig": ""}, {"v": 4, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For behold, certain of the scribes, it says, said within themselves, This man blasphemes. And Jesus knowing their thoughts, said, Wherefore think ye evil in your hearts? Matthew 9:3-4", "lang": "", "orig": ""}, {"v": 4, "f": "Tertullian", "w": "", "t": "For, when one reads of God as being \"the searcher and witness of the heart; \" when His prophet is reproved by His discovering to him the secrets of the heart; when God Himself anticipates in His people the thoughts of their heart, \"Why think ye evil in your hearts? \" when David prays \"Create in me a clean heart, O God,\" and Paul declares, \"With the heart man believeth unto righteousness,\" and John says, \"By his own heart is each man condemned; \" when, lastly, \"he who looketh on a woman so as to lust after her, hath already committed adultery with her in his heart,\" -then both points are cleared fully up, that there is a directing faculty of the soul, with which the purpose of God may agree; in other words, a supreme principle of intelligence and vitality (for where there is intelligence, there must be vitality), and that it resides in that most precious part of our body to which God especially looks: so that you must not suppose, with Heraclitus, that this sovereign faculty of which we are treating is moved by some external force; nor with Moschion, that it floats about through the whole body; nor with Plato, that it is enclosed in the head; nor with Zenophanes, that it culminates in the crown of the head; nor that it reposes in the brain, according to the opinion of Hippocrates; nor around the basis of the brain, as Herophilus thought; nor in the membranes thereof, as Strato and Erasistratus said; nor in the space between the eyebrows, as Strato the physician held; nor withi", "lang": "english", "orig": ""}, {"v": 4, "f": "Tertullian", "w": "", "t": "The Lord Himself, in short, when rebuking our thoughts, includes in His censures this aspect of the flesh, (man's heart), the citadel of the soul: \"Why think ye evil in your hearts? \" and again: \"Whosoever looketh on a woman, to lust after her, hath already committed adultery with her in his heart.", "lang": "english", "orig": ""}, {"v": 4, "f": "Tertullian (cont)", "w": "Chapter XXII.—Of Martyrs, and Their Intercession on Behalf of Scandalous Offenders.", "t": "I have, even now, a test whereby to prove (the presence of) Christ (in you). If Christ is\nin the martyr for this reason, that the martyr may absolve adulterers and fornicators, let\nHim tell publicly the secrets of the heart, that He may thus concede (pardon to) sins; and\nHe is Christ. For thus it was that the Lord Jesus Christ showed His power: “Why think ye\nevil in your hearts? For which is easier, to say to the paralytic, Thy sins are remitted thee;\nor, Rise and walk? Therefore, that ye may know the Son of man to have the power upon\nearth of remitting sins, I say to thee, paralytic, Rise, and walk.”995 If the Lord set so much\nstore by the proof of His power as to reveal thoughts, and so impart health by His command,\nlest He should not be believed to have the power of remitting sins; it is not lawful for me to\nbelieve the same power (to reside) in any one, whoever he be, without the same proofs. In\nthe act, however, of urgently entreating from a martyr pardon for adulterers and fornicators,\nyou yourself confess that crimes of that nature are not to be washed away except by the\nmartyrdom of the criminal himself, while you presume (they can be washed away) by another’s.\nIf this is so, then martyrdom will be another baptism. For “I have withal,” saith He,\n“another baptism.”996 Whence, too, it was that there flowed out of the wound in the Lord’s\nside water and blood, the materials of either baptism.997 I ought, then, by the first baptism\ntoo to (have the right of) setting anothe", "lang": "latin", "orig": ""}, {"v": 4, "f": "Thomas Aquinas", "w": "", "t": "Knowing their thoughts, because he alone knows man's thoughts. First, he reprehends their villainy: Why do you think evil thoughts in your hearts? For they called him a blasphemer: \"Remove the evil from your thoughts\" (Is 1:16).", "lang": "english", "orig": ""}, {"v": 4, "f": "npnf210", "w": "CHAPTER XIV.", "t": "Ps. xciv. [xciii.] 8–11.\n68 Jer. xvii. 10.\n69 S. Matt. ix. 4.\n70 S. Luke vi. 8.\n\n\nIn the night,” he says, “he will be as a thief, and the eye of the adulterer will watch for the\ndarkness, saying, No eye shall see me; he hath covered up his face.”71 For every o", "lang": "greek", "orig": ""}, {"v": 4, "f": "npnf210", "w": "CHAPTER XIV.", "t": "53. But we are satisfied with the witness of Him Who says: “I search out the heart and\nthe reins.”68 In the Gospel, also, the Lord Jesus says: “Why think ye evil in your hearts? For\nHe knew they were thinking evil.”69 The evangelist also witnesses to this, saying: “For Jesus\nknew their thoughts.”70", "lang": "greek", "orig": ""}, {"v": 5, "f": "Jerome", "w": "", "t": "It is easier said than done. Whether the sins of the paralytic were forgiven, only he who forgave them knew for sure. “Arise and walk”: both he who arose and those who saw him arise were able to vouch for this. Hence there is a bodily sign in order to demonstrate a spiritual sign, though its impact is to curb the imperfections of body and soul. And we are given an understanding of sin and many bodily weaknesses to come. Perhaps, too, sins are forgiven first, so that with the causes of infirmity removed health may be restored.", "lang": "english", "orig": ""}, {"v": 5, "f": "Jerome", "w": "", "t": "(Verse 5, 6.) Which is easier to say: your sins are forgiven you; or to say: rise up and walk? But so that you may know that the Son of Man has power on earth to forgive sins, then He says to the paralytic. There is a great difference between saying and doing. Whether the paralytic's sins were forgiven, only the one who forgave them knew. But both the one who rose up and those who saw him rise up could verify it by his walking. Therefore, a bodily sign is given in order to prove something spiritual, although it has the same power to forgive the faults of both body and soul. And intelligence is given to us, because many bodily weaknesses occur due to sins. And perhaps your sins are forgiven first, so that with the causes of weakness removed, health is restored.", "lang": "english", "orig": ""}, {"v": 5, "f": "Jerome", "w": "", "t": "Whether or no his sins were forgiven He alone could know who forgave; but whether he could rise and walk, not only himself but they that looked on could judge of; but the power that heals, whether soul or body, is the same. And as there is a great difference between saying and doing, the outward sign is given that the spiritual effect may be proved; But that ye may know that the Son of Man hath power on earth to forgive sins.", "lang": "english", "orig": ""}, {"v": 5, "f": "John Chrysostom", "w": "", "t": "And whereas, when He spake unto the sick of the palsy, He spake without clearly manifesting His own authority: for He said not, \"I forgive thee thy sins,\" but, \"thy sins be forgiven thee:\" upon their constraining, He discloses His authority more clearly, saying, \"But that ye may know that the Son of Man hath power on earth to forgive sins.\"\n\nSeest thou, how far He was from unwillingness to be thought equal to the Father? For He said not at all, \"The Son of Man hath need of another;\" or, \"He hath given Him authority,\" but, \"He hath authority.\" Neither doth He say it for love of honor, but \"to convince you,\" so He speaks, \"that I do not blaspheme in making myself equal with God.\"\n\nThus everywhere His will is to offer proofs clear and indisputable; as when He saith, \"Go thy way, show thyself to the priest;\" and when He points to Peter's wife's mother ministering, and permits the swine to cast themselves down headlong. And in the same manner here also; first, for a certain token of the forgiveness of his sins, He provides the giving tone to his body: and of that again, his carrying his bed; to hinder the fact from being thought a mere fancy. And He doeth not this, before He had asked them a question. \"For whether is easier,\" saith He, \"to say, Thy sins be forgiven thee? or to say, Take up thy bed, and go unto thine house?\" Now what He saith is like this, \"Which seems to you easier, to bind up a disorganized body, or to undo the sins of a soul? It is quite manifest; to bind up a b", "lang": "english", "orig": ""}, {"v": 5, "f": "Thomas Aquinas", "w": "", "t": "Which is easier? Here the disproof is given. But the Lord seems to argue incorrectly, because he argues from the lesser by affirming, for it seems easier to heal the body than the soul. But Jerome explains it thus: It is easier to say than to do; but as to doing, it is greater to heal the soul than the body; and as to power, it is the same power for both. But if it refers to words, we see that liars are quick to lie, when they cannot be caught. For in matters that are public, they can be caught, but not in those that are hidden. Hence in those cases they speak boldly, when they cannot be caught. Therefore, it is easier to say, if you could not know.", "lang": "english", "orig": ""}, {"v": 6, "f": "1 Clement", "w": "Chapter XVII.—There is but one Lord and one God, the Father and Creator of\nall things, who has loved us in Christ, given us commandments, and remitted\nour sins; whose Son and Word Christ proved Himself to be, when He forgave\nour sins.", "t": "ophet pointed out that the sure word of God,\n1949 Matt. ix. 6.\n1950 Ps. xxxii. 1, 2.\n1951 Col. ii. 14.\n1952 2 Kings vi. 6.\n\n\n\nwhich we had negligently lost by means of a tree, and were not in the way of finding again,\nwe should receive anew by the dispensation", "lang": "greek", "orig": ""}, {"v": 6, "f": "Augustine - Confessions", "w": "Chapter XII.—Concerning the Words Ascribed to John by All the Four Evangelists\nRespectively.", "t": "puts it thus: “And begin not to say, We have\n791 Matt. ix. 6, xvi. 27.\n792 John v. 25.\n793 Luke", "lang": "latin", "orig": ""}, {"v": 6, "f": "Augustine - Confessions", "w": "Sermon LXXXV.", "t": "4. “But,” says he, “the Father commands, that the Son may execute.” Carnal indeed is\nthy conceit, but without prejudice to the truth, I grant it to you. Lo, the Father commands,\nthe Son obeys; is the Son therefore not of the same Nature, because the One commands,\nand the Other obeys? Give me two men, father and son; they are two men: he that commands\nis a man; he that obeys is a man; he that commands and he that obeys have one and the\nsame nature. Does not he that commands, beget a son of his own nature? Does he who\nobeys, by obeying lose his nature? Now take for the present, as you thus take two men, the\nFather commanding, the Son obeying, yet God and God. But the first two together are two\nmen, the Latter together is but One God; this is a divine miracle. Meanwhile if you would\nthat with you I acknowledge the obedience, do you first with me acknowledge the Nature.\nThe Father begat That which Himself is. If the Father begat ought else than what Himself\nis, He did not beget a true Son. The Father saith to the Son, “From the womb before the\nday-star, I begat Thee.”4026 What is, “before the day-star”? By the day-star times are signified.\nSo then before times, before all that is called “before;” before all that is not, or before all that\nis. For the Gospel does not say, “In the beginning God made the Word;” as it is said, “In the\nbeginning God made the Heaven and the earth;”4027 or, “In the beginning was the Word\nborn;” or, “In the beginning God begat the Word.” But what says it", "lang": "latin", "orig": ""}, {"v": 6, "f": "Glossa Ordinaria", "w": "", "t": "(ap. Anselm.) These words That ye may know, may be either Christ's words, or the Evangelist's words. As though the Evangelist had said, They doubted whether He could remit sins, But that ye may know that the Son of Man hath the power to remit sins, he saith to the paralytic. If they are the words of Christ, the connection will be as follows; You doubt that I have power to remit sins, But that ye may know that the Son of Man hath power to remit sins—the sentence is imperfect, but the action supplies the place of the consequent clause, he saith to the paralytic, Rise, take up thy bed.", "lang": "english", "orig": ""}, {"v": 6, "f": "Gospel of Peter", "w": "3. Concerning the Epileptic.", "t": "“And when they were come to the multitude, there came to Him a man kneeling to Him\nand saying, Lord, have mercy upon my son.”5862 Those who are suffering, or the kinsfolk\nof the sufferers, are along with the multitudes; wherefore, when He has dispensed the things\nthat were beyond the multitudes, He descends to them, so that those, who were not able to\nascend because of the sicknesses that repressed their soul, might be benefited when the\nWord descended to them from the loftier regions. But we ought to make inquiry, in respect\nof what diseases the sufferers believe and pray for their own healing, and in respect of what\ndiseases others do this for them, as, for example, the centurion for his servant, and the nobleman\nfor his son, and the ruler of the synagogue for a daughter, and the Canaanitish woman\nfor her female child who was vexed with a demon, and now the man who kneels to Him on\nbehalf of his epileptic son. And along with these you will investigate when the Saviour heals\nof Himself and unasked by any one, as for example, the paralytic; for these cures, when\ncompared with one another for this very purpose, and examined together, will exhibit to\nhim who is able to hear “the wisdom of God hidden in a mystery,”5863 many dogmas concerning\nthe different diseases of souls, as well as the method of their healing.", "lang": "greek", "orig": ""}, {"v": 6, "f": "Gregory the Dialogist", "w": "", "t": "(Mor. xxiii. 24.) Or by the bed is denoted the pleasure of the body. He is commanded now he is made whole to bear that on which he had lain when sick, because every man who still takes pleasure in vice is laid as sick in carnal delights; but when made whole he bears this because he now endures the wantonness of that flesh in whose desires he had before reposed.", "lang": "english", "orig": ""}, {"v": 6, "f": "Hilary of Poitiers", "w": "", "t": "Furthermore, so it could be understood that he was in a body and that he could forgive sins and restore health to bodies, Jesus said, “That you may know that the Son of Man has power on earth to forgive sins,” then he said to the paralytic, “Arise, take up your pallet.” He could have simply said “Arise,” but since the reason for doing every work had to be explained, he added, “Take up your pallet and go home.” First he granted remission of sins; next he showed his ability to restore health. Then, with the taking up of the pallet, he made it clear that bodies would be free from infirmity and suffering; lastly, with the paralytic’s return to his home, he showed that believers are being given back the way to paradise from which Adam, the parent of all, who became profligate from the stain of sin, had proceeded.", "lang": "english", "orig": ""}, {"v": 6, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But that you may know that the Son of Man has power to forgive sins upon the earth (then says He to the sick of the palsy), Arise, and take up your bed, and go unto your house.", "lang": "", "orig": ""}, {"v": 6, "f": "Peter Chrysologus", "w": "", "t": "(ubi sup.) That that which had been proof of his sickness, should now become proof of his recovered health. And go to thy house, that having been healed by Christian faith, you may not die in the faithlessness of the Jews.", "lang": "english", "orig": ""}, {"v": 6, "f": "Pseudo-Clementine Literature", "w": "Chapter III.—Faith and Unbelief.", "t": "“Whereas therefore some men suffer, and others cure those who suffer, it is necessary\nto know the cause at once of the suffering and the cure; and this is proved to be nought else\nthan unbelief on the part of the sufferers, and faith on the part of those who cure them. For\nunbelief, while it does not believe that there is to be a judgment by God, affords licence to\nsin, and sin makes men liable to sufferings; but faith, believing that there is to be a judgment\nof God, restrains men from sin; and those who do not sin are not only free from demons\nand sufferings, but can also put to flight the demons and sufferings of others.", "lang": "greek", "orig": ""}, {"v": 6, "f": "Rabanus Maurus", "w": "", "t": "His rising up is the drawing off the soul from carnal lusts; his taking up his bed is the raising the flesh from earthly desires to spiritual pleasures; his going to his house is his returning to Paradise, or to internal watchfulness of himself against sin.", "lang": "english", "orig": ""}, {"v": 6, "f": "Theophylact of Ohrid", "w": "", "t": "\"But that ye may know that the Son of Man hath power on earth to forgive sins - then saith He to the paralytic - Arise, take up thy bed, and go unto thine house. And he arose, and departed to his house. But when the multitudes saw it, they marvelled, and glorified God Who had given such power unto men.\" Jesus commanded him to carry his bed so that the event would not appear to have been imaginary, and also, so that the multitudes would see the miracle. For they thought that Jesus, Who is greater than all, was only a man.", "lang": "english", "orig": ""}, {"v": 6, "f": "Thomas Aquinas", "w": "", "t": "Therefore, that you may know that the Son of man has power on earth to forgive sins. He shows it in deed: first, the end of the deed is mentioned; secondly, the method; thirdly, the efficacy.\n\nHence he says, In order that you may know that the Son of man has power on earth to forgive sins, he says to the paralytic, \"Rise, take up your bed and go home.\" By this he manifests that he is God: \"He will save his people from their sins\" (Mt 1:21). He says, the Son of man, and on earth, thereby shattering two errors, namely, Nestorius' and Photinus'. Nestorius said that the Son of God and the Son of man were two supposits [persons] and that something said of one could not be said of the other. Hence it could not be said: This child created the stars. Therefore, he says, Son of man, because it belongs to God to forgive sins. Likewise, against Photinus, who said that Christ received his origin from the Virgin Mary and acquired divinity by his merits. And he rested his belief on Matthew (18:18): \"All power has been given to me on earth and in heaven.\" That is why he says, on earth. Hence it says in Baruch (3:38): \"After this he was seen on earth and conversed with men.\" Has the power.\n\nIt seems that this does not prove anything, because the apostles themselves had the power. However, they had it as ministers, not as its authors.\n\nThe statement, but that you may know, can be taken in two ways: either as the words of the evangelist, and then they are narrative; or as the words of Christ, ", "lang": "english", "orig": ""}, {"v": 6, "f": "npnf202", "w": "Chapter XI.—Account of St. Spyridon: His Modesty and Steadfastness.", "t": "s, have imagined that Sozomen studied there.\n1095 Matt. ix. 6.\n1096 τῆς τεσσαρακοστῆς ενστάσης. While it was Lent and probably Holy Week. See Tertull. de Pat. 13, and\nde Jejun. 14.\n\n\nthe stranger, partook of the meat, and told him to follow his example. But the", "lang": "greek", "orig": ""}, {"v": 7, "f": "Hilary of Poitiers", "w": "", "t": "Admiration and not fear had to accomplish this work, but even now the order of the mystery remains. To add a glimpse of the future to the truth of the present, the crowds fear the Lord’s words and actions. It is frightful to face death without having one’s sins forgiven by Christ, for no one returns to the eternal home unless forgiveness of sins has been granted. “And they honored God who had given so much power to humans.” Everything is concluded in proper order, and with the cessation of desperate fear, honor is rendered to God for giving so much power to humans. But this was due to Christ alone, to whom it was normal to share the Father’s very essence. No wonder then that he could do these things—for the power of God is not limited. Otherwise praise would have come from the man healed and not from the many. But the reason here for honor offered to God is this: Power was given through God’s Word to humanity for the remission of sins, the resurrection of bodies and the return to heaven.", "lang": "english", "orig": ""}, {"v": 7, "f": "Jerome", "w": "", "t": "(Verse 7, 8.) Rise, take up your bed, and go to your house. And he rose and went to his house. And when the crowds saw it, they were afraid and glorified God, who had given such authority to men. And if the paralyzed man rises, if he recovers his former strength, he carries his bed on which he lay before, and carries it into his house of virtues.", "lang": "english", "orig": ""}, {"v": 7, "f": "John Chrysostom", "w": "", "t": "This command He added, that it might be seen there was no delusion in the miracle; so it follows to establish the reality of the cure, And he arose, and went away to his own house. But they that stood by yet grovel on the earth, whence it follows, But the multitude seeing it were afraid, and glorified God, who had bestowed such power among men. For had they rightly considered among themselves, they would have acknowledged Him to be the Son of God. Meanwhile it was no little matter to esteem Him as one greater than men, and to have come from God.", "lang": "english", "orig": ""}, {"v": 7, "f": "Thomas Aquinas", "w": "", "t": "Then follows the execution of the commands: He rose and went home.", "lang": "english", "orig": ""}, {"v": 8, "f": "1 Clement", "w": "Chapter XVII.—There is but one Lord and one God, the Father and Creator of\nall things, who has loved us in Christ, given us commandments, and remitted\nour sins; whose Son and Word Christ proved Himself to be, when He forgave\nour sins.", "t": "46 Matt. ix. 2; Luke v. 20.\n1947 Luke i. 78.\n1948 Matt. ix. 8.\n\n\nthe prophets, who is also the Father of our Lord; and therefore He taught men, by the evidence\nof their senses through those signs which He accomplished, to give glory to God. If,\nhowever, He Hims", "lang": "greek", "orig": ""}, {"v": 8, "f": "Augustine - Confessions", "w": "Chapter VII.", "t": "69 Ps. liii. 5.\n70 Gal. v. 26.\n71 Chap. vi. 4.\n72 Matt. ix. 8.\n73 Gal. i. 23, 24. Vastabat…glorificabant; Vulgate, expugnabat…clarificabant.\n\n\nlaw? “No,” says He; “for think not that I am come to destroy the law, or the prophets: I am\nnot come to destroy, but t", "lang": "latin", "orig": ""}, {"v": 8, "f": "Gospel of Peter", "w": "Section VII.", "t": "rent. 574And no man putteth\n556 Luke v. 26a.\n557 Matt. ix. 8b.\n558 Luke v. 26c.\n559 Mark ii. 12c.\n560 Luke v. 27.\n561 See above, note to § 6, 46.\n562 Luke v. 28.\n563 Luke v. 29.\n564 Luke v. 30.\n565 Luke v. 31.\n566 A Syriacism.\n567 Luke v. 32.\n568 Luke v. 33.\n5", "lang": "greek", "orig": ""}, {"v": 8, "f": "Hilary of Poitiers", "w": "", "t": "It is a very fearful thing to be seized by death while the sins are yet unforgiven by Christ; for there is no way to the heavenly house for him whose sins have not been forgiven. But when this fear is removed, honour is rendered to God, who by His word has in this way given power to men, of forgiveness of sins, of resurrection of the body, and of return to Heaven.", "lang": "english", "orig": ""}, {"v": 8, "f": "John Chrysostom", "w": "", "t": "\"For when the multitudes saw it, they marvelled, and glorified God, which had given such power unto men:\" for the flesh was an offense unto them. But He did not rebuke them, but proceeds by His works to arouse them, and exalt their thoughts. Since for the time it was no small thing for Him to be thought greater than all men, as having come from God. For had they well established these things in their own minds, going on orderly they would have known, that He was even the Son of God. But they did not retain these things clearly, wherefore neither were they able to approach Him. For they said again, \"This man is not of God;\" \"how is this man of God?\" And they were continually harping on these things, putting them forward as cloaks for their own passions.", "lang": "english", "orig": ""}, {"v": 8, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For when the multitudes saw it, they marvelled, and glorified God, which (it is said) had given such power unto men: for the flesh was an offense unto them.  But He did not rebuke them, but proceeds by His works to arouse them, and exalt their thoughts. Since for the time it was no small thing for Him to be thought greater than all men, as having come from God. For had they well established these things in their own minds, going on orderly they would have known, that He was even the Son of God. But they did not retain these things clearly, wherefore neither were they able to approach Him. For they said again, This man is not of God; John 9:16 how is this man of God? And they were continually harping on these things, putting them forward as cloaks for their own passions.", "lang": "", "orig": ""}, {"v": 8, "f": "Thomas Aquinas", "w": "", "t": "When the crowds, not the scribes, because they were scornful, saw it, they were afraid: \"O Lord, I have heard the report of you and I feared\" (Hab 3:2). But with what fear? Because they glorified God, for they referred everything to God: \"Not to us, O Lord, not to us, but to your name give the glory\" (Ps 115:1). Who had given such power to men. Hence they are not scornful like the scribes. But because it says, to men, Hilary explains: \"You gave such power to men, that they be made sons of God,\" as in John (1:12): \"He gave them power to be made sons of God.\"", "lang": "english", "orig": ""}, {"v": 9, "f": "Athanasius - Select Works", "w": "Book XVII.", "t": "have no desire to be fulfilled. Their author\n634 Matt. ix. 9.\n\n\nand father condemns adding to them as much as taking away anything from them; as we\nread in Deuteronomy: \"These precepts which I deliver unto thee this day, O Israel, thou\nshalt observe to do; tho", "lang": "greek", "orig": ""}, {"v": 9, "f": "Augustine - City of God", "w": "Tractate LXI.", "t": "ving reference to the\n1203 Chap. xxi. 20–24.\n1204 Matt. ix. 9.\n1205 Ex. vi. 1.\n1206 2 Cor. xii. 2.\n\n\nbosom on which the narrator was leaning. For what else can be in dicated by the bosom but\nsome hidden truth? But there is another more suitable passage, where t", "lang": "latin", "orig": ""}, {"v": 9, "f": "Augustine - Confessions", "w": "Contents", "t": "Of the Fact that Matthew, Together with Mark, Had Specially in View the Kingly\nCharacter of Christ, Whereas Luke Dealt with the Priestly. 168", "lang": "latin", "orig": ""}, {"v": 9, "f": "Augustine of Hippo", "w": "", "t": "Or, perhaps it is more probable that Matthew here turns back to relate something that he had omitted; and we may suppose Matthew to have been called before the sermon on the mount; for on the mount, as Luke relates, the twelve, whom He also named Apostles, were chosen.", "lang": "english", "orig": ""}, {"v": 9, "f": "Chromatius of Aquileia", "w": "", "t": "The Lord, about to give salvation to all sinners believing in him, willingly chose Matthew the former publican. The gift of his esteem for Matthew stands as an example for our salvation. Every sinner must be chosen by God and can receive the grace of eternal salvation if one is not without a religious mind and a devout heart. So Matthew was chosen willingly by God. And though he is immersed in worldly affairs, because of his sincere religious devotion he is judged worthy to be called forth by the Lord (“Follow me”), who by virtue of his divine nature knows the hidden recesses of the heart. From what follows, we know that Matthew was accepted by the Lord not by reason of his status but of his faith and devotion. As soon as the Lord says to him, “Follow me,” he does not linger or delay, but thereupon “he arose and followed him.”", "lang": "english", "orig": ""}, {"v": 9, "f": "Chrysostom - Homilies on John", "w": "Homily XXX.", "t": "“And as Jesus passed forth from thence, He saw a man sitting at the receipt of custom,1250named\nMatthew; and He saith unto him, Follow me.”", "lang": "greek", "orig": ""}, {"v": 9, "f": "Glossa Ordinaria", "w": "", "t": "(ap. Anselm.) He says, sitting at the receipt of custom, that is, in the place where the tolls were collected. He was named Telonarius, from a Greek word signifying taxes.\n\n(non occ.) Matthew places his calling among the miracles; for a great miracle it was, a Publican becoming an Apostle.", "lang": "english", "orig": ""}, {"v": 9, "f": "Jerome", "w": "", "t": "Out of respect and deference, the other Evangelists were unwilling to call him by the common name of Matthew but said Levi. So Matthew went by a double name in accordance with what Solomon noted: “An accuser is righteous at the beginning of his words.” And in another place: “Tell your sins, and you will be justified.” Matthew also calls himself a publican to show his readers that no one must despair of salvation if he has changed for the better, for he was suddenly changed from a publican to an apostle.", "lang": "english", "orig": ""}, {"v": 9, "f": "Jerome", "w": "", "t": "(Verse 9) And as Jesus passed on from there, he saw a man sitting at the tax booth, named Matthew. And he said to him, 'Follow me.' And he rose and followed him. The other evangelists, out of respect and honor for Matthew, did not want to use his name openly, but they said, 'Levi,' for he had two names. But Matthew himself, according to what is commanded by Solomon (or rather, it is said), 'The righteous is an accuser of himself at the beginning of his speech' (Proverbs 18:17). And in another place: Confess your sins, that you may be justified (Isaiah 43:26). Matthew calls himself and the tax collector, in order to show to the readers that no one should despair of salvation if they have turned to better things; since he himself was suddenly changed from a tax collector to an apostle. Porphyry and Julian the Emperor argue in this place, either the incompetence of the lying historian, or the foolishness of those who immediately followed the Savior, as if they irrationally followed anyone who called them, when there were so many virtues and signs that the Apostles had seen before they believed. Certainly, that very brilliance and majesty of hidden divinity, which also shone forth in a human face, was able to draw those who saw it for the first time to itself by its appearance. For if this power is said to exist in a magnet and amber, so that they attract rings, straws, and stalks to themselves, how much more could the Lord of all creatures draw to himself those whom he wished?", "lang": "english", "orig": ""}, {"v": 9, "f": "Jerome", "w": "", "t": "The other Evangelists from respect to Matthew have not called him by his common name, but say here, Levi, for he had both names. Matthew himself, according to that Solomon says. The righteous man accuses himself, (Prov. 18:17.) calls himself both Matthew and Publican, to show the readers that none need despair of salvation who turn to better things, seeing he from a Publican became an Apostle.\n\nPorphyry and the Emperor Julian insist from this account, that either the historian is to be charged with falsehood, or those who so readily followed the Saviour with haste and temerity; as if He called any without reason. They forget also the signs and wonders which had preceded, and which no doubt the Apostles had seen before they believed. Yea the brightness of effulgence of the hidden Godhead which beamed from His human countenance might attract them at first view. For if the loadstone can, as it is said, attract iron, how much more can the Lord of all creation draw to Himself whom He will!\n\nBut they had seen the Publican turning from sins to better things, and finding place of repentance, and on this account they do not despair of salvation.", "lang": "english", "orig": ""}, {"v": 9, "f": "John Chrysostom", "w": "", "t": "For when He had performed the miracle, He did not remain, lest, being in sight, He should kindle their jealousy the more; but He indulges them by retiring, and soothing their passion. This then let us also do, not encountering them that are plotting against us; let us rather soothe their wound, giving way and relaxing their vehemence.\n\nBut wherefore did He not call him together with Peter and John and the rest? As in their case He had come at that time, when He knew the men would obey Him; so Matthew also He then called when He was assured he would yield himself. And therefore Paul again He took, as a fisher his prey, after the resurrection. Because He who is acquainted with the hearts, and knows the secrets of each man's mind, knew also when each of these would obey. Therefore not at the beginning did He call him, when he was yet in rather a hardened state, but after His countless miracles, and the great fame concerning Him, when He knew him to have actually become more prepared for obedience.\n\nAnd we have cause also to admire the self-denial of the evangelist, how he disguises not his own former life, but adds even his name, when the others had concealed him under another appellation.\n\nBut why did he say he was \"sitting at the receipt of custom?\" To indicate the power of Him that called him, that it was not when he had left off or forsaken this wicked trade, but from the midst of the evils He drew him up; much as He converted the blessed Paul also when frantic and raging, a", "lang": "english", "orig": ""}, {"v": 9, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And as Jesus passed forth from thence, He saw a man sitting at the receipt of custom,  named Matthew; and He says unto him, Follow me.", "lang": "", "orig": ""}, {"v": 9, "f": "Rabanus Maurus", "w": "", "t": "In the call of Matthew and the Publicans is figured the faith of the Gentiles who first gaped after the gain of the world, and are now spiritually refreshed by the Lord; in the pride of the Pharisees, the jealousy of the Jews at the salvation of the Gentiles. Or, Matthew signifies the man intent on temporal gain; Jesus sees him, when He looks on him with the eyes of mercy. For Matthew is interpreted 'given,' Levi 'taken,' the penitent is taken out of the mass of the perishing, and by God's grace given to the Church. And Jesus saith unto him, Follow me, either by preaching, or by the admonition of Scripture, or by internal illumination.", "lang": "english", "orig": ""}, {"v": 9, "f": "Remigius of Rheims", "w": "", "t": "He esteems lightly human dangers which might accrue to him from his masters for leaving his accounts in disorder, but, he arose, and followed him. And because he relinquished earthly gain, therefore of right was he made the dispenser of the Lord's talents.", "lang": "english", "orig": ""}, {"v": 9, "f": "Symeon the New Theologian", "w": "", "t": "So then, let everyone who wants approach Him, and let the one say: “Son of David, have mercy on me“; and, if he hears, “What do you want Me to do for you?” let him say quickly, “Lord, let me receive my sight,” and right away he will hear, “So I desire. Receive your sight” [Luke 18:38-42]. Let another say, “Lord, my daughter“-i.e. my soul-“is severely possessed by a demon” [Matthew 15:22], and he will hear: “I will come to heal her” [Matthew 8:7]. If someone is hesitant and does not wish to approach the Master, even if He comes to him and says, “Follow Me” (Matthew 9:9), then let him follow Him as the publican once did, abandoning his counting tables and his avarice, and, I am sure, He shall make of him, too, an evangelist rather than a tax collector. If someone else is a paralytic, lying for years in sloth, carelessness, and love of pleasure, and if he should see another, be it the Master Himself or one of His disciples, come to him and ask, “Do you want to be healed?” [John 5:2-7], let him receive the word joyfully and reply immediately: “Yes, Lord, but I have no man to put me into the pool of repentance.” And then if he should hear, “Rise, take up your bed, and follow me,” let him get up right away and run after the footsteps of the One Who has called him from on high. - \"Second Ethical Discourse\"", "lang": "english", "orig": ""}, {"v": 9, "f": "Tertullian", "w": "", "t": "Do you hesitate about arts, and trades, and about professions likewise, for the sake of children and parents? Even there was it demonstrated to us, that both \"dear pledges,\" and handicrafts, and trades, are to be quite left behind for the Lord's sake; while James and John, called by the Lord, do leave quite behind both father and ship; while Matthew is roused up from the toll-booth; while even burying a father was too tardy a business for faith.", "lang": "english", "orig": ""}, {"v": 9, "f": "Tertullian", "w": "", "t": "If that was wanting to the apostles, I know not in the faith of what things it was, that, roused by one word of the Lord, one left the toll-booth behind for ever; another deserted father and ship, and the craft by which he gained his living; a third, who disdained his father's obsequies, fulfilled, before he heard it, that highest precept of the Lord, \"He who prefers father or mother to me, is not worthy of me.", "lang": "english", "orig": ""}, {"v": 9, "f": "Theophylact of Ohrid", "w": "", "t": "\"And as Jesus passed forth from thence, He saw a man, named Matthew, sitting collecting tax: and He saith unto him, Follow Me. And he arose, and followed Him.\" He did not call Matthew together with Peter and John, but when He knew that he would obey. He likewise called Paul later, when it was time. Marvel at how the evangelist displays his own former way of life, while the other evangelists disguise his name, calling him \"Levi\" (Mk. 2:13-17 and Lk. 5:27-32). That Matthew is converted by word alone is the work of God.", "lang": "english", "orig": ""}, {"v": 9, "f": "Thomas Aquinas", "w": "", "t": "Here two things are mentioned: first, the conversion of sinners; secondly, the complaint of the Pharisees (v. 11).\n\nFirst, he tells how he called a certain man to discipleship; secondly, how he called many to intimacy (v. 10).\n\nHe says, therefore, As Jesus passed on from there... Why did he pass on? Because they were lying in wait for him, he avoided the crowds, as it says in Sirach (8:3): \"Do not heap wood on the fire of sinners.\" He saw a man, a man, indeed; because he was a sinner: \"You shall die like men and fall like any prince\" (Ps 82:7). Sitting at the tax office. Hence he was pursuing a vocation which one can scarcely follow without sin. By the name of Matthew. Others call him Levi, to save his honor and keep him from being known as a sinner. But he calls himself Matthew, because a just man in the beginning accuses himself; giving us to understand that the Lord is not an acceptor of persons. And he said to him: \"Follow me.\" It is a great thing that the Lord moves him to follow. And he rose and followed him. Hence he could say from Job (23:11): \"My foot has held fast to his steps; I have kept his way and have not turned aside.\"\n\nBut it is objected that it cannot be that at one word he followed him. The answer is that Jesus' fame had been so widespread, that anyone who followed him considered himself blessed; therefore, at one word he followed him. Hence obedience is shown, because he followed at once. But why did he not call him from the very beginning? The answer is t", "lang": "english", "orig": ""}, {"v": 10, "f": "Augustine - Confessions", "w": "Chapter XXVII.—Of the Feast at Which It Was Objected at Once that Chri

st Ate\nwith Sinners, and that His Disciples Did Not Fast; Of the Circumstance that the\nEvangelists Seem to Give Different Accounts of the Parties by Whom These\nObjections Were Alleged; And of the Question Whether Matthew and Mark and\nLuke are Also in Harmony with Each Other in the Reports Given of the Words\nof These Persons, and of the Replies Returned by the Lord.", "t": "be, since the sense is fully given, the idea\n925 Matt. ix. 10–17.\n926 Mark ii. 15.\n927 Luke v. 27–29.\n928 Matt. ix. 11.\n929 Mark ii. 16.\n\n\nsuggested being that they were partaking of a repast in company? Luke, on the other hand,\nseems to have recorded this scen", "lang": "latin", "orig": ""}, {"v": 10, "f": "Augustine - Confessions", "w": "Chapter XXVII.—Of the Feast at Which It Was Objected at Once that Christ Ate\nwith Sinners, and that His Disciples Did Not Fast; Of the Circumstance that the\nEvangelists Seem to Give Different Accounts of the Parties by Whom These\nObjections Were Alleged; And of the Question Whether Matthew and Mark and\nLuke are Also in Harmony with Each Other in the Reports Given of the Words\nof These Persons, and of the Replies Returned by the Lord.", "t": "60. Matthew, accordingly, goes on to say: “And it came to pass, as He sat at meat in the\nhouse, behold, many publicans and sinners came and sat down with Jesus and His disciples;”\nand so on, down to where we read, “But they put new wine into new bottles, and both are\npreserved.”925 Here Matthew has not told us particularly in whose house it was that Jesus\nwas sitting at meat along with the publicans and sinners. This might make it appear as if he\nhad not appended this notice in its strict order here, but had introduced at this point, in the\nway of reminiscence, something which actually took place on a different occasion, were it\nnot that Mark and Luke, who repeat the account in terms thoroughly similar, have made it\nplain that it was in the house of Levi—that is to say, Matthew—that Jesus sat at meat, and\nall these sayings were uttered which follow. For Mark states the same fact, keeping also the\nsame order, in the following manner: “And it came to pass, as He sat at meat in his house,\nmany publicans and sinners sat also together with Jesus.”926 Accordingly, when he says, “in\nhis house,” he certainly refers to the person of whom he was speaking directly before, and\nthat was Levi. To the same effect, after the words, “He saith unto him, Follow me; and he\nleft all, rose up, and followed Him,”927 Luke has appended immediately this statement:\n“And Levi made Him a great feast in his own house: and there was a great company of\npublicans and of others that sat down with them.” And t", "lang": "latin", "orig": ""}, {"v": 10, "f": "Augustine of Hippo", "w": "", "t": "Matthew has not said in whose house Jesus sat at meat (on this occasion), from which we might suppose, that this was not told in its proper order, but that what took place at some other time is inserted here as it happened to come into his mind; did not Mark and Luke who relate the same show that it was in Levi's, that is, in Matthew's house.", "lang": "english", "orig": ""}, {"v": 10, "f": "Glossa Ordinaria", "w": "", "t": "(ap. Anselm.) As a meet return for the heavenly mercy, Matthew prepared a great feast for Christ in his house, bestowing his temporal goods on Him of whom he looked to receive everlasting goods. It follows, And it came to pass as he sat at meat in the house.\n\n(ap. Anselm.) The Publicans were they who were engaged in public business, which seldom or never can be carried on without sin. And a beautiful omen of the future, that he that was to be an Apostle and doctor of the Gentiles, at his first conversion draws after him a great multitude of sinners to salvation, already performing by his example what he was shortly to perform by word.\n\n(ord.) Tertullian says that these must have been Gentiles, because Scripture says, There shall be no payer of tribute in Israel, as if Matthew were not a Jew. But the Lord did not sit down to meat with Gentiles, being more especially careful not to break the Law, as also He gave commandment to His disciples below, Go not into the way of the Gentiles.", "lang": "english", "orig": ""}, {"v": 10, "f": "Jerome", "w": "", "t": "(V. 10 seq.) And it came to pass, as he sat at table in his house, behold many publicans and sinners came and sat down with Jesus and his disciples. And when the Pharisees saw it, they said to his disciples, 'Why does your teacher eat with tax collectors and sinners?' But when Jesus heard it, he said, 'Those who are well have no need of a physician, but those who are sick. Go and learn what this means: \"I desire mercy, and not sacrifice.\" For I came not to call the righteous, but sinners.''", "lang": "english", "orig": ""}, {"v": 10, "f": "Jerome", "w": "", "t": "For they do not come to Jesus while they remain in their original condition of sin, as the Pharisees and Scribes complain, but in penitence, as what follows proves; But Jesus hearing said, They that be whole need not a physician, but they that are sick.", "lang": "english", "orig": ""}, {"v": 10, "f": "John Chrysostom", "w": "", "t": "Having therefore called him, He also honored him with a very great honor by partaking straightway of his table; for in this way He would both give him good hope for the future, and lead him on to a greater confidence. For not in a long time, but at once, He healed his vice. And not with him only doth He sit down to meat, but with many others also; although this very thing was accounted a charge against Him, that He chased not away the sinners. But neither do they conceal this point, what sort of blame is endeavored to be fixed on His proceedings.\n\nNow the publicans come together as to one of the same trade; for he, exulting in the entrance of Christ, had called them all together. The fact is, Christ used to try every kind of treatment; and not when discoursing only, nor when healing, nor when reproving His enemies, but even at His morning meal, He would often correct such as were in a bad way; hereby teaching us, that every season and every work may by possibility afford us profit. And yet surely what was then set before them came of injustice and covetousness; but Christ refused not to partake of it, because the ensuing gain was to be great: yea rather He becomes partaker of the same roof and table with them that have committed such offenses. For such is the quality of a physician; unless he endure the corruption of the sick, he frees them not from their infirmity.\n\nAnd yet undoubtedly He incurred hence an evil report: first by eating with him, then in Matthew's house, and t", "lang": "english", "orig": ""}, {"v": 10, "f": "Peter Chrysologus", "w": "", "t": "Jesus’ sitting at table has more significance for Matthew than just dining. Jesus will be feasting not on food but on the return of sinners. He will call them back through feasting, collegiality and human affection, enjoying himself with their pleasant conversation while reclining at table. He knew that if they recognized him as a powerful judge they would be shattered by the terror of his majesty and overwhelmed by the sheer presence of God unveiled (nuda). Thus, veiled in a human body he was able to communicate with humans. He who wanted to assist the guilty hides the fact that he was a judge. He who did not deny dignity to faithful servants conceals his lordship. He who desired the weak to be embraced by a parent’s love covers his majesty.", "lang": "english", "orig": ""}, {"v": 10, "f": "Tertullian", "w": "", "t": "Nor would the name of publicans have been so execrable in the eyes of the Lord, unless as being a \"strange\" name,-a (name) of such as put up the pathways of the very sky, and earth, and sea, for sale. Moreover, when (the writer) adjoins \"sinners\" to \"publicans,\" it does not follow that he shows them to have been Jews, albeit some may possibly have been so; but by placing on a par the one genus of heathens-some sinners by office, that is, publicans; some by nature, that is, not publicans-he has drawn a distinction between them.", "lang": "english", "orig": ""}, {"v": 10, "f": "Tertullian (cont)", "w": "Chapter IX.—Certain General Principles of Parabolic Interpretation. These Applied\nto the Parables Now Under Consideration, Especially to that of the Prodigal Son.", "t": "v.\n7; “strange gods,” etc.\n801 See Luke xv. 1, 2; Matt. ix. 10, 11; xi. 19; Mark ii. 15, 16; Luke v. 29, 30.\n802 See Acts x. 28; xi. 3.\n\n\nas it is comprised in the maintenance of discipline, we see is being subverted by that interpretation\nwhich is affected by t", "lang": "latin", "orig": ""}, {"v": 10, "f": "Tertullian (cont)", "w": "Chapter IX.—Certain General Principles of Parabolic Interpretation. These Applied\nto the Parables Now Under Consideration, Especially to that of the Prodigal Son.", "t": "Now we must proceed, in the case of the prodigal son, to consider first that which is\nmore useful; for no adjustment of examples, albeit in the most nicely-poised balance, shall\nbe admitted if it shall prove to be most hurtful to salvation. But the whole system of salvation,\n799 Oehler refers to Deut. xxiii. 19; but the ref. is not satisfactory.\n800 Extraneum. Comp. such phrases as “strange children,” Ps. cxliv. 7, 11 (cxliii. 7, 11, in LXX.), and Hos. v.\n7; “strange gods,” etc.\n801 See Luke xv. 1, 2; Matt. ix. 10, 11; xi. 19; Mark ii. 15, 16; Luke v. 29, 30.\n802 See Acts x. 28; xi. 3.\n\n\nas it is comprised in the maintenance of discipline, we see is being subverted by that interpretation\nwhich is affected by the opposite side. For if it is a Christian who, after wandering\nfar from his Father, squanders, by living heathenishly, the “substance” received from God\nhis Father,—(the substance), of course, of baptism—(the substance), of course, of the Holy\nSpirit, and (in consequence) of eternal hope; if, stripped of his mental “goods,” he has even\nhanded his service over to the prince of the world803—who else but the devil?—and by him\nbeing appointed over the business of “feeding swine”—of tending unclean spirits, to wit—has\nrecovered his senses so as to return to his Father,—the result will be, that, not adulterers\nand fornicators, but idolaters, and blasphemers, and renegades, and every class of apostates,\nwill by this parable make satisfaction to the Father; and in this way (it ", "lang": "latin", "orig": ""}, {"v": 10, "f": "Theophylact of Ohrid", "w": "", "t": "\"And it came to pass, as Jesus sat at table in the house, behold, many publicans and sinners came and sat down with Him and His disciples. And when the Pharisees saw it, they said unto His disciples, Why eateth your Master with publicans and sinners?\" Joyful because he had received Christ into his house, Matthew invited the publicans. Christ ate with them so that He might benefit them also, even though He was criticized for doing it. For the Pharisees wanted to separate His disciples from Him, and so they slandered Him for eating with publicans.", "lang": "english", "orig": ""}, {"v": 10, "f": "Thomas Aquinas", "w": "", "t": "He continues: As he was at table in the house, many tax collectors and sinners came and sat down with Jesus and his disciples. Here he shows how many were called to intimacy. Hence he says, As he sat at table... Others say that he gave him a banquet, but Matthew is silent. But it is true that he did; hence he invited many, so that they would be drawn to the Lord, because \"curtain draws curtain\" (Ex c. 36). Therefore, it is a sign that one is firmly converted to the Lord, when he draws others, whom he loves more. Hence he says, many tax collectors and sinners came and sat down with Jesus, because \"if anyone opens to me, I will enter and dine with him and he with me\" (Rev 3:20).", "lang": "english", "orig": ""}, {"v": 11, "f": "Augustine - Confessions", "w": "Chapter XXVII.—Of the Feast at Which It Was Objected at Once that Christ Ate\nwith Sinners, and that His Disciples Did Not Fast; Of the Circumstance that the\nEvangelists Seem to Give Different Accounts of the Parties by Whom These\nObjections Were Alleged; And of the Question Whether Matthew and Mark and\nLuke are Also in Harmony with Each Other in the Reports Given of the Words\nof These Persons, and of the Replies Returned by the Lord.", "t": "x. 10–17.\n926 Mark ii. 15.\n927 Luke v. 27–29.\n928 Matt. ix. 11.\n929 Mark ii. 16.\n\n\nsuggested being that they were partaking of a repast in company? Luke, on the other hand,\nseems to have recorded this scene somewhat differently. For his version proceeds thus: “B", "lang": "latin", "orig": ""}, {"v": 11, "f": "Augustine of Hippo", "w": "", "t": "Luke seems to have related this a little differently; according to him the Pharisees say to the disciples, Why do ye eat and drink with Publicans and sinners? (Luke 5:30.) not unwilling that their Master should be understood to be involved in the same charge; insinuating it at once against Himself and His disciples. Therefore Matthew and Mark have related it as said to the disciples, because so it was as much an objection against their Master whom they followed and imitated. The sense therefore is one in all, and so much the better conveyed, as the words are changed while the substance continues the same.", "lang": "english", "orig": ""}, {"v": 11, "f": "Chromatius of Aquileia", "w": "", "t": "According to the allegorical or mystical account, Matthew’s house is his mind, which Christ entered through Matthew’s faith in his grace. He is viewed as having truly “sat at table” there, for this same Matthew deserved to be the writer of this Gospel. Describing the Lord’s deeds and power, he presented a heavenly feast not only to the Lord and his disciples but also to all believers who, coming as publicans and sinners to the knowledge of Christ, deserved being included in so great a feast. In effect, Matthew’s house can be viewed as a church comprising publicans and sinners. He presents to all the leaders there the feast of his faith and preaching, with the Lord and his disciples seated at table.", "lang": "english", "orig": ""}, {"v": 11, "f": "Hilary of Poitiers", "w": "", "t": "The Jews were seething with envy that the Lord was spending time with publicans and sinners. He declared to them that the words of the law were being concealed under a cloak of faithlessness. He gave aid to the sick and medicine to those in need. For those who believed they were healthy, however, no cure was necessary. But in order for them to understand that none of his followers were healthy, he advised them to learn the meaning of “I desire mercy, and not sacrifice.” In other words, the law linked to the ritual of sacrifices was unable to give help, but health was in store for all in the granting of mercy. “For I have not come to call the righteous, but sinners to repentance.” He had come for all. So why does Jesus say that he did not come for the righteous? … No one is righteous by reason of the law. He therefore showed the emptiness of boasting about the law, because with sacrifices imposed on the sick for their health, mercy was needed for all things set down in the law. For if righteousness came from the law, forgiveness through grace would not be necessary.", "lang": "english", "orig": ""}, {"v": 11, "f": "John Chrysostom", "w": "", "t": "But how is it, one may say, that Paul commands, \"If any man that is called a brother be a fornicator or covetous, with such an one no, not to eat?\" In the first place, it is not as yet manifest, whether to teachers also he gives this charge, and not rather to brethren only. Next, these were not yet of the number of the perfect, nor of those who had become brethren. And besides, Paul commands, even with respect to them that had become brethren, then to shrink from them, when they continue as they were, but these had now ceased, and were converted.\n\nBut none of these things shamed the Pharisees, but they accuse Him to His disciples, saying, \"Why eateth your Master with publicans and sinners?\"\n\nAnd when the disciples seem to be doing wrong, they intercede with Him, saying, \"Behold thy disciples do that which is not lawful to do on the sabbath-day;\" but here to them they discredit Him. All which was the part of men dealing craftily, and wishing to separate from the Master the choir of the disciples.", "lang": "english", "orig": ""}, {"v": 11, "f": "Rabanus Maurus", "w": "", "t": "They are here in a twofold error; first, they esteemed themselves righteous, though in their pride they had departed far from righteousness; secondly, they charged with unrighteousness those who by recovering themselves from sin were drawing near to righteousness.", "lang": "english", "orig": ""}, {"v": 11, "f": "Thomas Aquinas", "w": "", "t": "When the Pharisees saw this... We have seen how Jesus calls sinners to follow him and accepts them at the banquet. Here the complaint is mentioned: first, about the company; secondly, about the banquet (v. 14).\n\nIn regard to the first, the question is put; secondly, the response (v. 12).\n\nTherefore, when the Pharisees saw this, they said to his disciples. It should be noted that those Pharisees were malicious; hence they wished to effect a rupture between the disciples and Jesus. So they complained about Jesus to the disciples, and about the disciples to Jesus. Therefore, wishing to complain to the disciples about Jesus, they ask: Why does your teacher eat with tax collectors and sinners? They belong to that group mentioned in Proverbs (6:16): \"There are six things which the Lord hates, and a seventh which his soul detests,\" namely, \"the man who sows discord among brothers.\" But why does Luke say that this was said about the disciples? Augustine answers that the sentiment of both is the same, although the words are different, because they imputed it all to the teaching of the Master. Hence Luke refers to the words, Matthew to the sentiment. But it seems that they were right, because association with sinners should be avoided.\n\nHowever, it should be noted that association with sinners must be avoided sometimes on account of pride and contempt, as those in Isaiah (65:5): \"Keep to yourself, do not come near me, because you are unclean.\"\n\nBut others avoid the company of sinners f", "lang": "english", "orig": ""}, {"v": 12, "f": "Augustine of Hippo", "w": "", "t": "Luke adds to repentance, which explains the sense; that none should suppose that sinners are loved by Christ because they are sinners; and this comparison of the sick shows what God means by calling sinners, as a physician does the sick to be saved from their iniquity as from a sickness: which is done by penitence.", "lang": "english", "orig": ""}, {"v": 12, "f": "CS Lewis", "w": "", "t": "The greatest barrier I have met is the almost total absence from the minds of my audience of any sense of sin. This has struck me more forcibly when I spoke to the R.A.F. than when I spoke to students: whether (as I believe) the proletariat is more self-righteous than other classes, or whether educated people are cleverer at concealing their pride, this creates for us a new situation. The early Christian preachers could assume in their hearers, whether Jews, Metuentes, or Pagans, a sense of guilt. (That this was common among Pagans is shown by the fact that both Epicureanism and the mystery religions both claimed, though in different ways, to assuage it.) Thus the Christian message was in those days unmistakably the Evangelium, the Good News. It promised healing to those who knew they were sick. We have to convince our hearers of the unwelcome diagnosis before we can expect them to welcome the news of the remedy.", "lang": "english", "orig": ""}, {"v": 12, "f": "Gregory Thaumaturgus", "w": "Chapter I.—The Difficulty and Excellence of Virginity; The Study of Doctrine Necessary\nfor Virgins.", "t": "For as the putrid humours and matter of flesh, and all those things which corrupt it,\nare driven out by salt, in the same manner all the irrational appetites of a virgin are banished\nfrom the body by divine teaching. For it must needs be that the soul which is not sprinkled\n2504 Lit. the udder.\n2505 Matt. ix. 12.\n2506 [I think evidence abounds, in the course of this allegory, that it was designed to meet the painful discussions\nexcited in the Church by the fanatical conduct of Origen, vol. iv. pp. 225–226.]\n2507 Lit. “leaps out.”\n2508 Ecclus. vi. 36.\n\n\nwith the words of Christ, as with salt, should stink and breed worms, as King David, openly\nconfessing with tears in the mountains, cried out, “My wounds stink and are corrupt,”2509\nbecause he had not salted himself with the exercises of self-control, and so subdued his\ncarnal appetites, but self-indulgently had yielded to them, and became corrupted in adultery.\nAnd hence, in Leviticus,2510 every gift, unless it be seasoned with salt, is forbidden to be\noffered as an oblation to the Lord God. Now the whole spiritual meditation of the Scriptures\nis given to us as salt which stings in order to benefit, and which disinfects, without which it\nis impossible for a soul, by means of reason, to be brought to the Almighty; for “ye are the\nsalt of the earth,”2511 said the Lord to the apostles. It is fitting, then, that a virgin should always\nlove things which are honourable, and be distinguished among the foremost for wisdom\nand addicted", "lang": "greek", "orig": ""}, {"v": 12, "f": "Gregory Thaumaturgus", "w": "Chapter I.—The Difficulty and Excellence of Virginity; The Study of Doctrine Necessary\nfor Virgins.", "t": "which is not sprinkled\n2504 Lit. the udder.\n2505 Matt. ix. 12.\n2506 [I think evidence abounds, in the course of this allegory, that it was designed to meet the painful discussions\nexcited in the Church by the fanatical conduct of Origen, vol. iv. pp. 225–226.]", "lang": "greek", "orig": ""}, {"v": 12, "f": "Jerome", "w": "", "t": "The Lord went to the banquet of sinners that he might have an opportunity to teach and to offer spiritual food to his hosts. In effect, when he is mentioned as frequently going out to attend feasts, nothing is said other than what he did there and taught there. Thus, we see both the Lord’s humility in reaching out to sinners and the force of his teaching in converting penitents. What follows: “I desire mercy, and not sacrifice” and “I came not to call the righteous but sinners” (as he cites testimony from the prophet) challenged the scribes and Pharisees, who considered themselves righteous and shunned both publicans and sinners.", "lang": "english", "orig": ""}, {"v": 12, "f": "John Chrysostom", "w": "", "t": "What then saith Infinite Wisdom? \"They that be whole need not a physician,\" saith He, \"but they that are sick.\"\n\nSee how He turned their reasoning to the opposite conclusion. That is, while they made it a charge against Him that He was in company with these men: He on the contrary saith, that His not being with them would be unworthy of Him, and of His love of man; and that to amend such persons is not only blameless, but excellent, and necessary, and deserving of all sorts of praise.\n\nAfter this, that He might not seem to put them that were bidden to shame, by saying, \"they that are sick;\" see how He makes up for it again, by reproving the others.", "lang": "english", "orig": ""}, {"v": 12, "f": "Rabanus Maurus", "w": "", "t": "He calls Himself a physician, because by a wonderful kind of medicine He was wounded for our iniquities that He might heal the wound of our sin. By the whole, He means those who seeking to establish their own righteousness have not submitted to the true righteousness of God. By the sick, He means those who, tied by the consciousness of their frailty, and seeing that they are not justified by the Law, submit themselves in penitence to the grace of God.", "lang": "english", "orig": ""}, {"v": 12, "f": "Tertullian", "w": "", "t": "The Lord had come, of course, to save that which \"had perished; \" \"a Physician.\" necessary to \"the sick\" \"more than to the whole.\" This fact He was in the habit both of typifying in parables and preaching in direct statements.", "lang": "english", "orig": ""}, {"v": 12, "f": "Theophylact of Ohrid", "w": "", "t": "\"But when Jesus heard that, He said unto them, They that be whole need not a physician, but they that are sick. But go ye and learn what that meaneth, I desire mercy, and not sacrifice: for I am not come to call the righteous, but sinners to repentance.\" He says, \"I have not come now as judge but as physician, and for this reason I endure stench and filth.\" He also rebukes them for being ignorant when He says, \"Go ye and learn.\" This means, \"Since up to the present time you have not managed to learn, so at least from this time on go and learn that God prefers mercy towards sinners above any sacrifice\" (Hosea 6:7). The words \"I am not come to call the righteous\" He spoke ironically. That is, \"I have not come to call you who consider yourselves to be righteous, but I have come to call sinners. I do this, not so that they remain sinners, but in order for them to repent.\"", "lang": "english", "orig": ""}, {"v": 12, "f": "Thomas Aquinas", "w": "", "t": "Then follows Jesus' response, wherein he gives three reasons. First, he uses a comparison: But when Jesus heard it, he said: \"Those who are well have no need of a physician.\" The Lord calls himself a physician; and correctly so: \"He heals all your diseases\" (Ps 103:3), namely, of soul and body. Therefore, he refers to infirmities of body and soul; hence he says, those who are well have no need of a physician. The well are those who from pride consider themselves well; concerning these Revelation (3:17): \"You say, I am rich, I have prospered, and I need nothing; not knowing that you are wretched, pitiable, poor, blind and naked.\" Such persons do not need a physician, but those who are weak, i.e., acknowledge their sin, as David: \"For I know my transgression\" (Ps 51:3).", "lang": "english", "orig": ""}, {"v": 12, "f": "npnf206", "w": "Letter XI. To the Virgins of Æmona.", "t": ". 14.\n143 Luke vii. 37 sqq.\n144 Matt. xv. 27.\n145 Matt. ix. 12, 13.\n146 Ezek. xxxiii. 11.\n147 Luke xv. 5.\n148 Luke xv. 20.\n149 1 Cor. iv. 5.\n150 Rom. xiv. 4.\n151 1 Cor. x. 12.\n152 Gal. vi. 2.\n153 Cf. Prov. xiv. 12.\n154 2 Cor. iv. 7.\n\n\nPeter thrice denied his Lor", "lang": "greek", "orig": ""}, {"v": 13, "f": "Chrysostom - Homilies on Matthew", "w": "Homily II.", "t": "xvi. 18.\n816 ὀυ τόπον μὀνον ‡λλὰ καὶ τρόπον.\n817 Matt. ix. 13.\n\n\nheard the passage read to-day? Now I say these things that thou mayest not hesitate to take\nrefuge in the Church. Abide with the Church, and the Church does not hand thee over to\nthe enemy: but if", "lang": "greek", "orig": ""}, {"v": 13, "f": "Glossa Ordinaria", "w": "", "t": "(ap. Anselm.) Yet does not God contemn sacrifice, but sacrifice without mercy. But the Pharisees often offered sacrifices in the temple that they might seem to men to be righteous, but did not practise the deeds of mercy by which true righteousness is proved.\n\n(ap. Anselm.) Or; Those who were righteous, as Nathanael and John the Baptist, were not to be invited to repentance. Or. I came not to call the righteous, that is, the feignedly righteous, those who boasted of their righteousness as the Pharisees, but those that owned themselves sinners.", "lang": "english", "orig": ""}, {"v": 13, "f": "Hilary of Poitiers", "w": "", "t": "Christ came for all; how is it then that He says He came not for the righteous? Were there those for whom it needed not that He should come? But no man is righteous by the law. He shows how empty their boast of justification, sacrifices being inadequate to salvation, mercy was necessary for all who were set under the Law.", "lang": "english", "orig": ""}, {"v": 13, "f": "Irenaeus", "w": "CHAPTER XV.—ON THE DIFFERENT KINDS OF VOLUNTARY ACTIONS, AND THE SINS THENCE\nPROCEEDING.", "t": "What is voluntary is either what is by desire, or what is by choice, or what is of intention.\nClosely allied to each other are these things—sin, mistake, crime. It is sin, for example, to\nlive luxuriously and licentiously; a misfortune, to wound one’s friend in ignorance, taking\nhim for an enemy; and crime, to violate graves or commit sacrilege. Sinning arises from\nbeing unable to determine what ought to be done, or being unable to do it; as doubtless one\nfalls into a ditch either through not knowing, or through inability to leap across through\nfeebleness of body. But application to the training of ourselves, and subjection to the commandments,\nis in our own power; with which if we will have nothing to do, by abandoning\nourselves wholly to lust, we shall sin, nay rather, wrong our own soul. For the noted Laius\nsays in the tragedy:—\n\n“None of these things of which you admonish me have escaped me;\nBut notwithstanding that I am in my senses, Nature compels me;”\n\ni.e., his abandoning himself to passion. Medea, too, herself cries on the stage:—\n\n“And I am aware what evils I am to perpetrate,\nBut passion is stronger than my resolutions.”1448\n\nFurther, not even Ajax is silent; but, when about to kill himself, cries:—\n\n“No pain gnaws the soul of a free man like dishonour.\nThus do I suffer; and the deep stain of calamity\nEver stirs me from the depths, agitated\nBy the bitter stings of rage.”1449", "lang": "greek", "orig": ""}, {"v": 13, "f": "Jerome", "w": "", "t": "(Verse 13) I desire mercy, and not sacrifice. For I did not come to call the righteous, but sinners. And the Lord was going to the feasts of sinners, so that He may have an opportunity to teach and provide spiritual food to His invited guests. Ultimately, as He was frequently described as going to feasts, it is only important what He did there, what He taught, in order to demonstrate both the humility of the Lord in going to sinners and the power of His teaching in the conversion of repentant sinners. But as for what follows: 'I desire mercy, and not sacrifice' (Hosea 6:6). And: 'I have not come to call the righteous, but sinners,' testifying of the prophet, he rebukes the scribes and Pharisees who consider themselves righteous, but reject the company of sinners and tax collectors.", "lang": "english", "orig": ""}, {"v": 13, "f": "Jerome", "w": "", "t": "This text from Osee (Hosea 6:6.) is directed against the Scribes and Pharisees, who, deeming themselves righteous, refused to keep company with Publicans and sinners.", "lang": "english", "orig": ""}, {"v": 13, "f": "John Chrysostom", "w": "", "t": "\"Go ye and learn what that meaneth, I will have mercy, and not sacrifice.\"\n\nNow this He said, to upbraid them with their ignorance of the Scriptures. Wherefore also He orders His discourse more sharply, not Himself in anger, far from it; but so as that the publicans might not be in utter perplexity.\n\nAnd yet of course He might say, \"Did ye not mark, how I remitted the sins of the sick of the palsy, how I braced up his body?\" But He saith no such thing, but argues with them first from men's common reasonings, and then from the Scriptures. For having said, \"They that be whole need not a physician, but they that are sick;\" and having covertly indicated that He Himself was the Physician; after that He said, \"Go ye and learn what that meaneth, I will have mercy, and not sacrifice.\" Thus doth Paul also: when he had first established his reasoning by illustrations from common things, and had said, \"Who feedeth a flock, and eateth not of the milk thereof?\" then he brings in the Scriptures also, saying, \"It is written in the law of Moses, Thou shall not muzzle the ox that treadeth out the corn;\" and again, \"Even so hath the Lord ordained, that they which preach the gospel should live of the gospel.\"\n\nBut to His disciples not so, but He puts them in mind of His signs, saying on this wise, \"Do ye not yet remember the five loaves of the five thousand, and how many baskets ye took up?\" Not so however with these, but He reminds them of our common infirmity, and signifies them at any rate t", "lang": "english", "orig": ""}, {"v": 13, "f": "Rabanus Maurus", "w": "", "t": "He therefore warns them, that by deeds of mercy they should seek for themselves the rewards of the mercy that is above, and, not overlooking the necessities of the poor, trust to please God by offering sacrifice. Wherefore, He says, Go; that is, from the rashness of foolish fault-finding to a more careful meditation of Holy Scripture, which highly commends mercy, and proposes to them as a guide His own example of mercy, saying, I came not to call the righteous but sinners.", "lang": "english", "orig": ""}, {"v": 13, "f": "Symeon the New Theologian", "w": "", "t": "This therefore what Paul himself also knew when he said rightly:\n\nThose whom God foreknew, the same He also predestined; and those whom He predestined, He also called; and those whom He called, the same He also glorified. [Romans 8:29-30]\n\nIt is not God’s foreknowledge of those who, by their free choice and zeal, will prevail which is the cause of their victory, just as, again, it is not His knowing beforehand who will fall and be vanquished which is responsible for their defeat. Instead, it is the zeal, deliberate choice, and courage of each of us which effects the victory. Our faithlessness and sloth, our irresolution and indolence, on the other hand, comprise our defeat and perdition. So, while reclining on our bed of worldly affection and love of pleasure, let us not say: “Those whom God fore-knew, them also He predestined,” without perceiving just what it is we are saying. Yes, indeed, He truly knew you beforehand as inattentive and disobedient and lazy, but this is certainly not because He ordered or foreordained it that you should have no power to repent yourself nor, if you will it, to get up and obey. You, though, when you say this, are clearly calling God a liar. While He says, “I came not to call the righteous but sinners to repentance” [Matthew 9:13], you, lazy and unwilling to turn around and repent of your evil, contradict Him, as it were, and call Him a liar Who never lies, when you make such excuses as these. “Those who are going to repent”, you say, “were pre", "lang": "english", "orig": ""}, {"v": 13, "f": "Tertullian", "w": "", "t": "He therefore said: \"You wash the outside of the cup,\" that is, the flesh, \"but you do not cleanse your inside part,\" that is, the soul; adding: \"Did not He that made the outside,\" that is, the flesh, \"also make the inward part,\" that is to say, the soul?-by which assertion He expressly declared that to the same God belongs the cleansing of a man's external and internal nature, both alike being in the power of Him who prefers mercy not only to man's washing, but even to sacrifice. For He subjoins the command: \"Give what ye possess as alms, and all things shall be clean unto you.", "lang": "english", "orig": ""}, {"v": 13, "f": "Tertullian", "w": "", "t": "Saith He not, \"He who hath fallen shall rise again, and he who hath been averted shall be converted? \"He it is, indeed, who \"would have mercy rather than sacrifices.\" The heavens, and the angels who are there, are glad at a man's repentance.", "lang": "english", "orig": ""}, {"v": 13, "f": "Tertullian", "w": "", "t": "\"But,\" say they, \"God is `good, 'and `most good, ' and `pitiful-hearted, 'and `a pitier, 'and `abundant in pitiful-heartedness, ' which He holds `dearer than all sacrifice, ' `not thinking the sinner's death of so much worth as his repentance', `a Saviour of all men, most of all of believers.", "lang": "english", "orig": ""}, {"v": 13, "f": "Tertullian (cont)", "w": "Chapter VII.—Of the Parables of the Lost Ewe and the Lost Drachma.", "t": "I will now withdraw for a short time from this position; in order that I may, even by\nwithdrawing, the more recommend it, when I shall have succeeded even thus also in confuting\nthe presumption of the opposite side. I admit that the sinner portrayed in each parable is\none who is already a Christian; yet not that on this account must he be affirmed to be such\nan one as can be restored, through repentance, from the crime of adultery and fornication.\nFor although he be said to “have perished,” there will be the kind of perdition to treat of;\ninasmuch as the “ewe” “perished” not by dying, but by straying; and the “drachma” not by\nbeing destroyed, but by being hidden. In this sense, a thing which is safe may be said to\n“have perished.” Therefore the believer, too, “perishes,” by lapsing out of (the right path)\ninto a public exhibition of charioteering frenzy, or gladiatorial gore, or scenic foulness, or\nathletic vanity; or else if he has lent the aid of any special “arts of curiosity” to sports, to the\nconvivialities of heathen solemnity, to official exigence, to the ministry of another’s idolatry;\nif he has impaled himself upon some word of ambiguous denial, or else of blasphemy. For\nsome such cause he has been driven outside the flock; or even himself, perhaps, by anger,\nby pride, by jealousy, (or)—as, in fact, often happens—by disdaining to submit to chastisement,\nhas broken away (from it). He ought to be re-sought and recalled. That which can\nbe recovered does not “perish,” un", "lang": "latin", "orig": ""}, {"v": 13, "f": "Thomas Aquinas", "w": "", "t": "Secondly, he cites a scriptural text, saying, \"Go and learn what this means...\" As if to say: You do not understand the Scripture, but go and learn what this means: \"I desire mercy and not sacrifice.\" This is written in Hosea (6:6). And it is explained in two ways:\n\nFirst, so that one is understood to be preferred to the other, because I desire mercy more than sacrifice; hence one sacrifice is preferred to another. A lamb is a sacrifice and so is mercy; for by such offerings God shows mercy. Therefore, which of these is better? \"To show mercy and judgment is more acceptable to the Lord than victims\" (Pr 21:3).\n\nOr secondly, so that one is approved and the rest rejected: I desire mercy, but not the sacrifice you make. Hence Isaiah (1:15): \"I do not desire holocausts, because your hands are filled with blood.\"\n\nOr, another way: I desire mercy and not sacrifice. For one is said to desire that which he wants for its own sake and not for the sake of something else. It is as though a physician said: \"I desire health,\" and so among the works we offer God, we offer some for their own sake, as loving God and neighbor; others for the sake of these: \"I will show you, O man, what is good; and what the Lord requires of you. Indeed, to do justice and to love mercy\" (Mic 6:8).\n\nThirdly, the Lord gives another reason, based on his mission. It is as though an emissary, if he were prevented from exercising his office, should say: \"You are foolish, because you are preventing what pertains to me", "lang": "english", "orig": ""}, {"v": 13, "f": "npnf204", "w": "Letter XIX.—(For 347.) Coss. Rufinus, Eusebius; Præf. the same Nestorius; Indict. v; Easterday,\nPrid. Id. Apr., Pharmuthi xvii; Æra Dioclet. 63; Moon 15.", "t": "6 Ecclus. xviii. 17.\n4467 Ps. l. 23; Hosea vi. 6; Matt. ix. 13\n4468 1 Cor. ii. 8.\n\n\nto us4469.’ The end of such abandonment as this can be nothing but error, as the Lord, when\nreproving them, saith, ‘Ye do err, not knowing the Scriptures4470.’ Afterwards when, b", "lang": "greek", "orig": ""}, {"v": 13, "f": "npnf210", "w": "CHAPTER XII.", "t": ".\n2216 S. John iii. 17.\n2217 Hosea vi. 6.\n2218 S. Matt. ix. 13.\n2219 S. John i. 17.\n2220 S. John xii. 48.\n\n\nword, for this is His word, that every one should turn back from sin. So, then, of necessity\nyou must either reject this saying of His, or if you cannot d", "lang": "greek", "orig": ""}, {"v": 14, "f": "Augustine - Confessions", "w": "Chapter XXVII.—Of the Feast at Which It Was Objected at Once that Christ Ate\nwith Sinners, and that His Disciples Did Not Fast; Of the Circumstance that the\nEvangelists Seem to Give Different Accounts of the Parties by Whom These\nObjections Were Alleged; And of the Question Whether Matthew and Mark and\nLuke are Also in Harmony with Each Other in the Reports Given of the Words\nof These Persons, and of the Replies Returned by the Lord.", "t": "62. In the same way, we may subject what is said about the disciples of John to examin-\nation. Matthew’s words are these: “Then came to Him the disciples of John, saying, Why\ndo we and the Pharisees fast oft?”934 The purport of Mark’s version is similar: “And the\ndisciples of John and the Pharisees935 used to fast.936 And they come and say unto Him,\nWhy do the disciples of John and the Pharisees937 fast, but thy disciples fast not?”938 The\nonly semblance of a discrepancy that can be found here, is in the possibility of supposing\nthat the mention of the Pharisees as having spoken along with the disciples of John is an\naddition of Mark’s, while Matthew states only that the disciples of John expressed themselves\nto the above effect. But the words which were actually uttered by the parties, according to\nMark’s version, rather indicate that the speakers and the persons spoken of were not the\nsame individuals. I mean, that the persons who came to Jesus were the guests who were then\npresent, that they came because the disciples of John and the Pharisees were fasting, and\nthat they uttered the above words with respect to these parties. In this way, the evangelist’s\nphrase, “they come,” would not refer to the persons regarding whom he had just thrown in\nthe remark, “And the disciples of John and the Pharisees were fasting.” But the case would\nbe, that as those parties were fasting, some others here, who are moved by that fact, come\nto Him, and put this question to Him, “Why do the dis", "lang": "latin", "orig": ""}, {"v": 14, "f": "Augustine of Hippo", "w": "", "t": "(ubi sup.) Though Matthew mentions only the disciples of John as having made this enquiry, the words of Mark rather seem to imply that some other persons spoke of others, that is, the guests spoke concerning the disciples of John and the Pharisees—this is still more evident from Luke; why then does Matthew here say, Then came unto him the disciples of John, (Luck 5:33.) unless that they were there among other guests, all of whom with one consent put this objection to Him?", "lang": "english", "orig": ""}, {"v": 14, "f": "Glossa Ordinaria", "w": "", "t": "(ap. Anselm.) When He had replied to them respecting eating and converse with sinners, they next assault Him on the matter of food; Then came to him the disciples of John, saying, Why do we and the Pharisees fast often, but thy disciples fast not?", "lang": "english", "orig": ""}, {"v": 14, "f": "Hilary of Poitiers", "w": "", "t": "The Pharisees and John’s disciples were fasting, and the apostles were not. But Jesus answered them in a spiritual way and indicated to John’s disciples that he was a bridegroom. John taught that all hope in life lay in Christ. While he was still preaching, however, his disciples could not be received by the Lord. Up until the time of John, the law and the prophets prevailed, and unless the law came to an end, none of them would subscribe to faith in the gospel. The fact that he said there was no need for his disciples to fast as long as the bridegroom is with them illustrates the joy of his presence and the sacrament of the holy food, which no one need be without while he is present, that is, bearing Christ in the light of the mind. But once he is gone, Jesus says that they will fast, for all those who do not believe that Christ has risen will not have the food of life. By faith in the resurrection, the sacrament of the heavenly bread is received. Whoever is without Christ will be forsaken, fasting from the food of life.", "lang": "english", "orig": ""}, {"v": 14, "f": "Jerome", "w": "", "t": "(Verse 14) Then the disciples of John came to him, saying: Why do we and the Pharisees fast often, but your disciples do not fast? Proud question, and full of the arrogance of the Pharisees. Certainly, to say nothing else, the boasting of fasting should be reprehended. And the disciples of John could not be blameless, who were slandering him, whom they knew had been proclaimed by their master's words, and were joining themselves to the Pharisees, whom they knew had been condemned by John, saying: O generation of vipers, who has shown you to flee from the coming wrath?", "lang": "english", "orig": ""}, {"v": 14, "f": "Jerome", "w": "", "t": "O boastful enquiry and ostentation of fasting much to be blamed, nor can John's disciples be excused for their taking part with the Pharisees who they knew had been condemned by John, and for bringing a false accusation against Him whom they knew their master had preached.", "lang": "english", "orig": ""}, {"v": 14, "f": "John Chrysostom", "w": "", "t": "He then having stopped their mouths every way, as well from the Scriptures as from the natural consequence of things; and they having nothing to say, proved as they were obnoxious to the charges which they had brought against Him, and adversaries of the law and the Old Testament; they leave Him, and again transfer their accusation to the disciples.\n\nAnd Luke indeed affirms that the Pharisees said it, but this evangelist, that it was the disciples of John; but it is likely that both said it. That is, they being, as might be expected, in utter perplexity, take the other sort with them; as they did afterwards with the Herodians likewise. Since in truth John's disciples were always disposed to be jealous of Him, and reasoned against Him: being then only humbled, when first John abode in the prison. They came at least then, \"and told Jesus;\" but afterwards they returned to their former envy.\n\nNow what say they? \"Why do we and the Pharisees fast oft, but thy disciples fast not?\"\n\nThis is the disease, which Christ long before was eradicating, in the words, \"When thou fastest, anoint thy head, and wash thy face;\" foreknowing the evils that spring therefrom. But yet He doth not rebuke even these, nor say, \"O ye vainglorious and over-busy;\" but He discourses to them with all gentleness.", "lang": "english", "orig": ""}, {"v": 14, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Now what say they? Why do we and the Pharisees fast oft, but your disciples fast not? Matthew 9:14", "lang": "", "orig": ""}, {"v": 14, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Now their meaning is like this; Granted, say they, You do this as a physician; why do Your disciples also leave fasting, and cleave to such tables? Then, to make the accusation heavier, they put themselves first, and then the Pharisees; wishing by the comparison to aggravate the charge. For indeed both we, it is said, and the Pharisees, fast oft. And in truth they did fast, the one having learned it from John, the other  from the law; even as also the Pharisee said, I fast twice in the week. Luke 18:12", "lang": "", "orig": ""}, {"v": 14, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And Luke indeed affirms that the Pharisees said it, but this evangelist, that it was the disciples of John; but it is likely that both said it. That is, they being, as might be expected, in utter perplexity, take the other sort with them; as they did afterwards with the Herodians likewise. Since in truth John's disciples were always disposed to be jealous of Him, and reasoned against Him: being then only humbled, when first John abode in the prison. They came at least then, and told Jesus; but afterwards they returned to their former envy.", "lang": "", "orig": ""}, {"v": 14, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "What then do the Pharisees? When they saw it, it is said, they said to Him, Behold, Your disciples do that which is not lawful to do upon the Sabbath day. Matthew 12:2", "lang": "", "orig": ""}, {"v": 14, "f": "Peter Chrysologus", "w": "", "t": "What did John’s disciples have in common with the Pharisees if not a bond of ill will uniting those whom discipline had separated? In this case jealousy loses its bearings: Accustomed to separating people, it united them. The Jews were not disposed to esteem Moses less than the Lord, and John’s disciples were by no means willing to prefer Christ to John. Thus they grumbled in common spite against Christ. “Why do we and the Pharisees often fast, whereas your disciples do not fast?” Why? Because with you, fasting is a matter of the law and not of the will. Fasting does not reflect the one who fasts but the one who orders the fast. And what is the fruit of fasting to you who fast unwillingly?", "lang": "english", "orig": ""}, {"v": 14, "f": "Rabanus Maurus", "w": "", "t": "For John drank neither wine, nor strong drink, increasing his merit by abstinence, because he had no power over nature. But the Lord who has power to forgive sins, why should He shun sinners that eat, since He has power to make them more righteous than those that eat not? Yet doth Christ fast, that you should not avoid the command; but He eats with sinners that you may know His grace and power.", "lang": "english", "orig": ""}, {"v": 14, "f": "Tertullian", "w": "", "t": "At all events, in the Gospel they think that those days were definitely appointed for fasts in which \"the Bridegroom was taken away; \" and that these are now the only legitimate days for Christian fasts, the legal and prophetical antiquities having been abolished: for wherever it suits their wishes, they recognise what is the meaning of\" the Law and the prophets until John.", "lang": "english", "orig": ""}, {"v": 14, "f": "Theophylact of Ohrid", "w": "", "t": "\"Then came to Him the disciples of John, saying, Why do we and the Pharisees fast often, but Thy disciples fast not?\" John's disciples were envious of Christ's fame and so accused Him of not fasting. And perhaps they were wondering how He conquered the passions without ascetic struggle, something which John could not do. For they did not understand that while John, a mere man, was righteous because of his virtues, Christ is Virtue, as He is God.", "lang": "english", "orig": ""}, {"v": 14, "f": "Thomas Aquinas", "w": "", "t": "Here arises a question about banqueting, followed by the answer. But then there is the textual question as to why it seems from Mark (2:18) and Luke (5:29) that the question was proposed by others; for it says in Mark (2:18): \"Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?\" Therefore, the disciples did not put the question. Augustine answers that the Pharisees lay in wait for Christ; hence they sometimes drew the Herodians with them. But on this occasion they took John's disciples. Hence he could be asked both by others and by the disciples. But why did they fast? The answer is that it was due to their traditions or to the Law; as, for example, on the day of propitiation they were bound to fast: \"The fast of the fourth month, and the fast of the fifth, and the fast of the seventh, and the fast of the tenth, shall be to the house of Judah seasons of joy and gladness, and cheerful feasts\" (Zech 8:18). Likewise, John's disciples fasted because of the example of their master, who was a man of great austerity; but Christ's disciples did not fast.", "lang": "english", "orig": ""}, {"v": 14, "f": "npnf211", "w": "CHAPTER XVIII.", "t": "Wherefore as we have premised this on the conditions of fasting, it seems well to subjoin\nthe authority of Holy Scripture, by which it will be more clearly proved that fasting neither\ncan nor should be always observed. In the Gospel when the Pharisees were fasting together\nwith the disciples of John the Baptist, as the Apostles, as friends and companions of the\nheavenly Bridegroom, were not yet keeping the observance of a fast, the disciples of John\n(who thought that they acquired perfect righteousness by their fasts, as they were followers\nof that grand preacher of repentance who afforded a pattern to all the people by his own\nexample, as he not only refused the different kinds of food which are supplied for man’s\nuse, but actually altogether did without eating the bread which is common to all) complained\nto the Lord and said: “Why do we and the Pharisees fast oft but thy disciples fast not?” to\nwhom the Lord in His reply plainly showed that fasting is not suitable or necessary at all\ntimes, when any festival season or opportunity for love intervenes and permits an indulgence\nin food, saying: “Can the children of the bridegroom mourn while the bridegroom is with\nthem? But the days will come when the bridegroom shall be taken away from them; and\nthen shall they fast;”123 words which although they were spoken before the resurrection of\nHis Body, yet specially point to the season of Eastertide, in which after His resurrection for\nforty days He ate with His disciples, and their ", "lang": "greek", "orig": ""}, {"v": 15, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "9. What is, delay not? Because many men say, it is a long time till Christ comes. What then: because we say, delay not, will He come before He has determined to come? What means this prayer, delay not? May not Your coming seem to me to be too long delayed. For to you it seems a long time, to God it seems not long, to whom a thousand years are one day, or the three hours of a watch. But if you shall not have had endurance, late for you it will be: and when to you it shall be late, you will be diverted from Him, and will be like those that were wearied in the desert, and hastened to ask of God the pleasant things which He was reserving for them in the Land; and when there were not given on their journey the pleasant things, whereby perchance they would have been corrupted, they murmured against God, and went back in heart unto Egypt:  to that place whence in body they had been severed, in heart they went back. Do not thou, then, so, do not so: fear the word of the Lord, saying, Remember Lot's wife. Luke 17:32 She too being on the way, but now delivered from the Sodomites, looked back; in the place where she looked back, there she remained: she became a statue of salt, in order to season you. For to you she has been given for an example, in order that you may have sense, may not stop infatuated on the way. Observe her stopping and pass on: observe her looking back, and do thou be reaching forth unto the things before, as Paul was. Philippians 3:13 What is it, not to look back.", "lang": "", "orig": ""}, {"v": 15, "f": "Augustine - City of God", "w": "Tractate LXXV.", "t": "shall live also:” because He\n1334 Ps. x. 14.\n1335 Matt. ix. 15.\n\n\nliveth, therefore shall we live also. For as by man is death, by man also is the resurrection\nof the dead. For as in Adam all die, even so in Christ shall all be made alive.1336 As it is only\nthro", "lang": "latin", "orig": ""}, {"v": 15, "f": "Augustine - Confessions", "w": "Chapter XXVII.—Of the Feast at Which It Was Objected at Once that Christ Ate\nwith Sinners, and that His Disciples Did Not Fast; Of the Circumstance that the\nEvangelists Seem to Give Different Accounts of the Parties by Whom These\nObjections Were Alleged; And of the Question Whether Matthew and Mark and\nLuke are Also in Harmony with Each Other in the Reports Given of the Words\nof These Persons, and of the Replies Returned by the Lord.", "t": "63. Once more, we find that Matthew and Mark have given similar accounts of what\nwas said about the children of the bridegroom not fasting as long as the bridegroom is with\nthem, with this exception, that Mark has named them the children of the bridals,940 while\nMatthew has designated them the children of the bridegroom.941 That, however, is a matter\nof no moment. For by the children of the bridals we understand at once those connected\nwith the bridegroom, and those connected with the bride. The sense, therefore, is obvious\nand identical, and neither different nor contradictory. Luke, again, does not say, “Can the\nchildren of the bridegroom fast?” but, “Can ye make the children of the bridegroom fast,\nwhile the bridegroom is with them?” By expressing it in this method, the evangelist has elegantly\nopened up the self-same sense in a way calculated to suggest something else. For\nthus the idea is conveyed, that those very persons who were speaking would try to make the\nchildren of the bridegroom mourn and fast, inasmuch as they would [seek to] put the\nbridegroom to death. Moreover, Matthew’s phrase, “mourn,” is of the same import as that\nused by Mark and Luke, namely, “fast.” For Matthew also says further on, “Then shall they\nfast,” and not, “Then shall they mourn.” But by the use of this phrase, he has indicated that\nthe Lord spoke of that kind of fasting which pertains to the lowliness of tribulation. In the\nsame way, too, the Lord may be understood to have pictured out a diff", "lang": "latin", "orig": ""}, {"v": 15, "f": "Augustine - Trinity", "w": "Psalm XLII.1221", "t": "d just as did the others; by thus supporting\n1228 Matt. ix. 15. Filii sponsi, Lat.\n1229 [See p. 67, supra.—C.]\n\n\nwhat is burdensome, each in turn, they both accomplish their journey, and do not abandon\neach other. Are they not a kind of “harts” that the Apostle", "lang": "latin", "orig": ""}, {"v": 15, "f": "Augustine of Hippo", "w": "", "t": "(Serm. 210. 3.) Otherwise; Every one who rightly fasts, either humbles his soul in the groaning of prayer, and bodily chastisement, or suspends the motion of carnal desire by the joys of spiritual meditation. And the Lord here makes answer respecting both kinds of fasting; concerning the first, which is in humiliation of soul, He says, The children of the bridegroom cannot mourn. Of the other which has a feast of the Spirit, He next speaks, where He says, No man putteth a patch of undressed cloth. Then we must mourn because the Bridegroom is taken away from us. And we rightly mourn if we burn with desire of Him. Blessed they to whom it was granted before His passion to have Him present with them, to enquire of Him what they would, to hear what they ought to hear. Those days the fathers before His coming sought to see, and saw them not, because they were placed in another dispensation, one in which He was proclaimed as coming, not one in which He was heard as present. For in us was fulfilled that He speaks of, The days shall come when ye shall desire to see one of these days, and shall not be able. (Luke 17:22.) Who then will not mourn this? Who will not say, My tears have been my meat day and night, while they daily say unto me, Where is now thy God? (Ps. 42:3.) With reason then did the Apostle seek to die and to be with Christ.\n\n(De Cons. Ev. ii. 27.) That Matthew writes here mourn, where Mark and Luke write fast, shows that the Lord spake of that kind of fasting which perta", "lang": "english", "orig": ""}, {"v": 15, "f": "Eusebius - Church History", "w": "Chap. IV.", "t": "ity and faith a religious service. Moreover,\n1576 Matt. ix. 15.\n1577 Luke xviii. 11, 12.\n\n\nafter all, the Scripture does not say that the Pharisee was condemned, but only that the\npublican was “justified rather than the other.”", "lang": "greek", "orig": ""}, {"v": 15, "f": "Gregory of Nyssa", "w": "Chapter 15.—The Teaching of the Apostle on This Subject.", "t": "Accordingly the apostle also, speaking apparently with this passage in view, declares:\n“But this I say, brethren, the time is short: it remaineth, that both they that have wives be\nas though they had them not; and they that weep, as though they wept not; and they that\nrejoice, as though they rejoiced not; and they that buy, as though they possessed not; and\nthey that use this world, as though they used it not: for the fashion of this world passeth\naway. But I would have you without solicitude.”2111 This entire passage (that I may express\nmy view on this subject in the shape of a brief exposition of the apostle’s words) I think\nmust be understood as follows: “This I say, brethren, the time is short.” No longer is God’s\npeople to be propagated by carnal generation; but, henceforth, it is to be gathered out by\nspiritual regeneration. “It remaineth, therefore, that they that have wives” be not subject to\ncarnal concupiscence; “and they that weep,” under the sadness of present evil, should rejoice\nin the hope of future blessing; “and they that rejoice,” over any temporary advantage, should\nfear the eternal judgment; “and they that buy,” should so hold their possessions as not to\ncleave to them by overmuch love; “and they that use this world” should reflect that it is\npassing away, and does not remain. “For the fashion of this world passeth away: but,” he\nsays, “I would have you to be without solicitude,”—in other words: I would have you lift up\nyour heart, that it may dwell among ", "lang": "greek", "orig": ""}, {"v": 15, "f": "Hilary of Poitiers", "w": "", "t": "Figuratively; This His answer, that while the Bridegroom was present with them, His disciples needed not to fast, teaches us the joy of His presence, and the sacrament of the holy food, which none shall lack, while He is present, that is, while one keeps Christ in the eye of the mind. He says, they shall fast when He is taken away from them, because all who do not believe that Christ is risen, shall not have the food of life. For in the faith of the resurrection the sacrament of the heavenly bread is received.", "lang": "english", "orig": ""}, {"v": 15, "f": "Jerome", "w": "", "t": "(Verse 15.) And Jesus said to them: Can the wedding guests mourn as long as the bridegroom is with them? The days will come when the bridegroom will be taken away from them, and then they will fast. Christ is the bridegroom: the Church is the bride. From this holy and spiritual union, the Apostles are born, who cannot mourn as long as they see the bride in the bridal chamber and know that the bridegroom is with the bride. But when the wedding is over and the time of his passion and resurrection has come, then the sons of the bridegroom will fast. Some believe that after forty days of the Passion, fasting should be observed: although the immediate arrival of Pentecost and the Holy Spirit indicate the celebration to us. And on this occasion, Montanus, Prisca, and Maximilla also observe Lent after Pentecost: because, with the bridegroom taken away, the children of the bridegroom should fast. However, the custom of the Church comes from the passion of the Lord and the resurrection through the humility of the flesh, so that we may be prepared for the spiritual nourishment of the body through the fasting of the flesh. According to the tropology, it must be known that as long as the bridegroom is with us and we are in joy, we cannot fast or mourn. But when he departs from us because of our sins, then fasting must be announced, then mourning must be undertaken.", "lang": "english", "orig": ""}, {"v": 15, "f": "Jerome", "w": "", "t": "Christ is the Bridegroom and the Church the Bride. Of this spiritual union the Apostles were born; they cannot mourn so long as they see the Bridegroom in the chamber with the Bride. But when the nuptials are past, and the time of passion and resurrection is come, then shall the children of the Bridegroom fast. The days shall come when the bridegroom shall be taken from them, and then shall they fast.\n\nHence some think that a fast ought to follow the forty days of Passion, although the day of Pentecost and the coming of the Holy Spirit immediately bring back our joy and festival. From this text accordingly, Montanus, Prisca, and Maximilla enjoin a forty days' abstinence after Pentecost, but it is the use of the Church to come to the Lord's passion and resurrection through humiliation of the flesh, that by carnal abstinence we may better be prepared for spiritual fulness.\n\nOr; When He has departed from us for our sins, then is a fast to be proclaimed, then is mourning to be put on.", "lang": "english", "orig": ""}, {"v": 15, "f": "John Chrysostom", "w": "", "t": "\"The children of the bride-chamber cannot fast, as long as the bridegroom is with them.\" Thus, when others were to be spoken for, the publicans I mean, to soothe their wounded soul, He was more severe in His reproof of their revilers; but when they were deriding Himself and His disciples, He makes His reply with all gentleness.\n\nNow their meaning is like this; \"Granted,\" say they, \"Thou doest this as a physician; why do Thy disciples also leave fasting, and cleave to such tables?\" Then, to make the accusation heavier, they put themselves first, and then the Pharisees; wishing by the comparison to aggravate the charge. For indeed \"both we,\" it is said, \"and the Pharisees, fast oft.\" And in truth they did fast, the one having learnt it from John, the other from the law; even as also the Pharisee said, \"I fast twice in the week.\"\n\nWhat then saith Jesus? \"Can the children of the bridechamber fast, while the bridegroom is with them.\" Before, He called Himself a physician, but here a bridegroom; by these names revealing His unspeakable mysteries. Yet of course He might have told them, more sharply, \"These things depend not on you, that you should make such laws. For of what use is fasting, when the mind is full of wickedness; when ye blame others, when ye condemn them, bearing about beams in your eyes, and do all for display? Nay, before all this ye ought to have cast out vainglory, to be proficients in all the other duties, in charity, meekness, brotherly love.\" However, nothing o", "lang": "english", "orig": ""}, {"v": 15, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Days will come, when the bridegroom shall be taken from them, and then shall they fast. Matthew 9:15", "lang": "", "orig": ""}, {"v": 15, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "What then says Jesus? Can the children of the bridechamber fast, while the bridegroom is with them. Before, He called Himself a physician, but here a bridegroom; by these names revealing His unspeakable mysteries. Yet of course He might have told them, more sharply, These things depend not on you, that you should make such laws. For of what use is fasting, when the mind is full of wickedness; when you blame others, when you condemn them, bearing about beams in your eyes, and do all for display? Nay, before all this ye ought to have cast out vainglory, to be proficients in all the other duties, in charity, meekness, brotherly love. However, nothing of this kind does He say, but with all gentleness, The children of the bridechamber cannot fast, so long as the bridegroom is with them; recalling to their mind John's words, when he said, He that has the bride, is the bridegroom, but the friend of the bridegroom, which stands and hears Him, rejoices greatly because of the bridegroom's voice. John 3:29", "lang": "", "orig": ""}, {"v": 15, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "This is the disease, which Christ long before was eradicating, in the words, When you fast, anoint your head, and wash your face; Matthew 6:17 foreknowing the evils that spring therefrom. But yet He does not rebuke even these, nor say, O you vainglorious and over-busy; but He discourses to them with all gentleness, saying, The children of the bride-chamber cannot fast, as long as the bridegroom is with them.  Thus, when others were to be spoken for, the publicans I mean, to soothe their wounded soul, He was more severe in His reproof of their revilers; but when they were deriding Himself and His disciples, He makes His reply with all gentleness.", "lang": "", "orig": ""}, {"v": 15, "f": "Severus of Antioch", "w": "", "t": "When John’s disciples approached … they questioned him even while he was at table, in the manner of a physician with the publicans: “Why do we and the Pharisees often fast, whereas your disciples do not fast?” Do you see how the same jealousy motivates and provokes birds of a feather and is made keen by the cruel goad of envy? On the one hand, it set the Pharisees, who boasted about being teachers, against the Teacher. For that reason they also said, “Why does your teacher eat with tax collectors and sinners?” On the other hand, envy set John’s disciples against Christ’s disciples. That is why they also said, “How come your disciples do not fast?”", "lang": "english", "orig": ""}, {"v": 15, "f": "Severus of Antioch", "w": "", "t": "It is with the words of John, your own teacher, whom you esteem so highly, that I answer you. Keep it in mind, and you will have the answer to your question. When John bore witness concerning me, he said, “He who has the bride is the bridegroom.” So, if I am the bridegroom and you don’t make a liar out of your own teacher, you know in advance that it is important for my disciples, while they are the children of the marriage … to be gay and joyful and not to become upset or miserable over fasting. In certain respects, fasting is a source of annoyance and can also be arduous for those without a mature disposition.", "lang": "english", "orig": ""}, {"v": 15, "f": "Tertullian (cont)", "w": "Elucidations.", "t": "“Are we not carnal” (psychics) in our days? May not the very excesses of Tertullian\nsting and reproach us with the charge of excessive indulgence (Matt. ix. 15)? The “over-fed\nChristians” whom he here reproaches are proved by this very treatise to have observed a\nsystem of fasting which is little practised anywhere in our times—for a mere change to luxurious\nfish-diet is the very mockery of fasting. We learn that the customary fasts of these\npsychics were as follows: (1) the annual Paschal fast,1128 from Friday till Easter-Day; (2)\nWednesdays and Fridays (stationary days1129) every week; and (3) the “dry-food\ndays,”1130—abstinence from “pleasant bread” (Dan. x. 2),—though some Catholics objected\nto these voluntary abstinences.", "lang": "latin", "orig": ""}, {"v": 15, "f": "Tertullian (cont)", "w": "Elucidations.", "t": "roach us with the charge of excessive indulgence (Matt. ix. 15)? The “over-fed\nChristians” whom he here reproaches are proved by this very treatise to have observed a\nsystem of fasting which is little practised anywhere in our times—for a mere change to luxuriou", "lang": "latin", "orig": ""}, {"v": 15, "f": "Theodoret of Cyrrhus", "w": "Quaestiones in Numeros", "t": "Eustathius appointed the Lord's day as a fast, whereas, because Christ rose from the grave and delivered human nature from sin on that day, we should spend it in offering joyous thanks to God. But fasting carries with it the idea of grief and sorrow. For this reason those who fast on Sunday are subjected to the punishment of anathema.", "lang": "", "orig": ""}, {"v": 15, "f": "Theophylact of Ohrid", "w": "", "t": "\"And Jesus said unto them, Can the sons of the bridechamber mourn, as long as the bridegroom is with them? But the days will come, when the bridegroom shall be taken from them, and then shall they fast.\" \"Now is the time for rejoicing as long as I am with My disciples,\" Jesus says. He calls Himself the bridegroom, as One Who betroths to Himself the new congregation, the old having died. The \"sons of the bridechamber\" [i.e. the wedding guests] are the apostles. Jesus says, \"After I have suffered and ascended, the time will come for them to fast with great hunger and thirst and to be persecuted.\" To show that His disciples are not yet perfected, He adds:", "lang": "english", "orig": ""}, {"v": 15, "f": "Thomas Aquinas", "w": "", "t": "And Jesus said to them... Here Jesus answers in a subtle way: first, he assigns a cause on his part; secondly, on the part of the disciples (v. 16).\n\nIn regard to the first he does two things: first, he determines the time for feasting; secondly, of fasting (v. 15b).\n\nHe says, therefore: Can the wedding guests [children of the bridegroom] mourn, as long as the bridegroom is with them? Where he says mourn, another says \"fast\"; for although a fast involves some joy, yet as it says in Hebrews (12:11): \"For the moment all discipline seems painful rather than pleasant.\" Hence there is a fast of spiritual joy, as it says in Daniel (9:3): \"Then I turned my face to the Lord, seeking him by prayer and fasting and sackcloth and ashes.\" Likewise, it is mournful and afflictive, as when it involves pain.\n\nThe Lord answers concerning both. For the bridegroom is Christ; the one who has the bride is the bridegroom. For he is the bridegroom of the entire Church and is its source. The Old Law has one source; the New, another. For the Old Law had its beginning in fear; the New, in love: \"You did not receive the spirit of slavery to fall back into fear, but you have received the spirit of sonship\" (Rom 8:13); \"You have come to Mount Zion, and to the city of the living God, the heavenly Jerusalem\" (Heb 12:22). The origin of the New Law was in love; consequently, he should nourish his disciples in love. Hence he calls himself a bridegroom and the disciples children, because they exist in the name ", "lang": "english", "orig": ""}, {"v": 15, "f": "npnf214", "w": "Canon XVIII.", "t": "By many canons we are warned against fasting or grieving on the festal and joyous\nLord’s day, in remembrance of the resurrection of the Lord; but that we should celebrate it\nand offer thanks to God, that we be raised from the fall of sin. But this canon smites the\nEustathians with anathema because they taught that the Lord’s days should be fasted.\nCanon LXIV. of the Apostolic Canons cuts off such of the laity as shall so fast, and deposes\nsuch of the clergy. See also Canon LV. of the Council in Trullo.", "lang": "greek", "orig": ""}, {"v": 15, "f": "npnf214", "w": "Canon XVIII.", "t": "Eustathius appointed the Lord’s day as a fast, whereas, because Christ rose from the\ngrave and delivered human nature from sin on that day, we should spend it in offering joyous\nthanks to God. But fasting carries with it the idea of grief and sorrow. For this reason those\nwho fast on Sunday are subjected to the punishment of anathema.", "lang": "greek", "orig": ""}, {"v": 15, "f": "npnf214", "w": "Canon LIII.", "t": "This canon does not call for explanation but for reflexion, and greatly it is to be desired\nthat it should be observed by Christians, and that through like improprieties, wedding-days,\nwhich should be days of holy joy and blessing, be not turned, even to the bride and groom\nthemselves, into days of cursing. Moreover the Synod of Trent admonishes bishops (Sess.\nxxiv., De Reform. Mat., cap. x.) to take care that at weddings there be only that which is\nmodest and proper.", "lang": "greek", "orig": ""}, {"v": 16, "f": "Athanasius - Select Works", "w": "Book VIII.", "t": "an for dissuading Him from suffering, because\n370 Matt. ix. 16.\n371 Gal. iv. 9.\n372 1 Cor. x. 11.\n373 Matt. xiii. 52.\n\n\nhe understood not the things of God, but the things of men.374 The fleshly character", "lang": "greek", "orig": ""}, {"v": 16, "f": "Glossa Ordinaria", "w": "", "t": "(ap. Anselm.) As much as to say, An undressed patch, that is, a new one, ought not to be put into an old garment, because it often takes away from the garment its wholeness, that is, its perfection, and then the rent is made worse. For a heavy burden laid on one that is untrained often destroys that good which was in him before.", "lang": "english", "orig": ""}, {"v": 16, "f": "Hilary of Poitiers", "w": "", "t": "By these examples He shows that neither our souls nor bodies, being so weakened by inveteracy of sin, are capable of the sacraments of the new grace.", "lang": "english", "orig": ""}, {"v": 16, "f": "Jerome", "w": "", "t": "(V. 16, 17) However, no one puts a patch of unshrunk cloth on an old garment. For the patch pulls away from the garment, and a worse tear is made. Nor do people put new wine into old wineskins; otherwise the wineskins burst, the wine is spilled, and the wineskins are ruined. But they put new wine into fresh wineskins, and both are preserved. These words were spoken by him to them. What he means is this: Until someone is born again and the old self is removed through my suffering, and he puts on a new self, he cannot bear the stricter commands of fasting and continence, lest through excessive severity he lose even the faith that he seems to possess now. But he set forth two examples, both of the old and the new, and of clothing. By the old wineskins we must understand the scribes and Pharisees. The new patch of clothing and the new wine represent the teachings of the Gospel, which the Jews cannot bear, lest a greater tear be made. The Galatians also desired to do something similar, mixing the precepts of the Gospel with the precepts of the Law, and putting the new wine into old wineskins; but the Apostle speaks to them, saying: O foolish Galatians! Who has bewitched you into not obeying the truth? (Gal. III, 1) Therefore, the word of the Gospel should be infused into the apostles rather than the Scribes and Pharisees, who were corrupted by the traditions of the elders and could not keep the sincerity of Christ's teachings. For there is a difference between the purity of a virg", "lang": "english", "orig": ""}, {"v": 16, "f": "Jerome", "w": "", "t": "Otherwise; By the old garment, and old skins, we must understand the Scribes and Pharisees; and by the piece of new cloth, and new wine, the Gospel precepts, which the Jews were not able to bear; so the rent was made worse. Something such the Galatians sought to do, to mix the precepts of the Law with the Gospel, and to put new wine into old skins. The word of the Gospel is therefore to be poured into the Apostles, rather than into the Scribes and Pharisees, who, corrupted by the traditions of the elders, were unable to preserve the purity of Christ's precepts.", "lang": "english", "orig": ""}, {"v": 16, "f": "John Chrysostom", "w": "", "t": "Then what He had done before, this He doth here again. I mean, that as He, when they were attempting to prove Him blameable for eating with sinners, proved to them on the contrary, that His proceeding was not only no blame, but an absolute praise to Him: so here too, when they wanted to show of Him, that He knows not how to manage His disciples, He signifies that such language was the part of men not knowing how to manage their inferences, but finding fault at random.\n\n\"For no man,\" saith He, \"putteth a piece of new cloth unto an old garment.\"\n\nHe is again establishing His argument by illustrations from common life. And what He saith is like this, \"The disciples have not yet become strong, but still need much condescension. They have not yet been renewed by the Spirit, and on persons in that state one ought not to lay any burden of injunctions.\"\n\nAnd these things He said, setting laws and rules for His own disciples, that when they should have to receive as disciples those of all sorts that should come from the whole world, they might deal with them very gently.", "lang": "english", "orig": ""}, {"v": 16, "f": "Peter Chrysologus", "w": "", "t": "He says that the fabric of the old law was worn away by Judaic zealousness, corrupted by the senses, split apart by factions and worn out by impure actions. The shrunk cloth of the gospel he calls a garment. But make note of the cloth, not simply the tear but the beginning of the weave. First of all, the fabric of Christ’s royal garment was woven out of wool that came from a lamb: “The Lamb of God who takes away the sins of the world.” The royal vestment was a woven vestment, which the blood of his passion tinged with purple splendor.", "lang": "english", "orig": ""}, {"v": 16, "f": "Rabanus Maurus", "w": "", "t": "The different comparisons all refer to the same thing, and yet are they differe

nt; the garment by which we are covered abroad signifies our good works, which we perform when we are abroad; the wine with which we are refreshed within is the fervor of faith and charity, which creates us anew within.", "lang": "english", "orig": ""}, {"v": 16, "f": "Remigius of Rheims", "w": "", "t": "By the old garment He means His disciples, who had not yet been renewed in all things. The patch of undressed, that is, of new cloth, means the new grace, that is, the Gospel doctrine, of which fasting is a portion; and it was not meet that the stricter ordinances of fasting should be entrusted to them, lest they should be broken down by their severity, and forfeit that faith which they had; as He adds, It taketh its wholeness from the garment, and the rent is made worse.", "lang": "english", "orig": ""}, {"v": 16, "f": "Tertullian", "w": "Chapter I.—General Introduction.8760", "t": "The Spirit of God, and the Word of God, and the Reason of God—Word of Reason,\nand Reason and Spirit of Word—Jesus Christ our Lord, namely, who is both the one and\nthe other,8761—has determined for us, the disciples of the New Testament, a new form of\nprayer; for in this particular also it was needful that new wine should be laid up in new skins,\nand a new breadth be sewn to a new garment.8762 Besides, whatever had been in bygone\ndays, has either been quite changed, as circumcision; or else supplemented, as the rest of\nthe Law; or else fulfilled, as Prophecy; or else perfected, as faith itself. For the new grace of\nGod has renewed all things from carnal unto spiritual, by superinducing the Gospel, the\nobliterator of the whole ancient bygone system; in which our Lord Jesus Christ has been\napproved as the Spirit of God, and the Word of God, and the Reason of God: the Spirit, by\nwhich He was mighty; the Word, by which He taught; the Reason, by which He came.8763\nSo the prayer composed by Christ has been composed of three parts. In speech,8764 by which\nprayer is enunciated, in spirit, by which alone it prevails, even John had taught his disciples\nto pray,8765 but all John’s doings were laid as groundwork for Christ, until, when “He had\n8760 [After the discipline of Repentance and of Baptism the Laws of Christian Living come into view. Hence\nthis is the logical place for this treatise. See the Prolegomena of Muratori and learned annotations, in Routh,\nOpuscula I. p. 173, et sqq. We", "lang": "latin", "orig": ""}, {"v": 16, "f": "Tertullian", "w": "", "t": "How is it, again, that he tells us that \"a piece of new cloth is not sewed on to an old garment,\" or that \"new wine is not trusted to old bottles,\" when he is himself patched and clad in an old suit of names? How is it he has rent off the gospel from the law, when he is wholly invested with the law,-in the name, forsooth, of Christ? What hindered his calling himself by some other name, seeing that he preached another (gospel), came from another source, and refused to take on him a real body, for the very purpose that he might not be supposed to be the Creator's Christ? Vain, however, was his unwillingness to seem to be He whose name he was willing to assume; since, even if he had been truly corporeal, he would more certainly escape being taken for the Christ of the Creator, if he had not taken on him His name.", "lang": "english", "orig": ""}, {"v": 16, "f": "Tertullian", "w": "", "t": "The Spirit of God, and the Word of God, and the Reason of God-Word of Reason, and Reason and Spirit of Word-Jesus Christ our Lord, namely, who is both the one and the other, -has determined for us, the disciples of the New Testament, a new form of prayer; for in this particular also it was needful that new wine should be laid up in new skins, and a new breadth be sewn to a new garment. Besides, whatever had been in bygone days, has either been quite changed, as circumcision; or else supplemented, as the rest of the Law; or else fulfilled, as Prophecy; or else perfected, as faith itself.", "lang": "english", "orig": ""}, {"v": 16, "f": "Theophylact of Ohrid", "w": "", "t": "\"No man putteth a piece of unshrunk cloth unto an old garment, for the patch teareth from the garment, and the rent is made worse. Neither do men put new wine into old wineskins: else the skins burst, and the wine runneth out, and the skins are destroyed: but they put new wine into fresh wineskins, and both are preserved.\" The disciples, He says, have not yet become strong, and therefore require forbearance. The heavy burden of commandments ought not to be laid upon them. Jesus also said these things to teach the disciples that later, when they would go out into all the world to make disciples, they too should use forbearance. The \"piece of unshrunk cloth\" means fasting, as does the \"new wine.\" The \"old garment\" and the \"old wineskins\" mean the weakness of the disciples.", "lang": "english", "orig": ""}, {"v": 16, "f": "Thomas Aquinas", "w": "", "t": "No one puts a piece of unshrunk cloth on an old garment. Here he presents the other argument, the one on the part of the disciples. He gives two examples; one is explained by Augustine and the other by Jerome. According to Augustine he means to say: While Christ is present, the disciples were not to fast on account of their condition, because heavy burdens should not be imposed on the imperfect. Therefore, since they are imperfect, they should not be commanded to fast. So in order to stress this he touches upon it in metaphors dealing with cloth and wine. Because righteousness consists in external works and in newness of affection, he gives two examples. He says, therefore, No one puts..., i.e., if he wanted to add the new cloth, he would not sew a piece of new cloth on the old garment, because it would take away from the beauty; so, if someone imperfect has certain customs in his life, and you impose a burden on him, he abandons what he is accustomed to and a worse tear is made, as is indicated below.", "lang": "english", "orig": ""}, {"v": 17, "f": "Glossa Ordinaria", "w": "", "t": "(non occ.) This shows that the Apostles being hereafter to be replenished with newness of grace, ought not now to be bound to the old observances.", "lang": "english", "orig": ""}, {"v": 17, "f": "Jerome", "w": "", "t": "What he is saying is this: Until a person has been reborn and, having put aside the old person, puts on the new person because of my passion, he cannot observe right fasting and the precepts of temperance. Otherwise, through undue austerity one may lose even the faith one seems to possess. Christ gave two examples: the garment and the old and new wineskins. The old ones denote the scribes and Pharisees. The patch of shrunk cloth and the new wine signify the gospel precepts, which the Jews cannot observe, else a worse tear is made.", "lang": "english", "orig": ""}, {"v": 17, "f": "John Chrysostom", "w": "", "t": "\"Neither do men put new wine into old bottles.\"\n\nSeest thou His illustrations, how like the Old Testament? the garment? the wine skins? For Jeremiah too calls the people \"a girdle,\" and makes mention again of \"bottles\" and of \"wine.\" Thus, the discourse being about gluttony and a table, He takes His illustrations from the same.\n\nBut Luke adds something more, that the new also is rent, if thou put it upon the old. Seest thou that so far from any advantage taking place, rather the mischief is increased?\n\nAnd while He speaks of the present, He foretells also the future; as that they shall hereafter be new but until that come to pass, nothing austere and grievous ought to be imposed on them. For he, saith Christ, that seeks to instill the high doctrines before the proper time, thenceforth not even when the time calls will he find them to his purpose, having once for all made them unprofitable. And this comes to pass not by any fault of the wine, nor of the deceivers, but from the unseasonable act of them that put it in.\n\nHereby He hath taught us also the cause of those lowly expressions, which He was continually using in discourse with them. That is, by reason of their infirmity He said many things very short of His proper dignity; which John also pointing out, relates Him to have said, \"I have many things to say unto you, but ye cannot bear them now.\" Here, that they might not suppose those things only to be which He had spoken, but might imagine to themselves others also, and f", "lang": "english", "orig": ""}, {"v": 17, "f": "Pseudo-Clementine Literature", "w": "Acts of Saint Philip the Apostle When He Went to Upper Hellas.", "t": "x. 10; Mark vi. 9.\n2186 Acts xvii. 21.\n2187 Comp. Matt. ix. 17, etc.\n2188 Eph. i. 21.\n2189 Or, preaching.\n\n\nknow who He was, and commanded us to preach all salvation through Him, because there\nis no other name named out of heaven than this.2190 On this account I", "lang": "greek", "orig": ""}, {"v": 17, "f": "Remigius of Rheims", "w": "", "t": "After two comparisons made, that of the wedding, and that of the undressed cloth, He adds a third concerning wine skins; Neither do men put new wine into old skins. By the old skins He means His disciples, who were not yet perfectly renewed. The new wine is the fulness of the Holy Spirit, and the depths of the heavenly mysteries, which His disciples could not then bear; but after the resurrection they became as new skins, and were filled with new wine when they received the Holy Spirit into their hearts. Whence also some said, These men are full of new wine. (Acts 2:13.)", "lang": "english", "orig": ""}, {"v": 17, "f": "Tertullian", "w": "Chapter I.—General Introduction.8760", "t": "The Spirit of God, and the Word of God, and the Reason of God—Word of Reason,\nand Reason and Spirit of Word—Jesus Christ our Lord, namely, who is both the one and\nthe other,8761—has determined for us, the disciples of the New Testament, a new form of\nprayer; for in this particular also it was needful that new wine should be laid up in new skins,\nand a new breadth be sewn to a new garment.8762 Besides, whatever had been in bygone\ndays, has either been quite changed, as circumcision; or else supplemented, as the rest of\nthe Law; or else fulfilled, as Prophecy; or else perfected, as faith itself. For the new grace of\nGod has renewed all things from carnal unto spiritual, by superinducing the Gospel, the\nobliterator of the whole ancient bygone system; in which our Lord Jesus Christ has been\napproved as the Spirit of God, and the Word of God, and the Reason of God: the Spirit, by\nwhich He was mighty; the Word, by which He taught; the Reason, by which He came.8763\nSo the prayer composed by Christ has been composed of three parts. In speech,8764 by which\nprayer is enunciated, in spirit, by which alone it prevails, even John had taught his disciples\nto pray,8765 but all John’s doings were laid as groundwork for Christ, until, when “He had\n8760 [After the discipline of Repentance and of Baptism the Laws of Christian Living come into view. Hence\nthis is the logical place for this treatise. See the Prolegomena of Muratori and learned annotations, in Routh,\nOpuscula I. p. 173, et sqq. We", "lang": "latin", "orig": ""}, {"v": 17, "f": "Thomas Aquinas", "w": "", "t": "Neither is new wine put into old wineskins. Here he presents the example about wine. As if to say: My disciples are like old wineskins. The new wine is the New Law by reason of newness; hence when they receive the Holy Spirit, they are said to be filled with new wine (Acts 2:13). Therefore, neither is new wine put into old wineskins; if it is, the skins burst. Hence if you impose a new manner of life on an old man who has certain ways of acting, his heart bursts, because he cannot stand it. Likewise, the wine is expelled, i.e., is not preserved, and the skins are destroyed; because they violate God's commands and, therefore, perish. But new wine is put into fresh wineskins, renewing spiritual teaching by love as the Apostle says (1 Cor 2:13): \"Interpreting spiritual truths to the spiritual,\" and Proverbs (2:10): \"For wisdom will come into your heart, and knowledge will be pleasant to your soul; discretion will watch over you; understanding will guard you, delivering you from the way of evil and from men of perverted speech.\"\n\nJerome explains it another way: For he calls the Pharisaic sect the old garment, the followers of the gospel the new. As if to say: It is not good to preserve old teachings, because that would make old tears; and so they could not accept the new teaching as we see that one more easily clings to his own doctrine, if he is not imbued with a contrary doctrine, than if he is imbued. Therefore, it is not good for them to be imbued with your Pharisaic doctrine", "lang": "english", "orig": ""}, {"v": 18, "f": "Augustine - Confessions", "w": "Chapter XXVIII.—Of the Raising of the Daughter of the Ruler of the Synagogue,\nand of the Woman Who Touched the Hem of His Garment; Of the Question,\nAlso, as to Whether the Order in Which These Incidents are Narrated Exhibits\nAny Contradiction in Any of the Writers by Whom They are Reported; And in\nParticular, of the Words in Which the Ruler of the Synagogue Addressed His\nRequest to the Lord.", "t": "66. At the same time, however, there remains the fact that Matthew represents the ruler\nof the synagogue to have spoken to the Lord of his daughter, not merely as one likely to die,\nor as dying, or as on the very point of expiring, but as even then dead; while these other two\nevangelists report her as now nigh unto death, but not yet really dead, and keep so strictly\nto that version of the circumstances, that they tell us how the persons came at a later stage\nwith the intelligence of her actual death, and with the message that for this reason the\nMaster ought not now to trouble Himself by coming, with the purpose of laying His hand\nupon her, and so preventing her from dying,—the matter not being put as if He was one\npossessed of ability to raise the once dead to life. It becomes necessary for us, therefore, to\ninvestigate this fact lest it may seem to exhibit any contradiction between the accounts. And\nthe way to explain it is to suppose that, by reason of brevity in the narrative, Matthew has\npreferred to express it as if the Lord had been really asked to do what it is clear He did actually\ndo, namely, raise the dead to life. For what Matthew directs our attention to, is not the mere\nwords spoken by the father about his daughter, but what is of more importance, his mind\nand purpose. Thus he has given words calculated to represent the father’s real thoughts. For\nhe had so thoroughly despaired of his child’s case, that not believing that she whom he had\njust left dying, could ", "lang": "latin", "orig": ""}, {"v": 18, "f": "Augustine - Confessions", "w": "Sermon XLVIII.", "t": "4. Let us then see what He would have us learn in those three dead persons whom He\nraised. He raised again the dead daughter of the ruler of the synagogue, for whom when she\nwas sick petition was made to Him, that He would deliver her from her sickness. And as He\nis going, it is announced that she is dead; and as though He would now be only wearying\nHimself in vain, word was brought to her father, “Thy daughter is dead, why weariest thou\nthe Master any further?” 3200 But He went on, and said to the father of the damsel, “Be not\nafraid, only believe.”3201 He comes to the house, and finds the customary funeral obsequies\nalready prepared, and He says to them, “Weep not, for the damsel is not dead, but sleepeth.”\n3202 He spake the truth; she was asleep; asleep, that is, in respect of Him, by whom she\ncould be awakened. So awakening her, He restored her alive to her parents. So again He\nawakened that young man, the widow’s son,3203 by whose case I have been now reminded\nto speak with you, Beloved, on this subject, as He Himself shall vouchsafe to give me power.\nYe have just heard how he was awakened. The Lord “came nigh to the city; and behold there\nwas a dead man being carried out” already beyond the gate. Moved with compassion, for\nthat the mother, a widow and bereaved of her only son, was weeping, He did what ye have\nheard, saying, “Young man, I say unto thee, Arise. He that was dead arose, and began to\nspeak, and He restored him to his mother.”3204 He awakened Lazarus likewise", "lang": "latin", "orig": ""}, {"v": 18, "f": "Augustine of Hippo", "w": "", "t": "(De Cons. Ev. ii. 28.) This narrative is given both by Mark and Luke, but in a quite different order; namely, when after the casting out of the daemons and their entrance into the swine, he had returned across the lake from the country of the Gerasenes. Now Mark does indeed tell us that this happened after He had recrossed the lake, but how long after he does not determine. Unless there had been some interval of time, that could not have taken place that Matthew relates concerning the feast in his house. After this, immediately follows that concerning the ruler of the synagogue's daughter. If the ruler came to Him while He was yet speaking that of the new patch, and the new wine, then no other act of speech of his intervened. And in Mark's account, the place where these things might come in, is evident. In like manner, Luke does not contradict Matthew; for what he adds, And behold a man, whose name was Jairus, (Luke 8:41.) is not to be taken as though it followed instantly what had been related before, but after that feast with the Publicans, as Matthew relates. While he spake these things unto them, behold, one of their chief men, namely, Jairus, the ruler of the synagogue, came to him, and worshipped him, saying, Lord, my daughter is even now dead. It should be observed, lest there should seem to be some discrepancy, that the other two Evangelists represent her as at the point of death, but yet not dead, but so as afterwards to say that there came afterwards some saying, Sh", "lang": "english", "orig": ""}, {"v": 18, "f": "Chrysostom - Homilies on John", "w": "Homily XXXI.", "t": "“While He spake these things unto them, behold, there came in1296a ruler, and worshipped\nHim, saying, My daughter is even now dead; but come and lay Thy hand upon her, and\nshe shall live.”", "lang": "greek", "orig": ""}, {"v": 18, "f": "Gospel of Peter", "w": "Section XII.", "t": "ii. 40b.\n895 Luke viii. 41a.\n896 Mark v. 23a.\n897 Matt. ix. 18b.\n898 Matt. ix. 19.\n899 Mark v. 24b.\n900 Mark v. 25.\n901 Mark v. 26.\n902 Mark v. 27.\n903 See § 8, 17, note.\n904 Mark v. 28.\n905 Mark v. 29.\n\n\nimmediately the fountain of her blood was dried; and she", "lang": "greek", "orig": ""}, {"v": 18, "f": "Hilary of Poitiers", "w": "", "t": "The prayers of the ruler, the faith of the woman, the gathering of the crowd in the house and the shouting of the two blind men, as well as the bringing of the deaf and dumb demoniac … are all interrelated. The ruler here is understood to be the law. He prays to the Lord for the people. The law has nourished them on Christ in the expectation of his foretold coming, and he restores life to the dead girl. Now we do not read of any ruler who was a believer. Hence the person of this praying ruler may rightly be taken as a model of the law. The Lord promised to help him, and he made good on his promise.", "lang": "english", "orig": ""}, {"v": 18, "f": "Hilary of Poitiers", "w": "", "t": "Figuratively, this ruler is to be understood as the Law, which prays the Lord that He would restore life to the dead multitude which it had brought up for Christ, preaching that His coming was to be looked for.", "lang": "english", "orig": ""}, {"v": 18, "f": "Jerome", "w": "", "t": "(Verse 18, 19.) Behold, a certain ruler came forward and worshipped him, saying: My daughter has just died; but come, lay your hand upon her, and she will live. And Jesus arose and followed him, and so did his disciples. The eighth sign is in which the ruler asks for his daughter to be raised, not wanting to be excluded from the mystery of true circumcision; but a woman who had been flowing with blood enters, and is healed in the eighth place, so that the ruler's daughter comes as the ninth, according to what is said in the Psalms: Ethiopia will stretch out her hands to God (Psalm 67:32). And so, all Israel will be saved; as it is written: 'The Deliverer will come out of Zion, and He will turn away ungodliness from Jacob; for this is My covenant with them, when I take away their sins.' (Romans 11:25-26).", "lang": "english", "orig": ""}, {"v": 18, "f": "John Chrysostom", "w": "", "t": "The deed overtook the words; so that the mouths of the Pharisees were the more stopped. For both he that came was a ruler of the synagogue, and his affliction terrible. For the young damsel was both his only child, and twelve years old, the very flower of her age; on which account especially He raised her up again, and that immediately.\n\nAnd if Luke say that men came, saying, \"Trouble not the Master, for she is dead;\" we will say this, that the expression, \"she is even now dead,\" was that of one conjecturing from the time of his journeying, or exaggerating his affliction. For it is an usual thing with persons in need to heighten their own evils by their report, and to say something more than is really true, the more to attract those whom they are beseeching.\n\nBut see his dullness: how he requires of Christ two things, both His actual presence, and the laying on of His hand: and this by the way is a sign that he had left her still breathing. This Naaman also, that Syrian, required of the prophet. \"For I thought,\" saith he, \"he will surely come out, and will lay on his hand.\" For in truth they who are more or less dull of temper, require sight and sensible things.", "lang": "english", "orig": ""}, {"v": 18, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For if He cast them out then, much more now. For then it was not yet manifest that death was become a sleep, but now this is clearer than the very sun itself. But is it that He has not raised your daughter now? But surely He will raise her, and with more abundant glory. For that damsel, when she had risen, died again; but your child, if she rise again, abides thenceforth in immortal being.", "lang": "", "orig": ""}, {"v": 18, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "While He spoke these things unto them, behold, there came in  a ruler, and worshipped Him, saying, My daughter is even now dead; but come and lay Your hand upon her, and she shall live.", "lang": "", "orig": ""}, {"v": 18, "f": "Rabanus Maurus", "w": "", "t": "(part. e Beda.) Or; The ruler of the synagogue signifies Moses; he is named Jairus, 'illuminating,' or, 'that shall illuminate,' because he received the words of life to give to us, and by them enlightens all, being himself enlightened by the Holy Spirit. The daughter of the ruler, that is, the synagogue itself, being as it were in the twelfth year of its age, that is, in the season of puberty, when it should have borne spiritual progeny to God, fell into the sickness of error. While then the Word of God is hastening to this ruler's daughter to make whole the sons of Israel, a holy Church is gathered from among the Gentiles, which while it was perishing by inward corruption, received by faith that healing that was prepared for others. It should be noted, that the ruler's daughter was twelve years old, and this woman had been twelve years afflicted; thus she had begun to be diseased at the very time the other was born; so in one and the same age the synagogue had its birth among the Patriarchs, and the nations without began to be polluted with the pest of idolatry. For the issue of blood may be taken in two ways, either for the pollution of idolatry, or for obedience to the pleasures of flesh and blood. Thus as long as the synagogue flourished, the Church languished; the falling away of the first was made the salvation of the Gentiles. Also the Church draws nigh and touches the Lord, when it approaches Him in faith. She believed, spake her belief, and touched, for by these thr", "lang": "english", "orig": ""}, {"v": 18, "f": "Theophylact of Ohrid", "w": "", "t": "\"While He spake these things unto them, behold, there came a certain ruler, and fell prostrate before Him, saying, My daughter is even now dead: but come and lay Thy hand upon her, and she shall live. And Jesus arose, and followed him, and so did His disciples.\" It is apparent that this man had faith, although not as great as that of the centurion (Mt. 8:8). For this man beseeches Jesus, not to speak the word only, but to come and lay His hand upon his daughter. Although Luke says that she had not yet died (Lk. 8:42), the ruler says here that his daughter has already died, either because he thought he had left her as she was breathing her last breath, or to exaggerate the calamity so as to move Christ to have mercy.", "lang": "english", "orig": ""}, {"v": 18, "f": "Thomas Aquinas", "w": "", "t": "He mentioned the miracles by which remedies are applied against the dangers of sin; here he mentions those by which remedies are applied against the dangers of death. This is divided into two parts: first, he tells how he restored a life; secondly, how he restored that life's actions (v. 23).\n\nIn regard to the first: first, the invitation to perform the miracle is presented; secondly, an indication; thirdly the preparation for the miracle (v. 25).\n\nIn regard to the first he does four things: first, the time of the invitation is described; secondly, the person inviting; thirdly, the invitation; fourthly, the acceptance of the invitation (v. 19).\n\nHe says, therefore, While he was thus speaking to them, namely, in Matthew's house. But there is an objection: for Mark and Luke present a different sequence, namely, that he approached Jesus after the crossing. Augustine answers that when something pertaining to time is recounted, if it is mentioned immediately, then the historical sequence is being followed. Therefore, when it says, While he was thus speaking, the order of history is signified. But in Mark and Luke it is referred to the order of recollection. Or it can be said that this happened at an intermediate place; for sometimes they do not state whether something occurred immediately, after or when.\n\nHe continues, behold a ruler. Here is presented the person inviting, namely, the ruler of the synagogue, and he is named Jairus, illuminating or illuminated: \"A mighty ruler is a", "lang": "english", "orig": ""}, {"v": 19, "f": "Gospel of Peter", "w": "Section XII.", "t": "iii. 41a.\n896 Mark v. 23a.\n897 Matt. ix. 18b.\n898 Matt. ix. 19.\n899 Mark v. 24b.\n900 Mark v. 25.\n901 Mark v. 26.\n902 Mark v. 27.\n903 See § 8, 17, note.\n904 Mark v. 28.\n905 Mark v. 29.\n\n\nimmediately the fountain of her blood was dried; and she felt in her body th", "lang": "greek", "orig": ""}, {"v": 19, "f": "John Chrysostom", "w": "", "t": "And whereas Mark saith, He took the three disciples, and so doth Luke; our evangelist merely saith, \"the disciples.\" Wherefore then did He not take with Him Matthew, though he had but just come unto Him? To bring him to a more earnest longing, and because he was yet rather in an imperfect state. For to this intent doth He honor those, that these may grow such as those are. But for him it sufficed for the present, to see what befell the woman with the issue of blood, and to be honored by His table, and by His partaking of his salt.\n\nAnd when He had risen up many followed Him, as for a great miracle, both on account of the person who had come, and because the more part being of a grosser disposition were seeking not so much the care of the soul, as the healing of the body; and they flowed together, some urged by their own afflictions, some hastening to behold how other men's were cured: however, there were as yet but few in the habit of coming principally for the sake of His words and doctrine. Nevertheless, He did not suffer them to enter into the house, but His disciples only; and not even all of these, everywhere instructing us to repel the applause of the multitude.", "lang": "english", "orig": ""}, {"v": 19, "f": "Remigius of Rheims", "w": "", "t": "We ought to admire and at the same time to imitate the humility and mercifulness of the Lord; as soon as ever He was asked, He rose to follow him that asked; And Jesus rose, and followed him. Here is instruction both for such as are in command, and such as are in subjection. To these He has left an example of obedience; to those who are set over others He shows how earnest and watchful they should be in teaching; whenever they hear of any being dead in spirit, they should hasten to Him; And his disciples went with him.", "lang": "english", "orig": ""}, {"v": 19, "f": "Thomas Aquinas", "w": "", "t": "And Jesus rose and followed him. He rose, namely, from the meal. Here we have evidence of Christ's mercy, because after the request he went at once, as it says in Isaiah (30:19): \"As soon as he hears your cry, he will answer you.\" Likewise, he gives an example of solicitude to prelates, that they should be solicitous about helping sinners quickly. He also gives an example of obedience, because he took disciples with him: \"Obey your prelates\" (Heb 13:17). But he did not bring Matthew, because he was still weak.", "lang": "english", "orig": ""}, {"v": 20, "f": "Hilary of Poitiers", "w": "", "t": "Herein is to be observed the marvellous virtue of the Lord, that the power that dwelt in His body should give healing to things perishable, and the heavenly energy extended even through the hems of His garments; for God is not comprehensible that He should be shut in by a body. For His taking a body unto Him did not confine His power, but His power took upon it a frail body for our redemption.", "lang": "english", "orig": ""}, {"v": 20, "f": "Jerome", "w": "", "t": "The Gospel according to Luke says that the ruler’s daughter was twelve years old. Note also that the woman concerned, who was from the Gentiles, began to get sick at a place believed to be in a Jewish district. Except by way of contrast between physical conditions, the girl’s ailment is not indicated. As for the woman who had a hemorrhage, she approached the Lord not in her home or in the town (because according to the law she was excluded from towns) but while the Lord was walking by, so that in the course of going to one woman, another was cured. The apostles say in this regard, “It was necessary that the word of God should be spoken first to you. Since you judge yourselves unworthy of eternal life, behold, we turn to the Gentiles.”", "lang": "english", "orig": ""}, {"v": 20, "f": "Jerome", "w": "", "t": "(Ver. 20) And behold, a woman who had been suffering from a flow of blood for twelve years came up behind Him and touched the fringe of His cloak. In the Gospel according to Luke, it is written that the daughter of a ruler had reached the age of twelve (Luke 8). Note, therefore, that during that time this woman, that is, the people of the Gentiles, began to be sick, while the people of the Jews believed. For unless a comparison of virtues is made, vice is not revealed. But this woman, flowing with blood, does not approach the Lord in the house, nor in the city, for according to the Law she was excluded from the cities (Leviticus 15, Numbers 5); but on the way, as the Lord walks, so that while He goes to another, another may be healed. Hence the apostles say: 'It was necessary that the word of God should be preached to you, but since you judged yourselves unworthy of salvation, we turn to the Gentiles' (Acts 13:46).", "lang": "english", "orig": ""}, {"v": 20, "f": "Jerome", "w": "", "t": "This woman that had the flux came to the Lord not in the house, nor in the town, for she was excluded from them by the Law, but by the way as He walked; thus as He goes to heal one woman, another is cured.", "lang": "english", "orig": ""}, {"v": 20, "f": "John Chrysostom", "w": "", "t": "Wherefore did she not approach Him boldly? She was ashamed on account of her affliction, accounting herself to be unclean. For if the menstruous woman was judged not to be clean, much more would she have the same thought, who was afflicted with such a disease; since in fact that complaint was under the law accounted a great uncleanness. Therefore she lies hidden, and conceals herself. For neither had she as yet the proper and correct opinion concerning Him: else she would not have thought to be concealed. And this is the first woman that came unto Him in public, having heard of course that He heals women also, and that He is on His way to the little daughter that was dead.\n\nAnd she durst not invite him to her house, although she was wealthy; nay, neither did she approach publicly, but secretly with faith she touched His garments. For she did not doubt, nor say in herself, \"Shall I indeed be delivered from the disease? shall I indeed fail of deliverance?\" But confident of her health, she so approached Him. \"For she said,\" we read, \"in herself, If I may only touch His garment, I shall be whole.\" Yea, for she saw out of what manner of house He was come, that of the publicans, and who they were that followed Him, sinners and publicans; and all these things made her to be of good hope.", "lang": "english", "orig": ""}, {"v": 20, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "2. And, behold, it is said, a woman that had an issue of blood twelve years, came behind Him, and touched the hem of His garment. For she said within herself, If I may but touch His garment, I shall be whole.", "lang": "", "orig": ""}, {"v": 20, "f": "Pseudo-Clementine Literature", "w": "Chapter 7.", "t": "And a woman1827 cried out from a distance, and said: I had an issue of blood, and I\ntouched the hem of his garment, and the issue of blood which I had had for twelve years\nwas stopped.1828 The Jews say: we have a law, that a woman’s evidence is not to be received.\n1829", "lang": "greek", "orig": ""}, {"v": 20, "f": "Pseudo-Clementine Literature", "w": "Chapter 7.", "t": "There was found there also a woman named Veronica, and she said: Twelve years I was\nin an issue of blood, and I only touched the edge of his garment, and directly I was cured.1890\nThe Jews say: Our law does not admit the testimony of a woman.1891", "lang": "greek", "orig": ""}, {"v": 20, "f": "Remigius of Rheims", "w": "", "t": "In which her humility must be praised, that she came not before His face, but behind, and judged herself unworthy to touch the Lord's feet, yea, she touched not His whole garment, but the hem only; for the Lord wore a hem according to the command of the Law. So the Pharisees also wore hems which they made large, and in some they inserted thorns. But the Lord's hem was not made to wound, but to heal, and therefore it follows, For she said within herself, If I can but touch his garment, I shall be made whole. How wonderful her faith, that though she despaired of health from the physicians, on whom notwithstanding she had exhausted her living, she perceived that a heavenly Physician was at hand, and therefore bent her whole soul on Him; whence she deserved to be healed; But Jesus turning and seeing her, said, Be of good cheer, daughter, thy faith hath made thee whole.", "lang": "english", "orig": ""}, {"v": 20, "f": "Theophylact of Ohrid", "w": "", "t": "\"And, behold, a woman, who was diseased with an issue of blood twelve years, came behind Him, and touched the hem of His garment. For she said within herself, If I may but touch His garment, I shall be whole. But Jesus turned Him about, and when He saw her, He said, Take courage, daughter; thy faith hath made thee whole. And the woman was made whole from that hour.\" The woman was unclean due to her illness (Levit. 15:19), and for this reason she did not approach Him openly for fear that she would be prevented. She intended to escape His notice, and yet hoped to obtain healing if only by touching the hem of His garment. But the Saviour revealed her, not because He loved glory, but to show her faith for our benefit, and also to strengthen the faith of the ruler of the synagogue. Jesus tells her, \"Take courage,\" because she was fearful that she had stolen the gift; He calls her \"daughter\" because she had faith. He shows that if she had not offered faith she would not have received the grace, even though His garments were holy. It is said that this woman made a figure of Christ and at its feet there grew a plant which aided those with hemorrhages. Some impious men destroyed the figure at the time of the Emperor Julian the Apostate.", "lang": "english", "orig": ""}, {"v": 20, "f": "Thomas Aquinas", "w": "", "t": "And behold, a woman... In Leviticus (c. 12) it is laid down that a woman who suffered a flow of blood was unclean and did not live with men; therefore, she did not come to him in the house but on the road. And she signifies the gentiles, who had entered into the Jews' fullness, as it says in Romans (11:25): \"A blindness has come upon a part of Israel, until the full number of the gentiles come in.\" She, namely, the synagogue, had a flow of blood, i.e., the terror of immolated blood. Or it can be referred to sins of the flesh; hence \"flesh and blood shall not possess the kingdom of God\" (1 Cor 15:50). This woman suffered for twelve years, and the ruler's daughter was twelve years of age; hence she began her suffering, when the ruler's daughter was born.\n\nShe came up behind him and touched the fringe of his garment. Here the woman is commended for her humility and for her faith, which was of the highest order for obtaining. She came up behind him. Why behind him? Because she was considered unclean; hence whatever she touched was unclean according to the Law. Therefore, she feared that he might rebuff her. Also she dared to touch only the fringe. In the Law it was commanded that at the four corners of a garment they have fringes, and there they carried tympana as a reminder of God's commandments, and so that they could thus be distinguished from others; and Christ had such a garment. Mystically, this signifies the gentiles, who approached with faith. But from behind, because not", "lang": "english", "orig": ""}, {"v": 20, "f": "npnf201", "w": "Chapter XVIII.—The Statue which the Woman with an Issue of Blood erected.2296", "t": "chen’s Excursus, in Vol. III. p. 698 sq.\n2297 See Matt. ix. 20 sq.\n2298 οὗ παρὰ τοῖς ποσὶν ἐπὶ τῆς στήλης αὐτῆς. This is commonly translated “at his feet, upon the pedestal”;\nbut, as Heinichen remarks, in the excursus referred to just above, the plant can hardly", "lang": "greek", "orig": ""}, {"v": 20, "f": "npnf206", "w": "Letter LXXI. To Lucinius.", "t": ". 1, 2.\n2214 Ps. lv. 7, 8.\n2215 Luke ix. 62.\n2216 Matt. ix. 20.\n2217 Cant. v. 2.\n2218 Matt. xxiv. 17, 18.\n2219 Gen. xiii. 10.\n2220 Jerome quoting from memory substitutes ‘crown’ for ‘prize.’\n2221 1 Cor. ix. 24.\n2222 Ruth i. 14.\n2223 Luke xix. 5.\n2224 Joh. xii. 2", "lang": "greek", "orig": ""}, {"v": 21, "f": "Jerome", "w": "", "t": "(Verse 21) For she said within herself, If I shall touch but his garment, I shall be whole. But Jesus turned him about, and when he saw her, he said, According to the Law, he who touches a woman who is menstruating or has a discharge of blood is unclean (Lev. 20:25). She touches the Lord for this reason, that she may be healed of the defect of blood.", "lang": "english", "orig": ""}, {"v": 21, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "2. And, behold, it is said, a woman that had an issue of blood twelve years, came behind Him, and touched the hem of His garment. For she said within herself, If I may but touch His garment, I shall be whole.", "lang": "", "orig": ""}, {"v": 21, "f": "Thomas Aquinas", "w": "", "t": "For she said within herself, \"If I only touch his garment, I shall be made well.\" Hilary says: \"The power of Christ is great, because it was not only in the soul, but it flowed into the body and from the body into his garments.\" And so we should hold in reverence everything Christ's body touched: \"It is like precious oil upon the head, running down upon the beard, the beard of Aaron, running down on the collar of his robes\" (Ps 133:2). Which runs down upon the beard, i.e., the divinity into the flesh; and on the collar of his robes, i.e., on the apostles. I will be made well. If we do the same and cling to him, we will be made well: \"Everyone who calls upon the name of the Lord will be delivered\" (Jl 2:32).", "lang": "english", "orig": ""}, {"v": 21, "f": "npnf210", "w": "CHAPTER VII.", "t": "69 S. Luke xiv. 21.\n2170 Jerem. xvii. 14.\n2171 S. Matt. ix. 21.\n2172 S. Matt. xxv. 36.\n2173 S. John xiii. 8.\n\n\nbe loosed also in heaven.”2174 And the vessel of divine election himself said: “If ye have\nforgiven anything to any one, I forgive also, for what I hav", "lang": "greek", "orig": ""}, {"v": 22, "f": "Augustine of Hippo", "w": "", "t": "The daughter of the synagogue ruler signifies the Jewish people, whereas the woman signifies the church of the Gentiles. The Lord Christ, born of the Jews in the flesh, was presented to those Jews in the flesh. But he sent others to the Gentiles; he did not go himself. His bodily and visible community ties were in Judea. Therefore the apostle says, “For I say that Christ has been a minister of the circumcision in order to show God’s fidelity in confirming the promises made to our fathers.” It was said to Abraham, “By your descendants shall all the nations of the earth bless themselves,” “that the Gentiles might glorify God for his mercy.” Therefore Christ was sent to the Jews. He went to restore life to the daughter of the synagogue ruler. The woman appears on the scene, and she is healed. She is healed first in faith, being practically ignored by the Savior, for he said, “Who touched me?” Here we have an ignoring attitude by God and faith in the mystery by her. It means something when someone who cannot ignore, ignores. And what does it mean? It points to the healed church of the Gentiles, the bodily presence of which is not seen by Christ, whose voice is heard in the psalm: “People whom I had not known served me. As soon as they heard of me they obeyed me.” The world heard and it believed. The Jewish people saw and at first they crucified. But later they too came to him. Also the Jews will believe—but at the end of the world.", "lang": "english", "orig": ""}, {"v": 22, "f": "Glossa Ordinaria", "w": "", "t": "(ap. Anselm.) This must be understood as the time in which she touched the hem of His garment, not in which Jesus turned to her; for she was already healed, as the other Evangelists testify, and as may be inferred from the Lord's words.", "lang": "english", "orig": ""}, {"v": 22, "f": "Hilary of Poitiers", "w": "", "t": "As the woman is healed, the crowd of sinners is made whole. At first it seemed more appropriate to follow the law of cleanliness. But a more pristine wholeness is restored to publicans and sinners in the appearance of the woman. Thus, upon meeting the Lord as he was passing by, she believed firmly that by touching his garment she would be healed of her flow of blood. Dressed in shabby clothes and defiled by the uncleanness of her interior affliction, in her faith she hastens to touch the tassel of his cloak. In the midst of the apostles she sought to touch the gift of the Holy Spirit as it was coming from Christ’s body. She is suddenly healed.… The Lord praised her faith and constancy, because what had been prepared for Israel, the common people of the Gentiles were now claiming for themselves.", "lang": "english", "orig": ""}, {"v": 22, "f": "Irenaeus", "w": "CHAPTER VI.—THE GOSPEL WAS PREACHED TO JEWS AND GENTILES IN HADES.2415", "t": ", P. 189.]\n2416 Matt. xxiii. 4; Luke xi. 46.\n2417 Matt. ix. 22, etc.\n2418 The passage which seems to be alluded to here is Job xxviii. 22, “Destruction and Death say, We have\nheard the fame thereof with our ears.”\n2419 εὐηγγελίσθαι used actively for εὐαγγελίσαι,", "lang": "greek", "orig": ""}, {"v": 22, "f": "Jerome", "w": "", "t": "(Verse 22) Have faith, daughter, your faith has saved you: and the woman was saved from that hour. Therefore, daughter, because your faith has saved you. He did not say, your faith will save you, but has saved you. For in what you have believed, you have already been saved.", "lang": "english", "orig": ""}, {"v": 22, "f": "Jerome", "w": "", "t": "He said not, Thy faith shall make thee whole, but, hath made thee whole; for in that thou hast believed, thou art already made whole.", "lang": "english", "orig": ""}, {"v": 22, "f": "Jerome", "w": "Commentarii in Ezechielem", "t": "For neither the centurion nor that poor woman who for twelve years was wasting away with a bloody flux, had believed in the mysteries of the Trinity, for these were revealed to the Apostles after the resurrection of Christ; so that the faith of such as believe in the mystery of the Trinity might have its due preeminence: but it was her singleness of mind and her devotion to her God that met with our Lord's approval: Matthew 9:21 For she said within herself, If I do but touch his garment, I shall be made whole. This is the faith which our Lord said was seldom found. This is the faith which even in the case of those who believe aright is hard to find in perfection. Matthew 9:29 According to your faith, be it done unto you, says God. I do not, indeed, like the sound of those words. For if it be done unto me according to my faith, I shall perish. And yet I certainly believe in God the Father, I believe in God the Son, and I believe in God the Holy Ghost. I believe in one God; nevertheless, I would not have it done unto me according to my faith. For the enemy often comes, and sows tares in the Lord's harvest. I do not mean to imply that anything is greater than the purity of heart which believes that mystery; but undoubted faith towards God it is hard indeed to find.", "lang": "", "orig": ""}, {"v": 22, "f": "John Chrysostom", "w": "", "t": "What then doth Christ? He suffers her not to be hid, but brings her into the midst, and makes her manifest for many purposes.\n\nIt is true indeed that some of the senseless ones say, \"He does this for love of glory. For why,\" say they, \"did He not suffer her to be hid?\" What sayest thou, unholy, yea, all unholy one? He that enjoins silence, He that passes by miracles innumerable, is He in love with glory?\n\nFor what intent then doth He bring her forward? In the first place He puts an end to the woman's fear, lest being pricked by her conscience, as having stolen the gift, she should abide in agony. In the second place, He sets her right, in respect of her thinking to be hid. Thirdly, He exhibits her faith to all, so as to provoke the rest also to emulation; and His staying of the fountains of her blood was no greater sign than He affords in signifying His knowledge of all things. Moreover the ruler of the synagogue, who was on the point of thorough unbelief, and so of utter ruin, He corrects by the woman. Since both they that came said, \"Trouble not the Master, for the damsel is dead;\" and those in the house laughed Him to scorn, when He said, \"She sleepeth;\" and it was likely that the father too should have experienced some such feeling. Therefore to correct this weakness beforehand, He brings forward the simple woman. For as to that ruler being quite of the grosser sort, hear what He saith unto him: \"Fear not, do thou believe only, and she shall be made whole.\"\n\nThus He waite", "lang": "english", "orig": ""}, {"v": 22, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But with Christ it was not so, but all at once was ended: and so it befell this woman also. Wherefore also the evangelist, to declare this, said, She arose and ministered unto Him; Matthew 8:15 which was a sign both of Christ's power, and of the disposition of the woman, which she showed towards Christ.", "lang": "", "orig": ""}, {"v": 22, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "What then does Christ? He suffers her not to be hid, but brings her into the midst, and makes her manifest for many purposes.", "lang": "", "orig": ""}, {"v": 22, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But mark thou, I pray you, how when the apostles had failed, and had not succeeded, this woman had success. So great a thing is assiduity in prayer. Yea, He had even rather be solicited by us, guilty as we are, for those who belong to us, than by others in our behalf. And yet they had more liberty to speak; but she exhibited much endurance.", "lang": "", "orig": ""}, {"v": 22, "f": "Rabanus Maurus", "w": "", "t": "What is this that He bids her, Be of good cheer, seeing if she had not had faith, she would not have sought healing of Him? He requires of her strength and perseverance, that she may come to a sure and certain salvation.", "lang": "english", "orig": ""}, {"v": 22, "f": "Thomas Aquinas", "w": "", "t": "Jesus turned, and seeing her, he said, \"Take heart, daughter.\" Here is shown Christ's kindness. First, it is shown by an action, because he turned toward her. Why? So she would not lose confidence; for since she had come furtively, she did not think he would turn toward her. Also that her faith be shown as an example. Likewise, to show that he was God; hence he turned with mercy and saw her with the eye of piety: \"Turn to me, and I will turn to you\" (Zech 1:3). His kindness is also shown in word, when he says, Take heart, because she came with fear, he addressed her gently: \"In returning and in rest you shall be saved\" (Is 30:15). Likewise, he calls her, daughter, to bolster her confidence: \"He gave them power to become sons of God\" (Jn 1:12). He also produces hope: \"Your faith has made you well.\" Hence \"our salvation is from faith\" (Rom c. 3). And the effect follows: And the woman was made well from that hour. It was not from the hour that Christ spoke, but from the hour she touched him.", "lang": "english", "orig": ""}, {"v": 22, "f": "npnf211", "w": "CHAPTER IX.", "t": "“Again, the same Refrigerius is my witness that a woman, suffering from an issue of\nblood, when she had touched the garment of Martin, after the example of the woman\nmentioned in the Gospel, was cured in a moment of time.", "lang": "greek", "orig": ""}, {"v": 23, "f": "Ambrose of Milan", "w": "", "t": "(in Luc. 8. 52.) For by the ancient custom minstrels were engaged to make lamentation for the dead.", "lang": "english", "orig": ""}, {"v": 23, "f": "Glossa Ordinaria", "w": "", "t": "(non occ.) After the healing of the woman with the issue of blood, follows the raising of the dead; And when Jesus was come into the ruler's house.", "lang": "english", "orig": ""}, {"v": 23, "f": "Hilary of Poitiers", "w": "", "t": "Mystically; The Lord enters the ruler's house, that is, the synagogue, throughout which there resounded in the songs of the Law a strain of wailing.", "lang": "english", "orig": ""}, {"v": 23, "f": "Jerome", "w": "", "t": "(Verse 23) And when Jesus came into the ruler's house, and saw the minstrels and the people making a noise, He said, Give place: for the maid is not dead, but sleepeth. And they laughed him to scorn. But when the people were put forth, he went in, and took her by the hand, and the maid arose. And the fame hereof went abroad into all that land.", "lang": "english", "orig": ""}, {"v": 23, "f": "Jerome", "w": "", "t": "To this day the damsel lays dead in the ruler's house; and they that seem to be teachers are but minstrels singing funeral dirges. The Jews also are not the crowd of believers, but of people making a noise. But when the fulness of the Gentiles shall come in, then all Israel shall be saved.", "lang": "english", "orig": ""}, {"v": 23, "f": "John Chrysostom", "w": "", "t": "Noble tokens, surely, these, of the rulers of synagogues; in the moment of her death pipes and cymbals raising a dirge! What then doth Christ? All the rest He cast out, but the parents He brought in; to leave no room for saying that He healed her in any other way.", "lang": "english", "orig": ""}, {"v": 23, "f": "Peter Chrysologus", "w": "", "t": "Christ reaches the house and sees the girl who appears to be dead. In order to move faithless hearts to faith, he says that the ruler’s daughter is sleeping and is not dead. Ostensibly it is not easier to rise from death than to rise from sleep. So he says, “The girl is asleep, not dead.” With God, indeed, death is sleep, for God can bring a dead person back to life sooner than a sleeping person can be wakened from sleep by humans; and God can sooner restore life-giving warmth to limbs frozen in death than humans can infuse vigor in bodies immersed in sleep. Hear the words of the apostle: “In a moment, in the twinkling of an eye the dead shall rise.” Because the blessed apostle was unable to refer to the speed of the resurrection in words, he opted for examples. How could he touch upon rapidity when divine power anticipates rapidity itself? And how does time enter the picture when something eternal is given outside of time? Even as time applies to temporality, so does eternity exclude time.", "lang": "english", "orig": ""}, {"v": 23, "f": "Rabanus Maurus", "w": "", "t": "Morally; The damsel dead in the house is the soul dead in thought. He says that she is asleep, because they that are now asleep in sin may yet be roused by penitence. The minstrels are flatterers who cherish the dead.", "lang": "english", "orig": ""}, {"v": 23, "f": "Theophylact of Ohrid", "w": "", "t": "\"And when Jesus came into the ruler's house, and saw the flute players and the people making a noise, He said unto them, Give place: for the maid is not dead, but sleepeth. And they laughed Him to scorn.\" Since she was unmarried, they were mourning her with flutes used at weddings, which was contrary to the law. Jesus said that she was sleeping, because He was able to resurrect her easily, and so to Him, death was sleep. Do not marvel that they laughed Him to scorn, for by scoffing they bear witness all the more to the miracle that He resurrected one who was truly dead. So that no one could later say that she had only suffered a seizure, it was confessed by all those present that she was dead.", "lang": "english", "orig": ""}, {"v": 23, "f": "Thomas Aquinas", "w": "", "t": "And when Jesus came to the ruler's house and saw the flute players... Here the revival is described, and he does four things: first, the indications of death are described; secondly, hope is given; thirdly, the girl is revived; fourthly, the effect is mentioned. He says, therefore, When he came... and saw... Why did the flute players come? The crowd came as is customary even now, when there is a death; but the flute players came to sing dirges and to move others to mourn, as it says in Jeremiah (9:17): \"Consider, and call for the mourning women to come.\" These flute players are false teachers: \"Their speech and their deeds are against the Lord, defying his glorious presence\" (Is 3:8). The crowd is the Jewish people: \"You shall not follow a multitude to do evil\" (Ex 23:2). The Lord revived the girl in a house. For the Lord revived three persons: the girl in her house, the young man at the gate, Lazarus in the tomb. For some are dead by sin, but they are not carried without; and this is by consent to sin, but they do not proceed without by works. Some are carried without by action, and this is signified by the one revived at the gate. Finally, some lie in the tomb from habit, which is signified by Lazarus. Therefore, this girl signifies the sinner who is in secret sin, namely, in the mind. The flute players are those who encourage them in sin: \"The sinner is praised in the desires of his heart\" (Ps 10:3). The crowd is thoughts; and the Lord heals her.", "lang": "english", "orig": ""}, {"v": 24, "f": "Bede", "w": "", "t": "(in Luc.) As though He had said, To you she is dead, but to God who has power to give life, she sleeps only both in soul and body.", "lang": "english", "orig": ""}, {"v": 24, "f": "Chrysostom - Homilies on John", "w": "Homily XXVI.", "t": "But having come unto Him, he saith, “My servant lieth at home sick of the palsy,\ngrievously tormented.” Now some say, that by way of excuse he mentioned also the cause,\nwhy he had not brought him. “For neither was it possible,” saith he, “paralyzed as he was,\nand tormented, and at his last gasp, to lift and convey him.” For that he was at the point of\nexpiring, Luke saith; “He was even ready to die.”1094 But I say, this is a sign of his having\ngreat faith, even much greater than theirs, who let one down through the roof.1095 For because\nhe knew for certain, that even a mere command was enough for the raising up of the patient,\nhe thought it superfluous to bring him.", "lang": "greek", "orig": ""}, {"v": 24, "f": "Hilary of Poitiers", "w": "", "t": "But that the number of the elect might be known to be but few out of the whole body of believers, the multitude is put forth; the Lord indeed would that they should be saved, but they mocked at His sayings and actions, and so were not worthy to be made partakers of His resurrection.", "lang": "english", "orig": ""}, {"v": 24, "f": "Jerome", "w": "", "t": "(Vers. 24.) Step back, for the girl is not dead, but sleeping. And they laughed at him. For in God, all things live.", "lang": "english", "orig": ""}, {"v": 24, "f": "John Chrysostom", "w": "", "t": "And before her resurrection too, He raises her in His word; saying, \"The maid is not dead, but sleepeth.\" And in many instances besides He doeth this. As then on the sea He expels tumult from the mind of the by-standers, at the same time both signifying that it is easy for Him to raise the dead (which same thing He did with respect to Lazarus also, saying, \"Our friend Lazarus sleepeth;\" and also teaching us not to fear death; for that it is not death, but is henceforth become a sleep. Thus, since He Himself was to die, He doth in the persons of others prepare His disciples beforehand to be of good courage, and to bear the end meekly. Since in truth, when He had come, death was from that time forward a sleep.\n\nBut yet they laughed Him to scorn: He however was not indignant at being disbelieved by those for whom He was a little afterwards to work miracles; neither did He rebuke their laughter, in order that both it and the pipes, and the cymbals, and all the other things, might be a sure proof of her death. For since for the most part, after the miracles are done, men disbelieve, He takes them beforehand by their own answers; which was done in the case both of Lazarus and of Moses. For to Moses first He saith, \"What is that in thine hand?\" in order that when he saw it become a serpent, He should not forget that it was a rod before, but being reminded of his own saying, might be amazed at what was done. And with regard to Lazarus He saith, \"Where have ye laid him?\" that they who", "lang": "english", "orig": ""}, {"v": 24, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "3. And when He came into the ruler's house, and saw the minstrels and the people making a noise, He says unto them, Give place, for the maid is not dead, but sleeps. And they laughed Him to scorn.", "lang": "", "orig": ""}, {"v": 24, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And what difference is there, one may say, between them that sleep, and them that resemble the wayside? That in the latter case he immediately caught it away; yea, he suffered it not even to take root; but here more of his craft was needed.", "lang": "", "orig": ""}, {"v": 24, "f": "Thomas Aquinas", "w": "", "t": "Hence he says, Depart, for the girl is not dead. He gives hope: She is not dead, namely, to himself; but sleeping, because it is as easy for him to restore life as for someone to wake another from sleep. Something similar is stated in John (11:11): \"Lazarus, our friend, is asleep...\" She is not dead. Why did he say it this way? Because they laughed at him. But why did he wish to be laughed at? So that they could not deny the miracle; hence he first made his adversaries acknowledge the death, so that later they could not contradict.", "lang": "english", "orig": ""}, {"v": 24, "f": "npnf206", "w": "Letter CXVIII. To Julian.", "t": "3073 Ecclus. xxii. 6.\n3074 Luke vii. 11–15.\n3075 Matt. ix. 24.\n3076 Joh. xi. 39, 43, 44.\n\n\nof brigands, or in the eloquent language of the prophet like one “who did flee from a lion,\nand a bear met him; or went into the house, and leaned his hand on the wall, a", "lang": "greek", "orig": ""}, {"v": 25, "f": "Chromatius of Aquileia", "w": "", "t": "In the flute players and bustling onlookers who laughed to scorn the Lord who said, “The girl is asleep, not dead,” we see an example of the synagogue rulers and the onlookers of Jewish people who, when they heard that the hope of eternal life had been promised by the Son of God to the Gentiles, held up to ridicule and contempt this great grace of the Lord. Not unjustly did the Lord order them to be sent outside. He showed that incredulous and unbelieving people of this kind are to be excluded from the promise of eternal life or from God’s kingdom by him who is the Author of life and the Lord of the heavenly kingdom.", "lang": "english", "orig": ""}, {"v": 25, "f": "Chromatius of Aquileia", "w": "", "t": "In the synagogue ruler we perceive a figure of the prophets or apostles, especially Peter, by whom the calling of the Gentiles was first heard; that is, the girl represented all those holy people who pleased God, not through the works of the law but through the righteousness of faith.…Moreover, for us to understand that the entire mystery of our salvation is prefigured in this girl; after she was raised from the dead, as Luke reports, the Lord directs her to eat something. Evidently the order of our faith and salvation is here shown. For when each believer among us is freed in baptism from perpetual death and comes back to life upon acceptance of the gift of the Holy Spirit, it is necessary that the person also be directed to eat that heavenly bread about which the Lord says, “Unless you eat the flesh of the Son of Man and drink his blood, you have no life in you.”", "lang": "english", "orig": ""}, {"v": 25, "f": "Gregory the Dialogist", "w": "", "t": "(Mor. xviii. 43.) The multitude are put forth that the damsel may be raised; for unless the multitude of worldly cares is first banished from the secrets of the heart, the soul which is laid dead within, cannot rise again.", "lang": "english", "orig": ""}, {"v": 25, "f": "Jerome", "w": "", "t": "(Verse 25.) And when the crowd had been thrown out, he entered. For they were not worthy to see the mystery of the one rising again, who they derided with unworthy insults.", "lang": "english", "orig": ""}, {"v": 25, "f": "Jerome", "w": "", "t": "They that had mocked the Reviver were not worthy to behold the mystery of the revival; and therefore it follows, And when the multitude was put forth, he entered, and took her by the hand, and the maid arose.\n\nHe took her by the hand, and the maid arose; because if the hands of the Jews which are defiled with blood be not first cleansed, their synagogue which is dead shall not revive.", "lang": "english", "orig": ""}, {"v": 25, "f": "John Chrysostom", "w": "", "t": "Seeing then the cymbals and the multitude, He put them all out, and in the presence of the parents works the miracle; not introducing another soul, but recalling the same that had gone out, and awakening her as it were out of a sleep.\n\nAnd He holds her by the hand, assuring the beholders; so as by that sight to make a way for the belief of her resurrection. For whereas the father said, \"Lay thy hand upon her;\" He on His part doth somewhat more, for He lays no hand on her, but rather takes hold of her, and raises her, implying that to Him all things are ready. And He not only raises her up, but also commands to give her meat, that the event might not seem to be an illusion. And He doth not give it Himself, but commands them; as also with regard to Lazarus He said, \"Loose him, and let him go,\" and afterwards makes him partaker of His table. For so is He wont always to establish both points, making out with all completeness the demonstration alike of the death and of the resurrection.\n\nBut do thou mark, I pray thee, not her resurrection only, but also His commanding \"to tell no man;\" and by all learn thou this especially, His freedom from haughtiness and vainglory. And withal learn this other thing also, that He cast them that were beating themselves out of the house, and declared them unworthy of such a sight; and do not thou go out with the minstrels, but remain with Peter, and John, and James.\n\nFor if He cast them out then, much more now. For then it was not yet manifest that", "lang": "english", "orig": ""}, {"v": 25, "f": "Rabanus Maurus", "w": "", "t": "The maiden is raised in the house with few to witness, the young man without the gate, and Lazarus in the presence of many; for a public scandal requires a public expiation; a less notorious, a lesser remedy; and secret sins may be done away by penitence.", "lang": "english", "orig": ""}, {"v": 25, "f": "Theophylact of Ohrid", "w": "", "t": "\"But when the people were put forth, He went in, and took her by the hand, and the maid arose. And the fame hereof went abroad into all that land.\" Where there are crowds and distractions, Christ does not perform miracles. He takes her by the hand, thus imparting strength. And you, O reader, who are dead in sins, He will also resurrect when He puts outside the crowd and its tumult and takes you by the hand so that you might act.", "lang": "english", "orig": ""}, {"v": 25, "f": "Thomas Aquinas", "w": "", "t": "And when the crowd had been put out, he went in. The crowd is the Jews, who are not converted. And morally, in order that the soul be restored, it is required that the crowd of thoughts be expelled. Then the Lord enters. He went in and took her by the hand: \"The right hand of the Lord has shown power\" (Ps 118:16). He takes the hand of the sinner, when he offers him help. And the girl arose, namely, to life; and so do we from sin by God's help.", "lang": "english", "orig": ""}, {"v": 26, "f": "Glossa Ordinaria", "w": "", "t": "(non occ.) The fame, namely, of the greatness and novelty of the miracle, and its established truth; so that it could not be supposed to be a forgery.", "lang": "english", "orig": ""}, {"v": 26, "f": "Hilary of Poitiers", "w": "", "t": "His fame went about into all that country; that is, the salvation of the elect, the gift and works of Christ are preached.", "lang": "english", "orig": ""}, {"v": 26, "f": "Jerome", "w": "", "t": "(Verse 26) And he took her by the hand. And the girl arose: And this report went forth into all that land. Unless the hands of the Jews, which are full of blood, are first cleansed, their synagogue will not rise again.", "lang": "english", "orig": ""}, {"v": 26, "f": "Thomas Aquinas", "w": "", "t": "Then followed the report of this throughout all that district.", "lang": "english", "orig": ""}, {"v": 27, "f": "Augustine - Confessions", "w": "Chapter XXIX.—Of the Two Blind Men and the Dumb Demoniac Whose Stories\nare Related Only by Matthew.", "t": "69. Matthew proceeds with his narrative in the following terms: “And when Jesus departed\nthence, two blind men followed Him, crying and saying, Thou son of David, have mercy\non us;” and so on, down to the verse where we read, “But the Pharisees said, He casteth out\ndevils through the prince of the devils.”959 Matthew is the only one who introduces this\naccount of the two blind men and the dumb demoniac. For those two blind men, whose\nstory is given also by the others,960 are not the two before us here. Nevertheless there is such\nsimilarity in the occurrences, that if Matthew himself had not recorded the latter incident\nas well as the former, it might have been thought that the one which he relates at present\nhas also been given by these other two evangelists. There is this fact, therefore, which we\nought to bear carefully in mind,—namely, that there are some occurrences which resemble\neach other. For we have a proof of this in the circumstance that the very same evangelist\nmentions both incidents here. And thus, if at any time we find any such occurrences narrated\nindividually by the several evangelists, and discover some contradiction in the accounts,\nwhich seems not to admit of being solved [on the principle of harmonizing], it may occur\nto us that the explanation simply is, that this [apparently contradictory] circumstance did\nnot take place [on that particular occasion], but that what did happen then was only something\nresembling it, or something which was gone about in a", "lang": "latin", "orig": ""}, {"v": 27, "f": "Chromatius of Aquileia", "w": "", "t": "According to one allegorical interpretation, these two blind men symbolize the two kingdoms into which the Jews were divided (after Solomon’s death, between Rehoboam and Jeroboam). According to another interpretation, we might consider the people of the Jews and the people of the Gentiles as being prefigured in these two blind men. But this would not be appropriate. For would it be possible for the people of the Gentiles, before being enlightened, to declare Christ to be the Son of David, for they had not heard of the law or the prophets? For that reason, more properly it is understood concerning these two blind men that they did know from the law and the prophets that Christ is the Son of David. Both were blind, therefore, through their own unfaithfulness, for they were not yet able to see the true light, the only Son of God who was foretold in the law and the prophets. Bereft of the light of faith and covered by the veil of the law, they were being held in the gloom of blindness, according to the blessed apostle who says, “To this day whenever Moses is read a veil lies over their minds; but when one turns to the Lord the veil is removed.” And again: “For to this day, when they read the old covenant, that same veil remains unlifted, because only through Christ is it taken away.” Therefore sight was restored to these blind men as soon as they expressed their faith in the Son of God. This shows that whoever from these two peoples should believe that the Son of God came to save", "lang": "english", "orig": ""}, {"v": 27, "f": "Chrysostom - Homilies on John", "w": "Homily XXXII.", "t": "“And when Jesus departed thence, two blind men followed Him, crying, and saying, Thou Son\nof David, have mercy on us.1334And when He was come into the house, the blind men\ncame to Him: and Jesus saith unto them, Believe ye that I am able to do this? They say\nunto Him, Yea, Lord. Then touched He their eyes, saying, According to your faith be\nit1335unto you. And their eyes were opened.”", "lang": "greek", "orig": ""}, {"v": 27, "f": "Hilary of Poitiers", "w": "", "t": "At that point, two blind men follow the Lord as he was passing by. But if they could not see, how could the blind men know of the Lord’s departure as well as his name? Moreover, they called him “Son of David” and asked to be made well. In the two blind men, the entire earlier prefiguration is complete. The ruler’s daughter seems to be from these people, namely, the Pharisees and John’s disciples, who already made common cause in testing the Lord. To these unknowing persons the law gave evidence as to the one from whom they sought a cure. It indicated to them that their Savior in the flesh was of the line of David. It also introduced light to the minds of those who were blind from past sins. They could not see Christ but were told about him. The Lord showed them that faith should not be expected as a result of health but health should be expected because of faith. The blind men saw because they believed; they did not believe because they saw. From this we understand that what is requested must be predicated on faith and that faith must not be exercised because of what has been obtained. If they should believe, he offers them sight. And he charges the believers to be silent, for it was exclusively the task of the apostles to preach.", "lang": "english", "orig": ""}, {"v": 27, "f": "Jerome", "w": "", "t": "(Verse 27) And as Jesus passed on from there, two blind men followed him, crying out and saying, 'Have mercy on us, Son of David.' As Jesus passed through the house of the ruler and was going to his own house, as we read above: Getting into a boat, he crossed over and came to his own city. The two blind men cried out, saying, 'Have mercy on us, Son of David.' And yet they were not healed on the way, as they thought; but after he came to his own house, they approached him and entered: and their faith is first tested, so that they may receive the light of true faith. Earlier we presented a sign regarding the prince's daughter and the hemorrhaging (or sick) woman, now this is added: that as there was death and weakness there, here blindness is shown. Both peoples were blind when the Lord passed through this world, and desired to return to their homes. But unless they confess and say, 'Have mercy on us, Son of David,' and when Jesus asks, 'Do you believe that I am able to do this?' He responds: Indeed, Lord, he does not receive his former sight. In another Gospel, one blind man is written about, with torn clothes, sitting in Jericho, who is forbidden by the apostles to cry out; but through impudence, he receives healing (Mark 10). This passage properly pertains to the people of the Gentiles and should be explained in its own volume.", "lang": "english", "orig": ""}, {"v": 27, "f": "Jerome", "w": "", "t": "The miracles that had gone before of the ruler's daughter, and the woman with the issue of blood, are now followed by that of two blind men, that what death and disease had there witnessed, that blindness might now witness. And as Jesus passed thence, that is, from the ruler's house, there followed him two blind men, crying, and saying, Have mercy on us, thou Son of David.\n\nLet Marcion and Manichæus, and the other heretics who mangle the Old Testament, hear this, and learn that the Saviour is called the Son of David; for if He was not born in the flesh, how is He the Son of David?", "lang": "english", "orig": ""}, {"v": 27, "f": "John Chrysostom", "w": "", "t": "Wherefore can it be that He puts them off, and they crying out? Here again teaching us utterly to repel the glory that cometh from the multitude. For because the house was near, He leads them thither to heal them in private. And this is evident from the fact, that He charged them moreover to tell no man.\n\nBut this is no light charge against the Jews; when these men, though their eyes were struck out, receive the faith by hearing alone, but they beholding the miracles, and having their sight to witness what was happening, do all just contrary. And see their earnestness also, both by their cry, and by their prayer itself. For they did not merely approach Him, but with loud cries, and alleging nought else but \"mercy.\"\n\nAnd they called Him \"Son of David,\" because the name was thought to be honorable. In many passages, for instance, did the prophets likewise so call the kings, whom they wished to honor, and to declare great.", "lang": "english", "orig": ""}, {"v": 27, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And when Jesus departed thence, two blind men followed Him, crying, and saying, Thou Son of David, have mercy on us.  And when He had come into the house, the blind men came to Him: and Jesus says unto them, Believe ye that I am able to do this? They say unto Him, Yea, Lord. Then touched He their eyes, saying, According to your faith be it  unto you. And their eyes were opened.", "lang": "", "orig": ""}, {"v": 27, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And as they departed from Jericho, great multitudes followed Him. And, behold, two blind men sitting by the wayside, when they heard that Jesus passed by, cried out, saying, Have mercy on us, O Lord, Thou Son of David.", "lang": "", "orig": ""}, {"v": 27, "f": "Rabanus Maurus", "w": "", "t": "The house of the ruler is the Synagogue which was ruled by Moses; the house of Jesus is the heavenly Jerusalem. As the Lord passed through this world and was returning to His own house, two blind men followed Him; that is, when the Gospel was preached by the Apostles, many of the Jews and Gentiles began to follow Him. But when He ascended into Heaven, then He entered His house, that is, into the confession of one faith which is in the Catholic Church, and in that they were enlightened.", "lang": "english", "orig": ""}, {"v": 27, "f": "Remigius of Rheims", "w": "", "t": "Allegorically; By these two blind men are denoted the two nations of Jews and Gentiles, or the two nations of the Jewish race; for in the time of Roboam his kingdom was Split into two parts. Out of both nations such as believed on Him Christ gave sight to in the house, by which is understood the Church; for without the unity of the Church no man can be saved. And they of the Jews who had believed the Lord's coming spread the knowledge thereof throughout the whole earth.", "lang": "english", "orig": ""}, {"v": 27, "f": "Remigius of Rheims", "w": "", "t": "Rightly they call Him Son of David, because the Virgin Mary was of the line of David.", "lang": "english", "orig": ""}, {"v": 27, "f": "Theophylact of Ohrid", "w": "", "t": "\"And when Jesus departed thence, two blind men followed Him, crying, and saying, Thou Son of David, have mercy on us.\" The blind men addressed to God the words \"Have mercy,\" but as to a man, \"O Son of David.\" For it was well known among the Jews that the Messiah would come from the seed of David.", "lang": "english", "orig": ""}, {"v": 27, "f": "Thomas Aquinas", "w": "", "t": "After showing how he restored life, he now shows how he restored the functions of life. First, how he restored sight; secondly, speech (v. 32).\n\nIn regard to the first, four things are done: first, the request of the blind men; secondly, they are questioned (v. 28b); thirdly, they are heard (v. 29); fourthly, the charge given to the cured (v. 30b).\n\nIn regard to their petition we can note five things that make a petition likely to be heard.\n\nFirst, they chose a suitable time for asking, because as they were going away. In this is signified the time of the Incarnation, a time of mercy: \"It is time to show mercy\" (Ps 102:13). Therefore, they were heard more readily, as it says in Hebrews (5:7): \"He was heard for his reverence.\" Likewise, in order to obtain it, they followed him; for those who do not follow God by obeying do not obtain. Two blind men. Those two blind men are the two peoples, namely, the Jews and the gentiles, for those who do not have faith are blind. Of these Isaiah (59:10): \"We grope for the wall like the blind.\" Furthermore, fervent devotion is required, when it says, crying aloud: \"In my distress I cried to the Lord\" (Ps 120:1). Likewise, humility, when it says, \"Have mercy on us, son of David\": \"Hearken to the prayer of your servant, O Lord\" (Dan 9:17). Finally, their faith is mentioned, because they called him son of David; and this is necessary, as it says in James (1:6): \"Let him ask in faith, with no doubting.\"", "lang": "english", "orig": ""}, {"v": 28, "f": "Augustine - Confessions", "w": "Chapter XXIX.—Of the Two Blind Men and the Dumb Demoniac Whose Stories\nare Related Only by Matthew.", "t": "69. Matthew proceeds with his narrative in the following terms: “And when Jesus departed\nthence, two blind men followed Him, crying and saying, Thou son of David, have mercy\non us;” and so on, down to the verse wher

<style>
:root { --pri: #1a237e; --acc: #c62828; --bg: #f5f5f5; --card: #fff; --txt: #212121; --mut: #757575; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--txt); line-height: 1.6; }
.container { max-width: 1300px; margin: 0 auto; padding: 1.5rem; }
header { background: linear-gradient(135deg, #1a237e, #283593); color: white; padding: 2rem; text-align: center; border-radius: 12px; margin-bottom: 1.5rem; }
header h1 { font-size: 2.2rem; } header p { opacity: 0.8; }
.stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.stat { background: var(--card); padding: 1rem; border-radius: 10px; text-align: center; flex: 1; min-width: 100px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
.stat .num { font-size: 1.8rem; font-weight: 700; color: var(--pri); }
.stat .label { font-size: 0.7rem; color: var(--mut); text-transform: uppercase; }
.grid { display: grid; grid-template-columns: 5fr 3fr; gap: 1.5rem; }
@media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--card); border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 1.5rem; }
.card h2 { color: var(--pri); font-size: 1.1rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #e8eaf6; }
.verse-block { margin-bottom: 1rem; padding: 0.8rem; border: 1px solid #e0e0e0; border-radius: 8px; transition: border-color 0.2s; }
.verse-block:hover { border-color: var(--pri); }
.verse-line { margin-bottom: 0.3rem; }
.verse-line.main { font-size: 1rem; }
.verse-line.original { font-size: 0.95rem; color: #333; direction: rtl; font-family: 'SBL Hebrew', 'Ezra SIL', serif; }
.verse-line.greek { font-size: 0.92rem; color: #1b5e20; font-family: 'Noto Serif', Georgia, serif; direction: ltr; }
.verse-line.lxx { font-size: 0.88rem; color: #4a148c; font-family: 'Noto Serif', Georgia, serif; }
.trans-toggle { font-size: 0.7rem; cursor: pointer; color: var(--mut); margin-left: 0.3rem; user-select: none; }
.trans-toggle:hover { color: var(--pri); }
.verse-line.main.collapsed { display: none; }
.vnum { font-weight: 700; color: var(--acc); font-size: 0.8rem; margin-right: 0.3rem; }
.vlabel { font-size: 0.65rem; color: var(--mut); font-weight: 600; text-transform: uppercase; margin-right: 0.3rem; }
.verse-footer { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.4rem; flex-wrap: wrap; }
.vbtn { font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; border: 1px solid #ccc; background: #fafafa; cursor: pointer; transition: all 0.15s; }
.vbtn:hover { background: var(--pri); color: white; border-color: var(--pri); }
.vbtn.patr { background: #fce4ec; border-color: #e91e63; color: #880e4f; }
.vbtn.variant { background: #fff3e0; border-color: #ff9800; color: #e65100; }
.morph-word { display: inline; cursor: pointer; border-bottom: 1px dotted #999; }
.morph-word:hover { background: #bbdefb; border-radius: 3px; }
.word-tip { display: none; position: absolute; background: #333; color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.78rem; z-index: 50; max-width: 320px; line-height: 1.4; pointer-events: none; }
.popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3); z-index: 1000; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; }
.popup.show { display: block; } .popup h3 { color: var(--pri); margin-bottom: 0.8rem; }
.popup .close { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; color: var(--mut); }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; }
.overlay.show { display: block; }
.patr-item { margin-bottom: 0.8rem; padding: 0.7rem; background: #fce4ec; border-radius: 8px; border-left: 3px solid #c62828; }
.patr-item .father { font-weight: 700; color: #880e4f; font-size: 0.85rem; }
.patr-item .work { color: var(--mut); font-size: 0.75rem; font-style: italic; }
.patr-item .text { font-size: 0.85rem; margin-top: 0.3rem; }
.xref { display: inline-block; background: #e3f2fd; padding: 3px 10px; border-radius: 14px; margin: 3px; font-size: 0.78rem; color: #1565c0; cursor: pointer; position: relative; }
.xref:hover { background: #1565c0; color: white; }
.xref-tip { display: none; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; width: 280px; z-index: 50; line-height: 1.4; }
.xref:hover .xref-tip { display: block; }
.map-container img { max-width: 100%; border-radius: 8px; cursor: pointer; }
.map-container img.zoomed { position: fixed; top: 2%; left: 2%; width: 96%; height: 96%; object-fit: contain; z-index: 2000; background: white; border-radius: 0; }
.hint { font-size: 0.7rem; color: var(--mut); text-align: center; }
.chart-box { height: 220px; }
.timeline { padding-left: 1.5rem; border-left: 2px solid #c5cae9; }
.ev-item { position: relative; margin-bottom: 0.8rem; padding-left: 0.8rem; }
.ev-item::before { content: ''; position: absolute; left: -1.85rem; top: 0.5rem; width: 10px; height: 10px; background: var(--acc); border-radius: 50%; }
.ev-item .place { font-weight: 700; color: var(--pri); }
</style>

<script>
const D = {"book": "Mark", "chapter": 2, "version": "MorphGNT", "verses": [{"v": 1, "text": "Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·"}, {"v": 2, "text": "⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον."}, {"v": 3, "text": "καὶ ἔρχονται ⸂φέροντες πρὸς αὐτὸν παραλυτικὸν⸃ αἰρόμενον ὑπὸ τεσσάρων."}, {"v": 4, "text": "καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο."}, {"v": 5, "text": "⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι."}, {"v": 6, "text": "ἦσαν δέ τινες τῶν γραμματέων ἐκεῖ καθήμενοι καὶ διαλογιζόμενοι ἐν ταῖς καρδίαις αὐτῶν·"}, {"v": 7, "text": "Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;"}, {"v": 8, "text": "καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;"}, {"v": 9, "text": "τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;"}, {"v": 10, "text": "ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·"}, {"v": 11, "text": "Σοὶ λέγω, ⸀ἔγειρε ἆρον τὸν κράβαττόν σου καὶ ὕπαγε εἰς τὸν οἶκόν σου."}, {"v": 12, "text": "καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν."}, {"v": 13, "text": "Καὶ ἐξῆλθεν πάλιν παρὰ τὴν θάλασσαν· καὶ πᾶς ὁ ὄχλος ἤρχετο πρὸς αὐτόν, καὶ ἐδίδασκεν αὐτούς."}, {"v": 14, "text": "καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ."}, {"v": 15, "text": "Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ."}, {"v": 16, "text": "καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;"}, {"v": 17, "text": "καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς."}, {"v": 18, "text": "Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;"}, {"v": 19, "text": "καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·"}, {"v": 20, "text": "ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃."}, {"v": 21, "text": "⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται."}, {"v": 22, "text": "καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς."}, {"v": 23, "text": "Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας."}, {"v": 24, "text": "καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;"}, {"v": 25, "text": "καὶ ⸀λέγει αὐτοῖς· Οὐδέποτε ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε χρείαν ἔσχεν καὶ ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ;"}, {"v": 26, "text": "⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;"}, {"v": 27, "text": "καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·"}, {"v": 28, "text": "ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου."}], "parallel": {}, "patristic": [{"v": 1, "f": "Augustine of Hippo", "w": "", "t": "(de Con. Evan. ii. 25) But Matthew writes this miracle as if it were done in the city of the Lord, whilst Mark places it in Capernaum, which would be more difficult of solution, if Matthew had also named Nazareth. But seeing that Galilee itself might be called the city of the Lord, who can doubt but that the Lord did these things in His own city, since He did them in Capernaum, a city of Galilee; particularly as Capernaum was of such importance in Galilee as to be called its metropolis? Or else, Matthew passed by the things which were done after He came into His own city, until He came to Capernaum, and so adds on the story of the paralytic healed, subjoining, And, behold, they presented to him a man sick of the palsy, after he had said that He came into His own city.", "lang": "english", "orig": ""}, {"v": 1, "f": "Bede", "w": "", "t": "And again he entered Capernaum, etc. The Savior of all, God, with saving step, surveys all things. And sometimes in deserts, now in the city, now by the sea, he ministers to the crowds the gifts of heavenly doctrine and virtues. Sometimes he alone prays on the mount, sometimes he assists those laboring at sea so that they may not perish. Everywhere, he imparts the gifts of salvation, so that he demonstrates all ranks and conditions pertain to his grace. According to the mystical understanding, after performing a miracle in the city, he withdraws to the desert, and there receives the crowds coming to him with kind piety, to show that he prefers a quiet life, remote from the cares of the world, and, due to this pursuit, takes care to heal bodies. Indeed, in a human manner, as if avoiding the crowd seeking him, he did not want to enter the city openly. But allegorically, it teaches that truth does not exhibit an open manifestation of itself to tumultuous carnal minds, but generously infuses the light of its gifts to those whom it sees to be detached from the allurements of temporal things. Yet because heavenly piety does not forsake even the carnal, but also grants them the grace of its visitation, through which also they may become spiritual, the Lord returns to the city after the desert: speaking the word to many converging there, and by healing the paralytic, he provides many the occasion for internal healing which is in faith. Now, teaching the Lord and the house being so fu", "lang": "english", "orig": ""}, {"v": 1, "f": "Bede", "w": "", "t": "(in Marc. 1. 10) Because the compassion of God deserts not even carnal persons, He accords to them the grace of His presence, by which even they may be made spiritual. After the desert, the Lord returns into the city; wherefore it is said, And again he entered into Capernaum, &c.", "lang": "english", "orig": ""}, {"v": 1, "f": "Pseudo-Chrysostom", "w": "", "t": "(Vict. Aut. e Cat. in Marc.) Or else, Matthew called Capernaum His city because He went there frequently, and there did many miracles. It goes on: And it was noised that he was in the house, &c. For the desire of hearing Him was stronger than the toil of approaching Him.", "lang": "english", "orig": ""}, {"v": 1, "f": "Theophylact of Ohrid", "w": "", "t": "Upon the Lord's entrance into Capernaum, many, having heard that He was in a house, gathered in hope of convenient access to Him. At this, the faith of the men who brought the paralytic was so great that they broke through the roof of the house and lowered him down. Therefore the Lord also grants him healing, seeing the faith of those who brought him or the faith of the paralytic himself. For he himself would not have allowed them to take him if he did not believe that he would be healed. However, the Lord often healed on account of the faith of the one bringing, even though the one being brought was not a believer, and conversely, He often healed on account of the faith of the one being brought, even though those bringing him did not believe. First He forgives the sins of the sick man, and then heals the illness, because the most difficult diseases for the most part arise from sins, just as in the Gospel of John the Lord also traces the illness of a certain paralytic to sins. This paralytic mentioned in John is not the same as the one mentioned now; on the contrary, these are two different people. For the one mentioned in John had no one to help him, while this one has four; the first was at the Sheep Pool, while this one is in a house; that one was in Jerusalem, while this one is in Capernaum. One can find other differences between them as well. But it must be said that the one mentioned in Matthew (Matt. 9:2-7) and here in Mark is one and the same.", "lang": "english", "orig": ""}, {"v": 1, "f": "Theophylact of Ohrid", "w": "", "t": "This is not however the paralytic, whose cure is related by John, (John 5) for he had no man with him, this one had four; he is cured in the pool of the sheep market, but this one in a house. It is the same man, however, whose cure is related by Matthew (Matt. 9) and Mark. But mystically, Christ is still in Capernaum, in the house of consolation.", "lang": "english", "orig": ""}, {"v": 2, "f": "Bede", "w": "", "t": "(ubi sup.) Moreover, whilst the Lord is preaching in the house, there is not room for them, not even at the door, because whilst Christ is preaching in Judæa, the Gentiles are not yet able to enter to hear Him, to whom, however, though placed without, he directed the words of His doctrine by His preachers.", "lang": "english", "orig": ""}, {"v": 3, "f": "Bede", "w": "", "t": "Or else, because there are four virtues, by which a man is through an assured heart exalted so that he merits safety; which virtues some call prudence, fortitude, temperance, and justice. Again, they desire to bring the palsied man to Christ, but they are impeded on every side by the crowd which is between them, because often the soul desires to be renewed by the medicine of Divine grace, but through the sluggishness of the grovelling body is held back by the hindrance of old custom. Oftentimes amidst the very sweetnesses of secret prayer, and, as it may be called, the pleasant converse with God, a crowd of thoughts, cutting off the clear vision of the mind, shuts out Christ from its sight. Let us not then remain in the lowest ground, where the crowds are bustling, but aim at the roof of the house, that is, the sublimity of the Holy Scripture, and meditate on the law of the Lord.", "lang": "english", "orig": ""}, {"v": 3, "f": "Pseudo-Chrysostom", "w": "", "t": "After this, they introduce the paralytic, of whom Matthew and Luke speak; wherefore there follows: And they came unto him bearing one sick of the palsy, who was carried by four. Finding the door blocked up by the crowd, they could not by any means enter that way. Those who carried him, however, hoping that he could merit the grace of being healed, raising the bed with their burden, and uncovering the roof, lay him with his bed before the face of the Saviour. And this is that which is added: And when they could not lay him before him, &c.", "lang": "english", "orig": ""}, {"v": 3, "f": "Pseudo-Jerome", "w": "", "t": "Again, the palsy is a type of the torpor, in which man lies slothful in the softness of the flesh, though desiring health.", "lang": "english", "orig": ""}, {"v": 4, "f": "Theophylact of Ohrid", "w": "", "t": "But how should I be borne to Christ, if the roof be not opened. For the roof is the intellect, which is set above all those things which are within us; here it has much earth about it in the tiles which are made of clay, I mean, earthly things: but if these be taken away, the virtue of the intellect within us is freed from its load. After this let it be let down, that is, humbled. For it does not teach us to be puffed up, because our intellect has its load cleared away, but to be humbled still more.", "lang": "english", "orig": ""}, {"v": 5, "f": "Bede", "w": "", "t": "When Jesus saw their faith, etc. The Lord, about to cure a man of paralysis, first dissolved the bonds of sins, to show that he was condemned due to the bonds of sins by the dissolution of his limbs, and that he could not be restored to health in his limbs unless these bonds were relaxed. Likewise, to that paralytic, who was waiting in vain by the pool of Bethesda for the movement of the water for a long time, it is said by the Lord, healed: \"Behold, you have been made well; do not sin anymore, lest something worse happen to you.\" (John XIV).", "lang": "english", "orig": ""}, {"v": 5, "f": "Bede", "w": "", "t": "\"Son,\" he said, \"your sins are forgiven you.\" O wondrous humility! He calls \"son\" the despised and weak man, dissolved in all his limbs, whom the priests would not deign to touch. Or rightly \"son\" because his sins are forgiven him. It should indeed be considered how much the faith of each person is worth before God, since the faith of others was so great that a whole man, that is, was suddenly saved both outwardly and inwardly, and the errors of some were loosed by the merit of others.", "lang": "english", "orig": ""}, {"v": 5, "f": "Bede", "w": "", "t": "(ubi sup.) It may indeed be seen, how much each person's own faith weighs with God, when that of another had such influence that the whole man at once rose up, healed body and soul, and by one man's merit, another should have his sins forgiven him.", "lang": "english", "orig": ""}, {"v": 5, "f": "Bede", "w": "", "t": "(ubi sup.) Moreover, the Lord being about to cure the man of the palsy, first loosed the chains of his sins, in order to show that he was condemned to the loosening of his joints, because of the bonds of his sins, and could not be healed to the recovery of his limbs, unless these were first loosened. But Christ's wonderful humility calls this man, despised, weak, with all the joints of his limbs unstrung, a son, when the priests did not deign to touch him. Or at least, He therefore calls him a son, because his sins are forgiven him. It goes on: But there were certain of the scribes sitting there, and reasoning in their hearts, Why doth this man speak blasphemies?", "lang": "english", "orig": ""}, {"v": 5, "f": "CS Lewis", "w": "", "t": "For instance, He went about saying to people, \"I forgive your sins.\" Now it is quite natural for a man to forgive something you do to him. Thus if somebody cheats me out of £5 it is quite possible and reasonable for me to say, \"Well, I forgive him, we will say no more about it.\" What on earth would you say if somebody had done you out of £5 and I said, \"That is all right, I forgive him\"?", "lang": "english", "orig": ""}, {"v": 5, "f": "CS Lewis", "w": "", "t": "I could never see how one escaped the dilemma aut deus aut malus homo by confining oneself to the Synoptics. Moderns do not seem startled, as contemporaries were, by the claim Jesus there makes to forgive sins; not sins against Himself, just sins. Yet surely, if they actually met it, they would feel differently. If Dr Pittenger told me that two of his colleagues had lost him a professorship by telling lies about his character and I replied, \"I freely forgive them both\", would he not think this an impertinence (both in the old and in the modern sense) bordering on insanity?", "lang": "english", "orig": ""}, {"v": 5, "f": "CS Lewis", "w": "", "t": "One part of the claim tends to slip past us unnoticed because we have heard it so often that we no longer see what it amounts to. I mean the claim to forgive sins: any sins. Now unless the speaker is God, this is really so preposterous as to be comic. We can all understand how a man forgives offences against himself. You tread on my toes and I forgive you, you steal my money and I forgive you. But what should we make of a man, himself unrobbed and untrodden on, who announced that he forgave you for treading on other men's toes and stealing other men's money? Asinine fatuity is the kindest description we should give of his conduct. Yet this is what Jesus did. He told people that their sins were forgiven, and never waited to consult all the other people whom their sins had undoubtedly injured. He unhesitatingly behaved as if He was the party chiefly concerned, the person chiefly offended in all offences. This makes sense only if He really was the God whose laws are broken and whose love is wounded in every sin. In the mouth of any speaker who is not God, these words would imply what I can only regard as a silliness and conceit unrivalled by any other character in history.", "lang": "english", "orig": ""}, {"v": 5, "f": "John Chrysostom", "w": "", "t": "(non occ.) Further, He first healed by the remission of sins that which He had come to seek, that is, a soul, so that when they faithlessly doubted, then He might bring forward a work before them, and in this way His word might be confirmed by the work, and a hidden sign be proved by an open one, that is, the health of the soul by the healing of the body.", "lang": "english", "orig": ""}, {"v": 5, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For in proof that this is true, as I say, and the request was rather theirs, and that being ashamed they put forward their mother, mark how Christ directs His words to them.", "lang": "", "orig": ""}, {"v": 5, "f": "Pseudo-Chrysostom", "w": "", "t": "There follows: But when Jesus saw their faith, he said to the sick of the palsy, Son, thy sins be forgiven thee. He did not mean the faith of the sick man, but of his bearers; for it sometimes happens, that a man is healed by the faith of another.", "lang": "english", "orig": ""}, {"v": 5, "f": "Tertullian", "w": "", "t": "\"Thy faith,\" He would say, \"hath saved thee; \" and, \"Thy sins shall be remitted thee,\" on thy believing, of course, albeit thou be not yet baptized.", "lang": "english", "orig": ""}, {"v": 5, "f": "Theophylact of Ohrid", "w": "", "t": "He saw the faith of the sick man himself, since he would not have allowed himself to be carried, unless he had had faith to be healed.", "lang": "english", "orig": ""}, {"v": 5, "f": "Theophylact of Ohrid", "w": "", "t": "If therefore I, having the powers of my mind unstrung, remain, whenever I attempt any thing good without strength, as a palsied man, and if I be raised on high by the four Evangelists, and be brought to Christ, and there hear myself called son, then also are my sins quitted by me; for a man is called the son of God because he works the commandments.", "lang": "english", "orig": ""}, {"v": 6, "f": "Bede", "w": "", "t": "Now there were some of the scribes sitting there, thinking in their hearts, etc. The scribes speak truly, that no one can forgive sins but God alone, who through them also forgives, to whom He has granted the power to forgive. And therefore Christ is proved truly to be God because He can forgive sins like God. They bear true witness to God but are deceived by denying the person of Christ. The Jews thus err, who although they believe that Christ both is God and can forgive sins, yet do not believe that Jesus is the Christ. But the Arians err much more foolishly, who, while conquered by the words of the Gospel, do not dare to deny that Jesus is the Christ and that He can forgive sins, nevertheless they are not afraid to deny Him as God. But He, desiring to save the faithless, manifests Himself to be God by both the knowledge of hidden things and the power of deeds. For it follows: As soon as Jesus perceived in His spirit that they thus reasoned within themselves, He said to them: Why do you think these things in your hearts? He shows Himself to be God who can know the hidden things of the heart. And in a certain way, He speaks silently: With the same majesty and power by which I observe your thoughts, I can also forgive sins to men. Understand from yourselves what the paralytic gains. What is easier to say to the paralytic: \"Your sins are forgiven,\" or to say: \"Rise, take up your bed, and walk\"? There is a great difference between saying and doing. Whether the paralytic’s sins ", "lang": "english", "orig": ""}, {"v": 6, "f": "Theophylact of Ohrid", "w": "", "t": "The Pharisees accused the Lord of blasphemy because He forgave sins, since this belongs to God alone. But the Lord gave them yet another sign of His Divinity — the knowledge of their hearts, for the heart of each person is known to God alone, as the prophet also says: \"Thou alone knowest the hearts of all\" (3 Kings 8:39; 2 Chron. 6:30). Meanwhile the Pharisees, although the Lord revealed what was in their hearts, remain insensible, and do not concede to the One who knows their hearts that He is also able to heal sins.", "lang": "english", "orig": ""}, {"v": 7, "f": "1 Clement", "w": "Chapter VII.—Avoid the Docetæ, and persevere in fasting and prayer.", "t": "“For whosoever does not confess that Jesus Christ has come in the flesh, is antichrist;”41\nand whosoever does not confess the testimony of the cross,42 is of the devil; and whosoever\nperverts the oracles of the Lord to his own lusts, and says that there is neither a resurrection\nnor a judgment, he is the first-born of Satan.43 Wherefore, forsaking the vanity of many,\nand their false doctrines, let us return to the word which has been handed down to us from44\nthe beginning; “watching unto prayer,”45 and persevering in fasting; beseeching in our\n35\nsupplications the all-seeing God “not to lead us into temptation,”46 as the Lord has said:\n“The spirit truly is willing, but the flesh is weak.”47", "lang": "greek", "orig": ""}, {"v": 7, "f": "1 Clement", "w": "Chapter IX.—Reference to the history of Christ.", "t": "Stop your ears, therefore, when any one speaks to you at variance with308 Jesus Christ,\nthe Son of God, who was descended from David, and was also of Mary; who was truly begotten\nof God and of the Virgin, but not after the same manner. For indeed God and man are\nnot the same. He truly assumed a body; for “the Word was made flesh,”309 and lived upon\nearth without sin. For says He, “Which of you convicteth me of sin?”310 He did in reality\nboth eat and drink. He was crucified and died under Pontius Pilate. He really, and not merely\nin appearance, was crucified, and died, in the sight of beings in heaven, and on earth, and\nunder the earth. By those in heaven I mean such as are possessed of incorporeal natures; by\nthose on earth, the Jews and Romans, and such persons as were present at that time when\nthe Lord was crucified; and by those under the earth, the multitude that arose along with\nthe Lord. For says the Scripture, “Many bodies of the saints that slept arose,”311 their graves\nbeing opened. He descended, indeed, into Hades alone, but He arose accompanied by a\nmultitude; and rent asunder that means312 of separation which had existed from the beginning\nof the world, and cast down its partition-wall. He also rose again in three days, the\nFather raising Him up; and after spending forty days with the apostles, He was received up\nto the Father, and “sat down at His right hand, expecting till His enemies are placed under\nHis feet.”313 On the day of the preparation, then, at the thi", "lang": "greek", "orig": ""}, {"v": 7, "f": "1 Clement", "w": "Chapter V.—Their dangerous errors.", "t": "Some have ignorantly denied Him, and advocate falsehood rather than the truth. These\npersons neither have the prophecies persuaded, nor the law of Moses, nor the Gospel even\nto this day, nor the sufferings we have individually endured. For they think also the same\nthing regarding us. For what does it profit, if any one commends me, but blasphemes my\nLord, not owning Him to be God incarnate?526 He that does not confess this, has in fact\naltogether denied Him, being enveloped in death. I have not, however, thought good to\nwrite the names of such persons, inasmuch as they are unbelievers; and far be it from me\nto make any mention of them, until they repent.", "lang": "greek", "orig": ""}, {"v": 7, "f": "1 Clement", "w": "Chapter XVII.—The Jews sent persons through the whole earth to spread\ncalumnies on Christians.", "t": "“For other nations have not inflicted on us and on Christ this wrong to such an extent\nas you have, who in very deed are the authors of the wicked prejudice against the Just One,\nand us who hold by Him. For after that you had crucified Him, the only blameless and\nrighteous Man,— through whose stripes those who approach the Father by Him are healed,\n—when you knew that He had risen from the dead and ascended to heaven, as the prophets\nforetold He would, you not only did not repent of the wickedness which you had committed,\nbut at that time you selected and sent out from Jerusalem chosen men through all the land\nto tell that the godless heresy of the Christians had sprung up, and to publish those things\nwhich all they who knew us not speak against us. So that you are the cause not only of your\nown unrighteousness, but in fact of that of all other men. And Isaiah cries justly: ‘By reason\nof you, My name is blasphemed among the Gentiles.’222 And: ‘Woe unto their soul! because\nthey have devised an evil device against themselves, saying, Let us bind the righteous, for\nhe is distasteful to us. Therefore they shall eat the fruit of their doings. Woe unto the wicked!\nevil shall be rendered to him according to the works of his hands.’ And again, in other\nwords:223 ‘Woe unto them that draw their iniquity as with a long cord, and their transgressions\nas with the harness of a heifer’s yoke: who say, Let his speed come near; and let the\ncounsel of the Holy One of Israel come, that we may k", "lang": "greek", "orig": ""}, {"v": 7, "f": "1 Clement", "w": "Chapter XXV.—Plato’s knowledge of God’s eternity.", "t": "How, then, does Plato blame Homer for saying that the gods are not inflexible, although,\nas is obvious from the expressions used, Homer said this for a useful purpose? For it is the\nproperty of those who expect to obtain mercy by prayer and sacrifices, to cease from and\nrepent of their sins. For those who think that the Deity is inflexible, are by no means moved\nto abandon their sins, since they suppose that they will derive no benefit from repentance.\nHow, then, does Plato the philosopher condemn the poet Homer for saying, “Even the gods\nthemselves are not inflexible,” and yet himself represent the maker of the gods as so easily\nturned, that he sometimes declares the gods to be mortal, and at other times declares the\nsame to be immortal? And not only concerning them, but also concerning matter, from\nwhich, as he says, it is necessary that the created gods have been produced, he sometimes\nsays that it is uncreated, and at other times that it is created; and yet he does not see that he\nhimself, when he says that the maker of the gods is so easily turned, is convicted of having\nfallen into the very errors for which he blames Homer, though Homer said the very opposite\nconcerning the maker of the gods. For he said that he spoke thus of himself:—\n\n“For ne’er my promise shall deceive, or fail,\nOr be recall’d, if with a nod confirm’d.”795", "lang": "greek", "orig": ""}, {"v": 7, "f": "1 Clement", "w": "Preface.", "t": "3. For their system is blasphemous above all [others], since they represent that the Maker\nand Framer, who is one God, as I have shown, was produced from a defect or apostasy. They\nutter blasphemy, also, against our Lord, by cutting off and dividing Jesus from Christ, and\nChrist from the Saviour, and again the Saviour from the Word, and the Word from the\nOnly-begotten. And since they allege that the Creator originated from a defect or apostasy,\nso have they also taught that Christ and the Holy Spirit were emitted on account of this defect,\nand that the Saviour was a product of those Æons who were produced from a defect; so that\nthere is nothing but blasphemy to be found among them. In the preceding book, then, the\nideas of the apostles as to all these points have been set forth, [to the effect] that not only\ndid they, “who from the beginning were eye-witnesses and ministers of the word”1151 of\ntruth, hold no such opinions, but that they did also preach to us to shun these doctrines,1152\nforeseeing by the Spirit those weak-minded persons who should be led astray.1153", "lang": "greek", "orig": ""}, {"v": 7, "f": "Ambrose of Milan", "w": "", "t": "In their ministry of the forgiveness of sin, pastors do not exercise the right of some independent power. For not in their own name but in the name of the Father and the Son and the Holy Spirit do they forgive sins. They ask, the Godhead forgives. The service is enabled by humans, but the gift comes from the Power on high.", "lang": "english", "orig": ""}, {"v": 7, "f": "Chrysostom - Homilies on John", "w": "Homily XLII.", "t": "Now His meaning is like this: none of you hath either found fault about the persons\nhealed, as not being healed; nor hath said, that it is an evil thing to deliver one from a devil.\nFor though they had been ever so shameless, they could not have said this.", "lang": "greek", "orig": ""}, {"v": 7, "f": "Cyril of Alexandria", "w": "", "t": "CYRIL OF ALEXANDRIA.a; Now they accuse Him of blasphemy, anticipating the sentence of His death: for there was a command in the Law, that whosoever blasphemed should be put to death. And this charge they laid upon Him, because He claimed for Himself the divine power of remitting sins: wherefore it is added, Who can forgive sin, save God only? For the Judge of all alone has power to forgive sin.", "lang": "english", "orig": ""}, {"v": 7, "f": "Irenaeus", "w": "CHAPTER XIII.—DESCRIPTION OF THE GNOSTIC CONTINUED.", "t": "He never remembers those who have sinned against him, but forgives them. Wherefore\nalso he righteously prays, saying, “Forgive us; for we also forgive.”2791 For this also is one\nof the things which God wishes, to covet nothing, to hate no one. For all men are the work\nof one will. And is it not the Saviour, who wishes the Gnostic to be perfect as “the heavenly\nFather,”2792 that is, Himself, who says, “Come, ye children, hear from me the fear of the\nLord?”2793 He wishes him no longer to stand in need of help by angels, but to receive it\nfrom Himself, having become worthy, and to have protection from Himself by obedience.", "lang": "greek", "orig": ""}, {"v": 7, "f": "Irenaeus", "w": "", "t": "How can sins be rightly remitted unless the very One against whom one has sinned grants the pardon?", "lang": "english", "orig": ""}, {"v": 7, "f": "John Chrysostom", "w": "", "t": "They persecuted Jesus not only because he broke the Sabbath but also because he said that God was his Father, making himself equal with God, which is a far more drastic declaration. He confirmed this through his own actions.… The scribes themselves had devised this definition. They themselves had introduced the precept. They themselves had interpreted the law. But he proceeded to entangle them in their own words. In effect he said: It is you yourselves who have confessed that forgiveness of sins is given to God alone.", "lang": "english", "orig": ""}, {"v": 7, "f": "Novatian", "w": "", "t": "If Christ forgives sins, Christ must be truly God because no one can forgive sins but God alone.", "lang": "english", "orig": ""}, {"v": 7, "f": "Tertullian", "w": "Chapter XXIX.—It Was Christ that Died. The Father is Incapable of Suffering Either\nSolely or with Another. Blasphemous Conclusions Spring from Praxeas’ Premises.", "t": "Silence! Silence on such blasphemy. Let us be content with saying that Christ died, the\nSon of the Father; and let this suffice, because the Scriptures have told us so much. For even\nthe apostle, to his declaration—which he makes not without feeling the weight of it—that\n“Christ died,” immediately adds, “according to the Scriptures,”8175 in order that he may\nalleviate the harshness of the statement by the authority of the Scriptures, and so remove\noffence from the reader. Now, although when two substances are alleged to be in\nChrist—namely, the divine and the human—it plainly follows that the divine nature is immortal,\nand that which is human is mortal, it is manifest in what sense he declares “Christ\ndied”—even in the sense in which He was flesh and Man and the Son of Man, not as being\nthe Spirit and the Word and the Son of God. In short, since he says that it was Christ (that\nis, the Anointed One) that died, he shows us that that which died was the nature which was\nanointed; in a word, the flesh. Very well, say you; since we on our side affirm our doctrine\nin precisely the same terms which you use on your side respecting the Son, we are not guilty\nof blasphemy against the Lord God, for we do not maintain that He died after the divine\nnature, but only after the human. Nay, but you do blaspheme; because you allege not only\nthat the Father died, but that He died the death of the cross. For “cursed are they which are\nhanged on a tree,”8176—a curse which, after the law, is compa", "lang": "latin", "orig": ""}, {"v": 7, "f": "Tertullian", "w": "Chapter IV.—Repentance Applicable to All the Kinds of Sin. To Be Practised Not\nOnly, Nor Chiefly, for the Good It Brings, But Because God Commands It.", "t": "To all sins, then, committed whether by flesh or spirit, whether by deed or will, the same\nGod who has destined penalty by means of judgment, has withal engaged to grant pardon\nby means of repentance, saying to the people, “Repent thee, and I will save thee;”8440 and\nagain, “I live, saith the Lord, and I will (have) repentance rather than death.”8441 Repentance,\nthen, is “life,” since it is preferred to “death.” That repentance, O sinner, like myself (nay,\nrather, less than myself, for pre-eminence in sins I acknowledge to be mine8442), do you so\nhasten to, so embrace, as a shipwrecked man the protection8443 of some plank. This will\ndraw you forth when sunk in the waves of sins, and will bear you forward into the port of\nthe divine clemency. Seize the opportunity of unexpected felicity: that you, who sometime\nwere in God’s sight nothing but “a drop of a bucket,”8444 and “dust of the threshingfloor,”\n8445 and “a potter’s vessel,”8446 may thenceforward become that “tree which is sown\nbeside8447 the waters, is perennial in leaves, bears fruit at its own time,”8448 and shall not\nsee “fire,”8449 nor “axe.”8450 Having found “the truth,”8451 repent of errors; repent of having\nloved what God loves not: even we ourselves do not permit our slave-lads not to hate the\nthings which are offensive to us; for the principle of voluntary obedience8452 consists in\nsimilarity of minds.", "lang": "latin", "orig": ""}, {"v": 7, "f": "Tertullian", "w": "", "t": "Who, moreover, was able to forgive sins? This is His alone prerogative: for \"who remitteth sins but God alone? \" and, of course, (who but He can remit) mortal sins, such as have been committed against Himself, and against His temple? For, as far as you are concerned, such as are chargeable with offence against you personally, you are commanded, in the person of Peter, to forgive even seventy times sevenfold.", "lang": "english", "orig": ""}, {"v": 7, "f": "Tertullian (cont)", "w": "Chapter III.—An Objection Anticipated Before the Discussion Above Promised is\nCommenced.", "t": "But before doing this, I will make short work with an answer which meets us from the\nopposite side, in reference to that species of repentance which we are just defining as being\nwithout pardon. “Why, if,” say they, “there is a repentance which lacks pardon, it immediately\nfollows that such repentance must withal be wholly unpractised by you. For nothing\nis to be done in vain. Now repentance will be practised in vain, if it is without pardon. But\nall repentance is to be practised. Therefore let (us allow that) all obtains pardon, that it may\nnot be practised in vain; because it will not be to be practised, if it be practised in vain. Now,\nin vain it is practised, if it shall lack pardon.” Justly, then, do they allege (this argument)\nagainst us; since they have usurpingly kept in their own power the fruit of this as of other\nrepentance—that is, pardon; for, so far as they are concerned, at whose hands (repentance)\nobtains man’s peace, (it is in vain). As regards us, however, who remember that the Lord\nalone concedes (the pardon of) sins, (and of course of mortal ones,) it will not be practised\nin vain. For (the repentance) being referred back to the Lord, and thenceforward lying\nprostrate before Him, will by this very fact the rather avail to win pardon, that it gains it by\nentreaty from God alone, that it believes not that man’s peace is adequate to its guilt, that as\nfar as regards the Church it prefers the blush of shame to the privilege of communion. For\nbefore her doors i", "lang": "latin", "orig": ""}, {"v": 7, "f": "Tertullian (cont)", "w": "XXXI.—To Judges.", "t": "Consider the sayings of Solomon, all ye judges; in what way, with one word of his, he\ndisparages you. How gifts and presents corrupt the judges, thence, thence follows the law.\nYe always love givers; and when there shall be a cause, the unjust cause carries off the victory.\nThus I am innocent; nor do I, a man of no account, accuse you, because Solomon openly\nraises the blasphemy. But your god is your belly, and rewards are your laws. Paul the apostle\nsuggests this, I am not deceitful.", "lang": "latin", "orig": ""}, {"v": 7, "f": "Tertullian (cont)", "w": "Chapter LXIV.", "t": "But since he says, in addition to this, “What is this preference of sinners over others?”\nand makes other remarks of a similar nature, we have to reply that absolutely a sinner is not\npreferred before one who is not a sinner; but that sometimes a sinner, who has become\nconscious of his own sin, and for that reason comes to repentance, being humbled on account\nof his sins, is preferred before one who is accounted a lesser sinner, but who does not consider\nhimself one, but exalts himself on the ground of certain good qualities which he thinks he\npossesses, and is greatly elated on their account. And this is manifest to those who are\nwilling to peruse the Gospels in a spirit of fairness, by the parable of the publican, who said,\n“Be merciful to me a sinner,”3632 and of the Pharisee who boasted with a certain wicked\nself-conceit in the words, “I thank Thee that I am not as other men are, extortioners, unjust,\nadulterers, or even as this publican.”3633 For Jesus subjoins to his narrative of them both\nthe words: “This man went down to his house justified rather than the other: for every one\nthat exalteth himself shall be abased; and he that humbleth himself shall be exalted.”3634\nWe utter no blasphemy, then, against God, neither are we guilty of falsehood, when we teach\nthat every man, whoever he may be, is conscious of human infirmity in comparison with\nthe greatness of God, and that we must ever ask from Him, who alone is able to supply our\ndeficiencies, what is wanting to our (m", "lang": "latin", "orig": ""}, {"v": 7, "f": "npnf210", "w": "CHAPTER XVIII.", "t": "133. So, then, no one is without sin except God alone, for no one is without sin except\nGod.622 Also, no one forgives sins except God alone, for it is also written: “Who can forgive\nsins but God alone?”623 And one cannot be the Creator of all except he be not a creature,\nand he who is not a creature is without doubt God; for it is written: “They worshipped the\ncreature rather than the Creator, Who is God blessed for ever.”624 God also does not worship,\nbut is worshipped, for it is written: “Thou shalt worship the Lord thy God, and Him only\nshalt thou serve.”625", "lang": "greek", "orig": ""}, {"v": 8, "f": "Bede", "w": "", "t": "(ubi sup.) Who remits sin by those also to whom He has assigned the power of remitting, and therefore Christ is proved to be very God, for He is able to remit sins as God. The Jews then are in error, who although they hold the Christ both to be God, and to be able to remit sins, do not however believe that Jesus is the Christ. But the Arians err much more madly, who although overwhelmed with the words of the Evangelist, so that they cannot deny that Jesus is the Christ, and can remit sin, nevertheless fear not to deny that He is God. But He Himself, desiring to shame the traitors both by His knowledge of things hidden and by the virtue of His works, manifests Himself to be God. For there follows: And immediately when Jesus perceived in his spirit that they so reasoned, he said unto them, Why reason ye these things in your hearts? In which He shows Himself to be God, since He can know the hidden things of the heart; and in a manner though silent He speaks thus, With the same power and majesty, by which I look upon your thoughts, I can forgive the sins of men.", "lang": "english", "orig": ""}, {"v": 8, "f": "Hippolytus of Rome", "w": "", "t": "And these indeed are testimonies bearing on the incarnation of the Word; and there are also very many others. But let us also look at the subject in hand,-namely, the question, brethren, that in reality the Father's power, which is the Word, came down from heaven, and not the Father Himself. For thus He speaks: \"I came forth from the Father, and am come.\" Now what subject is meant in this sentence, \"I came forth from the Father,\" but just the Word? And what is it that is begotten of Him, but just the Spirit, that is to say, the Word? But you will say to me, How is He begotten? In your own case you can give no explanation of the way in which you were begotten, although you see every day the cause according to man; neither can you tell with accuracy the economy in His case. For you have it not in your power to acquaint yourself with the practised and indescribable art (method) of the Maker, but only to see, and understand, and believe that man is God's work. Moreover, you are asking an account of the generation of the Word, whom God the Father in His good pleasure begat as He willed. Is it not enough for you to learn that God made the world, but do you also venture to ask whence He made it? Is it not enough for you to learn that the Son of God has been manifested to you for salvation if you believe, but do you also inquire curiously how He was begotten after the Spirit? No more than two, in sooth, have been put in trust to give the account of His generation after the flesh; and", "lang": "english", "orig": ""}, {"v": 8, "f": "John Chrysostom", "w": "", "t": "The scribes asserted that only God could forgive sins, yet Jesus not only forgave sins, but showed that he had also another power that belongs to God alone: the power to disclose the secrets of the heart.", "lang": "english", "orig": ""}, {"v": 8, "f": "Tertullian", "w": "", "t": "Well, I on my side will first explain the reason of his offence, that I may the more easily explode the scandal of our heretic. Now, that the very Lord Himself of all might, the Word and Spirit of the Father, was operating and preaching on earth, it was necessary that the portion of the Holy Spirit which, in the form of the prophetic gift, had been through John preparing the ways of the Lord, should now depart from John, and return back again of course to the Lord, as to its all-embracing original.", "lang": "english", "orig": ""}, {"v": 8, "f": "Tertullian", "w": "", "t": "But if repentance is a thing human, its baptism must necessarily be of the same nature: else, if it had been celestial, it would have given both the Holy Spirit and remission of sins. But none either pardons sins or freely grants the Spirit save God only. Even the Lord Himself said that the Spirit would not descend on any other condition, but that He should first ascend to the Father.", "lang": "english", "orig": ""}, {"v": 9, "f": "Tertullian", "w": "", "t": "For thus it was that the Lord Jesus Christ showed His power: \"Why think ye evil in your hearts? For which is easier, to say to the paralytic, Thy sins are remitted thee; or, Rise and walk? Therefore, that ye may know the Son of man to have the power upon earth of remitting sins, I say to thee, paralytic, Rise, and walk.\" If the Lord set so much store by the proof of His power as to reveal thoughts, and so impart health by His command, lest He should not be believed to have the power of remitting sins; it is not lawful for me to believe the same power (to reside) in any one, whoever he be, without the same proofs.", "lang": "english", "orig": ""}, {"v": 9, "f": "Theophylact of Ohrid", "w": "", "t": "Then the Lord, through the healing of the body, confirms that He also healed the soul — that is, by means of what is manifest He establishes what is hidden, and by means of the easier He establishes the more difficult, although it seemed otherwise to them. For the Pharisees considered the healing of the body, as a visible act, to be more difficult, and the healing of the soul, as invisible, to be easier, and they reasoned as if to say: here is a deceiver who avoids the healing of the body, as something obvious, and heals the invisible soul, saying, \"Your sins are forgiven you.\" If He could really heal, then surely He would have healed the body and would not have resorted to what is invisible. Therefore the Savior, showing them that He can accomplish both the one and the other, says: which is easier to heal, the soul or the body? Without doubt, the body; but to you it seems the opposite. And so I will heal the body, which is in fact easy but only seems difficult to you, and thereby I will assure you of the healing of the soul, which is truly difficult but seems easy only because it is invisible and cannot be exposed.", "lang": "english", "orig": ""}, {"v": 9, "f": "Theophylact of Ohrid", "w": "", "t": "But though their thoughts were laid bare, still they remain insensible, refusing to believe that He who knew their hearts could forgive sins, wherefore the Lord proves to them the cure of the soul by that of the body, showing the invisible by the visible, that which is more difficult by that which is easier, although they did not look upon it as such. For the Pharisees thought it more difficult to heal the body, as being more open to view; but the soul more easy to cure, because the cure is invisible; so that they reasoned thus, Lo, He does not now cure the body, but heals the unseen soul; if He had had more power, He would at once have cured the body, and not have fled for refuge to the unseen world. The Saviour, therefore, showing that He can do both, says, Which is the easier? as if He said, I indeed by the healing of the body, which is in reality more easy, but appears to you more difficult, will prove to you the health of the soul, which is really more difficult.", "lang": "english", "orig": ""}, {"v": 10, "f": "Bede", "w": "", "t": "But that you may know that the Son of man has power, etc. If he is also God according to the Psalmist, who as far as the east is from the west has removed our transgressions from us, and the Son of man has power on earth to forgive sins, therefore he himself is both God and the son of man, so that Christ as man can forgive sins through the power of his divinity, and the same God Christ, through the frailty of his humanity, can die for sinners. Spiritually, to arise from the bed is to draw the soul, which lay sick due to carnal desires, away from them. But to take up the bed is to also subdue the flesh, corrected by the bridle of continence, and to separate it from earthly delights through the hope of heavenly rewards. To go home after taking up the bed is to return to paradise. For indeed, this is our true home, which first received man, not rightfully lost, but through deceit, ultimately restored by him who owed nothing to the deceitful enemy. Alternatively, the man who was healed carries the bed home, when the soul, having received the forgiveness of sins, returns with the body to the inner vigilance of itself, lest it admit anything after pardon for which it may be justly struck again. And immediately he rose, and taking up the bed, he went before all, so that all were amazed and glorified God, saying, \"We have never seen anything like this.\" How marvelous is the power of divine authority, where, without any intervening delay of time, the swift healing follows the command ", "lang": "english", "orig": ""}, {"v": 10, "f": "Bede", "w": "", "t": "(ubi sup.) A carnal sign therefore is given, that the spiritual sign may be proved, although it belongs to the same power to do away with the distempers of both soul and body; whence it follows: And immediately he arose, took up the bed, and went forth before them all.", "lang": "english", "orig": ""}, {"v": 10, "f": "John Chrysostom", "w": "", "t": "Whenever there was need to punish or to honor, to forgive sins or to make laws, Christ was fully authorized to do it. Whenever Christ had to do any of these much greater things, you will not characteristically find him praying or calling on his Father for assistance. All these things, as you discover in the text, he did on his own authority.", "lang": "english", "orig": ""}, {"v": 10, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But that you may know that the Son of Man has power to forgive sins upon the earth (then says He to the sick of the palsy), Arise, and take up your bed, and go unto your house.", "lang": "", "orig": ""}, {"v": 10, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And whereas, when He spoke unto the sick of the palsy, He spoke without clearly manifesting His own authority: for He said not, I forgive you your sins, but, your sins be forgiven you: upon their constraining, He discloses His authority more clearly, saying, But that you may know that the Son of Man has power on earth to forgive sins.", "lang": "", "orig": ""}, {"v": 10, "f": "Methodius of Olympus", "w": "", "t": "And it has seemed good to Thee, by means of our Lord and Creator, to fashion us again unto immortality; and Thou hast graciously given unto us a return to Paradise by means of Him who separated us from the joys of Paradise; and by means of Him who hath power to forgive sins Thou hast", "lang": "english", "orig": ""}, {"v": 10, "f": "Pseudo-Chrysostom", "w": "", "t": "(Vict. Ant. e Cat. in Marc.) And because it is easier to say than to do, there was still manifestly something to say in opposition, for the work was not yet manifested; wherefore He subjoins, But that ye may know, &c. as if He said, Since ye doubt my word, I will bring on a work which will confirm what was unseen. But He says in a marked manner, On earth to forgive sins, that He might show that He has joined the power of the divinity to the human nature by an inseparable union, because although He was made man, yet He remained the Word of God; and although by an economy He conversed on the earth with men, nevertheless He was not prevented from working miracles and from giving remission of sins. For His human nature did not in any thing take away from these things which essentially belonged to His Divinity, nor the Divinity hinder the Word of God from becoming on earth, according to the flesh, the Son of Man without change and in truth.", "lang": "english", "orig": ""}, {"v": 11, "f": "Ambrose of Milan", "w": "", "t": "He charged the man to perform an action of which health was the necessary condition, even while the patient was still praying for a remedy for his disease.… It was our Lord’s custom to require of those whom he healed some response or duty to be done.", "lang": "english", "orig": ""}, {"v": 11, "f": "Augustine of Hippo", "w": "", "t": "You have been a paralytic inwardly. You did not take charge of your bed. Your bed took charge of you.", "lang": "english", "orig": ""}, {"v": 11, "f": "Bede", "w": "", "t": "(ubi sup.) Or else, the sick man is let down after the roof is opened, because, when the Scriptures are laid open to us, we arrive at the knowledge of Christ, that is, we descend to His lowliness, by the dutifulness of faith. But by the sick man being let down with his bed, it is meant that Christ should be known by man, whilst yet in the flesh. But by rising from the bed is meant the soul's rousing itself from carnal desires, in which it was lying in sickness. To take up the bed is to bridle the flesh itself by the bands of continence, and to separate it from earthly pleasures, through the hope of heavenly rewards. But to take up the bed and to go home is to return to paradise. Or else the man, now healed, who had been sick carries back home his bed, when the soul, after receiving remission of sins, returns, even though encompassed with the body, to its internal watch over itself.", "lang": "english", "orig": ""}, {"v": 11, "f": "Clement of Alexandria", "w": "", "t": "But the good Instructor, the Wisdom, the Word of the Father, who made man, cares for the whole nature of His creature; the all-sufficient Physician of humanity, the Saviour, heals both body and soul. \"Rise up,\" He said to the paralytic; \"take the bed on which thou liest, and go away home;\" and straightway the infirm man received strength. And to the dead He said, \"Lazarus, go forth;\" and the dead man issued from his coffin such as he was ere he died, having undergone resurrection. Further, He heals the soul itself by precepts and gifts-by precepts indeed, in course of time, but being liberal in His gifts, He says to us sinners, \"Thy sins be forgiven thee.\"", "lang": "english", "orig": ""}, {"v": 11, "f": "Peter Chrysologus", "w": "", "t": "Take up your bed. Carry the very mat that once carried you. Change places, so that what was the proof of your sickness may now give testimony to your soundness. Your bed of pain becomes the sign of healing, its very weight the measure of the strength that has been restored to you.", "lang": "english", "orig": ""}, {"v": 11, "f": "Theophylact of Ohrid", "w": "", "t": "Then He says to the paralytic: \"Arise, take up your bed,\" so as to further confirm the reality of the miracle — that it was not imaginary — and at the same time to show that He not only healed the sick man but also gave him strength. So the Lord acts with the infirmities of the soul as well: He not only frees us from sins but also grants us strength for the fulfillment of the commandments. And so even I, a paralytic, can be healed. For even now Christ is in Capernaum, in the house of consolation — that is, in the Church, which is the house of the Comforter. I am paralyzed because the powers of my soul are inactive and immovable toward good; but when the four Evangelists take me up and bring me to the Lord, then I will hear His word: \"Child!\" For I become a son of God through the fulfillment of the commandments, and my sins will be forgiven. But how will they bring me to Jesus? By breaking through the roof. And what is the roof? The mind, as the summit of our being. Upon this roof there is much earth and tile — that is, earthly deeds; but when all this is cast off, when the power of the mind is broken open and freed from its burden, when I am then let down — that is, when I humble myself (for I must not be puffed up as a result of the lightening of my mind, but after being lightened I am obliged to descend, that is, to humble myself) — then I will be healed and will take up my bed, that is, my body, rousing it to the fulfillment of the commandments. For one must not only rise ", "lang": "english", "orig": ""}, {"v": 11, "f": "Theophylact of Ohrid", "w": "", "t": "Again, He says, Take up thy bed, to prove the greater certainty of the miracle, showing that it is not a mere illusion; and at the same time to show that He not only healed, but gave strength; thus He not only turns away souls from sin, but gives them the power of working out the commandments.", "lang": "english", "orig": ""}, {"v": 11, "f": "Theophylact of Ohrid", "w": "", "t": "It is necessary to take up also one's bed, that is the body, to the working of good. For then shall we be able to arrive at contemplation, so that our thoughts should say within us, never have we seen in this way before, that is never understood as we have done since we have been cured of the palsy; for he who is cleansed from sin, sees more purely.", "lang": "english", "orig": ""}, {"v": 12, "f": "Bede", "w": "", "t": "(ubi sup.) We are also informed, that many sicknesses of body arise from sins, and therefore perhaps sins are first remitted, that the causes of sickness being taken away, health may be restored. For men are afflicted by fleshly troubles for five causes, in order to increase their merits, as Job and the Martyrs; or to preserve their lowliness, as Paul by the messenger of Satan; or that they may perceive and correct their sins, as Miriam, the sister of Moses, and this paralytic; or for the glory of God, as the man born blind and Lazarus; or as the beginnings of the pains of damnation, as Herod and Antiochus. But wonderful is the virtue of the Divine power, where without the least interval of time, by the command of the Saviour, a speedy health accompanies His words. Wherefore there follows: Insomuch that they were all amazed. Leaving the greater thing, that is, the remission of sins, they only wonder at that which is apparent, that is, the health of the body.", "lang": "english", "orig": ""}, {"v": 12, "f": "Gospel of Peter", "w": "Section VII.", "t": "ke v. 26a.\n557 Matt. ix. 8b.\n558 Luke v. 26c.\n559 Mark ii. 12c.\n560 Luke v. 27.\n561 See above, note to § 6, 46.\n562 Luke v. 28.\n563 Luke v. 29.\n564 Luke v. 30.\n565 Luke v. 31.\n566 A Syriacism.\n567 Luke v. 32.\n568 Luke v. 33.\n569 Luke v. 34.\n570 T", "lang": "greek", "orig": ""}, {"v": 13, "f": "Bede", "w": "", "t": "(ubi sup.) After that the Lord taught at Capernaum, He went to the sea, that He might not only set in order the life of men in towns, but also might preach the Gospel of the kingdom to those who dwelt near the sea, and might teach them to despise the restless motions of those things which pass away like the waves of the sea, and to overcome them by the firmness of faith; wherefore it is said, And he went forth again to the sea, and all the multitude, &c.", "lang": "english", "orig": ""}, {"v": 13, "f": "Theophylact of Ohrid", "w": "", "t": "After performing the miracle on the paralytic, the Lord went away to the sea, probably seeking solitude, but the crowd gathers around Him again. Learn, then, that to the degree you flee from glory, it will pursue you; but if you pursue it, it will flee from you. Here the Lord had just withdrawn to the sea, and the people again run after Him.", "lang": "english", "orig": ""}, {"v": 13, "f": "Theophylact of Ohrid", "w": "", "t": "Or else, after the miracle, He goes to the sea, as if wishing to be alone, but the crowd runs to Him again, that thou mightest learn, that the more thou fliest from glory, the more she herself pursues thee; but if thou followest her, she will fly from thee.", "lang": "english", "orig": ""}, {"v": 14, "f": "Bede", "w": "", "t": "And as he passed by, he saw Levi, the son of Alphaeus, etc. At the custom house, he says to the care and duty of collecting taxes; for τέλος in Greek is called tax in Latin: moreover, the same Levi is also Matthew. But Luke and Mark, out of respect and honor for the evangelist, did not want to put the well-known name. However, Matthew himself, according to what is written, a righteous man is his own accuser: in the beginning of his discourse, he names himself Matthew and a publican; to show those reading that no one who is converted should despair of salvation, since from being a publican he was suddenly changed into an apostle, from a tax collector into an evangelist.", "lang": "english", "orig": ""}, {"v": 14, "f": "Bede", "w": "", "t": "And rising, he followed him. In the Gospel of Luke, it is written more fully: And leaving all, he rose and followed him (Luke 5). Therefore Matthew, understanding what it truly means to follow the Lord, leaves all things and follows. To follow indeed is to imitate. And so, in order to follow the poor Christ not so much in steps as in affection, he left what was his own, who was accustomed to seizing what belonged to others. And giving us a perfect form of renunciation of the world, he not only left the profits of taxes but also disregarded the danger that could come from the leaders of the world, because he left the accounts of the taxes unfinished and disordered. For he was led by such a great desire to follow the Lord that he retained no regard or thought for this life at all. Indeed, the Lord himself, who outwardly called him with human speech to follow him, inwardly kindled him with divine inspiration to follow immediately when called, and he taught invisibly how it ought to be followed. On account of this, he rightly became a faithful steward of the Lord's talents while abandoning human affairs with disdain.", "lang": "english", "orig": ""}, {"v": 14, "f": "Bede", "w": "", "t": "(i. 11. in Marc.) So also the same person is called Levi and Matthew; but Luke and Mark, on account of their reverence and the honour of the Evangelist, are unwilling to put the common name, while Matthew is a just accuser of himself, (Prov. 18. Vulg.) and calls himself Matthew and publican. He wishes to show to his hearers that no one who is converted should despair of his salvation, since he himself was suddenly changed from a publican into an Apostle. But he says that he was sitting at the 'teloneum,' that is, the place where the customs are looked after and administered. For 'telos' in Greek is the same as 'vectigal,' customs, in Latin.", "lang": "english", "orig": ""}, {"v": 14, "f": "Bede", "w": "", "t": "(ubi sup.) Now to follow is to imitate, and therefore in order to imitate the poverty of Christ, in the feeling of his soul even more than in outward condition, he who used to rob his neighbour's wealth, now leaves his own. And not only did he quit the gain of the customs, but he also despised the peril, which might come from the princes of this world, because he left the accounts of the customs imperfect and unsettled. For the Lord Himself, Who externally, by human language, called Him to follow, inflamed him inwardly by divine inspiration to follow Him the moment that He called him.", "lang": "english", "orig": ""}, {"v": 14, "f": "Eusebius of Caesarea", "w": "", "t": "The Apostle Matthew, if you consider his former life, did not leave a holy occupation, but came from those consumed with tax-gathering and overreaching one another.", "lang": "english", "orig": ""}, {"v": 14, "f": "John Chrysostom", "w": "", "t": "(non occ.) Now this is the same publican who is named by all the Evangelists; Matthew by Matthew; simply Levi by Luke; and Levi, the son of Alphæus, by Mark; for he was the son of Alphæus. And you may find persons with two names in other parts of Scripture; as Moses' father in law is sometimes called Jethro, sometimes Raguel.", "lang": "english", "orig": ""}, {"v": 14, "f": "Pseudo-Jerome", "w": "", "t": "Thus then Levi, which means Appointed, followed from the custom-house of human affairs, the Word, Who says, He who doth not quit all that he has, cannot be my disciple.", "lang": "english", "orig": ""}, {"v": 14, "f": "Tertullian", "w": "", "t": "Do you hesitate about arts, and trades, and about professions likewise, for the sake of children and parents? Even there was it demonstrated to us, that both \"dear pledges,\" and handicrafts, and trades, are to be quite left behind for the Lord's sake; while James and John, called by the Lord, do leave quite behind both father and ship; while Matthew is roused up from the toll-booth; while even burying a father was too tardy a business for faith.", "lang": "english", "orig": ""}, {"v": 14, "f": "Theophylact of Ohrid", "w": "", "t": "However, He departed from there as well, and along the way He caught Levi-Matthew. He who is now called Levi by Mark is Matthew, for he had two names. Therefore Luke and Mark, concealing his real name, call him Levi. But he himself is not ashamed; on the contrary, he openly says of himself: Jesus saw Matthew the tax collector (Mt. 9:9). So too let us not be ashamed to reveal our sins. Levi was sitting at the tax booth, occupied, as was his duty, either with collecting taxes from someone, or with drawing up accounts, or with something else that tax collectors usually did at their places of business. But now he proved so zealous for Christ that, leaving everything, he followed Him, and in great joy invited many to a meal.", "lang": "english", "orig": ""}, {"v": 14, "f": "Theophylact of Ohrid", "w": "", "t": "The Lord passing on from thence called Matthew; wherefore there follows, And as he passed by, he saw Levi the son of Alphæus sitting, &c.\n\nFor he sat at the receipt of custom, either, as is often done, exacting from some, or making up accounts, (λογοπραγῶν apud Theo.) or doing some actions of that sort, which publicans are wont to do in their abodes, yea this man, who was raised on high from this state of life that he might leave all things and follow Christ. Wherefore it goes on, And he saith to him, Follow me, &c.\n\nBut he who used to plot against others becomes so benevolent, that he invites many persons to eat with him. Wherefore it goes on; And it came to pass, that as Jesus sat at meat in his house.", "lang": "english", "orig": ""}, {"v": 15, "f": "Augustine - Confessions", "w": "Chapter XXVII.—Of the Feast at Which It Was Objected at Once that Christ Ate\nwith Sinners, and that His Disciples Did Not Fast; Of the Circumstance that the\nEvangelists Seem to Give Different Accounts of the Parties by Whom These\nObjections Were Alleged; And of the Question Whether Matthew and Mark and\nLuke are Also in Harmony with Each Other in the Reports Given of the Words\nof These Persons, and of the Replies Returned by the Lord.", "t": "is fully given, the idea\n925 Matt. ix. 10–17.\n926 Mark ii. 15.\n927 Luke v. 27–29.\n928 Matt. ix. 11.\n929 Mark ii. 16.\n\n\nsuggested being that they were partaking of a repast in company? Luke, on the other hand,\nseems to have recorded this scene somewhat different", "lang": "latin", "orig": ""}, {"v": 15, "f": "Bede", "w": "", "t": "And it happened that as He reclined in the house, many tax collectors, etc. The evangelist Luke writes that Levi held a great banquet for Him in his house, which aptly aligns with the figures of mysteries. For whoever receives Christ in the inner residence is nourished with the greatest delights of overflowing pleasures. Thus, the Lord willingly enters and reclines in the affection of the one who has believed. And this is the spiritual banquet of good works, at which the rich people are in need, and the poor feast. Tax collectors, as their name even shows, are called those who collect public taxes or those who are contractors of the treasury's taxes or public goods, as well as those who pursue the profits of this world through businesses, are designated by the same term. Therefore, the tax collector, having seen that by turning from sins to better things, he found a place of repentance, and for that reason, they also do not despair of salvation. Neither do the tax collectors who come to Jesus remain in their former vices, as the Pharisees and scribes, who grumble, but they repent, as the subsequent statement of the evangelist indicates, saying: \"For there were many who also followed Him.\" The Lord, however, went to the banquets of sinners so that He might have the opportunity to teach and offer spiritual food to His hosts. Finally, even though they often describe Him going to a banquet, nothing else is reported except what He did or taught there, so that both the humility of ", "lang": "english", "orig": ""}, {"v": 15, "f": "Bede", "w": "", "t": "(in Marc. i. 12) The persons here called publicans are those who exact the public customs, or men who farm the customs of the exchequer or of republics; moreover, those also, who follow after the gain of this world by business, are called by the same name. They who had seen that the publican, converted from his sins to better things, had found a place of pardon, even for this reason themselves also do not despair of salvation. And they come to Jesus, not remaining in their former sins, as the Pharisees and Scribes complain, but in penitence, as the following words of the Evangelist show, saying, For there were many who followed him. For the Lord went to the feasts of sinners, that he might have an opportunity of teaching them, and might set before his entertainers spiritual meats, which also is carried on in mystical figures. For he who receives Christ into his inward habitation is fed with the highest delights of overflowing pleasures. Therefore the Lord enters willingly, and takes up His abode in the affection of him who hath believed on Him; and this is the spiritual banquet of good works, which the rich cannot have, and on which the poor feast.", "lang": "english", "orig": ""}, {"v": 15, "f": "Tertullian", "w": "", "t": "Nor would the name of publicans have been so execrable in the eyes of the Lord, unless as being a \"strange\" name,-a (name) of such as put up the pathways of the very sky, and earth, and sea, for sale. Moreover, when (the writer) adjoins \"sinners\" to \"publicans,\" it does not follow that he shows them to have been Jews, albeit some may possibly have been so; but by placing on a par the one genus of heathens-some sinners by office, that is, publicans; some by nature, that is, not publicans-he has drawn a distinction between them.", "lang": "english", "orig": ""}, {"v": 15, "f": "Tertullian (cont)", "w": "Chapter IX.—Certain General Principles of Parabolic Interpretation. These Applied\nto the Parables Now Under Consideration, Especially to that of the Prodigal Son.", "t": "801 See Luke xv. 1, 2; Matt. ix. 10, 11; xi. 19; Mark ii. 15, 16; Luke v. 29, 30.\n802 See Acts x. 28; xi. 3.\n\n\nas it is comprised in the maintenance of discipline, we see is being subverted by that interpretation\nwhich is affected by the opposite side. For if", "lang": "latin", "orig": ""}, {"v": 15, "f": "Tertullian (cont)", "w": "Chapter IX.—Certain General Principles of Parabolic Interpretation. These Applied\nto the Parables Now Under Consideration, Especially to that of the Prodigal Son.", "t": "Now we must proceed, in the case of the prodigal son, to consider first that which is\nmore useful; for no adjustment of examples, albeit in the most nicely-poised balance, shall\nbe admitted if it shall prove to be most hurtful to salvation. But the whole system of salvation,\n799 Oehler refers to Deut. xxiii. 19; but the ref. is not satisfactory.\n800 Extraneum. Comp. such phrases as “strange children,” Ps. cxliv. 7, 11 (cxliii. 7, 11, in LXX.), and Hos. v.\n7; “strange gods,” etc.\n801 See Luke xv. 1, 2; Matt. ix. 10, 11; xi. 19; Mark ii. 15, 16; Luke v. 29, 30.\n802 See Acts x. 28; xi. 3.\n\n\nas it is comprised in the maintenance of discipline, we see is being subverted by that interpretation\nwhich is affected by the opposite side. For if it is a Christian who, after wandering\nfar from his Father, squanders, by living heathenishly, the “substance” received from God\nhis Father,—(the substance), of course, of baptism—(the substance), of course, of the Holy\nSpirit, and (in consequence) of eternal hope; if, stripped of his mental “goods,” he has even\nhanded his service over to the prince of the world803—who else but the devil?—and by him\nbeing appointed over the business of “feeding swine”—of tending unclean spirits, to wit—has\nrecovered his senses so as to return to his Father,—the result will be, that, not adulterers\nand fornicators, but idolaters, and blasphemers, and renegades, and every class of apostates,\nwill by this parable make satisfaction to the Father; and in this way (it ", "lang": "latin", "orig": ""}, {"v": 16, "f": "Augustine - Confessions", "w": "Chapter XXVII.—Of the Feast at Which It Was Objected at Once that Christ Ate\nwith Sinners, and that His Disciples Did Not Fast; Of the Circumstance that the\nEvangelists Seem to Give Different Accounts of the Parties by Whom These\nObjections Were Alleged; And of the Question Whether Matthew and Mark and\nLuke are Also in Harmony with Each Other in the Reports Given of the Words\nof These Persons, and of the Replies Returned by the Lord.", "t": "ii. 15.\n927 Luke v. 27–29.\n928 Matt. ix. 11.\n929 Mark ii. 16.\n\n\nsuggested being that they were partaking of a repast in company? Luke, on the other hand,\nseems to have recorded this scene somewhat differently. For his version proceeds thus: “But\ntheir scribes", "lang": "latin", "orig": ""}, {"v": 16, "f": "Bede", "w": "", "t": "And the scribes and Pharisees seeing that he was eating with sinners, etc. If through Matthew’s choosing and calling the faith of the publicans is expressed of the gentiles, who first coveted the gain of the world, but now are refreshed with the Lord at the feast of charity and with diligent devotion of good works, surely the pride of the scribes and Pharisees indicates the envy of the Jews, troubled about the salvation of the gentiles. He speaks to them: Amen I say to you, that the publicans and prostitutes will precede you into the kingdom of God.—Hearing this Jesus said to them: The healthy do not need a physician, but those who are ill. For I did not come to call the righteous but sinners. He reproaches the scribes and Pharisees, who, thinking themselves righteous, shunned the company of sinners. He calls himself a physician, who by a marvelous kind of healing was wounded for our iniquities, and by his bruises we are healed (Isaiah 53). Moreover, he calls healthy and righteous those who, ignorant of God's righteousness, and wanting to establish their own, have not subjected themselves to the righteousness of God (Romans 10); who, presuming on the law, do not seek the g

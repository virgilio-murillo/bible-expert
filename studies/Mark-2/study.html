v. Michigan", "desc": "El testimonio más antiguo de las cartas de Pablo. Incluye Hebreos entre Romanos y 1 Corintios, sugiriendo que se consideraba paulina. Faltan las Pastorales.", "reliability": "Altamente confiable. Texto alejandrino temprano. Su antigüedad (c.200) lo hace crucial para reconstruir el texto original paulino.", "validators": "Frederic Kenyon (1936), Günther Zuntz (The Text of the Epistles, 1953)"}, "P66": {"name": "Papiro 66 (Bodmer II)", "date": "c. 200", "year": 200, "origin": "Egipto", "olat": 26.1, "olng": 32.7, "disc_place": "Panópolis (Akhmim), Egipto", "dlat": 26.6, "dlng": 31.7, "disc_date": "1952", "content": "Evangelio de Juan (casi completo, 1:1-6:11, 6:35-14:26)", "type": "Mixto (Alejandrino/Occidental)", "location": "Fundación Bodmer, Cologny (Ginebra)", "desc": "Uno de los testimonios más antiguos del Evangelio de Juan. Contiene correcciones del mismo escriba, mostrando el proceso de copia. Texto mixto entre alejandrino y occidental.", "reliability": "Muy confiable por antigüedad. Las autocorrecciones del escriba muestran cuidado textual. Confirma la existencia temprana del texto joánico.", "validators": "Victor Martin (editio princeps 1956), Gordon Fee (análisis textual 1968)"}, "P75": {"name": "Papiro 75 (Bodmer XIV-XV)", "date": "c. 175-225", "year": 190, "origin": "Egipto", "olat": 26.1, "olng": 32.7, "disc_place": "Panópolis (Akhmim), Egipto", "dlat": 26.6, "dlng": 31.7, "disc_date": "1952", "content": "Lucas 3-24 y Juan 1-15", "type": "Alejandrino", "location": "Biblioteca Vaticana (donado 2007)", "desc": "El papiro más cercano al Codex Vaticanus (B). Demuestra que el texto alejandrino NO es una revisión tardía sino que existía ya en el s.II. Escriba muy cuidadoso.", "reliability": "Extremadamente confiable. Considerado el mejor testigo temprano del texto alejandrino. Su concordancia con B (s.IV) prueba la estabilidad de esta tradición textual.", "validators": "Victor Martin y Rodolphe Kasser (1961), Carlo Martini (análisis 1966), Kurt Aland"}, "ℵ": {"name": "Codex Sinaiticus (Aleph/01)", "date": "c. 330-360", "year": 345, "origin": "Cesarea o Egipto", "olat": 31.2, "olng": 34.3, "disc_place": "Monasterio de Santa Catalina, Sinaí", "dlat": 28.5, "dlng": 33.9, "disc_date": "1844-1859", "content": "NT completo + gran parte del AT (LXX) + Epístola de Bernabé + Pastor de Hermas", "type": "Alejandrino", "location": "British Library, Londres", "desc": "Descubierto por Constantin von Tischendorf en el Monasterio de Santa Catalina (Sinaí). Es el único manuscrito uncial con el NT completo. Incluye libros que luego no entraron al canon (Bernabé, Hermas). Tiene múltiples correctores de diferentes siglos.", "reliability": "Altamente confiable. Uno de los dos pilares del texto alejandrino (junto con B). Su NT completo lo hace indispensable. Las correcciones posteriores muestran la historia de la transmisión textual.", "validators": "Tischendorf (editio princeps 1862), Kirsopp Lake (facsímil 1911), Milne & Skeat (Scribes and Correctors, 1938), D.C. Parker (Codex Sinaiticus Project, 2009)"}, "B": {"name": "Codex Vaticanus (03)", "date": "c. 325-350", "year": 340, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Biblioteca Vaticana (registrado desde 1475)", "dlat": 41.9, "dlng": 12.5, "disc_date": "antes de 1475", "content": "AT (LXX) + NT hasta Hebreos 9:14 (faltan Pastorales, Filemón, Apocalipsis)", "type": "Alejandrino", "location": "Biblioteca Apostólica Vaticana, Roma", "desc": "Considerado por muchos el manuscrito más importante del NT. Texto alejandrino puro y consistente. En la Biblioteca Vaticana desde al menos 1475 pero no fue accesible a eruditos hasta el s.XIX. Tischendorf solo pudo verlo brevemente.", "reliability": "El más confiable según la mayoría de críticos textuales. Su concordancia con P75 (s.II) demuestra que preserva un texto muy antiguo. Base principal del texto NA28/UBS5.", "validators": "Carlo Vercellone (1868), Tischendorf (colación 1867), Kurt Aland, Bruce Metzger, Bart Ehrman"}, "A": {"name": "Codex Alexandrinus (02)", "date": "c. 400-440", "year": 420, "origin": "Egipto o Constantinopla", "olat": 31.2, "olng": 29.9, "disc_place": "Donado al rey Carlos I de Inglaterra", "dlat": 51.5, "dlng": -0.1, "disc_date": "1627", "content": "AT + NT casi completos (faltan partes de Mt, Jn, 2 Cor). Incluye 1-2 Clemente", "type": "Bizantino (Evangelios), Alejandrino (resto)", "location": "British Library, Londres", "desc": "Donado por el Patriarca de Constantinopla Cirilo Lukaris al rey Carlos I en 1627. Texto bizantino en los Evangelios pero alejandrino en Hechos, Epístolas y Apocalipsis. Mejor testigo del Apocalipsis.", "reliability": "Confiable pero con distinción: en Evangelios refleja texto bizantino (secundario), en el resto es alejandrino (primario). Crucial para el Apocalipsis donde B no existe.", "validators": "Patrick Young (primer editor parcial, 1633), Frederic Kenyon (facsímil 1909), Kurt Aland"}, "C": {"name": "Codex Ephraemi Rescriptus (04)", "date": "c. 450", "year": 450, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Biblioteca Nacional de Francia", "dlat": 48.8, "dlng": 2.3, "disc_date": "s. XVII", "content": "Fragmentos de AT y NT (palimpsesto)", "type": "Mixto", "location": "Bibliothèque nationale de France, París", "desc": "Palimpsesto: el texto bíblico fue borrado en el s.XII y reescrito con sermones de Efrén el Sirio. Tischendorf logró descifrar el texto inferior con reactivos químicos (1840-1845). Solo sobrevive ~60% del NT.", "reliability": "Moderadamente confiable. Texto mixto. Valioso donde otros testigos faltan. El proceso de desciframiento introduce incertidumbre en algunas lecturas.", "validators": "Tischendorf (editio princeps 1843-1845), Robert Lyon (1959)"}, "D": {"name": "Codex Bezae (05)", "date": "c. 400", "year": 400, "origin": "Sur de Francia o Norte de África", "olat": 43.6, "olng": 3.9, "disc_place": "Donado por Teodoro de Beza a Cambridge", "dlat": 52.2, "dlng": 0.1, "disc_date": "1581", "content": "Evangelios + Hechos (bilingüe griego-latín)", "type": "Occidental", "location": "Cambridge University Library", "desc": "Manuscrito bilingüe (griego-latín) con el texto occidental más importante. En Hechos es ~10% más largo que el alejandrino, con adiciones narrativas únicas. Muchas lecturas singulares que no aparecen en ningún otro manuscrito.", "reliability": "Controversial. Preserva tradiciones muy antiguas (s.II) pero también contiene armonizaciones y expansiones. Valioso como testigo independiente del texto occidental. No se usa como base pero sus lecturas se consideran caso por caso.", "validators": "Teodoro de Beza (donación 1581), F.H.A. Scrivener (1864), J. Rendel Harris (1891), D.C. Parker (Codex Bezae, 1992)"}, "W": {"name": "Codex Washingtonianus (032)", "date": "c. 400-450", "year": 425, "origin": "Egipto", "olat": 30.0, "olng": 31.2, "disc_place": "Comprado por Charles Freer en Egipto", "dlat": 38.9, "dlng": -77.0, "disc_date": "1906", "content": "Evangelios", "type": "Mixto (varía por sección)", "location": "Smithsonian Institution, Washington D.C.", "desc": "Texto que cambia de carácter según la sección (alejandrino en Lc 1:1-8:12, occidental en Mc 1:1-5:30, bizantino en Mt). Contiene el \"Logion de Freer\" después de Mc 16:14, una adición única.", "reliability": "Confiable pero complejo. Cada sección debe evaluarse según su tipo textual. El cambio de tipo sugiere que fue copiado de múltiples ejemplares.", "validators": "Henry Sanders (editio princeps 1912), Larry Hurtado (Text-Critical Methodology, 1981)"}, "TR": {"name": "Textus Receptus", "date": "1516-1633", "year": 1516, "origin": "Basilea, Suiza", "olat": 47.6, "olng": 7.6, "disc_place": "Publicado por Erasmo de Rotterdam", "dlat": 47.6, "dlng": 7.6, "disc_date": "1516", "content": "NT completo (texto impreso, no manuscrito)", "type": "Bizantino tardío", "location": "Múltiples ediciones", "desc": "No es un manuscrito sino un texto impreso. Erasmo lo compiló en 1516 basándose en unos pocos minúsculos tardíos (s.XII-XIII) disponibles en Basilea. El nombre \"Textus Receptus\" viene de la edición Elzevir de 1633. Base de la KJV y la RVR antigua.", "reliability": "Superado por la crítica textual moderna. Se basa en manuscritos tardíos y en algunos lugares Erasmo retrotradujo del latín al griego. Sin embargo, en la gran mayoría del texto coincide con manuscritos más antiguos.", "validators": "Erasmo de Rotterdam (1516), Robert Estienne/Stephanus (1550), Elzevir (1633). Criticado por Westcott-Hort (1881), defendido parcialmente por Maurice Robinson (Byzantine Priority)"}}, "greek_commentaries": {"1": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:1] . Thereading of [4] [5] [6] (W.H [7] ) with εἰσελθὼν for εἰσῆλθεν in T. R., and omitting καὶ before ἠκούσθη , gives a ruggedly anacolouthistic construction (&ldquo;and entering again into Capernaum after days it was heard that He was at home&rdquo;), which the T. R. very neatly removes. The construction of the sentence, even as it stands in the critically approved text, may be made smoother by taking ἠκούσθη not impersonally, but as referring to Jesus. He entering, etc., was heard of as being at home (Schanz and Holtzmann alternatively). πάλιν , again, a second time, [Mark 1:21] mentioning the first. He has not been there apparently since He left it ([Mark 1:35] ) on the preaching tour in Galilee. διʼ ἡμερῶν , after days, cf. [Galatians 2:1] ; classical examples of this use of διὰ in Wetstein and Elsner. The expression suggests a short period, a few days, which seems too short for the time required for the preaching tour, even if it had been cut short by hostile influence, as is not improbable. The presence of scribes at this scene is very significant. They appear hostile in attitude on Christ&rsquo;s"}, {"src": "hac", "name": "Alford's Greek Testament", "text": "1. ] δι ʼ ἡμερῶν , after an interval of some days: see reff. εἰς οἶκον , in doors ; as εἰς ἀγρόν , to the country , ch. [Mark 16:12] : = εἰς τὸν οἶκον , εἰς τὸν ἀγρόν , the practice of omitting the art. after a preposition being universal, and apparently regulated by no assignable rule. See examples in Middleton, ch. vi. § 1, which however in later Greek are by no means limited to the class of nouns there mentioned, but are found with nouns of all classes of meaning. The εἰς combines motion with the construction, &lsquo;that he had gone home, and was there.&rsquo;"}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:1] . Πάλιν , again ) Comp. ch. [Mark 1:21] ; [Mark 1:29] . δἰ ἡμέρων ) After some days had intervened. [ It is one and the same return into the city of Capernaum, of which Mark makes mention in this place after the healing of the leper; Matthew, after the return from the region of the Gergesenes, in his ch. [Mark 9:1] : it is also the same man sick of the palsy, whom Mark and Luke, after Matthew, treat of . Harm., p. 276]."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Again into Capernaum after some days ( παλιν εις Καφαρναουμ δι' ημερων ). After the first tour of Galilee when Jesus is back in the city which is now the headquarters for the work in Galilee. The phrase δι' ημερων means days coming in between ( δια, δυο , two) the departure and return. In the house ( εν οικω ). More exactly, at home , in the home of Peter, now the home of Jesus. Another picture directly from Peter's discourse. Some of the manuscripts have here εις οικον , illustrating the practical identity in meaning of εν and εις (Robertson, Grammar, pp. 591-6). It was noised ( ηκουσθη ). It was heard (first aorist, passive indicative from ακουω , to hear). People spread the rumour, \"He is at home, he is indoors.\""}, {"src": "vws", "name": "Vincent's Word Studies", "text": "It was noised [ ηκουσθη] . Lit., It was heard. That he was in the house [ οτι εις οικον εστιν] . The oti, that, is recitative, introducing the report in the direct form. It was reported - he is in the house ! The preposition in is literally into, carrying the idea of the motion preceding the stay in the house. \"He has gone into the house, and is there.\" But the best texts read ejn oikw, in the house. The account of this rumor is peculiar to Mark. He preached [ ελαλει] . Lit., spake, as Rev. Imperfect tense. He was speaking when the occurrence which follows took place."}], "2": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:2] . συνήχθησαν πολλοὶ : with the extraordinary incidents of some weeks or months ago fresh in their memory, a great gathering of the townspeople was inevitable. ὥστε , etc.: the gathering was phenomenal; not only the house filled, but the space round about the door crowded no room for more people even there ( μηδὲ ), not to speak of within. τὸν λόγον : the phrase has a secondary sound, as if an echo of the speech of the apostolic church, but the meaning is plain. Jesus was preaching the gospel of the kingdom when the following incident happened. Preaching always first."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "2. ] In this verse we have again the peculiar minute depicting of Mark. Wordsw. believes &ldquo;these minute notices … to be recorded by the Evangelist with a studied design, lest it should be supposed that, because he incorporates so much which is in St. Matthew&rsquo;s Gospel, he was only a copyist: and in order to shew that he did so because he knew from ocular testimony that St. Matthew&rsquo;s narrative was adequate and accurate.&rdquo; I mention this, to shew to what shifts the advocates of the theory of the &ldquo;interdependence&rdquo; of the Evangelists are now reduced. μηκέτι … μηδέ ] so that not even the parts towards the door (much less the house) would any longer hold them (they once sufficed to hold them). ἐλάλει , in the strict imperfect sense: He was speaking to them the word, when that which is about to be related happened."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:2] . Μηδὲ , not even ) Not only the house within, but not even the hall, could contain them."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "So that there was no longer room for them, no, not even about the door ( ωστε μηκετ χωρειν μηδε τα προς την θυραν ). Another graphic Markan detail seen through Peter's eyes. The double compound negative in the Greek intensifies the negative. This house door apparently opened into the street, not into a court as in the larger houses. The house was packed inside and there was a jam outside. And he spake the word unto them ( κα ελαλε αυτοις τον λογον ). And he was speaking the word unto them, Mark's favourite descriptive imperfect tense ( ελαλε ). Note this word λαλεω about the preaching of Jesus (originally just sounds like the chatter of birds, the prattling of children, but here of the most serious kind of speech. As contrasted with λεγω (to say) it is rather an onomatopoetic word with some emphasis on the sound and manner of speaking. The word is com- mon in the vernacular papyri examples of social inter-course."}], "3": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:3] . ἔρχονται : historic present with lively effect. The arrival creates a stir. φέροντες : this may mean more than the four who actually carried the sick man ( ὑπὸ τεσσάρων ), friends accompanying. The bearers might be servants (Schanz)."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:3] . Ὑπὸ τεσσαρων , by four ) He was then fall grown, though not far advanced in years: comp. [Mark 2:5] , Son [implying he was not old]."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "And they come ( κα ερχοντα ). Fine illustration of Mark's vivid dramatic historical present preserved by Luke [Luke 5:18], but not by [Matthew 9:2] (imperfect). Borne by four ( αιρομενον υπο τεσσαρων ). Another picturesque Markan detail not in the others."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Born of four. A detail peculiar to Mark."}], "4": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:4] . The particulars in this verse not in Mt., who did not care how they found their way to Jesus; enough for him that they succeeded somehow . προσεγγίσαι (T. R.): here only in N. T. to approach; προσενέγκαι (W.H [8] ), to bring near (the sick man understood) to Him, Jesus. ἀπεστέγασαν τ . σ ., removed the roof, to which they would get access by an outside stair either from the street or from the court. ὅπου ἦν , where He was; where was that? in an upper room (Lightfoot and Vitringa), or in a room in a one-storied house (Holtz., H. C.), or not in a room at all, but in the atrium or compluvium , the quadrangle of the house (Faber, Archäol. , Jahn, Archäol. ). In the last-mentioned case they would have to remove the parapet (battlement, [Deuteronomy 22:8] ) and let the man down into the open space. ἐξορύξαντες : not something additional to but explanatory of ἀπεστέγασαν = they unroofed by digging through the material tiles, laths, and plaster. κράβαττον : a small portable couch, for the poor, for travellers, and for sick people; condemned by Phryn., p. 62; σκίμπους the correct word. Latin grabatus , which may have led Mk. to use the term in the text. [8] Westcott and Hort."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:4] . Ἀπεστέγασαν ) they took off the roof ) out of love, without doing injury. [ So faith penetrates through all obstacles ( Mar 2:5 ) to reach Christ . V. g.] It is probable that it was a cottage [tugurium, hut ], not a large house. ἐξορύξαντες , digging out ) the ceiling, beneath the tiles of the roof, so as to make a large aperture. The people crowding in numbers, had caused great delay in reaching Christ."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Come nigh ( προσεγγισα ). But Westcott and Hort read προσενεγκα , to bring to, after Aleph, B, L, 33, 63 (cf. [John 5:18]). They uncovered the roof ( απεστεγασαν την στεγην ). They unroofed the roof (note paronomasia in the Greek and cognate accusative). The only instance of this verb in the N.T. A rare word in late Greek, no papyrus example given in Moulton and Milligan Vocabulary. They climbed up a stairway on the outside or ladder to the flat tile roof and dug out or broke up ( εξορυξαντες ) the tiles (the roof). There were thus tiles ( δια των κεραμων , [Luke 5:19]) of laths and plaster and even slabs of stone stuck in for strength that had to be dug out. It is not clear where Jesus was ( οπου ην ), either downstairs, (Holtzmann) or upstairs (Lightfoot), or in the quadrangle (atrium or compluvium, if the house had one). \"A composition of mortar, tar, ashes and sand is spread upon the roofs, and rolled hard, and grass grows in the crevices. On the houses of the poor in the country the grass grows more freely, and goats may be seen on the roofs cropping it\" (Vincent). They let down the bed ( χαλωσ τον κραβαττον ), historical present again, aorist tense in [Luke 5:19] ( καθηκαν ). The verb means to lower from a higher place as from a boat. Probably the four men had a rope fastened to each corner of the pallet or poor man's bed ( κραβαττον , Latin grabatus. So one of Mark's Latin words). Matthew ([Matthew 9:2]) has κλινη , general term for bed. Luke has κλινιδιον (little bed or couch). Mark's word is common in the papyri and is spelled also κραββατος , sometimes κραβατος , while W, Codex Washingtonius, has it κραββατον ."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Come nigh unto him [ προσεγγισαι] . The word does not occur elsewhere in the New Testament. But some read prosenegkai bring him unto him. So Rev., in margin. They uncovered [ απεστεγασαν] . The only use of the word in New Testament. Broken it up [ εξορυξαντες] . Lit., scooped it out. Very graphic and true to fact. A modern roof would be untiled or unshingled; but an oriental roof would have to be dug to make such an opening as was required. A composition of mortar, tar, ashes, and sand is spread upon the roofs, and rolled hard, and grass grows in the crevices. On the houses of the poor in the country the grass grows more freely, and goats may be seen on the roofs cropping it. In some cases, as in this, stone slabs are laid across the joists. See [Luke 5:19], where it is said they let him down through the tiles; so that they would be obliged, not only to dig through the grass and earth, but also to pry up the tiles. Compare [Psalms 79:6]. The bed [ κραβαττον] . One of Mark's Latin words, grabatus, and condemned by the grammarians as inelegant. A rude pallet, merely a thickly padded quilt or mat, held at the corners, and requiring no cords to let it down. They could easily reach the roof by the steps on the outside, as the roof is low; or they could have gone into an adjoining house and passed along the roofs. Some suppose that the crowd was assembled in an upper chamber, which sometimes extended over the whole area of the house. It is not possible accurately to reproduce the details of the scene. Dr. Thomson says that Jesus probably stood in the lewan or reception - room, a hall which is entered from the court or street by an open arch; or he may have taken his stand in the covered court in front of the house itself, which usually has open arches on three sides, and the crowd was around and in front of him."}], "5": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:5] . τὴν πίστιν α ., their faith, that of the bearers, shown by their energetic action, the sick man not included ( οὐ τὴν πίστιν τοῦ παραλελυμένου ἀλλὰ τῶν κομισάντων , Victor Ant., Cramer, Cat.). τέκνον , child, without the cheering θάρσει of Mt."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:5] . Πίστιν , their faith ) So painstaking."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Their faith ( την πιστιν αυτων ). The faith of the four men and of the man himself. There is no reason for excluding his faith. They all had confidence in the power and willingness of Jesus to heal this desperate case. Are forgiven ( αφιεντα , aoristic present passive, cf. punctiliar action, Robertson's Grammar, pp. 864ff.). So [Matthew 9:3], but [Luke 5:20] has the Doric perfect passive αφεωντα . The astonishing thing both to the paralytic and to the four friends is that Jesus forgave his sins instead of healing him. The sins had probably caused the paralysis."}], "6": [{"src": "rwp", "name": "Robertson's Word Pictures", "text": "Sitting there, and reasoning in their hearts ( εκε καθημενο κα διαλογιζομενο εν ταις καρδιαις αυτων ). Another of Mark's pictures through Peter's eyes. These scribes (and Pharisees, [Luke 5:21]) were there to cause trouble, to pick flaws in the teaching and conduct of Jesus. His popularity and power had aroused their jealousy. There is no evidence that they spoke aloud the murmur in their hearts, \"within themselves\" ([Matthew 9:3]). It was not necessary, for their looks gave them away and Jesus knew their thoughts ([Matthew 9:4]) and perceived their reasoning ([Luke 5:22]). Instantly Jesus recognized it in his own spirit ( ευθυς επιγνους ο Ιησους τω πνευματ αυτου , [Mark 2:8]). The Master at once recognizes the hostile atmosphere in the house. The debate ( διαλογιζομενο ) in their hearts was written on their faces. No sound had come, but feeling did."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Reasoning [ διαλογιζομενοι] . The word dialogue is derived from this, and the meaning literally is, that they held a dialogue with themselves."}], "7": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:7] . τί οὗτος οὕτω λάλει ; βλασφημεῖ . This reading of [9] [10] [11] [12] is far more life-like than that of the T. R., which exemplifies the tendency of copyists to smooth down into commonplace whatever is striking and original = why does this person thus speak? He blasphemes. The words suggest a gradual intensification of the fault-finding mood: first a general sense of surprise, then a feeling of impropriety, then a final advance to the thought: why, this is blasphemy! It was nothing of the kind. What Jesus had said did not necessarily amount to more than a declaration of God&rsquo;s willingness to forgive sin to the penitent. They read the blasphemy into it. [9] Codex Sinaiticus (sæc. iv.), now at St. Petersburg, published in facsimile type by its discoverer, Tischendorf, in 1862. [10] Codex Vaticanus (sæc. iv.), published in photographic facsimile in 1889 under the care of the Abbate Cozza-Luzi. [11] Codex Bezae [12] Codex Regius--eighth century, represents an ancient text, and is often in agreement with א and B."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "7. οὗτος οὕτως ] The first word depreciates: the second exaggerates."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "He blasphemeth ( βλασφημε ). This is the unspoken charge in their hearts which Jesus read like an open book. The correct text here has this verb. They justify the charge with the conviction that God alone has the power ( δυνατα ) to forgive sins. The word βλασφημεω means injurious speech or slander. It was, they held, blasphemy for Jesus to assume this divine prerogative. Their logic was correct. The only flaw in it was the possibility that Jesus held a peculiar relation to God which justified his claim. So the two forces clash here as now on the deity of Christ Jesus. Knowing full well that he had exercised the prerogative of God in forgiving the man's sins he proceeds to justify his claim by healing the man."}], "8": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:8] . εὐθὺς ἐπιγνοὺς : Jesus read their thoughts at once , and through and through ( ἐπὶ ). τῷ πνεύματι , by His spirit , as distinct from the ear, they having said nothing."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "8. ] The knowledge was immediate and supernatural , as is most carefully and precisely here signified."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:8] . Τῷ πνεύματι Αὐτοῦ , in His Spirit ) The prophets became cognisant of things through the Spirit of God, but not with their own spirit: Christ, with His own Spirit, which is omniscient and Divine; comp ch. [Mark 8:12] . Moreover, the Holy Spirit is not called the Spirit of Christ before that great Pentecost recorded in [Acts 2:0] The conclusion therefore remains, that we are to understand the Spirit of Jesus as applying to His Divine nature, which had its dwelling in His human nature. τὶ , why ) An allusion to their Why? in [Mark 2:7] ."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Perceived [ επιγνους] . The preposition ejpi gives the force of fully. He was not only immediately aware of their thought, but clearly and fully aware."}], "9": [{"src": "vws", "name": "Vincent's Word Studies", "text": "Walk [ περιπατει] . Lit., walk about."}], "10": [{"src": "rwp", "name": "Robertson's Word Pictures", "text": "That ye may know ( ινα ειδητε ). The scribes could have said either of the alternatives in verse [Mark 2:9] with equal futility. Jesus could say either with equal effectiveness. In fact Jesus chose the harder first, the forgiveness which they could not see. So he now performs the miracle of healing which all could see, that all could know that (the Son of Man, Christ's favourite designation of himself, a claim to be the Messiah in terms that could not be easily attacked) he really had the authority and power ( εξουσιαν ) to forgive sins. He has the right and power here on earth to forgive sins, here and now without waiting for the day of judgment. He saith to the sick of the palsy ( λεγε ). This remarkable parenthesis in the middle of the sentence occurs also in [Matthew 9:6] and [Luke 5:24], proof that both Matthew and Luke followed Mark's narrative. It is inconceivable that all three writers should independently have injected the same parenthesis at the same place."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Power [ εξουσιαν] ; or better, authority, as Rev., in margin. The word is derived from exesti, it is permitted or lawful. It combines the ideas of right and might. Authority or right is the dominant meaning in the New Testament."}], "11": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:11] . σοὶ λέγω , I say to thee, a part of Christ&rsquo;s speech to the man in Mk., not likely to have been so really; laconic speech, the fewest words possible, characteristic of Jesus. ἔγειρε , means something more than age (Fritzsche) = come, take up thy bed. Jesus bids him do two things, each a conclusive proof of recovery: rise , then go to thy house on thine own feet, with thy sick-bed on thy shoulder."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "11. σοὶ λ . ] The stress is on σοί . The words are precisely those used , as so often in Mark, and denote the turning to the paralytic and addressing him. There may have been something in his state, which required the emphatic address."}], "12": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:12] tells how the man did as bidden, to the astonishment of all spectators. πάντας , all, without exception, scribes included? (Kloster.) It might have been so had the sentence stopped there. For no doubt the scribes were as much astonished as their neighbours at what took place. But they would not join in the praise to God which followed. οὕτως οὐδέποτε εἰδομεν : elliptical, but expressive, suited to the mental mood = so we never saw, i.e. , we never saw the like. N.B. The title &ldquo;Son of Man&rdquo; occurs in this narrative for the first time in Mk.&rsquo;s Gospel; vide on [Matthew 8:20] ; [Matthew 9:6] ."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Before them all ( εμπροσθεν παντων ). [Luke 5:25] follows Mark in this detail. He picked up ( αρας ) his pallet and walked and went home as Jesus had commanded him to do ([Mark 2:11]). It was an amazing proceeding and made it unnecessary for Jesus to refute the scribes further on this occasion. The amazement ( εξιστασθα , our ecstasy, as [Luke 5:26] has it), was too general and great for words. The people could only say: \"We never saw it on this fashion\" ( Hουτως ουδεποτε ειδαμεν ). Jesus had acted with the power of God and claimed equality with God and had made good his claim. They all marvelled at the paradoxes ( παραδοξα , [Luke 5:26]) of that day. For it all they glorified God."}], "13": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:13] interrupts the continuity of the history. It states that Jesus went out again ( cf. [Mark 1:16] ) alongside ( παρὰ ) the sea, that the multitude followed Him, and that He taught them. A very vague general notice, serving little other purpose than to place an interval between the foregoing and following incidents."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "13. πάλιν ] See ch. [Mark 1:16] . On τὸν τοῦ Ἀλφαίου see notes, [Matthew 13:55] ; and [Matthew 10:1] ff."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "By the seaside ( παρα την θαλασσαν ). A pretty picture of Jesus walking by the sea and a walk that Jesus loved ([Mark 1:16]; [Matthew 4:18]). Probably Jesus went out from the crowd in Peter's house as soon as he could. It was a joy to get a whiff of fresh air by the sea. But it was not long till all the crowd began to come to Jesus ( ηρχετο , imperfect) and Jesus was teaching them ( εδιδασκεν , imperfect). It was the old story over again, but Jesus did not run away."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Resorted - taught [ ηρχετο - εδιδασκεν] . The imperfects are graphic - kept coming, kept teaching."}], "14": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:14] . Λευῒν . Levi, the son of Alphaeus, the name here and in Lk. different from that given in first gospel, but the incident manifestly the same, and the man therefore also; Levi his original name, Matthew his apostle name. Mk. names Matthew in his apostle list ([Mark 3:18] ), but he fails to identify the two, though what he states about Levi evidently points to a call to apostleship similar to that to the four fishermen ([Mark 1:16] ; [Mark 1:20] ). The compiler of the first Gospel, having Mk. before him, and, noticing the omission, substituted the name Matthew for Levi, adding to it λεγόμενον ([Mark 9:9] ) to hint that he had another name. ἀκολούθει μοι : a call to apostleship (in terms identical in all three Synoptics), and also to immediate service in connection with the mission to the publicans ( vide on Mt.)."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:14] . [17] ΤΕΛΏΝΙΟΝ , the receipt of custom ) At the sea; [Mark 2:13] . [17] Comp. on this history, note on [Matthew 9:9] . E. B."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "And as he passed by ( κα παραγων ). Present participle active, was passing by. Jesus was constantly on the alert for opportunities to do good. An unlikely specimen was Levi (Matthew), son of Alpheus, sitting at the toll-gate ( τελωνιον ) on the Great West Road from Damascus to the Mediterranean. He was a publican ( τελωνης ) who collected toll for Herod Antipas. The Jews hated or despised these publicans and classed them with sinners ( αμαρτωλο ). The challenge of Jesus was sudden and sharp, but Levi (Matthew) was ready to respond at once. He had heard of Jesus and quickly decided. Great decisions are often made on a moment's notice. Levi is a fine object lesson for business men who put off service to Christ to carry on their business."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "See on [Matthew 9:9]."}], "15": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:15] . ἐν τῇ οἰκίᾳ αὐτου : whose house? Not perfectly clear, but all things point to that of Levi. There is no mention of a"}, {"src": "hac", "name": "Alford's Greek Testament", "text": "15. ] The entertainment was certainly in Levi&rsquo;s house, not as Meyer, alli [6] ., in that of our Lord , which last is a pure fiction, and is not any where designated in the Gospel accounts. Certainly the καλέσαι , [Mark 2:17] , gives no countenance to the view. Our Lord, and those following Him as disciples, were ordinarily entertained where He was invited, which will account for ἠκολοὐθουν αὐτῷ : and the change of subject in the two, αὐτόν and αὐτοῦ , is no uncommon thing: see a similar change in [Luke 19:3] , where to be consistent Meyer ought to understand ὅτι τῇ ἡλ . μικ . ἦν of our Lord. To help out his interpretation he strangely enough makes καλέσαι , [Mark 2:17] , mean &lsquo; to invite .&rsquo; [6] alli= some cursive mss. ἦσαν γὰρ … αὐτῷ , peculiar to Mark."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:15] . [18] Ἦσαν γὰρ , for they were ) The Evangelist hereby explains why he had just written, with Jesus and His disciples; for they were many. [18] Λευῒν Levi ) called also Matthew. V. g."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "His house. Levi 's. See [Luke 5:29]."}], "16": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:16] . ἔλεγον : the scribes advance from thinking ([Mark 2:6] ) to speaking ; not yet, however, to Jesus but about Him to His disciples. They note, with disapproval, His kindly relations with &ldquo;sinners&rdquo;. The publicans and other disreputables had also noted the fact. The story of the palsied man and the &ldquo;blasphemous&rdquo; word, &ldquo;thy sins be forgiven thee,&rdquo; had got abroad, making them prick up their ears, and awakening decided interest in these tabooed circles, in the &ldquo;Blasphemer&rdquo;."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "16. ] ἰδόντες αὐτ . ἐσθ ., having observed Him eating ; but not to be literally pressed. The question was after the feast , at which, being in the house of a Publican, they were not present ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:16] . [19] Τὶ ὅτι ) So the LXX.; [Judges 11:7] , etc. [19] [Mark 2:15] . Καὶ ἠκολούθησαν , and they were following ) Therefore even then already with reformed minds they were holding to [entering upon] the right way. V. g."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "The scribes of the Pharisees ( ο γραμματεις των Φαρισαιων ). This is the correct text. Cf. \"their scribes\" in [Luke 5:30]. Matthew gave a great reception ( δοχην , [Luke 5:29]) in his house ([Mark 2:15]). These publicans and sinners not simply accepted Levi's invitation, but they imitated his example \"and were following Jesus\" ( κα ηκολουθουν αυτω ). It was a motly crew from the standpoint of these young theologues, scribes of the Pharisees, who were on hand, being invited to pick flaws if they could. It was probably in the long hall of the house where the scribes stood and ridiculed Jesus and the disciples, unless they stood outside, feeling too pious to go into the house of a publican. It was an offence for a Jew to eat with Gentiles as even many of the early Jewish Christians felt ([Acts 11:3]) and publicans and sinners were regarded like Gentiles ([1 Corinthians 5:11])."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Scribes and Pharisees. But the best texts read grammateiv twn Farisaiwn, scribes of the Pharisees. So Rev. Scribes belonging to the sect of the Pharisees. They had followed him into the hall where the company were seated. This hall answered to the k'hawah of Arabian houses, which is thus described by William Gifford Palgrave : \"The k'hawah was a long, oblong hall about twenty feet in height, fifty in length, and sixteen or thereabouts in breadth. The walls were covered in a rudely decorative manner with brown and white wash, and sunk here and there into small triangular recesses, destined to the reception of books, lamps, and other such like objects. The roof was of timber, and flat; the floor was strewn with fine, clean sand, and garnished all round alongside of the walls with long strips of carpet, upon which cushions, covered with faded silk, were disposed at suitable intervals. In poorer houses, felt rugs usually take the place of carpets\" (\" Central and Eastern Arabia \")."}], "17": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:17] . καλέσαι : to call, suggestive of invitations to a feast (Fritzsche, Meyer, Holtz.), and making for the hypothesis that Jesus, not Matthew, was the real host at the social gathering: the whole plan His, and Matthew only His agent; vide notes on Mt. He called to that particular feast as to the feast of the kingdom, the one a means to the other as the end. δικαίους , ἁμαρτωλούς : Jesus preferred the company of the sinful to that of the righteous, and sought disciples from among them by preference. The terms are not ironical. They simply describe two classes of society in current language, and indicate with which of the two His sympathies lay."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "The righteous ( δικαιους ). Jesus for the sake of argument accepts the claim of the Pharisees to be righteous, though, as a matter of fact, they fell very far short of it. Elsewhere ([Mark 2:23]) Jesus shows that the Pharisees were extortionate and devoured widows' houses and wore a cloak of pride and hypocritical respectability. The words \"unto repentance\" ( εις μετανοιαν ) are not genuine in Mark, but are in [Luke 5:32]. Jesus called men to new spiritual life and away from sin and so to repentance. But this claim stopped their mouths against what Jesus was doing. The well or the strong ( ισχυοντες ) are not those who need the physician in an epidemic."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "They that are whole [ οι ισχυοντες] . Lit., they that are strong. See on [Luke 14:30], was not able; and [2 Peter 2:11], power. No need. The Greek order throws the emphasis on these words : No need have they that are strong of a physician. Wyc., Whole men have no need to a leech, but they that have evil."}], "18": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:18] . καὶ , and , connection purely topical, another case of conflict. ἦσαν νηστεύοντες , either: were wont to fast (Grotius, Fritzsche, Schanz, etc.), or, and this gives more point to the story: were fasting at that particular time (Meyer, Weiss, Holtz., H. C.). ἔρχονται καὶ λέγ ., they come and say, quite generally; they = people, or some representatives of John&rsquo;s disciples, and the Pharisees."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "18. καὶ ἦσαν κ . τ . λ .] Mark here gives a notice for the information of his readers, as in ch. [Mark 7:3] , which places shew that his Gospel was not written for the use of Jews. It appears from this account, which is here the more circumstantial, that the Pharisees and disciples of John asked the question in the third person , as of others . In Matt. it is the disciples of John , and they join ἡμεῖς καὶ οἱ Φαρ . In Luke, it is the Pharisees and Scribes , and they ask as here. Me [7] . understands it, that the disciples of John and the Pharisees were at that particular time keeping a fast , and that this gave occasion to the question. The verb subst. with the part. may mean this, and Mark himself apparently uses it so, ch. [Mark 10:32] , and [Mark 14:4] : but much more frequently it describes a practice or state, e.g. ἦν γὰρ ἔχων κτήματα πολλά , [Matthew 19:22] , οἱ ἀστ . ἔσονται ἐκ τ . οὐρ . πίπτοντες , ch. [Mark 13:25] . See also ch. [Mark 1:6] ; [Mark 1:22] ; [Mark 1:39] . I cannot think that the fact of their being at that time keeping a fast would be thus expressed: it certainly would be further specified . [7] Meyer."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:18] . Νηστεύοντες , fasting ) This seems here to imply both their custom and their actual fasting at that present time; comp. note on [Matthew 9:14] ."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "John's disciples and the Pharisees were fasting ( ησαν ο μαθητα Ιωανου κα ο Φαρισαιο νηστευοντες ). The periphrastic imperfect, so common in Mark's vivid description. Probably Levi's feast happened on one of the weekly fast-days (second and fifth days of the week for the stricter Jews). So there was a clash of standpoints. The disciples of John sided with the Pharisees in the Jewish ceremonial ritualistic observances. John was still a prisoner in Machaerus. John was more of an ascetic than Jesus ([Mark 2:18]; [Luke 7:33-35]), but neither one pleased all the popular critics. These learners ( μαθητα ) or disciples of John had missed the spirit of their leader when they here lined up with the Pharisees against Jesus. But there was no real congeniality between the formalism of the Pharisees and the asceticism of John the Baptist. The Pharisees hated John who had denounced them as broods of vipers. Here the disciples of John and the disciples of the Pharisees ( ο μαθητα Ιωανου κα ο μαθητα των Φαρισαιων ) join in criticizing Jesus and his disciples. Later we shall see Pharisees, Sadducees, and Herodians, who bitterly detested each other, making com- mon cause against Jesus Christ. So today we find various hostile groups combining against our Lord and Saviour. See on [Matthew 9:14-17] for comments. Matthew has here followed Mark closely."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "And of the Pharisees. But the of is wrong. Read as Rev., John's disciples and the Pharisees. Used to fast [ ησαν νηστευοντες] . The A. V. refers to the fact as a custom; but Mark means that they were observing a fast at that time. Hence the use of the participle with the finite verb. Rev., correctly, were fasting. The threefold repetition of the word fast is characteristic of Mark. See Introduction."}], "19": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:19] . μὴ δύνανται etc.: the question answers itself, and is allowed to do so in Mt. and Lk. Mk. at the expense of style answers it formally in the negative. ὅσον χρόνον , etc. For all this the Syriac Vulgate has a simple no ."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "19. ὅσον … νηστεύειν ] This repetition, contained neither in Matt. nor Luke , is inconsistent with the design of an abridger; and sufficiently shews the primary authority of this report, as also the ἐν ἐκείνῃ τῇ ἡμ . [Mark 2:20] . St. Mark especially loves these solemn repetitions: cf. ch. [Mark 9:42] ff. It is strange to see such a Commentator as De Wette calling the ἐν ἐκείνῃ τῇ ἡμ . a proof of carelessness . It is a touching way, as Meyer well observes, of expressing &lsquo;in that atra dies .&rsquo;"}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "The sons of the bridechamber ( ο υιο του νυμφωνος ). Not merely the groomsmen, but the guests also, the παρανψμφς ( παρανυμφο of the old Greek). Jesus here adopts the Baptist's own metaphor ([John 3:29]), changing the friend of the bridegroom ( ο φιλος του νυμφιου ) to sons of the bridechamber. Jesus identifies himself with the bridegroom of the O.T. ([Hosea 2:21]), God in his covenant relation with Israel (Swete). Mourning does not suit the wedding feast. Mark, Matthew, and Luke all give the three parables (bridegroom, unfulled cloth, new wineskins) illustrating and defending the conduct of Jesus in feasting with Levi on a Jewish fast-day. [Luke 5:36] calls these parables. Jesus here seems iconoclastic to the ecclesiastics and revolutionary in emphasis on the spiritual instead of the ritualistic and ceremonial."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Children of the bride - chamber [ υιοι του νυμφωνος] . More correctly as Rev., sons. It is noteworthy that Christ twice uses a figure drawn from marriage in his allusions to John the Baptist, the ascetic. Compare [John 3:29]. The sons of the bride - chamber are different from the groomsmen. They are the guests invited to the bridal. The scene is laid in Galilee, where groomsmen were not customary, as in Judaea. Hence there is no mention of them in the account of the marriage at Cana. In Judaea there were at every marriage two groomsmen or friends of the bridegroom. See on [John 3:29]."}], "20": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:20] . Here also the style becomes burdened by the sense of the solemn character of the fact stated: there will come days when the Bridegroom shall be taken from them, and then shall they fast in that day! This final expression, ἐν ἐκείνῃ ἡμέρᾳ , singular, for plural in first clause, is very impressive, although Fritzsche calls it prorsus intolerabile . There is no ground for the suggestion that the phrase is due to the evangelist, and refers to the Friday of the Passion Week (Holtz., H. C.). It might quite well have been used by Jesus."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:20] . [20] Ἐλεύσονται , shall come ) This is the first intimation of His Passion. ἐν ἐκείνῃ τῇ ἡμέρᾳ ) So also the Gothic version reads. Moreover, the plural, which is substituted by some, comes evidently from Luke. [21] There is but one day of the Bridegroom being taken away; many days, of His continuing absent after having been so taken away. But the days will come, when the Bridegroom shall be taken away; and then shall they fast in that day (In some one of those days, to wit, especially on the first of them). So in Luk 17:22 the plural number is used, the days shall come ; and in [Luke 2:31] , on that day , in the singular number, with a force having relation to that plural. [20] [Mark 2:19] . Τοῦ νομφῶνος , the Bridegroom ) This means Jesus, in whose absence, they, to whom he is known, cannot feel the day joyful, and in whose presence they cannot feel the day sad. V. g. [21] Through Harmonists. ED. The Gnomon and margin of [Exodus 2:0] and Vers. Germ . prefer the Sing. The Ed. Maj. has at it the mark δ . E. B. ABCD and Amiat. Vulg. support the Sing.: abc later Vulg. and Rec. Text, the Plural. ED."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Then - in those days. The proper reading is ejn ejkeinh, in that day. So Rev. Another of Mark's double expressions : then - in that day."}], "21": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:21] . ἐπιρράπτει , sews upon, for ἐπιβάλλει in Mt. and Lk.; not in Greek authors, here only in N. T.; in Sept [13] , [Job 16:15] , the simple verb. εἰ δὲ μή : vide on εἰ δὲ μήγε in [Matthew 9:17] . εἰ δὲ μήγε , etc.: that which filleth up taketh from it ( ἀπʼ αὐτοῦ ) the new, viz. , from the old; the second clause explanatory of the first. καὶ χ . σ . γ ., and a worse rent takes place. [13]Septuagint."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "21. ] Render, the filling-up takes away from it, the new from the old, and a worse rent takes place. See note on [8] Matt. The addition here of τὸ καινόν confirms the view taken of the parable there. [8] When, in the Gospels, and in the Evangelic statement, [1 Corinthians 11:23-25] , the sign (║) occurs in a reference, it is signified that the word occurs in the parallel place in the other Gospels, which will always be found indicated at the head of the note on the paragraph. When the sign (║) is qualified , thus, &lsquo;║ Mk.,&rsquo; or &lsquo;║ Mt. Mk.,&rsquo; &c., it is signified that the word occurs in the parallel place in that Gospel or Gospels, but not in the other or others ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:21] . Αἴρει τὸ πλήρωμα τὸ καινὸν τοῦ παλαιοῦ ) This reading is a mean between extremes, brief, and likely to be genuine. [22] The meaning is: the new piece put in to patch up the rent, takes away with it some of the old cloth. [22] A Δ , later Syr., whom Tischend. follows, read αἴρει ἀπʼ αὐτοῦ τὸ πληρωμα . B reads τὸ πληρ . ἀφʼ εἁυτοῦ . L, whom Lachm. follows, has τὸ πλήρ . ἀπʼ αὐτοῦ . D ab Vulg. and Rec. Text have τὸ πλήρωμα (to which Rec. Text adds αὐτοῦ ) τὸ καινὸν ἀπὸ (omitted in Rec. Text) τοῦ παλαίου ED."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Seweth on ( επιραπτε ). Here only in the N.T. or elsewhere, though the uncompounded verb ραπτω (to sew) is common enough, sews upon: in [Matthew 9:16] and [Luke 5:37] use επιβαλλε , put upon or clap upon."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Seweth [ επιρραπτει] . A word found in Mark only. Matthew (ix. 16) and Luke (v. 36) use ejpiballei, throweth upon, as we speak of clapping a patch upon."}], "22": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:22] . ῥήξει . Pricaeus ( ad [Matthew 9:17] ) quotes from Seneca (83 Epist.): &ldquo;musto dolia ipsa rumpuntur&rdquo; of course, a fortiori , old skins . καὶ ὁ οἶνος , etc.: and the wine is lost, also the skins. ἀλλὰ , etc.: this final clause, bracketed in W. and H [14] , with the βλητέον , probably inserted from Lk., gives very pithy expression to the principle taught by the parable: but new wine into new skins! As to the bearing of both parables as justifying both John and Jesus, vide notes on Mt., ad loc. [14] Westcott and Hort."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "But new wine into fresh wineskins ( αλλα οινον νεον εις ασκους καινους ). Westcott and Hort bracket this clause as a Western non-interpolation though omitted only in D and some old Latin MSS. It is genuine in [Luke 5:38] and may be so here."}], "23": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:23] . καὶ ἐγ .: connection with foregoing topical, not temporal; another case of conflict. αὐτὸν παραπορεύεσθαι : ἐγένετο is followed here by the infinitive in first clause, then with καὶ and a finite verb in second clause. It is sometimes followed by indicative with καὶ , and also without καὶ ( vide Burton&rsquo;s Syntax , § 360). παραπορ . stands here instead of διαπορ . in Lk., and the simple verb with διὰ after it in Mt. It seems intended to combine the ideas of going through and alongside. Jesus went through a corn field on a footpath with grain on either side. ὁδὸν ποιεῖν is a puzzling phrase. In classic Greek it means to make a road = viam sternere , ὁδὸν ποιεῖσθαι meaning to make way = iter facere . If we assume that Mk. was acquainted with and observed this distinction, then the meaning will be: the disciples began to make a path by pulling up the stalks ( τίλλοντες τοὺς στάχυας ), or perhaps by trampling under foot the stalks after first plucking off the ears . The ἤρξαντο in that case will mean that they began to do that when they saw the path was not clear, and wished to make it more comfortable for their Master to walk on. But it is doubtful whether in Hellenistic Greek the classic distinction was observed, and [Judges 17:8] (Sept [15] ) supplies an instance of ὁδὸν ποιεῖν = making way, &ldquo;as he journeyed&rdquo;. It would be natural to Mk. to use the phrase in the sense of iter facere . If we take the phrase in this sense, then we must, with Beza, find in the passage a permutata verborum collocatio , and translate as if it had run: ὁδὸν ποιοῦντες τίλλειν : &ldquo;began, as they went, to pluck,&rdquo; etc. (R. V [16] ). The former view, however, is not to be summarily put aside because it ascribes to the disciples an apparently wanton proceeding. If there was a right of way by use and wont, they would be quite entitled to act so. The only difficulty is to understand how a customary path could have remained untrodden till the grain was ripe, or even in the ear. On this view vide Meyer. Assuming that the disciples made a path for their Master by pulling up the grain, with which it was overgrown, or by trampling the straw after plucking the ears, what did they do with the latter? Mt. and Lk. both say or imply that the plucking was in order to eating by hungry men. Meyer holds that Mk. knows nothing of this hunger, and that the eating of the ears came into the tradition through the allusion to David eating the shewbread. But the stress Mk. lays on need and hunger (duality of expression, [Mark 2:25] ) shows that in his idea hunger was an element in the case of the disciples also. [15]Septuagint. [16] Revised Version."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "23. παραπ . διὰ ] He passed by or journeyed (so our Evangelist uses the word, see reff.) through, &c. ὁδὸν ποιεῖν τίλ . is matter of detail and minute depiction. The interpretation of this narrative given by Meyer, which I still believe to be an entirely mistaken one, I cannot pass over so slightly as I did in my first edition. He urges the strict classical sense of ὁδὸν ποιεῖν , &lsquo; to make a way,&rsquo; viam munire , or sternere , and insists on the sense conveyed by our narrative being, as distinguished from those in [9] Matt., Luke, that the disciples made a way for themselves through the wheat field by plucking the ears of corn , further maintaining, that there is no allusion here to their having eaten the grains of wheat, as in [10] Matt. Luke. But (1) the foundation on which all this is built is insecure. For ὁδὸν ποιεῖν in the LXX does undoubtedly mean &lsquo; to make one&rsquo;s journey ,&rsquo; representing the Heb. עָשָׂה דֶּרֶךְ , in [Judges 17:8] (examples are also quoted in the lexx. from Xenophon (the romancer)&rsquo;s Ephesiaca and from Polyænus). And (2) as to no allusion being made to their having eaten the corn, how otherwise could the χρείαν ἔχειν have been common to the disciples and to David? Could it be said that any necessity compelled them to clear the path by pulling up the overhanging stalks of corn? How otherwise could the remarkable addition in our narrative, [Mark 2:27] , at all bear upon the case? Fritzsche&rsquo;s rendering, &lsquo;cœperunt viam exprimere spicas evellendo,&rsquo; which he explains, &lsquo;to mark the way by plucking ears, and strewing them in it,&rsquo; is still worse. The classical sense of ὁδὸν ποιεῖν must evidently not be pressed: it here ὁδὸν ποιεῖσθαι . [9] When, in the Gospels, and in the Evangelic statement, [1 Corinthians 11:23-25] , the sign (║) occurs in a reference, it is signified that the word occurs in the parallel place in the other Gospels, which will always be found indicated at the head of the note on the paragraph. When the sign (║) is qualified , thus, &lsquo;║ Mk.,&rsquo; or &lsquo;║ Mt. Mk.,&rsquo; &c., it is signified that the word occurs in the parallel place in that Gospel or Gospels, but not in the other or others . [10] When, in the Gospels, and in the Evangelic statement, [1 Corinthians 11:23-25] , the sign (║) occurs in a reference, it is signified that the word occurs in the parallel place in the other Gospels, which will always be found indicated at the head of the note on the paragraph. When the sign (║) is qualified , thus, &lsquo;║ Mk.,&rsquo; or &lsquo;║ Mt. Mk.,&rsquo; &c., it is signified that the word occurs in the parallel place in that Gospel or Gospels, but not in the other or others ."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Through the cornfields ( δια των σποριμων ). See on [Matthew 12:1]. So Matt. and [Luke 6:1]. But Mark uses παραπορευεσθα , to go along beside, unless διαπορευεσθα (BCD) is accepted. Perhaps now on the edge, now within the grain. Mark uses also οδον ποιειν , to make a way like the Latin iter facere, as if through the standing grain, plucking the ears ( τιλλοντες τους σταχυας ). Work of preparing food the rabbis called it. The margin of the Revised Version has it correctly: They began to make their way plucking the ears of corn (grain, wheat or barley, we should say). See on [Matthew 12:1-8] for discussion of this passage, parallel also in [Luke 6:15]."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "He went [ αυτον παραπορευεσθαι] . Lit., went along beside, along the stretches of standing grain. Matthew and Luke use dia, through, as Mark does, but not para. Began, as they went, to pluck [ ηρξαντο οδον ποιειν τιλλοντες] . Lit., began to make a way plucking the ears. This does not mean that the disciples broke a way for themselves through the standing corn by plucking the ears, for in that event they would have been compelled to break down the stalks. They could not have made a way by plucking the heads of the grain. Mark, who uses Latin forms, probably adopted here the phrase iter facere, to make a way, which is simply to go. The same idiom occurs in the Septuagint, [Jude 1:17]:8; poihsai oJdon, as he journeyed. The offense given the Pharisees was the preparation of food on the Sabbath. Matthew says to eat, stating the motive, and Luke, rubbing with their hands, describing the act. See on [Matthew 12:2]. The Rev. rightly retains the rendering of the A. V."}], "24": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:24] . ἔλεγον αὐτῷ . In this case they speak to Christ against His disciples; indirectly against Him. ὁ οὐκ ἔξεστιν : the offence was not trampling the grain or straw, but plucking the ears reaping on a small scale; rubbing = threshing, in Lk. χρείαν ἔσχε καὶ ἐπείνασεν : another example of Mk.&rsquo;s duality, intelligible only if hunger was the point of the story. The verbs are singular, because David ( αὐτὸς ) is the hero, his followers in the background."}], "25": [{"src": "hac", "name": "Alford's Greek Testament", "text": "25. αὐτός ] Himself, taking up the cause of his disciples and not leaving their defence to themselves."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "Had need. Mark adds this to the was an hungered, which is in both Matthew and Luke. The analogy lay in the necessity. The had need is generic; the was hungry is specific, describing the peculiar character of the need."}], "26": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:26] . ἐπὶ Ἀβιάθαρ ἀρ .: under A., a note of time, also implying his sanction: the sanction of a distinguished sacerdotal character = of Abiathar as priest . But Ahimelech was the priest then ([1 Samuel 21:2] f.). Either a natural error arising from the close connection of David with Abiathar, the well-known high priest, or we must adopt one or other of the solutions proposed: father and son, Ahimelech and Abiathar, both bore both names ([1 Samuel 22:20] , [2 Samuel 8:17] , [1 Chronicles 18:16] ) so the Fathers; Abiathar, the son, Ahimelech&rsquo;s assistant at the time, and mentioned as the more notable as approving of the conduct of his own father and of David (Grotius); ἐπὶ taken in the sense it bears in [Mark 12:26] ( ἐπὶ βάτου ) in the passage about Abiathar not a satisfactory suggestion."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "26. ἐπὶ Ἀβ . ἀρχ .] during the high-priesthood of Abiathar. But in [1 Samuel 21:0] , from which this account is taken, Ahimelech, not Abiathar , is the high-priest. There is however considerable confusion in the names about this part of the history: Ahimelech himself is called Ahiah , [1 Samuel 14:3] ; and whereas ( 1Sa 22:20 ) Ahimelech has a son Abiathar , in [2 Samuel 8:17] , Ahimelech is the son of Abiathar , and in [1 Chronicles 18:16] , Abimelech . Amidst this variation, we can hardly undertake to explain the difficulty in the text. The insertion of the art. before ἀρχ . has been apparently done to give the words the sense &lsquo;In the time of Abiathar the High-priest,&rsquo; so that the difficulty might be avoided by understanding the event to have happened in the time of (but not necessarily during the high-priesthood of) Abiathar (who was afterwards) the High-priest. But supposing the reading to be so, what author would in an ordinary narrative think of designating an event thus? Who for instance would speak of the defeat of the Philistines at Ephesdammim, where Goliath fell, as happening ἐπὶ Δανεὶδ τοῦ βασιλέως ? Who would ever understand ἐπὶ Ἐλισσαίου τοῦ προφήτου , &lsquo;in the time of Elisæus the prophet,&rsquo; as importing, in matter of fact, any other period than that of the prophetic course of Elisha? (The ἐγέννησεν Δανεὶδ τὸν βασιλέα of Mat 1:6 is not a case in point.) Yet this is the way in which the difficulties of the Gospels have been attempted to be healed over. (See Middleton on the article, in loc.) With the restoration of the true reading, even this resource fails. (I am sorry to see that Bp. Wordsw. writes, &ldquo; ἐπὶ Ἀβιάθαρ ἀρχιερέως intimates indeed that it was in the days of Abiathar, but it rather suggests that he was not the High-priest then:&rdquo; comparing ἐπὶ ἀρχιερέως Ἄννα , [Luke 3:2] . But surely Bp. W. must know, that such a rendering is ungrammatical: that ἀρχ ιερέως without the article must be simply predicatory, whether it precedes or follows the proper name; &ldquo;when Abiathar was High-priest,&rdquo; and cannot be titular. The expression in 1Ma 13:42 , which he quotes as similar, is not a case in point, as any reader may judge: ἐπὶ Σίμωνος ἀρχιερέως μεγάλου κ . στρατηγοῦ καὶ ἡγουμένου τῶν Ἰουδαίων : the epithet μεγάλου makes all the difference.)"}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:26] . Ἐπὶ , Ἀβιάθαρ , under Abiathar) Ahimelech was the priest who gave loaves of bread to David; but on his being put to death for that very act, his son Abiathar presently after succeeded to him; and afterwards the priesthood of Abiathar and the reign of David were contemporary. The series of the priests was very well known among the Hebrews, and so the denomination of [the mode of marking] the age of David is taken from the priest of that day; and indeed the Evangelist mentions Abiathar, in whose time the actions of David seem to have been entered in the sacred records, in preference to Ahimelech; comp. the use of ἐπὶ , [Matthew 1:11] . Not unlike is the phraseology, [Genesis 2:2] , on the seventh day [God ended His work; we should have said, at the close of the sixth day ], and ch. [Mark 10:25] , in the days of peleg (who was born a short while after) the earth was divided ."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "The house of God ( τον οικον του θεου ). The tent or tabernacle at Nob, not the temple in Jerusalem built by Solomon. When Abiathar was high priest ( επ Αβιαθαρ αρχιερεως ). Neat Greek idiom, in the time of Abiathar as high priest. There was confusion in the Massoretic text and in the LXX about the difference between Ahimelech (Abimelech) and Abiathar ([2 Samuel 8:17]), Ahimelech's son and successor ([1 Samuel 21:2]; [1 Samuel 22:20]). Apparently Ahimelech, not Abiathar was high priest at this time. It is possible that both father and son bore both names ([1 Samuel 22:20]; [2 Samuel 8:17]; [1 Chronicles 18:16]), Abiathar mentioned though both involved. Επ may so mean in the passage about Abiathar. Or we may leave it unexplained. They had the most elaborate rules for the preparation of the shewbread ( τους αρτους της προθεσεως ), the loaves of presentation, the loaves of the face or presence of God. It was renewed on the commencement of the sabbath and the old bread deposited on the golden table in the porch of the Sanctuary. This old bread was eaten by the priests as they came and went. This is what David ate."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "The shewbread [ τους αρτους της προθεσεως] . Lit., the loaves of proposition, i e., the loaves which were set forth before the Lord. The Jews called them the loaves of the face, i e., of the presence of God. The bread was made of the finest wheaten flour that had been passed through eleven sieves. There were twelve loaves, or cakes, according to the number of tribes, ranged in two piles of six each. Each cake was made of about five pints of wheat. They were anointed in the middle with oil, in the form of a cross. According to tradition, each cake was five hand - breadths broad and ten long, but turned up at either end, two hand - breadths on each side, to resemble in outline the ark of the covenant. The shewbread was prepared on Friday, unless that day happened to be a feast - day that required sabbatical rest; in which case it was prepared on Thursday afternoon. The renewal of the shewbread was the first of the priestly functions on the commencement of the Sabbath. The bread which was taken off was deposited on the golden table in the porch of the sanctuary, and distributed among the outgoing and incoming courses of priests (compare save for the priests). It was eaten during the Sabbath, and in the temple itself, but only by such priests as were Levitically pure. This old bread, removed on the Sabbath morning, was that which David ate."}], "27": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:27] . καὶ ἔλεγεν , etc., and He said to them; this phrase is employed to introduce a saying of Jesus containing a great principle. The principle is that the Sabbath is only a means towards an end man&rsquo;s highest good. Strange that Mk. should have been allowed to have a monopoly of this great word! For this saying alone, and the parable of gradual growth ([Mark 4:26-29] ), his Gospel was worth preserving."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "27. ] τὸ σάβ … διὰ τὸ ς . is peculiar to Mark, and highly important. The Sabbath was an ordinance for man ; for man&rsquo;s rest, both actually and typically, as setting forth the rest which remains for God&rsquo;s people ( Heb 4:9 ). But He who is now speaking has taken on Himself Manhood , the whole nature of Man; and is rightful lord over creation as granted to man , and of all that is made for man , and therefore of the Sabbath . The whole dispensation of time is created for man , for Christ as He is man , and is in his absolute power . There is a remarkable parallel, in more than the mere mode of expression, in 2 Mace. [Mark 5:19] : οὐ διὰ τὸν τόπον τὸ ἔθνος , ἀλλὰ διὰ τὸ ἔθνος τὸν τόπον ὁ κύριος ἐξελέξατο ."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "Mar 2:27 Ἔλεγεν He was saying ) Again beginning to address them; comp. [Mark 4:21] ; [Mark 4:24] ; [Mark 4:26] ; [Mark 4:30] ; [Mark 7:20] ; [Mark 9:1] ; [Luke 4:24] ; [Luke 5:36] ; [Luke 6:5] ; [Luke 15:11] ; John 1:52. διὰ , for the sake of ) An axiom. So almost similarly 2Ma 5:19 : οὐ διὰ τὸν τοπον τὸ ἔθνος , ἀλλὰ διὰ τὸ ἔθνος τὸν τόπον ὁ Κύριος ἐξελέξατο ἐγένετο , was made ) The origin and end of things is to be kept in view. The blessing of the Sabbath, [Genesis 2:3] , has regard to man."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "For man ( δια τον ανθρωπον ). Mark alone has this profound saying which subordinates the sabbath to man's real welfare (mankind, observe, generic article with ανθρωπος , class from class). Man was not made for the sabbath as the rabbis seemed to think with all their petty rules about eating an egg laid on the sabbath or looking in the glass, et cetera. See 2Macc. 5:19 and Mechilta on [Exodus 31:13]: \"The sabbath is delivered unto you and ye are not delivered unto the sabbath.\" Christianity has had to fight this same battle about institutionalism. The church itself is for man, not man for the church."}, {"src": "vws", "name": "Vincent's Word Studies", "text": "For man [ δια] . On account of, or for the sake of. This saying is given by Mark only."}], "28": [{"src": "egt", "name": "Expositor's Greek Testament", "text": "[Mark 2:28] . ὥστε : wherefore, so then, introducing a thesis of co-ordinate importance, while an inference from the previous statement. ὁ υἱὸς τ . α .: the Son of Man, as representing the human interest, as opposed to the falsely conceived divine interest championed by the Pharisees. καὶ τ . σ ., even of the Sabbath, so inviolable in your eyes. Lord, not to abolish but to interpret and keep in its own place, and give it a new name. No disparagement of Sabbath meant."}, {"src": "hac", "name": "Alford's Greek Testament", "text": "28. καί ] as well as of His other domains or elements of lordship and power."}, {"src": "jab", "name": "Bengel's Gnomon", "text": "[Mark 2:28] . Ὥστε , therefore ) The more obvious sense of this remarkable enigmatical aphorism is, Whatever right as regards the Sabbath any man hath, I also have. The more august sense, though one kept hidden [recondite] then, as suited to the relations in which that time stood to the whole divine scheme, is this, The end of the institution of the Sabbath is the salvation [welfare] of man as to his soul and body. The Son of Man is bound to ensure this salvation; and, in order to bring about this end, He the same has also authority over all things, and expressly over the Sabbath, inasmuch as it was made for man; and with a view to [in accordance with] obtaining this end, He regulates aright the whole use of the Sabbath."}, {"src": "rwp", "name": "Robertson's Word Pictures", "text": "Even of the sabbath ( κα του σαββατου ). Mark, Matthew ([Matthew 12:8]), and Luke ([Luke 6:5]) all give this as a climax in the five reasons given by Christ on the occasion for the conduct of the disciples, but Mark has the little word \"even\" ( κα ) not in the others, showing that Jesus knew that he was making a great claim as the Son of Man, the Representative Man, the Messiah looked at from his human interest, to lordship ( κυριος ) even of the sabbath. He was not the slave of the sabbath, but the master of it. \"Even of the sabbath, so invaluable in your eyes. Lord, not to abolish, but to interpret and keep in its own place, and give it a new name\" (Bruce)."}]}, "exegetical": ""};

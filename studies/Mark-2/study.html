ng here, putting forward as a plea the necessity of nature; although in the case of acknowledged sins, that could not of course ever be an excuse. For neither may the murderer make his anger a plea, nor the adulterer allege his lust, no, nor any other excuse; but here, by mentioning their hunger, He freed them from all blame.", "lang": "", "orig": ""}, {"v": 24, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For with regard to the meats likewise, when He had overcome them, then, and not till then, He declared unto the multitude, that, Not that which goes in defiles the man; Matthew 15:11 and with regard to the Sabbath, when He had stopped their mouths, He says, Wherefore it is lawful to do well on the Sabbath day; Matthew 12:12 and here this self-same thing.", "lang": "", "orig": ""}, {"v": 24, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For because they could not have borne it, if when He was giving the law for the Sabbath, He had said, Do your good works on the Sabbath, but do not the works which are evil, therefore He restrained them from all alike for, You must do nothing at all, says He: and not even so were they kept in order. But He Himself, in the very act of giving the law of the Sabbath, did even therein darkly signify that He will have them refrain from the evil works only, by the saying, You must do no work, except what shall be done for your life.  And in the temple too all went on, and with more diligence and double toil. Numbers 28:9-10 Thus even by the very shadow He was secretly opening unto them the truth.", "lang": "", "orig": ""}, {"v": 24, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "What then do the Pharisees? When they saw it, it is said, they said to Him, Behold, Your disciples do that which is not lawful to do upon the Sabbath day. Matthew 12:2", "lang": "", "orig": ""}, {"v": 24, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And what is this to the question, one may say; for it was not surely the Sabbath, that he transgressed? You tell me of that which is greater, and which especially shows the wisdom of Christ, that letting go the Sabbath, He brings another example greater than the Sabbath. For it is by no means the same, to break in upon a day, and to touch that holy table, which it was not lawful for any man to touch. Since the Sabbath indeed has been violated, and that often; nay rather it is continually being violated, both by circumcision, and by many other works; and at Jericho Joshua 6:15 too one may see the same to have happened; but this happened then only. So that He more than obtains the victory. How then did no man blame David, although there was yet another ground of charge heavier than this, that of the priests' murder, which had its origin from this? But He states it not, as applying himself to the present subject only.", "lang": "", "orig": ""}, {"v": 24, "f": "Tertullian", "w": "Chapter XXI.—The Law of the Sabbath-Day Explained. The Eight Days’ Procession\nAround Jericho. The Gathering of Sticks a Violation.", "t": "Similarly on other points also, you reproach Him with fickleness and instability for\ncontradictions in His commandments, such as that He forbade work to be done on Sabbathdays,\nand yet at the siege of Jericho ordered the ark to be carried round the walls during\neight days; in other words, of course, actually on a Sabbath. You do not, however, consider\nthe law of the Sabbath: they are human works, not divine, which it prohibits.2959 For it says,\n“Six days shalt thou labour, and do all thy work; but the seventh day is the Sabbath of the\nLord thy God: in it thou shalt not do any work.” What work? Of course your own. The\nconclusion is, that from the Sabbath-day He removes those works which He had before\nenjoined for the six days, that is, your own works; in other words, human works of daily\nlife. Now, the carrying around of the ark is evidently not an ordinary daily duty, nor yet a\nhuman one; but a rare and a sacred work, and, as being then ordered by the direct precept\nof God, a divine one. And I might fully explain what this signified, were it not a tedious\nprocess to open out the forms2960 of all the Creator’s proofs, which you would, moreover,\nprobably refuse to allow. It is more to the point, if you be confuted on plain matters2961 by\nthe simplicity of truth rather than curious reasoning. Thus, in the present instance, there is\na clear distinction respecting the Sabbath’s prohibition of human labours, not divine ones.\nAccordingly, the man who went and gathered sticks on the ", "lang": "latin", "orig": ""}, {"v": 24, "f": "Theodoret of Cyrrhus", "w": "Quaestiones in Josuam", "t": "Before the arrangement of the Ecclesiastical Psalmody was settled, neither the Gospel nor the other Scriptures were accustomed to be read on the Sabbath. But out of regard to the canons which forbade fasting or kneeling on the Sabbath, there were no services, so that there might be as much feasting as possible. This the fathers prohibit, and decree that on the Sabbath the whole ecclesiastical office shall be said.", "lang": "", "orig": ""}, {"v": 24, "f": "npnf214", "w": "Canon XVI.", "t": "Before the arrangement of the Ecclesiastical Psalmody was settled, neither the Gospel\nnor the other Scriptures were accustomed to be read on the Sabbath. But out of regard to\nthe canons which forbade fasting or kneeling on the Sabbath, there were no services, so that\nthere might be as much feasting as possible. This the fathers prohibit, and decree that on\nthe Sabbath the whole ecclesiastical office shall be said.", "lang": "greek", "orig": ""}, {"v": 25, "f": "Augustine of Hippo", "w": "", "t": "It is foolish to believe the Evangelist’s account that he ate and not to believe that he was really hungry. Yet it does not follow that everyone who eats is hungry. For we read that even an angel ate, but we do not read that he was hungry. Nor does it follow that everyone who is hungry eats. He may either restrain himself due to some obligation or lack food or the means to eat.… Now, just as the fact that Jesus ate food is unintelligible without a body, so the fact that he felt hunger is impossible without a soul.", "lang": "english", "orig": ""}, {"v": 25, "f": "Bede", "w": "", "t": "And he said to them: Have you never read, etc.? To refute the Pharisees’ accusation, he recalls an old story, when David, fleeing Saul, came to Nob and was received by the priest Abimelech, and asked for food (1 Samuel 21). Since he did not have ordinary bread, he gave him consecrated bread, which only priests and Levites were allowed to eat. He only asked if the young men were pure from women: and when he answered from yesterday and the day before, he did not hesitate to give the bread, considering it better (as the prophet says, I desire mercy, and not sacrifice [Hosea 6]) to free men from the danger of hunger than to offer a sacrifice to God. For the acceptable sacrifice to God is the salvation of men. Therefore, the Lord argues and says: If both David is holy and Abimelech the priest is not blamed by you, but each of them transgressed the commandment of the law with reasonable excuse, and hunger is the cause, why do you not approve the same hunger in the apostles which you approve in others? Although, in this matter, there is much difference. These rub the ears of grain in their hands on the Sabbath, those ate Levitical bread. There, even at the solemnity of the Sabbath, the days of the new moons illuminated it, and in the feasts when he fled from the royal court. Figuratively speaking, when it is said that David and his men received the consecrated bread, it shows that the food of the priesthood would pass into common use, either because we all ought to imitate the pries", "lang": "english", "orig": ""}, {"v": 25, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But when blamed for His disciples, He said, Have ye not read what David did, when he was an hungered, himself and they that were with him, how he entered into the house of God, and did eat the show-bread? Matthew 12:3-4 He brings forward the priests also.", "lang": "", "orig": ""}, {"v": 25, "f": "Pseudo-Chrysostom", "w": "", "t": "(Vict. Ant. e Cat. in Marc.) But our Lord brings forward David, to whom it once happened to eat though it was forbidden by the law, when he touched the Priest's food, that by his example, he might do away with their accusation of the disciples. For there follows, Have ye never read, &c.", "lang": "english", "orig": ""}, {"v": 26, "f": "1 Clement", "w": "Chapter VIII.—Vain attempts of Marcion and his followers, who exclude\nAbraham from the salvation bestowed by Christ, who liberated not only Abraham,\nbut the seed of Abraham, by fulfilling and not destroying the law when He healed\non the Sabbath-day.", "t": "3. And again, the law did not forbid those who were hungry on the Sabbath-days to take\nfood lying ready at hand: it did, however, forbid them to reap and to gather into the barn.\nAnd therefore did the Lord say to those who were blaming His disciples because they plucked\nand ate the ears of corn, rubbing them in their hands, “Have ye not read this, what David\ndid, when himself was an hungered; how he went into the house of God, and ate the shewbread,\nand gave to those who were with him; which it is not lawful to eat, but for the priests\nalone?”1239 justifying His disciples by the words of the law, and pointing out that it was\nlawful for the priests to act freely. For David had been appointed a priest by God, although\nSaul persecuted him. For all the righteous possess the sacerdotal rank.1240 And all the apostles\nof the Lord are priests, who do inherit here neither lands nor houses, but serve God and the\naltar continually. Of whom Moses also says in Deuteronomy, when blessing Levi, “Who\nsaid unto his father and to his mother, I have not known thee; neither did he acknowledge\nhis brethren, and he disinherited his own sons: he kept Thy commandments, and observed\nThy covenant.”1241 But who are they that have left father and mother, and have said adieu\nto all their neighbours, on account of the word of God and His covenant, unless the disciples\nof the Lord? Of whom again Moses says, “They shall have no inheritance, for the Lord\nHimself is their inheritance.”1242 And again, “The pri", "lang": "greek", "orig": ""}, {"v": 26, "f": "Bede", "w": "", "t": "(ubi sup.) There is, however, no discrepancy, for both were there, when David came to ask for bread, and received it: that is to say, Abimelech, the High Priest, and Abiathar his son; but Abimelech having been slain by Saul, Abiathar fled to David, and became the companion of all his exile afterwards. When he came to the throne, he himself also received the rank of High Priest, and the son became of much greater excellence than the father, and therefore was worthy to be mentioned as the High Priest, even during his fathers life-time.", "lang": "english", "orig": ""}, {"v": 26, "f": "Chrysostom - Homilies on Corinthians", "w": "Homily XXII.", "t": "For neither did he say, “They which wait upon the altar receive of them which sacrifice,”\nbut, “have their portion with the altar.” For the things offered now no longer belonged to\nthose who offered them, but to the temple and the altar. And he said not, “They receive the\nholy things,” but, they “eat of the temple,” indicating again their moderation, and that it\nbehoves them not to make money nor to be rich. And though he say that they have their\nportion “with the altar,” he doth not speak of equal distribution but of relief given them as\ntheir due. And yet the case of the Apostles was much stronger. For in the former instance\nthe priesthood was an honor, but in the latter it was dangers and slaughters and violent\ndeaths. Wherefore all the other examples together did not come up to the saying, “If we\nsowed unto you spiritual things:” since in saying, “we sowed,” he points out the storms, the\ndanger, the snares, the unspeakable evils, which they endured in preaching. Nevertheless,\nthough the superiority was so great, he was unwilling either to abase the things of the old\nlaw or to exalt the things which belong to himself: nay he even contracts his own, reckoning\nthe superiority not from the dangers, but from the greatness of the gift. For he said not, “if\nwe have jeoparded ourselves” or “exposed ourselves to snares” but “if we sowed unto you\nspiritual things.”", "lang": "greek", "orig": ""}, {"v": 26, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But when blamed for His disciples, He said, Have ye not read what David did, when he was an hungered, himself and they that were with him, how he entered into the house of God, and did eat the show-bread? Matthew 12:3-4 He brings forward the priests also.", "lang": "", "orig": ""}, {"v": 26, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Believe, therefore, that even now it is that supper, at which He Himself sat down. For this is in no respect different from that. For neither does man make this and Himself the other; but both this and that is His own work. When therefore you see the priest delivering it unto you, account not that it is the priest that does so, but that it is Christ's hand that is stretched out.", "lang": "", "orig": ""}, {"v": 26, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But it were meet first to inquire, why the disciples ate with unwashen hands. Wherefore then did they so eat? Not as making a point of it, but as overlooking henceforth the things that are superfluous, and attending to such as are necessary; having no law to wash or not to wash, but doing either as it happened. For they that despised even their own necessary food, how were they to hold these things worth much consideration? This then having often happened unintentionally — for instance, when they ate in the wilderness, when they plucked the ears of grain — is now put forward as a charge by these persons, who are always transgressing in the great things, and making much account of the superfluous.", "lang": "", "orig": ""}, {"v": 26, "f": "Theodoret of Cyrrhus", "w": "Quaestiones in Josuam", "t": "It is not permitted to hold love feasts, as they are called, in the Lord's Houses, or Churches, nor to eat and to spread couches in the house of God.", "lang": "", "orig": ""}, {"v": 27, "f": "Bede", "w": "", "t": "It goes on: And he said to them, The sabbath was made for man, and not man for the sabbath. For greater is the care to be taken of the health and life of a man, than the keeping of the sabbath. Therefore the sabbath was ordered to be observed in such a way, that, if there were a necessity, he should not be guilty, who broke the sabbath-day; therefore it was not forbidden to circumcise on the sabbath, because that was a necessary work. And the Maccabees, when necessity pressed on them, fought on the sabbath-day. Wherefore, His disciples being hungry, what was not allowed in the law became lawful through their necessity of hunger; as now, if a sick man break a fast, he is not held guilty in any way.", "lang": "english", "orig": ""}, {"v": 27, "f": "GK Chesterton", "w": "", "t": "I should have some sympathy with the Jewish Sabbath, if it were a Jewish Sabbath, and that for three reasons; first, that religion is an intrinsically sympathetic thing; second, that I cannot conceive any religion worth calling a religion without a fixed and material observance; and third, that the particular observance of sitting still and doing no work is one that suits my temperament down to the ground. But the absurdity of the modern English convention is that it does not let a man sit still; it only perpetually trips him up when it has forced him to walk about. Our Sabbatarianism does not forbid us to ask a man in Battersea to come and talk in Hertfordshire; it only prevents his getting there. I can understand that a deity might be worshipped with joys, with flowers, and fireworks in the old European style. I can understand that a deity might be worshipped with sorrows. But I cannot imagine any deity being worshipped with inconveniences.", "lang": "english", "orig": ""}, {"v": 27, "f": "GK Chesterton", "w": "", "t": "Morality did not begin by one man saying to another, \"I will not hit you if you do not hit me\"; there is no trace of such a transaction. There is a trace of both men having said, \"We must not hit each other in the holy place.\" They gained their morality by guarding their religion. They did not cultivate courage. They fought for the shrine, and found they had become courageous. They did not cultivate cleanliness. They purified themselves for the altar, and found that they were clean. The history of the Jews is the only early document known to most Englishmen, and the facts can be judged sufficiently from that. The Ten Commandments which have been found substantially common to mankind were merely military commands; a code of regimental orders, issued to protect a certain ark across a certain desert. Anarchy was evil because it endangered the sanctity. And only when they made a holy day for God did they find they had made a holiday for men.", "lang": "english", "orig": ""}, {"v": 27, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "3. After this He mentions another reason likewise; For the Son of man, says He, is Lord of the Sabbath day; Matthew 12:8 speaking it of Himself. But Mark relates Him to have said this of our common nature also; for He said, The Sabbath was made for man, not man for the Sabbath. Mark 2:27", "lang": "", "orig": ""}, {"v": 27, "f": "Theophylact of Ohrid", "w": "", "t": "In the higher sense, understand it thus: Christ's disciples walk on the Sabbath, that is, in the repose of the soul (Sabbath means rest); consequently, when they have attained freedom from the passions and from the assaults of demons, then they make the journey, that is, they become guides for others as well on the path to virtue, plucking up and uprooting all earthly and base illusory growths. For whoever has not first been freed from the passions and disposed himself to a quiet way of life cannot guide others and be a leader for them toward the good.", "lang": "english", "orig": ""}, {"v": 28, "f": "Bede", "w": "", "t": "It goes on: Therefore the Son of man is Lord, &c. As if he said, David the king is to be excused for feeding on the food of the Priests, how much more the Son of man, the true King and Priest, and Lord of the sabbath, is free from fault, for pulling ears of corn on the sabbath-day.", "lang": "english", "orig": ""}, {"v": 28, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "3. After this He mentions another reason likewise; For the Son of man, says He, is Lord of the Sabbath day; Matthew 12:8 speaking it of Himself. But Mark relates Him to have said this of our common nature also; for He said, The Sabbath was made for man, not man for the Sabbath. Mark 2:27", "lang": "", "orig": ""}, {"v": 28, "f": "Novatian", "w": "", "t": "In the same manner that he, according to his humanity, is like Abraham, even so, according to his divinity, he is before Abraham. As he is, according to his humanity, the Son of David, so is he also, as God, the Lord of David. As he is, according to his humanity, born under the law, so is he as God, the Lord of the sabbath.", "lang": "english", "orig": ""}, {"v": 28, "f": "Pseudo-Chrysostom", "w": "", "t": "(Vict. Ant. e Cat. in Marc.) He calls himself properly, Lord of the sabbath, and Son of man, since being the Son of God, he deigned to be called Son of man, for the sake of men. Now the law has no authority over the Lawgiver and Lord, for more is allowed the king, than is appointed by the law. The law is given to the weak indeed, but not to the perfect and to those who work above what the law enjoins.", "lang": "english", "orig": ""}, {"v": 440, "f": "npnf205", "w": "§13. He expounds the passage of the Gospel, “The Father judgeth no man,” and further speaks\nof the assumption of man with body and soul wrought by the Lord, of the transgression\nof Adam, and of death and the resurrection of the dead.", "t": "and the parallel passages in S. Matt. ix. and S. Mark ii.\n440 S. John v. 14\n441 Eph. ii. 15.\n442 Cf. S. John x. 17, 18. Here again the word ψυχήν is rendered in the A.V. by “life.”\n443 Ps. xvi. 8. Acts ii. 27, 31.\n444 Acts ii. 36. A further exposition of Gregor", "lang": "greek", "orig": ""}], "xrefs": [{"v": 5, "ref": "James 5:15", "rel": "cross-reference", "text": {"es": "Y la oración de fe salvará al enfermo, y el Señor lo levantará; y si estuviere en pecados, le serán perdonados.", "gr": "καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ."}}, {"v": 5, "ref": "Matthew 9:2", "rel": "cross-reference", "text": {"es": "Y he aquí le trajeron un paralítico, echado en una cama: y viendo Jesús la fe de ellos, dijo al paralítico: Confía, hijo; tus pecados te son perdonados.", "gr": "Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃."}}, {"v": 7, "ref": "Isaiah 43:25", "rel": "cross-reference", "text": {"es": "Yo, yo soy el que borro tus rebeliones por amor de mí; y no me acordaré de tus pecados.", "gr": ""}}, {"v": 17, "ref": "1 Timothy 1:15", "rel": "cross-reference", "text": {"es": "Palabra fiel y digna de ser recibida de todos: que Cristo Jesús vino al mundo para salvar á los pecadores, de los cuales yo soy el primero.", "gr": "πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,"}}, {"v": 17, "ref": "1 Timothy 1:16", "rel": "cross-reference", "text": {"es": "Mas por esto fuí recibido á misericordia, para que Jesucristo mostrase en mí el primero toda su clemencia, para ejemplo de los que habían de creer en él para vida eterna.", "gr": "ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον."}}, {"v": 17, "ref": "Isaiah 55:7", "rel": "cross-reference", "text": {"es": "Deje el impío su camino, y el hombre inicuo sus pensamientos; y vuélvase á Jehová, el cual tendrá de él misericordia, y al Dios nuestro, el cual será amplio en perdonar.", "gr": ""}}, {"v": 17, "ref": "Luke 15:7", "rel": "cross-reference", "text": {"es": "Os digo, que así habrá más gozo en el cielo de un pecador que se arrepiente, que de noventa y nueve justos, que no necesitan arrepentimiento.", "gr": "λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας."}}, {"v": 17, "ref": "Luke 19:10", "rel": "cross-reference", "text": {"es": "Porque el Hijo del hombre vino á buscar y á salvar lo que se había perdido.", "gr": "ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός."}}, {"v": 17, "ref": "Luke 5:31", "rel": "cross-reference", "text": {"es": "Y respondiendo Jesús, les dijo: Los que están sanos no necesitan médico, sino los que están enfermos.", "gr": "καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·"}}, {"v": 17, "ref": "Luke 5:32", "rel": "cross-reference", "text": {"es": "No he venido á llamar justos, sino pecadores á arrepentimiento.", "gr": "οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν."}}, {"v": 17, "ref": "Matthew 9:12", "rel": "cross-reference", "text": {"es": "Y oyéndolo Jesús, le dijo: Los que están sanos no tienen necesidad de médico, sino los enfermos.", "gr": "ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες."}}, {"v": 21, "ref": "Matthew 9:16", "rel": "cross-reference", "text": {"es": "Y nadie echa remiendo de paño recio en vestido viejo; porque el tal remiendo tira del vestido, y se hace peor la rotura.", "gr": "οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται."}}, {"v": 25, "ref": "1 Samuel 21:3", "rel": "cross-reference", "text": {"es": "Ahora pues, ¿qué tienes á mano? dame cinco panes, ó lo que se hallare.", "gr": ""}}, {"v": 25, "ref": "1 Samuel 21:6", "rel": "cross-reference", "text": {"es": "Así el sacerdote le dió el pan sagrado, porque allí no había otro pan que los panes de la proposición, los cuales habían sido quitados de delante de Jehová, para que se pusiesen panes calientes el día que los otros fueron quitados.", "gr": ""}}, {"v": 27, "ref": "Colossians 2:16", "rel": "cross-reference", "text": {"es": "Por tanto, nadie os juzgue en comida, ó en bebida, ó en parte de día de fiesta, ó de nueva luna, ó de sábados:", "gr": "Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,"}}, {"v": 27, "ref": "Deuteronomy 5:14", "rel": "cross-reference", "text": {"es": "Mas el séptimo es reposo á Jehová tu Dios: ninguna obra harás tú, ni tu hijo, ni tu hija, ni tu siervo, ni tu sierva, ni tu buey, ni tu asno, ni ningún animal tuyo, ni tu peregrino que está dentro de tus puertas: porque descanse tu siervo y tu sierva como tú.", "gr": ""}}, {"v": 27, "ref": "Ezekiel 20:12", "rel": "cross-reference", "text": {"es": "Y díles también mis sábados que fuesen por señal entre mí y ellos, para que supiesen que yo soy Jehová que los santifico.", "gr": ""}}, {"v": 27, "ref": "Isaiah 58:13", "rel": "cross-reference", "text": {"es": "Si retrajeres del sábado tu pie, de hacer tu voluntad en mi día santo, y al sábado llamares delicias, santo, glorioso de Jehová; y lo venerares, no hacinedo tus caminos, ni buscando tu voluntad, ni hablando tus palabras:", "gr": ""}}, {"v": 27, "ref": "Luke 6:9", "rel": "cross-reference", "text": {"es": "Entonces Jesús les dice: Os preguntaré un cosa: ¿Es lícito en sábados hacer bien, ó hacer mal? ¿salvar la vida, ó quitarla?", "gr": "εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;"}}], "apparatus": [], "morphology": {"1": [{"w": "Καὶ", "l": "καί", "m": "CONJ", "g": "and", "s": "G2532", "d": "and, also, even, so then, too, etc.; often used in\n connection (or composition) with other particles or small words", "es": "Y"}, {"w": "εἰσελθὼν", "l": "εἰσέρχομαι", "m": "V-2AAP-NSM", "g": "to enter", "s": "G1525", "d": "to enter (literally or figuratively)", "es": "habiendo venido hacia dentro"}, {"w": "πάλιν", "l": "πάλιν", "m": "ADV", "g": "again", "s": "G3825", "d": "(adverbially) anew, i.e. (of place) back, (of time) once\n more, or (conjunctionally) furthermore or on the other hand", "es": "otra vez"}, {"w": "εἰς", "l": "εἰς", "m": "PREP", "g": "toward", "s": "G1519", "d": "to or into (indicating the point reached or\n entered), of place, time, or (figuratively) purpose (result, etc.);\n also in adverbial phrases", "es": "a"}, {"w": "Καφαρναοὺμ", "l": "Καπερναούμ", "m": "N-ASF-L", "g": "Capernaum", "s": "G2584", "d": "Capernaum (i.e.\n Caphanachum), a place in Palestine", "es": "Capernaum"}, {"w": "δι᾽", "l": "διά", "m": "PREP", "g": "through/because of", "s": "G1223", "d": "through (in very\n wide applications, local, causal, or occasional)", "es": "por"}, {"w": "ἡμερῶν", "l": "ἡμέρα", "m": "N-GPF", "g": "day", "s": "G2250", "d": "day, i.e. (literally) the\n time space between dawn and dark, or the whole 24 hours (but several\n days were usually reckoned by the Jews as inclusive of the parts of\n both extremes); figuratively, a period (always defined more or less\n clearly by the context)", "es": "días"}, {"w": "ἠκούσθη", "l": "ἀκούω", "m": "V-API-3S", "g": "to hear", "s": "G191", "d": "to hear (in various senses)", "es": "fue oído"}, {"w": "ὅτι", "l": "ὅτι", "m": "CONJ", "g": "that/since", "s": "G3754", "d": "demonstrative, that (sometimes\n redundant); causative, because", "es": "que"}, {"w": "ἐν", "l": "ἐν", "m": "PREP", "g": "in/on/among", "s": "G1722", "d": "\"in,\" at, (up-)on, by, etc.", "es": "en"}, {"w": "οἴκῳ", "l": "οἶκος", "m": "N-DSM", "g": "house", "s": "G3624", "d": "a dwelling (more or less extensive, literal or\n figurative); by implication, a family (more or less related, literally\n or figuratively)", "es": "casa"}, {"w": "ἐστίν", "l": "εἰμί", "m": "V-PAI-3S", "g": "to be", "s": "G1510", "d": "I exist (used only when emphatic)", "es": "está siendo"}], "2": [{"w": "καὶ", "l": "καί", "m": "CONJ", "g": "and", "s": "G2532", "d": "and, also, even, so then, too, etc.; often used in\n connection (or composition) with other particles or small words", "es": "Y"}, {"w": "συνήχθησαν", "l": "συνάγω", "m": "V-API-3P", "g": "to assemble", "s": "G4863", "d": "to lead together, i.e. collect or convene;\n specially, to entertain (hospitably)", "es": "fueron reunidos"}, {"w": "πολλοὶ", "l": "πολύς", "m": "A-NPM", "g": "much", "s": "G4183", "d": "(singular) much (in any\n respect) or (plural) many; neuter (singular) as adverbial, largely;\n neuter (plural) as adverb or noun often, mostly, largely", "es": "muchos"}, {"w": "ὥστε", "l": "ὥστε", "m": "CONJ", "g": "so", "s": "G5620", "d": "so too, i.e. thus therefore (in various relations\n of consecution, as follow)", "es": "de modo que"}, {"w": "μηκέτι", "l": "μηκέτι", "m": "ADV", "g": "never again", "s": "G3371", "d": "no further", "es": "ya no"}, {"w": "χωρεῖν", "l": "χωρέω", "m": "V-PAN", "g": "to make room for", "s": "G5562", "d": "to be in (give) space, i.e. (intransitively) to pass,\n enter, or (transitively) to hold, admit (literally or\n figuratively)", "es": "estar haciendo lugar"}, {"w": "μηδὲ", "l": "μηδέ", "m": "ADV", "g": "not", "s": "G3366", "d": "but not, not even; in a continued negation,\n nor", "es": "ni"}, {"w": "τὰ", "l": "ὁ", "m": "T-APN", "g": "the/this/who", "s": "G3588", "d": "the (sometimes to be\n supplied, at others omitted, in English idiom)", "es": "a los"}, {"w": "πρὸς", "l": "πρός", "m": "PREP", "g": "to/with", "s": "G4314", "d": "a prepo ve, Plural, Neuter", "X-GSF": "indefinite pronoun, Genitive, Singular, Feminine", "X-GSM": "indefinite pronoun, Genitive, Singular, Masculine", "X-GSN": "indefinite pronoun, Genitive, Singular, Neuter", "X-NPF": "indefinite pronoun, Nominative, Plural, Feminine", "X-NPM": "indefinite pronoun, Nominative, Plural, Masculine", "X-NPN": "indefinite pronoun, Nominative, Plural, Neuter", "X-NSF": "indefinite pronoun, Nominative, Singular, Feminine", "X-NSM": "indefinite pronoun, Nominative, Singular, Masculine", "X-NSN": "indefinite pronoun, Nominative, Singular, Neuter"}, "spanish": {"1": "Entró Jesús otra vez en Capernaum después de algunos días; y se oyó que estaba en casa.", "2": "E inmediatamente se juntaron muchos, de manera que ya no cabían ni aun a la puerta; y les predicaba la palabra.", "3": "Entonces vinieron a él unos trayendo un paralítico, que era cargado por cuatro.", "4": "Y como no podían acercarse a él a causa de la multitud, descubrieron el techo de donde estaba, y haciendo una abertura, bajaron el lecho en que yacía el paralítico.", "5": "Al ver Jesús la fe de ellos, dijo al paralítico: Hijo, tus pecados te son perdonados.", "6": "Estaban allí sentados algunos de los escribas, los cuales cavilaban en sus corazones:", "7": "¿Por qué habla éste así? Blasfemias dice. ¿Quién puede perdonar pecados, sino sólo Dios?", "8": "Y conociendo luego Jesús en su espíritu que cavilaban de esta manera dentro de sí mismos, les dijo: ¿Por qué caviláis así en vuestros corazones?", "9": "¿Qué es más fácil, decir al paralítico: Tus pecados te son perdonados, o decirle: Levántate, toma tu lecho y anda?", "10": "Pues para que sepáis que el Hijo del Hombre tiene potestad en la tierra para perdonar pecados (dijo al paralítico):", "11": "A ti te digo: Levántate, toma tu lecho, y vete a tu casa.", "12": "Entonces él se levantó en seguida, y tomando su lecho, salió delante de todos, de manera que todos se asombraron, y glorificaron a Dios, diciendo: Nunca hemos visto tal cosa. Llamamiento de Leví (Mt. 9.9-13; Lc. 5.27-32)", "13": "Después volvió a salir al mar; y toda la gente venía a él, y les enseñaba.", "14": "Y al pasar, vio a Leví hijo de Alfeo, sentado al banco de los tributos públicos, y le dijo: Sígueme. Y levantándose, le siguió.", "15": "Aconteció que estando Jesús a la mesa en casa de él, muchos publicanos y pecadores estaban también a la mesa juntamente con Jesús y sus discípulos; porque había muchos que le habían seguido.", "16": "Y los escribas y los fariseos, viéndole comer con los publicanos y con los pecadores, dijeron a los discípulos: ¿Qué es esto, que él come y bebe con los publicanos y pecadores?", "17": "Al oír esto Jesús, les dijo: Los sanos no tienen necesidad de médico, sino los enfermos. No he venido a llamar a justos, sino a pecadores. La pregunta sobre el ayuno (Mt. 9.14-17; Lc. 5.33-39)", "18": "Y los discípulos de Juan y los de los fariseos ayunaban; y vinieron, y le dijeron: ¿Por qué los discípulos de Juan y los de los fariseos ayunan, y tus discípulos no ayunan?", "19": "Jesús les dijo: ¿Acaso pueden los que están de bodas ayunar mientras está con ellos el esposo? Entre tanto que tienen consigo al esposo, no pueden ayunar.", "20": "Pero vendrán días cuando el esposo les será quitado, y entonces en aquellos días ayunarán.", "21": "Nadie pone remiendo de paño nuevo en vestido viejo; de otra manera, el mismo remiendo nuevo tira de lo viejo, y se hace peor la rotura.", "22": "Y nadie echa vino nuevo en odres viejos; de otra manera, el vino nuevo rompe los odres, y el vino se derrama, y los odres se pierden; pero el vino nuevo en odres nuevos se ha de echar. Los discípulos recogen espigas en el día de reposo (Mt. 12.1-8; Lc. 6.1-5)", "23": "Aconteció que al pasar él por los sembrados un día de reposo,[b] sus discípulos, andando, comenzaron a arrancar espigas.", "24": "Entonces los fariseos le dijeron: Mira, ¿por qué hacen en el día de reposo[c] lo que no es lícito?", "25": "Pero él les dijo: ¿Nunca leísteis lo que hizo David cuando tuvo necesidad, y sintió hambre, él y los que con él estaban;", "26": "cómo entró en la casa de Dios, siendo Abiatar sumo sacerdote, y comió los panes de la proposición, de los cuales no es lícito comer sino a los sacerdotes, y aun dio a los que con él estaban?", "27": "También les dijo: El día de reposo[d] fue hecho por causa del hombre, y no el hombre por causa del día de reposo.[e]", "28": "Por tanto, el Hijo del Hombre es Señor aun del día de reposo.[f] El hombre de la mano seca (Mt. 12.9-14; Lc. 6.6-11)"}, "translations": {"RVR60": {"1": "Entró Jesús otra vez en Capernaum después de algunos días; y se oyó que estaba en casa.", "2": "E inmediatamente se juntaron muchos, de manera que ya no cabían ni aun a la puerta; y les predicaba la palabra.", "3": "Entonces vinieron a él unos trayendo un paralítico, que era cargado por cuatro.", "4": "Y como no podían acercarse a él a causa de la multitud, descubrieron el techo de donde estaba, y haciendo una abertura, bajaron el lecho en que yacía el paralítico.", "5": "Al ver Jesús la fe de ellos, dijo al paralítico: Hijo, tus pecados te son perdonados.", "6": "Estaban allí sentados algunos de los escribas, los cuales cavilaban en sus corazones:", "7": "¿Por qué habla éste así? Blasfemias dice. ¿Quién puede perdonar pecados, sino sólo Dios?", "8": "Y conociendo luego Jesús en su espíritu que cavilaban de esta manera dentro de sí mismos, les dijo: ¿Por qué caviláis así en vuestros corazones?", "9": "¿Qué es más fácil, decir al paralítico: Tus pecados te son perdonados, o decirle: Levántate, toma tu lecho y anda?", "10": "Pues para que sepáis que el Hijo del Hombre tiene potestad en la tierra para perdonar pecados (dijo al paralítico):", "11": "A ti te digo: Levántate, toma tu lecho, y vete a tu casa.", "12": "Entonces él se levantó en seguida, y tomando su lecho, salió delante de todos, de manera que todos se asombraron, y glorificaron a Dios, diciendo: Nunca hemos visto tal cosa. Llamamiento de Leví (Mt. 9.9-13; Lc. 5.27-32)", "13": "Después volvió a salir al mar; y toda la gente venía a él, y les enseñaba.", "14": "Y al pasar, vio a Leví hijo de Alfeo, sentado al banco de los tributos públicos, y le dijo: Sígueme. Y levantándose, le siguió.", "15": "Aconteció que estando Jesús a la mesa en casa de él, muchos publicanos y pecadores estaban también a la mesa juntamente con Jesús y sus discípulos; porque había muchos que le habían seguido.", "16": "Y los escribas y los fariseos, viéndole comer con los publicanos y con los pecadores, dijeron a los discípulos: ¿Qué es esto, que él come y bebe con los publicanos y pecadores?", "17": "Al oír esto Jesús, les dijo: Los sanos no tienen necesidad de médico, sino los enfermos. No he venido a llamar a justos, sino a pecadores. La pregunta sobre el ayuno (Mt. 9.14-17; Lc. 5.33-39)", "18": "Y los discípulos de Juan y los de los fariseos ayunaban; y vinieron, y le dijeron: ¿Por qué los discípulos de Juan y los de los fariseos ayunan, y tus discípulos no ayunan?", "19": "Jesús les dijo: ¿Acaso pueden los que están de bodas ayunar mientras está con ellos el esposo? Entre tanto que tienen consigo al esposo, no pueden ayunar.", "20": "Pero vendrán días cuando el esposo les será quitado, y entonces en aquellos días ayunarán.", "21": "Nadie pone remiendo de paño nuevo en vestido viejo; de otra manera, el mismo remiendo nuevo tira de lo viejo, y se hace peor la rotura.", "22": "Y nadie echa vino nuevo en odres viejos; de otra manera, el vino nuevo rompe los odres, y el vino se derrama, y los odres se pierden; pero el vino nuevo en odres nuevos se ha de echar. Los discípulos recogen espigas en el día de reposo (Mt. 12.1-8; Lc. 6.1-5)", "23": "Aconteció que al pasar él por los sembrados un día de reposo,[b] sus discípulos, andando, comenzaron a arrancar espigas.", "24": "Entonces los fariseos le dijeron: Mira, ¿por qué hacen en el día de reposo[c] lo que no es lícito?", "25": "Pero él les dijo: ¿Nunca leísteis lo que hizo David cuando tuvo necesidad, y sintió hambre, él y los que con él estaban;", "26": "cómo entró en la casa de Dios, siendo Abiatar sumo sacerdote, y comió los panes de la proposición, de los cuales no es lícito comer sino a los sacerdotes, y aun dio a los que con él estaban?", "27": "También les dijo: El día de reposo[d] fue hecho por causa del hombre, y no el hombre por causa del día de reposo.[e]", "28": "Por tanto, el Hijo del Hombre es Señor aun del día de reposo.[f] El hombre de la mano seca (Mt. 12.9-14; Lc. 6.6-11)"}, "RVR1909": {"1": "Y ENTRO otra vez en Capernaum después de algunos días, y se oyó que estaba en casa.", "2": "Y luego se juntaron á él muchos, que ya no cabían ni aun á la puerta; y les predicaba la palabra.", "3": "Entonces vinieron á él unos trayendo un paralítico, que era traído por cuatro.", "4": "Y como no podían llegar á él á causa del gentío, descubrieron el techo de donde estaba, y haciendo abertura, bajaron el lecho en que yacía el paralítico.", "5": "Y viendo Jesús la fe de ellos, dice al paralítico: Hijo, tus pecados te son perdonados.", "6": "Y estaban allí sentados algunos de los escribas, los cuales pensando en sus corazones,", "7": "Decían: ¿Por qué habla éste así? Blasfemias dice. ¿Quién puede perdonar pecados, sino solo Dios?", "8": "Y conociendo luego Jesús en su espíritu que pensaban así dentro de sí mismos, les dijo: ¿Por qué pensáis estas cosas en vuestros corazones?", "9": "¿Qué es más fácil, decir al paralítico: Tus pecados te son perdonados, ó decirle: Levántate, y toma tu lecho y anda?", "10": "Pues para que sepáis que el Hijo del hombre tiene potestad en la tierra de perdonar los pecados, (dice al paralítico):", "11": "A ti te digo: Levántate, y toma tu lecho, y vete á tu casa.", "12": "Entonces él se levantó luego, y tomando su lecho, se salió delante de todos, de manera que todos se asombraron, y glorificaron á Dios, diciendo: Nunca tal hemos visto.", "13": "Y volvió á salir á la mar, y toda la gente venía á él, y los enseñaba.", "14": "Y pasando, vió á Leví, hijo de Alfeo, sentado al banco de los públicos tributos, y le dice: Sígueme. Y levantándose le siguió.", "15": "Y aconteció que estando Jesús á la mesa en casa de él, muchos publicanos y pecadores estaban también á la mesa juntamente con Jesús y con sus discípulos: porque había muchos, y le habían seguido.", "16": "Y los escribas y los Fariseos, viéndole comer con los publicanos y con los pecadores, dijeron á sus discípulos: ¿Qué es esto, que él come y bebe con los publicanos y con los pecadores?", "17": "Y oyéndolo Jesús, les dice: Los sanos no tienen necesidad de médico, mas los que tienen mal. No he venido á llamar á los justos, sino á los pecadores.", "18": "Y los discípulos de Juan, y de los Fariseos ayunaban; y vienen, y le dicen: ¿Por qué los discípulos de Juan y los de los Fariseos ayunan, y tus discípulos no ayunan?", "19": "Y Jesús les dice: ¿Pueden ayunar los que están de bodas, cuando el esposo está con ellos? Entre tanto que tienen consigo al esposo no pueden ayunar.", "20": "Mas vendrán días, cuando el esposo les será quitado, y entonces en aquellos días ayunarán.", "21": "Nadie echa remiendo de paño recio en vestido viejo; de otra manera el mismo remiendo nuevo tira del viejo, y la rotura se hace peor.", "22": "Ni nadie echa vino nuevo en odres viejos; de otra manera, el vino nuevo rompe los odres, y se derrama el vino, y los odres se pierden; mas el vino nuevo en odres nuevos se ha de echar.", "23": "Y aconteció que pasando él por los sembrados en sábado, sus discípulos andando comenzaron á arrancar espigas.", "24": "Entonces los Fariseos le dijeron: He aquí, ¿por qué hacen en sábado lo que no es lícito?", "25": "Y él les dijo: ¿Nunca leísteis qué hizo David cuando tuvo necesidad, y tuvo hambre, él y los que con él estaban:", "26": "Cómo entró en la casa de Dios, siendo Abiathar sumo pontífice, y comió los panes de la proposición, de los cuales no es lícito comer sino á los sacerdotes, y aun dió á los que con él estaban?", "27": "También les dijo: El sábado por causa del hombre es hecho; no el hombre por causa del sábado.", "28": "Así que el Hijo del hombre es Señor aun del sábado."}, "KJV": {"1": "And again he entered into Capernaum after some days; and it was noised that he was in the house.", "2": "And straightway many were gathered together, insomuch that there was no room to receive them, no, not so much as about the door: and he preached the word unto them.", "3": "And they come unto him, bringing one sick of the palsy, which was borne of four.", "4": "And when they could not come nigh unto him for the press, they uncovered the roof where he was: and when they had broken it up, they let down the bed wherein the sick of the palsy lay.", "5": "When Jesus saw their faith, he said unto the sick of the palsy, Son, thy sins be forgiven thee.", "6": "But there were certain of the scribes sitting there, and reasoning in their hearts,", "7": "Why doth this man thus speak blasphemies? who can forgive sins but God only?", "8": "And immediately when Jesus perceived in his spirit that they so reasoned within themselves, he said unto them, Why reason ye these things in your hearts?", "9": "Whether is it easier to say to the sick of the palsy, Thy sins be forgiven thee; or to say, Arise, and take up thy bed, and walk?", "10": "But that ye may know that the Son of man hath power on earth to forgive sins, (he saith to the sick of the palsy,)", "11": "I say unto thee, Arise, and take up thy bed, and go thy way into thine house.", "12": "And immediately he arose, took up the bed, and went forth before them all; insomuch that they were all amazed, and glorified God, saying, We never saw it on this fashion.", "13": "And he went forth again by the sea side; and all the multitude resorted unto him, and he taught them.", "14": "And as he passed by, he saw Levi the son of Alpheus sitting at the receipt of custom, and said unto him, Follow me. And he arose and followed him.", "15": "And it came to pass, that, as Jesus sat at meat in his house, many publicans and sinners sat also together with Jesus and his disciples: for there were many, and they followed him.", "16": "And when the scribes and Pharisees saw him eat with publicans and sinners, they said unto his disciples, How is it that he eateth and drinketh with publicans and sinners?", "17": "When Jesus heard it, he saith unto them, They that are whole have no need of the physician, but they that are sick: I came not to call the righteous, but sinners to repentance.", "18": "And the disciples of John and of the Pharisees used to fast: and they come and say unto him, Why do the disciples of John and of the Pharisees fast, but thy disciples fast not?", "19": "And Jesus said unto them, Can the children of the bridechamber fast, while the bridegroom is with them? as long as they have the bridegroom with them, they cannot fast.", "20": "But the days will come, when the bridegroom shall be taken away from them, and then shall they fast in those days.", "21": "No man also seweth a piece of new cloth on an old garment: else the new piece that filled it up taketh away from the old, and the rent is made worse.", "22": "And no man putteth new wine into old bottles: else the new wine doth burst the bottles, and the wine is spilled, and the bottles will be marred: but new wine must be put into new bottles.", "23": "And it came to pass, that he went through the corn fields on the sabbath day; and his disciples began, as they went, to pluck the ears of corn.", "24": "And the Pharisees said unto him, Behold, why do they on the sabbath day that which is not lawful?", "25": "And he said unto them, Have ye never read what David did, when he had need, and was an hungred, he, and they that were with him?", "26": "How he went into the house of God in the days of Abiathar the high priest, and did eat the shewbread, which is not lawful to eat but for the priests, and gave also to them which were with him?", "27": "And he said unto them, The sabbath was made for man, and not man for the sabbath:", "28": "Therefore the Son of man is Lord also of the sabbath. "}, "ASV": {"1": "And when he entered again into Capernaum after some days, it was noised that he was in the house. ", "2": "And many were gathered together, so that there was no longer room for them, no, not even about the door: and he spake the word unto them. ", "3": "And they come, bringing unto him a man sick of the palsy, borne of four. ", "4": "And when they could not come nigh unto him for the crowd, they uncovered the roof where he was: and when they had broken it up, they let down the bed whereon the sick of the palsy lay. ", "5": "And Jesus seeing their faith saith unto the sick of the palsy, Son, thy sins are forgiven. ", "6": "But there were certain of the scribes sitting there, and reasoning in their hearts, ", "7": "Why doth this man thus speak? he blasphemeth: who can forgive sins but one, even God? ", "8": "And straightway Jesus, perceiving in his spirit that they so reasoned within themselves, saith unto them, Why reason ye these things in your hearts? ", "9": "Which is easier, to say to the sick of the palsy, Thy sins are forgiven; or to say, Arise, and take up thy bed, and walk? ", "10": "But that ye may know that the Son of man hath authority on earth to forgive sins (he saith to the sick of the palsy), ", "11": "I say unto thee, Arise, take up thy bed, and go unto thy house. ", "12": "And he arose, and straightway took up the bed, and went forth before them all; insomuch that they were all amazed, and glorified God, saying, We never saw it on this fashion. ", "13": "And he went forth again by the sea side; and all the multitude resorted unto him, and he taught them. ", "14": "And as he passed by, he saw Levi the son of Alphæus sitting at the place of toll, and he saith unto him, Follow me. And he arose and followed him. ", "15": "And it came to pass, that he was sitting at meat in his house, and many publicans and sinners sat down with Jesus and his disciples: for there were many, and they followed him. ", "16": "And the scribes of the Pharisees, when they saw that he was eating with the sinners and publicans, said unto his disciples, How is it that he eateth and drinketh with publicans and sinners? ", "17": "And when Jesus heard it, he saith unto them, They that are whole have no need of a physician, but they that are sick: I came not to call the righteous, but sinners. ", "18": "And John’s disciples and the Pharisees were fasting: and they come and say unto him, Why do John’s disciples and the disciples of the Pharisees fast, but thy disciples fast not? ", "19": "And Jesus said unto them, Can the sons of the bridechamber fast, while the bridegroom is with them? as long as they have the bridegroom with them, they cannot fast. ", "20": "But the days will come, when the bridegroom shall be taken away from them, and then will they fast in that day. ", "21": "No man seweth a piece of undressed cloth on an old garment: else that which should fill it up taketh from it, the new from the old, and a worse rent is made. ", "22": "And no man putteth new wine into old wine-skins; else the wine will burst the skins, and the wine perisheth, and the skins: but they put new wine into fresh wine-skins. ", "23": "And it came to pass, that he was going on the sabbath day through the grainfields; and his disciples began, as they went, to pluck the ears. ", "24": "And the Pharisees said unto him, Behold, why do they on the sabbath day that which is not lawful? ", "25": "And he said unto them, Did ye never read what David did, when he had need, and was hungry, he, and they that were with him? ", "26": "How he entered into the house of God when Abiathar was high priest, and ate the showbread, which it is not lawful to eat save for the priests, and gave also to them that were with him? ", "27": "And he said unto them, The sabbath was made for man, and not man for the sabbath: ", "28": "so that the Son of man is lord even of the sabbath.  "}, "BSB": {"1": " A few days later Jesus went back to Capernaum. And when the people heard that He was home, ", "2": "they gathered in such large numbers that there was no more room, not even outside the door, as Jesus spoke the word to them. ", "3": "Then a paralytic was brought to Him, carried by four men. ", "4": "Since they were unable to get to Jesus through the crowd, they uncovered the roof above Him, made an opening, and lowered the paralytic on his mat. ", "5": "When Jesus saw their faith, He said to the paralytic, “Son, your sins are forgiven.” ", "6": "But some of the scribes were sitting there and thinking in their hearts, ", "7": "“Why does this man speak like this? He is blaspheming! Who can forgive sins but God alone?” ", "8": "At once Jesus knew in His spirit that they were thinking this way within themselves. “Why are you thinking these things in your hearts?” He asked. ", "9": "“Which is easier: to say to a paralytic, ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’? ", "10": "But so that you may know that the Son of Man has authority on earth to forgive sins...” He said to the paralytic, ", "11": "“I tell you, get up, pick up your mat, and go home.” ", "12": "And immediately the man got up, picked up his mat, and walked out in front of them all. As a result, they were all astounded and glorified God, saying, “We have never seen anything like this!” ", "13": "  Once again Jesus went out beside the sea. All the people came to Him, and He taught them there. ", "14": "As He was walking along, He saw Levi son of Alphaeus sitting at the tax booth. “Follow Me,” He told him, and Levi got up and followed Him. ", "15": "While Jesus was dining at Levi’s house, many tax collectors and sinners were eating with Him and His disciples—for there were many who followed Him. ", "16": "When the scribes who were Pharisees saw Jesus eating with these people, they asked His disciples, “Why does He eat with tax collectors and sinners?” ", "17": "On hearing this, Jesus told them, “It is not the healthy who need a doctor, but the sick. I have not come to call the righteous, but sinners.” ", "18": "  Now John’s disciples and the Pharisees were often fasting. So people came to Jesus and asked, “Why don’t Your disciples fast like John’s disciples and those of the Pharisees?” ", "19": "Jesus replied, “How can the guests of the bridegroom fast while He is with them? As long as He is with them, they cannot fast. ", "20": "But the time will come when the bridegroom will be taken from them; then they will fast. ", "21": "  No one sews a patch of unshrunk cloth on an old garment. If he does, the new piece will pull away from the old, and a worse tear will result. ", "22": "And no one pours new wine into old wineskins. If he does, the wine will burst the skins, and both the wine and the wineskins will be ruined. Instead, new wine is poured into new wineskins.” ", "23": "  One Sabbath Jesus was passing through the grainfields, and His disciples began to pick the heads of grain as they walked along. ", "24": "So the Pharisees said to Him, “Look, why are they doing what is unlawful on the Sabbath?” ", "25": "Jesus replied, “Have you never read what David did when he and his companions were hungry and in need? ", "26": "During the high priesthood of Abiathar, he entered the house of God and ate the consecrated bread, which was lawful only for the priests. And he gave some to his companions as well.” ", "27": "Then Jesus declared, “The Sabbath was made for man, not man for the Sabbath. ", "28": "Therefore, the Son of Man is Lord even of the Sabbath.”  "}, "Darby": {"1": "And he entered again into Capernaum after [several] days, and it was reported that he was at [the] house; ", "2": "and straightway many were gathered together, so that there was no longer any room, not even at the door; and he spoke the word to them. ", "3": "And there come to him [men] bringing a paralytic, borne by four; ", "4": "and, not being able to get near to him on account of the crowd, they uncovered the roof where he was, and having dug [it] up they let down the couch on which the paralytic lay. ", "5": "But Jesus, seeing their faith, says to the paralytic, Child, thy sins are forgiven [thee]. ", "6": "But certain of the scribes were there sitting, and reasoning in their hearts, ", "7": "Why does this [man] thus speak? he blasphemes. Who is able to forgive sins exceptGod alone? ", "8": "And straightway Jesus, knowing in his spirit that they are reasoning thus within themselves, said to them, Why reason ye these things in your hearts? ", "9": "Which is easier, to say to the paralytic, [Thy] sins are forgiven [thee]; or to say, Arise, and take up thy couch and walk? ", "10": "But that ye may know that the Son of man has power on earth to forgive sins, he says to the paralytic, ", "11": "To thee I say, Arise, take up thy couch and go to thine house. ", "12": "And he rose up straightway, and, having taken up his couch, went out before [them] all, so that all were amazed, and glorifiedGod, saying, We never saw it thus. ", "13": "And he went out again by the sea, and all the crowd came to him, and he taught them. ", "14": "And passing by, he saw Levi the [son] of Alphaeus sitting at the tax-office, and says to him, Follow me. And he rose up and followed him. ", "15": "And it came to pass as he lay at table in his house, that many tax-gatherers and sinners lay at table with Jesus and his disciples; for they were many, and they followed him. ", "16": "And the scribes and the Pharisees, seeing him eating with sinners and tax-gatherers, said to his disciples, Why [is it] that he eats and drinks with tax-gatherers and sinners? ", "17": "And Jesus having heard [it] says to them, They that are strong have not need of a physician, but those who are ill. I have not come to call righteous [men], but sinners. ", "18": "And the disciples of John and the Pharisees were fasting; and they come and say to him, Why do the disciples of John and [the disciples] of the Pharisees fast, but thy disciples fast not? ", "19": "And Jesus said to them, Can the sons of the bride-chamber fast while the bridegroom is with them? As long as they have the bridegroom with them they cannot fast. ", "20": "But days will come when the bridegroom shall have been taken away from them, and then shall they fast in that day. ", "21": "No one sews a patch of new cloth on an old garment: otherwise its new filling-up takes from the old [stuff], and there is a worse rent. ", "22": "And no one puts new wine into old skins; otherwise the wine bursts the skins, and the wine is poured out, and the skins will be destroyed; but new wine is to be put into new skins. ", "23": "And it came to pass that he went on the sabbath through the cornfields; and his disciples began to walk on, plucking the ears. ", "24": "And the Pharisees said to him, Behold, why do they on the sabbath what is not lawful? ", "25": "And he said to them, Have ye never read what David did when he had need and hungered, he and those with him, ", "26": "how he entered into the house ofGod, in [the section of] Abiathar [the] high priest, and ate the shew-bread, which it is not lawful unless for the priests to eat, and gave even to those that were with him? ", "27": "And he said to them, The sabbath was made on account of man, not man on account of the sabbath; ", "28": "so that the Son of man is lord of the sabbath also.   "}, "LITV": {"1": "And again He entered into Capernaum after some days. And it was heard that He was in a house. ", "2": "And at once many were gathered, so as none any longer had room, not even to the door. And He spoke the Word to them. ", "3": "And they came to Him carrying a paralytic, being borne by four. ", "4": "And not being able to draw near to Him, due to the crowd, they unroofed the roof where He was. And digging through, they lowered the cot on which the paralytic was lying. ", "5": "And seeing their faith, Jesus said to the paralytic, Child, your sins are forgiven to you. ", "6": "But some of the scribes were sitting there and reasoning in their hearts, ", "7": "Why does this one speak blasphemies this way? Who is able to forgive sins, except One, God? ", "8": "And instantly knowing in His spirit that they reasoned this way within themselves, Jesus said to them, Why do you reason these things in your hearts? ", "9": "Which is easier? To say to the paralytic, Your sins are forgiven to you, or to say, Rise up and take your cot and walk? ", "10": "But that you may know that the Son of man has authority to forgive sins on the earth, He said to the paralytic, ", "11": "I say to you, Rise up and take up your cot and go to your house. ", "12": "And at once he rose up. And taking his cot, he went out before all, so that all were amazed and glorified God, saying, Never did we see it this way.   ", "13": "And he went out by the sea again. And all the crowd came to Him, and He taught them. ", "14": "And passing on, He saw Levi the son of Alpheus sitting at the tax office. And He said to him, Follow Me. And rising up, he followed Him. ", "15": "And it happened as He reclined in his house, even many tax collectors and sinners reclined with Jesus and His disciples, for they were many. And they followed Him. ", "16": "And the scribes and Pharisees seeing Him eating with tax collectors and sinners, they said to His disciples, Why is it that He eats and drinks with the tax collectors and sinners? ", "17": "And hearing, Jesus said to them, Those who are strong have no need of a physician, but those who have illness. I did not come to call the righteous to repentance, but sinners.   ", "18": "And John's disciples, and those of the Pharisees, were fasting. And they came and said to Him, Why do John's disciples and those of the Pharisees fast, but your disciples do not fast? ", "19": "And Jesus said to them, Can the sons of the bridechamber fast while the groom is with them? What time they have the groom with them, they cannot fast. ", "20": "But the days will come when the groom will be taken away from them, and then they will fast in those days. ", "21": "And no one sews a patch of unmilled cloth on an old garment, else it takes away its fullness, the new from the old, and a worse tear occurs. ", "22": "And no one puts new wine into old skins, else the new wine will burst the skins, and the wine pours out, and the skins will be destroyed. But new wine is put into fresh skins. ", "23": "And it happened, He went along through the grain fields in the sabbaths. And His disciples began to make way, plucking the heads of grain . ", "24": "And the Pharisees said to Him, Behold, why do they do that which is not lawful on the sabbaths? ", "25": "And He said to them, Did you never read what David did when he had need and hungered, he and those with him, ", "26": "how he entered the house of God in the days of Abiathar the high priest, and ate the Loaves of Arrangement, which it is not lawful to eat, except for the priests, and he even gave to those being with him? ", "27": "And He said to them, The sabbath came into being for man's sake, not man for the sabbath's sake. ", "28": "So then the Son of man is Lord of the sabbath also.  "}, "YLT": {"1": "And again he entered into Capernaum, after <FI>some<Fi> days, and it was heard that he is in the house,", "2": "and immediately many were gathered together, so that there was no more room, not even at the door, and he was speaking to them the word.", "3": "And they come unto him, bringing a paralytic, borne by four,", "4": "and not being able to come near to him because of the multitude, they uncovered the roof where he was, and, having broken <FI>it<Fi> up, they let down the couch on which the paralytic was lying,", "5": "and Jesus having seen their faith, saith to the paralytic, `Child, thy sins have been forgiven thee.'", "6": "And there were certain of the scribes there sitting, and reasoning in their hearts,", "7": "`Why doth this one thus speak evil words? who is able to forgive sins except one--God?'", "8": "And immediately Jesus, having known in his spirit that they thus reason in themselves, said to them, `Why these things reason ye in your hearts?", "9": "which is easier, to say to the paralytic, The sins have been forgiven to thee? or to say, Rise, and take up thy couch, and walk?", "10": "`And, that ye may know that the Son of Man hath authority on the earth to forgive sins--(he saith to the paralytic) --", "11": "I say to thee, Rise, and take up thy couch, and go away to thy house;'", "12": "and he rose immediately, and having taken up the couch, he went forth before all, so that all were astonished, and do glorify God, saying--`Never thus did we see.'", "13": "And he went forth again by the sea, and all the multitude was coming unto him, and he was teaching them,", "14": "and passing by, he saw Levi of Alpheus sitting at the tax-office, and saith to him, `Be following me,' and he, having risen, did follow him.", "15": "And it came to pass, in his reclining (at meat) in his house, that many tax-gatherers and sinners were reclining (at meat) with Jesus and his disciples, for there were many, and they followed him.", "16": "And the scribes and the Pharisees, having seen him eating with the tax-gatherers and sinners, said to his disciples, `Why--that with the tax-gatherers and sinners he doth eat and drink?'", "17": "And Jesus, having heard, saith to them, `They who are strong have no need of a physician, but they who are ill; I came not to call righteous men, but sinners to reformation.'", "18": "And the disciples of John and those of the Pharisees were fasting, and they come and say to him, `Wherefore do the disciples of John and those of the Pharisees fast, and thy disciples do not fast?'", "19": "And Jesus said to them, `Are the sons of the bride-chamber able, while the bridegroom is with them, to fast? so long time as they have the bridegroom with them they are not able to fast;", "20": "but days shall come when the bridegroom may be taken from them, and then they shall fast--in those days.", "21": "`And no one a patch of undressed cloth doth sew on an old garment, and if not--the new filling it up doth take from the old and the rent doth become worse;", "22": "and no one doth put new wine into old skins, and if not--the new wine doth burst the skins, and the wine is poured out, and the skins will be destroyed; but new wine into new skins is to be put.'", "23": "And it came to pass--he is going along on the sabbaths through the corn-fields--and his disciples began to make a way, plucking the ears,", "24": "and the Pharisees said to him, `Lo, why do they on the sabbaths that which is not lawful?'", "25": "And he said to them, `Did ye never read what David did, when he had need and was hungry, he and those with him?", "26": "how he went into the house of God, (at `Abiathar the chief priest,') and the loaves of the presentation did eat, which it is not lawful to eat, except to the priests, and he gave also to those who were with him?'", "27": "And he said to them, `The sabbath for man was made, not man for the sabbath,", "28": "so that the son of man is lord also of the sabbath.'"}, "Vulgate": {"1": "et iterum intravit Capharnaum post dies", "2": "et auditum est quod in domo esset et convenerunt multi ita ut non caperet neque ad ianuam et loquebatur eis verbum", "3": "et venerunt ferentes ad eum paralyticum qui a quattuor portabatur", "4": "et cum non possent offerre eum illi prae turba nudaverunt tectum ubi erat et patefacientes submiserunt grabattum in quo paralyticus iacebat", "5": "cum vidisset autem Iesus fidem illorum ait paralytico fili dimittuntur tibi peccata", "6": "erant autem illic quidam de scribis sedentes et cogitantes in cordibus suis", "7": "quid hic sic loquitur blasphemat quis potest dimittere peccata nisi solus Deus", "8": "quo statim cognito Iesus spiritu suo quia sic cogitarent intra se dic  "strongs_number": "G1909", "strongs_derivation": "a primary preposition;", "strongs_definition": "properly, meaning superimposition (of time,\n place, order, etc.), as a relation of distribution (with the genitive\n case), i.e. over, upon, etc.; of rest (with the dative case) at, on,\n etc.; of direction (with the accusative case) towards, upon,\n etc."}, {"greek": "γινώσκω", "meaning_es": "conocer", "strongs_number": "G1097", "strongs_derivation": "a prolonged form of a primary verb;", "strongs_definition": "to \"know\" (absolutely) in a great\n variety of applications and with many implications (as follow, with\n others not thus clearly expressed)"}], "meaning": "reconocer", "root_note": ""}, "Καπερναούμ": {"parts": [{"greek": "Καπερναούμ", "meaning_es": "Capernaúm", "type": "raíz"}], "meaning": "", "root_note": ""}, "Λευΐ": {"parts": [{"greek": "Λευΐ", "meaning_es": "Leví", "type": "raíz"}], "meaning": "", "root_note": ""}, "Φαρισαῖος": {"parts": [{"greek": "Φαρισαι", "meaning_es": "fariseo", "type": "raíz"}, {"greek": "-ων", "meaning_es": "genitivo plural masculino", "type": "desinencia"}], "meaning": "", "root_note": ""}, "αὐτός": {"parts": [{"greek": "αὐτ", "meaning_es": "él/mismo", "type": "raíz"}, {"greek": "ός", "meaning_es": "nominativo singular masculino", "type": "desinencia"}], "meaning": "", "root_note": ""}, "βάλλω": {"parts": [{"greek": "βαλ", "meaning_es": "lanzar", "type": "raíz"}, {"greek": "λω", "meaning_es": "presente activo indicativo 1ª singular", "type": "desinencia"}], "meaning": "", "root_note": ""}, "βλασφημέω": {"parts": [{"greek": "βλασφημ", "meaning_es": "blasfemar", "type": "raíz"}, {"greek": "έω", "meaning_es": "terminación verbal activa indicativo presente 3ª singular", "type": "desinencia"}], "meaning": "", "root_note": ""}, "γάρ": {"parts": [{"greek": "γαρ", "meaning_es": "porque", "type": "raíz"}], "meaning": "", "root_note": ""}, "γίνομαι": {"parts": [{"greek": "γιν", "meaning_es": "llegar a ser", "type": "raíz"}, {"greek": "ομα

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John 1 — Estudio</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root { --pri: #1a237e; --acc: #c62828; --bg: #f5f5f5; --card: #fff; --txt: #212121; --mut: #757575; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--txt); line-height: 1.6; }
.container { max-width: 1300px; margin: 0 auto; padding: 1.5rem; }
header { background: linear-gradient(135deg, #1a237e, #283593); color: white; padding: 2rem; text-align: center; border-radius: 12px; margin-bottom: 1.5rem; }
header h1 { font-size: 2.2rem; } header p { opacity: 0.8; }
.stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.stat { background: var(--card); padding: 1rem; border-radius: 10px; text-align: center; flex: 1; min-width: 100px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
.stat .num { font-size: 1.8rem; font-weight: 700; color: var(--pri); }
.stat .label { font-size: 0.7rem; color: var(--mut); text-transform: uppercase; }
.grid { display: grid; grid-template-columns: 5fr 3fr; gap: 1.5rem; }
@media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--card); border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 1.5rem; }
.card h2 { color: var(--pri); font-size: 1.1rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #e8eaf6; }
.verse-block { margin-bottom: 1rem; padding: 0.8rem; border: 1px solid #e0e0e0; border-radius: 8px; transition: border-color 0.2s; }
.verse-block:hover { border-color: var(--pri); }
.verse-line { margin-bottom: 0.3rem; }
.verse-line.main { font-size: 1rem; }
.verse-line.original { font-size: 0.95rem; color: #333; direction: rtl; font-family: 'SBL Hebrew', 'Ezra SIL', serif; }
.verse-line.greek { font-size: 0.92rem; color: #1b5e20; font-family: 'SBL Greek', 'GentiumPlus', serif; direction: ltr; }
.verse-line.lxx { font-size: 0.88rem; color: #4a148c; font-family: 'SBL Greek', 'GentiumPlus', serif; }
.trans-toggle { font-size: 0.7rem; cursor: pointer; color: var(--mut); margin-left: 0.3rem; user-select: none; }
.trans-toggle:hover { color: var(--pri); }
.verse-line.main.collapsed { display: none; }
.vnum { font-weight: 700; color: var(--acc); font-size: 0.8rem; margin-right: 0.3rem; }
.vlabel { font-size: 0.65rem; color: var(--mut); font-weight: 600; text-transform: uppercase; margin-right: 0.3rem; }
.verse-footer { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.4rem; flex-wrap: wrap; }
.vbtn { font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; border: 1px solid #ccc; background: #fafafa; cursor: pointer; transition: all 0.15s; }
.vbtn:hover { background: var(--pri); color: white; border-color: var(--pri); }
.vbtn.patr { background: #fce4ec; border-color: #e91e63; color: #880e4f; }
.vbtn.variant { background: #fff3e0; border-color: #ff9800; color: #e65100; }
.morph-word { display: inline; cursor: pointer; border-bottom: 1px dotted #999; }
.morph-word:hover { background: #bbdefb; border-radius: 3px; }
.word-tip { display: none; position: absolute; background: #333; color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.78rem; z-index: 50; max-width: 320px; line-height: 1.4; pointer-events: none; }
.popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3); z-index: 1000; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; }
.popup.show { display: block; } .popup h3 { color: var(--pri); margin-bottom: 0.8rem; }
.popup .close { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; color: var(--mut); }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; }
.overlay.show { display: block; }
.patr-item { margin-bottom: 0.8rem; padding: 0.7rem; background: #fce4ec; border-radius: 8px; border-left: 3px solid #c62828; }
.patr-item .father { font-weight: 700; color: #880e4f; font-size: 0.85rem; }
.patr-item .work { color: var(--mut); font-size: 0.75rem; font-style: italic; }
.patr-item .text { font-size: 0.85rem; margin-top: 0.3rem; }
.xref { display: inline-block; background: #e3f2fd; padding: 3px 10px; border-radius: 14px; margin: 3px; font-size: 0.78rem; color: #1565c0; cursor: pointer; position: relative; }
.xref:hover { background: #1565c0; color: white; }
.xref-tip { display: none; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; width: 280px; z-index: 50; line-height: 1.4; }
.xref:hover .xref-tip { display: block; }
.map-container img { max-width: 100%; border-radius: 8px; cursor: pointer; }
.map-container img.zoomed { position: fixed; top: 2%; left: 2%; width: 96%; height: 96%; object-fit: contain; z-index: 2000; background: white; border-radius: 0; }
.hint { font-size: 0.7rem; color: var(--mut); text-align: center; }
.chart-box { height: 220px; }
.timeline { padding-left: 1.5rem; border-left: 2px solid #c5cae9; }
.ev-item { position: relative; margin-bottom: 0.8rem; padding-left: 0.8rem; }
.ev-item::before { content: ''; position: absolute; left: -1.85rem; top: 0.5rem; width: 10px; height: 10px; background: var(--acc); border-radius: 50%; }
.ev-item .place { font-weight: 700; color: var(--pri); }
</style>
</head>
<body>
<div class="container">
<header><h1>John 1</h1><p>Estudio interactivo · MorphGNT</p></header>
<div class="stats">
  <div class="stat"><div class="num">51</div><div class="label">Versículos</div></div>
  <div class="stat"><div class="num">80</div><div class="label">Patrística</div></div>
  <div class="stat"><div class="num">60</div><div class="label">Refs. Cruzadas</div></div>
  <div class="stat"><div class="num">3</div><div class="label">Lugares</div></div>
</div>
<div class="card map-container">
  <h2>🗺️ Mapa Geográfico</h2>
  <img src="map.png" alt="Mapa" id="mapImg">
  <p class="hint">Click para ampliar</p>
</div>
<div class="grid">
<div class="main-col">
  <div class="card"><h2>📖 Texto</h2><div id="versesContainer"></div></div>
</div>
<div class="side-col">
  <div class="card"><h2>📊 Padres</h2><div class="chart-box"><canvas id="fathersChart"></canvas></div></div>
  <div class="card"><h2>🔗 Referencias Cruzadas</h2><div id="xrefsContainer"></div></div>
  <div class="card"><h2>📅 Eventos</h2><div class="timeline" id="eventsContainer"></div></div>
</div>
</div>
</div>
<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup"><span class="close" onclick="closePopup()">&times;</span><div id="popupContent"></div></div>
<script>
const D = {"book": "John", "chapter": 1, "version": "MorphGNT", "verses": [{"v": 1, "text": "Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος."}, {"v": 2, "text": "οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν."}, {"v": 3, "text": "πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν"}, {"v": 4, "text": "ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·"}, {"v": 5, "text": "καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν."}, {"v": 6, "text": "Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·"}, {"v": 7, "text": "οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ."}, {"v": 8, "text": "οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός."}, {"v": 9, "text": "ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον."}, {"v": 10, "text": "Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω."}, {"v": 11, "text": "εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον."}, {"v": 12, "text": "ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,"}, {"v": 13, "text": "οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν."}, {"v": 14, "text": "Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·"}, {"v": 15, "text": "(Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)"}, {"v": 16, "text": "⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·"}, {"v": 17, "text": "ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο."}, {"v": 18, "text": "θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο."}, {"v": 19, "text": "Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;"}, {"v": 20, "text": "καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός."}, {"v": 21, "text": "καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ."}, {"v": 22, "text": "εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;"}, {"v": 23, "text": "ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης."}, {"v": 24, "text": "⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων."}, {"v": 25, "text": "καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;"}, {"v": 26, "text": "ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,"}, {"v": 27, "text": "⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος."}, {"v": 28, "text": "ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ⸀ὁ Ἰωάννης βαπτίζων."}, {"v": 29, "text": "Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου."}, {"v": 30, "text": "οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·"}, {"v": 31, "text": "κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων."}, {"v": 32, "text": "καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·"}, {"v": 33, "text": "κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·"}, {"v": 34, "text": "κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ."}, {"v": 35, "text": "Τῇ ἐπαύριον πάλιν εἱστήκει ⸀ὁ Ἰωάννης καὶ ἐκ τῶν μαθητῶν αὐτοῦ δύο,"}, {"v": 36, "text": "καὶ ἐμβλέψας τῷ Ἰησοῦ περιπατοῦντι λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ."}, {"v": 37, "text": "καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ."}, {"v": 38, "text": "στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;"}, {"v": 39, "text": "λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη."}, {"v": 40, "text": "ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·"}, {"v": 41, "text": "εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός)."}, {"v": 42, "text": "⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος)."}, {"v": 43, "text": "Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι."}, {"v": 44, "text": "ἦν δὲ ὁ Φίλιππος ἀπὸ Βηθσαϊδά, ἐκ τῆς πόλεως Ἀνδρέου καὶ Πέτρου."}, {"v": 45, "text": "εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ."}, {"v": 46, "text": "καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε."}, {"v": 47, "text": "εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν."}, {"v": 48, "text": "λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε."}, {"v": 49, "text": "ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ."}, {"v": 50, "text": "ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ."}, {"v": 51, "text": "καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου."}], "parallel": {"MorphGNT": {"1": "Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.", "2": "οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.", "3": "πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν", "4": "ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·", "5": "καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.", "6": "Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·", "7": "οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.", "8": "οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.", "9": "ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.", "10": "Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.", "11": "εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.", "12": "ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,", "13": "οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.", "14": "Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·", "15": "(Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)", "16": "⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·", "17": "ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.", "18": "θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.", "19": "Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;", "20": "καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.", "21": "καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.", "22": "εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;", "23": "ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.", "24": "⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.", "25": "καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;", "26": "ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,", "27": "⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.", "28": "ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ⸀ὁ Ἰωάννης βαπτίζων.", "29": "Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.", "30": "οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·", "31": "κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων.", "32": "καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·", "33": "κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·", "34": "κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.", "35": "Τῇ ἐπαύριον πάλιν εἱστήκει ⸀ὁ Ἰωάννης καὶ ἐκ τῶν μαθητῶν αὐτοῦ δύο,", "36": "καὶ ἐμβλέψας τῷ Ἰησοῦ περιπατοῦντι λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ.", "37": "καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.", "38": "στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;", "39": "λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.", "40": "ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·", "41": "εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).", "42": "⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).", "43": "Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.", "44": "ἦν δὲ ὁ Φίλιππος ἀπὸ Βηθσαϊδά, ἐκ τῆς πόλεως Ἀνδρέου καὶ Πέτρου.", "45": "εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.", "46": "καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.", "47": "εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.", "48": "λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.", "49": "ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.", "50": "ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.", "51": "καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου."}}, "patristic": [{"v": 1, "f": "1 Clement", "w": "Chapter XI—Proofs in continuation, extracted from St. John’s Gospel. The\nGospels are four in number, neither more nor less. Mystic reasons for this.", "t": "any\nothers of the Fathers follow his example.\n782 John i. 1, etc.\n783 See ii. 1, etc.\n784 John i. 10, 11.\n\n\ncome to His own things, but to those of another. And, according to certain of the Gnostics,\nthis world was made by angels, and not by the Word of God."}, {"v": 1, "f": "1 Clement", "w": "Chapter IV.—Continuation.", "t": "The Evangelists, too, when they declared that the one Father was “the only true God,”748\ndid not omit what concerned our Lord, but wrote: “In the beginning was the Word, and the\nWord was with God, and the Word was God. The same was in the beginning with God. All\nthings were made by Him, and without Him was not anything made that was made.”749\nAnd concerning the incarnation: “The Word,” says [the Scripture], “became flesh, and dwelt\namong us.”750 And again: “The book of the generation of Jesus Christ, the son of David,\nthe son of Abraham.”751 And those very apostles, who said “that there is one"}, {"v": 1, "f": "1 Clement", "w": "Chapter VI.—Names of God and of Christ, their meaning and power.", "t": "But to the Father of all, who is unbegotten, there is no name given. For by whatever\nname He be called, He has as His elder the person who gives Him the name. But these words,\nFather, and God, and Creator, and Lord, and Master, are not names, but appellations derived\nfrom His good deeds and functions. And His Son, who alone is properly called Son, the\nWord, who also was with Him and was begotten before the works, when at first He created\nand arranged all things by Him, is called Christ, in reference to His being anointed and\nGod’s ordering all things through Him; this name itself also containi"}, {"v": 1, "f": "1 Clement", "w": "Chapter VIII.—How the Valentinians pervert the Scriptures to support their\nown pious opinions.", "t": "5. Further, they teach that John, the disciple of the Lord, indicated the first Ogdoad,\nexpressing themselves in these words: John, the disciple of the Lord, wishing to set forth the\norigin of all things, so as to explain how the Father produced the whole, lays down a certain\nprinciple,—that, namely, which was first-begotten by God, which Being he has termed both\nthe only-begotten Son and God, in whom the Father, after a seminal manner, brought forth\nall things. By him the Word was produced, and in him the whole substance of the Æons, to\nwhich the Word himself afterwards imparted form. Since, "}, {"v": 1, "f": "1 Clement", "w": "Chapter IX.—Refutation of the impious interpretations of these heretics.", "t": "2. The fallacy, then, of this exposition is manifest. For when John, proclaiming one God,\nthe Almighty, and one Jesus Christ, the Only-begotten, by whom all things were made, declares\nthat this was the Son of God, this the Only-begotten, this the Former of all things,\nthis the true Light who enlighteneth every man, this the Creator of the world, this He that\ncame to His own, this He that became flesh and dwelt among us,—these men, by a plausible\nkind of exposition, perverting these statements, maintain that there was another Monogenes,\naccording to production, whom they also style Arche. They "}, {"v": 1, "f": "1 Clement", "w": "Chapter XVIII.—Continuation of the foregoing argument. Proofs from the\nwritings of St. Paul, and from the words of Our Lord, that Christ and Jesus cannot\nbe considered as distinct beings; neither can it be alleged that the Son of God\nbecame man merely in appearance, but that He did so truly and actually.", "t": "1.984 As it has been clearly demonstrated that the Word, who existed in the beginning\nwith God, by whom all things were made, who was also always present with mankind, was\nin these last days, according to the time appointed by the Father, united to His own workmanship,\ninasmuch as He became a man liable to suffering, [it follows] that every objection\nis set aside of those who say, “If our Lord was born at that time, Christ had therefore no\nprevious existence.” For I have shown that the Son of God did not then begin to exist, being\nwith the Father from the beginning; but when He became incarnat"}, {"v": 1, "f": "Alcuin of York", "w": "", "t": "To refute those who inferred from Christ's Birth in time, that He had not been from everlasting, the Evangelist begins with the eternity of the Word, saying, In the beginning was the Word.\n\nAnd the Word was with God."}, {"v": 1, "f": "Alexander of Alexandria", "w": "", "t": "But they will not prevail; for the truth prevails, and there is no communion betwixt light and darkness, no concord between Christ and Belial. For who ever heard such things? or who, now hearing them, is not astonished, and does not stop his ears that the pollution of these words should not touch them? Who that hears John saying, \"In the beginning was the Word,\" does not condemn those who say there was a time when He was not? Who that hears these words of the Gospel, \"the only-begotten Son;\" and, \"by Him were all things made,\" will not hate those who declare He is one of the things made? For h"}, {"v": 1, "f": "Alexander of Alexandria", "w": "", "t": "Now that also the Word of God is not comprehended in the number of things that were created \"from things which are not,\" the same John says, \"All things were made by Him.\" For he set forth His proper personality, saying, \"In the beginning was the Word, and the Word was with God, and the Word was God. All things were made by Him; and without Him was not anything made that was made.\" For if all things were made by Him, how comes it that He who gave to the things which are made their existence, at one time Himself was not? For the Word which makes is not to be defined as being of the same nature "}, {"v": 1, "f": "Ambrose of Milan", "w": "", "t": "“In the beginning,” we are told, “God created heaven and earth.” And the world was therefore created and that which was not began to exist. And the word of God was in the beginning and always was."}, {"v": 1, "f": "Ambrose of Milan", "w": "", "t": "That which was “in the beginning” is not comprehended in time, is not preceded by any beginning. Let Arius, therefore, hold his peace. Moreover, that which was “with God” is not confounded and mingled with him but is distinguished by the perfection unblemished that it has as the Word abiding with God; and so let Sabellius keep silence. And “the Word was God.” This Word, therefore, consists not in uttered speech but in the designation of celestial excellence, so that Photinus’s teaching is refuted. Furthermore, by the fact that in the beginning he was with God is proven the indivisible unity of"}, {"v": 1, "f": "Ambrose of Milan", "w": "", "t": "Let the soul that wishes to approach God raise itself from the body and cling always to that highest Good that is divine and lasts forever and that was from the beginning and that was with God, that is, the Word of God. This is the divine Being “in which we live and are and move.” This was in the beginning, this is “The Son of God, Jesus Christ in you,” he says, “in whom there was not yes and no, but only yes was in him.” He himself told Moses to say, “He who is has sent me.”"}, {"v": 1, "f": "Athanasius of Alexandria", "w": "", "t": "[The Arians] whisper, “How can the Son be Word or the Word be God’s image? For a human word is composed of syllables, and only signifies the speaker’s will and then is over and done with.” … But the word of truth confutes them as follows: If they were disputing concerning any human being, then let them exercise reason in this human way, both concerning his Word and his Son. But if their dispute concerns God, who created humanity, let them no longer entertain human thoughts but others that are above human nature. For such as he that begets, such of necessity is the offspring. Whatever the Word’"}, {"v": 1, "f": "Augustine", "w": "Tractates on John, Tr. 1", "t": "In principio erat Verbum. This Word is not what we speak and passes away. This is the Word that remains. Consider how poor human speech is: my words strike your ears, and if you do not understand, I have spoken in vain. But the Word of God is always spoken and always heard."}, {"v": 1, "f": "Augustine - City of God", "w": "Index of Scripture Commentary", "t": "John\n1:1-5 1:6-14 1:15-18 1:19-33 1:32-33 1:33 1:34-51 2:1-4 2:1-11 2:12-21 2:23-25\n3:1-5 3:6-21 3:22-29 3:29-36 4:1-18 4:1-42 4:43-54 5:19 5:19 5:19-30 5:19-40\n5:20-23 5:24-30 6:1-14 6:15-44 6:41-59 6:60-72 7:1-13 7:14-18 7:19-24 7:25-36\n7:37-39 7:40-53 8:1-11 8:12 8:13-14 8:15-18 8:19-20 8:21-25 8:26-27 8:28-32\n8:31-36 8:37-47 8:48-59 9 10:1-10 10:11-13 10:14-21 10:22-42 11:1-54 11:55-57\n12 12:12-26 12:27-36 12:37-43 12:44-50 13:1-5 13:6-10 13:6-10 13:10 13:10-15\n13:16-20 13:21 13:21-26 13:26-31 13:31-32 13:33 13:34-35 13:36-38 14:1-3 14:1-3\n14:4-6 14:7-10 14:10-14 14:10-14 14:10-14 14:15-17"}, {"v": 1, "f": "Augustine - City of God", "w": "Homily I.", "t": "rtyrs are God’s witnesses. It pleased God to\n1994 John i. 1.\n1995 Ps. lxxviii. 25.\n1996 1 John i. 2.\n1997 Edd. Non calcibus persequamur: “not virtually trample upon, or kick at them, persecuting the martyrs\nafresh by turning their festivals into luxurious org"}, {"v": 1, "f": "Augustine - Confessions", "w": "Sermon LXVII.", "t": "On the words of the Gospel, John i. 1, “In the beginning was the word, and the word was with\nGod, and the word was God,” etc. Against the Arians."}, {"v": 1, "f": "Augustine - Confessions", "w": "Sermon XLII.", "t": ". Ben.) 1–5 (i.-iv.), Epist. 236 (al. 74) 2.\n3082 John i. 1.\n3083 Phil. ii. 6.\n\n\nw"}, {"v": 1, "f": "Augustine - Confessions", "w": "Sermon LXVIII.", "t": "1. All ye who are looking for a man’s many words, understand the One Word of God,\n“In the beginning was the Word.”3598 Now, “In the beginning God made the heaven and\nthe earth.”3599 But, “The Word was,” since we have heard, “In the beginning God made.”\nAcknowledge we in Him the Creator; for Creator is He who made; and the creature what\nHe made. For no creature which was made “was,” as God the Word “was,” by whom it was\nmade, always. Now when we heard “The Word was,” with whom was It? We understand\nthe Father who did not make nor create the Same Word, but begat Him. For, “In the beginning\nGod m"}, {"v": 1, "f": "Augustine - Trinity", "w": "Psalm L.1675", "t": "1676 Some mss. “meditate.”\n1677 John i. 14.\n1678 John i. 1.\n1679 Ps. lxxxii. 1.\n1680 Ps. lxxxii. 6, 7.\n\n\nthe sons of God.”1681 If we have been made sons of God, we have also been made gods: but\nthis is the effect of Grace adopting, not of nature generating."}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "(lib. lxxxiii. Quæst. q. 63) The Greek word \"logos\" signifies both Word and Reason. But in this passage it is better to interpret it Word; as referring not only to the Father, but to the creation of things by the operative power of the Word; whereas Reason, though it produce nothing, is still rightly called Reason.\n\n(Tract. super Joan. i. c. 8) Words by their daily use, sound, and passage out of us, have become common things. But there is a word which remaineth inward, in the very man himself; distinct from the sound which proceedeth out of the mouth. There is a word, which is truly and spirit"}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "There are two births of our Lord Jesus Christ, the one divine, the other human.… Consider that first begetting: \"In the beginning was the Word, and the Word was with God, and the Word was God.\" Whose Word? The Father's own. Which Word? The Son himself. The Father has never been without the Son; and yet the one who has never been without the Son begot the Son. He both begot and yet did not begin to do so. There is no beginning for one begotten without beginning. And yet he is the Son, and yet he is begotten. A mere human is going to say, \"How is it that he is begotten, and yet he does not have "}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "Moses, they tell us, says, \"In the beginning God made heaven and earth,\" and does not even mention the Son through whom all things were made; whereas John says, \"In the beginning was the Word, and the Word was with God, and the Word was God. This was in the beginning with God, all things were made through him, and without him was made nothing.\" Is this contradictory, or are they not rather contradicting themselves when they prefer blindly to find fault with what they do not understand instead of earnestly seeking to understand?… For the Lord says to the unbelieving Jews, \"If you believed Moses"}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "Whoever, then, is able to understand a word, not only before it is uttered in sound but also before the images of its sounds are considered in thought … may see enigmatically, and as it were in a glass, some similarity with that Word of which it is said, \"In the beginning was the Word.\" … For when we give expression to something that we know, the word used is necessarily derived from the knowledge thus retained in the memory and must be of the same quality with that knowledge. For a word is a thought formed from a thing that we know. This word is spoken in the heart, being neither Greek nor La"}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "Just as our knowledge is not like God's knowledge, so also is our word, born from our knowledge, unlike that Word of God which is born from the essence of the Father—we might even say, born from the Father's knowledge, from the Father's wisdom, or still more exactly, from the Father who is knowledge, from the Father who is wisdom.…The Word of God, then, the only begotten Son of the Father—in all things like and equal to the Father, God of God, Light of Light, Wisdom of Wisdom, Essence of Essence—is altogether what the Father is. And yet, he is not the Father because the one is Son, the other i"}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "We are not now discussing, brothers and sisters, possible ways of understanding the text, \"In the beginning was the Word, and the Word was with God, and the Word was God.\" It can only be understood in ways beyond words; human words cannot suffice for understanding the Word of God. What we are discussing and stating is why it is not understood. I am not speaking in order that it may be understood but telling you what prevents it being understood.You see, it is a kind of form, a form that has not been formed but is the form of all things that have been formed; an unchangeable form that has neith"}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "But let us see what advantage it is that these words have sounded, \"In the beginning was the Word, and the Word was with God, and the Word was God.\" We also uttered words when we spoke. Was it such a word that was with God? Did not those words which we uttered sound and pass away? Did God's Word, then, sound and come to an end? If so, how were all things made by it, and without it was nothing made? how is that which it created ruled by it, if it sounded and passed away? What sort of a word, then, is that which is both uttered and passes not away? Give ear, my beloved, it is a great matter. By "}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "Perhaps some one now answers me, \"Who so conceives this Word?\" Do not then imagine, as it were, some paltry thing when thou hearest \"the Word,\" nor suppose it to be words such as thou hearest them every day-\"he spoke such words,\" \"such words he uttered,\" \"such words you tell me;\" for by constant repetition the term word has become, so to speak, worthless. And when thou hearest, \"In the beginning was the Word,\" lest thou shouldest imagine something worthless, such as thou hast been accustomed to think of when thou weft wont to listen to human words, hearken to what thou must think of: \"The Word"}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "Now some unbelieving Arian may come forth and say that \"the Word of God was made.\" How can it be that the Word of God was made, when God by the Word made all things? If the Word of God was itself also made, by what other Word was it made? But if thou sayest that there is a Word of the Word, I say, that by which it was made is itself the only Son of God. But if thou dost not say there is a Word of the Word, allow that that was not made by which all things were made. For that by which all things were made could not be made by itself. Believe the evangelist then. For he might have said, \"In the b"}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "Do not then believe that that was made by which were made all things, lest thou be not new-made by the Word, which makes all things new. For already hast thou been made by the Word, but it behoves thee to be new-made by the Word. If, however, thy belief about the Word be wrong, thou wilt not be able to be new-made by the Word. And although creation by the Word has happened to thee, so that thou hast been made by Him, thou art unmade by thyself: if by thyself thou art unmade, let Him who made thee make thee new: if by thyself thou hast been made worse, let Him who created thee re-create thee. B"}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "Consider the body: it is mortal, earthy, weak, corruptible; away with it. Yes, perhaps thou sayest, but the body is temporal. Think then of other bodies, the heavenly; they are greater, better, more magnificent. Look at them, moreover, attentively. They roll from east to west, they stand not; they are seen with the eyes, not only by man, but even by the beast of the field. Pass beyond them too. And how, sayest thou, pass beyond the heavenly bodies, seeing that I walk on the earth? Not in the flesh dost thou pass beyond them, but in the mind. Away with them too: though they shine ever so much, "}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "Do not imagine that thou art to do something beyond a man's ability. The Evangelist John himself did this. He soared beyond the flesh, beyond the earth which he trod, beyond the seas which he looked upon, beyond the air in which the fowls fly, beyond the sun, the moon, the stars, beyond all the spirits unseen, beyond his own mind, by the very reason of his rational soul. Soaring beyond all these, pouring out his soul above him, whither did he arrive? What did he see? \"In the beginning was the Word, and the Word was with God.\" If, therefore, thou seest no separation in the light, why seekest th"}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "If, indeed, thou canst separate the brightness from the sun, then separate the Word from the Father. I am speaking of the sun. One small, slender flame of a lamp, which can be extinguished by one breath, spreads its light over all that lies near it: thou seest the light generated by the flame spread out; thou seest its emission, but not a separation. Understand, then, beloved brethren, that the Father, and the Son, and the Holy Ghost are inseparably united in themselves; that this Trinity is one God; that all the works of the one God are the works of the Father, of the Son, and of the Holy Gho"}, {"v": 1, "f": "Basil of Caesarea", "w": "", "t": "(Hom. in princ. Joan.) This Word is not a human word. For how was there a human word in the beginning, when man received his being last of all? There was not then any word of man in the beginning, nor yet of Angels; for every creature is within the limits of time, having its beginning of existence from the Creator. But what says the Gospel? It calls the Only-Begotten Himself the Word.\n\n(Hom. in Princ. Joan. c. 3) Wherefore then Word? Because born impassibly, the Image of Him that begat, manifesting all the Father in Himself; abstracting from Him nothing, but existing perfect in Himself.\n\n(Hom."}, {"v": 1, "f": "Basil of Caesarea", "w": "", "t": "This Word is not a human word. For how was there a human word in the beginning, when man received his being last ofall? There was not then any word of man in the beginning, nor yet of Angels; for every creature is within the limits of time, having its beginning of existence from the Creator. But what says the Gospel? It calls the Only-Begotten Himself the Word.\nWherefore then Word? Because born impassibly, the Image of Him that begat, manifesting all the Father in Himself; abstracting from Him nothing, but existing perfect in Himself.\nYet has our outward word some similarity to the Divine Word"}, {"v": 1, "f": "Bede", "w": "", "t": "(in loc.) The other Evangelists describe Christ as born in time; John witnesseth that He was in the beginning, saying, In the beginning was the Word. The others describe His sudden appearance among men; he witnesseth that He was ever with God, saying, And the Word was with God. The others prove Him very man; he very God, saying, And the Word was God. The others exhibit Him as man conversing with men for a season; he pronounces Him God abiding with God in the beginning, saying, The Same was in the beginning with God. The others relate the great deeds which He did amongst men; he that God the Fa"}, {"v": 1, "f": "CS Lewis", "w": "", "t": "Neither Will nor Reason is the product of Nature. Therefore either I am self-existent (a belief which no one can accept) or I am a colony of some Thought and Will that are self-existent. Such reason and goodness as we can attain must be derived from a self-existent Reason and Goodness outside ourselves, in fact, a Supernatural."}, {"v": 1, "f": "CS Lewis", "w": "", "t": "A question at once arises. Is it still God speaking when a liar or a blasphemer speaks? In one sense, almost Yes. Apart from God he could not speak at all; there are no words not derived from the Word; no acts not derived from Him who is _Actus purus_. And indeed the only way in which I can make real to myself what theology teaches about the heinousness of sin is to remember that every sin is the distortion of an energy breathed into us—an energy which, if not thus distorted, would have blossomed into one of those holy acts whereof \"God did it\" and \"I did it\" are both true descriptions. We poi"}, {"v": 1, "f": "CS Lewis", "w": "", "t": "Even within the Holy One Himself, it is not sufficient that the Word should be God, it must also be with God. The Father eternally begets the Son and the Holy Ghost proceeds: deity introduces distinction within itself so that the union of reciprocal loves may transcend mere arithmetical unity or self identity."}, {"v": 1, "f": "CS Lewis", "w": "", "t": "In the second place he convinced me that the positions we had hitherto held left no room for any satisfactory theory of knowledge. We had been, in the technical sense of the term, \"realists\"; that is, we accepted as rock-bottom reality the universe revealed by the senses. But at the same time we continued to make for certain phenomena of consciousness all the claims that really went with a theistic or idealistic view. We maintained that abstract thought (if obedient to logical rules) gave indisputable truth, that our moral judgment was \"valid\", and our aesthetic experience not merely pleasing "}, {"v": 1, "f": "CS Lewis", "w": "", "t": "Do not think I am going faster than I really am. I am not yet within a hundred miles of the God of Christian theology. All I have got to is a Something which is directing the universe, and which appears in me as a law urging me to do right and making me feel responsible and uncomfortable when I do wrong. I think we have to assume it is more like a mind than it is like anything else we know—because after all the only other thing we know is matter and you can hardly imagine a bit of matter giving instructions. But, of course, it need not be very like a mind, still less like a person."}, {"v": 1, "f": "Chrysostom", "w": "Homilies on John, Hom. 2-5", "t": "The evangelist did not say \"In the beginning was made\" or \"came to be\" but \"was\" (ἦν), showing the eternal pre-existence of the Word without beginning. And \"the Word was with God\" shows distinct personhood, while \"the Word was God\" shows unity of essence."}, {"v": 1, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Index of Scripture Commentary", "t": "John\n1:1 1:1 1:1 1:3 1:6 1:9 1:9 1:11 1:11 1:14 1:14 1:15 1:16 1:18 1:19 1:28-29\n1:35-37 1:41-42 1:43-44 1:49-50 2:4 2:11 2:23 3:5 3:6 3:12-13 3:17 3:22 3:31\n3:35-36 4:13-14 4:21-22 4:28-29 4:40-43 4:54 5:1 5:6-7 5:14 5:23-24 5:31-32\n5:39-40 6:1 6:4 6:16-18 6:26-27 6:28-30 6:41-42 6:53-54 7:1-2 7:9-10 7:25-27\n7:37-38 7:45-46 8:20 8:31-32 8:48-49 9:1-2 9:6-7 9:17-18 9:32-36 10:14-15\n10:22-24 11:1-2 11:30-31 11:41-42 11:49-50 12:8 12:25-26 12:34 12:42-43 13 13:1\n13:20 13:36 14:8-9 14:15-17 14:31 15:1 15:11-12 16:4-6 16:16-17 17:1 17:6 17:14\n18:1 18:37 19:16-18 20:10-11 20:24-25 21:15"}, {"v": 1, "f": "Clement of Alexandria", "w": "", "t": "Nothing, then, is hated by God, nor yet by the Word. For both are one-that is, God. For He has said, \"In the beginning the Word was in God, and the Word was God.\" If then He hates none of the things which He has made, it follows that He loves them. Much more than the rest, and with reason, will He love man, the noblest of all objects created by Him, and a God-loving being. Therefore God is loving; consequently the Word is loving."}, {"v": 1, "f": "Cosmas of Maiuma", "w": "", "t": "The Father begot me, creative Wisdom, before the ages;\nHe established me as the beginning of his ways\nFor the works now mystically accomplished\nFor though I am the uncreated Word by nature,\nI make my own the voice\nOf the nature I have now assumed.\nAs I am a man\nIn reality, not a mirage,\nSo divinized is the nature which,\nBy the manner of the exchange,\nIs united to me.\nWherefore know that I am one Christ\nWho saves that of which and in which I am."}, {"v": 1, "f": "Council of Ephesus", "w": "", "t": "(Gest. Conc. Eph.) Wherefore in one place divine Scripture calls Him the Son, in another the Word, in another the Brightness of the Father; names severally meant to guard against blasphemy. For, forasmuch as thy son is of the same nature with thyself, the Scripture wishing to show that the Substance of the Father and the Son is one, sets forth the Son of the Father, born of the Father, the Only-Begotten. Next, since the terms birth and son, convey the idea of passibleness, therefore it calls the Son the Word, declaring by that name the impassibility of His Nativity. But inasmuch as a father wi"}, {"v": 1, "f": "Cyprian", "w": "", "t": "That the same Christ is the Word of God. In the forty-fourth Psalm: \"My heart hath breathed out a good Word. I tell my works to the King.\" Also in the thirty-second Psalm: \"By the Word of God were the heavens made fast; and all their strength by the breath of His mouth.\" Also in Isaiah: \"A Word completing and shortening in righteousness, because a shortened word will God make in the whole earth.\" Also in the cvith Psalm: \"He sent His Word, and healed them.\" Moreover, in the Gospel according to John: \"In the beginning was the Word, and the Word was with God, and God was the Word. The same was i"}, {"v": 1, "f": "Cyprian", "w": "", "t": "That Christ is God. In Genesis: \"And God said unto Jacob, Arise, and go up to the place of Bethel, and dwell there; and make there an altar to that God who appeared unto thee when thou reddest from the face of thy brother Esau.\" Also in Isaiah: \"Thus saith the Lord, the God of Sabaoth, Egypt is wearied; and the merchandise of the Ethiopians, and the tall men of the Sabeans, shall pass over unto Thee, and shall be Thy servants; and shall walk after Thee bound with chains; and shall worship Thee, and shall pray to Thee, because God is in Thee, and there is no other God beside Thee. For Thou art "}, {"v": 1, "f": "Cyril of Alexandria", "w": "", "t": "Exact of a truth, and God-taught is the mind of the holy Evangelists, from the splendour of their power to behold, as from some lofty mountain-spur and watch-peak, on all sides observing what is of profit to the hearers, and tracking with intent zeal whatever may seem to be of profit to those who thirst after the truth of the Divine dogmas and with good purpose search after the mind that is hidden in the Divine Scriptures. For not in those who search too curiously, and take pleasure in the many-tangled wiles of reasonings, rather than rejoice in the truth, does the Spirit make His revelation, "}, {"v": 1, "f": "Cyril of Alexandria", "w": "", "t": "THE LORD will give utterance to them who evangelize with much power, declareth exceeding well the Psalmist. But I deem that they who ought to approach this, are, not mere chance persons, but those who have been illumined with the grace that is from above, seeing that both All wisdom is from the Lord, as it is written, and Every good gift and every perfect gift is from above and cometh down from the Father of lights. For a thing unsure and not unfraught with peril to the many, is the speaking concerning the Essence that is above all, and the Mysteries belonging thereunto, and silence on these s"}, {"v": 1, "f": "Cyril of Alexandria", "w": "", "t": "CHAPTER III. That the Son is both God by Nature and in no wise either inferior to or unlike the Father.\n\nAnd the Word was God.\n\nHe who bare within him the Spirit was not ignorant that there should arise some in the last times who should accuse the Essence of the Only Begotten and deny the Lord that bought them, by supposing that the Word Who appeared from God the Father is not by Nature God, but should bring in besides Him some so to speak spurious and false-called god, having about him the name of Sonship and Deity, but not so in truth. Such do they, who give the Jewish impiety of Arius an ab"}, {"v": 1, "f": "Cyril of Alexandria", "w": "", "t": "CHAPTER I. That Everlasting and before the ages is the Only-Begotten.\n\nWhat do they say to this [namely, In the beginning was the Word] who introduce to us the Son, as one new and of late, that so He may no longer be believed to be even God at all. For, says the Divine Scripture, there shall no new God be in thee. How then is He not new, if He were begotten in the last times? How did He not speak falsely when He said to the Jews, Verily I say unto you, Before Abraham was, I am? For plain is it and confessed by all, that many ages after the blessed Abraham was Christ born of the Holy Virgin. Ho"}, {"v": 1, "f": "Cyril of Alexandria", "w": "", "t": "CHAPTER II. That the Son being Consubstantial with the Father is also God in His Own Person, even as also the Father.\n\nAnd the Word was with God.\n\nHaving sufficiently shown that already out of date and astray from the truth is the senseless mind of those who hold such opinions, and having, by saying In the beginning was the Word, closed every loophole to those who say that the Son is of the things that are not, and having utterly stripped off all their nonsense in these words, he goes to another akin and most perverse heresy. And like as some gardener at once most excellent and enduring, delig"}, {"v": 1, "f": "Cyril of Alexandria", "w": "", "t": "There is nothing older than \"the beginning\" if we stay with the definition of beginning (for there cannot be a beginning of a beginning), or else it would diverge from being in truth a beginning if there is something else one can imagine before it or that arises before it. Otherwise, if anything can precede what is truly “beginning,” our language respecting it will go on into infinity with beginnings continually cropping up and making the one we are looking at a “second.” … And since its ever-backward flight has no termination, reaching up to the limit of the ages, the Son will be found to hav"}, {"v": 1, "f": "Cyril of Alexandria", "w": "", "t": "It is not possible to take “beginning” (archē) of the Only Begotten as being understood in any way dealing with time, seeing that the Son is before all time and has his being before the ages, and, what is even more, that the divine nature shuns such a boundary.… For no beginning will ever be conceived of by itself that does not look to its own end, since beginning is called this in reference to an end, and end again in reference to a beginning. But the beginning we are pointing to in this instance is that relating to time and dimension. And so, since the Son is older than the ages themselves, "}, {"v": 1, "f": "Cyril of Alexandria", "w": "", "t": "The blessed Evangelist, then, seems here to name the Father Archē, that is, the power over all, that the divine nature that is over all may be shown, having under its feet everything that is originate and borne above those things that are called by it into being. In this Archē, then, that is above all and over all, was the Word. The Word was not with all things under its feet, but [it was] apart from all things. It was in the Archē by nature as its co-eternal fruit, having the nature of him who begot him (as it were) the most ancient place of all. So then, he who is begotten free of a Father, "}, {"v": 1, "f": "Cyril of Alexandria", "w": "", "t": "John taught in the foregoing, that the Word was in archē, that is, in God the Father, as we said. But, with the eye of his understanding illumined, he was not ignorant that certain people would arise who, out of their great ignorance, would say that the Father and Son are one and the same and distinguish the Holy Trinity in name only. Thus, they wouldn’t allow them to exist in their several Persons so that the Father should be conceived of as in truth Father and not Son, the Son again to be by himself Son, not Father, as the word of truth is. Since John knew this would happen and that, perhaps"}, {"v": 1, "f": "Cyril of Alexandria", "w": "", "t": "[The] sameness of nature will be confessed of both [Father and Son], yet the individual existence of each will surely follow, so that both the Father should be conceived of as indeed Father and the Son as Son. For thus, the Holy Spirit being numbered with them and counted as God, the holy and adorable Trinity will have its proper fullness."}, {"v": 1, "f": "Cyril of Alexandria", "w": "", "t": "The one who bore within him the Spirit was not ignorant that some should arise in the last times who would accuse the essence of the Only Begotten and “deny the Lord that bought them.” These suppose that the Word who appeared from God the Father is not by nature God but rather bring in besides him some, so to speak, spurious and false-called god having the name of Sonship and Deity, but this not really being the case.…It was almost as though someone was already resisting the words of truth and almost saying to the holy Evangelist: “ ‘The Word was with God.’ And so it was. We agree fully to wha"}, {"v": 1, "f": "Ephrem the Syrian", "w": "", "t": "The things that were hidden were revealed through him [our Lord], just as the secrets of the heart are made known by a word."}, {"v": 1, "f": "Eusebius - Church History", "w": "Chap. IV.", "t": "15. These topics are elsewhere more amply discussed, and in fundamental questions of\ndoctrine every intricate point has been opened up by thorough investigation and debate;\n2531 Ex. vii., viii.\n2532 John i. 1.\n\n\nbut faith gives the understanding access to these things, unbelief closes the door. What man\nmight not be moved to faith in the doctrine of Christ by such a remarkable chain of events\nfrom the beginning, and by the manner in which the epochs of the world are linked together,\nso that our faith in regard to present things is assisted by what happened in the past, and\nthe record of earlie"}, {"v": 1, "f": "Eusebius - Church History", "w": "Chap. IV.", "t": "vestigation and debate;\n2531 Ex. vii., viii.\n2532 John i. 1.\n\n\nbut faith gives the understanding access to these things, unbelief closes the door. What man\nmight not be moved to faith in the doctrine of Christ by such a remarkable chain of events\nfrom the beg"}, {"v": 1, "f": "Eusebius of Caesarea", "w": "", "t": "Who beside the Father could clearly understand the Light that was before the world, the intellectual and essential Wisdom that existed before the ages, the living Word that was in the beginning with the Father and that was God, the first and only begotten of God that was before every creature and creation visible and invisible, the commander-in-chief of the rational and immortal host of heaven, the messenger of the great counsel, the executor of the Father’s unspoken will, the creator, with the Father, of all things, the second cause of the universe after the Father, the true and only begotten"}, {"v": 1, "f": "GK Chesterton", "w": "", "t": "The same fallacy is employed with the same partisan motive in the case of the Gospel of St. John; which critics say could not have been written by one of the first few Christians because of its Greek transcendentalism and its Platonic tone. I am no judge of the philology, but every human being is a divinely appointed judge of the philosophy: and the Platonic tone seems to me to prove nothing at all. Palestine was not a secluded valley of barbarians; it was an open province of a polyglot empire, overrun with all sorts of people of all kinds of education. To take a rough parallel: suppose some g"}, {"v": 1, "f": "Gospel of Peter", "w": "16. Meaning of “Beginning.” (1) in Space.", "t": "“In the beginning was the Word.”4528 It is not only the Greeks who consider the word\n“beginning” to have many meanings. Let any one collect the Scripture passages in which\nthe word occurs, and with a view to an accurate interpretation of it note what it stands for\nin each passage, and he will find that the word has many meanings in sacred discourse also.\nWe speak of a beginning in reference to a transition. Here it has to do with a road and with\nlength. This appears in the saying:4529 “The beginning of a good way is to do justice.” For\nsince the good way is long, there have first to be conside"}, {"v": 1, "f": "Gregory Thaumaturgus", "w": "I.—To Alexander, Bishop of the City of Constantinople.", "t": "(2) the\nἦν ποτε ὅτε οὐκ ἦν.\n2411 John i. 18.\n2412 John i. 1–3.\n\n\ncontrary to and far removed from those things which are made “from things wh"}, {"v": 1, "f": "Gregory Thaumaturgus", "w": "From the Same Second Book.", "t": "12. In the beginning was the Word.734 But that was not the Word which produced the\nWord.735 For “the Word was with God.”736 The Lord is Wisdom; it was not therefore\nWisdom that produced Wisdom; for “I was that” says He, “wherein He delighted.”737 Christ\nis truth; but “blessed,” says He, “is the God of truth.”"}, {"v": 1, "f": "Gregory Thaumaturgus", "w": "Chapter VI.—The Whole Number of Spiritual Sheep; Man a Second Choir, After\nthe Angels, to the Praise of God; The Parable of the Lost Sheep Explained.", "t": "Now, since He truly was and is, being in the beginning with God, and being God,2563\nHe is the chief Commander and Shepherd of the heavenly ones, whom all reasonable creatures\nobey and attend, who tends in order and numbers the multitudes of the blessed angels. For\nthis is the equal and perfect number of immortal creatures, divided according to their races\nand tribes, man also being here taken into the flock. For he also was created without corruption,\nthat he might honour the king and maker of all things, responding to the shouts of the\nmelodious angels which came from heaven. But when it came"}, {"v": 1, "f": "Gregory of Nazianzus", "w": "", "t": "There never was a time when [the Father] was without his Word, or when he was not the Father."}, {"v": 1, "f": "Gregory of Nazianzus", "w": "", "t": "[He] is not contained in any place; the timeless, the bodiless, the uncircumscribed, the same who was and is; who was both above time and came under time, and was invisible and is seen. He was in the beginning and was with God and was God. The word was occurs the third time to be confirmed by number. What he was, he laid aside; what he was not, he assumed; not that he became two, but he deigned to be one made out of the two. For both are God, that which assumed and that which was assumed; two natures meeting in one, not two sons (let us not give a false account of the blending)."}, {"v": 1, "f": "Gregory of Nyssa", "w": "", "t": "[John] declares, “And the Word was with God.” Once more the Evangelist fears for our untrained state, once more he dreads our childish and untaught condition. He does not yet entrust to our ears the appellation of “Father,” in case any of the more carnally minded, learning of “the Father,” may be led by his understanding to imagine also by consequence a mother. Neither does he yet name in his proclamation the Son, for he still suspects our customary tendency to the lower nature and is concerned that if someone hears of the Son, that person might humanize the Godhead by an idea of passion. For "}, {"v": 1, "f": "Gregory the Dialogist", "w": "", "t": "You know, dearest brothers, that the only-begotten Son is called the Word of the Father, as John testifies when he says: \"In the beginning was the Word, and the Word was with God, and the Word was God.\" And from your own manner of speaking you recognize that the voice sounds first, so that the word may afterward be heard. Therefore John asserts that he is the voice, because he precedes the Word. And so, going before the coming of the Lord, he is called a voice, because through his ministry the Word of the Father is heard by men."}, {"v": 1, "f": "Gregory the Dialogist", "w": "", "t": "What does it mean that two angels are seen in the place of the Lord's body, one sitting at the head, and the other at the feet, except that in the Latin language an angel is called a messenger, and he was to be announced through his passion, who is both God before all ages, and man at the end of the ages? It is as if the angel sits at the head, when through the apostle John it is proclaimed that \"in the beginning was the Word, and the Word was with God, and the Word was God.\"\n\nHence John also touched our Redeemer with the hand of faith, who says: \"In the beginning was the Word, and the Word wa"}, {"v": 1, "f": "Hilary of Poitiers", "w": "", "t": "(ii. de Trin. c. 13) Years, centuries, ages, are passed over, place what beginning thou wilt in thy imagining, thou graspest it not in time, for He, from Whom it is derived, still was.\n\n(ii. de Trin. c. xiii) Consider then the world, understand what is written of it. In the beginning God made the heaven and the earth. Whatever therefore is created is made in the beginning, and thou wouldest contain in time, what, as being to be made, is contained in the beginning. But, lo, for me, an illiterate unlearned fisherman (meus piscator [Hil.]) is independent of time, unconfined by ages, advanceth bey"}, {"v": 1, "f": "Hilary of Poitiers", "w": "", "t": "I will not endure to hear that Christ was born of Mary unless I also hear, \"In the beginning was the Word, and the Word was God.\""}, {"v": 1, "f": "Hilary of Poitiers", "w": "", "t": "Consider and decide whether it were the greater feat to raise the dead or impart to an untrained mind the knowledge of mysteries so deep as he reveals by saying, \"In the beginning was the Word.\" What does this \"in the beginning was\" mean? He ranges backward over the spaces of time, centuries are left behind, and ages are cancelled. Fix in your mind what date you will for this \"beginning\"; you miss the mark, for even then he of whom we are speaking \"was.\" Survey the universe; note well what is written of it: \"In the beginning God made the heaven and the earth.\" This word beginning fixes the mom"}, {"v": 1, "f": "Hilary of Poitiers", "w": "", "t": "He \"was,\" and he \"is,\" since he is from him who always is what he is.… Now since it is the special characteristic of his being that his Father always exists and that he is always his Son, and since eternity is expressed in the name \"he that is,\" therefore, since he possesses absolute being, he possesses also eternal being.… There can be no doubt that no one who already was in existence could be born. For no cause of birth can accrue to him who of himself continues eternal. But God Only Begotten … bears witness to the Father as the source of his being."}, {"v": 1, "f": "Hilary of Poitiers", "w": "", "t": "You will plead that a word is the sound of a voice; that it is a naming of things, an utterance of thought.… The nature of a word is that it is first a potentiality, afterwards a past event; an existing thing only while it is being heard. How can we say, \"In the beginning was the Word,\" when a word neither exists before, nor lives after, a definite point of time? Can we even say that there is a point of time in which a word exists? Not only are the words in a speaker's mouth nonexistent until they are spoken and perished the instant they are uttered, but even in the moment of utterance there i"}, {"v": 1, "f": "Hilary of Poitiers", "w": "", "t": "[The Son], being God, is nothing else than God. For when I hear the words \"And the Word was God,\" they do not merely tell me that the Son was called God; they reveal to my understanding that he is God. In those previous instances, where Moses was called god and others were styled gods, there was the mere addition of a name by way of title. Here a solid essential truth is stated: \"The Word was God.\" That was indicates no accidental title but an eternal reality, a permanent element of his existence, an inherent character of his nature."}, {"v": 1, "f": "Hippolytus", "w": "Chapter XVI.—Plato; Threefold Classification of Principles; His Idea of God; Different\nOpinions Regarding His Theology and Psychology; His Eschatology and\nSystem of Metempsychosis; His Ethical Doctrines; Notions on the Free-Will\nQuestion.", "t": "Plato (lays down) that there are three originating principles of the universe, (namely)\nGod, and matter, and exemplar; God as the Maker and Regulator of this universe, and the\nBeing who exercises providence over it; but matter, as that which underlies all (phenomena),\nwhich (matter) he styles both receptive and a nurse, out of the arrangement of which proceeded\nthe four elements of which the world consists; (I mean) fire, air, earth, water, from\nwhich all the rest of what are denominated concrete substances, as well as animals and\nplants, have been formed. And that the exemplar, which he likew"}], "xrefs": [{"v": 1, "ref": "Revelation 1:8", "rel": "cross-reference", "text": "Yo soy el Alpha y la Omega, principio y fin, dice el Señor, que es y que era y que ha de venir, el Todopoderoso."}, {"v": 1, "ref": "1 John 5:20", "rel": "cross-reference", "text": "Empero sabemos que el Hijo de Dios es venido, y nos ha dado entendimiento para conocer al que es verdadero: y estamos en el verdadero, en su Hijo Jesucristo. Este es el verdadero Dios, y la vida etern"}, {"v": 1, "ref": "Revelation 1:17", "rel": "cross-reference", "text": "Y fpicuando yo le vi, caí como muerto á sus pies. Y él puso su diestra sobre mí, diciéndome: No temas: yo soy el primero y el último;"}, {"v": 1, "ref": "Ephesians 3:9", "rel": "cross-reference", "text": "Y de aclarar á todos cuál sea la dispensación del misterio escondido desde los siglos en Dios, que crió todas las cosas."}, {"v": 1, "ref": "Isaiah 40:9", "rel": "cross-reference", "text": "Súbete sobre un monte alto, anunciadora de Sión; levanta fuertemente tu voz, anunciadora de Jerusalem; levántala, no temas; di á las ciudades de Judá: ¡Veis aquí el Dios vuestro!"}, {"v": 1, "ref": "Isaiah 40:11", "rel": "cross-reference", "text": "Como pastor apacentará su rebaño; en su brazo cogerá los corderos, y en su seno los llevará; pastoreará suavemente las paridas."}, {"v": 1, "ref": "Revelation 1:11", "rel": "cross-reference", "text": "Que decía: Yo soy el Alpha y Omega, el primero y el último. Escribe en un libro lo que ves, y envía lo á las siete iglesias que están en Asia; á Efeso, y á Smirna, y á Pérgamo, y á Tiatira, y á Sardis"}, {"v": 1, "ref": "Revelation 2:8", "rel": "cross-reference", "text": "Y escribe al ángel de la iglesia en SMIRNA: El primero y postrero, que fué muerto, y vivió, dice estas cosas:"}, {"v": 1, "ref": "Isaiah 7:14", "rel": "cross-reference", "text": "Por tanto el mismo Señor os dará señal: He aquí que la virgen concebirá, y parirá hijo, y llamará su nombre Emmanuel."}, {"v": 1, "ref": "Revelation 3:14", "rel": "cross-reference", "text": "Y escribe al ángel de la iglesia en LAODICEA: He aquí dice el Amén, el testigo fiel

inction of Jew and Greek, for all have sinned and do need (Rom 3:22–23) penance; all we like sheep have gone astray: for you were as sheep without a shepherd (1 Pet 2:25).", "lang": "english", "orig": ""}, {"v": 7, "f": "1 Clement", "w": "Chapter V.—The new covenant, founded on the sufferings of Christ, tends to\nour salvation, but to the Jews’ destruction.", "t": "For to this end the Lord endured to deliver up His flesh to corruption, that we might\nbe sanctified through the remission of sins, which is effected by His blood of sprinkling. For\nit is written concerning Him, partly with reference to Israel, and partly to us; and [the\nScripture] saith thus: “He was wounded for our transgressions, and bruised for our\niniquities: with His stripes we are healed. He was brought as a sheep to the slaughter, and\nas a lamb which is dumb before its shearer.”44 Therefore we ought to be deeply grateful to\nthe Lord, because He has both made known to us things that are past, and hath given us\nwisdom concerning things present, and hath not left us without understanding in regard\nto things which are to come. Now, the Scripture saith, “Not unjustly are nets spread out for\nbirds.”45 This means that the man perishes justly, who, having a knowledge of the way of\nrighteousness, rushes off into the way of darkness. And further, my brethren: if the Lord\nendured to suffer for our soul, He being Lord of all the world, to whom God said at the\nfoundation of the world, “Let us make man after our image, and after our likeness,”46 understand\nhow it was that He endured to suffer at the hand of men. The prophets, having\nobtained grace from Him, prophesied concerning Him. And He (since it behoved Him to\nappear in flesh), that He might abolish death, and reveal the resurrection from the dead,\nendured [what and as He did], in order that He might fulfil the promise made unt", "lang": "greek", "orig": ""}, {"v": 7, "f": "1 Clement", "w": "Chapter LXXXIX.—The cross alone is offensive to Trypho on account of the\ncurse, yet it proves that Jesus is Christ.", "t": "I replied to him, “If Christ was not to suffer, and the prophets had not foretold that He\nwould be led to death on account of the sins of the people, and be dishonoured and scourged,\nand reckoned among the transgressors, and as a sheep be led to the slaughter, whose generation,\nthe prophet says, no man can declare, then you would have good cause to wonder.\nBut if these are to be characteristic of Him and mark Him out to all, how is it possible for\nus to do anything else than believe in Him most confidently? And will not as many as have\nunderstood the writings of the prophets, whenever they hear merely that He was crucified,\nsay that this is He and no other?”", "lang": "greek", "orig": ""}, {"v": 7, "f": "1 Clement", "w": "Chapter CXIV.—Some rules for discerning what is said about Christ. The\ncircumcision of the Jews is very different from that which Christians receive.", "t": "“For the Holy Spirit sometimes brought about that something, which was the type of\nthe future, should be done clearly; sometimes He uttered words about what was to take\nplace, as if it was then taking place, or had taken place. And unless those who read perceive\nthis art, they will not be able to follow the words of the prophets as they ought. For example’s\nsake, I shall repeat some prophetic passages, that you may understand what I say. When He\nspeaks by Isaiah, ‘He was led as a sheep to the slaughter, and like a lamb before the shearer,’612\nHe speaks as if the suffering had already taken place. And when He says again, ‘I have\nstretched out my hands to a disobedient and gainsaying people;’613 and when He says, ‘Lord,\nwho hath believed our report?’614—the words are spoken as if announcing events which\nhad already come to pass. For I have shown that Christ is oftentimes called a Stone in parable,\nand in figurative speech Jacob and Israel. And again, when He says, ‘I shall behold the\nheavens, the works of Thy fingers,’615 unless I understand His method of using words,616\nI shall not understand intelligently, but just as your teachers suppose, fancying that the\nFather of all, the unbegotten God, has hands and feet, and fingers, and a soul, like a composite\nbeing; and they for this reason teach that it was the Father Himself who appeared to Abraham\nand to Jacob. Blessed therefore are we who have been circumcised the second time with\nknives of stone. For your first circumcision wa", "lang": "greek", "orig": ""}, {"v": 7, "f": "1 Clement", "w": "Chapter XXIII.—The patriarchs and prophets by pointing out the advent of\nChrist, fortified thereby, as it were, the way of posterity to the faith of Christ;\nand so the labours of the apostles were lessened inasmuch as they gathered in\nthe fruits of the labours of others.", "t": "2. For this reason, also, Philip, when he had discovered the eunuch of the Ethiopians’\nqueen reading these words which had been written: “He was led as a sheep to the slaughter;\nand as a lamb is dumb before the shearer, so He opened not His mouth: in His humiliation\nHis judgment was taken away;”1487 and all the rest which the prophet proceeded to relate\nin regard to His passion and His coming in the flesh, and how He was dishonoured by those\nwho did not believe Him; easily persuaded him to believe on Him, that He was Christ Jesus,\nwho was crucified under Pontius Pilate, and suffered whatsoever the prophet had predicted,\nand that He was the Son of God, who gives eternal life to men. And immediately when\n[Philip] had baptized him, he departed from him. For nothing else [but baptism] was\nwanting to him who had been already instructed by the prophets: he was not ignorant of\nGod the Father, nor of the rules as to the [proper] manner of life, but was merely ignorant\nof the advent of the Son of God, which, when he had become acquainted with, in a short\nspace of time, he went on his way rejoicing, to be the herald in Ethiopia of Christ’s advent.\nTherefore Philip had no great labour to go through with regard to this man, because he was\nalready prepared in the fear of God by the prophets. For this reason, too, did the apostles,\ncollecting the sheep which had perished of the house of Israel, and discoursing to them from\nthe Scriptures, prove that this crucified Jesus was the Christ, the", "lang": "greek", "orig": ""}, {"v": 7, "f": "Acts", "w": "", "t": "And the angel of the Lord spake unto Philip, saying, Arise, and go toward the south unto the way that goeth down from Jerusalem unto Gaza, which is desert.  And he arose and went: and, behold, a man of Ethiopia, an eunuch of great authority under Candace queen of the Ethiopians, who had the charge of all her treasure, and had come to Jerusalem for to worship,  Was returning, and sitting in his chariot read Esaias the prophet.  Then the Spirit said unto Philip, Go near, and join thyself to this chariot.  And Philip ran thither to him, and heard him read the prophet Esaias, and said, Understandest thou what thou readest?  And he said, How can I, except some man should guide me? And he desired Philip that he would come up and sit with him.  The place of the scripture which he read was this, He was led as a sheep to the slaughter; and like a lamb dumb before his shearer, so opened he not his mouth:  In his humiliation his judgment was taken away: and who shall declare his generation? for his life is taken from the earth. [Isaiah 53:7-8] And the eunuch answered Philip, and said, I pray thee, of whom speaketh the prophet this? of himself, or of some other man?  Then Philip opened his mouth, and began at the same scripture, and preached unto him Jesus.  And as they went on their way, they came unto a certain water: and the eunuch said, See, here is water; what doth hinder me to be baptized?  And Philip said, If thou believest with all thine heart, thou mayest. And he answered and sa", "lang": "english", "orig": ""}, {"v": 7, "f": "Ambrose of Milan", "w": "", "t": "For this is the price of our liberty, as Peter says, ye were redeemed with the precious Blood, not indeed of a lamb, but of Him Who came as a lamb, in meekness and humility, and redeemed the whole world with the one offering of His Body, as He himself says, I was brought as a lamb to the slaughter. Wherefore John also says, Behold the Lamb of God, which taketh away the sin of the world.", "lang": "english", "orig": ""}, {"v": 7, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "6. And shall bruise them as the calf of Libanus Psalm 28:6. And when their proud exaltation has been cut off, He will lay them low after the imitation of His Own humility, who like a calf was led to slaughter Isaiah 53:7 by the nobility of this world. For the kings of the earth stood up, and the rulers agreed together against the Lord, and against His Christ.  And the Beloved is as the young of the unicorns. For even He the Beloved, and the Only One of the Father, emptied Himself of His glory; and was made man, Philippians 2:7 like a child of the Jews, that were ignorant of God's righteousness, Romans 10:3 and proudly boasting of their own righteousness as peculiarly theirs.", "lang": "", "orig": ""}, {"v": 7, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "And I became as a man that hears not, and in whose mouth are no reproofs Psalm 37:14. As if He had nothing to say unto them, as if He had nothing wherewith to reproach them. Had He not already reproached them for many things? Had He not said many things, and also said, Woe unto you, Scribes and Pharisees, Matthew 23:13 and many things besides? Yet when He suffered, He said none of these things; not that He had not what to say, but He waited for them to fulfil all things, and that all the prophecies might be fulfilled of Him, of whom it had been said, And as a sheep before her shearer is dumb, so opens He not His mouth. Isaiah 53:7 It behooved Him to be silent in His Passion, though not hereafter to be silent in Judgment. For He had come to be judged, then, who was hereafter coming to judge; and who was for this reason to come with great power to judge, that He had been judged in great humility.", "lang": "", "orig": ""}, {"v": 7, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "12. Because of truth, meekness, and righteousness. Truth was restored unto us, when the Truth sprung out of the earth: and Righteousness looked out from heaven.  Christ was presented to the expectation of mankind, that in Abraham's Seed all nations should be blessed. The Gospel has been preached. It is the Truth. What is meant by meekness? The Martyrs have suffered; and the kingdom of God has made much progress from thence, and advanced throughout all nations; because the Martyrs suffered, and neither fell away, nor yet offered resistance; confessing everything, concealing nothing; prepared for everything, shrinking from nothing. Marvellous meekness! This did the body of Christ, by its Head it learned. He was first led as a sheep to the slaughter, and as a lamb before his shearer is dumb, even so opened not His mouth; Isaiah 53:7 meek to that degree, that while hanging on the Cross, He said, Father, forgive them, for they know not what they do. Luke 23:34 Why because of righteousness? He will come also to judge, and to render to every man according to his works. He spoke the truth; He patiently endured unrighteousness: He is to bring righteousness hereafter.", "lang": "", "orig": ""}, {"v": 7, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "Hidden then was the God of gods, both when He walked among men, and when He hungered, and when He thirsted, and when fatigued He sat, and when with wearied body He slept, and when taken, and when scourged, and when standing before the judge, and when He made answer to him in his pride, You could have no power against Me, except it had been given you from above; John 19:11 and while led as a victim before His shearer He opened not His mouth, Isaiah 53:7 and while crucified, and while buried, He was always hidden God of gods. What took place after He rose again? The disciples marvelled, and at first believed not, until they touched and handled. Luke 24:37-40 But flesh had risen, because flesh had been dead: Divinity which could not die, even still lay hid in the flesh of Him rising. Form could be seen, limbs held, scars handled: the Word by whom all things were made, who does see? Who does hold? Who does handle? And yet the Word was made flesh, and dwelled among us. John 1:14 And Thomas, that was holding Man, understood God as he was able. For when he had handled the scars, he cried out, My Lord, and my God. Yet the Lord was showing that form, and that flesh, which they had seen upon the Cross, which had been laid in the sepulchre. He stayed with them forty days....But what was said to Thomas handling? Because you have seen, you have believed; blessed are they that see not, and believe. John 20:29 We are foretold.", "lang": "", "orig": ""}, {"v": 7, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "14. And every man feared Psalm 63:9. They that feared not, were not even men. Every man feared; that is, every one using reason to perceive the things which were done. Whence they that feared not, must rather be called cattle, rather beasts savage and cruel. A lion ramping and roaring is that people as yet. But in truth every man feared: that is, they that would believe, that trembled at the judgment to come. And every man feared: and they declared the works of God....And every man has feared: and they have declared the works of God, and His doings they have perceived. What is, His doings they have perceived? Was it, O Lord Jesus Christ, that You were silent, and like a sheep for a victim wast being led, and did not open before the shearer Your mouth, Isaiah 53:7 and we thought You to be set in smiting and in grief, Isaiah 53:4 and knowing how to bear weakness? Isaiah 53:3 Was it that You were hiding Your beauty, O Thou beautiful in form before the sons of men?  Was it that You did not seem to have beauty nor grace? Isaiah 53:2 You bore on the Cross men reviling and saying, If Son of God He is, let Him come down from the Cross. Matthew 27:40 ...This thing they, that would have had Him come down from the Cross, perceived not: but when He rose again, and being glorified ascended into Heaven, they perceived the works of God.", "lang": "", "orig": ""}, {"v": 7, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "He that like a lamb before the shearer of Him was without voice, Isaiah 53:7 behold shall give His voice, and not the voice of weakness, as though to be judged; but the voice of power, as though going to judge. For God shall not be hidden, as before, and in the judgment of men not opening His mouth; but God shall come manifest, our God, and He shall not be silent. Why do ye despair, you unbelieving men? Why do ye mock? What says the evil servant? My Lord delays to come. Luke 12:45 Behold, He shall give His voice, the voice of power.", "lang": "", "orig": ""}, {"v": 7, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "7. I have laboured, crying, hoarse have become my jaws Psalm 68:3. Where was this? When was this? Let us question the Gospel. For the Passion of our Lord in this Psalm we perceive. And, indeed, that He suffered we know; that there came in waters even unto His Soul, because peoples prevailed even unto His death, we read, we believe; in the tempest that He was sunk down, because tumult prevailed to His killing, we acknowledge: but that He laboured in crying, and that His jaws were made hoarse, not only we read not, but even on the contrary we read, that He answered not to them a word, in order that there might be fulfilled that which in another Psalm has been said, I have become as it were a man not hearing, and having not in his mouth reproofs. And that which in Isaiah has been prophesied, like a sheep to be sacrificed He was led, and like a lamb before one shearing Him, so He opened not His mouth. Isaiah 53:7 If He became like a man not hearing, and having not in His mouth reproofs, how did He labour crying, and how were His jaws made hoarse? Is it that He was even then silent, because He was hoarse with having cried so much in vain? And this indeed we know to have been His voice on the Cross out of a certain Psalm: O God, My God, why have You forsaken Me? But how great was that voice, or of how long duration, that in it His jaws should have become hoarse? Long while He cried, Woe unto you, Scribes and Pharisees:  long while He cried, Woe unto the world because of offenses.", "lang": "", "orig": ""}, {"v": 7, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "27. Nor think, brethren, that the sun ought to be worshipped by some men, because the sun sometimes signifies Christ in the Scriptures. For such is the madness of men; as if we said that a creature should be worshipped, when it is said, the sun is an emblem of Christ. Then worship the rock also, for it also is a type of Christ. 1 Corinthians 10:4 He was brought as a lamb to the slaughter: Isaiah 53:7 worship the lamb also, since it is a type of Christ. The Lion of the tribe of Judah has prevailed; Revelation 5:5 worship the lion also, since it signifies Christ. Observe how numerous are the types of Christ: all these are Christ in similitude, not in essence....", "lang": "", "orig": ""}, {"v": 7, "f": "Augustine - City of God", "w": "Tractate CXVI.", "t": "iv. 61, xv. 5; Luke xxiii. 7–9; John xix. 9.\n1852 Isa. liii. 7.\n1853 Rom. xiii. 1.\n\n\nunto thee hath the g", "lang": "latin", "orig": ""}, {"v": 7, "f": "Augustine of Hippo", "w": "", "t": "[Christ] kept silent while he was concealed, because “in humility his judgment was taken away.” He kept silent while he was concealed, because he was thought to be only human. But as God he will come openly; and as our God, he will not keep silent. So what about you? You were saying, “I want him to come.”", "lang": "english", "orig": ""}, {"v": 7, "f": "Augustine of Hippo", "w": "", "t": "Because he has come hidden, our God, that is, Christ, will come manifest. “And he will not keep silence.” What does it mean, “will not keep silence”? Because he had first kept silence. When did he keep silence? He was judged in order that there might be fulfilled that which the prophet had also predicted: “As a sheep he was led to the slaughter, and as a lamb before his shearer, without voice, so he opened not his mouth.” Therefore, if he were unwilling to suffer, he would not suffer. If he did not suffer, his blood would not be poured forth. If his blood would not be poured forth, the world would not be redeemed.", "lang": "english", "orig": ""}, {"v": 7, "f": "Caesarius of Arles", "w": "", "t": "Though he was guilty of not even a slight sin, for no serpent could make a mark on this rock, he was condemned. He suffered with patience the insults, blows, crown of thorns, scarlet robe, and the other mockeries enumerated in the Gospel. Although guiltless, he endured it in order that filled with patience he might come to the cross “as a sheep for sacrifice.” Although he could have returned the injury to his adversaries, he bore it all with kindness.", "lang": "english", "orig": ""}, {"v": 7, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Homily LXVIII.", "t": "aying, “He was led as a sheep to the\nslaughter” ( Isa. liii. 7 ), and all that follows. David also in the second Psalm, and in many\nother places, connects these two things. The Patriarch too after saying, “He lay down, He\ncouched as a lion,” addeth, “And as a li", "lang": "greek", "orig": ""}, {"v": 7, "f": "Cyril of Alexandria", "w": "", "t": "For the spiritually dead and unholy Caiaphas asked him, “I put you under oath to the living God to tell us if you are the Chist, the Son of God.” And he answered him right away, saying, “From now on you will see the Son of man seated at the right hand of power and coming on the clouds of heaven.” And then Pilate asked him whether he was king of Israel, and Christ replied, “You say so.” Pilate was complacent with the madness of the Jews and had Jesus beaten, and he ordered his soldiers to put him between two thieves in his suffering of death on the cross. So what the prophet said was true: “Because of his affliction he did not open his mouth.” But he suffered a myriad of afflictions from the time of his arrest onwards, suffered insolence and spitting and the beatings of mindless underlings and other things beside these that could be wickedly arranged, before he was brought to Pilate.", "lang": "english", "orig": ""}, {"v": 7, "f": "Gregory of Nazianzus", "w": "", "t": "He prays, but he hears prayer. He weeps, but he causes tears to cease. He asks where Lazarus was laid, for he was man; but he raises Lazarus, for he was God. He is sold, and very cheap, for it is only for thirty pieces of silver, but he redeems the world, and that at a great price, for the price was his own blood. As a sheep he is led to the slaughter, but he is the shepherd of Israel, and now of the whole world also. As a lamb he is silent, yet he is the Word and is proclaimed by the voice of one crying in the wilderness. He is bruised and wounded, but he heals every disease and every infirmity. He is lifted up and nailed to the tree, but by the tree of life he restores us, yes, he saves even the robber crucified with him. … He dies, but he gives life, and by his death, he destroys death. He is buried, but he rises again; he goes down into hell, but he brings up the souls; he ascends to heaven and shall come again to judge the living and the dead.", "lang": "english", "orig": ""}, {"v": 7, "f": "Jerome", "w": "", "t": "He was oppressed, and he was afflicted, yet he opened not his mouth. For He endured the cross not out of necessity, but out of His own will, saying in the Gospel: 'The cup which My Father has given Me, shall I not drink it?' (John XVIII, 11). And to Peter, who was scandalized by the name of the cross because he did not know the mystery and was trembling with human fear, He said: 'Get behind me, Satan, you are a stumbling block to me; for you are not setting your mind on the things of God, but on the things of men' (Matthew XVI, 23). Otherwise, if He had not been willingly offered, He who could indicate and foretell the traitor and was speaking to the Apostles, 'You will all fall away because of Me this night,' could have caused those who were sent to him to turn away, but he boldly came to meet them and offered Himself saying, 'Whom do you seek?' (John XVIII, 4, 6). Those who immediately fell backward; for they could not bear the voice of the present God. And beautifully he added: And he did not open his mouth. When Pilate said to him: Don't you speak to me? he refused to answer. Or according to the Septuagint: He did not open his mouth in affliction. Or according to Symmachus and Theodotion, he did not open his mouth when he heard.", "lang": "english", "orig": ""}, {"v": 7, "f": "Jerome", "w": "", "t": "Like a lamb that is led to the slaughter, and like a sheep before its shearers is silent, so he did not open his mouth. This testimony is about the Ethiopian eunuch, who was riding in a chariot of Queen Candace while reading the book of Acts (Chapter 8 and following). He did not understand what he was reading, but with the help of Philip, he came to understand the passion and the name of the Savior. He was immediately baptized in the blood of the Lamb that he had been reading about and deserved to be called a man. The apostle was then sent to preach to the Ethiopian people. Just as Jesus was offered to Pontius Pilate, because he himself wanted it, and did not respond when asked to climb the Cross for our sake, he was led like a sheep to slaughter and remained silent like a lamb before the shearer. Indeed, our Passover lamb, Christ, has been sacrificed (I Cor. 5), whom John the Baptist pointed out, saying: Behold the Lamb of God, behold Him who takes away the sins of the world (John 1:29). He is also often mentioned as the slain lamb in the Apocalypse of the Evangelist John (Apocalypse 5). He speaks of Himself in Jeremiah (Jeremiah 11). But I, like an innocent lamb, being led to the victim, did not know. For when He did not know sin, He became sin for us (II Cor. 5). And just as a lamb, when led to the slaughter, does not resist, so He suffered willingly to destroy him who had the power of death (Heb. 2), humbling Himself unto death, even the death of the cross (Phil. 2). This", "lang": "english", "orig": ""}, {"v": 7, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Well: that He was to rise again, he knew, say they, and that He was to give the Holy Ghost; but that He should likewise be crucified, he knew not. How then was He to rise again, who had not suffered, nor been crucified? And how was this man greater than a prophet, who knew not even what the prophets knew? For that he was greater than a prophet, even Christ Himself bare record, Matthew 11:9 but that the prophets knew of the passion is surely plain to every one. For so Isaiah says, He is brought as a lamb to the slaughter, and as a sheep before her shearer is dumb. Isaiah 53:7 And before this testimony also he says, There shall be a root of Jesse, and He that shall rise again to rule the Gentiles, in Him shall the Gentiles trust. Isaiah 11:10 Then speaking of His passion, and of the ensuing glory, he added, And His rest shall be honor. And this prophet foretold not only that He should be crucified, but also with whom. For, says he, He was numbered with the transgressors. Isaiah 53:12 And not this only, but that He should not even plead for Himself; For this man, he says, opens not His mouth: and that He should be unjustly condemned; For in His humiliation, says he, His judgment was taken away. And before this again, David both says this, and describes the judgment hall. Why, says he, do the heathen rage, and the people imagine a vain thing? The kings of the earth stand up, and the rulers are gathered together against the Lord, and against His anointed.", "lang": "", "orig": ""}, {"v": 7, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For of the salvation wrought for us, and of our common freedom, and of the goodness of our Lord, this is the sign. For as a  sheep was He led to the slaughter. Isaiah 53:7 When therefore you sign yourself, think of the purpose of the cross, and quench anger, and all the other passions. When you sign yourself, fill your forehead with all courage, make your soul free. And ye know assuredly what are the things that give freedom. Wherefore also Paul leading us there, I mean unto the freedom that beseems us, did on this wise lead us unto it, having reminded us of the cross and blood of our Lord. For you are bought, says he, with a price; be not ye the servants of men.  Consider, says he, the price that has been paid for you, and you will be a slave to no man; by the price meaning the cross.", "lang": "", "orig": ""}, {"v": 7, "f": "Melito of Sardis", "w": "", "t": "When this one came from heaven to earth for the sake of the one who suffers, and had clothed himself with that very one through the womb of a virgin, and having come forth as man, he accepted the sufferings of the sufferer through his body which was capable of suffering. And he destroyed those human sufferings by his spirit which was incapable of dying. He killed death which had put man to death.\n\nFor this one, who was led away as a lamb, and who was sacrificed as a sheep, by himself delivered us from servitude to the world as from the land of Egypt, and released us from bondage to the devil as from the hand of Pharaoh, and sealed our souls by his own spirit and the members of our bodies by his own blood.\n\nThis is the one who covered death with shame and who plunged the devil into mourning as Moses did Pharaoh. This is the one who smote lawlessness and deprived injustice of its offspring, as Moses deprived Egypt. This is the one who delivered us from slavery into freedom, from darkness into light, from death into life, from tyranny into an eternal kingdom, and who made us a new priesthood, and a special people forever.\n\nThis one is the passover of our salvation. This is the one who patiently endured many things in many people: This is the one who was murdered in Abel, and bound as a sacrifice in Isaac, and exiled in Jacob, and sold in Joseph, and exposed in Moses, and sacrificed in the lamb, and hunted down in David, and dishonored in the prophets.\n\nThis is the one who became", "lang": "english", "orig": ""}, {"v": 7, "f": "Socrates", "w": "Chapter 30.—That in the Books of the Old Testament, Where It is Said that God\nShall Judge the World, the Person of Christ is Not Explicitly Indicated, But It\nPlainly Appears from Some Passages in Which the Lord God Speaks that Christ\nis Meant.", "t": "th the apple of His\n1477 Isa. xlviii. 12-16.\n1478 Isa. liii. 7.\n\n\neye. Behold, I will bring mine hand upon them, and they shall be a spoil to their servants:\nand ye shall know that the Lord Almighty hath sent me.”1479 Observe, the Lord Almighty\nsaith that the Lo", "lang": "greek", "orig": ""}, {"v": 7, "f": "Tertullian", "w": "Chapter VII.—Prophecy Sets Forth Two Different Conditions of Christ, One Lowly,\nthe Other Majestic. This Fact Points to Two Advents of Christ.", "t": "Our heretic will now have the fullest opportunity of learning the clue3180 of his errors\nalong with the Jew himself, from whom he has borrowed his guidance in this discussion.\nSince, however, the blind leads the blind, they fall into the ditch together. We affirm that,\nas there are two conditions demonstrated by the prophets to belong to Christ, so these\npresignified the same number of advents; one, and that the first, was to be in lowliness,3181\nwhen He had to be led as a sheep to be slain as a victim, and to be as a lamb dumb before\nthe shearer, not opening His mouth, and not fair to look upon.3182 For, says (the prophet),\nwe have announced concerning Him: “He is like a tender plant,3183 like a root out of a\nthirsty ground; He hath no form nor comeliness; and we beheld Him, and He was without\nbeauty: His form was disfigured;”3184 “marred more than the sons of men; a man stricken\nwith sorrows, and knowing how to bear our infirmity;”3185 “placed by the Father as a stone\nof stumbling and a rock of offence;”3186 “made by Him a little lower than the angels;”3187\ndeclaring Himself to be “a worm and not a man, a reproach of men, and despised of the\npeople.”3188 Now these signs of degradation quite suit His first coming, just as the tokens\nof His majesty do His second advent, when He shall no longer remain “a stone of stumbling\nand a rock of offence,” but after His rejection become “the chief corner-stone,” accepted\nand elevated to the top place3189 of the temple, even His church, ", "lang": "latin", "orig": ""}, {"v": 7, "f": "Theodoret - Church History", "w": "Chapter 20.—Of Israel’s Bondage in Egypt, Their Deliverance, and Their Passage\nThrough the Red Sea.", "t": "ceived the law written by the finger of God,\n1444 Isa. liii. 7\n1445 Or = circumscribed, definitus.\n\n\nand that in good sooth on tables of stone, to signify the hardness of their heart in that they\nwere not to fulfill the law. For, as they eagerly sought from the", "lang": "greek", "orig": ""}, {"v": 7, "f": "Theodoret of Cyrus", "w": "", "t": "It was fitting for him to heal like by like and to recall the other wandering sheep by becoming a sheep himself. He became a sheep, without being changed into one, or without being altered or without quitting his own essence.… For, according to Isaiah, he was sheared as well as slaughtered. For he endured death in his humanity. But as God he remained alive and impassible and gave the fleece of his body to the shearers.", "lang": "english", "orig": ""}, {"v": 7, "f": "Thomas Aquinas", "w": "", "t": "He was offered. Here he shows his meekness in suffering.\n\nAnd first, he sets out the meekness itself,\n\nand first, as to his voluntary offering of himself: he was offered, to God the Father as a victim for us, because it was his own will: I will freely sacrifice to you (Ps 53:8[54:6]);\n\nsecond, as to his patient suffering: and he opened not his mouth, as if contradicting and contending; also before Herod he responded nothing (Luke 23:9): from the mouth of the Most High (Lam 3:38).\n\nSecond, he sets out a similitude: as a sheep to the slaughter, because he was slaughtered without resistance, and as a lamb, because he suffered injury without contradiction: I was as a meek lamb, that is carried to be a victim (Jer 11:19).", "lang": "english", "orig": ""}, {"v": 7, "f": "npnf210", "w": "CHAPTER VIII.", "t": "20.\n1203 S. John xiv. 31.\n1204 Ps. xxii. 6.\n1205 Isa. liii. 7.\n1206 Heb. ii. 9.\n\n\nHimself;”1207 not, indeed, parting with what He was, but taking up what He was not, for\n“He took the form of a servant.”1208", "lang": "greek", "orig": ""}, {"v": 8, "f": "1 Clement", "w": "Chapter XIX.—Jesus Christ was not a mere man, begotten from Joseph in the\nordinary course of nature, but was very God, begotten of the Father most high,\nand very man, born of the Virgin.", "t": "of Irenæus. Others are much less innocent.]\n1021 Isa. liii. 8.\n1022 Jer. xvii. 9.\n\n\nrevealed Him,1023 knows Him, so that he understands that He who “was not born either by\nthe will of the flesh, or by the will of man,”1024 is the Son of man, this is Christ, the", "lang": "greek", "orig": ""}, {"v": 8, "f": "1 Clement", "w": "Chapter LI.—The majesty of Christ.", "t": "And that the Spirit of prophecy might signify to us that He who suffers these things has\nan ineffable origin, and rules His enemies, He spake thus: “His generation who shall declare?\nbecause His life is cut off from the earth: for their transgressions He comes to death. And I\nwill give the wicked for His burial, and the rich for His death; because He did no violence,\nneither was any deceit in His mouth. And the Lord is pleased to cleanse Him from the stripe.\nIf He be given for sin, your soul shall see His seed prolonged in days. And the Lord is pleased\nto deliver His soul from grief, to show Him light, and to form Him with knowledge, to justify\nthe righteous who richly serveth many. And He shall bear our iniquities. Therefore He\nshall inherit many, and He shall divide the spoil of the strong; because His soul was delivered\nto death: and He was numbered with the transgressors; and He bare the sins of many, and\nHe was delivered up for their transgressions.”108 Hear, too, how He was to ascend into\nheaven according to prophecy. It was thus spoken: “Lift up the gates of heaven; be ye opened,\nthat the King of glory may come in. Who is this King of glory? The Lord, strong and\nmighty.”109 And how also He should come again out of heaven with glory, hear what was\nspoken in reference to this by the prophet Jeremiah.110 His words are: “Behold, as the Son\nof man He cometh in the clouds of heaven, and His angels with Him.”111", "lang": "greek", "orig": ""}, {"v": 8, "f": "1 Clement", "w": "Chapter LXIII.—It is proved that this God was incarnate.", "t": "I answered, “This, too, has been already demonstrated by me in the previously quoted\nwords of the prophecies, my friends; which, by recalling and expounding for your sakes, I\nshall endeavour to lead you to agree with me also about this matter. The passage, then, which\nIsaiah records, ‘Who shall declare His generation? for His life is taken away from the\nearth,’415—does it not appear to you to refer to One who, not having descent from men,\nwas said to be delivered over to death by God for the transgressions of the people?—of whose\nblood, Moses (as I mentioned before), when speaking in parable, said, that He would wash\nHis garments in the blood of the grape; since His blood did not spring from the seed of man,\nbut from the will of God. And then, what is said by David, ‘In the splendours of Thy holiness\nhave I begotten Thee from the womb, before the morning star.416 The Lord hath sworn,\nand will not repent, Thou art a priest for ever, after the order of Melchizedek,’ 417—does\nthis not declare to you418 that [He was] from of old,419 and that the God and Father of all\nthings intended Him to be begotten by a human womb? And speaking in other words, which\nalso have been already quoted, [he says]: ‘Thy throne, O God, is for ever and ever: a sceptre\nof rectitude is the sceptre of Thy kingdom. Thou hast loved righteousness, and hast hated\niniquity: therefore God, even thy God, hath anointed Thee with the oil of gladness above\nThy fellows. [He hath anointed Thee] with myrrh, and oil, an", "lang": "greek", "orig": ""}, {"v": 8, "f": "1 Clement", "w": "Chapter LXXXIX.—The cross alone is offensive to Trypho on account of the\ncurse, yet it proves that Jesus is Christ.", "t": "I replied to him, “If Christ was not to suffer, and the prophets had not foretold that He\nwould be led to death on account of the sins of the people, and be dishonoured and scourged,\nand reckoned among the transgressors, and as a sheep be led to the slaughter, whose generation,\nthe prophet says, no man can declare, then you would have good cause to wonder.\nBut if these are to be characteristic of Him and mark Him out to all, how is it possible for\nus to do anything else than believe in Him most confidently? And will not as many as have\nunderstood the writings of the prophets, whenever they hear merely that He was crucified,\nsay that this is He and no other?”", "lang": "greek", "orig": ""}, {"v": 8, "f": "1 Clement", "w": "Chapter LXXVI.—From other passages the same majesty and government of\nChrist are proved.", "t": "“For when Daniel speaks of ‘one like unto the Son of man’ who received the everlasting\nkingdom, does he not hint at this very thing? For he declares that, in saying ‘like unto the\nSon of man,’ He appeared, and was man, but not of human seed. And the same thing he\nproclaimed in mystery when he speaks of this stone which was cut out without hands. For\nthe expression ‘it was cut out without hands’ signified that it is not a work of man, but [a\nwork] of the will of the Father and God of all things, who brought Him forth. And when\nIsaiah says, ‘Who shall declare His generation?’ he meant that His descent could not be declared.\nNow no one who is a man of men has a descent that cannot be declared. And when\nMoses says that He will wash His garments in the blood of the grape, does not this signify\nwhat I have now often told you is an obscure prediction, namely, that He had blood, but\nnot from men; just as not man, but God, has begotten the blood of the vine? And when\nIsaiah calls Him the Angel of mighty counsel,470 did he not foretell Him to be the Teacher\nof those truths which He did teach when He came [to earth]? For He alone taught openly\nthose mighty counsels which the Father designed both for all those who have been and shall\nbe well-pleasing to Him, and also for those who have rebelled against His will, whether men\nor angels, when He said: ‘They shall come from the east [and from the west471], and shall\nsit down with Abraham, and Isaac, and Jacob, in the kingdom of heaven: but t", "lang": "greek", "orig": ""}, {"v": 8, "f": "1 Clement", "w": "Chapter CXVIII.—He exhorts to repentance before Christ comes; in whom\nChristians, since they believe, are far more religious than Jews.", "t": "“So that you ought rather to desist from the love of strife, and repent before the great\nday of judgment come, wherein all those of your tribes who have pierced this Christ shall\nmourn, as I have shown has been declared by the Scriptures. And I have explained that the\nLord swore, ‘after the order of Melchizedek,’629 and what this prediction means; and the\nprophecy of Isaiah which says, ‘His burial is taken away from the midst,’630 I have already\nsaid, referred to the future burying and rising again of Christ; and I have frequently remarked\nthat this very Christ is the Judge of all the living and the dead. And Nathan likewise, speaking\nto David about Him, thus continued: ‘I will be His Father, and He shall be my Son; and my\nmercy shall I not take away from Him, as I did from them that went before Him; and I will\nestablish Him in my house, and in His kingdom for ever.’631 And Ezekiel says, ‘There shall\nbe no other prince in the house but He.’632 For He is the chosen Priest and eternal King,\nthe Christ, inasmuch as He is the Son of God; and do not suppose that Isaiah or the other\nprophets speak of sacrifices of blood or libations being presented at the altar on His second\nadvent, but of true and spiritual praises and giving of thanks. And we have not in vain believed\nin Him, and have not been led astray by those who taught us such doctrines; but this\nhas come to pass through the wonderful foreknowledge of God, in order that we, through\nthe calling of the new and eternal covenant", "lang": "greek", "orig": ""}, {"v": 8, "f": "Alexander of Alexandria", "w": "", "t": "“Who shall declare his generation?” His subsistence no nature that is begotten can investigate, even as the Father can be investigated by none. For the nature of rational beings cannot receive the knowledge of his divine generation by the Father.", "lang": "english", "orig": ""}, {"v": 8, "f": "Athanasius of Alexandria", "w": "", "t": "For he it is who proceeded from a virgin and appeared as man on the earth and whose generation after the flesh cannot be declared. For there is none who can tell his father after the flesh, his body not being of a man but of a virgin alone. Thus, no one can declare the corporeal generation of the Savior from a man in the same way as one can draw up a genealogy of David and Moses and of all the patriarchs.", "lang": "english", "orig": ""}, {"v": 8, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "Nevertheless, though mocked and dead, He shall break  in pieces the heads of His enemies, of whom He says, Raise me up, and I shall render to them:  whether it be good things for evil things, while to Himself He subdues the heads of them believing, or whether just things for unjust things, while He punishes the heads of them proud. For in either way are shattered and broken the heads of enemies, when from pride they are thrown down, whether by humility being amended, or whether unto the lowest depths of hell being hurled.", "lang": "", "orig": ""}, {"v": 8, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "17. And He shall live, and there shall be given to Him of the gold of Arabia Psalm 71:15. There would not have been said, and He shall live (for of whom could not this be said, though living for ever so brief a space of time on this earth?) unless that life were being recommended to our notice, wherein He dies no more, and death over Him shall have no more dominion. Romans 6:9 And thus, and He shall live, that was despised in death: for, as another Prophet says, there shall be taken away from the earth the life of Him. Isaiah 53:8 But what is, and there shall be given to Him of the gold of Arabia? For the fact that from thence even the former Salomon received gold, in this Psalm has been in a figure transferred unto another true Salomon, that is, the true Peace-maker. For the former did not have dominion from the river even unto the ends of the round world. Thus then has been prophesied, that even the wise men of this world in Christ would believe. But by Arabia we understand the Gentiles; by gold wisdom which does as much excel among all doctrines as gold among metals. Whence has been written, Receive ye prudence as silver,  and wisdom as proved gold. Proverbs 8:10 And they shall pray concerning Himself always. That which the Greek has, περὶ αὐτοῦ, some have interpreted by concerning Himself, some for Himself, or for Him. But what is, concerning Himself, except perchance that for which we pray, saying, Your kingdom come?", "lang": "", "orig": ""}, {"v": 8, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "10. But this is put off, this will be granted afterwards: what is there now? From the womb I have begotten You, before the morning star. What is here? If God has a Son, has He also a womb? Like fleshly bodies, He has not; for He has not a bosom either; yet it is said, He who is in the bosom of the Father, has declared Him. John 1:18 But that which is the womb, is the bosom also: both bosom and womb are put for a secret place. What means, from the womb? From what is secret, from what is hidden; from Myself, from My substance; this is the meaning of from the womb; for, Who shall declare His generation? Isaiah 53:8 Let us then understand the Father saying unto the Son, From My womb before the morning star have I brought You forth. What then means, before the morning star? The morning star is put for the stars, as if the Scripture signified the whole from a part, and from one conspicuous star all the stars. But how were those stars created? That they may be for signs, and for seasons, and for days, and years. Genesis 1:14 ...This expression also, before the morning star, is used both figuratively and literally, and was thus fulfilled. For the Lord was born at night from the womb of the Virgin Mary; the testimony of the shepherds does assert this, who were keeping watch over their flock. Luke 2:7-8 So David: O You, my Lord, who sits at the right hand of my Lord, whence are You my Son, except because, From the womb before the morning star I have begotten You?", "lang": "", "orig": ""}, {"v": 8, "f": "Augustine - Confessions", "w": "Chapter I.—A Statement of the Reason Why the Enumeration of the Ancestors of\nChrist is Carried Down to Joseph, While Christ Was Not Born of that Man’s\nSeed, But of the Virgin Mary.", "t": "ng\n660 Matt. i. 1.\n661 Matt. viii. 20, ix. 6.\n662 Isa. liii. 8.\n663 Luke iii. 23. [Revised Version, “And Jesus Himself, when He began to teach, was about,” etc. The Latin,\nerat incipiens, conveys the same sense.—R.]\n\n\nof both parties as His parents, when he says", "lang": "latin", "orig": ""}, {"v": 8, "f": "Augustine of Hippo", "w": "", "t": "The Son of God, who is also the Son of man, our Lord Jesus Christ, born of the Father without mother, created every single day; born of his mother without father, he consecrated this particular day [Christmas Day]; invisible in his divine birth, visible in his human one, in each of them wonderful. Thus it is difficult to judge about which of the two the prophet is more likely to have prophesied, “Who shall tell the tale of his begetting?”—whether of that one in which, never not born, he has the Father co-eternal with himself; or of this one in which, born at a particular time, he had already made the mother of whom he would be made; whether of that one where he was always born, since he always was. Who, after all, will tell the tale of how light was born from light, and they were both one light; how God was born from God, and the number of gods did not increase?", "lang": "english", "orig": ""}, {"v": 8, "f": "Augustine of Hippo", "w": "", "t": "If you think this to be referred to the human generation by which he was born of a virgin, look into yourself and ask your soul whether the prophet would dare to declare the divine generation if words failed him for the human one.", "lang": "english", "orig": ""}, {"v": 8, "f": "Augustine of Hippo", "w": "", "t": "To sum up, Christ was born both of a Father and of a mother; both without a father and without a mother; of a Father as God, of a mother as man; without a mother as God, without a Father as man.… “Who will recount his begetting,” whether that one without time or this one without seed; that one without beginning or this one without precedent; that one which never was not, or this one which never was before or after that one which has no end, or this one which has its beginning in its end?", "lang": "english", "orig": ""}, {"v": 8, "f": "Cyril of Jerusalem", "w": "", "t": "This sheep is equally called shepherd and says “I am the good Shepherd.” By his manhood he is sheep; by his divine loving-kindness he is shepherd.", "lang": "english", "orig": ""}, {"v": 8, "f": "Ephrem the Syrian", "w": "Commentary on Genesis", "t": "How meek are You! How mighty are You, O Child! Luke 2:52 Your judgment is mighty, Your love is sweet! Who can stand against You? Your Father is in Heaven, Your Mother is on earth; who shall declare You? Isaiah 53:8", "lang": "", "orig": ""}, {"v": 8, "f": "Gaius Marius Victorinus", "w": "", "t": "Those who do not understand the manner of begetting may mislead you when they say, “Who can speak of the birth of the Lord?” First, “who” or still more “no one” does indeed seem to signify men. Only the Holy Spirit can grasp or explain this manner of begetting. That is why we ourselves with the permission of God the Father and of Jesus Christ our Lord have set it forth. Certainly it is not a hopeless enterprise, but we have described it as by a miracle. Next, supposing that the manner of begetting is unknown, we speak of substance when we say that the Father and Son are of the same essence (homoousios).", "lang": "english", "orig": ""}, {"v": 8, "f": "Hippolytus", "w": "Chapter II.—Naasseni Ascribe Their System, Through Mariamne, to James the\nLord’s Brother; Really Traceable to the Ancient Mysteries; Their Psychology as\nGiven in the “Gospel According to Thomas;” Assyrian Theory of the Soul; The\nSystems of the Naasseni and the Assyrians Compared; Support Drawn by the\nNaasseni from the Phrygian and Egyptian Mysteries; The Mysteries of Isis; These\nMysteries Allegorized by the Naasseni.", "t": "he would write a detailed history\nof heresy.\n327 Isa. liii. 8.\n328 Or ἀδιάφορον, equivocal.\n329 This has been by the best critics regarded as a fragment of a hymn of Pindar’s on Jupiter Ammon.\nSchneidewin furnishes a restored poetic version of it by Bergk. This", "lang": "greek", "orig": ""}, {"v": 8, "f": "Jerome", "w": "", "t": "He was taken away by distress and judgment. Who can describe his generation? For he was cut off from the land of the living; because of the transgression of my people he was struck down. LXX: In his humility his judgment was taken away. Who will declare his generation, for his life is taken from the earth? He was led away to death because of the iniquities of my people. And what follows: He was taken away from distress and judgment; or as the Septuagint translated, in his humility his judgment was taken away, it signifies that he, having conquered, ascended from tribulation and judgment to the Father; or that the judge of all will not find truth in judgment; but that he was condemned without any fault, through the sedition of the Jews and the voice of Pilate. Therefore, the Prophet marvels that God has delivered himself to the passion of all. About what Paul is speaking: For if they had believed, they would never have crucified the Lord of glory (1 Cor. 2:8). It follows: Who will declare His generation? This is understood in two ways: either it is to be understood about His divinity, that the mysteries of His divine birth are impossible to know; about which He Himself speaks in the Proverbs: Before all the hills He brought me forth (Prov. 8:25); according to what we read elsewhere: For who has known the mind of the Lord? Or who has been His counselor? (Rom. 11:34)? That is, no man; or about the birth of the Virgin, which can hardly be explained. Finally, when it was said to M", "lang": "english", "orig": ""}, {"v": 8, "f": "Jerome", "w": "Commentarii in Danielem", "t": "For if there were no dispute about doctrines, if you had not roused the anger of an old man, if he had given you no reply, what need was there for you, who do not excel in gifts of speech, to discuss in a single sermon in the church the whole circle of doctrine — the Trinity, the assumption of our Lord's body, the cross, hell, the nature of angels, the condition of souls, the Saviour's resurrection and our own, and this as taking place on this earth (topics perhaps omitted in your manuscript) in the presence of the masses, in the presence, too, of a man of such distinction? And to speak with such perfect assurance and to gallop through it all without stopping to draw breath? What shall we say of the ancient writers of the Church, who were scarce able to explain single difficulties in many volumes? What of the vessel of election, the Gospel trumpet, the roaring of our lion, the thunderer of the Gentiles, the river of Christian eloquence, who, when confronted by the Colossians 1:26 mystery concealed from ages and generations, and by Romans 11:33 the depth of the riches of the wisdom and knowledge of God, rather marvels at it than discusses it? What of Isaiah, who pointed beforehand to the Virgin? That single thing was too much for him, and he says, Isaiah 53:8 Who shall declare his generation? In our age a poor mannikin has been found, who, with one turn of the tongue, and a brilliancy exceeding that of the sun, discourses on all ecclesiastical questions.", "lang": "", "orig": ""}, {"v": 8, "f": "Lactantius", "w": "CHAP. VIII.—OF THE BIRTH OF JESUS IN THE SPIRIT AND IN THE FLESH: OF\nSPIRITS AND THE TESTIMONIES OF PROPHETS.", "t": "re.]\n535 αύτοπάτορα καὶ αυἠτομήτορα.\n536 Thus Isa. liii. 8: “Who shall declare His generation?”\n537 Cautum est.\n538 Thus λόγος includes the two senses of word and reason.\n\n\nof God, and also that the other angels are spirits539 of God. For speech is breath s", "lang": "latin", "orig": ""}, {"v": 8, "f": "Leo the Great", "w": "", "t": "The birth of our Lord and Savior, whether that of his divinity from the Father or that of his flesh from his mother, surpasses the power of human eloquence. As a result, the saying (“Who will recount his generation?”) may rightly be referred to either.", "lang": "english", "orig": ""}, {"v": 8, "f": "Thomas Aquinas", "w": "", "t": "He was taken away from distress. The humility of his passion having been set out, here he begins to set out the glory of his exaltation, which is the reward of his passion, as it says in Philippians 2:9: for which cause, God also has exalted him.\n\nAnd first, as to his escape from dangers;\n\nsecond, as to vengeance against his enemies: and he shall give the ungodly (Isa 53:9);\n\nthird, as to the justification of men: if he shall lay down (Isa 53:10);\n\nfourth, as to his victory over the rebellious: therefore will I distribute to him (Isa 53:12).\n\nConcerning the first, he does two things.\n\nFirst, he sets out the reward: he was taken away, in the resurrection, from the distress, of his passion, and from the unjust judgment, by which he was judged by others: the just is delivered out of distress (Prov 11:8).\n\nSecond, he sets out his merit, setting out the worthiness of the sufferer, so that the merit of the passion is measured from the condition of the person: his generation, his eternal generation which was from a father without a mother, or his generation in time, which was from a mother without a father, who shall declare, as if to say: no one by natural reason, though somewhat by divine inspiration: who saw him, and shall declare him? (Sir 43:35). And he sets out the suffering inflicted on him: because he is cut off, through death by the Jews, out of the land of the living, out of this life: come, let us put wood on his bread, and cut him off from the land of the living (Jer 11:", "lang": "english", "orig": ""}, {"v": 8, "f": "npnf204", "w": "Statement of Faith.", "t": "ensibly, for ‘who\nshall declare his generation?’ (Isa. liii. 8), in other words, no one can. Who, when at the\nconsummation of the ages (Heb. ix. 26), He had descended from the bosom of the Father,\ntook from the undefiled Virgin Mary our humanity (ἄνθρωπον), Chri", "lang": "greek", "orig": ""}, {"v": 9, "f": "1 Peter", "w": "", "t": "Servants, be subject to your masters with all fear; not only to the good and gentle, but also to the froward.  For this is thankworthy, if a man for conscience toward God endure grief, suffering wrongfully.  For what glory is it, if, when ye be buffeted for your faults, ye shall take it patiently? but if, when ye do well, and suffer for it, ye take it patiently, this is acceptable with God.  For even hereunto were ye called: because Christ also suffered for us, leaving us an example, that ye should follow his steps:  Who did no sin, neither was guile found in his mouth [Isaiah 53:9]: Who, when he was reviled, reviled not again; when he suffered, he threatened not; but committed himself to him that judgeth righteously:  Who his own self bare our sins in his own body on the tree, that we, being dead to sins, should live unto righteousness: by whose stripes ye were healed.  For ye were as sheep going astray; but are now returned unto the Shepherd and Bishop of your souls.", "lang": "english", "orig": ""}, {"v": 9, "f": "Hippolytus of Rome", "w": "", "t": "David alone of the prophets prophesied with an instrument, called by the Greeks the “psaltery.” … But this psaltery has the source of its musical numbers above, in order that we, too, may practice seeking things above and not suffer ourselves to be borne down by the pleasure of melody to the passions of the flesh. And I think that this truth, too, was signified deeply and clearly to us in a prophetic way in the construction of the instrument, namely, that those who have souls well ordered and trained have the way ready to things above. And again, an instrument having the source of its melodious sound in its upper parts may be taken as like the body of Christ and his saints—the only instrument that maintains rectitude; “for he did no sin, neither was guile found in his mouth.” This is indeed an instrument, harmonious, melodious, well-ordered, that took in no human discord and did nothing out of measure but maintained in all things, as it were, harmony toward the Father; for, as he says, “he that is of the earth is earthly and speaks of the earth; he that comes from heaven testifies of what he has seen and heard.”", "lang": "english", "orig": ""}, {"v": 9, "f": "Jerome", "w": "", "t": "He will be given the wicked as a burial place, and the wealthy as his tomb, because he did no violence, nor was deceit found in his mouth. LXX: I will give the wicked for his burial, and the rich for his death. He did not commit iniquity, nor was deceit found in his mouth. He gave the impious for his burial; and the rich for his death. Whether the worst for his burial; and the rich for his death: signifying both peoples, that the multitude of the Gentiles may be shown in the wicked and the worst, who did not have knowledge of God before (Rom. IX); the Jewish people may be shown in the rich, whose people had the Testament and the Legislation and the Prophets. Therefore for this reason the Lord suffered and was buried, so that he might gather for himself a Church from both peoples. Or should this be said, that God delivered the Scribes and Pharisees, as well as the Sadducees, priests and pontiffs, who ruled over the people before the Lord's passion and were filled with excessive wealth, to the Romans after the Lord's passion, and subjected them to eternal servitude. He, for the sake of whose burial and death, the wicked and the rich were handed over, did not commit iniquity, nor was deceit found in his mouth. That which can be understood about no man at all, that he has not sinned in deed or in speech, the Scripture says: There is no one who is clean from filth, not even if his life is only for one day. And, we have all strayed like sheep, each one has turned aside in his own w", "lang": "english", "orig": ""}, {"v": 9, "f": "John Chrysostom", "w": "", "t": "In reality, the people were subject to another curse, which says, “Cursed is everyone who does not continue in all that is written in the book of the law.” To this curse, I say, people were subject, for no person had continued in or was a keeper of the whole law. But Christ exchanged this curse for the other, “Cursed is every one that hangs on a tree.” … It was necessary for him who is about to relieve us from a curse to be himself free of it. But he received another instead of ours. Therefore Christ took on himself just such curse and thereby relieved us from the curse. It was like an innocent person deciding to die for another sentenced to death, and so rescuing him from punishment. For Christ took on him not the curse of transgression but the other curse, in order to remove that of others. For “he had done no violence, neither was any deceit in his mouth.”", "lang": "english", "orig": ""}, {"v": 9, "f": "John Chrysostom", "w": "", "t": "Then to show that the court was corrupt and the sentence unjust, he went on to say, “In his humiliation his legal trial was taken away,” that is, no one judged justly in his case.", "lang": "english", "orig": ""}, {"v": 9, "f": "John Chrysostom", "w": "", "t": "And is not one ashamed to say that God is not crafty or deceitful? Concerning him, however, in respect of the flesh, it might be reasonable [to say it].", "lang": "english", "orig": ""}, {"v": 9, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "But the law He fulfilled, not in one way only, but in a second and third also. In one way, by transgressing none of the precepts of the law. For that He did fulfill it all, hear what He says to John, For thus it becomes us to fulfill all righteousness. Matthew 3:15 And to the Jews also He said, Which of you convinces me of sin. John 8:46 And to His disciples again, The prince of this world comes, and finds nothing in me. John 14:30 And the prophet too from the first had said that He did no sin. Isaiah 53:9", "lang": "", "orig": ""}, {"v": 9, "f": "Tertullian (cont)", "w": "Chapter VI.—On the Incarnation of Christ.", "t": "affectus.\n2153 Ps. xlv. 7.\n2154 Col. ii. 9.\n2155 Isa. liii. 9.\n2156 Heb. iv. 15.\n2157 John viii. 46.\n2158 John xiv. 30.\n2159 This quotation is made up of two different parts of Isaiah: chap. viii. 4, “Before the child shall have\nknowledge to cry, My father and", "lang": "latin", "orig": ""}, {"v": 9, "f": "Tertullian (cont)", "w": "Chapter VI.—On the Incarnation of Christ.", "t": "5. Now, if our having shown above that Christ possessed a rational soul should cause\na difficulty to any one, seeing we have frequently proved throughout all our discussions that\nthe nature of souls is capable both of good and evil, the difficulty will be explained in the\nfollowing way. That the nature, indeed, of His soul was the same as that of all others cannot\n2152 Meriti affectus.\n2153 Ps. xlv. 7.\n2154 Col. ii. 9.\n2155 Isa. liii. 9.\n2156 Heb. iv. 15.\n2157 John viii. 46.\n2158 John xiv. 30.\n2159 This quotation is made up of two different parts of Isaiah: chap. viii. 4, “Before the child shall have\nknowledge to cry, My father and my mother;” and chap. vii. 16, “Before the child shall know to refuse the evil,\nand choose the good.”\n\n\nbe doubted, otherwise it could not be called a soul were it not truly one. But since the power\nof choosing good and evil is within the reach of all, this soul which belonged to Christ elected\nto love righteousness, so that in proportion to the immensity of its love it clung to it unchangeably\nand inseparably, so that firmness of purpose, and immensity of affection, and\nan inextinguishable warmth of love, destroyed all susceptibility (sensum) for alteration and\nchange; and that which formerly depended upon the will was changed by the power of long\ncustom into nature; and so we must believe that there existed in Christ a human and rational\nsoul, without supposing that it had any feeling or possibility of sin.", "lang": "latin", "orig": ""}, {"v": 9, "f": "Theodore Stratelates", "w": "", "t": "If you wish to look at the mind behind his appearance, you will find it to be an ocean of compassion for humanity residing there. For he saved them, the most foul people who gloried in their wealth and those condemned to death from their deeds, as they trusted and received the death of the Savior which was a ransom for them, offering them, in place of the tomb and death, eternal life and incorruptible everlasting life.This verse shows the unrighteous rage of the devil when he unleashed himself on our Savior. For although there was no sin found in his being according to the flesh, but that flesh remained sinless, the devil as if [Christ] were a sinner killed him and in so doing manifested the totality of his wickedness. But for this very reason came salvation for those who had fallen into sin.\nReceiving the sufferings due to us, [Christ] made them his own and so from a standpoint of faith it is said that he became a curse for us himself. And it is said that they make gifts not with sacrifices but with feeling and repentance, and thus they receive a spiritual healing as they trade not only their present life.\nOnce the only Son of God made our salvation his own prize when he took a body and endured sufferings on our behalf. And his Father rightly said that he took away [Christ’s] pain as our healing and purifying, that our illumination was shown to be his light just as we grow into the knowledge of God and understanding with our behavior changed for the better and converted in t", "lang": "english", "orig": ""}, {"v": 9, "f": "Thomas Aquinas", "w": "", "t": "And he shall give the ungodly. Here he sets out his vindication against his persecutors.\n\nAnd first, he sets out their reward: and he shall give the ungodly, the Jews into the hands of the Romans, for his burial, because they had him guarded in the tomb: the wicked is delivered up for the just (Prov 21:18).\n\nSecond, he sets out his merit as to the innocence of his life: because he has done no iniquity, as to sins of deed, neither was there deceit in his mouth, as to sins of word: who did no sin, neither was guile found in his mouth (1 Pet 2:22). And as to the obedience of his death: and the Lord, the Father, was pleased, and he was obedient to the Father unto death: becoming obedient unto death (Phil 2:8); the weakness of God is stronger than men (1 Cor 1:25).", "lang": "english", "orig": ""}, {"v": 9, "f": "npnf207", "w": "Lecture XIII.", "t": "3; xvii. 35, 36.\n1492 1 Pet. ii. 22, quoted from Isa. liii. 9.\n1493 Luke xxiii. 14.\n1494 Matt. xxvii. 24.\n1495 Luke xxiii. 41. Cf. Cat. xiii. 30, 31. The Benedictine Editor remarks, “We know not whence Cyril took\nthe notion that the two robbers were present at", "lang": "greek", "orig": ""}, {"v": 10, "f": "Jerome", "w": "", "t": "And the Lord was pleased to crush him in infirmity. LXX: And the Lord desires to cleanse him from his wound. However, the Lord wanted to cleanse him from the wound that he had received from the soldier's spear. Whether to crush him in weakness and wound: of whom he himself said: Because whom you struck, they persecuted (Ps. 68:27). And through Zacharias God speaks: I will strike the shepherd, and the sheep will be scattered (Zech. 13:7). Therefore, it was not of necessity that he suffered, but of the will of the Father and his own, to whom he himself said: Father, I have wanted to do your will (Ps. 39:9). Of whom also we read above: He was offered, because he himself wanted.", "lang": "english", "orig": ""}, {"v": 10, "f": "Jerome", "w": "", "t": "(Verse 10, 11) If he shall offer his soul for sin, he shall see a long-lived seed, and the will of the Lord shall be prosperous in his hand. Because his soul hath laboured, he shall see and be filled: by his knowledge shall this My just servant justify many, and he shall bear their iniquities. LXX: If you shall give for sin, your soul shall see a long-lived seed: and the Lord will take away the evil of his anguish, to shew him light, and give him understanding. Justify the righteous servant for many: and he shall bear their iniquities. According to the Hebrew sense here: If he shall offer his soul for sin, he shall see a long-lived seed, which he hath sowed in good ground. Of whom it is written in the Gospel: He that soweth, went forth to sow; and again: The kingdom of heaven is likened to a man that sowed good seed in his field (Matthew XIII, 3). And the will of the Lord will be directed in his hand, so that whatever the Father desired will be fulfilled by his virtues, saying to the Father: I have kept those whom you gave me in your name. I have guarded them, and none of them perished except the son of perdition. (John 17:12). But the seed will see eternity, and the will of the Father will be directed in his hand: because his soul has labored for a long time, finding no rest among the Jews, and saying in the Gospel: Foxes have dens, and birds of the sky have nests: but the Son of Man has nowhere to lay his head. (Matthew 8:10). And in this same place the Prophet says: I have", "lang": "english", "orig": ""}, {"v": 10, "f": "Procopius of Gaza", "w": "", "t": "“His soul will see his offspring grow.” On the day after his suffering, the spiritual conception of that indescribable, indwelling birth came. The divine power was vindicated in accordance with the promises to Abraham in the undoing of death-bearing sin and the access to redemption. And where the [LXX] text has “And the Lord wills to alleviate his soul from its suffering,” Symmachus renders, “And the will of the Lord prospered in his hand.” And this fits the Savior well. He gave light to himself so that others would be illuminated through his being just, but he also gave understanding. For the spirit of wisdom and understanding was resting on him to give others understanding and “to justify those worthy of being justified.” Others interpret in this way: the Lord wills to turn the sorrow on the cross to gladness through revealing himself to those who had once been deceived in darkness who were now being transformed into light. For as Paul said, “We who were once darkness are now light in the Lord” and “recreated in understanding,” as though being changed from glory into glory.…God is said to have made one new humanity from two peoples, that is, to have made a transformation. For the Only Begotten considered our salvation to be his own reward. By taking a body, he thus suffered on our behalf. And so, it was necessary for the Father to make the “alleviation of suffering”—which is said about Christ—our healing and to make his light our illumination, exchanging what we had for som", "lang": "english", "orig": ""}, {"v": 10, "f": "Theodoret of Cyrus", "w": "", "t": "Having thus proclaimed in advance the iniquity of the people, he addresses to them an exhortation to repent—for he saw in advance those among them who, after these events, would have the faith. Of this number was the divine Paul; of this number were the three thousand men and the many thousands—and he says, “If you can give an offering for sin, your soul shall see a long-lived offspring.” If you acknowledge your impiety, and if you request salvation, you will obtain life eternal; for this is what he has called “long-lived.”", "lang": "english", "orig": ""}, {"v": 10, "f": "Thomas Aquinas", "w": "", "t": "If he shall lay down. Here he sets out that, through him, the justification of men was completed.\n\nAnd first, he sets out the reward for the sorrow of his death: if he shall lay down his life, of his own will: I lay down my life (John 10:17), he shall see a long-lived seed, until the end of the world, sons for him reborn out of the power of his death: unless the grain of wheat falling into the ground die, itself remains alone. But if it die it brings forth much fruit (John 12:24–25); and the will of the Lord shall be directed, fulfilled, in his hand, in his work: this is the will of God, your sanctification (1 Thess 4:3).", "lang": "english", "orig": ""}, {"v": 11, "f": "Apostolic Constitutions", "w": "", "t": "If the Lord of heaven and earth underwent all his sufferings for us, how then do you make a difficulty to minister to such as are in want, who ought to imitate him who underwent servitude, and want, and stripes and the cross for us? We ought therefore also to serve the brethren, in imitation of Christ. For says he, “He who will be great among you, let him be your minister; and he who will be first among you, let him be your servant.” For so did he really, and not in word only, fulfill the prediction of “serving many faithfully.”", "lang": "english", "orig": ""}, {"v": 11, "f": "Cyril of Alexandria", "w": "", "t": "He has bought us with his own blood. He endured the cross, despising its shame, so that he might win our salvation. Therefore bow your necks to his yoke. For your soul will see the fruitful seed, that is, you will be sharers in those being kept for eternal life, that is, the saints who have been enriched with the hope of eternal life. For there was no idea of the resurrection of the dead among the Greeks, and the mystery until now was not set forth. They all but said that the breath in your no nostrils is smoke that is burning. All the ashes will disappear, and the spirit like a weak person will be dissolved.", "lang": "english", "orig": ""}, {"v": 11, "f": "John Chrysostom", "w": "", "t": "[David] predicted that Christ would rise again. “You will not leave my soul in hell, nor will you allow your holy one to see corruption.” Isaiah expressed the same thing in a different way. For he said, “The Lord wishes to cleanse him from his wounds, to show him light, to justify the righteous one who served many well.”Isaiah established that the slaying of Christ was a ransom for humanity’s sins when he said, “He has borne the sins of many.” And he will free humankind from demons, for as Isaiah said, “He will divide the spoils of the strong.” And the same prophet spoke out clearly that Christ did this through his death when he said, “Because his soul was delivered up to death.” That Christ would be put in charge over the whole world he revealed by these words of his, “He shall inherit many.”", "lang": "english", "orig": ""}, {"v": 11, "f": "Lactantius", "w": "WHAT ARE THE CHARACTERS OF A DEACON.", "t": "“lay\n800 Vid Rom. vi. 3\n801 Matt. vi. 9, etc.\n802 Isa. liii. 11, LXX.\n803 Matt. xx. 28.\n\n\ndown His life,” as Himself says, “for His friends.”804 If, therefore, the Lord of heaven and\nearth underwent all His sufferings for us, how then do you make a difficulty to", "lang": "latin", "orig": ""}, {"v": 11, "f": "Tertullian", "w": "", "t": "However, I will show [Marcion] the death and burial and resurrection of Christ all indicated in a single sentence of Isaiah, who says, “His sepulchre was removed from the midst of them.” Now there could have been no sepulchre without death and no removal of sepulchre except by resurrection.… “He shall divide the spoil of many, because he poured out his soul to death.” For here is set forth the cause of this favor to him, even that it was to recompense him for his death.", "lang": "english", "orig": ""}, {"v": 11, "f": "Thomas Aquinas", "w": "", "t": "And the reward for the labor of his teaching: because his soul has labored, in preaching and discoursing, he shall see, the gentiles converted to him, and be filled, as though having what he intended: I have meat to eat which you know not (John 4:32).\n\nSecond, he sets out his merit as to the exercise of preaching: by his knowledge, that is, his teaching: justified freely by faith (Rom 5:1); Lord, to whom shall we go? You have the words of eternal life (John 6:69); and as to the torment of death: he shall bear their iniquities, that is, the punishments for their iniquities, above: I have made you, and I will bear (Isa 46:4).", "lang": "english", "orig": ""}, {"v": 12, "f": "1 Clement", "w": "Chapter L.—His humiliation predicted.", "t": "But that, having become man for our sakes, He endured to suffer and to be dishonoured,\nand that He shall come again with glory, hear the prophecies which relate to this; they are\nthese: “Because they delivered His soul unto death, and He was numbered with the transgressors,\nHe has borne the sin of many, and shall make intercession for the transgressors.\nFor, behold, My Servant shall deal prudently, and shall be exalted, and shall be greatly extolled.\nAs many were astonished at Thee, so marred shall Thy form be before men, and so\nhidden from them Thy glory; so shall many nations wonder, and the kings shall shut their\nmouths at Him. For they to whom it was not told concerning Him, and they who have not\nheard, shall understand. O Lord, who hath believed our report? and to whom is the arm of\nthe Lord revealed? We have declared before Him as a child, as a root in a dry ground. He\nhad no form, nor glory; and we saw Him, and there was no form nor comeliness: but His\nform was dishonoured and marred more than the sons of men. A man under the stroke,\nand knowing how to bear infirmity, because His face was turned away: He was despised,\nand of no reputation. It is He who bears our sins, and is afflicted for us; yet we did esteem\nHim smitten, stricken, and afflicted. But He was wounded for our transgressions, He was\nbruised for our iniquities, the chastisement of peace was upon Him, by His stripes we are\nhealed. All we, like sheep, have gone astray; every man has wandered in his own way. ", "lang": "greek", "orig": ""}, {"v": 12, "f": "1 Clement", "w": "Chapter XVII.—The Christians are refused Polycarp’s body.", "t": "But when the adversary of the race of the righteous, the envious, malicious, and wicked\none, perceived the impressive127 nature of his martyrdom, and [considered] the blameless\nlife he had led from the beginning, and how he was now crowned with the wreath of immortality,\nhaving beyond dispute received his reward, he did his utmost that not the least memorial\nof him should be taken away by us, although many desired to do this, and to become\npossessors128 of his holy flesh. For this end he suggested it to Nicetes, the father of Herod\nand brother of Alce, to go and entreat the governor not to give up his body to be buried,\n“lest,” said he, “forsaking Him that was crucified, they begin to worship this one.” This he\nsaid at the suggestion and urgent persuasion of the Jews, who also watched us, as we sought\nto take him out of the fire, being ignorant of this, that it is neither possible for us ever to\nforsake Christ, who suffered for the salvation of such as shall be saved throughout the whole\nworld (the blameless one for sinners129), nor to worship any other. For Him indeed, as being\nthe Son of God, we adore; but the martyrs, as disciples and followers of the Lord, we worthily\nlove on account of their extraordinary130 affection towards their own King and Master, of\nwhom may we also be made companions131 and fellow-disciples!", "lang": "greek", "orig": ""}, {"v": 12, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "For it was just that He should raise again from the dead the Innocent who was slain, and to whom evil had been recompensed for good, and that He should render to the persecutor a meet reward, who repaid Him evil for good. For we read, Your justice is as the mountains of God.", "lang": "", "orig": ""}, {"v": 12, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "2. The people of God, then, in this Psalm says, O God, who shall be like You? Psalm 82:1. Which I suppose to be more fitly taken of Christ, because, being made in the likeness of men, Philippians 2:7 He was thought by those by whom He was despised to be comparable to other men: for He was even reckoned among the unrighteous, Isaiah 53:12 but for this purpose, that He might be judged. But when He shall come to judge, then shall be done what is here said, O God, who is like You? For if the Psalms did not use to speak to the Lord Christ, that too would not be spoken which not one of the faithful can doubt was spoken unto Christ. Your throne, O God, is for ever and ever, a sceptre of righteousness is the scep

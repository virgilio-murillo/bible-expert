οῇ ἡμῶν καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη", "2": "ἀνηγγείλαμεν ἐναντίον αὐτοῦ ὡς παιδίον ὡς ῥίζα ἐν γῇ διψώσῃ οὐκ ἔστιν εἶδος αὐτῷ οὐδὲ δόξα καὶ εἴδομεν αὐτόν καὶ οὐκ εἶχεν εἶδος οὐδὲ κάλλος", "3": "ἀλλὰ τὸ εἶδος αὐτοῦ ἄτιμον ἐκλεῖπον παρὰ πάντας ἀνθρώπους ἄνθρωπος ἐν πληγῇ ὢν καὶ εἰδὼς φέρειν μαλακίαν ὅτι ἀπέστραπται τὸ πρόσωπον αὐτοῦ ἠτιμάσθη καὶ οὐκ ἐλογίσθη", "4": "οὗτος τὰς ἁμαρτίας ἡμῶν φέρει καὶ περὶ ἡμῶν ὀδυνᾶται καὶ ἡμεῖς ἐλογισάμεθα αὐτὸν εἶναι ἐν πόνῳ καὶ ἐν πληγῇ καὶ ἐν κακώσει", "5": "αὐτὸς δὲ ἐτραυματίσθη διὰ τὰς ἀνομίας ἡμῶν καὶ μεμαλάκισται διὰ τὰς ἁμαρτίας ἡμῶν παιδεία εἰρήνης ἡμῶν ἐπ᾿ αὐτόν τῷ μώλωπι αὐτοῦ ἡμεῖς ἰάθημεν", "6": "πάντες ὡς πρόβατα ἐπλανήθημεν ἄνθρωπος τῇ ὁδῷ αὐτοῦ ἐπλανήθη καὶ κύριος παρέδωκεν αὐτὸν ταῖς ἁμαρτίαις ἡμῶν", "7": "καὶ αὐτὸς διὰ τὸ κεκακῶσθαι οὐκ ἀνοίγει τὸ στόμα ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη καὶ ὡς ἀμνὸς ἐναντίον τοῦ κείροντος αὐτὸν ἄφωνος οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ", "8": "ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη τὴν γενεὰν αὐτοῦ τίς διηγήσεται ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ ἀπὸ τῶν ἀνομιῶν τοῦ λαοῦ μου ἤχθη εἰς θάνατον", "9": "καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ καὶ τοὺς πλουσίους ἀντὶ τοῦ θανάτου αὐτοῦ ὅτι ἀνομίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ", "10": "καὶ κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς ἐὰν δῶτε περὶ ἁμαρτίας ἡ ψυχὴ ὑμῶν ὄψεται σπέρμα μακρόβιον καὶ βούλεται κύριος ἀφελεῖν", "11": "ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ δεῖξαι αὐτῷ φῶς καὶ πλάσαι τῇ συνέσει δικαιῶσαι δίκαιον εὖ δουλεύοντα πολλοῖς καὶ τὰς ἁμαρτίας αὐτῶν αὐτὸς ἀνοίσει", "12": "διὰ τοῦτο αὐτὸς κληρονομήσει πολλοὺς καὶ τῶν ἰσχυρῶν μεριεῖ σκῦλα ἀνθ᾿ ὧν παρεδόθη εἰς θάνατον ἡ ψυχὴ αὐτοῦ καὶ ἐν τοῖς ἀνόμοις ἐλογίσθη καὶ αὐτὸς ἁμαρτίας πολλῶν ἀνήνεγκεν καὶ διὰ τὰς ἁμαρτίας αὐτῶν παρεδόθη"}}, "patristic": [{"v": 1, "f": "1 Clement", "w": "Chapter XVI.—Christ as an example of humility.", "t": "For Christ is of those who are humble-minded, and not of those who exalt themselves\nover His flock. Our Lord Jesus Christ, the Sceptre of the majesty of God, did not come in\nthe pomp of pride or arrogance, although He might have done so, but in a lowly condition,\nas the Holy Spirit had declared regarding Him. For He says, “Lord, who hath believed our\nreport, and to whom is the arm of the Lord revealed? We have declared [our message] in\nHis presence: He is, as it were, a child, and like a root in thirsty ground; He has no form nor\nglory, yea, we saw Him, and He had no form nor comeliness; but His form was without\neminence, yea, deficient in comparison with the [ordinary] form of men. He is a man exposed\nto stripes and suffering, and acquainted with the endurance of grief: for His countenance\nwas turned away; He was despised, and not esteemed. He bears our iniquities, and is in\nsorrow for our sakes; yet we supposed that [on His own account] He was exposed to labour,\nand stripes, and affliction. But He was wounded for our transgressions, and bruised for our\niniquities. The chastisement of our peace was upon Him, and by His stripes we were healed.\nAll we, like sheep, have gone astray; [every] man has wandered in his own way; and the Lord\nhas delivered Him up for our sins, while He in the midst of His sufferings openeth not His\nmouth. He was brought as a sheep to the slaughter, and as a lamb before her shearer is dumb,\nso He openeth not His mouth. In His humiliation His judgment w", "lang": "greek", "orig": ""}, {"v": 1, "f": "Apostolic Constitutions", "w": "", "t": "Due to their exceedingly great wickedness, they would not believe in him, as the Lord shows in these words, “Who has believed our report? And to whom has the arm of the Lord been revealed?” And afterward, “Hearing you shall hear and shall not understand; and seeing you shall see and shall not perceive, for the heart of this people has become desensitized.” Therefore, knowledge was taken from them, because when they saw, they overlooked, and when they heard, they heard nothing at all.", "lang": "english", "orig": ""}, {"v": 1, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "13. For requiring their blood He has remembered Psalm 9:12. As if they, who were sent to preach the Gospel, should make answer to that injunction which has been mentioned, Show forth His wonders among the heathen, and should say, O Lord, who has believed our report? Isaiah 53:1 and again, For Your sake we are killed all the day long;  the Psalmist suitably goes on to say, That Christians not without great reward of eternity will die in persecution, for requiring their blood He has remembered. But why did he choose to say, their blood? Was it, as if one of imperfect knowledge and less faith should ask, How will they show them forth, seeing that the infidelity of the heathen will rage against them; and he should be answered, For requiring their blood He has remembered, that is, the last judgment will come, in which both the glory of the slain and the punishment of the slayers shall be made manifest? But let no one suppose He has remembered to be so used, as though forgetfulness can attach to God; but since the judgment will be after a long interval, it is used in accordance with the feeling of weak men, who think God has forgotten, because He does not act so speedily as they wish. To such is said what follows also, He has not forgotten the cry of the poor: that is, He has not, as you suppose, forgotten. As if they should on hearing, He has remembered, say, Then He had forgotten; No, He has not forgotten, says the Psalmist, the cry of the poor.", "lang": "", "orig": ""}, {"v": 1, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "15. Behold, themselves shall speak in their mouth, and a sword is on the lips of them Psalm 58:7. Here is that sword twice whetted, whereof the Apostle says, And the sword of the Spirit, which is the Word of God. Ephesians 6:17 Wherefore twice whetted? Wherefore, but because smiting out of both Testaments? With this sword were slain those whereof it was said to Peter, Slay, and eat. Acts 10:13 And a sword is on the lips of them. For who has heard? They all speak in their mouth, Who has heard? That is, they shall be angry with men that are slow to believe. They that a little before were even themselves unwilling to believe, do feel disgust from men not believing. And truly, brethren, so it is. You see a man slow before he is made a Christian; you cry to him daily, hardly he is converted: suppose him to be converted, and then he would have all men to be Christians, and wonders that not yet they are. It has chanced out to him at evening to have been converted: but because he has been made hungering like a dog, he has also on his lips a sword; he says, Who has heard? What is, Who has heard? Who has believed our hearing, and to whom has the arm of the Lord been revealed? Isaiah 53:1 For who has heard? The Jews believe not: they have turned them to the nations, and have preached. The Jews did not believe; and nevertheless through believing Jews the Gospel went around the city, and they said, For who has heard? And You, Lord, shall deride them Psalm 58:8.", "lang": "", "orig": ""}, {"v": 1, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "And the Arm of the Lord has been revealed to whom? Isaiah 53:1 The Arm of the Lord is Christ. Do not then forsake me: let not them rejoice that say, only for a set time the Christians are. May there be persons to tell forth Your arm. To whom? To every generation that is yet to come. If then it be to every generation that is yet to come, it will be even unto the end of the world: for when the world is ended, no longer any generation will come on.", "lang": "", "orig": ""}, {"v": 1, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "16. You have redeemed in Your arm Your people Psalm 76:15. With Your arm, that is, with Your power. And to whom has the arm of the Lord been revealed? Isaiah 53:1 You have redeemed in Your arm Your people, the sons of Israel and of Joseph. How as if two peoples, the sons of Israel and of Joseph? Are not the sons of Joseph among the sons of Israel?...He has admonished us of some distinction to be made. Let us search out our spirit, perchance God has placed there something — God whom we ought even by night to seek with our hands, in order that we may not be deceived — perchance we shall discover even ourselves in this distinction of sons of Israel and of Joseph. By Joseph He has willed another people to be understood, has willed that the people of the Gentiles be understood. Why the people of the Gentiles by Joseph? Because Joseph was sold into Egypt by his brethren. Genesis 37:28 That Joseph whom the brethren envied, and sold him into Egypt, when sold into Egypt, toiled, was humbled; when made known and exalted, flourished, reigned. And by all these things he has signified what? What but Christ sold by His brethren, banished from His own land, as it were into the Egypt of the Gentiles? There at first humbled, when the Martyrs were suffering persecutions: now exalted, as we see; inasmuch as there has been fulfilled in Him, There shall adore Him all kings of the earth, all nations shall serve Him.", "lang": "", "orig": ""}, {"v": 1, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "30. In the next place there follows, And He led them into the mountain of His sanctification Psalm 77:54. How much better into Holy Church! The mountain which His right hand has gotten. How much higher is the Church which Christ has gotten, concerning whom has been said, And to whom has the arm of the Lord been revealed? Isaiah 53:1 Psalm 77:55. And He cast forth from the face of them the nations. And  from the face of His faithful. For nations in a manner are the evil spirits of Gentile errors. And by lot He divided unto them the land in the cord of distribution. And in us all things one and the same Spirit does work, dividing severally to every one as He wills. 1 Corinthians 12:11", "lang": "", "orig": ""}, {"v": 1, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "14. Lead me, O Lord, in Your way, and I will walk in Your truth Psalm 85:11. Your way, Your truth, Your life, is Christ. Therefore belongs the Body to Him, and the Body is of Him. I am the Way, and the Truth, and the Life. John 14:6 Lead me, O Lord, in Your way. In what way? And I will walk in Your truth. It is one thing to lead to the way, another to guide in the way. Behold man everywhere poor, everywhere in need of help. Those who are beside the way are not Christians, or not yet Catholics: let them be guided to the way: but when they have been brought to the way and made Catholics in Christ, they must be guided by Him in the way itself, lest they fall. Now assuredly they walk in the way. Lead me, O Lord, in Your way: surely I am now in Your way, lead me there. And I will walk in Your truth: while You lead I shall not err: if Thou let me go, I shall err. Pray then that He let you not go, but lead you even to the end. How does He lead you? By always admonishing, always giving you His hand. And the arm of the Lord, to whom is it revealed? Isaiah 53:1 For in giving His Christ He gives His hand: in giving His hand, He gives His Christ. He leads to the way, in leading to His Christ: He leads in the way, by leading in His Christ, and Christ is truth. Lead me, therefore, O Lord, in Your way, and I will walk in Your truth: in Him verily who said, I am the Way, and the Truth, and the Life. John 14:6 For Thou who leadest in the way and the truth, whither leadest Thou, but unto life?", "lang": "", "orig": ""}, {"v": 1, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "12. Make Your right hand so well known Psalm 89:12. This is the reading of most of the Greek copies: not of some in Latin, which is thus, Make Your right hand well known to me. What is, Your right hand, but Your Christ, of whom it is said, And to whom is the Arm of the Lord revealed? Isaiah 53:1 Make Him so well known, that Your faithful may learn in Him to ask and to hope for those things rather of You as rewards of their faith, which do not appear in the Old Testament, but are revealed in the New: that they may not imagine that the happiness derived from earthly and temporal blessings is to be highly esteemed, desired, or loved, and thus their feet slip,  when they see it in men who honour You not: that their steps may not give way, while they know not how to number Your anger. Finally, in accordance with this prayer of the Man that is His,  He has made His Christ so well known as to show by His sufferings that not these rewards which seem so highly prized in the Old Testament, where they are shadows of things to come, but things eternal, are to be desired. The right hand of God may also be understood in this sense, as that by which He will separate His saints from the wicked: because that hand becomes well known, when it scourges every son whom He receives, and suffers him not, in greater anger, to prosper in his sins, but in His mercy scourges him with the left,  that He may place him purified on His right hand.", "lang": "", "orig": ""}, {"v": 1, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "1. O sing unto the Lord a new song Psalm 97:1. The new man knows this, the old man knows it not. The old man is the old life, and the new man the new life: the old life is derived from Adam, the new life is formed in Christ. But in this Psalm, the whole world is enjoined to sing a new song. More openly elsewhere the words are these: O sing unto the Lord a new song; sing unto the Lord, all the whole earth;  that they who cut themselves off from the communion of the whole earth,  may understand that they cannot sing the new song, because it is sung in the whole, and not in a part of it. Attend here also, and see that this is said. And when the whole earth is enjoined to sing a new song, it is meant, that peace sings a new song. For He has done marvelous things. What marvelous things? Behold, the Gospel was just now being read, and we heard the marvellous things of the Lord. The only son of his mother, who was a widow, was being carried out dead: the Lord, in compassion, made them stand still; they laid him down, and the Lord said, Young man, I say unto you, Arise. Luke 7:12-14 ...The Lord has done marvellous things. What marvellous things? Hear: His own right hand, and His holy arm, has healed for Him. What is the Lord's holy Arm? Our Lord Jesus Christ. Hear Isaiah: Who has believed our report, and to whom is the arm of the Lord revealed? Isaiah 53:1 His holy arm then, and His own right hand, is Himself.", "lang": "", "orig": ""}, {"v": 1, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "40. When you open Your hand, they shall all be filled with good Psalm 103:28. What is it, O Lord, that You open Your hand? Christ is Your hand. To whom is the arm of the Lord revealed? Isaiah 53:1 To whom it is revealed, unto him it is opened: for revelation is opening. When You open Your hand, they shall all be filled with good. When Thou revealest Your Christ, they shall all be filled with good. But they have not good from themselves; this is oftentimes proved unto them. When Thou hidest Your face, they are troubled Psalm 103:29. Many filled with good have attributed to themselves what they had, and have wished to boast as in their own righteousnesses, and have said to themselves, I am righteous; I am great: and have become self-complacent. Unto these the Apostle speaks: What have you, that you did not receive? 1 Corinthians 4:7 But God, wishing to prove unto man that whatever he has he has from Him, so that with good he may gain humility also, sometimes troubles him; He turns away His face from him, and he falls into temptation; and He shows him that his righteousness, and his walking aright, was only under His government....", "lang": "", "orig": ""}, {"v": 1, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "26. And let them know how that this is Your Hand, and that You, Lord, have made it Psalm 108:26. He said, Let them know, of those for whom He even prayed while they were raging; for even those who afterwards believed in Him were among the crowd who shook their heads in mockery of Him. But let those who ascribe unto God the shape of the human body, learn in what sense God has a hand. Let us therefore understand, that the Hand of God means Christ: whence it is elsewhere said, Unto whom is the arm of the Lord revealed? Isaiah 53:1 ...", "lang": "", "orig": ""}, {"v": 1, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "9. Who brought out Israel from the midst of them Psalm 135:11. He brought out also His saints and faithful ones from the midst of the wicked. With a mighty Hand and stretched-out Arm Psalm 135:12. What more powerful, what more out-stretched, than that of which is said To whom is the Arm of the Lord revealed? Isaiah 53:1 Who divided the Red Sea in two parts Psalm 135:13. He divided also in such wise, that the same baptism should be to some unto life, to others unto death. And brought out Israel through the midst of it Psalm 135:14. So too He brings out His renewed people through the laver of regeneration. And overthrew Pharaoh and his power in the Red Sea Psalm 135:15. He quickly destroys both the sin of His people and the guilt thereof by baptism. Who led His people through the wilderness Psalm 135:16. Us too He leads through the drought and barrenness of this world, that we perish not therein. Who smote great kings Psalm 135:17, and slew famous kings Psalm 135:18. From us too He smites and slays the deadly powers of the devil. Sehon king of the Amorites Psalm 135:19, an useless shoot, or fiery temptation, for so is Sehon interpreted: the king of them who cause bitterness, for such is the meaning of Amorites. And Og, the king of Basan Psalm 135:20. The heaper-together, such is the meaning of Og, and, king of confusion, which Basan signifies. For what else does the devil heap together but confusion?", "lang": "", "orig": ""}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "Are we correct in understanding God’s right hand to be the one of whom Isaiah says, “And the arm of the Lord, to whom has it been revealed”? That, you see, is the only Son, whom the Father did not spare “but handed him over for us all.” And thus he stretched out his right hand on the cross, and the earth devoured the godless, when they thought of themselves as victorious and of him as despicable in defeat.", "lang": "english", "orig": ""}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "If we should understand “hand” as power, the power of the Father and the Son is one; but if we should understand “hand” as it was said through the prophet, “And to whom has the arm of the Lord been revealed?” the hand of the Father is the Son himself.", "lang": "english", "orig": ""}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "For just as it is your arm through which you work, so his Word was called the arm of God, because through the Word he constructed the world. For why does a person, in order to construct something, stretch out his arm except to directly execute his will?", "lang": "english", "orig": ""}, {"v": 1, "f": "Augustine of Hippo", "w": "", "t": "Look and see that he alone is Father and his arm is the Son, and there are not two but one, a person and his arm. Not understanding or noticing how the words of one thing are transferred to other things on account of some similarity in everyday speech concerning visible and well-known things, how much more when ineffable things are spoken in some way, which are said in such a way to be impossible [in another way]? For a person calls another person “his arm” through whom he does whatever he does. And if he is taken away, he mourns and says, “I have lost my arm.” And to the one who took him away, he says, “You have taken my arm away.” We can thus understand how it can be said that the Son is the arm of the Father through which the Father works all things. Failing to understand this, we remain in the shadows of error, just like those of whom it was said, “To whom has the arm of the Lord been revealed?”", "lang": "english", "orig": ""}, {"v": 1, "f": "Caesarius of Arles", "w": "", "t": "God truly put his arm around the prodigal son when he clothed his Son in human flesh. Then he exclaimed and said to all, “Take my yoke on you.” Whoever accepts the yoke of Christ is embraced as with the arm of a father and is known to be reconciled with God.", "lang": "english", "orig": ""}, {"v": 1, "f": "Clement of Rome", "w": "", "t": "For Christ is of those who are humble-minded, and not of those who exalt themselves over His flock. Our Lord Jesus Christ, the Sceptre of the majesty of God, did not come in the pomp of pride or arrogance, although He might have done so, but in a lowly condition, as the Holy Spirit had declared regarding Him. For He says, \"Lord, who has believed our report, and to whom is the arm of the Lord revealed? We have declared [our message] in His presence: He is, as it were, a child, and like a root in thirsty ground; He has no form nor glory, yea, we saw Him, and He had no form nor comeliness; but His form was without eminence, yea, deficient in comparison with the [ordinary] form of men. He is a man exposed to stripes and suffering, and acquainted with the endurance of grief: for His countenance was turned away; He was despised, and not esteemed. He bears our iniquities, and is in sorrow for our sakes; yet we supposed that [on His own account] He was exposed to labour, and stripes, and affliction. But He was wounded for our transgressions, and bruised for our iniquities. The chastisement of our peace was upon Him, and by His stripes we were healed. All we, like sheep, have gone astray; [every] man has wandered in his own way; and the Lord has delivered Him up for our sins, while He in the midst of His sufferings opens not His mouth. He was brought as a sheep to the slaughter, and as a lamb before her shearer is dumb, so He opens not His mouth. In His humiliation His judgment was ta", "lang": "english", "orig": ""}, {"v": 1, "f": "Irenaeus", "w": "CHAPTER VI.—THE EXCELLENCE AND UTILITY OF FAITH.", "t": "hment to be impending over the transgressor,\n1366 Isa. liii. 1.\n1367 Rom. x. 17, 14, 15.\n1368 Loadstone. [Philosophy of the second centure. See note in Migne.]\n\n\nand salvation to be the portion of him who lives according to the commandments, he will\nnot reform.", "lang": "greek", "orig": ""}, {"v": 1, "f": "Irenaeus", "w": "CHAPTER VI.—THE EXCELLENCE AND UTILITY OF FAITH.", "t": "“Lord, who hath believed our report?”1366 Isaiah says. For “faith cometh by hearing,\nand hearing by the word of God,” saith the apostle. “How then shall they call on Him in\nwhom they have not believed? And how shall they believe on Him whom they have not\nheard? And how shall they hear without a preacher? And how shall they preach except they\nbe sent? As it is written, How beautiful are the feet of those that publish glad tidings of good\nthings.”1367 You see how he brings faith by hearing, and the preaching of the apostles, up\nto the word of the Lord, and to the Son of God. We do not yet understand the word of the\nLord to be demonstration.", "lang": "greek", "orig": ""}, {"v": 1, "f": "Jerome", "w": "", "t": "May your right hand with which you fashioned the world bring light to the world. “To whom has the arm of the Lord been revealed?” May your right hand with which you formed humanity take on a human body and save human persons.", "lang": "english", "orig": ""}, {"v": 1, "f": "Jerome", "w": "", "t": "(Chapter 53, verses 1 and following) Who has believed our report? And to whom has the arm of the Lord been revealed? For he shall grow up before him as a tender plant, and as a root out of dry ground: he has no form or comeliness; and when we see him, there is no beauty that we should desire him. He is despised and rejected by men, a man of sorrows and acquainted with grief; and we hid, as it were, our faces from him; he was despised, and we did not esteem him. Surely he has borne our infirmities and carried our sorrows; yet we considered him stricken, smitten by God, and afflicted. LXX: But he was wounded for our transgressions, crushed for our iniquities; upon him was the punishment that made us whole, and by his bruises we are healed. All we like sheep have gone astray; we have all turned to our own way, and the LORD has laid on him the iniquity of us all. A man in distress, and knowing how to bear infirmity, because his face is turned away, despised and not esteemed. He carries our sins, and grieves for us, and we have reckoned him to be in pain, and in affliction. After the words of the Father, by which he had announced to the world that his son would come; and before the scandal of the cross, about which he was going to say: His appearance will be inglorious, and his form unlike that of other men, he had foretold the glory of the resurrection: He will be exalted and lifted up, and will be greatly exalted: so that, by the humility of the cross, he might anticipate the gl", "lang": "english", "orig": ""}, {"v": 1, "f": "John", "w": "", "t": "Then Jesus said unto them, Yet a little while is the light with you. Walk while ye have the light, lest darkness come upon you: for he that walketh in darkness knoweth not whither he goeth.  While ye have light, believe in the light, that ye may be the children of light. These things spake Jesus, and departed, and did hide himself from them.  But though he had done so many miracles before them, yet they believed not on him:  That the saying of Esaias the prophet might be fulfilled, which he spake, Lord, who hath believed our report? and to whom hath the arm of the Lord been revealed? [Isaiah 53:1] Therefore they could not believe, because that Esaias said again,  He hath blinded their eyes, and hardened their heart; that they should not see with their eyes, nor understand with their heart, and be converted, and I should heal them.  These things said Esaias, when he saw his glory, and spake of him.  Nevertheless among the chief rulers also many believed on him; but because of the Pharisees they did not confess him, lest they should be put out of the synagogue:  For they loved the praise of men more than the praise of God.", "lang": "english", "orig": ""}, {"v": 1, "f": "Romans", "w": "", "t": "How then shall they call on him in whom they have not believed? and how shall they believe in him of whom they have not heard? and how shall they hear without a preacher?  And how shall they preach, except they be sent? as it is written, How beautiful are the feet of them that preach the gospel of peace, and bring glad tidings of good things!  But they have not all obeyed the gospel. For Esaias saith, Lord, who hath believed our report? [Isaiah 53:1] So then faith cometh by hearing, and hearing by the word of God.", "lang": "english", "orig": ""}, {"v": 1, "f": "Tertullian", "w": "", "t": "Now he would most certainly have said “your arm” if he had not wished us to understand that the Father is Lord and the Son also is Lord.", "lang": "english", "orig": ""}, {"v": 1, "f": "Thomas Aquinas", "w": "", "t": "Who has believed. Here he begins to set out the remedies against the aforesaid impediments.\n\nAnd first, against their sin, he promises the passion of Christ;\n\nsecond, against their lowering, he promises exaltation: give praise, O you barren (ch. 54);\n\nthird, against their poverty, he promises free enjoyment of goods: all you that thirst (ch. 55).\n\nConcerning the first, he does two things.\n\nFirst, he shows the height of the mystery, for the report of it is not easily believed: who has believed our report, of these things about Christ which we have heard from you: we have heard a rumor (Obad 1:1); O Lord, I have heard your hearing, and was afraid (Hab 3:2); nor is it easily seen: and to whom is the arm of the Lord, that is, the Son of God, the power of God, revealed: and have you an arm like God? (Job 40:4).\n\nNote on the words, to whom is the arm of the Lord revealed? (Isa 53:1), that Christ is an arm:\n\nfirst, for scourging demons: with the arm of your strength you have scattered your enemies (Ps 88:11[89:10]);\n\nsecond, for supporting the weak, above: he shall take up the lambs with his arm (Isa 40:11);\n\nthird, for defending the faithful: with his holy arm he will defend them (Wis 5:17).", "lang": "english", "orig": ""}, {"v": 1, "f": "Tyrannius Rufinus", "w": "", "t": "For it is incredible that God, the Son of God, should be spoken of and preached as having suffered these things. For this reason they are foretold by the prophets, lest any doubt should spring up in those who are about to believe.", "lang": "english", "orig": ""}, {"v": 1, "f": "npnf207", "w": "Lecture XIII.", "t": "Who hath believed our report? and to whom is the arm of the Lord revealed?…He is brought\nas a lamb to the slaughter, U+0026c.", "lang": "greek", "orig": ""}, {"v": 1, "f": "npnf210", "w": "CHAPTER XXII.", "t": "minister and a witness of the things wherein\n663 Isa. liii. 1.\n664 Isa. vi. 10.\n665 S. John xii. 36–41.\n666 S. John xiv. 9.\n667 1 Cor. xii. 3.\n668 Eph. v. 14.\n669 Acts ix. 8.\n\n\nthou hast seen Me, and of the things wherein thou shalt see Me.”670 For the prophets", "lang": "greek", "orig": ""}, {"v": 2, "f": "1 Clement", "w": "Chapter XIX.—Jesus Christ was not a mere man, begotten from Joseph in the\nordinary course of nature, but was very God, begotten of the Father most high,\nand very man, born of the Virgin.", "t": ".\n1025 See above, iii. 6.\n1026 Isa. vii. 14.\n1027 Isa. liii. 2.\n1028 Zech. ix. 9.\n1029 Ps. lxix. 21.\n1030 Isa. ix. 6.\n1031 Dan. vii. 13.\n1032 Isa. vii. 13.\n\n\nwith us,” and descend to those things which are of the earth beneath, seeking the sheep\nwhich had perish", "lang": "greek", "orig": ""}, {"v": 2, "f": "1 Clement", "w": "Chapter XXXII.—Trypho objecting that Christ is described as glorious by Daniel,\nJustin distinguishes two advents.", "t": "Then I replied to him, “If, sirs, it were not said by the Scriptures which I have already\nquoted, that His form was inglorious, and His generation not declared, and that for His\ndeath the rich would suffer death, and with His stripes we should be healed, and that He\nwould be led away like a sheep; and if I had not explained that there would be two advents\nof His,—one in which He was pierced by you; a second, when you shall know Him whom\nyou have pierced, and your tribes shall mourn, each tribe by itself, the women apart, and\nthe men apart,—then I must have been speaking dubious and obscure things. But now, by\nmeans of the contents of those Scriptures esteemed holy and prophetic amongst you, I attempt\nto prove all [that I have adduced], in the hope that some one of you may be found to be of\nthat remnant which has been left by the grace of the Lord of Sabaoth for the eternal salvation.\nIn order, therefore, that the matter inquired into may be plainer to you, I will mention to\nyou other words also spoken by the blessed David, from which you will perceive that the\nLord is called the Christ by the Holy Spirit of prophecy; and that the Lord, the Father of all,\nhas brought Him again from the earth, setting Him at His own right hand, until He makes\nHis enemies His footstool; which indeed happens from the time that our Lord Jesus Christ\nascended to heaven, after He rose again from the dead, the times now running on to their\nconsummation; and he whom Daniel foretells would have dominio", "lang": "greek", "orig": ""}, {"v": 2, "f": "Ambrose of Milan", "w": "", "t": "Therefore, Christ is both the great mountain and the small mountain: truly great because He is the great Lord and His power is great; small because it is written: You have made him a little lower than the angels. Wherefore also Isaiah says: We beheld Him, and He had no form nor comeliness. Nevertheless, He became less from great and greater from less. Less from great, because, when He was in the form of God, He emptied Himself and took the form of a servant; greater from less, because Daniel says: And the stone which was cut out of the mountain, became a great mountain and filled the whole earth.", "lang": "english", "orig": ""}, {"v": 2, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "14. And every man feared Psalm 63:9. They that feared not, were not even men. Every man feared; that is, every one using reason to perceive the things which were done. Whence they that feared not, must rather be called cattle, rather beasts savage and cruel. A lion ramping and roaring is that people as yet. But in truth every man feared: that is, they that would believe, that trembled at the judgment to come. And every man feared: and they declared the works of God....And every man has feared: and they have declared the works of God, and His doings they have perceived. What is, His doings they have perceived? Was it, O Lord Jesus Christ, that You were silent, and like a sheep for a victim wast being led, and did not open before the shearer Your mouth, Isaiah 53:7 and we thought You to be set in smiting and in grief, Isaiah 53:4 and knowing how to bear weakness? Isaiah 53:3 Was it that You were hiding Your beauty, O Thou beautiful in form before the sons of men?  Was it that You did not seem to have beauty nor grace? Isaiah 53:2 You bore on the Cross men reviling and saying, If Son of God He is, let Him come down from the Cross. Matthew 27:40 ...This thing they, that would have had Him come down from the Cross, perceived not: but when He rose again, and being glorified ascended into Heaven, they perceived the works of God.", "lang": "", "orig": ""}, {"v": 2, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "3. Save me, O God, for the waters have entered in even unto my soul Psalm 68:1. That grain is despised now, that seems to give forth humble words. In the garden it is buried, though the world will admire the greatness of the herb, of which herb the seed was despised by the Jews. For in very deed observe ye the seed of the mustard, minute, dull colored, altogether despicable, in order that therein may be fulfilled that which has been said, We have seen Him, and He had neither form nor comeliness. Isaiah 53:2 But He says, that waters have come in even unto His soul; because those multitudes, which under the name of waters He has pointed out, were able so far to prevail as to kill Christ....Whence then does He so cry out, as though He were suffering something against His will, except because the Head does prefigure the Members? For He suffered because He willed: but the Martyrs even though they willed not; for to Peter thus He foretold his passion: When you shall be old, He says, another shall gird you, and lead you whither you will not. John 21:18 For though we desire to cleave to Christ, yet we are unwilling to die: and therefore willingly or rather patiently we suffer, because no other passage is given us, through which we may cleave to Christ. For if we could in any other way arrive at Christ, that is, at life everlasting, who would be willing to die?", "lang": "", "orig": ""}, {"v": 2, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "17. For the Lord shall build up Sion Psalm 101:16. This work is going on now. O you living stones, run to the work of building, not to ruin. Sion is in building, beware of the ruined walls: the tower is building, the ark is in building; remember the deluge. This work is in progress now; but when Sion is built, what will happen? And He will appear in His glory. That He might build up Sion, that He might be a foundation in Sion, He was seen by Sion, but not in His glory: we have seen Him, and He had no form nor comeliness. Isaiah 53:2 But truly when He shall have come with His angels to judge, Matthew 25:31 shall they not look then upon Him whom they have pierced? Zechariah 12:10 and they shall be put to confusion when too late, who refused confusion in early and healthful repentance.", "lang": "", "orig": ""}, {"v": 2, "f": "Augustine - Trinity", "w": "Psalm LXIX.2896", "t": "904 Non est græcum nomen.\n2905 John xiii. 1.\n2906 Isa. liii. 2.\n\n\nthey willed not; for to Peter thus He foretold his passion: “When thou shalt be old,” He saith,\n“another shall gird thee, and lead thee whither thou wilt not.”2907 For though we desire to\ncleave t", "lang": "latin", "orig": ""}, {"v": 2, "f": "Clement of Alexandria", "w": "", "t": "And that the Lord Himself was uncomely in aspect, the Spirit testifies by Esaias: \"And we saw Him, and He had no form nor comeliness but His form was mean, inferior to men.\" Yet who was more admirable than the Lord? But it was not the beauty of the flesh visible to the eye, but the true beauty of both soul and body, which He exhibited, which in the former is beneficence; in the latter-that is, the flesh-immortality.", "lang": "english", "orig": ""}, {"v": 2, "f": "Cyril of Alexandria", "w": "", "t": "What therefore does the prophet say in these words?… For he confesses what we also have announced, that is, we have foretold unceasingly that he will come in due season. But perhaps someone shall say in response, “What then if God who is the Word should come down from heaven, covered in divine glory and resplendent in unapproachable light, and appear to those on earth as one who cannot be looked at because of his ineffable glory?” Indeed, when he visited the earth in the form of fire on Mount Sinai it was dark and gloomy, and storms and fire burst from on high along with smoke, and there were many other things that so completely terrified [the Israelites] that his appearance was unbearable to those who saw it. In fact, it was so unbearable that the Israelites called for a mediator, saying to Moses, “Speak to us, and do not let God speak lest we die.” So, as Isaiah says, it is no wonder that the one who shall appear should be hard to look at. Why then do the prophets say that unbelief is without excuse and rebellion is unjustifiable when there is no form or glory to his appearance? For he was not, it says, in a form or glory that befits the divine. For he emptied himself, taking on the likeness of humanity, and being found in the appearance of a man he humbled himself. And we say this not merely from hearing the reports, but we have gazed with our own eyes on the one proclaimed. For human things are in every way small, cheap and worthless compared with the divine, supreme, emi", "lang": "english", "orig": ""}, {"v": 2, "f": "Ephrem the Syrian", "w": "Commentary on Genesis", "t": "Risen is the Light of the kingdom, in Ephrata the city of the King. The blessing wherewith Jacob blessed, to its fulfilment came today! That tree likewise, [the tree] of life, brings hope to mortal men! Solomon's hidden proverb Proverbs 3:18 had today its explanation! Today was born the Child, and His name was called Wonder! Isaiah 9:6 For a wonder it is that God as a Babe should show Himself. By the word Worm did the Spirit foreshow Him in parable,  because His generation was without marriage. The type that the Holy Ghost figured today its meaning was [explained.] He came up as a root before Him, as a root of parched ground. Isaiah 53:2 Anything that covertly was said, openly today was done! The King that in Judah was hidden, Thamar stole Him from his thigh; today arose His conquering beauty, which in hidden estate she loved. Ruth at Boaz' side lay down, because the Medicine of Life hidden in him she perceived. Today was fulfilled her vow, since from her seed arose the Quickener of all. Travail Adam on the woman brought, that from him had come forth. She today her travail ransomed, who to her a Saviour bare! To Eve our mother a man gave birth, who himself had had no birth. How much more should Eve's daughter be believed to have borne a Child without a man! The virgin earth, she bare that Adam that was head over the earth! The Virgin bare today the Adam that was Head over the Heavens. The staff of Aaron, it budded, and the dry wood yielded fruit!", "lang": "", "orig": ""}, {"v": 2, "f": "Gregory of Nazianzus", "w": "", "t": "For he whom you now treat with contempt was once above you. He who is now man was once the uncompounded. What he was he continued to be; what he was not he took to himself. In the beginning he was uncaused; for what is the cause of God? But afterwards for a cause he was born. And that cause was that you might be saved, who insult him and despise his godhead, because of this, that he took on him your denser nature, having converse with flesh by means of mind. While his inferior nature, the humanity, became God, because it was united to God and became one person because the higher nature prevailed, [this happened] in order that I too might be made God so far as he is made man. He was born—but he had been begotten. He was born of a woman—but she was a virgin. The first is human, the second divine. In his human nature he had no father, but also in his divine nature [he had] no mother. Both these belong to godhead. He dwelled in the womb—but he was recognized by the prophet [John the Baptist], himself still in the womb, leaping before the Word, for whose sake he came into being. He was wrapped in swaddling clothes—but he took off the swathing bands of the grave by his rising again. He was laid in a manger—but he was glorified by angels, and proclaimed by a star and worshiped by the magi. Why are you offended by what is presented to your sight, because you will not look at what is presented to your mind? He was driven into exile into Egypt—but he drove away the Egyptian idols. He h", "lang": "english", "orig": ""}, {"v": 2, "f": "Irenaeus", "w": "CHAPTER V.—HE PROVES BY SEVERAL EXAMPLES THAT THE GREEKS DREW FROM THE SACRED\nWRITERS.", "t": "And again, that the wise man is beautiful, the Athenian stranger asserts, in the same\nway as if one were to affirm that certain persons were just, even should they happen to be\nugly in their persons. And in speaking thus with respect to eminent rectitude of character,\nno one who should assert them to be on this account beautiful would be thought to speak\nextravagantly. And “His appearance was inferior to all the Sons of men,”1360 prophecy\npredicted.", "lang": "greek", "orig": ""}, {"v": 2, "f": "Irenaeus", "w": "CHAPTER I.—ON THE TRUE BEAUTY.", "t": "And that the Lord Himself was uncomely in aspect, the Spirit testifies by Esaias: “And\nwe saw Him, and He had no form nor comeliness but His form was mean, inferior to\nmen.”733 Yet who was more admirable than the Lord? But it was not the beauty of the flesh\nvisible to the eye, but the true beauty of both soul and body, which He exhibited, which in\nthe former is beneficence; in the latter—that is, the flesh—immortality.", "lang": "greek", "orig": ""}, {"v": 2, "f": "Irenaeus", "w": "", "t": "I have shown from the Scriptures that no one of the children of Adam is as to everything, and absolutely, called God, or named Lord. But that he is himself in his own right, beyond all people who ever lived, God, and Lord, and King eternal and the incarnate Word, proclaimed by all the prophets, the apostles and the Spirit himself, may be seen by all who have attained to even a small portion of the truth. Now, the Scriptures would not have testified these things of him if, like others, he had been a mere man. But that he had, beyond all others, in himself that preeminent birth that is from the most high Father and also experienced that preeminent generation that is from the Virgin, the divine Scriptures do in both respects testify of him: also, that he was a man without comeliness and liable to suffering; that he sat on the foal of a donkey; that he was despised among the people and humbled himself even to death; and that he is the holy Lord, the wonderful, the counselor, the beautiful in appearance and the mighty God, coming on the clouds as the judge of all people17—all these things did the Scripture prophesy of him.", "lang": "english", "orig": ""}, {"v": 2, "f": "Isaac of Nineveh", "w": "", "t": "Therefore, beloved, have in your mind God’s providence (which from the beginning until now is dispensed with foreknowledge) as some excellent medicine for weakened eyes, and keep its recollection with you at all times. Ponder, consider, and be taught by these things, that you may learn to hold the remembrance of the greatness of God’s honour in your soul, and thus find life eternal for your soul in Jesus Christ our Lord, Who is become “the Mediator between God and men,” as being the Uniter in His two natures. The orders of the angels cannot approach the glory that surrounds the throne of His majesty, yet He has appeared in the world for our sake in a mean and humble form, as [Isaiah] said: “We beheld Him, that He had no form nor beauty.” It is He that, being invisible to all created nature, put on a body and fulfilled the economy for the salvation and life of all the nations that were cleansed by Him, and to Him be glory and dominion unto the ages of ages. Amen.", "lang": "english", "orig": ""}, {"v": 2, "f": "Ishodad of Merv", "w": "", "t": "“For he grew up before him like a child,” like a child dear to his Father, he says, because he will be dear to God. But “like a root out of the ground,” which is deprived of water, he will also be deprived of life at the moment of the passion. In fact, God wanted these evil things to befall him. Others have seen these words as referring to the apostles who, like candid and young children, believed in him and did not refrain from knowing him, as the scribes and the Pharisees did. According to Qatraya, this points to the fact that Simeon had already blessed him in the temple before God when he was yet an unborn child. Or this: The Son offered our nature before God, like a child, and made it pleasing before God.", "lang": "english", "orig": ""}, {"v": 2, "f": "John Chrysostom", "w": "", "t": "For not by any means in working wonders only was he wonderful, but even when merely showing himself, he was full of great grace. To declare this, the prophet said, “Fair in beauty beyond the children of humankind.” When Isaiah says, “He had no form nor comeliness,” he is comparing the [embodied Son] with the glory of his godhead, which surpasses all utterance and description. Or he is speaking of what took place at his passion, the dishonor that he underwent at the season of the cross and the mean estate that throughout his life he exemplified in all respects.", "lang": "english", "orig": ""}, {"v": 2, "f": "Origen of Alexandria", "w": "", "t": "There are, indeed, admitted to be recorded some statements respecting the body of Jesus having been “ill-favored”; not, however, “ignoble,” as has been stated, nor is there any certain evidence that he was “little.”", "lang": "english", "orig": ""}, {"v": 2, "f": "Tertullian", "w": "Chapter XVII.—Prophecies in Isaiah and the Psalms Respecting Christ’s Humiliation.", "t": "Let us compare with Scripture the rest of His dispensation. Whatever that poor despised\nbody3326 may be, because it was an object of touch3327 and sight,3328 it shall be my Christ,\nbe He inglorious, be He ignoble, be He dishonoured; for such was it announced that He\nshould be, both in bodily condition and aspect. Isaiah comes to our help again: “We have\nannounced (His way) before Him,” says he; “He is like a servant,3329 like a root in a dry\nground; He hath no form nor comeliness; we saw Him, and He had neither form nor beauty;\nbut His form was despised, marred above all men.”3330 Similarly the Father addressed the\nSon just before: “Inasmuch as many will be astonished at Thee, so also will Thy beauty be\nwithout glory from men.”3331 For although, in David’s words, He is fairer than the children\nof men,”3332 yet it is in that figurative state of spiritual grace, when He is girded with the\nsword of the Spirit, which is verily His form, and beauty, and glory. According to the same\nprophet, however, He is in bodily condition “a very worm, and no man; a reproach of men,\nand an outcast of the people.”3333 But no internal quality of such a kind does He announce\nas belonging to Him. In Him dwelt the fulness of the Spirit; therefore I acknowledge Him\nto be “the rod of the stem of Jesse.” His blooming flower shall be my Christ, upon whom\nhath rested, according to Isaiah, “the spirit of wisdom and understanding, the spirit of\ncounsel and might, the spirit of knowledge and of piety, and o", "lang": "latin", "orig": ""}, {"v": 2, "f": "Thomas Aquinas", "w": "", "t": "Second, he describes the order of the deed.\n\nAnd first, he sets out a similitude as to his exaltation: and he shall rise up, in being born from the womb of his mother, in rising from the dead, in ascending from the earth into heaven, and into the faith of the gentiles; as a tender plant, which increases in height and is multiplied in width, above: and there shall come forth a rod out of the root of Jesse, and a flower shall rise up out of his root (Isa 11:1). And as to his humanity: and as a root out of a thirsty ground, that is, out of ground without moisture, which seems unbecoming because of its dryness; thus he also arose from his mother without the moisture of man: I am the root and stock of David (Rev 22:16).\n\nSecond, he sets out the explanation of the similitude: there is no;\n\nand first, as to his humiliation;\n\nsecond, as to his exaltation: he was taken away from distress (Isa 53:8).\n\nConcerning the first, he does two things:\n\nfirst, he describes the humility of Christ;\n\nsecond, his meekness in humiliation: he was offered (Isa 53:7).\n\nConcerning the first, he does three things:\n\nfirst, he describes the office of his humility;\n\nsecond, the contempt of him in humiliation: and his look was as it were hidden (Isa 53:3);\n\nthird, the fruit of his humiliation: but he was wounded (Isa 53:5).\n\nConcerning the first, he does two things.\n\nFirst, his humility is shown as to the hiding of his majesty: there is no form in him, as to abundance of interior goods; nor comeliness, as to ", "lang": "english", "orig": ""}, {"v": 3, "f": "Athanasius of Alexandria", "w": "", "t": "Nor is even his death passed over in silence: on the contrary, it is referred to in the divine Scriptures, even exceedingly clearly.… He suffers it not for his own sake but for the immortality and salvation of all, and the counsels of the Jews against him and the indignities offered him at their hands.… O marvel at the loving-kindness of the Word, that for our sakes he is dishonored, that we may be brought to honor.", "lang": "english", "orig": ""}, {"v": 3, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "14. And every man feared Psalm 63:9. They that feared not, were not even men. Every man feared; that is, every one using reason to perceive the things which were done. Whence they that feared not, must rather be called cattle, rather beasts savage and cruel. A lion ramping and roaring is that people as yet. But in truth every man feared: that is, they that would believe, that trembled at the judgment to come. And every man feared: and they declared the works of God....And every man has feared: and they have declared the works of God, and His doings they have perceived. What is, His doings they have perceived? Was it, O Lord Jesus Christ, that You were silent, and like a sheep for a victim wast being led, and did not open before the shearer Your mouth, Isaiah 53:7 and we thought You to be set in smiting and in grief, Isaiah 53:4 and knowing how to bear weakness? Isaiah 53:3 Was it that You were hiding Your beauty, O Thou beautiful in form before the sons of men?  Was it that You did not seem to have beauty nor grace? Isaiah 53:2 You bore on the Cross men reviling and saying, If Son of God He is, let Him come down from the Cross. Matthew 27:40 ...This thing they, that would have had Him come down from the Cross, perceived not: but when He rose again, and being glorified ascended into Heaven, they perceived the works of God.", "lang": "", "orig": ""}, {"v": 3, "f": "Augustine of Hippo", "w": "", "t": "Christ’s deformity is what gives form to you. If he had been unwilling to be deformed, you would never have got back the form you lost. So he hung on the cross, deformed; but his deformity was our beauty.", "lang": "english", "orig": ""}, {"v": 3, "f": "Cyril of Alexandria", "w": "", "t": "One of the holy Evangelists said that when our Lord’s time of suffering drew near, he began to weep and grew sad. Yet by nature he was the only-begotten Word of the Father, being immune from sufferings and grief and the like. Nevertheless, he accommodated himself to our nature and showed himself empty of all [his divine qualities] in the face of the anxiety of the threatening onslaught of his trials. Through all these trials he declared himself to be similar to us, so that he emerges not (as some are fond of saying) as a shadow or specter seen on the earth but as a real human being.", "lang": "english", "orig": ""}, {"v": 3, "f": "Irenaeus", "w": "CHAPTER V.—HE PROVES BY SEVERAL EXAMPLES THAT THE GREEKS DREW FROM THE SACRED\nWRITERS.", "t": "1358 Matt. xi. 28–30.\n1359 John viii. 32–36.\n1360 Isa. liii. 3. [That is after he became the Man of Sorrows; not originally.]\n\n\nlaws, have an eye to the greatest virtue. Such is fidelity,”1361 which we need at all times, both\nin peace and in war, and in all the", "lang": "greek", "orig": ""}, {"v": 3, "f": "Thomas Aquinas", "w": "", "t": "Second, his humility is shown as to the exposing of his infirmity: that we should be desirous of him, expecting with desire that he should come as a great redeemer: behold the desired of all nations shall come (Hag 2:8). Both great in dignity, against which, we saw him despised, inglorious, and the most abject of men, because he suffered the most shameful kind of death: let us condemn him to a most shameful death (Wis 2:20); I am the most foolish of men (Prov 30:20). And great in prosperity, against which, we found him a man of sorrows, as though poor and full of sorrows: O all you that pass by the way, attend, and see if there be any sorrow like to my sorrow (Lam 1:12). Great also in power, against which, we found him acquainted with infirmity, through experience: for although he was crucified through weakness, yet he lives by the power of God (2 Cor 15:4).\n\nAnd his look was as it were hidden. Here he shows the contempt of him in his humiliation.\n\nAnd first, as to his majesty hidden in the removal of honor: as it were hidden, his majesty hidden under the infirmity of flesh; whereupon we esteemed him not, not devoting to him the honor that was due him, above: verily you are a hidden God (Isa 45:15).\n\nNote on the words, the most abject of men (Isa 53:3), that Christ was the most abject:\n\nfirst, because of the bitterness of his sorrow: O all you that pass by the way, attend, and see if there be any sorrow like to my sorrow (Lam 1:12);\n\nsecond, because of the shamefulness of his", "lang": "english", "orig": ""}, {"v": 4, "f": "Apostolic Constitutions", "w": "", "t": "[To bishops.] For as yours is the burden, so you receive as your fruit the supply of food and other necessities. For you imitate Christ the Lord; and as he “bore the sins of us all on the tree” at his crucifixion, the innocent for those who deserved punishment, so also you ought to bear the sins of the people your own. For concerning our Savior it is said in Isaiah, “He bears our sins and is afflicted for us.” … For do not you imagine that the office of a bishop is an easy or light burden.", "lang": "english", "orig": ""}, {"v": 4, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "14. And every man feared Psalm 63:9. They that feared not, were not even men. Every man feared; that is, every one using reason to perceive the things which were done. Whence they that feared not, must rather be called cattle, rather beasts savage and cruel. A lion ramping and roaring is that people as yet. But in truth every man feared: that is, they that would believe, that trembled at the judgment to come. And every man feared: and they declared the works of God....And every man has feared: and they have declared the works of God, and His doings they have perceived. What is, His doings they have perceived? Was it, O Lord Jesus Christ, that You were silent, and like a sheep for a victim wast being led, and did not open before the shearer Your mouth, Isaiah 53:7 and we thought You to be set in smiting and in grief, Isaiah 53:4 and knowing how to bear weakness? Isaiah 53:3 Was it that You were hiding Your beauty, O Thou beautiful in form before the sons of men?  Was it that You did not seem to have beauty nor grace? Isaiah 53:2 You bore on the Cross men reviling and saying, If Son of God He is, let Him come down from the Cross. Matthew 27:40 ...This thing they, that would have had Him come down from the Cross, perceived not: but when He rose again, and being glorified ascended into Heaven, they perceived the works of God.", "lang": "", "orig": ""}, {"v": 4, "f": "Augustine", "w": "Enarrationes in Psalmos", "t": "3. For my soul is filled with evils, and my life draws near unto hell Psalm 87:3. Dare we speak of the Soul of Christ as filled with evils, when the passion had strength as far as it had any, only over the body?...The soul therefore may feel pain without the body: but without the soul the body cannot. Why therefore should we not say that the Soul of Christ was full of the evils of humanity, though not of human sins? Another Prophet says of Him, that He grieved for us: Isaiah 53:4 and the Evangelist says, And He took with Him Peter and the two sons of Zebedee, and began to be sorrowful and very heavy: and our Lord Himself says unto them of Himself, My soul is exceeding sorrowful, even unto death. Matthew 26:37-38 The Prophet who composed this Psalm, foreseeing that this would happen, introduces Him saying, My soul is full of evils, and My life draws near unto hell. For the very same sense is here expressed in other words, as when He said, My soul is sorrowful, even unto death. The words, My soul is sorrowful, are like these, My soul is full of evils: and what follows, even unto death, like, my life draws near unto hell.", "lang": "", "orig": ""}, {"v": 4, "f": "Augustine of Hippo", "w": "", "t": "“But not what I will, but what you will, Father,” It is not as if the Father’s will was one thing and the Son’s another. [Christ is referring to] the utterance of our weaknesses, however faithful, which our Head transformed into himself, when also he bore our sins.", "lang": "english", "orig": ""}, {"v": 4, "f": "Eusebius of Caesarea", "w": "", "t": "We did not reckon him to be much or wonder who he was then. He was, however, the Savior of our souls, the healer and purifier of all sin. Therefore it continues, “He bore our sins … though we reckoned him struck down by God and humiliated,” as Aquila has it.… We like babes had this opinion of him while he suffered these things for us, so as to save us from all disgrace … he was wounded and became a curse for us … he became a peace offering … who was through all his life a sin offering in word and deed.", "lang": "english", "orig": ""}, {"v": 4, "f": "Gregory Thaumaturgus", "w": "Topic XI.", "t": "How could one say that the body of the Lord (Christ) is void of soul and understanding?\nFor perturbation, and grief, and distress, are not the properties either of a flesh void of soul,\nor of a soul void of understanding; nor are they the sign of the immutable Divinity, nor the\nindex of a mere phantasm, nor do they mark the defect of human weakness; but the Word\nexhibited in Himself the exercise of the affections and susceptibilities proper to us, having\nendued Himself with our passibility, even as it is written, that “He hath borne our griefs,\nand carried our sorrows.”420 For perturbation, and grief, and distress, are disorders of soul;\nand toil, and sleep, and the body’s liability to wounding, are infirmities of the flesh.", "lang": "greek", "orig": ""}, {"v": 4, "f": "Gregory of Nazianzus", "w": "", "t": "“He was made flesh” seems to be equivalent to that in which it is said that he was made sin or a curse for us, not that the Lord was transmuted into either of these—for how could he? But because by taking them on him he “took away our iniquities and bore our infirmities.”", "lang": "english", "orig": ""}, {"v": 4, "f": "Gregory of Neocaesarea", "w": "", "t": "Therefore, when it is said that he was “troubled in spirit,” that “he was sorrowful in soul,” that “he was wounded in body,” he places before us designations of susceptibilities proper to our constitution, in order to show that he was made man in the world and had his conversation with [people], yet without sin.", "lang": "english", "orig": ""}, {"v": 4, "f": "Gregory of Neocaesarea", "w": "", "t": "How could one say that the body of the Lord [Christ] is void of soul and understanding? For perturbation and grief and distress are not the properties either of a flesh void of a soul or of a soul void of understanding; nor are they the sign of the nature of immutable divinity or the index of a mere phantasm; nor do they mark the defect of human moral weakness. But the Word exhibited in himself the exercise of the affections and susceptibilities proper to us, having endued himself with our passibility, even as it is written, that “he has borne our griefs and carried our sorrows.” For perturbation and grief and distress are disorders of soul; and toil, and sleep and the body’s liability to wounding are infirmities of the flesh.", "lang": "english", "orig": ""}, {"v": 4, "f": "Jerome", "w": "", "t": "Let him be understood now not as the Word of God and wisdom but as servant and boy.… And here there will be the greater miracle that his appearance will be inglorious among people, not in that it means a foulness of form but that he came in lowliness and poverty.… “He will wash many nations,” cleansing them with his blood and consecrating for service in the baptism of God.…He did not have beauty or glory. His form was base and lacking before [humanity], or as the Hebrew has it, despised and least among people.… How then can it be said in the psalms, “Gird your side with your sword, O most powerful, with your beauty and fairness”? This puzzle can be easily solved. He was despised and base when he hung on the cross and was made for us a curse and carried out sins and said to the Father, “God, my God, why have you forsaken me?” But he was glorious and fair in appearance when, at his passion, the earth trembled, rocks were split and the elements were terrified at the sun’s fleeing and the eternal night.", "lang": "english", "orig": ""}, {"v": 4, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Now then, let us too follow Him; for we also have many diseases of our soul, and these especially He would fain heal. Since with this intent He corrects that other sort, that He may banish these out of our soul.", "lang": "", "orig": ""}, {"v": 4, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For that our bodily ills are caused by the wickedness of the soul, is shown both by him that had the palsy thirty and eight years, and by him that was let down through the roof, and by Cain also before these; and from many other things likewise one may perceive this. Let us do away then with the well-spring of our evils, and all the channels of our diseases will be stayed. For the disease is not palsy only, but also our sin; and this more than that, by how much a soul is better than a body.", "lang": "", "orig": ""}, {"v": 4, "f": "Matthew", "w": "", "t": "And when Jesus was come into Peter's house, he saw his wife's mother laid, and sick of a fever.  And he touched her hand, and the fever left her: and she arose, and ministered unto them.  When the even was come, they brought unto him many that were possessed with devils: and he cast out the spirits with his word, and healed all that were sick:  That it might be fulfilled which was spoken by Esaias the prophet, saying, Himself took our infirmities, and bare our sicknesses. [Isaiah 53:4]", "lang": "english", "orig": ""}, {"v": 4, "f": "Tertullian", "w": "Chapter VIII.—Other Proofs from the Same Chapter, that Jesus, Who Preached at\nNazareth, and Was Acknowledged by Certain Demons as Christ the Son of God,\nWas the Creator’s Christ. As Occasion Offers, the Docetic Errors of Marcion are\nExposed.", "t": "“Tangere enim et tangi, nisi corpus, nulla potest res,”3689\nis even a sentence worthy of a place in the world’s wisdom. In short, He did himself\ntouch others, upon whom He laid His hands, which were capable of being felt, and conferred\nthe blessings of healing,3690 which were not less true, not less unimaginary, than were the\nhands wherewith He bestowed them. He was therefore the very Christ of Isaiah, the healer\nof our sicknesses.3691 “Surely,” says he, “He hath borne our griefs and carried our sorrows.”\nNow the Greeks are accustomed to use for carry a word which also signifies to take away.\nA general promise is enough for me in passing.3692 Whatever were the cures which Jesus\neffected, He is mine. We will come, however, to the kinds of cures. To liberate men, then,\nfrom evil spirits, is a cure of sickness. Accordingly, wicked spirits (just in the manner of\nour former example) used to go forth with a testimony, exclaiming, “Thou art the Son of\nGod,”3693—of what God, is clear enough from the case itself. But they were rebuked, and\nordered not to speak; precisely because3694 Christ willed Himself to be proclaimed by men,\nnot by unclean spirits, as the Son of God—even that Christ alone to whom this was befitting,\nbecause He had sent beforehand men through whom He might become known, and who\nwere assuredly worthier preachers. It was natural to Him3695 to refuse the proclamation of\nan unclean spirit, at whose command there was an abundance of saints. He, however,3696\nwho had neve", "lang": "latin", "orig": ""}, {"v": 4, "f": "Tertullian", "w": "", "t": "Now the Greeks are accustomed to use for “carry” a word that also signifies “to take away.” … Whatever were the cures that Jesus effected, he is mine.", "lang": "english", "orig": ""}, {"v": 4, "f": "Theodoret of Cyrus", "w": "", "t": "And next he teaches the forms of dishonor and shame, “A man being in sorrow.” He points out the nature that received the suffering, for his body was nailed to the cross, but his divinity made the passion its own. “And he was familiar with sickness.” This was said about his humanity. For to be courageous and philosophical touches not divine but human nature. “For his face was turned away. It was not valued or appreciated.” The three translators render it this way, “And like a hiding of the face from him, he was made nothing and not appreciated.” That is, he hid the divine energy and chose suffering and did not seek vengeance on others. For as he was on the cross he said, “Father, forgive them, for they do not know what they are doing.” This teaches us the reasons for the passion: “He bore our sicknesses and suffered for us.” Symmachus translated, “Indeed, he personally has taken on our sicknesses and endured our pains.” We deserved death for those sins we had committed, and having received this penalty, he received death on our behalf.", "lang": "english", "orig": ""}, {"v": 4, "f": "Thomas Aquinas", "w": "", "t": "Second, as to his exposed infirmity, he sets out the sign of his infirmity: truly, as true man, he has borne, suffered, our infirmities, infirmities, such as hunger and thirst, and carried our sorrows, of sense, in suffering and sadness; or, our infirmities, our sins, he has taken from us; or in our place, he has suffered punishments: he bore our sins in his body upon the tree (1 Pet 2:24). And he sets out the contempt: and we have thought him as it were a leper, unclean and a sinner, and therefore, struck by God, for his sins, as to the punishments he suffered, and afflicted, as to the ignominies he endured: for your manifold wickedness and your infinite iniquities (Job 22:5); they abhor me (Job 30:10).", "lang": "english", "orig": ""}, {"v": 5, "f": "1 Clement", "w": "Chapter V.—The new covenant, founded on the sufferings of Christ, tends to\nour salvation, but to the Jews’ destruction.", "t": "For to this end the Lord endured to deliver up His flesh to corruption, that we might\nbe sanctified through the remission of sins, which is effected by His blood of sprinkling. For\nit is written concerning Him, partly with reference to Israel, and partly to us; and [the\nScripture] saith thus: “He was wounded for our transgressions, and bruised for our\niniquities: with His stripes we are healed. He was brought as a sheep to the slaughter, and\nas a lamb which is dumb before its shearer.”44 Therefore we ought to be deeply grateful to\nthe Lord, because He has both made known to us things that are past, and hath given us\nwisdom concerning things present, and hath not left us without understanding in regard\nto things which are to come. Now, the Scripture saith, “Not unjustly are nets spread out for\nbirds.”45 This means that the man perishes justly, who, having a knowledge of the way of\nrighteousness, rushes off into the way of darkness. And further, my brethren: if the Lord\nendured to suffer for our soul, He being Lord of all the world, to whom God said at the\nfoundation of the world, “Let us make man after our image, and after our likeness,”46 understand\nhow it was that He endured to suffer at the hand of men. The prophets, having\nobtained grace from Him, prophesied concerning Him. And He (since it behoved Him to\nappear in flesh), that He might abolish death, and reveal the resurrection from the dead,\nendured [what and as He did], in order that He might fulfil the promise made unt", "lang": "greek", "orig": ""}, {"v": 5, "f": "1 Clement", "w": "X.", "t": "The goat that was sent away presented a type of Him who taketh away the sins of men.\nBut the two contained a representation of the one economy of God incarnate. For He was\nwounded for our transgressions, and He bare the sins of many, and He was delivered for\nour iniquities.—From manuscript of writings of Justin.", "lang": "greek", "orig": ""}, {"v": 5, "f": "1 Peter", "w": "", "t": "Servants, be subject to your masters with all fear; not only to the good and gentle, but also to the froward.  For this is thankworthy, if a man for conscience toward God endure grief, suffering wrongfully.  For what glory is it, if, when ye be buffeted for your faults, ye shall take it patiently? but if, when ye do well, and suffer for it, ye take it patiently, this is acceptable with God.  For even hereunto were ye called: because Christ also suffered for us, leaving us an example, that ye should follow his steps:  Who did no sin, neither was guile found in his mouth:  Who, when he was reviled, reviled not again; when he suffered, he threatened not; but committed himself to him that judgeth righteously:  Who his own self bare our sins in his own body on the tree, that we, being dead to sins, should live unto righteousness: by whose stripes ye were healed. [Isaiah 53:5] For ye were as sheep going astray; but are now returned unto the Shepherd and Bishop of your souls.", "lang": "english", "orig": ""}, {"v": 5, "f": "Athanasius of Alexandria", "w": "", "t": "It did not say, “He remedied our infirmities,” lest, as being external to the body and only healing it, as he has always done, he should leave people subject still to death. Rather, he carries our infirmities, and he himself bears our sins, that it might be shown that he has become human for us, and that the body that in him bore them was his own body.", "lang": "english", "orig": ""}, {"v": 5, "f": "Eusebius of Caesarea", "w": "", "t": "Alone did he assume the penalties of our wicked deeds, not when we were half dead but even when already altogether foul and stinking in tombs and graves.", "lang": "english", "orig": ""}, {"v": 5, "f": "Gregory Thaumaturgus", "w": "Topic XII.", "t": "i. 33; xii. 27; xiii. 21.\n422 Matt. xxvi. 38.\n423 Isa. liii. 5.\n424 Baruch iii. 38.\n425 Luke ii. 14.\n426 John xvi. 33.\n427 Rom. v. 12; viii. 3.\n\n\nereignty, and the corruption in the burying of the body be done away, and the first-fruits\nof the resurrection be sh", "lang": "greek", "orig": ""}, {"v": 5, "f": "Gregory the Dialogist", "w": "", "t": "Kish, who is called harsh, signifies not only his elect, but also the Redeemer himself. For no one was harsher toward himself than he. For the prophet, indicating the severity of this harshness, says: \"Truly he himself bore our infirmities, and he himself carried our sorrows\" (Isa. 53:4). For to die is not to suffer for mortals, who are subject to the suffering of a condemned nature. He therefore was exceedingly harsh toward himself, who had nothing in himself by which he might suffer; but in order to free us by suffering, he graciously assumed that by which he might be harsh toward himself and be able to suffer.", "lang": "english", "orig": ""}, {"v": 5, "f": "Irenaeus", "w": "CHAPTER XV.—ON THE DIFFERENT KINDS OF VOLUNTARY ACTIONS, AND THE SINS THENCE\nPROCEEDING.", "t": "Mistake is a sin contrary to calculation; and voluntary sin is crime (ἀδικία); and crime\nis voluntary wickedness. Sin, then, is on my part voluntary. Wherefore says the apostle, “Sin\nshall not have dominion over you; for ye are not under the law, but under grace.”1450 Addressing\nthose who have believed, he says, “For by His stripes we were healed.”1451 Mistake\nis the involuntary action of another towards me, while a crime (ἀδικία) alone is voluntary,\nwhether my act or another’s. These differences of sins are alluded to by the Psalmist, when\nhe calls those blessed whose iniquities (ἀνομίας) God hath blotted out, and whose sins\n(ἁμαρτίας) He hath covered. Others He does not impute, and the rest He forgives. For it is\nwritten, “Blessed are they whose iniquities are forgiven, whose sins are covered. Blessed is\nthe man to whom the Lord will not impute sin, and in whose mouth there is no fraud.”1452\nThis blessedness came on those who had been chosen by God through Jesus Christ our\nLord. For “love hides the multitude of sins.”1453 And they are blotted out by Him “who desireth\nthe repentance rather than the death of a sinner.”1454 And those are not reckoned\nthat are not the effect of choice; “for he who has lusted has already committed adultery,”1455\nit is said. And the illuminating Word forgives sins: “And in that time, saith the Lord, they\nshall seek for the iniquity of Israel, and it shall not exist; and the sins of Judah, and they shall\nnot be found.”1456 “For who is like Me? and", "lang": "greek", "orig": ""}, {"v": 5, "f": "Jerome", "w": "", "t": "But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him, and with his stripes we are healed. LXX: But he was wounded for our sins, and he was weakened for our iniquities. He was wounded for our iniquities, saying in the psalm: They have dug my hands and my feet (Ps. XXI, 18), so that with his wound he might heal our wounds, and he was crushed, or afflicted because of our sins, so that he became a curse for us, to deliver us from the curse. For every man who hangs on a tree is cursed (Deut. XXI, Galat. III). Therefore, our discipline of peace is upon him. For what we should have endured for our own sins, He suffered for us, making peace through the blood of His cross, whether those on earth or those in heaven. For He Himself is our peace, who made both one, and broke down the middle wall of partition, abolishing in His flesh the enmity, that is, the law of commandments contained in ordinances, that He might create in Himself one new man, making peace. From which it is clear, that just as the bruised and lacerated body bears signs of injury in bruises and discoloration: so too the soul truly suffered for us, lest it be believed in Christ partly as truth and partly as falsehood (Rom. III).", "lang": "english", "orig": ""}, {"v": 5, "f": "Thomas Aquinas", "w": "", "t": "But he was wounded. Here he sets out the fruit of his humiliation or of his passion.\n\nAnd first, he assigns the moving reason: but he was, not as we thought, but wounded, by thorns, nails, and lance, for our iniquities, taking them away, he was bruised, by scourges and blows. Or he was wounded, as to where the previous verse says: he was struck; he was bruised, as to where it says: afflicted: the breath of our mouth, Christ the Lord, is taken in our sins (Lam 4:20).\n\nSecond, he shows the consequent usefulness in the reconciliation of peace: the chastisement of our peace, that is, he endured the chastisement of correction for us, and through this peace we have access to God: for if, when we were enemies, we were reconciled to God by the death of his Son (Rom 5:10); and in the restoration of broken health: by his bruises, which he had from the scourges, we are healed: by whose stripes you were healed (1 Pet 2:24); who forgives all your iniquities: who heals all your diseases (Ps 102[103]:3).", "lang": "english", "orig": ""}, {"v": 6, "f": "Clement of Alexandria", "w": "", "t": "Isaiah says [about Christ], “The Lord has laid on him the iniquity of us all,” that is, to correct our iniquities and set them right. For that reason, he alone is able to forgive our sins, he who has been appointed by the Father of all as our educator, for he alone is able to separate obedience from disobedience.", "lang": "english", "orig": ""}, {"v": 6, "f": "Jerome", "w": "", "t": "All we like sheep have gone astray; we have turned every one to his own way; and the Lord hath laid on him the iniquity of us all. All, as it is said, have gone astray like sheep, and we are in need of God's mercy, saying in the psalm: I have strayed like a lost sheep (Ps. CXVIII, 176); which in the parable of the Good Shepherd in the Gospel was carried on his concerned shoulders (Matth. XV). But the following verse shows who these sheep are. Man has wandered in his way; or rather, each one has turned aside in his own way, in order to follow his own error, abandoning the right path, and thinking differently about the Crucified. However, the Lord placed on him the iniquity of all of us, or he handed him over for our sins; so that what we could not bear on account of our weakness, he would bear for us, who was offered, because he himself willed it.", "lang": "english", "orig": ""}, {"v": 6, "f": "Theodore Stratelates", "w": "", "t": "He bore the sum of human evils and every form of transgression, as well as their recompense and punishment. And as if he were our debtor, the only-begotten Word of God, coming into the world alongside us, fulfilled every law and all righteousness and did not stumble over sin but received it willingly so as to change our punishment into peace and harmony. For undergoing temptation he carried our rebukes and punishments, and by faith we make our own his sufferings, and dying together with him we are saved by grace. He was not delivered by force but as an act of obedience.", "lang": "english", "orig": ""}, {"v": 6, "f": "Theodoret of Cyrus", "w": "", "t": "The offenses of all were not equal, and there was not only one way of being impious; for the idols of the Egyptians and those of the Phoenicians were not the same, those of the Greeks were different, and those of the Scythians were something else. Nevertheless, although the forms of error were different, we had all in a common manner abandoned the true God, and by this we resembled sheep who have gone astray and are exposed to the wolves.", "lang": "english", "orig": ""}, {"v": 6, "f": "Thomas Aquinas", "w": "", "t": "Third, he shows the imminent necessity on our part, for all are sick, and thus all need a physician, and no one else can offer a sufficient remedy: for there is no dist

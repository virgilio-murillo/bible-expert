tre of Your kingdom.  To him therefore also now it is said, O God, who shall be like You? For unto many You vouchsafed to be likened in Your humiliation, even so far as to the robbers that were crucified with You: but when in glory You shall come, who shall be like You?...", "lang": "", "orig": ""}, {"v": 12, "f": "Augustine - Trinity", "w": "Psalm LXXXIII.3847", "t": "ignantly\n3847 Lat. LXXXII.\n3848 Phil. ii. 7.\n3849 Isa. liii. 12.\n3850 Ps. xlv. 6.\n3851 2 Thess. ii. 4.\n3852 Luke xiv. 11.\n3853 2 Thess. ii. 8.\n\n\ntaken counsel” (ver. 3). Or, as other copies have it, “They have cunningly devised counsel,\nand have devised against T", "lang": "latin", "orig": ""}, {"v": 12, "f": "Augustine of Hippo", "w": "", "t": "Three men were crucified in the same place, the Lord in the middle, because “he was reckoned among the wicked.” They placed the two robbers on either side, but they were not crucified for the same reason. They were flanking Christ as he hung there, but they were far removed from him in reality. They were crucified by their crimes, he by ours.", "lang": "english", "orig": ""}, {"v": 12, "f": "Chrysostom - Homilies on Timothy-Hebrews", "w": "Homily LXXXV.", "t": "that “He was numbered\nwith the transgressors.” ( Isa. liii. 12.) The devil therefore wished to cast a veil over what\nwas done, but was unable; for the three were crucified, but Jesus alone was glorious, that\nthou mayest learn, that His power effected all. Yet th", "lang": "greek", "orig": ""}, {"v": 12, "f": "Cyril of Jerusalem", "w": "", "t": "Concerning the robbers who were crucified with him it is written, “And he was numbered with the transgressors.” Both of them were before this transgressors, but one was so no longer. For the one was a transgressor to the end, stubborn against salvation; who, though his hands were fastened, struck with blasphemy by his tongue. When the Jews passing by wagged their head, mocking the crucified and fulfilling what was written, “When they looked on me, they shook their head,” he also reviled with them. But the other rebuked the reviler; and it was to him the end of life and the beginning of restoration, the surrender of his soul a first share in salvation.", "lang": "english", "orig": ""}, {"v": 12, "f": "Ephrem the Syrian", "w": "", "t": "“Therefore I will divide him a portion among the many,” among the many who will eat his body and will drink his blood. “And he shall divide the spoil with the strong” … he calls “the strong” the holy apostles, among whom he divided the nations to be ruled, which he had taken away the power of the devil.", "lang": "english", "orig": ""}, {"v": 12, "f": "Ephrem the Syrian", "w": "Commentary on Genesis", "t": "34. His Will was able, even by force to rescue us.— But since it was not force that made us guilty, it was not by force He purged us.— The Evil One by enticement enslaved us: Your Birth enticed to give us life.", "lang": "", "orig": ""}, {"v": 12, "f": "Gregory Thaumaturgus", "w": "Topic XII.", "t": "Wherefore He says, “Be of good cheer, I have overcome the world.”426 And this He said,\nnot as holding before us any contest proper only to a God, but as showing our own flesh in\nits capacity to overcome suffering, and death, and corruption, in order that, as sin entered\ninto the world by flesh, and death came to reign by sin over all men, the sin in the flesh\nmight also be condemned through the selfsame flesh in the likeness thereof;427 and that\nthat overseer of sin, the tempter, might be overcome, and death be cast down from its sov-\n421 John xi. 33; xii. 27; xiii. 21.\n422 Matt. xxvi. 38.\n423 Isa. liii. 5.\n424 Baruch iii. 38.\n425 Luke ii. 14.\n426 John xvi. 33.\n427 Rom. v. 12; viii. 3.\n\n\nereignty, and the corruption in the burying of the body be done away, and the first-fruits\nof the resurrection be shown, and the principle of righteousness begin its course in the world\nthrough faith, and the kingdom of heaven be preached to men, and fellowship be established\nbetween God and men.", "lang": "greek", "orig": ""}, {"v": 12, "f": "Gregory of Nazianzus", "w": "", "t": "If you are a Simon of Cyrene, take up the cross and follow. If you are crucified with him as a robber, acknowledge God as a penitent robber. If even he was numbered among the transgressors for you and your sin, do you become law-abiding for his sake. Worship him who was hanged for you, even if you yourself are hanging; make some gain even from your wickedness; purchase salvation by your death; enter with Jesus into paradise, so that you may learn from what you have fallen.", "lang": "english", "orig": ""}, {"v": 12, "f": "Jerome", "w": "", "t": "(Verse 12.) Therefore I will divide him among the many, and he will share the spoils of the strong, because he poured out his soul to death and was numbered with the transgressors. Yet he himself bore the sin of many and interceded for the transgressors. LXX: Therefore he shall receive many as his portion, and he shall divide the spoils with the mighty, because his soul was poured out to death and he was numbered with the wicked. He himself bore the sins of many and was delivered up for their iniquities. Christ endured many sufferings so that he might attain great rewards. For, he said, he suffered and accomplished all that the previous word described, and he himself bore the iniquities of many: therefore I will divide to him many, so that for the part of the Lord Jacob, and his inheritance rope of Israel, they may believe in him coming from the East and West, and may recline in the kingdom of God with Abraham, Isaac, and Jacob (Matth. VIII): when that which is written is fulfilled: Ask of me, and I will give you the nations for your inheritance, and the ends of the earth for your possession (Ps. II, 8). Concerning which and in this same Prophet it is read: There shall be a root of Jesse, and he that shall rise up to reign over the Gentiles, in him the Gentiles shall hope (Isaiah 11:10). But these many previously were held captive by the strong; and under the appearance of an ass and a colt, they had many masters, to whom the Apostles said: The Lord has need of them (Matthew ", "lang": "english", "orig": ""}, {"v": 12, "f": "John Chrysostom", "w": "", "t": "Hear, at least, what God says to the Jews, “As my child Isaiah walked, naked and barefoot, so shall the children of Israel walk into captivity naked and barefoot.” He wishes, therefore, to remind you by your appearance that the devil held sway over you, and he brings you to the recollection of how lowly born you were before regeneration. Hence, you stand not only naked and unshod, but you even stand with upturned hands to confess God’s future sovereignty to which you draw near. You are all the spoils and booty of war. Isaiah mentioned these spoils long ago, before our release from troubles, when he prophesied as follows, “He shall divide the spoils of the strong.”", "lang": "english", "orig": ""}, {"v": 12, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For that our bodily ills are caused by the wickedness of the soul, is shown both by him that had the palsy thirty and eight years, and by him that was let down through the roof, and by Cain also before these; and from many other things likewise one may perceive this. Let us do away then with the well-spring of our evils, and all the channels of our diseases will be stayed. For the disease is not palsy only, but also our sin; and this more than that, by how much a soul is better than a body.", "lang": "", "orig": ""}, {"v": 12, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "For this mystery He directs to be always clear, not from violence only, but even from bare enmity. Yea, for this mystery is a mystery of peace; it allows us not to cling to wealth. For if He spared not Himself for us, what must we deserve, sparing our wealth, and being lavish of a soul, in behalf of which He spared not Himself?", "lang": "", "orig": ""}, {"v": 12, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "And these things the prophets proclaim every day, each of them in a different way publishing this glorious triumph. For one says, You have gone up on high, You have led captivity captive, and hast received gifts among men.  And, The Lord strong and mighty in battle.  And another says, He shall divide the spoils of the strong. Isaiah 53:12 For indeed to this purpose He came, that He might preach deliverance to captives, and recovery of sight to the blind.", "lang": "", "orig": ""}, {"v": 12, "f": "John Chrysostom", "w": "Homiliae in Genesim", "t": "Well: that He was to rise again, he knew, say they, and that He was to give the Holy Ghost; but that He should likewise be crucified, he knew not. How then was He to rise again, who had not suffered, nor been crucified? And how was this man greater than a prophet, who knew not even what the prophets knew? For that he was greater than a prophet, even Christ Himself bare record, Matthew 11:9 but that the prophets knew of the passion is surely plain to every one. For so Isaiah says, He is brought as a lamb to the slaughter, and as a sheep before her shearer is dumb. Isaiah 53:7 And before this testimony also he says, There shall be a root of Jesse, and He that shall rise again to rule the Gentiles, in Him shall the Gentiles trust. Isaiah 11:10 Then speaking of His passion, and of the ensuing glory, he added, And His rest shall be honor. And this prophet foretold not only that He should be crucified, but also with whom. For, says he, He was numbered with the transgressors. Isaiah 53:12 And not this only, but that He should not even plead for Himself; For this man, he says, opens not His mouth: and that He should be unjustly condemned; For in His humiliation, says he, His judgment was taken away. And before this again, David both says this, and describes the judgment hall. Why, says he, do the heathen rage, and the people imagine a vain thing? The kings of the earth stand up, and the rulers are gathered together against the Lord, and against His anointed.", "lang": "", "orig": ""}, {"v": 12, "f": "Luke", "w": "", "t": "And he said unto them, When I sent you without purse, and scrip, and shoes, lacked ye any thing? And they said, Nothing.  Then said he unto them, But now, he that hath a purse, let him take it, and likewise his scrip: and he that hath no sword, let him sell his garment, and buy one.  For I say unto you, that this that is written must yet be accomplished in me, And he was reckoned among the transgressors: for the things concerning me have an end. [Isaiah 53:12] And they said, Lord, behold, here are two swords. And he said unto them, It is enough.", "lang": "english", "orig": ""}, {"v": 12, "f": "Mark", "w": "", "t": "And they compel one Simon a Cyrenian, who passed by, coming out of the country, the father of Alexander and Rufus, to bear his cross.  And they bring him unto the place Golgotha, which is, being interpreted, The place of a skull.  And they gave him to drink wine mingled with myrrh: but he received it not.  And when they had crucified him, they parted his garments, casting lots upon them, what every man should take.  And it was the third hour, and they crucified him.  And the superscription of his accusation was written over, THE KING OF THE JEWS.  And with him they crucify two thieves; the one on his right hand, and the other on his left.  And the scripture was fulfilled, which saith, And he was numbered with the transgressors. [Isaiah 53:12] And they that passed by railed on him, wagging their heads, and saying, Ah, thou that destroyest the temple, and buildest it in three days,  Save thyself, and come down from the cross.  Likewise also the chief priests mocking said among themselves with the scribes, He saved others; himself he cannot save.  Let Christ the King of Israel descend now from the cross, that we may see and believe. And they that were crucified with him reviled him.", "lang": "english", "orig": ""}, {"v": 12, "f": "Origen", "w": "Homiliae in Numeros", "t": "For this also He came down. For this He clothed Himself with man. For this He voluntarily subjected Himself to the experiences of men, that by bringing Himself to the measure of our weakness whom He loved, He might correspondingly bring us to the measure of His own strength. And about to be offered up and giving Himself a ransom, He left for us a new Covenant-testament: My love I give unto you. And what and how great is it? For each of us He gave His life — the equivalent for all. This He demands from us in return for one another. And if we owe our lives to the brethren, and have made such a mutual compact with the Saviour, why should we any more hoard and shut up worldly goods, which are beggarly, foreign to us and transitory? Shall we shut up from each other what after a little shall be the property of the fire? Divinely and weightily John says, He that loves not his brother is a murderer, 1 John 3:14-15 the seed of Cain, a nursling of the devil. He has not God's compassion. He has no hope of better things. He is sterile; he is barren; he is not a branch of the ever-living supercelestial vine. He is cut off; he waits the perpetual fire.", "lang": "", "orig": ""}, {"v": 12, "f": "Procopius of Gaza", "w": "", "t": "For “he is justified.” Either we have been made just, or he is admitted to be just by those who attacked him and enslaved him, to reveal the full injustice of their judgment at that time.… “Yet he bore the sins of many.” … For taking them to himself [Christ] then took off the cloak of our sin. And in this way “he justified many,” that is, the nations. For there was previously one nation, Israel, whereas those from the nations came in many shapes, whom, making his own, he calls his inheritance, saying, “The Lord said to me, You are my Son, today I have begotten you. Ask from me, and I will give you the nations as an inheritance, and the ends of the earth will be your possession.”", "lang": "english", "orig": ""}, {"v": 12, "f": "Tertullian", "w": "Chapter XLI.—The Woe Pronounced on the Traitor a Judicial Act, Which Disproves\nChrist to Be Such as Marcion Would Have Him to Be. Christ’s Conduct Before\nthe Council Explained. Christ Even Then Directs the Minds of His Judges to the\nProphetic Evidences of His Own Mission. The Moral Responsibility of These\nMen Asserted.", "t": "“Woe,” says He, “to that man by whom the Son of man is betrayed!”5094 Now it is certain\nthat in this woe must be understood the imprecation and threat of an angry and incensed\nMaster, unless Judas was to escape with impunity after so vast a sin. If he were meant to escape\nwith impunity, the “woe” was an idle word; if not, he was of course to be punished by\nHim against whom he had committed the sin of treachery. Now, if He knowingly permitted\nthe man, whom He5095 deliberately elected to be one of His companions, to plunge into so\ngreat a crime, you must no longer use an argument against the Creator in Adam’s case,\nwhich may now recoil on your own God:5096 either that he was ignorant, and had no foresight\nto hinder the future sinner;5097 or that he was unable to hinder him, even if he was ignorant;\n5098 or else that he was unwilling, even if he had the foreknowledge and the ability; and\nso deserved the stigma of maliciousness, in having permitted the man of his own choice to\nperish in his sin. I advise you therefore (willingly) to acknowledge the Creator in that god\nof yours, rather than against your will to be assimilating your excellent god to Him. For in\nthe case of Peter,5099 too, he gives you proof that he is a jealous God, when he destined the\napostle, after his presumptuous protestations of zeal, to a flat denial of him, rather than\nprevent his fall.5100 The Christ of the prophets was destined, moreover, to be betrayed with\na kiss,5101 for He was the Son indeed of Him wh", "lang": "latin", "orig": ""}, {"v": 12, "f": "Theodore Stratelates", "w": "", "t": "The inheritance of the Son is all those who believe in him. They are rightly called the spoil of the devil. This occurred when the only Son in his wonderful dispensation made everyone to participate in the knowledge of the Son and the Father. They were released from error and from the tyranny of the devil, whom they previously thought to be too strong. They are rightly said to have been made an inheritance, those who became a part of him when the devil was plundered.", "lang": "english", "orig": ""}, {"v": 12, "f": "Thomas Aquinas", "w": "", "t": "Therefore will I distribute. Here he sets out his victory over his enemies.\n\nAnd first, he sets out the subjection of the enemies: therefore will I distribute to him, as if to say: I will give him his part, very many, who will believe in him; and the spoils of the strong, that is, those held captive by demons, he shall divide, among his disciples, setting different disciples over different nations: he shall carry off the treasure of every desirable vessel (Hos 13:15); the king of powers is of the beloved, of the beloved; and the beauty of the house shall divide spoils (Ps 67:13[68:12]).\n\nSecond, he sets out the reason for their subjection as to his death: because he has delivered his soul unto death; and as to the kind of death he endured: and was reputed with the wicked: and there were crucified with him two malefactors (Luke 23:32); I am counted among them that go down to the pit (Ps 87:5[88:4]).\n\nThird, the salvation of those made subject to him: for he does not subject them to himself like a tyrant to abuse them, but to save them: and he has borne, taken away, the sins of many, efficaciously, although sufficiently of all, and has prayed for the transgressors: Father, forgive them, for they know not what they do (Luke 23:34).", "lang": "english", "orig": ""}], "xrefs": [{"v": 1, "ref": "1 Corinthians 1:18", "rel": "cross-reference", "text": {"es": "Porque la palabra de la cruz es locura á los que se pierden; mas á los que se salvan, es á saber, á nosotros, es potencia de Dios.", "gr": "Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.", "lxx": "", "en": ""}}, {"v": 1, "ref": "1 Corinthians 1:24", "rel": "cross-reference", "text": {"es": "Empero á los llamados, así Judíos como Griegos, Cristo potencia de Dios, y sabiduría de Dios.", "gr": "αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.", "lxx": "", "en": ""}}, {"v": 1, "ref": "Isaiah 40:5", "rel": "cross-reference", "text": {"es": "Y manifestaráse la gloria de Jehová, y toda carne juntamente la verá; que la boca de Jehová habló.", "gr": "וְ/נִגְלָ֖ה כְּב֣וֹד יְהוָ֑ה וְ/רָא֤וּ כָל בָּשָׂר֙ יַחְדָּ֔ו כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר", "lxx": "καὶ ὀφθήσεται ἡ δόξα κυρίου καὶ ὄψεται πᾶσα σὰρξ τὸ σωτήριον τοῦ θεοῦ ὅτι κύριος ἐλάλησεν", "en": "And the glory of the Lord shall be revealed, and all flesh shall see it together: for the mouth of the Lord hath spoken it."}}, {"v": 1, "ref": "Isaiah 51:9", "rel": "cross-reference", "text": {"es": "Despiértate, despiértate, vístete de fortaleza, oh brazo de Jehová; despiértate como en el tiempo antiguo, en los siglos pasados. ¿No eres tú el que cortó á Rahab, y el que hirió al dragón?", "gr": "עוּרִ֨י עוּרִ֤י לִבְשִׁי עֹז֙ זְר֣וֹעַ יְהוָ֔ה ע֚וּרִי כִּ֣/ימֵי קֶ֔דֶם דֹּר֖וֹת עוֹלָמִ֑ים הֲ/ל֥וֹא אַתְּ הִ֛יא הַ/מַּחְצֶ֥בֶת רַ֖הַב מְחוֹלֶ֥לֶת תַּנִּֽין", "lxx": "ἐξεγείρου ἐξεγείρου Ιερουσαλημ καὶ ἔνδυσαι τὴν ἰσχὺν τοῦ βραχίονός σου ἐξεγείρου ὡς ἐν ἀρχῇ ἡμέρας ὡς γενεὰ αἰῶνος οὐ σὺ εἶ", "en": "Awake, awake, put on strength, O arm of the Lord; awake, as in the ancient days, in the generations of old. Art thou not it that hath cut Rahab, and wounded the dragon?"}}, {"v": 1, "ref": "Isaiah 52:10", "rel": "cross-reference", "text": {"es": "Jehová desnudó el brazo de su santidad ante los ojos de todas las gentes; y todos los términos de la tierra verán la salud del Dios nuestro.", "gr": "חָשַׂ֤ף יְהוָה֙ אֶת זְר֣וֹעַ קָדְשׁ֔/וֹ לְ/עֵינֵ֖י כָּל הַ/גּוֹיִ֑ם וְ/רָאוּ֙ כָּל אַפְסֵי אָ֔רֶץ אֵ֖ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ", "lxx": "καὶ ἀποκαλύψει κύριος τὸν βραχίονα αὐτοῦ τὸν ἅγιον ἐνώπιον πάντων τῶν ἐθνῶν καὶ ὄψονται πάντα τὰ ἄκρα τῆς γῆς τὴν σωτηρίαν τὴν παρὰ τοῦ θεοῦ", "en": "The Lord hath made bare his holy arm in the eyes of all the nations; and all the ends of the earth shall see the salvation of our God."}}, {"v": 1, "ref": "Isaiah 62:8", "rel": "cross-reference", "text": {"es": "Juró Jehová por su mano derecha, y por el brazo de su fortaleza: Que jamás daré tu trigo por comida á tus enemigos, ni beberán los extraños el vino que tú trabajaste:", "gr": "נִשְׁבַּ֧ע יְהוָ֛ה בִּֽ/ימִינ֖/וֹ וּ/בִ/זְר֣וֹעַ עֻזּ֑/וֹ אִם אֶתֵּן֩ אֶת דְּגָנֵ֨/ךְ ע֤וֹד מַֽאֲכָל֙ לְ/אֹ֣יְבַ֔יִ/ךְ וְ/אִם יִשְׁתּ֤וּ בְנֵֽי נֵכָר֙ תִּֽירוֹשֵׁ֔/ךְ אֲשֶׁ֥ר יָגַ֖עַתְּ בּֽ/וֹ", "lxx": "ὤμοσεν κύριος κατὰ τῆς δεξιᾶς αὐτοῦ καὶ κατὰ τῆς ἰσχύος τοῦ βραχίονος αὐτοῦ εἰ ἔτι δώσω τὸν σῖτόν σου καὶ τὰ βρώματά σου τοῖς ἐχθροῖς σου καὶ εἰ ἔτι πίονται υἱοὶ ἀλλότριοι τὸν οἶνόν σου ἐφ᾿ ᾧ ἐμόχθησας", "en": "The Lord hath sworn by his right hand, and by the arm of his strength, Surely I will no more give thy corn to be meat for thine enemies; and the sons of the stranger shall not drink thy wine, for the which thou hast laboured:"}}, {"v": 1, "ref": "John 12:38", "rel": "cross-reference", "text": {"es": "Para que se cumpliese el dicho que dijo el profeta Isaías: ¿Señor, quién ha creído á nuestro dicho? ¿Y el brazo del Señor, á quién es revelado?", "gr": "ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;", "lxx": "", "en": "That the saying of Esaias the prophet might be fulfilled, which he spake, Lord, who hath believed our report? and to whom hath the arm of the Lord been revealed?"}}, {"v": 1, "ref": "John 1:12", "rel": "cross-reference", "text": {"es": "Mas á todos los que le recibieron, dióles potestad de ser hechos hijos de Dios, á los que creen en su nombre:", "gr": "ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,", "lxx": "", "en": "But as many as received him, to them gave he power to become the sons of God, even to them that believe on his name:"}}, {"v": 2, "ref": "Ezekiel 17:22", "rel": "cross-reference", "text": {"es": "Así ha dicho el Señor Jehová: Y tomaré yo del cogollo de aquel alto cedro, y pondrélo; del principal de sus renuevos cortaré un tallo, y plantarlo he yo sobre el monte alto y sublime;", "gr": "כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לָקַ֣חְתִּי אָ֗נִי מִ/צַּמֶּ֧רֶת הָ/אֶ֛רֶז הָ/רָמָ֖ה וְ/נָתָ֑תִּי מֵ/רֹ֤אשׁ יֹֽנְקוֹתָי/ו֙ רַ֣ךְ אֶקְטֹ֔ף וְ/שָׁתַ֣לְתִּי אָ֔נִי עַ֥ל הַר גָּבֹ֖הַ וְ/תָלֽוּל", "lxx": "διότι τάδε λέγει κύριος καὶ λήμψομαι ἐγὼ ἐκ τῶν ἐπιλέκτων τῆς κέδρου ἐκ κορυφῆς καρδίας αὐτῶν ἀποκνιῶ καὶ καταφυτεύσω ἐγὼ ἐπ᾿ ὄρος ὑψηλόν καὶ κρεμάσω αὐτὸν", "en": "Thus saith the Lord God; I will also take of the highest branch of the high cedar, and will set it; I will crop off from the top of his young twigs a tender one, and will plant it upon an high mountain and eminent:"}}, {"v": 2, "ref": "Ezekiel 17:24", "rel": "cross-reference", "text": {"es": "Y sabrán todos los árboles del campo que yo Jehová abatí el árbol sublime, levanté el árbol bajo, hice secar el árbol verde, é hice reverdecer el árbol seco. Yo Jehová hablé é hice.", "gr": "וְֽ/יָדְע֞וּ כָּל עֲצֵ֣י הַ/שָּׂדֶ֗ה כִּ֣י אֲנִ֤י יְהוָה֙ הִשְׁפַּ֣לְתִּי עֵ֣ץ גָּבֹ֗הַ הִגְבַּ֨הְתִּי֙ עֵ֣ץ שָׁפָ֔ל הוֹבַ֨שְׁתִּי֙ עֵ֣ץ לָ֔ח וְ/הִפְרַ֖חְתִּי עֵ֣ץ יָבֵ֑שׁ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי", "lxx": "καὶ γνώσονται πάντα τὰ ξύλα τοῦ πεδίου διότι ἐγὼ κύριος ὁ ταπεινῶν ξύλον ὑψηλὸν καὶ ὑψῶν ξύλον ταπεινὸν καὶ ξηραίνων ξύλον χλωρὸν καὶ ἀναθάλλων ξύλον ξηρόν ἐγὼ κύριος λελάληκα καὶ ποιήσω", "en": "And all the trees of the field shall know that I the Lord have brought down the high tree, have exalted the low tree, have dried up the green tree, and have made the dry tree to flourish: I the Lord have spoken and have done it. "}}, {"v": 2, "ref": "Isaiah 11:1", "rel": "cross-reference", "text": {"es": "Y SALDRA una vara del tronco de Isaí, y un vástago retoñará de sus raíces.", "gr": "וְ/יָצָ֥א חֹ֖טֶר מִ/גֵּ֣זַע יִשָׁ֑י וְ/נֵ֖צֶר מִ/שָּׁרָשָׁ֥י/ו יִפְרֶֽה", "lxx": "καὶ ἐξελεύσεται ῥάβδος ἐκ τῆς ῥίζης Ιεσσαι καὶ ἄνθος ἐκ τῆς ῥίζης ἀναβήσεται", "en": "And there shall come forth a rod out of the stem of Jesse, and a Branch shall grow out of his roots:"}}, {"v": 2, "ref": "Isaiah 52:14", "rel": "cross-reference", "text": {"es": "Como se pasmaron de ti muchos, en tanta manera fué desfigurado de los hombres su parecer; y su hermosura más que la de los hijos de los hombres.", "gr": "כַּ/אֲשֶׁ֨ר שָׁמְמ֤וּ עָלֶ֨י/ךָ֙ רַבִּ֔ים כֵּן מִשְׁחַ֥ת מֵ/אִ֖ישׁ מַרְאֵ֑/הוּ וְ/תֹאֲר֖/וֹ מִ/בְּנֵ֥י אָדָֽם", "lxx": "ὃν τρόπον ἐκστήσονται ἐπὶ σὲ πολλοί οὕτως ἀδοξήσει ἀπὸ ἀνθρώπων τὸ εἶδός σου καὶ ἡ δόξα σου ἀπὸ τῶν ἀνθρώπων", "en": "As many were astonied at thee; his visage was so marred more than any man, and his form more than the sons of men:"}}, {"v": 2, "ref": "Jeremiah 23:5", "rel": "cross-reference", "text": {"es": "He aquí que vienen los días, dice Jehová, y despertaré á David renuevo justo, y reinará Rey, el cual será dichoso, y hará juicio y justicia en la tierra.", "gr": "הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וַ/הֲקִמֹתִ֥י לְ/דָוִ֖ד צֶ֣מַח צַדִּ֑יק וּ/מָ֤לַךְ מֶ֨לֶךְ֙ וְ/הִשְׂכִּ֔יל וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ", "lxx": "ἰδοὺ ἡμέραι ἔρχονται λέγει κύριος καὶ ἀναστήσω τῷ Δαυιδ ἀνατολὴν δικαίαν καὶ βασιλεύσει βασιλεὺς καὶ συνήσει καὶ ποιήσει κρίμα καὶ δικαιοσύνην ἐπὶ τῆς γῆς", "en": "Behold, the days come, saith the Lord, that I will raise unto David a righteous Branch, and a King shall reign and prosper, and shall execute judgment and justice in the earth."}}, {"v": 2, "ref": "John 1:10", "rel": "cross-reference", "text": {"es": "En el mundo estaba, y el mundo fué hecho por él; y el mundo no le conoció.", "gr": "Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.", "lxx": "", "en": "He was in the world, and the world was made by him, and the world knew him not."}}, {"v": 2, "ref": "John 1:14", "rel": "cross-reference", "text": {"es": "Y aquel Verbo fué hecho carne, y habitó entre nosotros (y vimos su gloria, gloria como del unigénito del Padre), lleno de gracia y de verdad.", "gr": "Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·", "lxx": "", "en": "And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth."}}, {"v": 2, "ref": "Mark 6:3", "rel": "cross-reference", "text": {"es": "¿No es éste el carpintero, hijo de María, hermano de Jacobo, y de José, y de Judas, y de Simón? ¿No están también aquí con nosotros, sus hermanas? Y se escandalizaban en él.", "gr": "οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.", "lxx": "", "en": "Is not this the carpenter, the son of Mary, the brother of James, and Joses, and of Juda, and Simon? and are not his sisters here with us? And they were offended at him."}}, {"v": 3, "ref": "Hebrews 12:2", "rel": "cross-reference", "text": {"es": "Puestos los ojos en al autor y consumador de la fe, en Jesús; el cual, habiéndole sido propuesto gozo, sufrió la cruz, menospreciando la vergüenza, y sentóse á la diestra del trono de Dios.", "gr": "ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.", "lxx": "", "en": "Looking unto Jesus the author and finisher of our faith; who for the joy that was set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God."}}, {"v": 3, "ref": "Hebrews 12:3", "rel": "cross-reference", "text": {"es": "Reducid pues á vuestro pensameinto á aquel que sufrió tal contradicción de pecadores contra sí mismo, porque no os fatiguéis en vuestros ánimos desmayando.", "gr": "Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.", "lxx": "", "en": "For consider him that endured such contradiction of sinners against himself, lest ye be wearied and faint in your minds."}}, {"v": 3, "ref": "Hebrews 5:7", "rel": "cross-reference", "text": {"es": "El cual en los días de su carne, ofreciendo ruegos y súplicas con gran clamor y lágrimas al que le podía librar de la muerte, fué oído por su reverencial miedo.", "gr": "ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,", "lxx": "", "en": "Who in the days of his flesh, when he had offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and was heard in that he feared;"}}, {"v": 3, "ref": "Isaiah 49:7", "rel": "cross-reference", "text": {"es": "Así ha dicho Jehová, Redentor de Israel, el Santo suyo, al menospreciado de alma, al abominado de las gentes, al siervo de los tiranos. Verán reyes, y levantaránse príncipes, y adorarán por Jehová; porque fiel es el Santo de Israel, el cual te escogió.", "gr": "כֹּ֣ה אָֽמַר יְהוָה֩ גֹּאֵ֨ל יִשְׂרָאֵ֜ל קְדוֹשׁ֗/וֹ לִ/בְזֹה נֶ֜פֶשׁ לִ/מְתָ֤עֵֽב גּוֹי֙ לְ/עֶ֣בֶד מֹשְׁלִ֔ים מְלָכִים֙ יִרְא֣וּ וָ/קָ֔מוּ שָׂרִ֖ים וְ/יִֽשְׁתַּחֲוּ֑וּ לְמַ֤עַן יְהוָה֙ אֲשֶׁ֣ר נֶאֱמָ֔ן קְדֹ֥שׁ יִשְׂרָאֵ֖ל וַ/יִּבְחָרֶֽ/ךָּ", "lxx": "οὕτως λέγει κύριος ὁ ῥυσάμενός σε ὁ θεὸς Ισραηλ ἁγιάσατε τὸν φαυλίζοντα τὴν ψυχὴν αὐτοῦ τὸν βδελυσσόμενον ὑπὸ τῶν ἐθνῶν τῶν δούλων τῶν ἀρχόντων βασιλεῖς ὄψονται αὐτὸν καὶ ἀναστήσονται ἄρχοντες καὶ προσκυνήσουσιν αὐτῷ ἕνεκεν κυρίου ὅτι πιστός ἐστιν ὁ ἅγιος Ισραηλ καὶ ἐξελεξάμην σε", "en": "Thus saith the Lord, the Redeemer of Israel, and his Holy One, to him whom man despiseth, to him whom the nation abhorreth, to a servant of rulers, Kings shall see and arise, princes also shall worship, because of the Lord that is faithful, and the Holy One of Israel, and he shall choose thee."}}, {"v": 3, "ref": "Isaiah 50:6", "rel": "cross-reference", "text": {"es": "Dí mi cuerpo á los heridores, y mis mejillas á los que me mesaban el cabello: no escondí mi rostro de las injurias y esputos.", "gr": "גֵּוִ/י֙ נָתַ֣תִּי לְ/מַכִּ֔ים וּ/לְחָיַ֖/י לְ/מֹֽרְטִ֑ים פָּנַ/י֙ לֹ֣א הִסְתַּ֔רְתִּי מִ/כְּלִמּ֖וֹת וָ/רֹֽק", "lxx": "τὸν νῶτόν μου δέδωκα εἰς μάστιγας τὰς δὲ σιαγόνας μου εἰς ῥαπίσματα τὸ δὲ πρόσωπόν μου οὐκ ἀπέστρεψα ἀπὸ αἰσχύνης ἐμπτυσμάτων", "en": "I gave my back to the smiters, and my cheeks to them that plucked off the hair: I hid not my face from shame and spitting."}}, {"v": 3, "ref": "Isaiah 53:10", "rel": "cross-reference", "text": {"es": "Con todo eso Jehová quiso quebrantarlo, sujetándole á padecimiento. Cuando hubiere puesto su vida en expiación por el pecado, verá linaje, vivirá por largos días, y la voluntad de Jehová será en su mano prosperada.", "gr": "וַ/יהוָ֞ה חָפֵ֤ץ דַּכְּא/וֹ֙ הֶֽחֱלִ֔י אִם תָּשִׂ֤ים אָשָׁם֙ נַפְשׁ֔/וֹ יִרְאֶ֥ה זֶ֖רַע יַאֲרִ֣יךְ יָמִ֑ים וְ/חֵ֥פֶץ יְהוָ֖ה בְּ/יָד֥/וֹ יִצְלָֽח", "lxx": "καὶ κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς ἐὰν δῶτε περὶ ἁμαρτίας ἡ ψυχὴ ὑμῶν ὄψεται σπέρμα μακρόβιον καὶ βούλεται κύριος ἀφελεῖν", "en": "Yet it pleased the Lord to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the Lord shall prosper in his hand."}}, {"v": 3, "ref": "Isaiah 53:4", "rel": "cross-reference", "text": {"es": "Ciertamente llevó él nuestras enfermedades, y sufrió nuestros dolores; y nosotros le tuvimos por azotado, por herido de Dios y abatido.", "gr": "אָכֵ֤ן חֳלָיֵ֨/נוּ֙ ה֣וּא נָשָׂ֔א וּ/מַכְאֹבֵ֖י/נוּ סְבָלָ֑/ם וַ/אֲנַ֣חְנוּ חֲשַׁבְנֻ֔/הוּ נָג֛וּעַ מֻכֵּ֥ה אֱלֹהִ֖ים וּ/מְעֻנֶּֽה", "lxx": "οὗτος τὰς ἁμαρτίας ἡμῶν φέρει καὶ περὶ ἡμῶν ὀδυνᾶται καὶ ἡμεῖς ἐλογισάμεθα αὐτὸν εἶναι ἐν πόνῳ καὶ ἐν πληγῇ καὶ ἐν κακώσει", "en": "Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted."}}, {"v": 3, "ref": "John 1:10", "rel": "cross-reference", "text": {"es": "En el mundo estaba, y el mundo fué hecho por él; y el mundo no le conoció.", "gr": "Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.", "lxx": "", "en": "He was in the world, and the world was made by him, and the world knew him not."}}, {"v": 4, "ref": "1 John 2:2", "rel": "cross-reference", "text": {"es": "Y él es la propiciación por nuestros pecados: y no solamente por los nuestros, sino también por los de todo el mundo.", "gr": "καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.", "lxx": "", "en": ""}}, {"v": 4, "ref": "1 Peter 2:24", "rel": "cross-reference", "text": {"es": "El cual mismo llevó nuestros pecados en su cuerpo sobre el madero, para que nosotros siendo muertos á los pecados, vivamos á la justicia: por la herida del cual habéis sido sanados.", "gr": "ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.", "lxx": "", "en": ""}}, {"v": 4, "ref": "1 Peter 3:18", "rel": "cross-reference", "text": {"es": "Porque también Cristo padeció una vez por los injustos, para llevarnos á Dios, siendo á la verdad muerto en la carne, pero vivificado en espíritu;", "gr": "ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·", "lxx": "", "en": ""}}, {"v": 4, "ref": "Galatians 3:13", "rel": "cross-reference", "text": {"es": "Cristo nos redimió de la maldición de la ley, hecho por nosotros maldición; (porque está escrito: Maldito cualquiera que es colgado en madero:)", "gr": "Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,", "lxx": "", "en": "Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed is every one that hangeth on a tree:"}}, {"v": 4, "ref": "Hebrews 9:28", "rel": "cross-reference", "text": {"es": "Así también Cristo fué ofrecido una vez para agotar los pecados de muchos; y la segunda vez, sin pecado, será visto de los que le esperan para salud.", "gr": "οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.", "lxx": "", "en": "So Christ was once offered to bear the sins of many; and unto them that look for him shall he appear the second time without sin unto salvation. "}}, {"v": 4, "ref": "Isaiah 53:11", "rel": "cross-reference", "text": {"es": "Del trabajo de su alma verá y será saciado; con su conocimiento justificará mi siervo justo á muchos, y él llevará las iniquidades de ellos.", "gr": "מֵ/עֲמַ֤ל נַפְשׁ/וֹ֙ יִרְאֶ֣ה יִשְׂבָּ֔ע בְּ/דַעְתּ֗/וֹ יַצְדִּ֥יק צַדִּ֛יק עַבְדִּ֖/י לָֽ/רַבִּ֑ים וַ/עֲוֺנֹתָ֖/ם ה֥וּא יִסְבֹּֽל", "lxx": "ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ δεῖξαι αὐτῷ φῶς καὶ πλάσαι τῇ συνέσει δικαιῶσαι δίκαιον εὖ δουλεύοντα πολλοῖς καὶ τὰς ἁμαρτίας αὐτῶν αὐτὸς ἀνοίσει", "en": "He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities."}}, {"v": 4, "ref": "Isaiah 53:12", "rel": "cross-reference", "text": {"es": "Por tanto yo le daré parte con los grandes, y con los fuertes repartirá despojos; por cuanto derramó su vida hasta la muerte, y fué contado con los perversos, habiendo él llevado el pecado de muchos y orado por los transgresores.", "gr": "לָ/כֵ֞ן אֲחַלֶּק ל֣/וֹ בָ/רַבִּ֗ים וְ/אֶת עֲצוּמִים֮ יְחַלֵּ֣ק שָׁלָל֒ תַּ֗חַת אֲשֶׁ֨ר הֶעֱרָ֤ה לַ/מָּ֨וֶת֙ נַפְשׁ֔/וֹ וְ/אֶת פֹּשְׁעִ֖ים נִמְנָ֑ה וְ/הוּא֙ חֵטְא רַבִּ֣ים נָשָׂ֔א וְ/לַ/פֹּשְׁעִ֖ים יַפְגִּֽיעַ", "lxx": "διὰ τοῦτο αὐτὸς κληρονομήσει πολλοὺς καὶ τῶν ἰσχυρῶν μεριεῖ σκῦλα ἀνθ᾿ ὧν παρεδόθη εἰς θάνατον ἡ ψυχὴ αὐτοῦ καὶ ἐν τοῖς ἀνόμοις ἐλογίσθη καὶ αὐτὸς ἁμαρτίας πολλῶν ἀνήνεγκεν καὶ διὰ τὰς ἁμαρτίας αὐτῶν παρεδόθη", "en": "Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors. "}}, {"v": 4, "ref": "Isaiah 53:5", "rel": "cross-reference", "text": {"es": "Mas él herido fué por nuestras rebeliones, molido por nuestros pecados: el castigo de nuestra paz sobre él; y por su llaga fuimos nosotros curados.", "gr": "וְ/הוּא֙ מְחֹלָ֣ל מִ/פְּשָׁעֵ֔/נוּ מְדֻכָּ֖א מֵ/עֲוֺנֹתֵ֑י/נוּ מוּסַ֤ר שְׁלוֹמֵ֨/נוּ֙ עָלָ֔י/ו וּ/בַ/חֲבֻרָת֖/וֹ נִרְפָּא לָֽ/נוּ", "lxx": "αὐτὸς δὲ ἐτραυματίσθη διὰ τὰς ἀνομίας ἡμῶν καὶ μεμαλάκισται διὰ τὰς ἁμαρτίας ἡμῶν παιδεία εἰρήνης ἡμῶν ἐπ᾿ αὐτόν τῷ μώλωπι αὐτοῦ ἡμεῖς ἰάθημεν", "en": "But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed."}}, {"v": 5, "ref": "1 Corinthians 15:3", "rel": "cross-reference", "text": {"es": "Porque primeramente os he enseñado lo que asimismo recibí: Que Cristo fué muerto por nuestros pecados conforme á las Escrituras;", "gr": "Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,", "lxx": "", "en": ""}}, {"v": 5, "ref": "1 Peter 2:24", "rel": "cross-reference", "text": {"es": "El cual mismo llevó nuestros pecados en su cuerpo sobre el madero, para que nosotros siendo muertos á los pecados, vivamos á la justicia: por la herida del cual habéis sido sanados.", "gr": "ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.", "lxx": "", "en": ""}}, {"v": 5, "ref": "1 Peter 2:25", "rel": "cross-reference", "text": {"es": "Porque vosotros erais como ovejas descarriadas; mas ahora habéis vuelto al Padre y Obispo de vuestras almas.", "gr": "ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.", "lxx": "", "en": ""}}, {"v": 5, "ref": "1 Peter 3:18", "rel": "cross-reference", "text": {"es": "Porque también Cristo padeció una vez por los injustos, para llevarnos á Dios, siendo á la verdad muerto en la carne, pero vivificado en espíritu;", "gr": "ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·", "lxx": "", "en": ""}}, {"v": 5, "ref": "2 Corinthians 5:21", "rel": "cross-reference", "text": {"es": "Al que no conoció pecado, hizo pecado por nosotros, para que nosotros fuésemos hechos justicia de Dios en él.", "gr": "⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.", "lxx": "", "en": ""}}, {"v": 5, "ref": "Daniel 9:24", "rel": "cross-reference", "text": {"es": "Setenta semanas están determinadas sobre tu pueblo y sobre tu santa ciudad, para acabar la prevaricación, y concluir el pecado, y expiar la iniquidad; y para traer la justicia de los siglos, y sellar la visión y la profecía, y ungir al Santo de los santos.", "gr": "שָׁבֻעִ֨ים שִׁבְעִ֜ים נֶחְתַּ֥ךְ עַֽל עַמְּ/ךָ֣ וְ/עַל עִ֣יר קָדְשֶׁ֗/ךָ לְ/כַלֵּ֨א הַ/פֶּ֜שַׁע ו/ל/חתם וּ/לְ/הָתֵ֤ם חטאות חַטָּאת֙ וּ/לְ/כַפֵּ֣ר עָוֺ֔ן וּ/לְ/הָבִ֖יא צֶ֣דֶק עֹֽלָמִ֑ים וְ/לַ/חְתֹּם֙ חָז֣וֹן וְ/נָבִ֔יא וְ/לִ/מְשֹׁ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים", "lxx": "", "en": "Seventy weeks are determined upon thy people and upon thy holy city, to finish the transgression, and to make an end of sins, and to make reconciliation for iniquity, and to bring in everlasting righteousness, and to seal up the vision and prophecy, and to anoint the most Holy."}}, {"v": 5, "ref": "Ephesians 5:2", "rel": "cross-reference", "text": {"es": "Y andad en amor, como también Cristo nos amó, y se entregó á sí mismo por nosotros, ofrenda y sacrificio á Dios en olor suave.", "gr": "καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.", "lxx": "", "en": "And walk in love, as Christ also hath loved us, and hath given himself for us an offering and a sacrifice to God for a sweetsmelling savour."}}, {"v": 5, "ref": "Genesis 3:15", "rel": "cross-reference", "text": {"es": "Y enemistad pondré entre ti y la mujer, y entre tu simiente y la simiente suya; ésta te herirá en la cabeza, y tú le herirás en el calcañar.", "gr": "וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב", "lxx": "καὶ ἔχθραν θήσω ἀνὰ μέσον σου καὶ ἀνὰ μέσον τῆς γυναικὸς καὶ ἀνὰ μέσον τοῦ σπέρματός σου καὶ ἀνὰ μέσον τοῦ σπέρματος αὐτῆς αὐτός σου τηρήσει κεφαλήν καὶ σὺ τηρήσεις αὐτοῦ πτέρναν", "en": "And I will put enmity between thee and the woman, and between thy seed and her seed; it shall bruise thy head, and thou shalt bruise his heel."}}, {"v": 6, "ref": "1 Peter 2:25", "rel": "cross-reference", "text": {"es": "Porque vosotros erais como ovejas descarriadas; mas ahora habéis vuelto al Padre y Obispo de vuestras almas.", "gr": "ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.", "lxx": "", "en": ""}}, {"v": 6, "ref": "1 Peter 3:18", "rel": "cross-reference", "text": {"es": "Porque también Cristo padeció una vez por los injustos, para llevarnos á Dios, siendo á la verdad muerto en la carne, pero vivificado en espíritu;", "gr": "ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·", "lxx": "", "en": ""}}, {"v": 6, "ref": "Isaiah 55:7", "rel": "cross-reference", "text": {"es": "Deje el impío su camino, y el hombre inicuo sus pensamientos; y vuélvase á Jehová, el cual tendrá de él misericordia, y al Dios nuestro, el cual será amplio en perdonar.", "gr": "יַעֲזֹ֤ב רָשָׁע֙ דַּרְכּ֔/וֹ וְ/אִ֥ישׁ אָ֖וֶן מַחְשְׁבֹתָ֑י/ו וְ/יָשֹׁ֤ב אֶל יְהוָה֙ וִֽ/ירַחֲמֵ֔/הוּ וְ/אֶל אֱלֹהֵ֖י/נוּ כִּֽי יַרְבֶּ֥ה לִ/סְלֽוֹחַ", "lxx": "ἀπολιπέτω ὁ ἀσεβὴς τὰς ὁδοὺς αὐτοῦ καὶ ἀνὴρ ἄνομος τὰς βουλὰς αὐτοῦ καὶ ἐπιστραφήτω ἐπὶ κύριον καὶ ἐλεηθήσεται ὅτι ἐπὶ πολὺ ἀφήσει τὰς ἁμαρτίας ὑμῶν", "en": "Let the wicked forsake his way, and the unrighteous man his thoughts: and let him return unto the Lord, and he will have mercy upon him; and to our God, for he will abundantly pardon."}}, {"v": 6, "ref": "James 5:20", "rel": "cross-reference", "text": {"es": "Sepa que el que hubiere hecho convertir al pecador del error de su camino, salvará un alma de muerte, y cubrirá multitud de pecados.", "gr": "⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.", "lxx": "", "en": "Let him know, that he which converteth the sinner from the error of his way shall save a soul from death, and shall hide a multitude of sins.  "}}, {"v": 6, "ref": "Matthew 18:12", "rel": "cross-reference", "text": {"es": "¿Qué os parece? Si tuviese algún hombre cien ovejas, y se descarriase una de ellas, ¿no iría por los montes, dejadas las noventa y nueve, á buscar la que se había descarriado?", "gr": "τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;", "lxx": "", "en": "How think ye? if a man have an hundred sheep, and one of them be gone astray, doth he not leave the ninety and nine, and goeth into the mountains, and seeketh that which is gone astray?"}}, {"v": 6, "ref": "Matthew 18:14", "rel": "cross-reference", "text": {"es": "Así, no es la voluntad de vuestro Padre que está en los cielos, que se pierda uno de estos pequeños.", "gr": "οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.", "lxx": "", "en": "Even so it is not the will of your Father which is in heaven, that one of these little ones should perish."}}, {"v": 6, "ref": "Psalms 119:176", "rel": "cross-reference", "text": {"es": "Yo anduve errante como oveja extraviada; busca á tu siervo; Porque no me he olvidado de tus mandamientos.", "gr": "תָּעִ֗יתִי כְּ/שֶׂ֣ה אֹ֭בֵד בַּקֵּ֣שׁ עַבְדֶּ֑/ךָ כִּ֥י מִ֝צְוֺתֶ֗י/ךָ לֹ֣א שָׁכָֽחְתִּי", "lxx": "", "en": "I have gone astray like a lost sheep; seek thy servant; for I do not forget thy commandments. "}}, {"v": 6, "ref": "Romans 3:10", "rel": "cross-reference", "text": {"es": "Como está escrito: No hay justo, ni aun uno;", "gr": "καθὼς γέγραπται ὅτι Οὐκ ἔστιν δίκαιος οὐδὲ εἷς,", "lxx": "", "en": "As it is written, There is none righteous, no, not one:"}}, {"v": 7, "ref": "1 Peter 2:23", "rel": "cross-reference", "text": {"es": "Quien cuando le maldecían no retornaba maldición: cuando padecía, no amenazaba, sino remitía la causa al que juzga justamente:", "gr": "ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·", "lxx": "", "en": ""}}, {"v": 7, "ref": "Acts 8:32", "rel": "cross-reference", "text": {"es": "Y el lugar de la Escritura que leía, era éste: Como oveja á la muerte fué llevado; Y como cordero mudo delante del que le trasquila, Así no abrió su boca:", "gr": "ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.", "lxx": "", "en": "The place of the scripture which he read was this, He was led as a sheep to the slaughter; and like a lamb dumb before his shearer, so opened he not his mouth:"}}, {"v": 7, "ref": "Acts 8:33", "rel": "cross-reference", "text": {"es": "En su humillación su juicio fué quitado: Mas su generación, ¿quién la contará? Porque es quitada de la tierra su vida.", "gr": "ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.", "lxx": "", "en": "In his humiliation his judgment was taken away: and who shall declare his generation? for his life is taken from the earth."}}, {"v": 7, "ref": "John 19:9", "rel": "cross-reference", "text": {"es": "Y entró otra vez en el pretorio, y dijo á Jesús: ¿De dónde eres tú? Mas Jesús no le dió respuesta.", "gr": "καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.", "lxx": "", "en": "And went again into the judgment hall, and saith unto Jesus, Whence art thou? But Jesus gave him no answer."}}, {"v": 7, "ref": "Luke 23:9", "rel": "cross-reference", "text": {"es": "Y le preguntaba con muchas palabras; mas él nada le respondió:", "gr": "ἐπηρώτα δὲ αὐτὸν ἐν λόγοις ἱκανοῖς· αὐτὸς δὲ οὐδὲν ἀπεκρίνατο αὐτῷ.", "lxx": "", "en": "Then he questioned with him in many words; but he answered him nothing."}}, {"v": 7, "ref": "Mark 14:61", "rel": "cross-reference", "text": {"es": "Mas él callaba, y nada respondía. El sumo sacerdote le volvió á preguntar, y le dice: ¿Eres tú el Cristo, el Hijo del Bendito?", "gr": "ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;", "lxx": "", "en": "But he held his peace, and answered nothing. Again the high priest asked him, and said unto him, Art thou the Christ, the Son of the Blessed?"}}, {"v": 7, "ref": "Mark 15:5", "rel": "cross-reference", "text": {"es": "Mas Jesús ni aun con eso respondió; de modo que Pilato se maravillaba.", "gr": "ὁ δὲ Ἰησοῦς οὐκέτι οὐδὲν ἀπεκρίθη, ὥστε θαυμάζειν τὸν Πιλᾶτον.", "lxx": "", "en": "But Jesus yet answered nothing; so that Pilate marvelled."}}, {"v": 7, "ref": "Matthew 26:63", "rel": "cross-reference", "text": {"es": "Mas Jesús callaba. Respondiendo el pontífice, le dijo: Te conjuro por el Dios viviente, que nos digas si eres tú el Cristo, Hijo de Dios.", "gr": "ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.", "lxx": "", "en": "But Jesus held his peace. And the high priest answered and said unto him, I adjure thee by the living God, that thou tell us whether thou be the Christ, the Son of God."}}, {"v": 8, "ref": "1 Peter 3:18", "rel": "cross-reference", "text": {"es": "Porque también Cristo padeció una vez por los injustos, para llevarnos á Dios, siendo á la verdad muerto en la carne, pero vivificado en espíritu;", "gr": "ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·", "lxx": "", "en": ""}}, {"v": 8, "ref": "Acts 8:33", "rel": "cross-reference", "text": {"es": "En su humillación su juicio fué quitado: Mas su generación, ¿quién la contará? Porque es quitada de la tierra su vida.", "gr": "ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.", "lxx": "", "en": "In his humiliation his judgment was taken away: and who shall declare his generation? for his life is taken from the earth."}}, {"v": 9, "ref": "1 John 3:5", "rel": "cross-reference", "text": {"es": "Y sabéis que él apareció para quitar nuestros pecados, y no hay pecado en él.", "gr": "καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.", "lxx": "", "en": ""}}, {"v": 9, "ref": "1 Peter 2:22", "rel": "cross-reference", "text": {"es": "El cual no hizo pecado; ni fué hallado engaño en su boca:", "gr": "ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·", "lxx": "", "en": ""}}, {"v": 9, "ref": "Matthew 27:57", "rel": "cross-reference", "text": {"es": "Y como fué la tarde del día, vino un hombre rico de Arimatea, llamado José, el cual también había sido discípulo de Jesús.", "gr": "Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·", "lxx": "", "en": "When the even was come, there came a rich man of Arimathea, named Joseph, who also himself was Jesus’ disciple:"}}, {"v": 9, "ref": "Matthew 27:60", "rel": "cross-reference", "text": {"es": "Y lo puso en su sepulcro nuevo, que había labrado en la peña: y revuelta una grande piedra á la puerta del sepulcro, se fué.", "gr": "καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.", "lxx": "", "en": "And laid it in his own new tomb, which he had hewn out in the rock: and he rolled a great stone to the door of the sepulchre, and departed."}}, {"v": 10, "ref": "2 Corinthians 5:21", "rel": "cross-reference", "text": {"es": "Al que no conoció pecado, hizo pecado por nosotros, para que nosotros fuésemos hechos justicia de Dios en él.", "gr": "⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.", "lxx": "", "en": ""}}, {"v": 10, "ref": "Galatians 3:13", "rel": "cross-reference", "text": {"es": "Cristo nos redimió de la maldición de la ley, hecho por nosotros maldición; (porque está escrito: Maldito cualquiera que es colgado en madero:)", "gr": "Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,", "lxx": "", "en": "Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed is every one that hangeth on a tree:"}}, {"v": 10, "ref": "Romans 8:32", "rel": "cross-reference", "text": {"es": "El que aun á su propio Hijo no perdonó, antes le entregó por todos nosotros, ¿cómo no nos dará también con él todas las cosas?", "gr": "ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;", "lxx": "", "en": "He that spared not his own Son, but delivered him up for us all, how shall he not with him also freely give us all things?"}}, {"v": 11, "ref": "Romans 5:18", " ": "indefinite pronoun, Dative, Singular, Feminine", "X-DSM": "indefinite pronoun, Dative, Singular, Masculine", "X-DSN": "indefinite pronoun, Dative, Singular, Neuter", "X-GPF": "indefinite pronoun, Genitive, Plural, Feminine", "X-GPM": "indefinite pronoun, Genitive, Plural, Masculine", "X-GPN": "indefinite pronoun, Genitive, Plural, Neuter", "X-GSF": "indefinite pronoun, Genitive, Singular, Feminine", "X-GSM": "indefinite pronoun, Genitive, Singular, Masculine", "X-GSN": "indefinite pronoun, Genitive, Singular, Neuter", "X-NPF": "indefinite pronoun, Nominative, Plural, Feminine", "X-NPM": "indefinite pronoun, Nominative, Plural, Masculine", "X-NPN": "indefinite pronoun, Nominative, Plural, Neuter", "X-NSF": "indefinite pronoun, Nominative, Singular, Feminine", "X-NSM": "indefinite pronoun, Nominative, Singular, Masculine", "X-NSN": "indefinite pronoun, Nominative, Singular, Neuter"}, "spanish": {"1": "¿Quién ha creído a nuestro anuncio? ¿y sobre quién se ha manifestado el brazo de Jehová?", "2": "Subirá cual renuevo delante de él, y como raíz de tierra seca; no hay parecer en él, ni hermosura; le veremos, mas sin atractivo para que le deseemos.", "3": "Despreciado y desechado entre los hombres, varón de dolores, experimentado en quebranto; y como que escondimos de él el rostro, fue menospreciado, y no lo estimamos.", "4": "Ciertamente llevó él nuestras enfermedades, y sufrió nuestros dolores; y nosotros le tuvimos por azotado, por herido de Dios y abatido.", "5": "Mas él herido fue por nuestras rebeliones, molido por nuestros pecados; el castigo de nuestra paz fue sobre él, y por su llaga fuimos nosotros curados.", "6": "Todos nosotros nos descarriamos como ovejas, cada cual se apartó por su camino; mas Jehová cargó en él el pecado de todos nosotros.", "7": "Angustiado él, y afligido, no abrió su boca; como cordero fue llevado al matadero; y como oveja delante de sus trasquiladores, enmudeció, y no abrió su boca.", "8": "Por cárcel y por juicio fue quitado; y su generación, ¿quién la contará? Porque fue cortado de la tierra de los vivientes, y por la rebelión de mi pueblo fue herido.", "9": "Y se dispuso con los impíos su sepultura, mas con los ricos fue en su muerte; aunque nunca hizo maldad, ni hubo engaño en su boca.", "10": "Con todo eso, Jehová quiso quebrantarlo, sujetándole a padecimiento. Cuando haya puesto su vida en expiación por el pecado, verá linaje, vivirá por largos días, y la voluntad de Jehová será en su mano prosperada.", "11": "Verá el fruto de la aflicción de su alma, y quedará satisfecho; por su conocimiento justificará mi siervo justo a muchos, y llevará las iniquidades de ellos.", "12": "Por tanto, yo le daré parte con los grandes, y con los fuertes repartirá despojos; por cuanto derramó su vida hasta la muerte, y fue contado con los pecadores, habiendo él llevado el pecado de muchos, y orado por los transgresores. El amor eterno de Jehová hacia Israel"}, "translations": {"RVR60": {"1": "¿Quién ha creído a nuestro anuncio? ¿y sobre quién se ha manifestado el brazo de Jehová?", "2": "Subirá cual renuevo delante de él, y como raíz de tierra seca; no hay parecer en él, ni hermosura; le veremos, mas sin atractivo para que le deseemos.", "3": "Despreciado y desechado entre los hombres, varón de dolores, experimentado en quebranto; y como que escondimos de él el rostro, fue menospreciado, y no lo estimamos.", "4": "Ciertamente llevó él nuestras enfermedades, y sufrió nuestros dolores; y nosotros le tuvimos por azotado, por herido de Dios y abatido.", "5": "Mas él herido fue por nuestras rebeliones, molido por nuestros pecados; el castigo de nuestra paz fue sobre él, y por su llaga fuimos nosotros curados.", "6": "Todos nosotros nos descarriamos como ovejas, cada cual se apartó por su camino; mas Jehová cargó en él el pecado de todos nosotros.", "7": "Angustiado él, y afligido, no abrió su boca; como cordero fue llevado al matadero; y como oveja delante de sus trasquiladores, enmudeció, y no abrió su boca.", "8": "Por cárcel y por juicio fue quitado; y su generación, ¿quién la contará? Porque fue cortado de la tierra de los vivientes, y por la rebelión de mi pueblo fue herido.", "9": "Y se dispuso con los impíos su sepultura, mas con los ricos fue en su muerte; aunque nunca hizo maldad, ni hubo engaño en su boca.", "10": "Con todo eso, Jehová quiso quebrantarlo, sujetándole a padecimiento. Cuando haya puesto su vida en expiación por el pecado, verá linaje, vivirá por largos días, y la voluntad de Jehová será en su mano prosperada.", "11": "Verá el fruto de la aflicción de su alma, y quedará satisfecho; por su conocimiento justificará mi siervo justo a muchos, y llevará las iniquidades de ellos.", "12": "Por tanto, yo le daré parte con los grandes, y con los fuertes repartirá despojos; por cuanto derramó su vida hasta la muerte, y fue contado con los pecadores, habiendo él llevado el pecado de muchos, y orado por los transgresores. El amor eterno de Jehová hacia Israel"}, "RVR1909": {"1": "¿QUIÉN ha creído á nuestro anuncio? ¿y sobre quién se ha manifestado el brazo de Jehová?", "2": "Y subirá cual renuevo delante de él, y como raíz de tierra seca: no hay parecer en él, ni hermosura: verlo hemos, mas sin atractivo para que le deseemos.", "3": "Despreciado y desechado entre los hombres, varón de dolores, experimentado en quebranto: y como que escondimos de él el rostro, fué menospreciado, y no lo estimamos.", "4": "Ciertamente llevó él nuestras enfermedades, y sufrió nuestros dolores; y nosotros le tuvimos por azotado, por herido de Dios y abatido.", "5": "Mas él herido fué por nuestras rebeliones, molido por nuestros pecados: el castigo de nuestra paz sobre él; y por su llaga fuimos nosotros curados.", "6": "Todos nosotros nos descarriamos como ovejas, cada cual se apartó por su camino: mas Jehová cargó en él el pecado de todos nosotros.", "7": "Angustiado él, y afligido, no abrió su boca: como cordero fué llevado al matadero; y como oveja delante de sus trasquiladores, enmudeció, y no abrió su boca.", "8": "De la cárcel y del juicio fué quitado; y su generación ¿quién la contará? Porque cortado fué de la tierra de los vivientes; por la rebelión de mi pueblo fué herido.", "9": "Y dipúsose con los impíos su sepultura, mas con los ricos fué en su muerte; porque nunca hizo él maldad, ni hubo engaño en su boca.", "10": "Con todo eso Jehová quiso quebrantarlo, sujetándole á padecimiento. Cuando hubiere puesto su vida en expiación por el pecado, verá linaje, vivirá por largos días, y la voluntad de Jehová será en su mano prosperada.", "11": "Del trabajo de su alma verá y será saciado; con su conocimiento justificará mi siervo justo á muchos, y él llevará las iniquidades de ellos.", "12": "Por tanto yo le daré parte con los grandes, y con los fuertes repartirá despojos; por cuanto derramó su vida hasta la muerte, y fué contado con los perversos, habiendo él llevado el pecado de muchos y orado por los transgresores."}, "KJV": {"1": "Who hath believed our report? and to whom is the arm of the Lord revealed?", "2": "For he shall grow up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, there is no beauty that we should desire him.", "3": "He is despised and rejected of men; a man of sorrows, and acquainted with grief: and we hid as it were our faces from him; he was despised, and we esteemed him not.", "4": "Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted.", "5": "But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.", "6": "All we like sheep have gone astray; we have turned every one to his own way; and the Lord hath laid on him the iniquity of us all.", "7": "He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth.", "8": "He was taken from prison and from judgment: and who shall declare his generation? for he was cut off out of the land of the living: for the transgression of my people was he stricken.", "9": "And he made his grave with the wicked, and with the rich in his death; because he had done no violence, neither was any deceit in his mouth.", "10": "Yet it pleased the Lord to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the Lord shall prosper in his hand.", "11": "He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities.", "12": "Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors. "}, "ASV": {"1": "Who hath believed our message? and to whom hath the arm of Jehovah been revealed? ", "2": "For he grew up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we see him, there is no beauty that we should desire him. ", "3": "He was despised, and rejected of men; a man of sorrows, and acquainted with grief: and as one from whom men hide their face he was despised; and we esteemed him not. ", "4": "Surely he hath borne our griefs, and carried our sorrows; yet we did esteem him stricken, smitten of God, and afflicted. ", "5": "But he was wounded for our transgressions, he was bruised for our iniquities; the chastisement of our peace was upon him; and with his stripes we are healed. ", "6": "All we like sheep have gone astray; we have turned every one to his own way; and Jehovah hath laid on him the iniquity of us all. ", "7": "He was oppressed, yet when he was afflicted he opened not his mouth; as a lamb that is led to the slaughter, and as a sheep that before its shearers is dumb, so he opened not his mouth. ", "8": "By oppression and judgment he was taken away; and as for his generation, who among them considered that he was cut off out of the land of the living for the transgression of my people to whom the stroke was due? ", "9": "And they made his grave with the wicked, and with a rich man in his death; although he had done no violence, neither was any deceit in his mouth. ", "10": "Yet it pleased Jehovah to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of Jehovah shall prosper in his hand. ", "11": "He shall see of the travail of his soul, and shall be satisfied: by the knowledge of himself shall my righteous servant justify many; and he shall bear their iniquities. ", "12": "Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he poured out his soul unto death, and was numbered with the transgressors: yet he bare the sin of many, and made intercession for the transgressors.  "}, "BSB": {"1": "  Who has believed our message? And to whom has the arm of the LORD been revealed? ", "2": "He grew up before Him like a tender shoot, and like a root out of dry ground. He had no stately form or majesty to attract us, no beauty that we should desire Him. ", "3": "He was despised and rejected by men, a man of sorrows, acquainted with grief. Like one from whom men hide their faces, He was despised, and we esteemed Him not.   ", "4": "Surely He took on our infirmities and carried our sorrows; yet we considered Him stricken by God, struck down and afflicted. ", "5": "But He was pierced for our transgressions, He was crushed for our iniquities; the punishment that brought us peace was upon Him, and by His stripes we are healed. ", "6": "We all like sheep have gone astray, each one has turned to his own way; and the LORD has laid upon Him the iniquity of us all.   ", "7": "He was oppressed and afflicted, yet He did not open His mouth. He was led like a lamb to the slaughter, and as a sheep before her shearers is silent, so He did not open His mouth. ", "8": "By oppression and judgment He was taken away, and who can recount His descendants? For He was cut off from the land of the living; He was stricken for the transgression of My people.     ", "9": "He was assigned a grave with the wicked, and with a rich man in His death, although He had done no violence, nor was any deceit in His mouth.   ", "10": "Yet it was the LORD’s will to crush Him and to cause Him to suffer; and when His soul is made a guilt offering, He will see His offspring, He will prolong His days, and the good pleasure of the LORD will prosper in His hand. ", "11": "After the anguish of His soul, He will see the light of life and be satisfied. By His knowledge My righteous Servant will justify many, and He will bear their iniquities. ", "12": "Therefore I will allot Him a portion with the great, and He will divide the spoils with the strong, because He has poured out His life unto death, and He was numbered with the transgressors. Yet He bore the sin of many and made intercession for the transgressors.   "}, "Darby": {"1": "Who hath believed our report? and to whom hath the arm of Jehovah been revealed? ", "2": "For he shall grow up before him as a tender sapling, and as a root out of dry ground: he hath no form nor lordliness, and when we see him, there is no beauty that we should desire him. ", "3": "He is despised and left alone of men; a man of sorrows, and acquainted with grief, and like one from whom [men] hide their faces; — despised, and we esteemed him not. ", "4": "Surely he hath borne our griefs and carried our sorrows; and we, we did regard him stricken, smitten ofGod, and afflicted. ", "5": "But he was wounded for our transgressions, he was bruised for our iniquities; the chastisement of our peace was upon him, and with his stripes we are healed. ", "6": "All we like sheep have gone astray, we have turned every one to his own way; and Jehovah hath laid upon him the iniquity of us all. ", "7": "He was oppressed, and he was afflicted, but he opened not his mouth; he was led as a lamb to the slaughter, and was as a sheep dumb before her shearers, and he opened not his mouth. ", "8": "He was taken from oppression and from judgment; and who shall declare his generation? for he was cut off out of the land of the living; for the transgression of my people was he stricken. ", "9": "And [men] appointed his grave with the wicked, but he was with the rich in his death, because he had done no violence, neither was there guile in his mouth. ", "10": "Yet it pleased Jehovah to bruise him; he hath subjected [him] to suffering. When thou shalt make his soul an offering for sin, he shall see a seed, he shall prolong [his] days, and the pleasure of Jehovah shall prosper in his hand. ", "11": "He shall see of [the fruit of] the travail of his soul, [and] shall be satisfied: by his knowledge shall my righteous servant instruct many in righteousness; and he shall bear their iniquities. ", "12": "Therefore will I assign him a portion with the great, and he shall divide the spoil with the strong: because he hath poured out his soul unto death, and was reckoned with the transgressors; and he bore the sin of many, and made intercession for the transgressors.   "}, "LITV": {"1": "Who has believed our report? And to whom is the arm of Jehovah revealed? ", "2": "For He comes up before Him as a tender plant, and as a root out of dry ground. He has no form nor magnificence that we should see Him; nor form that we should desire Him. ", "3": " He is despised and abandoned of men, a Man of pains, and acquainted with sickness. And as it were hiding our faces from Him, He being despised, and we did not value Him.   ", "4": "Surely He has borne our sicknesses, and He carried our pain; yet we esteemed Him plagued, smitten by God, and afflicted. ", "5": "But He was wounded for our transgressions; He was bruised for our iniquities; the chastisement of our peace was upon Him; and with His wounds we ourselves are healed. ", "6": "All we like sheep have gone astray; we have each one turned to his own way; and Jehovah made meet in Him the iniquity of all of us. ", "7": "He was oppressed, and He was afflicted, but He did not open His mouth. He was led as a lamb to the slaughter; and as a ewe before her shearers is dumb, so He opened not His mouth. ", "8": "He was taken from prison and from justice; and who shall consider His generation? For He was cut off out of the land of the living; from the transgression of My people, the stroke was to Him. ", "9": "And He put His grave with the wicked; and with a rich man in His death; although He had done no violence, and deceit was not in His mouth.   ", "10": "But Jehovah pleased to crush Him, to make Him sick, so that If He should put His soul as a guilt offering, He shall see His seed; He shall prolong His days; and the will of Jehovah shall prosper in His hand. ", "11": "He shall see the fruit of the travail of His soul; He shall be fully satisfied. By His knowledge shall My righteous Servant justify for many, and He shall bear their iniquities. ", "12": "Because of this I will divide to Him with the great, and with the strong He shall divide the spoil; because He poured out His soul to death; and He was counted with transgressors; and He bore the sin of many, and made intercession for transgressors.  "}, "YLT": {"1": "Who hath given credence to that which we heard? And the arm of Jehovah, On whom hath it been revealed?", "2": "Yea, he cometh up as a tender plant before Him, And as a root out of a dry land, He hath no form, nor honour, when we observe him, Nor appearance, when we desire him.", "3": "He is despised, and left of men, A man of pains, and acquainted with sickness, And as one hiding the face from us, He is despised, and we esteemed him not.", "4": "Surely our sicknesses he hath borne, And our pains--he hath carried them, And we--we have esteemed him plagued, Smitten of God, and afflicted.", "5": "And he is pierced for our transgressions, Bruised for our iniquities, The chastisement of our peace <FI>is<Fi> on him, And by his bruise there is healing to us.", "6": "All of us like sheep have wandered, Each to his own way we have turned, And Jehovah hath caused to meet on him, The punishment of us all.", "7": "It hath been exacted, and he hath answered, And he openeth not his mouth, As a lamb to the slaughter he is brought, And as a sheep before its shearers is dumb, And he openeth not his mouth.", "8": "By restraint and by judgment he hath been taken, And of his generation who doth meditate, That he hath been cut off from the land of the living? By the transgression of My people he is plagued,", "9": "And it appointeth with the wicked his grave, And with the rich <FI>are<Fi> his high places, Because he hath done no violence, Nor <FI>is<Fi> deceit in his mouth.", "10": "And Jehovah hath delighted to bruise him, He hath made him sick, If his soul doth make an offering for guilt, He seeth seed--he prolongeth days, And the pleasure of Jehovah in his hand doth prosper.", "11": "Of the labour of his soul he seeth--he is satisfied, Through his knowledge give righteousness Doth the righteous one, My servant, to many, And their iniquities he doth bear.", "12": "Therefore I give a portion to him among the many, And with the mighty he apportioneth spoil, Because that he exposed to death his soul, And with transgressors he was numbered, And he the sin of many hath borne, And for transgressors he intercedeth."}, "Vulgate": {"1": "quis credidit auditui nostro et brachium Domini cui revelatum est", "2": "et ascendet sicut virgultum coram eo et sicut radix de terra sitienti non est species ei neque decor et vidimus eum et non erat aspectus et desideravimus eum", "3": "despectum et novissimum virorum virum dolorum et scientem infirmitatem et quasi absconditus vultus eius et despectus unde nec reputavimus eum", "4": "vere languores nostros ipse tulit et dolores nostros ipse portavit et nos putavimus eum quasi leprosum et percussum a Deo et humiliatum", "5": "ipse autem vulneratus est propter iniquitates nostras adtritus est propter scelera nostra disciplina pacis nostrae super eum et livore eius sanati sumus", "6": "omnes nos quasi oves erravimus unusquisque in viam suam declinavit et Dominus posuit in eo iniquitatem omnium nostrum", "7": "oblatus est quia ipse voluit et non aperuit os suum sicut ovis ad occisionem ducetur et quasi agnus coram tondente obmutescet et non aperiet os suum", "8": "de angustia et de iudicio sublatus est generationem eius quis enarrabit quia abscisus est de terra viventium propter scelus populi mei percussit eum", "9": "et dabit impios pro sepultura et divitem pro morte sua eo quod iniquitatem non fecerit neque dolus fuerit in ore eius", "10": "et Dominus voluit conterere eum in infirmitate si posuerit pro peccato animam suam videbit semen longevum et voluntas Domini in manu eius dirigetur", "11": "pro eo quod laboravit anima eius videbit et saturabitur in scientia sua iustificabit ipse iustus servus meus multos et iniquitates eorum ipse portabit", "12": "ideo dispertiam ei plurimos et fortium dividet spolia pro eo quod tradidit in morte animam suam et cum sceleratis reputatus est et ipse peccatum multorum tulit et pro transgressoribus rogavit"}}, "lxx_morphology": {"1": [{"w": "κύριε", "l": "κύριος", "m": "N.VSM", "g": "lord;; master", "s": "G2962", "d": "", "es": ""}, {"w": "τίς", "l": "τίς", "m": "RI.NSM", "g": "who?;; what?", "s": "G5101", "d": "", "es": ""}, {"w": "ἐπίστευσεν", "l": "πιστεύω", "m": "V.AAI3S", "g": "believe;; entrust", "s": "G4100", "d": "", "es": ""}, {"w": "τῇ", "l": "ὁ", "m": "RA.DSF", "g": "the", "s": "G3588", "d": "", "es": ""}, {"w": "ἀκοῇ", "l
